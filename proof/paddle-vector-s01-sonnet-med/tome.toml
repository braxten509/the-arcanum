# Paddle Vector course manifest.

[meta]
id = "paddle-vector"
name = "Paddle Vector"
description = "Build a complete two-player SDL2 Pong game from an empty folder in six chapters of NASM x86-64 assembly."
author = "Arcanum"
version = "0.1.0"
favicon = "PV"

[runtime]
name = "nasm-paddle-vector"
project = "PaddleVector"
language = "NASM x86-64 Assembly on Linux"
entryFile = "src/pong.asm"
projectFile = "Makefile"
starterCode = ""
scaffoldCommand = []
packages = false
externalWorkspace = true
validationDependencies = []

[content]
sections = ["s01", "s02", "s03", "s04", "s05", "s06"]
capabilityLedger = true
proofVersion = 1

[mastery]
evidenceVersion = 1
sourceEvidenceVersion = 1
level = 1

[acceptance]
version = 1
mode = "run"
artifact = "runtime"
runArgs = ["--arcanum-acceptance"]
scenarios = [
  "external-toolchain-ready",
  "native-window-opens",
  "court-renders",
  "paddles-and-clock-respond",
  "ball-collides",
  "score-serve-win-restart",
  "pause-resume-clean-quit",
  "clean-rebuild-relaunch",
]
controls = ["input", "clock", "seed", "frame-limit"]

[defaults]
theme = "signature"                # a [[themes]] id below (this tome's own default look)

[defaults.ai]
oracle = "llama3.1:8b"
grader = "qwen2.5:14b"
graderKind = "claude-cli"
graderModel = "claude-opus-4-8"

[economy]
# TODO: rebalance once your exercise/freestyle points are set (see § [economy]).
ranks = [[0, "NOVICE"], [400, "ADEPT"], [1000, "MASTER"]]
hintCost = 50
oracleCost = 10
attemptMultipliers = [1, 0.6, 0.3]
comboStep = 0.05
comboCap = 0.5
sRankMultiplier = 1.5
attackStakePerDiff = 20
attackWinPerDiff = 15

[narrative]
objective = "Build Paddle Vector from an empty folder: a native two-player Pong game written in NASM x86-64 assembly, linked with SDL2, verified with deterministic checks, and delivered as a reproducible source workspace."
completeText = "PADDLE VECTOR CLEARED // You built, proved, and delivered a native assembly match from an empty workspace."
title = "ARCANUM // PADDLE VECTOR"
logo = "PV"
opsLabel = "ROUNDS"
graderPersona = "Mara"
studentTerm = "operator"
currency = "cycle"
currencyShort = "cy"
gradeScale = "S|A|B|C|D|F"
bootLines = [
  "MIDNIGHT WORKBENCH ONLINE. THE COURT IS DARK.",
  "PADDLE VECTOR HAS {N} ROUNDS BETWEEN EMPTY FOLDER AND CLEAN EXIT.",
  "MARA ON COMMS: WE WILL MAKE EVERY REGISTER, BRANCH, AND RESOURCE VISIBLE.",
  "NO STARTER GAME IS LOADED. YOU OWN THE SOURCE, BUILD, CHECKS, AND NOTES.",
  "FIRST SIGNAL: VERIFY THE REAL NASM, GCC, MAKE, GDB, AND SDL2 TOOLCHAIN.",
  "SECOND SIGNAL: BUILD ONE OBSERVABLE MACHINE-STATE CHANGE AT A TIME.",
  "FINAL SIGNAL: PAUSE, PROVE, REBUILD, RELAUNCH, AND DELIVER THE WORKSPACE.",
  "COURT CLOCK ARMED. OPERATOR, BEGIN ROUND ONE.",
]
gradingLines = [
  "Mara traces the changed state before judging the frame.",
  "Register promises are being checked against the call boundary.",
  "Branches are being followed through both the success and failure paths.",
  "The court probe is comparing commands with observable output.",
  "Cleanup ownership is being counted exactly once.",
  "Deterministic checks are being matched to the milestone claim.",
]

