[[lessons.exercises]]
id = "s01-l02-e3"
type = "fill"
required = true
capabilities = ["language-data-layout-and-integer-state"]
mechanisms = ["nasm-source-layout"]
cognitiveTask = "complete"
scaffold = "completion"
contextFamily = "nasm-layout"
aidPolicy = "learning"
points = 20
prompt = "Complete the directive that exports the label 'lantern_ready' so another object file can reference it."
code = '''____  lantern_ready
lantern_ready:'''
answer = "global"
hint = "It is the directive that makes a label visible outside this file — its mirror image is EXTERN, for labels defined elsewhere."

[[lessons.exercises]]
id = "s01-l02-e4"
type = "fill"
required = true
capabilities = ["language-data-layout-and-integer-state"]
