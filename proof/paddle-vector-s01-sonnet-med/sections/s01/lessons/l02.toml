points = 20
prompt = "This Makefile rule reads log.txt and, via cat's redirection, writes its recipe's output to a new file. Fill in the missing target name on the rule line so it matches exactly what the recipe line actually produces."
code = '''____: log.txt
	cat log.txt > summary.txt'''
answer = "summary.txt"
hint = "The target is what the rule produces — the file named on the left of the colon, matching what the recipe's output redirects into."

