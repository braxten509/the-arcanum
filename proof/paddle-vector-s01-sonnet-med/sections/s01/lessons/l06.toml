[[lessons.exercises]]
id = "s01-l06-w1"
type = "write"
required = true
capabilities = ["language-observable-debugging-and-verification"]
mechanisms = ["nasm-elf64-dwarf-object-build", "gcc-sdl2-link-and-make-targets"]
cognitiveTask = "build"
scaffold = "guided"
contextFamily = "build-pipeline-execution"
aidPolicy = "learning"
points = 30
prompt = "Write a complete NASM program, assembled with 'nasm -f elf64 -g -F dwarf' and linked with 'gcc -no-pie', that declares two null-terminated strings 'go_msg: db \"BUILD OK\", 0' and 'halt_msg: db \"BUILD MISMATCH\", 0', extern's puts, defines global main, computes a two-argument add (reusing lesson 5's calling-convention shape) of 18 and 24, compares the sum to 42, prints go_msg via puts if they match and halt_msg otherwise, then returns 0 from main. The program must print exactly: BUILD OK"
starter = '''
section .data
; declare go_msg and halt_msg here, exactly as the prompt specifies

section .text
    global main
    extern puts

; write a procedure that adds two integers per the System V calling
; convention, call it from main with 18 and 24, compare the result to 42,
; and puts() the matching message. Remember main must realign rsp before
; any nested call, and restore it before returning.
main:
    ret
'''
expect = '''
BUILD OK'''
solution = '''
section .data
go_msg:   db "BUILD OK", 0
halt_msg: db "BUILD MISMATCH", 0

section .text
    global main
    extern puts

add_two:
    mov rax, rdi
    add rax, rsi
    ret

main:
    sub rsp, 8
    mov rdi, 18
    mov rsi, 24
    call add_two
    cmp rax, 42
    jne .mismatch
    mov rdi, go_msg
    call puts
    jmp .done
.mismatch:
    mov rdi, halt_msg
    call puts
.done:
    add rsp, 8
    mov eax, 0
    ret
'''
hint = "18 + 24 is 42, so the correct build always takes the go_msg path — if BUILD MISMATCH prints instead, the add or the compare has a bug, not the build commands."
