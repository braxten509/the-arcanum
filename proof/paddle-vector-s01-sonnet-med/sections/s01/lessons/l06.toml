prompt = "In your own workspace, run 'nasm -f elf64 -g -F dwarf src/pong.asm -o src/pong.o' (your empty pong.asm from lesson 2 is fine) followed by 'gcc src/pong.o -o pong' — deliberately WITHOUT -no-pie. Paste the exact error gcc/ld prints, and explain in your own words why adding -no-pie resolves it."
answer = "A complete answer pastes a linker error naming a relocation problem tied to PIE (e.g. 'relocation R_X86_64_... can not be used when making a PIE object; recompile with -fPIE'), and explains that gcc defaults to building a position-independent executable, but the NASM-produced object uses relocations that assume a fixed, non-PIE address layout, so -no-pie tells gcc to build the kind of executable that object file is actually compatible with."
hint = "The error names 'PIE' directly — gcc's default output type expects a different kind of relocation than the one NASM's object file contains."

