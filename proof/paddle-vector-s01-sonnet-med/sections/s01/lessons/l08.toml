id = "s01-l08-e5"
type = "text"
required = true
capabilities = ["language-observable-debugging-and-verification"]
mechanisms = ["deterministic-init-check"]
cognitiveTask = "explain"
scaffold = "guided"
contextFamily = "headless-deterministic-check"
aidPolicy = "learning"
points = 20
prompt = "A CI machine has no monitor attached at all. Explain what 'SDL_VIDEODRIVER=dummy ./build/pong' does differently from plain './build/pong' on that machine, why SDL_Init and SDL_CreateWindow can still both succeed there, and why the SDL_VIDEODRIVER assignment only affects this one invocation rather than every later command in the same shell session."
answer = "A complete answer explains that prefixing VAR=value directly onto a command sets that environment variable for only that single process's run, reverting afterward; that SDL_VIDEODRIVER=dummy selects SDL's built-in headless backend instead of a real display driver; and that this dummy backend still accepts SDL_Init(SDL_INIT_VIDEO) and SDL_CreateWindow as a real display would (returning success and a valid window pointer) without ever opening anything visible, which is exactly why the check can run unattended on a monitor-less machine."
hint = "Separate the two questions: what does the VAR=value prefix scope to, and what does the dummy driver actually let SDL pretend to do."

