aidPolicy = "learning"
points = 20
prompt = "A teammate moves the 'WINDOW OK' print to right after the call to SDL_CreateWindow, before the cmp/je failure check that follows it, reasoning that it saves a few lines. Explain exactly what false result this produces when SDL_CreateWindow actually fails, and why the ordering (not just the presence of the print) is what makes this a valid proof."
answer = "A complete answer explains that printing WINDOW OK before the NULL check means the confirmation line appears even when SDL_CreateWindow returned NULL and no window was actually created — a false positive an automated checker would treat as genuine success, and that a deterministic proof is only valid when it is provably placed strictly after the condition it claims to confirm, not merely present somewhere in the success-shaped code."
hint = "Ask what the program actually prints in the specific case where SDL_CreateWindow fails, given the print now runs unconditionally right after the call."

