[[lessons.exercises]]
id = "s01-l08-w1"
type = "write"
required = true
capabilities = ["language-observable-debugging-and-verification"]
mechanisms = ["deterministic-init-check"]
cognitiveTask = "build"
scaffold = "guided"
contextFamily = "deterministic-proof-execution"
aidPolicy = "learning"
points = 30
prompt = "Write a complete NASM program (extern SDL_Init, SDL_CreateWindow, SDL_DestroyWindow, SDL_Quit, puts; global main) that initializes SDL_INIT_VIDEO, creates a 200x150 window titled \"PROOF LAB\" at position (0,0), destroys it, quits SDL, and — only after every one of those steps has actually succeeded — prints exactly: PROOF CONFIRMED. On any failure, print SDL_GetError()'s message instead and return a nonzero status, following lesson 7's two-failure-path pattern."
starter = '''
section .data
win_title:  db "PROOF LAB", 0
; declare proof_msg here, exactly as the prompt specifies

SDL_INIT_VIDEO equ 0x00000020

section .text
    global main
    extern SDL_Init
    extern SDL_CreateWindow
    extern SDL_GetError
    extern SDL_DestroyWindow
    extern SDL_Quit
    extern puts

; implement init -> create-window (200x150, "PROOF LAB") ->
; destroy -> quit -> print PROOF CONFIRMED, only on the full success path.
main:
    ret
'''
expect = '''
PROOF CONFIRMED'''
solution = '''
section .data
win_title:  db "PROOF LAB", 0
proof_msg:  db "PROOF CONFIRMED", 0

SDL_INIT_VIDEO equ 0x00000020

section .text
    global main
    extern SDL_Init
    extern SDL_CreateWindow
    extern SDL_GetError
    extern SDL_DestroyWindow
    extern SDL_Quit
    extern puts

main:
    sub rsp, 8

    mov rdi, SDL_INIT_VIDEO
    call SDL_Init
    cmp eax, 0
    jne .init_failed

    mov rdi, win_title
    mov rsi, 0
    mov rdx, 0
    mov rcx, 200
    mov r8, 150
    mov r9, 0
    call SDL_CreateWindow
    cmp rax, 0
    je .window_failed

    mov rdi, rax
    call SDL_DestroyWindow
    call SDL_Quit
    mov rdi, proof_msg
    call puts
    add rsp, 8
    mov eax, 0
    ret

.window_failed:
    call SDL_GetError
    mov rdi, rax
    call puts
    call SDL_Quit
    add rsp, 8
    mov eax, 1
    ret

.init_failed:
    call SDL_GetError
    mov rdi, rax
    call puts
    add rsp, 8
    mov eax, 1
    ret
'''
hint = "This is lesson 7's exact structure again; only the title, dimensions, and the final confirmation text change."
