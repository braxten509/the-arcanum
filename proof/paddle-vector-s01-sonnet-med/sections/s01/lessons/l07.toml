aidPolicy = "learning"
points = 15
prompt = "SDL_Init(SDL_INIT_VIDEO) returns -1 on a particular machine because no display driver is available. Given 'cmp eax, 0' followed by 'jne .init_failed', what happens next?"
choices = ["The program crashes immediately at the cmp instruction", "Execution falls through to SDL_CreateWindow, since -1 is still a valid-looking value", ".init_failed runs, since eax (-1) is not equal to 0", "jne is ignored because eax holds a negative number, not zero"]
answer = 2
whyWrong = "The wrong choices either ignore what jne actually tests (any nonzero flag result, not just positive numbers), invent a crash cmp cannot cause, or invent a special case for negative numbers that jne does not have."
hint = "jne fires whenever the compared values are not equal — -1 is not equal to 0, regardless of sign."
explain = "cmp eax, 0 sets the zero flag only when eax is exactly 0. Since eax is -1, the zero flag is clear, and jne (jump if not equal / zero flag clear) takes the branch to .init_failed."

