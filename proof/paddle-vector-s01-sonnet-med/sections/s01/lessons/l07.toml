[[lessons.exercises]]
id = "s01-l07-w1"
type = "write"
required = true
capabilities = ["language-status-failure-and-resource-cleanup"]
mechanisms = ["sdl-init-status-observation", "sdl-init-failure-branch", "sdl-init-error-diagnostic", "sdl-init-failure-cleanup", "sdl-window-status-observation", "sdl-window-failure-branch", "sdl-window-error-diagnostic", "sdl-window-failure-cleanup", "sdl-window-normal-cleanup"]
cognitiveTask = "build"
scaffold = "guided"
contextFamily = "sdl-full-lifecycle"
aidPolicy = "learning"
points = 30
prompt = "Write a complete NASM program (extern SDL_Init, SDL_CreateWindow, SDL_GetError, SDL_DestroyWindow, SDL_Quit, SDL_Log, puts; global main) that initializes SDL_INIT_VIDEO (0x00000020), creates a window titled \"SIGNAL LAB TWO\" at position (0,0) sized 320x240 with no flags, and on success destroys the window, quits SDL, then prints exactly: WINDOW OK TWO. Follow this lesson's two-failure-path pattern exactly: no SDL_Quit if SDL_Init itself fails, SDL_Quit before returning if window creation fails, SDL_DestroyWindow before SDL_Quit on the success path, and report each failure's SDL_GetError() reason via SDL_Log(\"%s\", ...) with al zeroed before the call, exactly as this lesson's worked example does."
starter = '''
default rel
section .data
win_title:  db "SIGNAL LAB TWO", 0
; declare win_ok_msg and err_fmt here, exactly as the prompt specifies

SDL_INIT_VIDEO equ 0x00000020

section .text
    global main
    extern SDL_Init
    extern SDL_CreateWindow
    extern SDL_GetError
    extern SDL_DestroyWindow
    extern SDL_Quit
    extern SDL_Log
    extern puts

; implement the full init -> create-window -> success/failure
; lifecycle from this lesson, using win_title and win_ok_msg above.
main:
    ret
'''
expect = "WINDOW OK TWO\n"
solution = '''
default rel
section .data
win_title:  db "SIGNAL LAB TWO", 0
win_ok_msg: db "WINDOW OK TWO", 0
err_fmt:    db "%s", 0

SDL_INIT_VIDEO equ 0x00000020

section .text
    global main
    extern SDL_Init
    extern SDL_CreateWindow
    extern SDL_GetError
    extern SDL_DestroyWindow
    extern SDL_Quit
    extern SDL_Log
    extern puts

main:
    sub rsp, 8

    mov rdi, SDL_INIT_VIDEO
    call SDL_Init
    cmp eax, 0
    jne .init_failed

    mov rdi, win_title
    mov rsi, 0
    mov rdx, 0
    mov rcx, 320
    mov r8, 240
    mov r9, 0
    call SDL_CreateWindow
    cmp rax, 0
    je .window_failed

    mov rdi, rax
    call SDL_DestroyWindow
    call SDL_Quit
    mov rdi, win_ok_msg
    call puts
    add rsp, 8
    mov eax, 0
    ret

.window_failed:
    call SDL_GetError
    mov rsi, rax
    lea rdi, [err_fmt]
    xor eax, eax
    call SDL_Log
    call SDL_Quit
    add rsp, 8
    mov eax, 1
    ret

.init_failed:
    call SDL_GetError
    mov rsi, rax
    lea rdi, [err_fmt]
    xor eax, eax
    call SDL_Log
    add rsp, 8
    mov eax, 1
    ret
'''
hint = "Reuse this lesson's exact structure; only the title, dimensions, and success message text differ from the worked example."
