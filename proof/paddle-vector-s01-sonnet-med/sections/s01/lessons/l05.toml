[[lessons.exercises]]
id = "s01-l05-e1"
type = "mc"
required = true
capabilities = ["language-abi-procedures-and-register-discipline"]
mechanisms = ["sysv-abi-procedure-discipline"]
cognitiveTask = "predict"
scaffold = "guided"
contextFamily = "abi-register-trace"
aidPolicy = "learning"
points = 15
prompt = "A procedure 'double_first' is defined as 'mov rax, rdi / add rax, rax / ret' (rax = rdi * 2). Before calling it, a caller sets rdi = 6 and rsi = 100. What ends up in rax after 'call double_first'?"
choices = ["12", "100", "6", "200"]
answer = 0
whyWrong = "100 mistakes rsi for the value the procedure actually reads; 6 forgets the doubling runs at all; 200 doubles rsi's value instead of rdi's."
hint = "The procedure only ever reads rdi (the first argument register) — rsi is irrelevant here since this procedure never touches it."
explain = "rdi = 6 is copied into rax, then doubled once by 'add rax, rax', giving 12. rsi's value of 100 is never read by this procedure at all."

[[lessons.exercises]]
id = "s01-l05-e2"
type = "text"
required = true
capabilities = ["language-abi-procedures-and-register-discipline"]
mechanisms = ["sysv-abi-procedure-discipline"]
cognitiveTask = "debug"
scaffold = "guided"
contextFamily = "abi-alignment-failure"
aidPolicy = "learning"
points = 20
prompt = "A teammate's program pushes one extra value onto the stack with 'push rax' right before 'call some_library_function' and never pops it back, throwing off the expected 16-byte alignment. Explain what kind of failure this can cause when the call executes, and why the assembler and linker have no way to catch it beforehand."
answer = "A complete answer explains that the stray push shifts rsp so it is no longer a multiple of 16 at the call instruction, and that the called function may internally use instructions requiring 16-byte-aligned memory access (commonly for floating-point/SSE setup) that fault when the alignment is wrong — producing a crash with no assembly-time warning, since NASM has no concept of the ABI's alignment rule and cannot track rsp's runtime value across a whole program."
hint = "Alignment is a runtime property of rsp's actual value, not something visible in the source text — nothing in the assembly file itself records how many pushes happened before this point."

