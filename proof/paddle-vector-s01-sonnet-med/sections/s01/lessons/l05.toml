[[lessons.exercises]]
id = "s01-l05-w1"
type = "write"
required = true
capabilities = ["language-abi-procedures-and-register-discipline"]
mechanisms = ["sysv-abi-procedure-discipline"]
cognitiveTask = "build"
scaffold = "guided"
contextFamily = "abi-call-execution"
aidPolicy = "learning"
points = 30
prompt = "Write a complete NASM program that declares two null-terminated strings 'ok_msg: db \"SIGNAL CONFIRMED\", 0' and 'bad_msg: db \"SIGNAL LOST\", 0', extern's puts, defines global main, and a procedure 'combine_signals' that follows the System V calling convention (first argument in rdi, second in rsi, sum returned in rax). From main, realign the stack, call combine_signals(15, 27), compare the result to 42, call puts with ok_msg if it matches (bad_msg otherwise), restore the stack, and return 0. The program must print exactly: SIGNAL CONFIRMED"
starter = '''
section .data
; declare ok_msg and bad_msg here, exactly as the prompt specifies

section .text
    global main
    extern puts

; write combine_signals(rdi, rsi) -> rax here, call it from main with
; 15 and 27, compare to 42, and puts() the matching message. main is
; entered 8 bytes off 16-byte alignment, like any called function --
; realign rsp before your own nested calls and restore it before ret.
main:
    ret
'''
expect = '''
SIGNAL CONFIRMED'''
solution = '''
section .data
ok_msg:  db "SIGNAL CONFIRMED", 0
bad_msg: db "SIGNAL LOST", 0

section .text
    global main
    extern puts

combine_signals:
    mov rax, rdi
    add rax, rsi
    ret

main:
    sub rsp, 8
    mov rdi, 15
    mov rsi, 27
    call combine_signals
    cmp rax, 42
    jne .mismatch
    mov rdi, ok_msg
    call puts
    jmp .done
.mismatch:
    mov rdi, bad_msg
    call puts
.done:
    add rsp, 8
    mov eax, 0
    ret
'''
hint = "15 + 27 is 42, so a correct combine_signals and compare always reach the ok_msg path — SIGNAL LOST printing instead means the add or the compare has a bug."
