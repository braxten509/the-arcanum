[[lessons.exercises]]
id = "s01-l05-e4"
type = "mc"
required = true
capabilities = ["language-abi-procedures-and-register-discipline"]
mechanisms = ["sysv-abi-procedure-discipline"]
cognitiveTask = "predict"
scaffold = "guided"
contextFamily = "abi-variadic-al-rule"
aidPolicy = "learning"
points = 15
prompt = "Right before 'call variadic_demo' (a printf-style variadic function taking only a format string and one pointer argument, no floating-point arguments), al happens to still hold 2 left over from an earlier unrelated computation, and no xor eax, eax runs first. What happens?"
choices = ["NASM refuses to assemble the call, since al is not zeroed", "The call runs exactly as if al had been 0, since this call passes no floating-point arguments at all", "variadic_demo may read 2 nonexistent vector-register arguments it was never actually given, corrupting or dropping its output, with no assembler warning", "The call always crashes immediately with a protection fault"]
answer = 2
whyWrong = "NASM has no concept of this ABI rule and assembles the call regardless; the call is not automatically safe just because no float arguments were intended, since al's stale value is what the callee actually trusts; and the realistic failure is corrupted or dropped output, not a guaranteed hard crash."
hint = "al's value is read by the callee as a literal instruction to look for that many vector-register arguments — it does not know your intent, only the byte you left there."
explain = "Since al was never re-zeroed, variadic_demo trusts it and looks for 2 vector-register arguments that were never actually passed, typically corrupting or silently dropping the printed message — exactly the silent failure this rule exists to prevent."

