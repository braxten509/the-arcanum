[[sources]]
id = "debian-nasm-package"
url = "https://packages.debian.org/search?keywords=nasm"
authority = "Debian Project official package search, listing the nasm package across current Debian releases (e.g. bookworm 2.16.01-1, trixie 2.16.03-1)."
claims = [
  "The Debian/Ubuntu package that installs the NASM assembler is named exactly 'nasm'.",
  "NASM is packaged and versioned per Debian release (bookworm, trixie, sid), confirming apt install nasm is the correct install path.",
]

[[sources]]
id = "debian-libsdl2-dev-package"
url = "https://packages.debian.org/stable/libsdl2-dev"
authority = "Debian Project official package page for libsdl2-dev in the stable (Trixie) release."
claims = [
  "The Debian/Ubuntu package that supplies SDL2 development headers and pkg-config metadata is named exactly 'libsdl2-dev'.",
  "libsdl2-dev depends on the runtime library libsdl2-2.0-0 plus native display/audio development libraries, so installing libsdl2-dev is sufficient to compile and link against SDL2.",
]

[[sources]]
id = "nasm-manual-output-formats"
url = "https://www.nasm.us/doc/nasm09.html"
authority = "Official NASM manual, chapter 9, documenting the assembler's supported output formats."
claims = [
  "The -f option on the NASM command line selects the object output format, and elf64 is the format that produces 64-bit Linux ELF object files.",
  "ELF output can carry debug information in the DWARF format, selected through NASM's debug-format flags alongside -f elf64.",
]

[[sources]]
id = "sdl2-sdl-init-reference"
url = "https://wiki.libsdl.org/SDL2/SDL_Init"
authority = "Official SDL2 wiki API reference for SDL_Init, the library's initialization entry point."
claims = [
  "SDL_Init has the C signature 'int SDL_Init(Uint32 flags)' and the SDL_INIT_VIDEO flag initializes the video subsystem.",
  "SDL_Init returns 0 on success and a negative value on failure, and SDL_GetError() must be called to retrieve the failure's error string.",
]

[[sources]]
id = "sdl2-sdl-createwindow-reference"
url = "https://wiki.libsdl.org/SDL2/SDL_CreateWindow"
authority = "Official SDL2 wiki API reference for SDL_CreateWindow, the library's window-creation entry point."
claims = [
  "SDL_CreateWindow has the C signature 'SDL_Window *SDL_CreateWindow(const char *title, int x, int y, int w, int h, Uint32 flags)'.",
  "SDL_CreateWindow returns NULL on failure, in which case SDL_GetError() reports the reason, and SDL_WINDOWPOS_CENTERED requests a screen-centered window position.",
]

[[sources]]
id = "sdl2-sdl-geterror-reference"
url = "https://wiki.libsdl.org/SDL2/SDL_GetError"
authority = "Official SDL2 wiki API reference for SDL_GetError, the library's error-reporting entry point."
claims = [
  "SDL_GetError has the C signature 'const char *SDL_GetError(void)' and takes no arguments.",
  "SDL_GetError returns a pointer to an internal, null-terminated, human-readable string describing the most recent SDL error on the calling thread.",
]

[[sources]]
id = "sdl2-sdl-log-reference"
url = "https://wiki.libsdl.org/SDL2/SDL_Log"
authority = "Official SDL2 wiki API reference for SDL_Log, the library's default-priority logging function."
claims = [
  "SDL_Log has the C signature 'void SDL_Log(const char *fmt, ...)' and formats its variadic arguments the same way as printf, including %s for a null-terminated C string.",
  "SDL_Log writes the formatted message to the platform's default log output (standard error on desktop platforms) at the application log category and INFO priority.",
]

[[sources]]
id = "sdl2-sdl-destroywindow-reference"
url = "https://wiki.libsdl.org/SDL2/SDL_DestroyWindow"
authority = "Official SDL2 wiki API reference for SDL_DestroyWindow, the library's window-teardown entry point."
claims = [
  "SDL_DestroyWindow has the C signature 'void SDL_DestroyWindow(SDL_Window *window)' and releases the resources associated with the given window.",
  "Every window created with SDL_CreateWindow should be destroyed with SDL_DestroyWindow before the application calls SDL_Quit.",
]

[[sources]]
id = "sdl2-sdl-quit-reference"
url = "https://wiki.libsdl.org/SDL2/SDL_Quit"
authority = "Official SDL2 wiki API reference for SDL_Quit, the library's full-shutdown entry point."
claims = [
  "SDL_Quit has the C signature 'void SDL_Quit(void)' and takes no arguments and returns nothing.",
  "SDL_Quit cleans up all initialized subsystems and should be called once, after every SDL resource (such as windows) has already been destroyed, before the application exits.",
]

[[sources]]
id = "nasm-manual-directives"
url = "https://www.nasm.us/doc/nasm08.html"
authority = "Official NASM manual, chapter 8, documenting assembler directives including SECTION/SEGMENT, GLOBAL, and EXTERN."
claims = [
  "The SECTION (or SEGMENT) directive switches which output section subsequent code or data assembles into, and the standard ELF sections are .text (code), .data (initialized data), and .bss (uninitialized data).",
  "GLOBAL exports a symbol defined in the current file so other object files can reference it, and EXTERN declares a symbol defined in another file so this file may call or reference it.",
]

[[sources]]
id = "nasm-manual-pseudo-instructions"
url = "https://www.nasm.us/doc/nasm03.html"
authority = "Official NASM manual, chapter 3, documenting pseudo-instructions for declaring data."
claims = [
  "DB, DW, DD, and DQ declare initialized data of 1, 2, 4, and 8 bytes respectively, each taking a comma-separated list of values.",
  "RESB, RESW, RESD, and RESQ reserve uninitialized storage of the matching width, taking an operand naming how many units to reserve, and are used inside a .bss section.",
]

[[sources]]
id = "nasm-manual-instruction-list"
url = "https://www.nasm.us/doc/nasmaf.html"
authority = "Official NASM manual, Appendix F (Instruction List), documenting the CMP and Jcc instruction families."
claims = [
  "CMP subtracts its source operand from its destination operand, discards the numeric result, and updates the CPU flags (zero, sign, carry, overflow) from that subtraction.",
  "Conditional jump instructions (Jcc) branch based on the flags a prior instruction such as CMP set; for example JE/JNE test the zero flag and JL/JGE test the sign and overflow flags.",
]

[[sources]]
id = "sdl2-faq-headless-driver"
url = "https://wiki.libsdl.org/SDL2/FAQUsingSDL"
authority = "Official SDL2 wiki FAQ page for using the library, covering running SDL2 applications without a real display."
claims = [
  "Setting the SDL_VIDEODRIVER environment variable to 'dummy' selects SDL2's built-in dummy video driver, which lets SDL_Init and SDL_CreateWindow succeed on a machine with no real display attached.",
  "The dummy video driver is intended for headless and automated-testing use, and never opens a real, visible window.",
]

[[sources]]
id = "gdb-manual-breakpoints"
url = "https://sourceware.org/gdb/current/onlinedocs/gdb.html/Breakpoints.html"
authority = "Official GNU GDB manual, the Breakpoints chapter, documenting the break command and breakpoint numbering."
claims = [
  "The break command stops program execution at a named function, line number, or address, and GDB assigns each breakpoint a successive integer number starting at one.",
  "info breakpoints lists the current breakpoints and whether each has been hit, which is how a learner confirms a breakpoint fired during a run.",
]

[[sources]]
id = "x86-64-sysv-psabi"
url = "https://gitlab.com/x86-psABIs/x86-64-ABI"
authority = "The maintained System V AMD64 processor supplement (psABI), the normative specification for the calling convention NASM code must follow to call SDL2 and libc."
claims = [
  "The first six integer/pointer arguments to a function are passed in rdi, rsi, rdx, rcx, r8, r9 in that order, with additional arguments passed on the stack.",
  "The stack pointer (rsp) must be 16-byte aligned immediately before a CALL instruction executes, so a call site must account for the 8 bytes the CALL itself pushes.",
]
