id = "s01"
codename = "CHAPTER I // FROM EMPTY FOLDER TO NATIVE WINDOW"
short = "From Empty Folder to Native Window"
title = "From Empty Folder to Native Window"
build = "install and version-check the external toolchain, then author src/pong.asm and Makefile so integer data, branches/loops, ABI-safe procedures, SDL status failures, cleanup, and GDB checks produce a native window and deterministic init check."
brief = "Starting from a genuinely empty folder, install and verify the real NASM/GCC/Make/GDB/SDL2 toolchain, then author src/pong.asm and a Makefile from nothing: integer/pointer data in .data and .bss, CMP/Jcc-driven branches, a System V ABI-correct procedure, a two-step assemble-then-link build, and a checked SDL_Init/SDL_CreateWindow lifecycle with exactly-once cleanup on every path. The chapter closes with two independent proofs — a deterministic printed line and a live GDB session — that a native window genuinely opened and closed."

[proof]
mode = "run"
mechanisms = ["debian-toolchain-install", "toolchain-version-diagnostics", "workspace-directory-creation", "tool-edit-save", "nasm-source-layout", "makefile-authorship", "nasm-integer-data-and-addressed-state", "nasm-static-cstring-pointer-and-sdl-error-output", "nasm-compare-branch-loop-control", "sysv-abi-procedure-discipline", "nasm-elf64-dwarf-object-build", "gcc-sdl2-link-and-make-targets", "sdl-init-status-observation", "sdl-init-failure-branch", "sdl-init-error-diagnostic", "sdl-init-failure-cleanup", "sdl-window-status-observation", "sdl-window-failure-branch", "sdl-window-error-diagnostic", "sdl-window-failure-cleanup", "sdl-window-normal-cleanup", "deterministic-init-check", "gdb-state-inspection"]
expectedFiles = ["src/pong.asm", "Makefile"]
runArgs = ["--arcanum-proof", "s01"]
expectRaw = "INIT ATTEMPT 1\nPADDLE_VECTOR_S01_OK\n"

