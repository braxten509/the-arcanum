text = "The program retries a failing SDL_Init up to a fixed bound of exactly 3 attempts using real branch/loop control, printing INIT ATTEMPT <n> before each attempt, and only after all 3 attempts fail does it report SDL_GetError()'s message through SDL_Log followed by exactly PADDLE_VECTOR_S01_INIT_FAILED and exit nonzero, without calling SDL_Quit on that path."
essential = true
