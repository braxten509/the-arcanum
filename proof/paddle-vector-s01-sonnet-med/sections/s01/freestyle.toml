[[freestyle.referenceSteps]]
id = "s01-freestyle-reference-source"
path = "src/pong.asm"
mode = "rewrite"
preserves = "all-active"
mechanisms = ["workspace-directory-creation", "tool-edit-save", "nasm-source-layout", "nasm-integer-data-and-addressed-state", "nasm-static-cstring-pointer-and-sdl-error-output", "nasm-compare-branch-loop-control", "sysv-abi-procedure-discipline", "sdl-init-status-observation", "sdl-init-failure-branch", "sdl-init-error-diagnostic", "sdl-init-failure-cleanup", "sdl-window-status-observation", "sdl-window-failure-branch", "sdl-window-error-diagnostic", "sdl-window-failure-cleanup", "sdl-window-normal-cleanup"]
instruction = "Write the complete NASM source implementing the bounded-retry, checked SDL_Init/SDL_CreateWindow lifecycle described in the Working brief, in one file at src/pong.asm. The program takes no arguments and never touches environment variables itself."
content = '''
section .data
win_title:        db "Paddle Vector", 0
err_fmt:          db "%s", 0
attempt1_msg:     db "INIT ATTEMPT 1", 0
attempt2_msg:     db "INIT ATTEMPT 2", 0
attempt3_msg:     db "INIT ATTEMPT 3", 0
ok_msg:           db "PADDLE_VECTOR_S01_OK", 0
init_fail_msg:    db "PADDLE_VECTOR_S01_INIT_FAILED", 0
window_fail_msg:  db "PADDLE_VECTOR_S01_WINDOW_FAILED", 0

SDL_INIT_VIDEO equ 0x00000020
MAX_INIT_ATTEMPTS equ 3

section .bss
attempt_count:    resq 1
window_store:     resq 1

section .text
    global main
    extern SDL_Init
    extern SDL_CreateWindow
    extern SDL_GetError
    extern SDL_DestroyWindow
    extern SDL_Quit
    extern SDL_Log
    extern puts

print_attempt:
    sub rsp, 8
    cmp rdi, 1
    jne .try2
    mov rdi, attempt1_msg
    jmp .doprint
.try2:
    cmp rdi, 2
    jne .try3
    mov rdi, attempt2_msg
    jmp .doprint
.try3:
    mov rdi, attempt3_msg
.doprint:
    call puts
    add rsp, 8
    ret

main:
    sub rsp, 8
    mov qword [attempt_count], 1
.retry_loop:
    mov rdi, [attempt_count]
    call print_attempt
    mov rdi, SDL_INIT_VIDEO
    call SDL_Init
    cmp eax, 0
    je .init_ok
    mov rax, [attempt_count]
    cmp rax, MAX_INIT_ATTEMPTS
    jge .init_failed
    inc qword [attempt_count]
    jmp .retry_loop

.init_ok:
    mov rdi, win_title
    mov rsi, 0
    mov rdx, 0
    mov rcx, 400
    mov r8, 300
    mov r9, 0
    call SDL_CreateWindow
    cmp rax, 0
    je .window_failed
    mov [window_store], rax

    mov rdi, [window_store]
    call SDL_DestroyWindow
    call SDL_Quit
    mov rdi, ok_msg
    call puts
    add rsp, 8
    mov eax, 0
    ret

.window_failed:
    call SDL_GetError
    mov rsi, rax
    lea rdi, [err_fmt]
    xor eax, eax
    call SDL_Log
    mov rdi, window_fail_msg
    call puts
    call SDL_Quit
    add rsp, 8
    mov eax, 1
    ret

.init_failed:
    call SDL_GetError
    mov rsi, rax
    lea rdi, [err_fmt]
    xor eax, eax
    call SDL_Log
    mov rdi, init_fail_msg
    call puts
    add rsp, 8
    mov eax, 1
    ret
'''

[[freestyle.referenceSteps]]
id = "s01-freestyle-reference-makefile"
path = "Makefile"
mode = "write"
preserves = "all-active"
mechanisms = ["makefile-authorship", "nasm-elf64-dwarf-object-build", "gcc-sdl2-link-and-make-targets", "deterministic-init-check"]
instruction = "Write the root Makefile driving the two-step nasm/gcc pipeline from lesson 6, adapted to link against SDL2 and produce the build/pong executable from src/pong.asm behind a 'build' target, plus a check-s01 target (aliased by check) that runs the built binary once with a headless-safe video driver."
content = '''
CC = gcc
ASM = nasm
ASMFLAGS = -f elf64 -g -F dwarf
LIBS = $(shell pkg-config --libs sdl2)

.PHONY: build clean check check-s01
build: build/pong

build/pong: src/pong.o
	mkdir -p build
	$(CC) -no-pie src/pong.o -o build/pong $(LIBS)

src/pong.o: src/pong.asm
	$(ASM) $(ASMFLAGS) src/pong.asm -o src/pong.o

check-s01: build/pong
	@SDL_VIDEODRIVER=dummy ./build/pong

check: check-s01

clean:
	rm -f src/pong.o
	rm -rf build
'''

