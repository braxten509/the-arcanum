xray = "Inspect only the learner-authored extension of src/pong.asm and Makefile. Reward explicit SDL_Rect-compatible state, a checked renderer lifetime nested inside the existing window lifetime, one clear/fill/present frame owner, an ABI-safe reusable fill helper, exact real-path checks, and debugger evidence at truthful boundaries. Dock copied lesson coordinates, renderer creation before a valid window, unchecked or inverted returns, SDL_GetError on success, treating SDL_RenderPresent as status-returning, duplicate or out-of-order destruction, a COURT_OK echo detached from the rendered path, rectangle values outside the chosen window, unaligned helper calls, or a GDB transcript that inspects state before its store or after it is already discarded."

