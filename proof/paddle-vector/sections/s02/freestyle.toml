[freestyle]
title = "THE WORKING: RENDER THE COURT"
brief = '''
<p><strong>Outcome:</strong> Extend your learner-owned <code>src/pong.asm</code> and <code>Makefile</code> so the existing native window renders one complete Pong court: a background, center line, two paddles, and a ball. Keep your section-one files and choices; author every addition yourself rather than transplanting a lesson lab.</p>
<ul>
<li>Create one renderer after the validated window store. Check its pointer immediately. A null renderer must log the current SDL diagnostic, preserve a nonzero result, and reach shared cleanup. Every path that owns a renderer must destroy it exactly once, clear its stored handle, and only then release the window and call <code>SDL_Quit</code>.</li>
<li>Define one writable, contiguous four-<code>dd</code> rectangle record for the center line, each paddle, and the ball, in <code>x, y, w, h</code> order. Before the first frame, populate every field through learner-authored addressed dword stores rather than leaving the rendered geometry initialized only by declarations. Choose your own integer dimensions and positions so all four shapes are visible inside your existing window, the paddles sit on opposite sides, and the center line and ball read clearly. Keep at least a two-pixel margin around each paddle and record a short source comment explaining one spatial choice.</li>
<li>Build an ABI-safe frame procedure that sets a learner-chosen background color, clears the target, switches to a contrasting court color, fills the center line, both paddles, and ball through a reusable rectangle helper, then presents once. Check every status-returning render call before advancing; a negative status must log SDL's current error and use the same cleanup path. Do not treat the void present call as a status.</li>
<li>Preserve <code>make check-s01</code> and its exact <code>INIT_OK</code> route. Add an exact <code>--arcanum-court-check</code> mode and <code>check-s02</code> target. Under <code>SDL_VIDEODRIVER=dummy</code>, this mode must create and store the renderer, complete and present the whole frame, print exactly <code>COURT_OK</code>, clean up, and exit zero. Any renderer or render failure must print no success token and exit nonzero.</li>
</ul>
<p><strong>Commands and diagnosis:</strong> Run <code>make clean</code>, <code>make</code>, <code>make check-s01</code>, and <code>make check-s02</code>. If the build fails, inspect the first assembler or linker diagnostic. If SDL reports a null renderer or negative draw status, use the immediately captured SDL message and the last successful stage to locate the fault. If the check reports a byte mismatch, run the court mode directly under the dummy driver and distinguish extra output from a missing token; never make the target echo the answer.</p>
<p><strong>Observable acceptance:</strong> Add a repeatable GDB replay target that runs court-check mode with the dummy driver, stops immediately after the renderer store, displays the nonzero eight-byte handle and all four initialized words of at least two rectangle records, continues to a label immediately after present, then continues to a post-destruction label and displays the cleared renderer handle before normal exit. The inspected rectangle values must come from your addressed stores executed before this stop and must be the same values consumed by the fill calls. Also run <code>make debug</code> with the desktop driver, break at the post-present label, run <code>--arcanum-court-check</code>, and visually confirm all five court regions and your chosen contrast before continuing. Submit the four command results, the inspected values, your source comment rationale, and one diagnosed failure or explain which first symptom you would use if every run succeeded. Do not add event polling, frame pacing, movement, collision, scoring, or delays yet.</p>
'''
requires = ["language-data-layout-and-integer-state", "language-abi-procedures-and-register-discipline", "language-observable-debugging-and-verification", "sdl-renderer-lifecycle", "court-rectangle-state", "sdl-rectangle-rendering", "court-render-procedures", "court-rendering", "court-verification"]
mechanisms = ["debian-toolchain-install", "toolchain-version-diagnostics", "workspace-directory-creation", "tool-edit-save", "nasm-source-layout", "makefile-authorship", "nasm-integer-data-and-addressed-state", "nasm-static-cstring-pointer-and-sdl-error-output", "nasm-compare-branch-loop-control", "sysv-abi-procedure-discipline", "nasm-elf64-dwarf-object-build", "gcc-sdl2-link-and-make-targets", "sdl-init-status-observation", "sdl-init-failure-branch", "sdl-init-error-diagnostic", "sdl-init-failure-cleanup", "sdl-window-status-observation", "sdl-window-failure-branch", "sdl-window-error-diagnostic", "sdl-window-failure-cleanup", "sdl-window-normal-cleanup", "deterministic-init-check", "gdb-state-inspection", "process-entry-argument-access", "sdl-renderer-status-observation", "sdl-renderer-failure-branch", "sdl-renderer-error-diagnostic", "sdl-renderer-failure-cleanup", "sdl-renderer-normal-cleanup", "sdl-rect-compatible-integer-layout", "sdl-clear-fill-present-sequence", "render-status-observation", "render-failure-branch", "render-error-diagnostic", "render-failure-cleanup", "abi-safe-render-procedure-decomposition", "deterministic-court-check-and-gdb-proof"]
validationDependencies = []
