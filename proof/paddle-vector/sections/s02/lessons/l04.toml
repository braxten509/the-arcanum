[[lessons.exercises]]
id = "s02-l04-e1"
type = "mc"
required = true
capabilities = ["language-abi-procedures-and-register-discipline"]
mechanisms = ["abi-safe-render-procedure-decomposition"]
cognitiveTask = "predict"
scaffold = "guided"
contextFamily = "dash-decompose-lab"
aidPolicy = "learning"
points = 15
prompt = "In draw_dash_rect, why do esi, edx, ecx, and r8d need no adjustment before calling SDL_SetRenderDrawColor?"
choices = ["SDL_SetRenderDrawColor ignores those arguments entirely", "NASM automatically reorders arguments to match any callee", "Those registers are callee-saved, so their values are protected regardless of position", "They already sit in the exact registers that argument positions two through five require"]
answer = 3
whyWrong = "SDL_SetRenderDrawColor does use r, g, b, a; NASM performs no automatic argument reordering; and being callee-saved is unrelated to whether a value is already in the correct argument slot."
hint = "Compare draw_dash_rect's own parameter registers against SDL_SetRenderDrawColor's parameter positions two through five."
explain = "draw_dash_rect's incoming color values already occupy esi, edx, ecx, and r8d—the same argument registers SDL_SetRenderDrawColor uses for r, g, b, and a—so only rdi changes from rect pointer to renderer pointer."

