prompt = "At draw_dash_rect entry, rsp is eight bytes away from a 16-byte call boundary. Why is one push rbx sufficient before its nested SDL calls?"
choices = ["SDL calls ignore stack alignment", "The eight-byte push both saves rbx and moves rsp onto the required 16-byte boundary", "push rbx changes only rbx, not rsp", "NASM inserts an invisible alignment instruction"]
answer = 1
whyWrong = "A push changes rsp by eight bytes, SDL calls still follow the ABI, and NASM does not add hidden prologue instructions."
hint = "Track rsp modulo 16 before and after one eight-byte push."
explain = "The return address leaves rsp eight bytes off the call boundary at entry. Pushing one eight-byte register moves rsp onto that boundary while also preserving rbx; pop rbx reverses both effects before return."

