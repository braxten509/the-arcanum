prompt = "A trainee rewrites draw_dash_rect to stash the rect pointer in rcx instead of rbx, leaving everything else unchanged. What is the most likely outcome?"
choices = ["No difference; both registers behave identically for this purpose", "SDL_SetRenderDrawColor may overwrite rcx internally, so the rect pointer read afterward can be corrupted", "The procedure fails to assemble because rcx cannot hold a pointer", "SDL_RenderFillRect will read the color bytes instead of the rect pointer"]
answer = 1
whyWrong = "rcx is a valid general register for pointers at the assembler level, and SDL_RenderFillRect's arguments are unrelated to this substitution; the real issue is the ABI's caller/callee-saved contract, not syntax."
hint = "Recall which registers a called procedure is allowed to change freely versus which ones it must restore."
explain = "rcx is caller-saved, so SDL_SetRenderDrawColor's own implementation is free to overwrite it without restoring it; reading the rect pointer back out of rcx afterward is not guaranteed to give the original value, unlike the callee-saved rbx."
