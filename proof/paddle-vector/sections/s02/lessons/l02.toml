cognitiveTask = "explain"
scaffold = "guided"
contextFamily = "dash-rect-lab"
aidPolicy = "learning"
points = 20
prompt = "Explain why warning_zone needs no NASM struct declaration for SDL to treat it as a valid SDL_Rect."
answer = "SDL only reads sixteen bytes at the given pointer as four 32-bit fields in order; it never inspects how NASM declared them, so any correctly-sized and correctly-ordered dd values already satisfy the layout."
hint = "Think about what information actually crosses the call boundary: a pointer, or a type."

