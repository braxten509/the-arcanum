[[lessons.exercises]]
id = "s02-l02-w1"
type = "mc"
required = true
capabilities = ["language-data-layout-and-integer-state"]
mechanisms = ["sdl-rect-compatible-integer-layout"]
cognitiveTask = "predict"
scaffold = "independent"
contextFamily = "dash-rect-lab"
aidPolicy = "learning"
points = 30
prompt = "You need a second rectangle, status_zone, near warning_zone. What is the most direct way to declare it, consistent with how SDL reads SDL_Rect data?"
choices = ["Reuse warning_zone's label with a different offset for every field", "Declare a second label, status_zone, with its own four dd lines in x, y, w, h order", "Store status_zone's values inside warning_zone's unused padding bytes", "Declare status_zone with dq values so it holds more precision than warning_zone"]
answer = 1
whyWrong = "SDL_Rect has no padding to borrow, reusing one label for two shapes conflates their data, and dq fields would double every offset and no longer match SDL_Rect's 32-bit layout."
hint = "Each rectangle needs its own sixteen bytes; nothing about SDL_Rect lets two shapes share one block."
explain = "A second independently labeled block of four dd values, in the same x, y, w, h order, is both the simplest and the only layout-correct choice; SDL_Rect defines no padding to exploit and no wider field width to switch to."

[[lessons.exercises]]
id = "s02-l02-w2"
type = "text"
required = true
capabilities = ["language-data-layout-and-integer-state"]
mechanisms = ["sdl-rect-compatible-integer-layout"]
cognitiveTask = "modify"
scaffold = "independent"
contextFamily = "dash-rect-lab"
aidPolicy = "learning"
points = 30
prompt = "status_zone is a valid four-dd SDL_Rect. Write four NASM instructions that swap only its w and h fields using eax and edx, leaving x and y unchanged."
answer = '''mov eax, [rel status_zone + 8]
mov edx, [rel status_zone + 12]
mov [rel status_zone + 8], edx
mov [rel status_zone + 12], eax'''
hint = "Load both old values before either store; w starts at +8 and h starts at +12."
