[[lessons.exercises]]
id = "s02-l03-w1"
type = "mc"
required = true
capabilities = ["language-status-failure-and-resource-cleanup"]
mechanisms = ["render-failure-cleanup"]
cognitiveTask = "predict"
scaffold = "independent"
contextFamily = "dash-frame-lab"
aidPolicy = "learning"
points = 30
prompt = "paint_dash_frame returns 1 after SDL_RenderFillRect fails. The caller ignores the return and starts another frame. Which application guarantee has definitely been broken?"
choices = ["SDL automatically retries the skipped fill before the new frame", "The renderer handle has definitely become NULL", "A failed frame must enter the shared cleanup path before any later frame begins", "SDL_RenderPresent has returned a negative status"]
answer = 2
whyWrong = "SDL does not queue an automatic retry, the failure does not prove the stored handle became null, and SDL_RenderPresent has no status return."
hint = "Recall what render-failure-cleanup says the caller should do instead of looping again."
explain = "The section's fail-fast policy is explicit: a nonzero frame result converges on the existing cleanup-and-quit path. Ignoring that result definitely violates the policy and begins more work after an unsuccessful frame, regardless of whether a later SDL call might happen to succeed."

[[lessons.exercises]]
id = "s02-l03-w2"
type = "mc"
required = true
capabilities = ["language-status-failure-and-resource-cleanup"]
mechanisms = ["render-status-observation", "render-failure-branch", "render-error-diagnostic", "render-failure-cleanup"]
cognitiveTask = "debug"
scaffold = "independent"
contextFamily = "dash-frame-lab"
aidPolicy = "learning"
points = 30
prompt = "A trainee changes the branch after SDL_RenderClear from `jl .paint_failed` to `je .paint_failed`. Clear returns 0. Trace the consequence."
choices = ["The successful clear is misclassified as failure, the diagnostic may report stale text, and the caller selects cleanup", "The frame continues normally because je means negative", "SDL_RenderPresent supplies the missing failure status", "NASM rejects je after cmp"]
answer = 0
whyWrong = "After `cmp eax, 0`, je means equal to zero, not negative; conditional jumps are valid here, and SDL_RenderPresent has no status return."
hint = "Start with eax=0, determine whether ZF is set, then follow the shared failure return into the caller."
explain = "A successful zero result sets ZF, so je wrongly enters .paint_failed. SDL_GetError is not trustworthy after this successful call and may expose stale text; eax becomes 1, causing the caller's fail-fast cleanup branch to run."

[[lessons.exercises]]
id = "s02-l03-w3"
type = "mc"
required = true
capabilities = ["language-status-failure-and-resource-cleanup"]
mechanisms = ["sdl-clear-fill-present-sequence"]
cognitiveTask = "predict"
scaffold = "independent"
contextFamily = "dash-frame-lab"
aidPolicy = "learning"
points = 30
prompt = "A trainee clears the backbuffer, presents it, and only then fills warning_zone without another present. Which result is justified by SDL's contract?"
choices = ["The filled rectangle must appear immediately", "The presented frame shows the clear; drawing after present does not update that shown frame, and the next frame must begin with a fresh clear", "SDL automatically performs a second present", "SDL_RenderFillRect returns the number of pixels shown"]
answer = 1
whyWrong = "Drawing calls do not implicitly present, SDL_RenderFillRect returns only success or failure, and the backbuffer is not a persistent frame to reuse after presentation."
hint = "Separate operations on the backbuffer from the single operation that makes a completed frame visible."
explain = "Present makes the completed clear visible. A later fill is not part of that already-presented frame, and SDL says the backbuffer is invalid after present, so the correct next action is to clear and build a new complete frame before presenting again."
