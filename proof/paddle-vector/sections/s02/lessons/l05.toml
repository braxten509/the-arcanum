[[lessons.exercises]]
id = "s02-l05-w1"
type = "mc"
required = true
capabilities = ["language-observable-debugging-and-verification"]
mechanisms = ["deterministic-court-check-and-gdb-proof"]
cognitiveTask = "predict"
scaffold = "independent"
contextFamily = "dash-inspect-lab"
aidPolicy = "learning"
points = 30
prompt = "A trainee moves the second x/gx &dash_renderer breakpoint to just after dash_cleanup_window instead of the dash_renderer_released boundary. What does the trace now fail to prove?"
choices = ["Nothing changes; breakpoint position never affects a lifecycle trace", "That renderer release and slot clearing completed before window cleanup began", "That SDL_CreateRenderer originally succeeded", "That warning_zone's fields are compile-time constants"]
answer = 1
whyWrong = "The renderer handle's value by that point is unaffected by window cleanup, so it would still read zero either way; the earlier CreateRenderer success and the rectangle's compile-time nature are unrelated to where this particular breakpoint sits."
hint = "Ask what specific ordering claim this breakpoint's position was meant to demonstrate."
explain = "An observation after both cleanup operations only proves the renderer slot was eventually cleared. Stopping at dash_renderer_released isolates the exact boundary and proves the application's renderer-before-window cleanup sequence."

