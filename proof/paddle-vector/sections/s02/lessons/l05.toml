cognitiveTask = "modify"
scaffold = "guided"
contextFamily = "learner-window-debug-retrieval"
aidPolicy = "learning"
points = 25
prompt = "Create a disposable `replay-lab.mk` beside your section-one project. Author an `audit-window` target whose prerequisite is the existing debug executable and whose one continued recipe runs GDB quietly in batch mode. Queue the dummy video driver, breakpoints at `window_ready` and `quit_sdl`, the `--arcanum-acceptance` run, a handle inspection at each stop, and the continuations needed to exit. Run `make -f replay-lab.mk audit-window`. Submit your learner-authored target text, the two exact handle values printed by GDB in stop order, and `nonzero zero` as a one-line summary. The summary alone is not evidence. If either observation disagrees, diagnose and retry; delete the scratch Makefile afterward."
answer = "A complete response includes the authored audit-window target, a nonzero first handle value, an exactly zero second handle value, and the summary `nonzero zero`; the fixed summary without the target and observed values is incomplete."
hint = "First check ordering: environment and both breakpoints must be queued before run, and each observation belongs after the stop it is meant to inspect. If a symbol is unknown, rebuild the DWARF executable; if the program exits before the second inspection, recount continuations."

