[[lessons]]
id = "s02-l05"
title = "Inspect the Court State"
teaches = ["court-rendering", "court-verification"]
introduces = ["deterministic-court-check-and-gdb-proof"]
validationDependencies = []
body = '''
<p>A rendered frame is even harder to eyeball-verify than a window: nobody can reliably confirm "yes, that rectangle is exactly at 40,40" by looking at a screenshot. The same two-part proof you already trust for a window — a deterministic headless check plus a GDB memory trace — extends directly to renderer and rectangle state, with one twist worth noticing before you rely on it.</p>
<p>First compose the already-taught frame operations. This disposable wrapper clears the backbuffer, calls the ABI-safe rectangle procedure from the previous lesson, and presents only after every checkable operation succeeds. Its local SDL failures fetch a diagnostic; a failure already diagnosed inside <code>paint_dash_panels</code> simply propagates.</p>
<pre><code data-kind="runnable">section .rodata
    dash_ok_msg db "DASH_FRAME_OK", 0

section .text
paint_dash_court:
    push rbp
    mov rbp, rsp
    mov rdi, [rel dash_renderer]
    mov esi, 10
    mov edx, 10
    mov ecx, 20
    mov r8d, 255
    call SDL_SetRenderDrawColor
    cmp eax, 0
    jl .court_sdl_failed
    mov rdi, [rel dash_renderer]
    call SDL_RenderClear
    cmp eax, 0
    jl .court_sdl_failed
    call paint_dash_panels
    cmp eax, 0
    jne .court_done
    mov rdi, [rel dash_renderer]
    call SDL_RenderPresent
dash_presented:
    xor eax, eax
    jmp .court_done
.court_sdl_failed:
    call dash_report_error
    mov eax, 1
.court_done:
    leave
    ret

dash_render_ready:
    cmp byte [rel dash_check_mode], 1
    jne .dash_continue
    call paint_dash_court
    cmp eax, 0
    jne dash_shutdown
    lea rdi, [rel dash_ok_msg]
    call puts
    jmp dash_shutdown
.dash_continue:</code></pre>
<p><code>dash_render_ready</code> sits immediately after the validated renderer handle is stored, exactly like <code>window_ready</code> sat after the window handle. Under a check invocation, it paints the panels, checks their status, and prints the fixed token only after success. It then jumps straight to shutdown. A failed draw takes the diagnostic-and-cleanup route without leaking a false success token.</p>
<p>GDB proves the same moment from the debugger side. <code>break dash_render_ready</code> stops right where the renderer handle first becomes valid; <code>x/gx &dash_renderer</code> shows a nonzero pointer, the runtime evidence that <code>SDL_CreateRenderer</code> actually succeeded. From there, <code>x/4dw &warning_zone</code> examines four consecutive doublewords starting at that label — the <code>4</code> selects a count of four units, <code>d</code> formats each as a signed decimal, and <code>w</code> sizes each unit at four bytes, matching the <code>dd</code> fields exactly. The output should read <code>40 40 120 30</code>, x through h in order.</p>
<p>Here is the twist: that rectangle inspection works at <em>any</em> breakpoint, even one set before <code>main</code> ever runs. <code>warning_zone</code>'s four fields are compiled directly into the binary's data section as constants — nothing computes them at runtime, so nothing has to "happen" first for them to be correct. Contrast that with <code>dash_renderer</code>, whose value is genuinely zero until <code>SDL_CreateRenderer</code> succeeds; inspecting it too early shows exactly that zero, honestly reflecting a resource that does not exist yet. Knowing which values are load-time constants and which are runtime results tells you when a breakpoint's position actually matters.</p>
<pre><code data-kind="runnable">dash_shutdown:
    call dash_cleanup_renderer
dash_renderer_released:
    call dash_cleanup_window
    call SDL_Quit</code></pre>
<p>The label—not a debugger command—belongs in the assembly. Set <code>break dash_renderer_released</code>, continue to it, then enter <code>x/gx &amp;dash_renderer</code> at the GDB prompt. Zero proves the guarded renderer release and slot clear completed before window cleanup began. If the symbol is unknown, rebuild the DWARF binary; if the first handle is zero, confirm the ready label follows the validated store rather than weakening the proof.</p>
<p>Rehearse the tool operation without adding project material yet. On the learner-owned section-one executable, run <code>make debug</code>, enter <code>set environment SDL_VIDEODRIVER dummy</code>, set <code>break window_ready</code>, and enter <code>run --arcanum-acceptance</code>. Use <code>x/gx &amp;window_handle</code> for the live eight-byte pointer, then vary the operation to <code>x/2wx &amp;window_handle</code>: the same eight bytes appear as two four-byte hexadecimal units. Quit without changing the project. In the Working you will apply the already-explained <code>x/4dw</code> form to rectangle labels you author yourself.</p>
<p>A batch replay turns those prompt commands into a repeatable Make target. <code>gdb -q -batch executable</code> suppresses the greeting, runs queued commands, and exits instead of opening an interactive prompt. Each <code>-ex 'command'</code> queues one GDB command in written order. Set the environment and every breakpoint before <code>run</code>; after the program stops, alternate an observation with <code>continue</code> to reach the next stop. In a Make recipe, the initial tab starts the shell command and each trailing backslash continues that same command on the following physical line.</p>
<pre data-kind="pseudocode"><code>audit-dash: build/dash-lab
&#9;gdb -q -batch ./build/dash-lab \
&#9;  -ex 'set environment SDL_VIDEODRIVER dummy' \
&#9;  -ex 'break dash_render_ready' \
&#9;  -ex 'break dash_presented' \
&#9;  -ex 'break dash_renderer_released' \
&#9;  -ex 'run --dash-check' \
&#9;  -ex 'x/gx &amp;dash_renderer' \
&#9;  -ex 'x/4dw &amp;warning_zone' \
&#9;  -ex 'continue' \
&#9;  -ex 'continue' \
&#9;  -ex 'x/gx &amp;dash_renderer' \
&#9;  -ex 'continue'</code></pre>
<p>This disposable example must stop at <code>dash_presented</code>, the label on the instruction immediately after <code>SDL_RenderPresent</code>, before it can prove cleanup. The first stop exposes a nonzero renderer and four decimal rectangle fields; the second proves presentation returned; the third exposes the cleared renderer slot. If a queued inspection reports that the program is not running, count stops and <code>continue</code> commands: one continuation probably skipped the intended label or let the process exit. If GDB cannot find a label, rebuild the debug executable before changing the replay.</p>
<p>For guided practice, put a temporary target in a disposable <code>replay-lab.mk</code> beside the project and invoke it with <code>make -f replay-lab.mk target-name</code>; <code>-f</code> selects that scratch Makefile. Delete the scratch file after recording the observations. This exercises target construction without adding a solution target to the canonical project before the Working.</p>
<div class="field-notes"><div class="fn-head">FIELD NOTES // EXACT-MATCH STILL MEANS EXACT</div><p>The same brittleness from your window check applies here: any extra success-path output breaks a check expecting exactly one token. Keep SDL diagnostics confined to confirmed failure branches; emit the fixed token only after the complete frame procedure returns success.</p></div>
'''

[[lessons.concepts]]
id = "court-rendering"
purpose = "Names the combined state a court's proof depends on: a live renderer plus correctly laid out rectangle data."
anatomy = "A nonzero renderer handle from lesson one, paired with compile-time-constant rectangle fields from lesson two, both readable through GDB at the right breakpoint."
example = "dash_render_ready is the single point where both pieces of court-rendering state are confirmed together."
observable = "x/gx &dash_renderer and x/4dw &warning_zone both return meaningful values once dash_render_ready is reached."
failure = "Checking the renderer handle without also checking the rectangle data can miss a court that opens correctly but draws the wrong shape."
practice = "s02-l05-e1"

[[lessons.concepts]]
id = "court-verification"
purpose = "Establishes that a rendered court is proven the same two ways a window was: an exact deterministic token and a GDB memory trace."
anatomy = "A check-mode branch that paints one frame and prints one fixed token, plus two breakpoints tracing renderer and rectangle state before and after renderer cleanup."
example = "dash_render_ready's check-mode branch together with the ready and renderer-released breakpoints forms one complete verification pass."
observable = "The check invocation prints exactly one token and exits cleanly; the GDB trace shows the renderer handle nonzero, then zero after cleanup."
failure = "Relying on a screenshot or visual inspection instead of these two proofs cannot be automated or reliably repeated."
practice = "s02-l05-e2"

[[lessons.concepts]]
id = "deterministic-court-check-and-gdb-proof"
purpose = "Combines a headless deterministic token with GDB memory inspection into one concrete proof procedure for rendered state."
anatomy = "dash_render_ready branches on a check-mode flag to paint and print one token; an ordered batch-GDB target sets the dummy driver and three breakpoints before running, then inspects live state, the post-present boundary, and the cleared renderer slot."
example = "The replay breaks at dash_render_ready, dash_presented, and dash_renderer_released, inspecting the handle and four rectangle words at the first stop and the cleared handle at the third."
observable = "The renderer handle reads nonzero at dash_render_ready, execution stops immediately after presentation, and the handle reads exactly zero after dash_cleanup_renderer; the rectangle fields read 40 40 120 30."
failure = "A misplaced breakpoint or mismatched number of continue commands can inspect the wrong state or let the process exit before the final observation."
practice = "s02-l05-e3"

[[lessons.readings]]
label = "GDB: Examining Memory"
url = "https://sourceware.org/gdb/current/onlinedocs/gdb.html/Memory.html"

[[lessons.exercises]]
id = "s02-l05-e1"
type = "mc"
required = true
capabilities = ["language-observable-debugging-and-verification"]
mechanisms = ["deterministic-court-check-and-gdb-proof"]
cognitiveTask = "predict"
scaffold = "guided"
contextFamily = "dash-inspect-lab"
aidPolicy = "learning"
points = 15
prompt = "A breakpoint is set at the very first instruction of main, before create_dash_renderer has run. What does x/4dw &warning_zone show there?"
choices = ["All zeros, since nothing has run yet", "An error, since the rectangle has not been created yet", "Garbage values that only become correct after main runs", "40 40 120 30, the same values it shows at any later breakpoint"]
answer = 3
whyWrong = "warning_zone is not zero-initialized, not created at runtime, and not garbage; it is a compile-time constant already present in the binary before main executes."
hint = "Recall which kind of state is baked into the binary at assembly time versus which kind is computed while the program runs."
explain = "warning_zone's four dd values are constants placed directly in the data section at assemble time; they exist in the loaded binary before a single instruction of main runs, unlike dash_renderer, which genuinely starts at zero until SDL_CreateRenderer succeeds."

[[lessons.exercises]]
id = "s02-l05-e2"
type = "text"
required = true
capabilities = ["language-observable-debugging-and-verification"]
mechanisms = ["deterministic-court-check-and-gdb-proof"]
cognitiveTask = "explain"
scaffold = "guided"
contextFamily = "dash-inspect-lab"
aidPolicy = "learning"
points = 20
prompt = "Explain why a deterministic check-mode token is a better proof of a painted frame than asking a human to look at the window."
answer = "A human visual check cannot be automated, repeated exactly, or compared precisely, while a fixed token printed only on a successful paint can be diffed exactly against an expected string every time the check runs, making the proof repeatable and machine-verifiable."
hint = "Think about what a script comparing two runs' output can do that a person looking at pixels cannot."

