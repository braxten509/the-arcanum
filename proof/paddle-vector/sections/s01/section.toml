id = "s01"
codename = "CHAPTER I // FROM EMPTY FOLDER TO NATIVE WINDOW"
short = "From Empty Folder to Native Window"
title = "From Empty Folder to Native Window"
build = "install and version-check the external toolchain, then author src/pong.asm and Makefile so integer data, branches/loops, ABI-safe procedures, SDL status failures, cleanup, and GDB checks produce a native window and deterministic init check."
brief = "Begin with an empty external workspace, verify the real Linux assembly toolchain, and author the first Paddle Vector source and Makefile. The milestone is a status-checked SDL2 window lifetime with a deterministic acceptance path and debugger evidence; lesson labs remain disposable and are not project starters."

[proof]
mode = "run"
mechanisms = ["nasm-integer-data-and-addressed-state", "nasm-static-cstring-pointer-and-sdl-error-output", "nasm-compare-branch-loop-control", "sysv-abi-procedure-discipline", "sdl-init-status-observation", "sdl-init-failure-branch", "sdl-init-error-diagnostic", "sdl-init-failure-cleanup", "sdl-window-status-observation", "sdl-window-failure-branch", "sdl-window-error-diagnostic", "sdl-window-failure-cleanup", "sdl-window-normal-cleanup", "deterministic-init-check", "process-entry-argument-access"]
expectedFiles = ["src/pong.asm", "Makefile"]
runArgs = ["--arcanum-acceptance"]
expect = "INIT_OK"

