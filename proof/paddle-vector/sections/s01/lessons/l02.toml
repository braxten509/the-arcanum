[[lessons.exercises]]
id = "s01-l02-d1"
type = "type"                      # typing drill: retype the code; no point decay
required = true
capabilities = ["language-observable-debugging-and-verification"]
mechanisms = []
cognitiveTask = "recall"
scaffold = "worked"
contextFamily = "replace-context"
aidPolicy = "learning"
points = 12
reps = 2
prompt = "Retype the workspace creation command exactly. (Ctrl+Enter submits.)"
code = 'mkdir -p ~/signal-box/src'

[[lessons.exercises]]
id = "s01-l02-w1"
type = "mc"
required = true
capabilities = ["language-observable-debugging-and-verification"]
mechanisms = []
cognitiveTask = "predict"
scaffold = "independent"
contextFamily = "replace-context"
aidPolicy = "learning"
points = 30
prompt = "Make reports 'missing separator' on the printf recipe. Which edit repairs the rule?"
choices = ["Begin the recipe with a space", "Begin the recipe with a tab", "Replace the target colon with a semicolon", "Move the recipe above the target"]
answer = 1
whyWrong = "Spaces do not satisfy Make's recipe prefix, and changing the rule order or punctuation does not repair the missing prefix."
hint = "GNU Make distinguishes one indentation character from spaces."
explain = "A recipe line begins with a real tab under the target rule."
