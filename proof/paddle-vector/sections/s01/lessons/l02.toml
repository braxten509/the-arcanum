[[lessons]]
id = "s01-l02"
title = "Author the Empty Workspace"
teaches = ["assembly-workspace-authorship", "tool-create-open", "tool-navigate", "tool-edit-save"]
introduces = ["workspace-directory-creation", "tool-edit-save", "nasm-source-layout", "makefile-authorship"]
validationDependencies = []
body = '''
<p>A workspace is a promise about where each kind of truth lives. Source belongs under <code>src/</code>; build instructions live at the root. You—not a generator—will create both. Practice in a disposable directory named <code>signal-box</code>, not in the course project:</p>
<pre><code data-kind="terminal">mkdir -p ~/signal-box/src
cd ~/signal-box
pwd
touch src/blink.asm Makefile
ls -l src/blink.asm Makefile</code></pre>
<p><code>mkdir -p</code> creates missing path components and is harmless if they exist. <code>cd</code> changes the current directory; <code>pwd</code> proves where relative paths begin. <code>touch</code> creates empty files, and <code>ls -l</code> proves their names. Open the <em>folder</em> in your editor, enter the examples below, save, close one tab, reopen it, and confirm the text persists. The saved bytes—not an editor buffer—are the artifact.</p>
<p>A NASM file separates responsibilities. Directives describe the object; labels name locations; instructions tell the CPU what to do:</p>
<pre><code data-kind="pseudocode">global main
extern puts

section .data
    lamp_level dd 2

section .text
main:
    ; executable instructions come in a later lab</code></pre>
<p><code>global main</code> exports a linker-visible entry symbol. <code>extern puts</code> does the opposite job: it declares that the procedure name is defined outside this object and must be resolved by the linker. It neither calls <code>puts</code> nor supplies its arguments, so this call-free skeleton makes no library request at run time. <code>.data</code> holds initialized bytes; <code>.text</code> will hold instructions. This layout-only skeleton is intentionally not built or run yet: its job is to make exported names, imported names, sections, and labels visible without using state access before that operation is taught. Save it as <code>src/blink.asm</code>.</p>
<p>A Makefile describes relationships, not a transcript. A rule has a target, prerequisites after a colon, and a recipe on the next line. Recipes begin with a real tab:</p>
<pre><code data-kind="pseudocode">SOURCE := src/blink.asm
TARGET := blink

.PHONY: show
show:
	@printf '%s -&gt; %s\n' "$(SOURCE)" "$(TARGET)"</code></pre>
<p>Save it and run <code>make show</code>; expect <code>src/blink.asm -&gt; blink</code>. “Missing separator” means spaces likely replaced the recipe tab. If the editor shows text but <code>sed -n '1,20p' src/blink.asm</code> does not, save or reopen the correct root. Navigation, editing, saving, invocation, and observation form one loop.</p>
<div class="field-notes"><div class="fn-head">FIELD NOTES // CASE IS DATA</div><p>Linux paths and NASM labels are case-sensitive. This course consistently uses the capitalized name <code>Makefile</code>.</p></div>
'''

[[lessons.concepts]]
id = "assembly-workspace-authorship"
purpose = "Makes the learner the author of the source tree and build description."
anatomy = "Create a root and src directory, create empty files, edit, save, and inspect disk contents."
example = "The disposable signal-box workspace is created and populated by hand."
observable = "The file listing, editor reopen, and make show output agree."
failure = "A correct-looking buffer that differs from terminal output is unsaved or belongs to another folder."
practice = "s01-l02-e1"

[[lessons.concepts]]
id = "tool-create-open"
purpose = "Creates blank files and opens their containing folder without seeded project material."
anatomy = "Create directories, touch empty files, open the root folder, then select files from its tree."
example = "mkdir and touch create signal-box before the editor opens it."
observable = "The editor tree and ls show the same two files."
failure = "Opening one loose file hides root context and invites relative-path mistakes."
practice = "s01-l02-e1"

[[lessons.concepts]]
id = "tool-navigate"
purpose = "Keeps relative commands anchored to the intended workspace."
anatomy = "Change directory, print it, then address files relative to that root."
example = "cd ~/signal-box followed by pwd establishes the anchor."
observable = "pwd ends in signal-box and later paths resolve."
failure = "File-not-found often means the shell is in the wrong directory."
practice = "s01-l02-e1"

[[lessons.concepts]]
id = "tool-edit-save"
purpose = "Commits an editor buffer to disk so tools can read it."
anatomy = "Enter text, save, reopen, and compare with a terminal read."
example = "Save blink.asm and Makefile, then inspect and invoke them."
observable = "Reopened content persists and Make reads the recipe."
failure = "An unsaved marker or stale terminal view reveals a buffer/disk mismatch."
practice = "s01-l02-e1"

[[lessons.concepts]]
id = "workspace-directory-creation"
purpose = "Builds the root/src shape separating source from generated output."
anatomy = "Use mkdir -p for the nested directory and touch only blank required files."
example = "mkdir -p ~/signal-box/src creates both levels."
observable = "ls resolves src/blink.asm and the root Makefile."
failure = "Creating src beside the root breaks planned relative paths."
practice = "s01-l02-e1"

[[lessons.concepts]]
id = "nasm-source-layout"
purpose = "Separates exported symbols, initialized data, and executable instructions."
anatomy = "Declare linker-exported names with global, linker-resolved procedure names with extern, place values in .data, and place labels and instructions in .text."
example = "blink.asm exports main, imports the unresolved puts name without calling it, and declares lamp_level."
observable = "The saved file has distinct data and text regions."
failure = "An instruction in .data or unexported main causes later build diagnostics."
practice = "s01-l02-e1"

[[lessons.concepts]]
id = "makefile-authorship"
purpose = "Records repeatable named operations and their relationships."
anatomy = "Define variables, name a target, list prerequisites, and begin recipes with a tab."
example = "The show target prints the disposable source-to-target mapping."
observable = "make show prints src/blink.asm -> blink."
failure = "Missing separator usually means recipe spaces replaced the required tab."
practice = "s01-l02-e1"

[[lessons.readings]]               # optional: 1-2 high-quality official docs
label = "GNU Make rule anatomy"
url = "https://www.gnu.org/software/make/manual/html_node/Rule-Introduction.html"

[[lessons.exercises]]
id = "s01-l02-e1"
type = "mc"
required = true
capabilities = ["language-observable-debugging-and-verification"]
mechanisms = ["workspace-directory-creation", "tool-edit-save", "nasm-source-layout", "makefile-authorship"]
cognitiveTask = "predict"
scaffold = "guided"
contextFamily = "replace-context"
aidPolicy = "learning"
points = 15
prompt = "Perform the signal-box setup through make show. Which result proves both files are addressed from the intended root?"
choices = ["The editor theme changes", "pwd ends in src", "make show prints src/blink.asm -> blink", "touch prints the file contents"]
answer = 2
whyWrong = "Themes prove nothing, the root should be signal-box, and touch normally prints no contents."
hint = "Choose the result combining the root Makefile with the nested source path."
explain = "Make can print that mapping only after reading the saved root file and expanding its variables."

