[[lessons.exercises]]
id = "s01-l04-w1"
type = "mc"
required = true
capabilities = ["language-branch-loop-control"]
mechanisms = []
cognitiveTask = "predict"
scaffold = "independent"
contextFamily = "replace-context"
aidPolicy = "learning"
points = 30
prompt = "A new countdown starts at 3, checks for equality with zero, subtracts 2, and jumps back. Your trace begins 3, 1, -1. Which diagnosis and repair preserve the two-count stride while making the equality exit reachable?"
choices = ["It already terminates; keep 3", "It skips zero; start this countdown at 4", "The jump is missing; add a second back edge", "The comparison changes the counter; remove it"]
answer = 1
whyWrong = "The trace proves that an odd start and a stride of two pass around zero. Extra jumps or deleting the comparison cannot make equality reachable."
hint = "Ask which parity the repeated subtraction preserves."
explain = "Subtracting two preserves parity. Starting at 4 gives the trace 4, 2, 0, so the existing pre-check reaches its exit without underflow."
