[[lessons]]
id = "s01-l04"
title = "Drive Decisions with Flags"
teaches = ["language-branch-loop-control"]
introduces = ["nasm-compare-branch-loop-control"]
validationDependencies = []
body = '''
<p>The CPU does not execute an <code>if</code> object. It executes an instruction that sets condition flags, followed by a jump that interprets those flags. <code>cmp left, right</code> performs a subtraction for flags only; it stores neither result. In this disposable ticket counter, a zero count skips the work:</p>
<pre><code data-kind="pseudocode">    mov ecx, 3
.count:
    cmp ecx, 0
    je .done
    dec ecx
    jmp .count
.done:
    mov eax, ecx</code></pre>
<p>Trace by labels. First <code>ECX</code> is 3. Each visit to <code>.count</code> compares it with zero. <code>je</code> means “jump if equal”; it is taken when the zero flag is set. Until then, <code>dec</code> subtracts one and the unconditional <code>jmp</code> closes the loop. The comparison sees 3, 2, 1, then 0, so <code>.done</code> receives zero.</p>
<p>Ordering matters. Putting <code>dec ecx</code> before the first comparison changes a count of zero to -1 and the loop may never reach zero again. Omitting the unconditional back edge runs the body only once. Jumping to a misspelled label is an assembler error, while jumping to the wrong existing label assembles but produces wrong control flow.</p>
<p>Use signed conditions when negative values carry meaning: <code>jl</code> and <code>jg</code> interpret sign and overflow flags after <code>cmp</code>. Use <code>jb</code> and <code>ja</code> for unsigned quantities. Equality branches such as <code>je</code>/<code>jne</code> do not have that signed/unsigned split. For a nonnegative loop count, equality with zero is the simplest boundary.</p>
<p>A branch trace is your first verifier. Write one row per comparison with columns for <code>ECX</code>, “equal?”, and next label. This catches off-by-one errors before a debugger is involved. Then vary the initial count to 1 and 0. A correct pre-check loop executes its body once and zero times respectively. That variation is more useful than merely retyping the example.</p>
<div class="field-notes"><div class="fn-head">FIELD NOTES // LOCAL LABELS</div><p>NASM labels beginning with a dot are local to the preceding non-local label. They keep short branch names readable. A later procedure may reuse <code>.done</code> under its own non-local label without collision.</p></div>
'''

[[lessons.concepts]]
id = "language-branch-loop-control"
purpose = "Turns integer state into explicit decisions and finite repetition."
anatomy = "Set flags with cmp, choose a conditional edge, change loop state, and jump back to the test."
example = "The ticket counter visits 3, 2, 1, and 0 before leaving."
observable = "A four-row branch trace ends at .done with ECX equal to zero."
failure = "A missing back edge runs once; a change before the initial test breaks the zero-input case."
practice = "s01-l04-e1"

[[lessons.concepts]]
id = "nasm-compare-branch-loop-control"
purpose = "Provides the exact NASM compare, label, conditional jump, update, and back-edge pattern."
anatomy = "cmp sets flags without storing; je selects equality; dec advances state; jmp repeats."
example = "The .count/.done example is a pre-check countdown loop."
observable = "Counts 3 and 1 terminate at zero, while count 0 skips the body."
failure = "Choosing a signed branch for unsigned data, or the reverse, misinterprets high-bit values."
practice = "s01-l04-e1"

[[lessons.readings]]               # optional: 1-2 high-quality official docs
label = "NASM instruction syntax and effective addresses"
url = "https://www.nasm.us/doc/nasm03.html"

[[lessons.exercises]]
id = "s01-l04-e1"
type = "mc"
required = true
capabilities = ["language-branch-loop-control"]
mechanisms = ["nasm-compare-branch-loop-control"]
cognitiveTask = "predict"
scaffold = "guided"
contextFamily = "replace-context"
aidPolicy = "learning"
points = 15
prompt = "Trace the shown loop from ECX=3. How many times does cmp execute before .done?"
choices = ["3", "1", "It never terminates", "4"]
answer = 3
whyWrong = "The body runs three times, but the terminating comparison at zero is also executed."
hint = "Include the comparison that finally takes je."
explain = "The comparisons observe 3, 2, 1, and 0: four executions."

