[[lessons.exercises]]
id = "s01-l08-w1"
type = "mc"
required = true
capabilities = ["language-observable-debugging-and-verification"]
mechanisms = ["process-entry-argument-access"]
cognitiveTask = "predict"
scaffold = "independent"
contextFamily = "replace-context"
aidPolicy = "learning"
points = 30
prompt = "A different program is launched as ./meter alpha beta. Its argv table has the executable pointer at +0, alpha at +8, beta at +16, and null at +24. After confirming argc is at least two, it loads [rsi+16] and calls that the first user argument. Which diagnosis and repair are correct?"
choices = ["It read alpha; keep +16", "It read beta; use +8 for argv[1]", "It read the null sentinel; use +0", "It read inline characters; increment rsi by one"]
answer = 1
whyWrong = "argv is an eight-byte pointer table: +0 is argv[0], +8 is argv[1], and +16 is argv[2]. The characters live behind those pointers."
hint = "Divide the byte displacement by the eight-byte slot width."
explain = "A displacement of 16 selects slot two, beta. The first user argument is argv[1], loaded from [rsi+8] after the bounds check."
