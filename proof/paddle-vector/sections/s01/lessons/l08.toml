[[lessons.exercises]]
id = "s01-l08-e4"
type = "mc"
required = true
capabilities = ["language-observable-debugging-and-verification"]
mechanisms = ["deterministic-init-check"]
cognitiveTask = "predict"
scaffold = "guided"
contextFamily = "replace-context"
aidPolicy = "learning"
points = 20
prompt = "check-s01 redirects the run into check-s01.out, writes printf 'INIT_OK\\n' into check-s01.expected, then runs cmp check-s01.out check-s01.expected. A teammate's build accidentally emits INIT_OK with no trailing newline. What does cmp report?"
choices = ["Success, because cmp trims trailing newlines before comparing", "A mismatch, because check-s01.out is one byte shorter than check-s01.expected at the newline position", "Nothing; cmp only compares the two file sizes and prints no offset", "Success, because printf and puts always agree on newlines"]
answer = 1
whyWrong = "cmp performs a byte-for-byte comparison with no newline-trimming special case; it reports where the files actually diverge rather than silently passing or only checking total size."
hint = "Count the bytes each file actually contains and find where they first stop matching."
explain = "check-s01.expected holds eight bytes: INIT_OK plus one newline. Without that newline, check-s01.out is only seven bytes, so cmp reports the mismatch at that trailing position instead of silently passing."

