code = 'mov ____ [rel exit_code], 0'
answer = "dword"
hint = "Match the prefix to exit_code's declared width, the same width dd reserves."

[[lessons.exercises]]
id = "s01-l07-e5"
type = "fill"
required = true
capabilities = ["language-status-failure-and-resource-cleanup"]
mechanisms = ["sdl-init-failure-cleanup", "sdl-window-failure-cleanup", "sdl-window-normal-cleanup"]
cognitiveTask = "modify"
scaffold = "guided"
contextFamily = "replace-context"
aidPolicy = "learning"
points = 25
prompt = "A broken .window_failed label reads call report_sdl_error then ret, skipping .cleanup entirely so SDL_Quit never runs on this path. Complete the single instruction that restores the shared-cleanup routing so init failure, window failure, and success all still converge on exactly one destroy/quit owner."
code = '''.window_failed:
    call report_sdl_error
    ____'''
answer = "jmp .cleanup"
hint = "Route to the same label every other outcome already reaches."
explain = "jmp .cleanup makes every path share one destroy/quit owner: destroy runs zero times on both failure paths and once on success, while .quit's SDL_Quit still runs exactly once regardless of which path arrives."

