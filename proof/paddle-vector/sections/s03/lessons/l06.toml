scaffold = "independent"
contextFamily = "control-integrity-review"
aidPolicy = "learning"
points = 30
prompt = "Which mutation best tests whether a deterministic paddle check truly exercises movement rather than printing a preselected answer?"
choices = ["Rename the success token in both expected and actual output", "Remove the call to the real paddle-update procedure and confirm the check fails", "Increase the terminal font size", "Run the same answer-writing branch twice"]
answer = 1
whyWrong = "Changing labels or presentation does not test the behavioral path, and repeating a bypass still bypasses movement."
hint = "Choose a mutation that should alter the observed position only if real movement is being exercised."
explain = "If removing the real update call does not fail the check, the supposed proof is disconnected from the behavior it claims to verify."
