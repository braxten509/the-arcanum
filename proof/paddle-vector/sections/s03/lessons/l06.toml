cognitiveTask = "explain"
scaffold = "guided"
contextFamily = "conveyor-control-lab"
aidPolicy = "learning"
points = 20
prompt = "Why is directly storing the expected final y in check mode not valid evidence for the movement procedure?"
answer = "It bypasses input decoding and the real update and clamp transition, so the check can pass even when the procedure under test is missing or broken."
hint = "Ask whether changing or deleting the update procedure would change that check."

