contextFamily = "proof-coverage-review"
aidPolicy = "learning"
points = 30
prompt = "Which live test adds evidence that the deterministic replay and a one-player visual test both lack?"
choices = ["Open and close the terminal without launching the program", "Hold one paddle's down key for one frame", "Hold one control for each paddle simultaneously, reverse both, then close the window while a key remains held", "Read the fixed success token twice"]
answer = 2
whyWrong = "Only the simultaneous, reversing, close-under-input procedure exercises independent two-player sampling and responsive quit under active input."
hint = "Look for an interaction that combines both players with the close path."
explain = "That sequence checks independent simultaneous sampling, direction changes, and whether quit remains responsive while input is active."
