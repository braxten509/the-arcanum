prompt = "GDB shows y=500 and h=110 immediately after a downward update in a 500-pixel window. The rectangle is invisible. Which invariant and repair are correct?"
choices = ["Require y+h<=500 and clamp y to 390", "Require y<=500 and keep y at 500", "Require y-h>=500 and clamp y to 610", "Require x+w<=500 and clamp x instead"]
answer = 0
