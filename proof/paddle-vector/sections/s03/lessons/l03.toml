cognitiveTask = "explain"
scaffold = "guided"
contextFamily = "cargo-gate-lab"
aidPolicy = "learning"
points = 20
prompt = "Explain why the lower-bound comparison must treat a temporary y of -4 as signed rather than unsigned."
answer = "Signed comparison recognizes -4 as below zero; unsigned comparison interprets the same bit pattern as a very large positive value and misses the top-bound violation."
hint = "The bits are unchanged; only the comparison's interpretation changes."

