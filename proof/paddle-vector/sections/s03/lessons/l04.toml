[[lessons]]
id = "s03-l04"
title = "Pace Frames by a Deadline"
teaches = ["frame-clock-pacing"]
introduces = ["sdl-ticks-deadline-and-delay-pacing"]
validationDependencies = []
body = '''
<p>An unpaced loop runs as fast as one machine permits. That wastes a CPU core and makes fixed-per-frame movement faster on a powerful computer. A frame budget gives the loop a target duration. At roughly 60 frames per second, a practical integer budget is 16 milliseconds. Work uses part of that budget; only the remainder should be delayed.</p>
<p><code>SDL_GetTicks</code> returns an unsigned 32-bit millisecond count since SDL initialization. <code>SDL_Delay</code> accepts an unsigned millisecond duration and waits at least that long, though the operating-system scheduler may make the wait longer. This disposable status-panel procedure starts a deadline and finishes the frame without unsigned underflow:</p>
<pre><code data-kind="runnable">FRAME_MS equ 16

section .bss
    panel_started: resd 1
    panel_deadline: resd 1

section .text
extern SDL_GetTicks
extern SDL_Delay

begin_panel_frame:
    push rbp
    mov rbp, rsp
    call SDL_GetTicks
    mov [rel panel_started], eax
    add eax, FRAME_MS
    mov [rel panel_deadline], eax
    leave
    ret

finish_panel_frame:
    push rbp
    mov rbp, rsp
    call SDL_GetTicks
    sub eax, [rel panel_started]
    cmp eax, FRAME_MS
    jae .finished
    mov edi, FRAME_MS
    sub edi, eax
    call SDL_Delay
.finished:
    leave
    ret</code></pre>
<p>The beginning records both the start and the target deadline, making the intended boundary visible in a debugger. The finishing subtraction computes elapsed time modulo 2<sup>32</sup>. For a short frame interval, that remains correct even if the tick counter wraps between the two readings. If work took 9 ms, <code>16-9</code> passes 7 in <code>edi</code>. If work took 19 ms, <code>jae</code> skips delay entirely. Subtracting before that comparison would wrap <code>16-19</code> into a huge unsigned delay.</p>
<p>SDL2's 32-bit tick count wraps after about 49 days; SDL recommends <code>SDL_GetTicks64</code> for general long-running timing on SDL 2.0.18 or later. The bounded subtraction here is deliberate for a short, fixed frame interval and broad SDL2 compatibility. It is not a general calendar or multi-day deadline technique. The stored <code>panel_deadline</code> may wrap too, so direct unsigned <code>now &gt;= deadline</code> is not a safe comparison across wrap; the short elapsed subtraction avoids that trap.</p>
<p>A delay is pacing, not precision scheduling. Seeing an occasional 17- or 18-ms frame is consistent with SDL's “at least” guarantee. Diagnose a program that always sleeps 16 ms by measuring from one frame start to the next: if rendering already took 5 ms, that broken route produces about 21 ms. Recover by measuring work first and delaying only the remaining budget.</p>
'''

[[lessons.concepts]]
id = "frame-clock-pacing"
purpose = "Limits loop speed by making each short frame consume at least a chosen millisecond budget."
anatomy = "Record a start tick and visible deadline, perform the frame work, measure elapsed time, skip delay when late, otherwise delay only the remaining budget."
example = "begin_panel_frame and finish_panel_frame surround disposable panel work with a 16-ms target."
observable = "A 9-ms work interval requests a 7-ms delay, while a 19-ms interval requests none; frame starts advance near the target instead of at maximum CPU speed."
failure = "Always delaying the full budget adds work time on top and makes every nonempty frame slower than intended."
practice = "s03-l04-e1"

[[lessons.concepts]]
id = "sdl-ticks-deadline-and-delay-pacing"
purpose = "Uses SDL's millisecond clock and delay call without late-frame underflow or short-interval wrap errors."
anatomy = "Capture SDL_GetTicks in a dword, derive a deadline, subtract start from the later tick in 32 bits, compare elapsed with the budget, then place only a positive remainder in EDI for SDL_Delay."
example = "finish_panel_frame checks elapsed before subtracting it from FRAME_MS."
observable = "GDB can show panel_deadline exactly 16 ticks after panel_started modulo 2^32 and a requested delay no greater than 16."
failure = "Computing budget-minus-elapsed before checking a late frame can turn a negative remainder into a multibillion-millisecond unsigned delay."
practice = "s03-l04-e1"

[[lessons.readings]]
label = "SDL2: SDL_GetTicks"
url = "https://wiki.libsdl.org/SDL2/SDL_GetTicks"

[[lessons.readings]]
