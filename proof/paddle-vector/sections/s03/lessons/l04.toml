prompt = "Explain why finish_panel_frame compares elapsed with FRAME_MS before computing FRAME_MS-elapsed."
answer = "A late frame has elapsed greater than the budget; subtracting first would wrap the negative remainder as a huge unsigned delay, so the comparison must skip SDL_Delay."
hint = "Interpret SDL_Delay's argument as an unsigned 32-bit duration."

