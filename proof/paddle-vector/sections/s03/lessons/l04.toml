url = "https://wiki.libsdl.org/SDL2/SDL_Delay"

[[lessons.exercises]]
id = "s03-l04-e1"
type = "mc"
required = true
capabilities = ["language-data-layout-and-integer-state", "language-branch-loop-control"]
mechanisms = ["sdl-ticks-deadline-and-delay-pacing"]
cognitiveTask = "predict"
scaffold = "guided"
contextFamily = "panel-clock-lab"
aidPolicy = "learning"
points = 15
prompt = "FRAME_MS is 16, the stored start is 1000, and the finishing SDL_GetTicks returns 1011. What argument reaches SDL_Delay?"
choices = ["11", "5", "16", "1016"]
answer = 1
whyWrong = "The delay is the budget's remainder after 11 ms of work, not the elapsed time, full budget, or absolute deadline."
hint = "First subtract start from finish, then subtract that elapsed value from 16."
explain = "The work consumed 11 ms, leaving a 5-ms request."

