id = "s03-l05-w1"
type = "mc"
required = true
capabilities = ["language-branch-loop-control", "language-abi-procedures-and-register-discipline"]
mechanisms = ["abi-safe-poll-update-render-loop"]
cognitiveTask = "debug"
scaffold = "independent"
contextFamily = "loop-order-review"
aidPolicy = "learning"
points = 30
prompt = "A loop samples controls, paints, then updates rectangle state. Input is correct in memory, but the picture always reflects the previous frame. Which reorder fixes the symptom without changing sampling?"
choices = ["Paint, pace, then update", "Update after sampling and before painting", "Pace before draining events", "Destroy the renderer after sampling"]
answer = 1
whyWrong = "The visible frame must consume newly updated state; pacing position and resource destruction do not repair that data-flow order."
hint = "Ask which state paint should read in the current frame."
explain = "Sampling produces intent, update applies it to the rectangles, and painting must follow so it sees those new coordinates."
