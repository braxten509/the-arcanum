points = 20
prompt = "Explain why paint_display's EAX result must be checked before calling finish_display_frame."
answer = "EAX is caller-saved and finish_display_frame returns its own value, so calling it first would overwrite the render status and could hide a render failure."
hint = "Which call owns the value currently in EAX?"

