[[lessons.exercises]]
id = "s03-l01-e1"
type = "mc"
required = true
capabilities = ["language-branch-loop-control"]
mechanisms = ["sdl-event-poll-type-and-quit-dispatch"]
cognitiveTask = "predict"
scaffold = "guided"
contextFamily = "notice-queue-lab"
aidPolicy = "learning"
points = 15
prompt = "The queue contains WINDOWEVENT, SDL_QUIT, then MOUSEMOTION. drain_notices polls until SDL_PollEvent returns 0. What state follows?"
choices = ["Only WINDOWEVENT is removed and stop_panel stays 0", "All three events are removed and stop_panel is 1", "SDL_PollEvent blocks after MOUSEMOTION", "SDL_QUIT jumps directly to SDL_Quit"]
answer = 1
whyWrong = "The procedure repeats after every returned event, PollEvent does not block on an empty queue, and the quit branch stores a flag rather than calling cleanup."
hint = "Trace one trip through .next for each queued item, then one final zero return."
explain = "Each one return removes exactly one event. The quit event sets stop_panel, the next branch continues draining, and the final zero return ends the procedure."

