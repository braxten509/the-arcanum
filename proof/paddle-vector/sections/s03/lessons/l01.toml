cognitiveTask = "debug"
scaffold = "independent"
contextFamily = "dispatch-review"
aidPolicy = "learning"
points = 30
prompt = "A close action sometimes takes several frames. GDB shows SDL_PollEvent returning 1 every frame while the program makes exactly one poll before rendering. Which repair addresses the demonstrated cause?"
choices = ["Increase the event buffer from 56 to 112 bytes", "Call SDL_Quit after every non-quit event", "Loop back to SDL_PollEvent after each returned event and leave only when it returns 0", "Read the event type before calling SDL_PollEvent"]
answer = 2
whyWrong = "The buffer already holds one complete event, cleanup is not appropriate for ordinary events, and reading before the call observes stale data."
hint = "The trace proves there is still work in the queue after the single poll."
explain = "One successful poll says only that one event was removed. Repeating until zero drains events ahead of quit and makes the close request visible in the same frame."
