# The scaffold's two placeholder palettes -- the values every new tome starts
# with. new_tome.py splices this file into the tome template, and
# validatelib/themes.py measures every authored palette against it, so a run
# that renames a placeholder without recoloring it is caught rather than shipped.
# Keep them here, not duplicated in either caller.
[[themes]]
id = "signature"
name = "TODO Signature Palette"
light = true                       # light parchment palette; omit for a dark one

[themes.vars]
bg0 = "#241609"
bg1 = "#e7d9b5"
bg2 = "#ddcda4"
bg3 = "#d3c092"
line = "#b9a67c"
line-hi = "#97815a"
tx = "#3d2b17"
tx-dim = "#6b5638"
tx-faint = "#8d7854"
ac = "#275d4d"
ac-dim = "#3e7a67"
ac-bg = "rgba(39, 93, 77, .10)"
warn = "#8a5d14"
bad = "#8e2f23"
info = "#3d4d78"
slab = "#27272b"
slab-tx = "#e3d3ac"
candle = "255, 172, 66"
sigil-1 = "#f7ffff"               # four casting inks, all visible along each bolt
sigil-2 = "#62d9dc"
sigil-3 = "#168db4"
sigil-4 = "#3d4d78"

