<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ARCANUM // LIBER VERITATIS</title>
  <!-- Load order IS the cascade. Move a file between folders freely; move a line here and something restyles. -->
  <link rel="stylesheet" href="/css/base/tokens.css">
  <link rel="stylesheet" href="/css/shell/boot.css">
  <link rel="stylesheet" href="/css/shell/hud.css">
  <link rel="stylesheet" href="/css/desk/table.css">
  <link rel="stylesheet" href="/css/desk/objects.css">
  <link rel="stylesheet" href="/css/shell/parchment.css">
  <link rel="stylesheet" href="/css/base/shared.css">
  <link rel="stylesheet" href="/css/views/home.css">
  <link rel="stylesheet" href="/css/views/lesson.css">
  <link rel="stylesheet" href="/css/views/freestyle.css">
  <link rel="stylesheet" href="/css/desk/stone.css">
  <link rel="stylesheet" href="/css/overlay/modal.css">
  <link rel="stylesheet" href="/css/overlay/menu.css">
  <link rel="stylesheet" href="/css/overlay/sigil.css">
  <link rel="stylesheet" href="/css/overlay/bindery.css">
  <link rel="stylesheet" href="/css/base/responsive.css">
  <link rel="icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23241609'/%3E%3Ctext x='2' y='12' font-family='serif' font-size='11' fill='%23e3c059'%3E%E2%9C%A6%3C/text%3E%3C/svg%3E">
</head>

<body data-theme="vellum">
  <div id="tablelight" aria-hidden="true"></div>

  <div id="boot" class="hidden">
    <div id="boot-candle" aria-hidden="true"><i class="bc-flame"></i><i class="bc-wick"></i><i class="bc-wax"></i></div>
    <pre id="boot-text"></pre>
    <button id="boot-skip" class="btn ghost">hurry on</button>
  </div>

  <div id="shell" class="hidden">
    <header id="hud">
      <div class="hud-left">
        <span class="logo">LIBER VERITATIS</span>
        <span class="hud-op" id="hud-op">— the study is quiet</span>
      </div>
      <div class="hud-right">
        <span class="hud-stat num hidden" id="hud-combo"></span>
        <button class="hud-stat as-btn" id="hud-sfx" title="Sounds of the study">
          <svg viewBox="0 0 16 16" class="ico">
            <path d="M8 1.5c2.6 0 4 1.8 4 4.2 0 2.8 1 3.7 1.8 4.4H2.2C3 9.4 4 8.5 4 5.7c0-2.4 1.4-4.2 4-4.2z"
              fill="none" stroke="currentColor" stroke-width="1.3" />
            <path d="M6.5 12.5a1.5 1.5 0 0 0 3 0" fill="none" stroke="currentColor" stroke-width="1.3" />
          </svg>
        </button>
        <button class="hud-stat as-btn" id="hud-ambience" title="The hearthfire">
          <svg viewBox="0 0 16 16" class="ico">
            <path
              d="M8 1.5c.5 2.5 3.8 3.7 3.8 7a3.8 3.8 0 0 1-7.6 0c0-1.6.8-2.6 1.6-3.6.1 1 .5 1.7 1.2 2.1C7 5.2 7.2 3.2 8 1.5z"
              fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round" />
          </svg>
        </button>
        <button class="hud-stat as-btn" id="hud-settings" title="Trim the wick — the study's settings">
          <svg viewBox="0 0 16 16" class="ico">
            <path d="M2 3.2l7.4 4.9" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" />
            <path d="M8.6 11a3 3 0 0 1 5.8 0z" fill="none" stroke="currentColor" stroke-width="1.3"
              stroke-linejoin="round" />
            <path d="M11.5 8v-1" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" />
          </svg>
        </button>
        <button class="hud-stat as-btn" id="hud-credits-btn" title="Your coin — visit the peddler">
          <svg viewBox="0 0 16 16" class="ico ico-coin">
            <circle cx="8" cy="8" r="5.5" fill="none" stroke="currentColor" stroke-width="1.4" />
            <path d="M8 4.8l.9 1.8 2 .3-1.4 1.4.3 2L8 9.4l-1.8.9.3-2L5.1 6.9l2-.3z" fill="none" stroke="currentColor"
              stroke-width="1" />
          </svg>
          <span class="num" id="hud-credits">0</span>
        </button>
        <button class="hud-stat as-btn" id="hud-rank-btn" title="Open your ledger">
          <span id="hud-rank">NOVICE SCRIBE</span>
        </button>
        <span class="hud-stat" id="save-led" title="The ink of your progress">
          <span class="led" id="led-dot"></span><span id="led-text">INK DRY</span>
        </span>
      </div>
    </header>

    <div id="table">
      <main id="parchment">
        <nav id="contents-rail" aria-label="Chapters">
          <div class="rail-head">
            <span id="side-ops-label">CHAPTERS</span>
            <span class="num" id="side-progress">0/0</span>
          </div>
          <div id="ops-list"></div>
        </nav>
        <div id="main">
          <section id="view-home" class="view"></section>
          <section id="view-section" class="view"></section>
          <section id="view-lesson" class="view"></section>
          <section id="view-freestyle" class="view"></section>
          <section id="view-shop" class="view"></section>
        </div>
      </main>

      <button id="candle" data-sfx="candle" title="Trim the wick — settings">
        <i class="c-glow"></i>
        <img class="c-object" src="/assets/desk/candle-topdown-v1.png" alt="" aria-hidden="true">
        <i class="c-live-flame c-flame" aria-hidden="true"></i>
        <i class="c-wick-anchor" aria-hidden="true"></i>
        <i class="c-hit" aria-hidden="true"></i>
        <svg class="obj-label" viewBox="0 0 230 100" aria-hidden="true">
          <path id="candle-label-arc" d="M 124 55 A 180 180 0 0 0 270 -26" fill="none" />
          <text>
            <textPath href="#candle-label-arc">TRIM THE WICK</textPath>
          </text>
        </svg>
      </button>

      <button class="desk-obj" id="obj-orb" data-sfx="orb" title="Ask the Oracle a question">
        <span class="obj-art">
          <img class="desk-image o-object" src="/assets/desk/oracle-scrying-orb-topdown-v1.png" alt=""
            aria-hidden="true">
          <i class="o-mist" aria-hidden="true"></i>
        </span>
        <span class="obj-label">THE ORACLE</span>
        <span class="obj-sub num" id="obj-orb-n"></span>
      </button>

      <button class="desk-obj" id="obj-notes" data-sfx="page" title="Re-read the Oracle's answers">
        <span class="obj-art"><img class="desk-image" src="/assets/desk/oracle-notes-topdown-v1.png" alt=""
            aria-hidden="true"></span>
        <span class="obj-label">ORACLE'S NOTES</span>
      </button>

      <button class="desk-obj" id="obj-grimoire" data-sfx="page" title="Every incantation you have mastered">
        <span class="obj-art"><img class="desk-image" src="/assets/desk/grimoire-stack-topdown-v1.png" alt=""
            aria-hidden="true"></span>
        <span class="obj-label">GRIMOIRE</span>
      </button>

      <button class="desk-obj" id="obj-satchel" data-sfx="peddler" title="The peddler's wares">
        <span class="obj-art"><img class="desk-image" src="/assets/desk/peddler-pouch-topdown-v1.png" alt=""
            aria-hidden="true"></span>
        <span class="obj-label">THE PEDDLER</span>
      </button>

      <button class="desk-obj" id="obj-letter" data-sfx="page" title="Your ledger — rank, deeds, and sigils">
        <span class="obj-art"><img class="desk-image" src="/assets/desk/ledger-envelope-topdown-v1.png" alt=""
            aria-hidden="true"></span>
        <span class="obj-label">YOUR LEDGER</span>
      </button>

      <button class="desk-obj" id="obj-wand" title="Challenge a rival to a spell duel">
        <span class="obj-art">
          <img class="desk-image" src="/assets/desk/spell-duel-wand-topdown-v1.png" alt="" aria-hidden="true">
          <i class="w-sp1" aria-hidden="true"></i><i class="w-sp2" aria-hidden="true"></i>
        </span>
        <span class="obj-label">SPELL DUEL</span>
        <span class="obj-sub num" id="obj-wand-d"></span>
      </button>

      <button class="desk-obj" id="obj-quill" data-sfx="page" title="Ask the Binder to amend this tome">
        <span class="obj-art"><img class="desk-image" src="/assets/desk/binder-quill-topdown-v1.png" alt=""
            aria-hidden="true"></span>
        <span class="obj-label">THE BINDER</span>
      </button>

      <button class="desk-obj" id="obj-tomes" data-sfx="page" title="Take another tome from the shelf">
        <span class="obj-art"><img class="desk-image" src="/assets/desk/other-tomes-topdown-v1.png" alt=""
            aria-hidden="true"></span>
        <span class="obj-label">OTHER TOMES</span>
      </button>
    </div>
  </div>

  <div id="toasts"></div>
  <div id="modal-root"></div>

  <script src="/monaco/vs/loader.js"></script>
  <script src="/tome-loader.js"></script>
  <script src="/editor.js"></script>
  <script src="/app.js"></script>
</body>

</html>
