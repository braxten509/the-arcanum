# SEPIA VELLUM — the study's baseline palette (platform-level: appears in
# TRIM THE WICK for every tome, pinned to the top of the list).
# Palette-only on purpose: no structural css — the candlelit desk stays exactly
# as the base stylesheet drew it. Folder name = skin id ("vellum") so every
# save that ever equipped the old vellum tome-theme keeps resolving.
id = "vellum"
name = "Sepia Vellum"
desc = "The study as you first found it: warm parchment, walnut ink, candle amber."
light = true
coin = "star"   # coin face: star | rune | gem | holed | serpent | sun | bolt | eye

[vars]
bg0 = "#241609"
bg1 = "#e7d9b5"
bg2 = "#ddcda4"
bg3 = "#d3c092"
line = "#b9a67c"
line-hi = "#97815a"
tx = "#3d2b17"
tx-dim = "#6b5638"
tx-faint = "#8d7854"
ac = "#275d4d"
ac-dim = "#3e7a67"
ac-bg = "rgba(39, 93, 77, .10)"
warn = "#8a5d14"
bad = "#8e2f23"
info = "#3d4d78"
slab = "#27272b"
slab-tx = "#e3d3ac"
candle = "255, 172, 66"
