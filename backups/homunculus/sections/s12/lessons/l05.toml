[[lessons]]
id = "s12-l05"
title = "The Compact Rite: Comprehensions"
body = '''
<p>You now know the "build a new list from an old one" pattern: empty list, loop, append. It is so common that Python gives it a one-line form — the <strong>list comprehension</strong>. It is not a new power, only a tighter spelling of a loop you already understand.</p>
<pre><code># the long form you already know
lengths = []
for name in models:
    lengths.append(len(name))

# the same thing, as a comprehension
lengths = [len(name) for name in models]</code></pre>
<p>Read the comprehension left to right as a sentence: "<code>len(name)</code> — for each <code>name</code> in <code>models</code>." The expression on the left is what each item becomes; the <code>for</code> part is the walk. The result is a brand-new list, the same one the four-line loop would have built.</p>
<h3>Filtering with a trailing if</h3>
<p>Add an <code>if</code> at the end to keep only some items — the "filter" loop in one line:</p>
<pre><code>costs = [8, 16, 4, 24]
small = [c for c in costs if c &lt;= 16]
print(small)              # [8, 16, 4]</code></pre>
<p>Read: "<code>c</code> — for each <code>c</code> in <code>costs</code> — if <code>c</code> is at most 16." The <code>if</code> decides which items survive into the new list; items that fail it are simply left out.</p>
<h3>Transform and filter together</h3>
<pre><code>names = ["qwen2.5", "llama3", "mistral"]
short = [n.upper() for n in names if len(n) &lt;= 6]
print(short)              # ['LLAMA3']</code></pre>
<div class="callout">A comprehension is a convenience, not an obligation. If the logic grows past a transform and a simple filter — several conditions, side effects, nested work — reach back for the plain <code>for</code> loop. Clear beats clever, and a comprehension crammed with three <code>if</code>s is harder to read than the loop it replaced.</div>
<div class="field-notes"><div class="fn-head">FIELD NOTES // YOU WILL READ THESE EVERYWHERE</div>
<p>Dataset code lives on comprehensions: <code>[format(ex) for ex in raw if valid(ex)]</code> is a whole cleaning pass in one line. You do not have to write them to survive the course, but you must be able to READ one — and now you can, because you know it is just the empty-list-loop-append rite wearing tighter clothes.</p></div>
'''

[[lessons.readings]]
label = "Python tutorial — List comprehensions"
url = "https://docs.python.org/3/tutorial/datastructures.html#list-comprehensions"
essential = true

[[lessons.readings]]
label = "Nested list comprehensions"
url = "https://docs.python.org/3/tutorial/datastructures.html#nested-list-comprehensions"

[[lessons.exercises]]
id = "s12-l05-e1"
type = "mc"
points = 22
prompt = "Which loop is <code>[len(name) for name in models]</code> the short form of?"
choices = [
  "a loop that prints each name's length",
  "an empty list, a loop appending <code>len(name)</code> for each name, producing a new list of lengths",
  "a loop that changes <code>models</code> in place",
  "a while loop counting to <code>len(models)</code>",
]
answer = 1
whyWrong = "A comprehension BUILDS a new list; it does not print and does not modify the original. It is exactly the empty-list-plus-append loop, collecting <code>len(name)</code> for each name."
explain = "<code>[len(name) for name in models]</code> is the one-line spelling of: <code>lengths = []; for name in models: lengths.append(len(name))</code>. Same new list, tighter form."
hint = "The square brackets mean a new list is being built. What does each pass contribute to it — a print, or an appended value?"

[[lessons.exercises]]
id = "s12-l05-e2"
type = "mc"
points = 22
prompt = "What does <code>[c for c in [8, 16, 4, 24] if c &lt;= 16]</code> evaluate to?"
choices = [
  "<code>[8, 16, 4, 24]</code> — the if is ignored",
  "<code>[8, 16, 4]</code> — only items that pass the trailing condition survive",
  "<code>[24]</code> — the if keeps the ones that fail",
  "<code>True</code>",
]
answer = 1
whyWrong = "The trailing <code>if</code> filters: only items for which the condition is True are kept. <code>24 &lt;= 16</code> is False, so 24 is dropped; 8, 16 and 4 remain."
explain = "The comprehension keeps each <code>c</code> for which <code>c &lt;= 16</code> is True. That admits 8, 16, and 4 and excludes 24, giving <code>[8, 16, 4]</code>."
hint = "Test each number against <code>&lt;= 16</code> and collect only the ones that pass."

[[lessons.exercises]]
id = "s12-l05-e3"
type = "mc"
points = 18
prompt = "When should you prefer a plain <code>for</code> loop over a comprehension?"
choices = [
  "Never — comprehensions are always better",
  "When the logic grows beyond a simple transform and filter — several conditions or side effects read more clearly as a loop",
  "Whenever the list has more than three items",
  "Only when the items are strings",
]
answer = 1
whyWrong = "Comprehensions are for the simple transform-and-filter case. Cramming complex, multi-condition, side-effecting logic into one only hurts readability — the loop is clearer then."
explain = "A comprehension shines for 'new list from old with a transform and maybe one filter.' Past that — multiple conditions, side effects, nested steps — the plain loop is easier to read. Clear beats clever."
hint = "The callout names the exact moment the loop wins back its place."

[[lessons.exercises]]
id = "s12-l05-e4"
type = "write"
points = 30
prompt = "Given <code>costs = [8, 16, 4, 24]</code>, use a SINGLE list comprehension with a trailing <code>if</code> to build and print the list of costs that are ≤ 16. Output must be exactly <code>[8, 16, 4]</code>."
starter = '''costs = [8, 16, 4, 24]
# one comprehension: keep costs <= 16, then print the result
small = ...   # replace ... with the [ ... for ... if ... ] comprehension
print(small)
'''
expect = "[8, 16, 4]"
hint = "<code>small = [c for c in costs if c &lt;= 16]</code> — expression <code>c</code>, walk <code>for c in costs</code>, filter <code>if c &lt;= 16</code>."

[[lessons.exercises]]
id = "s12-l05-e5"
type = "write"
points = 34
prompt = "Given <code>names = [\"qwen2.5\", \"llama3\", \"mistral\"]</code>, use one comprehension to build and print a list of the UPPER-CASE names whose length is at most 6. Output must be exactly <code>['LLAMA3']</code>."
starter = '''names = ["qwen2.5", "llama3", "mistral"]
# one comprehension: upper-case each name, but keep only those with len <= 6
'''
expect = "['LLAMA3']"
hint = "<code>[n.upper() for n in names if len(n) &lt;= 6]</code>. Only <code>llama3</code> has length ≤ 6 (qwen2.5 and mistral are 7), so it alone survives, upper-cased."
