[freestyle]
title = "THE WORKING: THE FITTING LIST"
brief = "Given a list of candidate models — each a small record of a name and its VRAM cost in GB — walk the list and print only those that fit a 16 GB budget, one per line, as <code>name (N GB)</code>.<ul><li>Hold the candidates in a list (of dicts or of tuples — your choice).</li><li>Use a <code>for</code> loop to visit each candidate.</li><li>Use an <code>if</code> to keep only those whose cost is ≤ 16, and an f-string to format each kept line.</li></ul>"
reward = 200
xray = "This is where the tongue becomes useful: a loop, a filter, and formatted output — the skeleton of every dataset pass in the course. Dock a solution that hardcodes the surviving names instead of computing them from the loop, or that prints all candidates without the budget filter. Reward a loop that would still be correct if a sixth candidate were added to the list."

[freestyle.badge]
id = "s12-badge"
name = "THE LIST WALKED"
desc = "Awarded for filtering a collection with a loop and a condition — the shape of every dataset pass."

[[freestyle.rubric]]
criterion = "A real collection"
weight = 30
desc = "The candidates live in a list that the code iterates — not a series of separate variables or hardcoded print lines."

[[freestyle.rubric]]
criterion = "Loop + filter"
weight = 40
desc = "A <code>for</code> loop visits every candidate and an <code>if</code> keeps only those within the 16 GB budget, computed from the data."

[[freestyle.rubric]]
criterion = "Formatted output"
weight = 30
desc = "Each surviving line is built with an f-string as <code>name (N GB)</code>, drawing both pieces from the current item."
