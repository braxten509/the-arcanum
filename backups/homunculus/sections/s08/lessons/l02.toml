[[lessons]]
id = "s08-l02"
title = "The System Prompt Lever"
body = '''
<p>The third rite of this chapter established the three layers of the ward: base model, alignment fine-tuning, and system prompt. Of these three, the system prompt is the only one the artificer can rewrite in seconds — no GPU hours, no dataset curation, no weight surgery. This rite teaches what the system prompt can and cannot do, how it interacts with the chat template the sixth rite's template lesson taught, and how to write one that actually shapes the homunculus's behavior toward a specific task.</p>

<p>The system prompt works by <strong>biasing the activation distribution</strong>. When the model processes the token sequence <code>&lt;|im_start|&gt;system\nYou are a helpful, harmless assistant.&lt;|im_end|&gt;</code>, the attention mechanism attends to the tokens "helpful" and "harmless" early in the sequence, and those tokens shape the hidden-state representations that flow through every subsequent transformer layer. By the time the model reaches the user's actual query, its internal state has already been tilted toward the helpful-harmless region of the learned distribution — the same way the fourth rite's sampling lesson showed that raising temperature flattens the token-probability curve, the system prompt shifts the curve's peak toward a different semantic neighborhood. The sixth rite's <code>apply_chat_template</code> function — the same one the RAG prompt builder in the grimoire chapter called — places the system message at the very beginning of the sequence for exactly this reason: the earliest tokens have the longest reach through the attention layers, giving the system prompt maximal influence over the entire generation.</p>

<p>What the system prompt <strong>can</strong> control: tone and persona (formal vs casual, clinical vs warm), task framing ("you are a style assistant" vs "you are a general chat partner"), refusal boundaries for borderline cases — a model that would refuse "how do I format my Notion page?" under a generic assistant prompt may answer under a prompt that explicitly frames the task as document styling. The system prompt can also set explicit permission grants: <code>"You may discuss formatting conventions, typography, CSS properties, and Notion-specific features. You should not provide medical, legal, or financial advice."</code> This permission set works because the alignment-trained model is looking for cues about what the user wants — the system prompt is the strongest cue available.</p>

<p>What the system prompt <strong>cannot</strong> control: it cannot override deep alignment weights that were trained on millions of labeled preference pairs. A model whose RLHF training heavily penalized instruction-giving for any request containing the word "weapon" will refuse even with a system prompt that says "you are a weapons historian" — the alignment weights are a structural bias, and the system prompt is a surface-level nudge. It cannot make a base model refuse — a base model has no alignment weights for the system prompt to interact with, so a system prompt about "harmlessness" means nothing to it. And it cannot reliably prevent adversarial prompts — a system prompt is a text prefix, and a cleverly constructed user message can exploit the tension between "be helpful" and "be harmless" that alignment training baked into the same set of weights.</p>

<p>The practical recipe for the homunculus's system prompt: name the task explicitly (<code>"You are a Notion style assistant."</code>), define the domain (<code>"You answer questions about formatting, typography, layout conventions, and Notion-specific features."</code>), state the refusal boundary positively (<code>"If a request falls outside document styling, redirect to formatting advice instead of refusing."</code>), and reference the source material the RAG pipeline will inject (<code>"When reference material is provided, ground your answers in it and cite the reference id."</code>). The grimoire chapter's retrieval pipeline already built the formatting half — the system prompt is the instruction half. Together they form the complete prompt the homunculus receives before every generation.</p>

<div class="field-notes"><div class="fn-head">FIELD NOTES // SYSTEM PROMPT GRAMMAR — THREE PATTERNS THAT ACTUALLY SHIFT BEHAVIOR</div>
<p>Not all system prompts are equal. A vague prompt ("be helpful") is barely above the model's default distribution; a precise prompt that names the task, the domain, and the boundary is a real control surface. Three patterns consistently produce measurable shifts. <strong>Role anchoring</strong>: "You are X who does Y" — the model's alignment training taught it that role descriptions precede domain-appropriate behavior, so naming the role activates the associated response distribution. <strong>Permission enumeration</strong>: "You may discuss A, B, C. You should not discuss D, E, F." — the model was trained to respect explicit permission lists because RLHF preference data frequently includes requests with scope boundaries. <strong>Redirection over refusal</strong>: "If a request falls outside your domain, redirect to a related formatting topic" — this exploits the model's helpfulness training: refusing is a negative-outcome action (the annotator marked it as less preferred than a helpful redirect), so the model prefers the redirect path when it is available. The worst system prompt is no system prompt at all — an instruct model without a system message defaults to its most generic "helpful assistant" persona, which is the least specific and most refusal-prone distribution.</p></div>
'''
body_words = 550

