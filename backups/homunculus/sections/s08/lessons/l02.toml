[[lessons.exercises]]
id = "s08-l02-e5"
type = "type"
points = 12
reps = 2
code = '''# The three system prompt patterns from the FIELD NOTES:
def build_system_prompt(role, permissions, redirect):
    """Assemble a system prompt from the three patterns."""
    prompt = f"You are a {role}.\\n"
    prompt += f"You may discuss: {', '.join(permissions)}.\\n"
    prompt += f"If a request falls outside your domain, {redirect}."
    return prompt

# Build the homunculus's prompt:
prompt = build_system_prompt(
    role="Notion style assistant",
    permissions=["formatting", "typography", "layout conventions", "Notion features"],
    redirect="redirect to a related formatting topic instead of refusing",
)
print(prompt)'''

