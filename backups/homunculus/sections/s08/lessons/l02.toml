[[lessons.exercises]]
id = "s08-l02-e3"
type = "mc"
points = 20
prompt = "Per this rite, why does the ChatML template place the system message at the very beginning of the token sequence?"
choices = [
  "The <|im_start|> token is a special control code that the model's final linear layer interprets as a routing instruction — it must appear first in the sequence or the attention mechanism routes all subsequent tokens through the wrong output head",
  "The earliest tokens in a sequence have the longest reach through every subsequent attention layer — they influence the hidden-state representations that flow through every transformer block after them, so placing the behavioral framing early maximizes its effect on the entire generation; the fourth and ninth rites both called apply_chat_template with the system message first for exactly this reason",
  "The system prompt must be processed before any user content because the model's KV-cache needs to be pre-filled — if the user message appears first, the KV-cache is initialized with the wrong positional encodings, and the attention scores for the system prompt tokens become zero",
  "ChatML was designed by OpenAI specifically for GPT-4, and the system-first convention is a model-architecture requirement of GPT-4's sparse attention pattern — other models (Llama, Mistral) can place the system message anywhere in the sequence with no difference in behavior"
]
answer = 1
whyWrong = "ChatML tokens like <|im_start|> are ordinary tokens processed through the same attention layers as any other token — there is no special routing head, and no model uses a 'control code' mechanism in the final linear layer. The KV-cache is not 'pre-filled' by the system prompt — it accumulates during autoregressive generation, and the order of tokens in the prompt affects attention patterns, not cache initialization. And the system-first convention is NOT GPT-4-specific — Llama, Mistral, and every chat-model family places the system message first because the attention mechanism is universal: early tokens attend to all later tokens, while later tokens attend backward. The earliest position is the highest-leverage position in any transformer architecture, not a model-specific quirk."
hint = "The lesson says 'the earliest tokens have the longest reach through the attention layers, giving the system prompt maximal influence over the entire generation.' The correct choice connects this to the causal attention mechanism: every later token attends to every earlier token, so the system prompt — which is earlier than everything else — influences the eventual generation everywhere."
explain = "In causal (autoregressive) attention, each token can attend to itself and all preceding tokens. Token 1 (the first system prompt token) is attended to by token 2, token 3, ..., token N — every subsequent token 'sees' it. Token N (the last user-query token) is attended to only by the generation tokens that follow it. The earlier a token appears in the sequence, the more downstream computation it influences. Placing the system prompt at position 1 maximizes its leverage: it shapes the model's internal state for the entire conversation, and every generated token is conditioned on it."

