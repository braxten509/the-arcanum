[[lessons.exercises]]
id = "s08-l02-e1"
type = "mc"
points = 20
prompt = "Per this rite, why can't a system prompt make a base model (pre-alignment) refuse harmful requests?"
choices = [
  "A system prompt works by interacting with alignment-trained weights that encode the 'refuse' response pattern — the base model has no such weights because it was never trained on preference data; the system prompt's role-framing tokens activate pathways that don't exist in the base model's weight space, so the prompt is processed as ordinary text with no behavioral effect beyond what any text prefix would produce",
  "The base model's tokenizer strips system messages from the input before the model processes them — the ChatML special tokens <|im_start|> and <|im_end|> are not in the base model's vocabulary, so the system prompt is tokenized as unknown tokens and ignored during inference",
  "The base model's context window is too short to include both a system prompt and a user query — base models were trained with shorter sequence lengths, and adding a system prompt exceeds the positional embedding limit",
  "Base models use a different chat template format (Alpaca instead of ChatML) — the system prompt is placed in a different position in the sequence, and the model was not trained to attend to that position as a behavioral cue"
]
answer = 0
whyWrong = "Base model tokenizers DO include ChatML tokens (the vocabulary is shared — instruct and base models of the same family use the same tokenizer), context windows of base and instruct models are identical (same architecture, same max sequence length), and the chat template format is a prompt-construction convention, not a model property (any model can receive tokens in any order — the instruct model was just trained to interpret certain orders as role-structured). The real reason: a system prompt works by activating alignment-trained weight patterns. The base model has no RLHF/DPO weights that encode 'when the system says I am an assistant, I should behave helpfully and refuse harmful requests' — the system prompt's framing tokens land on weight pathways that are still raw next-token predictors, so the prompt is treated as more text to complete, not as a behavioral instruction."
hint = "The lesson says 'a base model has no alignment weights for the system prompt to interact with, so a system prompt about harmlessness means nothing to it.' The correct choice explains that the system prompt works by engaging alignment-trained pathways that don't exist in the base model."
explain = "This is the core architectural difference between base and instruct models. An instruct model's weights contain two overlapping distributions: the base completion distribution and the alignment-shaped response distribution. The system prompt tokens activate the latter — they bias the model toward the 'assistant' region of the weight space. A base model has only the completion distribution — the system prompt tokens are just more text, and the model continues them the same way it would continue any prefix. The lesson's third rite already established that the ward sits in the alignment layer; this exercise tests whether the artificer understands that the system prompt lever only works if there is an alignment layer for it to engage."

