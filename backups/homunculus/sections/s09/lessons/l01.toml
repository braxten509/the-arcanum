[[lessons]]
id = "s09-l01"
title = "The Merge — Sealing the Seam"
body = '''
<div class="callout"><strong>Mostly terminal, a little Python.</strong> This chapter seals the finished model, and most of its real work is shell commands you run in your own workspace (<code>convert_hf_to_gguf.py</code>, <code>llama-quantize</code>, <code>ollama create</code>) — you type those as shown, no Python needed. The tome's write exercises are two familiar kinds from Chapters I–II: <em>size arithmetic</em> (multiply a parameter count by bytes, divide to GB, and round for display with <code>round(x, 1)</code>) and <em>string assembly</em> (build a Modelfile or a ChatML prompt line by line with f-strings). Given data in, computed text or number out.</div>
<p>At the seventh rite's end, the bind was a seam — two small matrices riding alongside frozen base weights, computed on the fly at every forward pass. At this rite's beginning, the seam must close. <code>merge_and_unload()</code> performs the operation the binding rite set up: it converts the low-rank adapter matrices into a single, conventional weight matrix that no longer requires PEFT to load. The artificer who understands what the merge computes — and what it permanently discards — can seal the bind deliberately rather than by default.</p>

<p>The merge is a mathematical precomputation, not a serialization trick. For every linear layer that received a LoRA adapter — the target modules the seventh rite configured (<code>q_proj</code>, <code>v_proj</code>, <code>k_proj</code>, <code>o_proj</code>) — PEFT stored two small matrices A and B alongside the original frozen weight W. During training, only A and B received gradient updates; W remained frozen. At inference, the effective weight was computed on the fly: the transformer block computes <code>h = W·x + (B·A)·x</code>, where the second term is the adapter's low-rank contribution. <code>merge_and_unload()</code> precomputes this sum: <strong>W_new = W + BA</strong>. The outer-product BA is added pointwise to the original weight matrix W, producing a single new weight matrix that encodes both the base model's knowledge and the adapter's learned style shift. The adapter matrices A and B are then discarded — they have been absorbed. The forward pass becomes <code>h = W_new·x</code>: a standard dense matrix multiply with no adapter term to compute.</p>

<p>Three gains follow. First, the merged model is a standard <code>transformers</code> model: <code>AutoModelForCausalLM.from_pretrained(merged_path)</code> loads it without PEFT, without <code>LoraConfig</code>, without any adapter-awareness — it is an ordinary pretrained model as far as the Hugging Face ecosystem is concerned. Second, the llama.cpp conversion tool in the next lesson reads standard Hugging Face files — it cannot read PEFT adapters, so the merge is a prerequisite for the GGUF conversion chain that ultimately delivers the homunculus to the shelf. Third, inference is fractionally faster: one matrix multiply per adapted layer instead of one multiply plus one low-rank addition. The cost is one and irreversible: the adapter A and B matrices are gone from the merged directory. The seventh rite's checkpoint discipline — save the adapter separately before merging — is the insurance policy. If the twelfth rite's long-term monitoring reveals a regression, the artificer returns to the pre-merge adapter checkpoint and retrains. The merge consumes a copy; it does not destroy the original.</p>

<p>The procedure is two lines of substance. Load the base model with the adapter attached — the same <code>PeftModel.from_pretrained(base_model, adapter_path)</code> pattern the eighth rite's evaluation scripts used. Call <code>model = model.merge_and_unload()</code>. Then save the sealed vessel: <code>model.save_pretrained(merged_path)</code> and <code>tokenizer.save_pretrained(merged_path)</code>. The tokenizer was never touched by the adapter — the sixth rite's chat-template lesson kept the adapter format-agnostic — but the GGUF converter expects tokenizer files alongside the weights, so they must be copied. The merged directory now contains the standard Hugging Face inventory: <code>config.json</code>, <code>model.safetensors</code>, <code>tokenizer.json</code>, <code>tokenizer_config.json</code>, and <code>special_tokens_map.json</code>. This is the vessel sealed — a single directory that any tool in the Hugging Face ecosystem can load, and the input to every remaining step of this rite.</p>

<div class="field-notes"><div class="fn-head">FIELD NOTES // MERGE PRECISION — WHAT THE QUANTIZED BASE BECOMES</div>
<p>If the seventh rite's binding loaded the base in 4-bit (<code>BitsAndBytesConfig(load_in_4bit=True)</code> — the nf4 path), <code>merge_and_unload()</code> dequantizes it first: the merged model is full precision (FP16 or BF16, depending on <code>torch_dtype</code>). The merged checkpoint is therefore <strong>larger</strong> than the adapter but equal to the original full-precision base — approximately <code>params × 2 bytes</code>. An 8B model produces a ~16 GB safetensors file after the merge, which the third lesson's quantization step will shrink back down. For multi-adapter workflows: if <code>PeftModel</code> loaded multiple adapters (different binds for different styles), pass <code>adapter_name="my_adapter"</code> to <code>merge_and_unload()</code> to select which bind to seal. The merge is always performed on a copy of the base weights — the original adapter directory is not modified, and the <code>PeftModel</code> instance in memory is the only artifact affected. The merged weights are functionally identical to the adapter-augmented forward pass up to floating-point rounding — the output of <code>merged_model.generate()</code> and <code>peft_model.generate()</code> on the same prompt should produce byte-identical tokens when <code>do_sample=False</code>.</p></div>
'''
body_words = 515

