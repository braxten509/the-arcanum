prompt = "Compute the merged model's disk size. A base model has <code>params = 8_000_000_000</code> parameters. After merge_and_unload(), every parameter is stored at <code>bytes_per_param = 2</code> (FP16/BF16). Print <code>MERGED &lt;v&gt; GB</code> where &lt;v&gt; is the total size in GB, rounded to one decimal place. Compute from the parameters — don't hardcode. (1 GB = 1_000_000_000 bytes.)"
starter = '''params = 8_000_000_000
bytes_per_param = 2

# Compute total bytes: params * bytes_per_param
# Convert to GB: total_bytes / 1_000_000_000
# Print MERGED <v> GB rounded to one decimal place

print("MERGED 0.0 GB")
'''
expect = "MERGED 16.0 GB"
hint = "total_bytes = 8_000_000_000 * 2 = 16_000_000_000 bytes. size_gb = 16_000_000_000 / 1_000_000_000 = 16.0 GB. Use round(size_gb, 1) and print with f'MERGED {round(size_gb, 1)} GB'. The adapter overhead is negligible — the merged model stores all base parameters at full precision."
