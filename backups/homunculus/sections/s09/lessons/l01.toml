[[lessons.exercises]]
id = "s09-l01-e1"
type = "type"
points = 12
reps = 2
code = '''import torch
from transformers import AutoModelForCausalLM, AutoTokenizer
from peft import PeftModel

# Load the base model, attach the adapter, merge, and save:
base_path = "meta-llama/Llama-3.1-8B"
adapter_path = "./my-homunculus-adapter"
merged_path = "./homunculus-merged"

base = AutoModelForCausalLM.from_pretrained(
    base_path, torch_dtype=torch.bfloat16
)
model = PeftModel.from_pretrained(base, adapter_path)
model = model.merge_and_unload()

tokenizer = AutoTokenizer.from_pretrained(base_path)
model.save_pretrained(merged_path)
tokenizer.save_pretrained(merged_path)
print(f"Vessel sealed at {merged_path}")'''

[[lessons.exercises]]
id = "s09-l01-e2"
type = "mc"
points = 20
prompt = "Per this rite, what computation does <code>merge_and_unload()</code> perform on every LoRA-adapted layer, and what is irreversibly lost?"
choices = [
  "It serializes the adapter matrices A and B into a separate binary file alongside the base weights and modifies <code>config.json</code> to reference that file at load time — the weight matrix W is never modified; the adapter is merely stored as a companion artifact and the loader recombines them at inference",
  "It replaces the base model's frozen weights W entirely with the adapter's learned weights BA and discards the original W — the merged model contains only the adapter's contribution, because the base knowledge was already transferred to the adapter matrices during training and the original weights are redundant",
  "It computes W_new = W + BA — the outer product of the two low-rank adapter matrices is added pointwise to the frozen base weight, producing a single unified weight matrix. The adapter matrices A and B are discarded because their contribution has been absorbed into W_new, and the forward pass becomes a single dense matrix multiply with no adapter term",
  "It concatenates the adapter matrices to the weight matrix along the hidden dimension — W becomes a wider matrix [W | BA], and the model architecture is modified to split the input vector, route one half through W and the other through BA, then sum the results. The matrices A and B are retained in the merged model as separate parameter groups"
]
answer = 2
whyWrong = "merge_and_unload does not create a separate adapter file (it modifies the model's state dict in memory — the adapter is absorbed, not stored alongside), does not discard the base weights (BA is a low-rank delta — typically rank 8 or 16 applied to a 4096×4096 matrix; the adapter cannot encode the base model's knowledge, only a small shift on top of it), and does not concatenate or reshape matrices (the weight dimensions stay unchanged — a 4096×4096 matrix stays 4096×4096, and the model's architecture is not modified). The correct answer: W_new = W + BA — a pointwise addition that bakes the adapter's delta into the base weights and removes the need for the separate A and B matrices."
hint = "The lesson states the formula explicitly: 'W_new = W + BA. The outer-product BA is added pointwise to the original weight matrix W.' The correct choice names this formula and explains that the adapter matrices are absorbed — not stored alongside, not concatenated, and not a replacement of the base weights."
explain = "Every LoRA-adapted linear layer in the merged model has one weight matrix where it previously had three (W, A, B). The forward pass h = W·x + (B·A)·x becomes h = W_new·x — identical output up to floating-point rounding, but computed with one matrix multiply instead of one multiply plus a low-rank add. The merge is a precomputation: the adapter's contribution is baked into the weights at seal time rather than computed at every forward pass. The trade-off is that the adapter can no longer be separated or swapped — the bind is permanent on this copy."

