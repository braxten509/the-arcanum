[[lessons]]
id = "s09-l02"
title = "The Conversion — Hugging Face to GGUF"
body = '''
<p>The sealed vessel from the first lesson is a standard Hugging Face directory — the same format the fourth rite's model-loading lesson used. But the delivery format for the homunculus is GGUF: the single-file, metadata-rich format that Ollama, llama.cpp, and the local serving ecosystem expect. The fifth rite's memory-budget lesson catalogued the GGUF quant-level naming convention (<code>q4_k_m</code>, <code>q8_0</code>). This lesson converts the Hugging Face directory into an unquantized GGUF file — the intermediate artifact that feeds the quantization step in the next lesson.</p>

<p>The conversion tool is <code>convert_hf_to_gguf.py</code>, distributed with llama.cpp. Its job is straightforward but exact: read every tensor from the Hugging Face safetensors files (or PyTorch <code>.bin</code> files), write them into a single GGUF binary, and encode the model's configuration — architecture type, hidden size, layer count, vocabulary, tokenizer — as key-value metadata in the GGUF header. The artifact it produces is a self-contained file: one <code>.gguf</code> file that carries the model weights, the tokenizer vocabulary, and the configuration metadata the inference engine needs to reconstruct the model architecture at load time. No separate <code>config.json</code>, no <code>tokenizer.json</code>, no directory of sharded safetensors files — the GGUF is the whole vessel in one file.</p>

<p>The conversion command for the homunculus: <code>python3 convert_hf_to_gguf.py ./homunculus-merged --outfile homunculus-f16.gguf --outtype f16</code>. The <code>--outtype</code> flag controls the output precision: <code>f16</code> preserves the merged model's FP16/BF16 weights unchanged; <code>f32</code> converts to float32 (unnecessary here — the merge already produced half-precision, and quantization to 4-bit in the next lesson will discard most of this information anyway). The converter reads the model's <code>config.json</code> to determine the architecture family (Llama, Mistral, Gemma — the converter knows how to map each architecture's tensor names to the GGUF layout) and the tokenizer files to embed the vocabulary. A misconfigured tokenizer path — pointing at the wrong directory, or a directory where the tokenizer was saved from a different base — produces a GGUF whose vocabulary does not match its weights: a vessel whose label names a different potion than the one inside. The symptoms surface only at serving time, when the model produces garbled or repetitive tokens because the vocabulary it uses to decode output ids does not correspond to the token sequences the weights were trained to produce.</p>

<p>The GGUF format partitions the file into two sections. The <strong>metadata header</strong> is a sequence of typed key-value pairs: <code>general.architecture = "llama"</code>, <code>llama.context_length = 8192</code>, <code>llama.embedding_length = 4096</code>, <code>llama.block_count = 32</code>, <code>tokenizer.ggml.model = "llama"</code>, and dozens of others — enough for the inference engine to reconstruct the model's architecture and vocabulary without referencing any external config file. The <strong>tensor data</strong> follows the metadata: a flat sequence of weight tensors in GGML format, ordered as the llama.cpp runtime expects (attention projection weights per layer, then MLP weights, then output head and embedding). The conversion tool handles the ordering automatically, but knowing the structure matters when the artificer needs to inspect a GGUF file: the <code>gguf</code> Python library's <code>GGUFReader</code> can dump the metadata keys and tensor shapes without loading the entire model into memory.</p>

<p>After conversion, the artificer should verify the output before trusting it as input to quantization. The GGUF file's size should be approximately <code>params × bytes_per_param + header_overhead</code> — the same computation the first lesson's lab performed. An 8B-parameter model at FP16 produces roughly a 16 GB GGUF file. A significantly different size suggests a conversion failure: the wrong <code>--outtype</code>, a missing tensor safetensors shard, or a tokenizer mismatch that the converter silently handled by embedding a truncated vocabulary. The third rite's one-job-per-tool discipline applies: verify the conversion output (file size, metadata keys, vocabulary size) before proceeding — the quantization step will shrink the file by 4×, and a mistake at this stage is compressed but not corrected by that shrinkage.</p>

<div class="field-notes"><div class="fn-head">FIELD NOTES // GGUF INSPECTION — READING METADATA WITHOUT LOADING THE MODEL</div>
<p>The <code>gguf</code> Python package (pip-installable as <code>gguf</code>) provides <code>GGUFReader</code> for metadata-only inspection. To verify a conversion output: <code>from gguf import GGUFReader; reader = GGUFReader("homunculus-f16.gguf")</code>. <code>reader.fields</code> is a dict of all metadata key-value pairs; filter for architecture keys with <code>{k: v for k, v in reader.fields.items() if "block_count" in k or "context" in k or "embedding" in k}</code>. Check that <code>block_count</code> matches the original model's layer count and <code>context_length</code> matches what the fifth rite's KV-cache math assumed. Common conversion failures: the converter cannot find <code>tokenizer.model</code> because the merged directory contains only <code>tokenizer.json</code> (some architectures, notably Llama, originally use SentencePiece <code>.model</code> files); the fix is to pass <code>--vocab-dir</code> pointing at the tokenizer directory, or to copy the correct file into the merged directory before conversion. The GGUF metadata header also records the conversion tool version — <code>general.conversion_commit</code> — which is useful when debugging quantization artifacts that may be converter-version-dependent.</p></div>
'''
body_words = 525

