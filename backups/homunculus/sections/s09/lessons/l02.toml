[[lessons.exercises]]
id = "s09-l02-e4"
type = "type"
points = 12
reps = 2
code = '''# Convert the merged Hugging Face model to GGUF format:
# The command (run in the terminal, not Python):
# python3 convert_hf_to_gguf.py ./homunculus-merged \\
#     --outfile homunculus-f16.gguf \\
#     --outtype f16

# Verify the output GGUF's metadata header:
from gguf import GGUFReader

reader = GGUFReader("homunculus-f16.gguf")
keys = ["general.architecture", "llama.block_count",
        "llama.context_length", "llama.embedding_length"]
for key in keys:
    if key in reader.fields:
        print(f"{key} = {reader.fields[key]}")'''

[[lessons.exercises]]
id = "s09-l02-e5"
type = "write"
points = 33
prompt = "Compute the unquantized GGUF file size. The merged model has <code>params = 7_000_000_000</code> parameters stored at <code>bytes_per_param = 2</code> (FP16). The GGUF metadata header adds <code>header_size = 1_048_576</code> bytes (1 MB). Print <code>SIZE &lt;v&gt; GB</code> where &lt;v&gt; is the total GGUF file size in GB, rounded to one decimal place. Compute from the parameters, don't hardcode. (1 GB = 1_000_000_000 bytes.)"
starter = '''params = 7_000_000_000
bytes_per_param = 2
header_size = 1_048_576

# Compute: tensor_bytes = params * bytes_per_param
# total_bytes = tensor_bytes + header_size
# total_gb = total_bytes / 1_000_000_000
# Print SIZE <v> GB rounded to one decimal place

print("SIZE 0.0 GB")
'''
expect = "SIZE 14.0 GB"
hint = "tensor_bytes = 7_000_000_000 * 2 = 14_000_000_000 bytes. total_bytes = 14_000_000_000 + 1_048_576 = 14_001_048_576 bytes. total_gb = 14_001_048_576 / 1_000_000_000 ≈ 14.001. round(total_gb, 1) = 14.0 GB. The 1 MB header is negligible against 14 GB of weights — it pushes the total from exactly 14.0 to 14.001, which still rounds to 14.0."
