[[lessons.exercises]]
id = "s09-l02-e1"
type = "mc"
points = 20
prompt = "Per this rite, what does <code>convert_hf_to_gguf.py</code> produce, and what distinguishes a GGUF file from the Hugging Face directory format it reads?"
choices = [
  "It produces a directory of JSON metadata files annotated with quantization parameters — GGUF is a configuration overlay format that supplements Hugging Face directories with additional metadata while keeping the weights in safetensors format; the GGUF files only reference the sharded safetensors without duplicating the tensor data",
  "It produces a single binary file encoding the model configuration as key-value metadata in a header followed by the weight tensors in GGML format — the tokenizer vocabulary is embedded in the metadata as well, making the GGUF file a self-contained artifact that needs no external config.json, tokenizer.json, or safetensors files to reconstruct the model at load time",
  "It produces a compiled shared library (.so/.dll) that links the model weights as static arrays into an executable — GGUF is an ahead-of-time compilation step that eliminates Python dependency from inference by converting the model into native code, and the resulting binary can be loaded with dlopen at serving time",
  "It produces a SQLite database file that stores weights as BLOB columns indexed by layer name and parameter type — the GGUF format uses a relational schema to enable selective weight loading, where the inference engine queries only the layers needed for the current generation step"
]
answer = 1
whyWrong = "GGUF is not a configuration overlay (it contains the actual weight tensors, not references to external safetensors files — the weights are in the GGUF file itself), not a compiled library (GGUF is a data format, not executable code — llama.cpp or Ollama reads the GGUF at runtime and loads weights into GPU memory; the file does not contain machine instructions), and not a SQLite database (GGUF uses a custom binary layout: a key-value metadata header followed by a flat tensor data section — there is no relational schema, no BLOB columns, and no SQL query engine). The correct answer: GGUF is a single self-contained file — metadata header + tensor data — with the tokenizer vocabulary baked into the metadata."
hint = "The lesson describes GGUF as 'a self-contained file: one .gguf file that carries the model weights, the tokenizer vocabulary, and the configuration metadata the inference engine needs to reconstruct the model architecture at load time.' The correct choice identifies the single-file, self-contained nature of GGUF — no external config, no external tokenizer, no directory structure."
explain = "This self-containment is GGUF's primary design goal. A Hugging Face model directory may contain dozens of files (sharded safetensors, multiple JSON configs, tokenizer files, generation config, etc.). A GGUF file is exactly one file that can be moved, copied, and served without any companion artifacts — the llama.cpp runtime and Ollama both read a single GGUF path and reconstruct the model entirely from its contents. This simplification is load-bearing for local serving: it means the artificer's homunculus is a single file they can archive, transfer, and version with ordinary file tools."

