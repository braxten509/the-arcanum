[[lessons]]
id = "s09-l06"
title = "The First Pour — Serve & Verify"
body = '''
<p>Nine rites have poured their contents into a single quantized GGUF file and a Modelfile that labels it. Two commands remain: one to register the vessel with the local serving daemon, and one to prove that the poured familiar answers the way the artificer designed it to. This final lesson of the eleventh rite delivers the homunculus to the shelf — a model the artificer can summon with a single command, on their own hardware, speaking in their own voice, grounded in their own reference material.</p>

<p>The registration command: <code>ollama create homunculus -f Modelfile</code>. Ollama reads the Modelfile, locates the GGUF file specified in the <code>FROM</code> directive, parses the metadata header to determine the model architecture and tokenizer, and registers the model under the name <code>homunculus</code> in its local model registry. The model weights are not copied — Ollama reads them from the GGUF file's current location, so moving or deleting the GGUF after creation will break the model. Confirm registration with <code>ollama list</code>: the homunculus should appear alongside any other models the artificer pulled during the fourth rite's model-exploration lesson. The summoning command: <code>ollama run homunculus</code>. This loads the model into GPU memory, applies the PARAMETER settings from the Modelfile, wraps the conversation in the TEMPLATE format, prepends the SYSTEM prompt, and begins an interactive session — the same interface the fourth rite taught with downloaded models like <code>llama3.1:8b</code>, now serving the artificer's own creation.</p>

<p>But the homunculus is not finished because it runs — it is finished because it works. The verification loop the eighth rite established — measure before trusting, test against held-out prompts — applies with special force here because the sealing pipeline involves three lossy transformations in series: merge (absorbing the adapter into the base and discarding the adapter matrices), quantization (reducing weight precision from 16-bit to ~4.5 effective bits), and format conversion (Hugging Face to GGUF). Each step is silent about quality — merge_and_unload does not report a perplexity score, llama-quantize does not report a style-fidelity metric, and convert_hf_to_gguf.py does not validate that the tokenizer vocabulary produces coherent token sequences for the model's expected inputs. The cumulative quality loss across all three steps can only be measured at the endpoint, by testing the served model against the same held-out prompts the proving rite used.</p>

<p>The verification should check three dimensions. <strong>Refusal rate:</strong> run the sixth rite's curated held-out prompts through the served homunculus and classify each response with the same refusal-keyword check the tenth rite's fourth lesson taught (<code>"i can't"</code>, <code>"as an ai"</code>, etc.). The refusal rate should match the tenth rite's documented expectation — under 15% for the moderate-to-loose ward the artificer chose. A higher refusal rate means the system prompt or inference parameters are too restrictive; a zero refusal rate on genuinely edge-case prompts means the ward is too loose. <strong>Answer quality:</strong> for the non-refused responses, judge whether the answer addresses the formatting question correctly — the same judgment the eighth rite's evaluation scripts performed on the raw adapter outputs. The served model's answer quality should not be substantially worse than the unquantized merged model's quality on the same prompts. A noticeable degradation means the quantization level is too aggressive. <strong>Style fidelity:</strong> does the homunculus sound like the artificer's Notion notes — the "sounds like me" criterion the proving rite measured with cosine similarity? This is the most subjective dimension, but it is also the most important: the entire binding, proving, and sealing pipeline was designed to produce a model that writes the way the artificer writes. If the served homunculus produces grammatically correct but impersonally generic answers, the binder was too weak — the adapter didn't shift the base's style enough — and the twelfth rite's re-trainable pipeline will iterate.</p>

<p>Three commands, three checks, and the homunculus is on the shelf. <code>ollama create</code> — registers it. <code>ollama run</code> — summons it. <code>ollama list</code> — confirms it. The tenth and final rite will teach the artificer to keep the homunculus alive as the corpus grows — to version adapters, automate re-distillation, and monitor drift. But the vessel is poured: the artificer can now type <code>ollama run homunculus</code> and converse with their own model, trained on their own notes, grounded in their own references, running on their own hardware. This is what the third rite's promise — "a personal local AI" — looks like at the end of nine rites.</p>

<div class="field-notes"><div class="fn-head">FIELD NOTES // THE SERVING-TIME DIAGNOSTIC — OLLAMA'S HIDDEN QUALITY CHECKS</div>
<p>Ollama provides several commands for inspecting a served model beyond basic interaction. <code>ollama show homunculus</code> prints the model's metadata — parameter count, quantization level, context length, and the Modelfile contents — without loading the model into GPU memory. Use it to verify that the <code>create</code> command registered the correct configuration. <code>ollama show homunculus --modelfile</code> prints the Modelfile exactly as Ollama parsed it; check that the SYSTEM prompt appears complete (no silent truncation) and that the TEMPLATE's Go template syntax was interpreted correctly (no literal <code>{{ .System }}</code> text in the output). <code>ollama run homunculus --verbose</code> adds per-token timing and token-count information after each generation, useful for diagnosing performance regressions: a model that generates at 5 tokens/second when the unquantized FP16 version generated at 20 tokens/second suggests a quantization or backend configuration problem. If GPU acceleration is not working — the model runs on CPU instead — the output rate drops to 1–2 tokens/second, and the fix is the third rite's toolchain verification: confirm <code>HSA_OVERRIDE_GFX_VERSION=12.0.1</code> in the environment and that the llama.cpp ROCm backend compiled successfully.</p></div>
'''
body_words = 535

