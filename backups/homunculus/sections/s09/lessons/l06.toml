[[lessons.exercises]]
id = "s09-l06-e4"
type = "mc"
points = 20
prompt = "Per this rite, why does the eighth rite's evaluation habit — 'measure before trusting' — apply with special force to verifying the served homunculus?"
choices = [
  "Ollama's create command rewrites the GGUF metadata header to include a SHA-256 hash of the Modelfile — if the hash doesn't match the expected value from the conversion step, the model's output will contain systematically incorrect tokens, and only an evaluation run can detect the mismatch because the hash is not reported in the command output",
  "The sealing pipeline involves three lossy transformations in series — merge (absorbing adapter, discarding A and B matrices), quantization (16-bit → ~4.5 effective bits), and format conversion (HF → GGUF) — each of which can silently degrade output quality without reporting a metric. The verification run against held-out prompts is the only way to confirm that the cumulative loss across all three steps is acceptable, because no individual step reports a quality score",
  "Ollama uses a different tokenizer than the Hugging Face training pipeline — the GGUF conversion step replaces the training tokenizer with Ollama's internal tokenizer, which may produce different token sequences for the same text, and the evaluation run is the only way to detect tokenizer drift because the replacement is undocumented",
  "The verification run is required by Ollama's model registry protocol — models created with ollama create must pass a built-in validation step (ollama verify) before they can accept inference requests, and the evaluation run is the only way to satisfy this requirement because ollama verify requires a manually-curated test set"
]
answer = 1
whyWrong = "ollama create does not rewrite the GGUF header with a hash (the GGUF metadata header is written once by convert_hf_to_gguf.py and remains unchanged through the create step — the command only registers the model, it doesn't modify the file). Ollama does not replace the tokenizer with a separate internal one (the GGUF file contains the tokenizer vocabulary baked in by the conversion step; Ollama reads that baked-in vocabulary — there is no separate Ollama tokenizer to cause drift). And ollama verify is not a real subcommand (Ollama has no built-in model validation step — verification is the artificer's responsibility, not an automated check). The correct answer: three lossy steps in series, each silent about quality, require an external quality measurement at the endpoint — the same habit the proving rite drilled."
hint = "The lesson says 'the sealing pipeline involves three lossy transformations in series … each step is silent about quality. The cumulative quality loss across all three steps can only be measured at the endpoint.' The correct choice identifies that merge, quantize, and convert each degrade the model silently, and only an end-to-end test against known prompts can measure the total loss."
explain = "This is the upstream-diagnosis principle applied across the entire pipeline. merge_and_unload doesn't report a quality delta — it just adds matrices. llama-quantize doesn't report a perplexity change — it just stores fewer bits. convert_hf_to_gguf.py doesn't validate output coherence — it just copies tensors into a new format. Any one of these steps could introduce a subtle degradation (a rounding difference that makes a frequently-accessed weight slightly different on every forward pass, a quantization cliff that collapses a small but important weight delta to zero, a tokenizer misalignment that shifts the vocabulary mapping). The only way to catch these is to test the endpoint against a known-good baseline — the same held-out prompts the fourth and eighth rites curated for exactly this purpose."

[[lessons.exercises]]
id = "s09-l06-e5"
type = "write"
points = 33
prompt = "Compute a verification score for the served homunculus. Given a list of test results — each a tuple <code>(prompt_id, answered, quality_score, style_score)</code> — a result passes if <code>answered</code> is True AND <code>quality_score &gt;= 0.7</code> AND <code>style_score &gt;= 0.6</code>. Print <code>PASS &lt;n&gt;/&lt;total&gt;</code> and <code>SCORE &lt;v&gt;%</code> where &lt;v&gt; is the integer pass percentage. Compute from the data — don't hardcode the counts."
starter = '''results = [
    ("p01", True,  0.85, 0.72),
    ("p02", True,  0.62, 0.88),
    ("p03", False, 0.00, 0.00),
    ("p04", True,  0.91, 0.55),
    ("p05", True,  0.78, 0.81),
    ("p06", True,  0.73, 0.67),
    ("p07", True,  0.44, 0.91),
    ("p08", True,  0.82, 0.74),
]

# Check each result: answered AND quality >= 0.7 AND style >= 0.6
# Count passes
# Print PASS <passes>/<total>
# Print SCORE <v>% as an integer (rounded)

print("PASS 0/0")
print("SCORE 0%")
'''
expect = '''PASS 4/8
SCORE 50%'''
hint = "Loop over results. For each (id, answered, quality, style): if answered and quality >= 0.7 and style >= 0.6, increment passes. p01 ✓ (0.85, 0.72), p02 ✗ (0.62 < 0.7), p03 ✗ (not answered), p04 ✗ (0.55 < 0.6), p05 ✓ (0.78, 0.81), p06 ✓ (0.73, 0.67), p07 ✗ (0.44 < 0.7), p08 ✓ (0.82, 0.74). passes = 4, total = 8. rate = round(4/8 * 100) = 50. Print f'PASS {passes}/{len(results)}' and f'SCORE {round(passes/len(results)*100)}%'."
