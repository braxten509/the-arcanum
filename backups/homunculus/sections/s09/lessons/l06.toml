[[lessons.exercises]]
id = "s09-l06-e1"
type = "mc"
points = 20
prompt = "Per this rite, what command registers the homunculus in Ollama's local model registry from the Modelfile, and what does the registration actually do with the GGUF file?"
choices = [
  "ollama pull homunculus -f Modelfile — the pull command downloads the GGUF weights from the path in the FROM directive, caches them in Ollama's internal storage (~/.ollama/models/), and registers the model name. The original GGUF file is no longer needed after pull because Ollama maintains its own copy",
  "ollama build homunculus -f Modelfile — the build command compiles the GGUF weights into Ollama's internal inference format (a proprietary binary format optimized for GPU dispatch), registers the compiled artifact, and deletes the original GGUF to save disk space",
  "ollama create homunculus -f Modelfile — the create command reads the Modelfile, locates the GGUF file specified in FROM, parses its metadata header for architecture and tokenizer information, and registers the model name in Ollama's local model list. The GGUF file is not copied — Ollama reads it from its current location, so moving or deleting the file breaks the model",
  "ollama serve homunculus -f Modelfile — the serve command loads the model into GPU memory, begins listening for API requests on port 11434, and registers the model name as a side effect of the serving process. The registration is temporary and lasts only as long as the serve command is running"
]
answer = 2
whyWrong = "ollama pull downloads from a remote registry, not from a local Modelfile (pull fetches models by name from ollama.com; it cannot read a local Modelfile — the correct verb for local registration is 'create'). ollama build is not a real Ollama subcommand (the correct registration verb is 'create'; there is no compilation step — Ollama reads the GGUF directly at load time without converting it to a proprietary format). ollama serve starts the API server daemon (it doesn't register specific models — it listens for requests to models that are already registered via ollama create or ollama pull). The correct answer: ollama create reads the Modelfile, locates the GGUF in place (no copy), and registers the model name."
hint = "The lesson states the command explicitly: 'ollama create homunculus -f Modelfile.' The correct choice names this exact command and notes that the GGUF is read from its current location — not copied, not compiled, not downloaded."
explain = "The 'create' verb is precise: it creates a registry entry (a mapping from the model name 'homunculus' to the GGUF file path and its parsed metadata), not a copy of the weights. This means the GGUF file must remain at the path the FROM directive specified for as long as the model is registered. If the artificer moves the GGUF file or the Modelfile's FROM path changes, the model produces a 'file not found' error when summoned. The trade-off is disk efficiency (one copy of the weights serves both the file system and Ollama) for a path dependency (the model breaks if the file moves)."

