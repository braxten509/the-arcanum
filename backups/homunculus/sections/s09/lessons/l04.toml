id = "s09-l04-e2"
type = "text"
points = 18
prompt = "Per this rite, what are the four active Modelfile directives the homunculus uses — the ones that name the GGUF file, set inference parameters, define the chat template, and set the system prompt?"
answer = "FROM, PARAMETER, TEMPLATE, and SYSTEM"
accept = ["FROM, PARAMETER, TEMPLATE, and SYSTEM", "FROM PARAMETER TEMPLATE SYSTEM", "FROM, PARAMETER, TEMPLATE, SYSTEM", "from, parameter, template, and system", "from parameter template system", "FROM, PARAMETER, TEMPLATE and SYSTEM", "FROM PARAMETER TEMPLATE and SYSTEM"]
hint = "The lesson names them in order: 'FROM names the base GGUF,' 'PARAMETER lines set inference controls,' 'TEMPLATE defines the chat template,' and 'SYSTEM sets the system prompt.' All four are present in the homunculus's Modelfile."

[[lessons.exercises]]
id = "s09-l04-e3"
type = "fill"
points = 20
prompt = "Fill the missing Modelfile directive — the one that tells Ollama which GGUF file contains the vessel's weights and should point at the quantized output from the third lesson, not the unquantized FP16 master."
code = '''____ ./homunculus-q4_k_m.gguf
PARAMETER temperature 0.7
