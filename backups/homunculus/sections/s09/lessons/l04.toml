[[lessons]]
id = "s09-l04"
title = "The Modelfile — The Vessel's Label"
body = '''
<p>The quantized GGUF is a file. To become a familiar the artificer can summon with a single command, it needs a label — a document that tells the serving daemon what vessel to pour, what temperature to serve it at, and what words to whisper in its ear before every conversation. In the Ollama ecosystem, that label is the Modelfile. The fourth rite introduced the Modelfile's basic syntax with <code>PARAMETER</code> lines and <code>FROM</code> declarations; this lesson writes a complete Modelfile for the homunculus — a label that encodes every decision the preceding eight rites made, in fewer than twenty lines.</p>

<p>The Modelfile has four active sections for the homunculus. <strong><code>FROM</code></strong> names the base GGUF: <code>FROM ./homunculus-q4_k_m.gguf</code>. The path is relative to the Modelfile's location, and it must point at the quantized GGUF the third lesson produced, not the unquantized FP16 master. Ollama reads the GGUF's metadata header to determine the model architecture and tokenizer — the Modelfile only needs to specify which file contains the vessel. <strong><code>PARAMETER</code></strong> lines set inference controls — the same temperature, top-p, and top-k the fourth rite's sampling lesson introduced and the tenth rite's ward-control lesson tuned. For the homunculus: <code>PARAMETER temperature 0.7</code>, <code>PARAMETER top_p 0.9</code>, <code>PARAMETER top_k 40</code>, plus <code>PARAMETER stop "&lt;|im_end|&gt;"</code> and <code>PARAMETER stop "&lt;|im_start|&gt;"</code> to prevent the model from continuing into the next conversation turn. These are the moderate-to-loose ward parameters the tenth rite recommended: high enough to bypass spurious refusals, low enough to keep answers on-topic.</p>

<p><strong><code>TEMPLATE</code></strong> defines the chat template — the exact token sequence that wraps each conversation turn in the format the model was trained to expect. For a Llama-3-based model using the ChatML format the sixth rite's template lesson taught: <code>TEMPLATE """{{ if .System }}&lt;|im_start|&gt;system\n{{ .System }}&lt;|im_end|&gt;\n{{ end }}&lt;|im_start|&gt;user\n{{ .Prompt }}&lt;|im_end|&gt;\n&lt;|im_start|&gt;assistant\n"""</code>. Ollama's Go template syntax (<code>{{ .System }}</code>, <code>{{ .Prompt }}</code>, <code>{{ .Response }}</code>) fills in the system prompt and user query at serving time. A wrong TEMPLATE — specifying Mistral's <code>[INST]</code> format for a Llama model, or forgetting the <code>{{ if .System }}</code> guard so that an empty system prompt still emits the <code>&lt;|im_start|&gt;system</code> tokens — produces garbled conversation formatting: the model sees tokens in an order it was not trained to interpret, and the output is incoherent even though the weights are correct. The TEMPLATE is not decoration; it is the protocol the model was trained to speak.</p>

<p><strong><code>SYSTEM</code></strong> sets the system prompt — the ward the tenth rite's final lesson chose after testing three candidate bases and measuring refusal rates against the held-out prompts. For the homunculus: <code>SYSTEM """You are a Notion style assistant. You answer questions about formatting, typography, layout conventions, and Notion-specific features. When reference material is provided, ground your answers in it and cite the reference. If a request falls outside document styling, redirect to a related formatting topic instead of refusing."""</code>. This prompt embeds the three-pattern recipe the tenth rite's second lesson taught: role anchoring ("You are a Notion style assistant"), permission enumeration (formatting, typography, layout, Notion features), and redirection over refusal (redirect to formatting advice, don't refuse). It also embeds the RAG grounding instruction the ninth rite's grimoire pipeline expects: "When reference material is provided, ground your answers in it." Every time the artificer summons the homunculus — <code>ollama run homunculus</code> — this system prompt is prepended to the conversation, biasing the model's activation distribution toward the style-assistant role before the first user token arrives.</p>

<p>The Modelfile is fewer than twenty lines of text, but those twenty lines encode ten rites of decisions: the base model choice (fifth rite), the quant level (fifth rite), the chat template format (sixth rite), the inference parameters (second and tenth rites), the system prompt (tenth rite), and the RAG integration instruction (ninth rite). A label that misstates any of those decisions produces a familiar that behaves differently from what the artificer designed. The Modelfile is a configuration artifact — a version of the third rite's one-job-per-tool discipline applied to the serving layer: it is a separate, text-editable file that can be reviewed, versioned, and revised independently of the weights it labels.</p>

<div class="field-notes"><div class="fn-head">FIELD NOTES // MODELFILE GOTCHAS — FOUR FAILURE MODES THE ENGINE WON'T CATCH</div>
<p>The <code>TEMPLATE</code> uses Go's <code>text/template</code> syntax, not Python's f-strings — <code>{{ .System }}</code> with double braces, not <code>{system}</code>. A common mistake is writing Python-style placeholders that Ollama silently ignores, producing a prompt with literal <code>{system}</code> text instead of the actual system prompt. The <code>PARAMETER stop</code> tokens must be quoted when they contain special characters: <code>PARAMETER stop "&lt;|im_end|&gt;"</code> — unquoted, the shell interprets <code>&lt;</code> as a redirect. If the <code>SYSTEM</code> prompt exceeds approximately 500 tokens, Ollama may truncate it silently; verify after creation with <code>ollama show homunculus --modelfile</code> and confirm the system prompt appears complete. The Modelfile filename is <code>Modelfile</code> by convention (capital M, no extension), and Ollama's <code>create</code> command in the final lesson expects it in the current working directory or specified with <code>-f</code>. A Modelfile without a <code>TEMPLATE</code> causes Ollama to fall back to a generic completion format — the model will generate text but without the role-structured conversation framing that the instruct training expects, producing output that feels random and untethered from the user's query.</p></div>
'''
body_words = 555

[[lessons.readings]]
label = "Ollama Modelfile reference — all directives and their syntax"
url = "https://github.com/ollama/ollama/blob/main/docs/modelfile.md"

[[lessons.readings]]
