[[lessons.exercises]]
id = "s09-l04-e4"
type = "mc"
points = 20
prompt = "Per this rite, what is the functional difference between the PARAMETER and SYSTEM directives in an Ollama Modelfile?"
choices = [
  "PARAMETER controls the model's internal sampling mechanics — temperature, top-p, top-k, and stop tokens determine how tokens are selected from the probability distribution during generation. SYSTEM sets the text prefix that prepends every conversation and biases the model's activation distribution toward a specific role. PARAMETER affects the sampler; SYSTEM affects the prompt prefix — they operate at different stages of the inference pipeline and serve different purposes",
  "PARAMETER controls the Ollama server's resource allocation — GPU memory limit, thread count, batch size, and the number of concurrent requests the server can handle. SYSTEM controls the model's behavioral constraints — refusal boundary, response format, and domain boundaries",
  "PARAMETER and SYSTEM are functionally identical — both are text strings that prepend the conversation. The distinction is only syntactic: PARAMETER uses key-value syntax while SYSTEM uses free-form text; Ollama concatenates both before the user query with no difference in processing",
  "PARAMETER sets inference parameters that apply only to the system prompt generation — the system message is generated with different temperature and sampling controls than user messages, allowing the ward to be more deterministic than the response"
]
answer = 0
whyWrong = "PARAMETER does not control server resources (GPU memory, thread count, and batch size are set via environment variables or ollama serve flags; PARAMETER controls the generation sampler). PARAMETER and SYSTEM are not functionally identical (PARAMETER is a numeric key-value pair read by the inference engine's sampler; SYSTEM is a text string inserted by the TEMPLATE into the prompt prefix — they go to different subsystems). And PARAMETER does not apply only to system prompt generation (it applies to the entire generation — every token the model produces uses the same temperature, top-p, and stop tokens regardless of which role's text is being generated). The correct answer: PARAMETER controls sampling (the token-selection process), SYSTEM controls the prompt prefix (what the model sees before it begins generating)."
hint = "The lesson says PARAMETER lines 'set inference controls — the same temperature, top-p, and top-k the fourth rite's sampling lesson introduced,' while SYSTEM 'sets the system prompt — the ward the tenth rite's final lesson chose.' The correct choice distinguishes the sampler configuration (PARAMETER) from the prompt content (SYSTEM) as separate stages of the inference pipeline."
explain = "The distinction matters because the two directives control different surfaces. Changing the SYSTEM prompt alters what the model attends to — the hidden-state representations it uses to generate. Changing PARAMETER temperature alters how the model selects tokens — the probability distribution it samples from. A good SYSTEM prompt with wrong PARAMETER values produces the right words in the wrong style (overly deterministic or too random). Good PARAMETER values with a wrong SYSTEM prompt produces well-formed text about the wrong topic. The artificer must tune both independently."

