[[lessons.exercises]]
id = "s09-l04-e6"
type = "write"
points = 33
prompt = "Assemble a Modelfile from parts. Given <code>base = \"homunculus-q4_k_m.gguf\"</code>, <code>temperature = 0.7</code>, <code>top_p = 0.9</code>, <code>stop_tokens = [\"&lt;|im_end|&gt;\", \"&lt;|im_start|&gt;\"]</code>, and a <code>system_prompt</code> variable containing the ward text, print a complete Modelfile in order: FROM, PARAMETER stop for each token, PARAMETER temperature, PARAMETER top_p, hardcoded TEMPLATE (ChatML), and SYSTEM from the variable. Compute from the variables — don't hardcode the full Modelfile as one string literal."
starter = '''base = "homunculus-q4_k_m.gguf"
temperature = 0.7
top_p = 0.9
stop_tokens = ["<|im_end|>", "<|im_start|>"]
system_prompt = (
    "You are a Notion style assistant. "
    "Answer formatting and typography questions. "
    "Ground answers in provided reference material. "
    "If a request falls outside document styling, "
    "redirect to a related formatting topic."
)

# Print FROM line (using the base variable)
# Print PARAMETER stop for each token in stop_tokens
# Print PARAMETER temperature (using the temperature variable)
# Print PARAMETER top_p (using the top_p variable)
# Print the hardcoded TEMPLATE (ChatML format)
# Print the SYSTEM directive using the system_prompt variable

print("FROM none")
'''
expect = '''FROM homunculus-q4_k_m.gguf
PARAMETER stop "<|im_end|>"
PARAMETER stop "<|im_start|>"
PARAMETER temperature 0.7
PARAMETER top_p 0.9
TEMPLATE """{{ if .System }}<|im_start|>system
{{ .System }}<|im_end|>
{{ end }}<|im_start|>user
{{ .Prompt }}<|im_end|>
<|im_start|>assistant
"""
SYSTEM """You are a Notion style assistant. Answer formatting and typography questions. Ground answers in provided reference material. If a request falls outside document styling, redirect to a related formatting topic."""'''
hint = "Print each line with f-strings: f'FROM {base}'. Loop over stop_tokens: f'PARAMETER stop \\\"{token}\\\"'. f'PARAMETER temperature {temperature}'. f'PARAMETER top_p {top_p}'. Then print the hardcoded TEMPLATE block verbatim (use a multiline string). Then print f'SYSTEM \\\"\\\"\\\"{system_prompt}\\\"\\\"\\\"'. Remember to quote the stop tokens with escaped double-quotes inside the f-string: f'PARAMETER stop \\\"{token}\\\"'."
