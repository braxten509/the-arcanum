url = "https://github.com/ollama/ollama/blob/main/docs/template.md"

[[lessons.exercises]]
id = "s09-l04-e1"
type = "mc"
points = 20
prompt = "Per this rite, why does the Modelfile's TEMPLATE directive matter — what happens if the TEMPLATE is wrong (e.g., specifying Mistral's <code>[INST]</code> format for a Llama-3 model that expects ChatML)?"
choices = [
  "Ollama's tokenizer will detect the format mismatch during model creation and refuse to register the model — the tokenizer validates the TEMPLATE against the GGUF metadata's reported architecture and rejects mismatches before the model is added to the registry",
  "The model will see tokens in an order it was not trained to interpret — the role markers ('user', 'assistant') will appear in positions that don't match the training distribution, causing the model to produce incoherent output even though the weights are correct. The chat template is the exact token sequence the model learned to associate with role-structured conversation during its instruct training",
  "The model will run slower because Ollama retries generation three times with different template configurations before falling back to a generic format — each retry adds latency, and the final fallback format produces degraded but functional output",
  "Ollama will strip the system prompt — the TEMPLATE and SYSTEM directives are tightly coupled in Ollama's parser, and a TEMPLATE that doesn't match the model's training format causes the SYSTEM text to be discarded before generation, so the model runs without any ward or role framing"
]
answer = 1
whyWrong = "Ollama does not validate the TEMPLATE against the architecture metadata (the create command accepts any TEMPLATE string — it's the artificer's responsibility to provide the correct format, and Ollama will happily register a model with a mismatched template). Ollama does not retry with different templates (it applies the TEMPLATE exactly as written, once, and the model generates whatever tokens follow). And the SYSTEM directive is not stripped when the TEMPLATE is wrong — the TEMPLATE controls ordering of all roles, and a wrong order misplaces every role's tokens, not just the system prompt. The correct answer: the model was trained on a specific token sequence pattern, and presenting tokens in a different order means the model's internal representations don't match what it learned to expect."
hint = "The lesson says 'a wrong TEMPLATE produces garbled conversation formatting — the model sees tokens in an order it was not trained to interpret, and the output is incoherent even though the weights are correct.' The correct choice identifies the order-sensitivity: the model's training distribution of token sequences is what the TEMPLATE must match."
explain = "Instruct training explicitly teaches the model to associate specific token sequences with conversation roles. A Llama-3 model trained on ChatML learned that <|im_start|>system marks the system prompt, <|im_start|>user marks the user query, and <|im_start|>assistant marks the model's own response. If the TEMPLATE instead emits [INST] user query [/INST] — Mistral's format — the model sees a completely unfamiliar token pattern and generates tokens based on the statistical association of those tokens in its pre-training data (unstructured text), not its instruct training (structured conversation). The result is unrelated to the user's query: the model is processing the input as a text-completion problem, not a conversation turn."

