[[lessons]]
id = "s06-l05"
title = "The Iterative Pass"
body = '''
<p>Four rites built a measurement suite: the held-out mirror (style shift), the voice judge (quality), the forgetting score (preservation), and the loss curve (learning dynamics). This rite teaches the simplest and most expensive skill in the proving set: running the bind more than once with different knobs and comparing the results. The seventh rite's knob lesson taught what rank, alpha, and learning rate control; this rite teaches how to change them <em>deliberately</em> across runs and read the output as a decision.</p>
<p>The iterative pass is a <strong>small grid search</strong> — a table of 3–6 configurations where one or two knobs change at a time, each configuration gets its own training run, and the best configuration is the one with the best combined evaluation score (style + forgetting). The grid is small because each run takes 15–40 minutes on a 16 GB card (the seventh rite's AMD lesson timed it), and a sweep of 3 knobs at 3 levels each (27 runs) would take 7–18 hours — too long for a practical proving pass. A productive first sweep changes exactly two knobs across 4–6 runs — for example, hold alpha fixed at 32 and vary rank across [8, 16, 32], then hold the best rank fixed and vary learning rate across [1e-4, 2e-4, 3e-4]. Six runs, roughly 2–3 hours on the card, and the result is a defensible "best I could find within this resource budget."</p>
<p>Checkpoint selection is the cheaper cousin of the grid sweep: run the bind <em>once</em> with a conservative config (rank 16, alpha 32, lr 2e-4), save checkpoints at intervals (<code>save_steps=10</code> or <code>save_steps=20</code>), and evaluate each checkpoint's adapter on the held-out prompts. The best checkpoint is not always the last one — on a single-epoch run with a small dataset, the loss curve plateaus early (the sixth rite proved this), and a checkpoint at step 40 may produce a better style-consistency score than step 80 because the later steps overfit to the noise in the last few training records. The sixth rite's loss-curve intuition maps directly to checkpoint selection: pick the checkpoint at the step where eval loss stops improving, not where training loss is lowest.</p>
<pre><code><span class="c"># A minimal grid-sweep script — one config per run, log the result:</span>
configs = [
    {<span class="s">"r"</span>: <span class="k">8</span>,  <span class="s">"lr"</span>: <span class="k">2e-4</span>, <span class="s">"name"</span>: <span class="s">"r8-lr2e4"</span>},
    {<span class="s">"r"</span>: <span class="k">16</span>, <span class="s">"lr"</span>: <span class="k">2e-4</span>, <span class="s">"name"</span>: <span class="s">"r16-lr2e4"</span>},
    {<span class="s">"r"</span>: <span class="k">32</span>, <span class="s">"lr"</span>: <span class="k">2e-4</span>, <span class="s">"name"</span>: <span class="s">"r32-lr2e4"</span>},
    {<span class="s">"r"</span>: <span class="k">16</span>, <span class="s">"lr"</span>: <span class="k">1e-4</span>, <span class="s">"name"</span>: <span class="s">"r16-lr1e4"</span>},
    {<span class="s">"r"</span>: <span class="k">16</span>, <span class="s">"lr"</span>: <span class="k">3e-4</span>, <span class="s">"name"</span>: <span class="s">"r16-lr3e4"</span>},
]
<span class="c"># For each config: run trainer.train(), evaluate on held-out prompts,</span>
<span class="c"># record style-similarity score + forgetting score → pick best combo.</span></code></pre>
<p><strong>Early stopping</strong> is the grid sweep's shortcut: instead of running every configuration to completion, monitor the training loss and abort a run mid-epoch if the loss has plateaued for 20+ steps (the same plateau signal the sixth rite defined). The run is not a failure — a plateau at step 30 means the bind absorbed the signal it could, and continuing to step 80 would only burn clock cycles for the same adapter quality. Abort, save the adapter at the plateau point, and move to the next configuration. On a 6-run grid, early stopping can cut the total proving time from 3 hours to under 2 — half the wattage for the same information.</p>
<div class="field-notes"><div class="fn-head">FIELD NOTES // THE SINGLE-VARIABLE RULE — WHY YOU CHANGE ONE KNOB AT A TIME</div>
<p>Change two knobs between runs — say, rank 16→32 AND learning rate 2e-4→1e-4 — and the evaluation cannot tell you which change caused the improvement (or degradation). The result is a number, not a lesson: "this config works better" without any insight into <em>why</em>. The proving rite's goal is not just to find a good config, but to understand the relationship between the knobs and the behavior — the same expert judgment the final rite demands. Change one knob at a time across a sweep, and the result is a curve (style quality vs. rank, forgetting vs. learning rate) instead of a single point — a curve the artificer can reason about, not just accept.</p></div>
'''
body_words = 540

[[lessons.readings]]
label = "Hugging Face Trainer — checkpointing and resuming"
url = "https://huggingface.co/docs/transformers/main_classes/trainer"

[[lessons.exercises]]
id = "s06-l05-e1"
type = "mc"
points = 20
prompt = "Per this rite, why does the iterative pass sweep only 4–6 configurations rather than a full 3×3×3 grid (27 runs)?"
choices = [
  "The SFTTrainer can only be configured with at most 6 different TrainingArguments objects per Python process — calling trainer.train() a seventh time raises a ResourceExhaustedError",
  "Each training run takes 15–40 minutes on a 16 GB card, and 27 runs (7–18 hours) exceeds a practical proving session — the sweep is resource-bound by GPU time, not by solver completeness, and the goal is a defensible best-effort config, not a global optimum",
  "The evaluation scripts from earlier rites can only compare at most 6 adapters side by side before the combined context exceeds the tokenizer's max sequence length",
  "Grid search beyond 6 points overfits the hyperparameter space — the evaluation metrics start to favor configs that score well by random chance rather than genuine quality"
]
answer = 1
whyWrong = "The grid size limit is a practical resource constraint, not a software limit (the SFTTrainer has no restriction on the number of runs per process), a tokenizer constraint (evaluation compares adapters one at a time, not all at once), or a statistical overfitting argument (more runs give more information, not less). The bound is time — each run burns wattage and minutes on the AMD card, and the proving rite values a defensible result in 2 hours over a perfect result in 18."
explain = "The grid stays small for a single reason — wall-clock cost. Each run burns 15–40 minutes of the card, so a full 3×3×3 sweep of 27 runs would take 7–18 hours. No software or statistical rule caps the size; the artificer simply trades an exhaustive search for a defensible best-effort that fits one working session."
hint = "The lesson says each run 'takes 15–40 minutes on a 16 GB card' and '27 runs would take 7–18 hours — too long for a practical proving pass.' The correct choice is the time-bound constraint on the grid sweep."

[[lessons.exercises]]
id = "s06-l05-e2"
type = "text"
points = 18
prompt = "Per this rite, which checkpoint in a single-epoch training run should the artificer select — the last one (most steps) or the one where the evaluation loss stops improving — and why?"
answer = "the one where evaluation loss stops improving, because later steps risk overfitting the noise in the last training records without improving style quality on held-out prompts"
accept = ["the one where evaluation loss stops improving", "where eval loss stops improving", "where evaluation loss plateaus", "the checkpoint where eval loss stops improving", "where the evaluation loss stops improving", "the checkpoint at the step where eval loss stops improving"]
hint = "The lesson says 'pick the checkpoint at the step where eval loss stops improving, not where training loss is lowest' — because later steps overfit to noise in the last few training records. The second paragraph of the lesson explains this checkpoint-selection rule directly."

