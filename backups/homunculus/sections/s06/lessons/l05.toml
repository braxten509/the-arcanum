[[lessons.exercises]]
id = "s06-l05-e4"
type = "mc"
points = 20
prompt = "Per this rite, why does the lesson recommend changing only one knob at a time across a sweep rather than varying both rank and learning rate simultaneously?"
choices = [
  "The SFTTrainer's configuration parser validates one knob at a time — passing two changed knobs causes a config-collision error because the underlying PEFT model can only reconfigure one LoraConfig field per training session",
  "Changing two knobs at once conflates the effect — you cannot tell whether rank or learning rate caused the improvement, so you get a number without a lesson; changing one knob at a time produces a curve you can reason about rather than a single opaque data point",
  "Grid search algorithms require orthogonal search directions — varying two knobs simultaneously introduces correlated gradients that bias the optimizer's learning rate schedule built into the SFTTrainer",
  "The GPU memory constraint limits each run to tuning one knob at a time — two simultaneous knob changes double the optimizer state footprint because each changed knob requires its own gradient buffer"
]
answer = 1
whyWrong = "The SFTTrainer has no knob-collision restriction — every config is a fresh LoraConfig object and a fresh trainer, so you can change as many knobs as you want between runs. There is no orthogonal-search requirement (grid search doesn't care about correlation between dimensions — it's exhaustive within the grid), and memory is a per-run concern, not per-knob (changing two knobs within one run doesn't double memory). The real reason is diagnostic: one variable changed = one attributable cause. Two variables changed = confounded effect, and the proving rite is about understanding the bind, not just finding a working config."
explain = "Changing one knob per run keeps cause and effect legible: if the score moves, exactly one variable moved with it, so the sweep yields an attributable curve — style against rank, forgetting against learning rate. Move two knobs together and a better score tells you the pair helped, not which one — a data point you cannot reason from. The proving rite is about understanding the bind, not just landing on a config that happens to work."
hint = "The lesson's FIELD NOTES section states: 'Change two knobs between runs and the evaluation cannot tell you which change caused the improvement. Change one knob at a time and the result is a curve instead of a single point.'"

