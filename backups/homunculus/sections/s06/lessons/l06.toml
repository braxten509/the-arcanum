[[lessons.exercises]]
id = "s06-l06-e3"
type = "fill"
points = 20
prompt = "Fill the missing verdict from the lesson's judgment function — the one returned when the style score is below 0.65 and the forgetting score is above 0.10, indicating the adapter failed to shift style AND lost factual knowledge."
code = '''def verdict(style_score, forgetting, loss_shape):
    if loss_shape == "mask_failure":
        return "RE-BIND — fix loss mask, re-run from scratch"
    if forgetting > 0.25:
        return "FAIL — forgetting too high, try lower rank or fewer epochs"
    if style_score < 0.65 and forgetting < 0.10:
        return "FAIL — no style shift, try higher rank or more epochs"
    if style_score < 0.65:
        return "____ — weak style shift with forgetting, tune knobs"
    if style_score >= 0.75 and forgetting <= 0.15:
        return "PASS — the bind is ready for the sealing rite"
    return "MARGINAL — acceptable but could be better, re-bind optional"'''
answer = "RE-BIND"
accept = ["RE-BIND", "REBIND", "re-bind"]
hint = "The verdict function's fourth branch — the fallback for when style_score < 0.65 but forgetting is already above 0.10 (so the 'FAIL — no style shift' branch didn't fire) — returns a different verdict: one that instructs the artificer to re-train with different knobs rather than accepting or rejecting outright."

[[lessons.exercises]]
id = "s06-l06-e4"
type = "mc"
points = 20
prompt = "Per this rite, when is a marginal bind (style 0.72, forgetting 0.18) the RIGHT call to ship rather than re-training?"
choices = [
  "When the training run cost less than 10 minutes — fast runs amortize the loss of precision because re-training is cheap and the marginal bind is a temporary artifact on the way to a better one",
  "When the bind produces useful output on the actual daily prompts the artificer needs — style_score=0.72 produces recognizable style shift on real notes, and forgetting=0.18 means the model still answers general questions correctly 82% of the time, which may be good enough for daily use; the numbers narrow the decision, but reading actual output decides it",
  "When the cosine similarity exceeds the n-gram overlap score — a dominant semantic signal means the meaning is right even if the word choice is slightly off, which is always acceptable for a marginal bind",
  "When the adapter was trained for only one epoch — single-epoch adapters are inherently marginal and should always be shipped because a second epoch would cause catastrophic forgetting exceeding 0.25"
]
answer = 1
whyWrong = "The right call depends on practical utility, not training duration (a fast bad run is still a bad adapter), metric ranking (cosine vs. n-gram comparison is a diagnostic, not a decision rule), or a hard epoch rule (second epoch can improve style without exceeding the 0.25 forgetting threshold — the iterative pass proved this by testing multiple configs). The FIELD NOTES say it directly: the numbers 'narrow the decision space' but 'the artisan's eye answers the rest' — read actual output, not just numbers."
explain = "The metrics only bound the decision. Style 0.72 means the shift is real but modest; forgetting 0.18 means roughly four in five general answers still land. Whether that is good enough is a question the numbers cannot close — it is settled by reading the model's actual output on the handful of prompts the artificer needs daily. A marginal bind that serves those prompts is a finished product; one that garbles them is a dead end, whatever the cosine score says."
hint = "The lesson's FIELD NOTES section says 'the answer is not in the numbers alone — it's in the actual output on a handful of real prompts the artificer reads with their own eyes.' The correct choice captures this: the numbers narrow the decision, but actual output on real use-case prompts makes the final call."

