[[lessons]]
id = "s06-l06"
title = "The Judgment"
body = '''
<p>Five rites assembled every signal the proving suite can produce: the held-out mirror (did anything change?), the voice judge (did it change in the right direction?), the forgetting score (what did the change cost?), the loss curve (did the bind learn or memorize?), and the iterative pass (which knob settings produced the best result?). This final rite of the proving chapter teaches the artificer to read those signals together and produce a verdict — not a number, but a decision: pass, fail, or re-bind.</p>
<p>The judgment is a three-axis readout. <strong>Style quality</strong>: the cosine similarity and n-gram overlap the fourth rite defined, measured on held-out prompts the SFTTrainer never saw. A cosine similarity >0.75 and a clear lexical shift (10%+ change in word-choice patterns from the frozen base) is a working bind. Below 0.65 cosine similarity, the adapter either learned nothing or learned the wrong thing — the output is indistinguishable from the base or actively worse. <strong>Preservation</strong>: the forgetting score the fifth rite defined. A score of 0.0–0.15 is acceptable — the bind preserved general knowledge. 0.15–0.25 is a warning — the adapter shifted far enough to degrade factual recall, and the artificer must decide whether the improved style is worth the lost precision. Above 0.25 is a failed bind — the homunculus that forgets more than it learns is a downgrade from the frozen base.</p>
<p><strong>Learning dynamics</strong>: the loss curve shape the sixth rite taught, plus the checkpoint selection the seventh rite demonstrated. A bind whose loss plateaued at step 40 instead of dropping to step 80 is not a failure — it extracted what it could, and the checkpoint at step 40 produced the best evaluation scores. A bind whose loss never dropped below 2.5 (on a 7B base with a fresh LoRA) is a warning: the training signal was weak, possibly because the dataset was too small or the template mismatched (the same silent failure the sixth rite's template lesson warned about). A bind whose loss started at 0.4 (the loss-mask failure the seventh rite's AMD lesson diagnosed) is an automatic fail — the entire run trained on predicting the prompt itself, and the adapter learned nothing about the artificer's style.</p>
<pre><code><span class="c"># The judgment — a function, not a feeling:</span>
<span class="k">def</span> <span class="nf">verdict</span>(style_score, forgetting, loss_shape):
    <span class="k">if</span> loss_shape == <span class="s">"mask_failure"</span>:
        <span class="k">return</span> <span class="s">"RE-BIND — fix loss mask, re-run from scratch"</span>
    <span class="k">if</span> forgetting &gt; <span class="k">0.25</span>:
        <span class="k">return</span> <span class="s">"FAIL — forgetting too high, try lower rank or fewer epochs"</span>
    <span class="k">if</span> style_score &lt; <span class="k">0.65</span> <span class="k">and</span> forgetting &lt; <span class="k">0.10</span>:
        <span class="k">return</span> <span class="s">"FAIL — no style shift, try higher rank or more epochs"</span>
    <span class="k">if</span> style_score &lt; <span class="k">0.65</span>:
        <span class="k">return</span> <span class="s">"RE-BIND — weak style shift with forgetting, tune knobs"</span>
    <span class="k">if</span> style_score &gt;= <span class="k">0.75</span> <span class="k">and</span> forgetting &lt;= <span class="k">0.15</span>:
        <span class="k">return</span> <span class="s">"PASS — the bind is ready for the sealing rite"</span>
    <span class="k">return</span> <span class="s">"MARGINAL — acceptable but could be better, re-bind optional"</span></code></pre>
<p>The verdict function is a scaffold, not a law — the thresholds (0.75 for style, 0.15/0.25 for forgetting) are starting points the artificer adjusts as experience with the specific base model and personal corpus accumulates. The twelfth rite's expert endpoint expects the artificer to defend these choices with domain knowledge, not to treat them as fixed constants — but starting with defensible numbers and adjusting them deliberately is how expert judgment begins.</p>
<div class="field-notes"><div class="fn-head">FIELD NOTES // THE MARGINAL BIND — WHEN "GOOD ENOUGH" IS THE RIGHT CALL</div>
<p>A bind with style_score=0.72 and forgetting=0.18 is marginal: the style shift is real but not dramatic, and the model lost some factual precision. The artificer could re-bind — try rank 32, or add the feed-forward layers as targets (gate_proj, up_proj, down_proj), or run two epochs with a lower learning rate. But every re-bind burns another 20–40 minutes on the card and risks a worse result — the grid-sweep limitation the seventh rite proved applies to the tuning cycle too. The judgment the artificer must make: is this bind useful <em>enough</em> to proceed to the sealing rite? A marginal bind that serves the daily note-taking use case is a finished product. A marginal bind that can't produce a coherent paragraph in the right register is a dead end. The answer is not in the numbers alone — it's in the actual output on a handful of real prompts the artificer reads with their own eyes, not with a cosine-similarity printout. The numbers narrow the decision space from "maybe" to "marginal with style 0.72 and forgetting 0.18 — should I ship it?" The artisan's eye answers the rest.</p></div>
'''
body_words = 560

[[lessons.readings]]
label = "Practical evaluation of fine-tuned language models"
url = "https://huggingface.co/docs/transformers/training"

[[lessons.exercises]]
id = "s06-l06-e1"
type = "mc"
points = 20
prompt = "Per this rite, what verdict should the judgment return when the loss curve signals a mask failure (initial loss 0.4, never rises above 1.0 during training)?"
choices = [
  "RE-BIND — fix the loss mask and re-run from scratch, because the model trained on predicting its own prompt tokens (a copy task) and the adapter learned nothing about the artificer's style; continuing with a mask-failure adapter is a dead end regardless of how good the style or forgetting scores look",
  "PASS — the low initial loss means the model converged extremely quickly, and the style and forgetting scores will reflect a well-trained adapter",
  "FAIL — the forgetting score will be above 0.25 regardless of other metrics, because mask-failure training produces catastrophic forgetting as a side effect",
  "MARGINAL — the adapter may have learned something useful even with a bad loss mask, and the style evaluation on held-out prompts will reveal whether the training was actually productive"
]
answer = 0
whyWrong = "A mask failure is a fatal training error — the model trained on a copy task (predicting its own input prompt tokens), not on generating style-consistent responses. Low loss from a mask failure is not 'fast convergence,' it's the model acing a trivial prediction. The forgetting score is not the issue — the adapter didn't learn style in the first place, so forgetting is undefined (the adapter is near-zero from initialization). There is no MARGINAL path for mask failure — the adapter learned nothing, and no evaluation score can salvage weights that were never trained on the right loss signal."
hint = "The lesson's verdict function has a hardcoded mask_failure check that returns RE-BIND unconditionally: 'fix loss mask, re-run from scratch.' The judgment code in the lesson puts this check first — before style_score, before forgetting — because a mask-failure run is unsalvageable regardless of any downstream metric."
explain = "Loss masking (from the sixth rite) tells the trainer which tokens count toward the loss. If user-turn tokens are unmasked, the model's training objective becomes 'predict the next token of the prompt the user just typed' — a task the model solves trivially because it can see those tokens in the input. The loss drops to ~0.4, the adapter weights barely move (near-zero initialization + trivial prediction = near-zero gradient), and the resulting adapter changes nothing about the model's output. No evaluation metric can detect this as a pass because there is no style shift to measure."

