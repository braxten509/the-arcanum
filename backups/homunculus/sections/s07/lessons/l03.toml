[[lessons.exercises]]
id = "s07-l03-e5"
type = "write"
points = 35
prompt = "A FAISS search returns the <em>index</em> of the best-matching chunk, and your job is to map that index back to the chunk's text — the <code>chunks[ids[0][0]]</code> step from the lesson. Here the per-chunk similarity scores are given (as <code>index.search</code> would return them). Find the position of the highest score and print <code>RESULT: &lt;that chunk's text&gt;</code> — looked up from the list, not hardcoded."
starter = '''# The reference chunks, and the similarity score FAISS computed for each
# against the query "What font size for body text?" (higher = closer).
chunks = [
    "Use 16px font for body.",
    "Set line-height to 1.5 for readability.",
    "Use #333 for all text.",
]
scores = [0.82, 0.41, 0.35]   # one score per chunk, same order

# Find the position (index) of the highest score, then look up that
# chunk's text and print:  RESULT: <text>
# (max(scores) gives the top score; scores.index(...) gives its position.)
print("RESULT: none")
'''
expect = "RESULT: Use 16px font for body."
hint = "best = scores.index(max(scores)) gives 0 (0.82 is highest). Then print(f'RESULT: {chunks[best]}') — the font chunk. This is exactly what chunks[ids[0][0]] does after a real FAISS search: turn the winning index back into text."
