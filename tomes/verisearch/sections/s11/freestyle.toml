[freestyle]
title = "THE WORKING: The Binding of the Tome"
requires = ["interfaces", "dependency-injection", "pipeline-orchestration", "degradation-policy", "composition-root"]
brief = "Bind the exact files from the workshops into one executable.<ul><li>Add <code>Interfaces.cs</code>; make SourceFetcher, PageExtractor, and OllamaQuoteSelector implement their contracts. Add the explicit <code>MockQuoteSelector</code> and update SourceBatch to depend on ISourceFetcher.</li><li>Add the final <code>PipelineResult</code> model and <code>Pipeline.cs</code>. The flow is configured source list → concurrent fetch outcomes → per-source passages → structured proposals → exact verifier → result.</li><li>Replace temporary Program.cs demos with the workshop’s composition root: parse, load, select sources, construct one HttpClient and all collaborators, run once, render once, return a stable exit code.</li><li>Only Program.cs chooses live versus mock from <code>--mock</code>. No catch block anywhere may replace Ollama with a keyword, mock, or all-passages selector.</li><li>Run four acceptance rehearsals: explicit mock success, one source failure plus one success, no verified quotes, and live Ollama unavailable.</li><li>Delete obsolete SearchResult, SearxngClient, TrustEngine, PageScraper, RelevanceScanner, VerbatimQuote, and temporary demo calls if they remain in the learner project.</li></ul>"
reward = 700
packages = []
xray = "THORNE searches for one HttpClient construction, one composition root, and no obsolete search/fallback types. He injects one fabricated proposal and one failed page, stops Ollama in live mode, then runs --mock. Every visible behavior must agree with the selected mode and only VerifiedQuote may reach the renderer."

[freestyle.badge]
id = "badge-s11"
name = "BINDER OF THE TOME"
desc = "Sewed every boundary into one inspectable proposal-and-proof flow."

[[freestyle.rubric]]
criterion = "End-to-end contracts"
weight = 25
desc = "Configured sources flow through fetch, extraction, selection, verification, and rendering with canonical types only."

[[freestyle.rubric]]
criterion = "Composition"
weight = 20
desc = "Program.cs constructs one HttpClient and the concrete object graph; collaborators receive dependencies through constructors."

[[freestyle.rubric]]
criterion = "Truth boundary"
weight = 25
desc = "Pipeline returns only C#-verified quotes with source-owned attribution; obsolete direct/proposal output paths are gone."

[[freestyle.rubric]]
criterion = "Failure and mode behavior"
weight = 15
desc = "Partial source failure survives, live AI failure exits clearly, and mock occurs only when explicitly selected and labeled."

[[freestyle.rubric]]
criterion = "C# craft"
weight = 15
desc = "PascalCase types/methods, camelCase locals, four-space indentation, Allman braces, one responsibility per file, and no dead demo code."
