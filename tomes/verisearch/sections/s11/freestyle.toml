path = "src/Verisearch/ProofHarness.cs"
mode = "rewrite"
instruction = "Private replay preserves earlier receipts and adds the novel integrated fixture journey."
preserves = "all-active"
content = '''
namespace Verisearch;

public static class ProofHarness
{
    public static async Task<int> RunAsync(string proofId)
    {
        if (proofId == "s04")
        {
            string prepared = CliOptions.PrepareQuestion("whole   text");
            if (prepared != "whole text")
            {
                return 1;
            }
            Console.WriteLine("S04_OK question=whole text");
            return 0;
        }
        if (proofId == "s09")
        {
            SourceSpec source = new("Source", new Uri("https://example.test/source"));
            Passage passage = new("p-one", source, "An exact source sentence stays intact.");
            VerificationResult verification = new QuoteVerifier().Verify(
                [passage],
                new QuoteBatch([
                    new QuoteProposal(passage.Id, "exact source sentence"),
                    new QuoteProposal(passage.Id, "fabricated sentence")
                ]),
                3);
            bool verificationPassed = verification.Quotes is [var quote]
                && verification.RejectedCount == 1
                && quote.SourceLabel == source.Label
                && quote.SourceUri == source.Uri;
            if (!verificationPassed)
            {
                return 1;
            }
            Console.WriteLine("S09_OK accepted=1 rejected=1 attribution=source");
            return 0;
        }
        if (proofId != "s11")
        {
            Console.Error.WriteLine($"unknown proof id: {proofId}");
            return 2;
        }

        var good = new SourceSpec("Good", new Uri("https://example.test/good"));
        var failed = new SourceSpec("Failed", new Uri("https://example.test/failed"));
        var selector = new ProofSelector();
        var pipeline = new SearchPipeline(
            new SourceBatch(new ProofReader(good)),
            new PassageExtractor(),
            selector,
            new QuoteVerifier(),
            3,
            false);
        SearchResult result = await pipeline.RunAsync(
            "What does the record say?",
            [good, failed],
            CancellationToken.None);
        bool passed = result.Quotes.Count == 1
            && result.RejectedCount == 1
            && result.Sources.Count(item => !item.Succeeded) == 1
            && selector.SeenQuestion == "What does the record say?";
        if (!passed)
        {
            Console.Error.WriteLine("s11 proof failed");
            return 1;
        }
        Console.WriteLine("S11_OK quotes=1 rejected=1 failures=1");
        return 0;
    }

    private sealed class ProofReader(SourceSpec good) : ISourceReader
    {
        public Task<SourceDocument> ReadAsync(
            SourceSpec source,
            CancellationToken cancellationToken)
        {
            cancellationToken.ThrowIfCancellationRequested();
            if (source != good)
            {
                throw new HttpRequestException("controlled source failure");
            }
            const string html = "<main><p>The archive records a complete and exact statement for verification.</p></main>";
            return Task.FromResult(new SourceDocument(source, html));
        }
    }

    private sealed class ProofSelector : IAiQuoteSelector
    {
        public string? SeenQuestion { get; private set; }

        public Task<QuoteBatch> SelectAsync(
            string question,
            IReadOnlyList<Passage> passages,
            CancellationToken cancellationToken)
        {
            cancellationToken.ThrowIfCancellationRequested();
            SeenQuestion = question;
            return Task.FromResult(new QuoteBatch([
                new QuoteProposal(passages[0].Id, "The archive records a complete and exact statement"),
                new QuoteProposal(passages[0].Id, "fabricated ending")
            ]));
        }
    }
}
'''
