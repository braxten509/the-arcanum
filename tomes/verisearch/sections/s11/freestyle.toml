[freestyle]
title = "THE WORKING: The Binding of the Tome"
brief = "The milestone run, end to end: <code>verisearch \"What does RFC 8446 say about session resumption?\"</code> → search → trust filter → parallel scrape → relevance scan → verbatim quotes → war-paint report.<ul><li>Interfaces for the seams that earn them (ISearchClient, IPageScraper, IRelevanceScanner); constructor injection everywhere</li><li>A composition root in Program.cs sharing ONE HttpClient</li><li>A Pipeline orchestrator returning a PipelineResult record (no printing!)</li><li>Early-exit reasoned empties; one CancellationToken through the whole run</li><li>The full resilience ladder — including honest disclosure of any degradation in the report</li><li>Mock implementations keep it demoable offline</li></ul>"
reward = 700
packages = []
xray = "THORNE greps for 'new SearxngClient' and friends OUTSIDE Program.cs — any hit fails the DI check. He counts HttpClient constructions (must be exactly one). He kills components one at a time and reads the output: each failure must name itself (which stage, what happened, what he should try). Architecture tell he loves: PipelineResult containing enough data that a JSON renderer could replace the Spectre one without touching Pipeline."

