[[freestyle.referenceSteps]]
id = "s11-write-search-pipeline"
path = "src/Verisearch/SearchPipeline.cs"
mode = "write"
instruction = "Private replay integrates selected sources, shared passages, semantic proposals, and exact verification."
content = '''
namespace Verisearch;

public sealed class SearchPipeline(
    SourceBatch sourceBatch,
    IPassageExtractor extractor,
    IAiQuoteSelector selector,
    QuoteVerifier verifier,
    int maximumQuotes,
    bool isMock)
{
    public async Task<SearchResult> RunAsync(
        string question,
        IReadOnlyList<SourceSpec> sources,
        CancellationToken cancellationToken)
    {
        IReadOnlyList<SourceReadOutcome> outcomes = await sourceBatch.ReadAsync(
            sources,
            cancellationToken);
        IReadOnlyList<Passage> passages = outcomes
            .Where(outcome => outcome.Document is not null)
            .SelectMany(outcome => extractor.Extract(outcome.Document!))
            .ToList();

        if (passages.Count == 0)
        {
            return new SearchResult([], outcomes, 0, isMock);
        }

        QuoteBatch proposals = await selector.SelectAsync(
            question,
            passages,
            cancellationToken);
        VerificationResult verified = verifier.Verify(passages, proposals, maximumQuotes);
        return new SearchResult(
            verified.Quotes,
            outcomes,
            verified.RejectedCount,
            isMock);
    }
}
'''
[[freestyle.referenceSteps]]
id = "s11-write-application"
path = "src/Verisearch/App.cs"
mode = "write"
instruction = "Private replay composes one real provider path or explicit mock without keyword or silent fallback logic."
content = '''
namespace Verisearch;

public static class App
{
    public static async Task<int> RunAsync(string[] args)
    {
        if (args is ["--arcanum-proof", string proofId])
        {
            return await ProofHarness.RunAsync(proofId);
        }

        CliOptions options;
        try
        {
            options = CliOptions.Parse(args);
        }
        catch (ArgumentException exception)
        {
            Console.Error.WriteLine(exception.Message);
            Console.Error.WriteLine(CliOptions.Usage);
            return 2;
        }

        if (options.ShowHelp)
        {
            Console.WriteLine(CliOptions.Usage);
            return 0;
        }

        try
        {
            using var cancellation = new CancellationTokenSource(TimeSpan.FromSeconds(60));
            IReadOnlyList<SourceSpec> catalog = await SourceCatalog.LoadAsync(
                options.CatalogPath,
                cancellation.Token);
            IReadOnlyList<SourceSpec> sources = SourceSelection.Select(
                catalog,
                options.SourceLabels);

            using var httpClient = new HttpClient { Timeout = TimeSpan.FromSeconds(20) };
            httpClient.DefaultRequestHeaders.UserAgent.ParseAdd("Verisearch/4.0");
            IAiQuoteSelector selector = CreateSelector(options);
            var pipeline = new SearchPipeline(
                new SourceBatch(new SourceReader(httpClient)),
                new PassageExtractor(),
                selector,
                new QuoteVerifier(),
                options.MaxQuotes,
                options.Provider == "mock");
            SearchResult result = await pipeline.RunAsync(
                options.Question,
                sources,
                cancellation.Token);
            Console.WriteLine(new ReportRenderer().Compose(options.Question, result));
            return 0;
        }
        catch (OperationCanceledException)
        {
            Console.Error.WriteLine("verisearch canceled or timed out");
            return 130;
        }
        catch (Exception exception)
        {
            Console.Error.WriteLine($"verisearch failed: {exception.Message}");
            return 1;
        }
    }

    private static IAiQuoteSelector CreateSelector(CliOptions options)
    {
        return options.Provider switch
        {
            "mock" => new ExplicitMockAiQuoteSelector(),
            "cli" when !string.IsNullOrWhiteSpace(options.AiCommand) =>
                new CliAiQuoteSelector(
                    options.AiCommand,
                    options.AiArguments,
                    options.MaxQuotes),
            "cli" => throw new InvalidOperationException(
                "the real cli provider requires --ai-command; no non-AI fallback will be used"),
            _ => throw new InvalidOperationException($"unsupported AI provider: {options.Provider}")
        };
    }
}
'''
