[[lessons]]
id = "s11-l04"
teaches = ["language-exceptions-resources"]
title = "Resilience Without Impersonation"
body = '''

<p>Resilience means preserving honest outcomes, not manufacturing plausible quotations. Decide policy at the boundary that has enough context to act, and keep distinct failures distinct.</p>
<table style="width:100%;border-collapse:collapse"><tr><th style="text-align:left">Condition</th><th style="text-align:left">Honest policy</th></tr>
<tr><td>One chosen source fails</td><td>retain healthy documents and report the failed source</td></tr>
<tr><td>No proposal verifies</td><td>complete with an empty evidence result</td></tr>
<tr><td>AI output is malformed</td><td>report a provider/schema failure; do not display it</td></tr>
<tr><td>Configured real AI is unavailable</td><td>return a clear nonzero failure; do not change algorithms</td></tr>
<tr><td>Explicit test mock was selected</td><td>run it knowingly and label output non-factual</td></tr>
<tr><td>Cancellation was requested</td><td>propagate cancellation and return the documented cancellation exit</td></tr></table>
<p>The real provider adapter may be local, hosted, CLI-based, or another genuine AI route. Unavailability is never permission to substitute keywords, the first passage, all passages, or mock proposals. Empty verified evidence is a valid result; fabricated evidence is not graceful degradation.</p>
<pre><code data-kind="replacement">ISemanticSelector selector = providerName switch
{
    "chosen-real-provider" =&gt; BuildRealAdapter(configuration),
    "explicit-test-mock" =&gt; BuildLabeledTestDouble(),
    _ =&gt; throw new InvalidOperationException("unsupported provider")
};</code></pre>
<p>The fragment illustrates explicit selection and omits implementations. Catch bad arguments separately from invalid source configuration, source-local errors, provider transport/schema errors, cancellation, and unexpected application failure. Dispose HTTP responses and processes at their owning boundaries, and avoid printing raw provider output or secrets in a diagnostic.</p>
<p>Stable exits make the CLI scriptable: one conventional scheme is 0 for a completed search including no evidence, 2 for invalid invocation, 130 for cancellation, and 1 for configuration or runtime failure. Document whichever consistent mapping you choose.</p>
<div class="callout"><p>No silent fallback is both a truth guarantee and a debugging aid: the visible failure names the boundary that actually broke.</p></div>
<div class="field-notes"><div class="fn-head">FIELD NOTES // FAILURE INJECTION</div><p>Make each adapter throw one controlled exception in tests. Assert which layer translates it, which details remain, and which downstream collaborators receive zero calls.</p></div>
'''

[[lessons.readings]]
label = "Microsoft Learn — Exception best practices"
url = "https://learn.microsoft.com/en-us/dotnet/standard/exceptions/best-practices-for-exceptions"
essential = false

[[lessons.exercises]]
id = "s11-l04-e1"
type = "mc"
points = 20
prompt = "Which condition is fatal to a requested live AI run?"
choices = ["One of four source pages returns 404", "One proposal fails exact matching", "The configured AI cannot be reached", "The model returns an empty quotes array"]
answer = 2
whyWrong = "A source-local failure can be contained, a rejected proposal is expected, and an honest empty selection is valid. Live mode cannot perform its defining selection without the configured AI."
explain = "The program exits with setup guidance instead of changing algorithms."
hint = "Which missing component defines the requested mode?"

[[lessons.exercises]]
id = "s11-l04-e2"
type = "mc"
points = 20
prompt = "The configured AI is offline and the user did not pass <code>--mock</code>. What should happen?"
choices = ["Use keyword matching silently", "Enable mock and label it", "Print a clear live-mode error and exit nonzero", "Display all passages as quotes"]
answer = 2
whyWrong = "All other choices change selection behavior without permission or falsely present evidence."
explain = "Mock remains an explicit next command the user may choose, not an automatic recovery."
hint = "Selection of a mode belongs to the user."

[[lessons.exercises]]
id = "s11-l04-e3"
type = "mc"
points = 20
prompt = "What does catch at boundaries mean here?"
choices = ["Every method catches Exception", "Only named ownership points translate failures; inner methods preserve useful detail", "No method may catch", "Exceptions are converted to quotes"]
answer = 1
whyWrong = "Catching everywhere loses context, catching nowhere loses partial-source behavior, and exceptions never become evidence."
explain = "SourceBatch contains source failures; Program translates application failures."
hint = "Match the catch location to the scope it can honestly handle."

[[lessons.exercises]]
id = "s11-l04-d1"
type = "type"
points = 14
reps = 2
prompt = "Retype explicit mode selection twice."
code = '''IQuoteSelector selector = options.Mock
    ? new MockQuoteSelector()
    : new ConfiguredAiSelector(http, config);'''

[[lessons.exercises]]
id = "s11-l04-w1"
type = "write"
points = 38
prompt = "Write <code>SelectMode(bool mock)</code> returning MOCK only when true and LIVE otherwise. Call it for false and true, one per line."
starter = '''Console.WriteLine("NOT SELECTED");
'''
expect = '''LIVE
MOCK'''
solution = '''Console.WriteLine(SelectMode(false));
Console.WriteLine(SelectMode(true));

static string SelectMode(bool mock)
{
    return mock ? "MOCK" : "LIVE";
}
'''
hint = "Return mock ? \"MOCK\" : \"LIVE\"; then call with false and true."

[[lessons.concepts]]
id = "language-exceptions-resources"
purpose = "Preserve useful failures while releasing files, HTTP responses, processes, and cancellation resources deterministically."
anatomy = "Catch only at the boundary that can add meaning, let cancellation propagate, and use using or disposal for owned resources."
example = "The disposable examples in Resilience Without Impersonation isolate this capability before the learner chooses how it belongs in the cumulative project. The lesson Resilience Without Impersonation supplies the disposable observation point."
observable = "Ordinary failures become actionable outcomes, cancellation stays cancellation, and owned resources close on every path. Confirm it while practicing Resilience Without Impersonation."
failure = "A broad silent catch or forgotten disposal converts evidence into hidden failure and leaks operating-system resources."
practice = "s11-l04-e1"

[[lessons.artifactSteps]]
id = "s11-l04-author-artifact"
path = "src/Verisearch/App.cs"
mode = "author"
instruction = "Use the C# ideas from Resilience Without Impersonation to author or revise this learner-owned path toward the chapter behavior: Independently integrate the complete search path from behavior contracts and tests, choosing the architecture. Choose your own type names, method boundaries, and file organization; the lesson examples are disposable and are not a production template."
checks = ["The complete fixture journey yields one verified quote, one rejected fabrication, and one visible source failure through the learner's architecture.", "The complete solution builds from saved source, and a deliberately changed load-bearing input makes the relevant check fail before repair."]
