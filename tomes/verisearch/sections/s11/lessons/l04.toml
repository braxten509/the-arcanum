[[lessons]]
id = "s11-l04"
teaches = ["degradation-policy"]
title = "Resilience Without Impersonation"
body = '''
<p>“Graceful” does not mean every failure returns plausible-looking quotes. It means each failure is handled at the boundary that owns it, with behavior the user can see and understand.</p>
<table style="width:100%;border-collapse:collapse"><tr><th style="text-align:left">Condition</th><th style="text-align:left">Policy</th></tr>
<tr><td>One source fetch/extraction fails</td><td>keep other sources; report label and reason</td></tr>
<tr><td>No verified quote answers the question</td><td>successful empty result; never manufacture evidence</td></tr>
<tr><td>Proposal is altered or fabricated</td><td>reject it; optionally show rejected count</td></tr>
<tr><td>Live Ollama is offline or malformed</td><td>clear runtime error and nonzero exit; no hidden selector swap</td></tr>
<tr><td>User supplied <code>--mock</code></td><td>use MockQuoteSelector from startup and display MOCK prominently</td></tr>
<tr><td>User cancels</td><td>propagate cancellation, print canceled, exit 130</td></tr></table>
<p>The critical distinction is explicit selection versus fallback. This is sound:</p>
<pre><code>IQuoteSelector selector = options.Mock
    ? <span class="k">new</span> MockQuoteSelector()
    : <span class="k">new</span> OllamaQuoteSelector(http, config);</code></pre>
<p>This is not sound: catch an Ollama exception and quietly construct a keyword or mock selector. That changes what “AI-assisted quotation” means after the command has started. Even a disclosure line cannot make a relevance algorithm equivalent to the requested model.</p>
<p><code>Program.cs</code> is the friendly application boundary. Catch bad arguments separately from invalid config, cancellation, HTTP/model failure, and an unexpected final exception. Print short actionable messages by default; verbose mode may include more detail. Never print raw model output in an error.</p>
<div class="callout">An empty answer can be a correct answer. A fabricated answer can never be graceful degradation.</div>
<div class="field-notes"><div class="fn-head">MARGINALIA // EXIT STATUS</div><p>Use 0 for a completed run, even when it found no evidence; 2 for bad invocation; 130 for cancellation; and 1 for configuration or runtime failure. These stable meanings make the CLI useful in scripts.</p></div>
'''

[[lessons.readings]]
label = "Microsoft Learn — Exception best practices"
url = "https://learn.microsoft.com/en-us/dotnet/standard/exceptions/best-practices-for-exceptions"
essential = false

[[lessons.exercises]]
id = "s11-l04-e1"
type = "mc"
points = 20
prompt = "Which condition is fatal to a requested live AI run?"
choices = ["One of four source pages returns 404", "One proposal fails exact matching", "Ollama cannot be reached", "The model returns an empty quotes array"]
answer = 2
whyWrong = "A source-local failure can be contained, a rejected proposal is expected, and an honest empty selection is valid. Live mode cannot perform its defining selection without Ollama."
explain = "The program exits with setup guidance instead of changing algorithms."
hint = "Which missing component defines the requested mode?"

[[lessons.exercises]]
id = "s11-l04-e2"
type = "mc"
points = 20
prompt = "Ollama is offline and the user did not pass <code>--mock</code>. What should happen?"
choices = ["Use keyword matching silently", "Enable mock and label it", "Print a clear live-mode error and exit nonzero", "Display all passages as quotes"]
answer = 2
whyWrong = "All other choices change selection behavior without permission or falsely present evidence."
explain = "Mock remains an explicit next command the user may choose, not an automatic recovery."
hint = "Selection of a mode belongs to the user."

[[lessons.exercises]]
id = "s11-l04-e3"
type = "mc"
points = 20
prompt = "What does catch at boundaries mean here?"
choices = ["Every method catches Exception", "Only named ownership points translate failures; inner methods preserve useful detail", "No method may catch", "Exceptions are converted to quotes"]
answer = 1
whyWrong = "Catching everywhere loses context, catching nowhere loses partial-source behavior, and exceptions never become evidence."
explain = "SourceBatch contains source failures; Program translates application failures."
hint = "Match the catch location to the scope it can honestly handle."

[[lessons.exercises]]
id = "s11-l04-d1"
type = "type"
points = 14
reps = 2
prompt = "Retype explicit mode selection twice."
code = '''IQuoteSelector selector = options.Mock
    ? new MockQuoteSelector()
    : new OllamaQuoteSelector(http, config);'''

[[lessons.exercises]]
id = "s11-l04-w1"
type = "write"
points = 38
prompt = "Write <code>SelectMode(bool mock)</code> returning MOCK only when true and LIVE otherwise. Call it for false and true, one per line."
starter = '''Console.WriteLine("NOT SELECTED");
'''
expect = '''LIVE
MOCK'''
solution = '''Console.WriteLine(SelectMode(false));
Console.WriteLine(SelectMode(true));

static string SelectMode(bool mock)
{
    return mock ? "MOCK" : "LIVE";
}
'''
hint = "Return mock ? \"MOCK\" : \"LIVE\"; then call with false and true."
