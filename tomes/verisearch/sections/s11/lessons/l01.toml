[[lessons]]
id = "s11-l01"
teaches = ["interfaces"]
title = "Interfaces — Name Only the Real Seams"
body = '''
<p>An interface declares what a component can do without choosing how it does it. Verisearch has three useful seams: fetching can be replaced by deterministic HTML in tests, extraction can be isolated, and quote selection has live Ollama plus an explicit mock fixture.</p>
<pre><code><span class="k">public interface</span> ISourceFetcher
{
    Task&lt;SourceDocument&gt; FetchAsync(SourceSpec source,
        CancellationToken ct = <span class="k">default</span>);
}

<span class="k">public interface</span> IPageExtractor
{
    Task&lt;List&lt;Passage&gt;&gt; ExtractAsync(SourceDocument document);
}

<span class="k">public interface</span> IQuoteSelector
{
    Task&lt;QuoteBatch&gt; SelectAsync(<span class="k">string</span> question,
        IReadOnlyList&lt;Passage&gt; passages, CancellationToken ct = <span class="k">default</span>);
}</code></pre>
<p>Create <code>Interfaces.cs</code>, then update three class declarations:</p>
<pre><code><span class="k">public sealed class</span> SourceFetcher : ISourceFetcher
<span class="k">public sealed class</span> PageExtractor : IPageExtractor
<span class="k">public sealed class</span> OllamaQuoteSelector : IQuoteSelector</code></pre>
<p>The compiler now checks that each method signature matches its promise. <code>MockQuoteSelector</code> also implements <code>IQuoteSelector</code>, but it exists only for <code>--mock</code> and tests. It proposes the first complete passage from a known fixture, making plumbing deterministic; its output is still sent through <code>QuoteVerifier</code> and visibly labeled.</p>
<p>Do not add interfaces for <code>ReportRenderer</code>, <code>SourcePolicy</code>, or <code>QuoteVerifier</code> merely for symmetry. Each has one small deterministic implementation and tests can call it directly. Add abstraction when a real alternate or test boundary earns it.</p>
<div class="callout">Interfaces do not make untrusted output safe. <code>IQuoteSelector</code> returns <code>QuoteBatch</code>, not <code>VerifiedQuote</code>; every implementation remains on the proposal side of the proof gate.</div>
<div class="field-notes"><div class="fn-head">MARGINALIA // NAMING AND CONTRACTS</div><p>C# convention prefixes interfaces with <code>I</code>. The compiler does not require this, but the name instantly tells a reader that a field may hold different implementations. Keep each interface narrow so consumers depend only on what they use.</p></div>
'''

[[lessons.readings]]
label = "Microsoft Learn — Interfaces"
url = "https://learn.microsoft.com/en-us/dotnet/csharp/fundamentals/types/interfaces"
essential = false

[[lessons.exercises]]
id = "s11-l01-e1"
type = "mc"
points = 20
prompt = "What belongs in the course's basic interface declarations?"
choices = ["Concrete constructor calls", "Method signatures describing the contract", "Global mutable state", "Terminal colors"]
answer = 1
whyWrong = "Construction, state, and presentation belong elsewhere. The interface names callable members without selecting a concrete implementation."
explain = "Consumers compile against the contract while Program.cs chooses the implementation."
hint = "What is promised, not how it is performed."

[[lessons.exercises]]
id = "s11-l01-e2"
type = "mc"
points = 20
prompt = "Which pair are legitimate implementations of one Verisearch interface?"
choices = ["QuoteProposal and VerifiedQuote", "Panel and Rule", "OllamaQuoteSelector and MockQuoteSelector", "Program.cs and the project file"]
answer = 2
whyWrong = "The other pairs are different data states, widgets, or file roles. Both selectors accept passages and return quote proposals."
explain = "Live and explicitly mocked selection share IQuoteSelector without weakening the result type."
hint = "Look for two ways to perform the same operation."

[[lessons.exercises]]
id = "s11-l01-e3"
type = "mc"
points = 20
prompt = "When should this small CLI avoid creating an interface?"
choices = ["When there is one deterministic implementation and no useful test seam", "Whenever a class has methods", "Whenever constructor injection is used", "Whenever a record exists"]
answer = 0
whyWrong = "Methods, records, and injection do not automatically justify abstraction. An interface earns its cost through substitution or a meaningful seam."
explain = "Small concrete collaborators remain easier for a beginner to navigate."
hint = "Avoid ceremony without an alternate."

[[lessons.exercises]]
id = "s11-l01-d1"
type = "type"
points = 14
reps = 2
prompt = "Retype the selection contract and implementation header twice."
code = '''public interface IQuoteSelector
{
    Task<QuoteBatch> SelectAsync(string question,
        IReadOnlyList<Passage> passages, CancellationToken ct = default);
}

public sealed class OllamaQuoteSelector : IQuoteSelector'''

[[lessons.exercises]]
id = "s11-l01-w1"
type = "write"
points = 38
prompt = "Define <code>ISelector</code> with <code>string Select()</code>, implement LiveSelector returning live and MockSelector returning mock, store both in a list, and print both results."
starter = '''Console.WriteLine("NOT POLYMORPHIC");
'''
expect = '''live
mock'''
solution = '''var selectors = new List<ISelector> { new LiveSelector(), new MockSelector() };
foreach (ISelector selector in selectors)
{
    Console.WriteLine(selector.Select());
}

public interface ISelector { string Select(); }
public sealed class LiveSelector : ISelector { public string Select() => "live"; }
public sealed class MockSelector : ISelector { public string Select() => "mock"; }
'''
hint = "Both classes implement the same method; loop through List<ISelector>."
