prompt = "Which pair are legitimate implementations of one Verisearch interface?"
choices = ["QuoteProposal and VerifiedQuote", "Panel and Rule", "ConfiguredAiSelector and MockQuoteSelector", "Program.cs and the project file"]
answer = 2
