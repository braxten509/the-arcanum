[[lessons]]
id = "s11-l01"
teaches = ["language-interface-seam-selection"]
title = "Interfaces — Name Only the Real Seams"
body = '''

<p>An interface declares what a component can do without deciding how it does it. Use interfaces where substitution protects a real boundary: source reading can use HTTP, files, or fixtures; semantic quote selection can use a local model, hosted API, CLI wrapper, or explicit test double; reporting may have multiple formats if the learner chooses that extension.</p>
<pre><code data-kind="replacement">public interface ISemanticSelector
{
    Task&lt;ProposalBatch&gt; SelectAsync(
        string wholeQuestion,
        IReadOnlyList&lt;Passage&gt; passages,
        CancellationToken cancellationToken);
}</code></pre>
<p>The fragment names a behavior without provider details. Your contract may use different names and models. It must return proposals, not verified quotations, so every implementation remains on the untrusted side of the exact-text gate.</p>
<p>A real CLI adapter and a hosted HTTP adapter can both satisfy this contract. An explicit deterministic test double can also satisfy it, but only tests or visibly selected mock mode may construct that double. The pipeline should not know which concrete provider was chosen and should not inspect question words to select one.</p>
<p>Avoid interfaces for ceremony. A small deterministic exact verifier may remain concrete if no alternate behavior is desirable. An interface that mirrors every member of one class adds navigation without creating a useful seam. Prefer the smallest contract a caller genuinely needs.</p>
<p>Use a polymorphism experiment in disposable code: place two harmless implementations in an <code>IReadOnlyList&lt;ISemanticSelector&gt;</code>, call both through the interface, and observe that the caller remains unchanged. Then inspect your project dependencies. Provider request envelopes, credentials, process types, and HTTP response types should not appear in the common contract.</p>
<div class="callout"><p>Substitutability applies to transport and model choice. It never permits an implementation to bypass C# verification or replace AI semantics with keyword routing.</p></div>
<div class="callout csharp-transfer"><p><strong>C#/.NET transfer:</strong> C# interfaces provide nominal contracts and runtime dispatch, but every replaceable class does not need one. Prefer a small interface at a real I/O or provider seam; keep concrete domain behavior concrete when substitution would add no useful proof or design freedom.</p></div>
<div class="field-notes"><div class="fn-head">FIELD NOTES // CONTRACT PRESSURE</div><p>Try adding a second real provider on paper. If that requires changing the pipeline or verified result type, provider knowledge has leaked past the adapter boundary.</p></div>
'''

[[lessons.readings]]
label = "Microsoft Learn — Interfaces"
url = "https://learn.microsoft.com/en-us/dotnet/csharp/fundamentals/types/interfaces"
essential = false

[[lessons.exercises]]
id = "s11-l01-e1"
type = "mc"
points = 20
required = true
capabilities = ["language-interfaces-polymorphism"]
cognitiveTask = "explain"
scaffold = "guided"
contextFamily = "verisearch-s11-interface-seam-selection"
aidPolicy = "limited"
prompt = "What belongs in the course's basic interface declarations?"
choices = ["Concrete constructor calls", "Method signatures describing the contract", "Global mutable state", "Terminal colors"]
answer = 1
whyWrong = "Construction, state, and presentation belong elsewhere. The interface names callable members without selecting a concrete implementation."
explain = "Consumers compile against the contract while Program.cs chooses the implementation."
hint = "What is promised, not how it is performed."

