[[lessons.exercises]]
id = "s11-l01-w1"
type = "write"
points = 38
required = true
capabilities = ["language-interfaces-polymorphism"]
cognitiveTask = "build"
scaffold = "independent"
contextFamily = "verisearch-s11-interface-seam-selection"
aidPolicy = "limited"
prompt = "Define <code>ISelector</code> with <code>string Select()</code>, implement LiveSelector returning live and MockSelector returning mock, store both in a list, and print both results."
starter = '''Console.WriteLine("NOT POLYMORPHIC");
'''
expect = '''live
mock'''
solution = '''var selectors = new List<ISelector> { new LiveSelector(), new MockSelector() };
foreach (ISelector selector in selectors)
{
    Console.WriteLine(selector.Select());
}

public interface ISelector { string Select(); }
public sealed class LiveSelector : ISelector { public string Select() => "live"; }
public sealed class MockSelector : ISelector { public string Select() => "mock"; }
'''
hint = "Both classes implement the same method; loop through List<ISelector>."

[[lessons.concepts]]
id = "language-interface-seam-selection"
purpose = "Decide which boundaries deserve an interface, and leave the rest as plain types."
anatomy = "A seam earns a contract when substitution protects a real boundary, such as source reading or semantic selection, and the contract names behavior rather than a provider."
example = "A semantic selector contract that returns proposals rather than verified quotations, keeping the verifier outside the substitutable part."
observable = "Each interface has at least two genuine implementations, one of which the tests use."
failure = "An interface for every class adds indirection with no substitution behind it, while a missing seam forces live calls into unit tests."
practice = "s11-l01-e1"
