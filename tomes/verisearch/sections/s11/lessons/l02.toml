[[lessons]]
id = "s11-l02"
teaches = ["dependency-injection"]
title = "Dependency Injection — Receive, Do Not Hide"
body = '''
<p>Constructor injection means a class receives collaborators rather than constructing them inside itself. This makes dependencies visible, keeps one <code>HttpClient</code> lifetime, and lets tests supply fakes.</p>
<pre><code><span class="k">public sealed class</span> Pipeline
{
    <span class="k">private readonly</span> SourceBatch _batch;
    <span class="k">private readonly</span> IPageExtractor _extractor;
    <span class="k">private readonly</span> IQuoteSelector _selector;
    <span class="k">private readonly</span> QuoteVerifier _verifier;
    <span class="k">private readonly int</span> _maxQuotes;

    <span class="k">public</span> Pipeline(SourceBatch batch, IPageExtractor extractor,
        IQuoteSelector selector, QuoteVerifier verifier, <span class="k">int</span> maxQuotes)
    {
        _batch = batch;
        _extractor = extractor;
        _selector = selector;
        _verifier = verifier;
        _maxQuotes = maxQuotes;
    }
}</code></pre>
<p><code>Program.cs</code> is the composition root: the one place allowed to know concrete choices. Read the graph before writing it:</p>
<pre><code>one HttpClient
  ├─&gt; SourceFetcher ─&gt; SourceBatch
  └─&gt; OllamaQuoteSelector (LIVE only)

PageExtractor + selected IQuoteSelector + QuoteVerifier + SourceBatch
  └─&gt; Pipeline</code></pre>
<p>Construct leaves first and pass each completed object into its consumer. The exact startup code arrives in the final workshop, after the interfaces and failure policy are fixed. This separation keeps a beginner from debugging object construction and orchestration in the same edit.</p>
<p>Update <code>SourceBatch</code> so its field and constructor use <code>ISourceFetcher</code> instead of the concrete class. No service-container package is needed. Manual construction is ordinary dependency injection and is easier to debug in a CLI with this few objects.</p>
<div class="callout">The conditional selector is the only mode switch. Do not put “try Ollama, then new MockQuoteSelector” inside Pipeline; that would reintroduce silent fallback.</div>
<div class="field-notes"><div class="fn-head">MARGINALIA // OBJECT GRAPH</div><p>Read construction from leaves upward: HttpClient → SourceFetcher → SourceBatch; config plus HttpClient → selector; those collaborators → Pipeline. If a constructor error appears, fix the earliest mismatched contract rather than adding parameterless constructors.</p></div>
'''

[[lessons.readings]]
label = "Microsoft Learn — Dependency injection"
url = "https://learn.microsoft.com/en-us/dotnet/core/extensions/dependency-injection"
essential = false

[[lessons.exercises]]
id = "s11-l02-e1"
type = "mc"
points = 25
prompt = "What is the core mechanic of constructor injection?"
choices = ["Every class calls new for its own services", "Collaborators arrive as constructor parameters and are stored in fields", "All methods become static", "Configuration becomes global"]
answer = 1
whyWrong = "Hidden new calls, static-only design, and globals are alternatives to visible injection, not its mechanism."
explain = "The constructor states exactly what an instance needs before it can work."
hint = "Receive dependencies from the outside."

[[lessons.exercises]]
id = "s11-l02-e2"
type = "text"
points = 25
prompt = "What two-word name describes the startup location that wires all concrete objects?"
answer = "composition root"
accept = ["the composition root", "compositionroot"]
hint = "Program.cs composes the graph at its root."

[[lessons.exercises]]
id = "s11-l02-e3"
type = "mc"
points = 20
prompt = "Why does this composition keep the HttpClient lifetime rule clear?"
choices = ["HttpClient requires interfaces", "One instance is created at the root and supplied wherever needed", "Dependency injection closes sockets", "Each method creates a client"]
answer = 1
whyWrong = "Interfaces do not mandate HttpClient, injection does not manage sockets itself, and per-method construction is the problem being avoided."
explain = "There is one visible construction site and both network consumers share the instance."
hint = "Count new HttpClient calls in Program.cs."

[[lessons.exercises]]
id = "s11-l02-d1"
type = "type"
points = 14
reps = 2
prompt = "Retype constructor injection for the selector twice."
code = '''public sealed class Pipeline
{
    private readonly IQuoteSelector _selector;

    public Pipeline(IQuoteSelector selector)
    {
        _selector = selector;
    }
}'''

[[lessons.exercises]]
id = "s11-l02-w1"
type = "write"
points = 38
prompt = "Inject an <code>IWorker</code> into Pipeline. A MockWorker returns fixture; Pipeline.Report prints <code>pipeline: fixture</code>. Compose and run it."
starter = '''Console.WriteLine("NOT COMPOSED");
'''
expect = "pipeline: fixture"
solution = '''var pipeline = new Pipeline(new MockWorker());
pipeline.Report();

public interface IWorker { string Run(); }
public sealed class MockWorker : IWorker { public string Run() => "fixture"; }
public sealed class Pipeline
{
    private readonly IWorker _worker;
    public Pipeline(IWorker worker) { _worker = worker; }
    public void Report() { Console.WriteLine($"pipeline: {_worker.Run()}"); }
}
'''
hint = "The root calls new Pipeline(new MockWorker()); Pipeline stores IWorker and calls Run."
