[[lessons]]
id = "s11-l02"
teaches = ["language-interfaces-polymorphism"]
title = "Dependency Injection — Receive, Do Not Hide"
body = '''

<p>Constructor injection means a class receives collaborators rather than hiding construction inside its methods. Dependencies become visible, tests can supply controlled implementations, and resource lifetimes have one understandable owner.</p>
<pre><code data-kind="replacement">public sealed class SearchCoordinator
{
    private readonly ISourceReader _reader;
    private readonly ISemanticSelector _selector;

    public SearchCoordinator(ISourceReader reader, ISemanticSelector selector)
    {
        _reader = reader;
        _selector = selector;
    }
}</code></pre>
<p>This disposable example demonstrates receipt and storage only. Your architecture may coordinate through functions, smaller services, or a differently named type. Do not copy a constructor merely to match the hidden replay.</p>
<p>The <strong>composition root</strong> is the outer startup location that knows concrete choices. It may parse explicit provider configuration, create an <code>HttpClient</code> or process adapter, construct the object graph, and invoke the application. Inner code depends on common contracts. A useful dependency sketch is:</p>
<pre><code data-kind="pseudocode">configured source adapters + configured real AI adapter
    -&gt; learner-chosen coordinator
    -&gt; exact verifier
    -&gt; verified-only renderer</code></pre>
<p>The sketch is pseudocode, not a class list. Build leaves first, pass completed collaborators upward, and decide who disposes each owned resource. A CLI this size does not require a service-container package; manual constructor injection is ordinary dependency injection and often easier to debug.</p>
<p>Test the graph with a fixture reader and recording AI selector. The recording selector should observe the whole question and passages, while the common verifier rejects a fabricated proposal. A second test can construct a different real-adapter-shaped fake without changing coordinator code.</p>
<div class="callout"><p>Provider choice happens once from explicit configuration. A catch block inside the pipeline must never construct a mock or keyword selector.</p></div>
<div class="callout csharp-transfer"><p><strong>C#/.NET transfer:</strong> Dependency injection is a C# design technique before it is a framework: constructor parameters declare dependencies, and one outer composition root calls <code>new</code>. A container can automate that wiring later, but hidden service location would make ownership less visible in this project.</p></div>
<div class="field-notes"><div class="fn-head">FIELD NOTES // OWNERSHIP ARROWS</div><p>If two services need the same long-lived HTTP client, create it at an outer owner and inject it. If a subprocess belongs to one request, its adapter creates and disposes it inside that request.</p></div>
'''

[[lessons.readings]]
label = "Microsoft Learn — Dependency injection"
url = "https://learn.microsoft.com/en-us/dotnet/core/extensions/dependency-injection"
essential = false

[[lessons.exercises]]
id = "s11-l02-e1"
type = "mc"
points = 25
prompt = "What is the core mechanic of constructor injection?"
choices = ["Every class calls new for its own services", "Collaborators arrive as constructor parameters and are stored in fields", "All methods become static", "Configuration becomes global"]
answer = 1
whyWrong = "Hidden new calls, static-only design, and globals are alternatives to visible injection, not its mechanism."
explain = "The constructor states exactly what an instance needs before it can work."
hint = "Receive dependencies from the outside."

[[lessons.exercises]]
id = "s11-l02-e2"
type = "text"
points = 25
prompt = "What two-word name describes the startup location that wires all concrete objects?"
answer = "composition root"
accept = ["the composition root", "compositionroot"]
hint = "Program.cs composes the graph at its root."

[[lessons.exercises]]
id = "s11-l02-e3"
type = "mc"
points = 20
prompt = "Why does this composition keep the HttpClient lifetime rule clear?"
choices = ["HttpClient requires interfaces", "One instance is created at the root and supplied wherever needed", "Dependency injection closes sockets", "Each method creates a client"]
answer = 1
whyWrong = "Interfaces do not mandate HttpClient, injection does not manage sockets itself, and per-method construction is the problem being avoided."
explain = "There is one visible construction site and both network consumers share the instance."
hint = "Count new HttpClient calls in Program.cs."

[[lessons.exercises]]
id = "s11-l02-d1"
type = "type"
points = 14
reps = 2
prompt = "Retype constructor injection for the selector twice."
code = '''public sealed class Pipeline
{
    private readonly IQuoteSelector _selector;

    public Pipeline(IQuoteSelector selector)
    {
        _selector = selector;
    }
}'''

[[lessons.exercises]]
id = "s11-l02-w1"
type = "write"
points = 38
prompt = "Inject an <code>IWorker</code> into Pipeline. A MockWorker returns fixture; Pipeline.Report prints <code>pipeline: fixture</code>. Compose and run it."
starter = '''Console.WriteLine("NOT COMPOSED");
'''
expect = "pipeline: fixture"
solution = '''var pipeline = new Pipeline(new MockWorker());
pipeline.Report();

public interface IWorker { string Run(); }
public sealed class MockWorker : IWorker { public string Run() => "fixture"; }
public sealed class Pipeline
{
    private readonly IWorker _worker;
    public Pipeline(IWorker worker) { _worker = worker; }
    public void Report() { Console.WriteLine($"pipeline: {_worker.Run()}"); }
}
'''
hint = "The root calls new Pipeline(new MockWorker()); Pipeline stores IWorker and calls Run."

[[lessons.concepts]]
id = "language-interfaces-polymorphism"
purpose = "Name a behavioral seam so real providers and test doubles can be substituted without changing the pipeline's truth rules."
anatomy = "Declare the smallest useful interface member, implement it in separate concrete types, and depend on the interface at the caller boundary."
example = "The disposable examples in Dependency Injection — Receive, Do Not Hide isolate this capability before the learner chooses how it belongs in the cumulative project. The lesson Dependency Injection — Receive, Do Not Hide supplies the disposable observation point."
observable = "Two implementations can satisfy the same caller while verification and reporting remain unchanged. Confirm it while practicing Dependency Injection — Receive, Do Not Hide."
failure = "An interface that exposes provider details or verified output lets one implementation bypass the common contract."
practice = "s11-l02-e1"
