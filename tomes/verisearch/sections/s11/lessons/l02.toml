essential = false

[[lessons.exercises]]
id = "s11-l02-e1"
type = "mc"
points = 25
prompt = "The core mechanic of constructor injection is…"
choices = ["classes create their own dependencies with new", "dependencies arrive as constructor parameters; the class never news them up itself", "all classes are static", "dependencies are global variables"]
answer = 1
whyWrong = "Constructor injection is the opposite of new-ing your own dependencies or using globals/statics — the class receives its dependencies as constructor parameters."
hint = "Receive, don't create."

[[lessons.exercises]]
id = "s11-l02-e2"
type = "text"
points = 25
prompt = "What's the name for the single startup location that knows all concrete types and wires the object graph? (two words)"
answer = "composition root"
accept = ["the composition root", "compositionroot"]
hint = "Composition ____. Where everything gets composed."

[[lessons.exercises]]
id = "s11-l02-e3"
type = "mc"
points = 20
prompt = "Why does DI make the one-HttpClient rule easier to keep?"
choices = ["HttpClient requires DI", "DI disables sockets", "One instance is created at the root and handed to every class that needs it", "It doesn't"]
answer = 2
whyWrong = "DI doesn’t require or disable anything about HttpClient — it creates one instance at the root and hands that same one to every class, keeping the single-client rule effortless."
hint = "Single creation point → single instance, structurally."

[[lessons.exercises]]
id = "s11-l02-d1"
type = "type"
points = 14
reps = 2
prompt = "Constructor injection — deps in, fields readonly. Twice."
code = '''
public class Pipeline
{
    private readonly ISearchClient _search;

    public Pipeline(ISearchClient search)
    {
        _search = search;
    }
}'''

[[lessons.exercises]]
id = "s11-l02-w1"
type = "write"
points = 38
prompt = "Composition lab: define <code>interface ISearch { string Run(); }</code>, a <code>MockSearch</code> returning \"3 results\", and a <code>Pipeline</code> class that takes ISearch via constructor and has <code>Report()</code> printing <code>pipeline: &lt;search.Run()&gt;</code>. Compose at the root and call Report()."
expect = "pipeline: 3 results"
solution = '''
var pipeline = new Pipeline(new MockSearch());
pipeline.Report();

public interface ISearch { string Run(); }
public class MockSearch : ISearch { public string Run() => "3 results"; }
public class Pipeline
{
    private readonly ISearch search;
    public Pipeline(ISearch search) => this.search = search;
    public void Report() => Console.WriteLine($"pipeline: {search.Run()}");
}
'''
hint = "new Pipeline(new MockSearch()).Report(); — the one place concrete types appear."
