[[lessons]]
id = "s11-l02"
title = "Dependency injection — wiring without hard-wiring"
body = '''

<p><strong>DI in one sentence: classes receive their dependencies through constructors instead of new-ing them internally.</strong></p>
<pre><code><span class="c">// hard-wired: Pipeline builds its own parts — can't test, can't swap</span>
<span class="k">public class</span> Pipeline
{
    <span class="k">private readonly</span> SearxngClient _search = <span class="k">new</span>(<span class="s">"http://localhost:8080"</span>);  <span class="c">// ✗</span>
}

<span class="c">// injected: parts come in from outside — swap, mock, reconfigure freely</span>
<span class="k">public class</span> Pipeline
{
    <span class="k">private readonly</span> ISearchClient _search;
    <span class="k">private readonly</span> TrustEngine _trust;
    <span class="k">private readonly</span> IPageScraper _scraper;
    <span class="k">private readonly</span> IRelevanceScanner _scanner;

    <span class="k">public</span> Pipeline(ISearchClient search, TrustEngine trust,
                    IPageScraper scraper, IRelevanceScanner scanner)
    {
        _search = search; _trust = trust; _scraper = scraper; _scanner = scanner;
    }
}</code></pre>
<p>Someone still has to build the object graph. For a CLI tool, the honest answer is <strong>manual composition</strong> — a dozen lines at startup called the <em>composition root</em>:</p>
<pre><code><span class="c">// Program.cs — the composition root: the ONE place that knows concrete types</span>
<span class="k">var</span> config  = ConfigLoader.Load();
<span class="k">var</span> http    = <span class="k">new</span> HttpClient { Timeout = TimeSpan.FromSeconds(10) };
<span class="k">var</span> search  = <span class="k">new</span> SearxngClient(http, config);
<span class="k">var</span> trust   = <span class="k">new</span> TrustEngine(config);
<span class="k">var</span> scraper = <span class="k">new</span> PageScraper(http);
<span class="k">var</span> scanner = <span class="k">new</span> RelevanceScanner(config);
<span class="k">var</span> pipeline = <span class="k">new</span> Pipeline(search, trust, scraper, scanner);</code></pre>
<p>The framework version (<code>Microsoft.Extensions.DependencyInjection</code>) automates this with a service container — worth knowing it exists (ASP.NET runs on it), overkill for a five-object CLI. Manual composition IS dependency injection.</p>
<div class="callout">Spot the bonus: ONE HttpClient flows into both network classes. DI made the Chapter IV lifetime rule structural instead of accidental.</div><div class="field-notes"><div class="fn-head">MARGINALIA // THE DEEPER CUT — IN THORNE'S HAND</div>
<p><strong>Lifetime vocabulary</strong> (matters the moment you touch ASP.NET): <em>singleton</em> — one instance forever (your HttpClient, config) · <em>transient</em> — fresh instance per request · <em>scoped</em> — one per unit-of-work. Your manual composition root makes everything a singleton, which is exactly right for a CLI run.</p>
<p><strong>The container version</strong>, so it's not alien later:</p>
<pre><code>var services = new ServiceCollection();
services.AddSingleton&lt;ISearchClient, SearxngClient&gt;();
services.AddSingleton&lt;Pipeline&gt;();
var provider = services.BuildServiceProvider();
var pipeline = provider.GetRequiredService&lt;Pipeline&gt;();   <span class="c">// builds the whole graph</span></code></pre>
<p>Same wiring you wrote by hand, resolved automatically. Worth adopting at roughly the ten-dependency mark.</p>
<p><strong>Why testers love DI:</strong> <code>new Pipeline(new FakeSearch(), ...)</code> in a unit test — no network, no config, pure logic under test. Chapter XII cashes this in.</p></div>'''

