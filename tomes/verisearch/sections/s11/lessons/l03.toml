[[lessons]]
id = "s11-l03"
teaches = ["pipeline-orchestration"]
title = "Pipeline — One Method That Tells the Truth"
body = '''
<p>Add the final result record to <code>Models.cs</code>:</p>
<pre><code><span class="k">public sealed record</span> PipelineResult(List&lt;VerifiedQuote&gt; Quotes,
    List&lt;<span class="k">string</span>&gt; SourceErrors, <span class="k">int</span> RejectedProposals,
    <span class="k">int</span> SourcesAttempted, <span class="k">int</span> SourcesFetched, <span class="k">bool</span> Mock);</code></pre>
<p>Then create <code>Pipeline.cs</code>. Its method reads in the same order as the product claim: fetch configured sources, extract passages, request proposals, verify exact text, return facts for the renderer.</p>
<pre><code><span class="k">public async</span> Task&lt;PipelineResult&gt; RunAsync(<span class="k">string</span> question,
    IReadOnlyList&lt;SourceSpec&gt; sources, <span class="k">bool</span> mock,
    CancellationToken ct = <span class="k">default</span>)
{
    List&lt;FetchOutcome&gt; outcomes = <span class="k">await</span> _batch.FetchAllAsync(sources, ct);
    <span class="k">var</span> errors = outcomes.Where(o =&gt; !o.Ok)
        .Select(o =&gt; <span class="s">$"{o.Source.Label}: {o.Error}"</span>).ToList();
    <span class="k">var</span> quotes = <span class="k">new</span> List&lt;VerifiedQuote&gt;();
    <span class="k">int</span> rejected = 0;

    <span class="k">foreach</span> (FetchOutcome outcome <span class="k">in</span> outcomes.Where(o =&gt; o.Ok))
    {
        List&lt;Passage&gt; passages;
        <span class="k">try</span>
        {
            passages = <span class="k">await</span> _extractor.ExtractAsync(outcome.Document!);
        }
        <span class="k">catch</span> (Exception ex)
        {
            errors.Add(<span class="s">$"{outcome.Source.Label}: extraction failed: {ex.Message}"</span>);
            <span class="k">continue</span>;
        }
        <span class="k">if</span> (passages.Count == 0)
        {
            errors.Add(<span class="s">$"{outcome.Source.Label}: no usable passages"</span>);
            <span class="k">continue</span>;
        }

        <span class="k">int</span> remaining = _maxQuotes - quotes.Count;
        <span class="k">if</span> (remaining == 0) <span class="k">break</span>;
        QuoteBatch proposals = <span class="k">await</span> _selector.SelectAsync(question, passages, ct);
        VerificationBatch proof = _verifier.Verify(proposals.Quotes, passages, remaining);
        quotes.AddRange(proof.Accepted);
        rejected += proof.Rejected;
    }

    <span class="k">return new</span> PipelineResult(quotes, errors, rejected, sources.Count,
        outcomes.Count(o =&gt; o.Ok), mock);
}</code></pre>
<p>There is no search stage, no inferred trust, no proposal rendering, and no fallback catch around <code>_selector</code>. If live Ollama is unavailable, its exception reaches <code>Program.cs</code>, which can name the required service accurately.</p>
<div class="callout">The pipeline returns data and never calls Console or AnsiConsole. The same PipelineResult can feed the current terminal renderer or a future JSON renderer without changing truth logic.</div>
<div class="field-notes"><div class="fn-head">MARGINALIA // FAILURE OWNERSHIP</div><p>Fetching and extraction fail per source, so healthy sources continue. Model availability is mode-wide, so a live selector failure stops the live run. The boundary follows the scope of each failure rather than one generic “catch everything” rule.</p></div>
'''

[[lessons.readings]]
label = "Microsoft Learn — Async return types"
url = "https://learn.microsoft.com/en-us/dotnet/csharp/asynchronous-programming/async-return-types"
essential = false

[[lessons.exercises]]
id = "s11-l03-e1"
type = "mc"
points = 25
prompt = "Why does RunAsync return PipelineResult instead of printing?"
choices = ["Console is too slow", "Async methods cannot print", "Records render automatically", "Computation stays testable and presentation can change independently"]
answer = 3
whyWrong = "Console speed, async restrictions, and automatic rendering are not the reason. Returning data separates facts from their presentation."
explain = "Tests can inspect quotes, errors, and counts without scraping terminal output."
hint = "Which Chapter X class owns the face?"

[[lessons.exercises]]
id = "s11-l03-e2"
type = "mc"
points = 20
prompt = "One fetched page produces no usable passages. What should the orchestrator do?"
choices = ["Record that source error and continue with other sources", "Send empty HTML to Ollama", "Invent a passage", "Crash every source"]
answer = 0
whyWrong = "The model cannot use an empty batch, invention breaks truth, and a page-local problem should not erase healthy sources."
explain = "The reason remains visible in SourceErrors while the run continues."
hint = "Match failure scope to containment scope."

[[lessons.exercises]]
id = "s11-l03-e3"
type = "mc"
points = 20
prompt = "What parameter travels through fetching and model selection for coordinated shutdown?"
choices = ["A global Boolean", "CancellationToken", "An output string", "Thread.Abort"]
answer = 1
whyWrong = "Global flags and strings are not the .NET cancellation contract, while Thread.Abort is not the cooperative pattern."
explain = "One token lets Ctrl+C or a deadline stop all participating asynchronous operations."
hint = "It is the last parameter on the async contracts."

[[lessons.exercises]]
id = "s11-l03-d1"
type = "type"
points = 14
reps = 2
prompt = "Retype the proposal-to-proof handoff twice."
code = '''QuoteBatch proposals = await _selector.SelectAsync(question, passages, ct);
VerificationBatch proof = _verifier.Verify(proposals.Quotes, passages, remaining);
quotes.AddRange(proof.Accepted);
rejected += proof.Rejected;'''

[[lessons.exercises]]
id = "s11-l03-w1"
type = "write"
points = 36
prompt = "Write <code>RunPipeline</code> so an empty source list returns empty: no configured sources and a three-source list returns ok: 3 sources. Print both calls."
starter = '''Console.WriteLine("NOT ORCHESTRATED");
'''
expect = '''empty: no configured sources
ok: 3 sources'''
solution = '''Console.WriteLine(RunPipeline(new List<string>()));
Console.WriteLine(RunPipeline(new List<string> { "a", "b", "c" }));

static string RunPipeline(List<string> sources)
{
    if (sources.Count == 0)
    {
        return "empty: no configured sources";
    }
    return $"ok: {sources.Count} sources";
}
'''
hint = "Use a Count == 0 guard clause, then return the happy-path count."
