[[lessons.exercises]]
id = "s11-l03-w1"
type = "write"
points = 36
required = true
capabilities = ["language-namespaces-modularity"]
cognitiveTask = "integrate"
scaffold = "independent"
contextFamily = "verisearch-s11-pipeline-contract-sequencing"
aidPolicy = "limited"
prompt = "Write <code>RunPipeline</code> so an empty source list returns empty: no configured sources and a three-source list returns ok: 3 sources. Print both calls."
starter = '''Console.WriteLine("NOT ORCHESTRATED");
'''
expect = '''empty: no configured sources
ok: 3 sources'''
solution = '''Console.WriteLine(RunPipeline(new List<string>()));
Console.WriteLine(RunPipeline(new List<string> { "a", "b", "c" }));

static string RunPipeline(List<string> sources)
{
    if (sources.Count == 0)
    {
        return "empty: no configured sources";
    }
    return $"ok: {sources.Count} sources";
}
'''
hint = "Use a Count == 0 guard clause, then return the happy-path count."

[[lessons.concepts]]
id = "language-pipeline-contract-sequencing"
purpose = "Sequence the stages so each one receives exactly what the previous one promised."
anatomy = "Source selection, concurrent reading, extraction, semantic selection, verification, and reporting each take a stated input and produce a stated output, with trust marked at each arrow."
example = "The whole sequence written as arrows first, marking which values are external, where cancellation may arrive, and where partial failure is preserved."
observable = "Each stage can be described by its inputs and outputs alone, and the untrusted value stops at the verifier."
failure = "One method that reads, prompts, verifies, and prints has no boundary left to test and no place to report a partial answer."
practice = "s11-l03-e1"
