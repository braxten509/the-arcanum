cognitiveTask = "predict"
scaffold = "guided"
contextFamily = "verisearch-s11-pipeline-contract-sequencing"
aidPolicy = "limited"
prompt = "Why does RunAsync return PipelineResult instead of printing?"
choices = ["Console is too slow", "Async methods cannot print", "Records render automatically", "Computation stays testable and presentation can change independently"]
answer = 3
whyWrong = "Console speed, async restrictions, and automatic rendering are not the reason. Returning data separates facts from their presentation."
explain = "Tests can inspect quotes, errors, and counts without scraping terminal output."
hint = "Which Chapter X class owns the face?"

