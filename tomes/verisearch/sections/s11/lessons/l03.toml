[[lessons]]
id = "s11-l03"
teaches = ["language-pipeline-contract-sequencing"]
title = "Pipeline — One Method That Tells the Truth"
body = '''

<p>The pipeline is a behavioral sequence, not necessarily one class or one giant method. Its job is to preserve contracts across source selection, concurrent reading, extraction, semantic AI selection, deterministic verification, and reporting.</p>
<p>Write the sequence as arrows before coding. Mark which values are trusted, which are external, and where cancellation or partial failure may occur. The AI must receive the whole question and the stable passages from the sources the user selected. Its output remains proposals. Only the verifier may pair exact quote text with source-owned attribution.</p>
<pre><code data-kind="pseudocode">selected sources -&gt; read outcomes -&gt; stable passages
whole question + stable passages -&gt; AI proposals
proposals + same passages -&gt; verified quotations -&gt; report</code></pre>
<p>This is pseudocode architecture. You may implement a coordinator, compose functions, use application services, or choose another understandable structure. Keep the composition root at the outer edge so provider and infrastructure choices do not leak into domain verification.</p>
<p>Decide how the program behaves when all sources fail, some fail, no passages remain, the AI returns malformed JSON, every proposal is rejected, or cancellation arrives. Ordinary source failures can coexist with successful evidence. AI unavailability is not permission to run a non-AI relevance algorithm. Exact verification has no fuzzy or case-insensitive fallback unless your product explicitly changes its claim—and this tome's claim is ordinal source containment.</p>
<p>Build an integration fixture using test doubles for I/O and AI. Feed a punctuation-bearing whole question, two sources, one controlled failure, one exact proposal, and one fabricated proposal. Assert calls and final output data. This fixture becomes the rehearsal for the independent Working, not a substitute for a real configured AI run later.</p>
<div class="callout"><p>The late performance is graded on reconciled behavior and C# capability use, not resemblance to the hidden replay architecture.</p></div>
<div class="callout csharp-transfer"><p><strong>C#/.NET transfer:</strong> The pipeline can compose <code>Task&lt;T&gt;</code>, records, interfaces, LINQ, and pattern matching without a special application framework. The C# type graph should make each transition visible; the composition root selects implementations while the pipeline consumes contracts.</p></div>
<div class="field-notes"><div class="fn-head">FIELD NOTES // DRAW DEPENDENCY ARROWS</div><p>Domain verification should not point toward a CLI process, HTTP client, console library, or environment variable. Those arrows belong at adapters and composition.</p></div>
'''

