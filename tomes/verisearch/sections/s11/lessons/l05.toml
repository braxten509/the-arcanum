[[lessons]]
id = "s11-l05"
teaches = ["language-cli-packaging"]
title = "Workshop — Replace the Demos with the Real Entrypoint"
body = '''

<p>Now retire temporary demonstrations and author the real entrypoint. No finished composition root is supplied. Your own architecture must turn parsed user intent into one end-to-end execution while keeping provider choice, truth verification, and presentation separate.</p>
<p>At startup, parse help and invalid input before external work. Load the user-owned catalog, resolve explicit source choices, create infrastructure with deliberate lifetimes, select the configured AI adapter, and invoke the pipeline once. Render once from verified output. Return stable exits for success, invalid usage, ordinary failure, and cancellation.</p>
<p>The provider branch may choose a real CLI adapter, a local or hosted HTTP adapter, or an explicit test mock. It must not inspect question words. Live mode without valid AI configuration fails clearly. No catch block may replace the AI with keyword matching, a source-specific recipe, the first passage, all passages, or mock output.</p>
<pre><code data-kind="replacement">IAiQuoteSelector selector = options.Provider switch
{
    "configured-real-provider" =&gt; BuildConfiguredProvider(options),
    "explicit-test-mock" =&gt; BuildClearlyLabeledMock(),
    _ =&gt; throw new InvalidOperationException("Unsupported provider")
};</code></pre>
<p>The fragment illustrates an explicit mode seam and deliberately omits implementations. Choose names and configuration appropriate to your application. If API keys are needed, read them from an environment or secret store and never print them. If a CLI is launched, pass the whole prompt through standard input or a structured file and arguments through an argument list.</p>
<p>Re-run all earlier tests after integration. Add one fixture journey from question through report, plus a negative control that changes an exact quote by one character. Then run the program manually in explicit mock mode only to examine UX; label that output. A live provider run belongs in the final chapter's evidence.</p>
<div class="callout"><p>Compiler errors about duplicate types often mean a workshop experiment survived beside the real implementation. Trace ownership and retire obsolete demos; do not rename duplicates until both accidentally compile.</p></div>
<div class="field-notes"><div class="fn-head">FIELD NOTES // ENTRYPOINT BUDGET</div><p>The entrypoint may compose and translate top-level outcomes. If it extracts HTML, verifies quotes, or constructs citations itself, move that behavior behind the boundary that owns it.</p></div>
'''

[[lessons.readings]]
label = "Microsoft Learn — Main return values"
url = "https://learn.microsoft.com/en-us/dotnet/csharp/fundamentals/program-structure/main-command-line"
essential = false

[[lessons.exercises]]
id = "s11-l05-e1"
type = "mc"
points = 20
prompt = "Why does MockQuoteSelector still return QuoteProposal rather than VerifiedQuote?"
choices = ["Mock output skips verification", "Every selector remains untrusted and must cross the same verifier", "VerifiedQuote cannot contain fixture text", "Task.FromResult forbids it"]
answer = 1
whyWrong = "Mock must not bypass the product gate, and neither the record nor Task.FromResult prevents a different type. Shared verification proves the plumbing honestly."
explain = "Explicit mode changes selection implementation, not the proof rule."
hint = "Which contract does both selector classes implement?"

[[lessons.exercises]]
id = "s11-l05-d1"
type = "type"
points = 14
reps = 2
prompt = "Retype the one explicit mode branch twice."
code = '''IQuoteSelector selector = options.Mock
    ? new MockQuoteSelector()
    : new ConfiguredAiSelector(http, config);'''

[[lessons.exercises]]
id = "s11-l05-e2"
type = "fill"
points = 18
prompt = "Complete the conventional cancellation exit code."
code = '''catch (OperationCanceledException)
{
    Console.Error.WriteLine("canceled");
    return ____;
}'''
answer = "130"
hint = "It is 128 plus the common interrupt signal number 2."

[[lessons.exercises]]
id = "s11-l05-e3"
type = "mc"
points = 18
prompt = "A duplicate-type compiler error appears after replacing Program.cs. What is the beginner-safe response?"
choices = ["Rename the canonical model", "Search the exact type name and remove the obsolete demo declaration", "Disable compiler errors", "Create another project"]
answer = 1
whyWrong = "Renaming causes contract drift, compiler errors cannot be disabled safely, and a new project abandons cumulative work."
explain = "The workshop marks which canonical file owns each production type."
hint = "One name should have one declaration."

[[lessons.exercises]]
id = "s11-l05-w1"
type = "write"
points = 38
prompt = "Choose LiveSelector when mock is false and MockSelector when true, then print each selected Name with a <code>selected: </code> prefix."
starter = '''Console.WriteLine("NOT WIRED");

public interface ISelector { string Name { get; } }
public sealed class LiveSelector : ISelector { public string Name => "LIVE"; }
public sealed class MockSelector : ISelector { public string Name => "MOCK"; }
'''
expect = '''selected: LIVE
selected: MOCK'''
solution = '''Console.WriteLine($"selected: {Choose(false).Name}");
Console.WriteLine($"selected: {Choose(true).Name}");

static ISelector Choose(bool mock)
{
    return mock ? new MockSelector() : new LiveSelector();
}

public interface ISelector { string Name { get; } }
public sealed class LiveSelector : ISelector { public string Name => "LIVE"; }
public sealed class MockSelector : ISelector { public string Name => "MOCK"; }
'''
hint = "Return mock ? new MockSelector() : new LiveSelector(), then interpolate Name after the prefix."

[[lessons.concepts]]
id = "language-cli-packaging"
purpose = "Design a predictable command surface and deliver a runnable artifact from the same source and project metadata."
anatomy = "Parse arguments without a shell, return stable exit codes, build or publish through dotnet, then launch the produced path with a real command."
example = "The disposable examples in Workshop — Replace the Demos with the Real Entrypoint isolate this capability before the learner chooses how it belongs in the cumulative project. The lesson Workshop — Replace the Demos with the Real Entrypoint supplies the disposable observation point."
observable = "Help, invalid input, ordinary execution, and the published binary each produce their documented outcome. Confirm it while practicing Workshop — Replace the Demos with the Real Entrypoint."
failure = "Ambiguous arguments, embedded secrets, or an unlaunched publish directory leave the program unproved."
practice = "s11-l05-e1"

[[lessons.artifactSteps]]
id = "s11-l05-author-artifact"
path = "src/Verisearch/App.cs"
mode = "author"
instruction = "Use the C# ideas from Workshop — Replace the Demos with the Real Entrypoint to author or revise this learner-owned path toward the chapter behavior: Independently integrate the complete search path from behavior contracts and tests, choosing the architecture. Choose your own type names, method boundaries, and file organization; the lesson examples are disposable and are not a production template."
checks = ["The complete fixture journey yields one verified quote, one rejected fabrication, and one visible source failure through the learner's architecture.", "The complete solution builds from saved source, and a deliberately changed load-bearing input makes the relevant check fail before repair."]
