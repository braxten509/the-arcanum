[[lessons.exercises]]
id = "s11-l05-w1"
type = "write"
points = 38
required = true
capabilities = ["language-cli-packaging"]
cognitiveTask = "debug"
scaffold = "independent"
contextFamily = "verisearch-s11-composition-root-entrypoint"
aidPolicy = "limited"
prompt = "Choose LiveSelector when mock is false and MockSelector when true, then print each selected Name with a <code>selected: </code> prefix."
starter = '''Console.WriteLine("NOT WIRED");

public interface ISelector { string Name { get; } }
public sealed class LiveSelector : ISelector { public string Name => "LIVE"; }
public sealed class MockSelector : ISelector { public string Name => "MOCK"; }
'''
expect = '''selected: LIVE
selected: MOCK'''
solution = '''Console.WriteLine($"selected: {Choose(false).Name}");
Console.WriteLine($"selected: {Choose(true).Name}");

static ISelector Choose(bool mock)
{
    return mock ? new MockSelector() : new LiveSelector();
}

public interface ISelector { string Name { get; } }
public sealed class LiveSelector : ISelector { public string Name => "LIVE"; }
public sealed class MockSelector : ISelector { public string Name => "MOCK"; }
'''
hint = "Return mock ? new MockSelector() : new LiveSelector(), then interpolate Name after the prefix."

[[lessons.concepts]]
id = "language-composition-root-entrypoint"
purpose = "Retire the demonstrations and build the real entry point that turns parsed intent into one end-to-end run."
anatomy = "The entry point parses input, answers help and invalid input first, loads the catalog, creates infrastructure with deliberate lifetimes, runs the sequence, and returns a stable exit code."
example = "A provider selected from parsed options at startup, with construction and disposal owned by the entry point rather than by the stages."
observable = "One command produces the whole journey, and every earlier regression still passes afterwards."
failure = "Leaving lesson demonstrations wired into the entry point ships scaffolding as product and hides which path a run actually took."
practice = "s11-l05-e1"
