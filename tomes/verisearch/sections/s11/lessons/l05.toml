[[lessons]]
id = "s11-l05"
teaches = ["language-composition-root-entrypoint"]
title = "Workshop — Replace the Demos with the Real Entrypoint"
body = '''

<p>Now retire temporary demonstrations and author the real entrypoint. No finished composition root is supplied. Your own architecture must turn parsed user intent into one end-to-end execution while keeping provider choice, truth verification, and presentation separate.</p>
<p>At startup, parse help and invalid input before external work. Load the user-owned catalog, resolve explicit source choices, create infrastructure with deliberate lifetimes, select the configured AI adapter, and invoke the pipeline once. Render once from verified output. Return stable exits for success, invalid usage, ordinary failure, and cancellation.</p>
<p>The provider branch may choose a real CLI adapter, a local or hosted HTTP adapter, or an explicit test mock. It must not inspect question words. Live mode without valid AI configuration fails clearly. No catch block may replace the AI with keyword matching, a source-specific recipe, the first passage, all passages, or mock output.</p>
<pre><code data-kind="replacement">IAiQuoteSelector selector = options.Provider switch
{
    "configured-real-provider" =&gt; BuildConfiguredProvider(options),
    "explicit-test-mock" =&gt; BuildClearlyLabeledMock(),
    _ =&gt; throw new InvalidOperationException("Unsupported provider")
};</code></pre>
<p>The fragment illustrates an explicit mode seam and deliberately omits implementations. Choose names and configuration appropriate to your application. If API keys are needed, read them from an environment or secret store and never print them. If a CLI is launched, pass the whole prompt through standard input or a structured file and arguments through an argument list.</p>
<p>Re-run all earlier tests after integration. Add one fixture journey from question through report, plus a negative control that changes an exact quote by one character. Then run the program manually in explicit mock mode only to examine UX; label that output. A live provider run belongs in the final chapter's evidence.</p>
<div class="callout"><p>Compiler errors about duplicate types often mean a workshop experiment survived beside the real implementation. Trace ownership and retire obsolete demos; do not rename duplicates until both accidentally compile.</p></div>
<div class="callout csharp-transfer"><p><strong>C#/.NET transfer:</strong> Top-level C# statements compile into the executable entry point, and <code>return await App.RunAsync(args);</code> can propagate an integer process exit code. Keep that generated-entrypoint convenience at the edge instead of placing application logic back into <code>Program.cs</code>.</p></div>
<div class="field-notes"><div class="fn-head">FIELD NOTES // ENTRYPOINT BUDGET</div><p>The entrypoint may compose and translate top-level outcomes. If it extracts HTML, verifies quotes, or constructs citations itself, move that behavior behind the boundary that owns it.</p></div>
'''

