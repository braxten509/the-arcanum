brief = "You hold every quire: sifter, charter, far-speaking, scales, servants, bound spirit, illumination. This chapter is about ARCHITECTURE — interfaces as sworn contracts, dependency injection, an orchestrator for the whole rite, and the law of resilience: one dead part dims the working, it does not kill it. The Working: the Liber Veritatis end to end, as first commissioned."
