title = "The Binding — Every Rite Sewn Into One Spine"
build = "The whole tome, bound — chosen sources through proposal, deterministic proof, and report"
brief = "You hold every quire: configuration, source policy, concurrent fetching, extraction, local AI proposals, exact verification, and safe rendering. This chapter introduces only the interfaces that real tests or alternate implementations need, then supplies <code>Pipeline.cs</code> and a literal <code>Program.cs</code> composition root. Partial source failure survives; a missing live AI does not secretly become a different algorithm."
