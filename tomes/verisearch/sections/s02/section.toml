id = "s02"
codename = "CHAPTER II // THE NAMING OF WORK"
short = "The Naming of Work"
title = "Choices, Repetition & Named Work — Control Flow, Collections, Methods"
build = "The question boundary — small named methods preserve a seeker's whole question while rejecting unusable input"
brief = "A seeker's question must reach the model intact, not be reduced to a home-made relevance score. This chapter teaches choices (<code>if</code>, <code>switch</code>), repeated labor (loops), ordered collections, keyed lookup, recovery from bad input, and the C# boundary that makes all later chapters possible: a method with named inputs and a returned result. The Working normalizes harmless whitespace, recognizes commands, and preserves the complete question. THORNE: \"if a rune cannot be named, it cannot be tested.\""
