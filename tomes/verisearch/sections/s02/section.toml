id = "s02"
codename = "CHAPTER II // THE SIFTING OF WORDS"
short = "The Sifting of Words"
title = "Choices, Repetition & Vessels of Many — Control Flow & Collections"
build = "The question-sifter — split a seeker's words and divine what KIND of asking it is"
brief = "A seeker's raw words are noise. This chapter teaches you to make choices (<code>if</code>, <code>switch</code>), to repeat labors (loops), and to order many things at once (arrays, <code>List&lt;T&gt;</code>, <code>Dictionary</code>). Then you will work the tome's question-sifter: split an asking into its key words and divine what KIND of question stands before you. THORNE: \"a tome that cannot tell a question from a cat walking on the keys is a paperweight.\""
