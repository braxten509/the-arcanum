[freestyle]
title = "THE WORKING: CONTROL WITHOUT QUERY RULES"
brief = '''
<p><strong>Outcome:</strong> Prepare a whole question and command surface while refusing keyword-driven lookup routing.</p><p>Author the project edits yourself. The hidden replay proves one possible implementation, but it is never shown and does not define your architecture.</p><ul><li>Design a small command surface for help, quit, a whole factual question, blank input, and an explicit maximum length.</li><li>Preserve a punctuation-bearing question as one semantic value; whitespace preparation may be general, but question words may not select sources or lookup recipes.</li><li>Use a collection for repeated values and a keyed collection where lookup is genuinely useful; handle missing keys deliberately.</li><li>Separate parsing or preparation into methods with narrow scope, and distinguish invalid user input from unexpected program failure.</li><li>Demonstrate every branch and loop exit with controlled terminal inputs and retain a clean solution build.</li></ul>
'''
requires = ["language-project-toolchain", "language-namespaces-modularity", "language-types-nullability", "language-methods-scope", "language-control-flow", "language-collections-generics", "language-exceptions-resources"]
