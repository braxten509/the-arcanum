[freestyle]
title = "THE WORKING: The Question-Sifter"
brief = "Deepen your vestibule: every line that is not a leave-taking gets sifted.<ul><li>Split the line into tokens</li><li>Sieve out the chaff-words (like \"the\", \"a\", \"is\") and quiet the key words to lowercase</li><li>Divine the question's kind with a <strong>switch expression</strong> (factual / procedural / definition / general — your own taxonomy)</li><li>Speak the sifted breakdown like the milestone: <code>[Parsed] Keywords: ...</code>, <code>[Parsed] Question type: ...</code>, <code>[Parsed] Search terms: \"...\"</code></li><li>Keep Chapter I's vestibule behavior whole</li></ul>"
reward = 250
packages = []
xray = "THORNE's private tests: does \"What?\" alone survive? Is the chaff-word list truly consulted (he searches your runes for Contains)? Is the switch an EXPRESSION, not a statement — its absence costs gold on sight. Extra favor for TrimEnd('?', '.', '!') or char.IsPunctuation, and for a Dictionary mapping first-words to kinds instead of four arms carved by hand."

[freestyle.badge]
id = "badge-s02"
name = "SIFTER OF WORDS"
desc = "Taught the tome to tell a question from a cat on the keys."

[[freestyle.rubric]]
criterion = "It takes the flame & runs"
weight = 20
desc = "Forges clean; survives strange input without unhandled exceptions."

[[freestyle.rubric]]
criterion = "Splitting & sieving"
weight = 25
desc = "Split, Trim, ToLower, punctuation stripping, chaff-word sieving with a List or array."

[[freestyle.rubric]]
criterion = "Divination via switch expression"
weight = 20
desc = "A true switch expression (=> arms, _ default) drives the kind-of-question divining."

[[freestyle.rubric]]
criterion = "Vessels of many, used well"
weight = 20
desc = "Sensible use of List/array (and Dictionary if used); string.Join for the utterance."

[[freestyle.rubric]]
criterion = "Utterance & a fair hand"
weight = 15
desc = "Matches the [Parsed] form; conventional C# names (camelCase locals, PascalCase methods); Allman braces; no passages copied thrice."
