xray = "The grader inspects saved C# and project metadata, runs the chapter proof and cumulative regressions, changes a load-bearing input, and checks the observable chapter contract: A whole punctuation-bearing question survives preparation, while help, quit, blank, and oversized inputs take distinct observable paths."

