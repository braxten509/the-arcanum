[[freestyle.referenceSteps]]
id = "s02-write-cli-options"
path = "src/Verisearch/CliOptions.cs"
mode = "write"
instruction = "Private replay adds whole-question preparation and an explicit option grammar without keyword routing."
content = '''
namespace Verisearch;

public sealed record CliOptions(
    string Question,
    string CatalogPath,
    IReadOnlyList<string> SourceLabels,
    string Provider,
    string? AiCommand,
    IReadOnlyList<string> AiArguments,
    int MaxQuotes,
    bool ShowHelp)
{
    public const string Usage = """
        Verisearch — AI-proposed, C#-verified quotations

        Usage:
          verisearch "WHOLE QUESTION" [options]

        Options:
          --catalog PATH       JSON source catalog (default: verisearch.sources.json)
          --source LABEL       Select a catalog source; repeat to preserve your order
          --provider cli|mock  cli is the real AI path; mock is explicit test plumbing
          --ai-command PATH    AI program that reads the JSON prompt on stdin
          --ai-arg VALUE       One AI-program argument; repeat as needed
          --max-quotes N       Maximum accepted proposals, 1 through 20
          --help               Show this text

        Example with a local model CLI:
          verisearch "What changed?" --source release-notes --provider cli \
            --ai-command ollama --ai-arg run --ai-arg qwen3:8b
        """;

    public static CliOptions Parse(IReadOnlyList<string> args)
    {
        if (args.Count == 0)
        {
            return new CliOptions("", "verisearch.sources.json", [], "cli", null, [], 5, true);
        }

        string? question = null;
        string catalogPath = "verisearch.sources.json";
        string provider = "cli";
        string? aiCommand = null;
        int maxQuotes = 5;
        bool showHelp = false;
        var sourceLabels = new List<string>();
        var aiArguments = new List<string>();

        for (int index = 0; index < args.Count; index++)
        {
            string argument = args[index];
            switch (argument)
            {
                case "--help" or "-h":
                    showHelp = true;
                    break;
                case "--catalog":
                    catalogPath = NextValue(args, ref index, argument);
                    break;
                case "--source":
                    sourceLabels.Add(NextValue(args, ref index, argument));
                    break;
                case "--provider":
                    provider = NextValue(args, ref index, argument).ToLowerInvariant();
                    break;
                case "--ai-command":
                    aiCommand = NextValue(args, ref index, argument);
                    break;
                case "--ai-arg":
                    aiArguments.Add(NextValue(args, ref index, argument));
                    break;
                case "--max-quotes":
                    string rawMaximum = NextValue(args, ref index, argument);
                    if (!int.TryParse(rawMaximum, out maxQuotes) || maxQuotes is < 1 or > 20)
                    {
                        throw new ArgumentException("--max-quotes must be a whole number from 1 through 20");
                    }
                    break;
                default:
                    if (argument.StartsWith("-", StringComparison.Ordinal))
                    {
                        throw new ArgumentException($"unknown option: {argument}");
                    }
                    if (question is not null)
                    {
                        throw new ArgumentException("pass the whole question as one quoted argument");
                    }
                    question = PrepareQuestion(argument);
                    break;
            }
        }

        if (provider is not ("cli" or "mock"))
        {
            throw new ArgumentException("--provider must be cli or mock");
        }
        if (!showHelp && string.IsNullOrWhiteSpace(question))
        {
            throw new ArgumentException("a non-empty whole question is required");
        }

        return new CliOptions(
            question ?? "",
            catalogPath,
            sourceLabels,
            provider,
            aiCommand,
            aiArguments,
            maxQuotes,
            showHelp);
    }

    public static string PrepareQuestion(string raw)
    {
        string prepared = string.Join(' ', raw.Split(
            (char[]?)null,
            StringSplitOptions.RemoveEmptyEntries | StringSplitOptions.TrimEntries));
        if (prepared.Length > 1000)
        {
            throw new ArgumentException("the question must be 1000 characters or fewer");
        }
        return prepared;
    }

    private static string NextValue(IReadOnlyList<string> args, ref int index, string option)
    {
        if (++index >= args.Count || string.IsNullOrWhiteSpace(args[index]))
        {
            throw new ArgumentException($"{option} needs a value");
        }
        return args[index];
    }
}
'''
