[[lessons]]
id = "s02-l05"
teaches = ["language-keyed-lookup-dictionary"]
title = "Dictionary<TKey, TValue> — Find a Passage by Id"
body = '''

<p>A <code>Dictionary</code> binds keys to values with near-instant finding. The later quote verifier must locate the source passage named by a model proposal, so this chapter practices the same shape with integer id → source text:</p>
<pre><code data-kind="replacement">Dictionary&lt;<span class="k">int</span>, <span class="k">string</span>&gt; passages = <span class="k">new</span>()
{
    [1] = <span class="s">"TLS protects application data."</span>,
    [2] = <span class="s">"The protocol defines a handshake."</span>,
};

passages[3] = <span class="s">"A third exact passage."</span>;      <span class="c">// add anew or write over</span>
Console.WriteLine(passages[1]);</code></pre>
<p>Reading a key that is not written there <strong>throws</strong> (<code>KeyNotFoundException</code>). Two safe rites:</p>
<pre><code data-kind="replacement"><span class="k">if</span> (passages.ContainsKey(passageId))
    Console.WriteLine(passages[passageId]); <span class="c">// rite 1: look first (two findings)</span>

<span class="k">if</span> (passages.TryGetValue(passageId, <span class="k">out string</span>? text))
    Console.WriteLine(text);               <span class="c">// rite 2: one finding — favored</span>
<span class="k">else</span>
    Console.WriteLine(<span class="s">"unknown passage"</span>);</code></pre>
<p>Walking a dictionary yields key/value pairs:</p>
<pre><code data-kind="replacement"><span class="k">foreach</span> (<span class="k">var</span> pair <span class="k">in</span> passages)
    Console.WriteLine(<span class="s">$"{pair.Key} → {pair.Value}"</span>);</code></pre>
<div class="callout">Keys stand alone. Writing <code>passages[1] = "changed"</code> silently replaces the original text—but <code>passages.Add(1, "changed")</code> throws because the key already exists. The production extractor assigns ids once and does not rewrite passage text.</div>
<div class="callout csharp-transfer"><p><strong>C#/.NET transfer:</strong> <code>Dictionary&lt;TKey,TValue&gt;</code> makes equality policy explicit through an <code>IEqualityComparer&lt;TKey&gt;</code>. <code>TryGetValue</code> uses an <code>out</code> parameter to report lookup success without throwing, a common C# boundary pattern that Java maps tend to express differently.</p></div>
<div class="field-notes"><div class="fn-head">MARGINALIA // THE DEEPER CUT — IN THORNE'S HAND</div>
<p><strong>GetValueOrDefault</strong> is a third safe read, but a missing passage must be distinguishable from an empty one. <code>TryGetValue</code> makes that branch explicit, which is why the verifier uses it.</p>
<p><strong>Walking the parts:</strong> <code>foreach (var key in passages.Keys)</code>, <code>foreach (var value in passages.Values)</code>, or unbind pairs outright: <code>foreach (var (id, text) in passages)</code>.</p>
<p><strong>Key choice matters:</strong> keys are compared with <code>Equals</code> and <code>GetHashCode</code>. Strings and integers make good keys; mutable objects make poor ones. A case-insensitive string dictionary can use <code>StringComparer.OrdinalIgnoreCase</code>, which Chapter VII uses for configured labels.</p></div>
'''

