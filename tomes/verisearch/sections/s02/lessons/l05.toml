label = "Microsoft Learn — \"Dictionary<TKey,TValue>\""
url = "https://learn.microsoft.com/en-us/dotnet/api/system.collections.generic.dictionary-2"
essential = false

[[lessons.exercises]]
id = "s02-l05-e1"
type = "mc"
points = 20
required = true
capabilities = ["language-collections-generics"]
cognitiveTask = "explain"
scaffold = "guided"
contextFamily = "verisearch-s02-keyed-lookup-dictionary"
aidPolicy = "learning"
prompt = "<code>passages[99]</code> where the key is not written…"
choices = ["returns null", "throws KeyNotFoundException", "returns 0.0", "adds the key with a default value"]
answer = 1
whyWrong = "Indexing a Dictionary with an absent key doesn’t return null/0 or auto-add it — it throws KeyNotFoundException; use TryGetValue or ContainsKey first."
hint = "Reading and writing behave differently for missing keys."
explain = "The dictionary indexer expects a requested key to exist and throws <code>KeyNotFoundException</code> when it does not; <code>TryGetValue</code> is the safe uncertain lookup."

