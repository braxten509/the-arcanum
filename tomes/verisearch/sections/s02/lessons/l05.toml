[[lessons.exercises]]
id = "s02-l05-w1"
type = "write"
points = 34
required = true
capabilities = ["language-collections-generics"]
cognitiveTask = "build"
scaffold = "guided"
contextFamily = "verisearch-s02-keyed-lookup-dictionary"
aidPolicy = "learning"
prompt = "Bind a Dictionary&lt;int,string&gt; with 1→<code>first passage</code> and 2→<code>second passage</code>. Hear an integer id by whisper and print its text—or <code>unknown</code> when the id is absent."
stdin = "2"
expect = "second passage"
solution = '''
var passages = new Dictionary<int, string>
{
    [1] = "first passage",
    [2] = "second passage"
};
int.TryParse(Console.ReadLine(), out int id);
Console.WriteLine(passages.TryGetValue(id, out string? text) ? text : "unknown");
'''
hint = "Initializer form + TryGetValue (or GetValueOrDefault with a sentinel)."

[[lessons.concepts]]
id = "language-keyed-lookup-dictionary"
purpose = "Find one stored value by the identifier that names it, which is the shape the later quote verifier needs to locate a passage."
anatomy = "A dictionary maps each key to one value; the indexer throws on a missing key, ContainsKey asks first, and TryGetValue asks and fetches in a single step."
example = "A dictionary of passage ids and source text, read once through ContainsKey and once through TryGetValue, then enumerated as key and value pairs."
observable = "A known id returns its exact stored text, and an unknown id takes the deliberate missing-key path instead of throwing."
failure = "Reading an absent key through the indexer throws, and enumeration order is not a promise a report may rely on."
practice = "s02-l05-e1"
