[[lessons]]
id = "s02-l06"
teaches = ["language-exceptions-resources"]
title = "Exceptions — try / catch / finally"
body = '''

<p>When something impossible occurs mid-casting — a failed parse, a missing leaf, a dead road — .NET <strong>throws an exception</strong>. Left unanswered, it fells your working with a stack trace for an epitaph. <code>try/catch</code> is the binding circle:</p>
<pre><code data-kind="replacement"><span class="k">try</span>
{
    <span class="k">int</span> max = <span class="k">int</span>.Parse(userInput);     <span class="c">// may throw FormatException</span>
    Console.WriteLine(<span class="s">$"max sources: {max}"</span>);
}
<span class="k">catch</span> (FormatException)
{
    Console.WriteLine(<span class="s">"that is not a number, seeker."</span>);
}
<span class="k">catch</span> (Exception ex)                     <span class="c">// the catch-all — keep it LAST</span>
{
    Console.WriteLine(<span class="s">$"unexpected: {ex.Message}"</span>);
}
<span class="k">finally</span>
{
    Console.WriteLine(<span class="s">"this runs no matter what"</span>);   <span class="c">// the tidying goes here</span>
}</code></pre>
<ul>
<li>Catches are tried top to bottom — set the <em>particular</em> exceptions first, <code>Exception</code> last.</li>
<li><code>ex.Message</code> is the mortal-readable reason; <code>ex.StackTrace</code> shows where it struck.</li>
<li><code>finally</code> runs whether or not anything was thrown — the closing of leaves, the releasing of bindings.</li>
<li>You may throw your own: <code>throw new ArgumentException("query is empty");</code></li>
</ul>
<div class="callout">Do not wrap everything in a circle out of reflex. Bind what you can ANSWER. A misspelled vessel is a forging error, not an exception; a seeker's nonsense is an exception you answer; a flaw in your own logic should fall loudly, so you find it.</div><div class="field-notes"><div class="fn-head">MARGINALIA // THE DEEPER CUT — IN THORNE'S HAND</div>
<p><strong>The lineage of exceptions</strong> (you catch by kind, so know the common houses): <code>FormatException</code> a failed parse · <code>ArgumentException</code>/<code>ArgumentNullException</code> a bad parameter · <code>InvalidOperationException</code> "not now, not like this" · <code>KeyNotFoundException</code> · <code>IOException</code> troubled leaves · <code>HttpRequestException</code> a dead road. All descend from <code>Exception</code>.</p>
<p><strong>Throwing your own:</strong> <code>throw new ArgumentException("query is empty", nameof(query));</code> — <code>nameof</code> keeps the parameter's name true through any renaming.</p>
<p><strong>Throw vs return — the design choice:</strong> rare-and-dire → throw. Expected-and-common (a seeker mistypes a number) → the Try-rite or a default. Exceptions cost speed and clarity when made into everyday paths.</p>
<p><strong>A glimpse of <code>using</code>:</strong> <code>using var file = File.OpenRead(path);</code> closes the leaf even if an exception flies — a compiler-woven try/finally. The full telling waits in Chapter V.</p></div>
'''

[[lessons.readings]]
label = "Microsoft Learn — \"Exceptions and errors\""
url = "https://learn.microsoft.com/en-us/dotnet/csharp/fundamentals/exceptions/"
essential = false

[[lessons.exercises]]
id = "s02-l06-e1"
type = "mc"
points = 20
prompt = "<code>int.Parse(\"banana\")</code> throws which exception?"
choices = ["NullReferenceException", "IndexOutOfRangeException", "BananaException", "FormatException"]
answer = 3
whyWrong = "int.Parse on non-numeric text throws FormatException — not a null/index error, and ‘BananaException’ isn’t a real type."
hint = "The string's form is no number."
explain = "<code>int.Parse</code> throws <code>FormatException</code> when the text cannot be interpreted as a valid integer."

[[lessons.exercises]]
id = "s02-l06-e2"
type = "mc"
points = 20
prompt = "Why must <code>catch (Exception)</code> stand after <code>catch (FormatException)</code>?"
choices = ["Catches are tested in order, and Exception matches everything — later catches would be unreachable", "Alphabetical order is required", "FormatException is more severe", "It doesn't matter"]
answer = 0
whyWrong = "Order matters because catches are tried top-down and catch(Exception) matches everything, so a later specific catch would be unreachable — it’s not about severity or alphabetics."
hint = "The first match claims it. What would ever reach the particular catch?"
explain = "Catches are tested from top to bottom. Because every <code>FormatException</code> is also an <code>Exception</code>, the broad catch must come last so the specific one remains reachable."

[[lessons.exercises]]
id = "s02-l06-e3"
type = "text"
points = 25
prompt = "Which block runs whether an exception was thrown or not — the place for tidying?"
answer = "finally"
hint = "try, catch, ____."

[[lessons.exercises]]
id = "s02-l06-d1"
type = "type"
points = 12
reps = 2
prompt = "The binding circle — the particular catch first, the catch-all last. Twice."
code = '''
try
{
    int max = int.Parse(userInput);
}
catch (FormatException)
{
    Console.WriteLine("not a number");
}'''

[[lessons.exercises]]
id = "s02-l06-w1"
type = "write"
points = 32
prompt = "Hear a line by whisper and TryParse it as an int. Utter <code>ok &lt;n&gt;</code> when it parses, <code>bad input</code> when it does not. (No exceptions needed — that is the whole virtue of Try.)"
stdin = "banana"
expect = "bad input"
solution = '''
string raw = Console.ReadLine() ?? "";
if (int.TryParse(raw, out int n)) Console.WriteLine($"ok {n}");
else Console.WriteLine("bad input");
'''
hint = "if (int.TryParse(line, out int n)) ... else ..."

[[lessons.concepts]]
id = "language-exceptions-resources"
purpose = "Preserve useful failures while releasing files, HTTP responses, processes, and cancellation resources deterministically."
anatomy = "Catch only at the boundary that can add meaning, let cancellation propagate, and use using or disposal for owned resources."
example = "The disposable examples in Exceptions — try / catch / finally isolate this capability before the learner chooses how it belongs in the cumulative project. The lesson Exceptions — try / catch / finally supplies the disposable observation point."
observable = "Ordinary failures become actionable outcomes, cancellation stays cancellation, and owned resources close on every path. Confirm it while practicing Exceptions — try / catch / finally."
failure = "A broad silent catch or forgotten disposal converts evidence into hidden failure and leaks operating-system resources."
practice = "s02-l06-e1"

[[lessons.artifactSteps]]
id = "s02-l06-author-artifact"
path = "src/Verisearch/CliOptions.cs"
mode = "author"
instruction = "Use the C# ideas from Exceptions — try / catch / finally to author or revise this learner-owned path toward the chapter behavior: Prepare a whole question and command surface while refusing keyword-driven lookup routing. Choose your own type names, method boundaries, and file organization; the lesson examples are disposable and are not a production template."
checks = ["A whole punctuation-bearing question survives preparation, while help, quit, blank, and oversized inputs take distinct observable paths.", "The complete solution builds from saved source, and a deliberately changed load-bearing input makes the relevant check fail before repair."]
