[[lessons.concepts]]
id = "language-branch-selection"
purpose = "Choose one path from program state by weighing values, not by guessing at the seeker's words."
anatomy = "Comparison operators yield bool, if and else if test them in written order, and the and-or operators combine tests while skipping the rest once the answer is known."
example = "Question length sorted into long, medium, and short branches, then a guarded test that checks for a non-empty line before reading its first character."
observable = "Each prepared input reaches exactly one branch, and reordering the tests changes which branch a borderline value takes."
failure = "Branching on question keywords instead of program state turns a search tool into a lookup table that answers only the questions its author imagined."
practice = "s02-l01-e1"
