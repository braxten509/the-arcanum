[[lessons]]
id = "s02-l01"
teaches = ["language-control-flow"]
title = "if / else — choices, and the marks that feed them"
body = '''

<p>An <code>if</code> works a block only when a condition holds <code>true</code>:</p>
<pre><code data-kind="replacement"><span class="k">if</span> (length &gt;= 80)
{
    Console.WriteLine(<span class="s">"long question"</span>);
}
<span class="k">else if</span> (length &gt;= 20)
{
    Console.WriteLine(<span class="s">"medium question"</span>);
}
<span class="k">else</span>
{
    Console.WriteLine(<span class="s">"short question"</span>);
}</code></pre>
<p>The weighing marks: <code>==</code> equal, <code>!=</code> not equal, <code>&lt;</code> <code>&gt;</code> <code>&lt;=</code> <code>&gt;=</code>. Each yields a <code>bool</code>.</p>
<p>The binding marks join bools together:</p>
<pre><code data-kind="replacement">a &amp;&amp; b    <span class="c">// AND — both must hold</span>
a || b    <span class="c">// OR  — at least one holds</span>
!a        <span class="c">// NOT — turns it over</span></code></pre>
<p><code>&amp;&amp;</code> and <code>||</code> <strong>short-circuit</strong>: if <code>a</code> is false, <code>a &amp;&amp; b</code> never so much as glances at <code>b</code>. That is why this is safe even when <code>line</code> is empty:</p>
<pre><code data-kind="replacement"><span class="k">if</span> (line.Length &gt; 0 &amp;&amp; line[0] == <span class="s">'?'</span>) { ... }  <span class="c">// the second test is skipped when empty</span></code></pre>
<div class="callout">The classic snare: <code>=</code> fills a vessel, <code>==</code> weighs two things. C# spares you — <code>if (x = 5)</code> will not forge, for an int is not a bool. Be grateful; those who write C have no such mercy.</div><div class="field-notes"><div class="fn-head">MARGINALIA // THE DEEPER CUT — IN THORNE'S HAND</div>
<p><strong>The ternary mark</strong> — an if/else that IS a value: <code>string label = text.Length &gt; 0 ? "ready" : "empty";</code> Use it for simple picks; if you find yourself nesting ternaries, reach for a switch expression instead.</p>
<p><strong>Weighing doubles:</strong> floating-point arithmetic is approximate — <code>0.1 + 0.2 == 0.3</code> is FALSE. Weigh with a tolerance: <code>Math.Abs(a - b) &lt; 0.0001</code>. (Ints and decimals weigh exactly.)</p>
<p><strong>The law of braces:</strong> C# custom sets <code>{</code> on its own line. Single-statement ifs may go unbraced, but one famous Apple security wound ("goto fail") came from exactly that — in this tome, everything is braced.</p></div>
'''

[[lessons.readings]]
label = "Microsoft Learn — \"Selection statements (if, else, switch)\""
url = "https://learn.microsoft.com/en-us/dotnet/csharp/language-reference/statements/selection-statements"
essential = false

[[lessons.exercises]]
id = "s02-l01-e1"
type = "mc"
points = 15
prompt = "Which mark means logical AND?"
choices = ["&", "&&", "and", "+"]
answer = 1
whyWrong = "Single ‘&’ is the bitwise operator and ‘and’/‘+’ aren’t boolean operators — ‘&&’ is logical AND with short-circuiting."
hint = "Two of them, side by side."
explain = "<code>&amp;&amp;</code> is C#'s logical AND operator: the whole condition is true only when both boolean operands are true."

[[lessons.exercises]]
id = "s02-l01-e2"
type = "mc"
points = 20
prompt = "What does this utter when <code>length = 6</code>?"
code = '''
if (length >= 8)
    Console.WriteLine("A");
else if (length >= 4)
    Console.WriteLine("B");
else
    Console.WriteLine("C");'''
choices = ["A", "C", "B", "B and then C"]
answer = 2
whyWrong = "This is a grade-band chain: 6.5 lands in the B range, so it prints B once — a matched branch stops the chain, so C never runs."
hint = "Only the FIRST branch that matches is walked; the rest are passed by."
explain = "The first test is false, the second is true, and an <code>if / else if / else</code> chain executes only the first matching branch, so it prints <code>B</code>."

[[lessons.exercises]]
id = "s02-l01-e3"
type = "mc"
points = 25
prompt = "Why is <code>line.Length &gt; 0 &amp;&amp; line[0] == '?'</code> safe for an empty string, while <code>line[0] == '?' &amp;&amp; line.Length &gt; 0</code> collapses?"
choices = ["It isn't safe — both crash", "line[0] returns null for empty strings", "Length is always checked first regardless of order", "&& evaluates left-to-right and stops early when the left side is false"]
answer = 3
whyWrong = "Both orders would crash if both sides always ran; && evaluates left-to-right and skips the right side when the left is false, so testing Length>0 first guards line[0]."
hint = "Short-circuiting. Order matters."
explain = "C# evaluates <code>&amp;&amp;</code> from left to right. When <code>Length &gt; 0</code> is false, it skips <code>line[0]</code>, so the invalid index is never touched."

[[lessons.exercises]]
id = "s02-l01-d1"
type = "type"
points = 12
reps = 2
prompt = "The full if / else-if / else ladder — twice, until its shape is beneath thought."
code = '''
if (length >= 80)
{
    Console.WriteLine("long question");
}
else if (length >= 20)
{
    Console.WriteLine("medium question");
}
else
{
    Console.WriteLine("short question");
}'''

[[lessons.exercises]]
id = "s02-l01-w1"
type = "write"
points = 32
prompt = "Hear one whole number by whisper. Utter <code>high</code> if it is 7 or more, <code>mid</code> if 4–6, <code>low</code> otherwise."
stdin = "7"
expect = "high"
solution = '''
int n = int.Parse(Console.ReadLine() ?? "0");
if (n >= 7) Console.WriteLine("high");
else if (n >= 4) Console.WriteLine("mid");
else Console.WriteLine("low");
'''
hint = "int n = int.Parse(Console.ReadLine() ?? \"0\"); then the ladder."

[[lessons.concepts]]
id = "language-control-flow"
purpose = "Express choices and repetition from program state without turning question words into a search-routing policy."
anatomy = "Evaluate a boolean or pattern, enter the matching branch, repeat only while the loop condition holds, and keep an explicit exit path."
example = "The disposable examples in if / else — choices, and the marks that feed them isolate this capability before the learner chooses how it belongs in the cumulative project. The lesson if / else — choices, and the marks that feed them supplies the disposable observation point."
observable = "Distinct inputs take the intended branches and the loop terminates under its documented condition. Confirm it while practicing if / else — choices, and the marks that feed them."
failure = "A missing default, stale loop variable, or keyword-based product branch produces surprising or nonterminating behavior."
practice = "s02-l01-e1"

