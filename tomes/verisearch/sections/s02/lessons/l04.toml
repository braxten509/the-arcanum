[[lessons.exercises]]
id = "s02-l04-e1"
type = "mc"
points = 20
required = true
capabilities = ["language-collections-generics"]
cognitiveTask = "explain"
scaffold = "guided"
contextFamily = "verisearch-s02-collections-generics"
aidPolicy = "learning"
prompt = "You are gathering an unknown number of extracted passages from a page. The best vessel?"
choices = ["string[]", "int[]", "string", "List<string>"]
answer = 3
whyWrong = "A fixed array needs a known size and int[]/plain string are the wrong shape — List<string> grows as you add an unknown number of items."
hint = "It must grow as you .Add()."
explain = "A <code>List&lt;string&gt;</code> holds strings and can grow with <code>Add</code>, so it fits a collection whose final size is not known in advance."

