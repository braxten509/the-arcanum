[[lessons.exercises]]
id = "s02-l04-w1"
type = "write"
points = 34
required = true
capabilities = ["language-collections-generics"]
cognitiveTask = "build"
scaffold = "guided"
contextFamily = "verisearch-s02-collections-generics"
aidPolicy = "learning"
prompt = "Hear one line by whisper. Split it into words, utter the word COUNT first, then each word on its own line."
stdin = "What does TLS protect?"
expect = '''
4
What
does
TLS
protect?'''
solution = '''
string line = Console.ReadLine() ?? "";
string[] words = line.Split(' ', StringSplitOptions.RemoveEmptyEntries);
Console.WriteLine(words.Length);
foreach (string word in words) Console.WriteLine(word);
'''
hint = "Split with RemoveEmptyEntries, print tokens.Length, then foreach."

[[lessons.concepts]]
id = "language-collections-generics"
purpose = "Hold many values of one declared type in order, and choose between a fixed array and a growing list on purpose."
anatomy = "An array fixes its length at creation; List of T takes the element type as a generic parameter and offers Add, Count, and indexing as it grows."
example = "A fixed array of source labels shown beside a growing list of passages that gains entries with Add after a question is split into tokens."
observable = "Count rises as items are added, and the elements come back in the order they went in."
failure = "Indexing past the end throws, and choosing an array where the size is unknown forces a rebuild on every addition."
practice = "s02-l04-e1"
