[[lessons]]
id = "s02-l04"
teaches = ["language-collections-generics"]
title = "Arrays & List<T> — things in their order"
body = '''

<p><strong>Arrays</strong> are cast at a fixed size. Once made, they cannot grow:</p>
<pre><code data-kind="replacement"><span class="k">string</span>[] sourceLabels = { <span class="s">"RFC"</span>, <span class="s">"NIST"</span> };
sourceLabels[0] = <span class="s">"RFC 8446"</span>;   <span class="c">// exchange one thing: fine</span>
<span class="c">// sourceLabels.Add(...)  ← no such rite. Arrays do not grow.</span></code></pre>
<p><strong><code>List&lt;T&gt;</code></strong> is the growing array you will truly use. The <code>&lt;T&gt;</code> is a <em>generic type parameter</em> — a List of what?</p>
<pre><code data-kind="replacement">List&lt;<span class="k">string</span>&gt; passages = <span class="k">new</span>();
passages.Add(<span class="s">"TLS protects application data."</span>);
passages.Add(<span class="s">"A second source passage."</span>);
passages.RemoveAt(1);
Console.WriteLine(passages.Count);        <span class="c">// 1  (List keeps Count, arrays keep Length)</span>
Console.WriteLine(passages.Contains(<span class="s">"TLS protects application data."</span>)); <span class="c">// True</span>
Console.WriteLine(passages[0]);           <span class="c">// the same [index] reach as arrays</span></code></pre>
<p>The string→vessel move used for conservative whitespace normalization is <code>Split</code>:</p>
<pre><code data-kind="replacement"><span class="k">string</span> query = <span class="s">"What are the TLS 1.3 cipher suites?"</span>;
<span class="k">string</span>[] tokens = query.Split(<span class="s">' '</span>);   <span class="c">// ["What","are","the","TLS","1.3","cipher","suites?"]</span></code></pre>
<p>Its mirror, <code>string.Join</code>, puts the complete question back together after empty whitespace entries are removed:</p>
<pre><code data-kind="replacement"><span class="k">string</span> normalized = <span class="k">string</span>.Join(<span class="s">" "</span>, tokens);</code></pre>
<div class="callout">The rule of thumb: parameters and fixed matter → arrays serve. Anything you gather as you go → <code>List&lt;T&gt;</code>.</div>
<div class="callout csharp-transfer"><p><strong>C#/.NET transfer:</strong> CLR arrays have a fixed length and a runtime element type; <code>List&lt;T&gt;</code> is a generic library type that manages a resizable backing array. Collection expressions such as <code>[]</code> rely on the target type, so the receiving declaration still determines the concrete semantics.</p></div>
<div class="field-notes"><div class="fn-head">MARGINALIA // THE DEEPER CUT — IN THORNE'S HAND</div>
<p><strong>The initializer forms:</strong> <code>int[] a = { 1, 2, 3 };</code> · <code>var list = new List&lt;string&gt; { "a", "b" };</code> · an empty list: <code>List&lt;string&gt; l = new();</code> or the newest collection expression <code>List&lt;int&gt; l = [1, 2, 3];</code>.</p>
<p><strong>Split, done properly:</strong> <code>text.Split(' ')</code> yields empty entries for doubled spaces. The input boundary uses <code>text.Split(' ', StringSplitOptions.RemoveEmptyEntries | StringSplitOptions.TrimEntries)</code>, then joins every token again. This is formatting cleanup, not word selection.</p>
<p><strong>Other List workings:</strong> <code>Insert(0, item)</code> set before all, <code>list[^1]</code> the last thing (index-from-end), <code>list.GetRange(0, 3)</code> the first three, <code>Clear()</code>.</p></div>
'''

