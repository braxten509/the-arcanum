[[lessons]]
id = "s02-l02"
teaches = ["language-control-flow"]
title = "switch — statements, expressions, and the reading of patterns"
body = '''

<p>When one value must be held against many possibilities, <code>switch</code> outshines a ladder of ifs. The elder <strong>statement</strong> form:</p>
<pre><code data-kind="replacement"><span class="k">switch</span> (command)
{
    <span class="k">case</span> <span class="s">"quit"</span>:
    <span class="k">case</span> <span class="s">"exit"</span>:              <span class="c">// two cases, one handling</span>
        running = <span class="k">false</span>;
        <span class="k">break</span>;
    <span class="k">case</span> <span class="s">"help"</span>:
        ShowHelp();
        <span class="k">break</span>;
    <span class="k">default</span>:                  <span class="c">// nothing matched</span>
        Console.WriteLine(<span class="s">"unknown command"</span>);
        <span class="k">break</span>;
}</code></pre>
<p>Modern C# adds the <strong>switch expression</strong> — it <em>yields a value</em>, wields <code>=&gt;</code>, and takes <code>_</code> as the catch-all. This is the form the vestibule uses to distinguish commands from a complete question:</p>
<pre><code data-kind="replacement"><span class="k">string</span> kind = normalized <span class="k">switch</span>
{
    <span class="s">"quit"</span> <span class="k">or</span> <span class="s">"exit"</span> =&gt; <span class="s">"Stop"</span>,
    <span class="s">"help"</span>           =&gt; <span class="s">"Help"</span>,
    _                =&gt; <span class="s">"Question"</span>
};</code></pre>
<p>Patterns reach beyond exact values — you may match ranges and conditions:</p>
<pre><code data-kind="replacement"><span class="k">string</span> size = question.Length <span class="k">switch</span>
{
    &gt;= 80 =&gt; <span class="s">"Long"</span>,
    &gt;= 20 =&gt; <span class="s">"Medium"</span>,
    _     =&gt; <span class="s">"Short"</span>
};</code></pre>
<div class="callout">This chapter's seal literally reads "can wield switch <em>expressions</em>, not merely statements." THORNE will inspect the input boundary for one.</div>
<div class="callout csharp-transfer"><p><strong>C#/.NET transfer:</strong> Modern C# has both <code>switch</code> statements and value-producing <code>switch</code> expressions. Its patterns can inspect type, property, relational, and null shapes, while <code>when</code> adds a guard; use that language machinery for input states, not for factual keyword routing.</p></div>
<div class="field-notes"><div class="fn-head">MARGINALIA // THE DEEPER CUT — IN THORNE'S HAND</div>
<p><strong>when guards</strong> lay conditions upon any pattern arm: <code>{ Length: &gt; 100 } when text.Contains("RFC") =&gt; ...</code>. Bind patterns with <code>and</code>/<code>or</code>/<code>not</code>: <code>&gt;= 4.0 and &lt; 8.0 =&gt; "mid"</code>.</p>
<p><strong>Exhaustiveness:</strong> if a switch expression may receive a value no arm matches, the compiler WARNS you — and at casting time it throws <code>SwitchExpressionException</code>. The <code>_</code> arm is your net; always weave one unless you match a closed enum whole.</p>
<p><strong>Statement vs expression — the choosing:</strong> must you RUN different runes per case? Statement. Must you PICK a value per case? Expression. The tome's divining picks values → expression.</p></div>
'''

