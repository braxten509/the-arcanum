[[lessons.exercises]]
id = "s02-l02-w1"
type = "write"
points = 32
required = true
capabilities = ["language-control-flow"]
cognitiveTask = "build"
scaffold = "guided"
contextFamily = "verisearch-s02-control-flow"
aidPolicy = "learning"
prompt = "Hear one line by whisper and classify it with a switch expression after trimming and lowercasing: \"quit\" or \"exit\"→Stop, \"help\"→Help, anything else→Question. Utter the classification."
stdin = "HELP"
expect = "Help"
solution = '''
string normalized = (Console.ReadLine() ?? "").Trim().ToLowerInvariant();
string kind = normalized switch
{
    "quit" or "exit" => "Stop",
    "help" => "Help",
    _ => "Question"
};
Console.WriteLine(kind);
'''
hint = "Normalize only for comparison, pass that value through the switch expression, then WriteLine the result."

[[lessons.concepts]]
id = "language-control-flow"
purpose = "Express choices and repetition from program state without turning question words into a search-routing policy."
anatomy = "Evaluate a boolean or pattern, enter the matching branch, repeat only while the loop condition holds, and keep an explicit exit path."
example = "The disposable examples in switch — statements, expressions, and the reading of patterns isolate this capability before the learner chooses how it belongs in the cumulative project. The lesson switch — statements, expressions, and the reading of patterns supplies the disposable observation point."
observable = "Distinct inputs take the intended branches and the loop terminates under its documented condition. Confirm it while practicing switch — statements, expressions, and the reading of patterns."
failure = "A missing default, stale loop variable, or keyword-based product branch produces surprising or nonterminating behavior."
practice = "s02-l02-e1"
