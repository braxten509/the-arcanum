[[lessons.exercises]]
id = "s02-l02-e1"
type = "text"
points = 20
required = true
capabilities = ["language-control-flow"]
cognitiveTask = "recall"
scaffold = "guided"
contextFamily = "verisearch-s02-control-flow"
aidPolicy = "learning"
prompt = "In a switch <em>expression</em>, which pattern serves as the default/catch-all case? (one character)"
answer = "_"
accept = ["underscore", "discard"]
hint = "It's called the discard pattern."

[[lessons.exercises]]
id = "s02-l02-e2"
type = "mc"
points = 20
required = true
capabilities = ["language-control-flow"]
cognitiveTask = "explain"
scaffold = "guided"
contextFamily = "verisearch-s02-control-flow"
aidPolicy = "learning"
prompt = "What does <code>type</code> become?"
code = '''
string normalized = "help";
string type = normalized switch
{
    "quit" or "exit" => "Stop",
    "help" => "Help",
    _ => "Question"
};'''
choices = ["Help", "Stop", "Question", "normalized"]
answer = 0
whyWrong = "The input matches the Help arm; the other labels belong to paths this value did not take."
hint = "Hold the value against each arm, top to bottom."
explain = "The value <code>\"help\"</code> matches the <code>\"help\" =&gt; \"Help\"</code> arm, so the switch expression yields <code>Help</code>."

