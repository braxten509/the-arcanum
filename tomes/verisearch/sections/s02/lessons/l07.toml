[[lessons.exercises]]
id = "s02-l07-w1"
type = "write"
points = 36
required = true
capabilities = ["language-methods-scope"]
cognitiveTask = "build"
scaffold = "guided"
contextFamily = "verisearch-s02-methods-scope"
aidPolicy = "learning"
prompt = "Write <code>static bool TryPrepare(string raw, out string question)</code>. Collapse repeated spaces, return false for an empty result, and otherwise return true without dropping words or punctuation. Call it with <code>\"  What  is TLS?  \"</code> and print <code>&lt;bool&gt; &lt;question&gt;</code>."
starter = '''bool ok = TryPrepare("  What  is TLS?  ", out string question);
Console.WriteLine("NOT IMPLEMENTED");

static bool TryPrepare(string raw, out string question)
{
    question = "";
    return false;
}
'''
expect = "True What is TLS?"
solution = '''bool ok = TryPrepare("  What  is TLS?  ", out string question);
Console.WriteLine($"{ok} {question}");

static bool TryPrepare(string raw, out string question)
{
    question = string.Join(' ', raw.Split(' ',
        StringSplitOptions.RemoveEmptyEntries | StringSplitOptions.TrimEntries));
    return question.Length > 0;
}
'''
hint = "Assign string.Join over Split with RemoveEmptyEntries, then return whether the result has any characters."

[[lessons.concepts]]
id = "language-methods-scope"
purpose = "Give one transformation a named boundary with deliberate inputs, output, and variable lifetime."
anatomy = "Declare the return type, method name, typed parameters, body, and return path; keep locals inside the narrowest useful scope."
example = "The disposable examples in Methods — Give One Job a Name isolate this capability before the learner chooses how it belongs in the cumulative project. The lesson Methods — Give One Job a Name supplies the disposable observation point."
observable = "Callers can exercise the behavior from its result without depending on hidden global state. Confirm it while practicing Methods — Give One Job a Name."
failure = "A method that reads unrelated globals or has an incomplete return path makes tests and reuse unreliable."
