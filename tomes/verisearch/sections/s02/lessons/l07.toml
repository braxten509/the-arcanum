[[lessons]]
id = "s02-l07"
teaches = ["language-methods-scope"]
title = "Methods — Give One Job a Name"
body = '''
<p>Your vestibule works, but every new behavior has been poured into one long top-level scroll. C# methods let you give a job a name, state what it needs, and state what it returns. That boundary is the first tool for keeping a growing program understandable.</p>
<pre><code data-kind="replacement"><span class="k">static bool</span> TryPrepareQuestion(<span class="k">string</span> raw,
    <span class="k">out string</span> question, <span class="k">out string</span> error)
{
    question = <span class="k">string</span>.Join(<span class="s">' '</span>, raw.Split(<span class="s">' '</span>,
        StringSplitOptions.RemoveEmptyEntries | StringSplitOptions.TrimEntries));
    <span class="k">if</span> (question.Length == 0)
    {
        error = <span class="s">"question is empty"</span>;
        <span class="k">return false</span>;
    }
    <span class="k">if</span> (question.Length &gt; 500)
    {
        error = <span class="s">"question is longer than 500 characters"</span>;
        <span class="k">return false</span>;
    }
    error = <span class="s">""</span>;
    <span class="k">return true</span>;
}</code></pre>
<p>The first word after <code>static</code> is the <strong>return type</strong>. This method returns a <code>bool</code>: true means the two output values are ready to use. The <code>out</code> parameters let the method return either a prepared question or a repair message without throwing for ordinary input:</p>
<pre><code data-kind="replacement"><span class="k">if</span> (TryPrepareQuestion(input, <span class="k">out string</span> question, <span class="k">out string</span> error))
    Console.WriteLine(<span class="s">$"[Ready] Question: {question}"</span>);
<span class="k">else</span>
    Console.WriteLine(<span class="s">$"[Input] {error}"</span>);</code></pre>
<p>Whitespace normalization is deliberately conservative. It removes accidental doubled spaces but keeps every meaningful word, punctuation mark, and capital letter for the AI. Verisearch does not decide relevance with a hand-written bag of search terms. In a top-level <code>Program.cs</code>, local method declarations go after executable statements. Chapter III later moves stable data shapes into their own file.</p>
<div class="callout"><strong>Scope is where a name exists.</strong> A parameter exists only inside its method. A variable declared with <code>out int score</code> inside an <code>if</code> condition exists through the surrounding block after that condition; it is not trapped inside <code>TryParse</code>. Hover a name in the editor to see its type, and trust <code>dotnet build</code> over the color of a squiggle.</div>
<div class="callout csharp-transfer"><p><strong>C#/.NET transfer:</strong> C# overload resolution uses the compile-time argument types, and method signatures include parameter types but not the return type alone. Named and optional arguments are part of the call surface; keep them deliberate because renaming a public parameter can break callers even when the method still compiles.</p></div>
<div class="field-notes"><div class="fn-head">MARGINALIA // VOID, RETURN, AND THE CALLER</div>
<p>A <code>void</code> method performs work but returns no value. Prefer returning data when another part of the program must use the result; it is easier to test than a method that prints internally. The <code>Try...</code> naming convention promises expected failure through a boolean, while exceptional failures may still throw. Use early <code>return</code> statements for invalid input, but keep the happy path visible. If a method needs six unrelated parameters, a record or class should probably carry those values together—exactly what the next chapter teaches.</p></div>
'''

