[[lessons]]
id = "s13-l01"
teaches = ["language-published-artifact-delivery"]
title = "Publish and Run the Artifact You Will Actually Ship"
body = '''

<p><code>dotnet publish</code> creates the artifact a user will actually launch. A successful debug run does not prove that output, dependencies, executable permissions, or startup behavior survive delivery.</p>
<pre><code data-kind="terminal">$ dotnet publish ./src/YourApp/YourApp.csproj     --configuration Release     --runtime linux-x64     --self-contained true     -p:PublishSingleFile=true     --output ./dist</code></pre>
<p>The command is an example for one runtime identifier. Choose the RID matching the target system and document it. Self-contained means the selected .NET runtime is bundled with the application. It does not bundle a local model service, hosted API, credentials, source pages, or an arbitrary external AI command.</p>
<p>Run the exact file under <code>dist</code>. Check <code>--help</code>, invalid invocation, the acceptance fixture, and one ordinary configured-provider path where the environment permits. If the program launches another AI CLI, that executable remains an external requirement. If it calls an API, network access and credentials remain external requirements.</p>
<p>Publish from a clean project state after tests. Inspect output size and filenames, but do not infer success from their presence. A single-file application can still fail at startup because it assumed <code>Assembly.Location</code>, a working directory, or a development-only file. Resolve user-supplied paths explicitly and use <code>Environment.ProcessPath</code> when the running executable path is the fact you need.</p>
<p>The course's package proof launches the built artifact and repeats positive and negative acceptance controls. Your learner evidence should additionally show that the documented provider setup works on your environment without committing secrets.</p>
<div class="callout"><p>Delivery proof covers the C# program. External AI requirements must remain explicit rather than silently replaced when absent.</p></div>
<div class="callout csharp-transfer"><p><strong>C#/.NET transfer:</strong> <code>dotnet build</code> produces development outputs; <code>dotnet publish</code> resolves a deployment graph for a runtime and configuration. A self-contained single-file publish bundles the .NET runtime, but it is still managed .NET deployment—not automatically a native-AOT binary or a universal cross-platform executable.</p></div>
<div class="field-notes"><div class="fn-head">FIELD NOTES // CLEAN LAUNCH</div><p>Change the working directory before launching the published path. If behavior changes unintentionally, a relative-path assumption is part of the product contract whether you documented it or not.</p></div>
'''

[[lessons.readings]]
label = "Microsoft Learn — dotnet publish"
url = "https://learn.microsoft.com/en-us/dotnet/core/tools/dotnet-publish"
essential = false

[[lessons.exercises]]
id = "s13-l01-e1"
type = "mc"
points = 20
required = true
capabilities = ["language-cli-packaging"]
cognitiveTask = "explain"
scaffold = "guided"
contextFamily = "verisearch-s13-published-artifact-delivery"
aidPolicy = "limited"
prompt = "What does <code>--self-contained true</code> mean?"
choices = ["It bundles the selected .NET runtime with the application", "It bundles the configured AI and the model", "It supports every OS in one file", "It removes configuration"]
answer = 0
whyWrong = "the configured AI, models, configuration, and other operating systems remain separate concerns. Self-contained refers to the selected .NET runtime."
explain = "A machine without the SDK can run the RID-specific artifact."
hint = "Ask which runtime normally executes a .NET assembly."

[[lessons.exercises]]
id = "s13-l01-e2"
type = "fill"
points = 20
required = true
