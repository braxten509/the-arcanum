code = '''dotnet publish -c Release -r ____ --self-contained true'''
answer = "win-x64"
hint = "Operating system abbreviation, hyphen, architecture."

[[lessons.exercises]]
id = "s13-l01-e3"
type = "mc"
points = 20
required = true
capabilities = ["language-cli-packaging"]
cognitiveTask = "explain"
scaffold = "guided"
contextFamily = "verisearch-s13-published-artifact-delivery"
aidPolicy = "limited"
prompt = "Why does the beginner release use <code>PublishTrimmed=false</code>?"
choices = ["Trimming changes the source URL", "Trimming can remove dynamically discovered code and must be validated separately", "Single-file requires false", "Release builds cannot trim"]
answer = 1
whyWrong = "Trimming does not alter source URLs, is compatible with some single-file releases, and can run in Release. Its dynamic-code risk is the reason to defer it."
explain = "A larger known-good artifact is preferable to a smaller subtly broken first release."
hint = "Static reachability cannot always see reflection."

[[lessons.exercises]]
id = "s13-l01-d1"
type = "type"
points = 14
required = false
capabilities = ["language-cli-packaging"]
cognitiveTask = "complete"
scaffold = "worked"
contextFamily = "verisearch-s13-published-artifact-delivery"
aidPolicy = "limited"
reps = 2
prompt = "Retype the Linux release command twice."
code = '''dotnet publish Verisearch.csproj -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=false -o ./release/linux-x64'''

[[lessons.concepts]]
id = "language-published-artifact-delivery"
purpose = "Produce and launch the artifact a stranger will actually run, not the debug run that only works here."
anatomy = "The publish command takes a configuration, a runtime identifier, and a self-contained choice, and the produced path is what must be executed and documented."
example = "A release publish for one named runtime identifier, followed by launching the produced executable from a clean directory."
observable = "The published executable starts outside the source tree, finds its dependencies, and answers the same commands the debug run did."
failure = "Shipping the debug output, or documenting a path that exists only on the build machine, delivers a product nobody else can start."
practice = "s13-l01-e1"
