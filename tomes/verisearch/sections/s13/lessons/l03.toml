[[lessons.exercises]]
id = "s13-l03-w1"
type = "write"
points = 38
required = true
capabilities = ["language-testing-debugging"]
cognitiveTask = "test-design"
scaffold = "independent"
contextFamily = "verisearch-s13-acceptance-journey-proof"
aidPolicy = "limited"
prompt = "Given acceptance rung Booleans for build, tests, mock, live, and publish, print PASS only when every rung is true."
starter = '''var rungs = new[] { true, true, true, true, true };
Console.WriteLine("NOT CHECKED");
'''
expect = "PASS"
solution = '''var rungs = new[] { true, true, true, true, true };
Console.WriteLine(rungs.All(passed => passed) ? "PASS" : "FAIL");
'''
hint = "Use All with a lambda returning each Boolean."

[[lessons.concepts]]
id = "language-acceptance-journey-proof"
purpose = "Prove the whole program from its public boundaries, and prove each promise can fail."
anatomy = "Each scenario runs from the entry point with exact commands and recorded observations, then one load-bearing input is varied to watch the promise fail before it is restored."
example = "The full journey run after the extension and rationale are complete, with the fabrication case observed failing before restoration."
observable = "Every recorded scenario is reproducible from the commands written down, including the deliberate failure."
failure = "A prepared pass receipt with no observed failure proves only that the run happened, not that the boundary holds."
practice = "s13-l03-e1"
