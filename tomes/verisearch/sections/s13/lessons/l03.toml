[[lessons.exercises]]
id = "s13-l03-e1"
type = "mc"
points = 20
required = true
capabilities = ["language-testing-debugging"]
cognitiveTask = "explain"
scaffold = "guided"
contextFamily = "verisearch-s13-acceptance-journey-proof"
aidPolicy = "limited"
prompt = "Why does live acceptance avoid asserting one fixed quotation?"
choices = ["The verifier is optional", "Sources have no text", "C# cannot compare strings", "Model selection can vary, while exact-substring and attribution invariants must not"]
answer = 3
whyWrong = "Verification remains mandatory, C# compares strings, and sources provide the passages. Only semantic selection is nondeterministic."
explain = "Acceptance checks stable safety properties around a variable model choice."
hint = "Separate chosen content from rules every chosen item must obey."

