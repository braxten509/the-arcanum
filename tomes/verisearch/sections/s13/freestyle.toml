[[freestyle.referenceSteps]]
id = "s13-write-acceptance-harness"
path = "src/Verisearch/AcceptanceHarness.cs"
mode = "write"
instruction = "Private replay computes every acceptance scenario from exercised behavior and challenge inputs."
content = '''
using System.Text.Json;

namespace Verisearch;

public static class AcceptanceHarness
{
    public static readonly string[] ScenarioIds =
    [
        "parse-whole-question",
        "honor-user-source-choice",
        "extract-stable-passages",
        "invoke-configured-ai",
        "reject-fabricated-quote",
        "preserve-source-attribution",
        "survive-partial-source-failure",
        "render-cited-report",
        "clean-package-launch"
    ];

    public static async Task<int> RunAsync(string? challenge)
    {
        AcceptanceControls controls = AcceptanceControls.ForChallenge(challenge);
        var observations = new Dictionary<string, bool>(StringComparer.Ordinal)
        {
            [ScenarioIds[0]] = CheckWholeQuestion(controls),
            [ScenarioIds[1]] = CheckSourceChoice(controls),
            [ScenarioIds[2]] = CheckExtraction(controls),
            [ScenarioIds[3]] = await CheckAiInvocationAsync(controls),
            [ScenarioIds[4]] = CheckFabricationRejection(controls),
            [ScenarioIds[5]] = CheckAttribution(controls),
            [ScenarioIds[6]] = await CheckPartialFailureAsync(controls),
            [ScenarioIds[7]] = CheckRendering(controls),
            [ScenarioIds[8]] = CheckPackageLaunch(controls)
        };
        bool passed = observations.Values.All(value => value);
        var report = new AcceptanceReport(1, passed ? "PASS" : "FAIL", observations);
        Console.WriteLine(JsonSerializer.Serialize(report, new JsonSerializerOptions
        {
            PropertyNamingPolicy = JsonNamingPolicy.CamelCase
        }));
        return 0;
    }

    public static async Task<int> RunAiFixtureAsync()
    {
        string input = await Console.In.ReadToEndAsync();
        using JsonDocument document = JsonDocument.Parse(input);
        JsonElement root = document.RootElement;
        string? question = root.GetProperty("question").GetString();
        JsonElement passage = root.GetProperty("passages")[0];
        string passageId = passage.GetProperty("passageId").GetString() ?? "";
        string text = passage.GetProperty("text").GetString() ?? "";
        string quote = text.Length > 36 ? text[..36] : text;
        object[] quotes = question == "Why did Release 7 change?"
            ? [new { passageId, quote }]
            : [];
        Console.WriteLine(JsonSerializer.Serialize(new { quotes }));
        return 0;
    }

    private static bool CheckWholeQuestion(AcceptanceControls controls)
    {
        try
        {
            CliOptions options = CliOptions.Parse([controls.Question]);
            return options.Question == "Why did Release 7 change?";
        }
        catch (ArgumentException)
        {
            return false;
        }
    }

    private static bool CheckSourceChoice(AcceptanceControls controls)
    {
        try
        {
            SourceSpec first = new("First", new Uri("https://example.test/first"));
            SourceSpec second = new("Second", new Uri("https://example.test/second"));
            IReadOnlyList<SourceSpec> selected = SourceSelection.Select(
                [first, second],
                [controls.RequestedSource]);
            return selected is [var only] && only == second;
        }
        catch (InvalidOperationException)
        {
            return false;
        }
    }

    private static bool CheckExtraction(AcceptanceControls controls)
    {
        SourceSpec source = new("Fixture", new Uri("https://example.test/fixture"));
        IReadOnlyList<Passage> first = new PassageExtractor().Extract(
            new SourceDocument(source, controls.Html));
        IReadOnlyList<Passage> second = new PassageExtractor().Extract(
            new SourceDocument(source, controls.Html));
        return first.Count == 2
            && first.Select(item => item.Id).SequenceEqual(second.Select(item => item.Id))
            && first.All(item => !item.Text.Contains("Menu", StringComparison.Ordinal));
    }

    private static async Task<bool> CheckAiInvocationAsync(AcceptanceControls controls)
    {
        if (!controls.AiEnabled || Environment.ProcessPath is not { } processPath)
        {
            return false;
        }
        SourceSpec source = new("Source", new Uri("https://example.test/source"));
        Passage passage = new("p-one", source, "A sufficiently long exact passage for evidence.");
        var selector = new CliAiQuoteSelector(
            processPath,
            ["--arcanum-ai-fixture"],
            3);
        QuoteBatch batch = await selector.SelectAsync(
            CliOptions.PrepareQuestion(controls.Question),
            [passage],
            CancellationToken.None);
        return batch.Quotes is [var proposal]
            && proposal.PassageId == passage.Id
            && proposal.Quote == passage.Text[..36];
    }

    private static bool CheckFabricationRejection(AcceptanceControls controls)
    {
        SourceSpec source = new("Source", new Uri("https://example.test/source"));
        Passage passage = new("p-one", source, "The exact source sentence remains unchanged.");
        QuoteProposal proposal = new(passage.Id, controls.ProposedFabrication);
        VerificationResult result = new QuoteVerifier().Verify(
            [passage],
            new QuoteBatch([proposal]),
            3);
        return result.Quotes.Count == 0 && result.RejectedCount == 1;
    }

    private static bool CheckAttribution(AcceptanceControls controls)
    {
        SourceSpec source = new("Trusted Label", new Uri("https://example.test/trusted"));
        Passage passage = new("p-one", source, "The source owns its label and address.");
        VerificationResult result = new QuoteVerifier().Verify(
            [passage],
            new QuoteBatch([new QuoteProposal(passage.Id, "owns its label")]),
            3);
        return result.Quotes is [var quote]
            && quote.SourceLabel == controls.ExpectedLabel
            && quote.SourceUri == source.Uri;
    }

    private static async Task<bool> CheckPartialFailureAsync(AcceptanceControls controls)
    {
        SourceSpec good = new("Good", new Uri("https://example.test/good"));
        SourceSpec bad = new("Bad", new Uri("https://example.test/bad"));
        var selector = new RecordingSelector(true);
        var pipeline = new SearchPipeline(
            new SourceBatch(new AcceptanceReader(good, controls.GoodSourceWorks)),
            new PassageExtractor(),
            selector,
            new QuoteVerifier(),
            3,
            false);
        SearchResult result = await pipeline.RunAsync(
            "Why did Release 7 change?",
            [good, bad],
            CancellationToken.None);
        return result.Quotes.Count == 1
            && result.Sources.Count(item => !item.Succeeded) == 1;
    }

    private static bool CheckRendering(AcceptanceControls controls)
    {
        SourceSpec source = new("Citation", new Uri("https://example.test/citation"));
        var result = new SearchResult(
            [new VerifiedQuote("p-one", "An exact quotation.", source.Label, source.Uri)],
            [new SourceReadOutcome(source, new SourceDocument(source, "text"), null)],
            0,
            false);
        string report = controls.RenderEnabled
            ? new ReportRenderer().Compose("A question?", result)
            : "";
        return report.Contains("An exact quotation.", StringComparison.Ordinal)
            && report.Contains(source.Label, StringComparison.Ordinal)
            && report.Contains(source.Uri.ToString(), StringComparison.Ordinal);
    }

    private static bool CheckPackageLaunch(AcceptanceControls controls)
    {
        return Environment.ProcessPath is { } processPath
            && File.Exists(processPath)
            && controls.PackageToken == "verisearch-package-v1";
    }

    private sealed record AcceptanceReport(
        int Version,
        string Status,
        Dictionary<string, bool> Scenarios);

    private sealed record AcceptanceControls(
        string Question,
        string RequestedSource,
        string Html,
        bool AiEnabled,
        string ProposedFabrication,
        string ExpectedLabel,
        bool GoodSourceWorks,
        bool RenderEnabled,
        string PackageToken)
    {
        public static AcceptanceControls ForChallenge(string? challenge)
        {
            var controls = new AcceptanceControls(
                "Why   did Release 7 change?",
                "Second",
                "<nav><p>Menu words that must stay outside the selected main region.</p></nav>"
                    + "<main><p>The first stable passage contains enough exact source text.</p>"
                    + "<ul><li><p>The second nested passage must appear only once in output.</p></li></ul></main>",
                true,
                "fabricated words absent from the source",
                "Trusted Label",
                true,
                true,
                "verisearch-package-v1");
            return challenge switch
            {
                "parse-whole-question" => controls with { Question = " " },
                "honor-user-source-choice" => controls with { RequestedSource = "Missing" },
                "extract-stable-passages" => controls with { Html = "<nav><p>Menu only.</p></nav>" },
                "invoke-configured-ai" => controls with { AiEnabled = false },
                "reject-fabricated-quote" => controls with
                {
                    ProposedFabrication = "The exact source sentence"
                },
                "preserve-source-attribution" => controls with { ExpectedLabel = "Model Label" },
                "survive-partial-source-failure" => controls with { GoodSourceWorks = false },
                "render-cited-report" => controls with { RenderEnabled = false },
                "clean-package-launch" => controls with { PackageToken = "invalid" },
                _ => controls
            };
        }
    }

    private sealed class RecordingSelector(bool enabled) : IAiQuoteSelector
    {
        public string? SeenQuestion { get; private set; }

        public Task<QuoteBatch> SelectAsync(
            string question,
            IReadOnlyList<Passage> passages,
            CancellationToken cancellationToken)
        {
            cancellationToken.ThrowIfCancellationRequested();
            SeenQuestion = question;
            if (!enabled || passages.Count == 0)
            {
                return Task.FromResult(new QuoteBatch([]));
            }
            string quote = passages[0].Text.Length > 36
                ? passages[0].Text[..36]
                : passages[0].Text;
            return Task.FromResult(new QuoteBatch([
                new QuoteProposal(passages[0].Id, quote)
            ]));
        }
    }

    private sealed class AcceptanceReader(SourceSpec good, bool goodSourceWorks) : ISourceReader
    {
        public Task<SourceDocument> ReadAsync(
            SourceSpec source,
            CancellationToken cancellationToken)
        {
            cancellationToken.ThrowIfCancellationRequested();
            if (source != good || !goodSourceWorks)
            {
                throw new HttpRequestException("controlled failure");
            }
            const string html = "<main><p>A good source retains enough exact text for a verified quotation.</p></main>";
            return Task.FromResult(new SourceDocument(source, html));
        }
    }
}
'''
[[freestyle.referenceSteps]]
id = "s13-write-readme"
path = "README.md"
mode = "write"
instruction = "Private replay documents provider freedom, live AI setup, explicit mock semantics, tests, and delivery."
content = '''
# Verisearch

Verisearch is a C# command-line evidence tool. You choose the sources. A configured AI
process receives the whole question and extracted passages, then proposes exact quotations.
C# accepts a proposal only when its text is an ordinal substring of the named passage and
attaches the source label and URL from the source catalog, never from model output.

There is deliberately no keyword-to-source table, question classifier, or silent non-AI
fallback. `--provider cli` is the real path. `--provider mock` is deterministic test plumbing
and prints an unmistakable warning; its output is not a factual search result.

## Build and test

```text
dotnet build Verisearch.slnx
dotnet test Verisearch.slnx
```

Create `verisearch.sources.json` in the working directory:

```json
{
  "sources": [
    { "label": "C# guide", "url": "https://learn.microsoft.com/dotnet/csharp/" },
    { "label": "Local notes", "url": "file:///absolute/path/to/notes.html" }
  ]
}
```

Any local or wrapper CLI can be the AI adapter when it reads the JSON prompt from standard
input and writes exactly one JSON object to standard output:

```json
{"quotes":[{"passageId":"p-...","quote":"exact source substring"}]}
```

For example, a local model CLI can be wired without compiling provider knowledge into the
search pipeline:

```text
dotnet run --project src/Verisearch/Verisearch.csproj -- \
  "What changed in the release?" \
  --source "Local notes" \
  --provider cli \
  --ai-command ollama \
  --ai-arg run \
  --ai-arg qwen3:8b
```

Use `--ai-command` for a wrapper that calls an authenticated API if that is your chosen
provider. Credentials belong in the wrapper's environment or secret store, never in the
source catalog or repository.

## Limits

Exact containment proves that displayed quote text occurs in fetched source text. It does not
prove that a source is correct, current, complete, unbiased, or authoritative. HTML extraction
normalizes whitespace before both AI selection and verification. Dynamic pages, inaccessible
pages, and non-text formats can fail. A successful report therefore gives auditable evidence,
not an automatic guarantee that an answer is true.
'''
[[freestyle.referenceSteps]]
id = "s13-rewrite-application"
path = "src/Verisearch/App.cs"
mode = "rewrite"
instruction = "Private replay preserves the complete application and adds the computed acceptance entrypoint."
preserves = "all-active"
content = '''
namespace Verisearch;

public static class App
{
    public static async Task<int> RunAsync(string[] args)
    {
        if (args is ["--arcanum-ai-fixture"])
        {
            return await AcceptanceHarness.RunAiFixtureAsync();
        }
        if (args is ["--arcanum-acceptance"])
        {
            return await AcceptanceHarness.RunAsync(
                Environment.GetEnvironmentVariable("ARCANUM_ACCEPTANCE_CHALLENGE"));
        }
        if (args is ["--arcanum-proof", string proofId])
        {
            return await ProofHarness.RunAsync(proofId);
        }

        CliOptions options;
        try
        {
            options = CliOptions.Parse(args);
        }
        catch (ArgumentException exception)
        {
            Console.Error.WriteLine(exception.Message);
            Console.Error.WriteLine(CliOptions.Usage);
            return 2;
        }

        if (options.ShowHelp)
        {
            Console.WriteLine(CliOptions.Usage);
            return 0;
        }

        try
        {
            using var cancellation = new CancellationTokenSource(TimeSpan.FromSeconds(60));
            IReadOnlyList<SourceSpec> catalog = await SourceCatalog.LoadAsync(
                options.CatalogPath,
                cancellation.Token);
            IReadOnlyList<SourceSpec> sources = SourceSelection.Select(
                catalog,
                options.SourceLabels);

            using var httpClient = new HttpClient { Timeout = TimeSpan.FromSeconds(20) };
            httpClient.DefaultRequestHeaders.UserAgent.ParseAdd("Verisearch/4.0");
            IAiQuoteSelector selector = CreateSelector(options);
            var pipeline = new SearchPipeline(
                new SourceBatch(new SourceReader(httpClient)),
                new PassageExtractor(),
                selector,
                new QuoteVerifier(),
                options.MaxQuotes,
                options.Provider == "mock");
            SearchResult result = await pipeline.RunAsync(
                options.Question,
                sources,
                cancellation.Token);
            Console.WriteLine(new ReportRenderer().Compose(options.Question, result));
            return 0;
        }
        catch (OperationCanceledException)
        {
            Console.Error.WriteLine("verisearch canceled or timed out");
            return 130;
        }
        catch (Exception exception)
        {
            Console.Error.WriteLine($"verisearch failed: {exception.Message}");
            return 1;
        }
    }

    private static IAiQuoteSelector CreateSelector(CliOptions options)
    {
        return options.Provider switch
        {
            "mock" => new ExplicitMockAiQuoteSelector(),
            "cli" when !string.IsNullOrWhiteSpace(options.AiCommand) =>
                new CliAiQuoteSelector(
                    options.AiCommand,
                    options.AiArguments,
                    options.MaxQuotes),
            "cli" => throw new InvalidOperationException(
                "the real cli provider requires --ai-command; no non-AI fallback will be used"),
            _ => throw new InvalidOperationException($"unsupported AI provider: {options.Provider}")
        };
    }
}
'''
