title = "The Harvest — HTML Parsing & Passage Extraction"
build = "The extraction boundary — fetched HTML in, stable source-owned passages out"
brief = "Far pages are wilderness: menus, scripts, notices, and useful prose share one tree. This chapter teaches the DOM, AngleSharp selectors, deterministic text normalization, and responsible fetching. Its Working adds <code>PageExtractor.cs</code>, producing the exact numbered <code>Passage.Text</code> values that both the local model and the later verifier will see."
