build = "The gleaning rite — a far page in, clean numbered passages out"
brief = "The heaviest chapter yet. Far pages are wilderness — hawkers' bills, signposts, scripts, tags bent out of true. Your labor: fetch a page and glean clean, numbered passages from it with AngleSharp. You will learn the DOM, CSS selectors, the scouring of text, and the courtesies that keep a gleaner welcome in foreign fields (robots.txt, measured visits, an honest name at the gate). The Working: the tome's gleaning rite."
