[[lessons]]
id = "s06-l02"
teaches = ["anglesharp-parse"]
title = "AngleSharp — parse HTML like a browser"
body = '''

<p>AngleSharp (<code>dotnet add package AngleSharp</code>) parses HTML with the same algorithm real browsers use — so even broken markup parses the way a browser would render it. Two ways in:</p>
<pre><code><span class="k">using</span> AngleSharp;
<span class="k">using</span> AngleSharp.Dom;

<span class="c">// Option A: you already have the HTML string (your HttpClient fetched it)</span>
<span class="k">var</span> context = BrowsingContext.New(Configuration.Default);
IDocument doc = <span class="k">await</span> context.OpenAsync(req =&gt; req.Content(html));

<span class="c">// Option B: let AngleSharp fetch the URL itself</span>
<span class="k">var</span> context2 = BrowsingContext.New(Configuration.Default.WithDefaultLoader());
IDocument doc2 = <span class="k">await</span> context2.OpenAsync(<span class="s">"https://example.com"</span>);</code></pre>
<p>Prefer Option A for Verisearch — your HttpClient already handles timeouts, headers, and errors; keep one door to the network. Build immediately after adding the package so package errors stay separate from selector errors.</p>
<p>Querying uses <strong>CSS selectors</strong> — the same syntax as browser dev tools:</p>
<pre><code>IElement? first = doc.QuerySelector(<span class="s">"h1"</span>);                <span class="c">// first match or null</span>
<span class="k">var</span> blocks = doc.QuerySelectorAll(<span class="s">"p, pre, blockquote"</span>);  <span class="c">// every match</span>

<span class="k">foreach</span> (IElement el <span class="k">in</span> blocks)
    Console.WriteLine(<span class="s">$"&lt;{el.TagName.ToLower()}&gt; {el.TextContent[..Math.Min(60, el.TextContent.Length)]}"</span>);</code></pre>
<p>Selector crash course:</p>
<pre><code>p                <span class="c">→ every &lt;p&gt;</span>
p, pre           <span class="c">→ every &lt;p&gt; AND every &lt;pre&gt;</span>
article p        <span class="c">→ &lt;p&gt; anywhere inside &lt;article&gt;</span>
.intro           <span class="c">→ anything with class="intro"</span>
#main            <span class="c">→ the element with id="main"</span>
p.intro          <span class="c">→ &lt;p&gt; with class "intro"</span></code></pre><div class="field-notes"><div class="fn-head">MARGINALIA // THE DEEPER CUT — IN THORNE'S HAND</div>
<p><strong>Configuration flavors:</strong> <code>Configuration.Default</code> parses strings you hand it; <code>.WithDefaultLoader()</code> adds networking so OpenAsync(url) can fetch. Verisearch uses the first — your HttpClient stays the single door to the network (one place for timeouts, headers, robots checks).</p>
<p><strong>Encoding & malformed HTML:</strong> AngleSharp detects charset from headers/meta tags and repairs broken markup with the SAME algorithm browsers use — unclosed tags, orphaned &lt;/div&gt;s — you get the tree the user would have seen.</p>
<p><strong>Selector escalation path</strong> when a site fights you: try <code>article p</code> → fall back to <code>main p</code> → fall back to <code>p</code> with junk-removal + crumb filtering. Code that degrades selector-by-selector survives redesigns.</p></div>'''

