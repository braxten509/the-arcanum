[[lessons.exercises]]
id = "s06-l02-e1"
type = "fill"
points = 25
prompt = "Fill the blank to select ALL paragraph, code-block, and blockquote elements."
code = "var blocks = doc.____(\"p, pre, blockquote\");"
answer = "QuerySelectorAll"
accept = ["queryselectorall"]
hint = "The plural one — QuerySelector returns only the first."

[[lessons.exercises]]
id = "s06-l02-e2"
type = "mc"
points = 20
prompt = "<code>doc.QuerySelector(\"h1\")</code> on a page with no h1 returns…"
choices = ["an empty element", "an empty string", "throws ElementNotFoundException", "null — guard before using it"]
answer = 3
whyWrong = "QuerySelector doesn’t return an empty element/string or throw when nothing matches — it returns null, so guard before dereferencing."
hint = "The return type is IElement? — note the ?."

[[lessons.exercises]]
id = "s06-l02-e3"
type = "mc"
points = 20
prompt = "Which CSS selector finds every <code>&lt;p&gt;</code> INSIDE an <code>&lt;article&gt;</code>?"
choices = ["article p", "article.p", "article + p", "p article"]
answer = 0
whyWrong = "‘article.p’ means a p with that class, ‘+’ is a sibling and ‘p article’ reverses the nesting — a space (‘article p’) is the descendant combinator."
hint = "A space means 'descendant of'."

[[lessons.exercises]]
id = "s06-l02-d1"
type = "type"
points = 14
reps = 2
prompt = "Parse-a-string-you-fetched — the exact shape your scraper uses. Twice."
code = '''
var context = BrowsingContext.New(Configuration.Default);
IDocument doc = await context.OpenAsync(req => req.Content(html));
var blocks = doc.QuerySelectorAll("h1, h2, h3, p, pre, li, blockquote");'''
