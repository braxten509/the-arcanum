[[lessons.concepts]]
id = "language-html-parsing-package"
purpose = "Add a browser-grade HTML parser as a declared dependency and keep exactly one door to the network."
anatomy = "The package is referenced in project metadata, a parser turns markup text into a document, and the selector calls return one node or many."
example = "AngleSharp added with dotnet add package, then markup already fetched by the existing HTTP client parsed locally so the network path stays in one place."
observable = "Broken markup parses the way a browser would render it, and the exact package version is recorded in the project file."
failure = "Letting the parser fetch its own pages duplicates timeout, header, and error policy in a place the tests do not control."
practice = "s06-l02-e1"
