[[lessons]]
id = "s06-l03"
teaches = ["passage-cleaning"]
title = "Clean Passages Without Rewriting Their Words"
body = '''
<p>Raw <code>TextContent</code> can contain line breaks, tabs, non-breaking spaces, and page furniture. Verisearch needs a stable representation: the model must see the same <code>Passage.Text</code> that C# later checks. Clean structure and spacing, but never correct grammar, swap punctuation, summarize, or add missing words.</p>
<p>First choose a likely content container. Prefer <code>&lt;main&gt;</code>, then <code>&lt;article&gt;</code>, then the document body. Within it, select prose-bearing elements such as paragraphs, list items, and block quotes. Avoid selecting both a container and all of its descendants, which would duplicate text.</p>
<ol><li>Choose one content root.</li><li>Visit its prose elements in document order.</li><li>Normalize each element once.</li><li>Skip only clearly unusable crumbs.</li><li>Assign the next id after acceptance, not before filtering.</li></ol>
<p>Normalize only whitespace that HTML rendering already treats as spacing:</p>
<pre><code><span class="k">string</span> ordinarySpaces = rawText.Replace(<span class="s">'\u00A0'</span>, <span class="s">' '</span>);
<span class="k">string</span> stableText = Regex.Replace(ordinarySpaces, <span class="s">@"\s+"</span>, <span class="s">" "</span>).Trim();</code></pre>
<p>This representation is exact for Verisearch's contract: every displayed quote must be an ordinal substring of one normalized passage. The README must say that HTML whitespace is normalized, so “verbatim” is not confused with the page's raw bytes. Store the source on every passage; an integer without its source is not an attribution.</p>
<div class="callout">Never normalize the proposal separately. Normalize once during extraction, send that stored value to Ollama, then verify against that same stored value.</div>
<div class="field-notes"><div class="fn-head">MARGINALIA // STABILITY BEFORE CLEVERNESS</div><p>Short-element filtering is a heuristic, not truth. Keep the threshold visible and tested. If a source routinely uses short authoritative statements, lower it in one place instead of smuggling special cases into the model prompt.</p></div>
'''

[[lessons.readings]]
label = "AngleSharp — DOM examples"
url = "https://github.com/AngleSharp/AngleSharp/blob/devel/docs/tutorials/03-Examples.md"
essential = false

[[lessons.exercises]]
id = "s06-l03-e1"
type = "mc"
points = 25
prompt = "Why must normalization happen before passages are sent to Ollama?"
choices = ["Ollama cannot read newlines", "The model and verifier must operate on the identical stored text", "Regex makes sources trusted", "It converts HTML to JSON"]
answer = 1
whyWrong = "Ollama can receive newlines, regex does not establish trust, and JSON is a different boundary. One stored representation prevents verification drift."
explain = "Extract once, store once, and reuse that exact string for proposal and proof."
hint = "Compare the string seen during selection with the string checked later."

[[lessons.exercises]]
id = "s06-l03-e2"
type = "mc"
points = 20
prompt = "Which operation would violate the extraction contract?"
choices = ["Collapse a run of HTML whitespace", "Replace a non-breaking space with an ordinary space", "Correct a source's misspelled word", "Trim outer whitespace"]
answer = 2
whyWrong = "Whitespace normalization is declared by the product, but correcting a word changes source content and could create a quotation the page never displayed."
explain = "The extractor may normalize representation; it may not edit meaning or wording."
hint = "Which choice changes letters rather than spacing?"

[[lessons.exercises]]
id = "s06-l03-e3"
type = "mc"
points = 25
prompt = "Why does a <code>Passage</code> carry its <code>SourceSpec</code>?"
choices = ["To let the model rewrite URLs", "To keep source identity attached when passages are verified and rendered", "AngleSharp requires it", "To avoid using records"]
answer = 1
whyWrong = "Neither AngleSharp nor records require source metadata, and the model must not rewrite attribution. C# carries identity through its own data."
explain = "The eventual citation comes from the matched passage, not model output."
hint = "Follow a quote's URL backward to its owner."

[[lessons.exercises]]
id = "s06-l03-d1"
type = "type"
points = 14
reps = 2
prompt = "Retype the one-time whitespace normalization twice."
code = '''string ordinarySpaces = text.Replace('\u00A0', ' ');
return Regex.Replace(ordinarySpaces, @"\s+", " ").Trim();'''

[[lessons.exercises]]
id = "s06-l03-w1"
type = "write"
points = 35
prompt = "Write <code>Normalize</code> so tabs, line breaks, and repeated spaces in <code>\"  Exact\t source\n words.  \"</code> become one space, then print the result."
starter = '''using System.Text.RegularExpressions;

string raw = "  Exact\t source\n words.  ";
Console.WriteLine(Normalize(raw));

static string Normalize(string text)
{
    return text;
}
'''
expect = "Exact source words."
solution = '''using System.Text.RegularExpressions;

string raw = "  Exact\t source\n words.  ";
Console.WriteLine(Normalize(raw));

static string Normalize(string text)
{
    string ordinarySpaces = text.Replace('\u00A0', ' ');
    return Regex.Replace(ordinarySpaces, @"\s+", " ").Trim();
}
'''
hint = "Use Regex.Replace with the pattern @\"\\s+\", then Trim."
