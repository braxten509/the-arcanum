prompt = "Implement <code>AddPassage</code>: trim the supplied text, ignore it when shorter than 5 characters, otherwise append a one-based <code>Passage</code>. Call it with <code>\" no \"</code> and <code>\" Exact source words. \"</code>, then print count, id, and text."
starter = '''var passages = new List<Passage>();
AddPassage(passages, " no ");
AddPassage(passages, " Exact source words. ");
Console.WriteLine($"{passages.Count} {passages[0].Id} {passages[0].Text}");

static void AddPassage(List<Passage> passages, string raw)
{
}

public record Passage(int Id, string Text);
'''
expect = "1 1 Exact source words."
solution = '''var passages = new List<Passage>();
AddPassage(passages, " no ");
AddPassage(passages, " Exact source words. ");
Console.WriteLine($"{passages.Count} {passages[0].Id} {passages[0].Text}");

static void AddPassage(List<Passage> passages, string raw)
{
    string text = raw.Trim();
    if (text.Length < 5)
    {
        return;
    }
    passages.Add(new Passage(passages.Count + 1, text));
}

public record Passage(int Id, string Text);
'''
hint = "Trim first; return for a short string; use passages.Count + 1 before Add."

[[lessons.concepts]]
id = "language-extraction-component-assembly"
purpose = "Assemble one extraction policy whose output every later stage uses, so the truth boundary cannot drift between them."
anatomy = "A container is chosen, prose-bearing elements are selected, text is normalized once, and each passage receives a deterministic identifier."
example = "A single Normalize helper that joins split text, used to produce the passages that both the prompt and the verifier receive."
observable = "Two runs over the same input produce identical passage ids and identical text, and a nested sentence appears exactly once."
failure = "Prompting from one representation while verifying against another lets a genuinely exact quote be rejected and an altered one accepted."
practice = "s06-l05-e1"
