[[lessons]]
id = "s06-l05"
teaches = ["language-interfaces-polymorphism"]
title = "Workshop — Assemble PageExtractor"
body = '''

<p>Extraction turns source material into the stable units seen by both the AI and the verifier. This is where a subtle mismatch can invalidate the whole truth boundary: if the prompt contains rewritten text but verification compares a different representation, exact quotation becomes arbitrary.</p>
<p>Design one extraction policy and use its output everywhere downstream. For HTML, a DOM parser can select meaningful containers such as paragraphs, list items, or block quotations. Avoid traversing both a container and a selected descendant when that repeats the same words. For plain text, split on a documented structural boundary. Normalize whitespace once, after structural extraction, without paraphrasing punctuation or wording.</p>
<pre><code data-kind="replacement">static string Normalize(string text) =&gt;
    string.Join(' ', text.Split((char[]?)null,
        StringSplitOptions.RemoveEmptyEntries));</code></pre>
<p>The fragment is a local transform, not a complete extractor. You choose minimum length, container policy, and identifier strategy. Stable identifiers may be deterministic hashes, source-scoped ordinals, or another reproducible scheme. They must not depend on iteration accidents or random values. If two sources can both contain a passage “1,” include source identity in lookup or make identifiers globally unique.</p>
<p>Author fixtures rather than relying on a changing website. Include nested <code>&lt;li&gt;&lt;p&gt;...&lt;/p&gt;&lt;/li&gt;</code>, repeated whitespace, ignored navigation, two sources with similar text, and a second extraction of the same input. Assert that nested prose appears once, wording remains exact after the chosen normalization, and identifiers repeat.</p>
<p>AngleSharp is one valid DOM choice, not the product algorithm. The factual relevance decision still belongs to a real AI later. The extractor may discard structural noise by a general documented policy; it must not route “who,” “when,” or other question keywords into different selectors or source-specific lookup rules.</p>
<div class="callout"><p>The learner owns the extraction architecture. The invariant is shared representation: AI sees the same passage text and id that deterministic C# later verifies.</p></div>
<div class="field-notes"><div class="fn-head">FIELD NOTES // DUPLICATION PROBE</div><p>Count a distinctive nested sentence in the final passage collection. A visual spot check can miss duplicate evidence; an exact count exposes it.</p></div>
'''

[[lessons.readings]]
label = "AngleSharp — project documentation"
url = "https://anglesharp.github.io/"
essential = false

[[lessons.exercises]]
id = "s06-l05-e1"
type = "mc"
points = 20
prompt = "Why does <code>PageExtractor</code> accept <code>SourceDocument</code> instead of a URL?"
choices = ["AngleSharp cannot parse URLs", "Fetching and parsing remain separate boundaries that can be tested independently", "Records cannot store URLs", "It makes extraction synchronous"]
answer = 1
whyWrong = "AngleSharp can fetch with other configuration, records can hold URLs, and the method remains asynchronous. The input separates network behavior from deterministic parsing."
explain = "A fixture can exercise all extraction rules without a network request."
hint = "Which Chapter IV class already owns HTTP?"

[[lessons.exercises]]
id = "s06-l05-d1"
type = "type"
points = 14
reps = 2
prompt = "Retype the ordered container-selection chain twice."
code = '''IElement scope = parsed.QuerySelector("main")
    ?? parsed.QuerySelector("article")
    ?? parsed.Body
    ?? parsed.DocumentElement;'''

[[lessons.exercises]]
id = "s06-l05-e2"
type = "fill"
points = 18
prompt = "Complete the expression that assigns stable one-based ids as accepted passages are added."
code = '''passages.Add(new Passage(passages.____ + 1, text, document.Source));'''
answer = "Count"
hint = "A List reports how many accepted items it already has."

[[lessons.exercises]]
id = "s06-l05-e3"
type = "mc"
points = 18
prompt = "Two different source pages both produce passage id 1. Why is this safe in the designed pipeline?"
choices = ["Integers are globally unique", "Each model call and verification batch is scoped to one source whose SourceSpec remains attached", "the configured AI renumbers everything", "The renderer discards source identity"]
answer = 1
whyWrong = "The integers are not globally unique, the configured AI does not own numbering, and the renderer retains attribution. Source-scoped batches disambiguate them."
explain = "Passage identity is the pair of its source-owned batch and local id."
hint = "Look beyond the integer to the Passage record."

[[lessons.exercises]]
id = "s06-l05-w1"
type = "write"
points = 38
prompt = "Implement <code>AddPassage</code>: trim the supplied text, ignore it when shorter than 5 characters, otherwise append a one-based <code>Passage</code>. Call it with <code>\" no \"</code> and <code>\" Exact source words. \"</code>, then print count, id, and text."
starter = '''var passages = new List<Passage>();
AddPassage(passages, " no ");
AddPassage(passages, " Exact source words. ");
Console.WriteLine($"{passages.Count} {passages[0].Id} {passages[0].Text}");

static void AddPassage(List<Passage> passages, string raw)
{
}

public record Passage(int Id, string Text);
'''
expect = "1 1 Exact source words."
solution = '''var passages = new List<Passage>();
AddPassage(passages, " no ");
AddPassage(passages, " Exact source words. ");
Console.WriteLine($"{passages.Count} {passages[0].Id} {passages[0].Text}");

static void AddPassage(List<Passage> passages, string raw)
{
    string text = raw.Trim();
    if (text.Length < 5)
    {
        return;
    }
    passages.Add(new Passage(passages.Count + 1, text));
}

public record Passage(int Id, string Text);
'''
hint = "Trim first; return for a short string; use passages.Count + 1 before Add."

[[lessons.concepts]]
id = "language-interfaces-polymorphism"
purpose = "Name a behavioral seam so real providers and test doubles can be substituted without changing the pipeline's truth rules."
anatomy = "Declare the smallest useful interface member, implement it in separate concrete types, and depend on the interface at the caller boundary."
example = "The disposable examples in Workshop — Assemble PageExtractor isolate this capability before the learner chooses how it belongs in the cumulative project. The lesson Workshop — Assemble PageExtractor supplies the disposable observation point."
observable = "Two implementations can satisfy the same caller while verification and reporting remain unchanged. Confirm it while practicing Workshop — Assemble PageExtractor."
failure = "An interface that exposes provider details or verified output lets one implementation bypass the common contract."
practice = "s06-l05-e1"

[[lessons.artifactSteps]]
id = "s06-l05-author-artifact"
path = "src/Verisearch/PassageExtractor.cs"
mode = "author"
instruction = "Use the C# ideas from Workshop — Assemble PageExtractor to author or revise this learner-owned path toward the chapter behavior: Turn HTML or text into stable nonduplicated passages used identically by AI selection and C# verification. Choose your own type names, method boundaries, and file organization; the lesson examples are disposable and are not a production template."
checks = ["The same fixture produces the same passage ids twice and a nested list paragraph appears exactly once.", "The complete solution builds from saved source, and a deliberately changed load-bearing input makes the relevant check fail before repair."]
