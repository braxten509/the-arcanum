brief = '''
<p><strong>Outcome:</strong> Turn HTML or text into stable nonduplicated passages used identically by AI selection and C# verification.</p><p>Author the project edits yourself. The hidden replay proves one possible implementation, but it is never shown and does not define your architecture.</p><ul><li>Add a DOM parser or another justified structural parser and record the exact dependency in project metadata.</li><li>Extract meaningful HTML or text containers into stable passages while filtering structural noise by a general documented policy.</li><li>Normalize whitespace once and use the resulting exact text identically for AI prompting and C# verification.</li><li>Author fixtures for nested elements, duplicate descendants, repeated whitespace, ignored navigation, and deterministic identifiers.</li><li>Prove a nested sentence occurs once and two runs over the same input produce the same ids and text.</li></ul>
'''
