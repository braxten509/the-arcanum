criterion = "Compiles & scrapes a real page"
weight = 20
desc = "scrape https://example.com produces sane numbered blocks."

[[freestyle.rubric]]
criterion = "DOM handling"
weight = 25
desc = "Junk removal before extraction, correct selectors, TextContent usage, null-safety."

[[freestyle.rubric]]
