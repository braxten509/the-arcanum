[freestyle]
title = "THE WORKING: The Passage Extractor"
requires = ["html-dom", "anglesharp-parse", "passage-cleaning", "fetch-etiquette", "page-extractor"]
brief = "Continue the same project and build the deterministic extraction boundary.<ul><li>Create <code>PageExtractor.cs</code> from the workshop. It accepts a fetched <code>SourceDocument</code>; it never performs HTTP itself.</li><li>Parse with AngleSharp, prefer <code>main</code> then <code>article</code> then body, and extract useful prose elements without duplicating nested text.</li><li>Normalize whitespace once, filter only clearly unusable crumbs, assign stable one-based passage ids, and preserve the original <code>SourceSpec</code> on every result.</li><li>Add an explicit local fixture containing menus plus three real passages. Print each id and exact normalized text.</li><li>State in a code comment that the same stored <code>Passage.Text</code> goes to Ollama and <code>QuoteVerifier</code>.</li><li>Run <code>dotnet build</code> and verify the fixture produces the same output on two runs.</li></ul>"
reward = 400
packages = ["AngleSharp"]
xray = "THORNE hides content inside main and article, adds noisy navigation and irregular whitespace, and runs extraction twice. He rejects networking inside PageExtractor, unstable numbering, duplicated descendants, or any word-level rewriting."

[freestyle.badge]
id = "badge-s06"
name = "HARVESTER OF PAGES"
desc = "Turned untidy HTML into stable, source-owned passages without bending their words."

[[freestyle.rubric]]
criterion = "DOM boundary"
weight = 20
desc = "PageExtractor parses SourceDocument HTML and performs no network or terminal work."

[[freestyle.rubric]]
criterion = "Deterministic passages"
weight = 25
desc = "Container selection, element selection, normalization, filtering, and one-based ids are stable and non-duplicating."

[[freestyle.rubric]]
criterion = "Truth preservation"
weight = 25
desc = "Words and punctuation are not edited; the stored Passage.Text is the single model-and-verifier representation."

[[freestyle.rubric]]
criterion = "Source continuity"
weight = 15
desc = "Every Passage retains the exact SourceSpec from its SourceDocument and the fixture demonstrates it."

[[freestyle.rubric]]
criterion = "C# craft"
weight = 15
desc = "PascalCase types and methods, camelCase locals, four-space indentation, Allman braces, focused methods, and readable names."
