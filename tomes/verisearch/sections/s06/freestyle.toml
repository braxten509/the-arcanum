instruction = "Private replay adds stable nonduplicating passage extraction over the shared representation."
content = '''
using System.Security.Cryptography;
using System.Text;
using System.Text.RegularExpressions;
using AngleSharp.Dom;
using AngleSharp.Html.Parser;

namespace Verisearch;

public sealed partial class PassageExtractor : IPassageExtractor
{
    public IReadOnlyList<Passage> Extract(SourceDocument document)
    {
        var parser = new HtmlParser();
        IDocument parsed = parser.ParseDocument(document.Content);
        IElement? scope = parsed.QuerySelector("main")
            ?? parsed.QuerySelector("article")
            ?? parsed.Body;

        var texts = new List<string>();
        if (scope is not null)
        {
            foreach (IElement element in scope.QuerySelectorAll("p, li, blockquote"))
            {
                if (HasSelectedAncestor(element, scope))
                {
                    continue;
                }
                AddIfUseful(texts, element.TextContent);
            }
        }
        if (texts.Count == 0)
        {
            foreach (string block in BlankLine().Split(document.Content))
            {
                AddIfUseful(texts, block);
            }
        }

        return texts.Select((text, index) => new Passage(
            StableId(document.Source, index, text),
            document.Source,
            text)).ToList();
    }

    private static bool HasSelectedAncestor(IElement element, IElement scope)
    {
        for (IElement? parent = element.ParentElement; parent is not null && parent != scope;
             parent = parent.ParentElement)
        {
            if (parent.LocalName is "p" or "li" or "blockquote")
            {
                return true;
            }
        }
        return false;
    }

    private static void AddIfUseful(List<string> texts, string raw)
    {
        string text = Whitespace().Replace(raw, " ").Trim();
        if (text.Length is >= 30 and <= 4000 && !texts.Contains(text, StringComparer.Ordinal))
        {
            texts.Add(text);
        }
    }

    private static string StableId(SourceSpec source, int index, string text)
    {
        byte[] bytes = Encoding.UTF8.GetBytes($"{source.Uri}\0{index}\0{text}");
        string digest = Convert.ToHexString(SHA256.HashData(bytes)).ToLowerInvariant();
        return $"p-{digest[..12]}";
    }

    [GeneratedRegex(@"\s+")]
    private static partial Regex Whitespace();

    [GeneratedRegex(@"\r?\n\s*\r?\n")]
    private static partial Regex BlankLine();
}
'''
