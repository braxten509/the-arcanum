[[lessons.exercises]]
id = "s03-l06-w1"
type = "write"
points = 38
required = true
capabilities = ["language-namespaces-modularity"]
cognitiveTask = "test-design"
scaffold = "guided"
contextFamily = "verisearch-s03-trust-boundary-modeling"
aidPolicy = "learning"
prompt = "Define <code>SourceSpec</code> and <code>Passage</code> records with the workshop's fields. Create source label <code>RFC</code>, URL <code>https://example.test/rfc</code>, trust 10, then passage id 4 and print exactly <code>4 RFC 10</code>."
starter = '''// Define the two records below the top-level statements.
Console.WriteLine("NOT BUILT");
'''
expect = "4 RFC 10"
solution = '''var source = new SourceSpec("RFC", "https://example.test/rfc", 10);
var passage = new Passage(4, "Exact words", source);
Console.WriteLine($"{passage.Id} {passage.Source.Label} {passage.Source.Trust}");

public record SourceSpec(string Label, string Url, double Trust);
public record Passage(int Id, string Text, SourceSpec Source);
'''
hint = "Construct SourceSpec first, pass it into Passage, then read nested properties through passage.Source."

[[lessons.concepts]]
id = "language-trust-boundary-modeling"
purpose = "Draw the line between what a source owns, what a model merely proposes, and what C# has proved, before any of it is code."
anatomy = "Separate types carry admitted source text, untrusted proposals, and verified quotations, and only the verifier may turn the second into the third."
example = "Disposable records for a candidate, an admitted text with its source identity, and a verified result, sketched together so the proposal's missing attribution is visible."
observable = "A reportable quotation cannot be constructed from proposal data alone; its label and address can only come from the matched passage."
failure = "One shared model for proposals and verified quotes lets invented text inherit a real source label, and no later check can undo that."
practice = "s03-l06-e1"
