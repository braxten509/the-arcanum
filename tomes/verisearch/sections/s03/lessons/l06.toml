[[lessons]]
id = "s03-l06"
teaches = ["language-namespaces-modularity"]
title = "Workshop — Establish the Canonical Models"
body = '''

<p>This workshop is a <strong>modeling rehearsal</strong>, not a production-file handoff. You now know classes, records, properties, constructors, enums, and first LINQ. Use those tools to draw a trust boundary in disposable code before deciding how your own Verisearch project will be organized.</p>
<p>Begin with four facts that the eventual program must represent: a source chosen by the user, a document read from that source, a stable passage extracted from the document, and a quote proposed by an AI. A fifth value represents a quotation that C# has actually verified. The last two must not be interchangeable. If the AI-facing shape contains a source label or URL, the model can impersonate attribution. If the verified shape can be constructed from raw response JSON without a containment check, the type name promises more than the program proved.</p>
<p>Sketch the information flow on paper. For every field, write its owner and the first boundary allowed to create it. Source identity begins in configuration. Passage text begins in the source document. A proposal begins outside the trust boundary. Verified attribution is copied from the matched passage only after an ordinal substring check. Your record names and file layout may differ from the examples; the ownership rules may not.</p>
<pre><code data-kind="replacement">public sealed record Candidate(string PassageId, string Text);
public sealed record AdmittedText(string Text, string SourceLabel, Uri SourceUri);</code></pre>
<p>The two-line fragment is intentionally incomplete. It demonstrates different shapes, not the architecture you must copy. Try a second design in which constructors are private or verification returns a result object containing accepted and rejected counts. Compare which design makes an invalid state harder to express.</p>
<p>Then test equality and mutation in a tiny scratch program. Records use value-oriented equality, which is useful for controlled fixture data. Classes are often a better home for behavior or owned resources. Nullable annotations should describe reality: a failed source read may have no document, but a successfully admitted quotation must always have text and source identity.</p>
<div class="callout"><p>The Working asks for observable ownership, not canonical filenames. You may combine small records, choose different names, or use richer result types as long as unverified AI output cannot cross into verified reporting.</p></div>
<div class="callout csharp-transfer"><p><strong>C#/.NET transfer:</strong> The C# type choice carries observable semantics: classes default to identity and mutable behavior, records default to value-like equality, and nullable annotations describe which references may be absent. Use those differences to make proposal and verified-evidence states difficult to confuse.</p></div>
<div class="field-notes"><div class="fn-head">FIELD NOTES // TRY TO FORGE A LIE</div><p>Attempt to construct the value your renderer will accept using only an invented AI response. If that is easy, the model boundary is too wide. Repair the ownership seam before writing networking code.</p></div>
'''

[[lessons.readings]]
label = "Microsoft Learn — Records"
url = "https://learn.microsoft.com/en-us/dotnet/csharp/language-reference/builtin-types/record"
essential = false

[[lessons.exercises]]
id = "s03-l06-e1"
type = "mc"
points = 20
prompt = "Why is the source URL deliberately absent from <code>QuoteProposal</code>?"
choices = ["C# records cannot hold URLs", "The model must not own attribution; C# attaches it from the matched Passage", "URLs are added by Spectre.Console", "the configured AI adds URLs automatically"]
answer = 1
whyWrong = "Records can hold strings and neither Spectre nor the configured AI supplies trustworthy attribution. The program attaches source identity from its own passage data after verification."
explain = "Separating model proposals from C#-owned source metadata prevents invented citations from entering the report."
hint = "Which component has trustworthy source identity?"

[[lessons.exercises]]
id = "s03-l06-e2"
type = "fill"
points = 20
prompt = "Complete the type that represents untrusted model output before exact matching."
code = '''public record ____(int PassageId, string Quote);'''
answer = "QuoteProposal"
hint = "It is a proposal, not yet a verified quote."

[[lessons.exercises]]
id = "s03-l06-d1"
type = "type"
points = 14
reps = 2
prompt = "Retype the source-owned passage record twice."
code = '''public record Passage(int Id, string Text, SourceSpec Source);'''

[[lessons.exercises]]
id = "s03-l06-w1"
type = "write"
points = 38
prompt = "Define <code>SourceSpec</code> and <code>Passage</code> records with the workshop's fields. Create source label <code>RFC</code>, URL <code>https://example.test/rfc</code>, trust 10, then passage id 4 and print exactly <code>4 RFC 10</code>."
starter = '''// Define the two records below the top-level statements.
Console.WriteLine("NOT BUILT");
'''
expect = "4 RFC 10"
solution = '''var source = new SourceSpec("RFC", "https://example.test/rfc", 10);
var passage = new Passage(4, "Exact words", source);
Console.WriteLine($"{passage.Id} {passage.Source.Label} {passage.Source.Trust}");

public record SourceSpec(string Label, string Url, double Trust);
public record Passage(int Id, string Text, SourceSpec Source);
'''
hint = "Construct SourceSpec first, pass it into Passage, then read nested properties through passage.Source."

[[lessons.concepts]]
id = "language-namespaces-modularity"
purpose = "Split a growing C# program into discoverable files and namespaces with one clear owner per responsibility."
anatomy = "Place related types under a namespace, keep the entrypoint as composition, and reference public contracts instead of copying declarations."
example = "The disposable examples in Workshop — Establish the Canonical Models isolate this capability before the learner chooses how it belongs in the cumulative project. The lesson Workshop — Establish the Canonical Models supplies the disposable observation point."
observable = "The whole solution builds with one definition for each concept and dependencies point in an understandable direction. Confirm it while practicing Workshop — Establish the Canonical Models."
failure = "Duplicate types, circular ownership, or business logic in Program.cs makes later integration brittle."
practice = "s03-l06-e1"
