[[lessons]]
id = "s03-l03"
title = "Records — immutable data done right"
body = '''

<p>Most of Verisearch's data never changes after creation: a search result IS what came back; a quote IS what the page said. For data like that, <code>record</code> beats <code>class</code>. One line:</p>
<pre><code><span class="k">public record</span> SearchResult(<span class="k">string</span> Url, <span class="k">string</span> Title, <span class="k">string</span> Snippet, <span class="k">string</span> Engine);</code></pre>
<p>That <strong>positional record</strong> declaration generates: a constructor, init-only properties (Url, Title…), value-based equality, and a readable ToString. All free.</p>
<pre><code><span class="k">var</span> a = <span class="k">new</span> SearchResult(<span class="s">"https://x"</span>, <span class="s">"T"</span>, <span class="s">"S"</span>, <span class="s">"searxng"</span>);
<span class="k">var</span> b = <span class="k">new</span> SearchResult(<span class="s">"https://x"</span>, <span class="s">"T"</span>, <span class="s">"S"</span>, <span class="s">"searxng"</span>);

Console.WriteLine(a == b);        <span class="c">// True! records compare by CONTENT</span>
<span class="c">// (two class instances with identical data would be != — reference comparison)</span>

Console.WriteLine(a);             <span class="c">// SearchResult { Url = https://x, Title = T, ... }</span></code></pre>
<p>Records are immutable by default — to "change" one you make a modified <em>copy</em> with <code>with</code>:</p>
<pre><code><span class="k">var</span> upgraded = a <span class="k">with</span> { Title = <span class="s">"RFC 8446"</span> };   <span class="c">// new record; a is untouched</span></code></pre>
<p><strong>class vs record — the decision:</strong></p>
<ul>
<li>Identity + changing state over time (a live TrustProfile whose ReferenceCount ticks up) → <code>class</code></li>
<li>A value that just IS its data (results, quotes, scores, config rows) → <code>record</code></li>
</ul><div class="field-notes"><div class="fn-head">MARGINALIA // THE DEEPER CUT — IN THORNE'S HAND</div>
<p><strong>Why records equal by value:</strong> the compiler generates <code>Equals</code>/<code>GetHashCode</code> over all positional members. Two facts scraped identically ARE the same fact — records encode that; classes say "same object in memory?" which is a different question.</p>
<p><strong>Records still get bodies:</strong> you can add methods, computed properties, even extra constructors inside <code>record X(...) { }</code> braces.</p>
<p><strong>Deconstruction</strong> comes free with positional records: <code>var (url, title, _, _) = result;</code> — pull members into locals, discard what you don't need.</p>
<p><strong>record struct:</strong> a VALUE-type record (copied on assignment, no heap allocation) — <code>public readonly record struct Coords(int X, int Y);</code>. For tiny hot-path data. Your Verisearch records are fine as normal (class-based) records.</p></div>'''

