[[lessons]]
id = "s03-l03"
teaches = ["language-classes-records"]
title = "Records — immutable data done right"
body = '''

<p>Most of Verisearch's data should not change after creation: a passage has one id and one stored text value; a proposal has one passage id and one candidate quotation. For value-like data, <code>record</code> often beats <code>class</code>. One line:</p>
<pre><code data-kind="replacement"><span class="k">public record</span> PassageDraft(<span class="k">int</span> Id, <span class="k">string</span> Text);</code></pre>
<p>That <strong>positional record</strong> declaration generates: a constructor, init-only properties (Url, Title…), value-based equality, and a readable ToString. All free.</p>
<pre><code data-kind="replacement"><span class="k">var</span> a = <span class="k">new</span> PassageDraft(1, <span class="s">"Exact source words."</span>);
<span class="k">var</span> b = <span class="k">new</span> PassageDraft(1, <span class="s">"Exact source words."</span>);

Console.WriteLine(a == b);        <span class="c">// True! records compare by CONTENT</span>
<span class="c">// (two class instances with identical data would be != — reference comparison)</span>

Console.WriteLine(a);             <span class="c">// PassageDraft { Id = 1, Text = Exact source words. }</span></code></pre>
<p>Records are immutable by default — to "change" one you make a modified <em>copy</em> with <code>with</code>:</p>
<pre><code data-kind="replacement"><span class="k">var</span> corrected = a <span class="k">with</span> { Text = <span class="s">"Corrected practice text."</span> }; <span class="c">// new record; a is untouched</span></code></pre>
<p><strong>class vs record — the decision:</strong></p>
<ul>
<li>Identity plus changing state over time (a running fetch session whose counters increase) → <code>class</code></li>
<li>A value that just is its data (source rows, passages, proposals, verified quotes) → <code>record</code></li>
</ul>
<div class="callout csharp-transfer"><p><strong>C#/.NET transfer:</strong> A <code>record class</code> is still a reference type, but C# synthesizes value-oriented equality, printing, and <code>with</code> copying; positional records also gain deconstruction. Records are not deeply immutable: a record can still expose mutable properties or hold mutable collections.</p></div>
<div class="field-notes"><div class="fn-head">MARGINALIA // THE DEEPER CUT — IN THORNE'S HAND</div>
<p><strong>Why records equal by value:</strong> the compiler generates <code>Equals</code>/<code>GetHashCode</code> over all positional members. Two draft values with the same members compare equal; classes normally ask “same object in memory?”, which is a different question.</p>
<p><strong>Records still get bodies:</strong> you can add methods, computed properties, even extra constructors inside <code>record X(...) { }</code> braces.</p>
<p><strong>Deconstruction</strong> comes free with positional records: <code>var (id, text) = passage;</code> — pull members into locals by position.</p>
<p><strong>record struct:</strong> a VALUE-type record (copied on assignment, no heap allocation) — <code>public readonly record struct Coords(int X, int Y);</code>. For tiny hot-path data. Your Verisearch records are fine as normal (class-based) records.</p></div>
'''

