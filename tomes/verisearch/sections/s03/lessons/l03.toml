[[lessons.exercises]]
id = "s03-l03-w1"
type = "write"
points = 34
required = true
capabilities = ["language-classes-records"]
cognitiveTask = "build"
scaffold = "guided"
contextFamily = "verisearch-s03-classes-records"
aidPolicy = "learning"
prompt = "Declare record <code>SourceNote(string Label, string Text)</code>. Create n1 for (\"RFC\", \"practice text\"), make n2 = n1 with Label \"NIST\", then print n1's Label, n2's Label, and whether <code>n1 == (n1 with { })</code>. This is record syntax practice, not the final quote model."
expect = '''
RFC
NIST
True'''
solution = '''
var n1 = new SourceNote("RFC", "practice text");
var n2 = n1 with { Label = "NIST" };
Console.WriteLine(n1.Label);
Console.WriteLine(n2.Label);
Console.WriteLine(n1 == (n1 with { }));

public record SourceNote(string Label, string Text);
'''
hint = "Record declaration goes after the top-level statements. The last line proves value equality."

[[lessons.concepts]]
id = "language-classes-records"
purpose = "Model identity, behavior, and immutable data with an appropriate C# class or record."
anatomy = "Choose class for owned behavior or identity and record for value-like data, then define construction and accessible members deliberately."
example = "The disposable examples in Records — immutable data done right isolate this capability before the learner chooses how it belongs in the cumulative project. The lesson Records — immutable data done right supplies the disposable observation point."
observable = "Instances carry the required facts and equality or mutation follows the selected type's intended semantics. Confirm it while practicing Records — immutable data done right."
failure = "Public mutation on trusted data or duplicate competing models lets invalid state cross the artifact."
practice = "s03-l03-e1"
