[[lessons.exercises]]
id = "s03-l03-e1"
type = "mc"
points = 20
required = true
capabilities = ["language-classes-records"]
cognitiveTask = "explain"
scaffold = "guided"
contextFamily = "verisearch-s03-classes-records"
aidPolicy = "learning"
prompt = "Two records of the same type with identical property values: <code>a == b</code> is…"
choices = ["false — they're different objects", "true — records compare by value/content", "a compile error", "true only if they were created on the same line"]
answer = 1
whyWrong = "Records override equality to compare property values, so identical content means == regardless of when or where they were created — that’s the reference-equality assumption for classes."
hint = "This is THE headline feature of records."
explain = "Records use value equality by default, so two records of the same type with equal property values compare as equal even though they are separate instances."

[[lessons.exercises]]
id = "s03-l03-e2"
type = "text"
points = 25
required = true
capabilities = ["language-classes-records"]
cognitiveTask = "recall"
scaffold = "guided"
contextFamily = "verisearch-s03-classes-records"
aidPolicy = "learning"
prompt = "Which keyword creates a modified copy of a record? <code>var b = a ____ { Text = \"new\" };</code>"
answer = "with"
hint = "Four letters. Non-destructive mutation."

[[lessons.exercises]]
id = "s03-l03-e3"
type = "mc"
points = 25
required = true
capabilities = ["language-classes-records"]
cognitiveTask = "explain"
scaffold = "guided"
contextFamily = "verisearch-s03-classes-records"
aidPolicy = "learning"
prompt = "Verisearch needs a type for a verbatim quote pulled from a page — created once, never modified, compared in tests. Best choice?"
choices = ["class with public set properties", "static class", "positional record", "Dictionary<string, string>"]
answer = 2
whyWrong = "A settable class invites accidental mutation and a Dictionary loses the fixed shape — a positional record is immutable and value-compared, ideal for a fixed, test-compared quote."
hint = "Immutable value-like data is the record's home turf."
explain = "A positional record gives the quote a fixed named shape, concise construction, value equality for tests, and properties that are not freely mutable afterward."

