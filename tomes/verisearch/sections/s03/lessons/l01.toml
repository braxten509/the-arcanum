[[lessons.exercises]]
id = "s03-l01-e1"
type = "text"
points = 15
prompt = "Which keyword invokes a class constructor to create an instance?"
answer = "new"
hint = "Three letters. var page = ___ PageDraft();"

[[lessons.exercises]]
id = "s03-l01-e2"
type = "mc"
points = 25
prompt = "After this code, what does <code>a.Label</code> equal?"
code = '''
var a = new PageDraft { Label = "first" };
var b = a;
b.Label = "second";'''
choices = ["first", "second", "", "It throws an exception"]
answer = 1
whyWrong = "Both names reference one object, so the last write changes the label visible through either name."
hint = "b = a copies the REFERENCE, not the object. One object, two names."
explain = "<code>b = a</code> makes both variables refer to the same object, so assigning <code>b.Label = \"second\"</code> is visible through <code>a</code> as well."

[[lessons.exercises]]
id = "s03-l01-e3"
type = "mc"
points = 20
prompt = "A method defined inside a class (like <code>Describe()</code>)…"
choices = ["can only be called once", "is shared data between all instances", "operates on that instance's own data and is called like r1.Describe()", "must be named Main"]
answer = 2
whyWrong = "A non-static method isn’t shared data or limited to one call — it operates on a specific instance’s fields and is invoked as r1.Describe()."
hint = "Behavior travels with the data it belongs to."
explain = "An instance method runs for the object before the dot, so <code>r1.Describe()</code> can read and act on <code>r1</code>'s own fields."

[[lessons.exercises]]
id = "s03-l01-d1"
type = "type"
points = 14
prompt = "Type a minimal class with data + behavior, once, cleanly."
code = '''
public class PageDraft
{
    public string Label = "";
    public string Html = "";

    public void Describe()
    {
        Console.WriteLine($"{Label}: {Html.Length}");
    }
}'''

[[lessons.exercises]]
id = "s03-l01-w1"
type = "write"
points = 34
prompt = "Define a class <code>PassageDraft</code> with an int field <code>Id</code> and string field <code>Text</code>, plus <code>Report()</code> that prints <code>[&lt;Id&gt;] &lt;Text&gt;</code>. Create id 1 with text <code>Exact source words.</code> and call Report(). Type definitions go below top-level statements."
expect = "[1] Exact source words."
solution = '''
var passage = new PassageDraft { Id = 1, Text = "Exact source words." };
passage.Report();

public class PassageDraft
{
    public int Id;
    public string Text = "";
    public void Report() => Console.WriteLine($"[{Id}] {Text}");
}
'''
hint = "Top-level code first (new PassageDraft {...}, then call), class declaration after it."
