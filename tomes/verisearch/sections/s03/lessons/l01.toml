[[lessons]]
id = "s03-l01"
teaches = ["classes-objects"]
title = "Classes & objects — blueprints and instances"
body = '''

<p>A <strong>class</strong> is a blueprint: data (fields/properties) plus behavior (methods) bundled under one name. An <strong>object</strong> is one concrete instance made from it with <code>new</code>:</p>
<pre><code><span class="k">public class</span> PageDraft
{
    <span class="k">public string</span> Label = <span class="s">""</span>;        <span class="c">// fields (we'll upgrade these to properties next lesson)</span>
    <span class="k">public string</span> Html = <span class="s">""</span>;

    <span class="k">public void</span> Describe()            <span class="c">// a method — behavior attached to the data</span>
    {
        Console.WriteLine(<span class="s">$"{Label}: {Html.Length} characters"</span>);
    }
}</code></pre>
<pre><code><span class="k">var</span> page1 = <span class="k">new</span> PageDraft();          <span class="c">// instance #1</span>
page1.Label = <span class="s">"RFC 8446"</span>;
page1.Html = <span class="s">"&lt;main&gt;TLS 1.3&lt;/main&gt;"</span>;

<span class="k">var</span> page2 = <span class="k">new</span> PageDraft();          <span class="c">// instance #2 — completely separate data</span>
page2.Label = <span class="s">"Local fixture"</span>;

page1.Describe();                         <span class="c">// RFC 8446: 26 characters</span></code></pre>
<p>Key mental model: <code>page1</code> and <code>page2</code> are <em>references</em> to two separate objects on the heap. Assigning <code>var alias = page1;</code> does not copy the object—both names now point at the same one. Change <code>alias.Label</code> and <code>page1.Label</code> changes too.</p>
<div class="callout">The examples in the first five lessons are tiny syntax specimens, not files to add to Verisearch. The workshop at the end of this chapter supplies the canonical product types and exact filenames.</div><div class="field-notes"><div class="fn-head">MARGINALIA // THE DEEPER CUT — IN THORNE'S HAND</div>
<p><strong>Access modifiers:</strong> <code>public</code> anyone · <code>private</code> this class only (the default!) · <code>internal</code> this project only. Start private, open up only what callers need — small surface, fewer regrets.</p>
<p><strong>static</strong> means "belongs to the TYPE, not an instance": <code>Math.Max</code>, <code>int.Parse</code> — no object needed. An instance method secretly receives <code>this</code> (the object it was called on); a static method has no <code>this</code>.</p>
<p><strong>null and the ? annotation:</strong> a reference variable holding no object is <code>null</code>; touching its members throws <code>NullReferenceException</code> — THE classic crash. With <code>&lt;Nullable&gt;enable&lt;/Nullable&gt;</code> the compiler tracks it: <code>string?</code> means "may be null, check me", plain <code>string</code> means "never null". Tools: <code>?.</code> (safe navigation — <code>obj?.Method()</code> skips the call if null) and <code>??</code> (fallback).</p></div>'''

