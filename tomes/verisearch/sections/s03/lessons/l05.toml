[[lessons]]
id = "s03-l05"
teaches = ["language-linq-lambdas"]
title = "First LINQ — Where, Select, OrderBy"
body = '''

<p>LINQ (Language Integrated Query) lets you filter/transform/sort collections by <em>describing what you want</em> instead of writing loops. Three verbs get you far:</p>
<pre><code data-kind="replacement"><span class="k">using</span> System.Linq;   <span class="c">// usually auto-imported via implicit usings</span>

List&lt;PassageDraft&gt; passages = GetPassages();

<span class="c">// WHERE — keep only matching items</span>
<span class="k">var</span> substantial = passages.Where(p =&gt; p.Text.Length &gt;= 20);

<span class="c">// SELECT — transform each item into something else</span>
<span class="k">var</span> texts = passages.Select(p =&gt; p.Text);

<span class="c">// ORDERBY / ORDERBYDESCENDING — sort</span>
<span class="k">var</span> numbered = passages.OrderBy(p =&gt; p.Id);

<span class="c">// chain them — reads like a sentence</span>
<span class="k">var</span> firstFive = passages
    .Where(p =&gt; p.Text.Length &gt;= 20)
    .OrderBy(p =&gt; p.Id)
    .Take(5)
    .ToList();</code></pre>
<p>The <code>p =&gt; p.Text.Length &gt;= 20</code> syntax is a <strong>lambda</strong>—a tiny inline function: “given p, return whether its text is long enough to keep.” Deep dive comes in Chapter VII; for now read <code>=&gt;</code> as “goes to.” This length gate removes navigation crumbs; it does not decide relevance to the user's question.</p>
<p><code>.ToList()</code> materializes the query into a real List. Until then it's a <em>description</em> of work, not results — remember that detail; it matters in Chapter VII.</p>
<div class="callout">If you're writing a foreach whose only job is to fill another list with filtered/transformed items — that's LINQ. One line, no mutable temp list, nothing to get wrong.</div><div class="field-notes"><div class="fn-head">MARGINALIA // THE DEEPER CUT — IN THORNE'S HAND</div>
<p><strong>Method syntax vs query syntax:</strong> everything you've seen is method syntax. The same query can be written SQL-style—<code>from p in passages where p.Text.Length &gt;= 20 orderby p.Id select p.Text</code>—and compiles to equivalent calls. Read both; write method syntax, the ecosystem default.</p>
<p><strong>Order your chain for work-shedding:</strong> <code>Where</code> BEFORE <code>OrderBy</code> — filter 100 down to 10, then sort 10. Sorting first sorts 90 items you're about to throw away.</p>
<p><strong>Quick one-liners</strong> you'll reach for constantly: <code>.Any()</code> “is there at least one?”, <code>.Count(p =&gt; p.Text.Length &gt;= 20)</code>, <code>.First()</code> / <code>.FirstOrDefault()</code>, <code>.Take(5)</code> / <code>.Skip(5)</code>, and <code>.Select((p, i) =&gt; $"{i + 1}: {p.Text}")</code>.</p></div>
'''

[[lessons.readings]]
label = "Microsoft Learn — LINQ intro video (C# Advanced ep. 1)"
url = "https://learn.microsoft.com/en-us/shows/c-advanced/introduction-to-language-integrated-query-linq--c-advanced-1-of-8"
essential = false

[[lessons.exercises]]
id = "s03-l05-e1"
type = "mc"
points = 20
prompt = "Which LINQ method FILTERS a collection down to matching items?"
choices = ["Select", "Where", "OrderBy", "Filter"]
answer = 1
whyWrong = "Select transforms and OrderBy sorts; ‘Filter’ isn’t a LINQ method — Where is what keeps only matching items."
hint = "SQL veterans already know."
explain = "<code>Where</code> evaluates a predicate for each item and keeps only the items for which that predicate returns true."

[[lessons.exercises]]
id = "s03-l05-e2"
type = "mc"
points = 25
prompt = "What does this produce?"
code = '''
var scores = new List<double> { 2.0, 9.5, 6.0, 8.0 };
var result = scores.Where(s => s >= 6.0).OrderByDescending(s => s).ToList();'''
choices = ["[6.0, 8.0, 9.5]", "[2.0, 6.0, 8.0, 9.5]", "[9.5, 8.0, 6.0]", "[9.5, 8.0, 6.0, 2.0]"]
answer = 2
whyWrong = "Trace the query: it filters then orders descending, yielding [9.5, 8.0, 6.0] — the other options skip either the filter or the sort."
hint = "Filter first (drops 2.0), then sort high-to-low."
explain = "<code>Where</code> removes 2.0 because it is below 6.0, then <code>OrderByDescending</code> arranges the remaining scores as 9.5, 8.0, 6.0."

[[lessons.exercises]]
id = "s03-l05-e3"
type = "fill"
points = 25
prompt = "Fill the blank to pull just the text out of a list of passages (transform each item)."
code = "var texts = passages.____(p => p.Text).ToList();"
answer = "Select"
hint = "Transform-each-item is not Where."

[[lessons.exercises]]
id = "s03-l05-d1"
type = "type"
points = 14
reps = 2
prompt = "A readable filter-sort-take pipeline. Twice."
code = '''
var first = passages
    .Where(p => p.Text.Length >= 20)
    .OrderBy(p => p.Id)
    .Take(5)
    .ToList();'''

[[lessons.exercises]]
id = "s03-l05-w1"
type = "write"
points = 34
prompt = "Given <code>var scores = new List&lt;int&gt; { 2, 9, 6, 8, 1 };</code> — keep scores ≥ 6, sort them descending, and print them space-joined on one line."
expect = "9 8 6"
solution = '''
var scores = new List<int> { 2, 9, 6, 8, 1 };
var kept = scores.Where(score => score >= 6).OrderByDescending(score => score);
Console.WriteLine(string.Join(" ", kept));
'''
hint = "string.Join(\" \", scores.Where(...).OrderByDescending(s => s))"

[[lessons.concepts]]
id = "language-linq-lambdas"
purpose = "Transform collections declaratively while understanding when a sequence actually executes."
anatomy = "Write a lambda parameter and expression, compose the needed LINQ operators, then materialize once at the boundary that needs stable data."
example = "The disposable examples in First LINQ — Where, Select, OrderBy isolate this capability before the learner chooses how it belongs in the cumulative project. The lesson First LINQ — Where, Select, OrderBy supplies the disposable observation point."
observable = "The resulting sequence has the expected order and contents and is enumerated at a deliberate time. Confirm it while practicing First LINQ — Where, Select, OrderBy."
failure = "Capturing mutable state or enumerating a deferred query repeatedly can change results between observations."
practice = "s03-l05-e1"

