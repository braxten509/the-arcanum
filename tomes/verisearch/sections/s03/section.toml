codename = "CHAPTER III // THE SHAPES OF THINGS"
short = "The Shapes of Things"
title = "The Shapes of Things — Classes, Records & Enums"
build = "The tome's canonical skeleton — source documents, passages, model proposals, and verified quotations become different C# types"
brief = "Until now your matter has been loose strings and lists. This chapter teaches classes, properties, constructors, records, enums, and the first LINQ pipeline, then uses them to draw the product's most important boundary: model output is a <code>QuoteProposal</code>; only C# can create a <code>VerifiedQuote</code>. The workshop leaves one authoritative <code>Models.cs</code> for every later chapter."
