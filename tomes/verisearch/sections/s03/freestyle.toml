[freestyle]
title = "THE WORKING: The Skeleton of the Tome"
requires = ["classes-objects", "properties-constructors", "records", "enums", "linq-basics", "canonical-models"]
brief = "Create the one model file the rest of Verisearch will share.<ul><li>Add <code>Models.cs</code> containing exactly the workshop's <code>SourceKind</code>, <code>SourceSpec</code>, <code>SourceDocument</code>, <code>Passage</code>, <code>QuoteProposal</code>, <code>QuoteBatch</code>, and <code>VerifiedQuote</code></li><li>Delete or rename any earlier demonstration type that collides; do not keep two meanings for <code>Source</code> or <code>SearchResult</code></li><li>In <code>Program.cs</code>, add a <code>demo</code> branch that constructs two SourceSpecs and three Passages, filters to trust ≥ 8 with LINQ, and prints <code>&lt;id&gt;: &lt;label&gt;</code></li><li>Keep the Chapter I loop and Chapter II parser intact</li><li>Run <code>dotnet build</code>, then exercise both <code>demo</code> and an ordinary question</li></ul><div class=\"callout\"><strong>Canonical means future chapters edit these records deliberately.</strong> Examples in earlier lessons taught syntax; <code>Models.cs</code> now owns the product contract.</div>"
reward = 300
packages = []
xray = "THORNE compiles every file together, rejects duplicate demonstration types, verifies QuoteProposal has no URL field, and checks that VerifiedQuote carries C#-owned source label and URL. He runs the demo through the existing loop and expects the LINQ result to be computed from the list."

[freestyle.badge]
id = "badge-s03"
name = "SHAPER OF FORMS"
desc = "Raised the skeleton of forms the whole tome hangs on."

