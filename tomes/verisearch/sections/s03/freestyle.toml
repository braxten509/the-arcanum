[freestyle]
title = "THE WORKING: DATA MODELS AND OWNERSHIP"
brief = '''
<p><strong>Outcome:</strong> Model sources, passages, AI proposals, and verified quotations so untrusted output cannot impersonate proof.</p><p>Author the project edits yourself. The hidden replay proves one possible implementation, but it is never shown and does not define your architecture.</p><ul><li>Model chosen sources, read documents, stable passages, untrusted AI quote proposals, verified quotations, and per-source outcomes.</li><li>Keep source labels and URIs out of the AI proposal shape so attribution can only be restored from C#-owned passage data.</li><li>Choose records, classes, enums, nullability, and result shapes according to behavior; names and file boundaries are yours.</li><li>Use a disposable LINQ observation to inspect model data without turning it into production routing logic.</li><li>Attempt to construct a reportable quotation from invented AI JSON alone; revise the boundary until that path cannot bypass verification.</li></ul>
'''
