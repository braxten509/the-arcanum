[freestyle]
title = "THE WORKING: The Skeleton of the Tome"
brief = "Create the type skeleton the rest of Verisearch hangs on, in separate files.<ul><li>Enums <code>SourceTier</code> and <code>ContentType</code></li><li>Records <code>DomainTrustScore</code>, <code>SearchResult</code>, <code>ScrapedParagraph</code>, <code>VerbatimQuote</code></li><li>A <code>TrustProfile</code> class with init properties and at least one computed property or method</li><li>Prove it works: in Program.cs, build a few sample TrustProfiles/SearchResults in a List, rank them with LINQ (Where + OrderByDescending), and print a mini trust report</li><li>Keep the shell loop — add a command like <code>demo</code> that runs the report</li></ul>"
reward = 300
packages = []
xray = "THORNE checks whether records are positional (one-liners) — writing 40-line classes with { get; set; } everywhere for pure data costs points. He looks for at least one 'init' accessor, one computed member (=> or a method), and whether the LINQ demo actually sorts DESCENDING. Files: he tolerates two types per file if related, but Program.cs containing everything is an automatic style hit."

[freestyle.badge]
id = "badge-s03"
name = "SHAPER OF FORMS"
desc = "Raised the skeleton of forms the whole tome hangs on."

