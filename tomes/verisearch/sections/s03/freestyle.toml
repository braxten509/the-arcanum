[[freestyle.referenceSteps]]
id = "s03-write-domain"
path = "src/Verisearch/Domain.cs"
mode = "write"
instruction = "Private replay adds separate source, passage, proposal, verified, outcome, and interface contracts."
content = '''
namespace Verisearch;

public sealed record SourceSpec(string Label, Uri Uri);

public sealed record SourceDocument(SourceSpec Source, string Content);

public sealed record Passage(string Id, SourceSpec Source, string Text);

public sealed record QuoteProposal(string PassageId, string Quote);

public sealed record QuoteBatch(IReadOnlyList<QuoteProposal> Quotes);

public sealed record VerifiedQuote(
    string PassageId,
    string Quote,
    string SourceLabel,
    Uri SourceUri);

public sealed record SourceReadOutcome(
    SourceSpec Source,
    SourceDocument? Document,
    string? Error)
{
    public bool Succeeded => Document is not null;
}

public sealed record VerificationResult(
    IReadOnlyList<VerifiedQuote> Quotes,
    int RejectedCount);

public sealed record SearchResult(
    IReadOnlyList<VerifiedQuote> Quotes,
    IReadOnlyList<SourceReadOutcome> Sources,
    int RejectedCount,
    bool IsMock);

public interface ISourceReader
{
    Task<SourceDocument> ReadAsync(SourceSpec source, CancellationToken cancellationToken);
}

public interface IPassageExtractor
{
    IReadOnlyList<Passage> Extract(SourceDocument document);
}

public interface IAiQuoteSelector
{
    Task<QuoteBatch> SelectAsync(
        string question,
        IReadOnlyList<Passage> passages,
        CancellationToken cancellationToken);
}

public interface IReportRenderer
{
    string Compose(string question, SearchResult result);
}
'''
