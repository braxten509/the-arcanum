[[lessons.exercises]]
id = "s10-l03-e1"
type = "mc"
points = 20
prompt = "In <code>[CommandArgument(0, \"&lt;query&gt;\")]</code>, the angle brackets signify…"
choices = ["an HTML tag", "the argument is required", "the argument is optional", "a generic type"]
answer = 1
whyWrong = "In CommandArgument, angle brackets ‘<query>’ mark a REQUIRED argument (square brackets would mean optional) — they’re not HTML or a generic."
hint = "Square brackets would make it optional. CLI convention."

[[lessons.exercises]]
id = "s10-l03-e2"
type = "fill"
points = 25
prompt = "Fill the attribute so both <code>-t 5</code> and <code>--min-trust 5</code> work."
code = '''
[CommandOption("____")]
public double MinTrust { get; set; } = 3.0;'''
answer = "-t|--min-trust"
accept = ["-t|--min-trust "]
hint = "Short form, pipe, long form."

[[lessons.exercises]]
id = "s10-l03-e3"
type = "mc"
points = 20
prompt = "Why return an exit code (0 vs nonzero) from ExecuteAsync?"
choices = ["Spectre requires it to render", "It sets the process priority", "Shell scripts and CI pipelines branch on exit codes — it's the CLI success contract", "Purely decorative"]
answer = 2
whyWrong = "Exit codes aren’t decorative or about priority/rendering — shells and CI branch on 0 vs nonzero, so it’s the CLI’s success contract."
hint = "somecommand && echo ok — what does && test?"

[[lessons.exercises]]
id = "s10-l03-d1"
type = "type"
points = 14
reps = 2
prompt = "The typed-settings shape — argument + two options with defaults. Twice."
code = '''
public class SearchSettings : CommandSettings
{
    [CommandArgument(0, "<query>")]
    public string Query { get; set; } = "";

    [CommandOption("-m|--max-sources")]
    public int MaxSources { get; set; } = 5;

    [CommandOption("-v|--verbose")]
    public bool Verbose { get; set; }
}'''

[[lessons.exercises]]
id = "s10-l03-w1"
type = "write"
points = 34
prompt = "Flag-parsing-from-first-principles lab: given <code>var tokens = new[] { \"--max-sources\", \"3\", \"--min-trust\", \"5\" };</code> walk the array in pairs and print <code>max=3 trust=5</code>. (This is what Spectre does under the hood, minus 4,000 edge cases.)"
expect = "max=3 trust=5"
solution = '''
var tokens = new[] { "--max-sources", "3", "--min-trust", "5" };
int max = 0, trust = 0;
for (int i = 0; i < tokens.Length; i += 2)
{
    if (tokens[i] == "--max-sources") max = int.Parse(tokens[i + 1]);
    else if (tokens[i] == "--min-trust") trust = int.Parse(tokens[i + 1]);
}
Console.WriteLine($"max={max} trust={trust}");
'''
hint = "Loop i += 2, switch on args[i], parse args[i+1] into two locals, print once."
