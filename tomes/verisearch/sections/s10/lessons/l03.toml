[[lessons.exercises]]
id = "s10-l03-e3"
type = "mc"
points = 20
required = true
capabilities = ["language-cli-packaging"]
cognitiveTask = "explain"
scaffold = "guided"
contextFamily = "verisearch-s10-cli-packaging"
aidPolicy = "limited"
prompt = "Why should invalid CLI input return a nonzero exit code?"
choices = ["To make output red", "To stop the configured AI", "Because Console.WriteLine returns an int", "So scripts and callers can detect failure"]
answer = 3
whyWrong = "Color and the configured AI are unrelated, and Console.WriteLine returns void. Process status is a machine-readable success signal."
explain = "Exit 0 means successful handling; a nonzero status distinguishes an error even when output is redirected."
hint = "Think of another program invoking Verisearch."

[[lessons.exercises]]
id = "s10-l03-d1"
type = "type"
points = 14
required = false
capabilities = ["language-cli-packaging"]
cognitiveTask = "complete"
scaffold = "worked"
contextFamily = "verisearch-s10-cli-packaging"
aidPolicy = "limited"
reps = 2
prompt = "Retype the repeated source option branch twice."
code = '''case "--source" when i + 1 < args.Length:
    labels.Add(args[++i]);
    break;'''

[[lessons.exercises]]
id = "s10-l03-w1"
type = "write"
points = 38
required = true
capabilities = ["language-cli-packaging"]
cognitiveTask = "build"
scaffold = "independent"
contextFamily = "verisearch-s10-cli-packaging"
aidPolicy = "limited"
prompt = "Parse the starter tokens in pairs and print the two source labels comma-separated."
starter = '''var tokens = new[] { "--source", "RFC", "--source", "NIST" };
var labels = new List<string>();

Console.WriteLine("NOT PARSED");
'''
expect = "RFC,NIST"
solution = '''var tokens = new[] { "--source", "RFC", "--source", "NIST" };
var labels = new List<string>();

for (int i = 0; i < tokens.Length; i++)
{
    if (tokens[i] == "--source" && i + 1 < tokens.Length)
    {
        labels.Add(tokens[++i]);
    }
}
Console.WriteLine(string.Join(",", labels));
'''
hint = "When the current token is --source, increment i and add the next token."

[[lessons.concepts]]
id = "language-cli-packaging"
purpose = "Give the tool a public command grammar: the whole question, explicit source choices, provider configuration, help, and clear invalid input."
anatomy = "Arguments are read as data, the question is passed as one value, repeated options collect in order, and unknown or missing input exits with a stated code."
example = "One documented invocation carrying a quoted whole question, two repeated source options, and a provider with its command."
observable = "Help and invalid input are answered before any external work, and the exit code distinguishes them."
failure = "Reconstructing the question from separate arguments, or defaulting a provider silently, changes what the seeker asked without telling them."
practice = "s10-l03-e1"
