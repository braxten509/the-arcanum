[[lessons]]
id = "s10-l03"
teaches = ["language-cli-packaging"]
title = "Parse a Small CLI Without Another Framework"
body = '''

<p>A command-line interface is a public grammar. It should preserve the user's whole question, collect explicit source choices, and configure an AI boundary without relying on shell tricks or secret defaults.</p>
<p>Decide whether the question is positional, supplied through an option, or read from standard input. In every design, pass it as one value to the application. The shell may require quotation marks around spaces, but those quotation marks are not part of the C# value. Do not split the question into keywords and route different words to different lookup implementations.</p>
<pre><code data-kind="terminal">$ verisearch "What changed between the two accounts?"     --source archive --source handbook     --provider cli --ai-command my-ai-wrapper</code></pre>
<p>The command is a usage example, not a required parser or provider name. A learner may choose local model arguments, an API-backed adapter configured by environment, a plugin directory, or another explicit scheme. Secrets must not appear in committed source or ordinary reports.</p>
<p>For a small surface, a loop and <code>switch</code> can parse arguments safely. Every value-taking option must check for a following token. Unknown flags, duplicate singleton options, invalid limits, and missing questions need stable nonzero exits. Repeated source and AI-argument options should retain order. Help should return without starting network or AI work.</p>
<p>Use <code>ProcessStartInfo.ArgumentList</code> when launching another program rather than concatenating a shell command. Argument arrays prevent spaces and punctuation from changing meaning. If you choose an HTTP provider, validate its endpoint and read its API key from configuration or environment at the boundary.</p>
<div class="callout"><p>Provider configuration selects an implementation. It must never select a keyword recipe. The configured AI receives the entire question and the admitted passages.</p></div>
<div class="callout csharp-transfer"><p><strong>C#/.NET transfer:</strong> The .NET runtime supplies <code>args</code> only after the invoking shell has tokenized the command line. C# sees a <code>string[]</code>, so parser correctness concerns array positions and option grammar; child-process safety concerns <code>ArgumentList</code>, not manual quote concatenation.</p></div>
<div class="field-notes"><div class="fn-head">FIELD NOTES // PARSER MATRIX</div><p>List help, valid input, missing option value, unknown option, repeated source, absent AI configuration, and a punctuation-heavy question. Assign an expected exit and whether external work may start.</p></div>
'''

[[lessons.readings]]
label = "Microsoft Learn — Command-line arguments"
url = "https://learn.microsoft.com/en-us/dotnet/csharp/fundamentals/program-structure/main-command-line"
