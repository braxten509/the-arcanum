[[lessons]]
id = "s10-l03"
teaches = ["cli-options"]
title = "Parse a Small CLI Without Another Framework"
body = '''
<p>Verisearch has four user-facing inputs: one question, repeatable <code>--source LABEL</code> choices, <code>--mock</code>, and <code>--verbose</code>. That grammar is small enough to teach directly. Create <code>CommandLineOptions.cs</code> and keep parsing separate from <code>Program.cs</code>.</p>
<pre><code><span class="k">public sealed record</span> CommandLineOptions(<span class="k">string</span> Question,
    List&lt;<span class="k">string</span>&gt; SourceLabels, <span class="k">bool</span> Mock, <span class="k">bool</span> Verbose, <span class="k">bool</span> ShowHelp)
{
    <span class="k">public const string</span> Usage = <span class="s">"verisearch \"question\" [--source LABEL] [--mock] [--verbose]"</span>;

    <span class="k">public static</span> CommandLineOptions Parse(<span class="k">string</span>[] args)
    {
        <span class="k">if</span> (args.Contains(<span class="s">"--help"</span>))
            <span class="k">return new</span>(<span class="s">""</span>, [], <span class="k">false</span>, <span class="k">false</span>, <span class="k">true</span>);

        <span class="k">string</span>? question = <span class="k">null</span>;
        <span class="k">var</span> labels = <span class="k">new</span> List&lt;<span class="k">string</span>&gt;();
        <span class="k">bool</span> mock = <span class="k">false</span>;
        <span class="k">bool</span> verbose = <span class="k">false</span>;

        <span class="k">for</span> (<span class="k">int</span> i = 0; i &lt; args.Length; i++)
        {
            <span class="k">switch</span> (args[i])
            {
                <span class="k">case</span> <span class="s">"--source"</span> <span class="k">when</span> i + 1 &lt; args.Length:
                    labels.Add(args[++i]);
                    <span class="k">break</span>;
                <span class="k">case</span> <span class="s">"--mock"</span>: mock = <span class="k">true</span>; <span class="k">break</span>;
                <span class="k">case</span> <span class="s">"--verbose"</span>: verbose = <span class="k">true</span>; <span class="k">break</span>;
                <span class="k">default</span>:
                    <span class="k">if</span> (args[i].StartsWith(<span class="s">"-"</span>) || question <span class="k">is not null</span>)
                        <span class="k">throw new</span> ArgumentException(<span class="s">$"unexpected argument: {args[i]}"</span>);
                    question = args[i];
                    <span class="k">break</span>;
            }
        }
        <span class="k">if</span> (<span class="k">string</span>.IsNullOrWhiteSpace(question))
            <span class="k">throw new</span> ArgumentException(<span class="s">"a question is required"</span>);
        <span class="k">return new</span>(question, labels, mock, verbose, <span class="k">false</span>);
    }
}</code></pre>
<p>Shell quotes keep a multiword question in one argument: <code>dotnet run -- "What changed?" --source RFC</code>. The double dash belongs to <code>dotnet run</code>; it passes later tokens to your program.</p>
<div class="callout">The <code>--mock</code> flag selects a different implementation explicitly. It is not an exception handler and must never be enabled automatically.</div>
<div class="field-notes"><div class="fn-head">MARGINALIA // FRIENDLY FAILURES</div><p><code>Program.cs</code> catches <code>ArgumentException</code>, prints the message plus <code>Usage</code>, and exits 2. Help prints usage and exits 0. These exit codes let scripts distinguish success, bad input, and later runtime failure.</p></div>
'''

[[lessons.readings]]
label = "Microsoft Learn — Command-line arguments"
url = "https://learn.microsoft.com/en-us/dotnet/csharp/fundamentals/program-structure/main-command-line"
essential = false

[[lessons.exercises]]
id = "s10-l03-e1"
type = "mc"
points = 20
prompt = "Why must a multiword question be quoted in the shell command?"
choices = ["C# strings always need shell quotes", "The shell must pass it as one argument instead of several tokens", "Ollama reads only quoted JSON", "Spectre.Console requires quotes"]
answer = 1
whyWrong = "This is shell tokenization, not a requirement of C# strings, Ollama, or Spectre. Quotes preserve one positional argument."
explain = "The parser permits one non-flag question token, so the shell must keep the words together."
hint = "Inspect what arrives in args[]."

[[lessons.exercises]]
id = "s10-l03-e2"
type = "fill"
points = 20
prompt = "Complete the prefix test used to reject unknown flags."
code = '''if (args[i].____("-") || question is not null)
    throw new ArgumentException($"unexpected argument: {args[i]}");'''
answer = "StartsWith"
hint = "The string method asks whether the first characters match."

[[lessons.exercises]]
id = "s10-l03-e3"
type = "mc"
points = 20
prompt = "Why should invalid CLI input return a nonzero exit code?"
choices = ["To make output red", "So scripts and callers can detect failure", "Because Console.WriteLine returns an int", "To stop Ollama"]
answer = 1
whyWrong = "Color and Ollama are unrelated, and Console.WriteLine returns void. Process status is a machine-readable success signal."
explain = "Exit 0 means successful handling; a nonzero status distinguishes an error even when output is redirected."
hint = "Think of another program invoking Verisearch."

[[lessons.exercises]]
id = "s10-l03-d1"
type = "type"
points = 14
reps = 2
prompt = "Retype the repeated source option branch twice."
code = '''case "--source" when i + 1 < args.Length:
    labels.Add(args[++i]);
    break;'''

[[lessons.exercises]]
id = "s10-l03-w1"
type = "write"
points = 38
prompt = "Parse the starter tokens in pairs and print the two source labels comma-separated."
starter = '''var tokens = new[] { "--source", "RFC", "--source", "NIST" };
var labels = new List<string>();

Console.WriteLine("NOT PARSED");
'''
expect = "RFC,NIST"
solution = '''var tokens = new[] { "--source", "RFC", "--source", "NIST" };
var labels = new List<string>();

for (int i = 0; i < tokens.Length; i++)
{
    if (tokens[i] == "--source" && i + 1 < tokens.Length)
    {
        labels.Add(tokens[++i]);
    }
}
Console.WriteLine(string.Join(",", labels));
'''
hint = "When the current token is --source, increment i and add the next token."
