[[lessons]]
id = "s10-l03"
teaches = ["language-cli-packaging"]
title = "Parse a Small CLI Without Another Framework"
body = '''

<p>A command-line interface is a public grammar. It should preserve the user's whole question, collect explicit source choices, and configure an AI boundary without relying on shell tricks or secret defaults.</p>
<p>Decide whether the question is positional, supplied through an option, or read from standard input. In every design, pass it as one value to the application. The shell may require quotation marks around spaces, but those quotation marks are not part of the C# value. Do not split the question into keywords and route different words to different lookup implementations.</p>
<pre><code data-kind="terminal">$ verisearch "What changed between the two accounts?"     --source archive --source handbook     --provider cli --ai-command my-ai-wrapper</code></pre>
<p>The command is a usage example, not a required parser or provider name. A learner may choose local model arguments, an API-backed adapter configured by environment, a plugin directory, or another explicit scheme. Secrets must not appear in committed source or ordinary reports.</p>
<p>For a small surface, a loop and <code>switch</code> can parse arguments safely. Every value-taking option must check for a following token. Unknown flags, duplicate singleton options, invalid limits, and missing questions need stable nonzero exits. Repeated source and AI-argument options should retain order. Help should return without starting network or AI work.</p>
<p>Use <code>ProcessStartInfo.ArgumentList</code> when launching another program rather than concatenating a shell command. Argument arrays prevent spaces and punctuation from changing meaning. If you choose an HTTP provider, validate its endpoint and read its API key from configuration or environment at the boundary.</p>
<div class="callout"><p>Provider configuration selects an implementation. It must never select a keyword recipe. The configured AI receives the entire question and the admitted passages.</p></div>
<div class="callout csharp-transfer"><p><strong>C#/.NET transfer:</strong> The .NET runtime supplies <code>args</code> only after the invoking shell has tokenized the command line. C# sees a <code>string[]</code>, so parser correctness concerns array positions and option grammar; child-process safety concerns <code>ArgumentList</code>, not manual quote concatenation.</p></div>
<div class="field-notes"><div class="fn-head">FIELD NOTES // PARSER MATRIX</div><p>List help, valid input, missing option value, unknown option, repeated source, absent AI configuration, and a punctuation-heavy question. Assign an expected exit and whether external work may start.</p></div>
'''

[[lessons.readings]]
label = "Microsoft Learn — Command-line arguments"
url = "https://learn.microsoft.com/en-us/dotnet/csharp/fundamentals/program-structure/main-command-line"
essential = false

[[lessons.exercises]]
id = "s10-l03-e1"
type = "mc"
points = 20
prompt = "Why must a multiword question be quoted in the shell command?"
choices = ["C# strings always need shell quotes", "The shell must pass it as one argument instead of several tokens", "the configured AI reads only quoted JSON", "Spectre.Console requires quotes"]
answer = 1
whyWrong = "This is shell tokenization, not a requirement of C# strings, the configured AI, or Spectre. Quotes preserve one positional argument."
explain = "The parser permits one non-flag question token, so the shell must keep the words together."
hint = "Inspect what arrives in args[]."

[[lessons.exercises]]
id = "s10-l03-e2"
type = "fill"
points = 20
prompt = "Complete the prefix test used to reject unknown flags."
code = '''if (args[i].____("-") || question is not null)
    throw new ArgumentException($"unexpected argument: {args[i]}");'''
answer = "StartsWith"
hint = "The string method asks whether the first characters match."

[[lessons.exercises]]
id = "s10-l03-e3"
type = "mc"
points = 20
prompt = "Why should invalid CLI input return a nonzero exit code?"
choices = ["To make output red", "So scripts and callers can detect failure", "Because Console.WriteLine returns an int", "To stop the configured AI"]
answer = 1
whyWrong = "Color and the configured AI are unrelated, and Console.WriteLine returns void. Process status is a machine-readable success signal."
explain = "Exit 0 means successful handling; a nonzero status distinguishes an error even when output is redirected."
hint = "Think of another program invoking Verisearch."

[[lessons.exercises]]
id = "s10-l03-d1"
type = "type"
points = 14
reps = 2
prompt = "Retype the repeated source option branch twice."
code = '''case "--source" when i + 1 < args.Length:
    labels.Add(args[++i]);
    break;'''

[[lessons.exercises]]
id = "s10-l03-w1"
type = "write"
points = 38
prompt = "Parse the starter tokens in pairs and print the two source labels comma-separated."
starter = '''var tokens = new[] { "--source", "RFC", "--source", "NIST" };
var labels = new List<string>();

Console.WriteLine("NOT PARSED");
'''
expect = "RFC,NIST"
solution = '''var tokens = new[] { "--source", "RFC", "--source", "NIST" };
var labels = new List<string>();

for (int i = 0; i < tokens.Length; i++)
{
    if (tokens[i] == "--source" && i + 1 < tokens.Length)
    {
        labels.Add(tokens[++i]);
    }
}
Console.WriteLine(string.Join(",", labels));
'''
hint = "When the current token is --source, increment i and add the next token."

[[lessons.concepts]]
id = "language-cli-packaging"
purpose = "Design a predictable command surface and deliver a runnable artifact from the same source and project metadata."
anatomy = "Parse arguments without a shell, return stable exit codes, build or publish through dotnet, then launch the produced path with a real command."
example = "The disposable examples in Parse a Small CLI Without Another Framework isolate this capability before the learner chooses how it belongs in the cumulative project. The lesson Parse a Small CLI Without Another Framework supplies the disposable observation point."
observable = "Help, invalid input, ordinary execution, and the published binary each produce their documented outcome. Confirm it while practicing Parse a Small CLI Without Another Framework."
failure = "Ambiguous arguments, embedded secrets, or an unlaunched publish directory leave the program unproved."
practice = "s10-l03-e1"
