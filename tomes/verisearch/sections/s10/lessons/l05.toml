[[lessons.exercises]]
id = "s10-l05-e3"
type = "mc"
points = 18
required = true
capabilities = ["language-methods-scope"]
cognitiveTask = "explain"
scaffold = "guided"
contextFamily = "verisearch-s10-methods-scope"
aidPolicy = "limited"
prompt = "When may the renderer show the MOCK banner?"
choices = ["Whenever The configured AI is offline", "Whenever no quotes pass", "Only when the user explicitly selected mock mode", "Whenever a local fixture source exists"]
answer = 2
whyWrong = "Offline service, empty results, or fixture data do not grant permission to change modes. The CLI flag is the explicit choice."
explain = "Mode honesty requires selection and labeling to agree."
hint = "Follow the Boolean parameter back to --mock."

[[lessons.exercises]]
id = "s10-l05-w1"
type = "write"
points = 38
required = true
capabilities = ["language-methods-scope"]
cognitiveTask = "build"
scaffold = "independent"
contextFamily = "verisearch-s10-methods-scope"
aidPolicy = "limited"
prompt = "Escape square brackets in the starter quote by doubling each opening and closing bracket, then print it."
starter = '''string quote = "[red]source text[/]";
Console.WriteLine(quote);
'''
expect = "[[red]]source text[[/]]"
solution = '''string quote = "[red]source text[/]";
string escaped = quote.Replace("[", "[[").Replace("]", "]]" );
Console.WriteLine(escaped);
'''
hint = "Replace each [ with [[ and each ] with ]]."

[[lessons.concepts]]
id = "language-methods-scope"
purpose = "Give one transformation a named boundary with deliberate inputs, output, and variable lifetime."
anatomy = "Declare the return type, method name, typed parameters, body, and return path; keep locals inside the narrowest useful scope."
example = "The disposable examples in Workshop — Build the Verified-Only Renderer isolate this capability before the learner chooses how it belongs in the cumulative project. The lesson Workshop — Build the Verified-Only Renderer supplies the disposable observation point."
observable = "Callers can exercise the behavior from its result without depending on hidden global state. Confirm it while practicing Workshop — Build the Verified-Only Renderer."
failure = "A method that reads unrelated globals or has an incomplete return path makes tests and reuse unreliable."
practice = "s10-l05-e1"
