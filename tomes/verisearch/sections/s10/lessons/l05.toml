[[lessons]]
id = "s10-l05"
teaches = ["language-methods-scope"]
title = "Workshop — Build the Verified-Only Renderer"
body = '''

<p>Rendering is the last trust boundary. It may format verified quotations, source-owned labels and URIs, source failure diagnostics, rejected-proposal counts, and explicit mode information. It may not deserialize raw AI output or accept a proposal type.</p>
<p>Design the renderer against an input shape that contains only admitted quotes. If your terminal library interprets markup, escape external text before passing it to a markup-aware API. Plain text and JSON are equally valid choices when they preserve exact quote wording and citations.</p>
<pre><code data-kind="replacement">string EscapeForPlainTerminal(string text) =&gt; text;
// A markup renderer would use its library's escaping operation instead.</code></pre>
<p>The fragment emphasizes that escaping belongs to the output medium. Do not alter the stored verified text merely to make one renderer happy. Grouping by source may improve readability, but it must keep each quote paired with the URI supplied by the matched passage.</p>
<p>Empty results need honest language: “no exact quote was verified” is not “the answer is false.” Partial failure should list the sources that could not be read without hiding healthy evidence. A real AI failure should reach the application boundary and produce an actionable failure; it must not silently switch to a mock, keyword selector, or first-passage algorithm.</p>
<p>An explicit deterministic mock is useful for tests and demos. Its report must unmistakably say that it is mock output and not a factual search result. The mode cannot be inferred from whether the output happened to look plausible; carry it as data.</p>
<p>Test the renderer with brackets or other markup characters inside the quote, two source URIs, one source failure, no quotes, and explicit mock mode. Assert that a fabricated proposal type cannot be passed to the renderer at compile time or through its public API.</p>
<div class="callout"><p>The Working permits a custom visual style and output format. The immutable rule is that presentation cannot upgrade unverified model text into evidence.</p></div>
<div class="callout csharp-transfer"><p><strong>C#/.NET transfer:</strong> C# interpolation and numeric formatting can use the current culture, while this product's quote and URI evidence must remain exact. Format presentation values deliberately and escape only at the output adapter; never mutate the stored verified quotation for a terminal library.</p></div>
<div class="field-notes"><div class="fn-head">FIELD NOTES // CITATION TRACE</div><p>For one rendered URL, trace backward to the verified value, matched passage, and selected source. No step should read attribution from AI JSON.</p></div>
'''

[[lessons.readings]]
label = "Spectre.Console — Panels"
url = "https://spectreconsole.net/console/widgets/panel/"
essential = false

[[lessons.exercises]]
id = "s10-l05-e1"
type = "mc"
points = 20
required = true
capabilities = ["language-methods-scope"]
cognitiveTask = "predict"
scaffold = "guided"
contextFamily = "verisearch-s10-methods-scope"
aidPolicy = "limited"
prompt = "A verified quote contains <code>[green]text[/]</code>. What must happen before it enters a Panel?"
choices = ["Remove the brackets", "Pass it through Markup.Escape", "Trust it because verification passed", "Convert it back to QuoteProposal"]
answer = 1
whyWrong = "Verification proves source containment, not safe terminal markup. Deleting characters changes the quote, and converting types weakens the boundary."
explain = "Escaping preserves every displayed character while preventing Spectre from interpreting it as style."
hint = "Truth safety and markup safety are separate checks."

[[lessons.exercises]]
id = "s10-l05-d1"
type = "type"
points = 14
required = false
capabilities = ["language-methods-scope"]
cognitiveTask = "complete"
scaffold = "worked"
contextFamily = "verisearch-s10-methods-scope"
aidPolicy = "limited"
reps = 2
prompt = "Retype the verified quote panel twice."
code = '''string safeText = Markup.Escape(quote.Text);
AnsiConsole.Write(new Panel(safeText)
    .Header($"[bold]Passage {quote.PassageId}[/]")
    .RoundedBorder());'''

