[[lessons.exercises]]
id = "s10-l02-e1"
type = "mc"
points = 20
required = true
capabilities = ["language-classes-records"]
cognitiveTask = "explain"
scaffold = "guided"
contextFamily = "verisearch-s10-report-widget-composition"
aidPolicy = "limited"
prompt = "Which widget draws the <code>─── SOURCE 1 ───</code> section divider?"
choices = ["Panel", "Table", "Rule", "Divider"]
answer = 2
whyWrong = "Panel boxes content and Table makes grids; ‘Divider’ isn’t the widget — Rule draws the titled horizontal divider."
explain = "<code>Rule</code> is the titled horizontal divider, which is what separates one source's block from the next in the report layout."
hint = "Also a good name for how THORNE grades."

[[lessons.exercises]]
id = "s10-l02-e2"
type = "mc"
points = 20
required = true
capabilities = ["language-classes-records"]
cognitiveTask = "explain"
scaffold = "guided"
contextFamily = "verisearch-s10-report-widget-composition"
aidPolicy = "limited"
prompt = "Best widget for displaying a verbatim quote with a small header?"
choices = ["Table with one cell", "Rule", "MarkupLine with dashes", "Panel with a PanelHeader"]
answer = 3
whyWrong = "A one-cell Table, a Rule, or dashed text all read poorly — a Panel with a PanelHeader frames a quote with its small heading."
explain = "A <code>Panel</code> with a header frames the quotation as its own object and carries the attribution in the header, while the exact quoted text stays unmodified inside the frame."
hint = "It's literally a box with an optional title."

[[lessons.exercises]]
id = "s10-l02-e3"
type = "mc"
points = 20
required = true
capabilities = ["language-classes-records"]
cognitiveTask = "explain"
scaffold = "guided"
contextFamily = "verisearch-s10-report-widget-composition"
aidPolicy = "limited"
prompt = "Numeric columns in a table should be…"
choices = ["right-aligned so magnitudes line up", "centered for symmetry", "left-aligned like text", "hidden unless verbose"]
answer = 0
whyWrong = "Numbers read best right-aligned so digits line up by magnitude — centering or left-aligning them like text makes columns hard to scan."
explain = "Right alignment lines the digits up by magnitude, so a reader can compare counts and scores down the column without reading each number individually."
hint = "9.5 over 10.0 over 2.0 — the decimal points should stack."

