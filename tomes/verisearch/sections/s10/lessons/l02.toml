[[lessons.concepts]]
id = "language-report-widget-composition"
purpose = "Compose a report from a few reusable display parts instead of scattering formatting through the pipeline."
anatomy = "A widget object is built, configured, and then written to the console; rules divide sections, panels frame quoted text, and tables carry aligned rows."
example = "A rule announcing one source, a panel holding one escaped quotation, and a table with declared columns for numbered results."
observable = "The report keeps a stable visual order, and the same data renders identically across runs."
failure = "Building widget text inline at every call site makes a truth rule impossible to see and impossible to test in one place."
practice = "s10-l02-e1"
