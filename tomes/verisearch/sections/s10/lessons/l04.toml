[[lessons.exercises]]
id = "s10-l04-w1"
type = "write"
points = 32
required = true
capabilities = ["language-interfaces-polymorphism"]
cognitiveTask = "build"
scaffold = "independent"
contextFamily = "verisearch-s10-render-contract-design"
aidPolicy = "limited"
prompt = "Given an empty verified quote list and one source error, print the exact two-line plain-text empty state from the solution contract."
starter = '''var quotes = new List<string>();
var errors = new List<string> { "RFC: timed out" };
Console.WriteLine("NOT RENDERED");
'''
expect = '''no verified quotes found
source error: RFC: timed out'''
solution = '''var quotes = new List<string>();
var errors = new List<string> { "RFC: timed out" };

if (quotes.Count == 0)
{
    Console.WriteLine("no verified quotes found");
}
foreach (string error in errors)
{
    Console.WriteLine($"source error: {error}");
}
'''
hint = "Print the empty line when Count is zero, then foreach the errors with the source error prefix."

[[lessons.concepts]]
id = "language-render-contract-design"
purpose = "Design one rendering boundary whose input shape makes an unverified quotation impossible to represent."
anatomy = "The public method accepts the question, the verified quotations, a rejection count, source error diagnostics, and explicit mode flags, and nothing else."
example = "A renderer contract naming verified quotations and mode state in its parameters, with proposal types deliberately absent from the signature."
observable = "The renderer cannot be called with proposal data, and every rendered section traces to an input the caller had to supply."
failure = "Letting the renderer accept raw model output moves the last trust boundary into formatting code, where nobody looks for it."
practice = "s10-l04-e1"
