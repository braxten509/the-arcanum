[[lessons]]
id = "s10-l04"
teaches = ["language-render-contract-design"]
title = "Design a Report That Can Render Only Verified Quotes"
body = '''
<p>Formatting scattered through the pipeline makes truth rules hard to see. Create one <code>ReportRenderer</code> whose public method accepts a question, a read-only collection of <code>VerifiedQuote</code>, rejected-proposal count, source-error strings, and the two mode flags. There is deliberately no overload for <code>QuoteProposal</code>.</p>
<p>Render in a stable order:</p>
<ol><li>A rule containing the escaped question.</li><li>If <code>mock</code>, an unmistakable yellow <code>MODE: MOCK SELECTOR — NO AI</code> line.</li><li>A designed empty state or complete verified quote panels grouped by source URL.</li><li>The source label, full URL, and passage id for every quote.</li><li>Visible source failures; in verbose mode, rejected-proposal count.</li></ol>
<p>Every string from a question, page, configuration, model, or exception passes through <code>Markup.Escape</code> before entering Spectre markup. Without it, text such as <code>[red]forged[/]</code> would be interpreted as formatting instructions. Hardcoded markup like <code>[yellow]</code> is safe because the program authored it.</p>
<p>Do not truncate quote text. Terminal wrapping may change its visual lines, but the characters printed remain the full <code>VerifiedQuote.Text</code>. A user can then copy and search for the exact evidence at its URL. The renderer may abbreviate verbose diagnostics, never the promised quotation.</p>
<div class="callout">An empty verified list is not permission to print proposals, whole passages, or keyword matches. Say that no verified quotes were found and show any source/model failure separately.</div>
<div class="callout csharp-transfer"><p><strong>C#/.NET transfer:</strong> A renderer parameter typed as <code>IReadOnlyList&lt;VerifiedQuote&gt;</code> prevents ordinary callers from accidentally supplying proposal records. That compile-time boundary is stronger than naming alone, while constructors and accessibility decide who is allowed to create verified values.</p></div>
<div class="field-notes"><div class="fn-head">MARGINALIA // TYPES AS A DISPLAY FIREWALL</div><p>When a renderer's signature names only trusted output types, accidental misuse becomes a compiler error. This is stronger than a comment saying “remember to verify first.”</p></div>
'''

[[lessons.readings]]
label = "Spectre.Console — Markup"
url = "https://spectreconsole.net/markup"
essential = false

[[lessons.exercises]]
id = "s10-l04-e1"
type = "mc"
points = 20
required = true
capabilities = ["language-interfaces-polymorphism"]
cognitiveTask = "explain"
scaffold = "guided"
contextFamily = "verisearch-s10-render-contract-design"
aidPolicy = "limited"
prompt = "Why does ReportRenderer accept <code>VerifiedQuote</code> but not <code>QuoteProposal</code>?"
choices = ["Spectre cannot render records", "The method signature makes bypassing verification harder", "Proposals have no strings", "It improves network speed"]
answer = 1
whyWrong = "Spectre can render strings from records, proposals do contain text, and rendering types do not affect networking. The signature enforces the trust boundary."
explain = "Raw model output cannot be passed to this renderer without a compile-time type mismatch."
hint = "What happens if a caller passes the wrong record type?"

[[lessons.exercises]]
id = "s10-l04-e2"
type = "mc"
points = 25
required = true
capabilities = ["language-interfaces-polymorphism"]
cognitiveTask = "explain"
scaffold = "guided"
contextFamily = "verisearch-s10-render-contract-design"
aidPolicy = "limited"
prompt = "There are zero verified quotes and the configured AI returned malformed JSON. What should the report show?"
choices = ["A designed no-verified-quotes state plus the model error", "A fabricated quote", "The malformed JSON", "Nothing"]
answer = 0
whyWrong = "Fabrication, raw model output, and silence all obscure what happened. The user needs an honest empty state and a separate actionable failure."
explain = "Absence of verified evidence and reason for failure are distinct facts."
hint = "Do not confuse no result with no report."

[[lessons.exercises]]
id = "s10-l04-e3"
type = "mc"
points = 20
required = true
capabilities = ["language-interfaces-polymorphism"]
cognitiveTask = "explain"
scaffold = "guided"
contextFamily = "verisearch-s10-render-contract-design"
aidPolicy = "limited"
prompt = "Which LINQ operator groups verified quotes under each source URL?"
choices = ["Distinct", "Aggregate", "Zip", "GroupBy"]
answer = 3
whyWrong = "Distinct removes duplicates, Zip pairs sequences, and Aggregate folds values. GroupBy forms one bucket per URL."
explain = "Each grouping exposes its URL Key and all VerifiedQuote members from that source."
hint = "Bucket by quote.Url."

[[lessons.exercises]]
id = "s10-l04-d1"
type = "type"
points = 14
required = false
capabilities = ["language-interfaces-polymorphism"]
cognitiveTask = "complete"
scaffold = "worked"
contextFamily = "verisearch-s10-render-contract-design"
aidPolicy = "limited"
reps = 2
prompt = "Retype the markup-safe quote output twice."
code = '''string safeText = Markup.Escape(quote.Text);
string safeUrl = Markup.Escape(quote.Url);
AnsiConsole.Write(new Panel(safeText).Header($"Passage {quote.PassageId}"));
