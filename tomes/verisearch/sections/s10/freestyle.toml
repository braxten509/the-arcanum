[freestyle]
title = "THE WORKING: The Verified Report"
requires = ["cli-options", "spectre-markup", "spectre-widgets", "report-renderer", "verified-output"]
brief = "Give the existing project a safe command surface and report.<ul><li>Add <code>CommandLineOptions.cs</code> with question, repeatable <code>--source LABEL</code>, <code>--mock</code>, <code>--verbose</code>, and <code>--help</code>. Bad input prints usage and exits nonzero.</li><li>Install only <code>Spectre.Console</code>. Keep argument parsing in project code; do not add Spectre.Console.Cli.</li><li>Create <code>ReportRenderer.cs</code> from the workshop. Its public signature accepts only <code>VerifiedQuote</code> plus failure/count metadata—never <code>QuoteProposal</code> or raw model strings.</li><li>Escape the question, quote, label, URL, and errors. Print every complete verified quote with source label, URL, and passage id.</li><li>Show an unmistakable MOCK banner only when <code>--mock</code> was explicitly supplied; design honest zero-quote and partial-source-failure states.</li><li>Run a markup-injection fixture containing <code>[red]FORGED[/]</code>, then <code>dotnet build</code> and visually inspect narrow-terminal wrapping.</li></ul>"
reward = 550
packages = ["Spectre.Console"]
xray = "THORNE tries unknown flags, a missing --source value, markup in every external string, zero verified quotes, and one failed source. He also searches the renderer signature for QuoteProposal: if raw model output can enter, the illumination is counterfeit."

[freestyle.badge]
id = "badge-s10"
name = "ILLUMINATOR"
desc = "Made verified evidence legible without letting untrusted markup or proposals cross the page."

[[freestyle.rubric]]
criterion = "CLI behavior"
weight = 20
desc = "Question, repeatable source labels, help, mock, and verbose parse predictably; invalid input gives usage and nonzero status."

[[freestyle.rubric]]
criterion = "Verified-only boundary"
weight = 25
desc = "ReportRenderer can consume VerifiedQuote but no proposal or raw model response type."

[[freestyle.rubric]]
criterion = "Markup safety"
weight = 20
desc = "Every externally controlled string is escaped; bracket markup cannot alter the report."

[[freestyle.rubric]]
criterion = "Honest report design"
weight = 20
desc = "Full quotes, citations, visible mock mode, empty state, rejected count, and partial errors are readable and distinct."

[[freestyle.rubric]]
criterion = "C# craft"
weight = 15
desc = "PascalCase types and methods, camelCase locals, four-space indentation, Allman braces, and rendering isolated from pipeline logic."
