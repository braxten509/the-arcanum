[[freestyle.referenceSteps]]
id = "s10-write-report-renderer"
path = "src/Verisearch/ReportRenderer.cs"
mode = "write"
instruction = "Private replay renders only verified values, failures, and explicit mock state."
content = '''
using System.Text;

namespace Verisearch;

public sealed class ReportRenderer : IReportRenderer
{
    public string Compose(string question, SearchResult result)
    {
        var report = new StringBuilder();
        report.AppendLine("VERISEARCH // VERIFIED EVIDENCE");
        if (result.IsMock)
        {
            report.AppendLine("MODE: EXPLICIT MOCK AI — NOT A FACTUAL SEARCH RESULT");
        }
        report.AppendLine($"Question: {question}");
        report.AppendLine();

        if (result.Quotes.Count == 0)
        {
            report.AppendLine("No exact quotation survived verification.");
        }
        else
        {
            for (int index = 0; index < result.Quotes.Count; index++)
            {
                VerifiedQuote quote = result.Quotes[index];
                report.AppendLine($"QUOTE {index + 1}");
                report.AppendLine(quote.Quote);
                report.AppendLine($"Source: {quote.SourceLabel}");
                report.AppendLine($"URL: {quote.SourceUri}");
                report.AppendLine($"Passage: {quote.PassageId}");
                report.AppendLine();
            }
        }

        foreach (SourceReadOutcome source in result.Sources.Where(item => !item.Succeeded))
        {
            report.AppendLine($"SOURCE FAILED [{source.Source.Label}]: {source.Error}");
        }
        report.AppendLine($"Rejected AI proposals: {result.RejectedCount}");
        return report.ToString().TrimEnd();
    }
}
'''
