[freestyle]
title = "THE WORKING: The Illumination"
brief = "Give Verisearch its face.<ul><li>Convert entry to <code>Spectre.Console.Cli</code>: a default async command taking <code>&lt;query&gt;</code> plus <code>--max-sources</code>, <code>--min-trust</code>, <code>--verbose</code> (flags override config-file values, which override defaults)</li><li>Run the pipeline under a Status spinner with phase updates</li><li>Render via a dedicated <code>ReportRenderer</code>: header rule, per-source rules with traffic-light trust colors, panels for verbatim quotes (escaped!), the trust summary table (right-aligned numbers), a designed empty state, and dim verbose lines</li><li>Install Spectre.Console and Spectre.Console.Cli via PACKAGES</li></ul>Note: the desk's scroll terminal supports ANSI colors — run it and look at your work."
reward = 550
packages = ["Spectre.Console", "Spectre.Console.Cli"]
xray = "THORNE's render tests: a source whose title is literally \"[red]INJECTED[/]\" (escape or bleed), a run with zero results (designed empty state or blank shame), and --min-trust banana (typed parser should handle it — friendly error, nonzero exit). He compares --verbose off/on: identical core report, added dim lines only. Style: he counts accent colors — more than one non-semantic accent and the design criterion drops."

[freestyle.badge]
id = "badge-s10"
name = "ILLUMINATOR"
desc = "The tome earned a face worth reading by candlelight at 3am."

[[freestyle.rubric]]
criterion = "Compiles & renders the sketch"
weight = 20
desc = "Report visually matches the design: rules, panels, summary table."

[[freestyle.rubric]]
criterion = "CLI parsing"
weight = 20
desc = "Settings class attributes correct; --help meaningful; bad input → friendly error + nonzero exit."

[[freestyle.rubric]]
criterion = "Markup safety"
weight = 20
desc = "All scraped text escaped or interpolated safely — a title containing [red] must not break the report."

[[freestyle.rubric]]
criterion = "Design quality"
weight = 20
desc = "Color=meaning only, consistent number formatting, aligned columns, empty state, clean verbose gating."

[[freestyle.rubric]]
criterion = "Architecture"
weight = 20
desc = "ReportRenderer isolation; flag/config/default precedence actually implemented."
