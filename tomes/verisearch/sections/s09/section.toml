build = "The pointing spirit — an AI bound so it may only point, never speak"
brief = "The tome's cleverest binding: the spirit never writes the answer. It reads your gleaned passages and returns INDICES — \"the true ones are 142, 143, 144.\" The verbatim words come from the page itself, so the spirit cannot dream up a false quote — this is the very truth-binding the Liber Veritatis was commissioned for. This chapter: keeping local spirits with Ollama, OllamaSharp, demands that compel structured answers, and wary parsing for when the spirit grows talkative anyway. No Ollama kept? Mock mode lets the forging continue."
