id = "s09"
codename = "CHAPTER IX // THE BOUND SPIRIT"
short = "The Bound Spirit"
title = "The Bound Spirit — Structured Local AI Quotations"
build = "The proposal-and-proof gate — AI extracts precise candidates, C# decides what may be quoted"
brief = "The local spirit is useful because it can find a precise answer inside a long passage. It is not trusted merely because it speaks JSON. This chapter calls Ollama’s official HTTP API, asks for structured <code>passageId</code> plus <code>quote</code> proposals, and then makes C# prove every quote is an exact ordinal substring of the source-owned passage. Live mode requires Ollama; mock mode is an explicit, labeled fixture—not a secret substitute."
