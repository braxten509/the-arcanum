[[lessons.concepts]]
id = "language-semantic-seam-separation"
purpose = "Split the product where judgment ends and proof begins: the model may propose, and only C# may verify."
anatomy = "One narrow contract sends the whole question with the stable passages and receives proposals that carry a passage id and candidate text and nothing else."
example = "A semantic quote selector interface declared with that single responsibility, leaving source authority, fetching, and verification outside it."
observable = "Every reported quotation was proved by C# against stored passage text, and the model's output alone can reach no report."
failure = "Letting the model choose sources or declare a quote verified moves the truth claim to the one component that cannot be tested."
practice = "s09-l01-e1"
