[[lessons]]
id = "s09-l01"
teaches = ["ollama-setup"]
title = "Run a Local Model with Ollama"
body = '''
<p>Ollama runs a language model on the learner's own machine and exposes a local HTTP API. Verisearch uses it for one bounded judgment: given a question and numbered passages, propose short exact substrings that answer the question. The model does not fetch pages, choose source authority, verify its own words, or author citations.</p>
<p>Install Ollama from its official instructions for your operating system. On Linux, the official installation command is:</p>
<pre><code>curl -fsSL https://ollama.com/install.sh | sh</code></pre>
<p>Then open a terminal and run these checks one at a time:</p>
<pre><code>ollama --version
ollama pull qwen3:4b
ollama run qwen3:4b</code></pre>
<p>Enter a short message to prove the model loads; use <code>/bye</code> to leave the interactive session. The local API normally listens on <code>http://localhost:11434</code>. Depending on the installation, Ollama may already run as a service; otherwise <code>ollama serve</code> starts it in a terminal. A simple health check is <code>curl http://localhost:11434/api/tags</code>.</p>
<p><code>qwen3:4b</code> is the course default because it is small enough for many local machines while supporting structured output. It is configuration, not a compiled constant: a learner may choose another installed model after checking memory and performance. The course should still use one known model during debugging so a model change is not confused with a C# bug.</p>
<p>Local does not mean trusted. Model output is untrusted input just like JSON from a network service. Chapter IX will deserialize its proposed shape, cap it, match ids, and require an exact source substring before creating a <code>VerifiedQuote</code>.</p>
<div class="callout">If the machine cannot run the model yet, continue only with the explicit <code>--mock</code> learning path. The terminal must label that output MOCK; live mode must fail clearly rather than silently changing algorithms.</div>
<div class="field-notes"><div class="fn-head">MARGINALIA // THREE SEPARATE FAILURES</div><p>“Command not found” means installation or PATH. “Connection refused” means the API service is not running. “Model not found” means the server is alive but the configured tag has not been pulled. Diagnose those states separately before editing C#.</p></div>
'''

[[lessons.readings]]
label = "Ollama — Linux installation"
url = "https://docs.ollama.com/linux"
essential = true

[[lessons.readings]]
label = "Ollama — qwen3 model tags"
url = "https://ollama.com/library/qwen3/tags"
essential = false

[[lessons.exercises]]
id = "s09-l01-e1"
type = "mc"
points = 20
prompt = "Why is Ollama allowed to produce only a <code>QuoteProposal</code>, not a <code>VerifiedQuote</code>?"
choices = ["Models cannot return JSON", "C# must independently prove exact text and attach source-owned attribution", "Records cannot cross HTTP", "Ollama has no local API"]
answer = 1
whyWrong = "Ollama can return JSON through its local API and C# can deserialize it. The separate type exists because model output has not earned the verifier's guarantee."
explain = "Proposal and proof remain different states, enforced by different C# types."
hint = "Which component owns the source URL and exact-match check?"

[[lessons.exercises]]
id = "s09-l01-e2"
type = "text"
points = 20
prompt = "Which TCP port does Ollama use in the course's default local URL?"
answer = "11434"
hint = "Read the digits after localhost in the API address."

[[lessons.exercises]]
id = "s09-l01-e3"
type = "mc"
points = 20
prompt = "What security posture should Verisearch take toward local model output?"
choices = ["Trust it because it is local", "Trust only JSON syntax", "Treat it as untrusted data until deterministic C# checks pass", "Display it first and verify later"]
answer = 2
whyWrong = "Local execution and valid syntax do not prove truth, while displaying before verification breaks the product promise."
explain = "Deserialization proves shape; QuoteVerifier proves the exact source relation."
hint = "Location is not a truth guarantee."

[[lessons.exercises]]
id = "s09-l01-d1"
type = "type"
points = 14
reps = 2
prompt = "Retype the three setup checks twice."
code = '''ollama --version
ollama pull qwen3:4b
curl http://localhost:11434/api/tags'''
