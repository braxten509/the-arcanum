scaffold = "guided"
contextFamily = "verisearch-s09-interfaces-polymorphism"
aidPolicy = "limited"
prompt = "Which implementation satisfies the factual-search Working?"
choices = ["A keyword-to-source dictionary", "A real configured AI adapter behind the semantic interface", "The first passage for every question", "An unlabeled deterministic mock"]
answer = 1
whyWrong = "Rigid rules and mock or first-passage substitutes do not perform the required semantic AI selection."
hint = "The whole question must reach genuine model inference."
explain = "Any real provider is valid when it honors the common proposal contract."

