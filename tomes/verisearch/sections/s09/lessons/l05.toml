[[lessons.concepts]]
id = "language-interfaces-polymorphism"
purpose = "Name a behavioral seam so real providers and test doubles can be substituted without changing the pipeline's truth rules."
anatomy = "Declare the smallest useful interface member, implement it in separate concrete types, and depend on the interface at the caller boundary."
example = "The disposable examples in Working rehearsal — integrate a real AI of your choice isolate this capability before the learner chooses how it belongs in the cumulative project. The lesson Working rehearsal — integrate a real AI of your choice supplies the disposable observation point."
observable = "Two implementations can satisfy the same caller while verification and reporting remain unchanged. Confirm it while practicing Working rehearsal — integrate a real AI of your choice."
failure = "An interface that exposes provider details or verified output lets one implementation bypass the common contract."
practice = "s09-l05-e1"
