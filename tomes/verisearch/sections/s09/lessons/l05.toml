[[lessons]]
id = "s09-l05"
teaches = ["language-interfaces-polymorphism"]
title = "Working rehearsal — integrate a real AI of your choice"
body = '''

<p>This Working is an independent provider integration, not an Ollama recipe. Choose one real AI route your environment can support: a local-model CLI, a local HTTP server, a hosted API, or a configured wrapper command. You may also implement more than one provider behind the same seam.</p>
<p>First write the provider-neutral contract and tests. A spy must observe the entire question as one value and the exact stable passages. A malformed response must fail at the adapter boundary. An exact proposal must reach verification, while a one-character fabrication must be rejected. Provider failure must not activate a keyword algorithm or silent mock.</p>
<p>Then implement the chosen transport. Keep provider-specific request and response shapes inside the adapter. Convert its output into your proposal model, dispose owned resources, pass cancellation, limit response size and proposal count, and surface a diagnostic that helps distinguish configuration, transport, model, and schema failures.</p>
<pre><code data-kind="terminal">$ my-configured-ai --version
$ dotnet test
$ dotnet run --project ./src/YourApp -- "What does the source actually say?" --source chosen-label</code></pre>
<p>The commands are a rehearsal pattern. Replace executable, project, and options with your design. The live run must use the selected source catalog and a genuine AI. Preserve the prompt or spy evidence showing that the whole question crossed the boundary. Do not commit an API key.</p>
<p>If hardware or credentials prevent a live provider during development, an explicit mock can keep deterministic tests moving. It must be chosen knowingly, return proposals rather than verified values, and label any rendered output as non-factual. The Working is not complete until a real provider path is configured and its failure behavior is also observed.</p>
<p>Finally, compare the adapter with the verifier. The adapter may change when the provider changes; source selection, extraction, exact matching, and citations should not. That substitutability is the value of the interface.</p>
<div class="callout"><p>Creativity belongs in provider choice, prompt construction, configuration, and diagnostics. The immutable truth boundary is exact C# verification of AI-proposed source substrings.</p></div>
<div class="callout csharp-transfer"><p><strong>C#/.NET transfer:</strong> C# top-level statements may use <code>await</code>, allowing the compiler-generated entry point to be asynchronous. Manual construction in the outermost composition code is sufficient here; a dependency-injection framework is optional, not a prerequisite for replaceable adapters.</p></div>
<div class="field-notes"><div class="fn-head">FIELD NOTES // LIVE VERSUS EXPLICIT MOCK</div><p>Record the selected mode in output data. Never infer it from success, and never describe deterministic mock output as factual search.</p></div>
'''

