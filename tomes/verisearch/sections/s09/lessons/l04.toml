[[lessons]]
id = "s09-l04"
teaches = ["language-testing-debugging"]
title = "The verifier — ordinal text and source-owned citations"
body = '''

<p>The verifier is the deterministic half of the product promise. It receives stable passages and untrusted proposals. For each proposal, it locates the named passage, rejects missing or blank values, and requires the proposed quote to occur as an exact ordinal substring of that passage's stored text.</p>
<p>Ordinal comparison treats the code units as written. It does not fold case, normalize punctuation again, stem words, calculate similarity, or ask the AI whether its own answer is close enough. This makes acceptance explainable: either the exact candidate occurs in the same text shown to the model or it does not.</p>
<pre><code data-kind="replacement">int location = passage.Text.IndexOf(proposal.Quote, StringComparison.Ordinal);
if (location &lt; 0)
{
    return Rejected("quote is not an exact passage substring");
}</code></pre>
<p>The fragment shows the decisive comparison without prescribing result types. Before it, lookup must bind the proposal to one known passage. After it, C# creates a verified value by copying quote text plus the passage's source label and URI. Never copy attribution from AI output.</p>
<p>Set a maximum accepted count outside or inside the verifier and handle duplicates intentionally. A useful result can carry accepted quotes, rejected count, and bounded diagnostics without exposing raw provider prose to the renderer. Keep rejection ordinary; models can propose imperfect candidates without crashing the application.</p>
<p>Tests are the proof. Supply one exact interior substring, the same words with changed case, a one-character fabrication, an unknown id, a duplicate, and more candidates than the cap. Assert accepted text and source-owned attribution. Then mutate the source URI while leaving the proposal unchanged; the rendered citation should follow the source, proving ownership.</p>
<div class="callout"><p>AI chooses by meaning. C# verifies by exact evidence. Neither replaces the other, and no keyword rules appear in this boundary.</p></div>
<div class="callout csharp-transfer"><p><strong>C#/.NET transfer:</strong> Use <code>StringComparison.Ordinal</code> for this exact-text contract so culture and case rules cannot transform the decision. C# should look up the passage by its stable id, test containment against that stored text, and copy attribution from the matched source object.</p></div>
<div class="field-notes"><div class="fn-head">FIELD NOTES // A TYPE IS A CLAIM</div><p>Name the admitted type only after the comparison succeeds. If callers can construct it freely, enforce the invariant through module visibility, factories, or tests and make the ownership rule unmistakable.</p></div>
'''

