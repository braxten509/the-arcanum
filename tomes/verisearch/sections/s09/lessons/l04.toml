[[lessons.concepts]]
id = "language-testing-debugging"
purpose = "Turn a C# promise into an executable check and diagnose failures from the earliest broken boundary."
anatomy = "Arrange controlled inputs, invoke one behavior, assert an observable result, then use compiler, test, or debugger output to localize a failing case."
example = "The disposable examples in The verifier — ordinal text and source-owned citations isolate this capability before the learner chooses how it belongs in the cumulative project. The lesson The verifier — ordinal text and source-owned citations supplies the disposable observation point."
observable = "The check passes for a valid case and fails when its load-bearing input is deliberately changed. Confirm it while practicing The verifier — ordinal text and source-owned citations."
failure = "A test that prints a prepared success receipt or requires live network state cannot distinguish a regression."
practice = "s09-l04-e1"
