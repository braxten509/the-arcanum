[[lessons]]
id = "s09-l04"
teaches = ["quote-verification"]
title = "QuoteVerifier — Exact Text or Rejection"
body = '''
<p>The model has now returned a typed <code>QuoteBatch</code>, but every item is still a proposal. <code>QuoteVerifier.cs</code> turns a proposal into a <code>VerifiedQuote</code> only when its passage exists and its quote is a non-empty, case-sensitive, ordinal substring of the stored passage text.</p>
<pre><code><span class="k">public sealed class</span> QuoteVerifier
{
    <span class="k">public</span> VerificationBatch Verify(IEnumerable&lt;QuoteProposal&gt; proposals,
        IReadOnlyList&lt;Passage&gt; passages, <span class="k">int</span> maxQuotes)
    {
        <span class="k">var</span> accepted = <span class="k">new</span> List&lt;VerifiedQuote&gt;();
        <span class="k">var</span> seen = <span class="k">new</span> HashSet&lt;(<span class="k">int</span>, <span class="k">string</span>)&gt;();
        <span class="k">int</span> rejected = 0;

        <span class="k">foreach</span> (QuoteProposal proposal <span class="k">in</span> proposals)
        {
            Passage? passage = passages.FirstOrDefault(p =&gt; p.Id == proposal.PassageId);
            <span class="k">bool</span> valid = accepted.Count &lt; maxQuotes
                &amp;&amp; passage <span class="k">is not null</span>
                &amp;&amp; !<span class="k">string</span>.IsNullOrWhiteSpace(proposal.Quote)
                &amp;&amp; passage.Text.Contains(proposal.Quote, StringComparison.Ordinal)
                &amp;&amp; seen.Add((proposal.PassageId, proposal.Quote));

            <span class="k">if</span> (!valid)
            {
                rejected++;
                <span class="k">continue</span>;
            }

            accepted.Add(<span class="k">new</span> VerifiedQuote(proposal.Quote, passage!.Source.Label,
                passage.Source.Url, passage.Id));
        }
        <span class="k">return new</span> VerificationBatch(accepted, rejected);
    }
}</code></pre>
<p>Add <code>VerificationBatch(List&lt;VerifiedQuote&gt; Accepted, int Rejected)</code> to <code>Models.cs</code>. Notice what the model does not control: source label, URL, or final type. C# copies those fields from the matched passage. A model-supplied URL is impossible because <code>QuoteProposal</code> has no URL member.</p>
<p><code>StringComparison.Ordinal</code> compares exact UTF-16 code units without case folding or culture rules. Do not trim, correct punctuation, use fuzzy similarity, or ignore case. If the model misses by one character, reject and report the count; never quietly edit it into validity.</p>
<div class="callout">The renderer will accept only <code>VerifiedQuote</code>. This type boundary prevents raw model content from reaching the terminal by accident.</div>
<div class="field-notes"><div class="fn-head">MARGINALIA // EXACTNESS AND NORMALIZATION</div><p>The exact match is against the normalized <code>Passage.Text</code> created once in Chapter VI. The README discloses whitespace normalization. No second normalization occurs here, so the model and verifier compare the same stored representation.</p></div>
'''

[[lessons.readings]]
label = "Microsoft Learn — String.Contains with StringComparison"
url = "https://learn.microsoft.com/en-us/dotnet/api/system.string.contains"
essential = false

[[lessons.exercises]]
id = "s09-l04-e1"
type = "mc"
points = 20
prompt = "The proposal has the right passage id but changes one letter's case. What should QuoteVerifier do?"
choices = ["Accept it as close enough", "Lowercase both strings", "Reject it", "Ask the renderer to repair it"]
answer = 2
whyWrong = "Case folding or renderer repair changes the exact-source contract. Ordinal containment rejects the altered candidate."
explain = "A quotation earns the verified type only when the proposal occurs exactly in Passage.Text."
hint = "The comparison mode is Ordinal, not OrdinalIgnoreCase."

[[lessons.exercises]]
id = "s09-l04-e2"
type = "mc"
points = 20
prompt = "A proposal names passage 900, but the current source batch has ids 1 through 12. What survives?"
choices = ["The quote with an unknown citation", "Passage 12", "Nothing from that proposal", "A newly created passage 900"]
answer = 2
whyWrong = "The verifier neither invents a passage nor substitutes the nearest id. An unknown id has no source-owned text to prove against."
explain = "The proposal increments the rejected count and produces no VerifiedQuote."
hint = "FirstOrDefault finds no passage."

[[lessons.exercises]]
id = "s09-l04-e3"
type = "mc"
points = 20
prompt = "Why does C# attach the URL after matching instead of accepting a URL from the model?"
choices = ["JSON cannot hold URLs", "Source attribution must come from the program's own Passage data", "Ollama always omits URLs", "Spectre.Console requires it"]
answer = 1
whyWrong = "JSON can hold strings, model behavior can change, and Spectre does not establish provenance. The matched passage is the trustworthy owner."
explain = "Removing URL from QuoteProposal makes invented attribution unavailable by construction."
hint = "Which object entered the pipeline before the AI call?"

[[lessons.exercises]]
id = "s09-l04-d1"
type = "type"
points = 14
reps = 2
prompt = "Retype the exact containment gate twice."
code = '''bool exact = passage is not null
    && !string.IsNullOrWhiteSpace(proposal.Quote)
    && passage.Text.Contains(proposal.Quote, StringComparison.Ordinal);'''

[[lessons.exercises]]
id = "s09-l04-w1"
type = "write"
points = 38
prompt = "Given one source passage and three proposals, count exact ordinal substring matches. Only <code>Exact source words.</code> with identical case and punctuation should pass."
starter = '''string passage = "Before. Exact source words. After.";
var proposals = new List<string>
{
    "Exact source words.",
    "exact source words.",
    "Exact source terms."
};

Console.WriteLine("NOT VERIFIED");
'''
expect = "1 accepted 2 rejected"
solution = '''string passage = "Before. Exact source words. After.";
var proposals = new List<string>
{
    "Exact source words.",
    "exact source words.",
    "Exact source terms."
};

int accepted = proposals.Count(quote => passage.Contains(quote, StringComparison.Ordinal));
Console.WriteLine($"{accepted} accepted {proposals.Count - accepted} rejected");
'''
hint = "Count proposals for which passage.Contains(quote, StringComparison.Ordinal) is true, then subtract from Count."
