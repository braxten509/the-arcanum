[[lessons]]
id = "s09-l03"
teaches = ["language-serialization-io"]
title = "Structured proposals — JSON is shape, not truth"
body = '''

<p>Free-form model prose is difficult to validate. Ask the AI for one small structured document whose schema represents proposals, not proof. A useful proposal identifies a supplied passage and repeats a candidate substring. It does not contain a source URL, confidence-as-truth, or a preformatted citation.</p>
<p>The prompt should state the whole question, enumerate stable passage ids and exact text, prohibit invented wording, cap the number of proposals, and demand JSON only. Keep this instruction identical across question topics. Adding branches such as “if the question contains <em>date</em>, search a timeline” recreates the rigid rules the AI boundary exists to avoid.</p>
<pre><code data-kind="runnable">// Complete runnable example
using System.Text.Json;

const string response = """{"Quotes":[{"PassageId":"p1","Quote":"exact words"}]}""";
ProposalEnvelope? envelope = JsonSerializer.Deserialize&lt;ProposalEnvelope&gt;(response);
Console.WriteLine(envelope?.Quotes.Single().PassageId);

public sealed record Proposal(string PassageId, string Quote);
public sealed record ProposalEnvelope(IReadOnlyList&lt;Proposal&gt; Quotes);</code></pre>
<p>The complete example demonstrates typed deserialization in isolation. Production code still needs response-size limits, required-value checks, proposal-count limits, duplicate handling, cancellation, and provider-envelope translation. Valid JSON proves syntax and shape only. It does not prove that the passage id exists or that the quote occurs in that passage.</p>
<p>System.Text.Json can use records, properties, source generation, or explicit options. Decide whether provider output is case-sensitive and document the choice. Reject trailing commentary unless the provider adapter explicitly and safely extracts its documented structured field; do not scrape the first braces from arbitrary prose.</p>
<p>Test an empty list, missing fields, unknown fields if your policy disallows them, an unknown passage id, excessive proposals, and a quote one character different from the source. Some failures belong to deserialization and some to verification. Preserve that distinction so diagnostics name the broken boundary.</p>
<div class="callout"><p>A structured proposal is still untrusted AI output. Only the common C# verifier can create the value accepted by reporting.</p></div>
<div class="callout csharp-transfer"><p><strong>C#/.NET transfer:</strong> Typed deserialization proves only that JSON could be mapped into a CLR shape. Nullable analysis, <code>required</code> members, and serializer-required properties catch different classes of omission; none proves that a quote occurs in the referenced passage.</p></div>
<div class="field-notes"><div class="fn-head">FIELD NOTES // SCHEMA PRESSURE</div><p>If a field is not needed for deterministic lookup or diagnostics, ask why the model is allowed to supply it. Smaller external shapes reduce the number of claims that can cross the boundary.</p></div>
'''

[[lessons.readings]]
label = "Microsoft Learn — How to deserialize JSON in .NET"
url = "https://learn.microsoft.com/en-us/dotnet/standard/serialization/system-text-json/deserialization"
essential = true

[[lessons.readings]]
label = "Microsoft Learn — Immutable types with System.Text.Json"
url = "https://learn.microsoft.com/en-us/dotnet/standard/serialization/system-text-json/immutability"
essential = false

[[lessons.exercises]]
id = "s09-l03-e1"
type = "mc"
points = 20
prompt = "What does successful JSON deserialization prove about an AI proposal?"
choices = ["It is factually true", "Its syntax and declared shape were readable", "Its citation is authoritative", "Its quote occurs in a source"]
answer = 1
whyWrong = "Truth, attribution, and exact containment require separate deterministic checks."
hint = "A parser understands structure, not evidence."
explain = "Deserialization establishes a typed shape only."

[[lessons.exercises]]
id = "s09-l03-e2"
type = "fill"
points = 20
prompt = "Complete the generic API that reads a proposal envelope from JSON text."
code = "JsonSerializer.____<ProposalEnvelope>(response)"
answer = "Deserialize"
accept = ["deserialize"]
hint = "The operation reverses serialization."

[[lessons.exercises]]
id = "s09-l03-e3"
type = "mc"
points = 20
prompt = "Which field should be absent from the AI proposal schema?"
choices = ["Passage id", "Candidate quote text", "Source URL authored by the model", "A bounded list of proposals"]
answer = 2
whyWrong = "Passage identity and quote text support later verification; source attribution must come from C#-owned passage data."
hint = "The model must not impersonate authority."
explain = "C# restores the source URL after matching the proposal to a passage."

[[lessons.exercises]]
id = "s09-l03-d1"
type = "type"
points = 14
reps = 2
prompt = "Retype the small untrusted proposal shape twice."
code = "public sealed record Proposal(string PassageId, string Quote);"

[[lessons.concepts]]
id = "language-serialization-io"
purpose = "Move typed data across file, JSON, HTTP, process, and terminal boundaries without confusing external text with trusted objects."
anatomy = "Select an I/O API, await or dispose it correctly, serialize or deserialize a declared shape, then validate the resulting values."
example = "The disposable examples in Structured proposals — JSON is shape, not truth isolate this capability before the learner chooses how it belongs in the cumulative project. The lesson Structured proposals — JSON is shape, not truth supplies the disposable observation point."
observable = "Valid input becomes the intended typed data and malformed input produces a specific boundary diagnostic. Confirm it while practicing Structured proposals — JSON is shape, not truth."
failure = "Scraping loosely structured text or overwriting invalid user data destroys the evidence needed to repair it."
practice = "s09-l03-e1"
