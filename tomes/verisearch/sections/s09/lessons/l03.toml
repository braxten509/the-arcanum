[[lessons.exercises]]
id = "s09-l03-e1"
type = "mc"
points = 20
required = true
capabilities = ["language-serialization-io"]
cognitiveTask = "explain"
scaffold = "guided"
contextFamily = "verisearch-s09-structured-proposal-envelope"
aidPolicy = "limited"
prompt = "What does successful JSON deserialization prove about an AI proposal?"
choices = ["It is factually true", "Its quote occurs in a source", "Its citation is authoritative", "Its syntax and declared shape were readable"]
answer = 3
whyWrong = "Truth, attribution, and exact containment require separate deterministic checks."
hint = "A parser understands structure, not evidence."
explain = "Deserialization establishes a typed shape only."

