[[lessons.concepts]]
id = "language-structured-proposal-envelope"
purpose = "Ask the model for one small structured document whose schema expresses proposals rather than proof."
anatomy = "The prompt carries the whole question with enumerated stable passages, caps the number of proposals, and demands JSON; each proposal names a passage id and a candidate substring."
example = "A JSON envelope of proposals deserialized into a declared shape that carries no address, no confidence score, and no verdict."
observable = "A malformed or overfull response is rejected as data before verification runs, and no proposal can carry attribution."
failure = "Accepting a confidence field or a source address from the model lets the report inherit a claim that nothing checked."
practice = "s09-l03-e1"
