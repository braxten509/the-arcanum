[[lessons]]
id = "s09-l02"
teaches = ["ollama-http-api"]
title = "Call Ollama’s Chat API with Built-In HTTP JSON"
body = '''
<p>Verisearch needs no Ollama-specific NuGet client. The API is ordinary HTTP and JSON, so Chapter IV's <code>HttpClient</code> and <code>System.Net.Http.Json</code> helpers keep the dependency surface small.</p>
<pre><code><span class="k">using</span> System.Net.Http.Json;
<span class="k">using</span> System.Text.Json;

<span class="c">// request is an anonymous object with model, messages, stream, format, and options</span>
<span class="k">using</span> HttpResponseMessage response = <span class="k">await</span> http.PostAsJsonAsync(
    <span class="s">$"{config.OllamaUrl.TrimEnd('/')}/api/chat"</span>, request, ct);
response.EnsureSuccessStatusCode();

<span class="k">string</span> outerJson = <span class="k">await</span> response.Content.ReadAsStringAsync(ct);
OllamaChatResponse result = JsonSerializer.Deserialize&lt;OllamaChatResponse&gt;(
    outerJson, <span class="k">new</span> JsonSerializerOptions { PropertyNameCaseInsensitive = <span class="k">true</span> })
    ?? <span class="k">throw new</span> InvalidOperationException(<span class="s">"Ollama returned an empty response"</span>);</code></pre>
<p>The anonymous request object mirrors the documented wire fields: the configured model; a system message plus user prompt; <code>stream = false</code>; the schema in <code>format</code>; and temperature zero in <code>options</code>. The workshop assembles that complete object. Add two response records to <code>Models.cs</code> now:</p>
<pre><code><span class="k">public sealed record</span> OllamaMessage(<span class="k">string</span> Content);
<span class="k">public sealed record</span> OllamaChatResponse(OllamaMessage Message);</code></pre>
<p><code>stream = false</code> asks for one JSON response. Streaming is useful for prose shown token by token, but Verisearch cannot display unverified model text and needs the complete structured payload before checking it. Simpler is safer here.</p>
<p><code>EnsureSuccessStatusCode</code> preserves HTTP failure instead of trying to deserialize an error document as a chat response. At the application boundary, translate connection refusal into a precise instruction: start Ollama, confirm the configured URL, and pull the configured model. Do not catch it and silently run keyword matching.</p>
<div class="callout">Reuse the same long-lived <code>HttpClient</code> configured in Program.cs. The source fetcher and Ollama selector can share it because each request has its own URL, headers, and cancellation token.</div>
<div class="field-notes"><div class="fn-head">MARGINALIA // RESPONSE ENVELOPE</div><p>The assistant text lives in <code>result.Message.Content</code>. That content is itself JSON only because the next lesson requests structured output; the outer chat response and inner quote payload are two serialization boundaries.</p></div>
'''

[[lessons.readings]]
label = "Ollama API — Generate a chat message"
url = "https://docs.ollama.com/api/chat"
essential = false

[[lessons.readings]]
label = "Microsoft Learn — HttpClient JSON extensions"
url = "https://learn.microsoft.com/en-us/dotnet/standard/serialization/system-text-json/httpclient-extensions"
essential = false

[[lessons.exercises]]
id = "s09-l02-e1"
type = "fill"
points = 20
prompt = "Complete the built-in extension that posts an object as JSON."
code = '''using HttpResponseMessage response = await http.____(url, request, ct);'''
answer = "PostAsJsonAsync"
hint = "Its name states the HTTP verb, representation, and asynchronous behavior."

[[lessons.exercises]]
id = "s09-l02-e2"
type = "mc"
points = 20
prompt = "Why does the course set <code>stream = false</code> for quotation selection?"
choices = ["Ollama cannot stream", "The program needs one complete structured payload before any verification and displays no raw model tokens", "HttpClient forbids streams", "It makes the model truthful"]
answer = 1
whyWrong = "Ollama and HttpClient support streaming, and the option does not establish truth. Non-streaming simplifies the verify-before-display boundary."
explain = "The entire inner JSON document is parsed and checked before a user sees a quotation."
hint = "Would partial unverified JSON be useful to render?"

[[lessons.exercises]]
id = "s09-l02-e3"
type = "mc"
points = 20
prompt = "Live mode calls Ollama but the connection is refused. What should Verisearch do?"
choices = ["Silently switch to keyword matching", "Print model-looking fixture output", "Fail clearly with setup guidance and a nonzero exit code", "Return every passage"]
answer = 2
whyWrong = "Each alternative impersonates the AI or changes relevance behavior without permission. Live mode must disclose that its required service is unavailable."
explain = "The explicit --mock mode remains available for learning and deterministic tests."
hint = "Do not let degraded behavior masquerade as the requested mode."

[[lessons.exercises]]
id = "s09-l02-d1"
type = "type"
points = 14
reps = 2
prompt = "Retype the HTTP status and response-envelope boundary twice."
code = '''using HttpResponseMessage response = await http.PostAsJsonAsync(url, request, ct);
response.EnsureSuccessStatusCode();
OllamaChatResponse result = await response.Content
    .ReadFromJsonAsync<OllamaChatResponse>(cancellationToken: ct)
    ?? throw new InvalidOperationException("Ollama returned an empty response");'''
