[[lessons.concepts]]
id = "language-provider-adapter-transport"
purpose = "Translate one provider-neutral request into a concrete transport, and keep the transport details inside that adapter."
anatomy = "A process adapter sets the executable and its arguments as data with redirected streams, while an HTTP adapter owns its endpoint, headers, and key handling."
example = "A process start description built with the executable in its own field and each configured argument added to the argument list instead of a shell line."
observable = "Swapping providers changes one adapter, and no credential appears in source, output, or the committed catalog."
failure = "Building a shell command line from configured text invites injection and makes every argument an escaping problem for the user."
practice = "s09-l02-e1"
