[[lessons]]
id = "s09-l02"
title = "OllamaSharp — chat and streaming from C#"
body = '''

<p><code>dotnet add package OllamaSharp</code>. The client wraps every Ollama endpoint:</p>
<pre><code><span class="k">using</span> OllamaSharp;

<span class="k">var</span> ollama = <span class="k">new</span> OllamaApiClient(<span class="s">"http://localhost:11434"</span>)
{
    SelectedModel = config.OllamaModel     <span class="c">// "llama3" from your YAML</span>
};</code></pre>
<p>Ollama <strong>streams</strong> responses token-by-token (that typewriter effect). OllamaSharp exposes that as an async stream you consume with <code>await foreach</code>:</p>
<pre><code><span class="k">var</span> full = <span class="k">new</span> System.Text.StringBuilder();
<span class="k">await foreach</span> (<span class="k">var</span> chunk <span class="k">in</span> ollama.GenerateAsync(prompt))
{
    Console.Write(chunk?.Response);        <span class="c">// live progress for the user</span>
    full.Append(chunk?.Response);          <span class="c">// accumulate the real payload</span>
}
<span class="k">string</span> answer = full.ToString();</code></pre>
<p><code>await foreach</code> is new syntax for you: it iterates an <code>IAsyncEnumerable&lt;T&gt;</code> — a sequence where each element ARRIVES asynchronously. Same loop body, await built into every step.</p>
<p>Connection hygiene — Ollama might not be running. Probe before depending on it:</p>
<pre><code><span class="k">try</span>
{
    <span class="k">var</span> models = <span class="k">await</span> ollama.ListLocalModelsAsync();
    <span class="k">if</span> (!models.Any(m =&gt; m.Name.StartsWith(config.OllamaModel)))
        Console.WriteLine(<span class="s">$"model {config.OllamaModel} not pulled — falling back"</span>);
}
<span class="k">catch</span> (HttpRequestException)
{
    Console.WriteLine(<span class="s">"Ollama offline — keyword fallback engaged"</span>);
}</code></pre><div class="field-notes"><div class="fn-head">MARGINALIA // THE DEEPER CUT — IN THORNE'S HAND</div>
<p><strong>Generate vs chat:</strong> <code>GenerateAsync</code> is one-shot prompt→completion (perfect for the scanner); <code>ChatAsync</code> maintains a message history with roles. The roles: <code>system</code> (standing orders — "you are a relevance filter"), <code>user</code> (the request), <code>assistant</code> (the model's prior replies).</p>
<p><strong>IAsyncEnumerable</strong> — the type behind <code>await foreach</code> — is just "a sequence where each MoveNext may await". You can write your own with <code>async IAsyncEnumerable&lt;T&gt;</code> + yield return; cancellation flows via <code>[EnumeratorCancellation]</code>. Recognize it; OllamaSharp writes it for you.</p>
<p><strong>Timeouts for LLM calls:</strong> a wedged local model can hang forever — the same CancellationTokenSource discipline from Chapter VIII applies. LLM calls are just slow HTTP.</p></div>'''

