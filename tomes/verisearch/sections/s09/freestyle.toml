[freestyle]
title = "THE WORKING: The Proposal-and-Proof Gate"
requires = ["json-mapping", "http-client", "canonical-models", "page-extractor", "ollama-setup", "ollama-http-api", "structured-quote-schema", "quote-verification", "quote-selector"]
brief = "Add the local AI boundary without replacing any earlier project files.<ul><li>Create <code>OllamaQuoteSelector.cs</code> from the workshop. Use the official <code>/api/chat</code> HTTP endpoint, <code>stream = false</code>, temperature zero, and the exact quote JSON schema; install no Ollama client package.</li><li>Send one source’s stored numbered passages as untrusted data. Ask for at most the configured count of contiguous, case-exact substrings; permit an empty array.</li><li>Deserialize the inner response into <code>QuoteBatch</code>. Invalid HTTP, envelope, or inner JSON must fail clearly; do not scrape numbers or prose from malformed output.</li><li>Create <code>QuoteVerifier.cs</code>. It alone creates <code>VerifiedQuote</code> records after ordinal substring matching and C#-owned attribution.</li><li>Add an explicit <code>--mock</code> fixture selector only for a known local passage. Label its terminal mode MOCK. Live mode with Ollama unavailable must return a clear error and nonzero exit code.</li><li>Test exact, altered, fabricated, unknown-id, duplicate, empty, and over-limit proposal batches before a live call.</li></ul>"
reward = 550
packages = []
xray = "THORNE supplies valid JSON containing one invented quote, one exact quote with a false model-owned URL attempt, a duplicate, and an unknown passage id. Only the exact source substring may emerge, with the URL copied from Passage. He then stops Ollama and checks that live mode fails instead of invoking hidden keyword logic."

[freestyle.badge]
id = "badge-s09"
name = "SPIRIT-BINDER"
desc = "Gave the spirit semantic work while reserving truth and attribution for deterministic C#."

[[freestyle.rubric]]
criterion = "Official HTTP integration"
weight = 20
desc = "Uses HttpClient /api/chat with structured format, non-streaming response, cancellation, status checks, and no wrapper package."

[[freestyle.rubric]]
criterion = "Proposal contract"
weight = 20
desc = "Prompt and schema request bounded passageId plus contiguous exact quote text and allow an honest empty result."

[[freestyle.rubric]]
criterion = "Deterministic proof"
weight = 30
desc = "Only ordinal substrings with valid ids become VerifiedQuote; duplicates, fabrications, empties, and excess results are rejected."

[[freestyle.rubric]]
criterion = "Mode honesty"
weight = 15
desc = "Mock is explicit and labeled; live Ollama failure is actionable and never silently replaced with keyword matching."

[[freestyle.rubric]]
criterion = "C# craft"
weight = 15
desc = "PascalCase types and methods, camelCase locals, four-space indentation, Allman braces, focused selector/verifier files, and no raw model output rendering."
