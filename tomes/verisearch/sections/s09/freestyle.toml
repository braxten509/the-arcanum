[[freestyle.referenceSteps]]
id = "s09-write-ai-selection"
path = "src/Verisearch/AiSelection.cs"
mode = "write"
instruction = "Private replay adds a real configurable CLI AI adapter plus an explicitly labeled test mock."
content = '''
using System.Diagnostics;
using System.Text.Json;

namespace Verisearch;

public sealed class CliAiQuoteSelector(
    string command,
    IReadOnlyList<string> arguments,
    int maximumQuotes) : IAiQuoteSelector
{
    private static readonly JsonSerializerOptions JsonOptions = new()
    {
        PropertyNameCaseInsensitive = true
    };

    public async Task<QuoteBatch> SelectAsync(
        string question,
        IReadOnlyList<Passage> passages,
        CancellationToken cancellationToken)
    {
        if (string.IsNullOrWhiteSpace(command))
        {
            throw new InvalidOperationException("the cli AI provider needs --ai-command");
        }

        string prompt = JsonSerializer.Serialize(new
        {
            task = "Interpret the whole question by meaning and propose supporting quotations.",
            question,
            rules = new[]
            {
                "Return one JSON object and no markdown.",
                "Use the shape {\"quotes\":[{\"passageId\":\"...\",\"quote\":\"...\"}]}",
                "Every quote must be one contiguous, case-exact substring of its passage.",
                $"Return at most {maximumQuotes} proposals; an empty array is honest.",
                "Do not invent URLs, labels, sources, lookup categories, or keyword routing."
            },
            passages = passages.Select(passage => new
            {
                passageId = passage.Id,
                sourceLabel = passage.Source.Label,
                text = passage.Text
            })
        });

        var startInfo = new ProcessStartInfo
        {
            FileName = command,
            RedirectStandardInput = true,
            RedirectStandardOutput = true,
            RedirectStandardError = true,
            UseShellExecute = false,
            CreateNoWindow = true
        };
        foreach (string argument in arguments)
        {
            startInfo.ArgumentList.Add(argument);
        }

        using var process = new Process { StartInfo = startInfo };
        if (!process.Start())
        {
            throw new InvalidOperationException($"AI command did not start: {command}");
        }
        await process.StandardInput.WriteAsync(prompt.AsMemory(), cancellationToken);
        process.StandardInput.Close();
        Task<string> standardOutput = process.StandardOutput.ReadToEndAsync(cancellationToken);
        Task<string> standardError = process.StandardError.ReadToEndAsync(cancellationToken);
        await process.WaitForExitAsync(cancellationToken);
        string output = await standardOutput;
        string error = await standardError;
        if (process.ExitCode != 0)
        {
            throw new InvalidOperationException(
                $"AI command exited {process.ExitCode}: {error.Trim()}");
        }

        AiResponse? response;
        try
        {
            response = JsonSerializer.Deserialize<AiResponse>(output, JsonOptions);
        }
        catch (JsonException exception)
        {
            throw new InvalidOperationException(
                "AI output was not the required quote-proposal JSON object",
                exception);
        }
        if (response?.Quotes is null)
        {
            throw new InvalidOperationException("AI output did not contain a quotes array");
        }
        if (response.Quotes.Count > maximumQuotes)
        {
            throw new InvalidOperationException(
                $"AI returned {response.Quotes.Count} proposals; limit is {maximumQuotes}");
        }
        return new QuoteBatch(response.Quotes);
    }

    private sealed record AiResponse(List<QuoteProposal>? Quotes);
}

public sealed class ExplicitMockAiQuoteSelector : IAiQuoteSelector
{
    public Task<QuoteBatch> SelectAsync(
        string question,
        IReadOnlyList<Passage> passages,
        CancellationToken cancellationToken)
    {
        cancellationToken.ThrowIfCancellationRequested();
        QuoteBatch batch = passages.Count == 0
            ? new QuoteBatch([])
            : new QuoteBatch([new QuoteProposal(passages[0].Id, passages[0].Text)]);
        return Task.FromResult(batch);
    }
}
'''
[[freestyle.referenceSteps]]
id = "s09-write-quote-verifier"
path = "src/Verisearch/QuoteVerifier.cs"
mode = "write"
instruction = "Private replay adds ordinal containment, bounded admission, and source-owned attribution."
content = '''
namespace Verisearch;

public sealed class QuoteVerifier
{
    public VerificationResult Verify(
        IReadOnlyList<Passage> passages,
        QuoteBatch proposals,
        int maximumQuotes)
    {
        var byId = passages.ToDictionary(passage => passage.Id, StringComparer.Ordinal);
        var seen = new HashSet<(string PassageId, string Quote)>();
        var verified = new List<VerifiedQuote>();
        int rejected = 0;

        foreach (QuoteProposal proposal in proposals.Quotes)
        {
            if (verified.Count >= maximumQuotes
                || string.IsNullOrEmpty(proposal.PassageId)
                || string.IsNullOrEmpty(proposal.Quote)
                || !byId.TryGetValue(proposal.PassageId, out Passage? passage)
                || !passage.Text.Contains(proposal.Quote, StringComparison.Ordinal)
                || !seen.Add((proposal.PassageId, proposal.Quote)))
            {
                rejected++;
                continue;
            }

            verified.Add(new VerifiedQuote(
                passage.Id,
                proposal.Quote,
                passage.Source.Label,
                passage.Source.Uri));
        }

        return new VerificationResult(verified, rejected);
    }
}
'''
[[freestyle.referenceSteps]]
id = "s09-rewrite-proof-harness"
path = "src/Verisearch/ProofHarness.cs"
mode = "rewrite"
instruction = "Private replay preserves the early proof and adds a fabricated-quote negative control."
preserves = "all-active"
content = '''
namespace Verisearch;

public static class ProofHarness
{
    public static Task<int> RunAsync(string proofId)
    {
        if (proofId == "s04")
        {
            string prepared = CliOptions.PrepareQuestion("whole   text");
            if (prepared != "whole text")
            {
                return Task.FromResult(1);
            }
            Console.WriteLine("S04_OK question=whole text");
            return Task.FromResult(0);
        }
        if (proofId != "s09")
        {
            Console.Error.WriteLine($"unknown proof id: {proofId}");
            return Task.FromResult(2);
        }
        SourceSpec source = new("Source", new Uri("https://example.test/source"));
        Passage passage = new("p-one", source, "An exact source sentence stays intact.");
        VerificationResult result = new QuoteVerifier().Verify(
            [passage],
            new QuoteBatch([
                new QuoteProposal(passage.Id, "exact source sentence"),
                new QuoteProposal(passage.Id, "fabricated sentence")
            ]),
            3);
        bool passed = result.Quotes is [var quote]
            && result.RejectedCount == 1
            && quote.SourceLabel == source.Label
            && quote.SourceUri == source.Uri;
        if (!passed)
        {
            return Task.FromResult(1);
        }
        Console.WriteLine("S09_OK accepted=1 rejected=1 attribution=source");
        return Task.FromResult(0);
    }
}
'''
