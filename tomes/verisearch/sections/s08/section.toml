codename = "CHAPTER VIII // MANY HANDS"
short = "Many Hands"
title = "Many Hands — Async Programming & Concurrency"
build = "The conjured servants — five far pages gleaned at once, failures bound in circles"
brief = "Gleaning five pages one after another costs the SUM of their journeys; sending five servants at once costs only the LONGEST. This chapter is the deep art of async: what a Task truly is, the fanning-out with <code>Task.WhenAll</code>, the recalling-word <code>CancellationToken</code>, and keeping one slow-or-dead source from poisoning the whole errand. The Working: the tome gleans all its sources at once and accounts for each servant\u2019s time."
