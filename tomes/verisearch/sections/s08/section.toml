id = "s08"
codename = "CHAPTER VIII // MANY HANDS"
short = "Many Hands"
title = "Many Hands — Async Fetching & Containment"
build = "The source batch — chosen pages fetched concurrently, each failure accounted for"
brief = "Fetching pages one after another costs the sum of their journeys; starting them together costs roughly the longest. This chapter makes <code>Task</code>, <code>Task.WhenAll</code>, cancellation, and failure containment concrete in <code>SourceBatch.cs</code>. One failed source remains visible but does not erase sound documents from the same run."
