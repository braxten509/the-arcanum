[[lessons]]
id = "s08-l04"
teaches = ["language-exceptions-resources"]
title = "Contain Source Failures Without Hiding Cancellation"
body = '''
<p><code>Task.WhenAll</code> throws when one child task faults. Verisearch wants the successful source documents even when another host returns 404, so each ordinary fetch failure becomes a <code>FetchOutcome</code>. Cancellation is different: when the user or deadline cancels the whole batch, it must still stop.</p>
<pre><code data-kind="replacement"><span class="k">public sealed record</span> FetchOutcome(SourceSpec Source, SourceDocument? Document,
    <span class="k">string</span>? Error, <span class="k">double</span> Seconds)
{
    <span class="k">public bool</span> Ok =&gt; Document <span class="k">is not null</span>;
}</code></pre>
<p>The wrapper catches ordinary source failures but deliberately rethrows cooperative cancellation. Catch order matters: test the batch token first, use bare <code>throw;</code> to preserve the cancellation, and only then convert another exception into a failed outcome.</p>
<pre><code data-kind="replacement"><span class="k">catch</span> (OperationCanceledException) <span class="k">when</span> (ct.IsCancellationRequested)
{
    <span class="k">throw</span>;
}</code></pre>
<p>The following ordinary <code>catch (Exception ex)</code> returns a null document, the exception message, the same source record, and elapsed seconds. The workshop writes the complete method after this ownership rule is understood.</p>
<p>This broad catch is appropriate only at a named containment boundary where the error is retained. Do not return an empty <code>SourceDocument</code>, because later extraction would mistake failure for a successfully empty page. The nullable <code>Document</code>, <code>Ok</code> property, and <code>Error</code> make the state explicit.</p>
<p>The renderer can later report <code>3/4 sources fetched</code> and list the failed label. It must not expose a stack trace during normal operation, but tests and optional verbose output may preserve exception details.</p>
<div class="callout">A timeout is not merely another dead page when the token guards the whole run. The filter on <code>OperationCanceledException</code> keeps cancellation control flowing upward.</div>
<div class="field-notes"><div class="fn-head">MARGINALIA // DATA INSTEAD OF SILENCE</div><p>Partial success is honest only if failure remains visible. The eventual <code>PipelineResult</code> therefore carries source errors alongside verified quotes; an empty quote list alone cannot distinguish “nothing relevant” from “nothing fetched.”</p></div>
'''

[[lessons.readings]]
label = "Microsoft Learn — Handle exceptions in async methods"
url = "https://learn.microsoft.com/en-us/dotnet/csharp/asynchronous-programming/"
essential = false

[[lessons.exercises]]
id = "s08-l04-e1"
type = "mc"
points = 25
prompt = "Why does <code>FetchOutcome.Document</code> use a nullable type?"
choices = ["Every HTTP response is null", "A failed fetch has no document and must not impersonate an empty successful page", "Records require nullable fields", "It makes WhenAll sequential"]
answer = 1
whyWrong = "HTTP successes produce documents, records do not require nullable fields, and nullability does not control concurrency. It represents the failed state explicitly."
explain = "The Ok property can derive from whether a real document exists, while Error records the reason it does not."
hint = "What value should occupy the document field after a 404?"

[[lessons.exercises]]
id = "s08-l04-e2"
type = "mc"
points = 20
prompt = "Why rethrow <code>OperationCanceledException</code> when the batch token is canceled?"
choices = ["To convert it to a 404", "To let the requested cancellation stop the entire operation", "Because Exception cannot catch it", "To restart every fetch"]
answer = 1
whyWrong = "Cancellation is catchable and is not an HTTP status or retry instruction. Rethrowing preserves the caller's stop request."
explain = "Ordinary per-source failure is containable; batch cancellation is control flow owned by the caller."
hint = "Was the user asking for partial success or asking everything to stop?"

[[lessons.exercises]]
id = "s08-l04-e3"
type = "mc"
points = 20
prompt = "Which class measures elapsed fetch time without relying on wall-clock changes?"
choices = ["DateTime", "System.Diagnostics.Stopwatch", "CancellationToken", "HttpContent"]
answer = 1
whyWrong = "DateTime is wall-clock time, while cancellation and HTTP content do not measure duration. Stopwatch is designed for elapsed timing."
explain = "Stopwatch exposes elapsed duration and TotalSeconds for the outcome."
hint = "Its factory method is StartNew."

[[lessons.exercises]]
id = "s08-l04-d1"
type = "type"
points = 14
reps = 2
prompt = "Retype the cancellation-preserving catch order twice."
code = '''catch (OperationCanceledException) when (ct.IsCancellationRequested)
{
    throw;
}
catch (Exception ex)
{
    return new FetchOutcome(source, null, ex.Message, elapsed);
}'''

[[lessons.exercises]]
id = "s08-l04-w1"
type = "write"
points = 38
prompt = "Run safe tasks for inputs 1, 2, and 3. Input 2 throws; the wrapper returns false. Await all and print the success and failure counts."
starter = '''bool[] outcomes = await Task.WhenAll(Safe(1), Safe(2), Safe(3));
Console.WriteLine("NOT COUNTED");

static async Task<bool> Safe(int number)
{
    await Task.Delay(5);
    return true;
}
'''
expect = "2 ok 1 failed"
solution = '''bool[] outcomes = await Task.WhenAll(Safe(1), Safe(2), Safe(3));
Console.WriteLine($"{outcomes.Count(ok => ok)} ok {outcomes.Count(ok => !ok)} failed");

static async Task<bool> Safe(int number)
{
    try
    {
        await Task.Delay(5);
        if (number == 2)
        {
            throw new Exception("dead");
        }
        return true;
    }
    catch
    {
        return false;
    }
}
'''
hint = "Throw for number 2 inside try; catch and return false; Count true and false outcomes."

[[lessons.concepts]]
id = "language-exceptions-resources"
purpose = "Preserve useful failures while releasing files, HTTP responses, processes, and cancellation resources deterministically."
anatomy = "Catch only at the boundary that can add meaning, let cancellation propagate, and use using or disposal for owned resources."
example = "The disposable examples in Contain Source Failures Without Hiding Cancellation isolate this capability before the learner chooses how it belongs in the cumulative project. The lesson Contain Source Failures Without Hiding Cancellation supplies the disposable observation point."
observable = "Ordinary failures become actionable outcomes, cancellation stays cancellation, and owned resources close on every path. Confirm it while practicing Contain Source Failures Without Hiding Cancellation."
failure = "A broad silent catch or forgotten disposal converts evidence into hidden failure and leaks operating-system resources."
practice = "s08-l04-e1"

[[lessons.artifactSteps]]
id = "s08-l04-author-artifact"
path = "src/Verisearch/SourceBatch.cs"
mode = "author"
instruction = "Use the C# ideas from Contain Source Failures Without Hiding Cancellation to author or revise this learner-owned path toward the chapter behavior: Read independent sources concurrently while preserving successful evidence, failed-source diagnostics, and cancellation. Choose your own type names, method boundaries, and file organization; the lesson examples are disposable and are not a production template."
checks = ["Two delayed reads overlap, one ordinary failure remains visible beside a success, and cancellation propagates separately.", "The complete solution builds from saved source, and a deliberately changed load-bearing input makes the relevant check fail before repair."]
