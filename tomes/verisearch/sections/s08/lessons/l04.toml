[[lessons.exercises]]
id = "s08-l04-w1"
type = "write"
points = 38
required = true
capabilities = ["language-exceptions-resources"]
cognitiveTask = "build"
scaffold = "independent"
contextFamily = "verisearch-s08-failure-containment-boundary"
aidPolicy = "limited"
prompt = "Run safe tasks for inputs 1, 2, and 3. Input 2 throws; the wrapper returns false. Await all and print the success and failure counts."
starter = '''bool[] outcomes = await Task.WhenAll(Safe(1), Safe(2), Safe(3));
Console.WriteLine("NOT COUNTED");

static async Task<bool> Safe(int number)
{
    await Task.Delay(5);
    return true;
}
'''
expect = "2 ok 1 failed"
solution = '''bool[] outcomes = await Task.WhenAll(Safe(1), Safe(2), Safe(3));
Console.WriteLine($"{outcomes.Count(ok => ok)} ok {outcomes.Count(ok => !ok)} failed");

static async Task<bool> Safe(int number)
{
    try
    {
        await Task.Delay(5);
        if (number == 2)
        {
            throw new Exception("dead");
        }
        return true;
    }
    catch
    {
        return false;
    }
}
'''
hint = "Throw for number 2 inside try; catch and return false; Count true and false outcomes."

[[lessons.concepts]]
id = "language-failure-containment-boundary"
purpose = "Keep the sources that succeeded when one source fails, without ever disguising a cancellation as a failed source."
anatomy = "Each read is wrapped so an ordinary failure becomes a recorded outcome, while a cancellation matching the batch token is rethrown untouched."
example = "A fetch outcome record carrying either a document or an error, produced by a wrapper whose catch filter tests the batch token before anything else."
observable = "One dead host yields a diagnostic beside the healthy documents, and a cancelled batch reports cancellation rather than a list of errors."
failure = "Catching every exception in the wrapper turns a deliberate stop into several source errors and loses the reason the run ended."
practice = "s08-l04-e1"
