[[lessons.exercises]]
id = "s08-l05-w1"
type = "write"
points = 38
required = true
capabilities = ["language-collections-generics"]
cognitiveTask = "build"
scaffold = "independent"
contextFamily = "verisearch-s08-concurrent-batch-assembly"
aidPolicy = "limited"
prompt = "Start three delayed methods together, await them with <code>Task.WhenAll</code>, and print their integer results in input order."
starter = '''Task<int> first = Work(30, 1);
Task<int> second = Work(5, 2);
Task<int> third = Work(15, 3);

Console.WriteLine("NOT AWAITED");

static async Task<int> Work(int milliseconds, int value)
{
    await Task.Delay(milliseconds);
    return value;
}
'''
expect = "1 2 3"
solution = '''Task<int> first = Work(30, 1);
Task<int> second = Work(5, 2);
Task<int> third = Work(15, 3);

int[] values = await Task.WhenAll(first, second, third);
Console.WriteLine(string.Join(" ", values));

static async Task<int> Work(int milliseconds, int value)
{
    await Task.Delay(milliseconds);
    return value;
}
'''
hint = "Task.WhenAll returns results in the same order as its input tasks."

[[lessons.concepts]]
id = "language-concurrent-batch-assembly"
purpose = "Coordinate independent source reads as one operation with observable overlap, partial failure, and cancellation."
anatomy = "The batch starts every read before awaiting, preserves source order in its results, records each failure as data, and lets cancellation pass through."
example = "Reads projected and materialized, then awaited together, with each of the three behaviors given its own controlled test."
observable = "Timed tests show overlap, a one-success-one-failure run keeps both outcomes, and a cancelled run is distinguishable from a failed one."
failure = "A batch that reports only successes hides which source went dark, so the seeker cannot tell a partial answer from a complete one."
practice = "s08-l05-e1"
