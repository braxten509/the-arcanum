[[lessons.exercises]]
id = "s08-l05-e1"
type = "mc"
points = 20
required = true
capabilities = ["language-collections-generics"]
cognitiveTask = "explain"
scaffold = "guided"
contextFamily = "verisearch-s08-concurrent-batch-assembly"
aidPolicy = "limited"
prompt = "Why is the LINQ task sequence immediately materialized with <code>ToList</code>?"
choices = ["Tasks cannot live in IEnumerable", "It sorts by duration", "It catches every exception", "It starts and stores every per-source task before the single await"]
answer = 3
whyWrong = "Tasks can be enumerable, and ToList neither catches nor sorts. Materialization enumerates Select now so all calls begin before WhenAll is awaited."
explain = "Start-all then await-all is the concurrency pattern this boundary preserves."
hint = "Recall deferred execution from Chapter VII."

