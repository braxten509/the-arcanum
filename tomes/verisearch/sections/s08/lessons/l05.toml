[[lessons]]
id = "s08-l05"
teaches = ["language-collections-generics"]
title = "Workshop — Assemble SourceBatch"
body = '''

<p>This Working asks you to coordinate independent source reads without prescribing a batch class. The behavior has three dimensions: overlap, partial failure, and cancellation. Tests should distinguish all three.</p>
<p>Create the operations before awaiting their combined completion. If you place <code>await</code> directly inside a loop, each source may wait for the previous one and total time grows toward the sum. A sequence of already-started tasks followed by <code>Task.WhenAll</code> permits overlap:</p>
<pre><code data-kind="replacement">var tasks = sources.Select(source =&gt; ReadOutcomeAsync(source, cancellationToken)).ToList();
var outcomes = await Task.WhenAll(tasks);</code></pre>
<p>The fragment shows coordination shape, not the implementation of <code>ReadOutcomeAsync</code>. Decide whether each task catches ordinary read failures into an outcome record or whether a separate wrapper does so. Preserve each source identity and diagnostic. Do not let one failed page erase successful documents.</p>
<p>Cancellation is not an ordinary source error. If the caller's token requested cancellation, allow <code>OperationCanceledException</code> to propagate to the top boundary. A timeout that you intentionally translate should still retain a distinct diagnostic. Avoid a broad catch that converts cancellation into “source failed,” because the application would continue expensive work after the user asked it to stop.</p>
<p>Test concurrency with controlled delays and a stopwatch or synchronization gates. Test partial failure with one reader that returns and another that throws. Test cancellation with a token you cancel while work is pending. Assertions should cover results and call timing, not console messages prepared by the test itself.</p>
<p>Preserve input order unless your output contract documents completion order. <code>Task.WhenAll</code> returns results aligned with its task sequence even if completion order differs. Materialization makes the set of work stable before it starts.</p>
<div class="callout"><p>No fallback selector belongs here. This boundary reads only the sources already chosen by the user; semantic quote selection remains the later AI's job.</p></div>
<div class="callout csharp-transfer"><p><strong>C#/.NET transfer:</strong> A LINQ <code>Select</code> that invokes an async method yields <code>IEnumerable&lt;Task&lt;T&gt;&gt;</code>, not <code>Task&lt;IEnumerable&lt;T&gt;&gt;</code>. Materialize the task sequence once, then await <code>Task.WhenAll</code>; that type shape makes the coordination decision explicit.</p></div>
<div class="field-notes"><div class="fn-head">FIELD NOTES // THREE STOPWATCHES</div><p>One delayed read proves nothing. Compare a sequential baseline, the concurrent implementation, and a cancelled run so the timing claim has a meaningful control.</p></div>
'''

[[lessons.readings]]
label = "Microsoft Learn — Start multiple asynchronous tasks"
url = "https://learn.microsoft.com/en-us/dotnet/csharp/asynchronous-programming/start-multiple-async-tasks-and-process-them-as-they-complete"
essential = false

[[lessons.exercises]]
id = "s08-l05-e1"
type = "mc"
points = 20
prompt = "Why is the LINQ task sequence immediately materialized with <code>ToList</code>?"
choices = ["Tasks cannot live in IEnumerable", "It starts and stores every per-source task before the single await", "It catches every exception", "It sorts by duration"]
answer = 1
whyWrong = "Tasks can be enumerable, and ToList neither catches nor sorts. Materialization enumerates Select now so all calls begin before WhenAll is awaited."
explain = "Start-all then await-all is the concurrency pattern this boundary preserves."
hint = "Recall deferred execution from Chapter VII."

[[lessons.exercises]]
id = "s08-l05-d1"
type = "type"
points = 14
reps = 2
prompt = "Retype the fan-out and join twice."
code = '''List<Task<FetchOutcome>> tasks = sources
    .Select(source => FetchOneAsync(source, ct))
    .ToList();
FetchOutcome[] outcomes = await Task.WhenAll(tasks);'''

[[lessons.exercises]]
id = "s08-l05-e2"
type = "fill"
points = 18
prompt = "Complete the cancellation filter that distinguishes requested cancellation from an ordinary source failure."
code = '''catch (OperationCanceledException) when (ct.____)'''
answer = "IsCancellationRequested"
hint = "Read the Boolean state on the token."

[[lessons.exercises]]
id = "s08-l05-e3"
type = "mc"
points = 18
prompt = "Where should the temporary per-source status report be written?"
choices = ["Inside FetchOneAsync", "Inside the FetchOutcome constructor", "In Program.cs, using returned outcomes", "Inside SourceFetcher"]
answer = 2
whyWrong = "Fetching, outcomes, and batching own data and control flow, not UI wording. Program.cs may temporarily inspect returned data."
explain = "Keeping terminal output at the application edge makes SourceBatch reusable and testable."
hint = "Which layer already talks to the terminal?"

[[lessons.exercises]]
id = "s08-l05-w1"
type = "write"
points = 38
prompt = "Start three delayed methods together, await them with <code>Task.WhenAll</code>, and print their integer results in input order."
starter = '''Task<int> first = Work(30, 1);
Task<int> second = Work(5, 2);
Task<int> third = Work(15, 3);

Console.WriteLine("NOT AWAITED");

static async Task<int> Work(int milliseconds, int value)
{
    await Task.Delay(milliseconds);
    return value;
}
'''
expect = "1 2 3"
solution = '''Task<int> first = Work(30, 1);
Task<int> second = Work(5, 2);
Task<int> third = Work(15, 3);

int[] values = await Task.WhenAll(first, second, third);
Console.WriteLine(string.Join(" ", values));

static async Task<int> Work(int milliseconds, int value)
{
    await Task.Delay(milliseconds);
    return value;
}
'''
hint = "Task.WhenAll returns results in the same order as its input tasks."

[[lessons.concepts]]
id = "language-collections-generics"
purpose = "Store ordered and keyed values with type-safe collection contracts."
anatomy = "Choose List<T>, an array, or Dictionary<TKey,TValue>, supply its type arguments, add values, then retrieve them through a safe operation."
example = "The disposable examples in Workshop — Assemble SourceBatch isolate this capability before the learner chooses how it belongs in the cumulative project. The lesson Workshop — Assemble SourceBatch supplies the disposable observation point."
observable = "The collection preserves the promised order or key relationship and rejects the wrong element type at compile time. Confirm it while practicing Workshop — Assemble SourceBatch."
failure = "A bare missing-key index or accidental multiple enumeration can turn ordinary input into a crash or inconsistent result."
practice = "s08-l05-e1"

[[lessons.artifactSteps]]
id = "s08-l05-author-artifact"
path = "src/Verisearch/SourceBatch.cs"
mode = "author"
instruction = "Use the C# ideas from Workshop — Assemble SourceBatch to author or revise this learner-owned path toward the chapter behavior: Read independent sources concurrently while preserving successful evidence, failed-source diagnostics, and cancellation. Choose your own type names, method boundaries, and file organization; the lesson examples are disposable and are not a production template."
checks = ["Two delayed reads overlap, one ordinary failure remains visible beside a success, and cancellation propagates separately.", "The complete solution builds from saved source, and a deliberately changed load-bearing input makes the relevant check fail before repair."]
