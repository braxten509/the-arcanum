[[lessons]]
id = "s08-l02"
teaches = ["task-when-all"]
title = "Task.WhenAll — Start Together, Await Together"
body = '''
<p>The concurrency pattern has two distinct moments: start every operation, then await the group. Chapter VII's deferred-execution lesson matters here because a lazy <code>Select</code> does not call its lambda until it is enumerated.</p>
<pre><code>List&lt;Task&lt;FetchOutcome&gt;&gt; tasks = sources
    .Select(source =&gt; FetchOneAsync(source, ct))
    .ToList();                         <span class="c">// enumerate now; calls start now</span>

FetchOutcome[] outcomes = <span class="k">await</span> Task.WhenAll(tasks);</code></pre>
<p>Do not put <code>await</code> inside the loop that starts each fetch:</p>
<pre><code><span class="k">foreach</span> (SourceSpec source <span class="k">in</span> sources)
{
    FetchOutcome outcome = <span class="k">await</span> FetchOneAsync(source, ct);
    results.Add(outcome);              <span class="c">// next fetch starts only after this one ends</span>
}</code></pre>
<p>The second version is asynchronous but sequential. If four sources each take about one second, it takes about four seconds; start-all/await-all takes about the slowest one. <code>Task.WhenAll</code> returns results in input-task order, not completion order, so stable source order remains available even when the third source finishes first.</p>
<ul><li><code>ToList</code> materializes the calls and stores their task handles.</li><li><code>WhenAll</code> gives one task representing the entire set.</li><li>Awaiting that group does not create extra threads for HTTP waits.</li><li>Do not write several tasks into one shared result list; have each task return one outcome.</li></ul>
<p>Concurrency does not remove fetch etiquette. A small list of user-chosen sources is a reasonable batch. If the product later accepts large lists, add an explicit concurrency limit with <code>SemaphoreSlim</code>; do not hide an unbounded fan-out inside this first implementation.</p>
<div class="callout">Materializing starts the async methods because calling an async method begins its work up to the first incomplete await. <code>WhenAll</code> then waits; it is not the starting pistol.</div>
<div class="field-notes"><div class="fn-head">MARGINALIA // ORDER IS NOT TIMING</div><p>Result order follows task input order. If the UI ever needs completion order, that is a different design using <code>Task.WhenAny</code> in a loop. Verisearch does not need that complexity; one final batch report is clearer.</p></div>
'''

[[lessons.readings]]
label = "Microsoft Learn — Task.WhenAll"
url = "https://learn.microsoft.com/en-us/dotnet/api/system.threading.tasks.task.whenall"
essential = false

[[lessons.exercises]]
id = "s08-l02-e1"
type = "mc"
points = 25
prompt = "Five requests take 1.2, 0.9, 1.5, 0.7, and 1.1 seconds. Ignoring small overhead, a concurrent WhenAll batch takes about…"
choices = ["5.4 seconds", "1.08 seconds", "0.7 seconds", "1.5 seconds"]
answer = 3
whyWrong = "The requests overlap, so elapsed time is approximately the slowest request rather than the sum, average, or fastest request."
explain = "All work begins before the one group await; completion therefore waits for the 1.5-second member."
hint = "Concurrent cost is approximately the maximum duration."

[[lessons.exercises]]
id = "s08-l02-e2"
type = "mc"
points = 25
prompt = "Why is <code>await FetchOneAsync</code> inside a foreach not a concurrent batch?"
choices = ["The loop waits for each fetch before starting the next", "foreach cannot contain await", "List.Add blocks HTTP", "CancellationToken forbids it"]
answer = 0
whyWrong = "Await is legal in a loop, List.Add is not the network wait, and cancellation permits either shape. The location of await serializes starting."
explain = "Collect task handles first, then await the group once."
hint = "Ask when the second fetch call occurs."

[[lessons.exercises]]
id = "s08-l02-e3"
type = "fill"
points = 25
prompt = "Complete the method that joins all already-started tasks."
code = '''FetchOutcome[] outcomes = await Task.____(tasks);'''
answer = "WhenAll"
accept = ["whenall"]
hint = "Its name contrasts with WhenAny."

[[lessons.exercises]]
id = "s08-l02-d1"
type = "type"
points = 14
reps = 2
prompt = "Retype the fan-out and join twice."
code = '''List<Task<FetchOutcome>> tasks = sources
    .Select(source => FetchOneAsync(source, ct))
    .ToList();
FetchOutcome[] outcomes = await Task.WhenAll(tasks);'''

[[lessons.exercises]]
id = "s08-l02-w1"
type = "write"
points = 36
prompt = "Write async methods A, B, and C that delay briefly then return alpha, beta, and gamma. Start all three in one WhenAll call and print the results space-joined."
starter = '''Console.WriteLine("NOT STARTED");

static async Task<string> A() { await Task.Delay(30); return "alpha"; }
static async Task<string> B() { await Task.Delay(5); return "beta"; }
static async Task<string> C() { await Task.Delay(15); return "gamma"; }
'''
expect = "alpha beta gamma"
solution = '''string[] results = await Task.WhenAll(A(), B(), C());
Console.WriteLine(string.Join(" ", results));

static async Task<string> A() { await Task.Delay(30); return "alpha"; }
static async Task<string> B() { await Task.Delay(5); return "beta"; }
static async Task<string> C() { await Task.Delay(15); return "gamma"; }
'''
hint = "Task.WhenAll(A(), B(), C()) returns a string array in that input order."
