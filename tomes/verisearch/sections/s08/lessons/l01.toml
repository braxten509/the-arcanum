[[lessons.exercises]]
id = "s08-l01-e1"
type = "mc"
points = 25
prompt = "While a program awaits an HTTP response, the thread that started the request is…"
choices = ["free — no thread is consumed waiting on I/O; the method resumes on completion", "blocked, spinning until bytes arrive", "destroyed and recreated", "converted to a background thread"]
answer = 0
whyWrong = "Awaiting I/O doesn’t block, destroy, or background the thread — it’s released to do other work and the method resumes when the response arrives."
hint = "This is THE difference between async waiting and blocking."

[[lessons.exercises]]
id = "s08-l01-e2"
type = "mc"
points = 25
prompt = "In this code, when does the download START?"
code = '''
var t = http.GetStringAsync(url);   // line 1
DoSomethingElse();                   // line 2
string html = await t;               // line 3'''
choices = ["Line 3 — await starts it", "Line 1 — calling the method starts the work", "Only when the result is used", "Line 2"]
answer = 1
whyWrong = "The download starts when the async method is CALLED, not at the await — await just suspends until the already-running work completes."
hint = "await doesn't start work; it waits for work already in flight."

[[lessons.exercises]]
id = "s08-l01-e3"
type = "mc"
points = 20
prompt = "The async equivalent of Thread.Sleep(1000) is…"
choices = ["Task.Wait(1000)", "Thread.SleepAsync(1000)", "await Task.Delay(1000)", "await 1000"]
answer = 2
whyWrong = "Task.Wait blocks and ‘Thread.SleepAsync’/‘await 1000’ aren’t real — the async, non-blocking pause is await Task.Delay(1000)."
hint = "Delay yields the thread; Sleep hogs it."

[[lessons.exercises]]
id = "s08-l01-d1"
type = "type"
points = 14
reps = 2
prompt = "Start-then-await — the two-line trick all concurrency hangs on. Twice."
code = '''
Task<string> download = http.GetStringAsync(url);
DoOtherWorkWhileItFlies();
string html = await download;'''

[[lessons.exercises]]
id = "s08-l01-w1"
type = "write"
points = 36
prompt = "Prove concurrency with a stopwatch: start TWO <code>Task.Delay(100)</code> tasks (store both, no await yet), then await both. If <code>System.Diagnostics.Stopwatch</code> shows under 180ms total, print <code>parallel confirmed</code>, else <code>sequential detected</code>."
expect = "parallel confirmed"
solution = '''
var stopwatch = System.Diagnostics.Stopwatch.StartNew();
Task first = Task.Delay(100);
Task second = Task.Delay(100);
await Task.WhenAll(first, second);
stopwatch.Stop();
Console.WriteLine(stopwatch.ElapsedMilliseconds < 180 ? "parallel confirmed" : "sequential detected");
'''
hint = "var sw = Stopwatch.StartNew(); var t1 = Task.Delay(100); var t2 = Task.Delay(100); await t1; await t2; check sw.ElapsedMilliseconds."

[[lessons.concepts]]
id = "language-async-cancellation"
purpose = "Coordinate I/O-bound work without blocking threads, serializing independent work, or swallowing cancellation."
anatomy = "Return Task or Task<T>, await asynchronous operations, pass one CancellationToken, and use Task.WhenAll when independent work may overlap."
example = "The disposable examples in Tasks under the hood — what await actually does isolate this capability before the learner chooses how it belongs in the cumulative project. The lesson Tasks under the hood — what await actually does supplies the disposable observation point."
observable = "Independent reads overlap, completion resumes with typed results, and cancellation reaches the top boundary. Confirm it while practicing Tasks under the hood — what await actually does."
failure = "Using Result, Wait, await-inside-loop, or catching cancellation as an ordinary error breaks responsiveness."
practice = "s08-l01-e1"

