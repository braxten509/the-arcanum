[[lessons]]
id = "s08-l01"
teaches = ["language-async-cancellation"]
title = "Tasks under the hood — what await actually does"
body = '''

<p>A <code>Task</code> is a promise-shaped object: "work is in flight; here's a handle to its eventual result (or its exception)." Crucial mental model — <strong>I/O-bound tasks don't use a thread while waiting</strong>. When you await an HTTP response, no thread sits blocked; the OS notifies .NET when bytes arrive and your method <em>resumes</em>.</p>
<pre><code data-kind="replacement">Task&lt;<span class="k">string</span>&gt; download = http.GetStringAsync(url);   <span class="c">// work STARTS here</span>
Console.WriteLine(<span class="s">"request in flight..."</span>);          <span class="c">// runs immediately — not blocked!</span>
<span class="k">string</span> html = <span class="k">await</span> download;                       <span class="c">// suspend HERE until done</span></code></pre>
<p>That gap between starting and awaiting is the whole trick of concurrency: <strong>start several, then await them</strong>.</p>
<p>A Task can be in flight, completed with a value, <em>faulted</em> (holds an exception), or <em>canceled</em>. Awaiting a faulted task re-throws its exception at the await site — errors flow naturally into your try/catch.</p>
<p>States you can inspect (rarely needed, good to know): <code>IsCompleted</code>, <code>IsFaulted</code>, <code>IsCanceled</code>, <code>Status</code>.</p>
<p>One more member of the family: <code>Task.Delay(ms)</code> — the async sleep. Never <code>Thread.Sleep</code> in async code; it blocks the thread instead of yielding it.</p>
<div class="callout">CPU-bound work (heavy math, parsing megabytes) is different: that needs a thread, and <code>Task.Run(() =&gt; ...)</code> moves it to the thread pool. Verisearch is almost entirely I/O-bound — network waits — so async/await without Task.Run is the right shape.</div>
<div class="callout csharp-transfer"><p><strong>C#/.NET transfer:</strong> Calling an async C# method begins executing it synchronously until it reaches an incomplete await. Exceptions raised after asynchronous execution begins are captured by the returned Task and rethrown when awaited, which is why forgetting an await can lose both ordering and failure observation.</p></div>
<div class="field-notes"><div class="fn-head">MARGINALIA // THE DEEPER CUT — IN THORNE'S HAND</div>
<p><strong>The thread pool</strong> is a set of pre-warmed worker threads .NET manages for you. <code>Task.Run(work)</code> queues CPU work onto it; async I/O uses NO thread while waiting (the OS signals completion). Rule: I/O → async/await; heavy CPU → Task.Run; never Task.Run around something already async.</p>
<p><strong>Console apps have no SynchronizationContext</strong> — continuations resume on any pool thread. This is why you may see <code>ConfigureAwait(false)</code> in library code: it's an opt-out of context capture that matters in UI apps; in your console tool it's a no-op you can ignore.</p>
<p><strong>AggregateException</strong> is what <code>.Wait()</code>/<code>.Result</code> wrap failures in — awaiting unwraps to the real exception. One more reason the blocking calls are banned.</p></div>
'''

