[[lessons]]
id = "s08-l03"
title = "CancellationToken — pulling the plug politely"
body = '''

<p>Async work you can't cancel is a hostage situation. .NET's cooperative cancellation has three pieces:</p>
<pre><code><span class="c">// 1. The SOURCE — the hand on the plug</span>
<span class="k">using var</span> cts = <span class="k">new</span> CancellationTokenSource();
cts.CancelAfter(TimeSpan.FromSeconds(10));      <span class="c">// auto-cancel: a batch-wide timeout</span>

<span class="c">// 2. The TOKEN — passed down through every async call</span>
CancellationToken token = cts.Token;

<span class="c">// 3. Honoring it — pass to every API that accepts one</span>
<span class="k">string</span> html = <span class="k">await</span> http.GetStringAsync(url, token);
<span class="k">await</span> Task.Delay(1000, token);</code></pre>
<p>When the token fires, in-flight operations throw <code>OperationCanceledException</code> (HttpClient sometimes surfaces <code>TaskCanceledException</code>, its subclass). Catch it and treat as "canceled", not "crashed":</p>
<pre><code><span class="k">try</span>
{
    <span class="k">var</span> html = <span class="k">await</span> http.GetStringAsync(url, token);
}
<span class="k">catch</span> (OperationCanceledException)
{
    Console.WriteLine(<span class="s">$"[timeout/canceled] {url}"</span>);
}</code></pre>
<p>It's <em>cooperative</em>: cancellation only works where code checks the token. Your own loops can honor it too — <code>token.ThrowIfCancellationRequested()</code>.</p>
<p>Layered timeouts for Verisearch: HttpClient.Timeout guards each request; a CancellationTokenSource with CancelAfter guards the whole batch ("no search takes more than 15s, period"); Ctrl+C can hook a token so a user abort cancels cleanly.</p>
<div class="callout">Convention: CancellationToken is the LAST parameter of every async method you write: <code>ScrapeAsync(string url, CancellationToken ct = default)</code>. Adopting it now saves refactoring every signature later.</div><div class="field-notes"><div class="fn-head">MARGINALIA // THE DEEPER CUT — IN THORNE'S HAND</div>
<p><strong>Linked tokens</strong> — combine "user hit Ctrl+C" with "30s deadline": <code>CancellationTokenSource.CreateLinkedTokenSource(userToken, deadlineToken)</code> — the linked token fires when EITHER does. The orchestrator makes one; every component just accepts a token and doesn't care why it fires.</p>
<p><strong>Hooking Ctrl+C in a console app:</strong> <code>Console.CancelKeyPress += (s, e) =&gt; { e.Cancel = true; cts.Cancel(); };</code> — e.Cancel=true stops the process from dying instantly so your cleanup and "canceled by operator" message can run.</p>
<p><strong>Checking in your own loops:</strong> <code>ct.ThrowIfCancellationRequested()</code> at the top of each iteration, or <code>ct.IsCancellationRequested</code> for a graceful wind-down without an exception.</p></div>'''

[[lessons.readings]]
label = "Microsoft Learn — \"Cancellation in managed threads\""
url = "https://learn.microsoft.com/en-us/dotnet/standard/threading/cancellation-in-managed-threads"
essential = false

[[lessons.exercises]]
id = "s08-l03-e1"
type = "mc"
points = 20
prompt = "Which object actually TRIGGERS cancellation?"
choices = ["CancellationToken", "CancellationTokenSource", "TaskCanceledException", "Task.Cancel()"]
answer = 1
whyWrong = "The token only OBSERVES cancellation and the exception/‘Task.Cancel’ aren’t the trigger — CancellationTokenSource.Cancel() fires it."
hint = "The token is read-only; the ____ has .Cancel()."

[[lessons.exercises]]
id = "s08-l03-e2"
type = "fill"
points = 25
prompt = "Fill the blank to auto-cancel the whole batch after 15 seconds."
code = '''
var cts = new CancellationTokenSource();
cts.____(TimeSpan.FromSeconds(15));'''
answer = "CancelAfter"
accept = ["cancelafter"]
hint = "One method call, no timer boilerplate."

[[lessons.exercises]]
id = "s08-l03-e3"
type = "mc"
points = 20
prompt = "A canceled operation surfaces as…"
choices = ["a null return value", "a bool return of false", "an OperationCanceledException at the await", "silent completion with partial data"]
answer = 2
whyWrong = "Cancellation isn’t a null/false return or a silent finish — it surfaces as an OperationCanceledException thrown at the await."
hint = "Cancellation travels the same rails as errors."

[[lessons.exercises]]
id = "s08-l03-d1"
type = "type"
points = 14
reps = 2
prompt = "Deadline + pass-down + catch — the full cancellation shape. Twice."
code = '''
using var cts = new CancellationTokenSource();
cts.CancelAfter(TimeSpan.FromSeconds(15));
try
{
    string html = await http.GetStringAsync(url, cts.Token);
}
catch (OperationCanceledException)
{
    Console.WriteLine("timed out");
}'''

[[lessons.exercises]]
id = "s08-l03-w1"
type = "write"
points = 36
prompt = "Set a 50ms deadline with CancelAfter, then await <code>Task.Delay(5000, cts.Token)</code> inside try/catch. When the cancellation lands, print <code>timed out cleanly</code>."
expect = "timed out cleanly"
solution = '''
using var cts = new CancellationTokenSource();
cts.CancelAfter(50);
try
{
    await Task.Delay(5000, cts.Token);
}
catch (OperationCanceledException)
{
    Console.WriteLine("timed out cleanly");
}
'''
hint = "catch (TaskCanceledException) — or its base OperationCanceledException. Either works."
