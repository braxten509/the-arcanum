[freestyle]
title = "THE WORKING: The Source Batch"
requires = ["source-fetcher", "source-policy", "task-lifecycle", "task-when-all", "cancellation-token", "failure-containment", "source-batch"]
brief = "Create <code>SourceBatch.cs</code> and fetch the sources admitted by Chapter VII.<ul><li>Use the workshop’s <code>FetchOutcome</code> record and inject the existing <code>SourceFetcher</code>.</li><li>Start one <code>FetchOneAsync</code> task per source with a materialized LINQ <code>Select</code>, then await one <code>Task.WhenAll</code>. Do not await inside the batch loop.</li><li>Pass one <code>CancellationToken</code> through every fetch. Preserve whole-batch cancellation while converting ordinary source exceptions into visible outcomes.</li><li>Print a temporary fixture report showing label, OK/FAIL, seconds, and error. Keep returned data independent of terminal rendering.</li><li>Demonstrate two successful mock sources, one controlled failure, and a canceled batch.</li><li>Run <code>dotnet build</code>; remove temporary report code from <code>SourceBatch</code> itself.</li></ul>"
reward = 500
packages = []
xray = "THORNE times three delayed fixtures, injects one source exception, then cancels the token. Sequential fetches, swallowed cancellation, lost error text, or Console output inside SourceBatch all break the binding."

[freestyle.badge]
id = "badge-s08"
name = "MASTER OF MANY HANDS"
desc = "Fetched chosen pages together while accounting for every failed errand."

[[freestyle.rubric]]
criterion = "True concurrency"
weight = 25
desc = "All per-source tasks start before one Task.WhenAll; no await-inside-loop serializes them."

[[freestyle.rubric]]
criterion = "Outcome boundary"
weight = 20
desc = "FetchOutcome distinguishes a real SourceDocument from an error and retains source identity and timing."

[[freestyle.rubric]]
criterion = "Cancellation"
weight = 20
desc = "The same token reaches SourceFetcher and requested batch cancellation propagates upward."

[[freestyle.rubric]]
criterion = "Partial failure"
weight = 20
desc = "One ordinary source failure remains visible without discarding successful documents or throwing the whole batch."

[[freestyle.rubric]]
criterion = "C# craft"
weight = 15
desc = "PascalCase types and methods, camelCase locals, four-space indentation, Allman braces, and no UI concerns in SourceBatch."
