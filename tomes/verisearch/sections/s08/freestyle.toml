[[freestyle.referenceSteps]]
id = "s08-write-source-batch"
path = "src/Verisearch/SourceBatch.cs"
mode = "write"
instruction = "Private replay coordinates independent reads, partial failure, and cancellation."
content = '''
using System.Diagnostics;

namespace Verisearch;

public sealed class SourceBatch(ISourceReader reader)
{
    public async Task<IReadOnlyList<SourceReadOutcome>> ReadAsync(
        IReadOnlyList<SourceSpec> sources,
        CancellationToken cancellationToken)
    {
        Task<SourceReadOutcome>[] tasks = sources
            .Select(source => ReadOneAsync(source, cancellationToken))
            .ToArray();
        return await Task.WhenAll(tasks);
    }

    private async Task<SourceReadOutcome> ReadOneAsync(
        SourceSpec source,
        CancellationToken cancellationToken)
    {
        var stopwatch = Stopwatch.StartNew();
        try
        {
            SourceDocument document = await reader.ReadAsync(source, cancellationToken);
            return new SourceReadOutcome(source, document, null);
        }
        catch (OperationCanceledException) when (cancellationToken.IsCancellationRequested)
        {
            throw;
        }
        catch (Exception exception)
        {
            return new SourceReadOutcome(
                source,
                null,
                $"{exception.GetType().Name} after {stopwatch.Elapsed.TotalSeconds:F2}s: {exception.Message}");
        }
    }
}
'''
