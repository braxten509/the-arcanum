title = "THE WORKING: CONCURRENCY AND PARTIAL FAILURE"
brief = '''
<p><strong>Outcome:</strong> Read independent sources concurrently while preserving successful evidence, failed-source diagnostics, and cancellation.</p><p>Author the project edits yourself. The hidden replay proves one possible implementation, but it is never shown and does not define your architecture.</p><ul><li>Coordinate independent source reads so they overlap rather than waiting serially inside a loop.</li><li>Represent a successful document and an ordinary failed-source diagnostic without erasing either outcome.</li><li>Pass one cancellation token through every read and keep requested cancellation distinct from ordinary partial failure.</li><li>Author controlled-delay, one-success-one-failure, and cancellation tests with observable timing or synchronization gates.</li><li>Preserve source order in the resulting collection unless an alternative order is explicitly documented and tested.</li></ul>
'''
