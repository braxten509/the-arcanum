mode = "write"
instruction = "Private replay adds the first deterministic section receipt."
content = '''
namespace Verisearch;

public static class ProofHarness
{
    public static Task<int> RunAsync(string proofId)
    {
        if (proofId != "s04")
        {
            Console.Error.WriteLine($"unknown proof id: {proofId}");
            return Task.FromResult(2);
        }
        string prepared = CliOptions.PrepareQuestion("whole   text");
        if (prepared != "whole text")
        {
            return Task.FromResult(1);
        }
        Console.WriteLine("S04_OK question=whole text");
        return Task.FromResult(0);
    }
}
'''
[[freestyle.referenceSteps]]
id = "s04-rewrite-entry"
path = "src/Verisearch/Program.cs"
mode = "rewrite"
instruction = "Private replay preserves the ordinary entry and admits only the explicit proof argument."
preserves = "all-active"
content = '''
using Verisearch;

if (args is ["--arcanum-proof", string proofId])
{
    return await ProofHarness.RunAsync(proofId);
}

Console.WriteLine("Verisearch learner project is ready.");
return 0;
'''
