[[freestyle.referenceSteps]]
id = "s04-write-question-tests"
path = "tests/Verisearch.Tests/QuestionPreparationTests.cs"
mode = "write"
instruction = "Private replay adds early whole-question and limit checks."
content = '''
using Verisearch;

namespace Verisearch.Tests;

public sealed class QuestionPreparationTests
{
    [Fact]
    public void PrepareQuestion_PreservesWholePunctuatedQuestion()
    {
        const string raw = "  What changed, and why?  ";
        string prepared = CliOptions.PrepareQuestion(raw);
        Assert.Equal("What changed, and why?", prepared);
    }

    [Fact]
    public void PrepareQuestion_RejectsOversizedInput()
    {
        Assert.Throws<ArgumentException>(() =>
            CliOptions.PrepareQuestion(new string('q', 1001)));
    }
}
'''
