brief = '''
<p><strong>Outcome:</strong> Introduce tests early, then read one chosen source through an asynchronous, replaceable boundary.</p><p>Author the project edits yourself. The hidden replay proves one possible implementation, but it is never shown and does not define your architecture.</p><ul><li>Add a sibling xUnit test project and reference the application project without placing test packages in production metadata.</li><li>Author early tests proving whole-question preservation and at least one invalid-input path; mutate a load-bearing line to observe red before repair.</li><li>Design an asynchronous, replaceable source-reading boundary that reads exactly the supplied source and passes cancellation.</li><li>Use a controlled HTTP handler, fixture, or alternate reader so tests cover success and failure without depending on the public network.</li><li>Keep the full application unwired for now, but preserve a clean solution build and deterministic chapter proof.</li></ul>
