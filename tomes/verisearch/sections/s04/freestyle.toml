[[freestyle.referenceSteps]]
id = "s04-write-source-reader"
path = "src/Verisearch/SourceReader.cs"
mode = "write"
instruction = "Private replay adds cancellable source I/O behind the established interface."
content = '''
using System.Net.Http.Headers;

namespace Verisearch;

public sealed class SourceReader(HttpClient httpClient) : ISourceReader
{
    public async Task<SourceDocument> ReadAsync(
        SourceSpec source,
        CancellationToken cancellationToken)
    {
        if (source.Uri.IsFile)
        {
            string local = await File.ReadAllTextAsync(source.Uri.LocalPath, cancellationToken);
            return new SourceDocument(source, local);
        }

        using var request = new HttpRequestMessage(HttpMethod.Get, source.Uri);
        using HttpResponseMessage response = await httpClient.SendAsync(
            request,
            HttpCompletionOption.ResponseHeadersRead,
            cancellationToken);
        response.EnsureSuccessStatusCode();
        MediaTypeHeaderValue? mediaType = response.Content.Headers.ContentType;
        if (mediaType is not null
            && !mediaType.MediaType!.StartsWith("text/", StringComparison.OrdinalIgnoreCase)
            && !mediaType.MediaType.Equals("application/xhtml+xml", StringComparison.OrdinalIgnoreCase))
        {
            throw new InvalidOperationException(
                $"{source.Label}: expected textual content, received {mediaType.MediaType}");
        }
        string content = await response.Content.ReadAsStringAsync(cancellationToken);
        return new SourceDocument(source, content);
    }
}
'''
