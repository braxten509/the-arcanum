[[lessons]]
id = "s04-l05"
teaches = ["language-interfaces-polymorphism"]
title = "Workshop — Fetch One Explicit Source"
body = '''

<p>The chapter Working combines asynchronous I/O, typed data, and an early test without handing you a production implementation. Your task is to design one replaceable operation that reads exactly the source it receives. It must not discover sources from question words, pick a preferred website, or manufacture a successful document after failure.</p>
<p>Start from behavior. Given a valid HTTP source and a non-cancelled token, the operation returns content paired with the same source identity. A non-success HTTP status becomes a specific failure. Cancellation remains cancellation. A test must be able to substitute the I/O edge so it never depends on the public internet.</p>
<pre><code data-kind="replacement">public interface ITextReader
{
    Task&lt;string&gt; ReadAsync(Uri uri, CancellationToken cancellationToken);
}</code></pre>
<p>This fragment demonstrates the size of a useful seam. You may instead return a document record, inject an <code>HttpMessageHandler</code>, wrap file and web readers behind one interface, or use another design you can test. Keep ownership explicit: whichever component creates an <code>HttpClient</code> should also decide its lifetime; a per-request client hidden inside the reader is difficult to configure and can exhaust sockets in larger programs.</p>
<p>Write the test first for one controlled response. Assert the requested URI, the preserved source identity, and the returned body. Add a second case for a non-success status or cancellation. Run it green, introduce one deliberate defect, observe red, then repair it. This is the first proof that the learner can use a test to locate a boundary rather than merely copy a finished file.</p>
<p>When you author the real project edit, choose names and file placement that fit the model from Chapter III. Keep <code>Program.cs</code> as a temporary demonstration or proof entrypoint; do not bind the complete application yet. Later Workings will add configuration, extraction, concurrency, AI, and rendering.</p>
<div class="callout"><p>A mock source reader may be deterministic because reading is an infrastructure seam. It must not be presented as a factual search result. The final AI mock has an even stricter rule: explicit test mode only, visibly labeled.</p></div>
<div class="field-notes"><div class="fn-head">FIELD NOTES // ASYNC IS CONTAGIOUS BY DESIGN</div><p>Return <code>Task&lt;T&gt;</code> from the I/O boundary and await it upward. Avoid <code>.Result</code> and <code>.Wait()</code>; they conceal the asynchronous contract and make cancellation harder to reason about.</p></div>
'''

[[lessons.readings]]
label = "Microsoft Learn — HttpClient guidelines"
url = "https://learn.microsoft.com/en-us/dotnet/fundamentals/networking/http/httpclient-guidelines"
essential = false

[[lessons.exercises]]
id = "s04-l05-e1"
type = "mc"
points = 20
prompt = "Why does SourceFetcher receive an HttpClient through its constructor?"
choices = ["HttpClient cannot be constructed", "The same configured client can be reused and tested instead of creating one per call", "Records require it", "It makes HTTP synchronous"]
answer = 1
whyWrong = "HttpClient can be constructed and remains asynchronous; constructor ownership exists for reuse, configuration, and substitution."
explain = "A long-lived client avoids per-request socket churn and makes the dependency visible."
hint = "One client, many fetches."

[[lessons.exercises]]
id = "s04-l05-e2"
type = "text"
points = 18
prompt = "Which canonical record carries a SourceSpec together with the fetched HTML?"
answer = "SourceDocument"
accept = ["SourceDocument record"]
hint = "It was established in Models.cs."

[[lessons.exercises]]
id = "s04-l05-d1"
type = "type"
points = 14
reps = 2
prompt = "Retype the status-and-body boundary twice."
code = '''using var response = await _http.GetAsync(source.Url, ct);
response.EnsureSuccessStatusCode();
string html = await response.Content.ReadAsStringAsync(ct);'''

[[lessons.exercises]]
id = "s04-l05-w1"
type = "write"
points = 38
prompt = "Write <code>static SourceDocument LoadFixture(SourceSpec source)</code> returning HTML <code>&lt;p&gt;Exact words.&lt;/p&gt;</code>. Construct a LocalFixture source labeled <code>Fixture</code>, call the method, and print exactly <code>Fixture 19</code> using the HTML length."
starter = '''Console.WriteLine("NOT LOADED");

// Define LoadFixture and the three small types below.
'''
expect = "Fixture 19"
solution = '''var source = new SourceSpec("Fixture", "mock://fixture", SourceKind.LocalFixture);
var document = LoadFixture(source);
Console.WriteLine($"{document.Source.Label} {document.Html.Length}");

static SourceDocument LoadFixture(SourceSpec source)
{
    return new SourceDocument(source, "<p>Exact words.</p>");
}

public enum SourceKind { Web, LocalFixture }
public record SourceSpec(string Label, string Url, SourceKind Kind);
public record SourceDocument(SourceSpec Source, string Html);
'''
hint = "Return new SourceDocument(source, the HTML string), then read document.Source.Label and document.Html.Length."

[[lessons.concepts]]
id = "language-interfaces-polymorphism"
purpose = "Name a behavioral seam so real providers and test doubles can be substituted without changing the pipeline's truth rules."
anatomy = "Declare the smallest useful interface member, implement it in separate concrete types, and depend on the interface at the caller boundary."
example = "The disposable examples in Workshop — Fetch One Explicit Source isolate this capability before the learner chooses how it belongs in the cumulative project. The lesson Workshop — Fetch One Explicit Source supplies the disposable observation point."
observable = "Two implementations can satisfy the same caller while verification and reporting remain unchanged. Confirm it while practicing Workshop — Fetch One Explicit Source."
failure = "An interface that exposes provider details or verified output lets one implementation bypass the common contract."
practice = "s04-l05-e1"

[[lessons.artifactSteps]]
id = "s04-l05-author-artifact"
path = "tests/Verisearch.Tests/QuestionPreparationTests.cs"
mode = "author"
instruction = "Use the C# ideas from Workshop — Fetch One Explicit Source to author or revise this learner-owned path toward the chapter behavior: Introduce tests early, then read one chosen source through an asynchronous, replaceable boundary. Choose your own type names, method boundaries, and file organization; the lesson examples are disposable and are not a production template."
checks = ["An early test changes from green to red under a deliberate bad input, and an async source read remains replaceable without live networking.", "The complete solution builds from saved source, and a deliberately changed load-bearing input makes the relevant check fail before repair."]
