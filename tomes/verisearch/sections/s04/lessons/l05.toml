[[lessons]]
id = "s04-l05"
teaches = ["language-interfaces-polymorphism"]
title = "Workshop — Fetch One Explicit Source"
body = '''

<p>The chapter Working combines asynchronous I/O, typed data, and an early test without handing you a production implementation. Your task is to design one replaceable operation that reads exactly the source it receives. It must not discover sources from question words, pick a preferred website, or manufacture a successful document after failure.</p>
<p>Start from behavior. Given a valid HTTP source and a non-cancelled token, the operation returns content paired with the same source identity. A non-success HTTP status becomes a specific failure. Cancellation remains cancellation. A test must be able to substitute the I/O edge so it never depends on the public internet.</p>
<pre><code data-kind="replacement">public interface ITextReader
{
    Task&lt;string&gt; ReadAsync(Uri uri, CancellationToken cancellationToken);
}</code></pre>
<p>This fragment demonstrates the size of a useful seam. You may instead return a document record, inject an <code>HttpMessageHandler</code>, wrap file and web readers behind one interface, or use another design you can test. Keep ownership explicit: whichever component creates an <code>HttpClient</code> should also decide its lifetime; a per-request client hidden inside the reader is difficult to configure and can exhaust sockets in larger programs.</p>
<p>Write the test first for one controlled response. Assert the requested URI, the preserved source identity, and the returned body. Add a second case for a non-success status or cancellation. Run it green, introduce one deliberate defect, observe red, then repair it. This is the first proof that the learner can use a test to locate a boundary rather than merely copy a finished file.</p>
<p>When you author the real project edit, choose names and file placement that fit the model from Chapter III. Keep <code>Program.cs</code> as a temporary demonstration or proof entrypoint; do not bind the complete application yet. Later Workings will add configuration, extraction, concurrency, AI, and rendering.</p>
<div class="callout"><p>A mock source reader may be deterministic because reading is an infrastructure seam. It must not be presented as a factual search result. The final AI mock has an even stricter rule: explicit test mode only, visibly labeled.</p></div>
<div class="callout csharp-transfer"><p><strong>C#/.NET transfer:</strong> The .NET-specific seam is often an interface returning <code>Task&lt;T&gt;</code> and accepting a <code>CancellationToken</code>. Keep async flowing upward; blocking with <code>.Result</code> or <code>.Wait()</code> changes failure and scheduling behavior and can deadlock context-bound applications.</p></div>
<div class="field-notes"><div class="fn-head">FIELD NOTES // ASYNC IS CONTAGIOUS BY DESIGN</div><p>Return <code>Task&lt;T&gt;</code> from the I/O boundary and await it upward. Avoid <code>.Result</code> and <code>.Wait()</code>; they conceal the asynchronous contract and make cancellation harder to reason about.</p></div>
'''

[[lessons.readings]]
label = "Microsoft Learn — HttpClient guidelines"
url = "https://learn.microsoft.com/en-us/dotnet/fundamentals/networking/http/httpclient-guidelines"
essential = false

[[lessons.exercises]]
id = "s04-l05-e1"
type = "mc"
points = 20
required = true
capabilities = ["language-interfaces-polymorphism"]
cognitiveTask = "explain"
scaffold = "guided"
contextFamily = "verisearch-s04-interfaces-polymorphism"
aidPolicy = "learning"
prompt = "Why does SourceFetcher receive an HttpClient through its constructor?"
choices = ["HttpClient cannot be constructed", "The same configured client can be reused and tested instead of creating one per call", "Records require it", "It makes HTTP synchronous"]
answer = 1
whyWrong = "HttpClient can be constructed and remains asynchronous; constructor ownership exists for reuse, configuration, and substitution."
explain = "A long-lived client avoids per-request socket churn and makes the dependency visible."
hint = "One client, many fetches."

