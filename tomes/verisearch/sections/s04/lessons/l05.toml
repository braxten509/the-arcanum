[[lessons.exercises]]
id = "s04-l05-w1"
type = "write"
points = 38
required = true
capabilities = ["language-interfaces-polymorphism"]
cognitiveTask = "debug"
scaffold = "guided"
contextFamily = "verisearch-s04-interfaces-polymorphism"
aidPolicy = "learning"
prompt = "Write <code>static SourceDocument LoadFixture(SourceSpec source)</code> returning HTML <code>&lt;p&gt;Exact words.&lt;/p&gt;</code>. Construct a LocalFixture source labeled <code>Fixture</code>, call the method, and print exactly <code>Fixture 19</code> using the HTML length."
starter = '''Console.WriteLine("NOT LOADED");

// Define LoadFixture and the three small types below.
'''
expect = "Fixture 19"
solution = '''var source = new SourceSpec("Fixture", "mock://fixture", SourceKind.LocalFixture);
var document = LoadFixture(source);
Console.WriteLine($"{document.Source.Label} {document.Html.Length}");

static SourceDocument LoadFixture(SourceSpec source)
{
    return new SourceDocument(source, "<p>Exact words.</p>");
}

public enum SourceKind { Web, LocalFixture }
public record SourceSpec(string Label, string Url, SourceKind Kind);
public record SourceDocument(SourceSpec Source, string Html);
'''
hint = "Return new SourceDocument(source, the HTML string), then read document.Source.Label and document.Html.Length."

[[lessons.concepts]]
id = "language-interfaces-polymorphism"
purpose = "Name one replaceable operation as a contract so a real transport and a controlled test double can stand in the same place."
anatomy = "An interface declares the signature without a body, a class implements it, and callers depend on the interface so any implementation may be supplied."
example = "An ITextReader contract with one asynchronous read taking a source address and a cancellation token, satisfied by an HTTP reader and by a fixture reader."
observable = "The same caller runs against the network implementation and against a fixture with no change to its own code."
failure = "An interface invented for every class becomes ceremony, while a missing one forces tests to reach the public network to prove anything."
practice = "s04-l05-e1"
