[[lessons.concepts]]
id = "language-http-request-boundary"
purpose = "Ask the network for exactly one address and decide what a non-success answer means before any of its text is trusted."
anatomy = "One client with a set timeout issues the request, the status is checked before the body is read, and a token lets the call be abandoned."
example = "A client given a ten-second timeout with its request wrapped in try, and a second example that links a cancellation deadline to the same call."
observable = "A reachable address returns content, a not-found answer takes the failure path, and an expired deadline ends the call rather than the program."
failure = "Reading the body before checking status turns an error page into evidence, and a fresh client per request exhausts sockets while doing it."
practice = "s04-l03-e1"
