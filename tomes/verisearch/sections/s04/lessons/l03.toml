[[lessons.exercises]]
id = "s04-l03-e3"
type = "mc"
points = 25
required = true
capabilities = ["language-async-cancellation"]
cognitiveTask = "explain"
scaffold = "guided"
contextFamily = "verisearch-s04-http-request-boundary"
aidPolicy = "learning"
prompt = "A caller cancels while a source request is waiting. What should SourceFetcher do?"
choices = ["Propagate the cancellation token and exception", "Retry forever", "Silently return fabricated HTML", "Switch to an unrelated URL"]
answer = 0
whyWrong = "Unbounded retry ignores the caller, while fabricated content or a substituted URL changes the evidence set. Cancellation should remain cancellation."
explain = "Cancellation is the caller's decision, so the reader passes the token down and lets the cancellation exception travel up unchanged. Anything else reports a result the caller already said it no longer wanted."
hint = "The caller owns whether the operation may continue."

