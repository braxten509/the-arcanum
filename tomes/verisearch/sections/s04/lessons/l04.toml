[[lessons]]
id = "s04-l04"
teaches = ["language-serialization-io"]
title = "System.Text.Json — JSON In, Typed Data Out"
body = '''

<p>JSON is external text with a defined grammar. <code>System.Text.Json</code>, included with .NET, maps that text to declared C# shapes and back. Verisearch uses typed JSON at boundaries such as the source catalog and structured AI proposal envelopes, regardless of which provider transport the learner chooses.</p>
<pre><code data-kind="replacement">public sealed record SourceEntry(string Label, string Url);
public sealed record SourceCatalogDocument(IReadOnlyList&lt;SourceEntry&gt; Sources);

SourceCatalogDocument? catalog =
    JsonSerializer.Deserialize&lt;SourceCatalogDocument&gt;(json);</code></pre>
<p>The fragment shows a declared shape. Deserialization can still return <code>null</code>, and syntactically valid JSON may carry empty labels, duplicate entries, or unsupported addresses. Parsing proves structure only; validation establishes the application's policy afterward.</p>
<p>Provider adapters follow the same principle without sharing provider-specific types. A CLI wrapper might receive a common request through standard input. A hosted API adapter might serialize its vendor envelope and translate the response at the edge. Both return the same untrusted proposal model to the pipeline. Do not spread one provider's JSON properties through domain records.</p>
<p>Use <code>JsonSerializerOptions</code> intentionally. Case-insensitive input may help user-authored configuration; strict external AI output can make mistakes easier to diagnose. Records, properties, explicit attributes, or source-generated contexts are all valid design choices at this level. Keep the choice local and test it with exact strings.</p>
<p>Malformed JSON raises <code>JsonException</code>. Catch it where you can name the file or provider boundary, then preserve the original cause. Never convert malformed provider output into an empty successful answer, because that hides a failed semantic operation.</p>
<div class="callout"><p>JSON is a transport shape, not a trust level. A proposal remains unverified even after perfectly typed deserialization.</p></div>
<div class="callout csharp-transfer"><p><strong>C#/.NET transfer:</strong> <code>System.Text.Json</code> maps external JSON into declared CLR shapes, but nullable annotations and successful deserialization do not perform domain validation. Its defaults and options—property naming, case matching, converters, required members—belong at the adapter boundary rather than in trusted records.</p></div>
<div class="field-notes"><div class="fn-head">FIELD NOTES // TWO SCHEMAS</div><p>User configuration and AI response data have different owners and failure policies. Give them separate C# shapes even if both happen to contain strings and arrays.</p></div>
'''

[[lessons.readings]]
