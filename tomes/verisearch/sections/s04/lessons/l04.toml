[[lessons.exercises]]
id = "s04-l04-e1"
type = "fill"
points = 25
prompt = "Fill the method that converts JSON text into a typed C# value."
code = "var row = JsonSerializer.____<SourceRow>(json, options);"
answer = "Deserialize"
hint = "JSON to object; Serialize travels the other direction."

[[lessons.exercises]]
id = "s04-l04-e2"
type = "mc"
points = 20
prompt = "The payload uses <code>label</code> while the C# record uses <code>Label</code>. Which explicit option admits that difference?"
choices = ["WriteIndented", "PropertyNameCaseInsensitive", "AllowTrailingCommas only", "IncludeFields"]
answer = 1
whyWrong = "Indentation controls output formatting, while the other settings do not establish case-insensitive property matching."
explain = "PropertyNameCaseInsensitive allows common web-style lowercase names to bind to PascalCase properties."
hint = "Its name states the matching rule."

[[lessons.exercises]]
id = "s04-l04-e3"
type = "mc"
points = 20
prompt = "What should happen before reading a typed JSON body from a failed HTTP response?"
choices = ["Ignore the status", "Retry forever", "Check or enforce success status", "Convert the status code to JSON"]
answer = 2
whyWrong = "A typed body does not turn an HTTP failure into success, and unbounded retries hide the real boundary."
explain = "Status handling and JSON mapping are separate responsibilities."
hint = "HTTP status comes before body interpretation."

[[lessons.exercises]]
id = "s04-l04-d1"
type = "type"
points = 12
reps = 2
prompt = "Retype the shared serializer options twice."
code = '''var jsonOptions = new JsonSerializerOptions
{
    PropertyNameCaseInsensitive = true,
    WriteIndented = true
};'''

[[lessons.exercises]]
id = "s04-l04-w1"
type = "write"
points = 36
prompt = "Deserialize the supplied lowercase JSON into <code>SourceRow(string Label, string Url, double Trust)</code> with case-insensitive options. Print exactly <code>RFC 8446 @ 10</code>."
starter = '''using System.Text.Json;

string json = """{"label":"RFC 8446","url":"https://example.test/rfc","trust":10}""";
Console.WriteLine("NOT PARSED");
'''
expect = "RFC 8446 @ 10"
solution = '''using System.Text.Json;

string json = """{"label":"RFC 8446","url":"https://example.test/rfc","trust":10}""";
var options = new JsonSerializerOptions { PropertyNameCaseInsensitive = true };
var row = JsonSerializer.Deserialize<SourceRow>(json, options)!;
Console.WriteLine($"{row.Label} @ {row.Trust}");

public record SourceRow(string Label, string Url, double Trust);
'''
hint = "Create JsonSerializerOptions, call Deserialize<SourceRow>, then read Label and Trust."

[[lessons.concepts]]
id = "language-serialization-io"
purpose = "Move typed data across file, JSON, HTTP, process, and terminal boundaries without confusing external text with trusted objects."
anatomy = "Select an I/O API, await or dispose it correctly, serialize or deserialize a declared shape, then validate the resulting values."
example = "The disposable examples in System.Text.Json — JSON In, Typed Data Out isolate this capability before the learner chooses how it belongs in the cumulative project. The lesson System.Text.Json — JSON In, Typed Data Out supplies the disposable observation point."
observable = "Valid input becomes the intended typed data and malformed input produces a specific boundary diagnostic. Confirm it while practicing System.Text.Json — JSON In, Typed Data Out."
failure = "Scraping loosely structured text or overwriting invalid user data destroys the evidence needed to repair it."
practice = "s04-l04-e1"

