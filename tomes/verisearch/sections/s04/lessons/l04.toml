[[lessons]]
id = "s04-l04"
teaches = ["json-mapping"]
title = "System.Text.Json — JSON In, Typed Data Out"
body = '''
<p>JSON is text with a defined shape. <code>System.Text.Json</code>, included with .NET, maps that text to C# records and back. Verisearch will use it for configuration, Ollama requests, and Ollama responses, so learn one dependable pathway now.</p>
<pre><code>{
  <span class="s">"label"</span>: <span class="s">"RFC 8446"</span>,
  <span class="s">"url"</span>: <span class="s">"https://www.rfc-editor.org/rfc/rfc8446"</span>,
  <span class="s">"trust"</span>: 10
}</code></pre>
<pre><code><span class="k">using</span> System.Text.Json;

<span class="k">public record</span> SourceRow(<span class="k">string</span> Label, <span class="k">string</span> Url, <span class="k">double</span> Trust);

<span class="k">var</span> options = <span class="k">new</span> JsonSerializerOptions
{
    PropertyNameCaseInsensitive = <span class="k">true</span>
};

SourceRow? row = JsonSerializer.Deserialize&lt;SourceRow&gt;(json, options);</code></pre>
<p><code>Deserialize&lt;T&gt;</code> returns <code>T?</code>: malformed data may throw <code>JsonException</code>, while the JSON literal <code>null</code> legitimately produces null. Check both. Lowercase JSON names do not match PascalCase properties under the serializer's strict default, which is why this course creates one shared options object with case-insensitive reads.</p>
<p>For HTTP, <code>System.Net.Http.Json</code> adds helpers:</p>
<pre><code><span class="k">using</span> System.Net.Http.Json;

HttpResponseMessage response = <span class="k">await</span> http.PostAsJsonAsync(<span class="s">"api/path"</span>, request, ct);
ResponseBody? body = <span class="k">await</span> response.Content.ReadFromJsonAsync&lt;ResponseBody&gt;(cancellationToken: ct);</code></pre>
<p>The helpers serialize the request and deserialize the response, but they do not decide whether a failed status is acceptable. Call <code>response.EnsureSuccessStatusCode()</code> or branch on <code>IsSuccessStatusCode</code> before trusting the body.</p>
<div class="callout">Never solve a JSON mismatch with a chain of string replacements. Print a bounded piece of the raw payload, compare it to the C# record, and fix names, nesting, or nullability. That habit will save Chapter IX.</div>
<div class="field-notes"><div class="fn-head">MARGINALIA // MISSING, NULL, AND DEFAULT</div>
<p>A missing numeric property becomes zero on a non-nullable <code>int</code>; explicit JSON null cannot. Use nullable types when absence matters, then validate after deserialization. Serialization with <code>WriteIndented = true</code> produces human-readable config. The serializer understands nested records and lists, so model the actual shape instead of parsing with regular expressions.</p></div>
'''

[[lessons.readings]]
label = "Microsoft Learn — System.Text.Json how-to"
url = "https://learn.microsoft.com/en-us/dotnet/standard/serialization/system-text-json/how-to"
essential = false

[[lessons.readings]]
label = "Microsoft Learn — HttpClient JSON extensions"
url = "https://learn.microsoft.com/en-us/dotnet/standard/serialization/system-text-json/httpclient-extensions"
essential = false

[[lessons.exercises]]
id = "s04-l04-e1"
type = "fill"
points = 25
prompt = "Fill the method that converts JSON text into a typed C# value."
code = "var row = JsonSerializer.____<SourceRow>(json, options);"
answer = "Deserialize"
hint = "JSON to object; Serialize travels the other direction."

[[lessons.exercises]]
id = "s04-l04-e2"
type = "mc"
points = 20
prompt = "The payload uses <code>label</code> while the C# record uses <code>Label</code>. Which explicit option admits that difference?"
choices = ["WriteIndented", "PropertyNameCaseInsensitive", "AllowTrailingCommas only", "IncludeFields"]
answer = 1
whyWrong = "Indentation controls output formatting, while the other settings do not establish case-insensitive property matching."
explain = "PropertyNameCaseInsensitive allows common web-style lowercase names to bind to PascalCase properties."
hint = "Its name states the matching rule."

[[lessons.exercises]]
id = "s04-l04-e3"
type = "mc"
points = 20
prompt = "What should happen before reading a typed JSON body from a failed HTTP response?"
choices = ["Ignore the status", "Retry forever", "Check or enforce success status", "Convert the status code to JSON"]
answer = 2
whyWrong = "A typed body does not turn an HTTP failure into success, and unbounded retries hide the real boundary."
explain = "Status handling and JSON mapping are separate responsibilities."
hint = "HTTP status comes before body interpretation."

[[lessons.exercises]]
id = "s04-l04-d1"
type = "type"
points = 12
reps = 2
prompt = "Retype the shared serializer options twice."
code = '''var jsonOptions = new JsonSerializerOptions
{
    PropertyNameCaseInsensitive = true,
    WriteIndented = true
};'''

[[lessons.exercises]]
id = "s04-l04-w1"
type = "write"
points = 36
prompt = "Deserialize the supplied lowercase JSON into <code>SourceRow(string Label, string Url, double Trust)</code> with case-insensitive options. Print exactly <code>RFC 8446 @ 10</code>."
starter = '''using System.Text.Json;

string json = """{"label":"RFC 8446","url":"https://example.test/rfc","trust":10}""";
Console.WriteLine("NOT PARSED");
'''
expect = "RFC 8446 @ 10"
solution = '''using System.Text.Json;

string json = """{"label":"RFC 8446","url":"https://example.test/rfc","trust":10}""";
var options = new JsonSerializerOptions { PropertyNameCaseInsensitive = true };
var row = JsonSerializer.Deserialize<SourceRow>(json, options)!;
Console.WriteLine($"{row.Label} @ {row.Trust}");

public record SourceRow(string Label, string Url, double Trust);
'''
hint = "Create JsonSerializerOptions, call Deserialize<SourceRow>, then read Label and Trust."
