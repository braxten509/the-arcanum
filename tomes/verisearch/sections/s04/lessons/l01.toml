prompt = "Where are your project's package dependencies recorded?"
choices = ["Program.cs", "the Windows registry", "packages.txt", "the .csproj file"]
answer = 3
whyWrong = "Dependencies aren’t tracked in Program.cs, a packages.txt, or the registry — they’re PackageReference entries in the .csproj."
hint = "The XML project file."

