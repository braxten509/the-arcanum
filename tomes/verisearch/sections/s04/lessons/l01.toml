[[lessons]]
id = "s04-l01"
teaches = ["language-testing-debugging"]
title = "NuGet — the .NET package bazaar"
body = '''

<p>NuGet supplies versioned .NET libraries, while a test project supplies a second executable view of your code. Add both ideas early: packages should solve a bounded infrastructure problem, and tests should begin before the pipeline is crowded with network and AI behavior.</p>
<p>A package reference belongs in a project file. The command below is a disposable example; substitute the project and package that your experiment actually uses:</p>
<pre><code data-kind="terminal">$ dotnet add ./Scratch/Scratch.csproj package Some.Package
$ dotnet restore ./Scratch/Scratch.csproj
$ dotnet list ./Scratch/Scratch.csproj package</code></pre>
<p>The first command edits project metadata, restore resolves the declared graph, and list lets you inspect the direct result. Do not copy a package merely because a tutorial used it. Check its official documentation, license, supported target framework, and current stable version. Commit the project metadata, not the generated package cache.</p>
<p>A sibling xUnit project references the application project rather than copying its source. That allows a test to call a public boundary and gives the compiler one solution-wide view of both projects:</p>
<pre><code data-kind="terminal">$ dotnet new xunit -n Scratch.Tests
$ dotnet add Scratch.Tests/Scratch.Tests.csproj reference Scratch/Scratch.csproj
$ dotnet test</code></pre>
<p>The first Verisearch tests should be small and deterministic. Preparing a whole question, rejecting blank input, or preserving punctuation needs no network. Arrange one controlled input, invoke one public behavior, and assert one observable result. Then deliberately break the behavior and confirm that the test becomes red. A test that never fails under a load-bearing mutation is ceremony, not evidence.</p>
<p>Package installation and test design are separate decisions. <code>System.Text.Json</code> and <code>HttpClient</code> already ship with .NET; a DOM parser such as AngleSharp is an external package. xUnit belongs to the test project. The production project should not acquire test-only dependencies merely to make setup convenient.</p>
<div class="callout"><p>Record exact versions in project metadata, but let the learner choose architecture. This chapter requires an early test seam and replaceable source I/O; it does not require a class with a prescribed name.</p></div>
<div class="callout csharp-transfer"><p><strong>C#/.NET transfer:</strong> NuGet references live in MSBuild project metadata, and restore resolves a transitive dependency graph into generated assets under <code>obj</code>. A sibling xUnit project is a separate compiled project with a <code>ProjectReference</code>, not a special test mode hidden inside the production assembly.</p></div>
<div class="field-notes"><div class="fn-head">FIELD NOTES // FIRST DIAGNOSTIC FIRST</div><p>A restore failure concerns dependency resolution; a compiler failure concerns source or project configuration; a red assertion concerns behavior. Read the first failing boundary before changing code.</p></div>
'''

