[[lessons.concepts]]
id = "language-testing-debugging"
purpose = "Turn a promise into an executable check, and read failure output from the earliest boundary that broke."
anatomy = "A sibling test project references the application project; a test arranges one controlled input, invokes one public behavior, and asserts one observable result."
example = "A scratch xunit project created beside the application with a project reference added, then dotnet test run once green and once after a deliberate break."
observable = "The check passes for the valid case and turns red when a load-bearing line is changed on purpose."
failure = "A test that needs live network, or that cannot fail under any mutation, is ceremony that reports health it never measured."
practice = "s04-l01-e1"
