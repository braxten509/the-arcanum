answer = "add"
hint = "Three letters."

[[lessons.exercises]]
id = "s04-l01-e2"
type = "mc"
points = 15
required = true
capabilities = ["language-testing-debugging"]
cognitiveTask = "explain"
scaffold = "guided"
contextFamily = "verisearch-s04-testing-debugging"
aidPolicy = "learning"
prompt = "Where are your project's package dependencies recorded?"
choices = ["Program.cs", "the Windows registry", "packages.txt", "the .csproj file"]
answer = 3
whyWrong = "Dependencies aren’t tracked in Program.cs, a packages.txt, or the registry — they’re PackageReference entries in the .csproj."
explain = "A <code>PackageReference</code> entry in the .csproj is the only record the restore step reads, which is why the project file is what you commit and the package cache is what you ignore."
hint = "The XML project file."

[[lessons.exercises]]
id = "s04-l01-e3"
type = "mc"
points = 15
required = true
capabilities = ["language-testing-debugging"]
cognitiveTask = "explain"
scaffold = "guided"
contextFamily = "verisearch-s04-testing-debugging"
aidPolicy = "learning"
prompt = "Which of these requires NO NuGet package because it ships with .NET?"
choices = ["HttpClient", "CsvHelper", "AngleSharp", "Spectre.Console"]
answer = 0
whyWrong = "CsvHelper, AngleSharp and Spectre.Console are NuGet packages—HttpClient ships in the base class library, so no package is needed."
explain = "<code>HttpClient</code>, <code>System.Text.Json</code>, and the File helpers ship in the base class library, so a package you add should solve a bounded problem the platform does not already solve."
hint = "HTTP is built into the platform."

