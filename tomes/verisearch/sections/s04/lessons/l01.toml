[[lessons]]
id = "s04-l01"
teaches = ["nuget-packages"]
title = "NuGet — the .NET package bazaar"
body = '''

<p>NuGet is .NET's package registry — like npm or pip, but for .NET. Verisearch deliberately keeps its dependency list small: built-in .NET handles HTTP, JSON, files, and the Ollama API; packages are reserved for HTML parsing, terminal rendering, and tests.</p>
<pre><code>$ dotnet add package AngleSharp          <span class="c">// installs the newest version</span>
$ dotnet add package AngleSharp --version 1.1.2</code></pre>
<p>The dependency lands in your <code>.csproj</code>:</p>
<pre><code>&lt;ItemGroup&gt;
  &lt;PackageReference Include=<span class="s">"AngleSharp"</span> Version=<span class="s">"1.1.2"</span> /&gt;
&lt;/ItemGroup&gt;</code></pre>
<p>Next <code>dotnet build</code> downloads it automatically. Everything you'll use this tome:</p>
<ul>
<li><code>AngleSharp</code> — HTML parsing (Chapter VI)</li>
<li><code>Spectre.Console</code> — rich terminal output (Chapter X)</li>
<li><code>xunit</code> packages — the test project (Chapter XII)</li>
</ul>
<p><code>HttpClient</code> and <code>System.Text.Json</code> need <strong>no package</strong> — they ship with .NET.</p>
<div class="callout">In the desk's scroll, the PACKAGES button runs <code>dotnet add package</code> for you. Vet what you install — every package is code you're trusting with your machine. Check the download count and the repo before adding anything exotic.</div><div class="field-notes"><div class="fn-head">MARGINALIA // THE DEEPER CUT — IN THORNE'S HAND</div>
<p><strong>Versions are semver:</strong> MAJOR.MINOR.PATCH — 16.2.0 → 16.2.1 is a fix, → 17.0.0 may break your code. <code>dotnet add package X</code> takes the latest stable; pin with <code>--version</code> when reproducibility matters.</p>
<p><strong>Transitive dependencies:</strong> installing AngleSharp may pull packages IT needs. <code>dotnet list package</code> shows direct deps; <code>--include-transitive</code> shows the whole tree.</p>
<p><strong>Restore:</strong> <code>dotnet restore</code> downloads everything the csproj references (build runs it implicitly). Fresh clone of a project? Restore is why it just works — the packages folder is never committed.</p></div>'''

[[lessons.readings]]
label = "Microsoft Learn — \"NuGet package basics\""
url = "https://learn.microsoft.com/en-us/nuget/what-is-nuget"
essential = false

[[lessons.exercises]]
id = "s04-l01-e1"
type = "fill"
points = 20
prompt = "Fill in the command to install a package."
code = "$ dotnet ____ package AngleSharp"
answer = "add"
hint = "Three letters."

[[lessons.exercises]]
id = "s04-l01-e2"
type = "mc"
points = 15
prompt = "Where are your project's package dependencies recorded?"
choices = ["Program.cs", "the Windows registry", "packages.txt", "the .csproj file"]
answer = 3
whyWrong = "Dependencies aren’t tracked in Program.cs, a packages.txt, or the registry — they’re PackageReference entries in the .csproj."
hint = "The XML project file."

[[lessons.exercises]]
id = "s04-l01-e3"
type = "mc"
points = 15
prompt = "Which of these requires NO NuGet package because it ships with .NET?"
choices = ["HttpClient", "CsvHelper", "AngleSharp", "Spectre.Console"]
answer = 0
whyWrong = "CsvHelper, AngleSharp and Spectre.Console are NuGet packages—HttpClient ships in the base class library, so no package is needed."
hint = "HTTP is built into the platform."

[[lessons.exercises]]
id = "s04-l01-d1"
type = "type"
points = 12
reps = 2
prompt = "The install command and what it writes to your csproj. Twice."
code = '''
dotnet add package AngleSharp
<PackageReference Include="AngleSharp" Version="1.1.2" />'''
