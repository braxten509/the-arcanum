brief = "Time to speak beyond these walls. This chapter covers NuGet (measuring in reagents), <code>HttpClient</code> (calls across the far roads), <code>async/await</code> (waiting without turning to stone), and <code>System.Text.Json</code> (transmuting a far voice's answer into C# forms). The Working: the tome sends an asking to a search rite and speaks ranked findings. No SearXNG of your own? The chapter carries a mock mode — THORNE judges the channelwork, not the weather on the roads."
