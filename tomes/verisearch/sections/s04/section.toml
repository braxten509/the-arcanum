short = "The Far-Speaking"
title = "The Far-Speaking — Packages, Async HTTP & JSON"
build = "The source fetcher — one explicit trusted URL or labeled local fixture becomes a SourceDocument"
brief = "Time to speak beyond these walls. This chapter covers NuGet, <code>async/await</code>, a reused <code>HttpClient</code>, status handling, and typed JSON. The Working deliberately starts smaller than web search: it fetches a source the user explicitly chose and preserves its C#-owned identity. A labeled local fixture keeps every learner moving offline without pretending to be live evidence."
