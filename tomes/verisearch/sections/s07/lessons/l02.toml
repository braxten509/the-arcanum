[[lessons]]
id = "s07-l02"
title = "The LINQ arsenal — GroupBy, Distinct, Aggregate, Zip"
body = '''

<p>Beyond Where/Select/OrderBy, four seekers do the heavy analytical lifting:</p>
<p><strong>GroupBy</strong> — bucket items by a key. Each group has a <code>.Key</code> and is itself enumerable:</p>
<pre><code><span class="k">var</span> byTier = profiles.GroupBy(p =&gt; p.Tier);
<span class="k">foreach</span> (<span class="k">var</span> g <span class="k">in</span> byTier)
    Console.WriteLine(<span class="s">$"{g.Key}: {g.Count()} domains, avg {g.Average(p =&gt; p.BaseScore):F1}"</span>);
<span class="c">// Government: 4 domains, avg 9.1</span></code></pre>
<p><strong>Distinct / DistinctBy</strong> — dedupe. Search engines return the same URL twice constantly:</p>
<pre><code><span class="k">var</span> unique = results.DistinctBy(r =&gt; r.Url);   <span class="c">// first hit wins per URL</span></code></pre>
<p><strong>Aggregate</strong> — fold everything into one value, carrying an accumulator:</p>
<pre><code><span class="k">double</span> product = scores.Aggregate(1.0, (acc, s) =&gt; acc * s);
<span class="c">// like Sum, but you define the combining step. Use for anything "cumulative".</span></code></pre>
<p><strong>Zip</strong> — pair up two sequences element-by-element:</p>
<pre><code><span class="k">var</span> ranked = urls.Zip(scores, (u, s) =&gt; <span class="s">$"{u} → {s}"</span>);</code></pre>
<p>And the aggregation shorthands you'll reach for daily: <code>Count(pred)</code>, <code>Sum(sel)</code>, <code>Average(sel)</code>, <code>Min/Max(sel)</code>, <code>Any(pred)</code> (at least one?), <code>All(pred)</code> (every one?), <code>First/FirstOrDefault(pred)</code>.</p>
<div class="callout"><code>First</code> on an empty sequence THROWS. <code>FirstOrDefault</code> returns null/default. In pipeline code that eats real-world data, OrDefault is almost always what you meant.</div><div class="field-notes"><div class="fn-head">MARGINALIA // THE DEEPER CUT — IN THORNE'S HAND</div>
<p><strong>SelectMany</strong> — flatten a list of lists: 5 pages each yielding a List of quotes → one flat quote stream: <code>outcomes.SelectMany(o =&gt; o.Quotes)</code>. You WILL need this in Chapter XI.</p>
<p><strong>ThenBy</strong> — tie-breakers: <code>.OrderByDescending(r =&gt; r.Trust).ThenBy(r =&gt; r.Url)</code> — equal trust sorts alphabetically. LINQ's OrderBy is <em>stable</em>: equal keys keep their original relative order.</p>
<p><strong>Chunk(n)</strong> — split into batches of n (paginating paragraphs for prompt size limits). <strong>ToDictionary / ToHashSet</strong> — materialize into lookup structures: <code>profiles.ToDictionary(p =&gt; p.Domain)</code> is your Chapter V bridge in one call.</p></div>'''

[[lessons.readings]]
label = "Microsoft Learn — \"Working with LINQ\" tutorial"
url = "https://learn.microsoft.com/en-us/dotnet/csharp/tutorials/working-with-linq"
essential = true

