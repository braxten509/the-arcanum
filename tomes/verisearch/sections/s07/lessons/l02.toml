[[lessons.exercises]]
id = "s07-l02-w1"
type = "write"
points = 36
required = true
capabilities = ["language-linq-lambdas"]
cognitiveTask = "build"
scaffold = "guided"
contextFamily = "verisearch-s07-linq-grouping-aggregation"
aidPolicy = "learning"
prompt = "Given <code>var words = new List&lt;string&gt; { \"tls\", \"rfc\", \"nist\", \"handshake\" };</code> group by word LENGTH, order groups by key ascending, and print each as <code>&lt;length&gt;:&lt;count&gt;</code> on its own line."
expect = '''
3:2
4:1
9:1'''
solution = '''
var words = new List<string> { "tls", "rfc", "nist", "handshake" };
foreach (var group in words.GroupBy(word => word.Length).OrderBy(group => group.Key))
    Console.WriteLine($"{group.Key}:{group.Count()}");
'''
hint = "words.GroupBy(w => w.Length).OrderBy(g => g.Key) then $\"{g.Key}:{g.Count()}\"."

[[lessons.concepts]]
id = "language-linq-grouping-aggregation"
purpose = "Answer analytical questions about a collection: grouped by a key, reduced to one value, deduplicated, or paired."
anatomy = "GroupBy yields groups with a key, DistinctBy removes repeats under a chosen key and comparer, Aggregate folds from a seed, and Zip walks two sequences together."
example = "Passages grouped by source label, sources deduplicated by address under an explicit case-insensitive comparer, and scores folded with Aggregate."
observable = "Each group reports its key and its members, and the deduplicated sequence keeps the first occurrence of each key."
failure = "Grouping without naming the comparer makes case sensitivity an accident that changes results between inputs and platforms."
practice = "s07-l02-e1"
