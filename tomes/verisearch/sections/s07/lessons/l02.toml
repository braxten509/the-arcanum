[[lessons.exercises]]
id = "s07-l02-e2"
type = "mc"
points = 25
required = true
capabilities = ["language-linq-lambdas"]
cognitiveTask = "explain"
scaffold = "guided"
contextFamily = "verisearch-s07-linq-grouping-aggregation"
aidPolicy = "learning"
prompt = "What does this produce?"
code = '''
var nums = new[] { 2, 3, 4 };
var result = nums.Aggregate(1, (acc, n) => acc * n);'''
choices = ["9", "24", "10", "1"]
answer = 1
whyWrong = "Trace the chain’s arithmetic: it evaluates to 24 — the other numbers drop or double a step in the pipeline."
explain = "<code>Aggregate</code> carries its accumulator through every item: the seed 1 becomes 2, then 6, then 24."
hint = "1*2=2, 2*3=6, 6*4=…"

