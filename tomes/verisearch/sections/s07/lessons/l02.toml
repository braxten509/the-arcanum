[[lessons.exercises]]
id = "s07-l02-e1"
type = "fill"
points = 25
prompt = "Fill the blank to deduplicate search results by URL."
code = "var unique = results.____(r => r.Url).ToList();"
answer = "DistinctBy"
accept = ["distinctby"]
hint = "Distinct's picky sibling — dedupe BY a key."

[[lessons.exercises]]
id = "s07-l02-e2"
type = "mc"
points = 25
prompt = "What does this produce?"
code = '''
var nums = new[] { 2, 3, 4 };
var result = nums.Aggregate(1, (acc, n) => acc * n);'''
choices = ["9", "24", "10", "1"]
answer = 1
hint = "1*2=2, 2*3=6, 6*4=…"

[[lessons.exercises]]
id = "s07-l02-e3"
type = "mc"
points = 20
prompt = "<code>results.First(r =&gt; r.Trust &gt; 9)</code> when nothing matches…"
choices = ["returns null", "returns a default SearchResult", "throws InvalidOperationException", "returns the highest-trust result instead"]
answer = 2
hint = "This is why FirstOrDefault exists."

[[lessons.exercises]]
id = "s07-l02-e4"
type = "mc"
points = 20
prompt = "You want \"how many results per engine\". Which operator starts that query?"
choices = ["Distinct", "GroupBy", "Zip", "OrderBy"]
answer = 1
hint = "Bucket first, count each bucket second."

[[lessons.exercises]]
id = "s07-l02-d1"
type = "type"
points = 14
reps = 2
prompt = "GroupBy with per-group aggregates — the analytics shape. Twice."
code = '''
foreach (var g in profiles.GroupBy(p => p.Tier))
{
    Console.WriteLine($"{g.Key}: {g.Count()} domains");
}'''

[[lessons.exercises]]
id = "s07-l02-w1"
type = "write"
points = 36
prompt = "Given <code>var words = new List&lt;string&gt; { \"tls\", \"rfc\", \"nist\", \"handshake\" };</code> group by word LENGTH, order groups by key ascending, and print each as <code>&lt;length&gt;:&lt;count&gt;</code> on its own line."
expect = '''
3:2
4:1
9:1'''
hint = "words.GroupBy(w => w.Length).OrderBy(g => g.Key) then $\"{g.Key}:{g.Count()}\"."
