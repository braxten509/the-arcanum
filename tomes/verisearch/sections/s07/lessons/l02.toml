[[lessons]]
id = "s07-l02"
teaches = ["language-linq-grouping-aggregation"]
title = "The LINQ arsenal — GroupBy, Distinct, Aggregate, Zip"
body = '''

<p>Beyond Where/Select/OrderBy, four seekers do the heavy analytical lifting:</p>
<p><strong>GroupBy</strong> — bucket items by a key. Each group has a <code>.Key</code> and is itself enumerable:</p>
<pre><code data-kind="replacement"><span class="k">var</span> bySource = passages.GroupBy(p =&gt; p.Source.Label);
<span class="k">foreach</span> (<span class="k">var</span> group <span class="k">in</span> bySource)
    Console.WriteLine(<span class="s">$"{group.Key}: {group.Count()} passages"</span>);
<span class="c">// RFC 8446: 14 passages</span></code></pre>
<p><strong>Distinct / DistinctBy</strong> — dedupe. Configuration can accidentally repeat one URL under multiple labels:</p>
<pre><code data-kind="replacement"><span class="k">var</span> unique = sources.DistinctBy(source =&gt; source.Url, StringComparer.OrdinalIgnoreCase);</code></pre>
<p><strong>Aggregate</strong> — fold everything into one value, carrying an accumulator:</p>
<pre><code data-kind="replacement"><span class="k">double</span> product = scores.Aggregate(1.0, (acc, s) =&gt; acc * s);
<span class="c">// like Sum, but you define the combining step. Use for anything "cumulative".</span></code></pre>
<p><strong>Zip</strong> — pair up two sequences element-by-element:</p>
<pre><code data-kind="replacement"><span class="k">var</span> summaries = labels.Zip(counts, (label, count) =&gt; <span class="s">$"{label} → {count}"</span>);</code></pre>
<p>And the aggregation shorthands you'll reach for daily: <code>Count(pred)</code>, <code>Sum(sel)</code>, <code>Average(sel)</code>, <code>Min/Max(sel)</code>, <code>Any(pred)</code> (at least one?), <code>All(pred)</code> (every one?), <code>First/FirstOrDefault(pred)</code>.</p>
<div class="callout"><code>First</code> on an empty sequence THROWS. <code>FirstOrDefault</code> returns null/default. In pipeline code that eats real-world data, OrDefault is almost always what you meant.</div>
<div class="callout csharp-transfer"><p><strong>C#/.NET transfer:</strong> LINQ operators are ordinary generic extension methods with comparer overloads and mostly deferred execution. <code>Distinct</code> uses equality semantics, <code>GroupBy</code> creates grouped sequences, and <code>Aggregate</code> is a fold whose seed type influences inference.</p></div>
<div class="field-notes"><div class="fn-head">MARGINALIA // THE DEEPER CUT — IN THORNE'S HAND</div>
<p><strong>SelectMany</strong> — flatten a list of lists: 5 pages each yielding a List of quotes → one flat quote stream: <code>outcomes.SelectMany(o =&gt; o.Quotes)</code>. You WILL need this in Chapter XI.</p>
<p><strong>ThenBy</strong> — tie-breakers: <code>.OrderBy(source =&gt; source.Label).ThenBy(source =&gt; source.Url)</code>. LINQ's OrderBy is <em>stable</em>: equal keys retain their original relative order.</p>
<p><strong>Chunk(n)</strong> splits a long sequence into bounded batches. <strong>ToDictionary / ToHashSet</strong> materialize lookup structures: <code>passages.ToDictionary(p =&gt; p.Id)</code> is the verifier's id lookup in one call.</p></div>
'''

