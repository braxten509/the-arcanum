aidPolicy = "learning"
prompt = "<code>passages.First(p =&gt; p.Id == 99)</code> when nothing matches…"
choices = ["returns null", "returns a default Passage", "throws InvalidOperationException", "returns the last passage instead"]
answer = 2
whyWrong = "First with a predicate doesn’t return null or a default when nothing matches — it throws InvalidOperationException; use FirstOrDefault for a safe default."
explain = "<code>First</code> promises that a matching element exists, so an empty match set breaks that promise with <code>InvalidOperationException</code>."
hint = "This is why FirstOrDefault exists."

