[[lessons.exercises]]
id = "s07-l04-w1"
type = "write"
points = 36
required = true
capabilities = ["language-linq-lambdas"]
cognitiveTask = "build"
scaffold = "guided"
contextFamily = "verisearch-s07-deferred-execution-timing"
aidPolicy = "learning"
prompt = "Write an iterator method <code>IEnumerable&lt;string&gt; Scans()</code> that yield-returns \"scan 1\", \"scan 2\", \"scan 3\". Foreach it and print each value."
expect = '''
scan 1
scan 2
scan 3'''
solution = '''
foreach (string scan in Scans()) Console.WriteLine(scan);

IEnumerable<string> Scans()
{
    yield return "scan 1";
    yield return "scan 2";
    yield return "scan 3";
}
'''
hint = "Three yield return statements (or a loop). Method after top-level code."

[[lessons.concepts]]
id = "language-deferred-execution-timing"
purpose = "Know when a LINQ query actually runs, and materialize it once when the answer must stop changing."
anatomy = "A query is a description; enumeration executes it, each new enumeration executes it again, and captured variables are read at execution time rather than at declaration."
example = "A Where whose predicate prints as it runs, enumerated twice to expose the repeat, then a captured minimum changed between declaration and enumeration."
observable = "Nothing prints until the query is enumerated, and materializing it makes the counts that follow stable."
failure = "Passing an unmaterialized query into concurrent work re-runs the whole pipeline per consumer and can fetch the same source twice."
practice = "s07-l04-e1"
