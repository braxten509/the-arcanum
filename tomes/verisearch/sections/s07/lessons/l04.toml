[[lessons]]
id = "s07-l04"
teaches = ["language-deferred-execution-timing"]
title = "Lazy evaluation — LINQ's hidden foot-gun"
body = '''

<p>A LINQ query is a <strong>description of work, not the work</strong>. Nothing runs until something enumerates it:</p>
<pre><code data-kind="replacement"><span class="k">var</span> q = passages.Where(p =&gt; { Console.WriteLine(<span class="s">$"testing {p.Id}"</span>); <span class="k">return</span> p.Text.Length &gt;= 20; });
Console.WriteLine(<span class="s">"query built"</span>);
<span class="c">// output so far: "query built" — the Where has NOT run!</span>

<span class="k">foreach</span> (<span class="k">var</span> passage <span class="k">in</span> q) { }  <span class="c">// NOW "testing ..." prints — enumeration triggers it</span></code></pre>
<p>Consequence #1 — <strong>multiple enumeration</strong> re-runs the whole pipeline:</p>
<pre><code data-kind="replacement"><span class="k">var</span> retained = passages.Where(ExpensiveLengthCheck);
Console.WriteLine(retained.Count());      <span class="c">// runs every check</span>
<span class="k">foreach</span> (<span class="k">var</span> passage <span class="k">in</span> retained) Print(passage); <span class="c">// runs every check AGAIN</span></code></pre>
<p>Fix: materialize once with <code>.ToList()</code> when you'll use results more than once, or when you want the work to happen NOW (e.g., inside a try/catch — a lazy query throws where it's <em>enumerated</em>, not where it's <em>written</em>).</p>
<p>Consequence #2 — <strong>captured variables evaluate late</strong>:</p>
<pre><code data-kind="replacement"><span class="k">int</span> minimum = 20;
<span class="k">var</span> q2 = passages.Where(p =&gt; p.Text.Length &gt;= minimum);
minimum = 80;
<span class="k">var</span> list = q2.ToList();     <span class="c">// filters with 80, not 20 — the lambda reads minimum at RUN time</span></code></pre>
<p>Consequence #3 — laziness is a <em>feature</em> for big data: <code>File.ReadLines(path).Where(...).First()</code> stops reading the file at the first match. Eager <code>ReadAllLines</code> would slurp gigabytes.</p>
<div class="callout">Rule of thumb for Verisearch: INSIDE a pipeline method, stay lazy (return IEnumerable). At the BOUNDARY — returning results to a caller, storing to a field, crossing a try/catch — ToList().</div>
<div class="callout csharp-transfer"><p><strong>C#/.NET transfer:</strong> A variable holding <code>IEnumerable&lt;T&gt;</code> may hold a recipe rather than a snapshot. Each enumeration can rerun source access and lambda code; <code>ToList</code> or <code>ToArray</code> creates a stable materialized boundary when later async work must use one fixed selection.</p></div>
<div class="field-notes"><div class="fn-head">MARGINALIA // THE DEEPER CUT — IN THORNE'S HAND</div>
<p><strong>yield return — build your own lazy sequences:</strong></p>
<pre><code data-kind="replacement">IEnumerable&lt;string&gt; ReadNonBlankLines(string path)
{
    foreach (var line in File.ReadLines(path))   <span class="c">// itself lazy!</span>
    {
        if (!string.IsNullOrWhiteSpace(line)) yield return line;
    }
}</code></pre>
<p>The method body does not run until enumerated, produces one element at a time, and can stop early—<code>ReadNonBlankLines(path).First()</code> reads only as far as the first useful line. This is the machinery under LINQ; the lazy behavior should now feel predictable.</p>
<p><strong>Detecting multiple enumeration:</strong> if a debugger hit inside your Where lambda fires twice as often as expected, you enumerated twice. Materialize at boundaries; profile before optimizing further.</p></div>
'''

[[lessons.readings]]
label = "Microsoft Learn — \"Deferred execution\""
url = "https://learn.microsoft.com/en-us/dotnet/standard/linq/deferred-execution-lazy-evaluation"
essential = false

[[lessons.exercises]]
id = "s07-l04-e1"
type = "mc"
points = 25
required = true
capabilities = ["language-linq-lambdas"]
cognitiveTask = "explain"
scaffold = "guided"
contextFamily = "verisearch-s07-deferred-execution-timing"
aidPolicy = "learning"
prompt = "When does the Where lambda actually execute?"
code = '''
var q = passages.Where(p => p.Text.Length >= 20);
// (A) right here
var list = q.ToList();
// (B) right here'''
choices = ["At point A — when the query is defined", "At compile time", "At point B — when ToList enumerates it", "Never"]
answer = 2
whyWrong = "LINQ is lazy: the Where lambda doesn’t run when defined or at compile time — it runs when ToList enumerates the query."
explain = "The assignment at A stores a query recipe. <code>ToList()</code> at B enumerates that recipe, which is when the predicate finally executes."
hint = "Queries are recipes. ToList is the cooking."

[[lessons.exercises]]
id = "s07-l04-e2"
type = "mc"
points = 25
required = true
capabilities = ["language-linq-lambdas"]
cognitiveTask = "explain"
scaffold = "guided"
contextFamily = "verisearch-s07-deferred-execution-timing"
aidPolicy = "learning"
prompt = "Calling <code>.Count()</code> and then foreach-ing the same un-materialized Where query…"
choices = ["uses a cached result the second time", "throws InvalidOperationException", "is a compile error", "executes the filtering work twice"]
answer = 3
whyWrong = "An un-materialized query re-executes on each enumeration, so Count() then foreach filters twice — call ToList() once to cache it."
explain = "<code>Count()</code> performs one enumeration and <code>foreach</code> performs another; without a materialized list, both passes invoke the <code>Where</code> predicate."
hint = "Each enumeration replays the pipeline from scratch."

