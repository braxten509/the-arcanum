[[lessons]]
id = "s07-l03"
teaches = ["language-methods-scope"]
title = "Extension methods — teach old types new verbs"
body = '''

<p>An <strong>extension method</strong> is a static method that <em>calls like an instance method</em> on the type of its first parameter — marked with <code>this</code>:</p>
<pre><code data-kind="replacement"><span class="k">public static class</span> PassageExtensions
{
    <span class="c">// extends Passage — note the 'this' on the first parameter</span>
    <span class="k">public static bool</span> ContainsExact(<span class="k">this</span> Passage passage, <span class="k">string</span> quote)
    {
        <span class="k">return</span> !<span class="k">string</span>.IsNullOrWhiteSpace(quote)
            &amp;&amp; passage.Text.Contains(quote, StringComparison.Ordinal);
    }
}

<span class="c">// now every Passage has this verb:</span>
<span class="k">bool</span> exact = passage.ContainsExact(proposal.Quote);</code></pre>
<p>Rules: the class must be <code>static</code>, the method must be <code>static</code>, and the first parameter gets <code>this</code>. The compiler rewrites <code>passage.ContainsExact(text)</code> to <code>PassageExtensions.ContainsExact(passage, text)</code>. It is call-site sugar; the deterministic ordinal comparison remains ordinary C#.</p>
<p>You've been using them all along — <strong>every LINQ method is an extension method</strong> on <code>IEnumerable&lt;T&gt;</code>. Which means you can add your own chainable pipeline steps:</p>
<pre><code data-kind="replacement"><span class="k">public static</span> IEnumerable&lt;Passage&gt; WithMinimumLength(
    <span class="k">this</span> IEnumerable&lt;Passage&gt; passages, <span class="k">int</span> minimum)
    =&gt; passages.Where(p =&gt; p.Text.Length &gt;= minimum);

<span class="c">// and now a pipeline reads from left to right:</span>
<span class="k">var</span> retained = passages.WithMinimumLength(20).OrderBy(p =&gt; p.Id);</code></pre>
<div class="callout">The production workshop keeps verification in a named <code>QuoteVerifier</code> class because it also owns deduplication and a maximum count. This extension is a focused syntax specimen, not a second verifier to paste into the project.</div>
<div class="callout csharp-transfer"><p><strong>C#/.NET transfer:</strong> An extension method is static compile-time call syntax, not monkey-patching and not a new virtual member. A real instance method wins over an extension, and the namespace imports in scope determine which extensions the compiler can consider.</p></div>
<div class="field-notes"><div class="fn-head">MARGINALIA // THE DEEPER CUT — IN THORNE'S HAND</div>
<p><strong>Resolution rules:</strong> a REAL instance method always beats an extension with the same name; extensions are found only if their namespace is <code>using</code>-imported. If IntelliSense can't see your extension, check the namespace import first.</p>
<p><strong>Extending interfaces</strong> is the power move: extend <code>IEnumerable&lt;Passage&gt;</code> and every sequence of passages—arrays, lists, lazy queries—gets your verb. That is how LINQ itself works.</p>
<p><strong>When NOT to:</strong> if the method needs private state of the class, it belongs INSIDE the class. Extensions are for verbs composed from the type's public surface. Keep their names concrete so a beginner can predict the comparison before stepping through it.</p></div>
'''

[[lessons.readings]]
label = "Microsoft Learn — \"Extension methods\""
url = "https://learn.microsoft.com/en-us/dotnet/csharp/programming-guide/classes-and-structs/extension-methods"
essential = false

[[lessons.exercises]]
id = "s07-l03-e1"
type = "fill"
points = 25
prompt = "Fill the blank required before an extension method's first parameter type."
code = '''
public static bool ContainsExact(____ string source, string candidate)
{
    return source.Contains(candidate, StringComparison.Ordinal);
}'''
answer = "this"
hint = "One keyword before the first parameter's type."

[[lessons.exercises]]
id = "s07-l03-e2"
type = "mc"
points = 20
prompt = "Extension methods must be declared…"
choices = ["as static methods in a static class", "inside the class they extend", "with the 'extends' keyword", "in Program.cs only"]
answer = 0
whyWrong = "Extension methods aren’t declared inside the extended type or with an ‘extends’ keyword — they’re static methods in a static class with a ‘this’ first parameter."
explain = "The compiler discovers an extension as a <code>static</code> method inside a <code>static</code> class, then uses its <code>this</code>-marked first parameter as the receiver."
hint = "static class, static method, this-param."

[[lessons.exercises]]
id = "s07-l03-e3"
type = "mc"
points = 20
prompt = "Where/Select/OrderBy are actually…"
choices = ["compiler keywords", "extension methods on IEnumerable<T>", "instance methods of List<T>", "SQL statements"]
answer = 1
whyWrong = "Where/Select/OrderBy aren’t keywords, instance methods, or SQL — they’re LINQ extension methods on IEnumerable<T>."
explain = "Because these operators extend <code>IEnumerable&lt;T&gt;</code>, the same <code>Where</code>, <code>Select</code>, and <code>OrderBy</code> vocabulary works on arrays, lists, and lazy sequences."
hint = "That's why ANY enumerable — arrays, Lists, query results — has them."

[[lessons.exercises]]
id = "s07-l03-d1"
type = "type"
points = 14
reps = 2
prompt = "The full extension shape — static class, static method, this-param. Twice."
code = '''
public static class TextExtensions
{
    public static bool ContainsExact(this string source, string candidate)
    {
        return source.Contains(candidate, StringComparison.Ordinal);
    }
}'''

[[lessons.exercises]]
id = "s07-l03-w1"
type = "write"
points = 34
prompt = "Write an extension method <code>bool ContainsOrdinal(this string source, string candidate)</code> using <code>StringComparison.Ordinal</code>. Test <code>\"Exact Words.\"</code> against <code>\"Words.\"</code> and <code>\"words.\"</code>, printing each result."
expect = '''
True
False'''
solution = '''
Console.WriteLine("Exact Words.".ContainsOrdinal("Words."));
Console.WriteLine("Exact Words.".ContainsOrdinal("words."));

public static class TextExtensions
{
    public static bool ContainsOrdinal(this string source, string candidate)
        => source.Contains(candidate, StringComparison.Ordinal);
}
'''
hint = "The first parameter is <code>this string source</code>; call source.Contains(candidate, StringComparison.Ordinal)."

[[lessons.concepts]]
id = "language-methods-scope"
purpose = "Give one transformation a named boundary with deliberate inputs, output, and variable lifetime."
anatomy = "Declare the return type, method name, typed parameters, body, and return path; keep locals inside the narrowest useful scope."
example = "The disposable examples in Extension methods — teach old types new verbs isolate this capability before the learner chooses how it belongs in the cumulative project. The lesson Extension methods — teach old types new verbs supplies the disposable observation point."
observable = "Callers can exercise the behavior from its result without depending on hidden global state. Confirm it while practicing Extension methods — teach old types new verbs."
failure = "A method that reads unrelated globals or has an incomplete return path makes tests and reuse unreliable."
practice = "s07-l03-e1"
