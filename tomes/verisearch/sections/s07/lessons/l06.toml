[[lessons]]
id = "s07-l06"
teaches = ["language-source-selection-resolution"]
title = "Workshop — Make Source Choice Explicit"
body = '''

<p>Source admission is a user-intent boundary. The question explains what evidence the learner wants; it does not secretly choose where the program searches. The source labels supplied by the user must be resolved against the configured catalog before any network operation begins.</p>
<p>Write behavior cases first. Repeated <code>--source</code> options preserve first-request order. Comparison may be case-insensitive if documented. Duplicate requests should have an intentional outcome. An unknown label must name the problem and stop before I/O instead of falling back to all sources. If the user supplies no labels, you may require at least one or deliberately select the configured set—document the choice.</p>
<pre><code data-kind="replacement">var requested = new[] { "Archive", "Guide", "archive" };
var firstOccurrences = requested.Distinct(StringComparer.OrdinalIgnoreCase);</code></pre>
<p>This disposable LINQ fragment illustrates an ordering-preserving operation. It does not dictate how your catalog is indexed or how errors are represented. A dictionary can make lookup explicit; a join can preserve ordering; a small selection object can carry errors. Materialize the final sequence exactly once before later asynchronous work begins.</p>
<p>URI admission belongs beside source policy, not AI relevance. Accept only absolute HTTP or HTTPS addresses for web readers, or introduce a separately explicit local-file source type. Never “repair” an unknown label by asking the model to invent a URL. Never inspect question keywords to choose a catalog entry. Those approaches turn a transparent user choice into rigid or unreviewable routing.</p>
<p>Use a spy reader in a test to prove an unknown label causes zero reads. Use a punctuation-heavy whole question to prove selection is unaffected by its words. Then prove source order survives into the admitted collection.</p>
<div class="callout"><p>The user may be creative about source types and CLI syntax. The non-negotiable product promise is that source authority remains explicit and observable.</p></div>
<div class="callout csharp-transfer"><p><strong>C#/.NET transfer:</strong> Use the same <code>StringComparer</code> for catalog uniqueness, dictionary lookup, and requested-label matching. In .NET, comparison policy is a first-class object; making it explicit prevents one boundary from being ordinal while another silently becomes case-insensitive.</p></div>
<div class="field-notes"><div class="fn-head">FIELD NOTES // NEGATIVE OBSERVATION</div><p>“No I/O happened” is an observable result when the test double counts calls. It is stronger than merely asserting that an exception was thrown.</p></div>
'''

