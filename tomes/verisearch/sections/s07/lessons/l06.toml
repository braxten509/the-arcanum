[[lessons.exercises]]
id = "s07-l06-w1"
type = "write"
points = 38
required = true
capabilities = ["language-collections-generics"]
cognitiveTask = "build"
scaffold = "guided"
contextFamily = "verisearch-s07-source-selection-resolution"
aidPolicy = "learning"
prompt = "From the starter's configured labels, select the requested labels case-insensitively, remove duplicates, and print one summary line in request order."
starter = '''var configured = new List<string> { "RFC", "NIST", "RFC" };
var requested = new List<string> { "nist", "rfc" };

Console.WriteLine("NOT SELECTED");
'''
expect = "selected=NIST,RFC"
solution = '''var configured = new List<string> { "RFC", "NIST", "RFC" };
var requested = new List<string> { "nist", "rfc" };

var selected = requested
    .Select(label => configured.First(item => item.Equals(label, StringComparison.OrdinalIgnoreCase)))
    .Distinct(StringComparer.OrdinalIgnoreCase);

Console.WriteLine($"selected={string.Join(",", selected)}");
'''
hint = "Map each request with First plus Equals(...OrdinalIgnoreCase), Distinct, then string.Join the selected values."

[[lessons.concepts]]
id = "language-source-selection-resolution"
purpose = "Resolve the source labels the seeker asked for against the catalog, before any network work begins."
anatomy = "Requested labels are matched under one documented comparison, first-request order is preserved, unknown labels are rejected, and repeats collapse deliberately."
example = "A requested label list reduced under an explicit case-insensitive comparer so the first spelling wins and the duplicate is dropped."
observable = "A spy proves an unknown label causes zero reads, and rewording the question does not change which sources are selected."
failure = "Letting question words influence source choice hands relevance policy to the tool and takes it away from the seeker."
practice = "s07-l06-e1"
