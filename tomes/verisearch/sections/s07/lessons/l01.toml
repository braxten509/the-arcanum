[[lessons]]
id = "s07-l01"
teaches = ["language-linq-lambdas"]
title = "Lambdas & delegates — functions are values"
body = '''

<p>In C#, a function can be stored in a variable, passed as an argument, and called later. The types that hold them are <strong>delegates</strong>, and the three built-in families cover nearly everything:</p>
<pre><code data-kind="replacement"><span class="c">// Func&lt;in..., out&gt; — takes args, RETURNS a value (last type param = return type)</span>
Func&lt;SourceSpec, <span class="k">bool</span>&gt; isWeb = source =&gt; source.Kind == SourceKind.Web;
Func&lt;<span class="k">string</span>, <span class="k">int</span>, <span class="k">bool</span>&gt; longerThan = (text, n) =&gt; text.Length &gt; n;

<span class="c">// Action&lt;in...&gt; — takes args, returns NOTHING (side effects)</span>
Action&lt;<span class="k">string</span>&gt; log = msg =&gt; Console.WriteLine(<span class="s">$"[source] {msg}"</span>);

<span class="c">// Predicate&lt;T&gt; — takes T, returns bool (mostly legacy; Func&lt;T,bool&gt; preferred)</span>
Predicate&lt;<span class="k">int</span>&gt; isPositive = n =&gt; n &gt; 0;

Console.WriteLine(isWeb(source));       <span class="c">// call it like any method</span>
log(<span class="s">"policy ready"</span>);</code></pre>
<p>Lambda anatomy: <code>(parameters) =&gt; expression-or-block</code>.</p>
<pre><code data-kind="replacement">x =&gt; x * 2                        <span class="c">// one param, expression body</span>
(a, b) =&gt; a + b                   <span class="c">// two params need parens</span>
x =&gt; { <span class="k">var</span> y = x * 2; <span class="k">return</span> y; } <span class="c">// block body needs return</span></code></pre>
<p>Why this matters: every LINQ method is a method that takes a function. <code>Where(source =&gt; source.Kind == SourceKind.Web)</code> means “run this test for each configured source and keep the true ones.” Lambdas describe transformations without turning source authority or quote truth into a hand-written score.</p>
<pre><code data-kind="replacement"><span class="k">var</span> webSources = config.Sources
    .Where(source =&gt; source.Kind == SourceKind.Web)
    .ToList();</code></pre>
<p>Lambdas also <strong>capture</strong> variables from the surrounding scope (a "closure"):</p>
<pre><code data-kind="replacement"><span class="k">var</span> requested = <span class="k">new</span> HashSet&lt;<span class="k">string</span>&gt;(labels, StringComparer.OrdinalIgnoreCase);
<span class="k">var</span> keep = config.Sources.Where(source =&gt; requested.Contains(source.Label));</code></pre>
<div class="callout csharp-transfer"><p><strong>C#/.NET transfer:</strong> A C# lambda is converted according to its target type—commonly a delegate, and sometimes an expression tree. Captured locals are lifted into a compiler-generated closure object, so capture can extend lifetime and observe later mutation rather than freezing a value automatically.</p></div>
<div class="field-notes"><div class="fn-head">MARGINALIA // THE DEEPER CUT — IN THORNE'S HAND</div>
<p><strong>The loop-capture trap</strong> — the classic closure bug: lambdas created in a loop all capture the SAME variable in old C# <code>for</code> loops. Modern <code>foreach</code> gives each iteration a fresh variable, so <code>foreach (var u in urls) tasks.Add(Scrape(u));</code> is safe — but if a captured value must be frozen, copy it to a local first.</p>
<p><strong>Method groups:</strong> when a lambda just forwards to a method—<code>sources.Where(source =&gt; IsWeb(source))</code>—you can pass the method name directly: <code>sources.Where(IsWeb)</code>. Cleaner, same behavior.</p>
<p><strong>Static lambdas:</strong> <code>static x =&gt; x * 2</code> — the compiler guarantees no capture, no allocation. A micro-optimization to recognize, not chase.</p></div>
'''

[[lessons.readings]]
label = "Microsoft Learn — \"Lambda expressions\""
url = "https://learn.microsoft.com/en-us/dotnet/csharp/language-reference/operators/lambda-expressions"
essential = false

[[lessons.exercises]]
id = "s07-l01-e1"
type = "mc"
points = 20
prompt = "Which delegate type fits: takes a SourceSpec, returns a bool?"
choices = ["Action<SourceSpec>", "Func<bool, SourceSpec>", "Func<SourceSpec, bool>", "Predicate<double>"]
answer = 2
whyWrong = "Action returns void, the second Func reverses input and output, and Predicate<double> accepts the wrong input type."
explain = "<code>Func&lt;SourceSpec, bool&gt;</code> names the input first and the returned boolean last, matching a configured-source test."
hint = "In Func, the LAST type parameter is the return type."

[[lessons.exercises]]
id = "s07-l01-e2"
type = "mc"
points = 20
prompt = "The key difference between Func and Action:"
choices = ["Func is faster", "Action returns a value, Func doesn't", "Action can't take parameters", "Func returns a value, Action returns void"]
answer = 3
whyWrong = "It’s not speed or parameters — Func returns a value and Action returns void; both can take parameters."
explain = "Choose <code>Func</code> when later code needs a returned result; choose <code>Action</code> for a side effect such as writing a log line."
hint = "Action = side effects only."

[[lessons.exercises]]
id = "s07-l01-e3"
type = "mc"
points = 25
prompt = "What does <code>f(4)</code> return?"
code = '''
int factor = 3;
Func<int, int> f = x => x * factor;
factor = 10;
Console.WriteLine(f(4));'''
choices = ["40", "12", "4", "Compile error — factor can't change"]
answer = 0
whyWrong = "Apply the captured factor to 4: the lambda returns 40 — the captured variable is usable, so it isn’t a compile error."
explain = "The closure reads <code>factor</code> when <code>f(4)</code> runs. By then the vessel holds 10, so the call computes <code>4 * 10</code>."
hint = "Closures capture the VARIABLE, not a snapshot of its value."

[[lessons.exercises]]
id = "s07-l01-d1"
type = "type"
points = 14
reps = 2
prompt = "One Func, one Action, one call each. Twice — delegate syntax must be automatic before the LINQ arsenal."
code = '''
string sample = "Exact source passage.";
Func<string, bool> isLong = text => text.Length >= 20;
Action<string> log = msg => Console.WriteLine($"[source] {msg}");
log($"long enough: {isLong(sample)}");'''

[[lessons.exercises]]
id = "s07-l01-w1"
type = "write"
points = 32
prompt = "Declare <code>Func&lt;int, int&gt; overclock = x =&gt; x * 2;</code> and print the result of applying it TWICE to 3 (function composition by nesting the calls)."
expect = "12"
solution = '''
Func<int, int> overclock = x => x * 2;
Console.WriteLine(overclock(overclock(3)));
'''
hint = "Console.WriteLine(overclock(overclock(3)));"

[[lessons.concepts]]
id = "language-linq-lambdas"
purpose = "Transform collections declaratively while understanding when a sequence actually executes."
anatomy = "Write a lambda parameter and expression, compose the needed LINQ operators, then materialize once at the boundary that needs stable data."
example = "The disposable examples in Lambdas & delegates — functions are values isolate this capability before the learner chooses how it belongs in the cumulative project. The lesson Lambdas & delegates — functions are values supplies the disposable observation point."
observable = "The resulting sequence has the expected order and contents and is enumerated at a deliberate time. Confirm it while practicing Lambdas & delegates — functions are values."
failure = "Capturing mutable state or enumerating a deferred query repeatedly can change results between observations."
practice = "s07-l01-e1"
