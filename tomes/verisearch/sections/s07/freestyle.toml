[freestyle]
title = "THE WORKING: SOURCE ADMISSION WITHOUT KEYWORD ROUTING"
brief = '''
<p><strong>Outcome:</strong> Honor source labels selected by the user, preserving order and rejecting unknown entries before networking.</p><p>Author the project edits yourself. The hidden replay proves one possible implementation, but it is never shown and does not define your architecture.</p><ul><li>Resolve source labels explicitly supplied by the user against the catalog before networking begins.</li><li>Choose and document duplicate and no-label behavior while preserving first-request order and rejecting unknown labels.</li><li>Use LINQ and lambdas deliberately, then materialize the admitted collection once before asynchronous work.</li><li>Prove with a spy that an unknown source causes zero reads and that changing question words does not change source selection.</li><li>Keep safe URI admission and optional local-file support explicit; never ask AI or keyword rules to invent a source.</li></ul>
'''
