[freestyle]
title = "THE WORKING: The Source Admission Ward"
requires = ["json-config", "lambdas-delegates", "linq-advanced", "extension-methods", "deferred-execution", "uri-validation", "source-policy"]
brief = "Add <code>SourcePolicy.cs</code> to the evolving project.<ul><li>Accept only <code>SourceSpec</code> values already present in the validated <code>AppConfig</code>. When <code>--source LABEL</code> values are supplied, match those labels case-insensitively; when none are supplied, select all configured sources.</li><li>Validate web URLs as absolute HTTP/HTTPS and fixture URLs as <code>mock://</code>. Reject malformed entries before fetching.</li><li>Deduplicate exact URLs case-insensitively and materialize once with <code>ToList</code>. Preserve configuration order in all-sources mode and user request order in explicit mode.</li><li>If a requested label is absent, stop with a message naming it. Never search for a substitute, infer a domain score, or ask Ollama which source is authoritative.</li><li>Demonstrate all-sources mode, two-label ordering, duplicate URLs, and an unknown label with local records.</li><li>Run <code>dotnet build</code> before wiring this policy into later networking.</li></ul>"
reward = 450
packages = []
xray = "THORNE requests one mixed-case label, repeats a URL, adds a malformed web address, and names a source not in config. He expects a small deterministic policy—not search, guessed trust, or a silent substitute."

[freestyle.badge]
id = "badge-s07"
name = "KEEPER OF THE SHELVES"
desc = "Bound the working to sources the seeker actually chose."

[[freestyle.rubric]]
criterion = "Configured-only admission"
weight = 25
desc = "Every selected source originates in AppConfig; unknown requested labels produce a clear failure."

[[freestyle.rubric]]
criterion = "URI rules"
weight = 20
desc = "Web and LocalFixture kinds enforce their distinct absolute URI schemes before fetching."

[[freestyle.rubric]]
criterion = "LINQ boundary"
weight = 20
desc = "Selection, case-insensitive URL deduplication, stable input ordering, and one final ToList are readable and not multiply enumerated."

[[freestyle.rubric]]
criterion = "Trust ownership"
weight = 20
desc = "No discovered substitute, inferred domain authority, or AI-authored trust enters the selected list."

[[freestyle.rubric]]
criterion = "C# craft"
weight = 15
desc = "PascalCase types and methods, camelCase locals, four-space indentation, Allman braces, and short policy helpers."
