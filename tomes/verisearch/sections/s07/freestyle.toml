[[freestyle.referenceSteps]]
id = "s07-write-source-selection"
path = "src/Verisearch/SourceSelection.cs"
mode = "write"
instruction = "Private replay resolves explicit user labels in order and rejects unknown labels before I/O."
content = '''
namespace Verisearch;

public static class SourceSelection
{
    public static IReadOnlyList<SourceSpec> Select(
        IReadOnlyList<SourceSpec> catalog,
        IReadOnlyList<string> requestedLabels)
    {
        if (requestedLabels.Count == 0)
        {
            return catalog.ToList();
        }

        var byLabel = catalog.ToDictionary(source => source.Label, StringComparer.OrdinalIgnoreCase);
        var selected = new List<SourceSpec>();
        var seen = new HashSet<string>(StringComparer.OrdinalIgnoreCase);
        foreach (string requested in requestedLabels)
        {
            if (!byLabel.TryGetValue(requested, out SourceSpec? source))
            {
                throw new InvalidOperationException($"source is not in the chosen catalog: {requested}");
            }
            if (seen.Add(source.Label))
            {
                selected.Add(source);
            }
        }
        return selected;
    }
}
'''
