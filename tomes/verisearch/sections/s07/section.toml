id = "s07"
codename = "CHAPTER VII // THE CHOSEN SHELVES"
short = "The Chosen Shelves"
title = "The Chosen Shelves — LINQ & Source Policy"
build = "The admission ward — configured sources in, unchosen addresses out"
brief = "A truthful quotation can still come from a source the seeker never meant to consult. Here lambdas, LINQ, extension methods, deferred execution, and <code>Uri</code> become practical tools for one narrow policy: admit only configured or explicitly named sources. The user owns trust; the AI neither discovers sources nor invents authority."
