[[lessons.exercises]]
id = "s01-l04-w1"
type = "write"
points = 32
required = true
capabilities = ["language-methods-scope"]
cognitiveTask = "build"
scaffold = "guided"
contextFamily = "verisearch-s01-console-text-boundary"
aidPolicy = "learning"
prompt = "Your working receives one line by whisper: a visitor's name. Hear it (utter no prompt!) and speak exactly two lines: <code>WHO KNOCKS: &lt;name&gt;</code> then <code>the door opens</code>."
stdin = "THORNE"
expect = '''
WHO KNOCKS: THORNE
the door opens'''
solution = '''
string name = Console.ReadLine() ?? "";
Console.WriteLine($"WHO KNOCKS: {name}");
Console.WriteLine("the door opens");
'''
hint = "string name = Console.ReadLine() ?? \"\"; then two WriteLines (or one with \\n)."

[[lessons.concepts]]
id = "language-console-text-boundary"
purpose = "Move text across the terminal boundary: prompt without a newline, read one entered line, and treat the end of input as a real outcome."
anatomy = "Console.Write prints without advancing, Console.WriteLine ends the line, and Console.ReadLine returns a nullable string because a closed input stream yields null rather than text."
example = "A prompt written with Console.Write, the reply captured with a null-coalescing default, and the same reply echoed back through interpolation."
observable = "The prompt and the caret stay on one line, typed text is echoed exactly, and Ctrl+D ends the exchange without an unhandled exception."
failure = "Treating the read value as a plain string crashes the moment input closes, and trimming or reflowing the reply silently changes the seeker's question."
practice = "s01-l04-e1"

[[lessons.concepts]]
id = "language-helper-method-extraction"
purpose = "Lift one repeated console step into a named helper so the entry file states what happens instead of how it is spelled."
anatomy = "The helper names its input as a parameter, returns one value, and is called by name; the caller keeps the decision while the helper keeps the mechanics."
example = "The prompt-and-ward pair extracted into a static Ask method taking the prompt text, then called twice for two different questions."
observable = "Both call sites read as one line of intent, and changing the fallback inside the helper changes every caller at once."
failure = "Copying the prompt-and-ward pair a third time leaves three places to repair, and the entry file grows faster than the behavior does."
practice = "s01-l04-e4"
