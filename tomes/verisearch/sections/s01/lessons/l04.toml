[[lessons.exercises]]
id = "s01-l04-w1"
type = "write"
points = 32
required = true
capabilities = ["language-methods-scope"]
cognitiveTask = "build"
scaffold = "guided"
contextFamily = "verisearch-s01-methods-scope"
aidPolicy = "learning"
prompt = "Your working receives one line by whisper: a visitor's name. Hear it (utter no prompt!) and speak exactly two lines: <code>WHO KNOCKS: &lt;name&gt;</code> then <code>the door opens</code>."
stdin = "THORNE"
expect = '''
WHO KNOCKS: THORNE
the door opens'''
solution = '''
string name = Console.ReadLine() ?? "";
Console.WriteLine($"WHO KNOCKS: {name}");
Console.WriteLine("the door opens");
'''
hint = "string name = Console.ReadLine() ?? \"\"; then two WriteLines (or one with \\n)."

[[lessons.concepts]]
id = "language-methods-scope"
purpose = "Give one transformation a named boundary with deliberate inputs, output, and variable lifetime."
anatomy = "Declare the return type, method name, typed parameters, body, and return path; keep locals inside the narrowest useful scope."
example = "The disposable examples in Speaking through the stone — console I/O isolate this capability before the learner chooses how it belongs in the cumulative project. The lesson Speaking through the stone — console I/O supplies the disposable observation point."
observable = "Callers can exercise the behavior from its result without depending on hidden global state. Confirm it while practicing Speaking through the stone — console I/O."
failure = "A method that reads unrelated globals or has an incomplete return path makes tests and reuse unreliable."
practice = "s01-l04-e1"
