[[lessons.exercises]]
id = "s01-l04-e1"
type = "text"
points = 20
required = true
capabilities = ["language-methods-scope"]
cognitiveTask = "recall"
scaffold = "guided"
contextFamily = "verisearch-s01-console-text-boundary"
aidPolicy = "learning"
prompt = "Which calling hears one line of the seeker's voice from the console? (just the method name, no parentheses needed)"
answer = "Console.ReadLine"
accept = ["readline", "console.readline()", "readline()"]
hint = "It returns a string? and waits for Enter."

[[lessons.exercises]]
id = "s01-l04-e2"
type = "mc"
points = 20
required = true
capabilities = ["language-methods-scope"]
cognitiveTask = "explain"
scaffold = "guided"
contextFamily = "verisearch-s01-console-text-boundary"
aidPolicy = "learning"
prompt = "What divides <code>Console.Write</code> from <code>Console.WriteLine</code>?"
choices = ["Write is for numbers, WriteLine for text", "Write is asynchronous", "WriteLine adds a newline at the end; Write doesn't", "WriteLine can only print string literals"]
answer = 2
whyWrong = "The difference isn’t type or async — WriteLine appends a trailing newline and Write doesn’t; both handle numbers and strings alike."
hint = "One of them leaves the quill on the same line — perfect for prompts."
explain = "<code>Console.WriteLine</code> writes its value and then moves to a new line; <code>Console.Write</code> leaves the cursor on the current line, which is why it suits a prompt."

