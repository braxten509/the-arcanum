[[lessons.concepts]]
id = "language-project-toolchain"
purpose = "Raise, build, and run a .NET console project from the command line so every later Verisearch experiment has somewhere to live."
anatomy = "dotnet new console writes a csproj and Program.cs, dotnet build compiles that metadata into an assembly, and dotnet run does both before launching the result."
example = "A throwaway project raised with dotnet new console -n Verisearch, then the generated csproj read line by line for its SDK, output type, and target framework."
observable = "dotnet run prints the program text, and dotnet --version names the SDK that compiled it."
failure = "Running the command in the wrong folder, or committing the obj and bin output as if it were source, produces a tree that cannot be rebuilt from a clean clone."
practice = "s01-l01-e1"
