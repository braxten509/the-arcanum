prompt = "<code>dotnet run</code> does what?"
choices = ["Only forges the working", "Forges the working if needed, then casts it", "Only casts a previously forged binary", "Sends your runes away to Microsoft"]
answer = 1
whyWrong = "‘dotnet run’ isn’t only-build or only-run: it compiles when needed AND executes in one step — that’s why you lean on it while developing."
hint = "It's the forge-and-go command you'll speak hundreds of times."
explain = "<code>dotnet run</code> checks whether the project needs compiling, builds it when necessary, and then launches the resulting program."

