contextFamily = "verisearch-s01-project-toolchain"
aidPolicy = "learning"
prompt = "Which word of command raises a brand-new console working named <code>Verisearch</code>?"
choices = ["dotnet new console -n Verisearch", "dotnet build Verisearch", "dotnet create --console Verisearch", "csharp init Verisearch"]
answer = 0
whyWrong = "‘build’ compiles an existing project and the other two aren’t real commands — ‘dotnet new console -n <name>’ is what scaffolds a brand-new project."
hint = "The template kind is \"console\" and -n names it."
explain = "dotnet new <template> -n <name> raises new workings."

