[freestyle]
title = "THE WORKING: C# STARTS HERE"
brief = '''
<p><strong>Outcome:</strong> Create the solution and a small question-listening console without receiving production code.</p><p>Author the project edits yourself. The hidden replay proves one possible implementation, but it is never shown and does not define your architecture.</p><ul><li>Create a solution and console application from the blank editor scaffold; choose sensible project and namespace names and keep generated output out of authored source.</li><li>Author a small question-listening path that handles a missing line, displays the entered text, and exits intentionally.</li><li>Use nullable annotations, typed locals, one helper method, and a branch or loop you can explain from input to output.</li><li>Build from the solution root, deliberately introduce one compiler error, read the first diagnostic, repair only that cause, and build cleanly again.</li><li>Keep lesson snippets disposable: the learner-owned entrypoint must be written from the behavior above, not copied from a hidden production file.</li></ul>
'''
requires = ["language-project-toolchain", "language-namespaces-modularity", "language-types-nullability", "language-console-text-boundary", "language-helper-method-extraction", "language-control-flow"]
reward = 315
xray = "The grader inspects saved C# and project metadata, runs the chapter proof and cumulative regressions, changes a load-bearing input, and checks the observable chapter contract: The solution builds and the console path accepts, displays, and exits from learner-provided text without crashing on missing input."

[[freestyle.requirements]]
id = "s01-toolchain-ownership"
text = "Create a solution and console application from the blank editor scaffold; choose sensible project and namespace names and keep generated output out of authored source."
essential = true
capabilities = ["language-project-toolchain", "language-namespaces-modularity", "language-types-nullability", "language-methods-scope", "language-control-flow"]

[[freestyle.requirements]]
id = "s01-typed-input-behavior"
text = "Author a small question-listening path that handles a missing line, displays the entered text, and exits intentionally."
essential = false
capabilities = ["language-project-toolchain", "language-namespaces-modularity", "language-types-nullability", "language-methods-scope", "language-control-flow"]

[[freestyle.requirements]]
