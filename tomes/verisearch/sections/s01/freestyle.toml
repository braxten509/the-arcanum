[[freestyle.referenceSteps]]
id = "s01-write-solution"
path = "Verisearch.slnx"
mode = "write"
instruction = "Private replay creates the minimal app-only solution container."
content = '''
<Solution>
  <Folder Name="/src/">
    <Project Path="src/Verisearch/Verisearch.csproj" />
  </Folder>
</Solution>
'''
[[freestyle.referenceSteps]]
id = "s01-write-app-project"
path = "src/Verisearch/Verisearch.csproj"
mode = "write"
instruction = "Private replay creates strict nullable C# project metadata."
content = '''
<Project Sdk="Microsoft.NET.Sdk">
  <PropertyGroup>
    <OutputType>Exe</OutputType>
    <TargetFramework>net10.0</TargetFramework>
    <ImplicitUsings>enable</ImplicitUsings>
    <Nullable>enable</Nullable>
    <TreatWarningsAsErrors>true</TreatWarningsAsErrors>
  </PropertyGroup>
</Project>
'''
[[freestyle.referenceSteps]]
id = "s01-rewrite-entry"
path = "src/Verisearch/Program.cs"
mode = "rewrite"
instruction = "Private replay replaces the blank scaffold with the first buildable learner entrypoint."
preserves = "all-active"
content = '''
Console.WriteLine("Verisearch learner project is ready.");
'''
