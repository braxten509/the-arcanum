[freestyle]
title = "THE WORKING: The Listening Vestibule"
requires = ["dotnet-project", "top-level-statements", "csharp-types", "console-io", "input-loop"]
brief = "Turn <code>Program.cs</code> into the tome's front door — the mouth that will one day speak true quotes.<ul><li>Greets the seeker when it wakes</li><li>Prompts with <code>&gt; </code> and hears questions in a loop</li><li>Echoes each question back in quotes, with a \"(The question is heard — the deeper magic is not yet bound)\" note</li><li>Bows out politely on <code>quit</code></li><li>Prove it with the WHISPER box (e.g. <code>What are the TLS 1.3 cipher suites?\\nquit</code>)</li></ul>"
reward = 200
packages = []
xray = "THORNE strikes gold from the tally for: dying at Ctrl+D (a null ReadLine), quit that only answers to exact lowercase, a missing > prompt (he feeds it whispers and reads the transcript), and a waking line buried inside the loop so it repeats every turn. He grants favor for a `?? \"\"` guard and for 'continue' on empty lines."

[freestyle.badge]
id = "badge-s01"
name = "THE FIRST FLAME"
desc = "Lit the vestibule — the front door of the whole tome."

[[freestyle.rubric]]
criterion = "It takes the flame & runs"
weight = 25
desc = "dotnet build succeeds; the working runs without collapsing on ordinary input."

[[freestyle.rubric]]
criterion = "The listening loop holds"
weight = 25
desc = "Prompt loop works; quit exits cleanly (case/space tolerant); empty lines handled."

[[freestyle.rubric]]
criterion = "It speaks as commissioned"
weight = 20
desc = "Waking line, quoted echo, 'not yet bound' note, parting word."

[[freestyle.rubric]]
criterion = "String craft"
weight = 15
desc = "Uses interpolation ($\"...\"), Trim/ToLower where fitting, null-safe ReadLine."

[[freestyle.rubric]]
criterion = "A fair hand"
weight = 15
desc = "Names follow C# convention (camelCase locals, PascalCase for any methods/types); each brace on its own line (Allman, the C# standard); even indentation; no dead runes left on the page."
