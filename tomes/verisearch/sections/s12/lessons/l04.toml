
[[lessons]]
id = "s12-l04"
teaches = ["language-execution-trace-diagnosis"]
title = "Trace an Unknown Starter Before Editing"
body = '''
<p>The assigned starter is buildable and intentionally incomplete. Treat that as evidence. The compiler has already established that project metadata, syntax, and declared names can coexist. Your first task is therefore not to rewrite it; it is to trace the ordinary and failing paths with one concrete input each.</p>
<p>Read from the entrypoint downward. Mark where external text becomes a typed value, where a branch admits or rejects it, where state changes, and where output is composed. For a loop, write the value of its condition before the first iteration and after the last useful iteration. For a collection, note whether order, uniqueness, or key lookup is part of the public promise. This short trace prevents random edits from destroying a useful scaffold.</p>
<pre><code data-kind="pseudocode">line read
  -> parse succeeds?
     -> yes: update accepted state
     -> no: apply the named failure policy
  -> render the observable summary</code></pre>
<p>Run the public example once before editing. Then run one edge that is explicitly named in the brief. Record actual output and the first point where it differs from the contract. That point, not the last ugly line on screen, owns the first repair. If the program accepts malformed input, inspect the admission branch. If it loses prior valid state, inspect the mutation boundary. If ordering changes, inspect materialization and comparison rather than terminal formatting alone.</p>
<p>Make the smallest edit that can falsify your diagnosis, then rerun both cases. A broad rewrite erases the causal evidence and can accidentally solve only the visible example. A focused change preserves the starter's useful facts while showing which rule you understood. Once behavior is green, refactor only if the new structure makes the public contract easier to verify.</p>
<div class="callout"><p>Trace, predict, edit, and rerun. The order matters because a passing result without a prior prediction is weak evidence of understanding.</p></div>
<div class="field-notes"><div class="fn-head">FIELD NOTES // CONTROL IS A STATE CLAIM</div><p>Every branch says which state may cross it; every loop says what becomes closer to termination. Write those claims in plain language before altering unfamiliar code.</p></div>
'''

