[[lessons.exercises]]
id = "s12-l04-w1"
type = "write"
points = 35
required = true
capabilities = ["language-control-flow"]
cognitiveTask = "debug"
scaffold = "independent"
contextFamily = "verisearch-s12-execution-trace-diagnosis"
aidPolicy = "limited"
prompt = "Repair a loop over <code>new[] { 3, -1, 4 }</code> so it preserves the two nonnegative values, counts one rejection, terminates, and prints exactly <code>kept=2 rejected=1</code>."
expect = "kept=2 rejected=1"
solution = '''
int kept = 0;
int rejected = 0;
foreach (int value in new[] { 3, -1, 4 })
{
    if (value >= 0) kept++;
    else rejected++;
}
Console.WriteLine($"kept={kept} rejected={rejected}");
'''
hint = "Advance with foreach and update exactly one counter on each branch."

[[lessons.concepts]]
id = "language-execution-trace-diagnosis"
purpose = "Trace an unfamiliar starter from its entry point before editing it, and let the compiler and tests locate the gap."
anatomy = "Read from the entry point downward, marking where external text becomes typed, where a branch admits or rejects, where state changes, and where output happens."
example = "A trace written as a chain from one line read through parse, admit, and print, with the missing behavior named as a position in that chain."
observable = "The first edit lands where the trace says behavior is missing, and the earliest failing diagnostic points at it."
failure = "Rewriting a buildable starter discards the evidence that its metadata, syntax, and declared names already agree."
practice = "s12-l04-e1"
