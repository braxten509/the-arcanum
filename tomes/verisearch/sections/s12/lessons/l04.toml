[[lessons]]
id = "s12-l04"
teaches = ["release-docs"]
title = "Document the Exact Product, Requirements, and Limits"
body = '''
<p>A stranger should understand Verisearch before installing anything. Write <code>README.md</code> in this order:</p>
<pre><code># Verisearch

One paragraph: local AI proposes precise evidence from user-chosen pages;
C# prints only exact substrings and attaches source-owned citations.

## Example
## Install and requirements
## Quick start
## Configuration
## How proposal and verification work
## Mock mode
## Limitations
## Test and publish</code></pre>
<p>The example shows the command and representative output with a complete quote, source label, URL, and passage id. State that live mode requires Ollama plus the configured model and that source pages come from <code>~/.verisearch/config.json</code>. Include a minimal valid JSON configuration that the learner actually tested.</p>
<p>The “How it works” section must preserve the trust boundary in plain language:</p>
<ol><li>The user chooses sources.</li><li>C# fetches and normalizes visible HTML text into passages.</li><li>Ollama proposes contiguous quote substrings and passage ids.</li><li>C# rejects anything not found exactly with ordinal comparison.</li><li>C# copies label and URL from its own passage record.</li></ol>
<p>Document mock mode as a deterministic fixture for learning and tests, not an offline relevance algorithm. Its output is labeled and may select an entire fixture passage. Live failure never enables it automatically.</p>
<p>Be equally clear about limits: HTML whitespace is normalized; client-rendered JavaScript content may not be present; paywalled or authenticated pages are unsupported; configured trust is a user preference, not a fact-check; exact source presence does not prove the source itself is correct; no search/discovery service is built in; and local models can miss relevant passages.</p>
<p><code>--help</code> prints the same usage grammar as the README. Run every copied command. A documentation example that never worked is another fabricated output.</p>
<div class="callout">The product guarantees source containment and attribution ownership—not universal truth, exhaustive research, or credibility scoring. Precise limits make the real guarantee stronger.</div>
<div class="field-notes"><div class="fn-head">MARGINALIA // REPRODUCIBLE EXAMPLES</div><p>Use a public stable document for a live example and a bundled/local HTML fixture for mock. Mark representative output as such, record the model tag, and avoid claiming identical model selection across machines.</p></div>
'''

[[lessons.readings]]
label = "Microsoft Learn — Create a README for a .NET repository"
url = "https://learn.microsoft.com/en-us/contribute/content/how-to-write-use-markdown"
essential = false

[[lessons.exercises]]
id = "s12-l04-e1"
type = "mc"
points = 20
prompt = "What should follow the one-paragraph README pitch?"
choices = ["A concrete command and representative verified-output example", "The entire source code", "A marketing comparison", "A hidden limitations footnote"]
answer = 0
whyWrong = "Code dumps, comparisons, and buried caveats do not show a user the shortest successful path."
explain = "A tested example makes the promised behavior tangible before setup detail."
hint = "Show the destination before the map."

[[lessons.exercises]]
id = "s12-l04-e2"
type = "mc"
points = 20
prompt = "A useful <code>--help</code> description for <code>--mock</code> should explain…"
choices = ["Only its data type", "What behavior it selects and that output is a labeled fixture", "The implementation's line count", "Nothing; the name is enough"]
answer = 1
whyWrong = "Types and code size do not tell users the behavioral consequence, while the name alone can be mistaken for an automatic fallback."
explain = "CLI help should answer what changes and when to use it."
hint = "Describe semantics, not syntax alone."

[[lessons.exercises]]
id = "s12-l04-e3"
type = "mc"
points = 20
prompt = "Which limitation must the README state?"
choices = ["Exact substring verification proves every source is correct", "Verisearch includes web-wide search", "Exact presence does not establish source credibility or completeness", "Mock mode is equivalent to Ollama"]
answer = 2
whyWrong = "The other claims overstate or misdescribe the product. Exact matching proves provenance within extracted text, not external truth."
explain = "User-owned source selection and transparent limits remain necessary."
hint = "Separate quotation integrity from source correctness."

[[lessons.exercises]]
id = "s12-l04-d1"
type = "type"
points = 14
reps = 2
prompt = "Retype the five-step trust boundary twice."
code = '''1. User chooses sources.
2. C# extracts stable passages.
3. Ollama proposes exact substrings.
4. C# verifies ordinal containment.
5. C# attaches source-owned citations.'''
