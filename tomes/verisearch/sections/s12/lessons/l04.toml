capabilities = ["language-control-flow"]
cognitiveTask = "explain"
scaffold = "guided"
contextFamily = "verisearch-s12-execution-trace-diagnosis"
aidPolicy = "limited"
prompt = "The starter builds but mishandles one invalid record. Where should diagnosis begin?"
choices = ["Rewrite every file", "The first admission or parsing branch where actual behavior diverges", "The final console color", "The hidden reference"]
answer = 1
whyWrong = "A scoped diagnosis starts at the earliest broken boundary and preserves useful evidence."
hint = "Find the first point where the trace differs from the contract."
explain = "The earliest divergence is more causal than a downstream symptom."

