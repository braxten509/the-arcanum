[[lessons]]
id = "s12-l05"
teaches = ["language-testing-debugging"]
title = "Acceptance Journey — Prove Every Boundary from the Entrypoint"
body = '''

<p>The final acceptance journey proves the program from its public boundaries. Run it after the creative extension and rationale are complete, and record exact commands plus concise observations.</p>
<ol><li><strong>Build and tests:</strong> restore, build the solution, and run all unit and integration tests from documented locations.</li><li><strong>Whole question:</strong> use punctuation and multiple words; prove the configured AI adapter received it as one value.</li><li><strong>User source choice:</strong> select two catalog labels in a deliberate order, then challenge an unknown label and prove zero source reads.</li><li><strong>Stable extraction:</strong> run a nested fixture twice and compare passage text, ids, and duplicate count.</li><li><strong>Real AI:</strong> configure a local, hosted, API, or CLI model of your choice; run against learner-chosen sources and inspect every displayed quote in its cited extracted text.</li><li><strong>Fabrication control:</strong> alter one proposed quote by one character and require rejection with no rendered evidence.</li><li><strong>Failure policy:</strong> make one source fail while one succeeds, then separately make the configured AI unavailable. Partial source evidence survives; AI failure stays a clear nonzero failure with no fallback.</li><li><strong>Explicit mock:</strong> select test mode knowingly and require an unmistakable non-factual label.</li><li><strong>Creative extension:</strong> exercise the original feature and a negative case that would fail if its core behavior were removed.</li><li><strong>Package:</strong> publish, launch the produced executable from another working directory, and repeat help plus the deterministic acceptance controls.</li></ol>
<p>For every scenario, vary one load-bearing input and observe the promised scenario fail before restoring it. This prevents a prepared PASS receipt from impersonating exercised behavior.</p>
<p>The live AI run cannot be made deterministic by the course harness and must not expose a key. Record provider kind, model identifier where applicable, source labels, and whether exact proposals verified. The deterministic fixture proves code; the live observation proves configured integration.</p>
<p>Finally diagnose one cross-boundary defect from the earliest compiler, test, process, HTTP, schema, verification, or package evidence. Write why the repaired component owned the change and what credible alternative you rejected.</p>
<div class="callout"><p>Completion means a working published C# program, a genuine semantic AI route, exact source verification, creative transfer, and honest failure—not resemblance to one reference architecture.</p></div>
<div class="field-notes"><div class="fn-head">FIELD NOTES // INDEPENDENCE CHECK</div><p>Remove the course text from view. Using only your README and tests, rebuild the mental model of source ownership, provider substitution, proposal status, verification, and delivery. Any unexplained seam is final documentation work.</p></div>
'''

[[lessons.readings]]
label = "Microsoft Learn — Testing in .NET"
url = "https://learn.microsoft.com/en-us/dotnet/core/testing/"
essential = false

[[lessons.exercises]]
id = "s12-l05-e1"
type = "mc"
points = 20
prompt = "Why does live acceptance avoid asserting one fixed quotation?"
choices = ["The verifier is optional", "Model selection can vary, while exact-substring and attribution invariants must not", "C# cannot compare strings", "Sources have no text"]
answer = 1
whyWrong = "Verification remains mandatory, C# compares strings, and sources provide the passages. Only semantic selection is nondeterministic."
explain = "Acceptance checks stable safety properties around a variable model choice."
hint = "Separate chosen content from rules every chosen item must obey."

[[lessons.exercises]]
id = "s12-l05-d1"
type = "type"
points = 14
reps = 2
prompt = "Retype the explicit mock acceptance command twice."
code = '''dotnet run --project Verisearch -- "What does the fixture say?" --source "Local fixture" --mock --verbose'''

[[lessons.exercises]]
id = "s12-l05-e2"
type = "fill"
points = 18
prompt = "Complete the expected cancellation exit status recorded by the release journey."
code = '''canceled => exit ____'''
answer = "130"
hint = "The same status was established at the composition root."

[[lessons.exercises]]
id = "s12-l05-e3"
type = "mc"
points = 18
prompt = "What must the unavailable-provider live test prove?"
choices = ["Mock starts automatically", "Keyword matching supplies quotes", "The command fails clearly and emits no impersonated evidence", "Every passage is printed"]
answer = 2
whyWrong = "Automatic alternative modes and all-passages output change the requested behavior and can masquerade as AI evidence."
explain = "A visible failure preserves mode integrity and tells the user what to repair."
hint = "Live means live or an error."

[[lessons.exercises]]
id = "s12-l05-w1"
type = "write"
points = 38
prompt = "Given acceptance rung Booleans for build, tests, mock, live, and publish, print PASS only when every rung is true."
starter = '''var rungs = new[] { true, true, true, true, true };
Console.WriteLine("NOT CHECKED");
'''
expect = "PASS"
solution = '''var rungs = new[] { true, true, true, true, true };
Console.WriteLine(rungs.All(passed => passed) ? "PASS" : "FAIL");
'''
hint = "Use All with a lambda returning each Boolean."

[[lessons.concepts]]
id = "language-testing-debugging"
purpose = "Turn a C# promise into an executable check and diagnose failures from the earliest broken boundary."
anatomy = "Arrange controlled inputs, invoke one behavior, assert an observable result, then use compiler, test, or debugger output to localize a failing case."
example = "The disposable examples in Acceptance Journey — Prove Every Boundary from the Entrypoint isolate this capability before the learner chooses how it belongs in the cumulative project. The lesson Acceptance Journey — Prove Every Boundary from the Entrypoint supplies the disposable observation point."
observable = "The check passes for a valid case and fails when its load-bearing input is deliberately changed. Confirm it while practicing Acceptance Journey — Prove Every Boundary from the Entrypoint."
failure = "A test that prints a prepared success receipt or requires live network state cannot distinguish a regression."
practice = "s12-l05-e1"

[[lessons.artifactSteps]]
id = "s12-l05-author-artifact"
path = "tests/Verisearch.Tests/TruthBoundaryTests.cs"
mode = "author"
instruction = "Use the C# ideas from Acceptance Journey — Prove Every Boundary from the Entrypoint to author or revise this learner-owned path toward the chapter behavior: Add an original capability, diagnose a cross-boundary defect, defend a C# design choice, and publish the working program. Choose your own type names, method boundaries, and file organization; the lesson examples are disposable and are not a production template."
checks = ["Tests, live AI evidence, negative controls, the original extension, and the published executable all succeed from documented commands.", "The complete solution builds from saved source, and a deliberately changed load-bearing input makes the relevant check fail before repair."]
