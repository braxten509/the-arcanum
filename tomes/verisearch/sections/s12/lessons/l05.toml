
[[lessons]]
id = "s12-l05"
teaches = ["language-testing-debugging"]
title = "The Cold Transfer Protocol"
body = '''
<p>The mastery lab assigns one already-verified variant and persists it before showing the brief. Refreshing the page does not search for an easier task. A failed or supported attempt may request a different verified variant, but completion still requires an independent receipt at the B threshold with every essential scenario green.</p>
<p>Begin without the Oracle or answer-producing hints. Documentation is not forbidden knowledge: the lab's aid policy tells you whether language and standard-library references are available. For this trial the policy is cold, so rely on the public brief, public examples, compiler diagnostics, and your own tests. The hidden assessor has no network and receives a clean snapshot of only the assigned workspace.</p>
<p>Use a five-pass protocol. First, restate each requirement as an observable claim. Second, build the untouched starter and run every public example. Third, write one ordinary test and one edge test before completing behavior. Fourth, implement in narrow increments, keeping the build green. Fifth, remove accidental debugging output and run from a clean process. If you choose a record, class, interface, or collection, be able to explain what public rule made that choice useful.</p>
<p>The assessment may vary values, ordering, malformed input, or failure cases that the public requirements already name. It may not require a secret class name. Do not write code that detects the example and prints a prepared answer; mutations in the verified bank already prove that such shortcuts fail credible edges. Do not copy any Verisearch type into the trial. Capability transfer means independently reconstructing a solution in another context.</p>
<p>After submission, read deterministic feedback before qualitative feedback. A build or essential failure cannot be outweighed by elegant prose. If support was used, the work may resolve the activity but does not count as independent mastery; request another variant and try again once the idea is yours.</p>
<div class="callout"><p>The lab is not a surprise exam. It is a fair public contract with private values, executable proof, and no canonical implementation in the learner payload.</p></div>
<div class="field-notes"><div class="fn-head">FIELD NOTES // RETRY MEANS NEW EVIDENCE</div><p>Use retry after learning, not as a reroll slot machine. The family changes domain and edge combinations while holding the same capability claim.</p></div>
'''

[[lessons.readings]]
label = "Microsoft Learn — Unit testing C#"
url = "https://learn.microsoft.com/en-us/dotnet/core/testing/unit-testing-csharp-with-xunit"
essential = false

[[lessons.exercises]]
id = "s12-l05-e1"
type = "mc"
points = 20
required = true
capabilities = ["language-testing-debugging"]
cognitiveTask = "explain"
scaffold = "guided"
contextFamily = "verisearch-s12-testing-debugging"
aidPolicy = "limited"
prompt = "What does refreshing do after a mastery variant has been assigned?"
choices = ["Rerolls the task", "Keeps the persisted assignment", "Shows the hidden tests", "Marks it complete"]
answer = 1
whyWrong = "Assignment persistence prevents refresh-based task shopping and does not expose private material."
hint = "The assignment is saved before its brief is returned."
explain = "Refresh restores the same verified variant."

[[lessons.exercises]]
id = "s12-l05-e2"
type = "mc"
points = 20
required = true
capabilities = ["language-testing-debugging"]
cognitiveTask = "explain"
scaffold = "guided"
contextFamily = "verisearch-s12-testing-debugging"
aidPolicy = "limited"
prompt = "Can an excellent rationale override a failed essential scenario?"
choices = ["Yes, at Mastery 3", "Only after a retry", "No, deterministic essentials gate qualitative scoring", "Only for compilation"]
answer = 2
whyWrong = "The engine defers qualitative scoring until every essential deterministic behavior passes."
hint = "Behavioral proof is a gate, not one weighted opinion."
explain = "A failed essential remains incomplete regardless of prose quality."

[[lessons.exercises]]
id = "s12-l05-e3"
type = "text"
points = 20
required = true
capabilities = ["language-testing-debugging"]
cognitiveTask = "recall"
scaffold = "guided"
contextFamily = "verisearch-s12-testing-debugging"
aidPolicy = "limited"
prompt = "What one-word receipt property must be true for a passing trial to count toward the mastery seal?"
answer = "independent"
accept = ["independent"]
hint = "Supported work can resolve practice but cannot make this claim."

[[lessons.exercises]]
id = "s12-l05-w1"
type = "write"
points = 35
required = true
capabilities = ["language-testing-debugging"]
cognitiveTask = "build"
scaffold = "independent"
contextFamily = "verisearch-s12-testing-debugging"
aidPolicy = "limited"
prompt = "Write a complete C# program that evaluates build, behavior, and support flags. Print <code>independent</code> only when build and behavior are true and support is false; demonstrate that exact passing case."
expect = "independent"
solution = '''
bool build = true;
bool behavior = true;
bool supportUsed = false;
Console.WriteLine(build && behavior && !supportUsed ? "independent" : "not independent");
'''
hint = "Conjoin both evidence flags and negate supportUsed."

[[lessons.concepts]]
id = "language-testing-debugging"
purpose = "Produce independent transfer evidence through public requirements, learner-authored tests, and scoped diagnosis."
anatomy = "Restate observations, baseline the starter, add ordinary and edge tests, implement incrementally, and launch cleanly."
example = "The cold-trial protocol applies the same verification discipline without Verisearch nouns or architecture."
observable = "The starter fails essential behavior, the learner solution passes, and deficient mutations remain rejected."
failure = "Prepared output, refresh shopping, hidden-architecture guessing, or supported completion cannot establish independent capability."
practice = "s12-l05-e1"
