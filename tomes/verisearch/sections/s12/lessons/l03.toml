
[[lessons]]
id = "s12-l03"
teaches = ["language-public-contract-reading"]
title = "Read the Contract, Not the Domain"
body = '''
<p>A transfer problem is deliberately unfamiliar in its nouns. A harbor manifest, clinic queue, sensor ledger, or trail inventory can make a capable programmer feel as if a new subject has erased their C#. It has not. The useful first move is to translate public behavior into a small set of typed facts, transformations, and observations before writing implementation.</p>
<p>Start with the contract. Underline the input boundary, the outputs a caller can observe, the invalid cases named publicly, and any ordering or preservation promise. Then write a tiny table with four columns: example input, expected output, rule exercised, and one nearby counterexample. This is not architecture. It is a behavioral inventory that prevents domain vocabulary from choosing classes for you.</p>
<pre><code data-kind="pseudocode">Input boundary  -> parse one record
Valid rule      -> transform or store it
Invalid rule    -> reject, preserve, or report
Observation     -> output, exit code, or produced file</code></pre>
<p>Only after the inventory should you choose a method boundary. A good first method accepts the smallest typed input needed to exercise one rule and returns a value that a test can inspect. Keep console reading, parsing, transformation, and rendering separable even if the final program remains small. That lets a malformed row fail at the parse boundary without erasing already accepted state.</p>
<p>Do not search the cumulative Verisearch project for a class to rename. The foreign trial intentionally withholds that analogy. Reuse language capabilities—nullable flow, methods, collections, records, exceptions, and tests—not product names or its pipeline arrangement. If a public example seems to reveal the whole answer, invent a counterexample that differs in one load-bearing fact. If your design cannot predict it, the contract inventory is still incomplete.</p>
<div class="callout"><p>Cold transfer is not guessing. It is disciplined reduction from foreign nouns to typed behavior and executable observations.</p></div>
<div class="field-notes"><div class="fn-head">FIELD NOTES // A FAIR HIDDEN EDGE</div><p>A hidden assessment may vary values and named edge cases, but it cannot demand a private type name or an unannounced file. Build to the public contract; do not attempt to reverse-engineer the assessor.</p></div>
'''

[[lessons.readings]]
label = "Microsoft Learn — Methods"
url = "https://learn.microsoft.com/en-us/dotnet/csharp/programming-guide/classes-and-structs/methods"
essential = false

[[lessons.exercises]]
id = "s12-l03-e1"
type = "mc"
points = 20
required = true
capabilities = ["language-methods-scope"]
cognitiveTask = "explain"
scaffold = "guided"
contextFamily = "verisearch-s12-public-contract-reading"
aidPolicy = "limited"
prompt = "A foreign brief names unfamiliar equipment. What should you identify before choosing classes?"
choices = ["A renamed Verisearch pipeline", "Observable inputs, outputs, invalid cases, and preservation rules", "The hidden reference type names", "A framework package"]
answer = 1
whyWrong = "Product analogies and hidden architecture are not the contract; behavior is."
hint = "Start from what a caller can supply and observe."
explain = "A behavioral inventory separates the unfamiliar domain from the C# capabilities needed to implement it."

[[lessons.exercises]]
id = "s12-l03-e2"
type = "mc"
points = 20
required = true
capabilities = ["language-methods-scope"]
cognitiveTask = "explain"
scaffold = "guided"
contextFamily = "verisearch-s12-public-contract-reading"
aidPolicy = "limited"
prompt = "Why write one nearby counterexample for each public example?"
choices = ["To reveal which fact is load-bearing in the rule", "To guess secret tests", "To avoid compiling", "To choose a longer class name"]
answer = 0
whyWrong = "The counterexample probes the boundary of the stated rule, not private implementation."
hint = "Change one meaningful fact and predict the result."
explain = "A close counterexample turns prose into a falsifiable behavioral claim."

[[lessons.exercises]]
id = "s12-l03-e3"
type = "text"
points = 20
required = true
capabilities = ["language-methods-scope"]
cognitiveTask = "recall"
scaffold = "guided"
contextFamily = "verisearch-s12-public-contract-reading"
aidPolicy = "limited"
prompt = "What two-word phrase names the behavior a caller can see and a test can assert?"
answer = "observable contract"
accept = ["observable contract", "public contract"]
hint = "It is public and testable rather than architectural."

[[lessons.exercises]]
id = "s12-l03-w1"
type = "write"
points = 35
required = true
capabilities = ["language-methods-scope"]
cognitiveTask = "build"
scaffold = "independent"
contextFamily = "verisearch-s12-public-contract-reading"
aidPolicy = "limited"
prompt = "Given the integers 4, -1, 7, and -3, write a complete C# program that preserves valid positive values, counts rejected values, and prints exactly <code>accepted=2 rejected=2 total=11</code>. Choose your own method boundary."
expect = "accepted=2 rejected=2 total=11"
solution = '''
int[] input = [4, -1, 7, -3];
List<int> accepted = input.Where(value => value > 0).ToList();
int rejected = input.Length - accepted.Count;
Console.WriteLine($"accepted={accepted.Count} rejected={rejected} total={accepted.Sum()}");
'''
hint = "Filter positive values, derive the rejected count, and sum the preserved values."

[[lessons.concepts]]
id = "language-public-contract-reading"
purpose = "Translate an unfamiliar brief into the public contract it actually specifies, before writing any code."
anatomy = "Underline the input boundary, the observable outputs, the publicly named invalid cases, and any ordering or preservation promise; the domain nouns are decoration."
example = "A brief reduced to arrows from input boundary to parse, valid rule, and observable output, with the unfamiliar subject set aside."
observable = "The contract can be restated as inputs, outputs, and refusals without using the brief's domain words."
failure = "Learning the domain instead of the contract produces a faithful implementation of the wrong requirement."
practice = "s12-l03-e1"
