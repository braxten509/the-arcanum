[[lessons]]
id = "s12-l03"
teaches = ["language-cli-packaging"]
title = "Publish and Run the Artifact You Will Actually Ship"
body = '''

<p><code>dotnet publish</code> creates the artifact a user will actually launch. A successful debug run does not prove that output, dependencies, executable permissions, or startup behavior survive delivery.</p>
<pre><code data-kind="terminal">$ dotnet publish ./src/YourApp/YourApp.csproj     --configuration Release     --runtime linux-x64     --self-contained true     -p:PublishSingleFile=true     --output ./dist</code></pre>
<p>The command is an example for one runtime identifier. Choose the RID matching the target system and document it. Self-contained means the selected .NET runtime is bundled with the application. It does not bundle a local model service, hosted API, credentials, source pages, or an arbitrary external AI command.</p>
<p>Run the exact file under <code>dist</code>. Check <code>--help</code>, invalid invocation, the acceptance fixture, and one ordinary configured-provider path where the environment permits. If the program launches another AI CLI, that executable remains an external requirement. If it calls an API, network access and credentials remain external requirements.</p>
<p>Publish from a clean project state after tests. Inspect output size and filenames, but do not infer success from their presence. A single-file application can still fail at startup because it assumed <code>Assembly.Location</code>, a working directory, or a development-only file. Resolve user-supplied paths explicitly and use <code>Environment.ProcessPath</code> when the running executable path is the fact you need.</p>
<p>The course's package proof launches the built artifact and repeats positive and negative acceptance controls. Your learner evidence should additionally show that the documented provider setup works on your environment without committing secrets.</p>
<div class="callout"><p>Delivery proof covers the C# program. External AI requirements must remain explicit rather than silently replaced when absent.</p></div>
<div class="field-notes"><div class="fn-head">FIELD NOTES // CLEAN LAUNCH</div><p>Change the working directory before launching the published path. If behavior changes unintentionally, a relative-path assumption is part of the product contract whether you documented it or not.</p></div>
'''

[[lessons.readings]]
label = "Microsoft Learn — dotnet publish"
url = "https://learn.microsoft.com/en-us/dotnet/core/tools/dotnet-publish"
essential = false

[[lessons.exercises]]
id = "s12-l03-e1"
type = "mc"
points = 20
prompt = "What does <code>--self-contained true</code> mean?"
choices = ["It bundles the selected .NET runtime with the application", "It bundles the configured AI and the model", "It supports every OS in one file", "It removes configuration"]
answer = 0
whyWrong = "the configured AI, models, configuration, and other operating systems remain separate concerns. Self-contained refers to the selected .NET runtime."
explain = "A machine without the SDK can run the RID-specific artifact."
hint = "Ask which runtime normally executes a .NET assembly."

[[lessons.exercises]]
id = "s12-l03-e2"
type = "fill"
points = 20
prompt = "Fill the runtime identifier for 64-bit Windows."
code = '''dotnet publish -c Release -r ____ --self-contained true'''
answer = "win-x64"
hint = "Operating system abbreviation, hyphen, architecture."

[[lessons.exercises]]
id = "s12-l03-e3"
type = "mc"
points = 20
prompt = "Why does the beginner release use <code>PublishTrimmed=false</code>?"
choices = ["Trimming changes the source URL", "Trimming can remove dynamically discovered code and must be validated separately", "Single-file requires false", "Release builds cannot trim"]
answer = 1
whyWrong = "Trimming does not alter source URLs, is compatible with some single-file releases, and can run in Release. Its dynamic-code risk is the reason to defer it."
explain = "A larger known-good artifact is preferable to a smaller subtly broken first release."
hint = "Static reachability cannot always see reflection."

[[lessons.exercises]]
id = "s12-l03-d1"
type = "type"
points = 14
reps = 2
prompt = "Retype the Linux release command twice."
code = '''dotnet publish Verisearch.csproj -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=false -o ./release/linux-x64'''

[[lessons.concepts]]
id = "language-cli-packaging"
purpose = "Design a predictable command surface and deliver a runnable artifact from the same source and project metadata."
anatomy = "Parse arguments without a shell, return stable exit codes, build or publish through dotnet, then launch the produced path with a real command."
example = "The disposable examples in Publish and Run the Artifact You Will Actually Ship isolate this capability before the learner chooses how it belongs in the cumulative project. The lesson Publish and Run the Artifact You Will Actually Ship supplies the disposable observation point."
observable = "Help, invalid input, ordinary execution, and the published binary each produce their documented outcome. Confirm it while practicing Publish and Run the Artifact You Will Actually Ship."
failure = "Ambiguous arguments, embedded secrets, or an unlaunched publish directory leave the program unproved."
practice = "s12-l03-e1"

[[lessons.artifactSteps]]
id = "s12-l03-author-artifact"
path = "tests/Verisearch.Tests/TruthBoundaryTests.cs"
mode = "author"
instruction = "Use the C# ideas from Publish and Run the Artifact You Will Actually Ship to author or revise this learner-owned path toward the chapter behavior: Add an original capability, diagnose a cross-boundary defect, defend a C# design choice, and publish the working program. Choose your own type names, method boundaries, and file organization; the lesson examples are disposable and are not a production template."
checks = ["Tests, live AI evidence, negative controls, the original extension, and the published executable all succeed from documented commands.", "The complete solution builds from saved source, and a deliberately changed load-bearing input makes the relevant check fail before repair."]
