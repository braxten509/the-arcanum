[[lessons]]
id = "s12-l03"
teaches = ["dotnet-publish"]
title = "Publish and Run the Artifact You Will Actually Ship"
body = '''
<p><code>dotnet run</code> proves the SDK can build and launch the project. A release test must execute the published artifact itself. First identify the current platform:</p>
<pre><code>dotnet --info</code></pre>
<p>Choose its runtime identifier: <code>linux-x64</code>, <code>linux-arm64</code>, <code>win-x64</code>, <code>osx-x64</code>, or <code>osx-arm64</code>. On 64-bit Linux:</p>
<pre><code>dotnet publish Verisearch/Verisearch.csproj \
  -c Release -r linux-x64 --self-contained true \
  -p:PublishSingleFile=true -p:PublishTrimmed=false \
  -o ./release/linux-x64</code></pre>
<p>If the terminal is already inside the project, replace the first path with <code>Verisearch.csproj</code>. The explicit output directory makes the artifact easy to find. Then run the artifact, not the project:</p>
<pre><code>./release/linux-x64/Verisearch --help
./release/linux-x64/Verisearch <span class="s">"What does the fixture say?"</span> --mock</code></pre>
<p><code>--self-contained true</code> bundles the target .NET runtime. <code>PublishSingleFile</code> asks for one main executable. Platform-specific native files may still appear for some dependencies or settings, so inspect the output rather than promising one file by memory.</p>
<p>This course deliberately disables trimming. Trimming removes code based on static reachability and can break libraries or serializers that discover members dynamically. A beginner release gains little from adding that risk. If a later maintainer enables trimming, the full published-binary acceptance journey—not merely <code>dotnet build</code>—must pass.</p>
<p>Publishing does not bundle Ollama or a model. Live mode still requires an accessible Ollama server and the configured model tag. The executable does bundle application code and the .NET runtime; its README states both boundaries.</p>
<div class="callout">Copy the exact command and resulting artifact path into the release notes. “Publish succeeded” without running that path is incomplete evidence.</div>
<div class="field-notes"><div class="fn-head">MARGINALIA // ONE RID PER ARTIFACT</div><p>A self-contained executable targets one operating system and architecture. Create separate output directories for other RIDs and test each on its target; renaming a Linux binary does not make it a Windows binary.</p></div>
'''

[[lessons.readings]]
label = "Microsoft Learn — dotnet publish"
url = "https://learn.microsoft.com/en-us/dotnet/core/tools/dotnet-publish"
essential = false

[[lessons.exercises]]
id = "s12-l03-e1"
type = "mc"
points = 20
prompt = "What does <code>--self-contained true</code> mean?"
choices = ["It bundles the selected .NET runtime with the application", "It bundles Ollama and the model", "It supports every OS in one file", "It removes configuration"]
answer = 0
whyWrong = "Ollama, models, configuration, and other operating systems remain separate concerns. Self-contained refers to the selected .NET runtime."
explain = "A machine without the SDK can run the RID-specific artifact."
hint = "Ask which runtime normally executes a .NET assembly."

[[lessons.exercises]]
id = "s12-l03-e2"
type = "fill"
points = 20
prompt = "Fill the runtime identifier for 64-bit Windows."
code = '''dotnet publish -c Release -r ____ --self-contained true'''
answer = "win-x64"
hint = "Operating system abbreviation, hyphen, architecture."

[[lessons.exercises]]
id = "s12-l03-e3"
type = "mc"
points = 20
prompt = "Why does the beginner release use <code>PublishTrimmed=false</code>?"
choices = ["Trimming changes the source URL", "Trimming can remove dynamically discovered code and must be validated separately", "Single-file requires false", "Release builds cannot trim"]
answer = 1
whyWrong = "Trimming does not alter source URLs, is compatible with some single-file releases, and can run in Release. Its dynamic-code risk is the reason to defer it."
explain = "A larger known-good artifact is preferable to a smaller subtly broken first release."
hint = "Static reachability cannot always see reflection."

[[lessons.exercises]]
id = "s12-l03-d1"
type = "type"
points = 14
reps = 2
prompt = "Retype the Linux release command twice."
code = '''dotnet publish Verisearch.csproj -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=false -o ./release/linux-x64'''
