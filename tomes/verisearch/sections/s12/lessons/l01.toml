[[lessons]]
id = "s12-l01"
teaches = ["language-unit-test-project-suite"]
title = "xUnit — Turn the Promise into Executable Proof"
body = '''
<p>A unit test calls project code with known values and asserts what must remain true. Create the test project beside—not inside—the application folder so the main project does not compile test files:</p>
<pre><code data-kind="replacement"><span class="c"># open a terminal in the folder that contains the Verisearch project folder</span>
dotnet new xunit -n Verisearch.Tests
dotnet add Verisearch.Tests/Verisearch.Tests.csproj reference Verisearch/Verisearch.csproj
dotnet test Verisearch.Tests/Verisearch.Tests.csproj</code></pre>
<p>If your application folder has another name, replace only the final path segment; do not rename the course project or saved tome ids. In the test project, delete the generated <code>UnitTest1.cs</code> and create <code>QuoteVerifierTests.cs</code>.</p>
<pre><code data-kind="replacement"><span class="k">using</span> Xunit;

<span class="k">public sealed class</span> QuoteVerifierTests
{
    [Fact]
    <span class="k">public void</span> Verify_ExactSubstring_AttachesPassageSource()
    {
        <span class="k">var</span> source = <span class="k">new</span> SourceSpec(<span class="s">"RFC"</span>, <span class="s">"https://example.test/rfc"</span>, 10, SourceKind.Web);
        <span class="k">var</span> passages = <span class="k">new</span> List&lt;Passage&gt;
        {
            <span class="k">new</span>(1, <span class="s">"Before. Exact source words. After."</span>, source)
        };

        VerificationBatch result = <span class="k">new</span> QuoteVerifier().Verify(
            [<span class="k">new</span> QuoteProposal(1, <span class="s">"Exact source words."</span>)], passages, 5);

        VerifiedQuote quote = Assert.Single(result.Accepted);
        Assert.Equal(<span class="s">"https://example.test/rfc"</span>, quote.Url);
        Assert.Equal(0, result.Rejected);
    }
}</code></pre>
<p><code>[Fact]</code> names one fixed example. <code>[Theory]</code> runs the same method with multiple <code>[InlineData]</code> rows. Follow Arrange, Act, Assert: prepare source data; call the verifier; inspect the result. A name such as <code>Verify_ChangedCase_Rejects</code> reads as a requirement when it fails.</p>
<div class="callout">Red tests are evidence, not shame. Read the first failure, verify the expected value, repair the smallest production rule, and rerun the same command.</div>
<div class="callout csharp-transfer"><p><strong>C#/.NET transfer:</strong> xUnit is a separate .NET test framework: <code>[Fact]</code> is an attribute discovered by the test runner, and <code>Assert</code> methods are library calls rather than C# keywords. The test project compiles against the production project through normal references.</p></div>
<div class="field-notes"><div class="fn-head">MARGINALIA // TEST PROJECT PATHS</div><p>A project reference compiles against the real application assembly. If “project not found” appears, run <code>pwd</code> and <code>ls</code> in the parent directory, then correct the two folder names; do not copy production classes into the test project.</p></div>
'''

