[[lessons]]
id = "s12-l01"
teaches = ["language-testing-debugging"]
title = "xUnit — Turn the Promise into Executable Proof"
body = '''
<p>A unit test calls project code with known values and asserts what must remain true. Create the test project beside—not inside—the application folder so the main project does not compile test files:</p>
<pre><code data-kind="replacement"><span class="c"># open a terminal in the folder that contains the Verisearch project folder</span>
dotnet new xunit -n Verisearch.Tests
dotnet add Verisearch.Tests/Verisearch.Tests.csproj reference Verisearch/Verisearch.csproj
dotnet test Verisearch.Tests/Verisearch.Tests.csproj</code></pre>
<p>If your application folder has another name, replace only the final path segment; do not rename the course project or saved tome ids. In the test project, delete the generated <code>UnitTest1.cs</code> and create <code>QuoteVerifierTests.cs</code>.</p>
<pre><code data-kind="replacement"><span class="k">using</span> Xunit;

<span class="k">public sealed class</span> QuoteVerifierTests
{
    [Fact]
    <span class="k">public void</span> Verify_ExactSubstring_AttachesPassageSource()
    {
        <span class="k">var</span> source = <span class="k">new</span> SourceSpec(<span class="s">"RFC"</span>, <span class="s">"https://example.test/rfc"</span>, 10, SourceKind.Web);
        <span class="k">var</span> passages = <span class="k">new</span> List&lt;Passage&gt;
        {
            <span class="k">new</span>(1, <span class="s">"Before. Exact source words. After."</span>, source)
        };

        VerificationBatch result = <span class="k">new</span> QuoteVerifier().Verify(
            [<span class="k">new</span> QuoteProposal(1, <span class="s">"Exact source words."</span>)], passages, 5);

        VerifiedQuote quote = Assert.Single(result.Accepted);
        Assert.Equal(<span class="s">"https://example.test/rfc"</span>, quote.Url);
        Assert.Equal(0, result.Rejected);
    }
}</code></pre>
<p><code>[Fact]</code> names one fixed example. <code>[Theory]</code> runs the same method with multiple <code>[InlineData]</code> rows. Follow Arrange, Act, Assert: prepare source data; call the verifier; inspect the result. A name such as <code>Verify_ChangedCase_Rejects</code> reads as a requirement when it fails.</p>
<div class="callout">Red tests are evidence, not shame. Read the first failure, verify the expected value, repair the smallest production rule, and rerun the same command.</div>
<div class="field-notes"><div class="fn-head">MARGINALIA // TEST PROJECT PATHS</div><p>A project reference compiles against the real application assembly. If “project not found” appears, run <code>pwd</code> and <code>ls</code> in the parent directory, then correct the two folder names; do not copy production classes into the test project.</p></div>
'''

[[lessons.readings]]
label = "xUnit — Getting started with .NET"
url = "https://xunit.net/docs/getting-started/v3/getting-started"
essential = false

[[lessons.readings]]
label = "Microsoft Learn — Unit testing C# with xUnit"
url = "https://learn.microsoft.com/en-us/dotnet/core/testing/unit-testing-csharp-with-xunit"
essential = false

[[lessons.exercises]]
id = "s12-l01-e1"
type = "mc"
points = 20
prompt = "How do <code>[Fact]</code> and <code>[Theory]</code> differ?"
choices = ["Fact is deprecated", "Fact is one fixed case; Theory runs one body with multiple supplied inputs", "Theory is never run by dotnet test", "Fact cannot use Assert"]
answer = 1
whyWrong = "Both are supported and executed, and both use assertions. Theory adds parameterized data rows."
explain = "Use a Fact for one contract example and a Theory for several boundary variants."
hint = "Think fixed example versus table of examples."

[[lessons.exercises]]
id = "s12-l01-e2"
type = "text"
points = 20
prompt = "Which two-word command builds and runs the test project?"
answer = "dotnet test"
accept = ["dotnet test."]
hint = "It starts with the .NET CLI executable."

[[lessons.exercises]]
id = "s12-l01-e3"
type = "mc"
points = 25
prompt = "How should a test assert that invalid inner JSON throws <code>JsonException</code>?"
choices = ["Assert.True(json)", "Assert.Equal(JsonException, json)", "Assert.Throws<JsonException>(() => Parse(json))", "Exceptions cannot be tested"]
answer = 2
whyWrong = "Boolean and equality checks do not execute and capture the exception, while xUnit provides a dedicated Throws assertion."
explain = "The lambda delays the call so Assert.Throws can observe its exception."
hint = "Use the assertion whose name states the expected behavior."

[[lessons.exercises]]
id = "s12-l01-d1"
type = "type"
points = 14
reps = 2
prompt = "Retype the exact-substring assertion core twice."
code = '''VerificationBatch result = new QuoteVerifier().Verify(
    [new QuoteProposal(1, "Exact source words.")], passages, 5);
VerifiedQuote quote = Assert.Single(result.Accepted);
Assert.Equal(source.Url, quote.Url);
Assert.Equal(0, result.Rejected);'''

[[lessons.exercises]]
id = "s12-l01-w1"
type = "write"
points = 36
prompt = "Implement a tiny <code>AssertEqual</code> helper, run two passing integer assertions, then print <code>2 passed</code>."
starter = '''Console.WriteLine("NOT TESTED");
'''
expect = "2 passed"
solution = '''AssertEqual(4, 2 + 2);
AssertEqual(5, 10 / 2);
Console.WriteLine("2 passed");

static void AssertEqual(int expected, int actual)
{
    if (expected != actual)
    {
        throw new Exception($"expected {expected} got {actual}");
    }
}
'''
hint = "Throw only when expected != actual; two calls that do not throw precede the WriteLine."

[[lessons.concepts]]
id = "language-testing-debugging"
purpose = "Turn a C# promise into an executable check and diagnose failures from the earliest broken boundary."
anatomy = "Arrange controlled inputs, invoke one behavior, assert an observable result, then use compiler, test, or debugger output to localize a failing case."
example = "The disposable examples in xUnit — Turn the Promise into Executable Proof isolate this capability before the learner chooses how it belongs in the cumulative project. The lesson xUnit — Turn the Promise into Executable Proof supplies the disposable observation point."
observable = "The check passes for a valid case and fails when its load-bearing input is deliberately changed. Confirm it while practicing xUnit — Turn the Promise into Executable Proof."
failure = "A test that prints a prepared success receipt or requires live network state cannot distinguish a regression."
practice = "s12-l01-e1"

[[lessons.artifactSteps]]
id = "s12-l01-author-artifact"
path = "tests/Verisearch.Tests/TruthBoundaryTests.cs"
mode = "author"
instruction = "Use the C# ideas from xUnit — Turn the Promise into Executable Proof to author or revise this learner-owned path toward the chapter behavior: Add an original capability, diagnose a cross-boundary defect, defend a C# design choice, and publish the working program. Choose your own type names, method boundaries, and file organization; the lesson examples are disposable and are not a production template."
checks = ["Tests, live AI evidence, negative controls, the original extension, and the published executable all succeed from documented commands.", "The complete solution builds from saved source, and a deliberately changed load-bearing input makes the relevant check fail before repair."]
