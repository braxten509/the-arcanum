[[lessons]]
id = "s12-l01"
title = "xUnit — proof, not hope"
body = '''

<p>A unit test is a tiny program that calls your code and asserts what MUST be true. xUnit is the de facto .NET test framework. Setup (a test project beside your main one):</p>
<pre><code>$ dotnet new xunit -n Verisearch.Tests
$ dotnet add Verisearch.Tests reference Verisearch
$ dotnet test              <span class="c"># builds + runs every test, red/green report</span></code></pre>
<p>Anatomy — <code>[Fact]</code> for single cases, Arrange/Act/Assert inside:</p>
<pre><code><span class="k">using</span> Xunit;

<span class="k">public class</span> TrustEngineTests
{
    [Fact]
    <span class="k">public void</span> UnknownDomain_GetsUnverifiedDefault()
    {
        <span class="k">var</span> engine = <span class="k">new</span> TrustEngine(TestConfig());          <span class="c">// arrange</span>
        <span class="k">var</span> profile = engine.ProfileFor(<span class="s">"nobody-knows.example"</span>); <span class="c">// act</span>
        Assert.Equal(SourceTier.Unverified, profile.Tier);    <span class="c">// assert</span>
    }
}</code></pre>
<p><code>[Theory]</code> runs one test body against many inputs — perfect for scoring rules:</p>
<pre><code>[Theory]
[InlineData(9.5, <span class="s">"green"</span>)]
[InlineData(5.0, <span class="s">"yellow"</span>)]
[InlineData(2.0, <span class="s">"red"</span>)]
<span class="k">public void</span> TrustColor_MatchesTier(<span class="k">double</span> score, <span class="k">string</span> expected)
    =&gt; Assert.Contains(expected, ReportRenderer.TrustMarkup(score));</code></pre>
<p>Assertion vocabulary: <code>Assert.Equal(expected, actual)</code>, <code>Assert.True/False</code>, <code>Assert.Contains</code>, <code>Assert.Empty/NotEmpty</code>, <code>Assert.Throws&lt;T&gt;(() =&gt; ...)</code> — yes, you assert that bad input THROWS the machineht thing.</p>
<div class="callout">Test naming that survives 3am: <code>Thing_Condition_Expectation</code>. When <code>UnknownDomain_GetsUnverifiedDefault</code> goes red, the failure report IS the bug description.</div><div class="field-notes"><div class="fn-head">MARGINALIA // THE DEEPER CUT — IN THORNE'S HAND</div>
<p><strong>Test lifecycle:</strong> xUnit creates a NEW instance of the test class for EVERY test — instance fields are per-test, the constructor is your setup, <code>IDisposable.Dispose</code> is teardown. No [SetUp] attributes like other frameworks; the constructor IS the setup.</p>
<p><strong>Async tests are natural:</strong> <code>[Fact] public async Task Scan_HandlesEmpty() { ... await ... }</code> — the runner awaits them.</p>
<p><strong>Failure output:</strong> Assert.Equal prints expected vs actual on failure — which is why Equal(expected, actual) argument ORDER matters; swap them and every failure message lies to you.</p></div>'''

[[lessons.readings]]
label = "xUnit — getting started (v3, command line)"
url = "https://xunit.net/docs/getting-started/netcore/cmdline"
essential = false

[[lessons.readings]]
