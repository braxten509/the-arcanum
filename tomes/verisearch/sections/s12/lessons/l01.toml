[[lessons.exercises]]
id = "s12-l01-e1"
type = "mc"
points = 20
prompt = "<code>[Fact]</code> vs <code>[Theory]</code>:"
choices = ["Fact is deprecated", "Fact = one fixed case; Theory = same test body fed multiple InlineData inputs", "Theory tests are skipped in CI", "Facts can't use Assert"]
answer = 1
whyWrong = "Neither is deprecated or skipped — [Fact] is a single fixed case and [Theory] runs the same body over multiple InlineData inputs."
hint = "Theories are parameterized."

[[lessons.exercises]]
id = "s12-l01-e2"
type = "text"
points = 20
prompt = "Which command builds and runs the whole test suite?"
answer = "dotnet test"
accept = ["dotnet test."]
hint = "Two words."

[[lessons.exercises]]
id = "s12-l01-e3"
type = "mc"
points = 25
prompt = "How do you assert that parsing garbage LLM output throws JsonException?"
choices = ["try/catch with a bool flag", "Assert.Equal(JsonException, Parse(garbage))", "Assert.Throws<JsonException>(() => Parse(garbage))", "You can't test exceptions"]
answer = 2
whyWrong = "A try/catch bool or an equality check won’t assert an exception — Assert.Throws<JsonException>(() => Parse(garbage)) does, and exceptions are absolutely testable."
hint = "There's a dedicated assertion that takes a lambda."

[[lessons.exercises]]
id = "s12-l01-d1"
type = "type"
points = 14
reps = 2
prompt = "A complete Fact — Arrange, Act, Assert. Twice."
code = '''
[Fact]
public void UnknownDomain_GetsUnverifiedDefault()
{
    var engine = new TrustEngine(TestConfig());
    var profile = engine.ProfileFor("nobody.example");
    Assert.Equal(SourceTier.Unverified, profile.Tier);
}'''

[[lessons.exercises]]
id = "s12-l01-w1"
type = "write"
points = 36
prompt = "Build the machinery yourself once: write <code>static void AssertEqual(int expected, int actual)</code> that throws <code>new Exception($\"expected {expected} got {actual}\")</code> on mismatch. Run two passing assertions (2+2==4, 10/2==5), then print <code>2 passed</code>."
expect = "2 passed"
solution = '''
AssertEqual(4, 2 + 2);
AssertEqual(5, 10 / 2);
Console.WriteLine("2 passed");

static void AssertEqual(int expected, int actual)
{
    if (expected != actual) throw new Exception($"expected {expected} got {actual}");
}
'''
hint = "Two calls that don't throw, then one WriteLine. Congratulations, you've written 10% of xUnit."
