[[lessons.exercises]]
id = "s12-l01-e3"
type = "mc"
points = 25
required = true
capabilities = ["language-testing-debugging"]
cognitiveTask = "explain"
scaffold = "guided"
contextFamily = "verisearch-s12-unit-test-project-suite"
aidPolicy = "limited"
prompt = "How should a test assert that invalid inner JSON throws <code>JsonException</code>?"
choices = ["Assert.True(json)", "Assert.Equal(JsonException, json)", "Assert.Throws<JsonException>(() => Parse(json))", "Exceptions cannot be tested"]
answer = 2
whyWrong = "Boolean and equality checks do not execute and capture the exception, while xUnit provides a dedicated Throws assertion."
explain = "The lambda delays the call so Assert.Throws can observe its exception."
hint = "Use the assertion whose name states the expected behavior."

