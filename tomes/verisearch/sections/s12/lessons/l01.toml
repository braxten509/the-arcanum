[[lessons.exercises]]
id = "s12-l01-w1"
type = "write"
points = 36
required = true
capabilities = ["language-testing-debugging"]
cognitiveTask = "test-design"
scaffold = "independent"
contextFamily = "verisearch-s12-unit-test-project-suite"
aidPolicy = "limited"
prompt = "Implement a tiny <code>AssertEqual</code> helper, run two passing integer assertions, then print <code>2 passed</code>."
starter = '''Console.WriteLine("NOT TESTED");
'''
expect = "2 passed"
solution = '''AssertEqual(4, 2 + 2);
AssertEqual(5, 10 / 2);
Console.WriteLine("2 passed");

static void AssertEqual(int expected, int actual)
{
    if (expected != actual)
    {
        throw new Exception($"expected {expected} got {actual}");
    }
}
'''
hint = "Throw only when expected != actual; two calls that do not throw precede the WriteLine."

[[lessons.concepts]]
id = "language-unit-test-project-suite"
purpose = "Grow one maintained test project that calls the application through its public boundaries."
anatomy = "The test project sits beside the application and references it, test classes group by boundary, and each fact or theory arranges, acts, and asserts once."
example = "A Verisearch.Tests project created with dotnet new xunit, referenced to the application, with a first verifier test class replacing the template file."
observable = "dotnet test discovers and runs the suite from the solution root, and each test names the boundary it protects."
failure = "Test files inside the application project ship test code as product and drag test packages into production metadata."
practice = "s12-l01-e1"
