[[lessons.exercises]]
id = "s12-l01-e1"
type = "mc"
points = 20
required = true
capabilities = ["language-testing-debugging"]
cognitiveTask = "explain"
scaffold = "guided"
contextFamily = "verisearch-s12-unit-test-project-suite"
aidPolicy = "limited"
prompt = "How do <code>[Fact]</code> and <code>[Theory]</code> differ?"
choices = ["Fact is deprecated", "Fact is one fixed case; Theory runs one body with multiple supplied inputs", "Theory is never run by dotnet test", "Fact cannot use Assert"]
answer = 1
whyWrong = "Both are supported and executed, and both use assertions. Theory adds parameterized data rows."
explain = "Use a Fact for one contract example and a Theory for several boundary variants."
hint = "Think fixed example versus table of examples."

