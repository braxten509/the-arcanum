[[lessons]]
id = "s12-l02"
teaches = ["language-testing-debugging"]
title = "Test the Boundaries Where False Quotes Could Escape"
body = '''

<p>Prioritize tests by damage. Verisearch's highest-cost regression is presenting altered or misattributed model text as verified evidence. Build a deterministic truth-boundary suite before testing decorative output.</p>
<ol><li><strong>Exact verifier:</strong> accept an interior ordinal substring; reject changed case, punctuation, unknown id, blank text, duplicates according to policy, and proposals beyond the cap.</li><li><strong>Attribution:</strong> prove the accepted label and URI equal the matched C# passage source even when surrounding AI-shaped data claims something else.</li><li><strong>Provider adapter:</strong> give a fixed valid structured response, malformed JSON, excessive output, nonzero process or HTTP failure, and cancellation without contacting a live service.</li><li><strong>Extraction:</strong> fixed HTML produces stable nonduplicated passage text and ids.</li><li><strong>Integration:</strong> a recording AI sees the whole question, one exact proposal renders, one fabrication is rejected, and one failed source remains visible.</li></ol>
<pre><code data-kind="replacement">[Theory]
[InlineData("Exact source words.", true)]
[InlineData("exact source words.", false)]
[InlineData("Exact source words", true)]
[InlineData("Invented source words.", false)]
public void CandidateAcceptanceMatchesOrdinalContainment(string candidate, bool expected)
{
    bool actual = "Before. Exact source words. After."
        .Contains(candidate, StringComparison.Ordinal);
    Assert.Equal(expected, actual);
}</code></pre>
<p>The no-period candidate is correctly accepted because it is still a contiguous exact substring. Tests must state the actual contract, not invent a hidden whole-sentence requirement.</p>
<p>Unit tests should not need a changing URL, credentials, or a live model. Use a fake process, controlled HTTP handler, or provider test server to isolate transport and parsing. Separately, the learner's final evidence includes one real configured AI run. These proofs answer different questions: deterministic tests protect behavior; the live run proves environment integration.</p>
<p>Make one assertion fail deliberately, read the first expected-versus-actual message, and repair only the implicated boundary. Add a mutation that changes source attribution while leaving the proposal untouched; the output citation must follow the source.</p>
<div class="callout"><p>Do not test a provider SDK in general. Test your adapter translation, limits, cancellation, exact verifier, and ownership rules.</p></div>
<div class="callout csharp-transfer"><p><strong>C#/.NET transfer:</strong> C# accessibility and distinct domain types help keep false-quote paths out of the public API, while test doubles exercise interfaces without live services. Avoid widening production members merely for tests; prefer testing observable boundaries or a deliberately justified internal-visibility policy.</p></div>
<div class="field-notes"><div class="fn-head">FIELD NOTES // DAMAGE ORDER</div><p>A color regression is visible. A false quote can look convincing. Spend the earliest and strongest negative controls where an undetected error would be most misleading.</p></div>
'''

[[lessons.readings]]
label = "Microsoft Learn — Unit testing best practices"
url = "https://learn.microsoft.com/en-us/dotnet/core/testing/unit-testing-best-practices"
essential = false

[[lessons.exercises]]
id = "s12-l02-e1"
type = "mc"
points = 25
prompt = "Which is the highest-value first production test for Verisearch?"
choices = ["A live configured-AI call", "Terminal border color", "Download speed", "QuoteVerifier rejects text absent from Passage.Text"]
answer = 3
whyWrong = "Live services and performance are environment-dependent, while border color does not protect truth. The exact-match gate carries the product's central risk."
explain = "A fast deterministic verifier test catches the regression that could let a fabricated quote escape."
hint = "Test the strongest promise first."

[[lessons.exercises]]
id = "s12-l02-e2"
type = "mc"
points = 25
prompt = "Why should the unit test for inner model JSON avoid the real configured AI service?"
choices = ["A fixed string isolates parsing and remains deterministic", "AI providers forbid tests", "HTTP cannot run under xUnit", "A search API is required too"]
answer = 0
whyWrong = "xUnit can perform HTTP and the configured AI does not forbid tests, but external behavior would make this parsing test flaky and unfocused."
explain = "Feed ParseBatch exact valid and invalid strings; acceptance tests own live connectivity."
hint = "One test should have one reason to fail."

[[lessons.exercises]]
id = "s12-l02-e3"
type = "mc"
points = 20
prompt = "A test expects <code>Exact source words</code> without the final period to be rejected, although it is present inside the passage. What is wrong?"
choices = ["Nothing", "The test invents a stricter whole-sentence rule than the ordinal-substring contract", "String.Contains requires punctuation", "xUnit ignores periods"]
answer = 1
whyWrong = "String.Contains does not require punctuation and xUnit does not alter strings. The candidate is a real substring, so the expectation misstates the contract."
explain = "Tests are executable specifications; a wrong expectation can pressure production code into the wrong behavior."
hint = "Search for those exact characters inside the passage."

[[lessons.exercises]]
id = "s12-l02-d1"
type = "type"
points = 14
reps = 2
prompt = "Retype the fabricated-proposal rejection test twice."
code = '''[Fact]
public void Verify_FabricatedText_Rejects()
{
    VerificationBatch result = _verifier.Verify(
        [new QuoteProposal(1, "Words not in the source.")], _passages, 5);
    Assert.Empty(result.Accepted);
    Assert.Equal(1, result.Rejected);
}'''

[[lessons.exercises]]
id = "s12-l02-w1"
type = "write"
points = 38
prompt = "Run four table-driven substring cases against <code>Before. Exact words. After.</code>, compare with expected Booleans, and print the pass count."
starter = '''string passage = "Before. Exact words. After.";
var cases = new (string quote, bool expected)[]
{
    ("Exact words.", true),
    ("Exact words", true),
    ("exact words.", false),
    ("Invented.", false)
};

Console.WriteLine("NOT CHECKED");
'''
expect = "4/4 green"
solution = '''string passage = "Before. Exact words. After.";
var cases = new (string quote, bool expected)[]
{
    ("Exact words.", true),
    ("Exact words", true),
    ("exact words.", false),
    ("Invented.", false)
};

int passed = cases.Count(test =>
    passage.Contains(test.quote, StringComparison.Ordinal) == test.expected);
Console.WriteLine($"{passed}/{cases.Length} green");
'''
hint = "Count cases where ordinal Contains equals the expected Boolean."

[[lessons.concepts]]
id = "language-testing-debugging"
purpose = "Turn a C# promise into an executable check and diagnose failures from the earliest broken boundary."
anatomy = "Arrange controlled inputs, invoke one behavior, assert an observable result, then use compiler, test, or debugger output to localize a failing case."
example = "The disposable examples in Test the Boundaries Where False Quotes Could Escape isolate this capability before the learner chooses how it belongs in the cumulative project. The lesson Test the Boundaries Where False Quotes Could Escape supplies the disposable observation point."
observable = "The check passes for a valid case and fails when its load-bearing input is deliberately changed. Confirm it while practicing Test the Boundaries Where False Quotes Could Escape."
failure = "A test that prints a prepared success receipt or requires live network state cannot distinguish a regression."
practice = "s12-l02-e1"
