[[lessons]]
id = "s12-l02"
teaches = ["contract-tests"]
title = "Test the Boundaries Where False Quotes Could Escape"
body = '''
<p>Prioritize tests by damage. Verisearch's highest-cost regression is presenting altered or misattributed text as verified evidence. Build this deterministic suite before testing decorative output.</p>
<ol><li><strong>QuoteVerifier:</strong> exact substring accepted; changed case, punctuation, unknown id, empty text, duplicate, and over-limit proposals rejected.</li><li><strong>Attribution:</strong> accepted label and URL equal the matched <code>Passage.Source</code>, regardless of any surrounding test data.</li><li><strong>Structured response parsing:</strong> a fixed valid inner JSON string becomes <code>QuoteBatch</code>; malformed JSON throws. Extract parsing into <code>OllamaQuoteSelector.ParseBatch</code> so tests need no server.</li><li><strong>PageExtractor:</strong> fixed HTML yields normalized stable passages, excludes navigation, and retains the exact <code>SourceSpec</code>.</li><li><strong>SourcePolicy:</strong> unknown labels and invalid schemes cannot become selected sources.</li></ol>
<pre><code>[Theory]
[InlineData(<span class="s">"Exact source words."</span>, <span class="k">true</span>)]
[InlineData(<span class="s">"exact source words."</span>, <span class="k">false</span>)]
[InlineData(<span class="s">"Exact source words"</span>, <span class="k">true</span>)]
[InlineData(<span class="s">"Invented source words."</span>, <span class="k">false</span>)]
<span class="k">public void</span> Verify_Candidate_AcceptsOnlyActualSubstrings(<span class="k">string</span> candidate, <span class="k">bool</span> expected)
{
    VerificationBatch result = _verifier.Verify(
        [<span class="k">new</span> QuoteProposal(1, candidate)], _passages, 5);
    Assert.Equal(expected, result.Accepted.Count == 1);
}</code></pre>
<p>The no-period candidate is correctly accepted because it is still a contiguous exact substring. Tests must reflect the actual product contract, not a hidden preference for sentence boundaries.</p>
<p>Do not hit a live URL or model in unit tests. Those services change, fail, and respond nondeterministically. Unit tests provide fixed HTML and JSON values. The acceptance workshop separately proves that the installed services can talk end to end.</p>
<p>Beginner checkpoint: make one test fail deliberately, read its expected-versus-actual message, then undo only that deliberate change.</p>
<div class="callout">Do not test that System.Text.Json parses JSON in general or that Spectre draws a panel. Test your schema boundary, your exactness decision, your attribution ownership, and your extraction rules.</div>
<div class="field-notes"><div class="fn-head">MARGINALIA // A PARSER SEAM</div><p>Move the inner deserialization into <code>public static QuoteBatch ParseBatch(string json)</code> and have <code>SelectAsync</code> call it. The method remains small and deterministic; tests no longer need to fake HttpClient just to prove malformed model content is rejected.</p></div>
'''

[[lessons.readings]]
label = "Microsoft Learn — Unit testing best practices"
url = "https://learn.microsoft.com/en-us/dotnet/core/testing/unit-testing-best-practices"
essential = false

[[lessons.exercises]]
id = "s12-l02-e1"
type = "mc"
points = 25
prompt = "Which is the highest-value first production test for Verisearch?"
choices = ["A live Ollama call", "Terminal border color", "Download speed", "QuoteVerifier rejects text absent from Passage.Text"]
answer = 3
whyWrong = "Live services and performance are environment-dependent, while border color does not protect truth. The exact-match gate carries the product's central risk."
explain = "A fast deterministic verifier test catches the regression that could let a fabricated quote escape."
hint = "Test the strongest promise first."

[[lessons.exercises]]
id = "s12-l02-e2"
type = "mc"
points = 25
prompt = "Why should the unit test for inner model JSON avoid the real Ollama server?"
choices = ["A fixed string isolates parsing and remains deterministic", "Ollama forbids tests", "HTTP cannot run under xUnit", "A search API is required too"]
answer = 0
whyWrong = "xUnit can perform HTTP and Ollama does not forbid tests, but external behavior would make this parsing test flaky and unfocused."
explain = "Feed ParseBatch exact valid and invalid strings; acceptance tests own live connectivity."
hint = "One test should have one reason to fail."

[[lessons.exercises]]
id = "s12-l02-e3"
type = "mc"
points = 20
prompt = "A test expects <code>Exact source words</code> without the final period to be rejected, although it is present inside the passage. What is wrong?"
choices = ["Nothing", "The test invents a stricter whole-sentence rule than the ordinal-substring contract", "String.Contains requires punctuation", "xUnit ignores periods"]
answer = 1
whyWrong = "String.Contains does not require punctuation and xUnit does not alter strings. The candidate is a real substring, so the expectation misstates the contract."
explain = "Tests are executable specifications; a wrong expectation can pressure production code into the wrong behavior."
hint = "Search for those exact characters inside the passage."

[[lessons.exercises]]
id = "s12-l02-d1"
type = "type"
points = 14
reps = 2
prompt = "Retype the fabricated-proposal rejection test twice."
code = '''[Fact]
public void Verify_FabricatedText_Rejects()
{
    VerificationBatch result = _verifier.Verify(
        [new QuoteProposal(1, "Words not in the source.")], _passages, 5);
    Assert.Empty(result.Accepted);
    Assert.Equal(1, result.Rejected);
}'''

[[lessons.exercises]]
id = "s12-l02-w1"
type = "write"
points = 38
prompt = "Run four table-driven substring cases against <code>Before. Exact words. After.</code>, compare with expected Booleans, and print the pass count."
starter = '''string passage = "Before. Exact words. After.";
var cases = new (string quote, bool expected)[]
{
    ("Exact words.", true),
    ("Exact words", true),
    ("exact words.", false),
    ("Invented.", false)
};

Console.WriteLine("NOT CHECKED");
'''
expect = "4/4 green"
solution = '''string passage = "Before. Exact words. After.";
var cases = new (string quote, bool expected)[]
{
    ("Exact words.", true),
    ("Exact words", true),
    ("exact words.", false),
    ("Invented.", false)
};

int passed = cases.Count(test =>
    passage.Contains(test.quote, StringComparison.Ordinal) == test.expected);
Console.WriteLine($"{passed}/{cases.Length} green");
'''
hint = "Count cases where ordinal Contains equals the expected Boolean."
