content = '''
namespace Verisearch.Tests;

public sealed class TruthBoundaryTests
{
    [Fact]
    public void VerifierRejectsFabricationAndOwnsAttribution()
    {
        SourceSpec source = new("Source-owned label", new Uri("https://example.test/source"));
        Passage passage = new("p-one", source, "An exact sentence remains in the passage.");
        var proposals = new QuoteBatch([
            new QuoteProposal(passage.Id, "exact sentence"),
            new QuoteProposal(passage.Id, "invented sentence")
        ]);

        VerificationResult result = new QuoteVerifier().Verify([passage], proposals, 5);

        VerifiedQuote quote = Assert.Single(result.Quotes);
        Assert.Equal("exact sentence", quote.Quote);
        Assert.Equal(source.Label, quote.SourceLabel);
        Assert.Equal(source.Uri, quote.SourceUri);
        Assert.Equal(1, result.RejectedCount);
    }

    [Fact]
    public void ExtractorDoesNotDuplicateNestedListParagraphs()
    {
        SourceSpec source = new("Nested", new Uri("https://example.test/nested"));
        const string html = "<main><ul><li><p>A nested paragraph long enough to become one passage only.</p></li></ul></main>";

        IReadOnlyList<Passage> passages = new PassageExtractor().Extract(
            new SourceDocument(source, html));

        Assert.Single(passages);
        Assert.Equal("A nested paragraph long enough to become one passage only.", passages[0].Text);
    }

    [Fact]
    public void SourceSelectionPreservesTheUsersOrder()
    {
        SourceSpec first = new("First", new Uri("https://example.test/first"));
        SourceSpec second = new("Second", new Uri("https://example.test/second"));

        IReadOnlyList<SourceSpec> selected = SourceSelection.Select(
            [first, second],
            ["second", "first"]);

        Assert.Equal([second, first], selected);
        Assert.Throws<InvalidOperationException>(() => SourceSelection.Select(
            [first, second],
            ["unknown"]));
    }

    [Fact]
    public async Task PipelineKeepsAWholeQuestionAndOneGoodSource()
    {
        SourceSpec good = new("Good", new Uri("https://example.test/good"));
        SourceSpec bad = new("Bad", new Uri("https://example.test/bad"));
        var selector = new RecordingSelector();
        var pipeline = new SearchPipeline(
            new SourceBatch(new ControlledReader(good)),
            new PassageExtractor(),
            selector,
            new QuoteVerifier(),
            3,
            false);

        SearchResult result = await pipeline.RunAsync(
            "Why did the whole release change?",
            [good, bad],
            CancellationToken.None);

        Assert.Equal("Why did the whole release change?", selector.SeenQuestion);
        Assert.Single(result.Quotes);
        Assert.Single(result.Sources, outcome => !outcome.Succeeded);
    }

    private sealed class ControlledReader(SourceSpec good) : ISourceReader
    {
        public Task<SourceDocument> ReadAsync(
            SourceSpec source,
            CancellationToken cancellationToken)
        {
            cancellationToken.ThrowIfCancellationRequested();
            if (source != good)
            {
                throw new HttpRequestException("controlled failure");
            }
            return Task.FromResult(new SourceDocument(
                source,
                "<main><p>A complete exact passage survives the controlled source failure.</p></main>"));
        }
    }

    private sealed class RecordingSelector : IAiQuoteSelector
    {
        public string? SeenQuestion { get; private set; }

        public Task<QuoteBatch> SelectAsync(
            string question,
            IReadOnlyList<Passage> passages,
            CancellationToken cancellationToken)
        {
            cancellationToken.ThrowIfCancellationRequested();
            SeenQuestion = question;
            return Task.FromResult(new QuoteBatch([
                new QuoteProposal(passages[0].Id, "complete exact passage")
            ]));
        }
    }
}
