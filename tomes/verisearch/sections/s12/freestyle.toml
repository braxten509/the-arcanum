[freestyle]
title = "THE LAST WORKING: Set the Seal"
requires = ["xunit-basics", "contract-tests", "dotnet-publish", "release-docs", "acceptance-run"]
brief = "Ship the artifact whose claim the tome now teaches.<ul><li>Create the sibling <code>Verisearch.Tests</code> project. Test exact/altered/fabricated/unknown/duplicate/over-limit proposals, C#-owned label and URL, inner JSON parsing, HTML extraction, source admission, and explicit mock plumbing. No test may require internet or Ollama.</li><li>Run <code>dotnet build</code> and <code>dotnet test</code> from the documented directories; include the green command output in release notes.</li><li>Run the complete acceptance ladder: local fixture with explicit <code>--mock</code>, a deliberately fabricated proposal rejected by the verifier, one partial source failure, a live Ollama call, and live mode with Ollama unavailable.</li><li>Write README.md with tested setup/config/usage, the proposal-and-proof design, explicit mock semantics, whitespace normalization, source-selection limits, and honest non-guarantees.</li><li>Publish a self-contained single-file untrimmed build for the current RID. Run <code>--help</code> and the fixture command from the published artifact path.</li><li>Remove obsolete search/index/keyword-fallback types and temporary Program.cs demos; keep the final canonical file map from Chapter XI.</li></ul>"
reward = 800
packages = []
xray = "THORNE runs the deterministic suite offline, changes one quote character, substitutes a false URL in surrounding test data, and inspects the renderer signature. He then checks a real published path, README limitations, explicit mock banner, and a stopped-Ollama live failure. Generated output without these runtime proofs does not set the seal."

[freestyle.badge]
id = "badge-s12"
name = "THE LAST SEAL"
desc = "From first C# line to a tested binary that can distinguish a proposal from proof."

[[freestyle.rubric]]
criterion = "Truth-contract tests"
weight = 30
desc = "Deterministic tests prove exact rejection, attribution ownership, schema parsing, extraction, source policy, and no verifier bypass."

[[freestyle.rubric]]
criterion = "Acceptance journey"
weight = 20
desc = "Mock, fabricated proposal, partial source failure, live Ollama, and stopped-Ollama cases are exercised from the real entrypoint."

[[freestyle.rubric]]
criterion = "Published artifact"
weight = 20
desc = "The current-RID self-contained untrimmed output is built and its executable path runs help plus a fixture query."

[[freestyle.rubric]]
criterion = "Documentation"
weight = 15
desc = "README commands were run and its architecture, requirements, modes, normalization, and limitations match behavior."

[[freestyle.rubric]]
criterion = "C# release craft"
weight = 15
desc = "PascalCase types/methods, camelCase locals, four-space indentation, Allman braces, specific test names, no dead demo/fallback code, and canonical files only."
