[freestyle]
title = "THE LAST WORKING: Set the Seal"
brief = "The close of the whole commission — a finished artifact.<ul><li>Add <code>Verisearch.Tests</code> (xUnit) covering the big three: trust scoring (Facts + a Theory), LLM output parsing (the four personalities as InlineData), and HTML extraction (fixture strings, pre-whitespace check)</li><li>All green under <code>dotnet test</code></li><li>Publish a self-contained single-file binary for your platform, and prove the PUBLISHED binary works (paste its output in the terminal)</li><li>Write the full README (pitch → example → install → usage → config → how-it-works → limitations); polish every --help description</li><li>Version banner + honest exit codes</li></ul>This is the one THORNE grades like a code review on a real release."
reward = 800
packages = []
xray = "THORNE runs dotnet test himself and reads names before bodies — vague names (Test1, TestParse) hurt even when green. He checks the parser Theory actually includes an out-of-range-index case. For publish he wants proof the binary ran WITHOUT the SDK path (banner output pasted). README: he reads Limitations FIRST — missing or dishonest = documentation criterion halved. The holistic pass rewards consistency: same error-message voice, same naming, same patterns from Chapter V to Chapter XII."

