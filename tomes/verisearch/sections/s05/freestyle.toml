[freestyle]
title = "THE WORKING: The Source Charter"
requires = ["file-io", "portable-paths", "json-config", "config-validation", "config-loader"]
brief = "Add the project’s durable policy boundary without restarting it.<ul><li>Create <code>ConfigLoader.cs</code> exactly as the workshop specifies and keep <code>AppConfig</code> in <code>Models.cs</code>.</li><li>Use <code>Environment.GetFolderPath</code> and <code>Path.Combine</code> for <code>~/.verisearch/config.json</code>; never place a literal <code>~</code> in a file API.</li><li>Create a readable default only when the file is absent, then deserialize it with <code>System.Text.Json</code> and <code>JsonStringEnumConverter</code>.</li><li>Validate the Ollama URL, model, quote limit, and every <code>SourceSpec</code>. An existing invalid file must produce its path plus useful errors and remain byte-for-byte untouched.</li><li>At startup, print the number of configured sources and their labels. Do not invent, repair, or silently downgrade source trust.</li><li>Run <code>dotnet build</code>, then test missing, valid, malformed, and invalid-value configurations.</li></ul>"
reward = 350
packages = []
xray = "THORNE tries four ledgers: absent, valid, malformed JSON, and valid JSON with an impossible quote limit. He checks that only the absent case writes a file, that paths are portable, and that invalid user policy is reported rather than replaced."

[freestyle.badge]
id = "badge-s05"
name = "KEEPER OF THE LEDGER"
desc = "The tome reads a user-owned source charter without rewriting inconvenient truths."

[[freestyle.rubric]]
criterion = "Missing-file path"
weight = 20
desc = "Creates the directory and documented JSON default only when config.json does not exist."

[[freestyle.rubric]]
criterion = "Typed JSON loading"
weight = 20
desc = "Deserializes AppConfig and SourceSpec with shared options, including string enum values."

[[freestyle.rubric]]
criterion = "Non-destructive diagnostics"
weight = 25
desc = "Malformed or invalid existing config prints its path and actionable errors without overwriting it."

[[freestyle.rubric]]
criterion = "Source-policy integration"
weight = 20
desc = "Program.cs reports configured sources from the loaded model and never silently invents trust or sources."

[[freestyle.rubric]]
criterion = "C# craft"
weight = 15
desc = "PascalCase types and methods, camelCase locals, four-space indentation, Allman braces, and one focused ConfigLoader file."
