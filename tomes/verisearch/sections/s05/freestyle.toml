instruction = "Private replay loads user-owned source configuration without overwriting malformed input."
content = '''
using System.Text.Json;

namespace Verisearch;

public static class SourceCatalog
{
    private static readonly JsonSerializerOptions JsonOptions = new()
    {
        PropertyNameCaseInsensitive = true,
        ReadCommentHandling = JsonCommentHandling.Skip
    };

    public static async Task<IReadOnlyList<SourceSpec>> LoadAsync(
        string path,
        CancellationToken cancellationToken)
    {
        string json = await File.ReadAllTextAsync(path, cancellationToken);
        CatalogDocument? document = JsonSerializer.Deserialize<CatalogDocument>(json, JsonOptions);
        if (document?.Sources is not { Count: > 0 })
        {
            throw new InvalidOperationException($"{path}: sources must contain at least one entry");
        }

        var labels = new HashSet<string>(StringComparer.OrdinalIgnoreCase);
        var sources = new List<SourceSpec>();
        foreach (CatalogSource candidate in document.Sources)
        {
            string label = candidate.Label?.Trim() ?? "";
            if (label.Length == 0 || !labels.Add(label))
            {
                throw new InvalidOperationException($"{path}: every source label must be non-empty and unique");
            }
            if (!Uri.TryCreate(candidate.Url, UriKind.Absolute, out Uri? uri)
                || uri.Scheme is not ("http" or "https" or "file"))
            {
                throw new InvalidOperationException(
                    $"{path}: source {label} needs an absolute http, https, or file URL");
            }
            sources.Add(new SourceSpec(label, uri));
        }
        return sources;
    }

    private sealed record CatalogDocument(List<CatalogSource> Sources);

    private sealed record CatalogSource(string? Label, string? Url);
}
'''
