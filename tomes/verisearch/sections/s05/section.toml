id = "s05"
codename = "CHAPTER V // THE MEMORY OF PAGES"
short = "The Memory of Pages"
title = "The Memory of Pages — Files & Configuration"
build = "The source charter — typed JSON policy read from ~/.verisearch"
brief = "Values carved into the runes are for parlor tricks. True artifacts read their charters from leaves on disk. This chapter teaches files, paths that hold on any land, built-in JSON serialization, and recovery when a charter is missing or malformed. Its Working adds <code>ConfigLoader.cs</code>: one non-destructive boundary for the local model, quote limit, and sources the user explicitly trusts."
