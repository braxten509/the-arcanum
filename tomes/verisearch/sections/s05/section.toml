codename = "CHAPTER V // THE MEMORY OF PAGES"
short = "The Memory of Pages"
title = "The Memory of Pages — Files & Configuration"
build = "The ledger of trust — a YAML charter read from ~/.verisearch"
brief = "Values carved into the runes are for parlor tricks. True artifacts read their charters from leaves on disk. This chapter: the reading and writing of files, paths that hold on any land (the <code>~</code> problem), YAML with YamlDotNet, and surviving a charter that is missing or mangled. The Working: the tome reads its ledger of trusted domains from <code>~/.verisearch/config.yaml</code> — writing a fresh one where none exists."
