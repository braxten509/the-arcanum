[[lessons]]
id = "s05-l01"
teaches = ["language-serialization-io"]
title = "Files — read, write, check"
body = '''

<p>The <code>File</code> static class covers 90% of file work in one-liners:</p>
<pre><code data-kind="replacement"><span class="c">// write (creates or overwrites)</span>
File.WriteAllText(<span class="s">"notes.txt"</span>, <span class="s">"source: RFC 8446"</span>);

<span class="c">// read the whole thing</span>
<span class="k">string</span> content = File.ReadAllText(<span class="s">"notes.txt"</span>);

<span class="c">// read as lines</span>
<span class="k">string</span>[] lines = File.ReadAllLines(<span class="s">"notes.txt"</span>);

<span class="c">// append without clobbering</span>
File.AppendAllText(<span class="s">"log.txt"</span>, <span class="s">$"[{DateTime.Now}] query ran\n"</span>);

<span class="c">// look before you leap</span>
<span class="k">if</span> (File.Exists(<span class="s">"config.json"</span>)) { ... }
<span class="k">if</span> (Directory.Exists(<span class="s">"/home/op/.verisearch"</span>)) { ... }
Directory.CreateDirectory(<span class="s">"/home/op/.verisearch"</span>);   <span class="c">// mkdir -p: no error if it exists</span></code></pre>
<p>Async variants exist for all of them (<code>ReadAllTextAsync</code>…) — use them inside async code.</p>
<p>What throws: reading a file that doesn't exist (<code>FileNotFoundException</code>), a folder that doesn't exist in the write path (<code>DirectoryNotFoundException</code>), permissions (<code>UnauthorizedAccessException</code>). The pattern:</p>
<pre><code data-kind="replacement"><span class="k">try</span>
{
    <span class="k">string</span> json = File.ReadAllText(configPath);
}
<span class="k">catch</span> (FileNotFoundException)
{
    Console.WriteLine(<span class="s">"no config found — writing defaults"</span>);
    WriteDefaultConfig(configPath);
}</code></pre>
<div class="callout"><code>File.Exists</code> then <code>ReadAllText</code> has a microscopic race window (file deleted in between). For config loading it's fine — just know that try/catch is the airtight version.</div>
<div class="callout csharp-transfer"><p><strong>C#/.NET transfer:</strong> The .NET base library offers convenient <code>File</code> methods and lower-level <code>FileStream</code>/<code>StreamReader</code> ownership. <code>using</code> and <code>await using</code> encode deterministic disposal on top of garbage collection—GC manages memory, not timely release of file handles.</p></div>
<div class="field-notes"><div class="fn-head">MARGINALIA // THE DEEPER CUT — IN THORNE'S HAND</div>
<p><strong>Encoding:</strong> File methods default to UTF-8 — correct for config and virtually everything modern. If a scraped file ever looks like <code>Ã©</code> soup, that's an encoding mismatch.</p>
<p><strong>Relative paths resolve against the CURRENT WORKING DIRECTORY</strong> — which is wherever the user ran your tool from, not where the exe lives. That's exactly why config belongs at an absolute, computed path like <code>~/.verisearch</code>. (The exe's own folder, if you need it: <code>AppContext.BaseDirectory</code>.)</p>
<p><strong>Streams exist</strong> below the one-liners: <code>File.OpenRead</code>/<code>StreamReader</code> process gigabyte files line-by-line without loading them whole. Verisearch's configs are tiny — one-liners are correct here; just know the basement exists.</p></div>
'''

