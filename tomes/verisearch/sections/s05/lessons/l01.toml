label = "Microsoft Learn — \"File and stream I/O\""
url = "https://learn.microsoft.com/en-us/dotnet/standard/io/"
essential = false

[[lessons.exercises]]
id = "s05-l01-e1"
type = "mc"
points = 15
required = true
capabilities = ["language-serialization-io"]
cognitiveTask = "explain"
scaffold = "guided"
contextFamily = "verisearch-s05-serialization-io"
aidPolicy = "learning"
prompt = "<code>File.WriteAllText(path, text)</code> on a file that already exists…"
choices = ["throws an exception", "appends to it", "creates a backup first", "overwrites it completely"]
answer = 3
whyWrong = "WriteAllText doesn’t append, back up, or throw on an existing file — it replaces the contents entirely."
hint = "Append has its own method."
reviewVariants = [
  { prompt = "Malformed existing JSON is evidence. What should the loader do?", choices = ["Report it without overwriting the file", "Replace it silently", "Treat text as trusted", "Send it to the renderer"], answer = 0 },
  { prompt = "When does external JSON become trusted typed data?", choices = ["After deserialization and value validation", "When downloaded", "When pretty-printed", "When an AI emits it"], answer = 0 }
]

