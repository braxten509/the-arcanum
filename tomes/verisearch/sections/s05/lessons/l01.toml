[[lessons.exercises]]
id = "s05-l01-w1"
type = "write"
points = 34
required = true
capabilities = ["language-serialization-io"]
cognitiveTask = "build"
scaffold = "guided"
contextFamily = "verisearch-s05-serialization-io"
aidPolicy = "learning"
prompt = "Full write-then-read round trip: write the text <code>{\"maxQuotes\":5}</code> to a temp file (<code>Path.GetTempFileName()</code>), read it back, print <code>reloaded: &lt;contents&gt;</code>, then delete the file with <code>File.Delete</code>."
expect = '''reloaded: {"maxQuotes":5}'''
solution = '''
string path = Path.GetTempFileName();
File.WriteAllText(path, """{"maxQuotes":5}""");
string contents = File.ReadAllText(path);
Console.WriteLine($"reloaded: {contents}");
File.Delete(path);
'''
hint = "var p = Path.GetTempFileName(); WriteAllText; ReadAllText; WriteLine; Delete."

[[lessons.concepts]]
id = "language-serialization-io"
purpose = "Move typed data across file, JSON, HTTP, process, and terminal boundaries without confusing external text with trusted objects."
anatomy = "Select an I/O API, await or dispose it correctly, serialize or deserialize a declared shape, then validate the resulting values."
example = "The disposable examples in Files — read, write, check isolate this capability before the learner chooses how it belongs in the cumulative project. The lesson Files — read, write, check supplies the disposable observation point."
observable = "Valid input becomes the intended typed data and malformed input produces a specific boundary diagnostic. Confirm it while practicing Files — read, write, check."
failure = "Scraping loosely structured text or overwriting invalid user data destroys the evidence needed to repair it."
practice = "s05-l01-e1"
