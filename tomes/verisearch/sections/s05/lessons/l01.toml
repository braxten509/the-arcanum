[[lessons]]
id = "s05-l01"
teaches = ["language-serialization-io"]
title = "Files — read, write, check"
body = '''

<p>The <code>File</code> static class covers 90% of file work in one-liners:</p>
<pre><code data-kind="replacement"><span class="c">// write (creates or overwrites)</span>
File.WriteAllText(<span class="s">"notes.txt"</span>, <span class="s">"source: RFC 8446"</span>);

<span class="c">// read the whole thing</span>
<span class="k">string</span> content = File.ReadAllText(<span class="s">"notes.txt"</span>);

<span class="c">// read as lines</span>
<span class="k">string</span>[] lines = File.ReadAllLines(<span class="s">"notes.txt"</span>);

<span class="c">// append without clobbering</span>
File.AppendAllText(<span class="s">"log.txt"</span>, <span class="s">$"[{DateTime.Now}] query ran\n"</span>);

<span class="c">// look before you leap</span>
<span class="k">if</span> (File.Exists(<span class="s">"config.json"</span>)) { ... }
<span class="k">if</span> (Directory.Exists(<span class="s">"/home/op/.verisearch"</span>)) { ... }
Directory.CreateDirectory(<span class="s">"/home/op/.verisearch"</span>);   <span class="c">// mkdir -p: no error if it exists</span></code></pre>
<p>Async variants exist for all of them (<code>ReadAllTextAsync</code>…) — use them inside async code.</p>
<p>What throws: reading a file that doesn't exist (<code>FileNotFoundException</code>), a folder that doesn't exist in the write path (<code>DirectoryNotFoundException</code>), permissions (<code>UnauthorizedAccessException</code>). The pattern:</p>
<pre><code data-kind="replacement"><span class="k">try</span>
{
    <span class="k">string</span> json = File.ReadAllText(configPath);
}
<span class="k">catch</span> (FileNotFoundException)
{
    Console.WriteLine(<span class="s">"no config found — writing defaults"</span>);
    WriteDefaultConfig(configPath);
}</code></pre>
<div class="callout"><code>File.Exists</code> then <code>ReadAllText</code> has a microscopic race window (file deleted in between). For config loading it's fine — just know that try/catch is the airtight version.</div><div class="field-notes"><div class="fn-head">MARGINALIA // THE DEEPER CUT — IN THORNE'S HAND</div>
<p><strong>Encoding:</strong> File methods default to UTF-8 — correct for config and virtually everything modern. If a scraped file ever looks like <code>Ã©</code> soup, that's an encoding mismatch.</p>
<p><strong>Relative paths resolve against the CURRENT WORKING DIRECTORY</strong> — which is wherever the user ran your tool from, not where the exe lives. That's exactly why config belongs at an absolute, computed path like <code>~/.verisearch</code>. (The exe's own folder, if you need it: <code>AppContext.BaseDirectory</code>.)</p>
<p><strong>Streams exist</strong> below the one-liners: <code>File.OpenRead</code>/<code>StreamReader</code> process gigabyte files line-by-line without loading them whole. Verisearch's configs are tiny — one-liners are correct here; just know the basement exists.</p></div>
'''

[[lessons.readings]]
label = "Microsoft Learn — \"File and stream I/O\""
url = "https://learn.microsoft.com/en-us/dotnet/standard/io/"
essential = false

[[lessons.exercises]]
id = "s05-l01-e1"
type = "mc"
points = 15
prompt = "<code>File.WriteAllText(path, text)</code> on a file that already exists…"
choices = ["throws an exception", "appends to it", "creates a backup first", "overwrites it completely"]
answer = 3
whyWrong = "WriteAllText doesn’t append, back up, or throw on an existing file — it replaces the contents entirely."
hint = "Append has its own method."

[[lessons.exercises]]
id = "s05-l01-e2"
type = "text"
points = 20
prompt = "Which Directory method creates a folder AND all missing parents, without erroring if it already exists?"
answer = "CreateDirectory"
accept = ["directory.createdirectory", "createdirectory()"]
hint = "The .NET equivalent of mkdir -p."

[[lessons.exercises]]
id = "s05-l01-e3"
type = "mc"
points = 20
prompt = "Reading a nonexistent file with <code>File.ReadAllText</code> throws…"
choices = ["FileNotFoundException", "NullReferenceException", "IOException only on Windows", "nothing — returns empty string"]
answer = 0
whyWrong = "Reading a missing file throws FileNotFoundException — not a null-reference, and it never silently returns an empty string."
hint = "Exactly what it says on the tin."

[[lessons.exercises]]
id = "s05-l01-d1"
type = "type"
points = 12
reps = 2
prompt = "The read-or-create-defaults shape. Twice."
code = '''
try
{
    string json = File.ReadAllText(configPath);
}
catch (FileNotFoundException)
{
    WriteDefaultConfig(configPath);
}'''

[[lessons.exercises]]
id = "s05-l01-w1"
type = "write"
points = 34
prompt = "Full write-then-read round trip: write the text <code>{\"maxQuotes\":5}</code> to a temp file (<code>Path.GetTempFileName()</code>), read it back, print <code>reloaded: &lt;contents&gt;</code>, then delete the file with <code>File.Delete</code>."
expect = '''reloaded: {"maxQuotes":5}'''
solution = '''
string path = Path.GetTempFileName();
File.WriteAllText(path, """{"maxQuotes":5}""");
string contents = File.ReadAllText(path);
Console.WriteLine($"reloaded: {contents}");
File.Delete(path);
'''
hint = "var p = Path.GetTempFileName(); WriteAllText; ReadAllText; WriteLine; Delete."

[[lessons.concepts]]
id = "language-serialization-io"
purpose = "Move typed data across file, JSON, HTTP, process, and terminal boundaries without confusing external text with trusted objects."
anatomy = "Select an I/O API, await or dispose it correctly, serialize or deserialize a declared shape, then validate the resulting values."
example = "The disposable examples in Files — read, write, check isolate this capability before the learner chooses how it belongs in the cumulative project. The lesson Files — read, write, check supplies the disposable observation point."
observable = "Valid input becomes the intended typed data and malformed input produces a specific boundary diagnostic. Confirm it while practicing Files — read, write, check."
failure = "Scraping loosely structured text or overwriting invalid user data destroys the evidence needed to repair it."
practice = "s05-l01-e1"

[[lessons.artifactSteps]]
id = "s05-l01-author-artifact"
path = "src/Verisearch/SourceCatalog.cs"
mode = "author"
instruction = "Use the C# ideas from Files — read, write, check to author or revise this learner-owned path toward the chapter behavior: Load a user-owned catalog of source labels and URLs without rewriting invalid input or inventing authority. Choose your own type names, method boundaries, and file organization; the lesson examples are disposable and are not a production template."
checks = ["A valid catalog loads in order, and malformed or invalid existing JSON is diagnosed without being overwritten.", "The complete solution builds from saved source, and a deliberately changed load-bearing input makes the relevant check fail before repair."]
