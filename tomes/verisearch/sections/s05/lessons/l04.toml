[[lessons.exercises]]
id = "s05-l04-w1"
type = "write"
points = 38
required = true
capabilities = ["language-testing-debugging"]
cognitiveTask = "build"
scaffold = "guided"
contextFamily = "verisearch-s05-config-validation-policy"
aidPolicy = "learning"
prompt = "Write <code>Validate(int maxQuotes)</code> returning a list containing <code>range</code> only when the value is outside 1 through 10. Call it for 0, 5, and 11; print each error count on one line."
starter = '''Console.WriteLine("NOT VALIDATED");

// Define Validate below.
'''
expect = "1 0 1"
solution = '''Console.WriteLine($"{Validate(0).Count} {Validate(5).Count} {Validate(11).Count}");

static List<string> Validate(int maxQuotes)
{
    var errors = new List<string>();
    if (maxQuotes < 1 || maxQuotes > 10)
    {
        errors.Add("range");
    }
    return errors;
}
'''
hint = "Create a list, add one item for an out-of-range value, return the list."

[[lessons.concepts]]
id = "language-config-validation-policy"
purpose = "Convert parseable catalog text into admitted source policy, and reject ambiguity before the first network call."
anatomy = "Validation requires a non-empty collection, trimmed non-blank labels, one documented comparison for uniqueness, an absolute address, and a supported scheme."
example = "A configured address run through Uri.TryCreate so an unusable value is refused locally, with the reason named in the diagnostic."
observable = "Every rejection happens before networking, names the entry it came from, and is reproducible with no connection at all."
failure = "Validating late lets a duplicate label or an unsupported scheme surface as a confusing network error the seeker cannot act on."
practice = "s05-l04-e1"
