[[lessons]]
id = "s05-l04"
teaches = ["config-validation"]
title = "Validate Configuration — Reject Ambiguity Early"
body = '''
<p>Deserialization proves only that JSON can become the shape of <code>AppConfig</code>. It does not prove that the values are usable. Validation is the next, separate step. Keeping those steps separate makes an error precise: malformed punctuation is a JSON problem; an empty model name is a configuration-policy problem.</p>
<p>Write the rules down before writing the method. Verisearch requires:</p>
<ol><li>a nonblank model name;</li><li>an absolute HTTP or HTTPS Ollama address;</li><li><code>MaxQuotes</code> between one and ten;</li><li>at least one configured source;</li><li>a nonblank, case-insensitively unique label for every source;</li><li>a user-authored trust value from zero through ten; and</li><li>a URL scheme that agrees with <code>SourceKind</code>.</li></ol>
<p>The final rule needs actual URI parsing. Do not inspect a URL with <code>StartsWith("http")</code>; malformed strings can share that prefix. Practice the non-throwing gate independently:</p>
<pre><code><span class="k">static string</span>? ExplainBadWebAddress(<span class="k">string</span> value)
{
    <span class="k">if</span> (!Uri.TryCreate(value, UriKind.Absolute, <span class="k">out</span> Uri? parsed))
        <span class="k">return</span> <span class="s">"URL must be absolute"</span>;

    <span class="k">bool</span> web = parsed.Scheme == Uri.UriSchemeHttp
        || parsed.Scheme == Uri.UriSchemeHttps;
    <span class="k">return</span> web ? <span class="k">null</span> : <span class="s">"web source must use HTTP or HTTPS"</span>;
}</code></pre>
<p>A nullable return is useful for one tiny rule: null means no complaint. The complete workshop uses <code>List&lt;string&gt;</code> because a learner should see every problem in one run instead of repairing and rerunning the file seven times. It also branches on <code>SourceKind</code>, admitting <code>mock://</code> only for the clearly labeled local fixture.</p>
<p>Missing and invalid are different states. When the file is absent, a documented default may be created because no user policy exists yet. When the file exists but parsing or validation fails, keep it untouched, print its exact path, and stop. Never “repair” a label, URL, trust value, or model name silently; those are the user's choices.</p>
<div class="callout">Beginner recovery loop: read the first diagnostic, open the printed file, change one value, save, and run again. A JSON line-and-byte location points to text syntax. A named validation rule points to a value.</div>
<div class="field-notes"><div class="fn-head">MARGINALIA // THE WORKSHOP IS CANONICAL</div>
<p>This lesson isolates the reasoning and one URI helper. Do not create a second production validator from it. The next lesson gives the complete <code>ConfigLoader.cs</code>, including the one list-returning method the finished project keeps and tests.</p></div>
'''

[[lessons.readings]]
label = "Microsoft Learn — Exceptions and validation guidance"
url = "https://learn.microsoft.com/en-us/dotnet/standard/exceptions/best-practices-for-exceptions"
essential = false

[[lessons.exercises]]
id = "s05-l04-e1"
type = "mc"
points = 20
prompt = "Why should Validate return all discovered errors?"
choices = ["C# forbids exceptions", "The learner can repair the file in one pass and tests can assert rules as data", "Lists automatically fix config", "JSON requires a list"]
answer = 1
whyWrong = "Exceptions remain available, lists do not repair values, and JSON imposes no such rule. Collecting errors improves repair and testing."
explain = "Validation diagnostics are ordinary data until the application boundary decides to stop."
hint = "Imagine rerunning after fixing only the first of four errors."

[[lessons.exercises]]
id = "s05-l04-e2"
type = "mc"
points = 20
prompt = "An existing config is malformed. What must ConfigLoader avoid?"
choices = ["Printing its path", "Returning an error", "Overwriting the user's file with defaults", "Catching JsonException at the boundary"]
answer = 2
whyWrong = "Path and parse diagnostics help recovery; overwriting destroys the user's policy and the evidence needed to fix it."
explain = "Defaults may create a missing file, never replace an invalid existing one silently."
hint = "Preserve user-owned state."

[[lessons.exercises]]
id = "s05-l04-e3"
type = "fill"
points = 20
prompt = "Complete the condition that keeps a quote limit inside the allowed range."
code = '''if (config.MaxQuotes < 1 ____ config.MaxQuotes > 10)
    errors.Add("maxQuotes must be between 1 and 10");'''
answer = "||"
hint = "Either side being true makes the value invalid."

[[lessons.exercises]]
id = "s05-l04-d1"
type = "type"
points = 14
reps = 2
prompt = "Retype the non-destructive config rule twice."
code = '''if (!File.Exists(path))
{
    File.WriteAllText(path, defaultJson);
}
// An existing invalid file is reported, never overwritten.
'''

[[lessons.exercises]]
id = "s05-l04-w1"
type = "write"
points = 38
prompt = "Write <code>Validate(int maxQuotes)</code> returning a list containing <code>range</code> only when the value is outside 1 through 10. Call it for 0, 5, and 11; print each error count on one line."
starter = '''Console.WriteLine("NOT VALIDATED");

// Define Validate below.
'''
expect = "1 0 1"
solution = '''Console.WriteLine($"{Validate(0).Count} {Validate(5).Count} {Validate(11).Count}");

static List<string> Validate(int maxQuotes)
{
    var errors = new List<string>();
    if (maxQuotes < 1 || maxQuotes > 10)
    {
        errors.Add("range");
    }
    return errors;
}
'''
hint = "Create a list, add one item for an out-of-range value, return the list."
