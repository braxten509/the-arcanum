[[lessons]]
id = "s05-l04"
teaches = ["config-validation"]
title = "Validate Configuration — Reject Ambiguity Early"
body = '''
<p>Deserialization proves only that JSON can be shaped like <code>AppConfig</code>. Verisearch must also prove that its model name, quote limit, and source identities are usable. Put those rules in one method that returns all errors, not one exception per property.</p>
<pre><code><span class="k">public static</span> List&lt;<span class="k">string</span>&gt; Validate(AppConfig config)
{
    <span class="k">var</span> errors = <span class="k">new</span> List&lt;<span class="k">string</span>&gt;();

    <span class="k">if</span> (<span class="k">string</span>.IsNullOrWhiteSpace(config.Model))
        errors.Add(<span class="s">"model is required"</span>);
    <span class="k">if</span> (config.MaxQuotes < 1 || config.MaxQuotes > 10)
        errors.Add(<span class="s">"maxQuotes must be between 1 and 10"</span>);
    <span class="k">if</span> (config.Sources.Count == 0)
        errors.Add(<span class="s">"at least one source is required"</span>);

    <span class="k">foreach</span> (SourceSpec source <span class="k">in</span> config.Sources)
    {
        <span class="k">if</span> (<span class="k">string</span>.IsNullOrWhiteSpace(source.Label))
            errors.Add(<span class="s">"every source needs a label"</span>);
        <span class="k">if</span> (source.Trust < 0 || source.Trust > 10)
            errors.Add(<span class="s">$"{source.Label}: trust must be 0 through 10"</span>);
    }

    <span class="k">return</span> errors;
}</code></pre>
<p>URL validation is a separate rule because fixture URLs and web URLs have different contracts. A web source must be an absolute HTTP or HTTPS URI. A local fixture must use the <code>mock</code> scheme. Chapter VII will give this policy a dedicated class; for now validate enough to prevent a confusing network call.</p>
<p>When the config file does not exist, creating a documented default is safe because there is no user file to overwrite. When it exists but cannot parse or validate, print the exact path plus every error and stop. Do not “repair” trust scores or source URLs silently. The user owns those choices.</p>
<div class="callout">Beginner recovery loop: read the first error, open the printed path, change one value, save, run <code>dotnet run</code> again. If the JSON parser reports a line and byte position, go there before changing C#.</div>
<div class="field-notes"><div class="fn-head">MARGINALIA // VALIDATION RESULTS AS DATA</div>
<p>Returning <code>List&lt;string&gt;</code> keeps validation easy to test and lets the CLI render every problem at once. Throwing is appropriate after the boundary decides configuration cannot continue; individual rules themselves can remain ordinary data transformations.</p></div>
'''

[[lessons.readings]]
label = "Microsoft Learn — Exceptions and validation guidance"
url = "https://learn.microsoft.com/en-us/dotnet/standard/exceptions/best-practices-for-exceptions"
essential = false

[[lessons.exercises]]
id = "s05-l04-e1"
type = "mc"
points = 20
prompt = "Why should Validate return all discovered errors?"
choices = ["C# forbids exceptions", "The learner can repair the file in one pass and tests can assert rules as data", "Lists automatically fix config", "JSON requires a list"]
answer = 1
whyWrong = "Exceptions remain available, lists do not repair values, and JSON imposes no such rule. Collecting errors improves repair and testing."
explain = "Validation diagnostics are ordinary data until the application boundary decides to stop."
hint = "Imagine rerunning after fixing only the first of four errors."

[[lessons.exercises]]
id = "s05-l04-e2"
type = "mc"
points = 20
prompt = "An existing config is malformed. What must ConfigLoader avoid?"
choices = ["Printing its path", "Returning an error", "Overwriting the user's file with defaults", "Catching JsonException at the boundary"]
answer = 2
whyWrong = "Path and parse diagnostics help recovery; overwriting destroys the user's policy and the evidence needed to fix it."
explain = "Defaults may create a missing file, never replace an invalid existing one silently."
hint = "Preserve user-owned state."

[[lessons.exercises]]
id = "s05-l04-e3"
type = "fill"
points = 20
prompt = "Complete the condition that keeps a quote limit inside the allowed range."
code = '''if (config.MaxQuotes < 1 ____ config.MaxQuotes > 10)
    errors.Add("maxQuotes must be between 1 and 10");'''
answer = "||"
hint = "Either side being true makes the value invalid."

[[lessons.exercises]]
id = "s05-l04-d1"
type = "type"
points = 14
reps = 2
prompt = "Retype the non-destructive config rule twice."
code = '''if (!File.Exists(path))
{
    File.WriteAllText(path, defaultJson);
}
// An existing invalid file is reported, never overwritten.
'''

[[lessons.exercises]]
id = "s05-l04-w1"
type = "write"
points = 38
prompt = "Write <code>Validate(int maxQuotes)</code> returning a list containing <code>range</code> only when the value is outside 1 through 10. Call it for 0, 5, and 11; print each error count on one line."
starter = '''Console.WriteLine("NOT VALIDATED");

// Define Validate below.
'''
expect = "1 0 1"
solution = '''Console.WriteLine($"{Validate(0).Count} {Validate(5).Count} {Validate(11).Count}");

static List<string> Validate(int maxQuotes)
{
    var errors = new List<string>();
    if (maxQuotes < 1 || maxQuotes > 10)
    {
        errors.Add("range");
    }
    return errors;
}
'''
hint = "Create a list, add one item for an out-of-range value, return the list."
