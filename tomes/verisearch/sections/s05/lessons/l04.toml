[[lessons]]
id = "s05-l04"
teaches = ["language-config-validation-policy"]
title = "Validate Configuration — Reject Ambiguity Early"
body = '''

<p>Validation converts parseable catalog data into admitted source policy. Perform it before networking so failures are fast, local, and testable.</p>
<p>At minimum, require a non-empty source collection; trimmed nonblank labels; a documented case comparison for uniqueness; an absolute address; and a scheme supported by the chosen reader. If local files are supported, keep that source kind explicit rather than accepting every URI accidentally.</p>
<pre><code data-kind="replacement">if (!Uri.TryCreate(candidate.Url, UriKind.Absolute, out Uri? uri))
{
    throw new InvalidOperationException("source URL must be absolute");
}
</code></pre>
<p>The fragment isolates one check. A complete validator should include the entry label and catalog path in diagnostics without echoing credentials. Return a result type or throw focused exceptions—either can work if invalid and empty states are unambiguous.</p>
<p>Reject duplicate labels according to the same comparer later selection uses. Otherwise configuration may load successfully but a user request becomes ambiguous. Preserve first-declared order in the admitted list.</p>
<p>Do not validate provider-specific model names or endpoints inside the source catalog unless your own design deliberately combines those concerns and you can defend the tradeoff. A CLI provider may need an executable and argument list; an API provider may need an endpoint and environment-held key. Those are adapter configuration contracts, not source-authority rules.</p>
<p>Test one failure at a time: blank label, duplicate under the selected comparison, relative URL, unsupported scheme, missing collection, and a valid ordered catalog. Assert that no source reader was called for invalid policy.</p>
<div class="callout"><p>Validation protects explicit user intent. It must not add replacement sources, guess a missing URL, or inspect question keywords.</p></div>
<div class="callout csharp-transfer"><p><strong>C#/.NET transfer:</strong> Nullable flow analysis proves that code checked for absence; it cannot prove a nonblank label, supported URI scheme, or uniqueness rule. C# operations such as <code>Uri.TryCreate(..., out var uri)</code> combine parsing with definite assignment, but application policy still follows afterward.</p></div>
<div class="field-notes"><div class="fn-head">FIELD NOTES // DIAGNOSTIC PRECISION</div><p>“Invalid configuration” names no repair. “catalog.json: source 'Archive' needs an absolute http, https, or file URL” names the owner, entry, and rule.</p></div>
'''

[[lessons.readings]]
label = "Microsoft Learn — Exceptions and validation guidance"
url = "https://learn.microsoft.com/en-us/dotnet/standard/exceptions/best-practices-for-exceptions"
essential = false

[[lessons.exercises]]
id = "s05-l04-e1"
type = "mc"
points = 20
required = true
capabilities = ["language-testing-debugging"]
cognitiveTask = "explain"
scaffold = "guided"
contextFamily = "verisearch-s05-config-validation-policy"
aidPolicy = "learning"
prompt = "Why should Validate return all discovered errors?"
choices = ["C# forbids exceptions", "JSON requires a list", "Lists automatically fix config", "The learner can repair the file in one pass and tests can assert rules as data"]
answer = 3
whyWrong = "Exceptions remain available, lists do not repair values, and JSON imposes no such rule. Collecting errors improves repair and testing."
explain = "Validation diagnostics are ordinary data until the application boundary decides to stop."
hint = "Imagine rerunning after fixing only the first of four errors."

[[lessons.exercises]]
id = "s05-l04-e2"
type = "mc"
points = 20
required = true
capabilities = ["language-testing-debugging"]
cognitiveTask = "explain"
scaffold = "guided"
contextFamily = "verisearch-s05-config-validation-policy"
aidPolicy = "learning"
prompt = "An existing config is malformed. What must ConfigLoader avoid?"
choices = ["Printing its path", "Returning an error", "Overwriting the user's file with defaults", "Catching JsonException at the boundary"]
answer = 2
whyWrong = "Path and parse diagnostics help recovery; overwriting destroys the user's policy and the evidence needed to fix it."
explain = "Defaults may create a missing file, never replace an invalid existing one silently."
hint = "Preserve user-owned state."

[[lessons.exercises]]
id = "s05-l04-e3"
type = "fill"
points = 20
required = true
capabilities = ["language-testing-debugging"]
cognitiveTask = "complete"
scaffold = "guided"
contextFamily = "verisearch-s05-config-validation-policy"
aidPolicy = "learning"
prompt = "Complete the condition that keeps a quote limit inside the allowed range."
code = '''if (config.MaxQuotes < 1 ____ config.MaxQuotes > 10)
    errors.Add("maxQuotes must be between 1 and 10");'''
answer = "||"
hint = "Either side being true makes the value invalid."

