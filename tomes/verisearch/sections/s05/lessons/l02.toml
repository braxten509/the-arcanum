[[lessons]]
id = "s05-l02"
teaches = ["language-serialization-io"]
title = "Paths — cross-platform, and the ~ problem"
body = '''

<p>Hardcoding <code>"C:\\Users\\op\\config.json"</code> or <code>"/home/op/config.json"</code> makes your tool single-OS. Two tools fix that:</p>
<p><strong>1. <code>Path.Combine</code></strong> joins segments with the correct separator for the operating system:</p>
<pre><code data-kind="replacement"><span class="k">string</span> p = Path.Combine(home, <span class="s">".verisearch"</span>, <span class="s">"config.json"</span>);
<span class="c">// linux → /home/op/.verisearch/config.json</span>
<span class="c">// windows → C:\Users\op\.verisearch\config.json</span></code></pre>
<p><strong>2. <code>Environment.GetFolderPath</code></strong> finds the user's home — <code>~</code> is a shell idea, .NET does NOT expand it:</p>
<pre><code data-kind="replacement"><span class="k">string</span> home = Environment.GetFolderPath(Environment.SpecialFolder.UserProfile);
<span class="k">string</span> configDir = Path.Combine(home, <span class="s">".verisearch"</span>);</code></pre>
<p>Other path utilities you'll want for scraping and output:</p>
<pre><code data-kind="replacement">Path.GetFileName(<span class="s">"/a/b/report.md"</span>)      <span class="c">// "report.md"</span>
Path.GetExtension(<span class="s">"report.md"</span>)           <span class="c">// ".md"</span>
Path.GetDirectoryName(<span class="s">"/a/b/report.md"</span>)  <span class="c">// "/a/b"</span></code></pre>
<div class="callout">If you ever see a literal <code>~</code> failing in file APIs — that's the tell. The shell expands <code>~</code>; your program must use GetFolderPath. This bug ships to production weekly, worldwide.</div>
<div class="callout csharp-transfer"><p><strong>C#/.NET transfer:</strong> .NET path APIs do not ask a shell to interpret a path, so <code>~</code> is not automatically expanded. Use <code>Path</code>, <code>Environment.GetFolderPath</code>, <code>Directory</code>, and an explicit base directory; the process working directory and <code>AppContext.BaseDirectory</code> are different locations.</p></div>
<div class="field-notes"><div class="fn-head">MARGINALIA // THE DEEPER CUT — IN THORNE'S HAND</div>
<p><strong>More of the Path toolbox:</strong> <code>Path.GetFullPath("../x")</code> resolves relatives · <code>Path.ChangeExtension(p, ".bak")</code> · <code>Path.GetTempPath()</code> the temp dir · <code>Path.DirectorySeparatorChar</code> is <code>/</code> or <code>\</code> per-OS (Combine handles this so you never type it).</p>
<p><strong>Useful SpecialFolders</strong> beyond UserProfile: <code>ApplicationData</code> (~/.config on Linux, AppData\Roaming on Windows — arguably the MOST correct home for config), <code>Desktop</code>, <code>MyDocuments</code>. Verisearch's <code>~/.verisearch</code> convention follows classic Unix tools; ApplicationData follows OS guidelines. Either is defensible — pick one and be consistent.</p></div>
'''

[[lessons.readings]]
label = "Microsoft Learn — \"File path formats\""
url = "https://learn.microsoft.com/en-us/dotnet/standard/io/file-path-formats"
essential = false

[[lessons.exercises]]
id = "s05-l02-e1"
type = "mc"
points = 25
required = true
capabilities = ["language-serialization-io"]
cognitiveTask = "explain"
scaffold = "guided"
contextFamily = "verisearch-s05-serialization-io"
aidPolicy = "learning"
prompt = "<code>File.ReadAllText(\"~/.verisearch/config.json\")</code> on Linux…"
choices = ["works — .NET expands ~ like bash does", "fails — .NET treats ~ as a literal folder name; use Environment.GetFolderPath", "works only when run with sudo", "reads from /root instead"]
answer = 1
whyWrong = "Unlike bash, .NET does NOT expand ‘~’; it’s treated as a literal folder name and the read fails — use Environment.GetFolderPath for the home directory."
hint = "Who expands ~ — the shell or the runtime?"

