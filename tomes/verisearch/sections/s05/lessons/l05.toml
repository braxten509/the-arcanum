[[lessons]]
id = "s05-l05"
teaches = ["language-namespaces-modularity"]
title = "Workshop — Build the Non-Destructive Config Loader"
body = '''

<p>A configuration loader is policy, not merely file syntax. It decides what happens when the catalog is absent, malformed, duplicated, or semantically invalid. Build this boundary from tests and observable outcomes while retaining freedom over records, result types, and file organization.</p>
<p>The source catalog must be owned by the user. Each admitted entry needs a display label and an absolute HTTP or HTTPS URI. Labels should be unique under a documented comparison. File order should remain observable because later source selection preserves user order. Nothing in the catalog maps question keywords to particular sources; the user names sources explicitly at the command surface.</p>
<p>Choose one absence policy and document it. You might create a small sample catalog only when no file exists, return an actionable “catalog missing” error, or offer an explicit initialization command. Existing malformed JSON is different: never overwrite it automatically. The invalid text is evidence the owner needs for repair.</p>
<pre><code data-kind="replacement">if (!File.Exists(path))
{
    // Choose and document an absence policy here.
}</code></pre>
<p>The fragment marks a decision point, not a required implementation. Whatever you choose, test missing and malformed files separately. Also test duplicate labels, relative URLs, unsupported schemes, and an empty catalog. Catch <code>JsonException</code> at the boundary that can add the path and a useful message; do not catch every exception and return an empty list, because permission failures and storage faults are not “no sources.”</p>
<p>Use <code>Path.Combine</code> or a caller-supplied path instead of manually joining separators. Open files with asynchronous APIs when the rest of the boundary is asynchronous, pass cancellation, and keep UTF-8 explicit where an API permits it. A result type may carry diagnostics, or exceptions may cross to the application boundary—either can work if successful and failed states stay unambiguous.</p>
<div class="callout"><p>The Working grades behavior: user-owned source authority, non-destructive invalid-input handling, safe URI admission, and deterministic tests. It does not grade whether your loader has the hidden reference implementation's name or number of methods.</p></div>
<div class="callout csharp-transfer"><p><strong>C#/.NET transfer:</strong> A focused C# loader can add a path to a caught <code>JsonException</code> while preserving it as the inner exception. Do not collapse unrelated <code>IOException</code>, <code>UnauthorizedAccessException</code>, cancellation, and invalid policy into one empty-list result—the exception types carry useful boundary information.</p></div>
<div class="field-notes"><div class="fn-head">FIELD NOTES // THE CORRUPTION CONTROL</div><p>Write distinctive invalid JSON, run the loader, and read the file again. The exact bytes should remain. A friendly error plus destroyed evidence is still destructive behavior.</p></div>
'''

[[lessons.readings]]
label = "Microsoft Learn — How to read and write a JSON file"
url = "https://learn.microsoft.com/en-us/dotnet/standard/serialization/system-text-json/how-to"
essential = false

[[lessons.exercises]]
id = "s05-l05-e1"
type = "mc"
points = 20
prompt = "Why does <code>LoadOrCreate</code> write defaults only after <code>File.Exists(path)</code> returns false?"
choices = ["JSON cannot overwrite files", "An existing file is user-owned policy and may contain the evidence needed to repair an error", "Directory.CreateDirectory deletes it", "the configured AI locks the file"]
answer = 1
whyWrong = "JSON can overwrite files, directory creation does not protect contents, and the configured AI does not own this file. The exists check prevents destructive replacement of user policy."
explain = "Missing state may be initialized; existing invalid state must be diagnosed and preserved."
hint = "Distinguish absent data from bad data."

[[lessons.exercises]]
id = "s05-l05-d1"
type = "type"
points = 14
reps = 2
prompt = "Retype the portable path method twice."
code = '''public static string PathForUser()
{
    string home = Environment.GetFolderPath(Environment.SpecialFolder.UserProfile);
    return Path.Combine(home, ".verisearch", "config.json");
}'''

[[lessons.exercises]]
id = "s05-l05-e2"
type = "fill"
points = 18
prompt = "Complete the call that creates parent directories without failing when they already exist."
code = '''Directory.____(Path.GetDirectoryName(path)!);'''
answer = "CreateDirectory"
hint = "The method is named for the desired state, not only the first creation."

[[lessons.exercises]]
id = "s05-l05-e3"
type = "mc"
points = 18
prompt = "Where should a malformed JSON exception become a friendly terminal message?"
choices = ["Inside every model property", "At the single Program.cs application boundary", "Inside SourceFetcher", "Nowhere; hide it"]
answer = 1
whyWrong = "Models and fetching do not own startup errors, while hiding the exception removes the location needed for repair. Program.cs is the one user-facing boundary."
explain = "Lower layers preserve precise failure information; the entrypoint decides how to present it and which exit code to return."
hint = "Which file already owns terminal output and process exit?"

[[lessons.exercises]]
id = "s05-l05-w1"
type = "write"
points = 38
prompt = "Implement <code>static string ConfigPath(string home)</code> with <code>Path.Combine</code>. Call it with <code>/home/ava</code> and print the resulting path."
starter = '''string path = ConfigPath("/home/ava");
Console.WriteLine(path);

static string ConfigPath(string home)
{
    return "NOT PORTABLE";
}
'''
expect = "/home/ava/.verisearch/config.json"
solution = '''string path = ConfigPath("/home/ava");
Console.WriteLine(path);

static string ConfigPath(string home)
{
    return Path.Combine(home, ".verisearch", "config.json");
}
'''
hint = "Path.Combine accepts more than two path segments."

[[lessons.concepts]]
id = "language-namespaces-modularity"
purpose = "Split a growing C# program into discoverable files and namespaces with one clear owner per responsibility."
anatomy = "Place related types under a namespace, keep the entrypoint as composition, and reference public contracts instead of copying declarations."
example = "The disposable examples in Workshop — Build the Non-Destructive Config Loader isolate this capability before the learner chooses how it belongs in the cumulative project. The lesson Workshop — Build the Non-Destructive Config Loader supplies the disposable observation point."
observable = "The whole solution builds with one definition for each concept and dependencies point in an understandable direction. Confirm it while practicing Workshop — Build the Non-Destructive Config Loader."
failure = "Duplicate types, circular ownership, or business logic in Program.cs makes later integration brittle."
practice = "s05-l05-e1"

[[lessons.artifactSteps]]
id = "s05-l05-author-artifact"
path = "src/Verisearch/SourceCatalog.cs"
mode = "author"
instruction = "Use the C# ideas from Workshop — Build the Non-Destructive Config Loader to author or revise this learner-owned path toward the chapter behavior: Load a user-owned catalog of source labels and URLs without rewriting invalid input or inventing authority. Choose your own type names, method boundaries, and file organization; the lesson examples are disposable and are not a production template."
checks = ["A valid catalog loads in order, and malformed or invalid existing JSON is diagnosed without being overwritten.", "The complete solution builds from saved source, and a deliberately changed load-bearing input makes the relevant check fail before repair."]
