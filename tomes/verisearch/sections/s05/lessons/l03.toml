[[lessons]]
id = "s05-l03"
teaches = ["language-serialization-io"]
title = "JSON Configuration — One Built-In Format"
body = '''

<p>The source catalog is user-owned JSON policy. Keep its schema small enough to inspect: each entry needs a label and an absolute source address, plus only the source-type information your reader genuinely supports.</p>
<pre><code data-kind="replacement">{
  "sources": [
    { "label": "Release notes", "url": "https://example.test/releases" },
    { "label": "Local archive", "url": "file:///data/archive.html" }
  ]
}</code></pre>
<p>This is disposable fixture data, not a prescribed path or domain. Decide whether local files are supported; if they are not, reject <code>file:</code> explicitly. Preserve catalog order because later source selection may promise that order to the user.</p>
<p>Map the JSON to a document record used only at the serialization edge, then validate and translate it into the source model used by the application. Keeping raw nullable strings out of the domain makes invalid external data visible at one boundary.</p>
<pre><code data-kind="replacement">public sealed record CatalogEntry(string? Label, string? Url);
public sealed record CatalogDocument(IReadOnlyList&lt;CatalogEntry&gt;? Sources);</code></pre>
<p>The nullable properties acknowledge that user JSON may omit values. The admitted source type should be stricter after validation. You may choose properties instead of positional records, a custom converter, or another readable shape.</p>
<p>AI provider settings do not have to live in this file. CLI arguments, environment variables, a separate provider configuration document, or an adapter-specific wrapper are all valid. Keeping source authority separate from provider transport makes it easier to switch between local, hosted, API, and CLI AI without rewriting the catalog.</p>
<div class="callout"><p>Configuration names available sources. It never maps factual question words to a source or lookup algorithm.</p></div>
<div class="callout csharp-transfer"><p><strong>C#/.NET transfer:</strong> C# lets the serialization-edge record remain nullable while the admitted domain record is strict. That two-type conversion is valuable because the compiler can then enforce that validated code no longer carries avoidable <code>string?</code> values.</p></div>
<div class="field-notes"><div class="fn-head">FIELD NOTES // EXTERNAL SHAPE TO DOMAIN</div><p>Deserialize first, validate second, translate third. Each stage has a different failure: malformed JSON, invalid policy, or an admitted typed value.</p></div>
'''

[[lessons.readings]]
label = "Microsoft Learn — Customize System.Text.Json contracts"
url = "https://learn.microsoft.com/en-us/dotnet/standard/serialization/system-text-json/customize-properties"
essential = false

[[lessons.exercises]]
id = "s05-l03-e1"
type = "mc"
points = 20
prompt = "Why does the course use JSON config instead of adding a YAML package?"
choices = ["C# cannot read YAML", "The project already uses a built-in typed JSON path, reducing dependencies and concepts", "JSON encrypts URLs", "the configured AI requires config to be JSON"]
answer = 1
whyWrong = "YAML libraries exist, JSON is not encryption, and the configured AI does not own the project's config. Reusing the built-in serializer keeps one pathway."
explain = "One serializer is easier for a beginner to learn, test, and debug."
hint = "Count new packages and new APIs."

[[lessons.exercises]]
id = "s05-l03-e2"
type = "fill"
points = 20
prompt = "Fill the converter that maps JSON string names such as <code>Web</code> to a C# enum."
code = '''options.Converters.Add(new ____());'''
answer = "JsonStringEnumConverter"
hint = "Its name combines JSON, string, enum, and converter."

[[lessons.exercises]]
id = "s05-l03-e3"
type = "mc"
points = 20
prompt = "A config file contains invalid JSON. Which behavior preserves user control?"
choices = ["Overwrite it silently", "Ignore it and trust compiled defaults", "Report the path and parse error without replacing the file", "Delete the entire config directory"]
answer = 2
whyWrong = "Silent replacement or deletion loses user policy, while ignoring it hides that the intended sources were not loaded."
explain = "The program should fail clearly and leave the user's file available for repair."
hint = "Do not destroy the evidence."

[[lessons.exercises]]
id = "s05-l03-d1"
type = "type"
points = 14
reps = 2
prompt = "Retype the enum converter registration twice."
code = '''options.Converters.Add(new JsonStringEnumConverter());'''

[[lessons.exercises]]
id = "s05-l03-w1"
type = "write"
points = 38
prompt = "Deserialize <code>{\"model\":\"qwen3:4b\",\"maxQuotes\":3}</code> into <code>AppConfig</code> with case-insensitive options, then print exactly <code>qwen3:4b 3</code>."
starter = '''using System.Text.Json;

string json = """{"model":"qwen3:4b","maxQuotes":3}""";
Console.WriteLine("NOT LOADED");
'''
expect = "qwen3:4b 3"
solution = '''using System.Text.Json;

string json = """{"model":"qwen3:4b","maxQuotes":3}""";
var options = new JsonSerializerOptions { PropertyNameCaseInsensitive = true };
var config = JsonSerializer.Deserialize<AppConfig>(json, options)!;
Console.WriteLine($"{config.Model} {config.MaxQuotes}");

public class AppConfig
{
    public string Model { get; init; } = "qwen3:4b";
    public int MaxQuotes { get; init; } = 5;
}
'''
hint = "Create options, Deserialize<AppConfig>, and read the two properties."

[[lessons.concepts]]
id = "language-serialization-io"
purpose = "Move typed data across file, JSON, HTTP, process, and terminal boundaries without confusing external text with trusted objects."
anatomy = "Select an I/O API, await or dispose it correctly, serialize or deserialize a declared shape, then validate the resulting values."
example = "The disposable examples in JSON Configuration — One Built-In Format isolate this capability before the learner chooses how it belongs in the cumulative project. The lesson JSON Configuration — One Built-In Format supplies the disposable observation point."
observable = "Valid input becomes the intended typed data and malformed input produces a specific boundary diagnostic. Confirm it while practicing JSON Configuration — One Built-In Format."
failure = "Scraping loosely structured text or overwriting invalid user data destroys the evidence needed to repair it."
practice = "s05-l03-e1"

[[lessons.artifactSteps]]
id = "s05-l03-author-artifact"
path = "src/Verisearch/SourceCatalog.cs"
mode = "author"
instruction = "Use the C# ideas from JSON Configuration — One Built-In Format to author or revise this learner-owned path toward the chapter behavior: Load a user-owned catalog of source labels and URLs without rewriting invalid input or inventing authority. Choose your own type names, method boundaries, and file organization; the lesson examples are disposable and are not a production template."
checks = ["A valid catalog loads in order, and malformed or invalid existing JSON is diagnosed without being overwritten.", "The complete solution builds from saved source, and a deliberately changed load-bearing input makes the relevant check fail before repair."]
