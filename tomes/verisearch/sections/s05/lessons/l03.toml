[[lessons]]
id = "s05-l03"
teaches = ["json-config"]
title = "JSON Configuration — One Built-In Format"
body = '''
<p>Verisearch already uses <code>System.Text.Json</code>, so configuration should use the same built-in format instead of introducing a second parser. The user owns which sources are trusted and which local model runs; those choices belong in <code>~/.verisearch/config.json</code>, not inside compiled C#.</p>
<pre><code>{
  <span class="s">"ollamaUrl"</span>: <span class="s">"http://localhost:11434"</span>,
  <span class="s">"model"</span>: <span class="s">"qwen3:4b"</span>,
  <span class="s">"maxQuotes"</span>: 5,
  <span class="s">"sources"</span>: [
    {
      <span class="s">"label"</span>: <span class="s">"C# overview"</span>,
      <span class="s">"url"</span>: <span class="s">"https://learn.microsoft.com/en-us/dotnet/csharp/tour-of-csharp/overview"</span>,
      <span class="s">"trust"</span>: 10,
      <span class="s">"kind"</span>: <span class="s">"Web"</span>
    }
  ]
}</code></pre>
<p>Represent the root with a class because it owns defaults and validation:</p>
<pre><code><span class="k">public class</span> AppConfig
{
    <span class="k">public string</span> OllamaUrl { <span class="k">get</span>; <span class="k">init</span>; } = <span class="s">"http://localhost:11434"</span>;
    <span class="k">public string</span> Model { <span class="k">get</span>; <span class="k">init</span>; } = <span class="s">"qwen3:4b"</span>;
    <span class="k">public int</span> MaxQuotes { <span class="k">get</span>; <span class="k">init</span>; } = 5;
    <span class="k">public</span> List&lt;SourceSpec&gt; Sources { <span class="k">get</span>; <span class="k">init</span>; } = [];
}</code></pre>
<p>Use the same case-insensitive options as Chapter IV and add <code>JsonStringEnumConverter</code> so <code>"Web"</code> maps to <code>SourceKind.Web</code>. Without that converter, enums default to numbers in JSON.</p>
<pre><code><span class="k">var</span> options = <span class="k">new</span> JsonSerializerOptions
{
    PropertyNameCaseInsensitive = <span class="k">true</span>,
    WriteIndented = <span class="k">true</span>
};
options.Converters.Add(<span class="k">new</span> JsonStringEnumConverter());</code></pre>
<div class="callout">Configuration is policy. A malformed file should produce a clear error and remain untouched; silently overwriting it could erase the user's trusted-source choices.</div>
<div class="field-notes"><div class="fn-head">MARGINALIA // DEFAULTS ARE NOT REPAIRS</div>
<p>Property initializers supply values when a property is absent, but they do not make an invalid value acceptable. Deserialization answers “can this text become the shape?” Validation answers “is this shape safe and useful?” Keep those two steps separate so the error says whether JSON syntax or a business rule failed.</p></div>
'''

[[lessons.readings]]
label = "Microsoft Learn — Customize System.Text.Json contracts"
url = "https://learn.microsoft.com/en-us/dotnet/standard/serialization/system-text-json/customize-properties"
essential = false

[[lessons.exercises]]
id = "s05-l03-e1"
type = "mc"
points = 20
prompt = "Why does the course use JSON config instead of adding a YAML package?"
choices = ["C# cannot read YAML", "The project already uses a built-in typed JSON path, reducing dependencies and concepts", "JSON encrypts URLs", "Ollama requires config to be JSON"]
answer = 1
whyWrong = "YAML libraries exist, JSON is not encryption, and Ollama does not own the project's config. Reusing the built-in serializer keeps one pathway."
explain = "One serializer is easier for a beginner to learn, test, and debug."
hint = "Count new packages and new APIs."

[[lessons.exercises]]
id = "s05-l03-e2"
type = "fill"
points = 20
prompt = "Fill the converter that maps JSON string names such as <code>Web</code> to a C# enum."
code = '''options.Converters.Add(new ____());'''
answer = "JsonStringEnumConverter"
hint = "Its name combines JSON, string, enum, and converter."

[[lessons.exercises]]
id = "s05-l03-e3"
type = "mc"
points = 20
prompt = "A config file contains invalid JSON. Which behavior preserves user control?"
choices = ["Overwrite it silently", "Ignore it and trust compiled defaults", "Report the path and parse error without replacing the file", "Delete the entire config directory"]
answer = 2
whyWrong = "Silent replacement or deletion loses user policy, while ignoring it hides that the intended sources were not loaded."
explain = "The program should fail clearly and leave the user's file available for repair."
hint = "Do not destroy the evidence."

[[lessons.exercises]]
id = "s05-l03-d1"
type = "type"
points = 14
reps = 2
prompt = "Retype the enum converter registration twice."
code = '''options.Converters.Add(new JsonStringEnumConverter());'''

[[lessons.exercises]]
id = "s05-l03-w1"
type = "write"
points = 38
prompt = "Deserialize <code>{\"model\":\"qwen3:4b\",\"maxQuotes\":3}</code> into <code>AppConfig</code> with case-insensitive options, then print exactly <code>qwen3:4b 3</code>."
starter = '''using System.Text.Json;

string json = """{"model":"qwen3:4b","maxQuotes":3}""";
Console.WriteLine("NOT LOADED");
'''
expect = "qwen3:4b 3"
solution = '''using System.Text.Json;

string json = """{"model":"qwen3:4b","maxQuotes":3}""";
var options = new JsonSerializerOptions { PropertyNameCaseInsensitive = true };
var config = JsonSerializer.Deserialize<AppConfig>(json, options)!;
Console.WriteLine($"{config.Model} {config.MaxQuotes}");

public class AppConfig
{
    public string Model { get; init; } = "qwen3:4b";
    public int MaxQuotes { get; init; } = 5;
}
'''
hint = "Create options, Deserialize<AppConfig>, and read the two properties."
