[[lessons.exercises]]
id = "s05-l03-w1"
type = "write"
points = 38
required = true
capabilities = ["language-serialization-io"]
cognitiveTask = "build"
scaffold = "guided"
contextFamily = "verisearch-s05-json-config-schema"
aidPolicy = "learning"
prompt = "Deserialize <code>{\"model\":\"qwen3:4b\",\"maxQuotes\":3}</code> into <code>AppConfig</code> with case-insensitive options, then print exactly <code>qwen3:4b 3</code>."
starter = '''using System.Text.Json;

string json = """{"model":"qwen3:4b","maxQuotes":3}""";
Console.WriteLine("NOT LOADED");
'''
expect = "qwen3:4b 3"
solution = '''using System.Text.Json;

string json = """{"model":"qwen3:4b","maxQuotes":3}""";
var options = new JsonSerializerOptions { PropertyNameCaseInsensitive = true };
var config = JsonSerializer.Deserialize<AppConfig>(json, options)!;
Console.WriteLine($"{config.Model} {config.MaxQuotes}");

public class AppConfig
{
    public string Model { get; init; } = "qwen3:4b";
    public int MaxQuotes { get; init; } = 5;
}
'''
hint = "Create options, Deserialize<AppConfig>, and read the two properties."

[[lessons.concepts]]
id = "language-json-config-schema"
purpose = "Choose a user-owned catalog format small enough to inspect by eye and stable enough to validate."
anatomy = "The document holds an array of entries, each entry carries a label and an absolute address, and the C# shapes that read it admit that any member may be absent."
example = "A short sources document beside catalog entry and catalog document records whose nullable members accept that the text on disk may be incomplete."
observable = "A hand-written catalog loads into typed entries, and the order on disk is the order the program reports."
failure = "Growing the schema to hold relevance rules moves search policy into a file that no test covers and no user expects to own."
practice = "s05-l03-e1"
