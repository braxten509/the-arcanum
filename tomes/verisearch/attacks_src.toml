briefs = [
  "Forge the chain: deserialize the feed, keep open wards, sort by peril descending. Print «WARD <name> PERIL <peril>» each, then «CHAIN <count> WARDS».",
  "Inscribe the wards to chain.rune as «<name>:<peril>» lines, read the file back, print «BOUND <line>» per line, then «STONE OK».",
  "Append «PERIL SUM <sum over wards>», the call («SEAL NOW» if any ward peril >= 9 else «SEAL HOLD»), then «CHAIN COMPLETE».",
