'''
cuts = [6, 9, 11]

[[challenge]]
tier = 4
title = "THE SEALED PARCELS"
starter = '''
using System.Text.Json;

string manifest = """
[
  {"id": 1, "ward": "rune", "weight": 512},
  {"id": 2, "ward": "ash", "weight": 2048},
  {"id": 3, "ward": "rune", "weight": 128},
  {"id": 4, "ward": "salt", "weight": 4096}
]
""";
// JsonSerializer.Deserialize<List<Parcel>>(manifest) — property names match case-sensitively.
// THE FIRST BINDING is set. Further demands may arm as the glass runs.

record Parcel(int id, string ward, int weight);
'''
briefs = [
  "Decode the sealed manifest into List<Parcel>. Print «PARCEL <id> <ward> <weight>» per parcel, then «DECODED 4 PARCELS» (count computed).",
  "Append «RUNE WEIGHT <sum of rune-warded weights>» and «HEAVIEST <id> <ward>» for the largest parcel.",
  "Seal the summary «new { count = <count>, weight = <sum of all weights> }» with JsonSerializer and print the JSON, then «MANIFEST SEALED».",
]
solution = '''
using System.Text.Json;

string manifest = """
[
  {"id": 1, "ward": "rune", "weight": 512},
  {"id": 2, "ward": "ash", "weight": 2048},
  {"id": 3, "ward": "rune", "weight": 128},
  {"id": 4, "ward": "salt", "weight": 4096}
]
""";
var parcels = JsonSerializer.Deserialize<List<Parcel>>(manifest)!;
foreach (var p in parcels)
    Console.WriteLine($"PARCEL {p.id} {p.ward} {p.weight}");
Console.WriteLine($"DECODED {parcels.Count} PARCELS");
int rune = 0, weight = 0;
Parcel big = parcels[0];
foreach (var p in parcels)
{
    if (p.ward == "rune") rune += p.weight;
    weight += p.weight;
    if (p.weight > big.weight) big = p;
}
Console.WriteLine($"RUNE WEIGHT {rune}");
Console.WriteLine($"HEAVIEST {big.id} {big.ward}");
var summary = new { count = parcels.Count, weight = weight };
Console.WriteLine(JsonSerializer.Serialize(summary));
Console.WriteLine("MANIFEST SEALED");

record Parcel(int id, string ward, int weight);
'''
cuts = [5, 7, 9]

