[[challenge]]
tier = 2
title = "THE QUESTIONS AT THE GATE"
starter = '''
string[] words = { "how", "what", "why" };
// Classify with a switch expression; then audit the set.
'''
briefs = [
  "Print each classification: «how PROCEDURAL», «what FACTUAL», «why EXPLANATION».",
  "Append «COUNT 3» and «KNOWN 3» from the processed words.",
  "Append «FIRST how» and «GATE ANSWERED».",
]
solution = '''
string[] words = { "how", "what", "why" };
int known = 0;
foreach (string word in words)
{
    string kind = word switch { "how" => "PROCEDURAL", "what" => "FACTUAL", "why" => "EXPLANATION", _ => "GENERAL" };
    if (kind != "GENERAL") known++;
    Console.WriteLine($"{word} {kind}");
}
Console.WriteLine($"COUNT {words.Length}");
Console.WriteLine($"KNOWN {known}");
Console.WriteLine($"FIRST {words[0]}");
Console.WriteLine("GATE ANSWERED");
'''
