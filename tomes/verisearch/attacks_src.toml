solution = '''
string query = "shadow ward flame";
string[] verses = {
    "the ward holds against flame",
    "shadow creeps past the ward",
    "the sky is clear tonight",
    "flame ward shadow all three bound",
};
string[] qw = query.Split(' ');
int[] scores = new int[verses.Length];
for (int i = 0; i < verses.Length; i++)
{
    var vw = verses[i].Split(' ');
    foreach (string w in qw)
        if (vw.Contains(w)) scores[i]++;
    Console.WriteLine($"VERSE {i + 1} SCORE {scores[i]}");
}
Console.WriteLine($"SCORED {verses.Length} VERSES");
var order = Enumerable.Range(0, verses.Length).OrderByDescending(i => scores[i]).ThenBy(i => i).ToList();
for (int r = 0; r < order.Count; r++)
    Console.WriteLine($"RANK {r + 1} VERSE {order[r] + 1}");
Console.WriteLine($"TRUE {scores.Count(s => s >= 2)}");
Console.WriteLine($"HOLLOW {scores.Count(s => s < 2)}");
