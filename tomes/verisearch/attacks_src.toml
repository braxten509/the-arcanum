[[challenge]]
tier = 9
title = "THE ORACLE'S RANKING"
starter = '''
var passages = new Dictionary<int, string> {
    [1] = "Alpha exact. The ward holds.",
    [2] = "Gamma exact. The gate opens.",
};
var proposals = new[] {
    new Proposal(1, "Alpha exact."), new Proposal(1, "Alpha exact."),
    new Proposal(1, "Invented words."), new Proposal(2, "Gamma exact."),
};
// A proposal is evidence only when its passage exists and contains the exact quote.
// THE FIRST BINDING is set. Further demands may arm as the glass runs.
'''
briefs = [
  "Verify every proposal with Dictionary.TryGetValue and string.Contains using StringComparison.Ordinal. Print «PROPOSAL <n> EXACT» or «PROPOSAL <n> REJECTED», then «CHECKED 4».",
  "Keep at most two exact proposals and reject duplicates by passage id plus quote. Print each survivor as «QUOTE <passage id> <quote>» in proposal order.",
  "Append «ACCEPTED <count>», «REJECTED <count>», then «ORACLE DONE». Compute both counts from the proposals and survivors.",
]
solution = '''
var passages = new Dictionary<int, string> {
    [1] = "Alpha exact. The ward holds.",
    [2] = "Gamma exact. The gate opens.",
};
var proposals = new[] {
    new Proposal(1, "Alpha exact."), new Proposal(1, "Alpha exact."),
    new Proposal(1, "Invented words."), new Proposal(2, "Gamma exact."),
};
var survivors = new List<Proposal>();
var seen = new HashSet<string>(StringComparer.Ordinal);
for (int i = 0; i < proposals.Length; i++)
{
    Proposal proposal = proposals[i];
    bool exact = passages.TryGetValue(proposal.PassageId, out string? text)
        && text.Contains(proposal.Quote, StringComparison.Ordinal);
    string key = $"{proposal.PassageId}\0{proposal.Quote}";
    bool accepted = exact && survivors.Count < 2 && seen.Add(key);
    if (accepted) survivors.Add(proposal);
    Console.WriteLine($"PROPOSAL {i + 1} {(accepted ? "EXACT" : "REJECTED")}");
}
Console.WriteLine($"CHECKED {proposals.Length}");
foreach (Proposal proposal in survivors)
    Console.WriteLine($"QUOTE {proposal.PassageId} {proposal.Quote}");
Console.WriteLine($"ACCEPTED {survivors.Count}");
Console.WriteLine($"REJECTED {proposals.Length - survivors.Count}");
Console.WriteLine("ORACLE DONE");

record Proposal(int PassageId, string Quote);
'''
