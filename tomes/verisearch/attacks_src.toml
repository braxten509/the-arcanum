[[challenge]]
tier = 11
title = "THE FINAL RITE"
starter = '''
using System.Text.Json;

string rite = """
{"minPower": 50, "sigils": [
  {"name": "emberglass", "power": 72},
  {"name": "dead-rune", "power": 12},
  {"name": "core-ward", "power": 95},
  {"name": "mist-gate", "power": 50}
]}
""";
// Read -> gather -> bind concurrently -> chord. Everything you've got.
// THE FIRST BINDING is set. Further demands may arm as the glass runs.

async Task<string> Bind(string name)
{
    await Task.Delay(25);
    return $"{name} bound";
}

record Sigil(string name, int power);
'''
briefs = [
  "Read the rite (JsonDocument or records — your call). Gather sigils with power >= minPower: print «GATHERED <name> <power>» each in order, then «RITE <gathered> / <total>».",
  "Bind the gathered sigils ALL AT ONCE (Task.WhenAll): print «>> <result>» each in order, then «ALL BOUND».",
  "Append «CHORD <XOR of gathered powers>», «KEYSTONE <strongest gathered name>», then «RITE COMPLETE».",
]
solution = '''
using System.Text.Json;

string rite = """
{"minPower": 50, "sigils": [
  {"name": "emberglass", "power": 72},
  {"name": "dead-rune", "power": 12},
  {"name": "core-ward", "power": 95},
  {"name": "mist-gate", "power": 50}
]}
""";
var root = JsonDocument.Parse(rite).RootElement;
int min = root.GetProperty("minPower").GetInt32();
var all = new List<Sigil>();
foreach (var s in root.GetProperty("sigils").EnumerateArray())
    all.Add(new Sigil(s.GetProperty("name").GetString()!, s.GetProperty("power").GetInt32()));
var gathered = all.Where(s => s.power >= min).ToList();
foreach (var s in gathered)
    Console.WriteLine($"GATHERED {s.name} {s.power}");
Console.WriteLine($"RITE {gathered.Count} / {all.Count}");
var results = await Task.WhenAll(gathered.Select(s => Bind(s.name)));
foreach (string r in results)
    Console.WriteLine($">> {r}");
Console.WriteLine("ALL BOUND");
Console.WriteLine($"CHORD {gathered.Aggregate(0, (a, s) => a ^ s.power)}");
Console.WriteLine($"KEYSTONE {gathered.OrderByDescending(s => s.power).First().name}");
Console.WriteLine("RITE COMPLETE");

async Task<string> Bind(string name)
{
    await Task.Delay(25);
    return $"{name} bound";
}

record Sigil(string name, int power);
'''
