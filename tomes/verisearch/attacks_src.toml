using System.Text.Json;

string feed = """
[
  {"name": "east-spire", "open": true, "peril": 8},
  {"name": "old-vault", "open": false, "peril": 3},
  {"name": "deep-well", "open": true, "peril": 9},
  {"name": "north-gate", "open": true, "peril": 2}
]
""";
var wards = JsonSerializer.Deserialize<List<Ward>>(feed)!;
var chosen = wards.Where(w => w.open).OrderByDescending(w => w.peril).ToList();
foreach (var w in chosen)
    Console.WriteLine($"WARD {w.name} PERIL {w.peril}");
Console.WriteLine($"CHAIN {chosen.Count} WARDS");
