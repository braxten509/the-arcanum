title = "THE OMEN REGISTER"
starter = '''
int[] omens = { 2, 7, 9 };
// Calm < 4, Stirring < 8, Dire otherwise.
enum Peril { Calm, Stirring, Dire }
'''
briefs = [
  "Classify each omen and print «OMEN <n> <PERIL>» with the peril uppercased.",
  "Append «CALM 1» and «DANGEROUS 2» from the classifications.",
  "Append «GRAVEST 9» and «REGISTER SEALED».",
]
solution = '''
int[] omens = { 2, 7, 9 };
var perils = omens.Select(omen => omen >= 8 ? Peril.Dire : omen >= 4 ? Peril.Stirring : Peril.Calm).ToArray();
for (int i = 0; i < omens.Length; i++) Console.WriteLine($"OMEN {omens[i]} {perils[i].ToString().ToUpper()}");
Console.WriteLine($"CALM {perils.Count(peril => peril == Peril.Calm)}");
Console.WriteLine($"DANGEROUS {perils.Count(peril => peril != Peril.Calm)}");
Console.WriteLine($"GRAVEST {omens.Max()}");
Console.WriteLine("REGISTER SEALED");

enum Peril { Calm, Stirring, Dire }
'''
