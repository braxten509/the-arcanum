briefs = [
  "Forge the reckoning: deserialize the archive, keep active seals, sort by power descending. Print «SEAL <name> <power>» each, then «RECKONING <kept> / <total>».",
  "Invoke the kept seals ALL AT ONCE (Task.WhenAll): print «>> <result>» each in order, then «ALL ANSWER».",
  "Inscribe the kept seals to reckoning.rune as «<name>:<power>», read the stone back printing «BOUND <line>» each, then «POWER SUM <sum>» and «RECKONING COMPLETE».",
]
solution = '''
using System.Text.Json;

string archive = """
[
  {"name": "ember-seal", "power": 60, "active": true},
  {"name": "frost-seal", "power": 20, "active": false},
  {"name": "storm-seal", "power": 95, "active": true},
  {"name": "dust-seal", "power": 40, "active": true}
]
""";
var seals = JsonSerializer.Deserialize<List<Seal>>(archive)!;
var live = seals.Where(s => s.active).OrderByDescending(s => s.power).ToList();
foreach (var s in live)
    Console.WriteLine($"SEAL {s.name} {s.power}");
Console.WriteLine($"RECKONING {live.Count} / {seals.Count}");
var answers = await Task.WhenAll(live.Select(s => Invoke(s.name)));
foreach (string a in answers)
    Console.WriteLine($">> {a}");
Console.WriteLine("ALL ANSWER");
File.WriteAllLines("reckoning.rune", live.Select(s => $"{s.name}:{s.power}"));
foreach (string line in File.ReadAllLines("reckoning.rune"))
    Console.WriteLine($"BOUND {line}");
Console.WriteLine($"POWER SUM {live.Sum(s => s.power)}");
Console.WriteLine("RECKONING COMPLETE");

async Task<string> Invoke(string name)
{
    await Task.Delay(20);
    return $"{name} answers";
}

record Seal(string name, int power, bool active);
'''
cuts = [4, 8, 13]

