[[challenge]]
tier = 4
title = "THE PARSING TRIBUNAL"
starter = '''
string[] claims = { "12", "ash", "7" };
// TryParse every claim; failures become evidence, not crashes.
'''
briefs = [
  "Print each result as «CLAIM <text> OK <n>» or «CLAIM <text> BAD».",
  "Append «VALID 2» and «INVALID 1».",
  "Append «FIRST ERROR ash» and «TRIBUNAL CLOSED».",
]
solution = '''
string[] claims = { "12", "ash", "7" };
int valid = 0;
string firstError = "none";
foreach (string claim in claims)
{
    if (int.TryParse(claim, out int value)) { valid++; Console.WriteLine($"CLAIM {claim} OK {value}"); }
    else { if (firstError == "none") firstError = claim; Console.WriteLine($"CLAIM {claim} BAD"); }
}
Console.WriteLine($"VALID {valid}");
Console.WriteLine($"INVALID {claims.Length - valid}");
Console.WriteLine($"FIRST ERROR {firstError}");
Console.WriteLine("TRIBUNAL CLOSED");
'''
