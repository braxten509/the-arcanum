foreach (string line in File.ReadAllLines("chain.rune"))
    Console.WriteLine($"BOUND {line}");
Console.WriteLine("STONE OK");
Console.WriteLine($"PERIL SUM {chosen.Sum(w => w.peril)}");
Console.WriteLine(chosen.Any(w => w.peril >= 9) ? "SEAL NOW" : "SEAL HOLD");
Console.WriteLine("CHAIN COMPLETE");

