starter = '''
string prophecy = "The Pale Wyrm wakes at dusk";
string[] accounts = {
    "pale wyrm seen at dusk",
    "wyrm sleeps all winter",
    "the pale wyrm wakes at dusk indeed",
};
// Normalize with ToLower, split on spaces, count DISTINCT prophecy words each account holds.
// THE FIRST BINDING is set. Further demands may arm as the glass runs.
'''
briefs = [
  "Weigh the accounts: lowercase the prophecy, split into words; for each account count how many DISTINCT prophecy words it holds. Print «ACCOUNT <n> MATCH <m>», then «WEIGHED 3».",
  "Trust = matched * 100 / <prophecy word count> (integer math). Append «TRUST <n> <pct>%» per account.",
  "Verdicts: 80%+ TRUE, 50%+ PARTIAL, else FALSE. Append «ACCOUNT <n> <VERDICT>» each, then «WEIGHING DONE».",
]
solution = '''
string prophecy = "The Pale Wyrm wakes at dusk";
string[] accounts = {
    "pale wyrm seen at dusk",
    "wyrm sleeps all winter",
    "the pale wyrm wakes at dusk indeed",
};
string[] pw = prophecy.ToLower().Split(' ');
int[] match = new int[accounts.Length];
for (int i = 0; i < accounts.Length; i++)
{
    var aw = accounts[i].ToLower().Split(' ');
    match[i] = pw.Distinct().Count(w => aw.Contains(w));
    Console.WriteLine($"ACCOUNT {i + 1} MATCH {match[i]}");
}
Console.WriteLine($"WEIGHED {accounts.Length}");
int[] trust = new int[accounts.Length];
for (int i = 0; i < accounts.Length; i++)
{
    trust[i] = match[i] * 100 / pw.Length;
    Console.WriteLine($"TRUST {i + 1} {trust[i]}%");
}
for (int i = 0; i < accounts.Length; i++)
    Console.WriteLine($"ACCOUNT {i + 1} {(trust[i] >= 80 ? "TRUE" : trust[i] >= 50 ? "PARTIAL" : "FALSE")}");
Console.WriteLine("WEIGHING DONE");
'''
