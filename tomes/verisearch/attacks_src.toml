[[challenge]]
tier = 5
title = "THE SCOURED CHRONICLE"
starter = '''
string path = "chronicle.log";
string[] entries = {
    "MARK the candle lit", "WHISPER a draft stirs", "MARK the ward holds", "WHISPER dust settles", "OMEN the glass cracks 91",
};
// THE FIRST BINDING is set. Further demands may arm as the glass runs.
'''
briefs = [
  "Inscribe the entries into the chronicle, read it back, and print «KEEP <line>» for every line that does NOT start with WHISPER, then «SCANNED 5» (total lines read).",
  "Overwrite the chronicle with only the kept lines. Append «SCOURED <removed count>» and «CHRONICLE <line count>» re-read from disk.",
  "Find the OMEN line in the scoured chronicle and print «PORTENT <text after 'OMEN '>», then «SCOUR COMPLETE».",
]
solution = '''
string path = "chronicle.log";
string[] entries = {
    "MARK the candle lit", "WHISPER a draft stirs", "MARK the ward holds", "WHISPER dust settles", "OMEN the glass cracks 91",
};
File.WriteAllLines(path, entries);
string[] all = File.ReadAllLines(path);
var kept = new List<string>();
foreach (string line in all)
{
    if (!line.StartsWith("WHISPER"))
    {
        Console.WriteLine($"KEEP {line}");
        kept.Add(line);
    }
}
Console.WriteLine($"SCANNED {all.Length}");
File.WriteAllLines(path, kept);
Console.WriteLine($"SCOURED {all.Length - kept.Count}");
Console.WriteLine($"CHRONICLE {File.ReadAllLines(path).Length}");
foreach (string line in File.ReadAllLines(path))
    if (line.StartsWith("OMEN "))
        Console.WriteLine($"PORTENT {line.Substring(5)}");
Console.WriteLine("SCOUR COMPLETE");
'''
cuts = [4, 6, 8]

[[challenge]]
tier = 6
title = "THE MIRROR'S GLEANING"
starter = '''
string vision = "<html><head><title>THE OBSIDIAN MIRROR</title></head><body>"
    + "<a href=\"/relics/emberglass.rune\">emberglass</a>"
    + "<a href=\"/relics/nightshade.rune\">nightshade</a>"
    + "<p>a decoy vision</p><a href=\"/leave\">leave</a></body></html>";
// IndexOf / Substring / Split are enough — no parser library needed.
// THE FIRST BINDING is set. Further demands may arm as the glass runs.
'''
briefs = [
  "Scry the mirror's page. Extract the <title> text with IndexOf/Substring and print «TITLE <text>», then count the wardlinks and print «LINKS <n>».",
  "Extract every href value and print «HREF <value>» in page order.",
  "For hrefs under /relics/, print «RELIC <NAME>» (name without path or .rune extension, uppercased), then «GLEANING DONE».",
]
solution = '''
string vision = "<html><head><title>THE OBSIDIAN MIRROR</title></head><body>"
    + "<a href=\"/relics/emberglass.rune\">emberglass</a>"
    + "<a href=\"/relics/nightshade.rune\">nightshade</a>"
    + "<p>a decoy vision</p><a href=\"/leave\">leave</a></body></html>";
int ts = vision.IndexOf("<title>") + 7;
int te = vision.IndexOf("</title>");
Console.WriteLine($"TITLE {vision.Substring(ts, te - ts)}");
var hrefs = new List<string>();
int pos = 0;
while ((pos = vision.IndexOf("href=\"", pos)) != -1)
{
    pos += 6;
    int end = vision.IndexOf('"', pos);
    hrefs.Add(vision.Substring(pos, end - pos));
}
Console.WriteLine($"LINKS {hrefs.Count}");
foreach (string h in hrefs)
    Console.WriteLine($"HREF {h}");
foreach (string h in hrefs)
{
    if (h.StartsWith("/relics/"))
    {
        string relic = h.Substring(8).Replace(".rune", "");
        Console.WriteLine($"RELIC {relic.ToUpper()}");
    }
}
Console.WriteLine("GLEANING DONE");
'''
cuts = [2, 5, 8]

[[challenge]]
tier = 6
title = "THE HARVEST OF MARKS"
starter = '''
string charm = "<ward><rune>a</rune><rune>b</rune><seal>c</seal><ward><rune>d</rune></ward></ward>";
// Split on '<'; closing marks start with '/'; the text sits after the '>'.
// THE FIRST BINDING is set. Further demands may arm as the glass runs.
'''
briefs = [
  "Harvest the opening marks. Count each mark type (ignore closing marks) and print «<mark> <count>» in order of first appearance (ward first).",
  "Append «TOTAL MARKS <sum of counts>» and «UNIQUE <distinct mark count>».",
  "Harvest the text woven between marks in order and print «WOVEN <joined>» (e.g. abcd), then «HARVEST DONE».",
]
solution = '''
string charm = "<ward><rune>a</rune><rune>b</rune><seal>c</seal><ward><rune>d</rune></ward></ward>";
var counts = new Dictionary<string, int>();
string woven = "";
foreach (string chunk in charm.Split('<'))
{
    if (chunk == "") continue;
    int gt = chunk.IndexOf('>');
    if (!chunk.StartsWith("/"))
    {
        string mark = chunk.Substring(0, gt);
        counts[mark] = counts.GetValueOrDefault(mark) + 1;
    }
    if (gt + 1 < chunk.Length) woven += chunk.Substring(gt + 1);
}
foreach (var kv in counts)
    Console.WriteLine($"{kv.Key} {kv.Value}");
int total = 0;
foreach (var kv in counts) total += kv.Value;
Console.WriteLine($"TOTAL MARKS {total}");
Console.WriteLine($"UNIQUE {counts.Count}");
Console.WriteLine($"WOVEN {woven}");
Console.WriteLine("HARVEST DONE");
'''
cuts = [3, 5, 7]

[[challenge]]
tier = 7
title = "THE SORTING OF VOICES"
starter = '''
var voices = new List<Voice> {
    new("ember", 72, "ash"), new("frost", 15, "salt"), new("gale", 91, "ash"),
    new("tide", 44, "bone"), new("shade", 88, "salt"), new("stone", 8, "ash"),
};
// LINQ territory: Where / OrderByDescending / GroupBy / Aggregate.
// THE FIRST BINDING is set. Further demands may arm as the glass runs.

record Voice(string Name, int Clarity, string Tongue);
'''
briefs = [
  "Sort the voices with LINQ: those with Clarity >= 40, clearest first — print «VOICE <name> <clarity>» each, then «SORTED <kept> / <total>».",
  "GroupBy tongue over ALL voices, groups ordered by count descending: «TONGUE <tongue> <count>» each.",
  "Append «MEAN CLARITY <integer avg over all>», «CHORD <XOR of all clarities>» (Aggregate), then «SORTING DONE».",
]
solution = '''
var voices = new List<Voice> {
    new("ember", 72, "ash"), new("frost", 15, "salt"), new("gale", 91, "ash"),
    new("tide", 44, "bone"), new("shade", 88, "salt"), new("stone", 8, "ash"),
};
var clear = voices.Where(v => v.Clarity >= 40).OrderByDescending(v => v.Clarity).ToList();
foreach (var v in clear)
    Console.WriteLine($"VOICE {v.Name} {v.Clarity}");
Console.WriteLine($"SORTED {clear.Count} / {voices.Count}");
foreach (var g in voices.GroupBy(v => v.Tongue).OrderByDescending(g => g.Count()))
    Console.WriteLine($"TONGUE {g.Key} {g.Count()}");
Console.WriteLine($"MEAN CLARITY {(int)voices.Average(v => v.Clarity)}");
Console.WriteLine($"CHORD {voices.Aggregate(0, (acc, v) => acc ^ v.Clarity)}");
Console.WriteLine("SORTING DONE");

record Voice(string Name, int Clarity, string Tongue);
'''
cuts = [5, 8, 11]

[[challenge]]
tier = 7
title = "THE BOUNTY BOARD"
starter = '''
var contracts = new List<Contract> {
    new("grave-owl", 900), new("ashen-wyrm", 2400), new("fen-shade", 600), new("mire-moth", 1500),
};
// OrderByDescending / Sum / Average / Func<Contract, bool> predicates.
// THE FIRST BINDING is set. Further demands may arm as the glass runs.

record Contract(string Quarry, int Reward);
'''
briefs = [
  "Rank the board: order by reward descending and print «<rank>. <quarry> <reward>c» (rank 1-based), then «BOARD 4 CONTRACTS».",
  "Append «PURSE <total>c» and «MEAN <integer average>c».",
  "Define a Func<Contract, bool> for rewards >= 1200; print «PRIME <quarry>» for each match in ranked order, then «BOARD SEALED».",
]
solution = '''
var contracts = new List<Contract> {
    new("grave-owl", 900), new("ashen-wyrm", 2400), new("fen-shade", 600), new("mire-moth", 1500),
};
var ranked = contracts.OrderByDescending(c => c.Reward).ToList();
for (int i = 0; i < ranked.Count; i++)
    Console.WriteLine($"{i + 1}. {ranked[i].Quarry} {ranked[i].Reward}c");
Console.WriteLine($"BOARD {contracts.Count} CONTRACTS");
Console.WriteLine($"PURSE {contracts.Sum(c => c.Reward)}c");
Console.WriteLine($"MEAN {(int)contracts.Average(c => c.Reward)}c");
Func<Contract, bool> prime = c => c.Reward >= 1200;
foreach (var c in ranked.Where(prime))
    Console.WriteLine($"PRIME {c.Quarry}");
Console.WriteLine("BOARD SEALED");

record Contract(string Quarry, int Reward);
'''
cuts = [5, 7, 10]

[[challenge]]
tier = 8
title = "THE FOURFOLD SIEVE"
starter = '''
var wells = new[] { "well-3", "well-1", "well-7", "well-4" };

// Scry them CONCURRENTLY — Task.WhenAll, not one-by-one awaits.
// THE FIRST BINDING is set. Further demands may arm as the glass runs.

async Task<int> Scry(string well)
{
    await Task.Delay(30);
    return 700 + (well[^1] - '0');
}
'''
briefs = [
  "Scry all four wells at once with Task.WhenAll (readings return in cast order). Print «<well> <depth>» each, then «SCRIED 4 WELLS».",
  "Append «SHALLOWEST <well> <depth>» and «MEAN <integer average>».",
  "Wells under 705 are clear: print «CLEAR <well>» sorted by depth ascending, then «SIEVE DONE».",
]
solution = '''
var wells = new[] { "well-3", "well-1", "well-7", "well-4" };
var depths = await Task.WhenAll(wells.Select(Scry));
for (int i = 0; i < wells.Length; i++)
    Console.WriteLine($"{wells[i]} {depths[i]}");
Console.WriteLine($"SCRIED {wells.Length} WELLS");
int low = 0;
for (int i = 0; i < depths.Length; i++)
    if (depths[i] < depths[low]) low = i;
Console.WriteLine($"SHALLOWEST {wells[low]} {depths[low]}");
Console.WriteLine($"MEAN {(int)depths.Average()}");
foreach (var (well, d) in wells.Zip(depths).Where(p => p.Second < 705).OrderBy(p => p.Second))
    Console.WriteLine($"CLEAR {well}");
Console.WriteLine("SIEVE DONE");

async Task<int> Scry(string well)
{
    await Task.Delay(30);
    return 700 + (well[^1] - '0');
}
