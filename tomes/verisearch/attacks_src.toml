  "Inscribe the runes onto the cache stone, read them back FROM DISK, print each recovered line as «RUNE <line>», then «STORED 3 RUNES» (count from the stone, not the array).",
  "Parse each recovered key=value rune (Split on '=') and append «BOUND <key> = <value>» per line.",
