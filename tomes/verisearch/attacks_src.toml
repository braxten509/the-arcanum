# Reference solutions for verisearch's SPELL DUEL bank (C#, this tome's language).
# tools/gen_attacks.py runs each `solution` through this tome's runtime, slices the
# stdout into the cumulative stages, and writes attacks.toml.
# Regenerate:  python3 tools/gen_attacks.py verisearch   (server running)

[[challenge]]
tier = 1
title = "THE NAME-FORGING"
starter = '''
string name = "vael";
int ward = 12;
int leyline = 7;
// THE FIRST BINDING is set. Further demands may arm as the glass runs.
'''
briefs = [
  "Forge the sigil block. Print exactly three lines: «SIGIL vael @ WARD 12», «LEYLINE THREAD 7», «BINDING SOUGHT» — woven from the variables with interpolation, values not hardcoded.",
  "Compute the seal key: ward * leyline + name.Length. Append «KEY 88» (computed) and «BINDING GRANTED».",
  "Append the key's parity («PARITY ODD» or «PARITY EVEN»), the rite tag «RITE <ward><leyline>» (digits joined), then «SEAL SET».",
]
solution = '''
string name = "vael";
int ward = 12;
int leyline = 7;
Console.WriteLine($"SIGIL {name} @ WARD {ward}");
Console.WriteLine($"LEYLINE THREAD {leyline}");
Console.WriteLine("BINDING SOUGHT");
int key = ward * leyline + name.Length;
Console.WriteLine($"KEY {key}");
Console.WriteLine("BINDING GRANTED");
Console.WriteLine(key % 2 == 0 ? "PARITY EVEN" : "PARITY ODD");
Console.WriteLine($"RITE {ward}{leyline}");
Console.WriteLine("SEAL SET");
'''
cuts = [3, 5, 8]

[[challenge]]
tier = 1
title = "THE NUMBERED LOCK"
starter = '''
int glyphs = 4735;
// THE FIRST BINDING is set. Further demands may arm as the glass runs.
'''
briefs = [
  "Split the 4-glyph ward into its digits using / and % arithmetic (no strings). Print each on its own line as «GLYPH <d>», the thousandfold glyph first.",
  "Append «SUM <sum of glyphs>» and «PRODUCT <product of glyphs>» — computed, not hardcoded.",
  "Append «REVERSED <ward reversed>» (4735 → 5374) then «LOCK SPRUNG».",
]
solution = '''
int glyphs = 4735;
int d1 = glyphs / 1000;
int d2 = glyphs / 100 % 10;
int d3 = glyphs / 10 % 10;
int d4 = glyphs % 10;
Console.WriteLine($"GLYPH {d1}");
Console.WriteLine($"GLYPH {d2}");
Console.WriteLine($"GLYPH {d3}");
Console.WriteLine($"GLYPH {d4}");
Console.WriteLine($"SUM {d1 + d2 + d3 + d4}");
Console.WriteLine($"PRODUCT {d1 * d2 * d3 * d4}");
Console.WriteLine($"REVERSED {d4}{d3}{d2}{d1}");
Console.WriteLine("LOCK SPRUNG");
'''
cuts = [4, 6, 8]

[[challenge]]
tier = 2
title = "THE WARDEN'S LEDGER"
starter = '''
int[] motes = { 512, 1400, 64, 2048, 128, 900 };
// THE FIRST BINDING is set. Further demands may arm as the glass runs.
'''
briefs = [
  "Scan the ward's ledger. For each wisp print «WISP <n> <weight> <FLAG>» — n is 1-based, FLAG is BANE if weight > 1000 else CALM. Then print «WARD SCANNED».",
  "Append the tally «BANE <count> / <total>» and «BANISHED <sum of bane weights>».",
  "Append «PEAK <largest bane weight>» (computed), then the verdict: «PORTENT RED» if 3+ banes, «PORTENT AMBER» if 1-2, else «PORTENT GREEN».",
]
solution = '''
int[] motes = { 512, 1400, 64, 2048, 128, 900 };
int bane = 0, banished = 0, peak = 0;
for (int i = 0; i < motes.Length; i++)
{
    bool foul = motes[i] > 1000;
    Console.WriteLine($"WISP {i + 1} {motes[i]} {(foul ? "BANE" : "CALM")}");
    if (foul) { bane++; banished += motes[i]; if (motes[i] > peak) peak = motes[i]; }
}
Console.WriteLine("WARD SCANNED");
Console.WriteLine($"BANE {bane} / {motes.Length}");
Console.WriteLine($"BANISHED {banished}");
Console.WriteLine($"PEAK {peak}");
Console.WriteLine(bane >= 3 ? "PORTENT RED" : bane >= 1 ? "PORTENT AMBER" : "PORTENT GREEN");
'''
cuts = [7, 9, 11]

[[challenge]]
tier = 2
title = "THE LATTICE SWEEP"
starter = '''
// The scrying lattice is 4x4. The mote at row r, column c burns at r * c (both 1-based).
// THE FIRST BINDING is set. Further demands may arm as the glass runs.
'''
briefs = [
  "Sweep the 4x4 lattice with nested loops. For each row r print «ROW <r>: <v1> <v2> <v3> <v4>» where each mote is r*c, then print «SWEEP DONE».",
  "Append «DIAGONAL <sum of motes where r == c>» and «TOTAL <sum of all motes>».",
  "Append one line per row: «ROW <r> BRIGHT» if that row's sum > 20, else «ROW <r> DIM».",
]
solution = '''
int diag = 0, total = 0;
int[] rowSum = new int[5];
for (int r = 1; r <= 4; r++)
{
    string line = $"ROW {r}:";
    for (int c = 1; c <= 4; c++)
    {
        int v = r * c;
        line += $" {v}";
        total += v;
        rowSum[r] += v;
        if (r == c) diag += v;
    }
    Console.WriteLine(line);
}
Console.WriteLine("SWEEP DONE");
Console.WriteLine($"DIAGONAL {diag}");
Console.WriteLine($"TOTAL {total}");
for (int r = 1; r <= 4; r++)
    Console.WriteLine(rowSum[r] > 20 ? $"ROW {r} BRIGHT" : $"ROW {r} DIM");
'''
cuts = [5, 7, 11]

[[challenge]]
tier = 3
title = "THE ROLL OF ADEPTS"
starter = '''
var adepts = new List<Adept> {
    new("orin", 9, 42), new("vesper", 3, 17), new("sable", 5, 88), new("wren", 7, 5),
};
// THE FIRST BINDING is set. Further demands may arm as the glass runs.

record Adept(string Name, int Circle, int Rites);
'''
briefs = [
  "Print the roll: one line per adept «ADEPT <name> C<circle> R<rites>», then «ROLL 4 ADEPTS» (count computed).",
  "Might = Circle * 10 + Rites. Append «FOREMOST <name> <might>» for the highest and «MEAN CIRCLE <integer average>».",
  "Rank each adept by circle — 8+ ARCHMAGE, 5+ ADEPT, else NOVICE. Append one line per adept: «<name> <RANK>».",
]
solution = '''
var adepts = new List<Adept> {
    new("orin", 9, 42), new("vesper", 3, 17), new("sable", 5, 88), new("wren", 7, 5),
};
foreach (var a in adepts)
    Console.WriteLine($"ADEPT {a.Name} C{a.Circle} R{a.Rites}");
Console.WriteLine($"ROLL {adepts.Count} ADEPTS");
Adept top = adepts[0];
int circleSum = 0;
foreach (var a in adepts)
{
    if (a.Circle * 10 + a.Rites > top.Circle * 10 + top.Rites) top = a;
    circleSum += a.Circle;
}
Console.WriteLine($"FOREMOST {top.Name} {top.Circle * 10 + top.Rites}");
Console.WriteLine($"MEAN CIRCLE {circleSum / adepts.Count}");
foreach (var a in adepts)
    Console.WriteLine($"{a.Name} {(a.Circle >= 8 ? "ARCHMAGE" : a.Circle >= 5 ? "ADEPT" : "NOVICE")}");

record Adept(string Name, int Circle, int Rites);
'''
cuts = [5, 7, 11]

[[challenge]]
tier = 3
title = "THE RITE OF AUDIT"
starter = '''
int[] omens = { 3, 8, 1, 9, 5, 2 };
// Peril of an omen: 8+ = Dire, 4-7 = Stirring, otherwise Calm.
// THE FIRST BINDING is set. Further demands may arm as the glass runs.

enum Peril { Calm, Stirring, Dire }
'''
briefs = [
  "Map each omen to its Peril (8+ Dire, 4+ Stirring, else Calm) using the enum, and print «OMEN <c> <PERIL>» in caps (hint: ToString().ToUpper()).",
  "Append the counts: «CALM <n>», «STIRRING <n>», «DIRE <n>».",
  "Append «GRAVEST <highest omen>» and the verdict: «AUDIT FAILED» if 2+ omens are Dire, else «AUDIT PASSED».",
]
solution = '''
int[] omens = { 3, 8, 1, 9, 5, 2 };
int calm = 0, stirring = 0, dire = 0, max = 0;
foreach (int c in omens)
{
    Peril p = c >= 8 ? Peril.Dire : c >= 4 ? Peril.Stirring : Peril.Calm;
    Console.WriteLine($"OMEN {c} {p.ToString().ToUpper()}");
    if (p == Peril.Dire) dire++; else if (p == Peril.Stirring) stirring++; else calm++;
    if (c > max) max = c;
}
Console.WriteLine($"CALM {calm}");
Console.WriteLine($"STIRRING {stirring}");
Console.WriteLine($"DIRE {dire}");
Console.WriteLine($"GRAVEST {max}");
