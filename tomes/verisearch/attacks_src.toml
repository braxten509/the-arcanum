string charter = """
{"spire": {"name": "spire-7", "gate": 8443, "warded": true}, "circle": ["vael", "morda", "wren"], "seals": 5}
""";
// JsonDocument.Parse(charter).RootElement — GetProperty / GetString / GetInt32 / GetBoolean / EnumerateArray.
// THE FIRST BINDING is set. Further demands may arm as the glass runs.
'''
briefs = [
  "Walk the stolen charter with JsonDocument. Print «SPIRE spire-7», «GATE 8443», «SEALS 5» — all read from the parchment, never hardcoded.",
  "Enumerate the circle array: «MEMBER <name>» per entry, then «CIRCLE <count>».",
  "Append the verdicts: «WARD SET» if spire.warded is true (else «WARD BROKEN»), «GATE HIGH» if gate >= 8000 (else «GATE LOW»), then «CHARTER READ».",
