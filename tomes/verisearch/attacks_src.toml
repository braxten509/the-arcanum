solution = '''
using System.Text.Json;

string charter = """
{"spire": {"name": "spire-7", "gate": 8443, "warded": true}, "circle": ["vael", "morda", "wren"], "seals": 5}
""";
var root = JsonDocument.Parse(charter).RootElement;
