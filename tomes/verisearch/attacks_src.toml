    Console.WriteLine($">> {r}");
Console.WriteLine("ALL BOUND");
Console.WriteLine($"CHORD {gathered.Aggregate(0, (a, s) => a ^ s.power)}");
Console.WriteLine($"KEYSTONE {gathered.OrderByDescending(s => s.power).First().name}");
Console.WriteLine("RITE COMPLETE");

