}
Console.WriteLine($"CIRCLE {members}");
Console.WriteLine(spire.GetProperty("warded").GetBoolean() ? "WARD SET" : "WARD BROKEN");
Console.WriteLine(spire.GetProperty("gate").GetInt32() >= 8000 ? "GATE HIGH" : "GATE LOW");
