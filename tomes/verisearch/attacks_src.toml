    new Source("RFC mirror", "https://example.test/rfc"),
    new Source("Notes", "mock://notes"),
};
string[] requested = { "nist", "RFC", "rfc mirror", "missing" };
// Admit only configured labels with http/https URLs; preserve request order and URL uniqueness.
// THE FIRST BINDING is set. Further demands may arm as the glass runs.
'''
briefs = [
  "Resolve each requested label against configured sources with ordinal case-insensitive comparison. Reject unknown labels and non-http(s) URLs. Print «REQUEST <label> ADMITTED» or «REQUEST <label> REJECTED».",
  "Keep admitted sources in request order, deduplicated by URL with ordinal case-insensitive comparison. Print each survivor as «SOURCE <label> <url>».",
  "Append «COUNT <selected count>», «REJECTED <rejected count>», «ORDER <comma-separated labels>», «POLICY SET», then «TOLL DONE».",
]
solution = '''
var configured = new[] {
    new Source("RFC", "https://example.test/rfc"),
    new Source("NIST", "https://example.test/nist"),
    new Source("RFC mirror", "https://example.test/rfc"),
    new Source("Notes", "mock://notes"),
};
string[] requested = { "nist", "RFC", "rfc mirror", "missing" };
var selected = new List<Source>();
var seenUrls = new HashSet<string>(StringComparer.OrdinalIgnoreCase);
int rejected = 0;
foreach (string label in requested)
{
    Source? source = configured.FirstOrDefault(s =>
        string.Equals(s.Label, label, StringComparison.OrdinalIgnoreCase));
    bool valid = source is not null
        && Uri.TryCreate(source.Url, UriKind.Absolute, out Uri? uri)
        && (uri.Scheme == Uri.UriSchemeHttp || uri.Scheme == Uri.UriSchemeHttps)
        && seenUrls.Add(source.Url);
    if (valid) selected.Add(source!);
    else rejected++;
    Console.WriteLine($"REQUEST {label} {(valid ? "ADMITTED" : "REJECTED")}");
}
foreach (Source source in selected)
    Console.WriteLine($"SOURCE {source.Label} {source.Url}");
Console.WriteLine($"COUNT {selected.Count}");
Console.WriteLine($"REJECTED {rejected}");
Console.WriteLine($"ORDER {string.Join(',', selected.Select(s => s.Label))}");
Console.WriteLine("POLICY SET");
Console.WriteLine("TOLL DONE");

record Source(string Label, string Url);
'''
