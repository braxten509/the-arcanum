};
var proposals = new[] {
    new Proposal(7, "Exact evidence."), new Proposal(7, "invented evidence"),
};
// The model proposes passage id and quote. C# owns exact verification and attribution.
// THE FIRST BINDING is set. Further demands may arm as the glass runs.
'''
briefs = [
  "For each proposal, find its passage and require an ordinal exact substring. Print «PROPOSAL <n> ACCEPTED» or «PROPOSAL <n> REJECTED», then «WEIGHED 2».",
  "For every accepted proposal construct a Verified value using the matched passage's Source—not model-supplied attribution. Print «SOURCE <label> <url>» and «PASSAGE <id> <quote>».",
  "Append «VERIFIED <count>», «REJECTED <count>», «ATTRIBUTION SEALED», then «WEIGHING DONE».",
]
solution = '''
var source = new Source("RFC", "https://example.test/rfc");
var passages = new[] {
    new Passage(7, "Before. Exact evidence. After.", source),
};
var proposals = new[] {
    new Proposal(7, "Exact evidence."), new Proposal(7, "invented evidence"),
};
var verified = new List<Verified>();
for (int i = 0; i < proposals.Length; i++)
{
    Proposal proposal = proposals[i];
    Passage? passage = passages.FirstOrDefault(p => p.Id == proposal.PassageId);
    bool exact = passage is not null
        && passage.Text.Contains(proposal.Quote, StringComparison.Ordinal);
    if (exact)
        verified.Add(new Verified(proposal.Quote, passage!.Source, passage.Id));
    Console.WriteLine($"PROPOSAL {i + 1} {(exact ? "ACCEPTED" : "REJECTED")}");
}
Console.WriteLine($"WEIGHED {proposals.Length}");
foreach (Verified item in verified)
{
    Console.WriteLine($"SOURCE {item.Source.Label} {item.Source.Url}");
    Console.WriteLine($"PASSAGE {item.PassageId} {item.Quote}");
}
Console.WriteLine($"VERIFIED {verified.Count}");
Console.WriteLine($"REJECTED {proposals.Length - verified.Count}");
Console.WriteLine("ATTRIBUTION SEALED");
Console.WriteLine("WEIGHING DONE");

record Source(string Label, string Url);
record Passage(int Id, string Text, Source Source);
record Proposal(int PassageId, string Quote);
record Verified(string Quote, Source Source, int PassageId);
'''
