[meta]
id = "verisearch"
name = "The Liber Veritatis"
description = "Reach intermediate C# by building and publishing a flexible AI-assisted evidence CLI: the user chooses sources, a real configurable AI selects quotations semantically, and C# verifies exact text and owns every citation."
author = "THE ARCANUM"
version = "4.0.0"
favicon = "✦"

[runtime]
name = "dotnet"
project = "Verisearch"
language = "C#"
packages = true
editorLang = "csharp"
entryFile = "src/Verisearch/Program.cs"
projectFile = "Verisearch.slnx"
newFileExt = ".cs"
starterCode = ""
scaffoldCommand = []
buildCommand = ["dotnet", "build", "Verisearch.slnx", "--nologo", "-v", "q"]
runCommand = ["dotnet", "run", "--no-build", "--project", "{dir}/src/Verisearch/Verisearch.csproj", "--"]
validationDependencies = []
deliveryCreateCommand = ["dotnet", "new", "console", "--output", "{env}", "--force", "--no-restore"]
deliveryInstallCommand = ["dotnet", "restore", "{requirements}", "--force-evaluate", "--nologo"]
deliveryBuildCommand = ["dotnet", "publish", "{requirements}", "--configuration", "Release", "--output", "{dir}/dist", "--nologo"]

[content]
sections = ["s01", "s02", "s03", "s04", "s05", "s06", "s07", "s08", "s09", "s10", "s11", "s12"]
capabilityLedger = true
proofVersion = 1

[acceptance]
version = 1
mode = "run"
artifact = "package"
runArgs = ["--arcanum-acceptance"]
scenarios = ["parse-whole-question", "honor-user-source-choice", "extract-stable-passages", "invoke-configured-ai", "reject-fabricated-quote", "preserve-source-attribution", "survive-partial-source-failure", "render-cited-report", "clean-package-launch"]
controls = ["input"]

[defaults]
theme = "vellum"

[defaults.ai]
oracle = "qwen3:8b"
grader = "qwen2.5:14b"
graderKind = "claude-cli"
graderModel = "claude-opus-4-8"

[economy]
ranks = [[0, "NOVICE SCRIBE"], [400, "APPRENTICE"], [1000, "COPYIST OF RUNES"], [2000, "CONJURER"], [3500, "RUNEBINDER"], [5000, "SPELLWRIGHT"], [6800, "MAGISTER-ASPIRANT"], [9000, "HIGH THAUMATURGE"], [12000, "ARCHMAGE"]]
hintCost = 75
oracleCost = 10
attemptMultipliers = [1, 0.6, 0.3]
comboStep = 0.05
comboCap = 0.5
sRankMultiplier = 1.5
attackStakePerDiff = 20
attackWinPerDiff = 15

[narrative]
objective = "Reach Mastery 3 C# by independently building the LIBER VERITATIS: a real provider-flexible program where the user chooses sources, AI selects evidence by meaning, and deterministic C# admits only exact source quotations with source-owned citations."
title = "ARCANUM // LIBER VERITATIS"
logo = "LIBER VERITATIS"
opsLabel = "CHAPTERS"
graderLabel = "OPUS 4.8 // MAGISTER THORNE"
graderPersona = "MAGISTER THORNE"
studentTerm = "apprentice"
gradeScale = "S|A|B|C|D|F"
currency = "gold"
currencyShort = "gp"
completeText = "THE TOME WORKS. THE EVIDENCE SURVIVES. THE APPRENTICE CHOSE THE DESIGN."
bootLines = ["The match flares. The candle takes the flame.", "The Liber Veritatis begins as an empty C# project, not a copied answer.", "Fourteen language capabilities form the spine from data and control to tests and delivery.", "The seeker chooses the sources. The whole question crosses one semantic AI boundary.", "No keyword table decides which lookup ritual to perform.", "AI may propose. It may not certify itself.", "C# compares exact text and restores source-owned attribution.", "Local model, API wrapper, or CLI adapter: the provider is a replaceable edge.", "A deterministic mock exists only for tests and identifies itself plainly.", "Two late Workings remove the rails: integrate, extend, diagnose, and justify.", "A clean package must repeat the same acceptance journey.", "Take up your quill. The first build is yours."]
gradingLines = ["the project is compiled before the prose is believed...", "the whole question is traced across the selected-source boundary...", "the AI proposal is compared with the exact stored passage...", "citation ownership is followed back to C# data...", "a deliberate source failure tests the degradation path...", "the rationale is weighed against the implemented C# choice...", "the published executable repeats the negative controls..."]

[progression]
attackTime = 180
attackStages = [0, 60, 120]
blackIceThreshold = 10
blackIcePerDiffCap = 2

[progression.earnedTheme]
id = "starlit"
name = "STARLIT FOLIO"
desc = "Near-black night vellum, silver script, and the proof of an independently shipped C# artifact."
