
[meta]
id = "verisearch"
name = "The Liber Veritatis"
description = "Learn C# from nothing by forging the Liber Veritatis: a local AI-assisted CLI that proposes precise quotations from sources you choose, then prints only text C# verifies exists verbatim in those sources, with citations it owns."
author = "THE ARCANUM"
version = "3.0.0"
favicon = "✦"

[runtime]
name = "dotnet"
project = "Verisearch"
language = "C#"
packages = true
editorLang = "csharp"
entryFile = "Program.cs"
newFileExt = ".cs"
starterCode = '''
Console.WriteLine("Verisearch v0.1");
'''

[content]
sections = ["s01", "s02", "s03", "s04", "s05", "s06", "s07", "s08", "s09", "s10", "s11", "s12"]
capabilityLedger = true
# attacks bank is machine-generated to generated/attacks.toml (the engine default) —
# author attacks_src.toml and run: python3 tools/gen_attacks.py verisearch

[defaults]
theme = "vellum"

[defaults.ai]
oracle = "qwen3:8b"
grader = "qwen2.5:14b"
graderKind = "claude-cli"
graderModel = "claude-opus-4-8"

[economy]
ranks = [[0, "NOVICE SCRIBE"], [400, "APPRENTICE"], [1000, "COPYIST OF RUNES"], [2000, "CONJURER"], [3500, "RUNEBINDER"], [5000, "SPELLWRIGHT"], [6800, "MAGISTER-ASPIRANT"], [9000, "HIGH THAUMATURGE"], [12000, "ARCHMAGE"]]
hintCost = 75
oracleCost = 10
attemptMultipliers = [1, 0.6, 0.3]
comboStep = 0.05
comboCap = 0.5
sRankMultiplier = 1.5
attackStakePerDiff = 20
attackWinPerDiff = 15

[narrative]
objective = "Forge the LIBER VERITATIS — a real C# command-line artifact that asks a local AI to propose precise evidence from user-chosen sources, accepts only quotations proven to be exact source substrings, attaches citations from trusted C# data, and never presents a paraphrase as a quote."
title = "ARCANUM // LIBER VERITATIS"
logo = "LIBER VERITATIS"
opsLabel = "CHAPTERS"
graderLabel = "OPUS 4.8 // MAGISTER THORNE"
graderPersona = "MAGISTER THORNE"
studentTerm = "apprentice"
gradeScale = "S|A|B|C|D|F"
currency = "gold"
currencyShort = "gp"
completeText = "THE TOME IS FORGED. EVERY SEAL IS SET."
bootLines = ["The match flares. The candle takes the flame.", "By its light: a tome of {N} chapters, bound in patience and C#.", "Its name is LIBER VERITATIS — the Book of True Words.", "Finished, it will work true magic: asked a question, it compels", "trusted texts to speak their OWN words back — exact, attributed, unbent.", "No paraphrase. No embellishment. The Whisper of Distortion, which twists", "all retellings, holds no power over words quoted whole.", "On the first page, in a cramped and impatient hand:", "\"Apprentice. Every rune of C# you learn here feeds the tome. Pass the", " trials, earn your gold, kit out your desk — and when I say WORK,", " you forge. I judge. Fairly, which is worse.\"  — THORNE", "The tome falls open where you left it. Take up your quill."]
gradingLines = ["your pages are carried up the tower stair...", "MAGISTER THORNE unties the ribbon. Slowly. On purpose.", "he reads with the candle low and the lens high...", "the work is weighed against the judgement chart...", "he muttered something. impossible to tell if it was praise.", "he compares your runes against the binding terms...", "a raven waits at the window to carry the verdict back...", "he has dipped his quill in the red ink. bracing recommended."]

[progression]
attackTime = 180
attackStages = [0, 60, 120]
blackIceThreshold = 10
blackIcePerDiffCap = 2

[progression.earnedTheme]
id = "starlit"
name = "STARLIT FOLIO"
desc = "Near-black night vellum, silver script, a thread of won gold. Proof you answered every rival who came calling."
