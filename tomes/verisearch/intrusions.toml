[[tiers.pool]]
t = "CENSUS OF TONGUES"
brief = "The hex speaks in several tongues at once. Take a census, loudest tongue first."
starter = '''
string[] log = { "tcp", "udp", "tcp", "icmp", "tcp", "udp" };
// GroupBy protocol, order by count descending, print each:  <proto> <count>
'''
expect = '''
tcp 3
udp 2
icmp 1'''
solution = '''
string[] log = { "tcp", "udp", "tcp", "icmp", "tcp", "udp" };
foreach (var group in log.GroupBy(protocol => protocol).OrderByDescending(group => group.Count()))
    Console.WriteLine($"{group.Key} {group.Count()}");
'''

[[tiers.pool]]
