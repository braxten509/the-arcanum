[[tiers.pool]]
t = "THE CONTAINED FAILURE"
brief = "One of three wards will crack. Contain that failure and report the two survivors with the broken count."
starter = '''
int[] wards = { 1, 2, 3 };
// Run Check for all wards through a per-task catch; print:  2 HELD / 1 BROKE
async Task<bool> Check(int ward)
{
    await Task.Delay(10);
    if (ward == 2) throw new Exception("cracked");
    return true;
}
'''
expect = "2 HELD / 1 BROKE"
solution = '''
int[] wards = { 1, 2, 3 };
bool[] results = await Task.WhenAll(wards.Select(SafeCheck));
int held = results.Count(result => result);
Console.WriteLine($"{held} HELD / {results.Length - held} BROKE");

async Task<bool> SafeCheck(int ward)
{
    try { return await Check(ward); }
    catch { return false; }
}

async Task<bool> Check(int ward)
{
    await Task.Delay(10);
    if (ward == 2) throw new Exception("cracked");
    return true;
}
'''
