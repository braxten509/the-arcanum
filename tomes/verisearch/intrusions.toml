[[tiers.pool]]
t = "THE DOMAIN LEDGER"
brief = "The same domains recur under different traces. Count each domain and order the ledger by frequency, then name."
starter = '''
string[] domains = { "ietf.org", "nist.gov", "ietf.org", "example.net", "nist.gov", "ietf.org" };
// GroupBy domain; order count descending then domain ascending; print: <domain> <count>
'''
expect = '''
ietf.org 3
nist.gov 2
example.net 1'''
solution = '''
string[] domains = { "ietf.org", "nist.gov", "ietf.org", "example.net", "nist.gov", "ietf.org" };
foreach (var group in domains.GroupBy(domain => domain)
                             .OrderByDescending(group => group.Count())
                             .ThenBy(group => group.Key))
    Console.WriteLine($"{group.Key} {group.Count()}");
'''

[[tiers.pool]]
t = "THE WEIGHTED SEAL"
brief = "Each rune contributes its strength multiplied by its position. Fold the weighted sequence into one seal value."
starter = '''
int[] runes = { 3, 5, 2, 7 };
// weighted total uses positions 1..4; print:  WEIGHTED <total>
'''
expect = "WEIGHTED 47"
solution = '''
