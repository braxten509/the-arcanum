# ARCANUM tome manifest — scaffolded by tools/new_tome.py.
# Replace every TODO, then run:  python3 tools/validate_tome.py tomes/untitled-6
# Read tome-authoring/2-tome-toml.md before filling this in — every key here is documented there.

[meta]
id = "hollowmere"                       # MUST equal the folder name
name = "Hollowmere"
description = "Build and ship Hollowmere, a complete desktop 2D action RPG with a multi-map world, quests, combat, inventory, save-and-resume, and a packaged release across 12 chapters."
author = "The Arcanum"
version = "0.1.0"
favicon = "HM"

[runtime]
name = "python"                # a global-configs/runtimes/<name>.toml id
project = "Hollowmere"
projectFile = "pyproject.toml"
language = "Python"           # display name, used in grader/oracle prompts
externalWorkspace = true
validationDependencies = ["pygame", "pytmx", "pytest", "pyinstaller"]
# packages = false                 # true only for dotnet/NuGet tomes
# externalWorkspace = true         # ONLY for courses whose real work lives in the player's
                                   # own external tools; the player chooses its location.
# starterCode inherits from the language TOML; override it here if you want a
# different first-run entry file:
# starterCode = '''
# TODO: the entry file's first contents
# '''

[content]
sections = ["s01", "s02", "s03", "s04", "s05", "s06", "s07", "s08", "s09", "s10", "s11", "s12"]  # ordered section ids; each maps to sections/<id>/
capabilityLedger = true             # keep this: lessons declare `teaches`, capstones
                                    # declare cumulative `requires`; validator proves order
proofVersion = 1                    # future-tome contract: replay learner edits + run milestones
# OPTIONAL duel bank → generated/attacks.toml (the engine default). Do NOT hand-write it:
# author attacks_src.toml, then run  python3 tools/gen_attacks.py untitled-6

[acceptance]
version = 1
mode = "run"                       # run; guided only for inherently unautomatable external work
artifact = "package"               # runtime | package
runArgs = ["--arcanum-acceptance"]
scenarios = ["clean-environment-boots", "player-navigates-and-collides", "tiled-world-transitions", "npc-quest-accepted", "enemy-defeated", "reward-equipped", "save-and-quit-cleanly", "saved-world-resumes", "sunken-watch-cleared", "stranger-quest-completed", "packaged-build-launches"]
controls = ["input", "clock", "seed", "frame-limit"]

[defaults]
theme = "signature"                # a [[themes]] id below (this tome's own default look)

[defaults.ai]
oracle = "llama3.1:8b"
grader = "qwen2.5:14b"
graderKind = "claude-cli"
graderModel = "claude-opus-4-8"

[economy]
# TODO: rebalance once your exercise/freestyle points are set (see § [economy]).
ranks = [[0, "NOVICE"], [400, "ADEPT"], [1000, "MASTER"]]
hintCost = 50
oracleCost = 10
attemptMultipliers = [1, 0.6, 0.3]
comboStep = 0.05
comboCap = 0.5
sRankMultiplier = 1.5
attackStakePerDiff = 20
attackWinPerDiff = 15

[narrative]
objective = "Build Hollowmere from a clean Python workspace into a complete multi-map 2D action RPG, then prove its quests, combat, inventory, persistence, and packaged desktop release end to end."
title = "ARCANUM // HOLLOWMERE"
logo = "THE HOLLOWMERE CHART"
opsLabel = "WAYMARKS"
graderPersona = "MARA VENN // MARSH CARTOGRAPHER"
studentTerm = "Wayfinder"
currency = "lantern mark"
currencyShort = "lm"
gradeScale = "S|A|B|C|D|F"
bootLines = [
  "A map is only honest after someone walks the ground.",
  "Hollowmere waits beyond {N} waymarks, dark water and all.",
  "I am Mara Venn. I chart systems, not comforting stories.",
  "Your commission is a living RPG: world, quests, steel, memory, and return.",
  "We begin with the real Python tools and keep every failure legible.",
  "Each waymark leaves the same game stronger than we found it.",
  "Colored shapes will prove the machinery before borrowed beauty can hide it.",
  "Tiled will hold the roads. Pygame will keep the lantern burning.",
  "Tests will remember what confidence forgets.",
  "At the far shore, your packaged build must stand outside this study and run.",
]
gradingLines = [
  "Mara checks the map against the ground...",
  "The lantern is held close to every branch...",
  "Footprints are counted; shortcuts are not assumed...",
  "The marsh gives up the first broken invariant...",
  "Save marks and scene borders are being compared...",
  "The commission is tested from a cold trail...",
  "Mara writes the verdict in dry ink...",
]
completeText = "HOLLOWMERE ENDURES. The roads join, the save remembers, and your sealed build carries its own lantern beyond the study."

# --- the peddler's shop -------------------------------------------------------
