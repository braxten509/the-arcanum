REQUESTS True False True PHASE active
'''
solution = '''
phase = "idle"
requests = []
requests.append(phase == "idle")
if requests[-1]:
    phase = "active"
requests.append(phase == "idle")
phase = "recovery"
phase = "idle"
requests.append(phase == "idle")
if requests[-1]:
    phase = "active"
print("REQUESTS", *requests, "PHASE", phase)
