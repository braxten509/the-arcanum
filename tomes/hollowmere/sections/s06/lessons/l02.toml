[[lessons.artifactSteps]]
id = "s06-add-attack-controller"
path = "src/hollowmere/combat.py"
mode = "append"
instruction = "Append the complete timed attack state machine, directional world hitbox, and once-per-swing target set."
content = '''


class AttackPhase(StrEnum):
    IDLE = "idle"
    ACTIVE = "active"
    RECOVERY = "recovery"


class AttackController:
    """Own attack timing, facing, hitbox, and per-swing targets."""

    def __init__(self, active_seconds=0.12, cooldown_seconds=0.30):
        if active_seconds <= 0 or cooldown_seconds < 0:
            raise CombatError("attack timing must be positive")
        self.active_seconds = active_seconds
        self.cooldown_seconds = cooldown_seconds
        self.phase = AttackPhase.IDLE
        self.remaining = 0.0
        self.facing = pygame.Vector2(1, 0)
        self._hit_targets = set()

    def request(self, facing):
        if self.phase is not AttackPhase.IDLE:
            return False
        direction = pygame.Vector2(facing)
        if direction.length_squared() == 0:
            raise CombatError("attack facing must be nonzero")
        self.facing = direction.normalize()
        self._hit_targets.clear()
        self.phase = AttackPhase.ACTIVE
        self.remaining = self.active_seconds
        return True

    def update(self, dt):
        if dt < 0:
            raise CombatError("combat dt must be nonnegative")
        if self.phase is AttackPhase.IDLE:
            return
        self.remaining = max(0.0, self.remaining - dt)
        if self.remaining > 0:
            return
        if self.phase is AttackPhase.ACTIVE:
            self.phase = AttackPhase.RECOVERY
            self.remaining = self.cooldown_seconds
        else:
            self.phase = AttackPhase.IDLE

    def hitbox(self, body):
        if self.phase is not AttackPhase.ACTIVE:
            return pygame.Rect(0, 0, 0, 0)
        extent = 28
        thickness = 24
        if abs(self.facing.x) >= abs(self.facing.y):
            x = body.right if self.facing.x > 0 else body.left - extent
            return pygame.Rect(x, body.centery - thickness // 2, extent, thickness)
        y = body.bottom if self.facing.y > 0 else body.top - extent
        return pygame.Rect(body.centerx - thickness // 2, y, thickness, extent)

    def can_hit(self, target_id):
        return (
            self.phase is AttackPhase.ACTIVE
            and target_id not in self._hit_targets
        )

    def mark_hit(self, target_id):
        self._hit_targets.add(target_id)
'''

[[lessons.artifactSteps]]
id = "s06-test-attack-controller"
path = "tests/test_combat.py"
mode = "append"
instruction = "Append tests for request gating, exact phase timing, directional Rect placement, zero inactive hitbox, and once-per-swing target ids."
content = '''


def test_attack_phase_hitbox_and_cooldown_are_deterministic():
    from hollowmere.combat import AttackController, AttackPhase

    attack = AttackController(active_seconds=0.12, cooldown_seconds=0.30)
    body = __import__("pygame").Rect(96, 64, 32, 32)
    assert attack.request((1, 0)) is True
    assert attack.request((1, 0)) is False
    assert attack.hitbox(body) == __import__("pygame").Rect(128, 68, 28, 24)
    assert attack.can_hit("bog_wisp_1") is True
    attack.mark_hit("bog_wisp_1")
    assert attack.can_hit("bog_wisp_1") is False
    attack.update(0.12)
    assert attack.phase is AttackPhase.RECOVERY
    assert not attack.hitbox(body)
    attack.update(0.30)
    assert attack.phase is AttackPhase.IDLE
    assert attack.request((0, -1)) is True
'''

