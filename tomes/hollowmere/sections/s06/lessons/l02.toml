[[lessons]]
id = "s06-l02"
title = "Give a Strike a Beginning and End"
teaches = ["timed-attack-state-machine", "directional-attack-hitbox"]
body = '''
<p>A real-time attack is not “Space means damage.” It moves through <code>idle</code>, <code>active</code>, and <code>recovery</code>. Idle may accept a request. Active exposes a hitbox for a short window. Recovery rejects repeated requests until its cooldown expires. <code>AttackPhase</code> is a StrEnum, reusing the stable symbolic-state pattern from QuestStatus.</p>
<pre><code data-kind="runnable">phase = "idle"
remaining = 0.0
if phase == "idle":
    phase = "active"
    remaining = 0.12
remaining = max(0.0, remaining - 0.12)
if phase == "active" and remaining == 0.0:
    phase = "recovery"
print("ATTACK", phase)</code></pre>
<p>The receipt is <code>ATTACK recovery</code>. <code>remaining</code> is seconds, so it uses the same dt unit as Player movement. <code>request(facing)</code> returns False unless the phase is idle. For an accepted request it copies and normalizes the nonzero facing Vector2, clears the set of targets hit by this swing, enters active, and loads <code>active_seconds</code>.</p>
<p><code>update(dt)</code> rejects negative time, subtracts dt, clamps at zero, then performs the next state transition when the timer expires. Active becomes recovery and loads <code>cooldown_seconds</code>; recovery becomes idle. An immediate second request therefore cannot restart the active window. A common bug is resetting the cooldown on every held frame, which can leave an attack permanently active or apply damage at the frame rate.</p>
<p>The directional hitbox is an integer world-space Rect derived from the Player body and stored facing. For a horizontal facing, its x begins at <code>body.right</code> when facing east or ends at <code>body.left</code> when facing west; its y is centered on <code>body.centery</code>. Vertical attacks mirror that rule around <code>body.top</code> or <code>body.bottom</code>. Outside active state, <code>hitbox()</code> returns a zero-size Rect, which cannot collide.</p>
<p>One active window may span multiple frames. <code>can_hit(target_id)</code> checks both phase and a set of already-hit ids. A set is a collection that stores each value at most once. <code>mark_hit()</code> adds the id after damage. The set is cleared only when a new attack is accepted, so an enemy overlapping for three active frames loses health once. Adding before collision would suppress a real hit; adding after damage keeps the event aligned with behavior.</p>
<div class="field-notes"><div class="fn-head">FIELD NOTES // TIME IS PART OF THE WEAPON</div><p>The hitbox describes where. The phase and per-swing target set describe when and how often.</p></div>
'''

[[lessons.concepts]]
id = "timed-attack-state-machine"
purpose = "Gate each attack through idle, active, and recovery phases measured in seconds, rejecting repeat requests until cooldown ends."
anatomy = "Define StrEnum phases; request only from idle; normalize facing; clear hit ids; load active time; subtract nonnegative dt; transition to recovery; load cooldown; transition to idle."
example = "The complete timer example accepts from idle, spends the active window, and prints recovery."
observable = "The first request returns True, an immediate repeat returns False, active exposes a hitbox, and request works again only after both timers expire."
failure = "Resetting timing while a key is held repeats damage; using milliseconds makes windows 1000 times too long; accepting zero facing cannot choose a hitbox direction."
