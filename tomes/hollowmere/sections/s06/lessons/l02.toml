type = "write"
points = 36
prompt = "Simulate idle, active for 0.1 seconds, and recovery for 0.3 seconds. Accept requests at times 0.0, 0.05, and 0.4 so the middle request is blocked, then print exactly <code>REQUESTS True False True PHASE active</code>."
