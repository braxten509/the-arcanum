[[lessons.exercises]]
id = "s06-l04-w1"
type = "write"
points = 38
prompt = "Given enemies a/alive, b/dead, c/alive, iterate a copy, collect the dead id, rebuild survivors with a list comprehension, and print exactly <code>DEFEATED b SURVIVORS a,c</code>."
starter = '''
enemies = [{"id": "a", "alive": True}, {"id": "b", "alive": False}, {"id": "c", "alive": True}]
'''
expect = '''
DEFEATED b SURVIVORS a,c
'''
solution = '''
enemies = [{"id": "a", "alive": True}, {"id": "b", "alive": False}, {"id": "c", "alive": True}]
defeated = []
for enemy in list(enemies):
    if not enemy["alive"]:
        defeated.append(enemy["id"])
enemies = [enemy for enemy in enemies if enemy["alive"]]
print("DEFEATED", ",".join(defeated), "SURVIVORS", ",".join(enemy["id"] for enemy in enemies))
'''
hint = "Collect from the copied pass, then filter the original into a new list after the loop."
