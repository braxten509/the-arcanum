[[lessons.exercises]]
id = "s06-l01-w1"
type = "write"
points = 36
prompt = "Start at health 6. Apply damage values 2, 9, and 1, clamp after every hit, collect actual losses, and print exactly <code>HP 0 LOSSES 2,4,0 ALIVE False</code>."
starter = '''
health = 6
damage_values = [2, 9, 1]
losses = []
'''
expect = '''
HP 0 LOSSES 2,4,0 ALIVE False
'''
solution = '''
health = 6
damage_values = [2, 9, 1]
losses = []
for amount in damage_values:
    before = health
    health = max(0, health - amount)
    losses.append(before - health)
print("HP", health, "LOSSES", ",".join(str(value) for value in losses), "ALIVE", health > 0)
'''
hint = "Store before each subtraction, clamp with max, and join the actual differences as strings."
