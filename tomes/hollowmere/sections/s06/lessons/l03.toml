[[lessons.exercises]]
id = "s06-l03-w1"
type = "write"
points = 36
prompt = "Using pygame.Vector2, calculate pursuit from (0,0) toward (3,4), normalize, scale by speed 20 and dt 0.5, then print exactly <code>CHASE 6.0 8.0 DISTANCE 10.0</code>."
expect = '''
CHASE 6.0 8.0 DISTANCE 10.0
'''
solution = '''
import os
os.environ["PYGAME_HIDE_SUPPORT_PROMPT"] = "1"
import pygame
offset = pygame.Vector2(3, 4)
displacement = offset.normalize() * 20 * 0.5
print("CHASE", displacement.x, displacement.y, "DISTANCE", displacement.length())
'''
hint = "Normalize the 3-4-5 offset before multiplying by speed and elapsed seconds."
