[[lessons.exercises]]
id = "s06-l05-w1"
type = "write"
points = 38
prompt = "Process command frames <code>space</code>, <code>space</code>, <code>cooldown</code>, <code>space</code>; accept attacks only while idle, set recovery after the first accepted strike, reset on cooldown, and print exactly <code>ATTACKS 2 BLOCKED 1 PHASE active</code>."
expect = '''
ATTACKS 2 BLOCKED 1 PHASE active
'''
solution = '''
commands = ["space", "space", "cooldown", "space"]
phase = "idle"
attacks = 0
blocked = 0
for command in commands:
    if command == "cooldown":
        phase = "idle"
    elif command == "space" and phase == "idle":
        attacks += 1
        phase = "active"
        if attacks == 1:
            phase = "recovery"
    elif command == "space":
        blocked += 1
print("ATTACKS", attacks, "BLOCKED", blocked, "PHASE", phase)
'''
hint = "Only idle accepts Space; the cooldown command restores idle between the blocked and final request."
