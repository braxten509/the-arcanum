[[lessons.artifactSteps]]
id = "s06-integrate-combat-update"
path = "src/hollowmere/scene.py"
mode = "replace"
instruction = "Replace only MarshScene.update with the same movement/map/quest behavior plus facing, one combat update, and post-knockback camera follow."
find = '''
    def update(self, actions, dt):
        """Advance world state and traverse an overlapping doorway."""
        displacement = self.player.displacement(actions, dt)
        self.world.move(self.player, displacement)
        transition = self.loaded_map.transition_for(self.player.rect())
        if transition is not None:
            self.quest_log.record("crossed_causeway")
            self.change_map(
                transition["target_map"],
                transition["target_spawn"],
            )
            self.last_transition = transition
        else:
            self.camera.follow(self.player.rect())
'''
content = '''
    def update(self, actions, dt):
        """Advance movement, map events, combat, and camera once."""
        direction = self.player.movement_vector(actions)
        if direction.length_squared() > 0:
            self.facing = direction
        displacement = self.player.displacement(actions, dt)
        self.world.move(self.player, displacement)
        transition = self.loaded_map.transition_for(self.player.rect())
        if transition is not None:
            self.quest_log.record("crossed_causeway")
            self.change_map(
                transition["target_map"],
                transition["target_spawn"],
            )
            self.last_transition = transition
        self.combat.update(dt)
        self.camera.follow(self.player.rect())
'''

