[[lessons]]
id = "s06-l05"
title = "Join Steel to the Living Marsh"
teaches = ["event-loop-combat-integration", "cumulative-combat-proof"]
body = '''
<p>Combat joins the game through existing ports. Space is a command edge like E, not a held movement action. <code>InputState</code> stores <code>_attack_requested</code> on KEYDOWN and <code>consume_attack()</code> returns then clears it. The four-key movement snapshot remains unchanged, so Player's s02 movement and s03 event contracts do not acquire an accidental fifth direction.</p>
<pre><code data-kind="patch">if input_state.consume_attack():
    scene.attack()
scene.update(input_state.snapshot(), dt)
scene.render(screen)
pygame.display.flip()</code></pre>
<p>The event loop still drains once and Clock still produces one seconds dt. <code>scene.attack()</code> asks CombatSystem to start using the scene's stored facing. During update, a nonzero <code>Player.movement_vector(actions)</code> refreshes facing; no movement leaves the last direction intact. The scene applies Player displacement through CollisionWorld, handles its existing TMX transition and quest event, updates combat once, then follows Player after any knockback.</p>
<p>MarshScene creates CombatSystem only after <code>change_map()</code> has established CollisionWorld. It sets <code>self.combat = None</code> during that first activation. Later map changes call <code>set_world()</code> when combat exists, so Enemy and knockback movement use the newly loaded solids without rebuilding health, outcomes, or cooldowns. This conditional preserves the established atomic map activation.</p>
<p>Rendering remains model-neutral and media-free. The scene loops through living enemies and camera-transforms their inherited Rects. During an active attack it draws the current hitbox outline. Both use procedural colors. The renderer never applies damage or removes enemies; it merely observes CombatSystem after update. Debug/test invulnerability and deterministic enemy overrides are constructor seams and are false/ordinary by default.</p>
<p>The cumulative proof constructs the ordinary debug-off scene with one adjacent, stationary, one-health test enemy and invulnerability explicitly enabled. It calls the real attack request twice to observe acceptance then cooldown rejection, updates through the active window to create a hit and defeat, advances recovery time, and requests again to prove readiness. Enemy health is not assigned after construction and the outcome is not appended by proof code.</p>
<p><code>combat_receipt()</code> derives enemy id and outcome from CombatSystem.outcomes, counts <code>enemy_hit</code> records in event_history, reads bounded Player health, observes request results, and counts the final roster. The shared router adds s06 while s01–s05 remain exact under one Pygame init/finally boundary.</p>
<div class="field-notes"><div class="fn-head">FIELD NOTES // ONE FRAME, ALL CONSEQUENCES</div><p>Input requests, world movement, combat resolution, camera follow, rendering, and display flip keep one explicit order.</p></div>
'''

[[lessons.concepts]]
id = "event-loop-combat-integration"
purpose = "Add real-time attacks to the canonical event/update/render loop without changing movement actions, duplicating timing, or moving domain mutation into rendering."
anatomy = "Capture Space KEYDOWN; consume once; request scene attack; derive facing from nonzero named actions; move Player; handle map/quest; update CombatSystem with the same dt; follow camera; draw enemies/hitbox; flip."
example = "The complete loop patch shows the attack request immediately before the established scene update/render/flip sequence."
observable = "Space starts one strike, enemies pursue and collide with walls, hits change health/outcomes in update, and procedural rectangles reflect the resulting state."
failure = "A nested combat loop steals events; held Space restarts timing; rendering damage repeats by frame; a second Clock gives combat different elapsed time."
practice = "s06-l05-d1"

[[lessons.concepts]]
id = "cumulative-combat-proof"
purpose = "Defeat a deterministic test enemy through real scene attack, hitbox, health, cooldown, event, and roster behavior while retaining all earlier milestones."
anatomy = "Construct scene with test-only enemy inputs; request attack; observe blocked repeat; update active window; update recovery; request again; derive outcome/hit/health/roster fields; route s06 through shared cleanup."
example = "The Working specifies the exact behavior-derived S06_OK path while leaving combat_receipt implementation to the learner and hidden reference."
observable = "The receipt reports one defeated bog_wisp, one hit, full test health, blocked repeat, recovered cooldown, empty roster; s01–s05 remain exact."
failure = "Assigning health/outcomes, calling private emitters, hard-coding the line, opening a display, or replacing prior routes produces false or regressive evidence."
practice = "s06-l05-e2"

