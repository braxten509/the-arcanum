id = "s06-test-scene-combat-integration"
path = "tests/test_scene.py"
mode = "append"
instruction = "Append a deterministic scene test that defeats an adjacent one-health enemy through attack and update while preserving Player geometry."
content = '''


def test_scene_attack_uses_real_hitbox_health_and_roster():
    scene = MarshScene(
        (960, 540),
        debug=False,
        enemy_positions=[(136, 64)],
        enemy_speed=0.0,
        enemy_health=1,
        invulnerable=True,
    )
    assert scene.attack() is True
    assert scene.attack() is False
    scene.update({}, 0.12)
    assert scene.player.rect().topleft == (96, 64)
    assert scene.combat.outcomes == [
        {"enemy_id": "bog_wisp_1", "outcome": "defeated"}
    ]
    assert scene.combat.enemies == []
'''

