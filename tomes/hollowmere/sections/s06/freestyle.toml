content = '''


def combat_receipt():
    """Return the deterministic section-six combat receipt."""
    scene = MarshScene(
        (960, 540),
        debug=False,
        enemy_positions=[(136, 64)],
        enemy_speed=0.0,
        enemy_health=1,
        invulnerable=True,
    )
    accepted = scene.attack()
    repeated = scene.attack()
    scene.update({}, 0.12)
    scene.update({}, 0.30)
    recovered = scene.attack()
    outcome = scene.combat.outcomes[0]
    hits = 0
    for event in scene.combat.event_history:
        if event["kind"] == "enemy_hit":
            hits += 1
    repeat_state = "blocked" if accepted and not repeated else "invalid"
    cooldown_state = "ready" if recovered else "blocked"
    return (
        f"S06_OK enemy={outcome['enemy_id']}"
        f" outcome={outcome['outcome']} hits={hits}"
        f" player_hp={scene.combat.player_health.current}/"
        f"{scene.combat.player_health.maximum}"
        f" repeat={repeat_state} cooldown={cooldown_state}"
        f" roster={len(scene.combat.enemies)}"
    )
'''

