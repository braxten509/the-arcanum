content = '''
"""Executable milestone for section s06."""

import pygame

from hollowmere.app import run_proof
from hollowmere.combat import AttackPhase
from hollowmere.scene import MarshScene, combat_receipt


EXPECTED = (
    "S06_OK enemy=bog_wisp_1 outcome=defeated hits=1"
    " player_hp=5/5 repeat=blocked cooldown=ready roster=0"
)


def test_combat_receipt_uses_real_attack_and_outcome_behavior():
    assert combat_receipt() == EXPECTED
    scene = MarshScene(
        (960, 540),
        debug=False,
        enemy_positions=[(136, 64)],
        enemy_speed=0.0,
        enemy_health=1,
        invulnerable=True,
    )
    assert scene.attack() is True
    assert scene.attack() is False
    assert scene.combat.attack.phase is AttackPhase.ACTIVE
    scene.update({}, 0.12)
    assert scene.combat.outcomes == [
        {"enemy_id": "bog_wisp_1", "outcome": "defeated"}
    ]
    assert scene.combat.player_health.current == 5
    assert scene.combat.enemies == []
    scene.update({}, 0.30)
    assert scene.attack() is True


def test_section_six_proof_releases_pygame():
    assert not pygame.get_init()
    assert run_proof("s06") == EXPECTED
    assert not pygame.get_init()
'''

