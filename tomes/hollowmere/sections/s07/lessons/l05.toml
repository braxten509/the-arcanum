[[lessons]]
id = "s07-l05"
title = "Open the Satchel in One World"
teaches = ["inventory-menu-command-routing", "cumulative-equip-use-proof"]
body = '''
<p>A menu is presentation plus commands, not a second inventory model. <code>InventoryMenu</code> owns only <code>open</code> and <code>last_action</code>. <code>entries(inventory)</code> reads the stack order. <code>activate(index, ...)</code> checks an open menu and valid zero-based row, resolves the item definition, then delegates equipment to <code>Equipment.equip()</code> or consumption to <code>EffectResolver.use()</code>.</p>
<pre><code data-kind="runnable">entries = [("marsh_tonic", 1), ("reed_charm", 1)]
index = 1
if 0 &lt;= index &lt; len(entries):
    item_id, quantity = entries[index]
    print("ROW", index + 1, item_id, quantity)</code></pre>
<p>The receipt is <code>ROW 2 reed_charm 1</code>. The chained comparison reads as “zero is less than or equal to index, and index is less than the list length.” It prevents negative indices from wrapping to the final row. Tuple unpacking gives the selected id and quantity. A material row raises InventoryError because it is neither usable nor equippable.</p>
<p>InputState captures I as another one-shot command. Number keys already produce the s05 zero-based dialogue choice, so the app does not create competing key fields. It calls <code>scene.choose_number(index)</code>. When the inventory menu is open, Scene delegates to InventoryMenu; otherwise it preserves <code>choose_dialogue(index)</code>. This is state-based routing, not an NPC or item-id branch.</p>
<p>MarshScene composes ItemCatalog, Inventory, Equipment, EffectResolver, PickupSystem, RewardHandoff, InventoryMenu, and InventoryPanel after its existing combat setup. During update it freezes movement intentions while the menu is open, preserves map/quest/combat timing, collects overlapping pickups, synchronizes pending rewards, then follows Camera. Choosing dialogue also synchronizes immediately after a claim.</p>
<p>InventoryPanel uses Pygame's built-in font and loops through current entries and equipment slots. Pickup rectangles use a procedural color in camera space. Rendering never adds, removes, equips, or consumes. Ordinary play can walk over the tonic, press I then 1 to use it, complete the ferryman quest, press I then 1 to equip the resulting charm.</p>
<p>The cumulative proof performs exactly that domain path without a display. It damages bounded Player health by two through HealthPool, collects the real spawn pickup through scene update, uses it through menu activation, completes the quest through dialogue and loaded doorway traversal, receives RewardHandoff delivery, then equips through the menu. Every receipt field comes from resulting events, effects, slots, bonuses, and stacks.</p>
<div class="field-notes"><div class="fn-head">FIELD NOTES // MENUS ISSUE ORDERS</div><p>The panel shows state. The menu chooses a public command. Inventory, Equipment, Effects, QuestLog, and PickupSystem remain the owners that validate change.</p></div>
'''

[[lessons.concepts]]
id = "inventory-menu-command-routing"
purpose = "Route one-shot I and numeric commands between dialogue and an inventory menu while keeping item mutation inside Inventory, Equipment, and EffectResolver."
anatomy = "Capture/consume I; toggle menu state; reuse zero-based number choice; if menu open validate row and dispatch by definition kind; otherwise call existing dialogue choice; render read-only entries/slots."
example = "The complete two-row example validates index one, unpacks reed_charm, and prints the human row number."
observable = "I opens/closes the panel; number keys use or equip its rows; with menu closed the same keys continue dialogue; movement snapshot remains four actions."
failure = "A nested menu loop steals QUIT/events; negative indices wrap; UI mutation bypasses ownership; separate number fields make one key activate two systems."
practice = "s07-l05-d1"

