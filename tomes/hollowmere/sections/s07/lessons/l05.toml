[[lessons.artifactSteps]]
id = "s07-add-inventory-menu-model"
path = "src/hollowmere/inventory.py"
mode = "append"
instruction = "Append menu state and checked command routing that delegates to Equipment or EffectResolver without owning item quantities."
content = '''


PICKUP_COLOR = (111, 196, 169)


class InventoryMenu:
    """Route selected inventory rows to their domain command owners."""

    def __init__(self):
        self.open = False
        self.last_action = None

    def toggle(self):
        self.open = not self.open
        return self.open

    def entries(self, inventory):
        return inventory.entries()

    def activate(self, index, inventory, equipment, effects, health):
        if not self.open:
            raise InventoryError("inventory menu is closed")
        entries = self.entries(inventory)
        if index < 0 or index >= len(entries):
            raise InventoryError(f"inventory row out of range: {index}")
        item_id, _quantity = entries[index]
        definition = inventory.catalog.get(item_id)
        if definition.kind == "equipment":
            slot = equipment.equip(item_id, inventory)
            action = {"kind": "equipped", "item_id": item_id, "slot": slot}
        elif definition.kind == "consumable":
            results = effects.use(item_id, inventory, health)
            action = {"kind": "used", "item_id": item_id, "effects": results}
        else:
            raise InventoryError(f"item is not usable: {item_id}")
        self.last_action = action
        return action
'''

[[lessons.artifactSteps]]
id = "s07-add-inventory-panel"
path = "src/hollowmere/ui.py"
mode = "append"
instruction = "Append a read-only inventory/equipment panel using the built-in font and existing procedural palette; no media is created."
content = '''


class InventoryPanel:
    """Render current stacks and equipment without mutating them."""

    def render(self, screen, menu, inventory, equipment):
        if not menu.open:
            return
        font = pygame.font.Font(None, 24)
        panel = pygame.Rect(80, 56, 360, 340)
        pygame.draw.rect(screen, PANEL_COLOR, panel)
        title = font.render("SATCHEL", True, CHOICE_COLOR)
        screen.blit(title, (panel.x + 16, panel.y + 14))
        for index, (item_id, quantity) in enumerate(
            menu.entries(inventory), start=1
        ):
            definition = inventory.catalog.get(item_id)
            line = font.render(
                f"{index}. {definition.label} x{quantity}",
                True,
                TEXT_COLOR,
            )
            screen.blit(line, (panel.x + 16, panel.y + 20 + index * 28))
        equipment_y = panel.bottom - 72
        for slot_id, item_id in equipment.slots.items():
            value = item_id or "empty"
            line = font.render(
                f"{slot_id}: {value}", True, CHOICE_COLOR
            )
            screen.blit(line, (panel.x + 16, equipment_y))
            equipment_y += 24
'''

