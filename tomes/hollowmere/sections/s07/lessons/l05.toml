id = "s07-add-scene-menu-commands"
path = "src/hollowmere/scene.py"
mode = "replace"
instruction = "Extend the existing dialogue choice port with immediate reward sync, then add menu toggle and state-based number routing."
find = '''
    def choose_dialogue(self, index):
        """Apply one checked choice to the active dialogue graph."""
        return self.interactions.choose(index)

    def _render_ground(self, screen):
'''
content = '''
    def choose_dialogue(self, index):
        """Apply one choice, then deliver any newly claimed reward."""
        node = self.interactions.choose(index)
        self.reward_handoff.sync(self.quest_log, self.inventory)
        return node

    def toggle_inventory(self):
        """Open or close the inventory command menu."""
        return self.inventory_menu.toggle()

    def choose_number(self, index):
        """Route a number key to the active menu or dialogue."""
        if self.inventory_menu.open:
            return self.inventory_menu.activate(
                index,
                self.inventory,
                self.equipment,
                self.effects,
                self.combat.player_health,
            )
        return self.choose_dialogue(index)

    def _render_ground(self, screen):
'''

