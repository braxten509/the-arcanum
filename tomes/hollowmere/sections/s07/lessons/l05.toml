[[lessons.artifactSteps]]
id = "s07-test-menu-and-scene-flow"
path = "tests/test_inventory.py"
mode = "append"
instruction = "Append tests for menu bounds, consumable routing, equipment routing, and closed-menu rejection through public owners."
content = '''


def test_inventory_menu_routes_use_and_equip_commands():
    from hollowmere.combat import HealthPool
    from hollowmere.inventory import EffectResolver, Equipment, InventoryMenu

    inventory = Inventory()
    equipment = Equipment()
    effects = EffectResolver()
    health = HealthPool(5)
    health.damage(2)
    menu = InventoryMenu()
    inventory.add("marsh_tonic")
    menu.toggle()
    assert menu.activate(0, inventory, equipment, effects, health)["kind"] == "used"
    inventory.add("reed_charm")
    assert menu.activate(0, inventory, equipment, effects, health) == {
        "kind": "equipped",
        "item_id": "reed_charm",
        "slot": "charm",
    }
    assert equipment.slots["charm"] == "reed_charm"


def test_closed_or_invalid_menu_row_is_specific():
    from hollowmere.combat import HealthPool
    from hollowmere.inventory import EffectResolver, Equipment, InventoryMenu

    inventory = Inventory()
    menu = InventoryMenu()
    with pytest.raises(InventoryError, match="closed"):
        menu.activate(0, inventory, Equipment(), EffectResolver(), HealthPool(5))
    menu.toggle()
    with pytest.raises(InventoryError, match="out of range"):
        menu.activate(-1, inventory, Equipment(), EffectResolver(), HealthPool(5))
'''

