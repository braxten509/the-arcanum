type = "write"
points = 38
prompt = "Given rows tonic/consumable then charm/equipment and selected index 1, route by kind into action equipped, then print exactly <code>ROW 2 ITEM charm ACTION equipped</code>."
starter = '''
rows = [("tonic", "consumable"), ("charm", "equipment")]
index = 1
'''
expect = '''
ROW 2 ITEM charm ACTION equipped
'''
solution = '''
rows = [("tonic", "consumable"), ("charm", "equipment")]
index = 1
item_id, kind = rows[index]
if kind == "equipment":
    action = "equipped"
elif kind == "consumable":
    action = "used"
else:
    action = "blocked"
print("ROW", index + 1, "ITEM", item_id, "ACTION", action)
'''
