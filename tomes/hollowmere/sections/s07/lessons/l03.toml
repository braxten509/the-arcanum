[[lessons]]
id = "s07-l03"
title = "Bind Charms to Named Places"
teaches = ["typed-equipment-slots", "registry-driven-item-effects"]
body = '''
<p>Inventory answers “how many are carried.” Equipment answers “which one occupies each named role.” <code>Equipment</code> starts with <code>{"weapon": None, "charm": None}</code>. An empty slot uses Python's <code>None</code> sentinel; an occupied slot stores one stable item id. The item definition, not a menu button, declares which slot it fits.</p>
<pre><code data-kind="runnable">slots = {"weapon": None, "charm": None}
item = {"item_id": "reed_charm", "slot": "charm"}
if slots[item["slot"]] is None:
    slots[item["slot"]] = item["item_id"]
print("CHARM", slots["charm"])</code></pre>
<p>The receipt is <code>CHARM reed_charm</code>. <code>equip()</code> resolves the definition, requires kind equipment, verifies the slot exists and is empty, then removes one item from Inventory before assigning the slot. Rejected operations mutate neither owner. Swapping is deliberately two explicit commands: <code>unequip()</code> then <code>equip()</code>. This keeps a full inventory from losing the previous item during a complicated implicit exchange.</p>
<p><code>unequip(slot, inventory)</code> validates the slot and occupied id, asks <code>inventory.can_add()</code> before changing anything, adds the item, then clears the slot. <code>effect_total(effect_id)</code> loops over occupied ids, retrieves each definition, and adds matching numeric values. The equipped reed charm therefore reports <code>max_health</code> bonus one without directly changing CombatSystem's base HealthPool.</p>
<p>Consumables use a different boundary. <code>EffectResolver.handlers</code> maps stable effect ids to methods. For <code>heal</code>, the handler calls the public <code>HealthPool.heal(value)</code> and returns the actual amount restored. <code>use(item_id, inventory, target)</code> requires a consumable definition, verifies every declared effect id exists before removal, removes one item, applies handlers, and returns records such as <code>{"effect_id": "heal", "requested": 2, "applied": 2}</code>.</p>
<p>Preflight matters. If content names <code>teleport_to_moon</code>, EffectResolver raises InventoryError before consuming the item. A known but full-health target may apply zero healing; that is a successful use with an honest applied value, not an error. Equipment effects remain queried totals while consumable effects are commands. Mixing both into one automatic mutation would repeatedly heal every frame while a tonic sat in a slot.</p>
<p>s10 can grow the item data and effect registry independently. s11's novel reward needs only a valid definition, supported slot or consumable effect, and the same inventory transfer ports.</p>
<div class="field-notes"><div class="fn-head">FIELD NOTES // A SLOT IS OWNERSHIP</div><p>An item is either in a stack or in one equipment slot. Effects read or execute only after that transfer succeeds.</p></div>
'''

