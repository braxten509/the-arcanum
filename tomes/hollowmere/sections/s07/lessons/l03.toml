[[lessons.artifactSteps]]
id = "s07-add-equipment-and-effects"
path = "src/hollowmere/inventory.py"
mode = "append"
instruction = "Append typed equipment ownership, effect totals, and a preflighted consumable effect resolver using the existing HealthPool public method."
content = '''


class Equipment:
    """Own one stable item id in each named equipment slot."""

    SLOT_IDS = ("weapon", "charm")

    def __init__(self):
        self.slots = {slot_id: None for slot_id in self.SLOT_IDS}

    def equip(self, item_id, inventory):
        definition = inventory.catalog.get(item_id)
        if definition.kind != "equipment":
            raise InventoryError(f"item is not equipment: {item_id}")
        if definition.slot not in self.slots:
            raise InventoryError(f"unknown equipment slot: {definition.slot}")
        if self.slots[definition.slot] is not None:
            raise InventoryError(f"equipment slot is occupied: {definition.slot}")
        inventory.remove(item_id, 1)
        self.slots[definition.slot] = item_id
        return definition.slot

    def unequip(self, slot_id, inventory):
        if slot_id not in self.slots:
            raise InventoryError(f"unknown equipment slot: {slot_id}")
        item_id = self.slots[slot_id]
        if item_id is None:
            raise InventoryError(f"equipment slot is empty: {slot_id}")
        if not inventory.can_add(item_id, 1):
            raise InventoryError(f"cannot unequip into full inventory: {item_id}")
        inventory.add(item_id, 1)
        self.slots[slot_id] = None
        return item_id

    def effect_total(self, effect_id, catalog):
        total = 0
        for item_id in self.slots.values():
            if item_id is None:
                continue
            total += catalog.get(item_id).effects.get(effect_id, 0)
        return total


class EffectResolver:
    """Apply known consumable effects through stable effect ids."""

    def __init__(self):
        self.handlers = {"heal": self._heal}
        self.last_results = []

    def _heal(self, target, value):
        return target.heal(value)

    def use(self, item_id, inventory, target):
        definition = inventory.catalog.get(item_id)
        if definition.kind != "consumable":
            raise InventoryError(f"item is not consumable: {item_id}")
        for effect_id in definition.effects:
            if effect_id not in self.handlers:
                raise InventoryError(f"unknown item effect: {effect_id}")
        inventory.remove(item_id, 1)
        results = []
        for effect_id, value in definition.effects.items():
            applied = self.handlers[effect_id](target, value)
            results.append(
                {
                    "effect_id": effect_id,
                    "requested": value,
                    "applied": applied,
                }
            )
        self.last_results = results
        return results
'''

[[lessons.artifactSteps]]
id = "s07-test-equipment-and-effects"
path = "tests/test_inventory.py"
mode = "append"
instruction = "Append tests for equipment ownership, occupied-slot rejection, unequip restoration, effect totals, tonic healing, and unsupported-effect preflight."
content = '''


def test_equipment_moves_ownership_and_reports_bonus():
    from hollowmere.inventory import Equipment

    inventory = Inventory()
    equipment = Equipment()
    inventory.add("reed_charm")
    assert equipment.equip("reed_charm", inventory) == "charm"
    assert inventory.count("reed_charm") == 0
    assert equipment.slots["charm"] == "reed_charm"
    assert equipment.effect_total("max_health", inventory.catalog) == 1
    assert equipment.unequip("charm", inventory) == "reed_charm"
    assert inventory.count("reed_charm") == 1


def test_consumable_effect_uses_bounded_health_and_removes_one():
    from hollowmere.combat import HealthPool
    from hollowmere.inventory import EffectResolver

    inventory = Inventory()
    inventory.add("marsh_tonic", 2)
    health = HealthPool(5)
    health.damage(3)
    result = EffectResolver().use("marsh_tonic", inventory, health)
    assert result == [{"effect_id": "heal", "requested": 2, "applied": 2}]
    assert health.current == 4
    assert inventory.count("marsh_tonic") == 1


def test_non_equipment_cannot_enter_a_slot():
    from hollowmere.inventory import Equipment

    inventory = Inventory()
    inventory.add("bog_shard")
    with pytest.raises(InventoryError, match="not equipment"):
        Equipment().equip("bog_shard", inventory)
    assert inventory.count("bog_shard") == 1
'''

