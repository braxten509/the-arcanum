[[lessons.exercises]]
id = "s07-l03-w1"
type = "write"
points = 38
prompt = "Move reed_charm from a one-count inventory dictionary into an empty charm slot, sum its max_health bonus 1, and print exactly <code>EQUIPPED reed_charm BONUS 1 CARRIED 0</code>."
expect = '''
EQUIPPED reed_charm BONUS 1 CARRIED 0
'''
solution = '''
inventory = {"reed_charm": 1}
slots = {"charm": None}
effects = {"reed_charm": {"max_health": 1}}
inventory["reed_charm"] -= 1
slots["charm"] = "reed_charm"
bonus = effects[slots["charm"]]["max_health"]
print("EQUIPPED", slots["charm"], "BONUS", bonus, "CARRIED", inventory["reed_charm"])
'''
hint = "Decrease the carried count, assign the stable id to the slot, then look up its effect."
