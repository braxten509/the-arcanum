[[lessons.exercises]]
id = "s07-l02-w1"
type = "write"
points = 38
prompt = "Start with an empty stacks dictionary. Add shard quantities 3 and 4 under one id, remove 2, and print exactly <code>SHARD 5 STACKS 1</code>."
starter = '''
stacks = {}
'''
expect = '''
SHARD 5 STACKS 1
'''
solution = '''
stacks = {}
stacks["shard"] = stacks.get("shard", 0) + 3
stacks["shard"] = stacks.get("shard", 0) + 4
stacks["shard"] -= 2
print("SHARD", stacks["shard"], "STACKS", len(stacks))
'''
hint = "Use dictionary get with zero for each addition, then subtract from the existing key."
