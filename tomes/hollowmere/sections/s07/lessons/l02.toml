type = "mc"
points = 15
prompt = "What should happen when adding two shards to a stack already holding eight of a maximum nine?"
choices = ["Add one and discard one", "Create a negative stack", "Reject the whole addition and keep eight", "Delete the stack"]
answer = 2
whyWrong = "Partial, negative, and deletion outcomes violate the all-or-nothing transfer and bounded positive-stack contracts."
hint = "Apply atomic mutation: either the requested quantity fits completely or nothing changes."
explain = "Preflight sees total ten exceeds nine, so add raises before assignment."

