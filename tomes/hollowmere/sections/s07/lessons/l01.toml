[[lessons.artifactSteps]]
id = "s07-create-item-catalog"
path = "src/hollowmere/items.py"
mode = "write"
instruction = "Create items.py with stable prototype definitions, complete catalog validation, and specific unknown-id diagnostics."
content = '''
"""Stable item definitions and defensive catalog lookup."""


class ItemError(RuntimeError):
    """Reject unknown ids or malformed item definitions."""


class ItemDefinition:
    """Describe one item independently from owned quantity."""

    def __init__(
        self,
        item_id,
        label,
        kind,
        max_stack,
        slot=None,
        effects=None,
    ):
        self.item_id = item_id
        self.label = label
        self.kind = kind
        self.max_stack = max_stack
        self.slot = slot
        self.effects = dict(effects or {})


ITEMS = {
    "bog_shard": ItemDefinition(
        "bog_shard", "Bog Shard", "material", 9
    ),
    "marsh_tonic": ItemDefinition(
        "marsh_tonic", "Marsh Tonic", "consumable", 3,
        effects={"heal": 2},
    ),
    "reed_charm": ItemDefinition(
        "reed_charm", "Reed Charm", "equipment", 1,
        slot="charm", effects={"max_health": 1},
    ),
}


class ItemCatalog:
    """Validate and resolve stable item ids."""

    def __init__(self, definitions=None):
        self.definitions = dict(definitions or ITEMS)
        for item_id, definition in self.definitions.items():
            self._validate(item_id, definition)

    def _validate(self, item_id, definition):
        if item_id != definition.item_id:
            raise ItemError(f"item key/id mismatch: {item_id}")
        if definition.kind not in {"material", "consumable", "equipment"}:
            raise ItemError(f"invalid item kind for {item_id}: {definition.kind}")
        if definition.max_stack <= 0:
            raise ItemError(f"max_stack must be positive for {item_id}")
        if definition.kind == "equipment":
            if not definition.slot or definition.max_stack != 1:
                raise ItemError(
                    f"equipment {item_id} needs one slot and max_stack 1"
                )
        elif definition.slot is not None:
            raise ItemError(f"non-equipment item has slot: {item_id}")

    def get(self, item_id):
        definition = self.definitions.get(item_id)
        if definition is None:
            raise ItemError(f"unknown item id: {item_id}")
        return definition
'''

