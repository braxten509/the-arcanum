id = "s07-l01-w1"
type = "write"
points = 36
prompt = "Create definitions for shard/material/9 and charm/equipment/1, validate both positive limits, then print exactly <code>ITEMS 2 CHARM equipment STACK 1</code>."
expect = '''
ITEMS 2 CHARM equipment STACK 1
'''
solution = '''
definitions = {
    "shard": {"kind": "material", "max_stack": 9},
    "charm": {"kind": "equipment", "max_stack": 1},
}
for definition in definitions.values():
    if definition["max_stack"] <= 0:
        raise ValueError("invalid stack")
print("ITEMS", len(definitions), "CHARM", definitions["charm"]["kind"], "STACK", definitions["charm"]["max_stack"])
'''
hint = "Store two keyed dictionaries, validate their max_stack values in a loop, and read the charm record for output."
