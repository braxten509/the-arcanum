[[lessons.artifactSteps]]
id = "s07-test-item-catalog"
path = "tests/test_items.py"
mode = "write"
instruction = "Create tests for every canonical definition, stable ids, defensive unknown lookup, and malformed equipment rejection."
content = '''
"""Tests for stable item definitions and lookup errors."""

import pytest

from hollowmere.items import ItemCatalog, ItemDefinition, ItemError


def test_default_catalog_exposes_stable_item_contracts():
    catalog = ItemCatalog()
    assert catalog.get("bog_shard").max_stack == 9
    assert catalog.get("marsh_tonic").effects == {"heal": 2}
    charm = catalog.get("reed_charm")
    assert charm.kind == "equipment"
    assert charm.slot == "charm"
    assert charm.effects == {"max_health": 1}


def test_unknown_item_id_is_specific():
    with pytest.raises(ItemError, match="unknown item id: drowned_crown"):
        ItemCatalog().get("drowned_crown")


def test_malformed_equipment_fails_before_use():
    broken = ItemDefinition(
        "broken_charm", "Broken Charm", "equipment", 4
    )
    with pytest.raises(ItemError, match="needs one slot"):
        ItemCatalog({"broken_charm": broken})
'''

