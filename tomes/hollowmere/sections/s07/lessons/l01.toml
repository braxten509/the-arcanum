[[lessons]]
id = "s07-l01"
title = "Name Every Useful Thing"
teaches = ["stable-item-definition-registry", "unknown-item-error-boundary"]
body = '''
<p>An item id is a contract, not display text. <code>reed_charm</code> can survive a renamed label, menu layout, save file, quest reward, or content migration. <code>ItemDefinition</code> stores that id plus label, kind, maximum stack, optional equipment slot, and effect dictionary. Mutable ownership such as “the Player has three” belongs elsewhere.</p>
<pre><code data-kind="runnable">items = {
    "reed_charm": {"kind": "equipment", "slot": "charm"},
    "marsh_tonic": {"kind": "consumable", "slot": None},
}
definition = items.get("reed_charm")
print("ITEM", definition["kind"], definition["slot"])</code></pre>
<p>The receipt is <code>ITEM equipment charm</code>. <code>dict.get(key)</code> returns the record or <code>None</code>; the explicit absence lets Hollowmere raise its own <code>ItemError</code>. Direct indexing would raise KeyError before the catalog could report <code>unknown item id: ...</code>. Silently inventing a placeholder would let corrupt quests and saves continue with false data.</p>
<p><code>ItemCatalog</code> copies a definitions dictionary, then validates each key and record. The dictionary key must equal <code>definition.item_id</code>. <code>kind</code> must be one of <code>material</code>, <code>consumable</code>, or <code>equipment</code>. Maximum stack must be positive. Equipment requires a slot and may stack only to one; other kinds must not claim a slot. Effects map stable effect ids to numeric values.</p>
<p>The prototype registry contains three deliberately plain records. <code>bog_shard</code> is a material stackable to nine. <code>marsh_tonic</code> is a consumable stackable to three and declares <code>heal: 2</code>. <code>reed_charm</code> is equipment for the charm slot and declares <code>max_health: 1</code>. No function is stored in content. The later EffectResolver decides what those ids mean.</p>
<p>Validation is defensive even while content still lives in Python. s10 will move records into <code>data/items.json</code> behind the same <code>catalog.get(item_id)</code> boundary. The isolated malformed JSON fixture under <code>tests/fixtures</code> demonstrates the future error shape but never becomes selectable game content. A missing asset is irrelevant here: deterministic items render as text and procedural rectangles, so no media path is introduced.</p>
<div class="field-notes"><div class="fn-head">FIELD NOTES // IDS CARRY MEANING</div><p>Labels speak to people. Stable lowercase ids connect quests, pickups, stacks, slots, effects, saves, and tests.</p></div>
'''

