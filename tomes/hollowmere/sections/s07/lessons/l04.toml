[[lessons]]
id = "s07-l04"
title = "Lift Rewards from Ground and Promise"
teaches = ["world-pickup-collection", "quest-reward-inventory-handoff"]
body = '''
<p>A pickup is an offer of ownership at a world position. <code>Pickup</code> stores item id, quantity, floating Vector2 position, and an integer Rect boundary. It does not alter Inventory itself. <code>PickupSystem.collect(player_rect, inventory)</code> decides which offers overlap and can transfer fully.</p>
<pre><code data-kind="runnable">pickups = [
    {"item_id": "tonic", "overlaps": True},
    {"item_id": "shard", "overlaps": False},
]
collected = []
remaining = []
for pickup in pickups:
    if pickup["overlaps"]:
        collected.append(pickup["item_id"])
    else:
        remaining.append(pickup)
print("COLLECTED", collected[0], "REMAINING", len(remaining))</code></pre>
<p>The receipt is <code>COLLECTED tonic REMAINING 1</code>. The real system uses <code>player_rect.colliderect(pickup.rect())</code> in world coordinates and <code>inventory.can_add()</code>. Only then does it call <code>add()</code>, emit a stable pickup record, and omit the pickup from survivors. A full inventory leaves the object in the world. Partial collection never occurs.</p>
<p><code>drop()</code> reverses that transfer. It validates the item through Inventory, removes the complete requested quantity, and appends a new Pickup at Player's world position. The method has no test-only seed shortcut. Tests prepare stacks through public <code>add()</code>, collect through overlap, and drop through removal; the final project therefore contains no privileged inventory mutation to retire.</p>
<p>Quest rewards begin in a different owner. QuestLog's <code>earned_rewards</code> is an ordered list of stable item ids. <code>RewardHandoff</code> owns a <code>next_index</code> cursor. <code>sync()</code> reads each not-yet-delivered entry, sends it through <code>inventory.add()</code>, emits a reward record, then advances the cursor. Calling sync again does nothing until QuestLog appends another reward.</p>
<p>A cursor is better than a set because two quests may legitimately award the same item id. Each list occurrence transfers once. If inventory rejects a reward, the exception occurs before <code>next_index</code> changes, so a later sync can retry after space is made. Dialogue does not append directly to Inventory: <code>MarshScene.choose_dialogue()</code> lets DialogueSession claim through QuestLog, then asks RewardHandoff to synchronize.</p>
<p>The default prototype pickup is one marsh_tonic at <code>marsh_entry</code>. It is procedural and data-shaped, not media. s10 can load many pickup records from content without changing collect/drop. The ferryman's reed_charm enters through the same catalog and stack boundary, then becomes equipment through the menu in the next lesson.</p>
<div class="field-notes"><div class="fn-head">FIELD NOTES // TRANSFER, DO NOT COPY</div><p>World, quest, inventory, and equipment are distinct owners. A successful boundary removes from one or advances its cursor as it adds to the next.</p></div>
'''

