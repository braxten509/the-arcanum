[[lessons.exercises]]
id = "s07-l04-w1"
type = "write"
points = 38
prompt = "Process ordered rewards charm, shard, charm with a cursor, append every occurrence to delivered, advance after each append, and print exactly <code>REWARDS charm,shard,charm CURSOR 3</code>."
starter = '''
rewards = ["charm", "shard", "charm"]
cursor = 0
delivered = []
'''
expect = '''
REWARDS charm,shard,charm CURSOR 3
'''
solution = '''
rewards = ["charm", "shard", "charm"]
cursor = 0
delivered = []
while cursor < len(rewards):
    delivered.append(rewards[cursor])
    cursor += 1
print("REWARDS", ",".join(delivered), "CURSOR", cursor)
'''
hint = "Read rewards[cursor], append it, then increase the cursor inside the while loop."
