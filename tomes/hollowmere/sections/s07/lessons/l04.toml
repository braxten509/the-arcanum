[[lessons.artifactSteps]]
id = "s07-add-pickups-and-reward-handoff"
path = "src/hollowmere/inventory.py"
mode = "append"
instruction = "Append world Pickup/PickupSystem transfer and an ordered RewardHandoff cursor with no seeding shortcut."
content = '''


class Pickup:
    """Offer one item quantity at a world position."""

    def __init__(self, item_id, position, quantity=1):
        self.item_id = item_id
        self.position = pygame.Vector2(position)
        self.quantity = quantity

    def rect(self):
        return pygame.Rect(
            round(self.position.x), round(self.position.y), 18, 18
        )


class PickupSystem:
    """Transfer ownership between world pickups and Inventory."""

    def __init__(self, pickups=None):
        if pickups is None:
            pickups = [Pickup("marsh_tonic", (96, 64))]
        self.pickups = list(pickups)
        self.events = []

    def collect(self, player_rect, inventory):
        self.events = []
        survivors = []
        for pickup in self.pickups:
            if (
                player_rect.colliderect(pickup.rect())
                and inventory.can_add(pickup.item_id, pickup.quantity)
            ):
                inventory.add(pickup.item_id, pickup.quantity)
                self.events.append(
                    {
                        "kind": "item_picked_up",
                        "item_id": pickup.item_id,
                        "quantity": pickup.quantity,
                    }
                )
            else:
                survivors.append(pickup)
        self.pickups = survivors
        return list(self.events)

    def drop(self, item_id, quantity, position, inventory):
        inventory.remove(item_id, quantity)
        pickup = Pickup(item_id, position, quantity)
        self.pickups.append(pickup)
        return pickup


class RewardHandoff:
    """Deliver ordered QuestLog reward occurrences exactly once."""

    def __init__(self):
        self.next_index = 0
        self.last_deliveries = []

    def sync(self, quest_log, inventory):
        deliveries = []
        while self.next_index < len(quest_log.earned_rewards):
            item_id = quest_log.earned_rewards[self.next_index]
            inventory.add(item_id, 1)
            deliveries.append(
                {"kind": "quest_reward_added", "item_id": item_id}
            )
            self.next_index += 1
        self.last_deliveries = deliveries
        return deliveries
'''

[[lessons.artifactSteps]]
id = "s07-test-pickups-and-rewards"
path = "tests/test_pickups.py"
mode = "write"
instruction = "Create tests for overlap collection, full-inventory survival, public drop transfer, ordered quest reward delivery, and idempotent resync."
content = '''
"""Tests for world pickups and quest reward handoff."""

import pygame

from hollowmere.inventory import Inventory, Pickup, PickupSystem, RewardHandoff
from hollowmere.quests import QuestLog


def test_pickup_collects_by_world_overlap_and_drop_reverses_it():
    inventory = Inventory()
    pickups = PickupSystem([Pickup("bog_shard", (96, 64), 2)])
    events = pickups.collect(pygame.Rect(96, 64, 32, 32), inventory)
    assert events == [
        {"kind": "item_picked_up", "item_id": "bog_shard", "quantity": 2}
    ]
    assert inventory.count("bog_shard") == 2
    assert pickups.pickups == []
    dropped = pickups.drop("bog_shard", 1, (120, 64), inventory)
    assert dropped.item_id == "bog_shard"
    assert inventory.count("bog_shard") == 1


def test_full_inventory_leaves_pickup_in_world():
    inventory = Inventory(capacity=1)
    inventory.add("bog_shard")
    pickups = PickupSystem([Pickup("marsh_tonic", (96, 64))])
    assert pickups.collect(pygame.Rect(96, 64, 32, 32), inventory) == []
    assert len(pickups.pickups) == 1


def test_quest_reward_handoff_delivers_each_occurrence_once():
    log = QuestLog()
    log.start("ferryman_oath")
    log.record("crossed_causeway")
    assert log.claim("ferryman_oath") == "reed_charm"
    inventory = Inventory()
    handoff = RewardHandoff()
    assert handoff.sync(log, inventory) == [
        {"kind": "quest_reward_added", "item_id": "reed_charm"}
    ]
    assert handoff.sync(log, inventory) == []
    assert inventory.count("reed_charm") == 1
'''

