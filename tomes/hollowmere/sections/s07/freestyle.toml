content = '''
"""Executable milestone for section s07."""

import pygame

from hollowmere.app import run_proof
from hollowmere.scene import MarshScene, inventory_receipt


EXPECTED = (
    "S07_OK pickup=marsh_tonic used=heal:2 reward=reed_charm"
    " equipped=charm bonus=max_health:1 stacks=0"
)


def test_inventory_receipt_uses_real_ownership_transfers():
    assert inventory_receipt() == EXPECTED
    scene = MarshScene(
        (960, 540),
        debug=False,
        enemy_positions=[(500, 500)],
        enemy_speed=0.0,
        invulnerable=True,
    )
    scene.combat.player_health.damage(2)
    scene.update({}, 0.0)
    assert scene.inventory.count("marsh_tonic") == 1
    scene.toggle_inventory()
    assert scene.choose_number(0)["kind"] == "used"
    assert scene.combat.player_health.current == 5
    scene.toggle_inventory()
    scene.interact()
    scene.choose_dialogue(0)
    doorway = scene.loaded_map.transitions[0]
    scene.player.position.update(doorway["rect"].topleft)
    scene.update({}, 0.0)
    scene.interact()
    scene.choose_dialogue(0)
    assert scene.inventory.count("reed_charm") == 1
    scene.toggle_inventory()
    assert scene.choose_number(0)["slot"] == "charm"
    assert scene.equipment.slots["charm"] == "reed_charm"
    assert scene.inventory.stacks == {}


def test_section_seven_proof_releases_pygame():
    assert not pygame.get_init()
    assert run_proof("s07") == EXPECTED
    assert not pygame.get_init()
'''

