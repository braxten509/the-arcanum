content = '''


def inventory_receipt():
    """Return the deterministic section-seven inventory receipt."""
    scene = MarshScene(
        (960, 540),
        debug=False,
        enemy_positions=[(500, 500)],
        enemy_speed=0.0,
        invulnerable=True,
    )
    scene.combat.player_health.damage(2)
    scene.update({}, 0.0)
    pickup_event = scene.pickups.events[0]
    scene.toggle_inventory()
    use_action = scene.choose_number(0)
    scene.toggle_inventory()

    scene.interact()
    scene.choose_dialogue(0)
    doorway = scene.loaded_map.transitions[0]
    scene.player.position.update(doorway["rect"].topleft)
    scene.update({}, 0.0)
    scene.interact()
    scene.choose_dialogue(0)
    reward_event = scene.reward_handoff.last_deliveries[0]

    scene.toggle_inventory()
    equip_action = scene.choose_number(0)
    effect = use_action["effects"][0]
    bonus = scene.equipment.effect_total(
        "max_health", scene.item_catalog
    )
    return (
        f"S07_OK pickup={pickup_event['item_id']}"
        f" used={effect['effect_id']}:{effect['applied']}"
        f" reward={reward_event['item_id']}"
        f" equipped={equip_action['slot']}"
        f" bonus=max_health:{bonus}"
        f" stacks={len(scene.inventory.stacks)}"
    )
'''

