content = '''
from .config import (
    BACKGROUND_COLOR,
    PROJECT_NAME,
    TARGET_FPS,
    WINDOW_HEIGHT,
    WINDOW_WIDTH,
)
from .diagnostics import startup_receipt


def run_proof(section):
    """Exercise startup without opening a display."""
    if section != "s01":
        raise ValueError(f"unsupported proof section: {section}")

    pygame.init()
    try:
        return startup_receipt()
    finally:
        pygame.quit()


def run_game():
'''

