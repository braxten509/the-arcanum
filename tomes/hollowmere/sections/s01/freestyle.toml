content = '''
"""Executable milestone for section s01."""

import pygame

from hollowmere.app import run_proof
from hollowmere.diagnostics import startup_receipt


EXPECTED = (
    "S01_OK project=Hollowmere"
    " window=960x540 fps=60 pygame=ready"
)


def test_startup_receipt_uses_canonical_configuration():
    assert startup_receipt() == EXPECTED


def test_proof_releases_pygame():
    assert not pygame.get_init()
    assert run_proof("s01") == EXPECTED
    assert not pygame.get_init()
'''

