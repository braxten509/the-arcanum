content = '''
"""Command-line entrypoint for Hollowmere."""

import sys

from .app import run_game, run_proof


def main():
    """Choose deterministic proof or the ordinary game launch."""
    if (
        len(sys.argv) == 3
        and sys.argv[1] == "--arcanum-proof"
    ):
        print(run_proof(sys.argv[2]))
        return

    run_game()


if __name__ == "__main__":
    main()
'''

