title = "THE WORKING: A Lantern That Proves Itself"
brief = '''Mara wants one startup boundary that serves both the human window and the mechanical trail check. Complete the diagnostic proof without weakening the ordinary launch.<ul><li>Add <code>startup_receipt()</code> to <code>src/hollowmere/diagnostics.py</code>; it must derive and return exactly <code>S01_OK project=Hollowmere window=960x540 fps=60 pygame=ready</code> from the canonical configuration names.</li><li>Add <code>run_proof(section)</code> to <code>src/hollowmere/app.py</code>. It must accept only <code>s01</code>, raise a specific <code>ValueError</code> otherwise, initialize real Pygame, return the receipt without opening a display, and call <code>pygame.quit()</code> from <code>finally</code>.</li><li>Update the canonical package entrypoint so exactly <code>--arcanum-proof s01</code> prints the receipt and exits; a normal no-argument launch must still open the responsive diagnostic window.</li><li>Create <code>tests/milestones/test_s01.py</code> to assert the exact receipt and prove Pygame is not left initialized after proof mode.</li><li>From the project root, make <code>python -m pytest -q</code> pass and make <code>python main.py --arcanum-proof s01</code> print only the required receipt.</li></ul>'''
requires = ["external-python-workspace", "isolated-dependency-install", "python-first-run", "tool-install", "tool-create-open", "tool-navigate", "tool-edit-save", "python-values-and-output", "boolean-branch-choice", "function-module-boundary", "bounded-loop-control", "pygame-display-lifecycle", "event-loop-clean-shutdown", "traceback-guided-recovery", "deterministic-section-proof", "tool-run-test", "tool-diagnose"]
reward = 240
xray = "Mara docks heavily for a literal receipt disconnected from config, opening a display in proof mode, broad exception swallowing, unsafe sys.argv indexing, or cleanup outside finally. She rewards a narrow proof branch, exact output, retained ordinary launch, focused pytest assertions, snake_case names, grouped imports, and four-space layout."

