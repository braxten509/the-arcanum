[[lessons]]
id = "s01-l01"
title = "The Window in the Reeds"
teaches = ["external-python-workspace", "isolated-dependency-install", "python-first-run", "tool-install", "tool-create-open", "tool-navigate", "tool-edit-save"]
body = '''
<p><strong>A game project begins outside the game.</strong> Your external workspace is the folder named <code>Hollowmere</code> opened in your editor, and the project root is the level that contains <code>pyproject.toml</code>. A terminal is a text interface for asking the operating system to run a program. Open one in that root, type <code>python --version</code> (or <code>py --version</code> on Windows), and press Enter. The command has three parts: the program name, an optional argument, and Enter to launch it. A successful check prints a Python 3.12-or-newer version. “Command not found” means the terminal cannot locate Python; repair the installation or PATH before continuing instead of changing game code.</p>
<pre><code data-kind="terminal">python --version
python -m venv .venv
# Linux/macOS
source .venv/bin/activate
# Windows PowerShell
.venv\Scripts\Activate.ps1
python -m pip install -r requirements.txt
python -m pip install -e .</code></pre>
<p>A <strong>virtual environment</strong> is a project-local Python installation. In <code>python -m venv .venv</code>, <code>-m</code> asks Python to run its built-in <code>venv</code> module, and <code>.venv</code> is the folder it creates. Activation changes which Python the terminal finds; it does not edit your source. Verify it with <code>python -c "import sys; print(sys.executable)"</code>. The printed path should pass through <code>.venv</code>. If it does not, stop and activate the environment in the current terminal.</p>
<p><code>requirements.txt</code> names installable distributions. <code>pyproject.toml</code> describes Hollowmere itself and tells Python that importable code lives under <code>src</code>. TOML uses <code>key = value</code>, quoted text, and bracketed table headings. Save every file before running a command; an editor dot on the tab usually means the disk still holds the older version. Install dependencies with <code>python -m pip install -r requirements.txt</code>, then run <code>python -m pip install -e .</code>. The <code>-e</code> editable option links the active environment to this project root, and the final dot means “the current folder.” After source edits, <code>python -m hollowmere</code> sees them without reinstalling. Running the editable command outside the root fails because Python cannot find <code>pyproject.toml</code>.</p>
<p>Recovery is ordered: read the final traceback line, confirm the terminal is at the project root, confirm the environment path, confirm the filename's spelling and capitalization, then rerun the smallest failing command. Deleting and recreating <code>.venv</code> is safe because dependencies live in the requirement files; deleting source is not.</p>
<p>The smallest source check is <code>print("ENV Hollowmere READY")</code>. <code>print</code> names Python's output function, the parentheses contain its input, and matching quotes mark the string of text. Save that line in a <code>.py</code> file and run it with Python; the terminal should show <code>ENV Hollowmere READY</code>. A missing closing quote produces <code>SyntaxError</code>, meaning Python could not read the source grammar. Retype the complete call before building it independently.</p>
<div class="field-notes"><div class="fn-head">FIELD NOTES // THE ROOT MARK</div>
<p>The <code>src</code> layout prevents an accidental import from the current folder from masquerading as an installed package. The course's replay harness creates the same paths, so “works only from my editor” is treated as a real defect.</p></div>
'''

[[lessons.concepts]]
id = "external-python-workspace"
purpose = "Create, open, navigate, edit, save, and run the real Hollowmere project in an external editor and terminal."
anatomy = "Open the Hollowmere folder; identify the project root; open a terminal there; check the interpreter; edit and save a named file; run the smallest command; read its exit output."
example = "The terminal sequence in The Window in the Reeds checks Python, creates .venv, activates it, and verifies the interpreter path."
observable = "The version is Python 3.12 or newer and sys.executable prints a path inside Hollowmere/.venv."
failure = "A command-not-found message or an interpreter path outside .venv means the toolchain is not the project-local one."
practice = "s01-l01-d1"

[[lessons.concepts]]
id = "isolated-dependency-install"
purpose = "Install Pygame and the other declared tools without changing the system Python or another project."
anatomy = "Create .venv; activate it in the current terminal; keep dependency names in requirements.txt and project metadata in pyproject.toml; invoke pip as python -m pip."
example = "The worked terminal sequence installs every line of requirements.txt through the already verified Python executable."
observable = "python -m pip reports the requirements installed and later imports resolve from the active .venv."
failure = "An externally-managed-environment error or a package installed outside .venv shows that activation or interpreter selection was skipped."
practice = "s01-l01-e3"

[[lessons.concepts]]
id = "python-first-run"
purpose = "Prove that the selected interpreter can read a saved Python file and produce exact terminal output."
anatomy = "Write print; open parentheses; place one quoted string inside; close the parentheses; save the .py file; run it with the verified Python."
example = 'The complete print("ENV Hollowmere READY") source check produces the same text without quotes.'
observable = "The terminal shows exactly ENV Hollowmere READY and returns to its prompt."
failure = "A missing quote or parenthesis causes SyntaxError before any output appears."
practice = "s01-l01-d2"

[[lessons.concepts]]
id = "tool-install"
purpose = "Install the real supported Python toolchain and Hollowmere dependencies into an isolated project environment."
anatomy = "Check Python's version; create .venv; activate it in the current terminal; verify sys.executable; install requirements; install the project editable."
example = "The opening terminal sequence performs the complete install from python --version through python -m pip install -e ."
observable = "Python reports version 3.12 or newer, sys.executable points inside .venv, and pip completes without changing system Python."
failure = "Command not found, an externally-managed-environment error, or an interpreter path outside .venv identifies the skipped installation step."
practice = "s01-l01-d1"

[[lessons.concepts]]
id = "tool-create-open"
purpose = "Create the Hollowmere project files and open their common project-root folder in a real external editor."
anatomy = "Create or choose Hollowmere; open that folder rather than one child file; identify pyproject.toml at the root; create the listed relative paths from the editor tree."
example = "The lesson identifies Hollowmere as the opened folder and creates pyproject.toml, requirements.txt, and .gitignore at its root."
observable = "The editor tree shows the three root files and later shows src/hollowmere beneath the same opened folder."
failure = "Opening only src or saving pyproject.toml inside src makes root commands unable to find the project metadata."
practice = "s01-l01-e3"

[[lessons.concepts]]
id = "tool-navigate"
purpose = "Keep terminal commands and editor file creation anchored to the same Hollowmere project root."
anatomy = "Locate pyproject.toml in the editor tree; open a terminal for that folder; inspect the prompt's current path; use relative paths from that root."
example = "Every worked command is run from the folder that directly contains pyproject.toml and requirements.txt."
observable = "python -m pip install -e . finds pyproject.toml and created paths appear under the expected root."
failure = "A missing pyproject.toml message during editable install means the terminal is in the wrong directory."
practice = "s01-l01-e3"

[[lessons.concepts]]
id = "tool-edit-save"
purpose = "Make a precise source or configuration edit, persist it to disk, and ensure the next command reads that version."
anatomy = "Open the named relative file; enter the complete content; inspect spelling and indentation; save until the editor's unsaved marker clears; rerun the smallest check."
example = "The lesson saves requirements.txt before asking python -m pip to read its four dependency lines."
observable = "The terminal command sees the newly saved dependency filename and content instead of an older buffer."
failure = "An unsaved-tab marker or a wrong capitalization leaves the disk unchanged and the rerun repeats the prior result."
practice = "s01-l01-e2"

[[lessons.artifactSteps]]
id = "s01-write-project-metadata"
path = "pyproject.toml"
mode = "write"
instruction = "At the Hollowmere project root, create pyproject.toml with this complete packaging and pytest configuration, then save it."
content = '''
[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "hollowmere"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["pygame>=2.6,<3", "pytmx>=3.32,<4"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
'''

[[lessons.artifactSteps]]
id = "s01-write-requirements"
path = "requirements.txt"
mode = "write"
instruction = "At the project root, create requirements.txt with the runtime, test, and delivery tools on separate lines; activate .venv and run python -m pip install -r requirements.txt."
content = '''
pygame>=2.6,<3
pytmx>=3.32,<4
pytest>=8,<10
pyinstaller>=6,<7
'''

[[lessons.artifactSteps]]
id = "s01-ignore-local-build-state"
path = ".gitignore"
mode = "write"
instruction = "Create .gitignore at the project root so the reproducible source files remain separate from local environments, caches, saves, and generated packages."
content = '''
.venv/
__pycache__/
.pytest_cache/
build/
dist/
*.pyc
*.save.json
'''

[[lessons.readings]]
label = "Python Packaging User Guide — Install packages in a virtual environment"
url = "https://packaging.python.org/en/latest/guides/installing-using-pip-and-virtual-environments/"

[[lessons.readings]]
label = "Python documentation — venv"
url = "https://docs.python.org/3/library/venv.html"

[[lessons.exercises]]
id = "s01-l01-e1"
type = "mc"
points = 15
prompt = 'The terminal is in Hollowmere, but <code>python -c "import sys; print(sys.executable)"</code> prints a system path. What should the Wayfinder do before installing packages?'
choices = ["Activate Hollowmere's .venv in this terminal", "Rename requirements.txt to packages.txt", "Move pyproject.toml into src", "Run the editor as administrator"]
answer = 0
whyWrong = "The dependency files and editor permissions do not select an interpreter. Activation changes this terminal's Python path; verify that path before installing."
hint = "Use the check's printed path as evidence of which environment receives packages."
explain = "Activation is terminal-local. A new terminal must activate the project environment again."

[[lessons.exercises]]
id = "s01-l01-d1"
type = "type"
points = 12
reps = 2
prompt = "Retype the environment-creation command exactly. This is a terminal command, not Python source."
code = "python -m venv .venv"

[[lessons.exercises]]
id = "s01-l01-e2"
type = "fill"
points = 20
prompt = "Complete the terminal command that installs every pinned Hollowmere dependency."
code = "python -m pip install -r ____"
answer = "requirements.txt"
whyWrong = "The <code>-r</code> option expects the dependency filename, not the environment directory or project metadata file."
hint = "Use the plain-text file whose lines name pygame, pytmx, pytest, and pyinstaller."

[[lessons.exercises]]
id = "s01-l01-d2"
type = "type"
points = 12
reps = 2
prompt = "Retype the complete first Python source check."
code = 'print("ENV Hollowmere READY")'

[[lessons.exercises]]
id = "s01-l01-e3"
type = "text"
points = 20
prompt = "Which root-level file declares the project name, Python requirement, package layout, and pytest configuration?"
answer = "pyproject.toml"
hint = "Its extension is the name of the configuration format used by modern Python packaging."
whyWrong = "requirements.txt lists installable distributions; the broader project and tool configuration belongs in Python's TOML project file."

[[lessons.exercises]]
id = "s01-l01-w1"
type = "write"
points = 30
prompt = "Create a one-line Python program that prints exactly <code>ENV Hollowmere READY</code>. This first lab checks the interpreter, not the GUI."
expect = '''
ENV Hollowmere READY
'''
solution = '''
print("ENV Hollowmere READY")
'''
hint = "Place the complete required line inside matching quotes in one print call."
