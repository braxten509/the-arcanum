[[lessons.exercises]]
id = "s01-l05-e1"
type = "mc"
points = 15
prompt = "A Hollowmere command fails with a long traceback. Which evidence should be read first?"
choices = ["The first imported module", "Every line in alphabetical order", "The final exception category and message", "The number of files in src"]
answer = 2
whyWrong = "Imports and file counts do not identify the immediate failure, and tracebacks are chronological rather than alphabetical. The final line names the exception and its message."
hint = "Start where Python summarizes what stopped the run."
explain = "Then move upward to the nearest project file and line that produced that exception."

[[lessons.exercises]]
id = "s01-l05-e2"
type = "fill"
points = 20
prompt = "Complete the specific exception used when a numeric frame limit has an unacceptable value."
code = '''
if frame_limit &lt;= 0:
    raise ____("frame_limit must be positive")
'''
answer = "ValueError"
whyWrong = "The name and type exist; it is the supplied numeric value that violates the function's rule."
hint = "Choose the built-in exception whose name describes an unacceptable value."

[[lessons.exercises]]
id = "s01-l05-w1"
type = "write"
points = 35
prompt = 'Define <code>require_frames(frame_limit)</code>. Raise <code>ValueError("frame_limit must be positive")</code> when the value is zero or less; otherwise return it. Call the function with <code>0</code>, catch that exact exception as <code>error</code>, and print exactly <code>RECOVERED frame_limit must be positive</code>.'
starter = '''
def require_frames(frame_limit):
    # Validate and return the value.
    pass
'''
expect = '''
RECOVERED frame_limit must be positive
'''
solution = '''
def require_frames(frame_limit):
    if frame_limit <= 0:
        raise ValueError("frame_limit must be positive")
    return frame_limit


try:
    print(require_frames(0))
except ValueError as error:
    print("RECOVERED", error)
'''
hint = "Use <= in the function, then place the zero call in try and catch only ValueError."

