[[lessons]]
id = "s01-l04"
title = "Keep the Lantern Burning"
teaches = ["pygame-display-lifecycle", "event-loop-clean-shutdown"]
body = '''
<p>Pygame is a third-party <strong>library</strong>: installed code your project imports. <code>os.environ</code> is the operating system's supplied key-value mapping; brackets select the quoted <code>PYGAME_HIDE_SUPPORT_PROMPT</code> key and <code>= "1"</code> stores its text value before <code>import pygame</code>. Set it before the import so proof output stays exact. Then <code>pygame.init()</code> initializes Pygame's subsystems. The dot means “select this named operation from pygame”; the parentheses call it. <code>pygame.display.set_mode((960, 540))</code> requests a window and returns a screen surface. Its inner parentheses form an ordered width-and-height pair. Reversing the values makes a tall window, while omitting the pair raises <code>TypeError</code>.</p>
<pre><code data-kind="runnable">import os

os.environ["PYGAME_HIDE_SUPPORT_PROMPT"] = "1"

import pygame

pygame.init()
try:
    screen = pygame.display.set_mode((320, 180))
    screen.fill((18, 31, 43))
    pygame.display.flip()
    print("WINDOW READY")
finally:
    pygame.quit()</code></pre>
<p>This example's observable terminal line is <code>WINDOW READY</code>, and a small dark-blue window appears briefly when run normally. <code>screen.fill</code> sets the current frame's background color; <code>pygame.display.flip()</code> presents that completed frame. The three integers are red, green, and blue channel strengths. They are not an image asset and no downloaded media is required.</p>
<p><code>try</code> marks work that must be cleaned up. <code>finally</code> marks a block that runs whether the work succeeds or raises an exception. That makes <code>pygame.quit()</code> the reliable release point. Without it, a crash during setup can leave subsystems or a window alive until the process ends. The keywords, colons, and matching four-space blocks are load-bearing.</p>
<p>A real game must keep its window responsive. <code>running = True</code> supplies the <code>while running:</code condition. Each frame, <code>pygame.event.get()</code> removes pending input and window messages from the event queue. <code>for event in ...</code> visits them. If <code>event.type == pygame.QUIT</code>, the user asked to close the window, so assignment changes <code>running</code> to <code>False</code>. The next while check stops the loop. Failing to drain events can make the operating system label the window unresponsive.</p>
<pre><code data-kind="pseudocode">initialize Pygame
try:
    while the game is running:
        read every queued event
        stop when a QUIT event appears
        update the world
        draw one complete frame
        limit the frame rate
finally:
    release Pygame</code></pre>
<p><code>pygame.time.Clock()</code> creates a clock, and <code>clock.tick(TARGET_FPS)</code> waits as needed to keep this diagnostic loop near sixty frames per second. It is a limit, not a promise that slow work becomes fast. The loop below is intentionally sparse: section 2 replaces the diagnostic frame with player state while preserving event polling, the clock, and cleanup.</p>
<p>The root <code>main.py</code> is a thin compatibility launcher for the workbench. Its <code>from src.hollowmere.__main__ import main</code> statement reaches the same package through the checked-out <code>src</code> folder; an editable external install may use <code>python -m hollowmere</code>. Both routes call the same <code>main()</code>. A misspelled segment raises <code>ModuleNotFoundError</code>, so copy the package path exactly.</p>
<div class="field-notes"><div class="fn-head">FIELD NOTES // NEVER STARVE THE QUEUE</div>
<p>Handle events once per frame even when Hollowmere has no player controls yet. Input, focus, resize, and close requests all share the queue; postponing it is not an optimization.</p></div>
'''

[[lessons.concepts]]
id = "pygame-display-lifecycle"
purpose = "Initialize Pygame, create and present a real diagnostic window, control frame timing, and release every initialized subsystem."
anatomy = "Hide the support prompt; import pygame; call init; request a display with an ordered size pair; fill and flip the screen; create a Clock and tick it; place pygame.quit in finally."
example = "The complete WINDOW READY program initializes, displays one frame, prints an observable receipt, and releases Pygame."
observable = "A 320x180 dark-blue window appears during an ordinary run, the terminal prints WINDOW READY, and the process exits cleanly."
failure = "A malformed size pair raises TypeError; skipping display setup can make event handling unreliable; skipping finally risks incomplete cleanup after an exception."
practice = "s01-l04-d1"

[[lessons.concepts]]
id = "event-loop-clean-shutdown"
purpose = "Keep the game responsive until a real QUIT event changes the loop's running condition."
anatomy = "Set running True; enter while running; iterate over pygame.event.get each frame; compare event.type with pygame.QUIT; assign running False; draw, flip, and tick before the next condition check."
example = "The lifecycle explanation traces the exact event/update/render/tick order used by Hollowmere's app.py."
observable = "The ordinary window remains responsive and closes when its close control produces a QUIT event."
failure = "Never draining the queue produces an unresponsive window; never changing running creates a loop the close request cannot stop."
practice = "s01-l04-e2"

