[[lessons.exercises]]
id = "s01-l04-e1"
type = "mc"
points = 15
prompt = "Which operation must happen every frame so operating-system close and focus messages do not accumulate?"
choices = ["pygame.display.set_caption()", "pygame.init()", "pygame.quit()", "pygame.event.get()"]
answer = 3
whyWrong = "Initialization happens once, the caption is metadata, and quit belongs after the loop. Reading pygame.event.get() drains and returns the queued events each frame."
hint = "Choose the call that reads the queue rather than configuring or releasing Pygame."
explain = "The event queue has a finite capacity, and an undrained window may be judged unresponsive."

[[lessons.exercises]]
id = "s01-l04-e2"
type = "fill"
points = 20
prompt = "Complete the event constant that represents a window close request."
code = '''
for event in pygame.event.get():
    if event.type == pygame.____:
        running = False
'''
answer = "QUIT"
whyWrong = "The comparison needs Pygame's uppercase close-event constant, not the cleanup function pygame.quit()."
hint = "Use the uppercase event name documented by pygame.event."

[[lessons.exercises]]
id = "s01-l04-e3"
type = "text"
points = 20
prompt = "Which Python cleanup keyword introduces a block that runs whether the protected Pygame work succeeds or raises an exception?"
answer = "finally"
hint = "It follows a try block and describes guaranteed cleanup."
whyWrong = "except handles selected errors; the unconditional cleanup block uses a different keyword."

