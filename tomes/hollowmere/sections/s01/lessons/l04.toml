[[lessons.artifactSteps]]
id = "s01-create-pygame-app"
path = "src/hollowmere/app.py"
mode = "write"
instruction = "Create src/hollowmere/app.py with this complete diagnostic event loop. Run it only through the package entrypoint created next."
content = '''
"""Pygame startup, event loop, rendering, and cleanup."""

import os

os.environ["PYGAME_HIDE_SUPPORT_PROMPT"] = "1"

import pygame

from .config import (
    BACKGROUND_COLOR,
    PROJECT_NAME,
    TARGET_FPS,
    WINDOW_HEIGHT,
    WINDOW_WIDTH,
)


def run_game():
    """Open the diagnostic window until the user closes it."""
    pygame.init()
    try:
        screen = pygame.display.set_mode((WINDOW_WIDTH, WINDOW_HEIGHT))
        pygame.display.set_caption(PROJECT_NAME)
        clock = pygame.time.Clock()
        running = True

        while running:
            for event in pygame.event.get():
                if event.type == pygame.QUIT:
                    running = False

            screen.fill(BACKGROUND_COLOR)
            pygame.display.flip()
            clock.tick(TARGET_FPS)
    finally:
        pygame.quit()
'''

[[lessons.artifactSteps]]
id = "s01-create-package-entrypoint"
path = "src/hollowmere/__main__.py"
mode = "write"
instruction = "Create src/hollowmere/__main__.py. This is the canonical python -m hollowmere entrypoint; at this stage it performs an ordinary launch."
content = '''
"""Command-line entrypoint for Hollowmere."""

from .app import run_game


def main():
    """Choose the ordinary game launch."""
    run_game()


if __name__ == "__main__":
    main()
'''

