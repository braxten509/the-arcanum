[[lessons.exercises]]
id = "s01-l04-e4"
type = "mc"
points = 15
prompt = "Why is <code>clock.tick(TARGET_FPS)</code> placed after presenting the frame?"
choices = ["It limits how quickly the next loop iteration begins", "It converts the screen into an event", "It guarantees all machines render at exactly the target speed", "It releases Pygame after each frame"]
answer = 0
whyWrong = "tick neither creates events nor releases Pygame, and it cannot make slow work reach a guaranteed speed. It waits when the frame finished sooner than the target budget."
hint = "Think of tick as a speed ceiling, not rendering or cleanup."
explain = "Later movement uses elapsed time, but the first loop only needs a bounded diagnostic pace."

