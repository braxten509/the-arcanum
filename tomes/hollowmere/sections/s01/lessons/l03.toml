[[lessons.exercises]]
id = "s01-l03-e1"
type = "mc"
points = 15
prompt = "Why does <code>range(1, 4)</code> drive exactly three diagnostic frames?"
choices = ["The loop skips every fourth value", "The stop value 4 is excluded", "Python starts all ranges at zero", "The print call removes the final frame"]
answer = 1
whyWrong = "The start is explicitly 1, print does not alter iteration, and range does not skip arbitrary values. Its stop boundary is excluded, yielding 1, 2, and 3."
hint = "Distinguish the included start boundary from the excluded stop boundary."
explain = "An excluded stop makes counts predictable: range(1, frame_count + 1) includes frame_count."

[[lessons.exercises]]
id = "s01-l03-d1"
type = "type"
points = 12
reps = 2
prompt = "Retype the complete bounded frame loop."
code = '''
for frame_number in range(1, 4):
    print("FRAME", frame_number)
'''

[[lessons.exercises]]
id = "s01-l03-e2"
type = "fill"
points = 20
prompt = "Complete the load-bearing keyword that sends a value from this function to its caller."
code = '''
def project_label():
    ____ "PROJECT Hollowmere"
'''
answer = "return"
whyWrong = "Printing would create output inside the function but would not give the string back to its caller. The return keyword supplies the call's value."
hint = "Use the keyword that ends the function call with a result."

[[lessons.exercises]]
id = "s01-l03-w1"
type = "write"
points = 30
prompt = "Define <code>announce_frame(frame_number)</code> so it returns <code>FRAME N READY</code>. Loop over <code>range(1, 4)</code> and print each returned string. The exact output must be three lines from FRAME 1 READY through FRAME 3 READY."
starter = '''
def announce_frame(frame_number):
    # Return one label here.
    pass


# Add the bounded loop here.
'''
expect = '''
FRAME 1 READY
FRAME 2 READY
FRAME 3 READY
'''
solution = '''
def announce_frame(frame_number):
    return f"FRAME {frame_number} READY"


for frame_number in range(1, 4):
    print(announce_frame(frame_number))
'''
hint = "Return an f-string from the function, then call it inside a for loop whose stop remains 4."

[[lessons.exercises]]
id = "s01-l03-e3"
type = "text"
points = 20
prompt = "Which special value does a Python function produce when its path reaches the end without executing a return statement?"
answer = "None"
hint = "It is Python's capitalized marker for the absence of a value."
whyWrong = "An empty string and zero are concrete values. Falling off a function body produces Python's distinct no-value marker."

[[lessons.exercises]]
id = "s01-l03-e4"
type = "fill"
points = 20
prompt = "Complete the update that guarantees this countdown eventually reaches zero."
code = '''
frames_left = 3
while frames_left:
    print(frames_left)
    frames_left = frames_left ____ 1
'''
answer = "-"
whyWrong = "Adding one moves the condition away from zero, while comparison leaves the stored count unchanged. Subtraction makes the stopping state reachable."
hint = "Use the arithmetic operator that reduces the integer by one."
