id = "s01"
codename = "CHAPTER I // LIGHT THE FIRST LANTERN"
short = "Light the First Lantern"
title = "Light the First Lantern"
build = "install and diagnose the real external Python toolchain, learn modules, calls, variables, strings, booleans, conditionals, loops, functions, imports, errors, and resource cleanup before first use, then open and close a timed Pygame window through the canonical module entrypoint with a headless milestone check."
brief = '''
<p>The first road through Hollowmere is not a painted path. It is a working Python project on your own machine. Mara Venn begins where real game work begins: an isolated environment, named dependencies, files you can navigate, and commands whose failures you can read.</p>
<p>By this waymark, the project opens a real Pygame window, drains its event queue, keeps time, and always releases Pygame cleanly. A narrow command-line proof checks the same startup boundary without opening a display. The colored diagnostic window is temporary; the stable package, entrypoint, cleanup, and proof contracts continue into every later chapter.</p>
'''

[proof]
mode = "run"
expectedFiles = ["pyproject.toml", "requirements.txt", ".gitignore", "main.py", "src/hollowmere/__init__.py", "src/hollowmere/config.py", "src/hollowmere/diagnostics.py", "src/hollowmere/app.py", "src/hollowmere/__main__.py", "tests/test_diagnostics.py", "tests/milestones/test_s01.py"]
runArgs = ["--arcanum-proof", "s01"]
expect = "S01_OK project=Hollowmere window=960x540 fps=60 pygame=ready"
