[[lessons]]
id = "s03-l05"
title = "Walk One Honest Frame"
teaches = ["event-loop-scene-integration", "cumulative-spatial-proof"]
body = '''
<p>The package entrypoint remains unchanged: ordinary launch still reaches <code>run_game()</code>, while proof arguments still reach <code>run_proof(section)</code>. Inside the ordinary path, the frame loop now delegates rather than calculating input, collision, camera, and drawing itself. This is the stable seam later maps, quests, and combat will extend.</p>
<pre><code data-kind="patch">debug = debug_enabled()
input_state = InputState(allow_debug=debug)
scene = MarshScene(screen.get_size(), debug=debug)

while running:
    dt = clock.tick(TARGET_FPS) / 1000.0
    for event in pygame.event.get():
        if event.type == pygame.QUIT:
            running = False
        input_state.handle_event(event)
    if input_state.consume_debug_teleport():
        scene.teleport_player()
    scene.update(input_state.snapshot(), dt)
    scene.render(screen)
    pygame.display.flip()</code></pre>
<p>Construction happens once after the display and Clock exist. The debug Boolean is read once, then given to both InputState and MarshScene so the key and overlay agree. Every frame calls <code>clock.tick</code> exactly once and divides by 1000.0, preserving the seconds-based dt contract. The existing event loop still drains the queue once. QUIT changes <code>running</code>; the event is also safe to pass to InputState because its type guard returns before reading <code>key</code>.</p>
<p>The update/render order is explicit. A one-shot debug teleport is consumed before update, then a fresh four-action snapshot drives the scene. Scene update resolves world state and camera; scene render creates the view; <code>pygame.display.flip()</code> presents it. The surrounding <code>try/finally</code> still owns <code>pygame.quit()</code>. No new return, secondary loop, or alternate launcher bypasses cleanup.</p>
<p>A deterministic spatial proof uses this same model boundary without opening a window. It constructs a 960×540 MarshScene in ordinary debug-off mode, records the spawn x, sends a right action for half a second, and lets the real wide bank resolve the displacement. It then derives tile coordinates through <code>world_to_tile</code>, reads Camera.offset, and decides <code>blocked=right</code> only if x stayed at the touching coordinate. Directly assigning x to 96 or printing a literal receipt would not exercise collision.</p>
<p>The s03 router extends the existing proof switchboard. s01 startup and s02 movement remain exact; s03 returns the spatial receipt; unknown ids still raise ValueError; one Pygame init/try/finally boundary cleans every route. Milestone tests must call the public functions and assert both exact receipt and released Pygame state. Run all three proof commands after pytest because passing the newest one alone cannot certify cumulative behavior.</p>
<div class="field-notes"><div class="fn-head">FIELD NOTES // ONE LOOP, ONE CLOCK, ONE WORLD</div>
<p>A stable frame boundary is deliberately boring. New systems enter Scene methods instead of inventing their own timing, event, or presentation cycles.</p></div>
'''

