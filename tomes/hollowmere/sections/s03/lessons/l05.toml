find = '''
def run_game():
    """Open the controllable entity scene until the user closes it."""
    pygame.init()
    try:
        screen = pygame.display.set_mode((WINDOW_WIDTH, WINDOW_HEIGHT))
        pygame.display.set_caption(PROJECT_NAME)
        clock = pygame.time.Clock()
        player = Player()
        entities = [player]
        running = True

        while running:
            dt = clock.tick(TARGET_FPS) / 1000.0
            for event in pygame.event.get():
                if event.type == pygame.QUIT:
                    running = False

            keys = pygame.key.get_pressed()
            actions = {
                "left": keys[pygame.K_a] or keys[pygame.K_LEFT],
                "right": keys[pygame.K_d] or keys[pygame.K_RIGHT],
                "up": keys[pygame.K_w] or keys[pygame.K_UP],
                "down": keys[pygame.K_s] or keys[pygame.K_DOWN],
            }
            player.update(actions, dt)

            screen.fill(BACKGROUND_COLOR)
            for entity in entities:
                pygame.draw.rect(screen, PLAYER_COLOR, entity.rect())
            pygame.display.flip()
    finally:
        pygame.quit()
'''
content = '''
def run_game():
    """Open the solid marsh scene until the user closes it."""
    pygame.init()
    try:
        screen = pygame.display.set_mode((WINDOW_WIDTH, WINDOW_HEIGHT))
        pygame.display.set_caption(PROJECT_NAME)
        clock = pygame.time.Clock()
        debug = debug_enabled()
        input_state = InputState(allow_debug=debug)
        scene = MarshScene(screen.get_size(), debug=debug)
        running = True

        while running:
            dt = clock.tick(TARGET_FPS) / 1000.0
            for event in pygame.event.get():
                if event.type == pygame.QUIT:
                    running = False
                input_state.handle_event(event)

            if input_state.consume_debug_teleport():
                scene.teleport_player()
            scene.update(input_state.snapshot(), dt)
            scene.render(screen)
            pygame.display.flip()
    finally:
        pygame.quit()
'''

[[lessons.artifactSteps]]
id = "s03-test-input-scene-seam"
path = "tests/test_scene.py"
mode = "append"
instruction = "Append a deterministic event-to-action-to-collision integration test without opening a display."
content = '''


def test_named_event_state_drives_scene_collision():
    from hollowmere.input import InputState

    state = InputState()
    event = pygame.event.Event(pygame.KEYDOWN, key=pygame.K_d)
    state.handle_event(event)
    scene = MarshScene((960, 540))
    scene.update(state.snapshot(), 0.5)
    assert scene.player.rect().topleft == (96, 64)
'''

