[[lessons.exercises]]
id = "s03-l05-w1"
type = "write"
points = 35
prompt = "Process two frame event lists: the first contains 'keydown' and the second contains 'quit'. Count one update and one render only while running, then print exactly <code>UPDATES 1 RENDERS 1 QUIT True</code>."
starter = '''
frames = [["keydown"], ["quit"]]
running = True
updates = 0
renders = 0
quit_seen = False
'''
expect = '''
UPDATES 1 RENDERS 1 QUIT True
'''
solution = '''
frames = [["keydown"], ["quit"]]
running = True
updates = 0
renders = 0
quit_seen = False

for events in frames:
    for event in events:
        if event == "quit":
            running = False
            quit_seen = True
    if running:
        updates += 1
        renders += 1

print("UPDATES", updates, "RENDERS", renders, "QUIT", quit_seen)
'''
hint = "Handle every event before the running check, increment both frame phases only when still running, and retain the quit flag."
