[[lessons.exercises]]
id = "s03-l03-w1"
type = "write"
points = 35
prompt = "For world position (350, 225), tile size 32, and camera offset (160, 90), compute the containing tile with // and the screen position by subtraction. Print exactly <code>TILE 10 7 SCREEN 190 135</code>."
expect = '''
TILE 10 7 SCREEN 190 135
'''
solution = '''
world_position = (350, 225)
tile_size = 32
camera_offset = (160, 90)

tile = (
    world_position[0] // tile_size,
    world_position[1] // tile_size,
)
screen = (
    world_position[0] - camera_offset[0],
    world_position[1] - camera_offset[1],
)
print("TILE", tile[0], tile[1], "SCREEN", screen[0], screen[1])
'''
hint = "Use // separately for the two tile components, subtract matching camera components, then print in the requested order."
