[[lessons.concepts]]
id = "clamped-camera-follow"
purpose = "Center the viewport on the Player when possible without showing pixels beyond the configured world extent."
anatomy = "Read the target Rect center; subtract half viewport width/height; compute nonnegative maximum offsets; clamp desired x/y; store the result in Camera.offset."
example = "Camera.follow implements the full center-then-clamp calculation and apply_rect subtracts its rounded offset from a copy."
observable = "A target near the spawn produces offset 0,0; a target at the far corner produces world size minus viewport size."
failure = "An unclamped camera reveals outside-map space; moving source Rects during rendering corrupts collision world state; adding offset pans the wrong direction."
practice = "s03-l03-e2"

[[lessons.artifactSteps]]
id = "s03-create-camera-coordinates"
path = "src/hollowmere/camera.py"
mode = "write"
instruction = "Create camera.py with canonical tile conversions and a clamped world-to-screen transform."
content = '''
"""Coordinate conversion and clamped camera following."""

import os

os.environ["PYGAME_HIDE_SUPPORT_PROMPT"] = "1"

import pygame

from .config import TILE_SIZE


def world_to_tile(position, tile_size=TILE_SIZE):
    """Return the integer tile containing a world position."""
    if tile_size <= 0:
        raise ValueError("tile_size must be positive")
    return (
        int(position[0] // tile_size),
        int(position[1] // tile_size),
    )


def tile_to_world(tile, tile_size=TILE_SIZE):
    """Return the world-space top-left of a tile."""
    if tile_size <= 0:
        raise ValueError("tile_size must be positive")
    return pygame.Vector2(tile[0] * tile_size, tile[1] * tile_size)


class Camera:
    """Follow a world Rect while remaining inside world bounds."""

    def __init__(self, viewport_size, world_size):
        self.viewport_size = viewport_size
        self.world_size = world_size
        self.offset = pygame.Vector2(0, 0)

    def follow(self, target_rect):
        """Center on target where world edges permit it."""
        desired_x = target_rect.centerx - self.viewport_size[0] / 2
        desired_y = target_rect.centery - self.viewport_size[1] / 2
        maximum_x = max(0, self.world_size[0] - self.viewport_size[0])
        maximum_y = max(0, self.world_size[1] - self.viewport_size[1])
        self.offset.x = min(max(desired_x, 0), maximum_x)
        self.offset.y = min(max(desired_y, 0), maximum_y)

    def apply_rect(self, world_rect):
        """Return a screen-space copy of a world Rect."""
        return world_rect.move(
            -round(self.offset.x),
            -round(self.offset.y),
        )
'''

[[lessons.artifactSteps]]
id = "s03-test-camera-coordinates"
path = "tests/test_camera.py"
mode = "write"
instruction = "Create tests that distinguish tile labels, cell origins, screen copies, and camera edge clamps."
content = '''
"""Tests for coordinate conversion and camera following."""

import pygame
import pytest

from hollowmere.camera import Camera, tile_to_world, world_to_tile


def test_world_tile_round_trip_returns_cell_origin():
    assert world_to_tile((100, 70)) == (3, 2)
    assert tile_to_world((3, 2)) == pygame.Vector2(96, 64)


def test_tile_size_must_be_positive():
    with pytest.raises(ValueError, match="tile_size must be positive"):
        world_to_tile((100, 70), 0)


def test_camera_clamps_both_world_edges():
    camera = Camera((320, 180), (1280, 960))
    camera.follow(pygame.Rect(0, 0, 32, 32))
    assert camera.offset == pygame.Vector2(0, 0)
    camera.follow(pygame.Rect(1248, 928, 32, 32))
    assert camera.offset == pygame.Vector2(960, 780)


def test_apply_rect_returns_screen_copy():
    camera = Camera((320, 180), (1280, 960))
    camera.offset.update(320, 100)
    world_rect = pygame.Rect(500, 200, 32, 32)
    assert camera.apply_rect(world_rect).topleft == (180, 100)
    assert world_rect.topleft == (500, 200)
'''

