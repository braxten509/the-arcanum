[[lessons]]
id = "s03-l03"
title = "Keep Three Maps of One Place"
teaches = ["world-tile-screen-coordinates", "clamped-camera-follow"]
body = '''
<p>One marsh position can be described in three coordinate spaces. <strong>World coordinates</strong> are persistent pixel positions inside the whole map; <code>Player.position</code> and every collision Rect live there. <strong>Tile coordinates</strong> are integer column/row labels used to identify grid cells. <strong>Screen coordinates</strong> are where a world object appears inside the current window. Confusing them creates bugs that seem to move when the camera moves.</p>
<pre><code data-kind="runnable">tile_size = 32
world_position = (100.0, 70.0)
tile = (
    int(world_position[0] // tile_size),
    int(world_position[1] // tile_size),
)
print("TILE", tile[0], tile[1])</code></pre>
<p>The output is <code>TILE 3 2</code>. The floor-division operator <code>//</code> discards the remainder toward the lower whole number, so world x values 96 through 127 belong to column 3. <code>int</code> makes the result an explicit integer. A zero or negative tile size is invalid and raises <code>ValueError</code>; a grid cell cannot have a nonpositive pixel span.</p>
<p><code>tile_to_world((column, row))</code> performs the inverse origin calculation by multiplying each index by tile size. It returns the top-left Vector2 of that cell, not its center. A round trip from an arbitrary world point loses the within-tile remainder by design: (100, 70) becomes tile (3, 2), whose origin is (96, 64).</p>
<p>A Camera never changes world state. It owns an offset—the world pixel located at the screen's top-left. <code>apply_rect(world_rect)</code> returns a moved copy with the rounded offset subtracted. If a wall is at world x 500 and camera x is 320, the wall draws at screen x 180. Collision still compares the original world Rects.</p>
<pre><code data-kind="runnable">world_x = 500
camera_x = 320
screen_x = world_x - camera_x
print("SCREEN_X", screen_x)</code></pre>
<p>The receipt is <code>SCREEN_X 180</code>. <code>follow(target_rect)</code> first asks for the target center minus half the viewport. It then clamps each offset between zero and <code>world_size - viewport_size</code>. Near the upper-left, the offset remains (0, 0) instead of revealing space beyond the map. Near the far edge, it stops at the greatest legal offset. If the world is smaller than the viewport, <code>max(0, difference)</code> makes that greatest offset zero.</p>
<div class="field-notes"><div class="fn-head">FIELD NOTES // SUBTRACT THE VIEW</div>
<p>World-to-screen is subtraction. Screen-to-world, needed later for mouse interaction, adds the same camera offset.</p></div>
'''

