[[lessons]]
id = "s03-l02"
title = "Slide along the Reedwall"
teaches = ["axis-separated-rect-collision", "bounded-world-clamp"]
body = '''
<p>Player still owns intent: named actions become a normalized direction, then speed and <code>dt</code> produce a displacement Vector2. Collision owns permission. Splitting those responsibilities keeps the proven <code>Player.update(actions, dt)</code> behavior available while a solid world can apply the same intended displacement safely.</p>
<pre><code data-kind="runnable">import os

os.environ["PYGAME_HIDE_SUPPORT_PROMPT"] = "1"

import pygame

body = pygame.Rect(96, 64, 32, 32)
wall = pygame.Rect(128, 64, 160, 96)
body.x += 45
if body.colliderect(wall):
    body.right = wall.left
print("X", body.x, "TOUCHING", body.right == wall.left)</code></pre>
<p>The output is <code>X 96 TOUCHING True</code>. <code>colliderect</code> returns a Boolean for overlapping rectangles. Touching edges are not overlap, so placing <code>body.right</code> at <code>wall.left</code> stops the player flush against the bank. When horizontal displacement is negative, the mirrored correction places <code>body.left</code> at <code>wall.right</code>.</p>
<p><strong>Axis-separated resolution</strong> applies x first, resolves every overlap, then applies y and resolves again. This order allows sliding. If a diagonal move reaches a vertical wall, x is corrected but y can continue because the corrected body only touches the wall edge. Moving both axes before collision would reveal only one combined overlap; choosing an arbitrary correction can snap the player backward or block the free axis.</p>
<p><code>Player.displacement(actions, dt)</code> becomes the canonical calculation. It rejects negative time and returns <code>movement_vector(actions) * speed * dt</code>. The old <code>update</code> calls that method and adds the result, so s02's public behavior and exact proof remain unchanged. <code>CollisionWorld.move(entity, displacement)</code> uses the same result but applies each component under collision rules.</p>
<p>The world's outer rectangle is another invariant. Before testing solids on an axis, clamp the floating position between zero and <code>bounds.right - entity.size[0]</code> or the matching y limit. <code>min(max(value, lower), upper)</code> first raises a value to the lower bound, then lowers it to the upper bound. Clamping Vector2 state directly preserves subpixel motion; repeatedly copying a rounded Rect position back into the entity would discard small movements.</p>
<p>Rect collision at ordinary frame steps is intentionally simple here. Very large displacements can tunnel completely beyond a thin wall without overlapping at the endpoint. Hollowmere limits normal speed and frame time; later production hardening can subdivide unusually large steps without changing this public world boundary.</p>
<div class="field-notes"><div class="fn-head">FIELD NOTES // INTENT IS NOT AUTHORITY</div>
<p>Player says how far it wants to travel. CollisionWorld is the single owner that decides the reachable final position.</p></div>
'''

