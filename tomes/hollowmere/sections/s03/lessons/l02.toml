content = '''
    def displacement(self, actions, dt):
        """Return intended movement through elapsed seconds."""
        if dt < 0:
            raise ValueError("dt must be nonnegative")
        return self.movement_vector(actions) * self.speed * dt

    def update(self, actions, dt):
        """Move through elapsed seconds using normalized direction."""
        self.position += self.displacement(actions, dt)
'''

[[lessons.artifactSteps]]
id = "s03-create-collision-world"
path = "src/hollowmere/collision.py"
mode = "write"
instruction = "Create collision.py as the sole owner of bounds and axis-separated solid resolution."
content = '''
"""Axis-separated collision for rectangular Hollowmere entities."""

import os

os.environ["PYGAME_HIDE_SUPPORT_PROMPT"] = "1"

import pygame


class CollisionWorld:
    """Move entities inside bounds and outside solid rectangles."""

    def __init__(self, size, solids):
        self.bounds = pygame.Rect((0, 0), size)
        self.solids = []
        for solid in solids:
            self.solids.append(pygame.Rect(solid))

    def move(self, entity, displacement):
        """Apply and resolve one displacement, x before y."""
        self._move_x(entity, displacement.x)
        self._move_y(entity, displacement.y)

    def _move_x(self, entity, amount):
        entity.position.x += amount
        maximum = self.bounds.right - entity.size[0]
        entity.position.x = min(max(entity.position.x, 0), maximum)
        body = entity.rect()
        for solid in self.solids:
            if not body.colliderect(solid):
                continue
            if amount > 0:
                entity.position.x = solid.left - body.width
            elif amount < 0:
                entity.position.x = solid.right
            body = entity.rect()

    def _move_y(self, entity, amount):
        entity.position.y += amount
        maximum = self.bounds.bottom - entity.size[1]
        entity.position.y = min(max(entity.position.y, 0), maximum)
        body = entity.rect()
        for solid in self.solids:
            if not body.colliderect(solid):
                continue
            if amount > 0:
                entity.position.y = solid.top - body.height
            elif amount < 0:
                entity.position.y = solid.bottom
            body = entity.rect()
'''

[[lessons.artifactSteps]]
id = "s03-test-collision-world"
path = "tests/test_collision.py"
mode = "write"
instruction = "Create collision tests for blocking, sliding, and world bounds using the existing Player contract."
content = '''
"""Tests for axis-separated marsh collision."""

import pygame

from hollowmere.collision import CollisionWorld
from hollowmere.entities import Player


WALL = pygame.Rect(128, 64, 160, 96)
RIGHT = {"right": True}
DOWN_RIGHT = {"right": True, "down": True}


def test_wall_blocks_horizontal_displacement():
    player = Player(position=(96, 64))
    world = CollisionWorld((1280, 960), [WALL])
    world.move(player, player.displacement(RIGHT, 0.25))
    assert player.rect().topleft == (96, 64)


def test_axis_separation_allows_wall_sliding():
    player = Player(position=(96, 64))
    world = CollisionWorld((1280, 960), [WALL])
    world.move(player, player.displacement(DOWN_RIGHT, 0.25))
    assert player.position.x == 96
    assert player.position.y > 64


def test_world_bounds_clamp_floating_position():
    player = Player(position=(0, 0))
    world = CollisionWorld((1280, 960), [])
    world.move(player, pygame.Vector2(-20.5, -8.25))
    assert player.position == pygame.Vector2(0, 0)
'''

