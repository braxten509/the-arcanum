[[lessons.exercises]]
id = "s03-l01-w1"
type = "write"
points = 34
prompt = "Start with <code>actions = {'right': False}</code>. Process the ordered event strings <code>['down', 'up', 'down']</code>, assigning right True for down and False for up, then print exactly <code>RIGHT True EVENTS 3</code>."
starter = '''
actions = {"right": False}
events = ["down", "up", "down"]
'''
expect = '''
RIGHT True EVENTS 3
'''
solution = '''
actions = {"right": False}
events = ["down", "up", "down"]

for event in events:
    if event == "down":
        actions["right"] = True
    elif event == "up":
        actions["right"] = False

print("RIGHT", actions["right"], "EVENTS", len(events))
'''
hint = "Loop in order, use if/elif to update the existing right key, and count the event list with len."
