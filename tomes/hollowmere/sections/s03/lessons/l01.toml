[[lessons.artifactSteps]]
id = "s03-create-input-state"
path = "src/hollowmere/input.py"
mode = "write"
instruction = "Create input.py with the event-driven held-key translator. Keep the public snapshot keys identical to section two."
content = '''
"""Event-driven input translated into stable action names."""

import os

os.environ["PYGAME_HIDE_SUPPORT_PROMPT"] = "1"

import pygame


ACTION_KEYS = {
    "left": (pygame.K_a, pygame.K_LEFT),
    "right": (pygame.K_d, pygame.K_RIGHT),
    "up": (pygame.K_w, pygame.K_UP),
    "down": (pygame.K_s, pygame.K_DOWN),
}


class InputState:
    """Remember physical key edges and expose named action state."""

    def __init__(self, allow_debug=False):
        self._pressed = {}
        for keys in ACTION_KEYS.values():
            for key in keys:
                self._pressed[key] = False
        self._allow_debug = allow_debug
        self._teleport_requested = False

    def handle_event(self, event):
        """Update held state from one already-drained Pygame event."""
        if event.type == pygame.WINDOWFOCUSLOST:
            self.reset()
            return
        if event.type not in (pygame.KEYDOWN, pygame.KEYUP):
            return
        if event.key in self._pressed:
            self._pressed[event.key] = event.type == pygame.KEYDOWN
        if (
            self._allow_debug
            and event.type == pygame.KEYDOWN
            and event.key == pygame.K_t
        ):
            self._teleport_requested = True

    def snapshot(self):
        """Return a fresh four-action dictionary."""
        actions = {}
        for action, keys in ACTION_KEYS.items():
            primary, alternate = keys
            actions[action] = (
                self._pressed[primary] or self._pressed[alternate]
            )
        return actions

    def reset(self):
        """Release every tracked key after focus loss."""
        for key in self._pressed:
            self._pressed[key] = False

    def consume_debug_teleport(self):
        """Consume the debug-only teleport request once."""
        requested = self._teleport_requested
        self._teleport_requested = False
        return requested
'''

[[lessons.artifactSteps]]
id = "s03-test-input-state"
path = "tests/test_input.py"
mode = "write"
instruction = "Create deterministic input tests with constructed Pygame events, then run the project test command."
content = '''
"""Tests for named event-driven input."""

import pygame

from hollowmere.input import InputState


def key_event(event_type, key):
    return pygame.event.Event(event_type, key=key)


def test_alternate_keys_share_one_action_without_canceling():
    state = InputState()
    state.handle_event(key_event(pygame.KEYDOWN, pygame.K_d))
    state.handle_event(key_event(pygame.KEYDOWN, pygame.K_RIGHT))
    state.handle_event(key_event(pygame.KEYUP, pygame.K_d))
    assert state.snapshot()["right"] is True
    state.handle_event(key_event(pygame.KEYUP, pygame.K_RIGHT))
    assert state.snapshot()["right"] is False


def test_focus_loss_releases_every_action():
    state = InputState()
    state.handle_event(key_event(pygame.KEYDOWN, pygame.K_w))
    state.handle_event(pygame.event.Event(pygame.WINDOWFOCUSLOST))
    assert state.snapshot() == {
        "left": False,
        "right": False,
        "up": False,
        "down": False,
    }
'''

