[[lessons]]
id = "s03-l01"
title = "Hold a Direction between Events"
teaches = ["event-driven-action-state", "focus-safe-held-input"]
body = '''
<p>Section two sampled the keyboard directly. A scene boundary is easier to test when events update a small state object and the scene receives the same four named actions as before. Pygame places <code>KEYDOWN</code> and <code>KEYUP</code> objects in its event queue. Each has a <code>type</code> and a <code>key</code> attribute. The type says what happened; the key is a portable constant such as <code>pygame.K_d</code>, never a guessed integer.</p>
<pre><code data-kind="runnable">import os

os.environ["PYGAME_HIDE_SUPPORT_PROMPT"] = "1"

import pygame

event = pygame.event.Event(pygame.KEYDOWN, key=pygame.K_d)
print(pygame.event.event_name(event.type), pygame.key.name(event.key))</code></pre>
<p>The receipt is <code>KeyDown d</code>. <code>pygame.event.Event(type, key=value)</code> creates a deterministic event for tests; the operating system creates equivalent events during play. Reading <code>event.key</code> on a QUIT event would raise <code>AttributeError</code>, so input code checks the type before the type-specific attribute.</p>
<p><code>ACTION_KEYS</code> maps each stable action name to a tuple of physical alternatives. <code>InputState</code> owns a dictionary of pressed key constants. A KEYDOWN stores <code>True</code>; a KEYUP stores <code>False</code>. Its <code>snapshot()</code> loops through <code>ACTION_KEYS.items()</code>. The <code>items</code> method yields each key/value pair, so <code>action, keys</code> unpacks a name and its two-key tuple. The snapshot combines those alternatives with <code>or</code> and returns a fresh four-key dictionary.</p>
<p>Tracking physical keys separately prevents a subtle bug. If D and Right are both held, releasing only D must leave the <code>right</code> action true. Storing only one Boolean per action would lose which key remains down. A returned copy also prevents Player or a test from mutating the input object's private state.</p>
<p>A window can lose focus while a key is held, and the matching KEYUP may go elsewhere. On <code>WINDOWFOCUSLOST</code>, <code>reset()</code> sets every tracked key false. Without that branch the Wayfinder may keep walking after Alt-Tab. The main loop still drains <code>pygame.event.get()</code> once per frame; <code>handle_event</code> consumes each already-drained event rather than creating a second queue.</p>
<div class="field-notes"><div class="fn-head">FIELD NOTES // EVENTS ARE EDGES</div>
<p>KEYDOWN means a state changed at one moment. The snapshot is the durable state used by every update until another event changes it.</p></div>
'''

