[[lessons.artifactSteps]]
id = "s03-create-debug-boundary"
path = "src/hollowmere/debug.py"
mode = "write"
instruction = "Create debug.py with strict environment parsing and a camera-aware overlay that uses only Pygame fallback drawing/text."
content = '''
"""Opt-in spatial diagnostics for Hollowmere."""

import os

os.environ["PYGAME_HIDE_SUPPORT_PROMPT"] = "1"

import pygame

from .camera import world_to_tile
from .config import DEBUG_COLOR


def debug_enabled():
    """Return whether the explicit debug environment switch is true."""
    raw = os.environ.get("HOLLOWMERE_DEBUG", "")
    return raw.strip().lower() in ("1", "true", "yes", "on")


def draw_debug_overlay(screen, scene):
    """Draw world collision and coordinate evidence in screen space."""
    for solid in scene.world.solids:
        pygame.draw.rect(
            screen,
            DEBUG_COLOR,
            scene.camera.apply_rect(solid),
            1,
        )
    pygame.draw.rect(
        screen,
        DEBUG_COLOR,
        scene.camera.apply_rect(scene.player.rect()),
        1,
    )
    tile = world_to_tile(scene.player.position)
    label = (
        f"world={round(scene.player.position.x)},{round(scene.player.position.y)} "
        f"tile={tile[0]},{tile[1]} "
        f"camera={round(scene.camera.offset.x)},{round(scene.camera.offset.y)}"
    )
    font = pygame.font.Font(None, 18)
    screen.blit(font.render(label, True, DEBUG_COLOR), (8, 8))
'''

[[lessons.artifactSteps]]
id = "s03-create-marsh-scene"
path = "src/hollowmere/scene.py"
mode = "write"
instruction = "Create scene.py as the canonical update/render owner for the prototype marsh, roster, collision world, and camera."
content = '''
"""The playable prototype marsh scene."""

import os

os.environ["PYGAME_HIDE_SUPPORT_PROMPT"] = "1"

import pygame

from .camera import Camera
from .collision import CollisionWorld
from .config import (
    BACKGROUND_COLOR,
    MARSH_SPAWN,
    PLAYER_COLOR,
    WALL_COLOR,
    WORLD_SIZE,
)
from .debug import draw_debug_overlay
from .entities import Player


MARSH_SOLIDS = (
    pygame.Rect(128, 64, 160, 96),
    pygame.Rect(384, 288, 256, 32),
)


class MarshScene:
    """Own the prototype world's update and rendering boundaries."""

    def __init__(self, viewport_size, player=None, debug=False):
        self.player = player or Player(position=MARSH_SPAWN)
        self.entities = [self.player]
        self.world = CollisionWorld(WORLD_SIZE, MARSH_SOLIDS)
        self.camera = Camera(viewport_size, WORLD_SIZE)
        self.debug = debug
        self.camera.follow(self.player.rect())

    def update(self, actions, dt):
        """Advance authoritative world state once."""
        displacement = self.player.displacement(actions, dt)
        self.world.move(self.player, displacement)
        self.camera.follow(self.player.rect())

    def render(self, screen):
        """Draw a camera-transformed view without changing world state."""
        screen.fill(BACKGROUND_COLOR)
        for solid in self.world.solids:
            pygame.draw.rect(
                screen,
                WALL_COLOR,
                self.camera.apply_rect(solid),
            )
        for entity in self.entities:
            pygame.draw.rect(
                screen,
                PLAYER_COLOR,
                self.camera.apply_rect(entity.rect()),
            )
        if self.debug:
            draw_debug_overlay(screen, self)

    def teleport_player(self):
        """Return to the debug spawn without changing input contracts."""
        self.player.position.update(MARSH_SPAWN)
        self.camera.follow(self.player.rect())
'''

[[lessons.artifactSteps]]
id = "s03-test-scene-boundaries"
path = "tests/test_scene.py"
mode = "write"
instruction = "Create scene tests for spawn collision, update/render separation, and canonical teleport state."
content = '''
"""Tests for the prototype marsh scene boundary."""

import pygame

from hollowmere.scene import MarshScene


def test_scene_blocks_player_at_spawn_bank():
    scene = MarshScene((960, 540))
    scene.update({"right": True}, 0.5)
    assert scene.player.rect().topleft == (96, 64)


def test_render_does_not_change_world_position():
    scene = MarshScene((320, 180))
    screen = pygame.Surface((320, 180))
    before = scene.player.position.copy()
    scene.render(screen)
    assert scene.player.position == before


def test_debug_teleport_restores_canonical_spawn():
    scene = MarshScene((320, 180), debug=True)
    scene.player.position.update(700, 500)
    scene.teleport_player()
    assert scene.player.position == pygame.Vector2(96, 64)
'''

[[lessons.artifactSteps]]
id = "s03-test-debug-teleport-input"
path = "tests/test_input.py"
mode = "append"
instruction = "Append proof that T is ignored ordinarily and becomes a one-shot request only in explicit debug input mode."
content = '''


def test_teleport_key_is_debug_only_and_one_shot():
    ordinary = InputState()
    ordinary.handle_event(key_event(pygame.KEYDOWN, pygame.K_t))
    assert ordinary.consume_debug_teleport() is False

    debug = InputState(allow_debug=True)
    debug.handle_event(key_event(pygame.KEYDOWN, pygame.K_t))
    assert debug.consume_debug_teleport() is True
    assert debug.consume_debug_teleport() is False
'''

