[[lessons]]
id = "s03-l04"
title = "Give the Marsh One Scene Boundary"
teaches = ["stable-scene-update-render", "debug-overlay-boundary"]
body = '''
<p>A real-time scene has two public jobs. <code>update(actions, dt)</code> changes world state; <code>render(screen)</code> observes that state and draws a view. Hollowmere's <code>MarshScene</code> owns the Player roster, CollisionWorld, Camera, and whether debugging is active. The app loop does not reach inside to resolve walls or calculate camera coordinates.</p>
<pre><code data-kind="patch">def update(self, actions, dt):
    displacement = self.player.displacement(actions, dt)
    self.world.move(self.player, displacement)
    self.camera.follow(self.player.rect())

def render(self, screen):
    screen.fill(BACKGROUND_COLOR)
    for solid in self.world.solids:
        pygame.draw.rect(screen, WALL_COLOR, self.camera.apply_rect(solid))</code></pre>
<p>The order is part of the contract. Update calculates one displacement from the already-named actions and seconds-based dt, resolves it in world space, then follows the final player body. Render clears the screen, converts solid and entity Rect copies through Camera, and draws them. It never changes <code>Player.position</code>. If camera follow ran before collision, the view could follow an unreachable intermediate point; if render wrote screen coordinates back, later collision would drift with the viewport.</p>
<p>The prototype marsh contains a wide vertical bank beginning at world (128, 64). The scene spawns the Wayfinder at (96, 64), exactly one 32-pixel body to its left. That geometry makes the collision observable without media. The colored player rectangle remains the intentional fallback, while wall rectangles expose the terrain contract that s04 will populate from a real Tiled map.</p>
<p>Debugging needs visible evidence without becoming game logic. <code>debug_enabled()</code> reads <code>HOLLOWMERE_DEBUG</code> from <code>os.environ</code>, removes surrounding whitespace with <code>strip()</code>, normalizes capitalization with <code>lower()</code>, and accepts only <code>1</code>, <code>true</code>, <code>yes</code>, or <code>on</code>. Missing or unfamiliar values are false. Environment variables are outside-process string settings; they do not alter the saved world.</p>
<p>When enabled, <code>draw_debug_overlay</code> outlines world solids and the player after applying the Camera, then renders a coordinate label from real world, tile, and camera values. The function uses Pygame's bundled default font through <code>pygame.font.Font(None, 18)</code>; no media file is authored or required. A T key request is remembered only when <code>InputState(allow_debug=True)</code>, consumed once, and teleports to the canonical marsh spawn. In ordinary mode the same key does nothing.</p>
<p>The teleport is a temporary diagnostic aid, not a Player action and not an acceptance shortcut. It remains outside the four-action snapshot and is scheduled for removal in s08. That separation prevents later quests or saves from accidentally depending on a developer convenience.</p>
<div class="field-notes"><div class="fn-head">FIELD NOTES // DRAW THE TRUTH, DO NOT CHANGE IT</div>
<p>An overlay may reveal collision and coordinates. It must not repair them, advance time, or become required for ordinary play.</p></div>
'''

[[lessons.concepts]]
id = "stable-scene-update-render"
purpose = "Give the app loop one scene interface that updates authoritative world state before rendering camera-transformed copies."
anatomy = "In update, compute Player displacement, resolve CollisionWorld movement, then follow the final Rect; in render, clear, transform/draw solids, transform/draw entities, and optionally overlay diagnostics."
example = "The complete update/render patch shows the public method boundary and the first world-to-screen wall drawing loop."
observable = "The ordinary scene blocks the Player at the bank, follows legal movement, and draws without changing Player.position during render."
failure = "Following before collision centers on an invalid point; changing state during render makes results depend on frame presentation; bypassing the scene tangles app.py with world rules."
practice = "s03-l04-d1"

