id = "s03"
codename = "CHAPTER III // MAKE THE MARSH SOLID"
short = "Make the Marsh Solid"
title = "Make the Marsh Solid"
build = "translate keyboard events into named actions, resolve axis-separated tile collisions, distinguish world/screen/tile coordinates, follow the player with a clamped camera, and expose debug overlays while preserving a stable update/render boundary."
brief = '''
<p>Moonwater becomes terrain when the Wayfinder can press against a bank and stop for a reason. Mara Venn now separates five things that a tiny prototype often tangles together: physical key events, action meanings, intended displacement, collision resolution, and the camera's view.</p>
<p>You will keep the section-two <code>Player</code>, four-action dictionary, seconds-based <code>dt</code>, package entrypoint, event drain, display flip, and guaranteed cleanup. Around them, you will build a solid marsh scene whose world coordinates survive camera motion, whose tile labels are derived rather than guessed, and whose collision/debug behavior can be proved without opening a display.</p>
'''

