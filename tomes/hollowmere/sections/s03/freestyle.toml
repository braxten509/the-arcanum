content = '''


def spatial_receipt():
    """Return the deterministic section-three spatial receipt."""
    scene = MarshScene((960, 540), debug=False)
    start_x = round(scene.player.position.x)
    scene.update({"right": True}, 0.5)
    body = scene.player.rect()
    tile = world_to_tile(scene.player.position)
    blocked = "right" if body.x == start_x else "none"
    debug_state = "on" if scene.debug else "off"
    return (
        f"S03_OK player={body.x},{body.y} tile={tile[0]},{tile[1]}"
        f" camera={round(scene.camera.offset.x)},{round(scene.camera.offset.y)}"
        f" blocked={blocked} debug={debug_state}"
    )
'''

