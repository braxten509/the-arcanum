id = "s03-reference-milestone-test"
path = "tests/milestones/test_s03.py"
mode = "write"
instruction = "Privately add the exact section-three milestone checks for spatial behavior and shared cleanup."
content = '''
"""Executable milestone for section s03."""

import pygame

from hollowmere.app import run_proof
from hollowmere.camera import world_to_tile
from hollowmere.scene import MarshScene, spatial_receipt


EXPECTED = (
    "S03_OK player=96,64 tile=3,2 camera=0,0"
    " blocked=right debug=off"
)


def test_spatial_receipt_uses_solid_scene_behavior():
    assert spatial_receipt() == EXPECTED
    scene = MarshScene((960, 540), debug=False)
    scene.update({"right": True}, 0.5)
    assert scene.player.rect().topleft == (96, 64)
    assert world_to_tile(scene.player.position) == (3, 2)
    assert scene.camera.offset == pygame.Vector2(0, 0)
    assert scene.debug is False


def test_section_three_proof_releases_pygame():
    assert not pygame.get_init()
    assert run_proof("s03") == EXPECTED
    assert not pygame.get_init()
'''

