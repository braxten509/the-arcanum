[[lessons]]
id = "s04-l04"
title = "Let the Scene Read the Chart"
teaches = ["map-backed-scene-transition", "procedural-ground-layer-rendering"]
body = '''
<p><code>MarshScene</code> keeps its public <code>update(actions, dt)</code> and <code>render(screen)</code> boundary. Only the source of its world contracts changes. Construction creates a <code>MapLoader(Path.cwd())</code>, loads <code>prototype_marsh</code>, looks up <code>marsh_entry</code>, and builds CollisionWorld and Camera from LoadedMap.size and LoadedMap.collisions. The old <code>MARSH_SOLIDS</code> tuple retires; there is now one collision truth in Tiled.</p>
<pre><code data-kind="patch">loaded = self.map_loader.load(map_id)
spawn = loaded.spawn_position(spawn_id)
self.loaded_map = loaded
self.world = CollisionWorld(loaded.size, loaded.collisions)
self.camera = Camera(self.viewport_size, loaded.size)
self.player.position.update(spawn)</code></pre>
<p>The order prevents partial transitions. Loading and spawn lookup must succeed before scene fields are replaced. If the target map or spawn is invalid, MapLoadError leaves the prior scene usable and names the broken content. <code>change_map(map_id, spawn_id)</code> is the stable scene-transition boundary that persistence will reuse in s08 and the connected registry will extend in s10.</p>
<p>After collision and movement, update calls <code>loaded_map.transition_for(player.rect())</code>. When it returns a record, the scene changes to its target ids and stores that record as <code>last_transition</code> for observable feedback and proof. The prototype doorway loops back to the same map's entry spawn, making the transition playable without inventing a second unfinished map. Because the spawn is far from the doorway, it does not retrigger on the next frame.</p>
<p>The Ground tile layer contains no image gids, so rendering uses a procedural fallback tied to its real dimensions. <code>_render_ground</code> loops over map rows and columns, builds a world Rect from LoadedMap.tile_size, applies Camera, skips cells outside <code>screen.get_rect()</code>, and draws alternating marsh colors based on <code>(column + row) % 2</code>. The remainder operator <code>%</code> returns what remains after division; even/odd parity creates a readable grid.</p>
<p>This is not generated media. It is runtime shape drawing, like the player fallback, and it lets collision, coordinates, and transitions work before a human chooses artwork. Later optional tilesets need an asset guide and credits; missing referenced files must still fail at MapLoader. Ground draws first, collision banks second, entities third, and debug outlines/labels last, preserving Tiled's semantic layer order.</p>
<p>The debug overlay now outlines transition Rects as well as solids. It reads LoadedMap data and Camera copies; it never changes a target or causes a transition. The debug T teleport now calls <code>spawn_position(self.spawn_id)</code>, so it follows the current map rather than a stale config tuple.</p>
<div class="field-notes"><div class="fn-head">FIELD NOTES // DATA CHANGES, PORTS HOLD</div>
<p>The scene does not care whether one or twenty TMX files exist. It asks the same loader for ids, geometry, and destinations.</p></div>
'''

