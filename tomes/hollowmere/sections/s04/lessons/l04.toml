content = '''
class MarshScene:
    """Own one loaded map's update and rendering boundaries."""

    def __init__(
        self,
        viewport_size,
        player=None,
        debug=False,
        map_loader=None,
        map_id="prototype_marsh",
        spawn_id="marsh_entry",
    ):
        self.viewport_size = viewport_size
        self.map_loader = map_loader or MapLoader(Path.cwd())
        self.player = player or Player(position=(0, 0))
        self.entities = [self.player]
        self.debug = debug
        self.last_transition = None
        self.change_map(map_id, spawn_id)

    def change_map(self, map_id, spawn_id):
        """Validate and activate a map/spawn pair atomically."""
        loaded = self.map_loader.load(map_id)
        spawn = loaded.spawn_position(spawn_id)
        world = CollisionWorld(loaded.size, loaded.collisions)
        camera = Camera(self.viewport_size, loaded.size)
        self.loaded_map = loaded
        self.map_id = map_id
        self.spawn_id = spawn_id
        self.world = world
        self.camera = camera
        self.player.position.update(spawn)
        self.camera.follow(self.player.rect())

    def update(self, actions, dt):
        """Advance world state and traverse an overlapping doorway."""
        displacement = self.player.displacement(actions, dt)
        self.world.move(self.player, displacement)
        transition = self.loaded_map.transition_for(self.player.rect())
        if transition is not None:
            self.change_map(
                transition["target_map"],
                transition["target_spawn"],
            )
            self.last_transition = transition
        else:
            self.camera.follow(self.player.rect())

    def _render_ground(self, screen):
        tile_width, tile_height = self.loaded_map.tile_size
        screen_rect = screen.get_rect()
        for row in range(self.loaded_map.tiled_map.height):
            for column in range(self.loaded_map.tiled_map.width):
                world_rect = pygame.Rect(
                    column * tile_width,
                    row * tile_height,
                    tile_width,
                    tile_height,
                )
                screen_rect_for_tile = self.camera.apply_rect(world_rect)
                if not screen_rect_for_tile.colliderect(screen_rect):
                    continue
                color = (
                    GROUND_COLOR
                    if (column + row) % 2 == 0
                    else GROUND_ALT_COLOR
                )
                pygame.draw.rect(screen, color, screen_rect_for_tile)

    def render(self, screen):
        """Draw loaded layers without changing authoritative state."""
        screen.fill(BACKGROUND_COLOR)
        self._render_ground(screen)
        for solid in self.world.solids:
            pygame.draw.rect(
                screen,
                WALL_COLOR,
                self.camera.apply_rect(solid),
            )
        for entity in self.entities:
            pygame.draw.rect(
                screen,
                PLAYER_COLOR,
                self.camera.apply_rect(entity.rect()),
            )
        if self.debug:
            draw_debug_overlay(screen, self)

    def teleport_player(self):
        """Return to the current map's debug spawn."""
        self.player.position.update(
            self.loaded_map.spawn_position(self.spawn_id)
        )
        self.camera.follow(self.player.rect())
'''

