id = "s04-test-scene-map-transition"
path = "tests/test_scene.py"
mode = "append"
instruction = "Append proof that MarshScene uses the TMX geometry and crosses causeway_gate through stable target ids."
content = '''


def test_scene_uses_loaded_map_and_doorway_contract():
    scene = MarshScene((960, 540))
    assert scene.map_id == "prototype_marsh"
    assert len(scene.world.solids) == 2
    doorway = scene.loaded_map.transitions[0]
    scene.player.position.update(doorway["rect"].topleft)
    scene.update({}, 0.0)
    assert scene.player.rect().topleft == (96, 64)
    assert scene.last_transition["id"] == "causeway_gate"
'''

