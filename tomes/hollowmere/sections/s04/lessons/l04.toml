id = "s04-l04-w1"
type = "write"
points = 35
prompt = "For a 3-column by 2-row Ground layer, append (column, row, color) records using reed when (column + row) % 2 is zero and moss otherwise. Print exactly <code>CELLS 6 FIRST 0,0:reed LAST 2,1:moss</code>."
expect = '''
CELLS 6 FIRST 0,0:reed LAST 2,1:moss
'''
solution = '''
cells = []
for row in range(2):
    for column in range(3):
        color = "reed" if (column + row) % 2 == 0 else "moss"
        cells.append((column, row, color))

first = cells[0]
last = cells[-1]
print(
    "CELLS",
    len(cells),
    "FIRST",
    f"{first[0]},{first[1]}:{first[2]}",
    "LAST",
    f"{last[0]},{last[1]}:{last[2]}",
)
'''
hint = "Nest row then column loops, choose color with parity, and format the first and last tuple fields."
