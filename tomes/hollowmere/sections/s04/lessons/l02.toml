[[lessons]]
id = "s04-l02"
title = "Load the Map or Name the Fault"
teaches = ["project-relative-map-loader", "map-load-error-boundary"]
body = '''
<p>The editor saves a file; the game needs a controlled loading boundary. <code>pathlib.Path</code> represents a filesystem path without manual slash rules. <code>Path.cwd()</code> returns the current project root when Hollowmere is launched as taught. The <code>/</code> operator joins path parts, so <code>root / "maps" / "prototype_marsh.tmx"</code> produces the platform-correct location. <code>is_file()</code> checks that a regular file exists before pytmx receives it.</p>
<pre><code data-kind="runnable">from pathlib import Path

root = Path.cwd()
map_path = root / "maps" / "prototype_marsh.tmx"
print("MAP_PATH", map_path.name, "PRESENT", map_path.is_file())</code></pre>
<p>From the completed project root the output ends with <code>MAP_PATH prototype_marsh.tmx PRESENT True</code>. Running from another directory produces false; that is a working-directory diagnosis, not a reason to copy the map beside the script. The one-map <code>MAP_PATHS</code> dictionary maps stable map ids to project-relative Path values. Later s10 grows that registry without changing <code>MapLoader.load(map_id)</code>.</p>
<p><code>pytmx.TiledMap(str(path))</code> parses TMX metadata without requiring a Pygame display. The call converts Path to a string because pytmx's documented API accepts a filename. The returned object owns map dimensions, tile dimensions, ordered layers, objects, and <code>properties</code>. <code>LoadedMap</code> copies only Hollowmere's public meanings so scene code does not depend on every parser detail.</p>
<p>Failures cross one explicit exception boundary. <code>MapLoadError</code> is Hollowmere's domain error. An unknown registry id reports that id. A missing TMX reports the project-relative file. A <code>FileNotFoundError</code> raised while parsing can also mean a referenced external tileset or asset is absent, so the message names the map and missing reference. Other <code>OSError</code> or <code>ValueError</code> failures are wrapped with <code>raise MapLoadError(...) from error</code>. The <code>from</code> clause preserves the original exception as the cause, so a traceback shows both the friendly boundary and the low-level clue.</p>
<p>After parsing, validation checks the declared <code>map_id</code> and every required layer name before the scene sees the map. A wrong property or missing layer is structurally valid XML but invalid Hollowmere content. Failing at load time is better than a later AttributeError during collision. Error messages include the stable id and missing contract name so the Wayfinder knows whether to fix Tiled data, the project path, or Python code.</p>
<div class="field-notes"><div class="fn-head">FIELD NOTES // WRAP, DO NOT ERASE</div>
<p>A domain error explains what Hollowmere expected. Exception chaining retains what the parser actually observed.</p></div>
'''

