[[lessons.artifactSteps]]
id = "s04-create-map-loader"
path = "src/hollowmere/maps.py"
mode = "write"
instruction = "Create maps.py with the stable one-map registry, project-root resolution, pytmx parsing, metadata validation, and chained MapLoadError diagnostics."
content = '''
"""Validated pytmx loading for Hollowmere maps."""

from pathlib import Path

import pytmx


REQUIRED_LAYERS = ("Ground", "Collision", "Spawns", "Transitions")
MAP_PATHS = {"prototype_marsh": Path("maps") / "prototype_marsh.tmx"}


class MapLoadError(RuntimeError):
    """Report a map contract failure at the loading boundary."""


class LoadedMap:
    """Own validated map metadata before geometry extraction."""

    def __init__(self, map_id, path, tiled_map):
        self.map_id = map_id
        self.path = path
        self.tiled_map = tiled_map
        self.layer_names = []
        for layer in tiled_map.layers:
            self.layer_names.append(layer.name)


class MapLoader:
    """Resolve stable map ids and validate TMX structure."""

    def __init__(self, project_root):
        self.project_root = Path(project_root)

    def load(self, map_id):
        """Load one known map or raise a specific MapLoadError."""
        relative_path = MAP_PATHS.get(map_id)
        if relative_path is None:
            raise MapLoadError(f"unknown map id: {map_id}")
        path = self.project_root / relative_path
        if not path.is_file():
            raise MapLoadError(f"map file is missing: {relative_path}")
        try:
            tiled_map = pytmx.TiledMap(str(path))
        except FileNotFoundError as error:
            raise MapLoadError(
                f"map or referenced asset is missing for {map_id}: {error}"
            ) from error
        except (OSError, ValueError) as error:
            raise MapLoadError(f"could not parse map {map_id}: {error}") from error

        declared_id = tiled_map.properties.get("map_id")
        if declared_id != map_id:
            raise MapLoadError(
                f"map_id property must be {map_id!r}, got {declared_id!r}"
            )
        layer_names = []
        for layer in tiled_map.layers:
            layer_names.append(layer.name)
        for layer_name in REQUIRED_LAYERS:
            if layer_name not in layer_names:
                raise MapLoadError(
                    f"map {map_id} is missing required layer: {layer_name}"
                )
        return LoadedMap(map_id, path, tiled_map)
'''

[[lessons.artifactSteps]]
id = "s04-test-map-loader-boundary"
path = "tests/test_maps.py"
mode = "write"
instruction = "Create map-loader tests for the real prototype plus unknown-id and missing-file diagnostics."
content = '''
"""Tests for validated TMX map loading."""

from pathlib import Path

import pytest

from hollowmere.maps import MapLoadError, MapLoader


def test_real_prototype_loads_required_layers():
    loaded = MapLoader(Path.cwd()).load("prototype_marsh")
    assert loaded.map_id == "prototype_marsh"
    assert loaded.layer_names == [
        "Ground",
        "Collision",
        "Spawns",
        "Transitions",
    ]


def test_unknown_map_id_is_specific():
    with pytest.raises(MapLoadError, match="unknown map id: drowned_road"):
        MapLoader(Path.cwd()).load("drowned_road")


def test_missing_project_map_is_specific(tmp_path):
    with pytest.raises(MapLoadError, match="map file is missing"):
        MapLoader(tmp_path).load("prototype_marsh")
'''

