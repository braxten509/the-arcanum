[[lessons.artifactSteps]]
id = "s04-extend-map-contract-tests"
path = "tests/test_maps.py"
mode = "append"
instruction = "Append real geometry/spawn/transition checks plus a missing-layer fixture diagnostic."
content = '''


def test_real_prototype_extracts_world_contracts():
    loaded = MapLoader(Path.cwd()).load("prototype_marsh")
    assert loaded.size == (1280, 960)
    assert len(loaded.collisions) == 2
    assert loaded.spawn_position("marsh_entry") == (96.0, 64.0)
    doorway = loaded.transition_for(loaded.transitions[0]["rect"])
    assert doorway["id"] == "causeway_gate"
    assert doorway["target_map"] == "prototype_marsh"
    assert doorway["target_spawn"] == "marsh_entry"


def test_missing_required_layer_names_the_contract(monkeypatch):
    from hollowmere import maps

    monkeypatch.setitem(
        maps.MAP_PATHS,
        "broken_fixture",
        Path("tests/fixtures/missing_layers.tmx"),
    )
    with pytest.raises(MapLoadError, match="missing required layer: Collision"):
        MapLoader(Path.cwd()).load("broken_fixture")
'''

