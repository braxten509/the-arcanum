[[lessons]]
id = "s04-l03"
title = "Turn Objects into World Contracts"
teaches = ["tmx-object-geometry-extraction", "named-spawn-transition-records"]
body = '''
<p>pytmx exposes Tiled objects with pixel attributes such as <code>x</code>, <code>y</code>, <code>width</code>, and <code>height</code>. Hollowmere copies those values into its own Pygame and Python shapes during loading. That copy is a boundary: CollisionWorld receives ordinary <code>pygame.Rect</code> values, Camera receives the map's pixel extent, and later saves retain stable ids rather than parser objects.</p>
<pre><code data-kind="runnable">import os

os.environ["PYGAME_HIDE_SUPPORT_PROMPT"] = "1"

import pygame

object_values = {"x": 128.0, "y": 64.0, "width": 160.0, "height": 96.0}
body = pygame.Rect(
    round(object_values["x"]),
    round(object_values["y"]),
    round(object_values["width"]),
    round(object_values["height"]),
)
print(body)</code></pre>
<p>The receipt is <code>&lt;rect(128, 64, 160, 96)&gt;</code>. Collision and transition objects must have positive width and height; a point belongs on Spawns instead. Rejecting malformed shapes while the filename and object name are available gives a better diagnosis than letting a zero-area body disappear during play.</p>
<p><code>LoadedMap</code> calculates <code>size</code> from map width times tile width and map height times tile height. It retrieves each required object layer by its canonical name. Every Collision object becomes a Rect in the <code>collisions</code> list. Every Spawns object must have a nonblank, unique <code>name</code>; the <code>spawns</code> dictionary maps that id to a floating-point position tuple. <code>spawn_position(spawn_id)</code> returns the pair or raises MapLoadError with both missing spawn and map id.</p>
<p>A transition is a keyed record because it carries several meanings: <code>id</code>, world Rect, <code>target_map</code>, and <code>target_spawn</code>. <code>object.properties.get(...)</code> reads the custom values set in Tiled. Blank names or properties fail during load. <code>transition_for(body)</code> loops through records and returns the first whose Rect overlaps the Player body, otherwise <code>None</code>. Returning None is an ordinary “not at a doorway” state; malformed doorway data is an exception.</p>
<p>The distinction matters for later persistence. A save can store <code>map_id="prototype_marsh"</code> and <code>spawn_id="marsh_entry"</code>; it should never serialize an absolute path, pytmx layer object, or screen coordinate. s10 will replace this one-map fixture with connected maps through the same loader and records, and s11's new dungeon must satisfy these same documented names and properties.</p>
<p>Tests inspect the real TMX, plus a tiny malformed fixture under <code>tests/fixtures</code>. Fixtures remain test-only evidence and never become selectable game maps. A missing Collision layer should name that layer in MapLoadError before any MarshScene is constructed.</p>
<div class="field-notes"><div class="fn-head">FIELD NOTES // COPY MEANING, NOT LIBRARY SHAPE</div>
<p>pytmx parses Tiled. LoadedMap translates its result into Hollowmere's stable geometry and id vocabulary.</p></div>
'''

