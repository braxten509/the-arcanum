content = '''
class LoadedMap:
    """Translate validated pytmx data into Hollowmere contracts."""

    def __init__(self, map_id, path, tiled_map):
        self.map_id = map_id
        self.path = path
        self.tiled_map = tiled_map
        self.layer_names = []
        for layer in tiled_map.layers:
            self.layer_names.append(layer.name)
        self.size = (
            tiled_map.width * tiled_map.tilewidth,
            tiled_map.height * tiled_map.tileheight,
        )
        self.tile_size = (tiled_map.tilewidth, tiled_map.tileheight)
        self.collisions = self._collision_rects()
        self.spawns = self._spawn_records()
        self.transitions = self._transition_records()

    def _object_rect(self, layer_name, map_object):
        if map_object.width <= 0 or map_object.height <= 0:
            raise MapLoadError(
                f"{layer_name} object {map_object.name!r} needs positive size"
            )
        return pygame.Rect(
            round(map_object.x),
            round(map_object.y),
            round(map_object.width),
            round(map_object.height),
        )

    def _collision_rects(self):
        rectangles = []
        layer = self.tiled_map.get_layer_by_name("Collision")
        for map_object in layer:
            rectangles.append(self._object_rect("Collision", map_object))
        return rectangles

    def _spawn_records(self):
        spawns = {}
        layer = self.tiled_map.get_layer_by_name("Spawns")
        for map_object in layer:
            spawn_id = str(map_object.name or "").strip()
            if not spawn_id:
                raise MapLoadError(f"map {self.map_id} has a spawn without a name")
            if spawn_id in spawns:
                raise MapLoadError(f"duplicate spawn id: {spawn_id}")
            spawns[spawn_id] = (float(map_object.x), float(map_object.y))
        return spawns

    def _transition_records(self):
        transitions = []
        layer = self.tiled_map.get_layer_by_name("Transitions")
        for map_object in layer:
            transition_id = str(map_object.name or "").strip()
            if not transition_id:
                raise MapLoadError(
                    f"map {self.map_id} has a transition without a name"
                )
            target_map = str(
                map_object.properties.get("target_map") or ""
            ).strip()
            target_spawn = str(
                map_object.properties.get("target_spawn") or ""
            ).strip()
            if not target_map or not target_spawn:
                raise MapLoadError(
                    f"transition {transition_id} needs target_map and target_spawn"
                )
            transitions.append(
                {
                    "id": transition_id,
                    "rect": self._object_rect("Transitions", map_object),
                    "target_map": target_map,
                    "target_spawn": target_spawn,
                }
            )
        return transitions

    def spawn_position(self, spawn_id):
        """Return a named world spawn or fail at the map boundary."""
        position = self.spawns.get(spawn_id)
        if position is None:
            raise MapLoadError(
                f"unknown spawn id {spawn_id!r} in map {self.map_id}"
            )
        return position

    def transition_for(self, body):
        """Return the first doorway record overlapping a world Rect."""
        for transition in self.transitions:
            if body.colliderect(transition["rect"]):
                return transition
        return None
'''

