[[lessons.readings]]
label = "Tiled manual — Creating a map"
url = "https://doc.mapeditor.org/en/stable/manual/introduction/#creating-a-new-map"

[[lessons.readings]]
label = "Tiled manual — Layer types"
url = "https://doc.mapeditor.org/en/stable/manual/layers/"

[[lessons.exercises]]
id = "s04-l01-d1"
type = "type"
points = 12
reps = 2
prompt = "Retype the complete stable layer-name tuple used by the loader."
code = '''
REQUIRED_LAYERS = ("Ground", "Collision", "Spawns", "Transitions")
'''

[[lessons.exercises]]
id = "s04-l01-e1"
type = "mc"
points = 15
prompt = "Where should a rectangular impassable bank be authored?"
choices = ["As a renamed Python variable", "On the Collision object layer", "As the map_id property", "Inside the Spawns point layer"]
answer = 1
whyWrong = "Python variables bypass Tiled, map_id identifies the whole map, and Spawns contains named locations. Solid rectangles belong to Collision."
hint = "Choose the layer whose public name describes world geometry Player cannot cross."
explain = "The loader converts each rectangle on that layer into a pygame.Rect for CollisionWorld."

[[lessons.exercises]]
id = "s04-l01-e2"
type = "text"
points = 20
prompt = "What stable map property value identifies the prototype file to registries and later saves?"
answer = "prototype_marsh"
hint = "Read the map_id property, not the filename extension or display title."
whyWrong = "The stable value is lowercase with an underscore; the path and human chapter name are separate concerns."

[[lessons.exercises]]
id = "s04-l01-w1"
type = "write"
points = 35
prompt = "Create the ordered layer list Ground, Collision, Spawns, Transitions; create map_id prototype_marsh; print exactly <code>MAP prototype_marsh LAYERS 4 LAST Transitions</code>."
expect = '''
MAP prototype_marsh LAYERS 4 LAST Transitions
'''
solution = '''
map_id = "prototype_marsh"
layers = ["Ground", "Collision", "Spawns", "Transitions"]
print("MAP", map_id, "LAYERS", len(layers), "LAST", layers[-1])
'''
hint = "Use len for the count and index -1 for the final layer name."
