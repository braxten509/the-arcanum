[[lessons]]
id = "s04-l01"
title = "Open the Cartographer's Real Desk"
teaches = ["tool-tiled-map-workflow", "tmx-layer-identifier-contract"]
body = '''
<p>Tiled is a separate desktop level editor, not a Python package. Install the current stable build from the official Tiled site for your operating system, launch it, and use <strong>File → Open File</strong> to open <code>maps/prototype_marsh.tmx</code> from the Hollowmere project root. The editor should show a 40×30 orthogonal grid with 32-pixel cells and four layers in this exact order: <code>Ground</code>, <code>Collision</code>, <code>Spawns</code>, and <code>Transitions</code>. Save with Ctrl+S after edits; an unsaved star in the title bar means pytmx still reads the older disk file.</p>
<p>TMX is Tiled's XML text format. The opening <code>&lt;map&gt;</code> element records orientation, dimensions, and tile size as attributes. Its <code>map_id</code> custom property is <code>prototype_marsh</code>. A property is named data attached to a map or object; code reads it by key. Stable lowercase ids survive display-name changes and later become save/registry keys.</p>
<pre><code data-kind="pseudocode">map property: map_id = prototype_marsh
tile layer: Ground
object layer: Collision
object layer: Spawns
object layer: Transitions</code></pre>
<p><code>Ground</code> is a tile layer. Its 1,200 zero global tile ids mean “no image tile,” so Hollowmere renders a procedural reed-grid fallback and needs no authored or downloaded media. The other three are object layers. Rectangle objects in Collision define solid pixel areas. The point named <code>marsh_entry</code> defines a spawn. The rectangle named <code>causeway_gate</code> defines a doorway and carries <code>target_map</code> and <code>target_spawn</code> properties.</p>
<p>In Tiled, select a layer in the Layers panel before editing it. Use the rectangle tool on Collision or Transitions and the point tool on Spawns. Select an object to edit its Name and Custom Properties. Do not rename the four layers casually: Python treats their capitalization as a contract. A collision rectangle on Ground is merely data the loader ignores; a misspelled <code>collision</code> layer triggers a missing-layer diagnostic.</p>
<p>Verification has two sides. First, reopen the saved file in Tiled and confirm the map property, four layer names, object names, and doorway properties. Second, run the loader tests from the activated project root. If Tiled reports malformed XML, use its line/column and undo the last structural edit. If Python reports a missing map, confirm the terminal root and exact <code>maps/prototype_marsh.tmx</code> path before changing code.</p>
<div class="field-notes"><div class="fn-head">FIELD NOTES // NAMES ARE PORTS</div>
<p>Layer order affects drawing, while layer and object ids affect meaning. Preserve both deliberately; neither is decorative.</p></div>
'''

[[lessons.concepts]]
id = "tool-tiled-map-workflow"
purpose = "Open, inspect, edit, save, and diagnose Hollowmere's real TMX level in the external Tiled editor."
anatomy = "Install Tiled; open the project-relative TMX; inspect map size/properties and Layers; select the correct layer; place/select objects; edit names/properties; save; reopen; run loader tests."
example = "The complete five-line map/layer ledger names the map property and four visible Tiled layers to inspect."
observable = "Tiled opens a 40×30 grid, shows four correctly ordered layers, and saved object/property changes are seen by the next Python load."
failure = "An unsaved star leaves disk unchanged; malformed XML produces a line/column error; opening the wrong copy makes editor and terminal disagree."
practice = "s04-l01-d1"

[[lessons.concepts]]
id = "tmx-layer-identifier-contract"
purpose = "Give map, layers, spawn, and doorway stable names that loader, saves, transitions, and later content can share."
anatomy = "Set map_id on the map; name Ground tile layer; name Collision, Spawns, and Transitions object layers; name each spawn/doorway; add target_map and target_spawn properties."
example = "prototype_marsh owns marsh_entry and causeway_gate, whose target properties point back to prototype_marsh:marsh_entry."
observable = "The loader can report four layers, two collision rectangles, one named spawn, and one fully described transition."
failure = "Wrong capitalization or a blank object name breaks lookup; missing target properties leave a doorway unable to choose a destination."
practice = "s04-l01-e2"

[[lessons.artifactSteps]]
id = "s04-create-prototype-tmx"
path = "maps/prototype_marsh.tmx"
