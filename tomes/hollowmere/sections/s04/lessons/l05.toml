[[lessons.artifactSteps]]
id = "s04-create-missing-asset-fixture"
path = "tests/fixtures/missing_asset.tmx"
mode = "write"
instruction = "Create a test-only TMX that references an absent external tileset so the chained asset-path diagnostic is preserved."
content = '''
<?xml version="1.0" encoding="UTF-8"?>
<map version="1.10" orientation="orthogonal" width="1" height="1" tilewidth="32" tileheight="32" infinite="0" nextlayerid="5" nextobjectid="1">
 <properties><property name="map_id" value="missing_asset"/></properties>
 <tileset firstgid="1" source="missing_tileset.tsx"/>
 <layer id="1" name="Ground" width="1" height="1"><data encoding="csv">0</data></layer>
 <objectgroup id="2" name="Collision"/>
 <objectgroup id="3" name="Spawns"/>
 <objectgroup id="4" name="Transitions"/>
</map>
'''

[[lessons.artifactSteps]]
id = "s04-test-map-diagnostics"
path = "tests/test_maps.py"
mode = "append"
instruction = "Append negative tests for missing transition properties and referenced external map assets."
content = '''


def test_transition_requires_both_target_properties(monkeypatch):
    from hollowmere import maps

    monkeypatch.setitem(
        maps.MAP_PATHS,
        "missing_transition_property",
        Path("tests/fixtures/missing_transition_property.tmx"),
    )
    with pytest.raises(
        MapLoadError,
        match="needs target_map and target_spawn",
    ):
        MapLoader(Path.cwd()).load("missing_transition_property")


def test_missing_referenced_asset_keeps_loader_context(monkeypatch):
    from hollowmere import maps

    monkeypatch.setitem(
        maps.MAP_PATHS,
        "missing_asset",
        Path("tests/fixtures/missing_asset.tmx"),
    )
    with pytest.raises(MapLoadError, match="referenced asset is missing"):
        MapLoader(Path.cwd()).load("missing_asset")
'''

