type = "text"
points = 20
prompt = "Which scene attribute retains the doorway record observed during the most recent transition?"
answer = "last_transition"
accept = ["scene.last_transition", "MarshScene.last_transition"]
hint = "Name the snake_case field the proof reads after scene.update."
whyWrong = "loaded_map owns all doorway definitions; the scene's observation field records only the one most recently traversed."

