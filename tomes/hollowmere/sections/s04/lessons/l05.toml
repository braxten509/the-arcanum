[[lessons.exercises]]
id = "s04-l05-w1"
type = "write"
points = 35
prompt = "Given layer names Ground, Collision, Spawns, Transitions and transition target ids prototype_marsh/marsh_entry, validate that all four required names are present, then print exactly <code>VALID True LAYERS 4 TARGET prototype_marsh:marsh_entry</code>."
starter = '''
required = ("Ground", "Collision", "Spawns", "Transitions")
layers = ["Ground", "Collision", "Spawns", "Transitions"]
target = {"map": "prototype_marsh", "spawn": "marsh_entry"}
'''
expect = '''
VALID True LAYERS 4 TARGET prototype_marsh:marsh_entry
'''
solution = '''
required = ("Ground", "Collision", "Spawns", "Transitions")
layers = ["Ground", "Collision", "Spawns", "Transitions"]
target = {"map": "prototype_marsh", "spawn": "marsh_entry"}
valid = True
for name in required:
    if name not in layers:
        valid = False
print(
    "VALID",
    valid,
    "LAYERS",
    len(layers),
    "TARGET",
    f'{target["map"]}:{target["spawn"]}',
)
'''
hint = "Start valid as True, loop through required names, set it False for an absence, then join target values with a colon."
