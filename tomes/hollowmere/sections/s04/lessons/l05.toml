type = "mc"
points = 15
prompt = "Which s04 proof step demonstrates the doorway rather than merely describing it?"
choices = ["Call scene.update after placing Player at the loaded transition Rect", "Assign scene.last_transition directly", "Print the target ids without loading", "Open Tiled and wait for a person"]
answer = 0
whyWrong = "Direct assignment and literal output manufacture evidence, while human observation is nondeterministic. Scene.update performs the real overlap and change_map path."
hint = "Choose the same transition query the ordinary frame uses."
