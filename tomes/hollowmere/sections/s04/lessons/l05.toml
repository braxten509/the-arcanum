[[lessons]]
id = "s04-l05"
title = "Reject a Lying Chart"
teaches = ["tmx-contract-regression-tests", "cumulative-map-proof"]
body = '''
<p>A map can be valid XML and still lie about the game contract. Regression fixtures make each failure observable before a human walks the level. Tiny files under <code>tests/fixtures</code> isolate one defect: a transition missing <code>target_spawn</code>, or a map referencing an absent external tileset. They are never added to MAP_PATHS for ordinary play; tests temporarily insert an id with pytest's <code>monkeypatch.setitem</code>, then automatic cleanup restores the registry.</p>
<pre><code data-kind="patch">monkeypatch.setitem(
    maps.MAP_PATHS,
    "missing_asset",
    Path("tests/fixtures/missing_asset.tmx"),
)
with pytest.raises(MapLoadError, match="referenced asset is missing"):
    MapLoader(Path.cwd()).load("missing_asset")</code></pre>
<p><code>with pytest.raises(...)</code> was introduced for invalid dt. Here it also checks a message fragment, making the diagnostic part of the public loader behavior. A test that accepts any exception would pass on an unrelated AttributeError and fail to prove the learner-facing clue. The missing-transition fixture reaches LoadedMap parsing and must name both required properties; the missing-asset fixture must retain the underlying filename through exception chaining.</p>
<p>The section proof exercises the successful path through the same public boundaries. It constructs MarshScene, reads the actual LoadedMap, chooses its first transition record, moves the Player body into that doorway, and calls <code>scene.update({}, 0.0)</code>. Zero dt means no movement intent, but update still performs the real transition query and <code>change_map</code>. The resulting <code>last_transition</code>, loaded map id, layers, collision count, and spawn id form the exact receipt.</p>
<p>Do not assign <code>last_transition</code> or return a hard-coded line. Those shortcuts would not load TMX, validate the target, relocate Player, or preserve scene ownership. The proof opens no display and requires no image asset. It is deterministic because the fixture, body position, action dictionary, and dt are controlled while domain methods remain real.</p>
<p><code>run_proof</code> gains an s04 branch inside the same Pygame init/try/finally switchboard. s01 startup, s02 movement, and s03 spatial collision remain active. The milestone asserts the exact receipt and Pygame cleanup. Run the complete pytest suite, then each proof id. Finally launch normally and walk to the causeway gate with HOLLOWMERE_DEBUG enabled once; the outline and coordinate label should show the same doorway the test used.</p>
<p>When a check fails, diagnose in layers: confirm project root and file path; open/save in Tiled; inspect map_id; compare layer capitalization; inspect object names and positive sizes; inspect transition properties; then read the chained parser cause for XML or asset paths. One targeted correction keeps the evidence useful.</p>
<div class="field-notes"><div class="fn-head">FIELD NOTES // BAD MAPS ARE TEST DATA</div>
<p>Malformed fixtures belong in tests because they teach and preserve diagnostics. They never become fallback gameplay content.</p></div>
'''

[[lessons.concepts]]
id = "tmx-contract-regression-tests"
purpose = "Prove that malformed layers, transition properties, files, and referenced assets fail at MapLoader with exact actionable diagnostics."
anatomy = "Keep tiny fixtures under tests/fixtures; temporarily register one id with monkeypatch; call MapLoader from project root; expect MapLoadError; match the contract-specific message; let monkeypatch restore state."
example = "The complete missing-asset test patch registers one fixture and asserts the loader's referenced-asset diagnostic."
observable = "pytest reports passing negative cases, and a deliberate fixture defect names the missing layer/property/path rather than crashing in MarshScene."
failure = "Catching any exception proves the wrong thing; adding broken fixtures to the game registry exposes them to players; omitting message checks allows vague regressions."
practice = "s04-l05-d1"

[[lessons.concepts]]
id = "cumulative-map-proof"
purpose = "Certify real TMX loading, object extraction, collision/spawn contracts, and a scene doorway transition while retaining s01–s03 proofs."
anatomy = "Construct MarshScene; read LoadedMap; place Player at a real transition Rect; call update with controlled empty actions and zero dt; read last_transition and loaded metadata; format exact receipt; route s04 under shared cleanup."
example = "The Working specifies the complete behavior path from prototype_marsh through causeway_gate back to marsh_entry."
observable = "The launcher prints exactly S04_OK with map, four layers, two collisions, spawn, and causeway_gate target, then exits with Pygame released."
failure = "Hard-coded metadata or last_transition assignment bypasses the loader/scene; opening a display adds environment timing; replacing the router can regress older receipts."
practice = "s04-l05-e1"

