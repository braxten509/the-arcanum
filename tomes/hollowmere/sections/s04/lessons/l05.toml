[[lessons.exercises]]
id = "s04-l05-e2"
type = "fill"
points = 20
prompt = "Complete the pytest helper that temporarily inserts a fixture id into MAP_PATHS."
code = '''
monkeypatch.____(maps.MAP_PATHS, "missing_asset", fixture_path)
'''
answer = "setitem"
whyWrong = "setattr changes an object attribute; this operation temporarily changes one dictionary key and restores it after the test."
hint = "Use the monkeypatch method whose name describes assigning a mapping item."

