id = "s04"
codename = "CHAPTER IV // CHART A LIVING WORLD"
short = "Chart a Living World"
title = "Chart a Living World"
build = "use real Tiled and pytmx to create, load, validate, and render a layered map with collision objects, named spawns, and a doorway transition, including clear diagnostics for missing files, layers, properties, and assets."
brief = '''
<p>The solid causeway is ready to leave Python source and become level data. Mara Venn opens the real Tiled editor and gives every layer, spawn, doorway, and map a stable name that code can validate instead of guess.</p>
<p>You will load one media-free TMX prototype through pytmx, translate its rectangles and properties into the existing CollisionWorld and Camera contracts, render its procedural Ground layer, and cross a data-defined doorway. Missing files, referenced assets, layers, ids, spawns, and transition properties must fail with precise <code>MapLoadError</code> messages while all earlier proofs remain exact.</p>
'''

[proof]
mode = "run"
expectedFiles = ["pyproject.toml", "requirements.txt", "main.py", "maps/prototype_marsh.tmx", "src/hollowmere/config.py", "src/hollowmere/entities.py", "src/hollowmere/input.py", "src/hollowmere/collision.py", "src/hollowmere/camera.py", "src/hollowmere/debug.py", "src/hollowmere/maps.py", "src/hollowmere/scene.py", "src/hollowmere/app.py", "src/hollowmere/__main__.py", "tests/test_diagnostics.py", "tests/test_entities.py", "tests/test_input.py", "tests/test_collision.py", "tests/test_camera.py", "tests/test_scene.py", "tests/test_maps.py", "tests/fixtures/missing_layers.tmx", "tests/fixtures/missing_transition_property.tmx", "tests/fixtures/missing_asset.tmx", "tests/milestones/test_s01.py", "tests/milestones/test_s02.py", "tests/milestones/test_s03.py", "tests/milestones/test_s04.py"]
runArgs = ["--arcanum-proof", "s04"]
expect = "S04_OK map=prototype_marsh layers=4 collisions=2 spawn=marsh_entry transition=causeway_gate->prototype_marsh:marsh_entry"
