content = '''
"""Executable milestone for section s04."""

import pygame

from hollowmere.app import run_proof
from hollowmere.scene import MarshScene, map_receipt


EXPECTED = (
    "S04_OK map=prototype_marsh layers=4 collisions=2"
    " spawn=marsh_entry"
    " transition=causeway_gate->prototype_marsh:marsh_entry"
)


def test_map_receipt_uses_loaded_scene_transition():
    assert map_receipt() == EXPECTED
    scene = MarshScene((960, 540), debug=False)
    assert scene.loaded_map.layer_names == [
        "Ground",
        "Collision",
        "Spawns",
        "Transitions",
    ]
    assert len(scene.loaded_map.collisions) == 2
    assert scene.loaded_map.spawn_position("marsh_entry") == (96.0, 64.0)
    doorway = scene.loaded_map.transitions[0]
    scene.player.position.update(doorway["rect"].topleft)
    scene.update({}, 0.0)
    assert scene.last_transition["id"] == "causeway_gate"


def test_section_four_proof_releases_pygame():
    assert not pygame.get_init()
    assert run_proof("s04") == EXPECTED
    assert not pygame.get_init()
'''

