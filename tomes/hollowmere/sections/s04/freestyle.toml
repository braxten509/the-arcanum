def map_receipt():
    """Return the deterministic section-four map receipt."""
    scene = MarshScene((960, 540), debug=False)
    loaded = scene.loaded_map
    doorway = loaded.transitions[0]
    scene.player.position.update(doorway["rect"].topleft)
    scene.update({}, 0.0)
    observed = scene.last_transition
    return (
        f"S04_OK map={scene.map_id} layers={len(loaded.layer_names)}"
        f" collisions={len(loaded.collisions)} spawn={scene.spawn_id}"
        f" transition={observed['id']}->{observed['target_map']}:"
        f"{observed['target_spawn']}"
    )
'''

