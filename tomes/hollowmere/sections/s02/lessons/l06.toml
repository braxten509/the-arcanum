[[lessons.exercises]]
id = "s02-l06-e2"
type = "fill"
points = 20
prompt = "Complete the safe snapshot of a mutable Vector2 before testing that no input preserves position."
code = "start = player.position.____()"
answer = "copy"
whyWrong = "A plain assignment aliases the same mutable Vector2, so it cannot preserve an independent before value."
hint = "Use the method whose result is a separate vector with equal components."

[[lessons.exercises]]
id = "s02-l06-w1"
type = "write"
points = 35
prompt = "Define <code>route(section)</code> so s01 returns <code>STARTUP</code>, s02 returns <code>MOVEMENT</code>, and any other value raises <code>ValueError('unsupported proof section: value')</code>. Call it with s02 and print exactly <code>PROOF MOVEMENT</code>."
expect = '''
PROOF MOVEMENT
'''
solution = '''
def route(section):
    if section == "s01":
        return "STARTUP"
    if section == "s02":
        return "MOVEMENT"
    raise ValueError(f"unsupported proof section: {section}")


print("PROOF", route("s02"))
'''
hint = "Use two explicit equality branches, then raise after both; print the result of route('s02')."
