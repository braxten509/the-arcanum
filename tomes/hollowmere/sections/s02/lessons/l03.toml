'''
content = '''
class Entity:
    """Own shared identity and geometry state."""

    def __init__(self, name, position, size):
        self.name = name
        self.position = position
        self.size = size

    def describe(self):
        """Return a compact state label."""
        return f"{self.name} at {self.position}"

    def rect(self):
        """Return the current integer rendering and collision body."""
        return pygame.Rect(
            round(self.position[0]),
            round(self.position[1]),
            self.size[0],
            self.size[1],
        )
'''

[[lessons.artifactSteps]]
id = "s02-add-player-subclass"
path = "src/hollowmere/entities.py"
mode = "append"
instruction = "Append Player as an Entity subclass with canonical defaults. Movement behavior arrives after vectors are introduced."
content = '''


class Player(Entity):
    """The learner-controlled Entity."""

    def __init__(
        self,
        position=PLAYER_START,
        speed=PLAYER_SPEED,
    ):
        super().__init__(PLAYER_NAME, position, PLAYER_SIZE)
        self.speed = speed
'''

