[[lessons]]
id = "s02-l03"
title = "A Wayfinder Is an Entity"
teaches = ["player-inherits-entity", "integer-rect-boundary"]
body = '''
<p>A player shares identity and geometry with every entity but adds player-specific defaults and behavior. <strong>Inheritance</strong> expresses that relationship. <code>class Player(Entity):</code> names <code>Entity</code> as the base class. Python looks for an attribute or method on <code>Player</code> first and then on <code>Entity</code>. This is an “is a” promise: every Player is usable where an Entity contract is expected.</p>
<pre><code data-kind="runnable">class Entity:
    def __init__(self, name):
        self.name = name

    def describe(self):
        return f"ENTITY {self.name}"


class Player(Entity):
    def __init__(self, name, speed):
        super().__init__(name)
        self.speed = speed


player = Player("Wayfinder", 180.0)
print(player.describe(), "SPEED", player.speed)</code></pre>
<p>The output is <code>ENTITY Wayfinder SPEED 180.0</code>. <code>super()</code> provides the base-class view for this instance; <code>super().__init__(name)</code> calls Entity's initializer so Player does not duplicate the name assignment. The next line adds only <code>speed</code>. Forgetting the super call leaves inherited methods present but required base attributes absent, producing <code>AttributeError</code> when <code>describe()</code> reads <code>self.name</code>.</p>
<p>Pygame draws and collides with integer rectangles. <code>pygame.Rect(left, top, width, height)</code> stores a rectangular area. Position means its top-left world coordinate; size means width then height. The <code>round</code> calls convert current numeric coordinates into integers only at this boundary. <code>rect.x</code>, <code>rect.y</code>, <code>rect.width</code>, and <code>rect.height</code> are readable attributes.</p>
<pre><code data-kind="runnable">import os

os.environ["PYGAME_HIDE_SUPPORT_PROMPT"] = "1"

import pygame

position = (100.4, 99.6)
size = (32, 32)
body = pygame.Rect(
    round(position[0]),
    round(position[1]),
    size[0],
    size[1],
)
print(body.x, body.y, body.width, body.height)</code></pre>
<p>The receipt is <code>100 100 32 32</code>. Keep fractional world position separate from the integer Rect; repeatedly replacing motion state with rounded pixels loses small movements. A negative width is technically constructible but unsuitable for the collision contract, so configuration owns positive dimensions.</p>
<p>The Player initializer uses default parameters from config. A default appears after <code>=</code> in the definition and is used only when the caller omits that argument. <code>Player()</code> therefore starts with the canonical name, position, size, and speed; tests can still supply another position explicitly. Explicit arguments override defaults without changing the shared configuration.</p>
<div class="field-notes"><div class="fn-head">FIELD NOTES // ONE BODY CONTRACT</div>
<p>Later NPCs and enemies inherit the same Entity constructor and <code>rect()</code> meaning. Parallel rectangle spellings would make collision code guess which geometry is real.</p></div>
'''

