[[lessons.exercises]]
id = "s02-l03-e1"
type = "mc"
points = 15
prompt = "Why does Player call <code>super().__init__(PLAYER_NAME, position, PLAYER_SIZE)</code>?"
choices = ["To create a second unrelated Entity", "To run Entity's ownership setup on this Player", "To turn speed into a tuple", "To open the Pygame display"]
answer = 1
whyWrong = "super does not create a second object, reshape speed, or touch the display. It applies the base initializer to the current Player instance."
hint = "Choose the purpose that preserves one object and reuses base-class setup."
explain = "The inherited constructor contract stays centralized in Entity."

