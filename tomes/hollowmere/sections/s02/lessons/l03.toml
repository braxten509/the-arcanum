[[lessons.exercises]]
id = "s02-l03-w1"
type = "write"
points = 34
prompt = "Define Entity with <code>name</code>, then Player(Entity) whose initializer calls super with <code>Wayfinder</code> and stores speed <code>180.0</code>. Print exactly <code>PLAYER Wayfinder SPEED 180.0</code> from one Player instance."
expect = '''
PLAYER Wayfinder SPEED 180.0
'''
solution = '''
class Entity:
    def __init__(self, name):
        self.name = name


class Player(Entity):
    def __init__(self):
        super().__init__("Wayfinder")
        self.speed = 180.0


player = Player()
print("PLAYER", player.name, "SPEED", player.speed)
'''
hint = "Player's super call supplies the inherited name before self.speed is assigned."
