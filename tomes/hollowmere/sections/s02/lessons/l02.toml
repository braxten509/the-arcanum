type = "fill"
points = 20
prompt = "Complete the instance attribute assignment that preserves the constructor parameter."
code = '''
def __init__(self, name):
    self.____ = name
'''
answer = "name"
whyWrong = "The left side must select the same canonical name attribute on self; a bare local would not survive initialization."
hint = "Use the parameter's spelling after self and the dot."

[[lessons.exercises]]
id = "s02-l02-e2"
type = "mc"
points = 15
prompt = 'What is <code>wayfinder</code> after <code>wayfinder = Entity("Wayfinder", (100, 100), (32, 32))</code>?'
choices = ["The Entity class definition", "A method with no owner", "An Entity instance with its own attributes", "A dictionary key"]
answer = 2
whyWrong = "Entity names the class and its call constructs an object. The assigned result is an instance, not a method or dictionary key."
hint = "Distinguish the reusable blueprint from one constructed object."
explain = "Each instance receives its own self during initialization."

[[lessons.exercises]]
id = "s02-l02-w1"
type = "write"
points = 32
prompt = "Define <code>Entity</code> with an initializer storing <code>name</code> and a <code>describe()</code> method returning <code>ENTITY name</code>. Construct one named Wayfinder and print exactly <code>ENTITY Wayfinder</code>."
expect = '''
ENTITY Wayfinder
'''
solution = '''
class Entity:
    def __init__(self, name):
        self.name = name

    def describe(self):
        return f"ENTITY {self.name}"


wayfinder = Entity("Wayfinder")
print(wayfinder.describe())
'''
hint = "Store self.name in __init__, return an f-string from describe, then call the method on the instance."
