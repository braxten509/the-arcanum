[[lessons]]
id = "s02-l02"
title = "Give State an Owner"
teaches = ["entity-class-constructor", "instance-attribute-method"]
body = '''
<p>A dictionary can describe one entity, but its keys and operations remain separate. A <strong>class</strong> defines a new kind of object that bundles state with behavior. Read <code>class Entity:</code> as the keyword, the CapWords class name, and the colon that opens its indented body. The method named <code>__init__</code> is the initializer Python calls after <code>Entity(...)</code> creates an <strong>instance</strong>.</p>
<pre><code data-kind="runnable">class Entity:
    def __init__(self, name, position):
        self.name = name
        self.position = position

    def describe(self):
        return f"{self.name} at {self.position}"


wayfinder = Entity("Wayfinder", (100, 100))
print(wayfinder.describe())</code></pre>
<p>The output is <code>Wayfinder at (100, 100)</code>. In a method definition, <code>self</code> is the instance receiving the call. The caller writes <code>Entity("Wayfinder", ...)</code>; Python supplies the new object as <code>self</code>. <code>self.name = name</code> stores the parameter on that object as an <strong>attribute</strong>. The dot in <code>wayfinder.name</code> selects it later. Forgetting <code>self.</code> creates only a local name that disappears when initialization returns.</p>
<p>A function defined inside a class is a <strong>method</strong>. <code>wayfinder.describe()</code> selects the bound method and calls it with the wayfinder instance automatically. Calling <code>Entity.describe(wayfinder)</code> is an explicit equivalent, but the dotted instance form states ownership more clearly. A missing pair of call parentheses leaves a method object instead of its result; printing it shows a representation such as <code>&lt;bound method ...&gt;</code>.</p>
<p>Each call constructs independent state. If <code>ferryman = Entity("Ferryman", (20, 50))</code>, changing <code>wayfinder.name</code> does not change <code>ferryman.name</code>. By contrast, if both instances receive the same mutable list, they share that list. Hollowmere uses fixed tuples at the constructor boundary now and will convert each position into its own Vector2 before movement. Inspect attributes on the instance that actually owns them.</p>
<p>The initializer accepts <code>name</code>, <code>position</code>, and <code>size</code> in one canonical order. Later enemies and NPCs will reuse that contract. The <code>describe</code> method is a temporary learning aid inside the entity model, but it is harmless and useful in diagnostics, so it may remain.</p>
<div class="field-notes"><div class="fn-head">FIELD NOTES // OWNERSHIP BEFORE INHERITANCE</div>
<p>Start with the smallest object that can state who owns each value. Inheritance is useful only after that base contract is clear.</p></div>
'''

[[lessons.concepts]]
id = "entity-class-constructor"
purpose = "Define one canonical Entity type and initialize independent name, position, and size state for every instance."
anatomy = "Write class Entity and colon; indent __init__; list self first, then constructor parameters; assign each parameter to a self attribute."
example = "The complete Entity example constructs Wayfinder at (100, 100) and calls describe."
observable = "The terminal prints Wayfinder at (100, 100)."
failure = "Omitting self from a method causes an argument-count TypeError; omitting self. from assignment fails to retain the value as instance state."
practice = "s02-l02-d1"

[[lessons.concepts]]
id = "instance-attribute-method"
purpose = "Read and change one entity's owned attributes and call behavior bound to that same object."
anatomy = "Construct an instance by calling the class; select an attribute with instance.name; select and call a method with instance.method()."
example = "wayfinder.describe() reads self.name and self.position from the instance and returns one f-string."
observable = "Two separately constructed entities retain different names and positions."
failure = "Forgetting method-call parentheses produces a bound-method object instead of executing the behavior."
practice = "s02-l02-e2"

[[lessons.artifactSteps]]
id = "s02-create-entity-model"
path = "src/hollowmere/entities.py"
mode = "write"
instruction = '''Create entities.py with the canonical base class. From the activated project, run python -c "from hollowmere.entities import Entity; print(Entity('Scout', (4, 8), (32, 32)).describe())".'''
content = '''
"""Entity and player state for Hollowmere."""


class Entity:
    """Own shared identity and geometry state."""

    def __init__(self, name, position, size):
        self.name = name
        self.position = position
        self.size = size

    def describe(self):
        """Return a compact state label."""
        return f"{self.name} at {self.position}"
'''

