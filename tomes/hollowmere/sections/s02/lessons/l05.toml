type = "mc"
points = 15
prompt = "Why does app.py convert physical keys into an action dictionary before calling Player.update?"
choices = ["It keeps Player independent of specific input devices", "It makes pygame.Rect store strings", "It replaces the event queue", "It initializes Pygame a second time"]
answer = 0
whyWrong = "The dictionary does not reshape Rect, poll window events, or initialize Pygame. It isolates device bindings from movement meaning."
hint = "Choose the boundary that lets tests drive Player without a keyboard."
explain = "Later remapping can change app.py's bindings while Player's public action contract remains stable."

[[lessons.exercises]]
id = "s02-l05-w1"
type = "write"
points = 35
prompt = "Given a <code>keys</code> dictionary whose keys are <code>a</code>, <code>left</code>, <code>d</code>, and <code>right</code>, build named left/right actions with alternate bindings and print exactly <code>LEFT True RIGHT False</code>."
starter = '''
keys = {"a": False, "left": True, "d": False, "right": False}
'''
expect = '''
LEFT True RIGHT False
'''
solution = '''
keys = {"a": False, "left": True, "d": False, "right": False}
actions = {
    "left": keys["a"] or keys["left"],
    "right": keys["d"] or keys["right"],
}
print("LEFT", actions["left"], "RIGHT", actions["right"])
'''
hint = "Combine each pair with or, then read the named action values in the required print order."
