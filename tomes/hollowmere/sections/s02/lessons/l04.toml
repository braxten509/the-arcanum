[[lessons]]
id = "s02-l04"
title = "Cross the Water at One Speed"
teaches = ["vector-normalized-direction", "delta-time-player-update"]
body = '''
<p>A position must support addition, scaling, and direction without turning movement code into separate x/y cases. <code>pygame.Vector2(x, y)</code> stores two numeric components. It can also copy a two-item tuple, so <code>pygame.Vector2((100.0, 100.0))</code> becomes a fresh mutable vector. Read its components as <code>position.x</code> and <code>position.y</code>. Adding vectors combines components; multiplying a vector by a number scales both. Adding a tuple directly to every kind of position invites inconsistent behavior, so Entity converts its constructor input once.</p>
<pre><code data-kind="runnable">import os

os.environ["PYGAME_HIDE_SUPPORT_PROMPT"] = "1"

import pygame

position = pygame.Vector2(100.0, 100.0)
direction = pygame.Vector2(1, 0)
position += direction * 180.0 * 0.5
print(round(position.x), round(position.y))</code></pre>
<p>The output is <code>190 100</code>: rightward direction multiplied by 180 pixels per second and half a second produces 90 pixels. The operators run left to right here, and <code>+=</code> updates the existing vector. A string or malformed one-item tuple cannot become a two-dimensional vector and raises <code>ValueError</code> or <code>TypeError</code>.</p>
<p>Keyboard actions become signed components with Boolean arithmetic. <code>int(True)</code> is 1 and <code>int(False)</code> is 0. Therefore <code>int(right) - int(left)</code> is 1, 0, or -1. The same subtraction makes the vertical component, with down positive. Simultaneous right and down creates <code>(1, 1)</code>, whose length is about 1.414. Without correction, diagonal motion would be faster than cardinal motion.</p>
<pre><code data-kind="runnable">import os

os.environ["PYGAME_HIDE_SUPPORT_PROMPT"] = "1"

import pygame

actions = {"left": False, "right": True, "up": False, "down": True}
direction = pygame.Vector2(
    int(actions.get("right", False)) - int(actions.get("left", False)),
    int(actions.get("down", False)) - int(actions.get("up", False)),
)
if direction.length_squared() &gt; 0:
    direction = direction.normalize()
print(round(direction.length(), 6))</code></pre>
<p>The result is <code>1.0</code>. <code>length_squared()</code> avoids a square root for the zero check. Calling <code>normalize()</code> on a zero vector raises <code>ValueError</code>, so the comparison must guard it. Normalization returns a new unit-length vector; it does not change the original unless assigned.</p>
<p><strong>Delta time</strong>, named <code>dt</code>, is elapsed frame time measured in seconds. The update equation is <code>position += direction * speed * dt</code>. Multiplication makes distance proportional to real time, so two half-second updates equal one full-second update. A negative elapsed time violates that contract and raises <code>ValueError</code>. Keep floating-point Vector2 state through updates and round only when <code>rect()</code> hands integer geometry to Pygame.</p>
<div class="field-notes"><div class="fn-head">FIELD NOTES // THE DIAGONAL OATH</div>
<p>Normalize direction before speed and time are applied. Normalizing the completed displacement would erase the intended distance.</p></div>
'''

