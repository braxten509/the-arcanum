content = '''
class Player(Entity):
    """The learner-controlled Entity."""

    def __init__(
        self,
        position=PLAYER_START,
        speed=PLAYER_SPEED,
    ):
        super().__init__(PLAYER_NAME, position, PLAYER_SIZE)
        self.speed = speed

    def movement_vector(self, actions):
        """Return a normalized direction from named action state."""
        horizontal = int(actions.get("right", False)) - int(
            actions.get("left", False)
        )
        vertical = int(actions.get("down", False)) - int(
            actions.get("up", False)
        )
        direction = pygame.Vector2(horizontal, vertical)
        if direction.length_squared() > 0:
            direction = direction.normalize()
        return direction

    def update(self, actions, dt):
        """Move through elapsed seconds using normalized direction."""
        if dt < 0:
            raise ValueError("dt must be nonnegative")
        self.position += self.movement_vector(actions) * self.speed * dt
'''

[[lessons.artifactSteps]]
id = "s02-test-player-motion"
path = "tests/test_entities.py"
mode = "write"
instruction = "Create focused movement tests, then run python -m pytest -q from the project root."
content = '''
"""Tests for Hollowmere entity geometry and movement."""

import pytest

from hollowmere.entities import Player


RIGHT = {"left": False, "right": True, "up": False, "down": False}
DOWN_RIGHT = {"left": False, "right": True, "up": False, "down": True}


def test_player_moves_by_speed_times_elapsed_seconds():
    player = Player()
    player.update(RIGHT, 0.5)
    assert player.position.x == pytest.approx(190.0)
    assert player.position.y == pytest.approx(100.0)
    assert player.rect().topleft == (190, 100)


def test_diagonal_direction_is_normalized():
    player = Player()
    direction = player.movement_vector(DOWN_RIGHT)
    assert direction.length() == pytest.approx(1.0)
'''

