[[lessons.exercises]]
id = "s02-l04-w1"
type = "write"
points = 35
prompt = "Using pygame.Vector2, create position (100, 100), normalize direction (1, 1), move at speed 100 for 0.5 seconds, and print exactly <code>MOVE 135.355 135.355 UNIT 1.0</code>."
expect = '''
MOVE 135.355 135.355 UNIT 1.0
'''
solution = '''
import os

os.environ["PYGAME_HIDE_SUPPORT_PROMPT"] = "1"

import pygame

position = pygame.Vector2(100, 100)
direction = pygame.Vector2(1, 1).normalize()
position += direction * 100 * 0.5
print(
    "MOVE",
    round(position.x, 3),
    round(position.y, 3),
    "UNIT",
    round(direction.length(), 1),
)
'''
hint = "Normalize before multiplying; round each position component to three places and length to one."
