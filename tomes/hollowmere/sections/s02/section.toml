id = "s02"
codename = "CHAPTER II // PUT A WAYFINDER IN MOTION"
short = "Put a Wayfinder in Motion"
title = "Put a Wayfinder in Motion"
build = "learn lists, dictionaries, tuples, classes, instances, methods, attributes, arithmetic/comparison/Boolean operators, vectors, rectangles, and frame-rate-independent movement through minimal observable examples, then build a controllable player and entity model with deterministic movement tests."
brief = '''
<p>The first lantern proved that Hollowmere could breathe. Now the empty window needs someone whose state has names, boundaries, and motion. Mara Venn will turn Python's collections and object model into one stable <code>Entity</code> base and a controllable <code>Player</code>.</p>
<p>You will trace each value from real keyboard state into a named action dictionary, normalize its direction, multiply by speed and elapsed seconds, and then derive an integer <code>pygame.Rect</code> for drawing and later collision. The solid diagnostic presentation retires here; the rectangle remains an intentional no-media fallback. Both the old startup proof and the new movement proof must stay exact.</p>
'''

[proof]
mode = "run"
expectedFiles = ["pyproject.toml", "requirements.txt", "main.py", "src/hollowmere/config.py", "src/hollowmere/entities.py", "src/hollowmere/app.py", "src/hollowmere/__main__.py", "tests/test_diagnostics.py", "tests/test_entities.py", "tests/milestones/test_s01.py", "tests/milestones/test_s02.py"]
runArgs = ["--arcanum-proof", "s02"]
expect = "S02_OK player=Wayfinder x=190 y=100 rect=32x32 diagonal=normalized"

