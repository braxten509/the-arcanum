content = '''
def run_proof(section):
    """Exercise a deterministic milestone without opening a display."""
    pygame.init()
    try:
        if section == "s01":
            return startup_receipt()
        if section == "s02":
            return movement_receipt()
        raise ValueError(f"unsupported proof section: {section}")
    finally:
        pygame.quit()
'''

