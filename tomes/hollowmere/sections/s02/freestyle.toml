id = "s02-reference-milestone-test"
path = "tests/milestones/test_s02.py"
mode = "write"
instruction = "Privately add the section-two milestone checks for exact behavior and shared Pygame cleanup."
content = '''
"""Executable milestone for section s02."""

import pygame
import pytest

from hollowmere.app import run_proof
from hollowmere.entities import Player, movement_receipt


EXPECTED = (
    "S02_OK player=Wayfinder x=190 y=100"
    " rect=32x32 diagonal=normalized"
)


def test_movement_receipt_uses_player_behavior():
    assert movement_receipt() == EXPECTED
    player = Player()
    player.update({"right": True}, 0.5)
    assert player.rect() == pygame.Rect(190, 100, 32, 32)
    direction = player.movement_vector({"right": True, "down": True})
    assert direction.length() == pytest.approx(1.0)


def test_section_two_proof_releases_pygame():
    assert not pygame.get_init()
    assert run_proof("s02") == EXPECTED
    assert not pygame.get_init()
'''

