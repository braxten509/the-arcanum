[[freestyle.referenceSteps]]
id = "s02-reference-add-movement-receipt"
path = "src/hollowmere/entities.py"
mode = "append"
instruction = "Privately add a section receipt derived from the public Player movement and Rect contracts."
content = '''


def movement_receipt():
    """Return the deterministic section-two movement receipt."""
    player = Player()
    actions = {"left": False, "right": True, "up": False, "down": False}
    player.update(actions, 0.5)
    body = player.rect()
    diagonal = player.movement_vector(
        {"left": False, "right": True, "up": False, "down": True}
    )
    diagonal_status = (
        "normalized"
        if round(diagonal.length(), 6) == 1.0
        else "invalid"
    )
    return (
        f"S02_OK player={player.name} x={body.x} y={body.y}"
        f" rect={body.width}x{body.height} diagonal={diagonal_status}"
    )
'''

