content = '''


def quest_receipt():
    """Return the deterministic section-five quest receipt."""
    scene = MarshScene((960, 540), debug=False)
    npc_id = scene.interact()
    scene.choose_dialogue(0)
    quest_id = "ferryman_oath"
    doorway = scene.loaded_map.transitions[0]
    scene.player.position.update(doorway["rect"].topleft)
    scene.update({}, 0.0)
    scene.interact()
    scene.choose_dialogue(0)
    progress = scene.quest_log.progress(quest_id)
    definition = scene.quest_log.definition(quest_id)
    dialogue = scene.interactions.dialogue
    return (
        f"S05_OK npc={npc_id} quest={quest_id}"
        f" state={progress.status.value}"
        f" objective={progress.count}/{definition.target}"
        f" reward={dialogue.last_reward} branch={dialogue.node_id}"
    )
'''

