content = '''
"""Executable milestone for section s05."""

import pygame

from hollowmere.app import run_proof
from hollowmere.quests import QuestStatus
from hollowmere.scene import MarshScene, quest_receipt


EXPECTED = (
    "S05_OK npc=ferryman quest=ferryman_oath state=complete"
    " objective=1/1 reward=reed_charm branch=thanks"
)


def test_quest_receipt_uses_dialogue_and_real_doorway_behavior():
    assert quest_receipt() == EXPECTED
    scene = MarshScene((960, 540), debug=False)
    assert scene.interact() == "ferryman"
    scene.choose_dialogue(0)
    progress = scene.quest_log.progress("ferryman_oath")
    assert progress.status is QuestStatus.ACTIVE
    doorway = scene.loaded_map.transitions[0]
    scene.player.position.update(doorway["rect"].topleft)
    scene.update({}, 0.0)
    assert progress.status is QuestStatus.READY
    scene.interact()
    scene.choose_dialogue(0)
    assert progress.status is QuestStatus.COMPLETE
    assert scene.quest_log.earned_rewards == ["reed_charm"]
    assert scene.interactions.dialogue.node_id == "thanks"


def test_section_five_proof_releases_pygame():
    assert not pygame.get_init()
    assert run_proof("s05") == EXPECTED
    assert not pygame.get_init()
'''

