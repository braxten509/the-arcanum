[[lessons]]
id = "s05-l02"
title = "Branch the Ferryman's Words"
teaches = ["data-driven-dialogue-graph", "quest-aware-dialogue-branching"]
body = '''
<p>Branching dialogue is a graph, not a tower of NPC-specific <code>if</code> statements. A graph contains nodes connected by choices. Each node has a stable id, speaker, text, and list of choices. Each choice has its own id and label, an optional action record, and the id of the next node. The same <code>DialogueSession</code> can traverse any graph with that shape.</p>
<pre><code data-kind="runnable">nodes = {
    "warning": {"choices": [{"id": "ask", "next": "answer"}]},
    "answer": {"choices": []},
}
node_id = "warning"
choice = nodes[node_id]["choices"][0]
node_id = choice["next"]
print("NODE", node_id)</code></pre>
<p>The receipt is <code>NODE answer</code>. Dictionary lookup follows declared ids; list index zero selects the first option. A missing next id would cause a later lookup failure, so <code>current_node()</code> raises <code>DialogueError</code> naming both NPC and node. Data still needs validation—moving decisions out of code does not make arbitrary records safe.</p>
<p><code>NPC_DIALOGUE</code> defines the temporary one-NPC conversation promised by the Arc. The <code>ferryman</code> record owns <code>quest_id="ferryman_oath"</code>, an <code>entry_by_status</code> mapping, and its nodes. Opening the conversation asks QuestLog for the current status string, then looks up the entry node. Inactive enters the offer, active enters a reminder, ready enters the reward, and complete enters thanks. There is no <code>if npc_id == "ferryman"</code> branch.</p>
<p>Choices contain generic action dictionaries. <code>{"kind": "start_quest", ...}</code> calls the log's start command; <code>claim_quest</code> calls claim and returns the reward id. A choice without an action only changes the node. <code>choose(index)</code> checks that a conversation is open and that the numeric index belongs to the current choice list before applying anything. This ordering prevents a bad key press from starting a quest.</p>
<p>Use stable ids for program meaning and prose strings for presentation. Future localization may rewrite “The planks remember every footfall” without changing <code>reminder</code>. s10 will move these Python dictionaries to validated JSON while retaining <code>DialogueSession.open()</code>, <code>current_node()</code>, and <code>choose()</code>. s11 can therefore add another condition and reward through data rather than editing traversal.</p>
<div class="field-notes"><div class="fn-head">FIELD NOTES // DATA CHOOSES THE ROAD</div><p>The engine validates and follows records. Content names which node, action, and destination each road carries.</p></div>
'''

