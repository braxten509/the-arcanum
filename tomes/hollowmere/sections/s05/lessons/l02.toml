[[lessons.artifactSteps]]
id = "s05-create-dialogue-graph"
path = "src/hollowmere/dialogue.py"
mode = "write"
instruction = "Create dialogue.py with the temporary ferryman graph, status-to-entry records, checked traversal, and generic quest action dispatch."
content = '''
"""Data-shaped dialogue graphs driven by authoritative quest state."""


class DialogueError(RuntimeError):
    """Report an unknown NPC, node, or choice."""


NPC_DIALOGUE = {
    "ferryman": {
        "quest_id": "ferryman_oath",
        "entry_by_status": {
            "inactive": "offer",
            "active": "reminder",
            "ready": "reward",
            "complete": "thanks",
        },
        "nodes": {
            "offer": {
                "speaker": "Ferryman",
                "text": "Walk the causeway and return with its mud on your boots.",
                "choices": [
                    {
                        "id": "accept",
                        "label": "I will walk it.",
                        "action": {
                            "kind": "start_quest",
                            "quest_id": "ferryman_oath",
                        },
                        "next": "accepted",
                    },
                    {"id": "leave", "label": "Not yet.", "next": "farewell"},
                ],
            },
            "accepted": {
                "speaker": "Ferryman",
                "text": "Then let the old boards count your crossing.",
                "choices": [],
            },
            "reminder": {
                "speaker": "Ferryman",
                "text": "The causeway waits east of the reeds.",
                "choices": [],
            },
            "reward": {
                "speaker": "Ferryman",
                "text": "The mud speaks true. Take this reed charm.",
                "choices": [
                    {
                        "id": "claim",
                        "label": "Accept the charm.",
                        "action": {
                            "kind": "claim_quest",
                            "quest_id": "ferryman_oath",
                        },
                        "next": "thanks",
                    }
                ],
            },
            "thanks": {
                "speaker": "Ferryman",
                "text": "The marsh remembers a kept word.",
                "choices": [],
            },
            "farewell": {
                "speaker": "Ferryman",
                "text": "Another tide, then.",
                "choices": [],
            },
        },
    }
}


class DialogueSession:
    """Traverse an NPC graph and delegate quest mutations."""

    def __init__(self, quest_log, dialogue=None):
        self.quest_log = quest_log
        self.dialogue = dialogue or NPC_DIALOGUE
        self.npc_id = None
        self.node_id = None
        self.last_reward = None

    def open(self, npc_id):
        npc = self.dialogue.get(npc_id)
        if npc is None:
            raise DialogueError(f"unknown npc id: {npc_id}")
        status = self.quest_log.progress(npc["quest_id"]).status.value
        node_id = npc["entry_by_status"].get(status)
        if node_id is None:
            raise DialogueError(f"npc {npc_id} has no entry for status {status}")
        self.npc_id = npc_id
        self.node_id = node_id
        return self.current_node()

    def close(self):
        self.npc_id = None
        self.node_id = None

    def current_node(self):
        if self.npc_id is None or self.node_id is None:
            return None
        nodes = self.dialogue[self.npc_id]["nodes"]
        node = nodes.get(self.node_id)
        if node is None:
            raise DialogueError(
                f"npc {self.npc_id} has no node {self.node_id}"
            )
        return node

    def choose(self, index):
        node = self.current_node()
        if node is None:
            raise DialogueError("cannot choose without an open conversation")
        choices = node["choices"]
        if index < 0 or index >= len(choices):
            raise DialogueError(f"choice index out of range: {index}")
        choice = choices[index]
        self._apply_action(choice.get("action"))
        self.node_id = choice["next"]
        return self.current_node()

    def _apply_action(self, action):
        if action is None:
            return
        kind = action.get("kind")
        quest_id = action.get("quest_id")
        if kind == "start_quest":
            self.quest_log.start(quest_id)
        elif kind == "claim_quest":
            self.last_reward = self.quest_log.claim(quest_id)
        else:
            raise DialogueError(f"unknown dialogue action: {kind}")
'''

[[lessons.artifactSteps]]
id = "s05-test-dialogue-graph"
path = "tests/test_dialogue.py"
mode = "write"
instruction = "Create tests for status-selected entries, checked traversal, generic quest commands, and reward delivery."
content = '''
"""Tests for data-driven quest dialogue."""

import pytest

from hollowmere.dialogue import DialogueError, DialogueSession
from hollowmere.quests import QuestLog, QuestStatus


def test_ferryman_branch_tracks_authoritative_quest_status():
    log = QuestLog()
    session = DialogueSession(log)
    session.open("ferryman")
    assert session.node_id == "offer"
    session.choose(0)
    assert log.progress("ferryman_oath").status is QuestStatus.ACTIVE
    log.record("crossed_causeway")
    session.open("ferryman")
    assert session.node_id == "reward"
    session.choose(0)
    assert session.node_id == "thanks"
    assert session.last_reward == "reed_charm"


def test_invalid_choice_is_rejected_before_any_action():
    log = QuestLog()
    session = DialogueSession(log)
    session.open("ferryman")
    with pytest.raises(DialogueError, match="out of range"):
        session.choose(9)
    assert log.progress("ferryman_oath").status is QuestStatus.INACTIVE
'''

