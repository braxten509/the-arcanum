[[lessons.exercises]]
id = "s05-l02-w1"
type = "write"
points = 36
prompt = "Given an entry mapping for three statuses, look up each status in order and print exactly <code>ENTRIES offer reminder thanks</code>."
starter = '''
entries = {"inactive": "offer", "active": "reminder", "complete": "thanks"}
statuses = ["inactive", "active", "complete"]
'''
expect = '''
ENTRIES offer reminder thanks
'''
solution = '''
entries = {"inactive": "offer", "active": "reminder", "complete": "thanks"}
statuses = ["inactive", "active", "complete"]
nodes = []
for status in statuses:
    nodes.append(entries[status])
print("ENTRIES", *nodes)
'''
hint = "Append one mapping result per status, then unpack the completed list into print."
