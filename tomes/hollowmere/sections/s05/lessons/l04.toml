[[lessons]]
id = "s05-l04"
title = "Let the World Answer the Promise"
teaches = ["objective-event-reward-handoff", "generic-dialogue-presentation"]
body = '''
<p>A quest objective should observe a real gameplay event, not trust dialogue to declare itself finished. The ferryman asks for a causeway crossing, and s04 already has one authoritative moment when <code>MarshScene.update()</code> detects <code>causeway_gate</code>. Immediately before changing maps, the scene records <code>"crossed_causeway"</code> in QuestLog. An inactive log ignores it; an active matching quest advances; every unrelated quest or event remains unchanged.</p>
<pre><code data-kind="patch">transition = self.loaded_map.transition_for(self.player.rect())
if transition is not None:
    self.quest_log.record("crossed_causeway")
    self.change_map(
        transition["target_map"],
        transition["target_spawn"],
    )</code></pre>
<p>The order is observable. The overlap comes from the loaded TMX Rect and real Player body. QuestLog records the semantic event, then the existing transition activates its stable target ids. Setting the count directly or calling record from the proof would bypass world behavior. Because <code>record()</code> caps a matching objective and accepts only active progress, crossing again cannot duplicate readiness or rewards.</p>
<p><code>MarshScene</code> composes the systems. It accepts an optional QuestLog for tests or future restore, otherwise creates one. It constructs one InteractionController and one DialoguePanel. <code>interact()</code> passes the Player's world Rect into proximity selection; <code>choose_dialogue(index)</code> delegates the selected choice. The ordinary loop consumes E and numeric requests before update, so no new event drain or nested dialogue loop appears.</p>
<p>Presentation reads the current node without branching on NPC or quest ids. <code>DialoguePanel.render(screen, node)</code> receives either a generic node dictionary or <code>None</code>. For a node it draws a charcoal panel, renders speaker and text, then loops over choices and prefixes their labels with 1, 2, and so on. <code>pygame.font.Font(None, 24)</code> uses Pygame's built-in default font at render time; it creates no media file and proof mode never calls render.</p>
<p>NPC bodies are likewise rendered by looping through <code>interactions.npc_rects.values()</code>, applying Camera, and drawing the same procedural color. New content can add a rectangle and graph without a new draw branch. A likely failure is constructing Font before Pygame initializes; lazy creation inside render keeps headless model tests independent while normal <code>run_game()</code> initializes Pygame before the first frame.</p>
<div class="field-notes"><div class="fn-head">FIELD NOTES // OBSERVE, THEN ANNOUNCE</div><p>The world emits the deed. QuestLog changes meaning. Dialogue and UI reveal the result.</p></div>
'''

[[lessons.concepts]]
id = "objective-event-reward-handoff"
purpose = "Advance an accepted objective from the real loaded doorway traversal and deliver its stable reward only through a ready dialogue claim."
anatomy = "Detect transition overlap; record one semantic event; let QuestLog match active definitions; change map through target ids; reopen dialogue from ready status; choose claim; receive reward id."
example = "The complete scene patch inserts crossed_causeway at the existing transition boundary and delegates interaction methods."
observable = "Accepting, traversing causeway_gate, returning to ferryman, and choosing the first reward option yields one reed_charm and complete status."
failure = "Recording from proof or dialogue fakes the objective; assigning a count bypasses QuestLog; appending a reward in UI permits duplicates."
practice = "s05-l04-d1"

[[lessons.concepts]]
id = "generic-dialogue-presentation"
purpose = "Render any current node and NPC body through shared loops without quest-specific, NPC-specific, or optional-media branches."
anatomy = "Receive node or None; draw panel; lazily create default Font; render speaker/text; enumerate choice labels; loop NPC Rects; camera-transform each; draw procedural color."
example = "DialoguePanel is the complete node-shaped renderer used by MarshScene after ordinary world drawing."
observable = "Ordinary launch shows a ferryman rectangle and a consistent text panel whose options reflect the current graph node."
failure = "Hard-coding ferryman text in Scene duplicates content; creating Font before pygame.init breaks model tests; drawing world Rects without Camera misplaces NPCs."
practice = "s05-l04-e2"

[[lessons.artifactSteps]]
id = "s05-create-dialogue-panel"
path = "src/hollowmere/ui.py"
mode = "write"
instruction = "Create ui.py with procedural NPC color and a generic, lazily initialized dialogue-node renderer using Pygame's built-in font."
content = '''
"""Procedural dialogue presentation with no external media."""

import os

os.environ["PYGAME_HIDE_SUPPORT_PROMPT"] = "1"

import pygame


NPC_COLOR = (205, 164, 92)
PANEL_COLOR = (16, 27, 34)
TEXT_COLOR = (232, 238, 224)
CHOICE_COLOR = (255, 204, 92)


class DialoguePanel:
    """Render any dialogue node with the same presentation path."""

    def render(self, screen, node):
        if node is None:
            return
        font = pygame.font.Font(None, 24)
        panel = pygame.Rect(32, screen.get_height() - 160, screen.get_width() - 64, 128)
        pygame.draw.rect(screen, PANEL_COLOR, panel)
        speaker = font.render(node["speaker"], True, CHOICE_COLOR)
        text = font.render(node["text"], True, TEXT_COLOR)
        screen.blit(speaker, (panel.x + 16, panel.y + 12))
        screen.blit(text, (panel.x + 16, panel.y + 38))
        for index, choice in enumerate(node["choices"], start=1):
            label = font.render(
                f"{index}. {choice['label']}", True, CHOICE_COLOR
            )
            screen.blit(label, (panel.x + 16, panel.y + 38 + index * 24))
'''

