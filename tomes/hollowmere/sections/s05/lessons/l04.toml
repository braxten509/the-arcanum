[[lessons.exercises]]
id = "s05-l04-w1"
type = "write"
points = 36
prompt = "Process events <code>look</code>, <code>crossed_causeway</code>, and <code>crossed_causeway</code> for an active objective with target 1, cap the count, and print exactly <code>OBJECTIVE ready 1/1</code>."
starter = '''
events = ["look", "crossed_causeway", "crossed_causeway"]
status = "active"
count = 0
target = 1
'''
expect = '''
OBJECTIVE ready 1/1
'''
solution = '''
events = ["look", "crossed_causeway", "crossed_causeway"]
status = "active"
count = 0
target = 1
for event in events:
    if status == "active" and event == "crossed_causeway":
        count = min(count + 1, target)
        if count == target:
            status = "ready"
print("OBJECTIVE", status, f"{count}/{target}")
'''
hint = "Only a matching event in active state changes the count; use min before checking the target."
