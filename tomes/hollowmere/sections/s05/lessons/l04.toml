[[lessons.artifactSteps]]
id = "s05-test-world-to-quest-integration"
path = "tests/test_scene.py"
mode = "append"
instruction = "Append a scene test that accepts through nearby dialogue, satisfies the objective through the real doorway update, and claims exactly one reward."
content = '''


def test_scene_carries_dialogue_quest_and_reward_through_real_doorway():
    from hollowmere.quests import QuestStatus

    scene = MarshScene((960, 540), debug=False)
    assert scene.interact() == "ferryman"
    scene.choose_dialogue(0)
    progress = scene.quest_log.progress("ferryman_oath")
    assert progress.status is QuestStatus.ACTIVE
    doorway = scene.loaded_map.transitions[0]
    scene.player.position.update(doorway["rect"].topleft)
    scene.update({}, 0.0)
    assert progress.status is QuestStatus.READY
    assert scene.interact() == "ferryman"
    scene.choose_dialogue(0)
    assert progress.status is QuestStatus.COMPLETE
    assert scene.quest_log.earned_rewards == ["reed_charm"]
'''

