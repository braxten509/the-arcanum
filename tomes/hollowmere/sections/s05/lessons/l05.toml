[[lessons.exercises]]
id = "s05-l05-e1"
type = "mc"
points = 15
prompt = "What additional assertion best proves an invalid early claim was handled atomically?"
choices = ["The camera moved", "The dialogue font loaded", "The map has four layers", "The earned reward list is still empty"]
answer = 3
whyWrong = "Camera, font, and map structure are unrelated to whether validation partially delivered a quest reward."
hint = "Inspect the state that the rejected command must protect."
explain = "An exception plus an unchanged reward list proves the guard ran before mutation."

[[lessons.exercises]]
id = "s05-l05-e2"
type = "fill"
points = 20
prompt = "Complete the specific exception binding used to inspect a rejected command."
code = '''
except QuestStateError ____ error:
    print(error)
'''
answer = "as"
whyWrong = "The binding keyword places the caught exception object in a local name; assignment or from has different syntax and meaning."
hint = "Use the two-letter keyword between an exception type and its bound variable."

[[lessons.exercises]]
id = "s05-l05-w1"
type = "write"
points = 38
prompt = "Attempt to claim while status is active, raise and catch <code>RuntimeError</code> with message <code>not ready</code>, keep rewards unchanged, and print exactly <code>ERROR not ready STATE active REWARDS 0</code>."
starter = '''
status = "active"
rewards = []
'''
expect = '''
ERROR not ready STATE active REWARDS 0
'''
solution = '''
status = "active"
rewards = []
try:
    if status != "ready":
        raise RuntimeError("not ready")
    rewards.append("reed_charm")
except RuntimeError as error:
    print("ERROR", error, "STATE", status, "REWARDS", len(rewards))
'''
hint = "Guard before append, raise the exact message, and print protected state inside the specific except block."
