id = "guarded-quest-state-transitions"
purpose = "Make one QuestLog owner validate acceptance, objective progress, readiness, completion, and reward delivery."
anatomy = "Look up stable definition/progress; check the required current status; raise QuestStateError on an invalid edge; mutate count/status once; append and return reward only after a ready claim."
