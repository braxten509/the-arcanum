[[lessons.artifactSteps]]
id = "s05-create-quest-ledger"
path = "src/hollowmere/quests.py"
mode = "write"
instruction = "Create quests.py with the stable ferryman definition, StrEnum lifecycle, guarded transition owner, objective matching, and reward handoff."
content = '''
"""Explicit quest definitions and guarded progress transitions."""

from enum import StrEnum


class QuestStateError(RuntimeError):
    """Reject an unknown quest or an impossible lifecycle edge."""


class QuestStatus(StrEnum):
    """Stable quest states suitable for branching and later saving."""

    INACTIVE = "inactive"
    ACTIVE = "active"
    READY = "ready"
    COMPLETE = "complete"


class QuestDefinition:
    def __init__(self, quest_id, objective_event, target, reward_id):
        self.quest_id = quest_id
        self.objective_event = objective_event
        self.target = target
        self.reward_id = reward_id


class QuestProgress:
    def __init__(self):
        self.status = QuestStatus.INACTIVE
        self.count = 0


QUESTS = {
    "ferryman_oath": QuestDefinition(
        quest_id="ferryman_oath",
        objective_event="crossed_causeway",
        target=1,
        reward_id="reed_charm",
    )
}


class QuestLog:
    """Own every legal quest transition and earned reward id."""

    def __init__(self, definitions=None):
        self.definitions = dict(definitions or QUESTS)
        self._progress = {}
        for quest_id in self.definitions:
            self._progress[quest_id] = QuestProgress()
        self.earned_rewards = []

    def definition(self, quest_id):
        definition = self.definitions.get(quest_id)
        if definition is None:
            raise QuestStateError(f"unknown quest id: {quest_id}")
        return definition

    def progress(self, quest_id):
        self.definition(quest_id)
        return self._progress[quest_id]

    def start(self, quest_id):
        progress = self.progress(quest_id)
        if progress.status is not QuestStatus.INACTIVE:
            raise QuestStateError(
                f"cannot start {quest_id} from {progress.status.value}"
            )
        progress.status = QuestStatus.ACTIVE

    def record(self, event_id):
        for quest_id, definition in self.definitions.items():
            progress = self._progress[quest_id]
            if progress.status is not QuestStatus.ACTIVE:
                continue
            if definition.objective_event != event_id:
                continue
            progress.count = min(progress.count + 1, definition.target)
            if progress.count == definition.target:
                progress.status = QuestStatus.READY

    def claim(self, quest_id):
        definition = self.definition(quest_id)
        progress = self.progress(quest_id)
        if progress.status is not QuestStatus.READY:
            raise QuestStateError(
                f"cannot claim {quest_id} from {progress.status.value}"
            )
        progress.status = QuestStatus.COMPLETE
        self.earned_rewards.append(definition.reward_id)
        return definition.reward_id
'''

[[lessons.artifactSteps]]
id = "s05-test-quest-ledger"
path = "tests/test_quests.py"
mode = "write"
instruction = "Create focused tests for the legal quest path, unrelated events, invalid repeated edges, stable ids, and one-time reward delivery."
content = '''
"""Tests for explicit quest state transitions."""

import pytest

from hollowmere.quests import QuestLog, QuestStateError, QuestStatus


def test_ferryman_quest_follows_one_legal_path():
    log = QuestLog()
    progress = log.progress("ferryman_oath")
    assert progress.status is QuestStatus.INACTIVE
    log.start("ferryman_oath")
    log.record("looked_at_water")
    assert progress.status is QuestStatus.ACTIVE
    log.record("crossed_causeway")
    assert progress.count == 1
    assert progress.status is QuestStatus.READY
    assert log.claim("ferryman_oath") == "reed_charm"
    assert progress.status is QuestStatus.COMPLETE
    assert log.earned_rewards == ["reed_charm"]


def test_invalid_edges_do_not_duplicate_progress_or_rewards():
    log = QuestLog()
    with pytest.raises(QuestStateError, match="cannot claim"):
        log.claim("ferryman_oath")
    log.start("ferryman_oath")
    with pytest.raises(QuestStateError, match="cannot start"):
        log.start("ferryman_oath")
    assert log.earned_rewards == []
'''

