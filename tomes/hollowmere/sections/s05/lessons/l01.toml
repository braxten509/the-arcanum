[[lessons]]
id = "s05-l01"
title = "Write the Quest Ledger"
teaches = ["string-enum-quest-status", "guarded-quest-state-transitions"]
body = '''
<p>A quest is not a loose pile of booleans. It is a small state machine: a value may move from <code>inactive</code> to <code>active</code>, then <code>ready</code>, then <code>complete</code>. A state machine names the allowed states and transitions. It prevents impossible combinations such as “reward claimed” while “quest never accepted” is also true.</p>
<pre><code data-kind="runnable">from enum import StrEnum

class LanternState(StrEnum):
    DARK = "dark"
    LIT = "lit"

state = LanternState.DARK
state = LanternState.LIT
print("LANTERN", state.value)</code></pre>
<p><code>from enum import StrEnum</code> imports Python's string-valued enumeration base. The <code>class</code> body binds symbolic member names to stable string values. <code>LanternState.LIT</code> is the member; <code>.value</code> is <code>"lit"</code>. The receipt is <code>LANTERN lit</code>. Misspelling <code>LanternState.LIGHT</code> raises <code>AttributeError</code> immediately, which is safer than silently inventing another status string.</p>
<p><code>QuestStatus</code> applies that pattern to Hollowmere. <code>QuestDefinition</code> stores the stable quest id, objective event, target count, and reward id. <code>QuestProgress</code> owns mutable status and count. The definition describes what the quest means; progress describes what this playthrough has done. Keeping them separate will let s08 save only stable ids and values rather than Python objects.</p>
<p><code>QuestLog</code> is the transition owner. <code>start()</code> accepts only inactive progress. <code>record(event_id)</code> advances only active definitions whose objective event matches, caps the count at the target, and changes the status to ready. <code>claim()</code> accepts only ready progress, changes it to complete, records the reward id, and returns that id. Each invalid command raises <code>QuestStateError</code> with the quest and observed state.</p>
<p>The order inside a mutating method matters. Validate first, then update all fields that form the transition, then return the result. If status changed before validation or a reward were appended before completion, an exception could leave a half-finished ledger. Tests exercise both allowed and rejected edges. Later dialogue and map code issue commands to this one owner; they never assign <code>status</code> themselves.</p>
<div class="field-notes"><div class="fn-head">FIELD NOTES // ONE KEEPER OF THE DEED</div><p>Many systems may observe quest state. Only QuestLog decides whether a requested transition is legal.</p></div>
'''

