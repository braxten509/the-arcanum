[[lessons.exercises]]
id = "s05-l01-w1"
type = "write"
points = 36
prompt = "Start with status <code>inactive</code>. Apply <code>accept</code>, <code>objective</code>, and <code>claim</code> in order with guarded transitions, count one reward only on claim, and print exactly <code>QUEST complete REWARDS 1</code>."
starter = '''
status = "inactive"
commands = ["accept", "objective", "claim"]
rewards = 0
'''
expect = '''
QUEST complete REWARDS 1
'''
solution = '''
status = "inactive"
commands = ["accept", "objective", "claim"]
rewards = 0
for command in commands:
    if command == "accept" and status == "inactive":
        status = "active"
    elif command == "objective" and status == "active":
        status = "ready"
    elif command == "claim" and status == "ready":
        status = "complete"
        rewards += 1
print("QUEST", status, "REWARDS", rewards)
'''
hint = "Each command checks the state it is allowed to leave before assigning the next one."
