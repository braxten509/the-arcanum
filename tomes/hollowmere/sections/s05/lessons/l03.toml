[[lessons.artifactSteps]]
id = "s05-create-interaction-controller"
path = "src/hollowmere/interactions.py"
mode = "write"
instruction = "Create interactions.py with world-space NPC placement, copied Rects, deterministic reach selection, and DialogueSession forwarding."
content = '''
"""World-space NPC proximity and conversation control."""

import os

os.environ["PYGAME_HIDE_SUPPORT_PROMPT"] = "1"

import pygame

from .dialogue import DialogueSession


NPC_RECTS = {"ferryman": pygame.Rect(64, 64, 24, 24)}
INTERACTION_REACH = (64, 64)


class InteractionController:
    """Resolve nearby NPC ids and own the active dialogue session."""

    def __init__(self, quest_log, npc_rects=None):
        source = npc_rects or NPC_RECTS
        self.npc_rects = {}
        for npc_id, body in source.items():
            self.npc_rects[npc_id] = body.copy()
        self.dialogue = DialogueSession(quest_log)

    def nearby(self, player_rect):
        reach = player_rect.inflate(*INTERACTION_REACH)
        for npc_id, body in self.npc_rects.items():
            if reach.colliderect(body):
                return npc_id
        return None

    def interact(self, player_rect):
        npc_id = self.nearby(player_rect)
        if npc_id is None:
            self.dialogue.close()
            return None
        self.dialogue.open(npc_id)
        return npc_id

    def choose(self, index):
        return self.dialogue.choose(index)
'''

