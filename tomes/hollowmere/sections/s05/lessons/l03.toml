id = "s05-l03-w1"
type = "write"
points = 36
prompt = "Use the player interval 96..120, extend its query by 32 on each side, test NPC positions 64, 200, and 110, collect matching ids in order, and print exactly <code>NEAR ferry reed</code>."
starter = '''
player_left = 96
player_right = 120
npcs = {"ferry": 64, "tower": 200, "reed": 110}
'''
expect = '''
NEAR ferry reed
'''
solution = '''
player_left = 96
player_right = 120
npcs = {"ferry": 64, "tower": 200, "reed": 110}
reach_left = player_left - 32
reach_right = player_right + 32
nearby = []
for npc_id, position in npcs.items():
    if reach_left <= position <= reach_right:
        nearby.append(npc_id)
print("NEAR", *nearby)
'''
hint = "Build two inclusive reach boundaries, loop through id/position pairs, and append only positions within them."
