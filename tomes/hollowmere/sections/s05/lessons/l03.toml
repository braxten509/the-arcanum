path = "tests/test_interactions.py"
mode = "write"
instruction = "Create tests for world-space proximity, open/close behavior, and one-shot E/number input without changing movement actions."
content = '''
"""Tests for NPC proximity and conversation input edges."""

import pygame

from hollowmere.input import InputState
from hollowmere.interactions import InteractionController
from hollowmere.quests import QuestLog


def key_down(key):
    return pygame.event.Event(pygame.KEYDOWN, key=key)


def test_world_space_reach_opens_the_nearby_npc():
    controller = InteractionController(QuestLog())
    assert controller.interact(pygame.Rect(96, 64, 24, 24)) == "ferryman"
    assert controller.dialogue.node_id == "offer"
    assert controller.interact(pygame.Rect(900, 700, 24, 24)) is None
    assert controller.dialogue.current_node() is None


def test_conversation_keys_are_consumed_once():
    state = InputState()
    state.handle_event(key_down(pygame.K_e))
    state.handle_event(key_down(pygame.K_1))
    assert state.consume_interact() is True
    assert state.consume_interact() is False
    assert state.consume_dialogue_choice() == 0
    assert state.consume_dialogue_choice() is None
    assert list(state.snapshot()) == ["left", "right", "up", "down"]
'''

