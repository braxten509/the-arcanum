[[lessons]]
id = "s05-l03"
title = "Meet at Arm's Length"
teaches = ["npc-proximity-interaction", "edge-triggered-conversation-input"]
body = '''
<p>Dialogue needs a world boundary: pressing a key should speak only when the Player is near an NPC. Hollowmere's temporary <code>NPC_RECTS</code> registry maps stable NPC ids to world-space Rects. The Rect is not dialogue and it is not a screen position. <code>InteractionController</code> copies each rectangle, expands the Player's body by a small reach, and checks overlap in the same world coordinates used by collision.</p>
<pre><code data-kind="runnable">import os

os.environ["PYGAME_HIDE_SUPPORT_PROMPT"] = "1"

import pygame

player = pygame.Rect(96, 64, 24, 24)
ferryman = pygame.Rect(64, 64, 24, 24)
reach = player.inflate(64, 64)
print("NEAR", reach.colliderect(ferryman))</code></pre>
<p>The result is <code>NEAR True</code>. <code>inflate(64, 64)</code> returns a wider copy centered on the original Rect; it does not enlarge Player collision. <code>colliderect</code> then answers whether that reach overlaps the NPC. Inflating the NPC permanently would quietly change future checks, while applying Camera offset would make interaction depend on the viewport.</p>
<p><code>nearby()</code> returns the first matching stable id or <code>None</code>. <code>interact()</code> opens that NPC through DialogueSession; when nobody is near, it closes the session. <code>choose(index)</code> forwards a checked choice to the same session. The controller knows placement and reach, the session knows graph traversal, and QuestLog knows mutation. That three-part separation prevents input code from asking whether the target is the ferryman.</p>
<p>Conversation commands are edges, not held movement. If E remained true for ten frames, opening dialogue ten times would keep resetting its node. <code>InputState</code> therefore records <code>_interact_requested</code> only on KEYDOWN and clears it in <code>consume_interact()</code>. Number keys 1 and 2 similarly store a zero-based choice index once. Returning <code>None</code> means no choice request; returning <code>0</code> is valid, so callers must use <code>is not None</code> rather than truthiness.</p>
<p>Movement remains the four-key snapshot from s03. Interaction requests are separate one-shot methods, just like the isolated debug teleport. Focus loss still clears held keys. A likely bug is subtracting keys without guarding the range; testing membership in <code>(pygame.K_1, pygame.K_2)</code> first prevents unrelated keys from becoming choice indices.</p>
<div class="field-notes"><div class="fn-head">FIELD NOTES // HOLD TO WALK, PRESS TO SPEAK</div><p>Continuous intentions belong in snapshots. Commands that should happen once belong in consumed requests.</p></div>
'''

