    def consume_interact(self):
        """Consume one interaction request."""
        requested = self._interact_requested
        self._interact_requested = False
        return requested

    def consume_dialogue_choice(self):
        """Consume one zero-based dialogue choice request."""
        requested = self._dialogue_choice_requested
        self._dialogue_choice_requested = None
        return requested
'''

