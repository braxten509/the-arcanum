[[lessons]]
id = "s16-l02"
title = "Capture a Choice"
teaches = ["closure-capture"]
introduces = ["python-nonlocal-statement", "python-closure-capture"]
body = '''<p>A closure is a function that continues to use a binding from an enclosing function after that outer call has returned. Call an outer factory twice and you receive two callbacks with two distinct enclosing environments. This is the right shape when behavior needs one configured choice without creating shared mutable state. The callback factory for the trail will remember command text while accepting a Player later, at the moment behavior runs.</p><p>Reading an enclosing binding needs no declaration. Rebinding one does: <code>nonlocal</code> tells Python that an assignment belongs to the nearest enclosing function scope instead of creating a new local binding. Use it only when the inner function genuinely owns changing that outer value. The command callback has no reason to alter its remembered command, so its closure should read the binding without <code>nonlocal</code>. Learn the distinction with a disposable counter, then return to the project with the simpler read-only contract.</p><p>Test closure independence rather than trusting it. Make two callbacks from two factory calls, supply fresh players, invoke both callbacks, and observe that configuring the second did not overwrite the first. Be alert to loop-capture surprises too: a callback can look up a loop variable later than expected. An explicit factory call gives each callback its own stable binding. Read the <a href="https://docs.python.org/3/reference/simple_stmts.html#the-nonlocal-statement">nonlocal reference</a> before deciding whether an inner assignment belongs to local or enclosing scope.</p>'''

[[lessons.readings]]
label = "Python language reference: the nonlocal statement"
url = "https://docs.python.org/3/reference/simple_stmts.html#the-nonlocal-statement"
why = "Confirm when an inner assignment rebinds an enclosing name."

