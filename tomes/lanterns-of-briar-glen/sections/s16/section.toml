[[lessons]]
id = "s16-l01"
title = "Trace Name Resolution"
teaches = ["namespace-resolution"]
introduces = ["python-legb-resolution", "python-global-statement"]
body = '''<p>Python resolves a bare name through LEGB: local, enclosing, global, then builtin namespaces. A parameter is local. A name assigned inside a function is local unless a declaration changes its binding target. A module-level name is global to that module, not a universal location shared safely by every callback. Predict the lookup before running code: a parameter named <code>route</code> wins over a global <code>route</code>; an inner function can continue outward only when no nearer binding exists.</p><p>Reading a module constant does not require <code>global</code>. The <code>global</code> statement matters only when an assignment must rebind a module-level name. That rebinding creates a hidden dependency between calls, so it is not a sound place to remember the trail command. Existing domain functions already receive a Player explicitly and change that supplied object; that is mutation through a local parameter, not global rebinding. Trace each name by asking where it is bound, where it is read, and whether an assignment creates a new local.</p><p>In the next lesson, an inner callback deliberately reads an enclosing command binding. That is still explicit scope: the command is selected when the factory is called, while the player is selected when the callback is called. It avoids a shared selected-command global. Read the <a href="https://docs.python.org/3/reference/executionmodel.html#binding-of-names">Python binding-of-names reference</a>, then use the same reasoning to identify the existing handler and its player parameter before making a project edit.</p>'''

[[lessons.readings]]
label = "Python language reference: Binding of names"
url = "https://docs.python.org/3/reference/executionmodel.html#binding-of-names"
why = "Use the reference to distinguish local assignment, enclosing lookup, and deliberate global rebinding."

