id = "s16-l03"
title = "Build a Callback Factory"
teaches = ["scoped-command-callback", "language-scope-closure-namespace"]
introduces = ["callback-factory"]
body = '''<p>The established command handler is the project seam. A callback factory should not replace it. It receives one command choice, defines an inner callback that receives a Player, and delegates to that handler using the enclosing command plus the local player parameter. This keeps validation, result text, and state change in one existing behavior. The new factory only configures when that behavior will be used.</p><p>Keep the public boundary equally small. Add the factory to the package's existing relative import and public-name list so tests import it through <code>briar_glen</code>. Do not change the guarded main entrypoint, create a second dispatcher, add runtime input, or wire persistence. The callback's scope is the evidence: command text is a read-only enclosing binding, Player is explicit at invocation, and no mutable global can make later factory calls overwrite earlier choices.</p><p>Write three focused tests. One verifies a known callback delegates as the handler would. One makes callbacks for different commands and proves their effects stay independent. One verifies that an invalid remembered command still raises the existing ValueError. Run the established suite after the learner-authored changes and use any failure location to repair only scope, delegation, export, or assertion evidence. This narrow seam prepares later command and dialogue dispatch without prematurely adding that later feature. Python's <a href="https://docs.python.org/3/library/functions.html#callable">callable documentation</a> gives the wider vocabulary for values that can be invoked.</p>'''

