id = "s16-rewrite-game-tests"
kind = "test"
path = "tests/test_game.py"
instruction = "Replay the complete game-test module, preserving earlier tests and adding focused callback-factory evidence."
content = """
from pathlib import Path

import pytest

from briar_glen import (
    Inventory,
    Player,
    QuestState,
    ensure_data_directory,
    handle_command,
    make_command_callback,
    player_data_directory,
    project_note_path,
    run_turn,
    turn_line,
)


def make_player():
    return Player("Nia", 8, Inventory(["rations"]), QuestState())


def test_project_note_path_is_relative_to_the_given_root():
    assert project_note_path(Path("camp")) == Path("camp") / "trail-note.txt"


def test_player_data_directory_uses_the_given_home_root():
    assert player_data_directory(Path("home")) == Path("home") / ".lanterns-of-briar-glen"


def test_ensure_data_directory_creates_the_player_directory(tmp_path):
    destination = ensure_data_directory(tmp_path)
    assert destination == tmp_path / ".lanterns-of-briar-glen"
    assert destination.is_dir()


def test_turn_line_uses_the_turn_number_and_command():
    assert turn_line(3, "rest") == "Turn 3: rest"


def test_rest_command_changes_the_given_player():
    player = make_player()
    assert handle_command("rest", player) == "Health restored: 10"
    assert player.health == 10


def test_invalid_command_raises_value_error():
    with pytest.raises(ValueError, match="Unknown command: sing"):
        handle_command("sing", make_player())


def test_run_turn_reports_invalid_commands_and_cleanup(capsys):
    run_turn(1, "sing", make_player())
    assert capsys.readouterr().out.splitlines() == [
        "Turn 1: sing",
        "Invalid command: Unknown command: sing",
        "Turn cleanup: sing",
    ]


def test_run_turn_marks_a_successful_command(capsys):
    player = make_player()
    run_turn(1, "look waystone", player)
    assert "look waystone" in player.quest.discoveries
    assert capsys.readouterr().out.splitlines() == [
        "Turn 1: look waystone",
        "The waystone points north.",
        "Turn cleanup: look waystone",
    ]


def test_player_keeps_its_constructor_attributes():
    player = make_player()
    assert player.name == "Nia"
    assert player.health == 8
    assert player.inventory.items == ["rations"]


def test_player_rest_changes_its_own_health():
    player = make_player()
    assert player.rest() == "Health restored: 10"
    assert player.health == 10


def test_two_players_keep_distinct_identity_and_state():
    first = make_player()
    second = make_player()
    first.rest()
    assert first is not second
    assert first.health == 10
    assert second.health == 8


def test_inventory_add_item_keeps_items_unique():
    inventory = Inventory(["rations"])
    inventory.add_item("rations")
    inventory.add_item("moonleaf")
    assert inventory.items == ["rations", "moonleaf"]


def test_quest_state_records_a_discovery():
    quest = QuestState()
    quest.mark_discovery("lantern key")
    assert "lantern key" in quest.discoveries


def test_player_delegates_search_to_its_quest(capsys):
    player = make_player()
    assert player.search_briar() == "Lantern key found."
    assert "lantern key" in player.quest.discoveries
    assert capsys.readouterr().out.splitlines() == [
        "Search: thorns",
        "Search: lantern key",
    ]


def test_command_callback_delegates_its_remembered_command():
    player = make_player()
    rest_callback = make_command_callback("rest")
    assert rest_callback(player) == "Health restored: 10"
    assert player.health == 10


def test_command_callbacks_keep_their_choices_independent():
    rest_callback = make_command_callback("rest")
    take_callback = make_command_callback("take moonleaf")
    resting_player = make_player()
    packing_player = make_player()
    assert rest_callback(resting_player) == "Health restored: 10"
    assert take_callback(packing_player) == "Moonleaf packed."
    assert resting_player.inventory.items == ["rations"]
    assert packing_player.health == 8


def test_command_callback_propagates_invalid_command_errors():
    invalid_callback = make_command_callback("sing")
    with pytest.raises(ValueError, match="Unknown command: sing"):
        invalid_callback(make_player())
"""
mechanisms = ["python-closure-capture", "callback-factory", "test-arrange-act-assert", "test-pytest-raises"]

