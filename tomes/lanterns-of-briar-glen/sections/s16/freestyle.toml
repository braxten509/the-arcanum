id = "s16-rewrite-domain"
kind = "implementation"
path = "briar_glen/domain.py"
instruction = "Replay the complete canonical domain module, preserving all earlier behavior and adding a narrow command callback factory after handle_command."
content = """
from pathlib import Path


class Inventory:
    def __init__(self, items):
        self.items = list(items)

    def add_item(self, item):
        if item not in self.items:
            self.items.append(item)


class QuestState:
    def __init__(self):
        self.discoveries = set()
        self.path_open = False

    def mark_discovery(self, discovery):
        self.discoveries.add(discovery)

    def search_briar(self):
        findings = ["thorns", "old ribbon", "lantern key", "deep mud"]
        index = 0
        while index < len(findings):
            finding = findings[index]
            index += 1
            if finding == "old ribbon":
                continue
            print(f"Search: {finding}")
            if finding == "lantern key":
                self.mark_discovery(finding)
                return "Lantern key found."
        return "Nothing useful found."


class Player:
    def __init__(self, name, health, inventory, quest):
        self.name = name
        self.health = health
        self.inventory = inventory
        self.quest = quest

    def rest(self):
        self.health += 2
        return f"Health restored: {self.health}"

    def take_item(self, item):
        self.inventory.add_item(item)
        return f"{item.title()} packed."

    def search_briar(self):
        return self.quest.search_briar()


def project_note_path(project_root):
    return Path(project_root) / "trail-note.txt"


def player_data_directory(home_root):
    return Path(home_root) / ".lanterns-of-briar-glen"


def ensure_data_directory(home_root):
    destination = player_data_directory(home_root)
    if not destination.exists():
        destination.mkdir(parents=True)
    return destination


def write_and_read_text(path, text):
    writer = open(path, "w", encoding="utf-8")
    try:
        writer.write(text)
    finally:
        writer.close()
    reader = open(path, "r", encoding="utf-8")
    try:
        return reader.read()
    finally:
        reader.close()


def turn_line(turn_number, command):
    return f"Turn {turn_number}: {command}"


def has_lantern_key(quest):
    return "lantern key" in quest.discoveries


def validate_command(command):
    allowed_commands = [
        "look waystone",
        "take moonleaf",
        "rest",
        "search briar",
        "leave",
    ]
    if command not in allowed_commands:
        raise ValueError(f"Unknown command: {command}")
    return command


def show_opening(player):
    print(f"Lantern status for {player.name}: {player.health} health, 2 oil, lit=True")
    print("Normalized command: look waystone")
    print("Command words: ['look', 'waystone']")
    print(f"Pack before trail: {player.inventory.items}")
    print(f"First packed item: {player.inventory.items[0]}")
    print(f"Player health: {player.health}")
    print("Known north gate: True")
    print("Coordinates: (4, 7)")


def handle_command(command, player):
    command = validate_command(command)
    if command == "look waystone":
        return "The waystone points north."
    if command == "take moonleaf":
        return player.take_item("moonleaf")
    if command == "rest":
        return player.rest()
    if command == "search briar":
        return player.search_briar()
    player.quest.path_open = False
    return "Trail closed."


def make_command_callback(command):
    def command_callback(player):
        return handle_command(command, player)

    return command_callback


def run_turn(turn_number, command, player):
    print(turn_line(turn_number, command))
    try:
        print(handle_command(command, player))
    except ValueError as error:
        print(f"Invalid command: {error}")
    else:
        player.quest.mark_discovery(command)
    finally:
        print(f"Turn cleanup: {command}")


def run_trail():
    inventory = Inventory(["waystone map", "rations"])
    quest = QuestState()
    player = Player("Mira", 10, inventory, quest)
    snapshot = inventory.items.copy()
    show_opening(player)
    commands = [
        "look waystone",
        "take moonleaf",
        "rest",
        "search briar",
        "sing",
        "leave",
    ]
    completed_turns = []
    for turn_number in range(1, len(commands) + 1):
        command = commands[turn_number - 1]
        run_turn(turn_number, command, player)
        completed_turns.append(command)
    print(f"Turns taken: {len(commands)}")
    print(f"Pack after trail: {inventory.items}")
    print(f"Snapshot before trail: {snapshot}")
    print(f"Found lantern key: {has_lantern_key(quest)}")
    print(f"Path open: {quest.path_open}")
    print(f"Final health: {player.health}")
    print(f"Completed turns: {completed_turns}")
"""
