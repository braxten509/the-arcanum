code = 'scout_state = {"health": 7, "title": "Guide"}'

[[lessons.exercises]]
id = "s04-l02-e2"
type = "fill"
points = 21
mechanisms = ["python-dict-key-access"]
prompt = "Complete the direct lookup that retrieves the value stored under the title label."
code = 'print(scout_state[____])'
answer = '"title"'
hint = "Use the quoted key paired with Guide in the mapping."

[[lessons.exercises]]
id = "s04-l02-e3"
type = "mc"
points = 18
mechanisms = ["dict-get-method"]
prompt = "If camp is absent from scout_state, which expression displays a fallback of unknown without raising a missing-key error?"
choices = ['scout_state["camp"]', 'scout_state.get["camp", "unknown"]', 'scout_state.get("camp", "unknown")', 'scout_state.append("camp")']
answer = 2
whyWrong = "Direct brackets require the key to exist, brackets after get do not call a method, and append belongs to lists rather than mappings."
hint = "The safe lookup is a method call with both the requested key and fallback inside parentheses."
explain = "get returns the fallback only when the requested key is absent."

[[lessons.exercises]]
id = "s04-l02-e4"
type = "write"
points = 32
mechanisms = ["python-dict-literal", "python-dict-key-access", "dict-get-method", "python-print-call"]
prompt = "Write a disposable program that creates beacon_state with keys \"signal\" mapped to 4 and \"color\" mapped to \"blue\". Print the signal through direct key access, then print the fallback \"none\" for a missing \"keeper\" key using get()."
expect = '''4
none'''
solution = '''beacon_state = {"signal": 4, "color": "blue"}
print(beacon_state["signal"])
print(beacon_state.get("keeper", "none"))
'''
hint = "Use square brackets only for the known signal key; use get with two arguments for keeper."

