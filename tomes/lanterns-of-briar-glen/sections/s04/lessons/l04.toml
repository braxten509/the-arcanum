[[lessons.exercises]]
id = "s04-l04-e2"
type = "fill"
points = 21
mechanisms = ["collection-copy-method"]
prompt = "Complete the method call that creates an independent flat-list snapshot before trail_pack changes."
code = "pack_snapshot = trail_pack.____"
answer = "copy()"
hint = "Use the list method that returns a separate shallow list."

[[lessons.exercises]]
id = "s04-l04-e3"
type = "write"
points = 34
mechanisms = ["python-list-literal", "collection-copy-method", "list-append-method", "python-tuple-literal", "python-print-call"]
prompt = "Write a disposable program that creates creek_pack with \"cup\" and \"cloth\", copies it to creek_snapshot, appends \"herb\" to creek_pack, creates ford_coordinate as (6, 2), then prints creek_snapshot, creek_pack, and ford_coordinate in that order."
expect = '''['cup', 'cloth']
['cup', 'cloth', 'herb']
(6, 2)'''
solution = '''creek_pack = ["cup", "cloth"]
creek_snapshot = creek_pack.copy()
creek_pack.append("herb")
ford_coordinate = (6, 2)
print(creek_snapshot)
print(creek_pack)
print(ford_coordinate)
'''
hint = "Call copy before append; the coordinate is its own parenthesized pair."

[[lessons.exercises]]
id = "s04-l04-e4"
type = "mc"
points = 19
mechanisms = ["collection-copy-method"]
prompt = "After records = [\"gate\"] and snapshot = records.copy(), records.append(\"tower\"), which result demonstrates an independent snapshot?"
choices = ['snapshot prints [\"gate\"] while records prints [\"gate\", \"tower\"]', 'snapshot and records both print [\"gate\", \"tower\"]', 'snapshot is used as a key to retrieve tower', 'records is indexed to prove the set has no duplicates']
answer = 0
whyWrong = "Matching changed lists suggest a shared object, dictionary keys serve a different collection role, and indexing does not establish set uniqueness."
hint = "A copied list keeps the state that existed before the append."
explain = "copy creates a new flat-list container, so the later append changes only records."

