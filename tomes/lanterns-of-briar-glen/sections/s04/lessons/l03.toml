type = "fill"
points = 20
mechanisms = ["python-set-literal"]
prompt = "Complete the disposable unique collection containing both north arch and moss well."
code = 'places = {"north arch", ____}'
answer = '"moss well"'
hint = "Add the second quoted place after the comma inside the braces."

