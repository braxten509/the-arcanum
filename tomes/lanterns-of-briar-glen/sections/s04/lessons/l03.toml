[[lessons.exercises]]
id = "s04-l03-e3"
type = "mc"
points = 18
mechanisms = ["python-membership-operators"]
prompt = "Which expression checks whether mist pond has been recorded in discoveries?"
choices = ['discoveries["mist pond"]', 'discoveries.append("mist pond")', 'discoveries in "mist pond"', '"mist pond" in discoveries']
answer = 3
whyWrong = "Sets do not use keyed lookup here, append changes a list-shaped collection, and reversing in asks a different question."
hint = "Place the searched text on the left side of in."
explain = "Membership reads naturally as value in collection."

[[lessons.exercises]]
id = "s04-l03-e4"
type = "text"
points = 19
mechanisms = ["python-set-literal", "set-add-method"]
prompt = "Why is a set a better journal for a landmark that must not be recorded twice than the ordered trail pack?"
answer = "A set keeps unique values and ignores duplicate additions"
accept = ["sets do not keep duplicate values", "the set enforces one copy of each discovery"]
hint = "Compare the collection promises for duplicates, not their bracket shapes."

[[lessons.exercises]]
id = "s04-l03-e5"
type = "write"
points = 33
mechanisms = ["python-set-literal", "set-add-method", "python-membership-operators", "python-print-call"]
prompt = "Write a disposable program that creates a set named found_marks containing \"stone bell\", adds \"stone bell\" again, prints the set, then prints whether \"stone bell\" is in found_marks."
expect = '''{'stone bell'}
True'''
solution = '''found_marks = {"stone bell"}
found_marks.add("stone bell")
print(found_marks)
print("stone bell" in found_marks)
'''
hint = "Use add for the repeated record, then put the quoted mark before in for the final print."
