[freestyle]
title = "THE WORKING: A PACK FOR THE ROAD"
brief = '''<p>Rowan needs a trail receipt that proves each collection keeps the right promise, wayfinder. Reopen the learner-authored <code>game.py</code> in the external project root and replace the earlier text-only receipt with a collection receipt that still retains the carried-forward value and text state.</p><ul><li>Create a named, flat inventory list with two starting text items. Print its initial value, then print its first item through indexing. Make an independent snapshot before appending one new text item to the inventory, then print the changed inventory and the snapshot.</li><li>Create a named player-state dictionary that includes the carried-forward health and a text title. Print health through direct key access and print a missing optional camp value through <code>get()</code> with the fallback <code>unknown</code>.</li><li>Create a named discovery set containing one fixed landmark. Attempt to add that same landmark again, then print the set and print the Boolean membership result derived with <code>in</code>.</li><li>Create and print one named two-number coordinate tuple. Read the saved file and run <code>python game.py</code> with <code>.venv</code> active. The saved run must show the list before and after mutation, its indexed first item, player mapping observations, one-copy discovery evidence and membership, coordinates, and an unchanged pre-mutation snapshot.</li><li>Do not add keyboard input, arguments, branches, loops, functions, files, dependencies, Pygame, package material, or new project paths.</li></ul>'''
requires = ["inventory-sequence", "player-state-mapping", "discovery-set", "coordinate-record", "language-collections-list-dict-set-tuple", "language-values-expressions-data", "language-strings-text"]
mechanisms = ["terminal-print-working-directory", "terminal-change-directory", "terminal-check-python-version", "venv-create-environment", "venv-activate-environment", "venv-resolve-active-python", "editor-create-file", "editor-edit-file", "editor-save-file", "terminal-read-saved-file", "terminal-invoke-saved-file", "python-literal-values", "python-name-binding", "python-arithmetic-operators", "python-comparison-operators", "python-boolean-operators", "python-print-call", "python-string-literal", "python-string-concatenation", "python-f-string", "string-strip-method", "string-lower-method", "string-split-method", "python-list-literal", "python-list-indexing", "list-append-method", "python-dict-literal", "python-dict-key-access", "dict-get-method", "python-set-literal", "python-membership-operators", "set-add-method", "python-tuple-literal", "collection-copy-method"]
reward = 170
xray = "Look for one learner-authored saved source that gives each collection a distinct job. The grader checks for an inventory before/after mutation and independent snapshot, direct and safe keyed player lookups, a duplicate-safe discovery set with derived membership, and a fixed coordinate tuple. Dock premature control flow, functions, input, files, dependencies, Pygame, package material, or copied output. Award clarity for snake_case names, 4-space indentation if any block is later introduced, one space around binary operators, and readable compact lines consistent with PEP 8."

