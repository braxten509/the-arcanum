[[lessons]]
id = "s02-l01"
title = "Give State a Name"
teaches = ["python-state-model"]
introduces = ["python-literal-values", "python-name-binding"]
body = '''
<p>A game cannot react to a lantern until it has facts to react <em>to</em>. In Python, a value is one piece of information held by the program at a moment: a whole number, a decimal number, or a Boolean truth value. A literal is the value written directly in code. In the disposable trail-marker example below, <code>12</code> and <code>False</code> are literals. They are not names and they do not change themselves.</p>
<pre><code data-kind="runnable">marker_height = 12
path_clear = False
</code></pre>
<p>Read the first line from left to right. <code>marker_height</code> is a name chosen by the programmer. <code>=</code> is assignment: it stores the value on the right under the name on the left. It does not ask whether two things are equal; comparisons arrive in the next lesson. The next line gives a second name a Boolean value. Trace the two assignments on paper: after the first line, <code>marker_height</code> refers to <code>12</code>; after the second, <code>path_clear</code> refers to <code>False</code>. This lesson deliberately creates state without displaying it. The section’s final lesson will introduce the call that exposes saved state in the terminal.</p>
<p>Names turn an anonymous number into state with a job. A good name tells a future reader what the value means without forcing them to decode its history. Python convention uses lowercase words separated by underscores, such as <code>marker_height</code>. Avoid a name that begins with a number, contains spaces, or differs only by capitalization from another name. Python is case-sensitive: <code>Path_Clear</code> and <code>path_clear</code> are different names.</p>
<p>For now, think of assignment as placing labeled cards on Rowan’s table. Later lessons will replace or combine cards, but this first step is simply choosing factual values and binding them to readable names. If you run a line that mentions a name before assigning it, Python reports a <code>NameError</code>. That error means Python has no labeled card by that name yet; check spelling and make sure the assignment occurs first.</p>
<p>Your project source will use different names and facts from this marker example. Create the file yourself, save it, and keep it small: this chapter owns observable state, not a game loop or a Pygame window. The useful question is not “did I type a number?” but “can another person see what this named value represents?”</p>
<div class="field-notes"><div class="fn-head">FIELD NOTES // A NAME IS A PROMISE</div><p>When a value changes later, a name keeps the explanation attached to the value. Choose names for the game’s meaning, not for where you happen to type them.</p></div>
'''

[[lessons.concepts]]
id = "python-state-model"
purpose = "Represent the current facts of a program as values with meaningful names."
anatomy = "Choose a literal value, choose a lowercase_snake_case name, place = between the name and value, then read the assignment as storing the right side under the left-side name."
example = "The marker_height and path_clear runnable example shows two named facts."
observable = "Reading the two assignments shows that marker_height refers to 12 and path_clear refers to False after those lines execute."
failure = "A NameError means the name was misspelled or used before an assignment created it."
practice = "s02-l01-e1"

[[lessons.concepts]]
id = "python-literal-values"
purpose = "Write a concrete number or Boolean directly so Python has an initial fact to store."
anatomy = "Place a whole number such as 12 or a Boolean spelled True or False on the right side of an assignment."
example = "12 and False are the literals in the runnable marker example."
observable = "The right side of each assignment visibly contains the concrete numeric or Boolean fact that will be stored."
failure = "Writing true or false in lowercase does not create Python Boolean literals."
practice = "s02-l01-e2"

[[lessons.concepts]]
id = "python-name-binding"
purpose = "Associate a readable Python name with a value so later code can refer to the state."
anatomy = "Write a valid lowercase_snake_case name, then =, then the value to bind to that name."
example = "marker_height = 12 binds the number to a readable name."
observable = "Tracing marker_height = 12 records that later uses of marker_height will retrieve the bound value 12."
failure = "A space or leading number makes an invalid name, while a spelling mismatch produces a NameError."
practice = "s02-l01-e3"

[[lessons.artifactSteps]]
id = "s02-l01-create-game-state"
path = "game.py"
mode = "author"
mechanisms = ["python-literal-values", "python-name-binding"]
instruction = "At the external project root, create and save game.py in your editor. Author named literal state for the future traveler’s health, lantern oil, and an initial lantern condition. Use readable lowercase_snake_case names and one assignment per line. Do not copy the disposable marker example or add expressions, input, collections, functions, dependencies, Pygame, or package files yet."
checks = ["The editor shows a saved game.py at the project root, not inside .venv.", "Each initial game fact has a readable name and a literal value, with no NameError caused by a name used before assignment."]

[[lessons.readings]]
label = "Python assignment statements"
url = "https://docs.python.org/3/reference/simple_stmts.html#assignment-statements"

[[lessons.exercises]]
id = "s02-l01-e1"
type = "mc"
points = 18
mechanisms = ["python-name-binding"]
prompt = "In marker_height = 12, what is marker_height?"
choices = ["A name bound to a value", "A literal number", "A comparison result", "A command-line argument"]
answer = 0
whyWrong = "The number is the literal; a comparison has not happened, and no command-line arguments appear in this assignment."
hint = "Look at which side of = receives the label."
explain = "marker_height is the readable name that refers to the stored number."

[[lessons.exercises]]
id = "s02-l01-e2"
type = "fill"
points = 20
mechanisms = ["python-literal-values"]
prompt = "Complete the Boolean literal that records a closed gate in this disposable example."
code = "gate_open = ____"
answer = "False"
hint = "Python Boolean literals begin with a capital letter."

[[lessons.exercises]]
id = "s02-l01-e3"
type = "text"
points = 18
mechanisms = ["python-name-binding"]
prompt = "Why does Python raise NameError when a line uses a name that has not been assigned yet?"
answer = "Python has no value bound to that name yet"
accept = ["the name has not been assigned a value", "no value is bound to that name"]
hint = "Think of assignment as making a label point to a value."

[[lessons.exercises]]
id = "s02-l01-d1"
type = "type"
points = 12
reps = 2
mechanisms = ["python-literal-values", "python-name-binding"]
prompt = "Retype this disposable state assignment exactly."
code = "bridge_length = 12"

[[lessons.exercises]]
id = "s02-l01-w1"
type = "text"
points = 30
mechanisms = ["python-literal-values", "python-name-binding"]
prompt = "Write a tiny disposable program with river_depth bound to the whole-number literal 4 and ford_open bound to the Boolean literal False."
answer = '''river_depth = 4
ford_open = False
'''
accept = ["river_depth = 4 and ford_open = False"]
hint = "Use one readable assignment per named fact."
