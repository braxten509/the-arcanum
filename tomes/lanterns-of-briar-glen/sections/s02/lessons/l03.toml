prompt = "Retype this disposable print call exactly."
code = 'print(wind_speed, gust_speed)'

[[lessons.exercises]]
id = "s02-l03-w1"
type = "write"
points = 30
mechanisms = ["python-name-binding", "python-print-call"]
prompt = "Write a disposable program that binds bell_count to 2 and echo_count to 3, then uses one print call to produce exactly 2 3."
expect = '''2 3'''
solution = '''bell_count = 2
echo_count = 3
print(bell_count, echo_count)
'''
hint = "Use both assigned names as separate print arguments."
