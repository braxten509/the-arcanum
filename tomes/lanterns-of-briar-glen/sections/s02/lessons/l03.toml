hint = "Supply the saved source filename after the active interpreter command."

[[lessons.exercises]]
id = "s02-l03-e3"
type = "text"
points = 18
mechanisms = ["python-literal-values", "python-name-binding", "python-arithmetic-operators", "python-comparison-operators", "python-boolean-operators", "python-print-call"]
prompt = "Why is a print line that reads named, derived state stronger evidence than a line that only repeats a prewritten final result?"
answer = "It shows the output comes from the program state and expressions"
accept = ["the output is derived from named state and expressions", "it proves the displayed result follows the calculated state"]
hint = "Think about whether changing the values could change the displayed result."

[[lessons.exercises]]
id = "s02-l03-e4"
type = "mc"
points = 18
mechanisms = ["terminal-read-saved-file", "terminal-invoke-saved-file"]
prompt = "python game.py says it cannot open the file. What should you check first?"
choices = ["Install Pygame.", "Create a second source file somewhere else.", "Replace the source with the expected output text.", "Run pwd and compare the terminal location with the editor project root."]
answer = 3
whyWrong = "This chapter has no dependencies or Pygame, and duplicating or replacing source hides a path problem. Confirm the terminal location before changing code."
hint = "The source path is relative to the current terminal folder."
explain = "A saved file can be correct while the terminal is simply in the wrong directory."

[[lessons.exercises]]
id = "s02-l03-e5"
type = "text"
points = 18
mechanisms = ["terminal-delete-file"]
prompt = "After a successful disposable source check, what does rm old-note.txt change, and what two details should you confirm before running it?"
answer = "It removes old-note.txt from the current folder; confirm the current directory and exact filename first"
accept = ["removes the named file after checking pwd and the exact filename", "deletes old-note.txt from the current directory after confirming location and name"]
hint = "Read the command target and the pwd safety check in the worked example."

[[lessons.exercises]]
