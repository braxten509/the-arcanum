title = "THE WORKING: IMPORTS WITH A PUBLIC FACE"
brief = '''<p>Rowan will now read Briar Glen from the outside as another programmer would. You will author an explicit public import surface and a guarded entry around the existing package. No starter implementation is supplied.</p><ul><li>In <code>briar_glen/__init__.py</code>, relatively import only the established classes and helpers that <code>tests/test_game.py</code> needs, and record exactly those package-level names in <code>__all__</code>. Keep the initializer free of trail startup, controller logic, and a shortcut export for the complete runner.</li><li>In <code>briar_glen/main.py</code>, use an absolute package import for the existing trail callable as the normal route, preserve the earlier narrow <code>ModuleNotFoundError</code> fallback needed when the saved file is directly executed by the prior proof, place its one invocation in a small <code>main()</code> function, and call that function only behind a correctly spelled main-name guard. Preserve the existing <code>briar_glen/domain.py</code> rules without importing the initializer or entry from it.</li><li>Update <code>tests/test_game.py</code> so its existing focused checks use the <code>briar_glen</code> public surface. Test collection must import <code>briar_glen.main</code> without starting the six-turn trail. From the external project root, run <code>python -m briar_glen.main</code> and <code>python -m pytest -q</code>; preserve the known final health of <code>12</code>, key discovery, completed turns, and 11 passing checks.</li><li>Read the initializer, entry, domain, and tests as a one-way map: tests → package → domain and entry → domain. If Python reports a partially initialized module, compare the saved import directions and remove the backward dependency instead of copying behavior. Do not add CLI arguments, paths, files, JSON, context managers, scope factories, comprehensions, generators, annotations, diagnostics, Pygame, assets, packaging metadata, or a second game.</li></ul>'''
