[[freestyle.referenceSteps]]
id = "s12-rewrite-package-public-surface"
path = "briar_glen/__init__.py"
mode = "rewrite"
preserves = "all-active"
mechanisms = ["python-relative-import", "python-all-export-list", "module-dependency-direction", "python-import-statement", "python-list-literal", "python-string-literal"]
instruction = "Private replay writes the narrow package-level surface without adding startup behavior."
content = '''from .domain import Inventory, Player, QuestState, handle_command, run_turn, turn_line

__all__ = [
    "Inventory",
    "Player",
    "QuestState",
    "handle_command",
    "run_turn",
    "turn_line",
]'''

[[freestyle.referenceSteps]]
id = "s12-rewrite-guarded-entry"
path = "briar_glen/main.py"
mode = "rewrite"
preserves = "all-active"
mechanisms = ["python-absolute-import", "python-main-name-guard", "module-dependency-direction", "python-import-statement", "python-try-statement", "python-except-clause", "python-exception-types", "python-def-statement", "python-function-call"]
instruction = "Private replay makes the package entry depend downward on the domain and reserve startup for selected module execution."
content = '''try:
    from briar_glen.domain import run_trail
except ModuleNotFoundError:
    from domain import run_trail


def main():
    run_trail()


if __name__ == "__main__":
    main()'''

