[[lessons.exercises]]
id = "s12-l03-w1"
type = "write"
points = 35
mechanisms = ["python-all-export-list", "module-dependency-direction", "circular-import-traceback", "python-list-literal", "python-list-indexing", "python-string-literal", "python-print-call"]
prompt = "Write a disposable program that records glow as the only name in __all__ and prints that one listed name. Then write one sentence naming the safe direction of dependencies between an entry, initializer, and domain and why a circular path violates it. Do not create a Briar Glen artifact."
expect = "glow"
solution = '''__all__ = ["glow"]

print(__all__[0])'''
hint = "Put the quoted name in a one-item list, then print its first item."
