[[lessons.exercises]]
id = "s12-l03-e1"
type = "mc"
points = 18
mechanisms = ["python-all-export-list"]
prompt = "What is the clearest purpose of __all__ in a package initializer?"
choices = ["It executes the package entry", "It records the names the package intentionally presents", "It makes every internal name private by force", "It installs missing dependencies"]
answer = 1
whyWrong = "__all__ records public intent; it neither starts a program, enforces complete privacy, nor installs software."
hint = "Think of it as a visible list at the package door."
explain = "The list communicates the supported names callers should request from the package."

