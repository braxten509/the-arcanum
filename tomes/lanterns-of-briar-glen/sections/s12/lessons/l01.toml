[[lessons]]
id = "s12-l01"
title = "Choose an Import Form"
teaches = ["import-form-selection"]
introduces = ["python-absolute-import", "python-relative-import"]
body = '''
<p>An import is a dependency promise: this code needs a name that another module owns. In an executable module, an <strong>absolute import</strong> names the package from the project root, such as <code>from briar_glen.domain import run_trail</code>. It tells a reader exactly which package supplies the callable when they run <code>python -m briar_glen.main</code>. Inside a package module, a <strong>relative import</strong> starts from that package: <code>from .domain import Player</code>. The dot means “the package containing this file,” not the current terminal directory.</p>
<p>This disposable package gives both forms the context they need. The entry names its owner with the complete package path. The initializer is already inside <code>watchfire</code>, so its dot reaches the sibling route module.</p>
<pre><code data-kind="pseudocode"># watchfire/routes.py
def next_turn():
    return "bridge"

# watchfire/__init__.py
from .routes import next_turn

public_turn = next_turn()

# watchfire/entry.py
from watchfire.routes import next_turn
from watchfire import public_turn

print(next_turn())
print(public_turn)</code></pre>
<p>From the scratch directory’s parent, run the entry as a package module. Its two matching lines show that the absolute entry import and the relative initializer import both found the same sibling owner:</p>
<pre><code data-kind="terminal">$ python -m watchfire.entry
bridge
bridge</code></pre>
<p>These two forms are not interchangeable in every context. The absolute form suits a module entered through its full package name. The relative form suits a sibling module already living inside a package. The disposable names above do not create a project artifact. In Briar Glen, make <code>main.py</code> use the absolute package path to reach its one domain callable. Make <code>__init__.py</code> use a relative path to gather the approved names that callers may request from the package itself.</p>
<p>Choose by dependency direction, not by what happens to work from one shell location. The entry depends on the domain. The package initializer depends on the domain to present selected names. The domain does not import the initializer or entry. That downward reading path keeps the reusable rules safe for tests and leaves startup to the entry. Before editing, read the three saved package files and identify the owner of each name. After editing, run the module command from the external project root, then run the focused tests.</p>
<p>If Python reports <code>ModuleNotFoundError</code>, inspect the import spelling and run location before changing the domain. The normal entry route is the package-qualified import. Preserve the earlier section’s narrow compatibility branch only because its active proof also executes the saved <code>main.py</code> file directly: it may fall back to the sibling import only when that specific package lookup fails. That branch is not a second controller or a general import style. This chapter deliberately keeps the existing trail rules, tests, command loop, files, JSON, type hints, and runtime window out of scope. The new evidence is an honest, readable import route.</p>
<div class="field-notes"><div class="fn-head">FIELD NOTES // NAME THE OWNER</div><p>When an import feels mysterious, read it as a sentence: “from this package and module, bring this owned name here.” The package-qualified path is a useful map for a future repair.</p></div>'''

[[lessons.concepts]]
id = "import-form-selection"
purpose = "Select an import spelling that makes the dependency owner and package position clear."
anatomy = "Use a package-qualified absolute path when an entry reaches into the package; use a dot-prefixed relative path when a package module reaches its sibling."
example = "The watchfire entry imports next_turn through watchfire.routes, while its initializer reaches the same routes sibling through .routes."
observable = "The module command resolves the saved package path and pytest can collect domain tests without a missing-module error."
failure = "Choosing a file-path-dependent sibling import can work in one launch style but fail when the package is run with -m."
practice = "s12-l01-w1"

[[lessons.concepts]]
id = "python-absolute-import"
purpose = "Name a dependency by its complete package and module path."
anatomy = "Write from, then the package name, a dot, the module name, import, and the owned name."
example = "from watchfire.routes import next_turn in watchfire/entry.py is the absolute form in the disposable package walkthrough."
observable = "python -m watchfire.entry prints bridge from the package-qualified entry import."
failure = "A misspelled package or module segment produces an import diagnostic before the program begins its work."
practice = "s12-l01-w1"

[[lessons.concepts]]
id = "python-relative-import"
purpose = "Name a sibling dependency from inside the package that contains the importing module."
anatomy = "Write from, one dot for the current package, the sibling module name, import, and the selected name."
example = "from .routes import next_turn in watchfire/__init__.py is the relative form in the disposable package walkthrough."
observable = "The same python -m watchfire.entry run prints bridge again after the initializer resolves its sibling-relative import."
failure = "Using a relative import in a file launched as an ordinary loose script lacks the package context it needs."
practice = "s12-l01-w1"

[[lessons.artifactSteps]]
id = "s12-l01-map-import-directions"
path = "briar_glen/main.py"
mode = "author"
mechanisms = ["python-absolute-import", "python-relative-import", "python-import-statement", "python-try-statement", "python-except-clause", "python-exception-types", "terminal-read-saved-file", "editor-edit-file", "editor-save-file", "python-module-execution"]
instruction = "Read the saved briar_glen/domain.py, briar_glen/main.py, and briar_glen/__init__.py from the external project root. In main.py, keep the package-qualified import for the existing trail callable as the normal route and preserve the earlier narrow ModuleNotFoundError fallback needed when the saved file is executed directly; in __init__.py, author a sibling-relative import for the selected public domain names. Preserve the existing domain behavior and do not add a new controller, CLI parser, storage code, or runtime loop. Save all edited files, read them back, and run python -m briar_glen.main from the project root."
checks = ["main.py names its dependency with the briar_glen package path, while __init__.py names its sibling through a leading dot.", "The module run reaches the established deterministic trail rather than a replacement transcript or module-not-found diagnostic."]

[[lessons.readings]]
label = "Python tutorial: modules and packages"
url = "https://docs.python.org/3/tutorial/modules.html#packages"

[[lessons.exercises]]
id = "s12-l01-e1"
type = "mc"
points = 18
mechanisms = ["python-absolute-import"]
prompt = "Which disposable import lets a package entry obtain signal from beacon.domain by its full package path?"
choices = ["from beacon.domain import signal", "from .domain import signal", "import signal from beacon.domain", "from domain import beacon.signal"]
answer = 0
whyWrong = "A relative import describes an inside-package position, while the other choices are not Python import grammar or reverse the owner and name."
hint = "Start with from, then write the package and module separated by a dot."
explain = "The absolute form names beacon.domain before the selected signal name."

