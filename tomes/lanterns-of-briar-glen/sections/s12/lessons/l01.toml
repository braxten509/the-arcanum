[[lessons.exercises]]
id = "s12-l01-w1"
type = "write"
points = 35
mechanisms = ["python-absolute-import", "python-relative-import", "python-import-statement", "python-def-statement", "python-return-statement", "python-function-call", "python-print-call"]
prompt = "Write a disposable program with a function named route_mark that returns north, then call it and print the returned value. Below the program, write the absolute import that an entry would use for watchfire.routes and the relative import that watchfire/__init__.py would use for its routes sibling. Do not create a Briar Glen file."
expect = "north"
solution = '''def route_mark():
    return "north"


print(route_mark())'''
hint = "The runnable program only needs the function and one print; the two import forms are written as answers below it."
