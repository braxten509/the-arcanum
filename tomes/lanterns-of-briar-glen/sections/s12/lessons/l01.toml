mechanisms = ["python-relative-import"]
prompt = "Complete the sibling-relative import inside a disposable package initializer."
code = "from ____.domain import signal"
answer = "."
hint = "One dot means the package containing this file."

[[lessons.exercises]]
id = "s12-l01-e3"
type = "text"
points = 18
mechanisms = ["python-absolute-import", "python-relative-import"]
prompt = "Why can a bare sibling import be fragile for a package entry?"
answer = "It depends on a file-path launch instead of the package context"
accept = ["it may fail when the package is run with -m", "it does not name the package owner"]
hint = "Compare a loose script launch with package module execution."
explain = "A package-qualified import makes the dependency route explicit during module execution."

