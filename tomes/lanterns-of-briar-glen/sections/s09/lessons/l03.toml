[[lessons.exercises]]
id = "s09-l03-w1"
type = "write"
points = 35
mechanisms = ["python-class-statement", "python-init-method", "python-self-parameter", "python-instance-construction", "python-instance-attribute", "python-identity-operator", "python-print-call"]
prompt = "Write a disposable program defining MapPin with an initializer that stores a zone. Construct one pin with zone ridge, bind a second name directly to that pin, construct another MapPin with zone ridge, then print whether the direct alias is the first pin and whether the separately constructed pin is the first pin. This is not a Briar Glen artifact."
expect = '''True
False'''
solution = '''class MapPin:
    def __init__(self, zone):
        self.zone = zone


first_pin = MapPin("ridge")
alias_pin = first_pin
other_pin = MapPin("ridge")
print(first_pin is alias_pin)
print(first_pin is other_pin)'''
hint = "The direct assignment preserves one object reference; calling MapPin again constructs a different object even with the same zone."
