[[lessons.exercises]]
id = "s09-l01-e1"
type = "mc"
points = 18
mechanisms = ["python-init-method", "python-instance-construction"]
prompt = "When does Python call __init__ in the TrailMarker example?"
choices = ["When marker.label is printed", "When TrailMarker(\"east gate\") constructs an instance", "When the class statement is parsed", "Only after a separate manual call"]
answer = 1
whyWrong = "The class statement creates a recipe, while reading an attribute only uses an already-created object. __init__ is invoked by construction."
hint = "Look for the expression that asks Python to make a new object."
explain = "Calling the class name constructs an instance and invokes its initializer."

[[lessons.exercises]]
id = "s09-l01-e2"
type = "fill"
points = 20
mechanisms = ["python-self-parameter"]
prompt = "Complete the object reference that stores the supplied rank on the current disposable scout."
code = "____.rank = rank"
answer = "self"
hint = "Use the conventional first parameter of an instance method."
whyWrong = "The assignment must target the particular object being initialized, not a free name or the class recipe."

[[lessons.exercises]]
id = "s09-l01-e3"
type = "text"
points = 18
mechanisms = ["python-class-statement", "python-instance-construction"]
prompt = "What is the name for the concrete value produced by calling a class recipe such as TrailMarker with constructor arguments?"
answer = "instance"
accept = ["an instance", "object"]
hint = "It is one particular result made from a reusable recipe."
whyWrong = "The class is the reusable recipe; the constructed value is the particular object that carries its own data."

[[lessons.exercises]]
id = "s09-l01-w1"
type = "write"
points = 34
mechanisms = ["python-class-statement", "python-init-method", "python-self-parameter", "python-instance-construction", "python-print-call"]
prompt = "Write a disposable program that defines Beacon with an initializer accepting color and stores it on the instance. Construct a Beacon with the color amber and print its color exactly once. This is not a Briar Glen artifact."
expect = "amber"
solution = '''class Beacon:
    def __init__(self, color):
        self.color = color


beacon = Beacon("amber")
print(beacon.color)'''
hint = "The initializer assigns the incoming color to an attribute on self, then the print reads that attribute from the constructed beacon."
