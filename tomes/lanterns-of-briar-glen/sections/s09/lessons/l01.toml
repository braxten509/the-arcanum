[[lessons]]
id = "s09-l01"
title = "Define a Player Type"
teaches = ["player-object-model"]
introduces = ["python-class-statement", "python-init-method", "python-self-parameter", "python-instance-construction"]
body = '''
<p>Until now, Briar Glen has carried the traveler’s health in a mapping passed from function to function. That is useful evidence of explicit state, but the traveler now has a coherent shape: a <strong>class</strong> is a recipe for objects that carry related data and behavior. Write <code>class Player:</code> at top level. Its indented body defines what every player instance will have; it does not itself create Mira.</p>
<pre><code data-kind="runnable"><span class="k">class</span> TrailMarker:
    <span class="k">def</span> __init__(self, label):
        self.label = label


marker = TrailMarker(<span class="s">"east gate"</span>)
<span class="k">print</span>(marker.label)
</code></pre>
<p>The special method named <code>__init__</code> runs when construction makes a new object. Its first parameter is conventionally named <code>self</code>. Python supplies that argument for the particular object being initialized, so the caller writes <code>TrailMarker("east gate")</code>, not a separate value for <code>self</code>. The assignment <code>self.label = label</code> stores an instance attribute on that one object. The sample prints <code>east gate</code>; making another marker would create a separate object with its own label.</p>
<p>For the trail, choose a focused <code>Player</code> constructor with the hero facts that genuinely belong to one hero: a name and health. Do not move the independent pack, discoveries, command list, or route result inside the object. Those will become an explicit composition question later. In this section, the point is to migrate one state record into one object without turning every nearby collection into a field merely because it is available.</p>
<p>Construction is a boundary worth testing. Arrange a fresh player in a test, then assert the observable attributes rather than depending on the terminal transcript. A constructor typo commonly appears as <code>AttributeError</code> when later code reads a name that was never assigned; a missing indented body is a syntax error before the program runs. Read the first error location, repair the class boundary, and rerun the focused suite. Keep the saved six-command trail and its existing exception recovery intact while its former health mapping becomes a player instance.</p>
<div class="field-notes"><div class="fn-head">FIELD NOTES // RECIPE AND RESULT</div><p><code>Player</code> names the recipe. The value returned by <code>Player(...)</code> is a particular player object. Keep those two levels distinct when reading a traceback or writing an assertion.</p></div>
'''

[[lessons.concepts]]
id = "player-object-model"
purpose = "Model one coherent game participant with a class recipe and independently constructed objects."
anatomy = "Declare the class, define __init__ with self first, assign instance attributes from constructor arguments, then call the class to construct an object."
example = "The disposable TrailMarker recipe constructs a marker whose label can be read from that instance."
observable = "Printing marker.label shows the value stored on the constructed object."
failure = "Using the class recipe where an instance is needed leaves no per-object attributes to read."
practice = "s09-l01-w1"

[[lessons.concepts]]
id = "python-class-statement"
purpose = "Declare a reusable recipe for related state and behavior."
anatomy = "Write class, a capitalized type name, a colon, and an indented body."
example = "class TrailMarker: begins the disposable recipe."
observable = "Python can evaluate the class name before any marker is constructed."
failure = "A missing colon or indentation prevents Python from parsing the class body."
practice = "s09-l01-w1"

[[lessons.concepts]]
id = "python-init-method"
purpose = "Initialize a newly constructed object at its creation boundary."
anatomy = "Define __init__ inside the class and give it self plus the incoming values it needs."
example = "TrailMarker.__init__ receives label while construction is occurring."
observable = "Construction completes with the promised instance data available."
failure = "A misspelled __init__ is an ordinary method and will not run automatically."
practice = "s09-l01-w1"

[[lessons.concepts]]
id = "python-self-parameter"
purpose = "Refer to the particular object receiving an initializer or method call."
anatomy = "Put self first in an instance method definition and use self.attribute for that object’s stored data."
example = "self.label names the label on the marker currently being initialized."
observable = "Two constructed markers can retain different labels."
failure = "Assigning only to label leaves no attribute stored on the object."
practice = "s09-l01-w1"

[[lessons.concepts]]
id = "python-instance-construction"
purpose = "Create a concrete object from a class recipe."
anatomy = "Call the class name with constructor arguments and bind the returned instance to a variable."
example = "marker = TrailMarker(\"east gate\") constructs one marker."
observable = "The bound marker value exposes its initialized attribute."
failure = "Calling the class with the wrong number of arguments reports a constructor TypeError."
practice = "s09-l01-w1"

[[lessons.artifactSteps]]
id = "s09-l01-shape-the-player"
path = "game.py"
mode = "author"
mechanisms = ["python-class-statement", "python-init-method", "python-self-parameter", "python-instance-construction", "editor-edit-file", "editor-save-file", "terminal-read-saved-file"]
instruction = "In learner-authored game.py, replace only the existing player-state mapping representation with a top-level Player class and one constructed player. Give the object the hero name and health facts that prior trail code needs, then update existing reads to use the object’s attributes. Preserve separate inventory and discovery collections, the existing commands, error boundary, completion records, and terminal observations. Save, reread the file, and run python game.py from the external project root; do not add inheritance, another class, files, packages, Pygame, or a new artifact."
checks = ["The saved source constructs one Player and every migrated health/name read traces to that object.", "The six-turn run still ends with Turns taken: 6 and Final health: 12."]

[[lessons.readings]]
label = "Python tutorial: classes"
url = "https://docs.python.org/3/tutorial/classes.html"

