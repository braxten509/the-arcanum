e constructor rejects below-zero health, and an alias is the same object while a separately constructed matching player is not. Use arrange, act, assert with fresh state in every test. Do not test by copying the trail or by inspecting implementation text.</li><li>Read both saved files. With the established <code>.venv</code> active from the external project root, run <code>python -m pytest -q</code> until it reports <code>8 passed</code>, then run <code>python game.py</code> twice and compare the final observations. Do not add input, files, context managers, modules, packages, annotations, Pygame, dependencies, or another project path.</li></ul>'''
