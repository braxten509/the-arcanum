[[freestyle.referenceSteps]]
id = "s09-rewrite-trail-with-player"
path = "game.py"
mode = "rewrite"
preserves = "all-active"
mechanisms = ["python-class-statement", "python-init-method", "python-self-parameter", "python-instance-construction", "python-instance-attribute", "python-instance-method", "python-exception-types", "python-raise-statement", "python-try-statement", "python-except-clause", "python-else-exception-clause", "python-finally-clause", "python-def-statement", "python-function-call", "python-parameters-arguments", "python-return-statement", "python-if-statement", "python-elif-clause", "python-else-clause", "python-for-statement", "python-range-call", "python-while-statement", "python-break-statement", "python-continue-statement", "python-list-literal", "list-append-method", "python-dict-literal", "python-dict-key-access", "python-set-literal", "set-add-method", "python-membership-operators", "python-print-call", "python-f-string", "mutating-function-boundary", "bounded-loop-invariant"]
instruction = "Private replay migrates only the player-state record to a Player object while preserving the six-turn trail, its command boundary, and completion records."
content = '''health = 10
lantern_oil = 3
remaining_oil = lantern_oil - 1
lantern_lit = health > 0 and remaining_oil > 0


class Player:
    def __init__(self, name, health):
        if health < 0:
            raise ValueError("Health cannot be negative")
        self.name = name
        self.health = health

    def rest(self):
        self.health = self.health + 2
        return self.health


traveler_name = "Mira"
player = Player(traveler_name, health)
status_lead = "Lantern status for " + player.name
status_line = f"{status_lead}: {player.health} health, {remaining_oil} oil, lit={lantern_lit}"

raw_command = "  LOOK WAYSTONE  "
normalized_command = raw_command.strip().lower()
command_parts = normalized_command.split()

inventory = ["waystone map", "rations"]
inventory_snapshot = inventory.copy()
discoveries = {"north gate"}
camp_coordinate = (4, 7)


def turn_line(turn_number, command):
    return f"Turn {turn_number}: {command}"


def has_lantern_key(trail_discoveries):
    return "lantern key" in trail_discoveries


def validate_command(command):
    allowed_commands = [
        "look waystone",
        "take moonleaf",
        "rest",
        "search briar",
        "leave",
    ]
    if command not in allowed_commands:
        raise ValueError("Unknown command: " + command)
    return command


def show_opening(status, command, parts, pack, trail_player, trail_discoveries, coordinate):
    print(status)
    print("Normalized command:", command)
    print("Command words:", parts)
    print("Pack before trail:", pack)
    print("First packed item:", pack[0])
    print("Player health:", trail_player.health)
    print("Unknown camp:", "unknown")
    trail_discoveries.add("north gate")
    print("Known north gate:", "north gate" in trail_discoveries)
    print("Coordinates:", coordinate)


def search_briar(trail_discoveries):
    search_marks = ["thorns", "old ribbon", "lantern key", "deep mud"]
    search_index = 0
    while search_index < 4:
        search_mark = search_marks[search_index]
        search_index = search_index + 1
        if search_mark == "old ribbon":
            continue
        print("Search:", search_mark)
        if search_mark == "lantern key":
            trail_discoveries.add("lantern key")
            print("Lantern key found.")
            break
    return has_lantern_key(trail_discoveries)


def handle_command(command, pack, trail_player, trail_discoveries):
    validate_command(command)
    route_result = {"path_open": False, "keep_traveling": True}
    if command == "look waystone":
        trail_discoveries.add("waystone")
        print("The waystone points north.")
    elif command == "take moonleaf" and "moonleaf" not in pack:
        pack.append("moonleaf")
        print("Moonleaf packed.")
    elif command == "rest":
        restored_health = trail_player.rest()
        print(f"Health restored: {restored_health}")
    elif command == "search briar":
        route_result["path_open"] = search_briar(trail_discoveries)
    elif command == "leave":
        print("Trail closed.")
        route_result["keep_traveling"] = False
    return route_result


def run_turn(command, pack, trail_player, trail_discoveries, completed_commands):
    try:
        route_result = handle_command(command, pack, trail_player, trail_discoveries)
    except ValueError as error:
        print("Invalid command:", error)
        return {"path_open": False, "keep_traveling": True}
    else:
        return route_result
    finally:
        completed_commands.append(command)
        print("Turn cleanup:", command)


commands = [
    normalized_command,
    "take moonleaf",
    "rest",
    "search briar",
    "sing",
    "leave",
]
turn_limit = 6
turns_taken = 0
path_open = False
completed_commands = []

show_opening(
    status_line,
    normalized_command,
    command_parts,
    inventory,
    player,
    discoveries,
    camp_coordinate,
)

for turn_index in range(turn_limit):
    command = commands[turn_index]
    turns_taken = turns_taken + 1
    print(turn_line(turns_taken, command))
    route_result = run_turn(
        command,
        inventory,
        player,
        discoveries,
        completed_commands,
    )
    path_open = route_result["path_open"]
    if route_result["keep_traveling"] == False:
        break

print("Turns taken:", turns_taken)
print("Pack after trail:", inventory)
print("Snapshot before trail:", inventory_snapshot)
print("Found lantern key:", has_lantern_key(discoveries))
print("Path open:", path_open)
print("Final health:", player.health)
print("Completed turns:", completed_commands)
'''

[[freestyle.referenceSteps]]
id = "s09-replace-player-regression-tests"
path = "tests/test_game.py"
mode = "replace"
find = '''from game import handle_command, run_turn, turn_line
'''
mechanisms = ["python-import-statement", "pytest-test-function", "python-assert-statement", "arrange-act-assert", "python-instance-construction", "python-instance-attribute", "python-instance-method", "python-identity-operator", "python-exception-types", "python-try-statement", "python-except-clause", "python-function-call", "python-list-literal", "python-set-literal", "list-append-method", "mutating-function-boundary", "pure-function-boundary"]
instruction = "Private replay preserves the five earlier tests while migrating fixtures to Player and adding construction, invariant, method, and identity evidence."
content = '''from game import Player, handle_command, run_turn, turn_line


def test_turn_line_returns_numbered_command():
    turn_number = 3
    command = "rest"

    actual_line = turn_line(turn_number, command)

    assert actual_line == "Turn 3: rest"


def test_rest_command_changes_supplied_player_and_keeps_traveling():
    inventory = []
    player = Player("Mira", 10)
    discoveries = set()

    route_result = handle_command("rest", inventory, player, discoveries)

    assert player.health == 12
    assert route_result == {"path_open": False, "keep_traveling": True}


def test_invalid_command_raises_value_error_before_player_mutation():
    inventory = []
    player = Player("Mira", 10)
    discoveries = set()
    was_rejected = False

    try:
        handle_command("sing", inventory, player, discoveries)
    except ValueError:
        was_rejected = True

    assert was_rejected == True
    assert inventory == []
    assert player.health == 10
    assert discoveries == set()


def test_invalid_turn_recovers_and_records_completion():
    inventory = []
    player = Player("Mira", 10)
    discoveries = set()
    completed_commands = []

    route_result = run_turn(
        "sing",
        inventory,
        player,
        discoveries,
        completed_commands,
    )

    assert route_result == {"path_open": False, "keep_traveling": True}
    assert inventory == []
    assert player.health == 10
    assert discoveries == set()
    assert completed_commands == ["sing"]


def test_successful_turn_records_completion():
    inventory = []
    player = Player("Mira", 10)
    discoveries = set()
    completed_commands = []

    route_result = run_turn(
        "rest",
        inventory,
        player,
        discoveries,
        completed_commands,
    )

    assert route_result == {"path_open": False, "keep_traveling": True}
    assert player.health == 12
    assert completed_commands == ["rest"]


def test_player_construction_exposes_name_and_health():
    player = Player("Mira", 10)

    assert player.name == "Mira"
    assert player.health == 10


def test_player_rest_returns_new_health_and_rejects_negative_start():
    player = Player("Mira", 10)
    was_rejected = False

    restored_health = player.rest()
    try:
        Player("Mira", -1)
    except ValueError:
        was_rejected = True

    assert restored_health == 12
    assert player.health == 12
    assert was_rejected == True


def test_player_identity_distinguishes_alias_from_new_instance():
    player = Player("Mira", 10)
    alias = player
    other_player = Player("Mira", 10)

    assert alias is player
    assert other_player is not player
'''

