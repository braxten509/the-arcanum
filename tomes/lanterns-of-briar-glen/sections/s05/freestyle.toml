[freestyle]
title = "THE WORKING: FORKS IN THE BRIAR"
brief = '''<p>Rowan hands you six fixed trail commands, wayfinder. Turn the learner-authored <code>game.py</code> receipt into a deterministic controller that proves each command changes or observes the established state through Python control flow.</p><ul><li>Preserve the carried-forward numeric state, normalized command text, inventory, player-state mapping, discoveries, coordinate, and an independent pre-turn inventory snapshot. The normalized look command must be the first entry in one six-command saved sequence; the remaining routes are pickup, rest, search, an unknown command, and leave, in that order.</li><li>Use one numeric turn limit equal to the sequence size. A <code>for</code> loop over <code>range()</code> must retrieve each command by its current index, increment a turns-taken name exactly once, print the numbered turn, and route it through one <code>if</code>/<code>elif</code>/<code>else</code> chain.</li><li>The lookup route adds a new discovery; pickup appends one new item only when absent; rest raises the established health by two; the unknown route prints a fallback. Leave prints its outcome and then breaks the outer loop.</li><li>The search route owns a four-entry collection with an irrelevant marker before the lantern key and an entry after it. Use a position-controlled <code>while</code> loop bounded at four. Retrieve and advance before any <code>continue</code>, do not print the ignored marker, print relevant inspected entries, and when the lantern key is found add it to discoveries, derive an open-path Boolean, print the result, and <code>break</code> only the inner search.</li><li>After the loop, print summaries derived from the real changed state. The transcript must show six turns and end with the observations <code>Turns taken: 6</code>, <code>Found lantern key: True</code>, <code>Path open: True</code>, and <code>Final health: 12</code>; it must also distinguish the changed inventory from the unchanged pre-turn snapshot.</li><li>Save and read <code>game.py</code>, then run <code>python game.py</code> twice from the external project root with <code>.venv</code> active. Both transcripts must match. Do not add input, functions, tests, exceptions, classes, modules, file I/O, dependencies, Pygame, package material, or another project path.</li></ul>'''
requires = ["conditional-command-routing", "bounded-turn-loop", "loop-control-search", "text-trail-controller", "language-control-branch-loop", "language-values-expressions-data", "language-collections-list-dict-set-tuple"]
mechanisms = ["terminal-print-working-directory", "terminal-change-directory", "terminal-check-python-version", "venv-create-environment", "venv-activate-environment", "venv-resolve-active-python", "editor-create-file", "editor-edit-file", "editor-save-file", "terminal-read-saved-file", "terminal-invoke-saved-file", "python-literal-values", "python-name-binding", "python-arithmetic-operators", "python-comparison-operators", "python-boolean-operators", "python-print-call", "python-string-literal", "python-string-concatenation", "python-f-string", "string-strip-method", "string-lower-method", "string-split-method", "python-list-literal", "python-list-indexing", "list-append-method", "python-dict-literal", "python-dict-key-access", "dict-get-method", "python-set-literal", "python-membership-operators", "set-add-method", "python-tuple-literal", "collection-copy-method", "python-if-statement", "python-elif-clause", "python-else-clause", "python-for-statement", "python-in-loop-target", "python-range-call", "python-while-statement", "python-break-statement", "python-continue-statement", "bounded-loop-invariant"]
reward = 180
xray = "Trace the learner's saved state rather than rewarding a printed imitation. The grader checks a six-turn indexed range loop, one exclusive route chain, once-per-turn counting, an advancing four-entry while search whose continue cannot stall, nearest-loop break behavior, and summaries derived from mutated health, inventory, discoveries, and path state. Dock input, functions, tests, exceptions, classes, modules, file I/O, dependencies, Pygame, packages, new paths, hard-coded final receipts, unsafe bounds, or an inventory snapshot made after mutation. Reward descriptive snake_case, 4-space blocks, aligned branch structure, one space around operators, and compact PEP 8-readable lines."

[[freestyle.referenceSteps]]
id = "s05-rewrite-collection-receipt-as-bounded-controller"
path = "game.py"
mode = "rewrite"
preserves = "all-active"
mechanisms = ["python-literal-values", "python-name-binding", "python-arithmetic-operators", "python-comparison-operators", "python-boolean-operators", "python-print-call", "python-string-literal", "python-string-concatenation", "python-f-string", "string-strip-method", "string-lower-method", "string-split-method", "python-list-literal", "python-list-indexing", "list-append-method", "python-dict-literal", "python-dict-key-access", "dict-get-method", "python-set-literal", "python-membership-operators", "set-add-method", "python-tuple-literal", "collection-copy-method", "python-if-statement", "python-elif-clause", "python-else-clause", "python-for-statement", "python-in-loop-target", "python-range-call", "python-while-statement", "python-break-statement", "python-continue-statement", "bounded-loop-invariant"]
instruction = "Private replay rewrites the cumulative source as the bounded deterministic text-trail controller while preserving all earlier value, text, and collection contracts."
content = '''health = 10
lantern_oil = 3
remaining_oil = lantern_oil - 1
lantern_lit = health > 0 and remaining_oil > 0

traveler_name = "Mira"
status_lead = "Lantern status for " + traveler_name
status_line = f"{status_lead}: {health} health, {remaining_oil} oil, lit={lantern_lit}"

raw_command = "  LOOK WAYSTONE  "
normalized_command = raw_command.strip().lower()
command_parts = normalized_command.split()

inventory = ["waystone map", "rations"]
inventory_snapshot = inventory.copy()
player_state = {"health": health, "title": "Wayfinder"}
discoveries = {"north gate"}
camp_coordinate = (4, 7)

commands = [
    normalized_command,
    "take moonleaf",
    "rest",
    "search briar",
    "sing",
    "leave",
]
turn_limit = 6
turns_taken = 0
path_open = False

print(status_line)
print("Normalized command:", normalized_command)
print("Command words:", command_parts)
print("Pack before trail:", inventory)
print("First packed item:", inventory[0])
print("Player health:", player_state["health"])
print("Unknown camp:", player_state.get("camp", "unknown"))
discoveries.add("north gate")
print("Known north gate:", "north gate" in discoveries)
print("Coordinates:", camp_coordinate)

for turn_index in range(turn_limit):
    command = commands[turn_index]
    turns_taken = turns_taken + 1
    print(f"Turn {turns_taken}: {command}")

    if command == "look waystone":
        discoveries.add("waystone")
        print("The waystone points north.")
    elif command == "take moonleaf" and "moonleaf" not in inventory:
        inventory.append("moonleaf")
        print("Moonleaf packed.")
    elif command == "rest":
        health = health + 2
        print(f"Health restored: {health}")
    elif command == "search briar":
        search_marks = ["thorns", "old ribbon", "lantern key", "deep mud"]
        search_index = 0
        while search_index < 4:
            search_mark = search_marks[search_index]
            search_index = search_index + 1
            if search_mark == "old ribbon":
                continue
            print("Search:", search_mark)
            if search_mark == "lantern key":
                discoveries.add("lantern key")
                path_open = "lantern key" in discoveries
                print("Lantern key found.")
                break
    elif command == "leave":
        print("Trail closed.")
        break
    else:
        print("Unknown command.")

print("Turns taken:", turns_taken)
print("Pack after trail:", inventory)
print("Snapshot before trail:", inventory_snapshot)
print("Found lantern key:", "lantern key" in discoveries)
print("Path open:", path_open)
print("Final health:", health)
'''

