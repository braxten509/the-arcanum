[[lessons.exercises]]
id = "s05-l04-e5"
type = "write"
points = 35
mechanisms = ["bounded-loop-invariant", "python-for-statement", "python-in-loop-target", "python-range-call", "python-if-statement", "python-elif-clause", "python-else-clause", "python-break-statement", "python-list-literal", "python-list-indexing", "python-name-binding", "python-arithmetic-operators", "python-print-call"]
prompt = "Write a disposable parcel controller for weights = [105, 95, 0, 110], maximum_checks = 4, and checks_completed = 0. Loop over range(maximum_checks), retrieve the indexed weight, increment checks_completed once, print standard for a weight at least 100, light for a lower nonzero weight, and empty then break for zero. After the loop print checks and the derived count. Produce exactly the output below."
expect = '''standard
light
empty
checks 3'''
solution = '''weights = [105, 95, 0, 110]
maximum_checks = 4
checks_completed = 0
for check_index in range(maximum_checks):
    weight = weights[check_index]
    checks_completed = checks_completed + 1
    if weight == 0:
        print("empty")
        break
    elif weight < 100:
        print("light")
    else:
        print("standard")
print("checks", checks_completed)
'''
hint = "Count immediately after retrieval, test zero before the lower-weight branch, and print the count only after the loop."
