[[lessons.exercises]]
id = "s05-l03-e2"
type = "mc"
points = 19
mechanisms = ["python-continue-statement", "python-name-binding"]
prompt = "In a position-controlled while search, where should the position update occur when an ignored entry may execute continue?"
choices = ["Only after the loop has ended", "Before the possible continue", "Inside code that runs only after a successful break", "It is unnecessary because continue advances the position"]
answer = 1
whyWrong = "continue does not update state for you. An update after the skip may never run, while an update after break is unreachable and one after the loop cannot help the active condition."
hint = "Ask which statements continue skips."
explain = "Advancing before the possible skip guarantees progress on every pass."

