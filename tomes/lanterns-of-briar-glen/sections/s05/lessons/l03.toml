[[lessons.exercises]]
id = "s05-l03-e5"
type = "write"
points = 35
mechanisms = ["python-while-statement", "python-break-statement", "python-continue-statement", "python-list-literal", "python-list-indexing", "python-if-statement", "python-name-binding", "python-arithmetic-operators", "python-print-call"]
prompt = "Write a disposable bounded search over tags = [\"reed\", \"ignore\", \"bell\", \"rope\"]. Use a position starting at 0 and while position is less than 4. Retrieve the current tag and advance position before any skip. Continue when the tag is ignore. Print each other visited tag; immediately after printing bell, break. The exact output is reed then bell on separate lines."
expect = '''reed
bell'''
solution = '''tags = ["reed", "ignore", "bell", "rope"]
position = 0
while position < 4:
    tag = tags[position]
    position = position + 1
    if tag == "ignore":
        continue
    print(tag)
    if tag == "bell":
        break
'''
hint = "Advance immediately after indexing, then place continue before print and break after printing bell."
