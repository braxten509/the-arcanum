[[lessons.exercises]]
id = "s05-l02-e5"
type = "write"
points = 34
mechanisms = ["python-for-statement", "python-in-loop-target", "python-range-call", "python-list-literal", "python-list-indexing", "python-print-call"]
prompt = "Write a disposable program with samples equal to [\"ash\", \"fern\", \"clay\"]. Use one for loop over range(3), retrieve each sample through the generated index, and print the index and sample. The exact output is the three lines shown below."
expect = '''0 ash
1 fern
2 clay'''
solution = '''samples = ["ash", "fern", "clay"]
for sample_index in range(3):
    print(sample_index, samples[sample_index])
'''
hint = "Use the range value both as the printed number and as the list index."
