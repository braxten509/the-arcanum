[[lessons.exercises]]
id = "s05-l02-e1"
type = "mc"
points = 19
mechanisms = ["python-range-call"]
prompt = "Which values does range(4) supply to a one-argument counted loop?"
choices = ["1, 2, 3, 4", "0, 1, 2, 3", "0, 1, 2, 3, 4", "4 only"]
answer = 1
whyWrong = "A one-argument range begins at zero, excludes its stop value, and supplies every integer in between; it neither starts at one nor yields only the boundary."
hint = "The stop argument is not included."
explain = "range(4) yields four values: 0 through 3."

