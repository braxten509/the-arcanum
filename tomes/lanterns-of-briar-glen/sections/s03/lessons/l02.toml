[[lessons.exercises]]
id = "s03-l02-w1"
type = "text"
points = 30
mechanisms = ["python-string-literal", "string-strip-method", "string-lower-method", "python-print-call"]
prompt = "Write a tiny disposable program that binds raw_signal to \"  RING BELL  \", derives cleaned_signal by trimming and lowercasing it, then prints cleaned_signal."
answer = '''raw_signal = "  RING BELL  "
