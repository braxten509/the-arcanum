type = "fill"
points = 20
mechanisms = ["string-split-method"]
prompt = "Complete the method call that derives pieces from this disposable normalized order."
code = "pieces = normalized_order.____"
answer = "split()"
hint = "Use the string method named for separating text."

[[lessons.exercises]]
id = "s03-l03-e2"
type = "mc"
points = 18
mechanisms = ["string-split-method"]
prompt = "What does print(\"ring bell\".split()) display?"
choices = ["ring bell", "['ring', 'bell']", "['ring bell']", "An error because split requires an argument"]
answer = 1
whyWrong = "split() without an argument separates at whitespace; it does not keep the phrase whole or require a separator argument."
hint = "There is one whitespace boundary between the words."
explain = "The method derives two pieces and Python displays them quoted inside brackets."

