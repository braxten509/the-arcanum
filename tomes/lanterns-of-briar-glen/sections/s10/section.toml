id = "s10"
codename = "CHAPTER X // COMPANIONS, NOT INHERITANCE"
short = "Companions, Not Inheritance"
title = "Give Objects Distinct Jobs"
build = "own language-composition-design through collaborating inventory, quest-state, and player objects with explicit ownership and delegation, retrieving collections, functions, classes, exceptions, and tests for a milestone that would break if the objects remained one record."
brief = '''<p>One Player object was a useful boundary, but it is now carrying facts with different reasons to change. Rowan introduces composition: small collaborating objects, each with one job, connected by explicit ownership instead of an inheritance ladder. The deterministic terminal trail, its ValueError recovery, and its tests remain. The learner will split pack and quest concerns from the hero, then prove calls cross the intended boundaries. This is still not a window, files, modules, annotations, inheritance, or a second game.</p>'''

