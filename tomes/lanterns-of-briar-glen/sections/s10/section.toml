expect = "11 passed"
guidedChecks = [
  "From the external project root with .venv active, read the learner-created game.py and tests/test_game.py, then run python -m pytest -q. Confirm it reports 11 passed: earlier class and invalid-command checks still pass, while fresh collaborators prove that Inventory owns its items, QuestState owns quest progress, and Player delegates rather than reaching into another object's storage.",
