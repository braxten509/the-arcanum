points = 18
mechanisms = ["arrange-act-assert"]
prompt = "Why should each composed state test construct fresh collaborators?"
answer = "So mutations from one test cannot leak into another test"
accept = ["to prevent state leaking between tests", "so tests are isolated from earlier mutations"]
hint = "Mutable inventories and quest records remember changes."

