[[lessons.exercises]]
id = "s10-l03-w1"
type = "write"
points = 35
mechanisms = ["collaborator-test-seam", "python-class-statement", "python-init-method", "python-self-parameter", "python-instance-construction", "python-instance-attribute", "python-instance-method", "python-list-literal", "list-append-method", "python-function-call", "python-assert-statement", "python-print-call"]
prompt = "Write a disposable program with a Ledger that stores notes and records one note, and a Scout that stores a supplied Ledger and delegates mark(note) to it. Construct fresh objects, call mark on west, assert the Ledger notes equal ['west'], then print verified. This is not a Briar Glen artifact."
expect = "verified"
solution = '''class Ledger:
    def __init__(self):
        self.notes = []

    def record(self, note):
        self.notes.append(note)


class Scout:
    def __init__(self, ledger):
        self.ledger = ledger

    def mark(self, note):
        self.ledger.record(note)


ledger = Ledger()
scout = Scout(ledger)
scout.mark("west")
assert ledger.notes == ["west"]
print("verified")'''
hint = "Assert the state owned by Ledger after calling through Scout."
