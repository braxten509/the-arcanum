[[lessons.exercises]]
id = "s10-l02-w1"
type = "write"
points = 35
mechanisms = ["object-ownership", "method-delegation", "composition-over-inheritance", "python-class-statement", "python-init-method", "python-self-parameter", "python-instance-attribute", "python-instance-method", "python-list-literal", "list-append-method", "python-function-call", "python-print-call"]
prompt = "Write a disposable program with a Journal that stores an empty entries list and records a supplied place, and an Explorer that stores a supplied Journal and has visit(place) which delegates to the Journal. Construct both objects, visit ford through Explorer, and print the Journal entries. This is not a Briar Glen artifact."
expect = "['ford']"
solution = '''class Journal:
    def __init__(self):
        self.entries = []

    def record(self, place):
        self.entries.append(place)


class Explorer:
    def __init__(self, journal):
        self.journal = journal

    def visit(self, place):
        self.journal.record(place)


journal = Journal()
explorer = Explorer(journal)
explorer.visit("ford")
print(journal.entries)'''
hint = "Explorer stores Journal; visit calls the Journal method rather than appending itself."
