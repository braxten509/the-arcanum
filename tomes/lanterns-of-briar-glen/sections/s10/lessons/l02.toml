prompt = "Which statement describes the appropriate relationship between a disposable Explorer and Journal?"
choices = ["Explorer is a Journal", "Journal is an Explorer", "Explorer has a Journal", "Explorer inherits every Journal entry"]
answer = 2
whyWrong = "The objects have different jobs; neither is a specialized kind of the other, and inherited entries hide ownership."
hint = "Choose the has-a relationship."
explain = "Composition says an Explorer has a Journal collaborator."

