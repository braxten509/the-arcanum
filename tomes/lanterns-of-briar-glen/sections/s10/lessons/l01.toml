[[lessons.exercises]]
id = "s10-l01-w1"
type = "write"
points = 35
mechanisms = ["collaborating-object-responsibility", "constructor-dependency-injection", "python-class-statement", "python-init-method", "python-self-parameter", "python-instance-construction", "python-instance-attribute", "python-list-literal", "list-append-method", "python-print-call"]
prompt = "Write a disposable program with a Crate class that stores a supplied list as labels and has add_label(label), and a Courier class that stores a supplied crate. Construct an empty-label Crate, construct a Courier with it, ask the courier’s crate to add east, then print the crate labels. This is not a Briar Glen artifact."
expect = "['east']"
solution = '''class Crate:
    def __init__(self, labels):
        self.labels = labels

    def add_label(self, label):
        self.labels.append(label)


class Courier:
    def __init__(self, crate):
        self.crate = crate


crate = Crate([])
courier = Courier(crate)
courier.crate.add_label("east")
print(crate.labels)'''
hint = "Construct the collaborator first and pass the same object into Courier."
