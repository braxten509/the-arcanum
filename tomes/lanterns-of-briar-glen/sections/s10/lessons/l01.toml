type = "mc"
points = 18
mechanisms = ["collaborating-object-responsibility"]
prompt = "Which responsibility belongs most directly to a disposable QuestLog collaborator?"
choices = ["Changing the traveler’s health", "Adding a discovered shrine name", "Parsing command-line flags", "Opening a Pygame window"]
answer = 1
whyWrong = "Health belongs to the traveler, and command-line and window work are later boundaries. A discovery is quest state."
hint = "Choose the action that changes quest knowledge."
explain = "A quest collaborator owns discoveries and rules derived from them."

