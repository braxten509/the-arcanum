[[lessons]]
id = "s10-l01"
title = "Give Objects Distinct Jobs"
teaches = ["collaborator-responsibilities"]
introduces = ["collaborating-object-responsibility", "constructor-dependency-injection"]
body = '''
<p>Last chapter gave one <code>Player</code> a shape. That did not mean every trail fact belongs to Player. Before making another class, name the change that should send you looking for it. A pack changes when an item is gained or inspected. A quest record changes when a discovery is marked or a route becomes open. A player changes when health or identity changes. Those are three jobs, so they deserve three collaborators rather than one swelling record.</p>
<p>Composition starts with responsibility, not syntax. A small object owns the data that its own methods protect. In this disposable example, <code>SupplyPouch</code> owns its list and the operation that adds to it; the traveler merely receives a pouch through the constructor. The constructor dependency is explicit: the caller can see which collaborator must exist before the traveler does.</p>
<pre><code data-kind="runnable"><span class="k">class</span> SupplyPouch:
    <span class="k">def</span> add(<span class="n">self</span>, <span class="n">supply</span>):
        <span class="n">self</span>.supplies.append(<span class="n">supply</span>)

<span class="k">class</span> TrailWalker:
    <span class="k">def</span> __init__(<span class="n">self</span>, <span class="n">pouch</span>):
        <span class="n">self</span>.pouch = <span class="n">pouch</span></code></pre>
<p>This is not inheritance. Neither class claims to be a more specialized version of the other. One object has another object. Keep the data path visible: construct the pouch, pass it in, then ask the pouch to change its own collection. A constructor parameter is not ceremonial; it records a dependency and makes later tests able to supply a fresh collaborator.</p>
<p>For Briar Glen, do not invent a generic manager or move the route controller into a class. Retain the existing functions and error boundary. First identify the smallest stable jobs: inventory owns items, quest state owns discoveries and route status, and Player owns its own health while holding the supplied collaborators. This separation is useful only if the current trail actually calls those collaborators, so the Working will preserve the existing observations while moving each responsibility to its owner.</p>
<p>If adding an item forces you to edit a Player health method, the responsibilities are tangled. If a quest rule needs the player name only for a message, pass the needed value rather than moving the entire quest into Player. The goal is a readable object graph with visible reasons for each mutation.</p>'''

[[lessons.concepts]]
id = "collaborator-responsibilities"
purpose = "Give each changing part of the trail domain one clear job, so a later feature has an obvious home instead of enlarging Player into an all-knowing record."
anatomy = "Inventory owns item membership and mutation; QuestState owns discoveries and route progress; Player owns health and public actions. Collaboration happens through named methods, not through one object storing every list and flag."
example = "A player action can request inventory.add_item('moss-key') while a quest action can request quest.search_briar(); neither request makes Player the owner of items or discoveries."
observable = "A fresh inventory changes only when its own method runs, and a fresh quest can report a discovery without needing a player instance."
failure = "Putting items, discoveries, route flags, and health into one class hides ownership, so unrelated changes must all edit the same object and tests cannot isolate a domain rule."
practice = "s10-l01-w1"

[[lessons.concepts]]
id = "collaborating-object-responsibility"
purpose = "Give each collaborator one coherent kind of state change so the trail can be extended without making one object a dumping ground."
anatomy = "Name the changing data, name the operation that changes it, then assign both to the same object with the narrowest useful job."
example = "SupplyPouch owns supplies and add; TrailWalker only stores the supplied pouch."
observable = "After pouch.add, the pouch list changes while the walker has not gained a duplicate list."
failure = "Putting items, health, and quest flags into one class makes unrelated changes travel through the same boundary."
practice = "s10-l01-w1"

[[lessons.concepts]]
id = "constructor-dependency-injection"
purpose = "Make required collaborators visible at construction so ownership and test setup are explicit."
anatomy = "Construct the collaborator first, pass it as an initializer argument, and store that exact object as an instance attribute."
example = "TrailWalker receives pouch and keeps it at self.pouch."
observable = "A supplied pouch can be inspected after construction through the walker’s attribute."
failure = "Constructing a hidden new pouch inside every method disconnects the caller’s state from the object being used."
practice = "s10-l01-w1"

[[lessons.artifactSteps]]
id = "s10-l01-separate-trail-jobs"
path = "game.py"
mode = "author"
mechanisms = ["collaborating-object-responsibility", "constructor-dependency-injection", "python-class-statement", "python-init-method", "python-self-parameter", "python-instance-construction", "python-instance-attribute", "editor-edit-file", "editor-save-file", "terminal-read-saved-file"]
instruction = "Reopen learner-authored game.py. Plan three top-level collaborators for the existing trail: an inventory owner, a quest-state owner, and Player. Construct inventory and quest state first, pass both into Player’s initializer, and retain only the responsibilities each object needs. Preserve the established six commands, values, recovery boundary, completion records, and transcript; do not add inheritance, new input, files, modules, Pygame, or a parallel game path. Save and reread the file before continuing."
checks = ["The saved source visibly constructs inventory and quest-state collaborators before the Player that receives them.", "No collaborator duplicates another object’s mutable collection."]

