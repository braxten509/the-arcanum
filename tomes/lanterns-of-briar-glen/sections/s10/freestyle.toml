code>tests/test_game.py</code>, preserve the eight earlier focused checks with fresh composed fixtures. Add three learner-authored arrange/act/assert checks: Inventory owns an item mutation, QuestState owns a briar/discovery route change, and a command or Player action delegates to the supplied collaborator. Assert the invalid route leaves all collaborators unchanged. Save and read both files, run <code>python -m pytest -q</code> until it reports <code>11 passed</code>, then run <code>python game.py</code> twice and compare the deterministic final observations. Do not add inheritance, input, files, context managers, modules, packages, annotations, dependencies, Pygame, or another project path.</li></ul>'''
