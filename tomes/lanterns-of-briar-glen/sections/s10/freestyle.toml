instruction = "Private replay preserves the six-turn trail and error boundary while replacing the single player-adjacent record with explicit Inventory, QuestState, and Player collaborators."
content = '''class Inventory:
    def __init__(self, items):
        self.items = items

    def add_item(self, item):
        if item not in self.items:
            self.items.append(item)


class QuestState:
    def __init__(self, discoveries):
        self.discoveries = discoveries
        self.path_open = False

    def mark_discovery(self, discovery):
        self.discoveries.add(discovery)

    def search_briar(self):
        search_marks = ["thorns", "old ribbon", "lantern key", "deep mud"]
        search_index = 0
        while search_index < 4:
            search_mark = search_marks[search_index]
            search_index = search_index + 1
            if search_mark == "old ribbon":
                continue
            print("Search:", search_mark)
            if search_mark == "lantern key":
                self.mark_discovery("lantern key")
                print("Lantern key found.")
                break
        self.path_open = "lantern key" in self.discoveries
        return self.path_open


class Player:
    def __init__(self, name, health, inventory, quest_state):
        if health < 0:
            raise ValueError("Starting health cannot be below zero")
        self.name = name
        self.health = health
        self.inventory = inventory
        self.quest_state = quest_state

    def rest(self):
        self.health = self.health + 2
        return self.health

    def pack_item(self, item):
        self.inventory.add_item(item)

    def search_quest(self):
        return self.quest_state.search_briar()


def turn_line(turn_number, command):
    return f"Turn {turn_number}: {command}"


def has_lantern_key(quest_state):
    return "lantern key" in quest_state.discoveries


def validate_command(command):
    allowed_commands = [
        "look waystone",
        "take moonleaf",
        "rest",
        "search briar",
        "leave",
    ]
    if command not in allowed_commands:
        raise ValueError("Unknown command: " + command)
    return command


def show_opening(status, command, parts, player, coordinate):
    print(status)
    print("Normalized command:", command)
    print("Command words:", parts)
    print("Pack before trail:", player.inventory.items)
    print("First packed item:", player.inventory.items[0])
    print("Player health:", player.health)
    player.quest_state.mark_discovery("north gate")
    print("Known north gate:", "north gate" in player.quest_state.discoveries)
    print("Coordinates:", coordinate)


def handle_command(command, player):
    validate_command(command)
    route_result = {"path_open": False, "keep_traveling": True}
    if command == "look waystone":
        player.quest_state.mark_discovery("waystone")
        print("The waystone points north.")
    elif command == "take moonleaf":
        player.pack_item("moonleaf")
        print("Moonleaf packed.")
    elif command == "rest":
        print(f"Health restored: {player.rest()}")
    elif command == "search briar":
        route_result["path_open"] = player.search_quest()
    elif command == "leave":
        print("Trail closed.")
        route_result["keep_traveling"] = False
    return route_result


def run_turn(command, player, completed_commands):
    try:
        route_result = handle_command(command, player)
    except ValueError as error:
        print("Invalid command:", error)
        return {"path_open": False, "keep_traveling": True}
    else:
        return route_result
    finally:
        completed_commands.append(command)
        print("Turn cleanup:", command)


health = 10
lantern_oil = 3
remaining_oil = lantern_oil - 1
lantern_lit = health > 0 and remaining_oil > 0
traveler_name = "Mira"
status_lead = "Lantern status for " + traveler_name
status_line = f"{status_lead}: {health} health, {remaining_oil} oil, lit={lantern_lit}"
raw_command = "  LOOK WAYSTONE  "
normalized_command = raw_command.strip().lower()
command_parts = normalized_command.split()
inventory = Inventory(["waystone map", "rations"])
inventory_snapshot = inventory.items.copy()
quest_state = QuestState({"north gate"})
camp_coordinate = (4, 7)
player = Player(traveler_name, health, inventory, quest_state)
commands = [normalized_command, "take moonleaf", "rest", "search briar", "sing", "leave"]
turn_limit = 6
turns_taken = 0
path_open = False
completed_commands = []

show_opening(status_line, normalized_command, command_parts, player, camp_coordinate)

for turn_index in range(turn_limit):
    command = commands[turn_index]
    turns_taken = turns_taken + 1
    print(turn_line(turns_taken, command))
    route_result = run_turn(command, player, completed_commands)
    path_open = route_result["path_open"]
    if route_result["keep_traveling"] == False:
        break

print("Turns taken:", turns_taken)
print("Pack after trail:", player.inventory.items)
print("Snapshot before trail:", inventory_snapshot)
print("Found lantern key:", has_lantern_key(player.quest_state))
print("Path open:", path_open)
print("Final health:", player.health)
print("Completed turns:", completed_commands)
'''

[[freestyle.referenceSteps]]
id = "s10-replace-composed-regression-tests"
path = "tests/test_game.py"
mode = "replace"
find = '''from game import Player, handle_command, run_turn, turn_line'''
mechanisms = ["collaborator-test-seam", "python-import-statement", "pytest-test-function", "python-assert-statement", "arrange-act-assert", "python-instance-construction", "python-instance-attribute", "python-instance-method", "python-exception-types", "python-try-statement", "python-except-clause", "python-function-call", "python-list-literal", "python-set-literal", "python-dict-literal", "mutating-function-boundary", "pure-function-boundary"]
instruction = "Private replay preserves all earlier behavior claims through fresh composed fixtures and adds direct owner and delegation evidence."
content = '''from game import Inventory, Player, QuestState, handle_command, run_turn, turn_line


def make_player():
    inventory = Inventory([])
    quest_state = QuestState(set())
    return Player("Mira", 10, inventory, quest_state)


def test_turn_line_returns_numbered_command():
    actual_line = turn_line(3, "rest")

    assert actual_line == "Turn 3: rest"


def test_rest_command_changes_supplied_player_and_keeps_traveling():
    player = make_player()

    route_result = handle_command("rest", player)

    assert player.health == 12
    assert route_result == {"path_open": False, "keep_traveling": True}


def test_invalid_command_raises_value_error_before_collaborator_mutation():
    player = make_player()
    was_rejected = False

    try:
        handle_command("sing", player)
    except ValueError:
        was_rejected = True

    assert was_rejected == True
    assert player.health == 10
    assert player.inventory.items == []
    assert player.quest_state.discoveries == set()


def test_invalid_turn_recovers_and_records_completion():
    player = make_player()
    completed_commands = []

    route_result = run_turn("sing", player, completed_commands)

    assert route_result == {"path_open": False, "keep_traveling": True}
    assert player.inventory.items == []
    assert player.quest_state.discoveries == set()
    assert completed_commands == ["sing"]


def test_successful_turn_records_completion():
    player = make_player()
    completed_commands = []

    route_result = run_turn("rest", player, completed_commands)

    assert route_result == {"path_open": False, "keep_traveling": True}
    assert player.health == 12
    assert completed_commands == ["rest"]


def test_player_construction_exposes_attributes_and_collaborators():
    player = make_player()

    assert player.name == "Mira"
    assert player.health == 10
    assert player.inventory.items == []
    assert player.quest_state.discoveries == set()


def test_player_rest_returns_health_and_rejects_negative_start():
    player = make_player()
    was_rejected = False

    result = player.rest()
    try:
        Player("Mira", -1, Inventory([]), QuestState(set()))
    except ValueError:
        was_rejected = True

    assert result == 12
    assert player.health == 12
    assert was_rejected == True


def test_player_identity_distinguishes_alias_and_new_instance():
    player = make_player()
    alias = player
    matching_player = make_player()

    assert alias is player
    assert matching_player is not player


def test_inventory_owns_item_mutation():
    inventory = Inventory([])

    inventory.add_item("moonleaf")

    assert inventory.items == ["moonleaf"]


def test_quest_state_owns_briar_route_change():
    quest_state = QuestState(set())

    path_open = quest_state.search_briar()

    assert "lantern key" in quest_state.discoveries
    assert quest_state.path_open == True
    assert path_open == True


def test_command_delegates_pack_action_to_supplied_inventory():
    player = make_player()

    handle_command("take moonleaf", player)

    assert player.inventory.items == ["moonleaf"]
    assert player.health == 10
'''

