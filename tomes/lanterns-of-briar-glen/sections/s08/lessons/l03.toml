mechanisms = ["python-finally-clause"]
prompt = "Complete the disposable clause that runs after either a normal or recovered path."
code = '''try:
    cross_bridge()
____:
    marks.append("crossing finished")'''
answer = "finally"
hint = "Use the clause whose work is guaranteed after the try boundary."

[[lessons.exercises]]
id = "s08-l03-e3"
type = "mc"
points = 18
mechanisms = ["python-finally-clause"]
prompt = "A try block returns a route decision. What happens to its finally block?"
choices = ["It is skipped because return has already chosen a value", "It runs before the function finishes returning", "It runs only if except also ran", "It replaces the return with a successful value"]
answer = 1
whyWrong = "Finally is not skipped by return, is not limited to recovery, and does not itself convert a failure or result into success. It completes before the function exits."
hint = "Finally promises to run on every exit path from the boundary."
explain = "Python performs the finally action before the pending return leaves the function."

[[lessons.exercises]]
id = "s08-l03-e4"
type = "text"
points = 18
mechanisms = ["python-finally-clause"]
prompt = "Why is a fragile new operation in finally risky when the try block already raised an unrelated exception?"
answer = "If finally raises too, it can replace or obscure the original exception and make the real cause harder to diagnose"
hint = "Think about which error a caller sees if cleanup itself fails."

[[lessons.exercises]]
id = "s08-l03-w1"
type = "write"
points = 35
mechanisms = ["python-raise-statement", "python-try-statement", "python-except-clause", "python-finally-clause", "python-def-statement", "python-if-statement", "python-return-statement", "python-function-call", "python-list-literal", "list-append-method", "python-print-call"]
prompt = "Write a disposable program with record_crossing(is_open, records). If is_open is False, it must raise ValueError with bridge closed; the function must recover by returning wait, otherwise return cross. In finally, append crossing finished to the supplied records. Start records as an empty list, print record_crossing(False, records), then print records. Produce exactly the output below. This is not a Briar Glen artifact."
expect = '''wait
['crossing finished']'''
solution = '''def record_crossing(is_open, records):
    try:
        if is_open == False:
            raise ValueError("bridge closed")
        return "cross"
    except ValueError:
        return "wait"
    finally:
        records.append("crossing finished")


records = []
print(record_crossing(False, records))
print(records)'''
hint = "Put the conditional raise in try, return the recovery value in except, and append only in finally."
