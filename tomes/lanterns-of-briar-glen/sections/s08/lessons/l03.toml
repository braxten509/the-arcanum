[[lessons]]
id = "s08-l03"
title = "Guarantee Ordinary Cleanup"
teaches = ["ordinary-finally-cleanup", "language-exception-error-handling"]
introduces = ["python-finally-clause"]
body = '''
<p>A recovery boundary decides what happens after one expected failure, but some ordinary bookkeeping must happen whether the turn succeeds, recovers, or lets an unrelated error continue upward. Python’s <strong>finally clause</strong> expresses that guarantee. It is not a file or resource manager—that comes later. Here it is a small, observable promise that one completed turn is recorded regardless of which prior branch ran.</p>
<pre><code data-kind="runnable">def mark_attempt(is_open, finished_marks):
    try:
        if is_open == False:
            raise ValueError("gate is closed")
        return "crossed"
    except ValueError:
        return "wait"
    finally:
        finished_marks.append("gate attempt finished")


marks = []
print(mark_attempt(False, marks))
print(marks)
</code></pre>
<p>Python reads this boundary in a fixed order. It enters <code>try</code>. A closed gate raises, so the matching <code>except</code> prepares the recovery value <code>wait</code>. Before that value actually leaves the function, <code>finally</code> runs and appends its bookkeeping mark. The result is therefore a recovery value and a one-item record. With <code>True</code>, the return from try also waits until finally records the same mark. A return does not skip finally.</p>
<p>Use finally for a small action that genuinely must happen on both paths: record that a turn boundary completed, release a temporary game-mode flag, or restore a local invariant. Do not place the normal success behavior there; it would run after recovery too. Do not suppress a new exception in finally. If finally itself fails, it can replace the earlier failure and make diagnosis worse. Keep its action simple, explicit, and testable through state already owned by the caller.</p>
<p>In Briar Glen, add an explicit supplied turn-completion collection at the controller boundary. The normal handler path belongs in <code>try</code> and <code>else</code>; recovery of the expected <code>ValueError</code> remains in <code>except</code>; finally records that this exact command’s boundary finished. The outer finite loop still receives a route decision and remains responsible for counting turns and stopping on leave. A type mistake or unrelated programming bug still propagates, but finally records the completed boundary before it does.</p>
<p>Extend the regression suite with fresh collections. Prove both the recovered invalid command and a successful command leave exactly one corresponding completion record, while earlier validation and stateful tests stay focused. Run the saved suite with <code>python -m pytest -q</code>, read the source, and run <code>python game.py</code> twice. The deterministic transcript may now show the recovery and completion observations, but it must retain all six routes and carried-forward final state evidence.</p>
<div class="field-notes"><div class="fn-head">FIELD NOTES // FINALLY MEANS EVERY EXIT PATH</div><p>Before putting an action in finally, say it aloud for success, recovery, and propagation. If it should not happen in all three cases, it belongs in a narrower branch.</p></div>
'''

[[lessons.concepts]]
id = "ordinary-finally-cleanup"
purpose = "Perform one ordinary, observable bookkeeping action regardless of a successful result, expected recovery, or propagated failure."
anatomy = "Place the normal operation in try, selective recovery in except, success-only work in else when needed, and the unconditional small action in finally."
example = "mark_attempt appends one completion mark after either its recovered closed-gate result or successful crossing result."
observable = "The returned recovery value prints before the caller observes one finished mark in the supplied list."
failure = "Putting success-only work in finally makes it run after recovery too; raising inside finally can hide the original failure."
practice = "s08-l03-w1"

[[lessons.concepts]]
id = "language-exception-error-handling"
purpose = "Use ordinary exceptions, validation, narrow recovery, propagation, and guaranteed ordinary cleanup to make failure behavior explicit and testable."
anatomy = "Raise ValueError before mutation, let it propagate to a prepared boundary, recover narrowly when appropriate, and record unconditional work in finally."
example = "The chapter moves from ValueError validation to a narrow controller boundary and then to mark_attempt’s unconditional record."
observable = "Invalid input raises ValueError, normal input takes the ordinary route, and both leave evidence of the completed boundary."
failure = "A broad catch, hidden mutation before validation, or cleanup that masks an error makes the program’s failure contract unreliable."
practice = "s08-l03-e1"

[[lessons.concepts]]
id = "python-finally-clause"
purpose = "Run a small block after a try boundary no matter how its earlier branches exit."
anatomy = "After the try and any matching except or else blocks, write finally, a colon, and the unconditional indented action."
example = "finally appends gate attempt finished before mark_attempt returns from either branch."
observable = "The supplied marks list gains one record for both the closed and open cases."
failure = "Assuming a return skips finally causes missing cleanup records; putting a fragile new operation there can obscure the original failure."
practice = "s08-l03-e2"

[[lessons.artifactSteps]]
id = "s08-l03-guarantee-turn-record"
path = "game.py"
mode = "author"
mechanisms = ["python-finally-clause", "python-try-statement", "python-except-clause", "python-else-exception-clause", "python-function-call", "python-return-statement", "list-append-method", "editor-edit-file", "editor-save-file", "terminal-read-saved-file", "terminal-invoke-saved-file"]
instruction = "In learner-authored game.py, preserve the current validation and narrow controller recovery boundary. Give that controller an explicit supplied completion-record collection and author a finally clause that records exactly one completed-boundary entry for every attempted saved command, including a recovered invalid command and a successful command. Keep normal route handling in the try/else path, recovery only for the expected ValueError, and unrelated failures propagating. Extend tests/test_game.py with fresh state and completion collections so regression checks prove one completion record on both a recovered and successful turn, while preserving earlier validation and state-change checks. Save and read both files; run python -m pytest -q and python game.py twice from the external project root. Do not add context managers, file I/O, input, modules, dependencies, Pygame, package material, or another project path."
checks = ["Every turn attempt records one completion marker even when the invalid command is recovered or a successful command returns normally.", "Both saved game runs retain six turns, the original final state observations, the deterministic invalid-command recovery, and matching completion evidence."]

