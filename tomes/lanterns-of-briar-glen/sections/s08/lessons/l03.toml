[[lessons.exercises]]
id = "s08-l03-e1"
type = "mc"
points = 18
mechanisms = ["python-finally-clause", "list-append-method"]
prompt = "Which action belongs in finally for a turn boundary that must leave evidence after success, expected recovery, and unrelated propagation?"
choices = ["Print the successful route result", "Append one completed-turn record to the supplied collection", "Catch every exception and return success", "Change an invalid command into a valid one"]
answer = 1
whyWrong = "Success output belongs on the normal path, catching every failure hides evidence, and changing input rewrites the rule. A completion record is the same required bookkeeping on every exit path."
hint = "Choose the action that is correct even if the protected work did not succeed."
explain = "Finally is for unconditional work, not for success-only behavior or broad error suppression."

[[lessons.exercises]]
id = "s08-l03-e2"
