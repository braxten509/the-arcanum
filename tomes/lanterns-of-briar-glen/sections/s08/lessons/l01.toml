prompt = "Complete the disposable invalid branch so it signals the unacceptable value."
code = '''if token == "":
    ____ ValueError("token is empty")'''
answer = "raise"
hint = "Use the statement that stops the ordinary path with an exception."

[[lessons.exercises]]
id = "s08-l01-e4"
type = "text"
points = 18
mechanisms = ["python-raise-statement"]
prompt = "Why should a command validator raise before calling a helper that mutates a supplied inventory or discovery set?"
answer = "So invalid input cannot change state before the failure is reported"
hint = "Compare the order of validation and a state-changing action."

[[lessons.exercises]]
id = "s08-l01-w1"
type = "write"
points = 35
mechanisms = ["python-exception-types", "python-raise-statement", "python-def-statement", "python-if-statement", "python-return-statement", "python-function-call", "python-print-call", "python-boolean-operators"]
prompt = "Write a disposable program that defines sip_allowed(has_water), raises ValueError with the text flask is empty when has_water is False, otherwise returns sip allowed, then calls and prints sip_allowed(True). Produce exactly the output below. This is not a Briar Glen artifact."
expect = "sip allowed"
solution = '''def sip_allowed(has_water):
    if has_water == False:
        raise ValueError("flask is empty")
    return "sip allowed"


print(sip_allowed(True))'''
hint = "Put raise ValueError in the false branch, and return the ordinary result after that branch."
