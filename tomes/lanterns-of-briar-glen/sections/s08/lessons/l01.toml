points = 20
mechanisms = ["python-exception-types"]
prompt = "Complete the disposable invalid branch with Python’s built-in exception type for an unacceptable value."
code = '''if map_name == "":
    raise ____("map name is missing")'''
answer = "ValueError"
hint = "Use the built-in exception type for an unacceptable value."

[[lessons.exercises]]
