[[lessons.exercises]]
id = "s08-l02-e1"
type = "mc"
points = 18
mechanisms = ["exception-recovery-boundary", "exception-propagation"]
prompt = "Where should a game’s unknown-command domain error be caught when only the turn controller knows how to continue the turn sequence?"
choices = ["Inside a helper before validation", "Inside the validator before it raises", "At the turn controller around the command call", "Inside every helper that reads game state"]
answer = 2
whyWrong = "A helper before validation does not own the rule, the validator owns the rule and should signal it, and unrelated helpers do not own the player-facing next action. The controller can choose the continuing route."
hint = "Choose the layer that owns the next turn after a bad command."
explain = "Propagation keeps validation and recovery separate until the controller can make the meaningful decision."

[[lessons.exercises]]
