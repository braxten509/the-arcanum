answer = "except"
hint = "Use the keyword that follows a try block to select one exception type."

[[lessons.exercises]]
id = "s08-l02-e4"
type = "mc"
points = 18
mechanisms = ["python-else-exception-clause"]
prompt = "Why place success-only use of a returned value in an exception else block?"
choices = ["Else runs before try", "Else runs only when the try block did not raise the handled error", "Else catches every Python error", "Else repeats the exception message"]
answer = 1
whyWrong = "Else follows the try/except boundary; it does not catch errors or repeat recovery. It isolates statements that require the successful result."
hint = "Ask whether the result exists after an exception interrupts the try block."
explain = "The normal branch runs only after the protected call succeeds, so it cannot use a result that was never returned."

[[lessons.exercises]]
id = "s08-l02-e5"
type = "text"
points = 18
mechanisms = ["exception-propagation", "exception-recovery-boundary"]
prompt = "Why should an unrelated error from the command call propagate instead of being caught by the player-typo recovery boundary?"
answer = "It is not the expected invalid text command, so catching it would hide a defect that needs diagnosis"
hint = "Compare the expected invalid command with a failure the boundary did not promise to recover."

[[lessons.exercises]]
id = "s08-l02-w1"
type = "write"
points = 35
mechanisms = ["python-exception-types", "python-raise-statement", "python-try-statement", "python-except-clause", "python-else-exception-clause", "python-def-statement", "python-if-statement", "python-return-statement", "python-function-call", "python-print-call"]
prompt = "Write a disposable program with a route_status(is_clear) helper that raises ValueError with path is clouded when is_clear is False and otherwise returns path is clear, and an announce(is_clear) helper. announce must print recover after ValueError and print proceed: path is clear through an else block on a successful call. Call announce(False), then announce(True). Produce exactly the output below. This is not a Briar Glen artifact."
expect = '''recover
proceed: path is clear'''
solution = '''def route_status(is_clear):
    if is_clear == False:
        raise ValueError("path is clouded")
    return "path is clear"


def announce(is_clear):
    try:
        message = route_status(is_clear)
    except ValueError:
        print("recover")
    else:
        print("proceed:", message)


announce(False)
announce(True)'''
hint = "Raise in the rule helper, catch only ValueError in announce, and put the successful print in else."
