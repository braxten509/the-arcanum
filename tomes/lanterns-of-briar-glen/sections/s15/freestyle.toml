instruction = "Private replay preserves the s14 JSON mapping and narrow read recovery while replacing manual close calls with deterministic contexts, then writes through a neighboring named temporary file and replaces only after successful closure. Cleanup removes an abandoned temporary path and re-raises an unexpected write error."
content = '''import json
import os
from pathlib import Path
from tempfile import NamedTemporaryFile

from .domain import Inventory, Player, QuestState


def player_to_record(player):
    return {
        "name": player.name,
        "health": player.health,
        "inventory": player.inventory.items.copy(),
        "discoveries": list(player.quest_state.discoveries),
        "path_open": player.quest_state.path_open,
    }


def record_to_player(record):
    inventory = Inventory(record["inventory"])
    quest_state = QuestState(set(record["discoveries"]))
    quest_state.path_open = record["path_open"]
    return Player(record["name"], record["health"], inventory, quest_state)


def encode_player(player):
    return json.dumps(player_to_record(player))


def decode_player(saved_text):
    return record_to_player(json.loads(saved_text))


def save_player(player, save_path, temporary_factory=NamedTemporaryFile):
    destination = Path(save_path)
    temporary_path = None
    try:
        with temporary_factory(
            mode="w",
            encoding="utf-8",
            dir=destination.parent,
            delete=False,
        ) as temporary_file:
            temporary_path = Path(temporary_file.name)
            json.dump(player_to_record(player), temporary_file)
        os.replace(temporary_path, destination)
    except Exception:
        if temporary_path is not None and temporary_path.exists():
            temporary_path.unlink()
        raise


def load_player(save_path):
    try:
        with open(save_path, "r", encoding="utf-8") as save_file:
            record = json.load(save_file)
    except FileNotFoundError:
        return None
    except json.JSONDecodeError:
        return None
    return record_to_player(record)'''

