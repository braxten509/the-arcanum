instruction = "Private replay preserves all s14 mapping and recovery checks, then adds one complete-destination replacement check and one injected temporary-write failure check that proves context exit, abandoned-path cleanup, and re-raised error."
content = '''from pathlib import Path

from briar_glen import Inventory, Player, QuestState, decode_player, encode_player, load_player, player_to_record, save_player


def make_player():
    inventory = Inventory(["rations", "moonleaf"])
    quest_state = QuestState({"waystone", "lantern key"})
    quest_state.path_open = True
    return Player("Mira", 12, inventory, quest_state)


def test_player_record_keeps_represented_facts():
    record = player_to_record(make_player())
    assert record["name"] == "Mira"
    assert record["health"] == 12
    assert record["inventory"] == ["rations", "moonleaf"]
    assert set(record["discoveries"]) == {"waystone", "lantern key"}
    assert record["path_open"] is True


def test_text_round_trip_rebuilds_fresh_player():
    player = make_player()
    restored_player = decode_player(encode_player(player))
    assert restored_player is not player
    assert restored_player.inventory is not player.inventory
    assert restored_player.name == "Mira"
    assert restored_player.health == 12
    assert restored_player.inventory.items == ["rations", "moonleaf"]
    assert restored_player.quest_state.discoveries == {"waystone", "lantern key"}
    assert restored_player.quest_state.path_open is True


def test_file_round_trip_restores_player():
    save_path = Path("s14-round-trip.json")
    save_player(make_player(), save_path)
    restored_player = load_player(save_path)
    assert restored_player.name == "Mira"
    assert restored_player.inventory.items == ["rations", "moonleaf"]
    assert restored_player.quest_state.path_open is True


def test_missing_save_returns_no_player():
    assert load_player(Path("s14-missing-player.json")) is None


def test_corrupt_save_returns_no_player():
    save_path = Path("s14-corrupt-player.json")
    save_file = open(save_path, "w", encoding="utf-8")
    save_file.write("{not json")
    save_file.close()
    assert load_player(save_path) is None


def test_atomic_save_replaces_existing_record():
    save_path = Path("s15-replaced-player.json")
    old_file = open(save_path, "w", encoding="utf-8")
    old_file.write('{"name": "old traveler"}')
    old_file.close()
    save_player(make_player(), save_path)
    restored_player = load_player(save_path)
    assert restored_player.name == "Mira"
    assert restored_player.inventory.items == ["rations", "moonleaf"]


class FailingTemporaryFile:
    def __init__(self, temporary_path):
        self.name = temporary_path
        self.closed = False

    def __enter__(self):
        return self

    def __exit__(self, exception_type, exception, traceback):
        self.closed = True

    def write(self, text):
        raise OSError("briar wind interrupted the write")


def test_failed_temporary_write_closes_removes_and_propagates():
    temporary_path = Path("s15-interrupted-player.tmp")
    temporary_file = open(temporary_path, "w", encoding="utf-8")
    temporary_file.close()
    resource = FailingTemporaryFile(temporary_path)

    def failing_temporary_factory(mode, encoding, dir, delete):
        return resource

    raised = False
    try:
        save_player(make_player(), Path("s15-interrupted-player.json"), failing_temporary_factory)
    except OSError:
        raised = True
    assert raised is True
    assert resource.closed is True
    assert temporary_path.exists() is False'''

