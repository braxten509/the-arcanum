type = "text"
points = 20
prompt = "In one or two sentences, distinguish releasing a resource from deciding that malformed JSON becomes a no-save result. Name one error you would still let propagate."
answer = "A context manager releases an acquired resource; a narrow exception boundary decides only named expected recovery cases. An unexpected write or permission error should propagate."
