[[lessons.exercises]]
id = "s15-l01-e01"
type = "mc"
points = 18
prompt = "When the indented suite raises an exception, what does a context manager still get a chance to do?"
choices = ["Convert every exception to None", "Run its exit behavior", "Replace the destination file", "Choose a save directory"]
answer = 1
mechanisms = ["python-with-statement", "python-context-manager-protocol"]
explain = "Leaving the suite invokes exit behavior; whether an exception is recovered is separate."
whyWrong = "The wrong choices confuse resource exit with recovery, replacement, or save-location policy."
hint = "Think about what happens when the suite is left, even through an exception."

