[[lessons.concepts]]
id = "context-managed-resource"
purpose = "Use a context manager to make release of an acquired resource deterministic."
anatomy = "Enter with, bind the active resource after as, run the suite, then leave through the manager's exit behavior."
example = "The disposable TrailLatch enters, records its exit, and leaves an OSError for the outer handler."
observable = "The lab prints entered, then exited, then propagated, followed by True for the recorded exit."
failure = "Manual close paths can be skipped when a branch or exception changes control flow."
practice = "s15-l01-e03"

[[lessons.concepts]]
id = "python-with-statement"
purpose = "Define a scoped resource lifetime."
anatomy = "A with header enters a manager before the indented suite and exits it afterward."
example = "The disposable note uses with open for each file lifetime."
observable = "The printed note is read after the writing context finishes."
failure = "Opening without a lifetime structure relies on every route remembering close."
practice = "s15-l01-e02"

[[lessons.concepts]]
id = "python-as-target"
purpose = "Bind the active context resource to a usable local name."
anatomy = "Place a target after as in the with header."
example = "camp_note names the active disposable file."
observable = "The target supplies read or write inside the suite."
failure = "Using an unbound name cannot access the active resource."
practice = "s15-l01-e02"

[[lessons.concepts]]
id = "python-context-manager-protocol"
purpose = "Understand that manager exit runs on normal and exceptional suite paths."
anatomy = "__enter__ returns the bound resource; __exit__ receives the suite's exception details, records exit, and returns False when the error must continue outward."
example = "TrailLatch implements both protocol methods around a deliberately raised OSError."
observable = "Its output shows exit before the outer handler reports propagation, and the final flag is True."
failure = "Returning a truthy value from __exit__ would suppress the OSError instead of letting the outer handler observe it."
practice = "s15-l01-e03"

