[[lessons.exercises]]
id = "s15-l01-e03"
type = "write"
points = 32
prompt = "Write the disposable <code>TrailLatch</code> collaborator described in this lesson. Its <code>__enter__</code> must print <code>entered</code> and return itself; its <code>__exit__</code> must record <code>exited = True</code>, print <code>exited</code>, and return <code>False</code>. Use it in a <code>with</code> suite that prints whether the bound object is the latch, then raises <code>OSError(&quot;wind&quot;)</code>. Catch that error outside the context, print <code>propagated</code>, then print the recorded flag. Match this output exactly."
solution = '''class TrailLatch:
    def __init__(self):
        self.exited = False

    def __enter__(self):
        print("entered")
        return self

    def __exit__(self, error_type, error, traceback):
        self.exited = True
        print("exited")
        return False


latch = TrailLatch()
try:
    with latch as active:
        print(active is latch)
        raise OSError("wind")
except OSError:
    print("propagated")

print(latch.exited)'''
expect = '''entered
True
exited
propagated
True'''
hint = "Keep the <code>try</code> outside the <code>with</code>: the exit method must run before the outer handler can print <code>propagated</code>."
mechanisms = ["python-class-statement", "python-init-method", "python-self-parameter", "python-instance-construction", "python-instance-attribute", "python-instance-method", "python-with-statement", "python-as-target", "python-context-manager-protocol", "python-try-statement", "python-except-clause", "python-raise-statement", "exception-propagation", "python-identity-operator", "python-boolean-operators", "python-print-call", "python-return-statement"]

