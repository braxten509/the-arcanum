[[lessons]]
id = "s15-l01"
title = "Enter and Leave a Resource"
teaches = ["context-managed-resource"]
introduces = ["python-with-statement", "python-as-target", "python-context-manager-protocol"]
body = '''<p>A resource is something acquired now and released later: an open text file is the example already familiar from the storage boundary. Manual <code>close()</code> calls make release depend on every route through a function. A context manager makes the lifetime structural instead. In a <code>with</code> statement, Python enters the manager, binds the active resource after <code>as</code>, runs the indented suite, and asks the manager to exit whether the suite finishes normally or raises. The variable after <code>as</code> names the active resource only inside the suite; it is not a promise that an unrelated error has been recovered.</p><p>Make that protocol visible before applying a built-in manager. In the disposable <code>TrailLatch</code> lab, <code>__enter__</code> prints <code>entered</code> and returns <code>self</code>, so the name after <code>as</code> is the same latch object. Its <code>__exit__</code> receives the exception details whenever the suite leaves, records <code>exited = True</code>, prints <code>exited</code>, and returns <code>False</code>. That false return is deliberate: it tells Python not to suppress the <code>OSError</code>. The outer <code>except OSError</code> therefore prints <code>propagated</code>, after the exit print, and the final <code>True</code> proves that cleanup happened before ordinary exception handling continued. These double-underscore method names are the protocol hooks that <code>with</code> calls; the latch is a throwaway learning collaborator, not a project type to copy into storage.</p><p>The storage reader already has two named outcomes: a missing path and malformed JSON return its documented no-save result. Those are decisions at the read boundary. A permission failure, programmer mistake, or write failure is not silently made successful by <code>with</code>. The context performs release; ordinary exception semantics still decide what propagates. That order lets a later cleanup branch remove an abandoned temporary file without swallowing the failure that made cleanup necessary.</p><p>Practice the shape away from the game. Then author the project change yourself: replace the storage module's manual read close sequence with a context-managed read, retain UTF-8 text handling, and preserve the two narrow expected recovery cases. Do not add automatic saving, choose a permanent location, or change package startup. In the Working, you will use the same lifetime rule for the temporary write and independently test a purpose-built collaborator.</p>'''

