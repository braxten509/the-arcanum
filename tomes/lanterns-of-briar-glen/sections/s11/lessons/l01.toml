[[lessons]]
id = "s11-l01"
title = "Create the Package Tree"
teaches = ["package-file-layout"]
introduces = ["terminal-create-package-directories", "python-package-directory", "python-init-module"]
body = '''
<p>A Python package begins as a directory with a deliberate name and an <code>__init__.py</code> file inside it. The directory gives related modules one home; the initializer tells Python that the directory is a package boundary. This is a location and naming decision, not a second program. Briar Glen’s source will move beneath <code>briar_glen/</code>, while the external project root still holds <code>tests/</code> and the existing environment.</p>
<pre><code data-kind="terminal">mkdir briar_glen
touch briar_glen/__init__.py
ls briar_glen</code></pre>
<p>Run those commands from the project root after activating the established environment. Read the path character by character: <code>mkdir</code> creates the package directory, and <code>touch</code> creates its initializer inside that directory. The expected listing contains <code>__init__.py</code>. If the terminal says the parent does not exist, check <code>pwd</code>; do not create the same package inside <code>tests/</code> or <code>.venv</code>.</p>
<p>The initializer may remain behavior-free for this chapter. Its job is to establish the package’s boundary, not to run the trail or collect a list of exports. The domain module and executable entry come in the next lessons. Keeping the initializer quiet matters: importing a package should not secretly start the six-turn journey or print its transcript.</p>
<p>Use the exact lowercase underscore spelling <code>briar_glen</code>. Python module names are path-like identifiers, so a misspelling creates a different import location rather than a friendly alias. A package tree is useful because it lets tests and later runtime code name the domain without reaching into a root-level prototype. It does not erase the evidence the existing trail already earned.</p>
<div class="field-notes"><div class="fn-head">FIELD NOTES // ONE HOME</div><p>Do not add a generic helpers directory “for later.” A package is a boundary for actual related modules. Start with the small tree the current migration needs, then let later sections add only boundaries they teach.</p></div>'''

[[lessons.concepts]]
id = "package-file-layout"
purpose = "Place related Briar Glen modules in one named package so their boundary is visible in the project tree."
anatomy = "From the project root, create briar_glen, create briar_glen/__init__.py inside it, save the initializer, then inspect that directory."
example = "The terminal block creates a disposable package directory and shows its initializer in the listing."
observable = "The project tree contains briar_glen/__init__.py before a domain or entry module is added."
failure = "Creating __init__.py at the root or placing briar_glen inside tests leaves the intended package boundary absent."
practice = "s11-l01-w1"

[[lessons.concepts]]
id = "terminal-create-package-directories"
purpose = "Create the exact directory that will hold related Python modules."
anatomy = "Confirm the project root, run mkdir with one package name, then list that path before creating files inside it."
example = "mkdir briar_glen followed by ls briar_glen makes the new location observable."
observable = "The terminal lists the intended package directory at the project root."
failure = "A wrong current directory creates a similarly named folder in the wrong project location."
practice = "s11-l01-w1"

[[lessons.concepts]]
id = "python-package-directory"
purpose = "Use a directory as the shared location for Python modules that form one program boundary."
anatomy = "Choose a lowercase package name, create that directory at the project root, and place its initializer and related modules inside it."
example = "briar_glen is the package directory in the terminal example."
observable = "The package name appears once as a directory containing its Python files."
failure = "Scattering the entry and domain modules across unrelated root paths hides their relationship."
practice = "s11-l01-w1"

[[lessons.concepts]]
id = "python-init-module"
purpose = "Mark the directory as the package boundary with an initializer module that has no runtime side effects."
anatomy = "Create __init__.py inside the package directory, save it, and leave trail execution to the later entry module."
example = "touch briar_glen/__init__.py creates the initializer named by the terminal example."
observable = "The package directory contains a saved __init__.py file and importing the package does not print a trail."
failure = "Putting the initializer beside the directory rather than inside it fails to establish the named package location."
practice = "s11-l01-w1"

[[lessons.artifactSteps]]
id = "s11-l01-create-package-boundary"
path = "briar_glen/__init__.py"
mode = "author"
mechanisms = ["terminal-create-package-directories", "python-package-directory", "python-init-module", "editor-create-file", "editor-save-file", "terminal-read-saved-file"]
instruction = "From the learner’s external project root, create the briar_glen directory, then create and save briar_glen/__init__.py inside it. Keep this initializer behavior-free: do not put a trail run, imports, exports, tests, or copied game behavior there. List the directory and read the saved initializer. Do not move game.py or create the domain or entry module yet."
checks = ["The project root contains briar_glen/__init__.py, not a nested package under tests or .venv.", "Reading the initializer shows no trail behavior or output-producing code."]

[[lessons.readings]]
label = "Python tutorial: modules"
url = "https://docs.python.org/3/tutorial/modules.html"

