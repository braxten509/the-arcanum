type = "fill"
points = 20
mechanisms = ["prototype-retirement"]
prompt = "Complete the migration rule: prove the replacement first, then ____ the old prototype."
code = "prove the replacement first, then ____ the old prototype"
answer = "retire"
hint = "Use the chapter’s word for removing a superseded artifact."

[[lessons.exercises]]
id = "s11-l03-e3"
type = "text"
points = 18
mechanisms = ["python-module-execution", "prototype-retirement"]
prompt = "What two checks establish parity before game.py retires?"
answer = "Run the package module entry and run the focused pytest suite"
accept = ["python -m briar_glen.main and python -m pytest -q", "the module run and the regression tests"]
hint = "One check observes the trail; the other observes focused behavior seams."
explain = "The module run proves the executable path, while pytest protects the domain seams."

