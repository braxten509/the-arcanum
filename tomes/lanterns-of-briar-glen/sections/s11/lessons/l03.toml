[[lessons.exercises]]
id = "s11-l03-w1"
type = "write"
points = 35
mechanisms = ["python-module-execution", "prototype-retirement", "python-import-statement", "python-def-statement", "python-function-call", "python-print-call"]
prompt = "Write a disposable program where a function named signal returns lantern, call it once, and print the returned value. Then state the dotted module command you would use if this file were beacon/main.py. This is not a Briar Glen artifact."
expect = "lantern"
solution = '''def signal():
    return "lantern"


print(signal())'''
hint = "Keep the program independent; its path is only described in the prompt."
