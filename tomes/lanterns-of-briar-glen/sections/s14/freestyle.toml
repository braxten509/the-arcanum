id = "s14-write-storage-boundary"
path = "briar_glen/storage.py"
mode = "write"
mechanisms = ["json-object-schema", "json-supported-values", "json-dumps-function", "json-loads-function", "json-dump-function", "json-load-function", "json-decode-error", "python-import-statement", "python-def-statement", "python-return-statement", "python-dict-literal", "python-dict-key-access", "python-list-literal", "python-set-literal", "collection-copy-method", "python-open-call", "text-file-mode", "utf8-text-encoding", "text-file-close-method", "python-try-statement", "python-except-clause", "python-exception-types"]
instruction = "Private replay creates the focused storage module with plain-data mapping, text and file codecs, and narrow expected missing/corrupt recovery while leaving durable save placement and context-managed cleanup for later sections."
content = '''import json

from .domain import Inventory, Player, QuestState


def player_to_record(player):
    return {
        "name": player.name,
        "health": player.health,
        "inventory": player.inventory.items.copy(),
        "discoveries": list(player.quest_state.discoveries),
        "path_open": player.quest_state.path_open,
    }


def record_to_player(record):
    inventory = Inventory(record["inventory"])
    quest_state = QuestState(set(record["discoveries"]))
    quest_state.path_open = record["path_open"]
    return Player(record["name"], record["health"], inventory, quest_state)


def encode_player(player):
    return json.dumps(player_to_record(player))


def decode_player(saved_text):
    return record_to_player(json.loads(saved_text))


def save_player(player, save_path):
    save_file = open(save_path, "w", encoding="utf-8")
    json.dump(player_to_record(player), save_file)
    save_file.close()


def load_player(save_path):
    try:
        save_file = open(save_path, "r", encoding="utf-8")
    except FileNotFoundError:
        return None

    try:
        record = json.load(save_file)
    except json.JSONDecodeError:
        save_file.close()
        return None

    save_file.close()
    return record_to_player(record)'''

