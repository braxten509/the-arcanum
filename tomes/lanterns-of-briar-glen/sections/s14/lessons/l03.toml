[[lessons.exercises]]
id = "s14-l03-w1"
type = "write"
points = 35
mechanisms = ["json-loads-function", "json-decode-error", "python-try-statement", "python-except-clause", "python-print-call", "python-import-statement"]
prompt = "Write a disposable program that imports json, tries to parse the malformed text [broken, catches json.JSONDecodeError, and prints exactly unreadable. This is not a Briar Glen artifact."
expect = "unreadable"
solution = '''import json

try:
    json.loads("[broken")
except json.JSONDecodeError:
    print("unreadable")'''
hint = "Put only the json.loads call in try and name json.JSONDecodeError in the matching except clause."
