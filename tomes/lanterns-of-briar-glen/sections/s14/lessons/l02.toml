[[lessons.exercises]]
id = "s14-l02-e3"
type = "text"
points = 18
mechanisms = ["json-loads-function", "json-load-function"]
prompt = "What is the boundary difference between loads and load?"
answer = "loads parses JSON text from a string while load parses JSON from an already-open file object"
hint = "Name both input kinds, not merely that they both decode JSON."

[[lessons.exercises]]
id = "s14-l02-w1"
type = "write"
points = 35
mechanisms = ["json-dump-function", "json-load-function", "python-open-call", "text-file-close-method", "text-file-mode", "utf8-text-encoding", "python-import-statement", "python-print-call"]
prompt = 'Write a disposable program that imports json, opens codec-practice.json for UTF-8 writing, dumps the record {"gate": "east", "open": true}, closes it, reopens the file for UTF-8 reading, loads the record, closes it, and prints the gate value. This is not a Briar Glen artifact.'
expect = "east"
solution = '''import json

record = {"gate": "east", "open": True}
save_file = open("codec-practice.json", "w", encoding="utf-8")
json.dump(record, save_file)
save_file.close()

save_file = open("codec-practice.json", "r", encoding="utf-8")
restored_record = json.load(save_file)
save_file.close()
print(restored_record["gate"])'''
hint = "Use dump and load with the open file object; give both open calls the matching UTF-8 encoding."
