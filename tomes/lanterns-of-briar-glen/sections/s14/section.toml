id = "s14"
codename = "CHAPTER XIV // STATE IN PLAIN JSON"
short = "State in Plain JSON"
title = "State in Plain JSON"
build = "Own JSON data serialization through schema-shaped conversion, dumps and loads, file codecs, missing and corrupt save behavior, and learner-authored round-trip checks while preserving the existing package trail."
brief = '''<p>The trail has objects in memory: a player owns an inventory and a quest record. A save file cannot store those Python objects directly. This chapter gives them a deliberately small, inspectable JSON shape, then proves the shape can cross the text boundary and return without quietly changing the traveler. You will author every project edit and every check; the existing six-turn package trail remains a regression signal, not a second save system.</p>'''

[proof]
mode = "run"
expectedFiles = ["tests/test_game.py", "briar_glen/__init__.py", "briar_glen/main.py", "briar_glen/domain.py", "briar_glen/storage.py", "tests/test_storage.py"]
