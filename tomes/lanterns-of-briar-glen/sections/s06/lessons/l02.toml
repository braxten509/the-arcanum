[[lessons.exercises]]
id = "s06-l02-w1"
type = "write"
points = 35
mechanisms = ["python-def-statement", "python-function-call", "python-parameters-arguments", "python-return-statement", "python-f-string", "python-print-call"]
prompt = "Write a disposable program with format_flag(color, count) that returns the text flag: blue x2. Call it with the values blue and 2, store the result in flag_text, and print it. Produce exactly the output below."
expect = "flag: blue x2"
solution = '''def format_flag(color, count):
    return f"flag: {color} x{count}"

flag_text = format_flag("blue", 2)
print(flag_text)
'''
hint = "The definition needs two parameters, and return belongs inside its indented body."
