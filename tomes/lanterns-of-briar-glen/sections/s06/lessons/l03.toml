[[lessons.exercises]]
id = "s06-l03-e1"
type = "text"
points = 18
mechanisms = ["pure-function-boundary", "mutating-function-boundary"]
prompt = "A helper receives an inventory list and calls append on it. Is it pure or mutating, and what observation proves your answer?"
answer = "It is mutating; the inventory printed after the call contains the appended item"
hint = "Ask whether the supplied collection changes, then name the post-call evidence."

[[lessons.exercises]]
id = "s06-l03-w1"
type = "write"
points = 36
mechanisms = ["pure-function-boundary", "mutating-function-boundary", "python-def-statement", "python-function-call", "python-parameters-arguments", "python-return-statement", "list-append-method", "python-print-call"]
prompt = "Write a disposable program with is_ready(oil) that returns whether oil is greater than 0 without changing oil, plus pack_note(notes) that appends ready to the supplied list. Start notes as an empty list, print is_ready(1), call pack_note(notes), then print notes. Produce exactly the output below."
expect = '''True
['ready']'''
solution = '''def is_ready(oil):
    return oil > 0

def pack_note(notes):
    notes.append("ready")

notes = []
print(is_ready(1))
pack_note(notes)
print(notes)
'''
hint = "Return the Boolean from the first helper; append inside the second helper to the list passed as its parameter."

[[lessons.exercises]]
id = "s06-l03-e2"
type = "mc"
points = 18
mechanisms = ["pure-function-boundary"]
prompt = "Which change would violate the promise of a pure helper that reports whether a lantern key is present?"
choices = ["Returning a Boolean membership result", "Receiving discoveries as a parameter", "Adding a new discovery before returning", "Using the returned Boolean in an outer branch"]
answer = 2
whyWrong = "Returning a derived Boolean, receiving an input, and letting the caller branch are compatible with purity. Adding an item changes supplied state and creates a side effect."
hint = "A pure helper may calculate from state, but it must not alter that state."
explain = "Mutation belongs in a named mutating boundary, not in a function that promises only a question."

