[[lessons]]
id = "s01-l02"
title = "Raise an Isolated Lantern"
teaches = ["isolated-python-environment", "tool-install", "language-environment-venv"]
introduces = ["venv-create-environment", "venv-activate-environment", "venv-resolve-active-python"]
body = '''
<p>A project should not depend on whichever Python packages happen to be scattered across a computer. A <strong>virtual environment</strong>, usually called a venv, is a project-local Python environment with its own interpreter and later its own installed packages. Today it is only a clean boundary: do not install Pygame, pytest, or anything else yet.</p>
<p>From the external project root you confirmed in l01, ask the available Python to create an environment named <code>.venv</code>:</p>
<pre><code data-kind="terminal">python -m venv .venv
</code></pre>
<p>Read the command left to right. <code>python</code> invokes the interpreter you diagnosed. <code>-m venv</code> asks that interpreter to run its built-in environment-creation module. <code>.venv</code> is the destination folder, beginning with a dot so file browsers usually treat it as tool-managed. If Python reports that it cannot find <code>venv</code>, pause and record the exact message; a Python installation may be incomplete. Do not replace it with a copied environment folder.</p>
<p>Creation alone does not make the terminal use the new interpreter. In a macOS, Linux, or zsh-style terminal, activate it with:</p>
<pre><code data-kind="terminal">source .venv/bin/activate
</code></pre>
<p><code>source</code> applies the activation script to the current terminal session; the path names that script inside the new environment. A successful shell often adds <code>(.venv)</code> to its prompt, but the prompt is a hint rather than proof. Ask the shell which Python command it will run:</p>
<pre><code data-kind="terminal">which python
python --version
</code></pre>
<p><code>which python</code> resolves the command path. It should point inside the <code>.venv</code> directory after activation. The version command supplies a second observation. If <code>which python</code> still points outside <code>.venv</code>, activation did not take effect in this terminal; run the activation command again from the project root rather than continuing.</p>
<div class="callout"><p>Creating a venv and activating it are separate actions. The first makes a boundary; the second selects that boundary for this terminal.</p></div>
<div class="field-notes"><div class="fn-head">FIELD NOTES // NO DEPENDENCIES YET</div><p>The environment is ready to receive packages later, but readiness is not permission. The course deliberately postpones every dependency command until the learner has first authored source and a verification need.</p></div>
'''

[[lessons.concepts]]
id = "isolated-python-environment"
purpose = "Keep the project's Python interpreter and later dependencies separate from unrelated system installations."
anatomy = "Run python -m venv followed by the chosen environment directory name from the project root."
example = "The .venv creation terminal block is the complete disposable setup example."
observable = "A .venv directory appears in the chosen external workspace."
failure = "A missing-venv diagnostic means the Python installation needs attention; preserve that message instead of copying an environment."
practice = "s01-l02-e1"

[[lessons.concepts]]
id = "tool-install"
purpose = "Prepare an external development tool boundary without mistaking preparation for package installation."
anatomy = "Use Python's -m module form, name venv, choose .venv, and inspect the resulting tool-managed directory."
example = "python -m venv .venv prepares the environment without a dependency command."
observable = "The environment creation command completes and leaves a project-local .venv directory."
failure = "Running the command outside the project root creates the environment in the wrong place, so check pwd first."
practice = "s01-l02-e2"

[[lessons.concepts]]
id = "language-environment-venv"
purpose = "Use Python's standard venv workflow to select the interpreter that will own this project."
anatomy = "Create .venv, source its activation script in the current terminal, then resolve python and inspect its version."
example = "The activation and which python blocks show the ordered environment workflow."
observable = "which python reports a path inside .venv after activation."
failure = "A path outside .venv means the shell still uses another interpreter; reactivate from the project root."
practice = "s01-l02-e3"

[[lessons.concepts]]
id = "venv-create-environment"
purpose = "Create the project-local Python environment from the interpreter already diagnosed in the workspace."
anatomy = "Run python -m venv followed by .venv while the terminal is at the external project root."
example = "The first terminal block creates .venv without installing a dependency."
observable = "A .venv directory appears at the external project root."
failure = "A missing-module diagnostic means preserve the message and investigate the local Python installation."
practice = "s01-l02-e1"

[[lessons.concepts]]
id = "venv-activate-environment"
purpose = "Select the environment interpreter for the current shell session without replacing system Python."
anatomy = "Source the activation script from .venv/bin in the same terminal that will run later commands."
example = "The zsh-style source .venv/bin/activate block performs the session selection."
observable = "The shell accepts the source command and can then resolve Python from the environment."
failure = "A shell that still resolves Python elsewhere needs activation repeated from the project root."
practice = "s01-l02-e2"

[[lessons.concepts]]
id = "venv-resolve-active-python"
purpose = "Verify the executable path selected by the activated shell rather than relying on a prompt decoration."
anatomy = "Run which python after activation and compare the resulting path with .venv."
example = "The which python block appears before the confirming version diagnostic."
observable = "The shell prints a Python path inside .venv."
failure = "A path outside .venv means the current terminal has not selected the environment."
practice = "s01-l02-e3"

[[lessons.artifactSteps]]
id = "s01-l02-create-environment"
path = ".venv"
mode = "author"
mechanisms = ["venv-create-environment", "venv-activate-environment", "venv-resolve-active-python"]
instruction = "At the external project root, create a .venv with the diagnosed Python, activate it in the current terminal, and resolve the active python command. Do not install dependencies or create source, requirements, configuration, or package files."
checks = ["The project root contains a .venv directory created by the local Python.", "After activation, which python resolves inside .venv and python --version reports an observed version."]

[[lessons.readings]]
label = "Python virtual environments"
url = "https://docs.python.org/3/library/venv.html"

[[lessons.exercises]]
id = "s01-l02-e1"
type = "fill"
points = 22
mechanisms = ["venv-create-environment"]
prompt = "Complete the command that asks the current Python to create the project-local environment directory."
code = "python -m venv ____"
answer = ".venv"
whyWrong = "The final argument is the destination directory, not a package name or a Python version."
hint = "Use the dot-prefixed environment folder chosen for this course."

[[lessons.exercises]]
id = "s01-l02-e2"
type = "mc"
points = 18
mechanisms = ["venv-activate-environment"]
prompt = "What does activation change in the current terminal session?"
choices = ["It downloads Pygame.", "It writes game source.", "It selects the environment's commands for the shell.", "It permanently replaces the system Python."]
answer = 2
whyWrong = "Activation is a shell-session selection step. It neither installs dependencies nor writes a project, and it does not replace the system interpreter."
hint = "Think about what the shell should find when you type python next."
explain = "Activation changes the shell session so its Python command resolves to the environment."

[[lessons.exercises]]
id = "s01-l02-e3"
type = "text"
points = 20
mechanisms = ["venv-resolve-active-python"]
prompt = "After activation, which terminal command reveals the filesystem path of the Python command the shell will use?"
answer = "which python"
whyWrong = "A version report identifies a release, but this diagnostic is specifically about the executable path chosen by the shell."
hint = "Use the shell lookup command followed by the command name you want to resolve."

[[lessons.exercises]]
