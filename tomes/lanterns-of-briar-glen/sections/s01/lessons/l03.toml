[[lessons]]
id = "s01-l03"
title = "Leave a Saved Tool Receipt"
teaches = ["external-file-action-loop", "tool-create-open", "tool-edit-save", "tool-run-test"]
introduces = ["editor-create-file", "editor-edit-file", "editor-save-file", "terminal-read-saved-file", "terminal-invoke-saved-file"]
body = '''
<p>A toolchain is trustworthy only when an observation survives the trip from your editor to your terminal. This lesson creates the course's first and deliberately temporary artifact: <code>toolchain-check.txt</code>. It is a <strong>behavior-free receipt</strong>, not Python source, not configuration, not a dependency list, and not a substitute for the game that begins in s02.</p>
<p>Open the external project folder in your editor. Create a new plain-text file at the project root named <code>toolchain-check.txt</code>. Then write a short receipt in your own words. It needs three facts you actually observed: the workspace location, the active Python path or environment name, and the Python version. Add one line saying that you saved the file. Do not copy a prewritten record; the value is that the facts came from your terminal.</p>
<p>Saving is an action, not a feeling. Use the editor's Save command, then switch to the terminal that still has <code>.venv</code> active. Read the file back:</p>
<pre><code data-kind="terminal">cat toolchain-check.txt
</code></pre>
<p><code>cat</code> receives a file path and prints that file's saved bytes as text. The path is relative to the current working directory, so this is another reason l01 required a location check. If the terminal says it cannot find the file, first run <code>pwd</code>, then compare the filename and project root with the editor. If the output lacks your newest change, save again and rerun the read command. Do not solve either problem by creating a second receipt somewhere else.</p>
<p>Finish with a tool invocation that is independent of the file content:</p>
<pre><code data-kind="terminal">python --version
</code></pre>
<p>This is the first complete external-file action loop: create, open, edit, save, read, then run a diagnostic command in the same verified workspace. The diagnostic does not execute the receipt—plain text has no program behavior. It verifies that the selected Python still responds after you used the editor.</p>
<div class="callout"><p>Keep the receipt small and factual. The next Working will retire it only after the first learner-authored Python source runs, so do not let it turn into an early program.</p></div>
<div class="field-notes"><div class="fn-head">FIELD NOTES // READBACK BEATS MEMORY</div><p>Many setup mistakes are simply unsaved edits or terminals pointed at a sibling folder. Reading the exact saved path is faster and more reliable than explaining what you think you did.</p></div>
'''

[[lessons.concepts]]
id = "external-file-action-loop"
purpose = "Prove that an external editor and terminal agree about one saved, behavior-free artifact."
anatomy = "Create and open the file, edit observed facts, save it, read that exact path in the terminal, then run a diagnostic."
example = "The cat and python --version terminal blocks complete the readback-and-diagnostic sequence."
observable = "The terminal prints the saved receipt and then prints a Python version."
failure = "A missing file or stale text means the terminal location, filename, or editor save action needs correction."
practice = "s01-l03-e1"

[[lessons.concepts]]
id = "tool-create-open"
purpose = "Create and open a named plain-text artifact in the selected external project root."
anatomy = "Open the root in the editor, choose a new file, give it the exact filename, and keep it at the root."
example = "The body names toolchain-check.txt as the temporary plain-text file."
observable = "The editor shows one new file with that exact name in the external project folder."
failure = "A file in a different folder is not the project receipt; compare the editor tree with the terminal's pwd output."
practice = "s01-l03-e2"

[[lessons.concepts]]
id = "tool-edit-save"
purpose = "Turn observed terminal facts into a durable text record rather than an unsaved editor buffer."
anatomy = "Write factual lines, invoke the editor's Save action, and use terminal readback to inspect the saved result."
example = "The receipt instructions require observed workspace, interpreter, version, and save facts."
observable = "cat prints the latest facts that appear in the editor."
failure = "If cat prints older content, the edit was not saved or a different path was read."
practice = "s01-l03-e3"

[[lessons.concepts]]
id = "tool-run-test"
purpose = "Run a small diagnostic after file work to confirm that the selected external Python still answers."
anatomy = "Keep the environment active, invoke python, attach --version, and compare the result with the receipt."
example = "The final python --version terminal block is the complete diagnostic invocation."
observable = "Python prints its version and exits without opening a game or reading the receipt as source."
failure = "An unavailable command or an unexpected interpreter path means return to the environment activation check before proceeding."
practice = "s01-l03-e4"

[[lessons.concepts]]
id = "editor-create-file"
purpose = "Create the one temporary plain-text receipt at the confirmed external project root."
anatomy = "Open the root in an editor, choose a new file, and name it toolchain-check.txt."
example = "The lesson directs the learner to create toolchain-check.txt as plain text."
observable = "The editor tree shows the named receipt at the project root."
failure = "A similarly named file in another folder cannot serve as the verified project receipt."
practice = "s01-l03-e2"

[[lessons.concepts]]
id = "editor-edit-file"
purpose = "Enter observed tooling facts in a receipt without turning that receipt into early project source."
anatomy = "Write workspace, environment, version, and save observations in ordinary plain text."
example = "The body lists the four facts the learner must observe and record in their own words."
observable = "The open editor buffer contains a short factual, behavior-free record."
failure = "Source, dependency, configuration, or package content breaks the receipt's temporary purpose."
practice = "s01-l03-e1"

[[lessons.concepts]]
id = "editor-save-file"
purpose = "Commit the editor's current receipt text to the exact path the terminal will inspect."
anatomy = "Use the editor Save action after editing, then compare terminal readback with the current buffer."
example = "The save instructions come immediately before the cat command."
observable = "A terminal read prints the latest factual receipt text."
failure = "Older terminal output indicates an unsaved buffer or a different path."
practice = "s01-l03-e3"

[[lessons.concepts]]
id = "terminal-read-saved-file"
purpose = "Inspect the saved receipt bytes from the terminal to prove editor and terminal agree."
anatomy = "Run cat followed by toolchain-check.txt from the same external project root."
example = "The cat toolchain-check.txt block is the complete readback command."
observable = "The terminal prints the saved receipt content."
failure = "A missing-file or stale-content result points to location, naming, or save work that needs correction."
practice = "s01-l03-e1"

[[lessons.concepts]]
id = "terminal-invoke-saved-file"
purpose = "Complete the file-action sequence with an observable terminal diagnostic while keeping the receipt non-executable."
anatomy = "Read the saved receipt, then invoke python --version independently of the plain-text file content."
example = "The final terminal block runs python --version after the cat readback."
observable = "Python prints its version after the terminal has read the saved receipt."
failure = "Attempting to execute the receipt as Python confuses a plain-text check with source code."
practice = "s01-l03-e4"

[[lessons.artifactSteps]]
id = "s01-l03-write-toolchain-receipt"
path = "toolchain-check.txt"
mode = "author"
mechanisms = ["editor-create-file", "editor-edit-file", "editor-save-file", "terminal-read-saved-file", "terminal-invoke-saved-file"]
instruction = "In the external project root, create and open toolchain-check.txt in your editor. Author a short plain-text receipt from your own observations: workspace location, active Python path or environment name, Python version, and confirmation of saving. Save it, read the exact path with cat, then run python --version. Do not add Python source, requirements, configuration, package metadata, or dependency commands."
checks = ["cat toolchain-check.txt prints the saved receipt from the external project root.", "python --version runs while .venv is active and agrees with the recorded interpreter context."]

[[lessons.readings]]
label = "Python command-line options"
url = "https://docs.python.org/3/using/cmdline.html#generic-options"

[[lessons.exercises]]
id = "s01-l03-e1"
type = "mc"
points = 18
mechanisms = ["editor-create-file", "editor-edit-file", "editor-save-file", "terminal-read-saved-file"]
prompt = "After saving toolchain-check.txt, which command reads the file at the current terminal location without treating it as Python source?"
choices = ["python toolchain-check.txt", "cat toolchain-check.txt", "python --version", "source .venv/bin/activate"]
answer = 1
whyWrong = "The receipt is plain text, so Python must not execute it. The version and activation commands serve different diagnostics; cat prints the saved file content."
hint = "Choose the command that prints a text file's contents."
explain = "cat reads a plain-text file and writes its contents to the terminal."

[[lessons.exercises]]
id = "s01-l03-e2"
type = "fill"
points = 22
mechanisms = ["editor-create-file", "terminal-read-saved-file"]
prompt = "Complete the terminal command that reads the temporary receipt after it has been saved."
code = "cat ____"
answer = "toolchain-check.txt"
whyWrong = "The exact filename matters because the terminal readback and the next section's planned retirement both refer to this one temporary receipt."
hint = "Use the hyphenated toolchain name and the .txt extension."

[[lessons.exercises]]
id = "s01-l03-e3"
type = "text"
points = 20
mechanisms = ["editor-save-file", "terminal-read-saved-file"]
prompt = "If the terminal prints an older version of a receipt you just changed in the editor, which editor action should you check before creating another file?"
answer = "save"
accept = ["save file"]
whyWrong = "A terminal can only read what reached disk. Creating a second path hides the disagreement instead of proving the original file was saved."
hint = "Use the editor command that commits the current buffer to disk."

[[lessons.exercises]]
id = "s01-l03-e4"
type = "mc"
points = 18
mechanisms = ["terminal-invoke-saved-file"]
prompt = "Which final diagnostic confirms that the active Python still responds after the receipt readback?"
choices = ["cat toolchain-check.txt", "cd .venv", "python --version", "python toolchain-check.txt"]
answer = 2
whyWrong = "Reading the receipt checks saved text, not Python. Changing into .venv is not activation, and executing the receipt would incorrectly treat plain text as source."
hint = "Reuse the Python identity diagnostic from the first lesson."
explain = "python --version invokes the active interpreter for a small, observable diagnostic."

[[lessons.exercises]]
id = "s01-l03-d1"
type = "type"
points = 12
reps = 2
mechanisms = ["terminal-read-saved-file"]
prompt = "Retype the terminal readback command exactly."
code = "cat toolchain-check.txt"
