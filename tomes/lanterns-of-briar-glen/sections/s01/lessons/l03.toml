[[lessons]]
id = "s01-l03"
title = "Leave a Saved Tool Receipt"
teaches = ["external-file-action-loop", "tool-create-open", "tool-edit-save", "tool-run-test"]
introduces = ["editor-create-file", "editor-edit-file", "editor-save-file", "terminal-read-saved-file", "terminal-invoke-saved-file", "editor-open-session", "plain-text-receipt-format"]
body = '''
<p>Open a code or plain-text editor from the operating system’s application launcher. Use its <strong>Open Folder</strong>, <strong>Open Workspace</strong>, or equivalent action and select your learner-created <code>lanterns-of-briar-glen</code> directory. The editor’s folder tree should name that root and show <code>.venv</code>. If it shows a parent directory or another project, close that workspace and open the intended directory before creating anything.</p>
<p>A file does not become evidence when you see text in an editor. It becomes evidence when the saved file can be reopened and read by another tool. Finish the trailhead with one plain-text receipt named <code>toolchain-check.txt</code> at the project root. <strong>Plain text</strong> contains only characters and line breaks: no fonts, bold styling, tables, embedded images, or word-processor formatting. Use a code/plain-text editor and the exact <code>.txt</code> extension. A disposable <code>trail-note.txt</code> with two unstyled label-and-value lines is a safe way to practice the format. If formatting controls appear or the editor changes the extension, recreate the file in a plain-text editor. The real receipt is deliberately not Python source: it records your completed tool loop while the game is still unwritten.</p>
<pre><code data-kind="terminal">cat toolchain-check.txt
python --version</code></pre>
<p>First use your editor’s new-file action, give the file its exact name, and save it in the same project directory where you created <code>.venv</code>. Write a short factual record in your own words: identify the workspace, note the Python version you observed, state that the environment was active, and state that you saved and reread the receipt. Do not copy a prepared record and do not add code, package details, or dependencies. Saving is essential: an unsaved editor tab is not a file the terminal can inspect.</p>
<p>Return to the activated terminal and use its own plain-text read command. On Linux or macOS, run <code>cat toolchain-check.txt</code>: <code>cat</code> sends the named file’s contents to the terminal. In PowerShell, run <code>Get-Content toolchain-check.txt</code>. If you followed the Command Prompt fallback from the environment lesson, run <code>type toolchain-check.txt</code>; in Command Prompt, <code>type</code> displays the named text file. Use only the route for the terminal you actually opened. Each successful route displays the saved characters and lines so you can compare them with the editor. A “No such file,” “cannot find,” or “path does not exist” message usually means you saved in a different folder, misspelled the name, or ran the command from the wrong directory. Correct the location, save again, and reread rather than creating a second receipt elsewhere.</p>
<p>Then run <code>python --version</code> once more while the environment is active. This is your invocation diagnostic: it checks that the terminal can still execute the intended Python command after the editor loop. It is not permission to begin source work. The first game file arrives in the next section, after this receipt has done its one temporary job.</p>
<div class="callout"><p>The loop has five distinct actions: create, edit, save, read, and invoke. If one is missing, a later “it works on my machine” claim has no trail you can follow.</p></div>
<div class="field-notes"><div class="fn-head">FIELD NOTES // RECOVERY, NOT DUPLICATION</div><p>When terminal output disagrees with your editor, use the path diagnostic and the file name to find the mismatch. Do not solve the uncertainty by scattering copies of the receipt across folders.</p></div>
'''

[[lessons.concepts]]
id = "external-file-action-loop"
purpose = "Prove that an external editor and terminal operate on the same saved project file."
anatomy = "Create one file in the editor, write observations, save it, read it in the terminal, then run a diagnostic command."
example = "The terminal sequence reads the saved receipt and invokes the Python diagnostic."
observable = "The terminal displays the same receipt text that the editor saved."
failure = "A no-such-file message means the name, saved location, or terminal directory does not match."
practice = "s01-l03-e1"

[[lessons.concepts]]
id = "tool-create-open"
purpose = "Create a named file in the intended project directory and reopen it as a shared artifact."
anatomy = "Use the editor’s new-file action, name the receipt exactly, save it at the project root, then open or read it again."
example = "The Working names the receipt path and requires its terminal readback."
observable = "A project-root toolchain-check.txt can be opened by the editor and named by the terminal."
failure = "An untitled tab or a similarly named file in another directory is not the required artifact."
practice = "s01-l03-e2"

[[lessons.concepts]]
id = "tool-edit-save"
purpose = "Persist an editor change so other tools can inspect the exact text."
anatomy = "Write the factual observations, use the editor save action, then compare the terminal readback."
example = "The first paragraph distinguishes visible editor text from saved receipt text."
observable = "Reading the file after saving returns the text the learner wrote."
failure = "Different terminal text after an edit means the change was not saved or the wrong path was read."
practice = "s01-l03-e3"

[[lessons.concepts]]
id = "tool-run-test"
purpose = "Run a behavior-free diagnostic command after saving to confirm the active toolchain remains usable."
anatomy = "Keep the environment active, invoke python --version, and read its output as a tool diagnostic."
example = "The second terminal line invokes the Python version check."
observable = "The terminal prints a Python version while the project environment is active."
failure = "A missing command or unexpected interpreter path requires an activation or installation repair before later work."
practice = "s01-l03-e4"

[[lessons.concepts]]
id = "editor-create-file"
purpose = "Create the receipt as a named file rather than leaving it as an untitled editor tab."
anatomy = "Use the editor new-file action, enter the required filename, and choose the project root."
example = "The Working names the sole receipt path."
observable = "The editor identifies the file as toolchain-check.txt at the project root."
failure = "An untitled tab or another folder does not produce the required receipt path."
practice = "s01-l03-e2"

[[lessons.concepts]]
id = "editor-edit-file"
purpose = "Enter factual tool observations into the newly created plain-text receipt."
anatomy = "Open the named file and write the required observations in the editor."
example = "The first lesson paragraph lists the observations that belong in the receipt."
observable = "The editor displays the learner’s own observation text."
failure = "Copied prepared content or code would violate the behavior-free receipt boundary."
practice = "s01-l03-e1"

[[lessons.concepts]]
id = "editor-save-file"
purpose = "Persist the editor’s text so a terminal can read the same file."
anatomy = "Use the editor save action after editing the named receipt."
example = "The first lesson paragraph explains why an unsaved tab cannot be inspected by the terminal."
observable = "A terminal readback reflects the latest saved text."
failure = "Older terminal content signals an unsaved edit or a different path."
practice = "s01-l03-e1"

[[lessons.concepts]]
id = "terminal-read-saved-file"
purpose = "Read the exact saved receipt through the terminal."
anatomy = "From the project root, use cat followed by the filename on Linux/macOS, Get-Content followed by it in PowerShell, or type followed by it in Command Prompt."
example = "cat toolchain-check.txt, Get-Content toolchain-check.txt, and type toolchain-check.txt are the three shell-specific routes taught here."
observable = "The terminal displays the saved receipt text."
failure = "A missing-file or missing-path diagnostic identifies a directory, filename, or save-location mismatch; first confirm that the read command matches the current shell."
practice = "s01-l03-d1"

[[lessons.concepts]]
id = "terminal-invoke-saved-file"
purpose = "Invoke a Python diagnostic after the editor and terminal file loop is complete."
anatomy = "Keep .venv active and run python --version after the receipt readback."
example = "The second line of the terminal block invokes the Python version diagnostic."
observable = "The terminal prints a Python version after the receipt is read."
failure = "A failed invocation calls for environment activation or Python-installation recovery."
practice = "s01-l03-e4"

[[lessons.concepts]]
id = "editor-open-session"
purpose = "Open the external editor on the learner-created project directory before creating a file."
anatomy = "Launch a code or plain-text editor, choose Open Folder or Open Workspace, and select lanterns-of-briar-glen."
example = "For disposable practice, open a folder named editor-practice and confirm that name appears at the root of the editor tree."
observable = "The editor folder tree names the selected root and shows only items that actually exist there."
failure = "If the tree shows a parent or unrelated project, close that workspace and reopen the intended directory before creating a file."
practice = "s01-l03-e2"

[[lessons.concepts]]
id = "plain-text-receipt-format"
purpose = "Keep the temporary receipt behavior-free and readable by both the editor and terminal."
anatomy = "Plain text is unstyled characters and line breaks saved with the exact .txt extension; it contains no fonts, tables, images, or word-processor formatting."
example = "A disposable trail-note.txt can contain two learner-typed, unstyled label-and-value lines."
observable = "The terminal displays the same visible characters and line breaks that the editor saved."
failure = "If formatting controls appear or the extension changes, recreate the file in a code or plain-text editor with the exact .txt filename."
practice = "s01-l03-e2"

[[lessons.artifactSteps]]
id = "s01-l03-save-toolchain-receipt"
path = "toolchain-check.txt"
mode = "author"
instruction = "Open your code or plain-text editor on the project root, then author a plain-text receipt that records the workspace, observed Python version, active project environment, and that you saved and reread it. Save it, read the exact path with cat on Linux/macOS, Get-Content in PowerShell, or type in Command Prompt, then run a Python version diagnostic while the environment is active. After those observations are complete, release activation with deactivate. Do not create source, configuration, dependency, or package files."
checks = ["The editor folder tree names the learner-created lanterns-of-briar-glen root.", "The receipt has the exact .txt name and contains only unstyled characters and line breaks.", "The learner uses the readback command for the current shell and sees the saved observations from project-root toolchain-check.txt.", "A Python version diagnostic succeeds after readback, then deactivate releases the current shell without deleting .venv or adding any game artifact."]
mechanisms = ["editor-create-file", "editor-edit-file", "editor-save-file", "terminal-read-saved-file", "terminal-invoke-saved-file", "editor-open-session", "plain-text-receipt-format", "venv-activate-environment"]

[[lessons.readings]]
label = "Python documentation: command line and environment"
url = "https://docs.python.org/3/using/cmdline.html"

[[lessons.exercises]]
id = "s01-l03-e1"
type = "mc"
points = 15
prompt = "An editor tab shows your receipt text, but the terminal readback shows older text. What is the most direct next action?"
choices = ["Install a dependency.", "Create a second receipt in another folder.", "Save the editor file, then reread the same path.", "Rename the Python interpreter."]
answer = 2
whyWrong = "The mismatch is about persistence or path selection, not dependencies or interpreter names. Saving and rereading the same file tests the missing link."
hint = "Choose the action that turns an editor change into disk content before inspecting it again."
explain = "A terminal reads saved disk content, not unsaved editor state."
mechanisms = ["editor-save-file", "terminal-read-saved-file"]

[[lessons.exercises]]
id = "s01-l03-d1"
type = "type"
points = 12
reps = 2
prompt = "Retype the terminal command that reads the saved receipt on Linux or macOS."
code = 'cat toolchain-check.txt'
mechanisms = ["terminal-read-saved-file"]

[[lessons.exercises]]
id = "s01-l03-e2"
type = "mc"
points = 20
prompt = "Which editor sequence establishes both the correct workspace and a plain-text receipt?"
choices = ["Open a code or plain-text editor on the intended project folder, confirm its name in the folder tree, then create a .txt file containing only unstyled characters and line breaks.", "Open a word processor on any folder and add bold headings, a table, and an image.", "Open a parent containing several projects and create a file without checking the active root.", "Create a Python source file containing executable setup code."]
answer = 0
whyWrong = "Rich formatting is not plain text, an unchecked parent risks the wrong project, and executable source is out of scope."
hint = "Look for a visible project root and an unstyled .txt file."
explain = "The editor tree proves placement, while unstyled characters and line breaks prove the receipt format."
mechanisms = ["editor-open-session", "editor-create-file", "plain-text-receipt-format"]

[[lessons.exercises]]
id = "s01-l03-e3"
type = "mc"
points = 20
prompt = "Which row correctly matches each permitted terminal with its receipt readback command?"
choices = ["Every terminal: python toolchain-check.txt", "Linux/macOS: type toolchain-check.txt; PowerShell: cat toolchain-check.txt; Command Prompt: Get-Content toolchain-check.txt", "Every terminal: activate toolchain-check.txt", "Linux/macOS: cat toolchain-check.txt; PowerShell: Get-Content toolchain-check.txt; Command Prompt: type toolchain-check.txt"]
answer = 3
whyWrong = "The read commands are shell-specific, and the receipt is plain-text evidence rather than Python source or an activation script."
hint = "Match cat with Unix-like shells, Get-Content with PowerShell, and type with Command Prompt."
explain = "Each command displays the same saved text, but only in the shell whose syntax owns it."
mechanisms = ["terminal-read-saved-file"]

[[lessons.exercises]]
id = "s01-l03-e4"
type = "text"
points = 33
prompt = "After reading the saved receipt while <code>.venv</code> is active, which behavior-free diagnostic command should you run before ending the tool loop?"
answer = "python --version"
hint = "Repeat the interpreter diagnostic practiced before any project source exists."
mechanisms = ["terminal-invoke-saved-file"]
