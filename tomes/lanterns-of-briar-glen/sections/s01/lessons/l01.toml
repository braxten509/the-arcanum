[[lessons]]
id = "s01-l01"
title = "Orient the Real Workspace"
teaches = ["workspace-orientation", "tool-navigate", "tool-diagnose"]
introduces = ["terminal-print-working-directory", "terminal-change-directory", "terminal-check-python-version"]
body = '''
<p>Before the grove has a map, it needs a real place to live. Your <strong>workspace</strong> is the folder you choose for the entire learner-authored project. The terminal has its own current location, called the working directory. A command affects that location unless you give it another path, so a calm first habit is to ask where you are before asking a tool to do work.</p>
<pre><code data-kind="terminal">pwd
</code></pre>
<p><code>pwd</code> means “print working directory.” It reports a path; it does not create anything. Compare that path with the folder you intended to use. If it is wrong, move the terminal with <code>cd</code>, short for “change directory.” In this disposable example, the folder name is not part of Lanterns of Briar Glen:</p>
<pre><code data-kind="terminal">cd ~/practice-camp
pwd
</code></pre>
<p>Read this as two ordered actions: <code>cd</code> receives a folder path and makes it the terminal's new location; the following <code>pwd</code> reports the result. A missing-folder message means the path was typed incorrectly or has not been created yet. Do not guess which location is active—ask again with <code>pwd</code>.</p>
<p>Next, diagnose the Python command that this terminal can currently find:</p>
<pre><code data-kind="terminal">python --version
</code></pre>
<p><code>python</code> names the command; <code>--version</code> asks it to print its version and exit. This is a diagnostic, not a game program and not an installation. If your system reports that <code>python</code> is unknown, try <code>python3 --version</code>, note the result, and use the spelling that your system provides until the next lesson gives the environment its own interpreter. A version result proves only that a Python command answered; it does not yet prove which Python you will use for the project.</p>
<div class="callout"><p>Keep your first terminal transcript boring. At this trailhead, location and interpreter identity are the only facts worth proving.</p></div>
<div class="field-notes"><div class="fn-head">FIELD NOTES // TWO KINDS OF SAFETY</div><p>A path check prevents commands from landing in the wrong folder. A version check prevents you from assuming that an available Python is the one your project will later use. They are small observations with different jobs.</p></div>
'''

[[lessons.concepts]]
id = "workspace-orientation"
purpose = "Identify the external folder that will hold the learner-authored project before any project material exists."
anatomy = "Choose the folder, run pwd, then compare the printed path with the folder you intended."
example = "The pwd terminal block reports the current folder without changing it."
observable = "The terminal prints one path that matches the chosen workspace."
failure = "A surprising path means the terminal is aimed elsewhere; do not create files until pwd reports the intended folder."
practice = "s01-l01-e1"

[[lessons.concepts]]
id = "tool-navigate"
purpose = "Move a terminal deliberately so later external-tool actions affect the intended folder."
anatomy = "Type cd, provide a folder path, press Enter, then run pwd to verify the new location."
example = "The disposable practice-camp example shows cd followed by pwd."
observable = "The second command prints the folder selected by cd."
failure = "A no-such-file-or-directory message means the supplied path is not available as written."
practice = "s01-l01-e2"

[[lessons.concepts]]
id = "tool-diagnose"
purpose = "Ask a command-line tool for evidence instead of assuming it is ready."
anatomy = "Invoke python and attach the --version option so it reports identity information and exits."
example = "The python --version terminal block is the complete diagnostic example."
observable = "Python prints a version or the terminal reports that the command name is unavailable."
failure = "An unavailable-command message is evidence to record and investigate, not a reason to invent a project file."
practice = "s01-l01-e3"

[[lessons.concepts]]
id = "terminal-print-working-directory"
purpose = "Make the terminal reveal the folder that its next relative-path command will use."
anatomy = "Run pwd before a file-creating command and compare its one-line path with the intended workspace."
example = "The first terminal block contains pwd by itself."
observable = "The terminal prints the current working-directory path without creating a file."
failure = "If the printed path is unexpected, stop and navigate before creating material."
practice = "s01-l01-e1"

[[lessons.concepts]]
id = "terminal-change-directory"
purpose = "Set the current terminal location deliberately before later commands use relative paths."
anatomy = "Run cd with a folder path, then follow it with pwd to prove the new location."
example = "The disposable cd ~/practice-camp example changes location before its second pwd."
observable = "The confirming pwd reports the directory named by the successful change-directory action."
failure = "A missing-directory diagnostic means correct or create the intended folder outside this lesson's artifact work."
practice = "s01-l01-e2"

[[lessons.concepts]]
id = "terminal-check-python-version"
purpose = "Ask the Python command for a small identity diagnostic before trusting it for project work."
anatomy = "Invoke python with --version and read the version or unavailable-command diagnostic it returns."
example = "The final terminal block uses python --version."
observable = "The terminal prints a Python version or a concrete command-resolution failure."
failure = "If the command is unavailable, record the exact result and use the system's available spelling while investigating."
practice = "s01-l01-e3"

[[lessons.artifactSteps]]
id = "s01-l01-orient-workspace"
path = "toolchain-check.txt"
mode = "author"
mechanisms = ["terminal-print-working-directory", "terminal-change-directory", "terminal-check-python-version"]
instruction = "Before creating the receipt in l03, use the terminal to arrive at your chosen external project folder. Run a working-directory check, correct the location with a change-directory action if needed, then run a Python version diagnostic. Do not create this path or any project material yet."
checks = ["pwd reports the chosen external project folder.", "A Python version diagnostic produces either a version observation or a specific unavailable-command diagnostic."]

[[lessons.readings]]
label = "Python command-line reference"
url = "https://docs.python.org/3/using/cmdline.html"

[[lessons.exercises]]
id = "s01-l01-e1"
type = "mc"
points = 18
mechanisms = ["terminal-print-working-directory"]
prompt = "You have opened a terminal but cannot tell whether it points at your new project folder. Which command gives that evidence without changing any files?"
choices = ["cd", "pwd", "python --version", "mkdir"]
answer = 1
whyWrong = "Changing directories may be useful later, but it does not first report the current location. A version diagnostic identifies Python, not the terminal's folder; mkdir would create material before the location is proved."
hint = "Choose the command whose name expands to print working directory."
explain = "pwd reports the terminal's current working directory."

[[lessons.exercises]]
id = "s01-l01-e2"
type = "text"
points = 20
mechanisms = ["terminal-change-directory", "terminal-print-working-directory"]
prompt = "After a location check shows the wrong folder, what terminal command family changes the working directory before you verify it again?"
answer = "cd"
whyWrong = "The task is to move the terminal's current location. A reporting command can confirm the move, but it cannot make it."
hint = "Use the two-letter abbreviation for change directory."

[[lessons.exercises]]
id = "s01-l01-e3"
type = "fill"
points = 22
mechanisms = ["terminal-check-python-version"]
prompt = "Complete the diagnostic so Python reports its installed version and then exits."
code = "python ____"
answer = "--version"
whyWrong = "A bare command starts Python interactively; the two-hyphen option asks it to print identity information instead."
hint = "Use the option with two hyphens that names the information you want."

[[lessons.exercises]]
id = "s01-l01-d1"
type = "type"
points = 12
reps = 2
mechanisms = ["terminal-print-working-directory"]
prompt = "Retype the location diagnostic exactly before you use it in your own terminal."
code = "pwd"
