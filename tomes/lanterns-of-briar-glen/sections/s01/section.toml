id = "s01"
codename = "CHAPTER I // THE EXTERNAL TRAILHEAD"
short = "The External Trailhead"
title = "The External Trailhead"
build = "Establish a real Python environment and a behavior-free tool receipt before the RPG has source, dependencies, configuration, or package commands."
brief = '''<p>Rowan Vell will not light a lantern in an unmarked workshop. Before Briar Glen has a single line of game code, prove that you can find the workspace, aim a terminal at it, and tell which Python will answer. This chapter creates only a temporary tool receipt; the first program arrives in the next chapter.</p>'''

[proof]
mode = "guided"
expectedFiles = ["toolchain-check.txt"]
guidedChecks = [
  "From the external project root, activate .venv and confirm that the resolved python command belongs to that environment before recording the receipt.",
  "Open toolchain-check.txt in the chosen editor, save it, read the saved file from the terminal, and run python --version without creating requirements, source, configuration, or package files.",
]
mechanisms = ["terminal-print-working-directory", "terminal-change-directory", "terminal-check-python-version", "venv-create-environment", "venv-activate-environment", "venv-resolve-active-python", "editor-create-file", "editor-edit-file", "editor-save-file", "terminal-read-saved-file", "terminal-invoke-saved-file"]
