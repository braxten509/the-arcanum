id = "s01"
codename = "CHAPTER I // THE EXTERNAL TRAILHEAD"
short = "The External Trailhead"
title = "The External Trailhead"
build = "Establish a Python virtual environment and a behavior-free terminal receipt before any game source, configuration, dependency, or package work begins."
brief = "<p>Before Briar Glen has rooms, rules, or a window, it needs a trailhead you can revisit. In this chapter you will locate a workspace you control, ask the terminal which Python it can see, raise an isolated environment, and prove that your editor and terminal agree about one saved text receipt. Nothing here is game code. That restraint matters: later chapters will build every project artifact with you at the keyboard, while this chapter makes the tools trustworthy.</p>"

[proof]
mode = "guided"
expectedFiles = ["toolchain-check.txt"]
guidedChecks = [
  "The learner can open the operating-system terminal, identify the printed parent as an existing personal location, create and enter the known project child, and safely inspect the target with the taught shell-specific listing command if it already exists.",
  "The learner can open the editor on that root and create toolchain-check.txt as unstyled plain text with the exact filename.",
  "The learner can explain the -m module-invocation option, use it to install the local venv tool boundary, apply the shell-appropriate activation action including source on a Unix-like shell, resolve the environment’s Python path, and later release that current-shell selection with deactivate.",
  "With the project environment activated, the learner can display the Python version, read toolchain-check.txt using cat, Get-Content, or Command Prompt type as appropriate, run the documented diagnostic, and then deactivate without creating source, dependency, configuration, or package files.",
]
mechanisms = ["terminal-print-working-directory", "terminal-change-directory", "terminal-check-python-version", "venv-create-environment", "venv-activate-environment", "venv-resolve-active-python", "editor-create-file", "editor-edit-file", "editor-save-file", "terminal-read-saved-file", "terminal-invoke-saved-file", "terminal-create-project-directory", "editor-open-session", "plain-text-receipt-format", "python-module-invocation", "shell-source-script"]
