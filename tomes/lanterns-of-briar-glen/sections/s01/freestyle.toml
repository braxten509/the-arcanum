[freestyle]
title = "THE WORKING: The External Trailhead"
brief = '''Rowan needs a trustworthy trail marker before any game construction begins.<ul><li>Choose an external folder for Lanterns of Briar Glen and use a terminal to arrive at that folder; do not create Python source, requirements, configuration, package metadata, or install dependencies.</li><li>Create and activate a <code>.venv</code> there, then use terminal diagnostics to distinguish its Python from a system Python.</li><li>Using your editor, create and save <code>toolchain-check.txt</code> as a behavior-free receipt. It must identify the workspace, record the activated-environment Python path or name, and record the observed Python version.</li><li>Read the saved receipt from the terminal and rerun <code>python --version</code>. Keep the receipt as plain text only; s02 will retire it after the first source program runs.</li></ul>'''
requires = ["workspace-orientation", "isolated-python-environment", "external-file-action-loop", "tool-navigate", "tool-diagnose", "tool-install", "tool-create-open", "tool-edit-save", "tool-run-test", "language-environment-venv"]
mechanisms = ["terminal-print-working-directory", "terminal-change-directory", "terminal-check-python-version", "venv-create-environment", "venv-activate-environment", "venv-resolve-active-python", "editor-create-file", "editor-edit-file", "editor-save-file", "terminal-read-saved-file", "terminal-invoke-saved-file"]
reward = 150
xray = "Rowan checks that the receipt is a saved, readable plain-text observation from the activated environment—not a source file, dependency list, or invented screenshot. He also checks that the terminal evidence and editor action are both real."

[[freestyle.referenceSteps]]
id = "s01-create-toolchain-receipt"
path = "toolchain-check.txt"
mode = "write"
mechanisms = ["editor-create-file", "editor-edit-file", "editor-save-file", "terminal-read-saved-file", "terminal-invoke-saved-file"]
instruction = "Create the private replay receipt representing the learner's saved external-tool check."
content = '''
Lanterns of Briar Glen external tool receipt
workspace: external project root confirmed
environment: .venv activated
python: environment interpreter resolved
diagnostic: python --version observed
receipt: saved in an editor and read in a terminal
'''

[freestyle.badge]
id = "badge-s01"
name = "TRAILHEAD LIT"
desc = "Marked a real workspace and verified the lantern's Python path."

[[freestyle.rubric]]
criterion = "Workspace And Terminal Orientation"
weight = 25
desc = "The learner can show the chosen project root, use a change-directory action deliberately, and use a working-directory diagnostic before creating project material."
mechanisms = ["terminal-print-working-directory", "terminal-change-directory"]

[[freestyle.rubric]]
criterion = "Isolated Interpreter Evidence"
weight = 25
desc = "A .venv is created and activated; the learner compares the resolved active Python with the system context and records an observed Python version without installing a dependency."
mechanisms = ["terminal-check-python-version", "venv-create-environment", "venv-activate-environment", "venv-resolve-active-python"]

[[freestyle.rubric]]
criterion = "Saved Behavior-Free Receipt"
weight = 30
desc = "toolchain-check.txt is plain text, identifies the workspace and activated interpreter evidence, survives save and terminal readback, and contains no source, requirements, configuration, package metadata, or dependency command."
mechanisms = ["editor-create-file", "editor-edit-file", "editor-save-file", "terminal-read-saved-file", "terminal-invoke-saved-file"]

[[freestyle.rubric]]
criterion = "Observed Evidence, Not Guesswork"
weight = 20
desc = "The receipt's workspace, active-interpreter context, and Python version come from the learner's terminal observations; saved readback and the repeated version diagnostic agree with those observations."
mechanisms = ["terminal-check-python-version", "venv-resolve-active-python", "editor-edit-file", "editor-save-file", "terminal-read-saved-file", "terminal-invoke-saved-file"]
