[freestyle]
title = "THE WORKING: THE EXTERNAL TRAILHEAD"
brief = '''<p>Rowan will not hand you a game skeleton. Establish the real workspace that will hold <em>Lanterns of Briar Glen</em> and leave one behavior-free receipt behind.</p><ul><li>Print and identify an existing personal location you control, create the project child there, and enter only that known child. If the target already exists, use the taught shell-specific listing action to inspect it before entering; never mix with an unrelated directory.</li><li>Use Python’s module-invocation option to run <code>venv</code> and install a project-local <code>.venv</code> tool boundary. Activate it using the command appropriate to your terminal—on a Unix-like shell, source the activation script into the current session—and confirm that the active <code>python</code> resolves from that environment.</li><li>Using your editor, create <code>toolchain-check.txt</code>. It must be plain text only: identify the workspace, record the Python version you observed, state that the project environment was active, and state that you saved and reread the file. Do not create requirements files, install project dependencies, add configuration, package metadata, or game source.</li><li>Save the receipt; read it with <code>cat</code> on Linux/macOS, <code>Get-Content</code> in PowerShell, or <code>type</code> in Command Prompt; and invoke a Python version diagnostic while the environment remains active. If the diagnostic points outside <code>.venv</code>, repair activation. When all observations are complete, run <code>deactivate</code> and confirm the current shell no longer selects Python from this project’s environment.</li></ul>'''
requires = ["workspace-orientation", "isolated-python-environment", "external-file-action-loop", "tool-navigate", "tool-diagnose", "tool-install", "tool-create-open", "tool-edit-save", "tool-run-test", "language-environment-venv"]
mechanisms = ["terminal-print-working-directory", "terminal-change-directory", "terminal-check-python-version", "venv-create-environment", "venv-activate-environment", "venv-resolve-active-python", "editor-create-file", "editor-edit-file", "editor-save-file", "terminal-read-saved-file", "terminal-invoke-saved-file", "terminal-create-project-directory", "editor-open-session", "plain-text-receipt-format", "python-module-invocation", "shell-source-script"]
reward = 150
xray = "Check for a learner-created plain-text receipt, an environment local to the project, and evidence that the terminal and editor saw the same saved file. Dock invented Python source, dependency installation, package metadata, or a diagnostic that silently used a global interpreter. The receipt records observations; it is not a program."

[[freestyle.referenceSteps]]
id = "s01-create-toolchain-receipt"
path = "toolchain-check.txt"
mode = "write"
instruction = "Create the private replay receipt as plain text after the external workspace and its isolated environment have been prepared."
content = '''
External Trailhead Receipt
Workspace: chosen and inspected
Python: diagnostic completed
Environment: project-local .venv active
Editor loop: created, saved, and reread
'''
mechanisms = ["editor-create-file", "editor-edit-file", "editor-save-file", "terminal-read-saved-file", "terminal-invoke-saved-file", "editor-open-session", "plain-text-receipt-format"]

[freestyle.badge]
id = "badge-s01"
name = "TRAILHEAD KEEPER"
desc = "You can prove where a Python workspace lives and which interpreter is standing watch."

[[freestyle.rubric]]
criterion = "Workspace and Environment Evidence"
weight = 40
desc = "The learner identifies a controlled existing parent, creates and safely enters the project child, inspects any pre-existing target, invokes Python’s venv module to install the local tool boundary, applies shell-appropriate activation, confirms the active Python belongs to it, and releases the shell with deactivate after the evidence loop."
mechanisms = ["terminal-print-working-directory", "terminal-change-directory", "terminal-check-python-version", "venv-create-environment", "venv-activate-environment", "venv-resolve-active-python", "terminal-create-project-directory", "python-module-invocation", "shell-source-script"]

[[freestyle.rubric]]
criterion = "Saved Receipt Loop"
weight = 40
desc = "toolchain-check.txt is learner-authored plain text, saved through an editor, and reread with the taught Linux/macOS, PowerShell, or Command Prompt command for the learner’s actual terminal."
mechanisms = ["editor-create-file", "editor-edit-file", "editor-save-file", "terminal-read-saved-file", "editor-open-session", "plain-text-receipt-format"]

[[freestyle.rubric]]
criterion = "Bounded Setup"
weight = 20
desc = "The trailhead stays behavior-free: no source, dependency, configuration, metadata, or package command appears before the next section."
mechanisms = ["terminal-invoke-saved-file"]
