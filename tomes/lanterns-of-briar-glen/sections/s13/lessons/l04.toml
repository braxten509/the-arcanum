mode = "author"
mechanisms = ["project-relative-user-data-path", "pathlib-path-constructor", "pathlib-path-join-operator", "pathlib-cwd-method", "pathlib-exists-method", "pytest-test-function", "python-assert-statement", "arrange-act-assert", "pytest-module-invocation", "editor-edit-file", "editor-save-file", "terminal-read-saved-file"]
instruction = "In learner-authored tests/test_game.py, preserve the eleven established focused checks and author three more: one asserts the project-relative note helper returns the expected path under a supplied harmless root; one asserts the player-data helper returns the expected hidden directory under a supplied harmless home root; and one passes Path.cwd() to the directory helper and proves an existing directory remains available and is returned. Import the new package-level seams through briar_glen. Save and read the tests, then run python -m pytest -q from the external project root until it reports 14 passed. Do not test a real save file, remove paths, use JSON, add a fixture, alter the six-turn trail, or test Pygame behavior."
