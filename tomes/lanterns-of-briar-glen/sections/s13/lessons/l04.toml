[[lessons.exercises]]
id = "s13-l04-w1"
type = "write"
points = 35
mechanisms = ["project-relative-user-data-path", "pathlib-path-constructor", "pathlib-path-join-operator", "pytest-test-function", "python-assert-statement", "arrange-act-assert", "python-def-statement", "python-return-statement", "python-print-call"]
prompt = "Write a disposable program that defines banner_path(project_root), returning project_root / \"banner.txt\", and cache_path(home_root), returning home_root / \".camp-cache\". Then define one test that passes Path(\"camp-project\") and Path(\"camp-home\"), asserting both exact returned Paths. Run the test function and print 1 passed. This is not a Briar Glen artifact."
expect = "1 passed"
solution = '''from pathlib import Path


def banner_path(project_root):
    return project_root / "banner.txt"


def cache_path(home_root):
    return home_root / ".camp-cache"


def test_path_families():
    project_path = banner_path(Path("camp-project"))
    home_path = cache_path(Path("camp-home"))
    assert project_path == Path("camp-project") / "banner.txt"
    assert home_path == Path("camp-home") / ".camp-cache"


test_path_families()
print("1 passed")'''
hint = "Use a different harmless arranged root for each location family, then build each expected Path from its matching root."
