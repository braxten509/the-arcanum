[[lessons]]
id = "s13-l04"
title = "Test Portable Path Behavior"
teaches = ["path-failure-verification", "language-standard-library-pathlib"]
introduces = ["project-relative-user-data-path"]
body = '''
<p>Portable path code earns trust when a test can change its roots without changing the machine. The established pytest loop already knows how to arrange a value, call a focused seam, and assert the result. Use that loop here with <code>Path</code> values: pass a project root to the project-relative helper, pass a home root to the player-data helper, and assert the returned paths have the intended shape. The test does not need to write a save file or inspect a real home directory.</p>
<pre><code data-kind="runnable">from pathlib import Path

def note_path(root):
    return root / "trail-note.txt"

def player_cache_path(home_root):
    return home_root / ".trail-cache"

def test_two_path_families_stay_under_supplied_roots():
    project_root = Path("sample-project")
    home_root = Path("sample-home")
    assert note_path(project_root) == project_root / "trail-note.txt"
    assert player_cache_path(home_root) == home_root / ".trail-cache"</code></pre>
<p>This is an arrange/act/assert test. The arranged roots are intentionally harmless values, not <code>Path.cwd()</code> or <code>Path.home()</code>. The act calls each focused helper. Each assertion compares a complete Path result, including the expected child. If either helper silently reached for the author’s working directory, used the wrong root family, or joined the wrong child, the assertion would show the difference. That is path-failure verification: a narrow observable failure points to the path contract instead of a later missing-file symptom.</p>
<p>Keep the two location families explicit. A project-relative note belongs below the supplied project root. A player-data directory belongs below a supplied home root and should use one hidden application directory. The later JSON section will decide what records go inside it; this section neither serializes game objects nor promises a load/save format. The later context-resource section will replace manual lifecycle management with a safer cleanup boundary. Do not pull either lesson forward.</p>
<p>Add focused tests alongside the eleven established behavioral checks: one for each pure path shape and one for an already-existing directory passed to the guarded directory helper. The directory test may use the current directory because it only observes an existing Path and asserts the helper returns it; it must not remove anything. Run <code>python -m pytest -q</code>, read a failure by its assertion, repair only the path helper or expectation that disagrees, then rerun green.</p>
<div class="field-notes"><div class="fn-head">FIELD NOTES // ROOTS ARE TEST INPUTS</div><p>When a path rule accepts a root, the test owns that root. That is how a project can prove portability without making one developer’s computer the specification.</p></div>
'''

[[lessons.concepts]]
id = "path-failure-verification"
purpose = "Use focused assertions to expose a wrong portable path before a later file action fails."
anatomy = "Arrange a harmless root Path, call one path helper, compare the full returned Path, read an assertion failure, and rerun after one repair."
example = "test_two_path_families_stay_under_supplied_roots compares both a project note and a player cache with complete expected paths."
observable = "A mismatch names the test and displays the expected and actual Path values."
failure = "Using the real author home or current directory as hidden helper input makes the contract untestable."
practice = "s13-l04-w1"

[[lessons.concepts]]
id = "language-standard-library-pathlib"
purpose = "Use pathlib from Python’s standard library to construct, inspect, and act on portable paths."
anatomy = "Import Path, build values from roots, join children, inspect parent or existence, and make a guarded directory decision."
example = "The chapter combines pure root-relative tests with one existing-directory assertion."
observable = "pytest reports focused path checks passing alongside the established behavioral suite."
failure = "Replacing Path behavior with separator strings removes the portable operations being verified."
practice = "s13-l04-e1"

[[lessons.concepts]]
id = "project-relative-user-data-path"
purpose = "Distinguish a path below a supplied project root from a player-data directory below a supplied home root."
anatomy = "Pass a project root to the note-path helper, pass a home root to the data-directory helper, and keep each result in its own location family."
example = "The disposable test compares sample-project/trail-note.txt and sample-home/.trail-cache rather than any real machine location."
observable = "Each assertion identifies which supplied root determines the returned location."
failure = "Putting user data inside package source or deriving it from an unstated author path confuses ownership and portability."
practice = "s13-l04-w1"

[[lessons.artifactSteps]]
