[[lessons.exercises]]
id = "s13-l01-e1"
type = "mc"
points = 18
mechanisms = ["python-open-call", "text-file-mode", "text-file-write-method"]
prompt = "Which sequence writes text through an explicitly opened text file?"
choices = ["Open with r, call read, then close", "Open with w and UTF-8, call write, then close", "Call close before open, then call write", "Store a path string and assume it writes itself"]
answer = 1
whyWrong = "Reading does not write, a closed object cannot accept text, and a path alone performs no file action."
hint = "Match the mode to the intended action."
explain = "A writable UTF-8 file object is acquired before write, then its lifecycle is ended with close."

[[lessons.exercises]]
id = "s13-l01-e2"
type = "fill"
points = 18
mechanisms = ["text-file-close-method", "text-file-mode"]
prompt = "Complete the disposable lifecycle ending after its one write."
code = '''log_file.write("ember")
log_file.____()'''
answer = "close"
hint = "Name the method that ends this object’s lifecycle."

[[lessons.exercises]]
id = "s13-l01-e3"
type = "text"
points = 18
mechanisms = ["utf8-text-encoding", "text-file-read-method"]
prompt = "Why should a text reader name UTF-8 when its paired writer named UTF-8?"
answer = "So the reader and writer use the same explicit character encoding"
hint = "Think about the rule that turns characters into stored bytes and back."

[[lessons.exercises]]
id = "s13-l01-w1"
type = "write"
points = 35
mechanisms = ["python-open-call", "text-file-read-method", "text-file-write-method", "text-file-close-method", "text-file-mode", "utf8-text-encoding", "python-print-call"]
prompt = "Write a disposable program that writes the exact text comet to a UTF-8 file named practice-note.txt, closes it, reopens it for reading, prints the recovered text, and closes that reader. This is not a Briar Glen artifact."
expect = "comet"
solution = '''note_file = open("practice-note.txt", "w", encoding="utf-8")
note_file.write("comet")
note_file.close()

note_file = open("practice-note.txt", "r", encoding="utf-8")
recovered_note = note_file.read()
note_file.close()
print(recovered_note)'''
hint = "Use two separate file objects: one writable and one readable."
