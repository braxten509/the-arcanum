[[lessons.exercises]]
id = "s13-l03-w1"
type = "write"
points = 35
mechanisms = ["pathlib-path-constructor", "pathlib-exists-method", "pathlib-mkdir-method", "python-if-statement", "python-print-call"]
prompt = "Write a disposable program that constructs Path(\"practice-dir\"), creates it only if it does not exist, then prints the exact Boolean result of exists()."
expect = "True"
solution = '''from pathlib import Path

practice_dir = Path("practice-dir")
if not practice_dir.exists():
    practice_dir.mkdir()
print(practice_dir.exists())'''
hint = "The final existence check must occur after the guarded action."
