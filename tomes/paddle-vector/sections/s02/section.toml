id = "s02"
codename = "CHAPTER II // DRAW THE COURT"
short = "Draw the Court"
title = "Draw the Court"
build = "extend the learner-owned source with rectangle data and ABI-safe rendering procedures for the background, center line, paddles, and ball, retrieving data layout and debugger-backed verification through a deterministic court check."
brief = "Extend the learner-owned native window with a checked SDL renderer, explicit SDL_Rect-compatible court state, and ABI-safe frame procedures. The milestone paints the background, center line, two paddles, and ball, preserves the section-one lifetime contract, and proves the rendered state through an exact dummy-driver court check plus GDB inspection."

[proof]
mode = "run"
mechanisms = ["sdl-renderer-status-observation", "sdl-renderer-failure-branch", "sdl-renderer-error-diagnostic", "sdl-renderer-failure-cleanup", "sdl-renderer-normal-cleanup", "sdl-rect-compatible-integer-layout", "sdl-clear-fill-present-sequence", "render-status-observation", "render-failure-branch", "render-error-diagnostic", "render-failure-cleanup", "abi-safe-render-procedure-decomposition", "deterministic-court-check-and-gdb-proof"]
expectedFiles = ["src/pong.asm", "Makefile"]
runArgs = ["--arcanum-court-check"]
expect = "COURT_OK"

