[[lessons.exercises]]
id = "s02-l01-w1"
type = "mc"
required = true
capabilities = ["language-status-failure-and-resource-cleanup"]
mechanisms = ["sdl-renderer-normal-cleanup"]
cognitiveTask = "predict"
scaffold = "independent"
contextFamily = "dash-renderer-lab"
aidPolicy = "learning"
points = 30
prompt = "A teammate removes the store that clears dash_renderer after SDL_DestroyRenderer. Shared cleanup is accidentally entered a second time. What is the most accurate diagnosis?"
choices = ["The zero guard still skips the second destroy", "SDL automatically rewrites dash_renderer when the first destroy returns", "The stale nonzero slot passes the guard and can send the same released pointer to SDL_DestroyRenderer again", "The assembler refuses to call the same function twice"]
answer = 2
whyWrong = "Neither SDL nor NASM rewrites your stored handle for you, and the guard can only skip cleanup when the slot actually contains zero."
hint = "Trace the stored slot, not a register: what value remains there after the first call if the clearing store is absent?"
explain = "Without the explicit zero store, dash_renderer still contains the released address. A second cleanup sees that stale value as nonzero and attempts a second destroy, so clearing the owned slot is part of normal cleanup rather than cosmetic bookkeeping."

[[lessons.exercises]]
id = "s02-l01-w2"
type = "mc"
required = true
capabilities = ["language-status-failure-and-resource-cleanup"]
mechanisms = ["sdl-renderer-status-observation", "sdl-renderer-failure-branch", "sdl-renderer-error-diagnostic"]
cognitiveTask = "debug"
scaffold = "independent"
contextFamily = "dash-renderer-lab"
aidPolicy = "learning"
points = 30
prompt = "A trainee inserts `call SDL_GetError` between `call SDL_CreateRenderer` and `cmp rax, 0`, then stores rax on the apparent success path. What is wrong?"
choices = ["Nothing; SDL_GetError preserves every caller-saved register", "The comparison and store now use SDL_GetError's string pointer instead of SDL_CreateRenderer's result", "SDL_GetError destroys the renderer automatically", "cmp can only follow arithmetic instructions"]
answer = 1
whyWrong = "rax is caller-saved, SDL_GetError does not release the renderer, and cmp may legally follow a call; the defect is observing the wrong call's return value."
hint = "Which function supplied the value currently in rax when cmp executes?"
explain = "Each call returns its own result in rax. Calling SDL_GetError first replaces the renderer result with an error-string pointer, so both the zero test and stored handle lose their connection to SDL_CreateRenderer. Observe and branch on the renderer result before making the diagnostic call."
