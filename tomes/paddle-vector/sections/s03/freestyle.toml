[freestyle]
title = "THE WORKING: Working: Make Both Paddles Respond"
brief = """Extend the court you built in Chapter II into a two-player loop. You will author every change in your existing <code>src/pong.asm</code> and <code>Makefile</code>; the lesson labs were disposable and are not starter code. The finished program must keep SDL alive for many paced frames, move both paddles from one keyboard snapshot, and still reach the single cleanup path promptly when the window closes.<ul><li>Drain <code>SDL_PollEvent</code> to zero every frame. Inspect an event's type only after a successful poll, make <code>SDL_QUIT</code> set persistent quit state, and test that state before sampling, updating, rendering, or sleeping again.</li><li>After the event pump, call <code>SDL_GetKeyboardState</code> once per frame. Map W/S to the left paddle and Up/Down to the right. Compute the two axes independently so simultaneous players work; opposing keys for one paddle must cancel.</li><li>Choose an integer paddle speed from 4 through 8 pixels per update and leave a short source comment explaining the feel you intended. Use that same constant in live play and the deterministic check. Apply signed deltas to the existing rectangle y fields and clamp each result to <code>0 .. window_height - paddle_height</code>.</li><li>Use a 16 ms frame budget. Capture a frame start with <code>SDL_GetTicks</code>, derive its deadline, and call <code>SDL_Delay</code> only for the positive remainder after work. A late frame must continue without an underflowed delay.</li><li>Keep event draining, control sampling, paddle updating, court rendering, and pacing in ABI-safe procedures. The frame order is begin, drain, quit gate, sample, update, render, pace. Preserve every SDL status check and the renderer-before-window-before-SDL cleanup path from the learner-owned project.</li><li>Add <code>--arcanum-loop-check</code> and <code>make check-s03</code>. The check must feed controlled simultaneous input, a two-reading clock, and a one-frame limit through the same procedures used live. It must prove both boundary clamps, one 10 ms remainder from a 1000/1006 clock pair, one committed frame, and print exactly <code>PADDLES_OK</code>. It may initialize the controlled case, but it may not write the expected final paddle positions directly or skip rendering.</li><li>Add <code>make debug-replay-s03</code> so GDB stops after controls are sampled, after positions are updated, after the frame commits, and after renderer cleanup. Inspect both axes, both y fields, frame count, deadline or requested delay, and the cleared renderer handle.</li></ul><p>Build and check with <code>make clean &amp;&amp; make build</code>, <code>make check-s01</code>, <code>make check-s02</code>, and <code>make check-s03</code>. Run <code>make debug-replay-s03</code>, then <code>make run</code>; hold a key for each player together, push both paddles against both edges, and close the window during motion. If a paddle moves after release, verify the keyboard pointer is sampled after the event pump and no key byte is cached across frames. If a paddle crosses an edge, inspect the signed candidate and the height-derived maximum before the store. If the loop freezes or consumes a core, inspect the quit gate, unsigned tick difference, and positive-delay branch. Acceptance is observable when old checks still pass, <code>check-s03</code> prints exactly <code>PADDLES_OK</code>, GDB exposes the controlled state transitions and cleared renderer, both players can move simultaneously without leaving the court, motion remains paced, and closing the window exits cleanly.</p>"""
requires = ["language-data-layout-and-integer-state", "language-branch-loop-control", "language-abi-procedures-and-register-discipline", "language-observable-debugging-and-verification", "event-queue-input", "keyboard-state-sampling", "paddle-state-update", "frame-clock-pacing", "responsive-loop-decomposition", "deterministic-loop-controls", "responsive-paddle-loop"]
mechanisms = ["debian-toolchain-install", "toolchain-version-diagnostics", "workspace-directory-creation", "tool-edit-save", "nasm-source-layout", "makefile-authorship", "nasm-integer-data-and-addressed-state", "nasm-static-cstring-pointer-and-sdl-error-output", "nasm-compare-branch-loop-control", "sysv-abi-procedure-discipline", "nasm-elf64-dwarf-object-build", "gcc-sdl2-link-and-make-targets", "sdl-init-status-observation", "sdl-init-failure-branch", "sdl-init-error-diagnostic", "sdl-init-failure-cleanup", "sdl-window-status-observation", "sdl-window-failure-branch", "sdl-window-error-diagnostic", "sdl-window-failure-cleanup", "sdl-window-normal-cleanup", "deterministic-init-check", "gdb-state-inspection", "sdl-renderer-status-observation", "sdl-renderer-failure-branch", "sdl-renderer-error-diagnostic", "sdl-renderer-failure-cleanup", "sdl-renderer-normal-cleanup", "sdl-rect-compatible-integer-layout", "sdl-clear-fill-present-sequence", "render-status-observation", "render-failure-branch", "render-error-diagnostic", "render-failure-cleanup", "abi-safe-render-procedure-decomposition", "deterministic-court-check-and-gdb-proof", "sdl-event-poll-type-and-quit-dispatch", "sdl-keyboard-snapshot-and-scancode-indexing", "integer-paddle-delta-and-boundary-clamp", "sdl-ticks-deadline-and-delay-pacing", "abi-safe-poll-update-render-loop", "deterministic-input-clock-and-frame-limit-controls", "responsive-loop-check-gdb-and-live-proof"]
validationDependencies = []
masteryPerformances = []
reward = 150
xray = "Reward a learner-owned cumulative loop whose live and deterministic routes share event, input, update, render, and pace procedures. Dock type reads after an empty poll, cached keyboard bytes, serialized player controls, unsigned clamp errors, unconditional or underflowed delays, direct check-mode final-state writes, success tokens without state comparisons, and any exit that bypasses renderer-first cleanup. The speed choice is genuine only when one documented 4–8 constant drives both live movement and the controlled case."

