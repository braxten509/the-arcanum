[[freestyle.referenceSteps]]
id = "s03-reference-source"
path = "src/pong.asm"
mode = "rewrite"
preserves = "all-active"
mechanisms = ["nasm-source-layout", "nasm-integer-data-and-addressed-state", "nasm-static-cstring-pointer-and-sdl-error-output", "nasm-compare-branch-loop-control", "sysv-abi-procedure-discipline", "sdl-init-status-observation", "sdl-init-failure-branch", "sdl-init-error-diagnostic", "sdl-init-failure-cleanup", "sdl-window-status-observation", "sdl-window-failure-branch", "sdl-window-error-diagnostic", "sdl-window-failure-cleanup", "sdl-window-normal-cleanup", "deterministic-init-check", "sdl-renderer-status-observation", "sdl-renderer-failure-branch", "sdl-renderer-error-diagnostic", "sdl-renderer-failure-cleanup", "sdl-renderer-normal-cleanup", "sdl-rect-compatible-integer-layout", "sdl-clear-fill-present-sequence", "render-status-observation", "render-failure-branch", "render-error-diagnostic", "render-failure-cleanup", "abi-safe-render-procedure-decomposition", "sdl-event-poll-type-and-quit-dispatch", "sdl-keyboard-snapshot-and-scancode-indexing", "integer-paddle-delta-and-boundary-clamp", "sdl-ticks-deadline-and-delay-pacing", "abi-safe-poll-update-render-loop", "deterministic-input-clock-and-frame-limit-controls"]
instruction = "Privately replay one complete learner-authored source solution. It preserves the earlier deterministic modes, sends live and controlled operation through the same frame procedures, and exposes labels for the Makefile's debugger replay."
content = '''
default rel

global main
global controls_sampled
global positions_updated
global frame_committed
global renderer_released

extern SDL_Init
extern SDL_Quit
extern SDL_CreateWindow
extern SDL_DestroyWindow
extern SDL_CreateRenderer
extern SDL_DestroyRenderer
extern SDL_SetRenderDrawColor
extern SDL_RenderClear
extern SDL_RenderFillRect
extern SDL_RenderPresent
extern SDL_PollEvent
extern SDL_GetKeyboardState
extern SDL_GetTicks
extern SDL_Delay
extern SDL_GetError
extern printf
extern fprintf
extern stderr

%define SDL_INIT_VIDEO 0x20
%define SDL_WINDOWPOS_CENTERED 0x2fff0000
%define SDL_QUIT 0x100
%define SCANCODE_W 26
%define SCANCODE_S 22
%define SCANCODE_UP 82
%define SCANCODE_DOWN 81
%define WINDOW_W 640
%define WINDOW_H 400
%define PADDLE_H 30
%define PADDLE_SPEED 6       ; brisk without crossing the court too quickly
%define FRAME_MS 16

section .rodata
window_title db "Paddle Vector", 0
init_arg db "--arcanum-acceptance", 0
court_arg db "--arcanum-court-check", 0
loop_arg db "--arcanum-loop-check", 0
init_ok db "INIT_OK", 10, 0
court_ok db "COURT_OK", 10, 0
paddles_ok db "PADDLES_OK", 10, 0
loop_fail db "LOOP_CHECK_FAIL", 10, 0
error_format db "%s: %s", 10, 0
init_context db "SDL_Init failed", 0
window_context db "SDL_CreateWindow failed", 0
renderer_context db "SDL_CreateRenderer failed", 0
render_context db "court render failed", 0
controlled_ticks dd 1000, 1006

section .data
center_line dd 318, 0, 4, WINDOW_H
left_paddle dd 28, 185, 10, PADDLE_H
right_paddle dd 602, 185, 10, PADDLE_H
ball_rect dd 316, 196, 8, 8

section .bss
argument_ptr resq 1
window_handle resq 1
renderer_handle resq 1
exit_code resd 1
sdl_ready resd 1
check_mode resd 1
quit_requested resd 1
left_axis resd 1
right_axis resd 1
frame_started resd 1
frame_deadline resd 1
frame_count resd 1
frame_limit resd 1
controlled_mask resd 1
controlled_tick_index resd 1
requested_delay resd 1
event_buffer resb 56

section .text
main:
    push rbp
    mov rbp, rsp

    mov dword [exit_code], 1
    mov dword [sdl_ready], 0
    mov dword [check_mode], 0
    mov qword [window_handle], 0
    mov qword [renderer_handle], 0
    mov qword [argument_ptr], 0

    cmp edi, 2
    jne .mode_ready
    mov rax, [rsi + 8]
    mov [argument_ptr], rax

    mov rdi, rax
    lea rsi, [init_arg]
    call strings_equal
    test eax, eax
    jnz .select_init

    mov rdi, [argument_ptr]
    lea rsi, [court_arg]
    call strings_equal
    test eax, eax
    jnz .select_court

    mov rdi, [argument_ptr]
    lea rsi, [loop_arg]
    call strings_equal
    test eax, eax
    jz .mode_ready
    mov dword [check_mode], 3
    jmp .mode_ready

.select_init:
    mov dword [check_mode], 1
    jmp .mode_ready

.select_court:
    mov dword [check_mode], 2

.mode_ready:
    mov edi, SDL_INIT_VIDEO
    call SDL_Init
    test eax, eax
    js .init_failed
    mov dword [sdl_ready], 1

    lea rdi, [window_title]
    mov esi, SDL_WINDOWPOS_CENTERED
    mov edx, SDL_WINDOWPOS_CENTERED
    mov ecx, WINDOW_W
    mov r8d, WINDOW_H
    xor r9d, r9d
    call SDL_CreateWindow
    test rax, rax
    jz .window_failed
    mov [window_handle], rax

    cmp dword [check_mode], 1
    jne .create_renderer
    lea rdi, [init_ok]
    xor eax, eax
    call printf
    mov dword [exit_code], 0
    jmp .cleanup

.create_renderer:
    mov rdi, [window_handle]
    mov esi, -1
    xor edx, edx
    call SDL_CreateRenderer
    test rax, rax
    jz .renderer_failed
    mov [renderer_handle], rax

    call initialize_rects

    cmp dword [check_mode], 2
    je .court_check
    cmp dword [check_mode], 3
    jne .run_loop
    call prepare_loop_check

.run_loop:
    call run_frame_loop
    test eax, eax
    js .render_failed

    cmp dword [check_mode], 3
    jne .normal_exit
    call verify_loop_check
    test eax, eax
    jz .loop_check_failed
    lea rdi, [paddles_ok]
    xor eax, eax
    call printf
    mov dword [exit_code], 0
    jmp .cleanup

.court_check:
    call paint_court
    test eax, eax
    js .render_failed
    lea rdi, [court_ok]
    xor eax, eax
    call printf
    mov dword [exit_code], 0
    jmp .cleanup

.normal_exit:
    mov dword [exit_code], 0
    jmp .cleanup

.init_failed:
    lea rdi, [init_context]
    call report_sdl_error
    jmp .cleanup

.window_failed:
    lea rdi, [window_context]
    call report_sdl_error
    jmp .cleanup

.renderer_failed:
    lea rdi, [renderer_context]
    call report_sdl_error
    jmp .cleanup

.render_failed:
    lea rdi, [render_context]
    call report_sdl_error
    jmp .cleanup

.loop_check_failed:
    lea rdi, [loop_fail]
    xor eax, eax
    call printf
    mov dword [exit_code], 2

.cleanup:
    mov rdi, [renderer_handle]
    test rdi, rdi
    jz renderer_released
    call SDL_DestroyRenderer
    mov qword [renderer_handle], 0

renderer_released:
    mov rdi, [window_handle]
    test rdi, rdi
    jz .window_released
    call SDL_DestroyWindow
    mov qword [window_handle], 0

.window_released:
    cmp dword [sdl_ready], 0
    je .return
    call SDL_Quit
    mov dword [sdl_ready], 0

.return:
    mov eax, [exit_code]
    leave
    ret

initialize_rects:
    mov dword [center_line + 0], 318
    mov dword [center_line + 4], 0
    mov dword [center_line + 8], 4
    mov dword [center_line + 12], WINDOW_H
    mov dword [left_paddle + 0], 28
    mov dword [left_paddle + 4], 185
    mov dword [left_paddle + 8], 10
    mov dword [left_paddle + 12], PADDLE_H
    mov dword [right_paddle + 0], 602
    mov dword [right_paddle + 4], 185
    mov dword [right_paddle + 8], 10
    mov dword [right_paddle + 12], PADDLE_H
    mov dword [ball_rect + 0], 316
    mov dword [ball_rect + 4], 196
    mov dword [ball_rect + 8], 8
    mov dword [ball_rect + 12], 8
    ret

prepare_loop_check:
    mov dword [quit_requested], 0
    mov dword [left_axis], 0
    mov dword [right_axis], 0
    mov dword [frame_count], 0
    mov dword [frame_limit], 1
    mov dword [controlled_mask], 9
    mov dword [controlled_tick_index], 0
    mov dword [requested_delay], 0
    mov dword [left_paddle + 4], PADDLE_SPEED - 2
    mov dword [right_paddle + 4], WINDOW_H - PADDLE_H - PADDLE_SPEED + 2
    ret

run_frame_loop:
    push rbp
    mov rbp, rsp

.next_frame:
    call begin_frame
    call drain_events
    cmp dword [quit_requested], 0
    jne .done

    call sample_controls
controls_sampled:
    call update_paddles
positions_updated:
    call paint_court
    test eax, eax
    js .return
    call pace_frame
    inc dword [frame_count]
frame_committed:
    cmp dword [check_mode], 3
    jne .next_frame
    mov eax, [frame_count]
    cmp eax, [frame_limit]
    jb .next_frame

.done:
    xor eax, eax
.return:
    leave
    ret

drain_events:
    push rbp
    mov rbp, rsp

.poll:
    lea rdi, [event_buffer]
    call SDL_PollEvent
    test eax, eax
    jz .empty
    cmp dword [event_buffer], SDL_QUIT
    jne .poll
    mov dword [quit_requested], 1
    jmp .poll

.empty:
    leave
    ret

sample_controls:
    push rbp
    mov rbp, rsp

    mov dword [left_axis], 0
    mov dword [right_axis], 0
    cmp dword [check_mode], 3
    je .controlled

    xor edi, edi
    call SDL_GetKeyboardState
    cmp byte [rax + SCANCODE_W], 0
    je .live_left_down
    dec dword [left_axis]
.live_left_down:
    cmp byte [rax + SCANCODE_S], 0
    je .live_right_up
    inc dword [left_axis]
.live_right_up:
    cmp byte [rax + SCANCODE_UP], 0
    je .live_right_down
    dec dword [right_axis]
.live_right_down:
    cmp byte [rax + SCANCODE_DOWN], 0
    je .done
    inc dword [right_axis]
    jmp .done

.controlled:
    mov eax, [controlled_mask]
    test eax, 1
    jz .controlled_left_down
    dec dword [left_axis]
.controlled_left_down:
    test eax, 2
    jz .controlled_right_up
    inc dword [left_axis]
.controlled_right_up:
    test eax, 4
    jz .controlled_right_down
    dec dword [right_axis]
.controlled_right_down:
    test eax, 8
    jz .done
    inc dword [right_axis]

.done:
    leave
    ret

update_paddles:
    push rbp
    mov rbp, rsp

    lea rdi, [left_paddle]
    mov esi, [left_axis]
    mov edx, WINDOW_H
    call update_one_paddle

    lea rdi, [right_paddle]
    mov esi, [right_axis]
    mov edx, WINDOW_H
    call update_one_paddle

    leave
    ret

update_one_paddle:
    mov eax, esi
    imul eax, PADDLE_SPEED
    add eax, [rdi + 4]
    test eax, eax
    jns near .upper_ready
    xor eax, eax
.upper_ready:
    mov ecx, edx
    sub ecx, [rdi + 12]
    cmp eax, ecx
    jle near .store
    mov eax, ecx
.store:
    mov [rdi + 4], eax
    ret

begin_frame:
    push rbp
    mov rbp, rsp
    call read_frame_ticks
    mov [frame_started], eax
    add eax, FRAME_MS
    mov [frame_deadline], eax
    leave
    ret

read_frame_ticks:
    cmp dword [check_mode], 3
    jne .live
    mov ecx, [controlled_tick_index]
    cmp ecx, 2
    jb .indexed
    mov ecx, 1
.indexed:
    mov eax, [controlled_ticks + rcx * 4]
    inc dword [controlled_tick_index]
    ret
.live:
    push rbp
    mov rbp, rsp
    call SDL_GetTicks
    leave
    ret

pace_frame:
    push rbp
    mov rbp, rsp
    call read_frame_ticks
    sub eax, [frame_started]
    cmp eax, FRAME_MS
    jae .late
    mov edi, FRAME_MS
    sub edi, eax
    mov [requested_delay], edi
    cmp dword [check_mode], 3
    je .done
    call SDL_Delay
    jmp .done
.late:
    mov dword [requested_delay], 0
.done:
    xor eax, eax
    leave
    ret

paint_court:
    push rbp
    mov rbp, rsp

    mov rdi, [renderer_handle]
    xor esi, esi
    xor edx, edx
    xor ecx, ecx
    mov r8d, 255
    call SDL_SetRenderDrawColor
    test eax, eax
    js .failed

    mov rdi, [renderer_handle]
    call SDL_RenderClear
    test eax, eax
    js .failed

    mov rdi, [renderer_handle]
    mov esi, 255
    mov edx, 255
    mov ecx, 255
    mov r8d, 255
    call SDL_SetRenderDrawColor
    test eax, eax
    js .failed

    lea rdi, [center_line]
    call fill_court_rect
    test eax, eax
    js .failed
    lea rdi, [left_paddle]
    call fill_court_rect
    test eax, eax
    js .failed
    lea rdi, [right_paddle]
    call fill_court_rect
    test eax, eax
    js .failed
    lea rdi, [ball_rect]
    call fill_court_rect
    test eax, eax
    js .failed

    mov rdi, [renderer_handle]
    call SDL_RenderPresent
    xor eax, eax
    jmp .done

.failed:
    mov eax, -1
.done:
    leave
    ret

fill_court_rect:
    push rbp
    mov rbp, rsp
    mov rsi, rdi
    mov rdi, [renderer_handle]
    call SDL_RenderFillRect
    leave
    ret

verify_loop_check:
    cmp dword [left_axis], -1
    jne .failed
    cmp dword [right_axis], 1
    jne .failed
    cmp dword [left_paddle + 4], 0
    jne .failed
    cmp dword [right_paddle + 4], WINDOW_H - PADDLE_H
    jne .failed
    cmp dword [frame_started], 1000
    jne .failed
    cmp dword [frame_deadline], 1016
    jne .failed
    cmp dword [controlled_tick_index], 2
    jne .failed
    cmp dword [requested_delay], 10
    jne .failed
    cmp dword [frame_count], 1
    jne .failed
    mov eax, 1
    ret
.failed:
    xor eax, eax
    ret

strings_equal:
.next:
    mov al, [rdi]
    cmp al, [rsi]
    jne .different
    test al, al
    jz .same
    inc rdi
    inc rsi
    jmp .next
.same:
    mov eax, 1
    ret
.different:
    xor eax, eax
    ret

report_sdl_error:
    push rbp
    mov rbp, rsp
    sub rsp, 16
    mov [rbp - 8], rdi
    call SDL_GetError
    mov rcx, rax
    mov rdx, [rbp - 8]
    mov rdi, [stderr]
    lea rsi, [error_format]
    xor eax, eax
    call fprintf
    leave
    ret
'''

[[freestyle.referenceSteps]]
id = "s03-reference-makefile"
path = "Makefile"
mode = "rewrite"
preserves = "all-active"
mechanisms = ["tool-edit-save", "makefile-authorship", "nasm-elf64-dwarf-object-build", "gcc-sdl2-link-and-make-targets", "deterministic-init-check", "gdb-state-inspection", "deterministic-court-check-and-gdb-proof", "responsive-loop-check-gdb-and-live-proof"]
instruction = "Privately replay the learner-authored build, cumulative checks, and debugger recipe. The current check selects the deterministic loop route and earlier checks remain executable."
content = '''
NASM ?= nasm
CC ?= gcc
SDL2_CFLAGS := $(shell pkg-config --cflags sdl2)
SDL2_LIBS := $(shell pkg-config --libs sdl2)

.PHONY: all build run check-s01 check-s02 check-s03 debug debug-replay-s01 debug-replay-s02 debug-replay-s03 clean

all: build

build: pong

build/pong.o: src/pong.asm
	mkdir -p build
	$(NASM) -f elf64 -g -F dwarf -o $@ $<

pong: build/pong.o
	$(CC) -no-pie -o $@ $< $(SDL2_LIBS)

run: pong
	./pong

check-s01: pong
	SDL_VIDEODRIVER=dummy ./pong --arcanum-acceptance > .check-s01.out
	grep -qx 'INIT_OK' .check-s01.out

check-s02: pong
	SDL_VIDEODRIVER=dummy ./pong --arcanum-court-check > .check-s02.out
	grep -qx 'COURT_OK' .check-s02.out

check-s03: pong
	SDL_VIDEODRIVER=dummy ./pong --arcanum-loop-check > .check-s03.out
	grep -qx 'PADDLES_OK' .check-s03.out

debug: pong
	gdb -q ./pong

debug-replay-s01: pong
	SDL_VIDEODRIVER=dummy gdb -q ./pong -ex 'break renderer_released' -ex 'run --arcanum-acceptance' -ex 'x/gx &renderer_handle' -ex 'continue' -ex 'quit'

debug-replay-s02: pong
