scaffold = "guided"
contextFamily = "lift-control-lab"
aidPolicy = "learning"
points = 15
prompt = "I and Down are held; K and Up are released. What do sample_lifts store?"
choices = ["west_axis=1, east_axis=-1", "west_axis=0, east_axis=0", "west_axis=-1, east_axis=1", "west_axis=-1, east_axis=0"]
answer = 2
whyWrong = "Each side subtracts its up byte from its down byte, and the two sides are sampled independently."
hint = "Compute K-I, then compute Down-Up."
explain = "West is 0-1=-1 and east is 1-0=1, proving simultaneous opposite movement survives the snapshot."

