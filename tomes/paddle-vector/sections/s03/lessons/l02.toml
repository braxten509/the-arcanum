[[lessons]]
id = "s03-l02"
title = "Sample Both Paddles"
teaches = ["keyboard-state-sampling"]
introduces = ["sdl-keyboard-snapshot-and-scancode-indexing"]
validationDependencies = []
body = '''
<p>Events answer “what happened?”; continuous controls answer “what is held now?” SDL provides that second view through <code>SDL_GetKeyboardState</code>. It returns a pointer to SDL-owned bytes. Each byte is indexed by an <code>SDL_Scancode</code>: zero means released and one means pressed. SDL keeps the array alive for the application, so store or use the pointer but never free it.</p>
<p>Drain events first. <code>SDL_PollEvent</code> also pumps SDL's input state, so the snapshot then reflects the current frame. A key pressed and released entirely between pumps may not appear in the snapshot; that is acceptable for held movement but explains why edge-triggered actions use event handling later. This disposable lift controller samples four held keys at once:</p>
<pre><code data-kind="runnable">SDL_SCANCODE_I     equ 12
SDL_SCANCODE_K     equ 14
SDL_SCANCODE_UP    equ 82
SDL_SCANCODE_DOWN  equ 81

section .bss
    west_axis: resd 1
    east_axis: resd 1

section .text
extern SDL_GetKeyboardState

sample_lifts:
    push rbp
    mov rbp, rsp
    xor edi, edi
    call SDL_GetKeyboardState
    mov rdx, rax

    movzx eax, byte [rdx + SDL_SCANCODE_K]
    movzx ecx, byte [rdx + SDL_SCANCODE_I]
    sub eax, ecx
    mov [rel west_axis], eax

    movzx eax, byte [rdx + SDL_SCANCODE_DOWN]
    movzx ecx, byte [rdx + SDL_SCANCODE_UP]
    sub eax, ecx
    mov [rel east_axis], eax
    leave
    ret</code></pre>
<p>The null argument in <code>edi</code> says the caller does not need SDL to write the array length. The returned pointer arrives in <code>rax</code> and is copied to <code>rdx</code> for indexing. <code>movzx</code> reads one byte and clears the rest of the 32-bit destination; without that clearing, old upper bits could corrupt the subtraction.</p>
<p>For screen coordinates, down is positive. The west intent is therefore K minus I; the east intent is Down minus Up. One down key produces <code>1</code>, one up key produces <code>-1</code>, neither produces <code>0</code>, and opposing keys on the same side produce <code>1 - 1 = 0</code>. Crucially, the two calculations are independent. Holding I and Down at the same time records <code>-1</code> for west and <code>1</code> for east; an <code>else</code> chain would incorrectly allow only one paddle.</p>
<p>For the actual control scheme, the official SDL2 scancode values are W=26, S=22, Up=82, and Down=81. Scancodes represent physical positions, unlike keycodes that describe layout-dependent symbols. A common bug indexes the byte array with an ASCII value such as <code>'W'</code>. The symptom is a motion key that never changes its sampled byte. Diagnose it in GDB by examining the byte at the official scancode index while holding the key, then correct the constant rather than changing movement code.</p>
'''

[[lessons.concepts]]
id = "keyboard-state-sampling"
purpose = "Turns four simultaneously held controls into two signed per-frame movement intentions."
anatomy = "After event pumping, obtain SDL's state-array pointer, read each control byte independently, and subtract up from down for each paddle."
example = "sample_lifts converts I/K and arrow-key bytes into west_axis and east_axis without making the two sides mutually exclusive."
observable = "Holding one up control stores -1, one down control stores 1, both controls on one side store 0, and controls on opposite sides coexist."
failure = "An else-chain or one shared intent value prevents simultaneous two-player input."
practice = "s03-l02-e1"

[[lessons.concepts]]
id = "sdl-keyboard-snapshot-and-scancode-indexing"
purpose = "Reads SDL's current keyboard snapshot safely by physical-key scancode."
anatomy = "Call SDL_GetKeyboardState after polling, retain its returned pointer, index Uint8 entries with SDL_SCANCODE constants, and zero-extend each byte before arithmetic."
example = "The four movzx operations in sample_lifts read distinct entries from the same SDL-owned array."
observable = "A watched byte changes between 0 and 1 as its physical key is released and held after the next event pump."
failure = "Using ASCII or keycode values as array indexes reads unrelated bytes and makes the intended control appear dead."
practice = "s03-l02-e1"

[[lessons.readings]]
label = "SDL2: SDL_GetKeyboardState"
url = "https://wiki.libsdl.org/SDL2/SDL_GetKeyboardState"

[[lessons.readings]]
label = "SDL2: SDL_Scancode"
url = "https://wiki.libsdl.org/SDL2/SDL_Scancode"

