id = "s01-l03-w1"
type = "text"
required = true
capabilities = ["language-data-layout-and-integer-state"]
mechanisms = []
cognitiveTask = "trace"
scaffold = "independent"
contextFamily = "replace-context"
aidPolicy = "learning"
points = 30
prompt = "A different disposable layout declares, in this order, lives_left dd 5 then lives_bonus dd 2. Broken code runs mov eax, [rel lives_left] then add eax, [rel lives_bonus], then mistakenly stores the sum with mov [rel lives_left], rax instead of mov [rel lives_left], eax. Trace the widths involved and enter the decimal value left in lives_bonus once that mistaken 64-bit store completes."
answer = "0"
hint = "eax already holds the correct sum with zero above it in rax; an 8-byte store at lives_left writes four more bytes past it than a 4-byte store would."
