url = "https://www.nasm.us/doc/nasmdoc3.html"

[[lessons.exercises]]
id = "s01-l03-e1"
type = "mc"
required = true
capabilities = ["language-data-layout-and-integer-state"]
mechanisms = ["nasm-integer-data-and-addressed-state", "nasm-static-cstring-pointer-and-sdl-error-output"]
cognitiveTask = "predict"
scaffold = "guided"
contextFamily = "data-layout"
aidPolicy = "learning"
points = 15
prompt = "You write `count: dd 42` in section .data and then `mov rax, count` in section .text. What ends up in rax after the mov executes?"
choices = ["The memory address of count, not the value 42", "The value 42 in the low 32 bits, zero-extended to 64", "NASM refuses to assemble because rax is 64-bit but dd is 32-bit", "Zero, because .data values cannot be read by mov"]
answer = 0
whyWrong = "Without brackets, the operand count is an immediate value — the address of the label. To read the 4-byte value stored there, you need mov eax, [count] (brackets dereference the pointer). NASM does not reject mov rax with a 32-bit data label because the label's address is a 64-bit value regardless of what size data sits at that address."
hint = "Does the instruction have brackets [] around the label name?"
explain = "In NASM, a bare label name like count means 'the address where count lives'. Square brackets [count] mean 'the contents of memory at the address count'. So mov rax, count loads the 64-bit address number, while mov eax, [count] loads the 32-bit integer that was stored at that address by dd 42."

