aidPolicy = "learning"
points = 20
prompt = "Complete the directive that reserves room for one 8-byte integer variable in the .bss section, initialized to zero when the program loads:"
code = 'big_counter: ____ 1'
answer = "resq"
hint = "The 'q' suffix stands for quadword, which is 8 bytes on x86-64."
explain = "resq reserves one quadword (8 bytes) in .bss. The matching data-definition directive for initialized .data would be dq. The full set: resb (1 byte), resw (2 bytes), resd (4 bytes), resq (8 bytes)."

[[lessons.exercises]]
id = "s01-l03-e3"
type = "text"
required = true
capabilities = ["language-data-layout-and-integer-state"]
mechanisms = ["nasm-static-cstring-pointer-and-sdl-error-output"]
cognitiveTask = "explain"
scaffold = "guided"
contextFamily = "data-layout"
aidPolicy = "learning"
points = 20
prompt = "You declare `err_msg: db 'BAD', 10, 0` in .data. In GDB, you type `x/s &err_msg` and see `BAD\\n` followed by random characters. Then you realize you typed `err_msg: db 'BAD', 10` without the trailing `, 0`. Explain what the `x/s` command is doing and why the missing zero byte matters to string-reading functions."
answer = "The x/s command reads bytes starting at the address and prints them as ASCII characters until it reaches a zero byte. Without the trailing 0, it continues reading past the intended string into whatever bytes happen to follow in .data — constants, padding, or other strings — until it hits the next zero byte, which might be many bytes away. This is a buffer over-read. Functions like SDL_GetError that return C strings work the same way: the zero byte is the contract that says 'stop here.'"
hint = "How does a function like puts or SDL_GetError know where a string ends in memory?"

