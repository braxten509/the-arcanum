[[lessons.exercises]]
id = "s01-l03-w1"
type = "write"
required = true
capabilities = ["language-data-layout-and-integer-state"]
mechanisms = ["nasm-integer-data-and-addressed-state", "nasm-static-cstring-pointer-and-sdl-error-output"]
cognitiveTask = "build"
scaffold = "guided"
contextFamily = "data-layout"
aidPolicy = "learning"
points = 30
prompt = "Write a program called count-three.asm that reserves three 4-byte variables in .bss named a, b, and c, then loads each one into a different register (eax, ebx, ecx), adds the first two into ecx (overwriting the old value of c), adds 1 to that sum, and exits with the final value as the exit code (put it in edi before the sys_exit syscall). Assemble, link, run, and check with echo $? — the exit code should be 1."
hint = "The add instruction works like mov but adds instead of replacing: add ecx, eax does ecx = ecx + eax. To increment by 1, use inc ecx."
expect = '''
1'''
solution = '''
BITS 64
DEFAULT REL

section .bss
    a: resd 1
    b: resd 1
    c: resd 1

section .text
global _start
_start:
    mov     eax, [a]
    mov     ebx, [b]
    mov     ecx, [c]
    add     ecx, eax
    add     ecx, ebx
    inc     ecx
    mov     edi, ecx
    mov     eax, 60
    syscall
'''
