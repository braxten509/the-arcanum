[[lessons]]
id = "s01-l02"
title = "Author the Empty Workspace"
teaches = ["assembly-workspace-authorship", "tool-create-open", "tool-navigate", "tool-edit-save"]
introduces = ["workspace-directory-creation", "tool-edit-save", "nasm-source-layout", "makefile-authorship"]
validationDependencies = []
researchSources = ["nasm-manual", "gnu-make"]
body = '''
<p>Your project lives inside one directory. A directory is a folder on disk that groups related files together so the build tool can find them. Every file you create in this course — assembly source, build rules, and later a README — will sit inside that one workspace.</p>

<p>Create the workspace directory and make it your current location:</p>

<pre><code data-kind="runnable">mkdir -p ~/paddle-vector/src
cd ~/paddle-vector</code></pre>

<p><code>mkdir -p</code> creates a directory tree. The <code>-p</code> flag says "create parent directories too, and don't complain if they already exist." So <code>mkdir -p ~/paddle-vector/src</code> creates <code>paddle-vector</code> with a <code>src</code> folder inside it, both under your home directory (<code>~</code>). <code>cd ~/paddle-vector</code> changes into that top-level workspace. From now on, every relative path like <code>src/pong.asm</code> starts from here.</p>

<p>Now create two empty files — the assembly source and the build rules — using your terminal editor. If you don't have a preference, <code>nano</code> is the simplest:</p>

<pre><code data-kind="runnable">nano src/pong.asm</code></pre>

<p>This opens (or creates, if absent) the file <code>src/pong.asm</code> in a text editor inside your terminal. In nano, type nothing yet — just press <kbd>Ctrl+O</kbd> to "write Out" (save), press <kbd>Enter</kbd> to confirm the filename, then <kbd>Ctrl+X</kbd> to exit. The file now exists but contains zero bytes. Repeat the same for the Makefile:</p>

<pre><code data-kind="runnable">nano Makefile</code></pre>

<p>Save and exit the same way. Verify both files exist with <code>ls</code>:</p>

<pre><code data-kind="runnable">ls -l src/pong.asm Makefile</code></pre>

<p><code>ls -l</code> lists files with sizes. You should see two entries, each showing <code>0</code> in the size column — empty containers waiting for content. If <code>ls</code> says "No such file or directory" for either path, you saved it somewhere else. Reopen the editor and check the path carefully.</p>

<p>The <code>src/</code> subdirectory is a convention, not a rule. Placing <code>.asm</code> files inside <code>src/</code> keeps the top level clean, with only the Makefile and later the README visible at a glance. The build rules inside the Makefile will refer to <code>src/pong.asm</code> as their input.</p>

<div class="field-notes"><div class="fn-head">FIELD NOTES // EDITOR CHOICE</div>
<p>Use any editor that saves plain text: nano, vim, emacs, VS Code, or gedit. The only requirement is that <em>the file on disk contains exactly the characters you typed</em>, with no hidden formatting codes. Word processors like LibreOffice Writer embed document metadata that the assembler cannot read. If you're unsure, run <code>file src/pong.asm</code> after saving — it should report "ASCII text" or "empty", not "Microsoft Word" or "Rich Text Format."</p></div>
'''

[[lessons.concepts]]
id = "assembly-workspace-authorship"
purpose = "Create a project directory tree with mkdir -p and place two empty files (src/pong.asm and Makefile) in their canonical locations so later lessons can fill them with assembly source and build rules."
anatomy = "Step 1: mkdir -p ~/paddle-vector/src creates the directory tree. Step 2: cd ~/paddle-vector enters the workspace. Step 3: Use a text editor to create and save src/pong.asm. Step 4: Repeat for Makefile. Step 5: ls confirms both exist."
example = "The body's sequence from mkdir through ls -l."
observable = "ls -l src/pong.asm Makefile shows two files of size 0, in the expected paths."
failure = "A typo in the directory name creates the file outside the intended tree. Running cd before mkdir means the workspace might land somewhere unexpected."
practice = "s01-l02-e1"

[[lessons.concepts]]
id = "tool-create-open"
purpose = "Use a terminal text editor (nano, vim, or equivalent) to create or open a named file for editing, then save and exit so the file persists on disk after the editor closes."
anatomy = "The command nano filename opens the file in the terminal. Ctrl+O writes the buffer to disk; Enter confirms the name; Ctrl+X exits. In vim: i enters insert mode, Esc returns to command mode, :w saves, :q quits."
example = "The body's nano src/pong.asm and nano Makefile steps."
observable = "After saving and exiting, ls shows the file exists with the expected byte count."
failure = "Forgetting to write (save) before exiting discards all edits. Saving to a different filename by fat-fingering the confirmation prompt places the file in the wrong location."
practice = "s01-l02-e1"

[[lessons.concepts]]
id = "tool-navigate"
purpose = "Use cd to change the current working directory, pwd to confirm the location, and ls to list files so every subsequent command operates in the right directory."
anatomy = "cd path changes into path. cd .. goes up one level. pwd prints the absolute current path. ls lists directory contents; ls -l adds sizes and permissions."
example = "The body's cd ~/paddle-vector step followed by ls -l."
observable = "pwd prints /home/username/paddle-vector; ls shows the expected files."
failure = "Running a command from the wrong directory produces 'No such file or directory' for paths that would be valid from the workspace root. Use pwd before any important command."
practice = "s01-l02-e1"

[[lessons.concepts]]
id = "tool-edit-save"
purpose = "Type content into a terminal editor's buffer, then use the editor's write-and-quit commands to persist that content to the named file on disk so the assembler and Make can read it later."
anatomy = "Open file → type or edit → write buffer to disk → confirm path → quit editor. The write step is the critical boundary between temporary in-memory text and permanent on-disk bytes."
example = "The body's nano save-and-exit sequence."
observable = "After exit, cat filename prints the exact content that was typed. File size matches the character count."
failure = "Closing the terminal (or using Ctrl+C on the editor process) without saving first discards the buffer. No file on disk means the build will fail with 'no input files.'"
practice = "s01-l02-e1"

[[lessons.concepts]]
id = "workspace-directory-creation"
purpose = "Create a project directory tree with mkdir -p that provides canonical homes for source code (src/), build rules (Makefile), and later documentation (README.md)."
anatomy = "mkdir -p ~/paddle-vector/src: the -p flag creates intermediate directories and suppresses errors if they already exist. The ~ expands to the user's home directory."
example = "The body's mkdir command."
observable = "ls ~/paddle-vector/src shows the directory exists and is initially empty."
failure = "Omitting -p when the parent directory is missing produces 'mkdir: cannot create directory: No such file or directory.'"
practice = "s01-l02-e1"

[[lessons.concepts]]
id = "nasm-source-layout"
purpose = "Recognize that a .asm file is a plain-text file containing sections, labels, instructions, and directives that the NASM assembler reads line by line to produce an object file."
anatomy = "Every .asm file declares sections (.text for code, .data for read-write data, .bss for uninitialized data), labels (identifiers ending with :), and instructions (mnemonic + operands). Lines may contain comments starting with ;."
example = "Not yet — the Assembly Source Layout is the empty file shape taught here. The next lesson fills it with real sections and data."
observable = "The file src/pong.asm exists as a zero-byte container. Later lessons will extend it with instructions."
failure = "Creating the file with a .txt extension or saving as Rich Text Format produces a file NASM cannot parse."
practice = "s01-l02-e1"

[[lessons.concepts]]
id = "makefile-authorship"
purpose = "Recognize that a Makefile is a plain-text file containing rules of the form target: prerequisites [TAB]recipe that GNU Make reads to decide which commands to run when building the project."
anatomy = "Each rule has a target name followed by a colon, optional space-separated prerequisite files, a newline, a TAB character, and one or more shell command lines. .PHONY marks non-file targets like clean. Automatic variables like $@ (target) and $< (first prerequisite) reduce duplication."
example = "Not yet — the Makefile Basics taught here are the shape of an empty Makefile container. Lesson l06 fills it with real build rules."
observable = "The file Makefile exists as a zero-byte container at the workspace root."
failure = "Using spaces instead of a TAB character in the recipe line produces 'Makefile:N: *** missing separator. Stop.' on GNU Make 4.x."
practice = "s01-l02-e1"

[[lessons.readings]]
label = "NASM Manual: Section Structure"
url = "https://www.nasm.us/doc/nasmdoc7.html"

[[lessons.exercises]]
id = "s01-l02-e1"
type = "mc"
required = true
capabilities = ["assembly-workspace-authorship", "tool-create-open", "tool-navigate", "tool-edit-save"]
mechanisms = ["workspace-directory-creation", "tool-edit-save", "nasm-source-layout", "makefile-authorship"]
cognitiveTask = "predict"
scaffold = "guided"
contextFamily = "workspace-setup"
aidPolicy = "learning"
points = 15
prompt = "You run `mkdir -p ~/paddle-vector/src` but then run `nano pong.asm` from your home directory. Where does the file land?"
choices = ["In ~/pong.asm, not inside the paddle-vector directory", "Inside ~/paddle-vector/src/pong.asm because mkdir creates a link", "The editor refuses because the path doesn't match mkdir", "It ends up in /tmp"]
answer = 0
whyWrong = "mkdir does not change your current directory or create any links. nano saves the file in the current working directory — which is still your home directory if you never ran cd. The directory you created with mkdir is just a location on disk; it doesn't attract new files."
hint = "What is nano's default behavior when you give it a short filename without a path?"
explain = "Every program runs in a current working directory. nano pong.asm saves in whatever directory pwd reports at that moment. The mkdir command created a directory, but creating a directory does not enter it. You need cd ~/paddle-vector first."

[[lessons.exercises]]
id = "s01-l02-e2"
type = "fill"
required = true
capabilities = ["tool-navigate", "tool-edit-save"]
mechanisms = ["workspace-directory-creation"]
cognitiveTask = "complete"
scaffold = "completion"
contextFamily = "workspace-setup"
aidPolicy = "learning"
points = 20
prompt = "Complete the command that creates a directory tree to src/ inside a new project folder under your home directory, without complaining if any piece already exists:"
code = 'mkdir ____ ~/racket-sim/src'
answer = "-p"
hint = "This flag also creates parent directories that don't yet exist."
explain = "The -p flag tells mkdir to create intermediate directories (like racket-sim/) and suppress 'already exists' errors. Without it, creating a nested path like ~/racket-sim/src would fail if ~/racket-sim did not already exist."

[[lessons.exercises]]
id = "s01-l02-e3"
type = "text"
required = true
capabilities = ["tool-create-open", "tool-edit-save"]
mechanisms = ["tool-edit-save"]
cognitiveTask = "explain"
scaffold = "guided"
contextFamily = "workspace-setup"
aidPolicy = "learning"
points = 20
prompt = "You are helping a partner who used nano to write assembly instructions into src/pong.asm, then pressed Ctrl+X. The terminal closed and ls shows the file is still zero bytes. Explain what happened and the exact keys they need to press next time, in order."
answer = "They skipped the Ctrl+O (write) step. Ctrl+X exits nano, but if the buffer was never written to disk, nano may ask 'Save modified buffer?' — and answering 'N' or pressing Ctrl+C discards all typed content. The correct sequence is: Ctrl+O (WriteOut), Enter (confirm filename), Ctrl+X (exit)."
hint = "Nano has a two-step exit: the write step and the quit step. What happens when you skip the first one?"

[[lessons.exercises]]
id = "s01-l02-w1"
type = "write"
required = true
capabilities = ["assembly-workspace-authorship", "tool-create-open", "tool-navigate", "tool-edit-save"]
mechanisms = ["workspace-directory-creation", "tool-edit-save", "nasm-source-layout", "makefile-authorship"]
cognitiveTask = "build"
scaffold = "guided"
contextFamily = "workspace-setup"
aidPolicy = "learning"
points = 30
prompt = "Create a workspace directory called ~/asm-playground. Inside it, create two empty files: src/hello.asm and Makefile. Prove your setup by running `find ~/asm-playground -type f` which should print both paths."
hint = "You need mkdir -p for the nested path, cd to enter the directory, and an editor to create each file."
expect = '''
/home/username/asm-playground/Makefile
/home/username/asm-playground/src/hello.asm'''
solution = '''
mkdir -p ~/asm-playground/src
cd ~/asm-playground
touch src/hello.asm Makefile
find ~/asm-playground -type f
'''
