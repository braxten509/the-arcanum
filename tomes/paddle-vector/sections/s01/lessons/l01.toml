[[lessons]]
id = "s01-l01"
title = "Provision the Assembly Bench"
teaches = ["external-toolchain-ready", "tool-install", "tool-diagnose"]
introduces = ["debian-toolchain-install", "toolchain-version-diagnostics"]
validationDependencies = []
researchSources = ["debian-packages"]
body = '''
<p>Before you can write a single line of assembly, your machine needs five tools installed and ready. Think of this as unpacking the workbench: every tool has a name, a job, and a way to prove it works.</p>

<p>The tools are:</p>

<ul>
<li><strong>NASM</strong> — the Netwide Assembler. It reads your <code>.asm</code> source files and produces <code>.o</code> object files that the CPU can almost understand.</li>
<li><strong>GCC</strong> — the GNU Compiler Collection. We use it as a linker driver, not as a C compiler. It connects your object files with the C library and SDL2, then produces a finished executable.</li>
<li><strong>Make</strong> — a build runner. It remembers the sequence of commands that turns your source into a runnable program so you don't have to retype them every time.</li>
<li><strong>GDB</strong> — the GNU Debugger. It lets you freeze your program at any instruction, peek inside every register, and step forward one machine operation at a time.</li>
<li><strong>pkg-config</strong> — a helper that prints the flags the linker needs to find SDL2. Without it, linking would be a guessing game.</li>
<li><strong>SDL2 development library</strong> — the code that draws windows and reads keyboard input. Your program will call it hundreds of times, but first your system needs a copy on disk.</li>
</ul>

<p>On Debian or Ubuntu, one command installs all of them. Open a terminal and run:</p>

<pre><code data-kind="runnable">sudo apt update
sudo apt install -y nasm build-essential pkg-config gdb libsdl2-dev</code></pre>

<p>The <code>sudo</code> prefix asks for your password because system-wide package installation needs administrator permission. <code>apt update</code> refreshes the catalog of available software. <code>apt install -y</code> downloads and unpacks each named package; the <code>-y</code> says "yes" automatically to the confirmation prompt.</p>

<p>After the install finishes, prove that each tool answers:</p>

<pre><code data-kind="runnable">nasm -v
gcc --version | head -1
make --version | head -1
pkg-config --modversion sdl2
gdb --version | head -1</code></pre>

<p><code>nasm -v</code> prints the NASM version number — something like <code>NASM version 2.16.01</code>. <code>gcc --version | head -1</code> pipes the full GCC version output through <code>head -1</code>, showing only the first line. <code>pkg-config --modversion sdl2</code> prints the SDL2 library version (e.g. <code>2.30.0</code>). If any command says "command not found", the install didn't complete; run the install line again and watch for error messages printed in red or with "E:" prefixes. A common fix is a missing <code>sudo apt update</code> before the install step.</p>

<div class="field-notes"><div class="fn-head">FIELD NOTES // TOOLCHAIN VERSION VARIANCE</div>
<p>Your exact version numbers will differ from the ones shown here. NASM 2.15 or later, GCC 9 or later, and SDL2 2.0.0 or later are compatible with every example in this course. Older versions may differ in small details; newer versions are fine. The version-check commands you just ran are your contract with the toolchain: you now know what is installed, and you can check again anytime a mysterious failure appears.</p></div>
'''

[[lessons.concepts]]
id = "external-toolchain-ready"
purpose = "State that five external tools — NASM, GCC, Make, GDB, and the SDL2 library — are installed on the learner's Debian/Ubuntu machine and each responds with an observable version string."
anatomy = "One install command (sudo apt install -y nasm build-essential pkg-config gdb libsdl2-dev) plus five version-check commands. Each check produces a version number on stdout; absence produces 'command not found'."
example = "The worked example in the body: the complete install-and-verify sequence showing realistic version output."
observable = "Five distinct version strings printed to the terminal, one per tool, with no error messages."
failure = "A command prints 'command not found' or an apt error line begins with 'E:'. The install step was incomplete, or the package name was mistyped."
practice = "s01-l01-e1"

[[lessons.concepts]]
id = "tool-install"
purpose = "Execute sudo apt update; sudo apt install -y nasm build-essential pkg-config gdb libsdl2-dev to place the five required tools on the system."
anatomy = "sudo raises privileges. apt update refreshes the package index. apt install -y downloads and unpacks each named .deb package. The -y flag auto-confirms the install prompt."
example = "The body's install block, executed in a terminal."
observable = "Progress bars for each package download, followed by a return to the shell prompt with exit code 0."
failure = "Network failure prevents apt update from reaching the repository, or a held/locked package blocks installation."
practice = "s01-l01-e1"

[[lessons.concepts]]
id = "tool-diagnose"
purpose = "Run version-check commands after installation to confirm every tool reports a version and exits 0, distinguishing a working toolchain from a partially installed one."
anatomy = "Five commands separated by line breaks. Each command's stdout contains a version number; stderr is empty. The | head -1 pipe truncates long output to one line."
example = "The body's version-check block, showing how gcc --version produces many lines but | head -1 keeps only the first."
observable = "Five version strings printed, no errors, each command exits 0."
failure = "A 'command not found' means that tool's package was not installed. A stale cache can cause pkg-config to report an older SDL2 version than was actually installed."
practice = "s01-l01-e1"

[[lessons.concepts]]
id = "debian-toolchain-install"
purpose = "Describe and execute the single apt command that installs the complete assembly-and-SDL2 development toolchain on Debian-family Linux."
anatomy = "The command sudo apt install -y nasm build-essential pkg-config gdb libsdl2-dev names each Debian package by its exact repository identifier. build-essential is a meta-package that pulls in gcc, make, and related build tools."
example = "The body's install block."
observable = "Each named package downloads, unpacks, and configures without prompting for interaction or producing error exit codes."
failure = "A missing universe/multiverse repository, an expired apt cache, or a conflicting held package."
practice = "s01-l01-e1"

[[lessons.concepts]]
id = "toolchain-version-diagnostics"
purpose = "Run nasm -v, gcc --version, make --version, pkg-config --modversion sdl2, and gdb --version. Each reports a version string confirming the tool exists and the library resolver can find the SDK header and library files."
anatomy = "Five independent shell commands. Each tool's version flag is different: nasm uses -v; gcc, make, and gdb use --version; pkg-config uses --modversion sdl2."
example = "The body's version-check block."
observable = "Five distinct version strings with no error output."
failure = "pkg-config --modversion sdl2 fails with 'No package sdl2 found' when the SDL2 development headers are missing from the pkg-config search path, even if the .so library exists."
practice = "s01-l01-e1"

[[lessons.readings]]
label = "SDL2 Linux Installation Guide"
url = "https://wiki.libsdl.org/SDL2/Installation"

[[lessons.exercises]]
id = "s01-l01-e1"
type = "mc"
required = true
capabilities = ["external-toolchain-ready", "tool-install", "tool-diagnose"]
mechanisms = ["debian-toolchain-install", "toolchain-version-diagnostics"]
cognitiveTask = "predict"
scaffold = "guided"
contextFamily = "toolchain-startup"
aidPolicy = "learning"
points = 15
prompt = "You run `sudo apt install -y nasm build-essential pkg-config gdb libsdl2-dev` on a fresh Debian machine. It succeeds without errors. Then you type `nasm -v`. What happens?"
choices = ["NASM prints its version number and exits 0", "NASM opens an interactive assembler prompt", "The terminal prints 'command not found' because nasm needs a reboot first", "NASM assembles the file named 'v'"]
answer = 0
whyWrong = "Reboots are not required after apt installs. NASM's -v flag requests a version print, not a filename assembly, and an interactive assembler prompt does not exist."
hint = "What does the -v flag ask a program to do on the command line?"
explain = "After a successful apt install, the executable is on the system PATH. Running nasm -v asks NASM to print its version number (the -v flag is short for 'version') and exit immediately — it does not try to assemble a file named 'v'."

[[lessons.exercises]]
id = "s01-l01-e2"
type = "text"
required = true
capabilities = ["tool-install", "tool-diagnose"]
mechanisms = ["toolchain-version-diagnostics"]
cognitiveTask = "explain"
scaffold = "guided"
contextFamily = "toolchain-startup"
aidPolicy = "learning"
points = 20
prompt = "Your classmate runs `pkg-config --modversion sdl2` and sees: `Package sdl2 was not found in the pkg-config search path.` They say 'I must have the wrong SDL2 version.' What is more likely, and what single command would fix it?"
answer = "The libsdl2-dev package was not installed, or the pkg-config database has a stale cache. The fix is `sudo apt install -y libsdl2-dev` followed by re-running the version check. The error means the development headers and .pc metadata file are missing, not that the wrong version is present."
hint = "Look at the error message carefully — it says 'not found', not 'wrong version'."

[[lessons.exercises]]
id = "s01-l01-e3"
type = "fill"
required = true
capabilities = ["tool-diagnose"]
mechanisms = ["toolchain-version-diagnostics"]
cognitiveTask = "complete"
scaffold = "completion"
contextFamily = "toolchain-startup"
aidPolicy = "learning"
points = 20
prompt = "Complete the command that prints only the first line of the GCC version output:"
code = 'gcc --version | ____'
answer = "head -1"
hint = "The pipe symbol | sends stdout of the left command into stdin of the right command. Which utility returns only the first N lines?"
explain = "The head command displays the first lines of its input. head -1 limits the output to one line. The | (pipe) connects gcc's stdout to head's stdin."

[[lessons.exercises]]
id = "s01-l01-w1"
type = "write"
required = true
capabilities = ["external-toolchain-ready", "tool-install", "tool-diagnose"]
mechanisms = ["debian-toolchain-install", "toolchain-version-diagnostics"]
cognitiveTask = "build"
scaffold = "guided"
contextFamily = "toolchain-startup"
aidPolicy = "learning"
points = 30
prompt = "Write a short shell script in a file called check-tools.sh that runs all five version-check commands and prints a final line 'ALL FIVE TOOLS READY' if they all succeed. Run it. If any command fails, your script should exit early and print 'MISSING:' followed by the tool name."
hint = "Use the && operator between commands to chain them, or check each command's exit code with $?."
expect = '''
NASM version 2.XX.XX
gcc (Debian XX) XX.X.X
GNU Make X.X
2.XX.X
GNU gdb (Debian XX) XX.X
ALL FIVE TOOLS READY'''
solution = '''
#!/bin/sh
set -e
echo "CHECKING TOOLCHAIN"
nasm -v
gcc --version | head -1
make --version | head -1
pkg-config --modversion sdl2
gdb --version | head -1
echo "ALL FIVE TOOLS READY"
'''
