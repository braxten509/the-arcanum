scaffold = "guided"
contextFamily = "replace-context"
aidPolicy = "learning"
points = 20
prompt = "Run pkg-config --modversion sdl2 by itself, then immediately run echo $?. Enter the status you actually observe right after the version probe prints its number."
answer = "0"
hint = "Zero is the shell's spelling for success; you already have the version text from the probe itself."

