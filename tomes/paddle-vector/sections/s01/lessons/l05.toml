[[lessons]]
id = "s01-l05"
title = "Call Across the System V ABI"
teaches = ["language-abi-procedures-and-register-discipline"]
introduces = ["sysv-abi-procedure-discipline"]
validationDependencies = []
researchSources = ["sysv-abi", "nasm-manual"]
body = '''
<p>Your program doesn't live alone. It calls into external libraries — SDL2, the C runtime — whose functions were compiled from C. For that call to work, both sides must agree on exactly where arguments go, which registers the called function may destroy, and what shape the stack must be in. That agreement is the System V AMD64 ABI, the Application Binary Interface for 64-bit Linux.</p>

<p>Here is the contract in seven rules:</p>

<ol>
<li><strong>Arguments in registers, left to right:</strong> RDI, RSI, RDX, RCX, R8, R9. The first integer or pointer argument goes in <code>rdi</code>, the second in <code>rsi</code>, and so on. If you have more than six arguments, the seventh and beyond go on the stack. Every SDL2 function we call takes four or fewer arguments, so we never touch the stack for argument passing.</li>
<li><strong>Return value in RAX:</strong> After a C function returns, <code>rax</code> holds the integer or pointer result (or the low 32 bits of it in <code>eax</code>). SDL_Init returns 0 on success or a negative number on failure — you'll find that answer in <code>eax</code>.</li>
<li><strong>Stack must be 16-byte aligned before CALL:</strong> At the instant <code>call</code> executes, <code>rsp</code> must be a multiple of 16. The <code>call</code> instruction itself pushes an 8-byte return address, so on function entry <code>rsp + 8</code> is a multiple of 16. If <code>rsp</code> was 16-byte aligned before <code>call</code>, this is automatically true.</li>
<li><strong>Callee-saved registers:</strong> RBX, RBP, R12–R15. A called function must preserve these across the call — their values before and after are the same. Use them for values you want to survive across a <code>call</code>.</li>
<li><strong>Call-clobbered registers:</strong> RAX, RCX, RDX, RSI, RDI, R8–R11. A called function may overwrite these freely. After a <code>call</code>, assume every one of them contains garbage unless the ABI says otherwise (rax for return value). Save anything important before the call.</li>
<li><strong>Variadic functions need AL:</strong> Before calling a function that takes a variable number of arguments (like <code>printf</code>), set <code>al</code> to the number of floating-point XMM registers used for passing floating-point arguments. For calls where you pass zero floating-point arguments, <code>xor eax, eax</code> (which zeros all 64 bits of rax) is correct and safe even for non-variadic functions.</li>
<li><strong>extern and global:</strong> To call a function defined outside your file, declare <code>extern function_name</code> at the top of your <code>.asm</code> file. The linker will wire your call to the real implementation. For position-independent executables, use <code>call function_name wrt ..plt</code> to route through the Procedure Linkage Table.</li>
</ol>

<p>Write <code>call-demo.asm</code> to call the C library's <code>strlen</code> function from assembly:</p>

<pre><code data-kind="runnable">; call-demo.asm — call C strlen from NASM
BITS 64
DEFAULT REL

extern strlen

section .data
    my_string: db "ARCANUM", 0

section .text
global _start
_start:
    lea     rdi, [my_string]
    call    strlen wrt ..plt

    ; strlen returned the length in rax
    ; exit with that length as the exit code
    mov     edi, eax
    mov     eax, 60
    syscall</code></pre>

<p>Step through:</p>

<ul>
<li><code>extern strlen</code> tells NASM "strlen's real definition lives in another object file — the linker will find it." Without this line, NASM would error on <code>call strlen</code> with "symbol `strlen' undefined."</li>
<li><code>lea rdi, [my_string]</code> loads the <em>address</em> of the first byte of <code>my_string</code> into <code>rdi</code>. <code>lea</code> (load effective address) computes an address expression and stores the address itself — without dereferencing memory. <code>[my_string]</code> here is the effective address, and <code>DEFAULT REL</code> makes it RIP-relative.</li>
<li><code>call strlen wrt ..plt</code> pushes the return address onto the stack and jumps to strlen's PLT entry. The <code>wrt ..plt</code> suffix tells the linker to build a PLT stub — required for PIE (position-independent executables), the default on modern Linux. Without it, you may get a "relocation R_X86_64_PC32 against symbol strlen can not be used when making a shared object" error at link time.</li>
<li>After strlen returns, <code>rax</code> (specifically <code>eax</code>) holds 7 (the length of "ARCANUM"). We copy it to <code>edi</code> and call exit.</li>
</ul>

<p>Link with <code>gcc</code>, not <code>ld</code>, because we need the C library:</p>

<pre><code data-kind="runnable">nasm -f elf64 call-demo.asm -o call-demo.o
gcc -no-pie call-demo.o -o call-demo
./call-demo
echo $?</code></pre>

<p>The exit code is 7. If you omit <code>-no-pie</code>, GCC may produce a PIE executable, which is fine — but on some distributions the default <code>_start</code> entrypoint with C library calls may need it. The <code>.plt</code> suffix in <code>wrt ..plt</code> handles PIE correctly regardless.</p>

<p>Now what about <strong>preserving</strong> a register across a call? Suppose you have a value in <code>rbx</code> and want it to survive <code>call strlen</code>. You push it before the call and pop it after:</p>

<pre><code data-kind="runnable">mov     rbx, 99        ; value we want to keep
push    rbx             ; save on stack
call    strlen wrt ..plt
pop     rbx             ; restore — rbx is 99 again</code></pre>

<p><code>push</code> decrements <code>rsp</code> by 8 and writes the register's value to the new stack top. <code>pop</code> reads 8 bytes from the stack top into the register and increments <code>rsp</code> by 8. Together they save and restore. But note: <strong>every push changes the stack alignment</strong> by 8 bytes. If you push an odd number of quadwords before a call, the stack is no longer 16-byte aligned and the called function may crash in SSE instructions. Push and pop in pairs, or adjust <code>rsp</code> directly with <code>sub rsp, 8</code> before the call and <code>add rsp, 8</code> after — that keeps alignment even with an odd count.</p>

<div class="field-notes"><div class="fn-head">FIELD NOTES // ALIGNMENT AND THE MYSTERY CRASH</div>
<p>The most common ABI bug in assembly is a misaligned stack. The symptom: a program that works perfectly in GDB or on small inputs, then crashes with SIGSEGV inside a library function on a <code>movaps</code> instruction — because <code>movaps</code> requires 16-byte memory alignment. The fix: count your pushes. If you push three registers (24 bytes off rsp), the stack is no longer 16-byte aligned. Either push a fourth dummy register or use <code>sub rsp, 8</code> to overshoot by a multiple of 16 and <code>add rsp, 8</code> to undo it. In the SDL2 chapters, we'll maintain alignment by saving exactly the callee-saved registers we use and balancing every push with a pop — or by entering with <code>sub rsp, 8</code> (since <code>call</code> pushed 8 bytes, another 8 makes 16-byte alignment) and never using push/pop at all.</p></div>
'''

[[lessons.concepts]]
id = "language-abi-procedures-and-register-discipline"
purpose = "Call external C library functions from NASM by declaring extern, placing arguments in RDI/RSI/RDX/RCX/R8/R9, preserving callee-saved registers (RBX, RBP, R12-R15) with push/pop or stack-frame discipline, reading the return value from RAX, and maintaining 16-byte stack alignment before every call instruction."
anatomy = "extern <name> declares an external symbol. call <name> wrt ..plt invokes it through the PLT for PIE compatibility. lea rdi, [label] loads an address into the first argument register. After the call returns, rax holds the result. push/pop save and restore callee-saved registers; sub rsp, N / add rsp, N manage stack space while preserving alignment."
example = "The call-demo.asm program calling strlen with a string address in rdi, receiving 7 in rax, and using the result as exit code. The push/pop save-restore example for rbx."
observable = "The program links with gcc, runs, and echo $? prints 7 (the length of 'ARCANUM'). Under GDB, stepi through the call instruction shows rax = 7 after the call returns; rsp changes by 8 (the pushed return address) during the call."
failure = "Forgetting extern causes 'symbol undefined' at assembly time. Forgetting wrt ..plt may cause a relocation error at link time for PIE binaries. Calling with the stack not 16-byte aligned causes a SIGSEGV inside glibc on movaps. Using ld instead of gcc to link produces 'undefined reference to strlen' because ld does not auto-link libc."
practice = "s01-l05-e1"

[[lessons.concepts]]
id = "sysv-abi-procedure-discipline"
purpose = "Apply the complete System V AMD64 calling convention — argument placement, return-value retrieval, register preservation versus clobbering, stack alignment, and PLT routing — to every call into SDL2 and the C library throughout the project."
anatomy = "Six integer arg registers: rdi, rsi, rdx, rcx, r8, r9. Return in rax. Callee-saved: rbx, rbp, r12-r15 (preserve these). Call-clobbered: rax, rcx, rdx, rsi, rdi, r8-r11 (assume destroyed after call). Stack 16-byte aligned before call. AL = 0 for non-variadic calls. extern + wrt ..plt for PIE-safe calls."
example = "The call-demo.asm program using rdi for the string pointer, wrt ..plt for PIE linking, and retrieving rax after the call. The push/pop save-restore example."
observable = "A function called with correct arguments returns the expected value in rax and does not corrupt any preserved register. Under GDB, every callee-saved register holds the same value before and after the call."
failure = "Passing arguments in the wrong register order — e.g. rdi and rsi swapped — produces wrong results if the first and second arguments have different types/sizes. Clobbering rbx without saving/restoring it causes the caller to see a corrupted value after the call returns."
practice = "s01-l05-e1"

