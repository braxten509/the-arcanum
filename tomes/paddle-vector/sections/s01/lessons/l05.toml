id = "s01-l05-w1"
type = "mc"
required = true
capabilities = ["language-abi-procedures-and-register-discipline"]
mechanisms = []
cognitiveTask = "predict"
scaffold = "independent"
contextFamily = "replace-context"
aidPolicy = "learning"
points = 30
prompt = "A procedure saves the frame pointer and RBX, but restores only RBX before ret. Which saved register value still occupies the stack?"
choices = ["RSP", "RBP", "RAX", "RDI"]
answer = 1
whyWrong = "The omitted restoration corresponds to the saved frame pointer; the other listed registers were not the unmatched push."
hint = "Match each save to its restoration in reverse order."
explain = "RBP was pushed first and remains on top of the return address after only RBX is popped."
