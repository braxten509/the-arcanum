contextFamily = "abi-calling"
aidPolicy = "learning"
points = 15
prompt = "You call a C function with three integer arguments: 10, 20, and 30. Which registers must hold those values before the call?"
choices = ["rdi=10, rsi=20, rdx=30", "rax=10, rbx=20, rcx=30", "r10=10, r11=20, r12=30", "rdi=10, rdi=20, rdi=30 — they stack in order"]
answer = 0
whyWrong = "The System V AMD64 ABI specifies the first integer argument goes in rdi, second in rsi, third in rdx. rax is the return-value register, not an argument register. r10-r11 are call-clobbered scratch registers, not used for argument passing. Arguments are not all placed in the same register sequentially — each argument gets its own register."
hint = "Review the six argument registers in left-to-right order."
explain = "The first six integer or pointer arguments go in RDI, RSI, RDX, RCX, R8, R9 — in that exact order, one register per argument. Any additional arguments go on the stack, pushed right-to-left. The return value comes back in RAX."

