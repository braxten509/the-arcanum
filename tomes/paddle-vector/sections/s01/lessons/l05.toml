prompt = "Complete the directive that tells NASM a function named `SDL_Init` will be provided by another object file at link time:"
code = '____ SDL_Init'
answer = "extern"
hint = "This keyword declares a symbol defined elsewhere."
explain = "The extern directive tells NASM 'do not look for this label inside the current file — the linker will supply its address from another object file or shared library.' Without extern, NASM would report 'symbol SDL_Init undefined' because the label doesn't appear anywhere in the .asm source."

[[lessons.exercises]]
id = "s01-l05-e3"
type = "text"
required = true
capabilities = ["language-abi-procedures-and-register-discipline"]
mechanisms = ["sysv-abi-procedure-discipline"]
cognitiveTask = "explain"
scaffold = "guided"
contextFamily = "abi-calling"
aidPolicy = "learning"
points = 20
prompt = "Your partner assembles a program with `call strlen` (no wrt ..plt). NASM assembles it, but gcc fails at link time with: 'relocation R_X86_64_PC32 against symbol strlen@@GLIBC_2.2.5 can not be used when making a PIE object.' They try ld instead of gcc and get 'undefined reference to strlen.' Explain both errors."
answer = "The first error: modern gcc defaults to building position-independent executables (PIE). Without wrt ..plt, NASM generates a direct PC-relative relocation to strlen, which is not allowed in PIE because strlen's address is not fixed at link time — it comes from a shared library loaded at runtime. The wrt ..plt suffix tells NASM to route through the Procedure Linkage Table, which the dynamic linker can fix up at load time. The second error: ld does not auto-link the C standard library; gcc adds -lc and the C runtime startup files automatically. To use ld, you would need explicit -lc and the crt1.o startup object."
hint = "What does ..plt stand for, and what library does gcc add that ld does not?"

