[[lessons.exercises]]
id = "s01-l05-w1"
type = "write"
required = true
capabilities = ["language-abi-procedures-and-register-discipline"]
mechanisms = ["sysv-abi-procedure-discipline"]
cognitiveTask = "build"
scaffold = "guided"
contextFamily = "abi-calling"
aidPolicy = "learning"
points = 30
prompt = "Write a program called sum-two.asm that declares two dq constants in .data (values 100 and 200), defines an assembly function named add_two that takes two integer arguments (in rdi and rsi), adds them, and returns the sum in rax, then calls add_two from _start with the two constants as arguments and exits with the sum modulo 256 (mask the low 8 bits of the result into edi before exit). Assemble with nasm -f elf64, link with ld (no C library needed since add_two is in the same file), and verify with echo $?."
hint = "add rax, rdi puts the first argument into rax, then add rax, rsi adds the second argument. To get the low 8 bits, use movzx edi, al (since al is the low 8 bits of rax)."
expect = '''
44'''
solution = '''
BITS 64
DEFAULT REL

section .data
    x: dq 100
    y: dq 200

section .text
global _start

add_two:
    mov     rax, rdi
    add     rax, rsi
    ret

_start:
    mov     rdi, [x]
    mov     rsi, [y]
    call    add_two
    movzx   edi, al
    mov     eax, 60
    syscall
'''
