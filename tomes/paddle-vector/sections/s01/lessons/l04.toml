[[lessons.exercises]]
id = "s01-l04-e1"
type = "mc"
required = true
capabilities = ["language-branch-loop-control"]
mechanisms = ["nasm-compare-branch-loop-control"]
cognitiveTask = "predict"
scaffold = "guided"
contextFamily = "branch-control"
aidPolicy = "learning"
points = 15
prompt = "What happens when `cmp eax, ebx` is immediately followed by `je .equal` — but there is no other jump and the `.equal` label is 10 lines further down?"
choices = ["If eax equals ebx, execution jumps to .equal; otherwise execution continues through the intervening 10 lines and then reaches .equal anyway", "If eax does not equal ebx, the program crashes because no matching branch was found", "NASM refuses to assemble because a cmp must always have an else-path", "The cmp instruction itself performs the jump"]
answer = 0
whyWrong = "cmp does not branch — it only sets flags. The conditional jump that follows it may or may not take the branch. If the branch is not taken, execution falls through to the next instruction in sequence, which may be the 'else' path or, if there is no jmp after the else path, may accidentally slide into the .equal label. Labels are not barriers; they are just named addresses. Execution passes through them unless a jump directs it elsewhere."
hint = "Think about what happens when the condition is false — where does the instruction pointer go?"
explain = "Labels are just name tags on addresses. They don't block execution or create scope boundaries. After je .equal does not jump, the CPU simply executes the next instruction in memory, then the next, and eventually reaches the .equal label — executing code that was meant only for the 'equal' case. That's why an if-else almost always needs an unconditional jmp after the 'else' path to skip over the 'if' path."

[[lessons.exercises]]
id = "s01-l04-e2"
type = "fill"
required = true
capabilities = ["language-branch-loop-control"]
mechanisms = ["nasm-compare-branch-loop-control"]
cognitiveTask = "complete"
scaffold = "completion"
contextFamily = "branch-control"
aidPolicy = "learning"
points = 20
prompt = "Complete the conditional jump that branches to .loop if the value in ecx is not yet zero:"
code = '''
    dec     ecx
    cmp     ecx, 0
    ____    .loop'''
answer = "jne"
hint = "After dec ecx, ZF is set to 1 if ecx became zero. Which jump takes the branch when ZF = 0?"
explain = "jne (jump if not equal) reads the ZF flag. If ZF is 0 (ecx is not zero), it jumps to .loop. If ZF is 1 (ecx reached zero), execution falls through to the next instruction after the loop. jne and jnz are aliases for the same opcode."

[[lessons.exercises]]
id = "s01-l04-e3"
type = "text"
required = true
capabilities = ["language-branch-loop-control"]
mechanisms = ["nasm-compare-branch-loop-control"]
cognitiveTask = "explain"
scaffold = "guided"
contextFamily = "branch-control"
aidPolicy = "learning"
points = 20
prompt = "Your classmate writes: `mov eax, -1; cmp eax, 0; jb .negative`. They expect the jump to fire because -1 looks 'below' zero. In GDB, the jump is not taken. Explain why."
answer = "jb is an unsigned comparison. When eax holds -1 (which is 0xFFFFFFFF in 32 bits), the unsigned interpretation is 4,294,967,295 — far above zero. The cmp sets CF (borrow) but jb reads CF as 'below' in the unsigned sense, and 4 billion is not below 0. The correct signed comparison is jl (jump if less), which reads SF and OF, recognizing -1 as negative."
hint = "Check which flag family jb uses versus jl. What does -1 look like as an unsigned 32-bit value?"

