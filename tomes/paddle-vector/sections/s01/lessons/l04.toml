[[lessons.exercises]]
id = "s01-l04-w1"
type = "write"
required = true
capabilities = ["language-branch-loop-control"]
mechanisms = ["nasm-compare-branch-loop-control"]
cognitiveTask = "build"
scaffold = "guided"
contextFamily = "branch-control"
aidPolicy = "learning"
points = 30
prompt = "Write a program called sign-check.asm that loads a value from a labelled dd constant into eax, then branches on three cases: if the value is positive (greater than 0), store 1 in a .bss byte named flag; if zero, store 0; if negative, store 2. The program must exit with the flag value as the exit code. Test with at least two different constant values."
hint = "Use cmp eax, 0; jg .positive; je .zero; jl .negative as a three-way branch chain. Remember that if the positive path falls through into the zero path, you need a jmp to prevent it."
expect = '''
1'''
solution = '''
BITS 64
DEFAULT REL

section .data
    val: dd 42

section .bss
    flag: resb 1

section .text
global _start
_start:
    mov     eax, [val]
    cmp     eax, 0
    jg      .positive
    je      .zero
    jl      .negative

.positive:
    mov     byte [flag], 1
    jmp     .done
.zero:
    mov     byte [flag], 0
    jmp     .done
.negative:
    mov     byte [flag], 2

.done:
    movzx   edi, byte [flag]
    mov     eax, 60
    syscall
'''
