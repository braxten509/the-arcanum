[[lessons]]
id = "s01-l04"
title = "Drive Decisions with Flags"
teaches = ["language-branch-loop-control"]
introduces = ["nasm-compare-branch-loop-control"]
validationDependencies = []
researchSources = ["nasm-manual", "sysv-abi"]
body = '''
<p>So far every program we've written runs in a straight line from <code>_start</code> to <code>syscall</code> — every instruction executes exactly once, in order. Real programs choose. They look at a value, compare it to another, and go one of two ways. That decision is a branch.</p>

<p>Branches work through a two-step dance:</p>

<ol>
<li><code>cmp left, right</code> subtracts <em>right</em> from <em>left</em>, throws away the result, but <strong>remembers the outcome</strong> in a hidden register called <code>rflags</code>. Every comparison sets or clears tiny one-bit flags: Zero Flag (ZF) if the result was zero, Sign Flag (SF) if the result was negative, Carry Flag (CF) if the subtraction needed a borrow.</li>
<li>A conditional jump like <code>je</code> (jump if equal) reads those flags and either moves the instruction pointer to a new label —or falls through to the next instruction.</li>
</ol>

<p>Write a disposable file, <code>branch-demo.asm</code>:</p>

<pre><code data-kind="runnable">; branch-demo.asm — compare two values and branch
BITS 64
DEFAULT REL

section .data
    result: db 0

section .text
global _start
_start:
    mov     ecx, 7
    mov     edx, 5
    cmp     ecx, edx
    jg      .bigger         ; jump if ecx > edx (signed)

    mov     byte [result], 0
    jmp     .done

.bigger:
    mov     byte [result], 1

.done:
    mov     edi, [result]
    mov     eax, 60
    syscall</code></pre>

<p>Step through it:</p>

<ul>
<li><code>mov ecx, 7</code> and <code>mov edx, 5</code> put our two values in registers.</li>
<li><code>cmp ecx, edx</code> computes <code>7 - 5 = 2</code>. The result is positive and not zero, so ZF = 0 and SF = 0. The actual 2 is discarded — only the flags survive.</li>
<li><code>jg .bigger</code> reads the flags: "jump if greater (signed)" means "take the branch when ZF = 0 AND SF = OF." Since 7 > 5, the branch is taken and execution jumps to the instruction after the <code>.bigger</code> label.</li>
<li><code>mov byte [result], 1</code> stores 1 into the result byte. The <code>byte</code> keyword tells NASM "I'm writing exactly 1 byte" because NASM cannot infer the size from a pure immediate value like <code>1</code>.</li>
<li>The <code>.done</code> section loads result into edi and calls exit.</li>
</ul>

<p>When <code>ecx</code> is greater, the path through <code>.bigger</code> executes and the fall-through <code>mov byte [result], 0</code> is skipped entirely. The <code>jmp .done</code> is an unconditional branch — it always jumps, no flags checked. Without it, the "not bigger" path would fall through into <code>.bigger</code> and always set result to 1 anyway.</p>

<p>Here are the conditional jumps you'll use most:</p>

<table>
<tr><th>Instruction</th><th>Meaning</th><th>Condition</th></tr>
<tr><td><code>je</code></td><td>jump if equal</td><td>ZF = 1</td></tr>
<tr><td><code>jne</code></td><td>jump if not equal</td><td>ZF = 0</td></tr>
<tr><td><code>jg</code></td><td>jump if greater (signed)</td><td>ZF = 0 AND SF = OF</td></tr>
<tr><td><code>jl</code></td><td>jump if less (signed)</td><td>SF != OF</td></tr>
<tr><td><code>jge</code></td><td>jump if greater-or-equal</td><td>SF = OF</td></tr>
<tr><td><code>jle</code></td><td>jump if less-or-equal</td><td>ZF = 1 OR SF != OF</td></tr>
</table>

<p>Assemble and run:</p>

<pre><code data-kind="runnable">nasm -f elf64 branch-demo.asm -o branch-demo.o
ld branch-demo.o -o branch-demo
./branch-demo
echo $?</code></pre>

<p>The exit code is 1 (because 7 > 5, so we stored 1 in result). Change <code>mov ecx, 5</code> to <code>mov ecx, 3</code>, rebuild, and run again — the exit code becomes 0.</p>

<div class="field-notes"><div class="fn-head">FIELD NOTES // SIGNED VS UNSIGNED</div>
<p>There are two families of conditional jumps: signed (<code>jg</code>, <code>jl</code>, <code>jge</code>, <code>jle</code>) and unsigned (<code>ja</code>, <code>jb</code>, <code>jae</code>, <code>jbe</code>). They read the same flags but interpret them differently. For window dimensions and SDL return codes — all non-negative — either family works. But when comparing a return value against a negative error sentinel like <code>cmp eax, 0</code> followed by <code>jl</code>, you want the signed version because a negative number interpreted as unsigned overflows to a huge positive number and <code>jb</code> (below) would never fire. For all the comparisons in this course, the signed family (<code>jg</code>, <code>jl</code>, <code>jge</code>, <code>jle</code>) is correct.</p></div>
'''

[[lessons.concepts]]
id = "language-branch-loop-control"
purpose = "Use cmp to compare two register or immediate values, setting processor flags, then use conditional jumps (je, jne, jg, jl, jge, jle) and unconditional jmp to direct execution to different labelled code paths so the program can choose, repeat, or skip blocks based on computed state."
anatomy = "cmp A, B subtracts B from A and sets ZF/SF/CF/OF in rflags. A conditional jump reads those flags and either transfers control to its label operand (jump taken) or continues to the next instruction (jump not taken). jmp always jumps. Labels ending with : mark jump targets."
example = "The branch-demo.asm program showing cmp ecx, edx; jg .bigger; the fall-through path; and the unconditional jmp .done to avoid falling into the taken-branch path."
observable = "With ecx=7, edx=5, echo $? prints 1. With ecx=3, edx=5, echo $? prints 0. Under GDB, stepi shows rip jumping to .bigger or falling through to the next instruction."
failure = "Forgetting the unconditional jmp .done after the fall-through path causes execution to 'fall into' the .bigger label anyway — both paths execute, which is almost never intended. Using the wrong signedness jump (e.g. ja instead of jg) when comparing signed integers produces the opposite answer for negative numbers."
practice = "s01-l04-e1"

[[lessons.concepts]]
id = "nasm-compare-branch-loop-control"
purpose = "Apply the cmp+jcc (conditional jump) pattern to evaluate integer comparisons against constants or other registers, and layer an unconditional jmp to create loop-back edges (backward jumps) or skip-forward patterns that build multi-way decisions, early exits, and counted repetitions."
anatomy = "The compare-branch pattern: set up values in registers, cmp them, jcc to a labelled target. For a loop: initialize a counter, do work, decrement the counter, cmp counter to zero, jne back to the loop top. The loop's forward path falls through when the condition becomes false."
example = "The branch-demo.asm compare-branch path; the body mentions loop construction with a counter and jne back to the top as a composition technique."
observable = "A loop counting down from 5 to 0 fires the loop body five times, then falls through. Under GDB, stepi shows rip jumping backward five times and then falling through when the counter reaches zero."
failure = "An infinite loop occurs when the counter is never modified or the comparison always produces the 'jump' outcome. Off-by-one: cmp counter, 0; jne .loop will run one extra iteration if the counter starts at 1 but is decremented after the comparison rather than before it."
practice = "s01-l04-e1"

