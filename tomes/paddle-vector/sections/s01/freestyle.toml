[freestyle]
title = "THE WORKING: OPEN THE FIRST NATIVE WINDOW"
brief = '''
<p><strong>Outcome:</strong> From an empty external workspace, create <code>src/pong.asm</code> and <code>Makefile</code>, build a native executable, and prove one correctly released SDL2 window lifetime. You author every project line; lesson labs are disposable references, not starter files.</p>
<ul>
<li>Install missing Debian/Ubuntu packages or verify the existing NASM, GCC, Make, pkg-config, GDB, and SDL2 development tools. Save no tool output as a project artifact.</li>
<li>Create the <code>src</code> directory and both canonical files yourself. Choose a visible ASCII window title, width from 640–1100, height from 360–700, and sensible on-screen coordinates; keep those choices in named integer or string data.</li>
<li>In NASM x86-64, guard the process argument count before dereferencing its eight-byte pointer table, then recognize exactly one <code>--arcanum-acceptance</code> user argument with an explicit byte-comparison loop. Decompose at least that comparison and SDL error reporting into ABI-safe procedures whose register and stack behavior you can explain.</li>
<li>Initialize SDL video, check its signed status, create the chosen window, check the returned pointer, and retain it. Both failures must pass SDL's current borrowed diagnostic to variadic <code>SDL_Log</code> and return nonzero. Normal success and every failure converge on one tail that conditionally destroys a validated window and calls <code>SDL_Quit</code> exactly once.</li>
<li>Make acceptance mode print exactly <code>INIT_OK</code> after the non-null window pointer is stored, then clean up and return zero. Other arguments must not select this check.</li>
<li>Author Make targets for the default build, an explicit <code>build</code> alias, <code>run</code>, <code>check-s01</code>, <code>debug</code>, and <code>clean</code>. Produce the generated executable at <code>build/paddle-vector</code>, assemble ELF64 with DWARF, link through GCC with <code>-no-pie</code> and pkg-config's SDL2 libraries, and make <code>check-s01</code> run acceptance mode under <code>SDL_VIDEODRIVER=dummy</code> while checking the exact line.</li>
</ul>
<p><strong>Proof and recovery:</strong> From the project root run the five version probes, <code>make clean</code>, <code>make</code>, and <code>make check-s01</code>. If a command fails, use its first actionable diagnostic to distinguish a missing tool, assembly error, link error, SDL failure, or output mismatch before changing code. Then run <code>make debug</code>, break at your label immediately after the handle store and at a label after destruction and handle clearing, and run the desktop path. Inspect the stored eight-byte pointer, registers, and flags; confirm your chosen native window is visible; step one instruction and interpret the changed flags. Continue to the cleanup boundary, verify the stored handle is zero, then resume through SDL shutdown and quit GDB. Do not add rendering, event polling, frame delays, or gameplay yet.</p>
'''
requires = ["external-toolchain-ready", "tool-install", "tool-diagnose", "tool-create-open", "tool-navigate", "tool-edit-save", "tool-run-test", "assembly-workspace-authorship", "language-data-layout-and-integer-state", "language-branch-loop-control", "language-abi-procedures-and-register-discipline", "native-build-pipeline", "language-status-failure-and-resource-cleanup", "native-window-lifecycle", "language-observable-debugging-and-verification", "native-window-proof"]
mechanisms = ["debian-toolchain-install", "toolchain-version-diagnostics", "workspace-directory-creation", "tool-edit-save", "nasm-source-layout", "makefile-authorship", "nasm-integer-data-and-addressed-state", "nasm-static-cstring-pointer-and-sdl-error-output", "nasm-compare-branch-loop-control", "sysv-abi-procedure-discipline", "nasm-elf64-dwarf-object-build", "gcc-sdl2-link-and-make-targets", "sdl-init-status-observation", "sdl-init-failure-branch", "sdl-init-error-diagnostic", "sdl-init-failure-cleanup", "sdl-window-status-observation", "sdl-window-failure-branch", "sdl-window-error-diagnostic", "sdl-window-failure-cleanup", "sdl-window-normal-cleanup", "deterministic-init-check", "gdb-state-inspection", "process-entry-argument-access"]
validationDependencies = []
masteryPerformances = []
reward = 150
xray = "Inspect only learner-authored src/pong.asm and Makefile. Reward a bounds check before argv access, a genuine byte loop, named learner choices, ABI-safe procedures, immediate SDL status checks, failure-only SDL_GetError passed to SDL_Log, exact acceptance output, and one converged cleanup owner. Dock hard-coded lesson identifiers, pre-guard argument dereferences, unconditional success, stale-error reads, null or duplicate destruction, skipped SDL_Quit, unaligned calls, a check target that merely echoes INIT_OK, or GDB evidence taken before the handle store."

