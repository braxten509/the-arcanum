[[freestyle.referenceSteps]]        # hidden from learners; validator replays a real solution
id = "s01-reference-source"
path = "src/pong.asm"
mode = "rewrite"
preserves = "all-active"
mechanisms = ["workspace-directory-creation", "tool-edit-save", "nasm-source-layout", "nasm-integer-data-and-addressed-state", "nasm-static-cstring-pointer-and-sdl-error-output", "nasm-compare-branch-loop-control", "sysv-abi-procedure-discipline", "sdl-init-status-observation", "sdl-init-failure-branch", "sdl-init-error-diagnostic", "sdl-init-failure-cleanup", "sdl-window-status-observation", "sdl-window-failure-branch", "sdl-window-error-diagnostic", "sdl-window-failure-cleanup", "sdl-window-normal-cleanup", "deterministic-init-check", "process-entry-argument-access"]
instruction = "Private replay creates the src directory and writes one complete assembly solution with an independently chosen title and dimensions, guarded argv access, token loop, SDL_Log diagnostics, status checks, shared cleanup, deterministic output, and debugger label."
content = '''
SDL_INIT_VIDEO equ 0x20

global main
global window_ready

extern SDL_Init
extern SDL_CreateWindow
extern SDL_GetError
extern SDL_Log
extern SDL_DestroyWindow
extern SDL_Quit
extern puts

section .rodata
    acceptance_token db "--arcanum-acceptance", 0
    window_title db "Vector Rally", 0
    error_format db "SDL failure: %s", 0
    success_text db "INIT_OK", 0

section .data
    window_width dd 880
    window_height dd 500
    exit_code dd 1
    check_mode db 0

section .bss
    window_handle resq 1

section .text
main:
    push rbp
    mov rbp, rsp

    cmp edi, 2
    jl start_sdl
    jne start_sdl
    mov rdi, [rsi + 8]
    lea rsi, [rel acceptance_token]
    call strings_equal
    cmp eax, 1
    jne start_sdl
    mov byte [rel check_mode], 1

start_sdl:
    mov edi, SDL_INIT_VIDEO
    call SDL_Init
    cmp eax, 0
    jl init_failure

    lea rdi, [rel window_title]
    mov esi, 140
    mov edx, 110
    mov ecx, [rel window_width]
    mov r8d, [rel window_height]
    xor r9d, r9d
    call SDL_CreateWindow
    cmp rax, 0
    je window_failure
    mov [rel window_handle], rax

window_ready:
    cmp byte [rel check_mode], 1
    jne normal_success
    lea rdi, [rel success_text]
    call puts

normal_success:
    mov dword [rel exit_code], 0
    jmp main_cleanup

init_failure:
    call report_sdl_error
    jmp main_cleanup

window_failure:
    call report_sdl_error

main_cleanup:
    mov rdi, [rel window_handle]
    cmp rdi, 0
    je quit_sdl
    call SDL_DestroyWindow
    mov qword [rel window_handle], 0

quit_sdl:
    call SDL_Quit
    mov eax, [rel exit_code]
    leave
    ret

strings_equal:
.next_byte:
    mov al, [rdi]
    cmp al, [rsi]
    jne .different
    cmp al, 0
    je .equal
    inc rdi
    inc rsi
    jmp .next_byte
.equal:
    mov eax, 1
    ret
.different:
    xor eax, eax
    ret

report_sdl_error:
    push rbp
    mov rbp, rsp
    call SDL_GetError
    mov rsi, rax
    lea rdi, [rel error_format]
    xor eax, eax
    call SDL_Log
    leave
    ret
'''

[[freestyle.referenceSteps]]
id = "s01-reference-makefile"
path = "Makefile"
mode = "write"
mechanisms = ["tool-edit-save", "makefile-authorship", "nasm-elf64-dwarf-object-build", "gcc-sdl2-link-and-make-targets", "deterministic-init-check", "gdb-state-inspection"]
instruction = "Private replay checks for NASM, GCC, Make, pkg-config, GDB, and SDL2 development metadata; installs only missing Debian/Ubuntu packages through the taught apt route; requires nasm -v, gcc --version, make --version, gdb --version, and pkg-config --modversion sdl2 to succeed; then writes the complete build graph, uses its build and byte-preserving acceptance-check targets, and runs both debug-replay (dummy driver, deterministic) to break after the handle store, inspect memory/registers/flags, step the comparison, continue to post-destruction cleanup, verify cleared handle storage, and resume to exit, and debug-replay-graphical (real video driver) to replay the identical breakpoint sequence against a genuinely visible native window."
content = '''
NASM := nasm
CC := gcc
TARGET := build/paddle-vector
SOURCE := src/pong.asm
BUILD_DIR := build
OBJECT := $(BUILD_DIR)/pong.o
SDL_LIBS := $(shell pkg-config --libs sdl2)

.PHONY: all build run check-s01 debug debug-replay debug-replay-graphical clean

all: $(TARGET)

build: $(TARGET)

$(OBJECT): $(SOURCE)
	mkdir -p $(BUILD_DIR)
	$(NASM) -f elf64 -g -F dwarf $< -o $@

$(TARGET): $(OBJECT)
	$(CC) -no-pie $< -o $@ $(SDL_LIBS)

run: $(TARGET)
	./$(TARGET)

check-s01: $(TARGET)
	SDL_VIDEODRIVER=dummy ./$(TARGET) --arcanum-acceptance > $(BUILD_DIR)/check-s01.out
	printf 'INIT_OK\n' > $(BUILD_DIR)/check-s01.expected
	cmp $(BUILD_DIR)/check-s01.out $(BUILD_DIR)/check-s01.expected

debug: $(TARGET)
	gdb -q ./$(TARGET)

debug-replay: $(TARGET)
	gdb -q -batch ./$(TARGET) \
	 -ex 'set environment SDL_VIDEODRIVER dummy' \
	 -ex 'break window_ready' \
	 -ex 'break quit_sdl' \
	 -ex 'run' \
	 -ex 'x/gx &window_handle' \
	 -ex 'info registers rax rsp eflags' \
	 -ex 'stepi' \
	 -ex 'info registers eflags' \
	 -ex 'continue' \
	 -ex 'x/gx &window_handle' \
	 -ex 'info registers rdi rsp eflags' \
	 -ex 'continue'

debug-replay-graphical: $(TARGET)
	gdb -q -batch ./$(TARGET) \
	 -ex 'break window_ready' \
	 -ex 'break quit_sdl' \
	 -ex 'run' \
	 -ex 'x/gx &window_handle' \
	 -ex 'info registers rax rsp eflags' \
	 -ex 'stepi' \
	 -ex 'info registers eflags' \
	 -ex 'continue' \
	 -ex 'x/gx &window_handle' \
	 -ex 'info registers rdi rsp eflags' \
	 -ex 'continue'

clean:
	$(RM) $(OBJECT) $(TARGET) $(BUILD_DIR)/check-s01.out $(BUILD_DIR)/check-s01.expected
	-rmdir $(BUILD_DIR)
'''

