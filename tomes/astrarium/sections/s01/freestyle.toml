[freestyle]
title = "THE WORKING: The First Reading"
brief = '''
<p>The candle burns low. Vaelith places a fresh sheet before you.</p>
<p><strong>"The Astrarium must announce itself before it reads. Build its first voice."</strong></p>
<ul>
  <li>Print the banner line: <code>=== ASTRARIUM v0.1 ===</code></li>
  <li>Print a subheading: <code>Night 1 // First Reading</code></li>
  <li>Use <code>input()</code> to ask the observer's name — print the prompt <code>"Who observes tonight?"</code> on its own line, then read the name</li>
  <li>Use an f-string to print: <code>Welcome, [name]. The night awaits.</code></li>
  <li>Use <code>input()</code> to read tonight's observation count (as a number), then print: <code>Observations: [count]</code></li>
  <li>Compute and print the total lines in all observations if each observation has 3 log lines: <code>Total log lines: [count * 3]</code></li>
</ul>
'''
reward = 150
xray = "The grader checks that the banner and subheading print first, that input() reads the observer's name and the count correctly, and that f-strings produce the formatted output. Style marks go to snake_case variable names (observer_name, count), consistent 4-space indentation, and no unused variables. Marks docked for: missing banner, hardcoded values where the prompt specifies computation, missing f-string formatting, and crashes on any input."

[freestyle.badge]
id = "badge-s01"
name = "FIRST READING"
desc = "The first observation log is read and recorded. The Astrarium awakens."

[[freestyle.rubric]]
criterion = "Compiles & runs"
weight = 30
desc = "The script runs without syntax errors or runtime crashes on normal input."

[[freestyle.rubric]]
criterion = "Meets the brief"
weight = 50
desc = "Prints the banner and subheading, reads observer name and observation count with input(), formats output with f-strings, and includes the computed log-lines total."

[[freestyle.rubric]]
criterion = "Clean style"
weight = 20
desc = "snake_case variable names, 4-space indentation, no unused variables, meaningful names that describe the observation domain (e.g. observer_name not x)."
