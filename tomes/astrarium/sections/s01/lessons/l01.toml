[[lessons]]
id = "s01-l01"
title = "Hello, Night"
body = '''
<p>Vaelith slides a yellowed sheet across the desk. A single line of observation script. <strong>"Before the Astrarium can chart,"</strong> she says, <strong>"it must speak. Every tool's heartbeat is output — the words it sends back to the reader."</strong></p>

<p>In Python, the pulse is <code>print()</code>. Whatever you place between the parentheses goes to the console:</p>
<pre><code><span class="k">print</span>(<span class="s">"Astrarium v0.1"</span>)</code></pre>
<p>That single line writes <code>Astrarium v0.1</code> to the output. The text inside the quotes is a <strong>string literal</strong> — a sequence of characters Python treats as data, not code. Strings can use single or double quotes as long as the opening and closing match:</p>
<pre><code><span class="k">print</span>(<span class="s">'Meteor shower observed'</span>)
<span class="k">print</span>(<span class="s">"Flare detected at 22:04"</span>)</code></pre>
<p>You can pass multiple items to a single <code>print()</code> — they are separated by a space automatically:</p>
<pre><code><span class="k">print</span>(<span class="s">"Event:"</span>, <span class="s">"METEOR_SHOWER"</span>, <span class="s">"Severity:"</span>, <span class="s">"INFO"</span>)</code></pre>
<p>This prints: <code>Event: METEOR_SHOWER Severity: INFO</code>.</p>

<p>If the text itself contains a quote, escape it with a backslash, or use the opposite quote style:</p>
<pre><code><span class="k">print</span>(<span class="s">"Vaelith's log"</span>)
<span class="k">print</span>(<span class="s">'She said "Observe."'</span>)</code></pre>

<p>Strings can also span special characters with escape sequences — <code>\n</code> for a new line, <code>\t</code> for a tab. These are how the Astrarium will later structure its reports.</p>
<pre><code><span class="k">print</span>(<span class="s">"Night 1\nEvent: METEOR_SHOWER\nCount: 12"</span>)</code></pre>

<div class="callout">"<strong>Vaelith's rule:</strong> double quotes for strings that contain single quotes, single quotes for strings that contain double quotes. Keeps the reading clean."</div>

<div class="field-notes"><div class="fn-head">FIELD NOTES // Print's Hidden Quill</div>
<p><code>print()</code> accepts keyword arguments that control its output shape. <code>sep</code> changes the separator between items (default is a space): <code>print("a", "b", "c", sep=" | ")</code> prints <code>a | b | c</code>. <code>end</code> replaces the trailing newline: <code>print("reading", end="...")</code> writes <code>reading...</code> with no line break. These are useful when the Astrarium must format a table without extra spacing.</p></div>
'''

[[lessons.readings]]
label = "Python docs — print()"
url = "https://docs.python.org/3/library/functions.html#print"

[[lessons.readings]]
label = "Python docs — string literals"
url = "https://docs.python.org/3/reference/lexical_analysis.html#string-and-bytes-literals"

[[lessons.exercises]]
id = "s01-l01-e1"
type = "mc"
points = 15
prompt = "Which built-in function does Vaelith use to write text to the console?"
choices = [
  "print()",
  "input()",
  "write()",
  "output()"
]
answer = 0
whyWrong = "input() reads from the observer, not to the screen; write() belongs to file objects, not console output; output() is not a Python built-in. The Astrarium always speaks through print()."
hint = "Vaelith's first command in the lesson — the one that sends text to the console."
explain = "print() is Python's universal output function. It writes its arguments to the console, separated by spaces, ending with a newline."

[[lessons.exercises]]
id = "s01-l01-d1"
type = "type"
points = 12
reps = 2
prompt = "Retype the Astrarium's first greeting exactly. (Ctrl+Enter submits.)"
code = 'print("Astrarium v0.1 — First Reading")'

[[lessons.exercises]]
id = "s01-l01-e2"
type = "text"
points = 20
prompt = "What type of value is enclosed in quotation marks — <code>'like this'</code> or <code>\"like this\"</code> — in Python code?"
answer = "string"
accept = ["str", "string literal", "text"]
hint = "Vaelith calls text values by the name Python uses for any sequence of characters between quotes."
explain = "A string is a sequence of characters enclosed in matching quotes — single or double. Strings are how the Astrarium stores names, event labels, and log text."

[[lessons.exercises]]
id = "s01-l01-e3"
type = "fill"
points = 20
prompt = "Vaelith assigns the event name to a variable, then prints it. What goes in the blank?"
code = 'event = "METEOR_SHOWER"\nprint(____)'
answer = "event"
hint = "The blank is the name of the variable that holds the observation data."
explain = "The variable name 'event' is passed to print() without quotes — Python substitutes its value."

[[lessons.exercises]]
id = "s01-l01-w1"
type = "write"
points = 30
prompt = "The first observation has been recorded. Print exactly these three lines:<br><code>=== ASTRARIUM v0.1 ===</code><br><code>Night 1 // First Observation</code><br><code>Recorded by: Vaelith</code>"
expect = '''
=== ASTRARIUM v0.1 ===
Night 1 // First Observation
Recorded by: Vaelith'''
hint = "Each line is a separate print() call. The second line uses a double slash just like the observation logs."
