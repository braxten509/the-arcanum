[[lessons]]
id = "s01-l02"
title = "The Observer's Questions"
body = '''
<p>A record is only as good as the witness who provides it. Vaelith dips her quill. <strong>"We need names. Counts. The raw observations the night gives us."</strong> In Python, we store these answers in <strong>variables</strong> — named boxes that hold a value.</p>

<p>A variable is created the moment you assign to it with <code>=</code>:</p>
<pre><code>observer <span class="k">=</span> <span class="s">"Lyra"</span>
event_count <span class="k">=</span> <span class="mi">12</span></code></pre>
<p>Variable names follow strict rules: they can contain letters, digits, and underscores; they must start with a letter or underscore; they are <strong>case-sensitive</strong> (<code>Observer</code> and <code>observer</code> are different). The convention in Python is <strong>snake_case</strong> — lowercase with underscores between words.</p>

<p>To receive data from the observer, Vaelith uses <code>input()</code>. It pauses the Astrarium and waits for the user to type:</p>
<pre><code>observer <span class="k">=</span> <span class="k">input</span>()</code></pre>
<p>Whatever the user types is returned as a <strong>string</strong> and stored in the variable. You can provide a prompt string that <code>input()</code> displays — but be aware the prompt goes to the same output channel:</p>
<pre><code><span class="k">print</span>(<span class="s">"Who observes tonight?"</span>)
observer <span class="k">=</span> <span class="k">input</span>()
<span class="k">print</span>(<span class="s">"Welcome,"</span>, observer)</code></pre>

<p>Because <code>input()</code> always returns a string, reading a number requires <strong>type conversion</strong>:</p>
<pre><code>raw <span class="k">=</span> <span class="k">input</span>()          <span class="c"># user types "12"</span>
count <span class="k">=</span> <span class="nb">int</span>(raw)          <span class="c"># now count holds the integer 12</span></code></pre>
<p>The <code>int()</code> function converts a string to an integer. <code>float()</code> converts to a decimal number. This conversion is how the Astrarium turns raw log entries into computable data.</p>

<div class="callout">"<strong>Vaelith's rule:</strong> every reading from the outside world arrives as text. Always convert explicitly — never assume input() gives you a number."</div>

<div class="field-notes"><div class="fn-head">FIELD NOTES // Variable Vigilance</div>
<p>Python is dynamically typed — the same variable can hold a string, then an integer, then a list. This flexibility is powerful but treacherous: a variable that once held <code>"12"</code> (a string) and later holds <code>12</code> (an integer) behaves differently with <code>+</code>. Use <code>type()</code> to check what a variable is at any point. Meaningful names prevent most mix-ups — <code>count_str</code> vs <code>count</code> tells the reader (and Vaelith) exactly what each holds.</p></div>
'''

[[lessons.readings]]
label = "Python docs — input()"
url = "https://docs.python.org/3/library/functions.html#input"

[[lessons.exercises]]
id = "s01-l02-e1"
type = "mc"
points = 15
prompt = "What type does Python's <code>input()</code> function always return, regardless of what the user types?"
choices = [
  "int",
  "str",
  "float",
  "list"
]
answer = 1
whyWrong = "int is only returned after explicit conversion with int(); float is another conversion target, not the default; input() never returns a list unless you split the string yourself. input() always gives you a string — convert it if you need a number."
hint = "Vaelith's rule: every reading from the outside arrives as text."
explain = "input() always returns a string. To get an integer, you must call int() on the result — a step the Astrarium must never skip."

[[lessons.exercises]]
id = "s01-l02-e2"
type = "fill"
points = 20
prompt = "Complete the line so the Astrarium asks the observer's name and stores it."
code = 'observer = ____("Who watches? ")'
answer = "input"
hint = "The blank is the name of the built-in function that reads from the user."
explain = "input() reads a line from the user, returns it as a string, and the assignment stores it in observer."

[[lessons.exercises]]
id = "s01-l02-e3"
type = "text"
points = 20
prompt = "What built-in function converts a string — for example <code>\"5\"</code> — into an integer?"
answer = "int"
accept = ["int()"]
hint = "Vaelith uses it right after reading a count from input(), before doing arithmetic."
explain = "int() takes a string (or another number) and returns an integer. The Astrarium needs this to compute with observation counts."

[[lessons.exercises]]
id = "s01-l02-w1"
type = "write"
points = 30
stdin = "Lyra"
prompt = "The Astrarium must greet the observer. Print the prompt <code>Who observes tonight?</code>, read the observer's name from input, then print <code>Welcome, [name]. The night awaits.</code> replacing <code>[name]</code> with the input."
expect = '''Who observes tonight?
Welcome, Lyra. The night awaits.'''
hint = "Print the prompt on its own line first, then call input() with no argument, then use an f-string or comma-separated print() for the welcome."
