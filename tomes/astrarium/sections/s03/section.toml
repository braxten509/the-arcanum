id = "s03"
codename = "CHAPTER III // THE COLLECTED HORIZON"
short = "The Collected Horizon"
title = "Sequences — lists, tuples, sets"
build = "In-memory ledger of every event in one log, dedup set of severities."
brief = '''
<p>The night's observations arrive in a stream, but to make sense of them the Astrarium must <em>hold</em> them — gather every event into a single ledger where it can be counted, searched, and transformed. Vaelith sets down a fresh logbook with many blank pages. <strong>"We have read the sky line by line. Now we collect what we have seen into one place."</strong></p>
<p>This chapter introduces Python's sequence types: the <code>list</code> (ordered and mutable), the <code>tuple</code> (ordered and immutable), and the <code>set</code> (unordered with no duplicates). You will learn to index, slice, build, sort, and transform collections — and to write list comprehensions, one of the language's most elegant and Pythonic constructs. By the end, the Astrarium will keep a full in-memory ledger of every observation and know which distinct severity levels the night produced.</p>
<p>Concepts covered: <code>list</code> creation and indexing, negative indexing, slicing, list methods (<code>append</code>, <code>pop</code>, <code>sort</code>), iteration over collections, <code>in</code>/<code>not in</code> membership, list comprehensions, <code>tuple</code> immutability, and <code>set</code> deduplication with basic set operations.</p>
'''
