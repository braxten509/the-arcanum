[[lessons]]
id = "s03-l05"
title = "Forging at Once"
body = '''
<p>Vaelith looks at the long column of events and then at the fresh page beside it. <strong>"Why write each transformation by hand? Python can forge an entire new list from an old one in a single line."</strong></p>

<p>A <strong>list comprehension</strong> is a compact syntax for building a list by applying an expression to each element of a sequence. The simplest form transforms every element:</p>
<pre><code>events <span class="k">=</span> [<span class="s">"meteor"</span>, <span class="s">"flare"</span>, <span class="s">"sensor"</span>]
shouted <span class="k">=</span> [e.<span class="k">upper</span>() <span class="k">for</span> e <span class="ow">in</span> events]
<span class="k">print</span>(shouted)  <span class="c"># ["METEOR", "FLARE", "SENSOR"]</span></code></pre>
<p>The comprehension reads: "build a list by calling <code>e.upper()</code> for each <code>e</code> in <code>events</code>." The variable <code>e</code> takes each element in turn, just like a <code>for</code> loop, and the expression before the <code>for</code> keyword produces the value that goes into the new list.</p>

<p>Add an <code>if</code> clause to filter — only elements that pass the test are included:</p>
<pre><code>events <span class="k">=</span> [<span class="s">"METEOR"</span>, <span class="s">"FLARE"</span>, <span class="s">"SENSOR"</span>, <span class="s">"COSMIC"</span>]
short <span class="k">=</span> [e <span class="k">for</span> e <span class="ow">in</span> events <span class="k">if</span> <span class="nb">len</span>(e) <span class="o">&lt;</span> <span class="mi">6</span>]
<span class="k">print</span>(short)   <span class="c"># ["METEOR", "FLARE"] — only names shorter than 6 letters</span></code></pre>
<p>The <code>if</code> filter keeps only elements where the condition is <code>True</code>. This is the Astrarium's tool for selecting specific events from the ledger without writing a multi-line loop.</p>

<p>You can also use an <code>if-else</code> expression inside the comprehension to transform elements conditionally:</p>
<pre><code>tags <span class="k">=</span> [<span class="s">"HIGH"</span> <span class="k">if</span> <span class="s">"ERROR"</span> <span class="ow">in</span> e <span class="k">else</span> <span class="s">"OK"</span> <span class="k">for</span> e <span class="ow">in</span> events]</code></pre>
<p>Be careful with placement: the <code>if</code> <em>filter</em> goes after the <code>for</code>, but the <code>if-else</code> <em>expression</em> goes before it — they are different constructs that look similar.</p>

<p>List comprehensions are not just syntactic sugar. They are consistently faster than manual <code>for</code>/<code>append</code> loops because their iteration happens at the C level inside Python's interpreter. For a ledger of a few hundred events the difference is negligible; for thousands it becomes noticeable.</p>

<p>Use a comprehension when the logic fits on one or two lines. If the transformation requires many steps or nested conditions, a regular <code>for</code> loop is clearer — and clarity always wins.</p>

<div class="callout">"<strong>Vaelith's rule:</strong> a list comprehension should read like a sentence. 'Make a list of upper-cased events for each event in the ledger.' If the sentence gets tangled, write a loop instead."</div>

<div class="field-notes"><div class="fn-head">FIELD NOTES // Nested Comprehensions</div>
<p>Comprehensions can nest: <code>[e for sublist in matrix for e in sublist]</code> flattens a 2D list into one dimension. The <code>for</code> clauses read in the same order as a nested loop — outer first, inner second. Readability drops fast beyond one level; for flattening, consider <code>itertools.chain()</code> instead (covered in a later chapter). The Astrarium keeps its comprehensions to a single <code>for</code> clause and an optional <code>if</code>.</p></div>
'''

[[lessons.readings]]
label = "Python docs — list comprehensions"
url = "https://docs.python.org/3/tutorial/datastructures.html#list-comprehensions"

[[lessons.exercises]]
id = "s03-l05-d1"
type = "type"
points = 12
reps = 2
prompt = "Retype this list comprehension exactly. (Ctrl+Enter submits.)"
code = '''events = ["meteor", "flare", "sensor"]
shouted = [e.upper() for e in events]
print(shouted)'''

[[lessons.exercises]]
id = "s03-l05-e1"
type = "fill"
points = 20
prompt = "The Astrarium wants a list of event name lengths. Fill the expression that computes each element of the new list:"
code = '''events = ["METEOR", "FLARE", "SENSOR"]
lengths = [____ for e in events]'''
answer = "len(e)"
hint = "The built-in function that gives the number of characters in a string is the same one that gives the number of elements in a list."
explain = "len(e) returns the length of each event name string. The comprehension builds a list of integers: [6, 5, 6]."

[[lessons.exercises]]
id = "s03-l05-e2"
type = "mc"
points = 15
prompt = "What does <code>[e for e in [\"METEOR\", \"FLARE\", \"SENSOR\"] if len(e) > 5]</code> produce?"
choices = [
    "[\"METEOR\", \"FLARE\", \"SENSOR\"] — all three items",
    "[\"METEOR\", \"SENSOR\"] — the items with more than 5 letters",
    "[\"FLARE\"] — the item with 5 or fewer letters",
    "[] — len() cannot be used in a comprehension"
]
answer = 1
whyWrong = "Not all three pass the filter — FLARE has exactly 5 letters, which is not > 5. The comprehension returns items where len(e) > 5, not items with 5 or fewer letters. len() works perfectly inside comprehensions — it is a built-in function like any other."
hint = "The if clause keeps only items where the condition is True. len('METEOR') is 6, len('FLARE') is 5, len('SENSOR') is 6. Which satisfy 'greater than 5'?"
explain = "The comprehension filters items where len(e) > 5. 'METEOR' (6) and 'SENSOR' (6) pass, while 'FLARE' (5) does not."

[[lessons.exercises]]
id = "s03-l05-e3"
type = "text"
points = 20
prompt = "Rewrite this loop as a <strong>list comprehension</strong> that produces the same list <code>result</code>."
code = '''events = ["METEOR", "FLARE", "SENSOR"]
result = []
for e in events:
    result.append(e.lower())'''
answer = "[e.lower() for e in events]"
accept = ["[e.lower() for e in events]", '[event.lower() for event in events]']
hint = "Start with an opening bracket, then the expression that transforms each element, then 'for variable in list', then the closing bracket."
explain = "[e.lower() for e in events] produces the same list as the for loop but in a single expression. Each element has .lower() applied to it."

[[lessons.exercises]]
id = "s03-l05-w1"
type = "write"
points = 30
prompt = "The starter has a list of observation lines. Use a <strong>list comprehension with an if filter</strong> to keep only lines that contain <code>\"ERROR\"</code>. Then print each filtered line on its own line."
expect = '''ERROR: sensor timeout
ERROR: mount failure'''
starter = '''# ASTRARIUM — Filter Errors with Comprehension
events = [
    "INFO: meteor shower at 22:04",
    "ERROR: sensor timeout",
    "WARN: battery low",
    "ERROR: mount failure",
    "INFO: routine check",
]
# TODO: build a list of only ERROR lines using a comprehension,
# then print each one'''
hint = 'Write <code>errors = [e for e in events if "ERROR" in e]</code>. The <code>if</code> clause filters each element through the membership test. Then iterate <code>errors</code> with a for loop to print each line.'
