id = "s02"
codename = "CHAPTER II // THE BRANCHING STARS"
short = "The Branching Stars"
title = "Control Flow — if, for, while"
build = "Per-line severity classifier (INFO/WARN/ERROR) for one observation log."
brief = '''
<p>The night is never uniform. Some observations whisper — routine meteor trails, background radiation. Others shout — solar flares, instrument anomalies, readings that demand immediate attention. Vaelith spreads a hand across the logbook. <strong>"The Astrarium must learn to decide."</strong></p>
<p>This chapter teaches you to branch and repeat: how to make the tool choose one path over another based on what it reads, and how to walk through an entire log without touching every line by hand. By the end, the Astrarium will read a raw observation log line by line, classify each event by its severity, and report what it found — all on its own.</p>
<p>Concepts covered: <code>if/elif/else</code>, truthiness, logical operators, <code>for</code> and <code>while</code> loops, <code>break</code>/<code>continue</code>, and the loop-<code>else</code> clause. This is the engine that makes the tool reactive rather than scripted.</p>
'''
