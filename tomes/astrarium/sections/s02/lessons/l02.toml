[[lessons]]
id = "s02-l02"
title = "The Truth of Things"
body = '''
<p>Vaelith sets down two log entries. One reads <code>SEV=0</code>, the other <code>SEV=3</code>. <strong>"The same condition either speaks or stays silent. Python decides what is true and what is false — not always the way you expect."</strong></p>

<p>Every value in Python has an inherent <strong>truthiness</strong> — it is truthy or falsy when placed in a condition. The falsy values are few and specific:</p>
<pre><code><span class="mi">0</span>, <span class="mf">0.0</span>         <span class="c"># zero in numeric types</span>
<span class="s">""</span>              <span class="c"># empty string</span>
<span class="bp">None</span>            <span class="c"># the absence of a value</span>
<span class="bp">False</span>           <span class="c"># the boolean False itself</span></code></pre>
<p>Everything else is truthy: <code>1</code>, <code>-1</code>, <code>"ERROR"</code>, <code>" "</code> (a space character), any non-empty container. You can check any value with <code>bool()</code>:</p>
<pre><code><span class="k">print</span>(<span class="nb">bool</span>(<span class="mi">0</span>))           <span class="c"># False</span>
<span class="k">print</span>(<span class="nb">bool</span>(<span class="s">"ERROR"</span>))     <span class="c"># True</span>
<span class="k">print</span>(<span class="nb">bool</span>(<span class="s">""</span>))          <span class="c"># False</span>
<span class="k">print</span>(<span class="nb">bool</span>(<span class="s">" "</span>))         <span class="c"># True — a space is not empty</span></code></pre>
<p>This means you can test whether a string has content by checking it directly: <code>if line:</code> is <code>True</code> for any non-empty string and <code>False</code> for an empty one. The Astrarium will use this to skip blank log lines without an explicit length check.</p>

<p><strong>Logical operators</strong> combine multiple conditions into a single decision:</p>
<pre><code><span class="k">if</span> sev <span class="o">></span> <span class="mi">0</span> <span class="ow">and</span> sev <span class="o">&lt;=</span> <span class="mi">5</span>:
    <span class="k">print</span>(<span class="s">"Within valid range"</span>)

<span class="k">if</span> sev <span class="o">==</span> <span class="mi">0</span> <span class="ow">or</span> event <span class="o">==</span> <span class="s">"ROUTINE"</span>:
    <span class="k">print</span>(<span class="s">"Low-priority"</span>)

<span class="k">if</span> <span class="ow">not</span> line:
    <span class="k">print</span>(<span class="s">"Empty line — skipping"</span>)</code></pre>
<p><code>and</code> is <code>True</code> only when both sides are <code>True</code>. <code>or</code> is <code>True</code> when either side is <code>True</code>. <code>not</code> flips the boolean — it turns <code>True</code> into <code>False</code> and vice versa. All three short-circuit: Python stops evaluating as soon as the result is certain, so put the cheapest check first for efficiency.</p>

<div class="callout">"<strong>Vaelith's rule:</strong> when both conditions must hold, chain them with <code>and</code> — the Astrarium must verify everything before acting. When only one condition matters, use <code>or</code> — any signal is enough to proceed."</div>

<div class="field-notes"><div class="fn-head">FIELD NOTES // Short-Circuit Evaluation</div>
<p><code>and</code> returns the first falsy operand or the last operand if all are truthy. <code>or</code> returns the first truthy operand or the last operand if all are falsy. This is why <code>input() or "default"</code> supplies a fallback: if the user enters an empty string (falsy), <code>or</code> moves to the default. In a condition like <code>sev >= 0 and sev > 5</code>, Python never evaluates the second check if the first is <code>False</code> — the Astrarium avoids unnecessary work.</p></div>
'''

[[lessons.readings]]
label = "Python docs — truth value testing"
url = "https://docs.python.org/3/library/stdtypes.html#truth-value-testing"

[[lessons.readings]]
label = "Python docs — boolean operations"
url = "https://docs.python.org/3/reference/expressions.html#boolean-operations"

[[lessons.exercises]]
id = "s02-l02-e1"
type = "mc"
points = 15
prompt = "What does <code>bool("""")</code> — the boolean value of an empty string — evaluate to in Python?"
choices = [
    "True",
    '""',
    "False",
    "None"
]
answer = 2
whyWrong = "True would be the boolean value of a non-empty string like \"ERROR\", not an empty one. \"\" is the empty string itself, not what bool() returns. None is a distinct type representing the absence of a value, not a boolean result. An empty string is one of the built-in falsy values, so bool(\"\") evaluates to False."
hint = "Look at the list of falsy values Vaelith showed. An empty string is among them — bool() converts it to the corresponding boolean."
explain = "bool(\"\") is False because the empty string is one of Python's falsy values. Any non-empty string, including \" \" (a single space), is truthy."

[[lessons.exercises]]
id = "s02-l02-e2"
type = "fill"
points = 20
prompt = "The Astrarium should print 'Escalate' only when a log line contains 'ERROR' AND the severity counter exceeds 5. Fill in the blank with the correct logical operator."
code = '''line = "ERROR: sensor timeout"
sev = 7
if "ERROR" in line ____ sev > 5:
    print("Escalate")'''
answer = "and"
hint = "Both conditions must be true for the message to print — Vaelith's rule says to use the operator that requires both sides."
explain = "and requires both conditions to be True. If either the line does not contain ERROR or the severity is not above 5, the message is suppressed."

[[lessons.exercises]]
id = "s02-l02-d1"
type = "type"
points = 12
reps = 2
prompt = "Retype this truthiness check exactly, including the indentation. (Ctrl+Enter submits.)"
code = '''line = "  "
if line:
    print(f"Line has {len(line)} character(s)")
else:
    print("Line is empty — skipping")'''

[[lessons.exercises]]
id = "s02-l02-w1"
type = "write"
points = 30
prompt = "The observer recorded an event count and a severity keyword. If the count is greater than 0 <strong>and</strong> the keyword is <code>"ERROR"</code>, print <code>CRITICAL</code>. Otherwise, print <code>OK</code>."
expect = '''CRITICAL'''
stdin = "7 ERROR"
starter = '''# ASTRARIUM — Two-Threshold Check
# Read two values: count (int) and keyword (str).
# Print CRITICAL only if both conditions fire.
data = input().split()
count = int(data[0])
keyword = data[1]
# TODO: check both conditions with the right logical operator'''
hint = "Use <code>and</code> to join the two conditions. The count check uses <code>></code> and the keyword check uses <code>==</code>."
