[meta]
id = "astrarium"
name = "Astrarium"
description = "Build Astrarium — a CLI tool that reads starlog files and produces structured observation reports. 10 chapters, one evolving Python project."
author = "The Observatory"
version = "0.1.0"
favicon = "✦"

[runtime]
name = "python"
project = "Astrarium"
language = "Python"

[content]
sections = ["s01", "s02", "s03", "s04", "s05", "s06", "s07", "s08", "s09", "s10"]

[defaults]
theme = "astral-night"

[defaults.ai]
oracle = "llama3.1:8b"
grader = "qwen2.5:14b"
graderKind = "claude-cli"
graderModel = "claude-opus-4-8"

[economy]
ranks = [
  [0, "STAR-BORN"],
  [500, "SKETCHER OF SIGNS"],
  [1000, "READER OF NIGHTS"],
  [1800, "SCRIVENER OF THE SPHERE"],
  [2800, "KEEPER OF THE LEDGER"],
  [4000, "WATCHER OF THE DEEP"],
  [5500, "ASTRARCH"],
  [7500, "THE GRAND OBSERVER"],
]
hintCost = 75
oracleCost = 10
attemptMultipliers = [1, 0.6, 0.3]
comboStep = 0.05
comboCap = 0.5
sRankMultiplier = 1.5
attackStakePerDiff = 20
attackWinPerDiff = 15

[narrative]
objective = "Read a directory of starlog files, classify every observation, count the night's events by type and severity, and emit a sealed report — both a printed chart and a JSON archive."
title = "ARCANUM // ASTRARIUM"
logo = "ASTRARIUM"
opsLabel = "OBSERVATIONS"
graderPersona = "Vaelith"
studentTerm = "apprentice"
currency = "marks"
currencyShort = "mk"
gradeScale = "S|A|B|C|D|F"
bootLines = [
  "You find yourself in a chamber of star-charts and candlelight.",
  "The air is cool and still. A figure sits at a reading desk, quill in hand.",
  "\"Another apprentice for the readings? Good. The night does not wait.\"",
  "Vaelith the Stargazer gestures at an empty stool beside a stack of observation logs.",
  "\"There are {N} nights in this tome. Each one adds a sigil to your ledger.",
  "By the last night, you will have built an Astrarium — a tool that reads",
  "the skies and seals their witness in ink and script.\"",
  "\"Sharpen your quill, apprentice. The first reading begins.\"",
]
gradingLines = [
  "\"The glass clears...\"",
  "\"Let me read the night's traces...\"",
  "\"The candle burns low as I study your work...\"",
  "\"Each observation tells a story...\"",
  "\"The quill scratches against the ledger...\"",
  "\"A moment — the stars are aligning...\"",
  "\"I weigh your sigils against the known sky...\"",
  "\"The Astrarium stirs...\"",
]
completeText = "You have sealed every night's reading. The Astrarium is whole — a tool that turns starlight into record. Vaelith nods once, a rare smile in the candlelight."

[progression]
attackTime = 180
attackStages = [0, 60, 120]
blackIceThreshold = 10
blackIcePerDiffCap = 2

[progression.earnedTheme]
id = "starforge"
name = "STARFORGE"
desc = "Proof you answered every rival who came calling — a forge of your own, kindled by victory."
