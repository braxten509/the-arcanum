id = "s08"
codename = "CHAPTER VIII // THE IRON-BOUND ITEM"
short = "The Iron-Bound Item"
title = "Item Registry, Models & Textures"
build = "ItemIngot — visible in the creative inventory with model JSON and texture"
brief = "The first real ironwork: an item the block-world can hold. You will register <code>ItemIngot</code> through <code>RegistryEvent.Register&lt;Item&gt;</code>, subscribe to <code>ModelRegistryEvent</code>, write a model JSON and a 16x16 texture, name it in the <code>.lang</code> file, and see it appear in the creative inventory. Along the way you will read <code>net.minecraft.item.Item</code> in the decompiled source — choosing which methods to override by studying the old marks."
