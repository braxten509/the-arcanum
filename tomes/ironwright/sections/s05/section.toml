id = "s05"
codename = "CHAPTER V // CONTRACTS & COLLECTIONS"
short = "Contracts & Collections"
title = "Interfaces, Generics, Enums & the Forgeable Contract"
build = "Generic Registry<T>, Forgeable interface, Metal enum — previewing IForgeRegistryEntry"
brief = "The forge runs on contracts — the shape of a thing matters more than the thing itself. Java <code>interface</code> declares what a thing can do; generics make those contracts work for any metal. You will refactor your registry into a generic <code>Registry&lt;T&gt;</code>, define a <code>Forgeable</code> interface, and write a <code>Metal</code> enum — directly previewing Minecraft's own <code>IForgeRegistryEntry&lt;T&gt;</code> and <code>RegistryEvent</code> that power every mod registration."
