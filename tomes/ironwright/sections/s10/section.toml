id = "s10"
codename = "CHAPTER X // THE SMITH'S BENCH"
short = "The Smith's Bench"
title = "Creative Tab, Recipes & Organised Ironwork"
build = "IronwrightTab + crafting recipe — items organised and craftable"
brief = "Ironwork heaped on the floor is no better than scrap. A smith's bench (Creative Tab) gathers every piece in one place, and a recipe binds raw metal into worked form. You will extend <code>CreativeTabs</code> to create <code>IronwrightTab</code>, set your items and blocks to live in it, and write a 1.12.2 recipe JSON so your ingot and block are genuinely craftable. Reconnaissance: read <code>net.minecraft.creativetab.CreativeTabs</code> and the recipe JSON spec to learn the old patterns."
