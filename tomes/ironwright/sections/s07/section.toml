id = "s07"
codename = "CHAPTER VII // THE BINDING"
short = "The Binding"
title = "@Mod, Proxies & the Mod Lifecycle"
build = "@Mod skeleton with CommonProxy/ClientProxy — the mod loads"
brief = "A man who cannot bind his work to himself has no claim on it. The <code>@Mod</code> annotation is the binding rite — it declares your ironwork to the forge's master. You will write the <code>@Mod</code> class with <code>@Mod.EventHandler</code> lifecycle methods (preInit/init/postInit), wire <code>@SidedProxy</code> to CommonProxy and ClientProxy — the two hands of the smith — and move your plain-Java data model into <code>com.ironwright</code>. The mod loads and logs: the forge knows your name."
