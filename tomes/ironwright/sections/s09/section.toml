id = "s09"
codename = "CHAPTER IX // THE CAST STONE BLOCK"
short = "The Cast Stone Block"
title = "Block Registry, Blockstates & Multi-Model Loading"
build = "BlockMetal + ItemBlock — placeable in the world with full model/texture"
brief = "Ingots are carried; blocks are placed. A cast-metal block sits in the world and speaks of the smith's art. You will register <code>BlockMetal</code> and its companion <code>ItemBlock</code> through <code>RegistryEvent.Register&lt;Block&gt;</code>, write a blockstate JSON that maps variants to models, and produce block + item-block models and textures. Reconnaissance: find and read <code>net.minecraft.block.Block</code>, <code>Material</code>, and <code>IBlockState</code> to understand what you extend."
