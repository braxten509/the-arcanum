id = "s11"
codename = "CHAPTER XI // THE WORLD ANSWERS"
short = "The World Answers"
title = "Event Handlers & the World Answering the Hammer"
build = "Event handler — a real behaviour: custom drop, interaction, or effect"
brief = "A mod that sits silent is a dead casting. The world must answer the hammer — <code>MinecraftForge.EVENT_BUS</code> and <code>@SubscribeEvent</code> let your ironwork respond when the player acts, blocks break, or the world ticks. You will write an event handler that adds a real behaviour (a custom drop or interaction effect), and in doing so learn to navigate the <code>net.minecraftforge.event</code> package. Reconnaissance: find the right event class by exploring the hierarchy — the smith-wright's eye at work."
