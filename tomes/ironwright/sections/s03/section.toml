id = "s03"
codename = "CHAPTER III // SHAPING THE INGOT"
short = "Shaping the Ingot"
title = "Classes, Objects & the Metal Domain"
build = "Ingot & Metal data classes — the seed of the mod's item model"
brief = "An ingot is not a number. It has heft, purity, a name. In Java, you shape new kinds of things with <code>class</code> — fields, constructors, <code>this</code>, and the old distinction between the pattern (<code>static</code>) and the forged copy (<code>new</code>). You will add an <code>Ingot</code> and <code>Metal</code> domain model to the project, the raw iron of the mod's data model, and a <code>Registry</code> to hold them."
