id = "s06"
codename = "CHAPTER VI // THE DEV FORGE"
short = "The Dev Forge"
title = "JDK 8, IntelliJ, Forge MDK & the Bellows"
build = "Forge dev environment — JDK 8, setupDecompWorkspace, runClient with a trivial @Mod"
brief = "A smith needs a forge before he can strike metal. Here you install the real tools: JDK 8 (the old iron that 1.12.2 requires), IntelliJ IDEA as the smith's bench, and the Forge MDK — the forge's own manuals. You will run <code>setupDecompWorkspace</code> and <code>genIntellijRuns</code>, light the bellows (Gradle), and fire the coals (<code>runClient</code>). Reconnaissance begins in earnest: <code>Go to Class</code>, <code>Find Usages</code>, <code>Search Everywhere</code> — the tools of the smith-wright's eye."
