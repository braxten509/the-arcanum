title = "Inheritance, Packages & Reading the Class Hierarchy"
build = "Ingot hierarchy — extends, packages, and a first read of net.minecraft.item.Item"
brief = "A smith's apprentice learns that every piece descends from an older pattern. Java's <code>extends</code> and <code>super</code> let your classes inherit from ancestors — and <code>Object</code> is the root anvil from which all things are struck. You will build an <code>Ingot</code> hierarchy (base metal, alloy) while reading <code>net.minecraft.item.Item</code>'s real class tree in IntelliJ: your first conscious reconnaissance of the old marks."
