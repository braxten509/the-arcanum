id = "s02"
codename = "CHAPTER II // FLOW & METHODS"
short = "Flow & Methods"
title = "Control Flow, Methods & the Command Loop"
build = "Metallurgy command-loop — the CLI grows a dispatcher"
brief = "The apprentice who only strikes straight learns nothing of the craft. Here you learn the smith's conditional eye — <code>if</code>, <code>else</code>, and the cycles of the hammer (<code>while</code>, <code>for</code>, <code>switch</code>) — and you forge your first methods, the named techniques a smith keeps in the head. The Ironwright CLI grows a command loop that parses forge-commands and dispatches them to methods."
