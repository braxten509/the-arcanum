brief = "Every forge starts with a single spark. In this forgework you will learn the tongue of the old smiths — Java — from its first embers: variables, types, and the iron law of the printed line. You will stand up the <code>Ironwright</code> seed in your working directory, the front door of the whole operation. And you will take your first glance at the block-world's own marks — <code>net.minecraft</code> — so you see the road ahead."
