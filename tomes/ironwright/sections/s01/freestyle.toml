[freestyle]
title = "THE WORKING: The Front Door"
brief = "Apprentice, stand up the forge's front door. In your working directory create <code>Ironwright.java</code> — the seed every later forgework grows from. It must do exactly this:<ul><li>Print the greeting line <code>IRONWRIGHT // forge ready</code> as the very first output.</li><li>Read one line from standard input (the apprentice's command).</li><li>Print <code>COMMAND </code> followed by that line — for example, if the input is <code>forge iron</code>, print <code>COMMAND forge iron</code>.</li><li>One file, one <code>public class Ironwright</code>, the file named <code>Ironwright.java</code>.</li></ul>"
reward = 150
xray = "Orrick docks for a missing or mistyped greeting line, an echo that hardcodes a command instead of reading stdin, or a class name that does not match the file. He gives style credit for Allman braces (opening brace on its own line), 4-space indent, camelCase locals, and the class/file name matching exactly."

[freestyle.badge]
id = "badge-s01"
name = "FIRST SPARK"
desc = "Stood up the forge's front door — the Ironwright seed that greets and answers."

[[freestyle.rubric]]
criterion = "Compiles & runs"
weight = 25
desc = "javac Ironwright.java succeeds with no errors and java Ironwright runs without crashing on a single line of piped input."

[[freestyle.rubric]]
criterion = "Greeting line exact"
weight = 25
desc = "The program's first output line is exactly IRONWRIGHT // forge ready — same case, same spacing, same // marker."

[[freestyle.rubric]]
criterion = "Reads stdin & echoes the command"
weight = 30
desc = "Reads one line from System.in with a Scanner and prints COMMAND followed by that line; the echo uses the read value, not a hardcoded string."

[[freestyle.rubric]]
criterion = "Clean Java style"
weight = 20
desc = "One public class named Ironwright in Ironwright.java; camelCase for locals (command, in); 4-space indentation; Allman braces (the opening { on its own line); package-free for now; the import java.util.Scanner; sits above the class."
