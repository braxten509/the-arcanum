briefs = [
  "Test the ingots' equality. Print «a == b <true/false>» (reference equality), «a.equals(b) <true/false>», «a.equals(c) <true/false>» — computed, not hardcoded.",
  "Append «SAME <count of pairs where equals is true, among a-b, a-c, b-c>» and «DIFF <count where equals is false>».",
  "Append «MATCH a b» if a.equals(b) else «MISMATCH a b», then «EQUAL MARK SET».",
]
solution = '''
public class Ironwright {
    public static void main(String[] args) {
        Ingot a = new Ingot("iron", 8), b = new Ingot("iron", 8), c = new Ingot("copper", 6);
        System.out.println("a == b " + (a == b));
        System.out.println("a.equals(b) " + (a.equals(b)));
        System.out.println("a.equals(c) " + (a.equals(c)));
        int same = 0, diff = 0;
        if (a.equals(b)) same++; else diff++;
        if (a.equals(c)) same++; else diff++;
        if (b.equals(c)) same++; else diff++;
        System.out.println("SAME " + same);
        System.out.println("DIFF " + diff);
        System.out.println(a.equals(b) ? "MATCH a b" : "MISMATCH a b");
        System.out.println("EQUAL MARK SET");
    }
}
class Ingot {
    String name;
    int value;
    Ingot(String name, int value) { this.name = name; this.value = value; }
    public boolean equals(Object o) {
        if (!(o instanceof Ingot)) return false;
        Ingot i = (Ingot) o;
        return name.equals(i.name) && value == i.value;
    }
}
'''
