]
solution = '''
public class Ironwright {
    public static void main(String[] args) {
        int[] bars = { 4, 6, 8 };
        int total = 0, peak = 0, even = 0;
        for (int n : bars) {
            int t = temper(n);
            System.out.println("BAR " + n + " -> " + t);
            total += t;
            if (t > peak) peak = t;
            if (t % 2 == 0) even++;
        }
        System.out.println("STRUCK " + bars.length);
        System.out.println("TOTAL " + total);
        System.out.println("PEAK " + peak);
        System.out.println("EVEN " + even);
        System.out.println("METHOD DONE");
    }
    static int temper(int n) { return n * 3 - 2; }
}
