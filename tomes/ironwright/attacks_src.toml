  "Append «FORGEABLE <count of metals with melt >= 1500>» and «ENUM SET».",
]
solution = '''
public class Ironwright {
    public static void main(String[] args) {
        Metal[] metals = Metal.values();
        for (Metal m : metals) System.out.println("METAL " + m + " " + m.value + "em " + m.melt + "C");
        System.out.println("ROLL " + metals.length);
        Metal hottest = metals[0], dearest = metals[0];
        for (Metal m : metals) {
            if (m.melt > hottest.melt) hottest = m;
            if (m.value > dearest.value) dearest = m;
        }
        System.out.println("HOTTEST " + hottest);
        System.out.println("DEAREST " + dearest);
        int forgeable = 0;
        for (Metal m : metals) if (m.melt >= 1500) forgeable++;
        System.out.println("FORGEABLE " + forgeable);
        System.out.println("ENUM SET");
    }
}
enum Metal {
    IRON(8, 1500), COPPER(6, 1085), STARSTEEL(20, 2200);
    int value, melt;
    Metal(int value, int melt) { this.value = value; this.melt = melt; }
}
