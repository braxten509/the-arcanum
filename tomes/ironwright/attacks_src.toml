[[challenge]]
tier = 4
title = "THE PACKAGE PATH"
starter = '''
public class Ironwright {
    public static void main(String[] args) {
        String[] classes = {
            "net.minecraft.item.Item",
            "net.minecraft.block.Block",
            "com.ironwright.item.Item"
        };
        // THE FIRST STRIKE is set. Further demands may arm as the glass runs.
    }
}
'''
briefs = [
  "For each class print its simple name (the text after the last '.') as «SIMPLE <name>», then «CLASSES 3» (count from the array, computed).",
  "Append «MOD <count of classes under com.ironwright>» and «VANILLA <count under net.minecraft>».",
  "Append «SHARED <count of classes whose simple name also appears in another class>» (the two Item classes share their simple name), then «PATHS DONE».",
]
solution = '''
public class Ironwright {
    public static void main(String[] args) {
        String[] classes = { "net.minecraft.item.Item", "net.minecraft.block.Block", "com.ironwright.item.Item" };
        for (String cls : classes) System.out.println("SIMPLE " + cls.substring(cls.lastIndexOf('.') + 1));
        System.out.println("CLASSES " + classes.length);
        int mod = 0, vanilla = 0;
        for (String cls : classes) {
            if (cls.startsWith("com.ironwright")) mod++;
            if (cls.startsWith("net.minecraft")) vanilla++;
        }
        System.out.println("MOD " + mod);
        System.out.println("VANILLA " + vanilla);
        int shared = 0;
        for (int i = 0; i < classes.length; i++)
            for (int j = 0; j < classes.length; j++)
                if (i != j && simple(classes[i]).equals(simple(classes[j]))) { shared++; break; }
        System.out.println("SHARED " + shared);
        System.out.println("PATHS DONE");
    }
    static String simple(String cls) { return cls.substring(cls.lastIndexOf('.') + 1); }
}
'''
