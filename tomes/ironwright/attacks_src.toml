# Reference solutions for IRONWRIGHT's SPELL DUEL bank (Java 8, this tome's language).
# tools/gen_attacks.py runs each `solution` through this tome's runtime via
# /api/runsnippet, slices the verified stdout into the cumulative per-stage `expect`
# blocks, and writes generated/attacks.toml. Regenerate:  python3 tools/gen_attacks.py
# ironwright   (server running). Never hand-edit generated/attacks.toml.
#
# Every solution is a single-file `public class Ironwright` with a main method (it
# matches [runtime].entryFile = Ironwright.java, so `javac Ironwright.java && java
# Ironwright` runs it). Minigames never enter the Forge workspace — they run plain
# Java in the engine's scratch dir, so even the mod-op tiers (6-9) drill the mod's
# PATTERNS in plain Java: lifecycle ordering, registry maps, model/blockstate JSON
# emission, reconnaissance ("reading the old marks" as string parsing). No Forge or
# Minecraft APIs are available in the scratch dir; none are used.
#
# Tier N unlocks after N forgeworks are passed, so a tier's demands stay within the
# concepts taught by that point in the syllabus. Each challenge has exactly 3 stages
# (matching [progression].attackStages = [0, 60, 120]); each stage strictly APPENDS
# lines — stages[n].expect == stages[n-1].expect + new lines, never edits.
#
# Voice: Orrick's forge — rivals come to the forge, not the wizard's tower. Titles,
# briefs, and every printed token carry the smith's tongue (ingot, anvil, belloys,
# cast stone, the binding, the old marks, the smith-wright's eye). No magic/mana
# cant, no borrowed wizard-arc titles.

# ---- Tier 1 — the first spark (variables, types, String, println, operators)
[[challenge]]
tier = 1
title = "THE COLD ANVIL"
starter = '''
public class Ironwright {
    public static void main(String[] args) {
        int iron = 8, copper = 6, starsteel = 20;
        // THE FIRST STRIKE is set. Further demands may arm as the glass runs.
    }
}
'''
briefs = [
  "Strike the first marking. Print «INGOT iron @ 8em», «INGOT copper @ 6em», «INGOT starsteel @ 20em» — woven from the variables, values not hardcoded.",
  "Append «TOTAL <iron+copper+starsteel>em» and «COUNT 3 INGOTS» — the count from the array of metals, computed.",
  "Append «DEAREST <name of the highest-value metal>» (computed) and «ANVIL SET».",
]
solution = '''
public class Ironwright {
    public static void main(String[] args) {
        int iron = 8, copper = 6, starsteel = 20;
        int[] values = { iron, copper, starsteel };
        String[] names = { "iron", "copper", "starsteel" };
        for (int i = 0; i < names.length; i++)
            System.out.println("INGOT " + names[i] + " @ " + values[i] + "em");
        int total = iron + copper + starsteel;
        System.out.println("TOTAL " + total + "em");
        System.out.println("COUNT " + names.length + " INGOTS");
        int dv = values[0]; String dearest = names[0];
        for (int i = 1; i < names.length; i++) if (values[i] > dv) { dv = values[i]; dearest = names[i]; }
        System.out.println("DEAREST " + dearest);
        System.out.println("ANVIL SET");
    }
}
'''
