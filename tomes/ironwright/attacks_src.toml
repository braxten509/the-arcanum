solution = '''
import java.util.*;
public class Ironwright {
    public static void main(String[] args) {
        Map<String, String> mcp = new LinkedHashMap<>();
        mcp.put("field_7777_a", "maxStackSize");
        mcp.put("func_1111_b", "getUnlocalizedName");
        mcp.put("field_8888_c", "unlocalizedName");
        String[] srgs = { "field_7777_a", "func_1111_b", "field_8888_c" };
        for (String s : srgs) System.out.println(s + " -> " + mcp.get(s));
        System.out.println("MARKS " + srgs.length);
        int fields = 0, funcs = 0;
        for (String s : srgs) {
            if (s.startsWith("field")) fields++;
            if (s.startsWith("func")) funcs++;
        }
        System.out.println("FIELDS " + fields);
        System.out.println("FUNCS " + funcs);
        String longest = "";
        for (String s : srgs) if (mcp.get(s).length() > longest.length()) longest = mcp.get(s);
        System.out.println("LONGEST " + longest);
        System.out.println("TRANSLATION DONE");
    }
}
