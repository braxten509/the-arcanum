briefs = [
  "Read the batch polymorphically. Print each ingot's toString (one line per ingot), then «BATCH 3» (count from the array, computed).",
  "Append «ALLOYS <count of IngotAlloy, use instanceof>» and «PURE <count of plain Ingot that are not alloys>».",
  "Append «HEAVIEST <toString of the highest-value ingot>» and «ANVIL DONE».",
]
solution = '''
public class Ironwright {
    public static void main(String[] args) {
        Ingot[] batch = {
            new Ingot("iron", 8),
            new IngotAlloy("starsteel", 20, new String[]{"iron", "coal"}),
            new Ingot("copper", 6)
        };
        for (Ingot g : batch) System.out.println(g);
        System.out.println("BATCH " + batch.length);
        int alloys = 0, pure = 0;
        for (Ingot g : batch) { if (g instanceof IngotAlloy) alloys++; else pure++; }
        System.out.println("ALLOYS " + alloys);
        System.out.println("PURE " + pure);
        Ingot heavy = batch[0];
        for (Ingot g : batch) if (g.value > heavy.value) heavy = g;
        System.out.println("HEAVIEST " + heavy);
        System.out.println("ANVIL DONE");
    }
}
class Ingot {
    String name;
    int value;
    Ingot(String name, int value) { this.name = name; this.value = value; }
    public String toString() { return name + " @ " + value + "em"; }
}
class IngotAlloy extends Ingot {
    String[] parts;
    IngotAlloy(String name, int value, String[] parts) { super(name, value); this.parts = parts; }
    public String toString() { return super.toString() + " (" + String.join("+", parts) + ")"; }
}
