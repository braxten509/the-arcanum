  "Append «HAS maxStackSize <true/false>» (does any field equal maxStackSize) and «EYE DONE».",
]
solution = '''
public class Ironwright {
    public static void main(String[] args) {
        String src = "public int maxStackSize;public String unlocalizedName;public void onCreated(){}";
        String[] parts = src.split(";");
        int fields = 0, methods = 0;
        boolean hasMax = false;
        for (String p : parts) {
            if (p.indexOf('(') < 0) {
                String[] toks = p.trim().split(" ");
                String name = toks[toks.length - 1];
                System.out.println("FIELD " + name);
                fields++;
                if (name.equals("maxStackSize")) hasMax = true;
            } else methods++;
        }
        System.out.println("READ " + fields);
        System.out.println("METHODS " + methods);
        System.out.println("MEMBERS " + parts.length);
        System.out.println("HAS maxStackSize " + hasMax);
        System.out.println("EYE DONE");
    }
}
'''
