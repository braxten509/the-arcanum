# ---- Tier 5 — contracts & collections (interfaces, generics, List/Map, enums)
[[challenge]]
tier = 5
title = "THE FORGEABLE CONTRACT"
starter = '''
import java.util.*;
public class Ironwright {
    public static void main(String[] args) {
        List<Forgeable> batch = new ArrayList<>(Arrays.asList(
            new Ingot("iron", 8), new Ingot("copper", 6), new Ingot("starsteel", 20)));
        // THE FIRST STRIKE is set. Further demands may arm as the glass runs.
    }
}
interface Forgeable { int forgeValue(); String forgeName(); }
class Ingot implements Forgeable {
    String name; int value;
    Ingot(String n, int v) { name = n; value = v; }
    public int forgeValue() { return value; }
    public String forgeName() { return name; }
}
'''
briefs = [
  "Read the batch through the contract. Print «FORGE <forgeName()> <forgeValue()>em» per item, then «BATCH 3» (count from the list, computed).",
  "Append «TOTAL <sum of forgeValue()>em» and «DEAREST <forgeName() of the highest-value item>».",
  "Append «MEAN <sum/count, integer division>em» and «CONTRACT SET».",
]
solution = '''
import java.util.*;
public class Ironwright {
    public static void main(String[] args) {
        List<Forgeable> batch = new ArrayList<>(Arrays.asList(
            new Ingot("iron", 8), new Ingot("copper", 6), new Ingot("starsteel", 20)));
        for (Forgeable f : batch) System.out.println("FORGE " + f.forgeName() + " " + f.forgeValue() + "em");
        System.out.println("BATCH " + batch.size());
        int sum = 0, max = 0;
        String dearest = "";
        for (Forgeable f : batch) {
            sum += f.forgeValue();
            if (f.forgeValue() > max) { max = f.forgeValue(); dearest = f.forgeName(); }
        }
        System.out.println("TOTAL " + sum + "em");
        System.out.println("DEAREST " + dearest);
        System.out.println("MEAN " + (sum / batch.size()) + "em");
        System.out.println("CONTRACT SET");
    }
}
interface Forgeable { int forgeValue(); String forgeName(); }
class Ingot implements Forgeable {
    String name; int value;
    Ingot(String n, int v) { name = n; value = v; }
    public int forgeValue() { return value; }
    public String forgeName() { return name; }
}
