public class Ironwright {
    public static void main(String[] args) {
        Ingot[] reg = { new Ingot("iron", 8), new Ingot("copper", 6), new Ingot("starsteel", 20) };
        String query = "copper";
        for (Ingot g : reg) System.out.println("REG " + g.name + " " + g.value + "em");
        System.out.println("KEYS " + reg.length);
        Ingot found = null;
        for (Ingot g : reg) if (g.name.equals(query)) { found = g; break; }
