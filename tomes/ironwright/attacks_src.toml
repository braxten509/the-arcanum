# ---- Tier 2 — flow & methods (loops, if/else, while, switch, methods)
[[challenge]]
tier = 2
title = "THE BELLOWS' CYCLE"
starter = '''
public class Ironwright {
    public static void main(String[] args) {
        int[] heats = { 3, 7, 2, 9 };
        // THE FIRST STRIKE is set. Further demands may arm as the glass runs.
    }
}
'''
briefs = [
  "Pump the bellows over each heat. Print «PUMP <n> <h>» (1-based n) per heat, then «CYCLE 4» (count from the array, computed).",
  "Append «HOTTEST <max heat>» and «MEAN <sum/count, integer division>».",
  "Append «READY <count of heats >= 5>» and «BELLOWS DONE».",
]
solution = '''
public class Ironwright {
    public static void main(String[] args) {
        int[] heats = { 3, 7, 2, 9 };
        int max = 0, sum = 0, ready = 0;
        for (int i = 0; i < heats.length; i++) {
            System.out.println("PUMP " + (i + 1) + " " + heats[i]);
            if (heats[i] > max) max = heats[i];
            sum += heats[i];
            if (heats[i] >= 5) ready++;
        }
        System.out.println("CYCLE " + heats.length);
        System.out.println("HOTTEST " + max);
        System.out.println("MEAN " + (sum / heats.length));
        System.out.println("READY " + ready);
        System.out.println("BELLOWS DONE");
    }
}
'''
