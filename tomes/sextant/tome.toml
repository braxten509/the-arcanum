[meta]
id = "sextant"
name = "Sextant — Idiomatic Python at the Helm"
description = "Build Sextant, a stdlib-only log-analytics CLI, in 8 bearings — from a Python refresher through generators, decorators, descriptors, and a multi-format CLI report tool."
author = "Aldren the Chart-Keeper"
version = "0.1.0"
favicon = "λ"

[runtime]
name = "python"
project = "Sextant"
language = "Python"

[content]
sections = ["s01", "s02", "s03", "s04", "s05", "s06", "s07", "s08"]

[defaults]
theme = "signature"

[defaults.ai]
oracle = "llama3.1:8b"
grader = "qwen2.5:14b"
graderKind = "claude-cli"
graderModel = "claude-opus-4-8"

[economy]
ranks = [[0, "LANDLUBBER"], [400, "CABIN BOY"], [800, "LOOKOUT"], [1300, "NAVIGATOR"], [1900, "CHART-KEEPER"], [2600, "FIRST MATE"], [3500, "CAPTAIN"]]
hintCost = 50
oracleCost = 10
attemptMultipliers = [1, 0.6, 0.3]
comboStep = 0.05
comboCap = 0.5
sRankMultiplier = 1.5
attackStakePerDiff = 20
attackWinPerDiff = 15

[narrative]
objective = "Build Sextant — a single-file, stdlib-only CLI that walks a directory of plain-text logs, parses each record into a typed LogRecord, streams records through generator pipelines, and emits a multi-format report (text, JSON, CSV) via argparse subcommands."
title = "ARCANUM // SEXTANT"
logo = "SEXTANT"
opsLabel = "BEARINGS"
graderPersona = "Aldren"
studentTerm = "navigator"
currency = "tally"
currencyShort = "tl"
gradeScale = "S|A|B|C|D|F"
bootLines = [
  "The glass is set — the night sky is clear above the chart-room.",
  "You have signed the commission: {N} bearings to plot, one instrument to complete.",
  "I am Aldren, your senior chart-keeper. I have consulted the language's own volumes, and the charts are true.",
  "You will build Sextant — a real tool that reads real logs, parses real records, and reports what it finds.",
  "A sextant does not guess. We do not submit fog-maps here — only what runs against real files.",
  "Every bearing adds one more instrument to the chart-table. By the final bearing, those instruments compose the whole.",
  "When the work feels thick, consult the volumes: the stdlib source is the truest reference a navigator has.",
  "The currents are true and the stars hold steady. Take the first bearing.",
]
gradingLines = [
  "Taking a sight…",
  "Fixing the position…",
  "Consulting the chart-room's own volumes…",
  "Plotting the bearing…",
  "Checking the sextant's arc…",
  "Reading the vernier scale…",
  "Verifying against the almanac…",
  "Reconnaissance is complete. Here is the bearing.",
]
completeText = "All bearings are plotted. Sextant is whole — the instrument reads real logs, parses real records, and speaks in text, JSON, or CSV as the operator commands. The chart-room's own volumes are open to you now; wherever the currents take you, you know how to read the source and plot your own course."

[progression]
attackTime = 180
attackStages = [0, 60, 120]
blackIceThreshold = 10
blackIcePerDiffCap = 2

[progression.earnedTheme]
id = "starlit-folio"
name = "STARLIT FOLIO"
desc = "Proof you answered every rival who came calling."
