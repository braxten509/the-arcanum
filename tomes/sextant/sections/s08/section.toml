id = "s08"
codename = "CHAPTER VIII // JOINING THE SECTIONS"
short = "Joining the Sections"
title = "Composition & the Final CLI"
build = "CLI — python -m sextant with argparse subcommands, JSON/CSV output, and the finished artifact"
brief = "<p>The final bearing. Every instrument mounted on the chart-table across seven bearings — the typed data model, the streaming parser, the decorator registry, the descriptor-validated fields, the context-manager timing, the <code>stdlib</code> aggregators — composes into one command. <code>python -m sextant &lt;dir&gt; --format json --plugin warn</code>. A real CLI that a real operator runs on real logs.</p><p>This bearing is about <strong>composition</strong>: how modules fit together into a package, how <code>argparse</code> subcommands give the tool a professional interface, how <code>json</code> and <code>csv</code> emit report data in the formats other tools consume, and how the <code>if __name__ == \"__main__\"</code> guard makes the module importable and runnable. Every design decision from s01 through s07 meets here, and the sum is greater than the parts: the Sextant is whole.</p>"
