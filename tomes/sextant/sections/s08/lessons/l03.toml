[[lessons]]
id = "s08-l03"
title = "Output Formats — json, csv, and the Chart-Keeper's Dispatch"
body = '''
<p>A CLI that only prints text is useful to a human. A CLI that prints <strong>formattable output</strong> — JSON for other programs, CSV for spreadsheets, plain text for the terminal — is a tool that fits into a pipeline. Python's <code>json</code> and <code>csv</code> modules are the dispatch writers for these formats.</p>
<p><strong>JSON output</strong> uses <code>json.dump()</code> to write a list of dicts. Each <code>LogRecord</code> becomes a dict via <code>dataclasses.asdict()</code>:</p>
<pre><code><span class="kn">import</span> <span class="nn">json</span>
<span class="kn">from</span> <span class="nn">dataclasses</span> <span class="kn">import</span> <span class="n">asdict</span>

<span class="k">def</span> <span class="nf">report_json</span><span class="p">(</span><span class="n">records</span>: <span class="nb">list</span>[<span class="n">LogRecord</span>], <span class="n">path</span>: <span class="nb">str</span>):
    data = [asdict(r) <span class="k">for</span> r <span class="ow">in</span> records]
    <span class="k">with</span> <span class="nb">open</span>(path, <span class="s">"w"</span>) <span class="k">as</span> <span class="n">f</span>:
        json.dump(data, f, indent=<span class="mi">2</span>)</code></pre>
<p>The <code>indent=2</code> parameter makes the output human-readable. Without it, <code>json.dump</code> produces a compact single-line output that is machine-efficient but unreadable. The standard also supports <code>sort_keys=True</code> for deterministic output and <code>default=str</code> for serialising non-JSON types like datetimes.</p>
<p><strong>CSV output</strong> uses <code>csv.writer</code> or <code>csv.DictWriter</code>. DictWriter is convenient because it maps field names to columns:</p>
<pre><code><span class="kn">import</span> <span class="nn">csv</span>

<span class="k">def</span> <span class="nf">report_csv</span><span class="p">(</span><span class="n">records</span>: <span class="nb">list</span>[<span class="n">LogRecord</span>], <span class="n">path</span>: <span class="nb">str</span>):
    <span class="n">fieldnames</span> = [<span class="s">"ts"</span>, <span class="s">"level"</span>, <span class="s">"message"</span>, <span class="s">"source"</span>]
    <span class="k">with</span> <span class="nb">open</span>(path, <span class="s">"w"</span>, newline=<span class="s">""</span>) <span class="k">as</span> <span class="n">f</span>:
        writer = csv.DictWriter(f, fieldnames=fieldnames)
        writer.writeheader()
        <span class="k">for</span> r <span class="ow">in</span> records:
            writer.writerow(asdict(r))</code></pre>
<p>The <code>newline=""</code> parameter on the file open is essential — without it, CSV on some platforms inserts blank lines between rows (the csv module handles its own line endings).</p>
<p><strong>Dispatch pattern:</strong> A dict maps format names to output functions:</p>
<pre><code>REPORTERS = {
    <span class="s">"text"</span>: report_text,
    <span class="s">"json"</span>: report_json,
    <span class="s">"csv"</span>: report_csv,
}

<span class="k">def</span> <span class="nf">write_report</span><span class="p">(</span><span class="n">records</span>, <span class="n">fmt</span>: <span class="nb">str</span>, <span class="n">path</span>: <span class="nb">str</span>):
    <span class="n">REPORTERS</span>[<span class="n">fmt</span>](records, path)</code></pre>
<p>This pattern — a dict of callables — is the Pythonic replacement for a long <code>if/elif</code> chain. Adding a new format means writing a function and adding it to the dict; no other code changes. Sextant's plugin registry (s04) follows the same philosophy.</p>
<div class="callout"><strong>Consult the volumes:</strong> The <code>json</code> module is at <code>Lib/json/__init__.py</code>. It is a recursive-descent encoder — reading its <code>JSONEncoder.default()</code> method shows how to extend serialisation to custom types. The <code>csv</code> module at <code>Lib/csv.py</code> documents its dialect system, which handles the many CSV variants in the wild.</div>
'''

[[lessons.exercises]]
id = "s08-l03-e1"
type = "mc"
points = 15
prompt = "What does <code>json.dump(obj, f, indent=2)</code> produce?"
choices = ["Human-readable JSON with 2-space indentation", "Compact JSON without any whitespace", "JSON with tabs instead of spaces", "A syntax error — indent requires a string"]
answer = 0
whyWrong = "The <code>indent</code> parameter controls pretty-printing. With <code>indent=2</code>, <code>json.dump</code> adds newlines and 2-space indentation for nested structures. Without it, the output is compact. The indent value must be a non-negative integer (or a string for custom indentation)."
hint = "What does the 'indent' parameter literally add to the output?"
explain = "json.dump with indent=2 produces human-readable JSON with 2-space indentation per level."

[[lessons.exercises]]
id = "s08-l03-e2"
type = "text"
points = 20
prompt = "What argument is required when opening a file for CSV writing to prevent blank lines?"
answer = "newline=''"
accept = ["newline=\"\"", "newline=''"]
hint = "It controls how universal newline translation affects the file — setting it to empty string avoids double line spacing."

[[lessons.exercises]]
id = "s08-l03-e3"
type = "fill"
points = 20
prompt = "Fill the blank to convert a dataclass instance to a dict for JSON serialisation:"
code = '''from dataclasses import asdict
record = LogRecord(ts="now", level="INFO", message="ok", source="sys")
data = ____(record)'''
answer = "asdict"
hint = "The function name is short for 'as dictionary' — it converts a dataclass to a dict recursively."

[[lessons.exercises]]
id = "s08-l03-w1"
type = "write"
points = 35
prompt = "Write a script that creates a list of dicts <code>data = [{\"name\": \"Aldren\"}, {\"name\": \"Navigator\"}]</code> and writes it to a file <code>\"output.json\"</code> using <code>json.dump</code> with <code>indent=2</code>. Then read the file back and print its content."
starter = '''
import json

data = [{"name": "Aldren"}, {"name": "Navigator"}]
with open("output.json", "w") as f:
    json.dump(data, f, indent=2)

with open("output.json") as f:
    print(f.read())
'''
expect = '''[
  {
    "name": "Aldren"
  },
  {
    "name": "Navigator"
  }
]'''
hint = "The script is already complete — just run it to see the formatted JSON output."
