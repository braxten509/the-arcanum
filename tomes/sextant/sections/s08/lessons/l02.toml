[[lessons]]
id = "s08-l02"
title = "The Helm — argparse & Subcommands"
body = '''
<p><code>argparse</code> is the stdlib's command-line argument parser. For a simple flag you can use <code>sys.argv</code>, but for a professional CLI with subcommands (<code>summary</code>, <code>tail</code>, <code>export</code>), optional flags (<code>--format</code>, <code>--plugin</code>), and help text, <code>argparse</code> is the standard. It generates <code>--help</code> automatically, validates types, and parses subcommands into namespaces.</p>
<pre><code><span class="kn">import</span> <span class="nn">argparse</span>

<span class="k">def</span> <span class="nf">build_parser</span><span class="p">()</span> <span class="o">-></span> <span class="n">argparse</span>.<span class="n">ArgumentParser</span>:
    parser = argparse.ArgumentParser(
        prog=<span class="s">"sextant"</span>,
        description=<span class="s">"A log-analytics CLI — read real logs, get real reports."</span>
    )
    parser.add_argument(<span class="s">"dir"</span>, help=<span class="s">"Log directory to scan"</span>)
    parser.add_argument(<span class="s">"--format"</span>, choices=[<span class="s">"text"</span>, <span class="s">"json"</span>, <span class="s">"csv"</span>], default=<span class="s">"text"</span>)
    <span class="k">return</span> parser</code></pre>
<p>For <strong>subcommands</strong>, use <code>add_subparsers()</code>. Each subcommand gets its own argument set, its own help text, and its own handler function:</p>
<pre><code><span class="k">def</span> <span class="nf">build_parser</span><span class="p">():</span>
    parser = argparse.ArgumentParser(prog=<span class="s">"sextant"</span>)
    sub = parser.add_subparsers(dest=<span class="s">"command"</span>, required=<span class="kc">True</span>)

    summary = sub.add_parser(<span class="s">"summary"</span>, help=<span class="s">"Per-level and per-source counts"</span>)
    summary.add_argument(<span class="s">"dir"</span>, help=<span class="s">"Log directory"</span>)
    summary.add_argument(<span class="s">"--top"</span>, <span class="nb">type</span>=<span class="nb">int</span>, default=<span class="mi">3</span>, help=<span class="s">"Number of top sources"</span>)

    tail = sub.add_parser(<span class="s">"tail"</span>, help=<span class="s">"Last N records"</span>)
    tail.add_argument(<span class="s">"dir"</span>, help=<span class="s">"Log directory"</span>)
    tail.add_argument(<span class="s">"-n"</span>, <span class="nb">type</span>=<span class="nb">int</span>, default=<span class="mi">10</span>, help=<span class="s">"Number of records"</span>)

    export = sub.add_parser(<span class="s">"export"</span>, help=<span class="s">"Export in specified format"</span>)
    export.add_argument(<span class="s">"dir"</span>)
    export.add_argument(<span class="s">"--format"</span>, choices=[<span class="s">"json"</span>, <span class="s">"csv"</span>], required=<span class="kc">True</span>)
    <span class="k">return</span> parser</code></pre>
<p>The <code>dest="command"</code> parameter stores the subcommand name in <code>args.command</code>. After parsing, dispatch based on its value:</p>
<pre><code><span class="k">def</span> <span class="nf">main</span><span class="p">():</span>
    args = build_parser().parse_args()
    <span class="k">if</span> args.command == <span class="s">"summary"</span>:
        run_summary(args.dir, top=args.top)
    <span class="k">elif</span> args.command == <span class="s">"tail"</span>:
        run_tail(args.dir, n=args.n)
    <span class="k">elif</span> args.command == <span class="s">"export"</span>:
        run_export(args.dir, fmt=args.format)

<span class="k">if</span> <span class="n">__name__</span> == <span class="s">"__main__"</span>:
    main()</code></pre>
<p>The <code>if __name__ == "__main__"</code> guard is critical: it lets other modules import <code>main.py</code> without triggering the CLI. Without it, importing the module for testing would run the argument parser, which would fail if no arguments are provided.</p>
<div class="callout"><strong>Consult the volumes:</strong> The <code>argparse</code> module is at <code>Lib/argparse.py</code> — a single file, ~2500 lines of pure Python. It is an excellent example of how to build a fluent API (method chaining) on top of a complex domain (argument parsing). The tutorial in the Python docs is the best place to start.</div>
'''

[[lessons.exercises]]
id = "s08-l02-d1"
type = "type"
points = 12
reps = 2
prompt = "Retype this argparse pattern:"
code = '''import argparse

parser = argparse.ArgumentParser(prog="sextant")
parser.add_argument("dir", help="Log directory")
parser.add_argument("--format", choices=["text", "json", "csv"])
args = parser.parse_args()'''

[[lessons.exercises]]
id = "s08-l02-e1"
type = "mc"
points = 15
prompt = "What parameter of <code>add_subparsers()</code> stores the subcommand name in the args namespace?"
choices = ["dest", "name", "key", "subcommand"]
answer = 0
whyWrong = "The <code>dest</code> parameter of <code>add_subparsers()</code> specifies the attribute name where the parsed subcommand is stored. With <code>dest='command'</code>, you access <code>args.command</code> to dispatch."
hint = "Think of the attribute name in the namespace — it is set by the 'destination' parameter."
explain = "The 'dest' parameter of add_subparsers() stores the subcommand name in args."

[[lessons.exercises]]
id = "s08-l02-e2"
type = "fill"
points = 20
prompt = "Fill the blank to make the subparser required:"
code = '''sub = parser.add_subparsers(dest="cmd", ____=True)'''
answer = "required"
hint = "Without this, argparse does not error when no subcommand is given — it just returns None."

[[lessons.exercises]]
id = "s08-l02-w1"
type = "write"
points = 35
prompt = "Write a script that uses <code>argparse</code> to accept a positional argument <code>name</code> and an optional <code>--greeting</code> flag (default <code>\"Hello\"</code>). Print <code>f\"{greeting}, {name}!\"</code>. Use the <code>if __name__ guard</code>. Run it by calling <code>main()</code> directly with simulated args using <code>parse_args([\"World\"])</code>."
starter = '''
import argparse

def build_parser():
    parser = argparse.ArgumentParser()
    parser.add_argument("name")
    parser.add_argument("--greeting", default="Hello")
    return parser

def main():
    parser = build_parser()
    args = parser.parse_args(["--greeting", "Ahoy", "World"])
    print(f"{args.greeting}, {args.name}!")

if __name__ == "__main__":
    main()
'''
expect = '''Ahoy, World!'''
hint = "parse_args() accepts a list of strings for testing — pass your test args there."
