[freestyle]
title = "THE WORKING: LINES OF LATITUDE"
brief = "<p>Replace the one-line-at-a-time approach with a streaming generator pipeline. Sextant must:</p><ul><li>Write a generator function <code>read_logs(path: str) -> Iterator[LogRecord]</code> that <code>yield</code>s <code>LogRecord</code> instances one at a time — never calling <code>.read()</code> or <code>.readlines()</code></li><li>Write a second generator <code>filter_by_level(records: Iterator[LogRecord], level: str) -> Iterator[LogRecord]</code> that yields only records matching the given level</li><li>Use <code>itertools.islice</code> in <code>main.py</code> to show the first 5 records (proving lazy iteration — a 1 GB file still prints instantly)</li><li>Print each filtered record: <code>[{record.level}] {record.message}</code></li><li>Handle the case where <code>path</code> does not exist: print <code>BEARING OFF — no such file</code> and exit, but <strong>do not crash</strong></li></ul><p>The streaming parser is the difference between a toy and a tool. If Sextant can handle a file larger than RAM, this bearing is sealed.</p>"
reward = 170
xray = "The grader docks points for: calling .read() or .readlines() (slurping); materialising a list inside the generator; catching BaseException; not using itertools.islice to prove lazy iteration. He gives style credit for: composing generators with 'yield from' where it fits; using Iterator type hints; a clean separation between reading and filtering."

[freestyle.badge]
id = "badge-s03"
name = "LINES OF LATITUDE"
desc = "The sextant reads streaming transects — no more slurping."

