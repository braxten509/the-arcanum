id = "s03"
codename = "CHAPTER III // LINES OF LATITUDE"
short = "Lines of Latitude"
title = "Iterators & Generators"
build = "Streaming parser — multi-GB logs in constant memory via yield and itertools"
brief = "<p>A sextant does not gulp the whole horizon — it takes one sighting, records it, and moves to the next. A log parser that reads the entire file into memory before producing a single record is not a tool; it is a bucket under a waterfall. This bearing teaches the navigator to read in transects: one record at a time, lazy by default, with no more memory used than the line currently under the glass.</p><p>Python's <strong>iteration protocol</strong> is the engine under every <code>for</code> loop. Generators are the clearest expression of that protocol — functions that <code>yield</code> values one by one, suspending themselves between each to let the caller consume at its own pace. The <code>itertools</code> module is the chart-room's toolbox of combinators: chain, islice, takewhile, groupby — each one lazy, each one precise.</p><p>By the end of this bearing, Sextant's parser streams records. A multi-gigabyte log directory becomes a sequence of individual records, never a memory spike.</p>"
