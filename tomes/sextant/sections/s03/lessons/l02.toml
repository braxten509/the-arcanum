[[lessons]]
id = "s03-l02"
title = "Generators — The Suspended Sighting"
body = '''
<p>A generator function looks like a regular function, but instead of <code>return</code> it uses <code>yield</code>. Each time <code>yield</code> executes, the function's state is frozen — local variables, instruction pointer, exception state — and the yielded value is sent to the caller. The next call to <code>next()</code> unfreezes the function and it resumes right after the <code>yield</code>.</p>
<pre><code><span class="k">def</span> <span class="nf">read_lines</span><span class="p">(</span><span class="n">paths</span>: <span class="nb">list</span>[<span class="nb">str</span>]<span class="p">)</span> <span class="o">-></span> <span class="n">Iterator</span>[<span class="nb">str</span>]:
    <span class="k">for</span> path <span class="ow">in</span> paths:
        <span class="k">with</span> <span class="nb">open</span><span class="p">(</span><span class="n">path</span><span class="p">)</span> <span class="k">as</span> <span class="n">f</span>:
            <span class="k">for</span> line <span class="ow">in</span> f:
                <span class="k">yield</span> line.strip()</code></pre>
<p>This generator does not read a single line until the caller asks for one. Each <code>next()</code> call reads one line from the current file, and when that file is spent, the outer loop moves to the next path. The caller controls the pace — the generator never pulls ahead.</p>
<p><strong>Generator expressions</strong> are the comprehension form of a generator: parentheses instead of square brackets produce a lazy iterator instead of a materialised list.</p>
<pre><code><span class="c"># Eager: builds the whole list in memory</span>
errors = [line <span class="k">for</span> line <span class="ow">in</span> file <span class="k">if</span> <span class="s">"ERROR"</span> <span class="ow">in</span> line]

<span class="c"># Lazy: yields one filtered line at a time</span>
errors = (line <span class="k">for</span> line <span class="ow">in</span> file <span class="k">if</span> <span class="s">"ERROR"</span> <span class="ow">in</span> line)</code></pre>
<p>The difference is not just syntax — it is memory. The list comprehension allocates a list that grows with the file. The generator expression allocates nothing beyond the current line. For a 2 GB log with 10 million lines, the list comprehension crashes the process and the generator expression finishes in constant memory.</p>
<p><code>yield from</code> is a shortcut for delegating to a sub-generator. It yields every element from another iterable, one at a time, without needing a manual <code>for</code> loop:</p>
<pre><code><span class="k">def</span> <span class="nf">chain_files</span><span class="p">(</span><span class="o">*</span><span class="n">paths</span>: <span class="nb">str</span><span class="p">)</span> <span class="o">-></span> <span class="n">Iterator</span>[<span class="nb">str</span>]:
    <span class="k">for</span> path <span class="ow">in</span> paths:
        <span class="k">with</span> <span class="nb">open</span><span class="p">(</span><span class="n">path</span><span class="p">)</span> <span class="k">as</span> <span class="n">f</span>:
            <span class="k">yield from</span> f         <span class="c"># delegates line-by-line</span></code></pre>
<p>Every line from every file is yielded through this one function, never materialised in memory.</p>
<div class="callout"><strong>Consult the volumes:</strong> The <code>yield</code> statement is documented in PEP 255 (simple generators) and PEP 380 (<code>yield from</code>). The CPython implementation lives in <code>Objects/genobject.c</code> — generators are C structs that capture the frame pointer and stack, which is why they can suspend and resume at native speed.</div>
<div class="field-notes"><div class="fn-head">FIELD NOTES // GENERATOR CLOSE & THROW</div>
<p>Generators have two methods beyond <code>__next__</code>: <code>.close()</code> raises <code>GeneratorExit</code> inside the generator (triggering <code>finally</code> blocks), and <code>.throw(exc_type)</code> raises an exception at the <code>yield</code> point. Context managers like <code>@contextmanager</code> use these to propagate exceptions into the generator. You will rarely call them directly, but understanding them explains why a <code>with</code> block inside a generator works correctly.</p></div>
'''

[[lessons.exercises]]
id = "s03-l02-e1"
type = "fill"
points = 20
prompt = "Fill the blank to write a generator that yields values from a list one at a time:"
code = '''def emit(items):
    for item in items:
        ____ item'''
answer = "yield"
hint = "The keyword that suspends the function and sends a value to the caller."

[[lessons.exercises]]
id = "s03-l02-e2"
type = "text"
points = 20
prompt = "What keyword delegates iteration to a sub-generator?"
answer = "yield from"
accept = ["yield from"]
hint = "It is two words — yield followed by a preposition meaning 'out of'."

[[lessons.exercises]]
id = "s03-l02-d1"
type = "type"
points = 12
reps = 2
prompt = "Retype this generator expression:"
code = '''squares = (x * x for x in range(10))'''

[[lessons.exercises]]
id = "s03-l02-w1"
type = "write"
points = 30
prompt = "Write a generator function <code>evens(limit: int) -> Iterator[int]</code> that yields even numbers from 0 up to (but not including) <code>limit</code>. Use a <code>for</code> loop with <code>range()</code> and the <code>yield</code> keyword. Call it with <code>limit=7</code> and print each yielded value on its own line."
starter = '''
def evens(limit):
    # your code here

for n in evens(7):
    print(n)
'''
expect = '''0
2
4
6'''
hint = "Inside the for loop over range(limit), check <code>if n % 2 == 0</code> and yield those."
