[[lessons]]
id = "s03-l01"
title = "The Iteration Protocol — How 'for' Really Works"
body = '''
<p>When you write <code>for line in file:</code>, Python does not magically know how to walk a file line by line. It calls two methods: <code>__iter__</code> to get an iterator object, then <code>__next__</code> on that iterator to get each element, catching <code>StopIteration</code> when the iterator is spent. This is the <strong>iteration protocol</strong>, and it is the skeleton under every <code>for</code> loop, comprehension, and unpacking expression in the language.</p>
<pre><code><span class="c"># What the for loop actually does — written out explicitly</span>
it = <span class="nb">iter</span>(file)              <span class="c"># calls file.__iter__()</span>
<span class="k">while</span> <span class="kc">True</span>:
    <span class="k">try</span>:
        line = <span class="nb">next</span>(it)      <span class="c"># calls it.__next__()</span>
        <span class="k">print</span>(line.strip())
    <span class="k">except</span> <span class="ne">StopIteration</span>:
        <span class="k">break</span></code></pre>
<p>An object is <strong>iterable</strong> if it returns an iterator from <code>__iter__</code>. An object is an <strong>iterator</strong> if it implements both <code>__iter__</code> (returning self) and <code>__next__</code> (returning the next element or raising <code>StopIteration</code>). Every iterator is iterable, but not every iterable is an iterator — a list is iterable (it returns a fresh <code>list_iterator</code> each time), but a list is not an iterator (it has no <code>__next__</code>).</p>
<pre><code><span class="n">chars</span> = [<span class="s">"a"</span>, <span class="s">"b"</span>, <span class="s">"c"</span>]
<span class="n">it</span> = <span class="nb">iter</span>(chars)
<span class="k">print</span>(<span class="nb">next</span>(it))  <span class="c"># "a"</span>
<span class="k">print</span>(<span class="nb">next</span>(it))  <span class="c"># "b"</span>
<span class="k">print</span>(<span class="nb">next</span>(it))  <span class="c"># "c"</span>
<span class="k">print</span>(<span class="nb">next</span>(it))  <span class="c"># StopIteration raised</span></code></pre>
<p>The protocol matters because it separates <strong>what</strong> you iterate over (the iterable) from <strong>how</strong> the iteration proceeds (the iterator). A file iterates by reading the next line from disk. A generator (next lesson) iterates by resuming a suspended function frame. A database cursor iterates by fetching the next row. All three are consumed with <code>for x in thing:</code> — the protocol unifies them.</p>
<div class="callout"><strong>Consult the volumes:</strong> <code>collections.abc</code> defines the abstract base classes <code>Iterable</code>, <code>Iterator</code>, and <code>Generator</code>. Read their source — it is pure Python, under 100 lines each, and connects the protocol to the <code>isinstance</code> checks that make duck typing explicit.</div>
'''

[[lessons.exercises]]
id = "s03-l01-e1"
type = "mc"
points = 15
prompt = "What exception does <code>next(it)</code> raise when the iterator is exhausted?"
choices = ["IndexError", "KeyError", "ValueError", "StopIteration"]
answer = 3
whyWrong = "StopIteration is the sentinel that signals 'no more elements'. IndexError is for sequence indexing, KeyError for missing dict keys, and ValueError for invalid operation arguments — none of them communicate iterator exhaustion."
hint = "The name of the exception describes what happens: iteration must stop."
explain = "When an iterator has no more items, <code>next()</code> raises <code>StopIteration</code>."

[[lessons.exercises]]
id = "s03-l01-d1"
type = "type"
points = 12
reps = 2
prompt = "Retype this manual iteration using the protocol:"
code = '''it = iter([1, 2, 3])
while True:
    try:
        print(next(it))
    except StopIteration:
        break'''

[[lessons.exercises]]
id = "s03-l01-e2"
type = "mc"
points = 15
prompt = "What is the difference between an iterable and an iterator?"
choices = ["There is no difference — all iterables are iterators", "An iterable has __iter__ that returns a new iterator each time; an iterator has both __iter__ and __next__ and is also iterable", "An iterable is passed to for loops; an iterator is passed to comprehensions", "An iterator can only be used once; an iterable can be reused"]
answer = 1
whyWrong = "Option 2 is wrong — a list is iterable but <code>next(list)</code> fails. Option 3 is close but misleading (some iterators are reusable). Option 4 is too specific. The correct answer captures the core distinction: <code>__iter__</code> creates a fresh iterator, <code>__next__</code> consumes it."
hint = "Which one implements both __iter__ and __next__? Which one only implements __iter__?"
explain = "An iterable implements <code>__iter__</code> to return an iterator; an iterator implements both <code>__iter__</code> (returning self) and <code>__next__</code> (returning elements)."

[[lessons.exercises]]
id = "s03-l01-e3"
type = "text"
points = 20
prompt = "What builtin function do you call on an iterable to obtain its iterator?"
answer = "iter"
accept = ["iter()"]
hint = "It is a built-in function whose name is a short word related to 'repeating'."

[[lessons.exercises]]
id = "s03-l01-w1"
type = "write"
points = 30
prompt = "Write a function <code>first_three(iterable)</code> that manually (using <code>iter()</code> and <code>next()</code>) gets the first three elements from an iterable and prints each line. Call it with <code>first_three(iter([\"INFO\", \"WARN\", \"ERROR\"]))</code>. Use a try/except to stop after three or when the iterable runs out."
starter = '''
def first_three(iterable):
    # your code here

first_three(iter(["INFO", "WARN", "ERROR"]))
'''
expect = '''INFO
WARN
ERROR'''
hint = "Use iter() to get the iterator, then call next() up to three times, catching StopIteration."
