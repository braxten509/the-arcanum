[[lessons]]
id = "s03-l03"
title = "Itinerary of the Iterator — itertools"
body = '''
<p>The <code>itertools</code> module is the chart-room's box of specialised instruments — lazy combinators that transform, filter, and group iterables without ever materialising them. Each function in itertools returns an iterator, so you can chain them infinitely: <code>itertools.chain</code> feeds into <code>itertools.islice</code> feeds into a <code>for</code> loop, and memory stays constant.</p>
<pre><code><span class="kn">from</span> <span class="nn">itertools</span> <span class="kn">import</span> <span class="n">chain</span>, <span class="n">islice</span>, <span class="n">takewhile</span>, <span class="n">groupby</span>, <span class="n">tee</span></code></pre>
<p><strong><code>chain</code></strong> concatenates iterables as if they were one: <code>chain(iter1, iter2)</code> yields every element from iter1, then every element from iter2. Use it when Sextant reads logs from multiple directories.</p>
<pre><code>paths = [<span class="s">"syslog"</span>, <span class="s">"auth.log"</span>, <span class="s">"kern.log"</span>]
all_lines = chain.from_iterable(<span class="nb">open</span>(p) <span class="k">for</span> p <span class="ow">in</span> paths)</code></pre>
<p><strong><code>islice</code></strong> is the lazy version of list slicing. <code>islice(iterable, start, stop, step)</code> skips to <code>start</code> without iterating through the skipped elements, then yields up to <code>stop - start</code> elements. Use it to paginate a report without reading the whole log.</p>
<pre><code><span class="c"># First 10 lines — instant even on a 10 GB file</span>
head = <span class="nb">list</span>(islice(all_lines, <span class="mi">10</span>))</code></pre>
<p><strong><code>takewhile</code></strong> yields elements as long as the predicate is true and stops at the first false — like a <code>break</code> built into iteration. Use it to read a log up to a timestamp without scanning to the end.</p>
<pre><code>recent = takewhile(<span class="k">lambda</span> line: <span class="s">"2025-07-07"</span> <span class="ow">in</span> line, all_lines)</code></pre>
<p><strong><code>groupby</code></strong> groups consecutive elements by a key function — but only consecutive ones, so you must sort by the same key first. It returns an iterator of <code>(key, group_iterator)</code> pairs. Use it to chunk a sorted log by day or by level.</p>
<pre><code>records.sort(key=<span class="k">lambda</span> r: r.level)  <span class="c"># groupby needs adjacent keys</span>
<span class="k">for</span> level, group <span class="ow">in</span> groupby(records, key=<span class="k">lambda</span> r: r.level):
    <span class="k">print</span>(<span class="s">f"{level}: {len(list(group))} records"</span>)</code></pre>
<p><strong><code>tee</code></strong> splits one iterator into <code>n</code> independent iterators. Each can be consumed separately, at different speeds, without interfering. Internally, tee buffers the difference between the fastest and slowest consumer.</p>
<div class="callout"><strong>Consult the volumes:</strong> The <code>itertools</code> module is pure Python — open <code>Lib/itertools.py</code> (well, the functions in <code>Modules/itertoolsmodule.c</code> are C, but the <code>recipes</code> section at the bottom of the docs gives pure-Python equivalents). Every function has a corresponding recipe in the docs that shows exactly how it works.</div>
<div class="field-notes"><div class="fn-head">FIELD NOTES // INFINITE ITERATORS</div>
<p><code>itertools</code> includes three infinite iterators: <code>count(start=0, step=1)</code> counts forever, <code>cycle(iterable)</code> repeats the iterable endlessly, and <code>repeat(elem, n=None)</code> repeats the element forever or <code>n</code> times. Infinite iterators are safe only when consumed by a finite combinator (<code>islice</code>, <code>takewhile</code>, <code>zip</code>) — standalone, they hang the process.</p></div>
'''

[[lessons.exercises]]
id = "s03-l03-e1"
type = "mc"
points = 15
prompt = "Which itertools function yields elements until the predicate becomes false?"
choices = ["itertools.chain", "itertools.islice", "itertools.takewhile", "itertools.dropwhile"]
answer = 2
whyWrong = "<code>takewhile</code> yields elements as long as the predicate is true, stopping at the first false. <code>chain</code> just concatenates, <code>islice</code> uses indices, and <code>dropwhile</code> skips elements <em>while</em> the predicate is true (the inverse)."
hint = "The name tells you: it 'takes' elements 'while' the condition holds."
explain = "<code>itertools.takewhile</code> yields elements from an iterable as long as the predicate returns true."

[[lessons.exercises]]
id = "s03-l03-e2"
type = "fill"
points = 20
prompt = "Fill the blank to lazily get the first 5 elements from an iterator:"
code = '''from itertools import islice
first_five = ____(big_iterator, 5)'''
answer = "islice"
hint = "The function name starts with 'i' and is short for 'iterate slice'."

[[lessons.exercises]]
id = "s03-l03-d1"
type = "type"
points = 12
reps = 2
prompt = "Retype this chain of two lists:"
code = '''from itertools import chain
result = list(chain([1, 2], [3, 4]))'''

[[lessons.exercises]]
id = "s03-l03-e3"
type = "mc"
points = 15
prompt = "What requirement must your data satisfy before using <code>itertools.groupby</code>?"
choices = ["The data must be loaded entirely in memory", "The data must be grouped in batches of 10", "The data must not contain duplicate keys", "The data must be sorted by the same key function"]
answer = 3
whyWrong = "<code>groupby</code> only groups consecutive elements with the same key — it does not aggregate all equal keys across the whole iterable. Without sorting first, the same key appears in multiple groups. The docs warn about this explicitly."
hint = "Does groupby collect all equal keys, or only adjacent ones? Read the itertools docs."
explain = "groupby only groups consecutive equal keys, so data must be sorted by the same key first."

[[lessons.exercises]]
id = "s03-l03-w1"
type = "write"
points = 35
prompt = "Write a script that uses <code>itertools.chain</code> to create a single iterator over two small lists: <code>a = [1, 2, 3]</code> and <code>b = [4, 5, 6]</code>. Use <code>islice</code> to get the first 4 elements from the chained iterator and print them as a list."
starter = '''
from itertools import chain, islice

a = [1, 2, 3]
b = [4, 5, 6]
# your code here
'''
expect = '''[1, 2, 3, 4]'''
hint = "Chain both lists, then wrap the result in islice(..., 4) and convert to list."
