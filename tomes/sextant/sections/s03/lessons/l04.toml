[[lessons]]
id = "s03-l04"
title = "Lazy vs Eager — When to Materialise"
body = '''
<p>Choosing between lazy and eager is the chart-keeper's most frequent engineering decision. Lazy (generators, <code>itertools</code>) saves memory and defers computation; eager (lists, tuples) gives random access, multiple passes, and a known length. The right choice depends on what the caller needs.</p>
<p><strong>Be lazy when:</strong> you are transforming a stream of records that could be large, the caller only needs to see each element once, and you do not know the total size at authoring time. This is 80% of Sextant's data paths.</p>
<pre><code><span class="c"># Lazy: the caller decides when to stop</span>
<span class="k">def</span> <span class="nf">parse_records</span><span class="p">(</span><span class="n">lines</span>: <span class="n">Iterator</span>[<span class="nb">str</span>]<span class="p">)</span> <span class="o">-></span> <span class="n">Iterator</span>[<span class="n">LogRecord</span>]:
    <span class="k">for</span> line <span class="ow">in</span> lines:
        parsed = parse_log(line)
        <span class="k">if</span> parsed <span class="ow">is</span> <span class="ow">not</span> <span class="kc">None</span>:
            <span class="k">yield</span> parsed</code></pre>
<p><strong>Be eager when:</strong> you need to sort, index by position, make multiple passes, or compute a length before processing. These operations require a materialised collection.</p>
<pre><code><span class="c"># Eager: we need random access and sorted output</span>
records = <span class="nb">list</span>(parse_lines(file))
records.sort(key=<span class="k">lambda</span> r: r.ts)
<span class="k">print</span>(records[<span class="mi">0</span>])         <span class="c"># earliest record</span>
<span class="k">print</span>(records[-<span class="mi">1</span>])        <span class="c"># latest record</span>
<span class="k">print</span>(<span class="nb">len</span>(records))       <span class="c"># total count</span></code></pre>
<p>Even here, the materialisation is explicit and local — <code>list(generator)</code> is a conscious choice, not a default. The generator stays lazy until the moment the caller demands a list, and the boundary between the two is visible in the code.</p>
<p><strong>Reasoning about complexity:</strong> Lazy pipelines can hide cost. <code>itertools.tee</code> buffers the difference between consumers, so a fast consumer behind a slow one can accumulate unbounded memory. <code>groupby</code> holds a reference to the group iterator's next element but does not buffer the whole group — calling <code>list(group)</code> is safe. <code>chain</code> adds no overhead per element. Know the data structure you are using.</p>
<pre><code><span class="c"># Reasoning about memory: one line in flight at all times</span>
<span class="k">for</span> record <span class="ow">in</span> parse_records(<span class="nb">open</span>(<span class="s">"huge.log"</span>)):
    <span class="k">if</span> record.level == <span class="s">"ERROR"</span>:
        <span class="k">print</span>(record.message)</code></pre>
<p>In this pipeline, the file cursor holds one line, the generator holds one parsed <code>LogRecord</code>, and the loop body does its work. Total memory: one <code>LogRecord</code> object plus the file buffer. A 100 GB log processes in the same memory as a 1 KB log.</p>
<div class="callout"><strong>Consult the volumes:</strong> The <code>itertools</code> documentation's "Itertools Recipes" section is required reading — it shows how to implement <code>consume</code>, <code>nth</code>, <code>quantify</code>, and other patterns that combine lazy and eager in idiomatic ways. Every recipe is a masterclass in the iteration protocol.</div>
<div class="field-notes"><div class="fn-head">FIELD NOTES // GENERATOR PIPELINE TEE TRAP</div>
<p>When using <code>itertools.tee</code> to split a generator, be aware that the tee buffers data in memory proportional to the distance between the fastest and slowest consumer. If one consumer is far ahead of another, memory grows without bound. For large datasets, consider materialising the data once (e.g., writing to a temp file) and reading it twice instead of using tee.</p></div>
'''

[[lessons.exercises]]
id = "s03-l04-e1"
type = "text"
points = 20
prompt = "What single-word term describes code that computes values only when needed, not in advance?"
answer = "lazy"
accept = ["lazy evaluation"]
hint = "The opposite of 'eager' — it is the quality of a deckhand who only works when the Captain calls."

[[lessons.exercises]]
id = "s03-l04-e2"
type = "fill"
points = 20
prompt = "Fill the blank to materialise a generator <code>g</code> into a list:"
code = '''g = (x * 2 for x in range(5))
result = ____(g)'''
answer = "list"
hint = "The builtin function that creates a list from any iterable."

[[lessons.exercises]]
id = "s03-l04-d1"
type = "type"
points = 12
reps = 2
prompt = "Retype this lazy pipeline that materialises only at the end:"
code = '''processed = (r for r in records if r.level == "ERROR")
results = list(processed)'''

[[lessons.exercises]]
id = "s03-l04-w1"
type = "write"
points = 30
prompt = "Write a script that uses a generator expression <code>(x ** 2 for x in range(10))</code> to lazily compute squares. Use <code>itertools.islice</code> to get only the first 5 values, convert them to a list, and print the list."
starter = '''
from itertools import islice

squares = (x ** 2 for x in range(10))
# your code here
'''
expect = '''[0, 1, 4, 9, 16]'''
hint = "Pass the generator to islice with stop=5, then wrap in list() and print."
