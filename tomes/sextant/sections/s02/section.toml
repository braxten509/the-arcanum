id = "s02"
codename = "CHAPTER II // STARS ALIGNED"
short = "Stars Aligned"
title = "The Data Model — Dataclasses & Type Hints"
build = "Typed LogRecord — the chart the rest of the build plots on"
brief = "<p>A raw string is not a datum. A log line like <code>2025-07-07 14:30:00 INFO Connection established from auth.service</code> is a sequence of characters until the chart-keeper gives it a shape — a timestamp, a severity level, a message, a source. In this bearing we draw the ruled grid: a <code>LogRecord</code> dataclass with typed fields and validated invariants.</p><p>The <code>@dataclass</code> decorator is Python's way of saying 'this class is a container for named, typed values'. No boilerplate <code>__init__</code>, no hand-written <code>__repr__</code>, no fragile <code>__eq__</code> — the decorator generates them from the field declarations alone. This is the chart-room's philosophy: declare what you hold, and let the language do the rest.</p><p>By the end of this bearing, Sextant ingests lines into typed records — no more raw dicts swimming in the dark.</p>"
