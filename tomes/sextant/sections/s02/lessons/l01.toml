[[lessons]]
id = "s02-l01"
title = "The Ruled Grid — @dataclass"
body = '''
<p>A dataclass is a class decorated with <code>@dataclass</code> whose fields are declared as class-level annotations. The decorator reads those annotations and generates <code>__init__</code>, <code>__repr__</code>, <code>__eq__</code>, and (optionally) <code>__hash__</code>, <code>__lt__</code>, and the rest — all from the field list alone.</p>
<pre><code><span class="kn">from</span> <span class="nn">dataclasses</span> <span class="kn">import</span> <span class="n">dataclass</span>

<span class="nd">@dataclass</span>
<span class="k">class</span> <span class="nc">LogRecord</span>:
    ts: <span class="nb">str</span>
    level: <span class="nb">str</span>
    message: <span class="nb">str</span>
    source: <span class="nb">str</span></code></pre>
<p>That is the whole class declaration. The generated <code>__init__</code> accepts four positional arguments in field order — <code>LogRecord(ts='...', level='INFO', ...)</code> — and the generated <code>__repr__</code> prints <code>LogRecord(ts='...', level='INFO', ...)</code>, which is readable enough for debugging without writing a custom <code>__str__</code>.</p>
<p>A plain dataclass is mutable by default. After construction you can reassign a field — <code>record.level = 'WARN'</code> — which is sometimes what you want and sometimes a leak in the hull. The chart-keeper's rule: if a record's meaning changes when a field changes, make it frozen.</p>
<pre><code><span class="nd">@dataclass</span><span class="p">(</span><span class="n">frozen</span><span class="o">=</span><span class="kc">True</span><span class="p">)</span>
<span class="k">class</span> <span class="nc">LogRecord</span>:
    ts: <span class="nb">str</span>
    level: <span class="nb">str</span>
    message: <span class="nb">str</span>
    source: <span class="nb">str</span></code></pre>
<p>Frozen dataclasses are immutable: any attempt to set a field after init raises <code>FrozenInstanceError</code>. This is the right default for records, config objects, and any value that represents a fact about the world — a log line either happened or did not. To create a corrected record, use <code>dataclasses.replace()</code> which returns a new instance with the changed fields.</p>
<pre><code><span class="kn">from</span> <span class="nn">dataclasses</span> <span class="kn">import</span> <span class="n">replace</span>
corrected = replace(record, level=<span class="s">"WARN"</span>)</code></pre>
<div class="callout"><strong>Consult the volumes:</strong> Open <code>Lib/dataclasses.py</code> in the CPython source and read the <code>_process_class</code> function — it is the core that walks the annotations and synthesises the generated methods. Understanding it demystifies every decorator you will meet.</div>
<div class="field-notes"><div class="fn-head">FIELD NOTES // THE GENERATED METHODS</div>
<p>The decorator generates <code>__init__</code> with field-order parameters, optional defaults, and keyword-only fields after the first default. It generates <code>__repr__</code> that prints the class name and all fields. It generates <code>__eq__</code> that compares field-by-field. The <code>order=True</code> parameter also generates <code>__lt__</code>, <code>__le__</code>, <code>__gt__</code>, <code>__ge__</code>. None of this is magic — it is Python writing Python, one function definition at a time, in the same module you can read on your own machine.</p></div>
'''

[[lessons.exercises]]
id = "s02-l01-d1"
type = "type"
points = 12
reps = 2
prompt = "Retype this frozen dataclass declaration:"
code = '''@dataclass(frozen=True)
class LogRecord:
    ts: str
    level: str
    message: str
    source: str'''

[[lessons.exercises]]
id = "s02-l01-e1"
type = "mc"
points = 15
prompt = "What does the <code>@dataclass</code> decorator <strong>not</strong> generate automatically?"
choices = ["__init__", "__repr__", "__hash__", "__eq__"]
answer = 2
whyWrong = "<code>__hash__</code> is only generated when <code>frozen=True</code> (and even then, only if <code>eq=True</code> and no custom <code>__hash__</code> is defined). The decorated class always gets <code>__init__</code>, <code>__repr__</code>, and <code>__eq__</code> by default — those are the core contract of a data container."
hint = "One of these is only generated under specific conditions — check the <code>dataclasses</code> docs for when each method appears."
explain = "<code>__hash__</code> is only added for frozen dataclasses because mutable objects should not be hashable."

[[lessons.exercises]]
id = "s02-l01-e2"
type = "text"
points = 20
prompt = "What exception is raised when you try to set an attribute on a frozen dataclass instance?"
answer = "FrozenInstanceError"
accept = ["dataclasses.FrozenInstanceError", "FrozenInstanceError"]
hint = "The exception name contains 'Frozen' and lives in the <code>dataclasses</code> module."

[[lessons.exercises]]
id = "s02-l01-e3"
type = "fill"
points = 20
prompt = "Fill the blank to create a frozen dataclass:"
code = '''____
class Point:
    x: float
    y: float'''
answer = "@dataclass(frozen=True)"
accept = ['@dataclass(frozen=True)', "@dataclass(frozen = True)"]
hint = "The decorator takes a keyword argument that sets immutability."

[[lessons.exercises]]
id = "s02-l01-w1"
type = "write"
points = 30
prompt = "Define a frozen dataclass <code>Bearing</code> with fields <code>name: str</code> and <code>degrees: float</code>. Create an instance <code>Bearing(name=\"North\", degrees=0.0)</code> and print its <code>repr</code> (just use <code>print()</code> on the instance)."
starter = '''
from dataclasses import dataclass

# your code here
'''
expect = '''Bearing(name='North', degrees=0.0)'''
hint = "The generated __repr__ automatically formats all fields. Just create and print the instance."
