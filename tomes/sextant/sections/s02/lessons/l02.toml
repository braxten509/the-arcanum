[[lessons]]
id = "s02-l02"
title = "Post-Init Validation & Field Customisation"
body = '''
<p>A chart-keeper does not accept a dead reckoning without verifying the reading. The <code>__post_init__</code> method is a hook the dataclass machinery calls after the generated <code>__init__</code> has set all fields — a chance to validate, transform, or derive before the record is sealed. Building on the <code>LogRecord</code> from the last lesson:</p>
<pre><code><span class="c"># Adding validation to the frozen dataclass</span>
    <span class="k">def</span> <span class="nf">__post_init__</span>(<span class="bp">self</span>):
        <span class="k">if</span> <span class="bp">self</span>.level <span class="ow">not</span> <span class="ow">in</span> {<span class="s">"INFO"</span>, <span class="s">"WARN"</span>, <span class="s">"ERROR"</span>}:
            <span class="k">raise</span> <span class="ne">ValueError</span>(<span class="sa">f</span><span class="s">"Invalid level: {self.level}"</span>)</code></pre>
<p>The method runs after <code>__init__</code> completes its field assignments. If validation fails, the exception propagates to the caller and no record is created — you cannot construct an invalid <code>LogRecord</code>. This is the dataclass version of failing fast.</p>
<p>When a field needs a mutable default (a list, a dict, a set), you cannot write <code>tags: list[str] = []</code> — that list would be shared across all instances, a classic Python gotcha. The <code>field()</code> factory with <code>default_factory</code> solves it:</p>
<pre><code><span class="kn">from</span> <span class="nn">dataclasses</span> <span class="kn">import</span> <span class="n">field</span>

<span class="nd">@dataclass</span>
<span class="k">class</span> <span class="nc">Report</span>:
    title: <span class="nb">str</span>
    tags: <span class="nb">list</span>[<span class="nb">str</span>] = <span class="n">field</span>(default_factory=<span class="nb">list</span>)</code></pre>
<p>Each instance gets its own empty list, created fresh by the factory function. The same pattern works for <code>dict</code>, <code>set</code>, and any other mutable you need as a default.</p>
<pre><code><span class="c"># Fields without defaults must come before fields with defaults</span>
<span class="nd">@dataclass</span>
<span class="k">class</span> <span class="nc">LogConfig</span>:
    log_dir: <span class="nb">str</span>                         <span class="c"># required</span>
    format: <span class="nb">str</span> = <span class="s">"text"</span>                 <span class="c"># optional, default "text"</span>
    plugins: <span class="nb">list</span>[<span class="nb">str</span>] = <span class="n">field</span>(default_factory=<span class="nb">list</span>)</code></pre>
<p>This is the core discipline: required fields first, optional fields with defaults after, and mutable defaults wrapped in <code>field(default_factory=...)</code>. Break this rule and Python refuses to parse the class — a compile-time check that saves runtime bugs.</p>
<div class="callout"><strong>Consult the volumes:</strong> Read <code>Lib/dataclasses.py</code> around the <code>_FIELD</code> class and the <code>_create_fn</code> function — this is where Python synthesises the <code>__post_init__</code> call and validates default ordering. The source is under 800 lines and is one of the most approachable modules in the stdlib.</div>
'''

[[lessons.exercises]]
id = "s02-l02-e1"
type = "mc"
points = 15
prompt = "What is wrong with this dataclass field: <code>tags: list[str] = []</code>?"
choices = ["The default is not allowed without default_factory", "list[str] is not a valid type hint", "It works perfectly — no issue", "The list is shared by all instances"]
answer = 3
whyWrong = "A mutable default like <code>[]</code> is evaluated once at class definition time and shared across all instances that use it. Adding a tag to one instance adds it to all instances — a notorious Python bug. The fix is <code>field(default_factory=list)</code>."
hint = "Think about when default values are evaluated in Python — is it at class definition or at instance creation?"
explain = "Mutable defaults in Python are evaluated once, at class definition time, and shared by all instances that use that default."

[[lessons.exercises]]
id = "s02-l02-e2"
type = "fill"
points = 20
prompt = "Fill the blank to call the field factory correctly for a dict default:"
code = '''from dataclasses import field
counts: dict[str, int] = ____'''
answer = "field(default_factory=dict)"
accept = ["field(default_factory=dict)", "field(default_factory = dict)"]
hint = "The field() function takes a default_factory argument — pass the callable itself, not a call to it."

[[lessons.exercises]]
id = "s02-l02-d1"
type = "type"
points = 12
reps = 2
prompt = "Retype this dataclass with __post_init__ validation:"
code = '''@dataclass(frozen=True)
class LogRecord:
    ts: str
    level: str
    message: str
    source: str

    def __post_init__(self):
        if self.level not in {"INFO", "WARN", "ERROR"}:
            raise ValueError(f"invalid level: {self.level}")'''

[[lessons.exercises]]
id = "s02-l02-w1"
type = "write"
points = 30
prompt = "Write a frozen dataclass <code>Ship</code> with fields <code>name: str</code>, <code>speed: float</code>, and <code>stops: list[str]</code> (use field with default_factory for stops). In <code>__post_init__</code>, raise <code>ValueError</code> if <code>speed &lt; 0</code>. Create <code>Ship(name=\"Endeavour\", speed=8.5)</code> and print it."
starter = '''
from dataclasses import dataclass, field

# your code here
'''
expect = '''Ship(name='Endeavour', speed=8.5, stops=[])'''
hint = "Define stops as a field with default_factory=list so each ship gets its own list."
