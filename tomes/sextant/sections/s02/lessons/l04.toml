[[lessons]]
id = "s02-l04"
title = "Dataclass vs Dict — Choosing the Right Vessel"
body = '''
<p>A dict is the simplest container: lightweight, dynamic, no ceremony required. For a one-off mapping — a config file, a parameter bag passed to a template — a dict is the right choice. But a dict has no schema: any code can add, remove, or misspell a key, and the first sign of trouble is a <code>KeyError</code> at 2 AM.</p>
<pre><code><span class="c"># A dict — flexible but silent about its shape</span>
record = {<span class="s">"ts"</span>: <span class="s">"2025-07-07 14:30:00"</span>, <span class="s">"lvl"</span>: <span class="s">"INFO"</span>}
<span class="c"># What if someone writes "level" instead of "lvl"? The code quietly breaks.</span></code></pre>
<p>A <code>@dataclass</code> declares its shape explicitly, in one place, and the interpreter enforces it at construction time — you cannot create an instance without all required fields, you cannot add a field you did not declare, and you cannot assign a field that does not exist.</p>
<pre><code><span class="nd">@dataclass</span><span class="p">(</span><span class="n">frozen</span><span class="o">=</span><span class="kc">True</span><span class="p">)</span>
<span class="k">class</span> <span class="nc">LogRecord</span>:
    ts: <span class="nb">str</span>
    level: <span class="nb">str</span>
    message: <span class="nb">str</span>
    source: <span class="nb">str</span>

<span class="c"># Every reader knows the shape. Every caller gets the fields by name.</span>
rec = LogRecord(ts=<span class="s">"..."</span>, level=<span class="s">"INFO"</span>, message=<span class="s">"..."</span>, source=<span class="s">"..."</span>)</code></pre>
<p><strong>Use a dict when:</strong> the keys are dynamic (parsed from a file, built at runtime), there is no fixed schema, or the mapping is short-lived (an intermediate accumulator in a comprehension).</p>
<p><strong>Use a dataclass when:</strong> the shape is known at author-time, it crosses a module boundary, or you need validation (<code>__post_init__</code>), immutability (<code>frozen=True</code>), or methods attached to the data.</p>
<p>The middle ground is a <code>TypedDict</code> from typing — a hybrid that gives static type checking for dict shapes without the cost of class instantiation:</p>
<pre><code><span class="kn">from</span> <span class="nn">typing</span> <span class="kn">import</span> <span class="n">TypedDict</span>

<span class="k">class</span> <span class="nc">LogDict</span><span class="p">(</span><span class="n">TypedDict</span><span class="p">):</span>
    ts: <span class="nb">str</span>
    level: <span class="nb">str</span>
    message: <span class="nb">str</span></code></pre>
<p><code>TypedDict</code> gives you dict-like runtime behavior (no class instantiation cost, dynamic key assignment) with dataclass-like static checking — a tool for the boundary between dynamic and typed worlds.</p>
<div class="callout"><strong>Consult the volumes:</strong> The <code>typing</code> module's <code>TypedDict</code> documentation and PEP 589 explain the theory. The <code>dataclasses</code> module's source is the best reference for when the decorator adds more value than the dict.</div>
<div class="field-notes"><div class="fn-head">FIELD NOTES // SLOTS & PERFORMANCE</div>
<p>Add <code>__slots__</code> to a non-dataclass class (or use the third-party <code>attrs</code> library's <code>slots=True</code>) to reduce memory per instance by storing attributes in a compact array instead of <code>__dict__</code>. The stdlib's <code>dataclasses</code> does not yet support <code>slots=True</code> natively (it is coming in Python 3.11+ as a keyword argument) — for now, combine <code>@dataclass</code> with explicit <code>__slots__</code> manually if memory is tight.</p></div>
'''

[[lessons.exercises]]
id = "s02-l04-e1"
type = "mc"
points = 15
prompt = "When is a plain dict a better choice than a dataclass?"
choices = ["The object must be immutable", "The keys are dynamic and read from a file", "It crosses a module boundary", "The data needs validation at construction"]
answer = 1
whyWrong = "Dicts excel when the schema is not known at author-time — say, a parsed JSON payload with variable keys. The other cases (validation, immutability, module boundary crossing) are exactly where a dataclass's explicit shape and generated methods add value."
hint = "Think about when a schema would be constraining rather than helpful."
explain = "A dict is the right choice when the key set is dynamic or determined at runtime."

[[lessons.exercises]]
id = "s02-l04-e2"
type = "fill"
points = 20
prompt = "Fill the blank to use TypedDict from the typing module:"
code = '''from typing import ____
class Movie(TypedDict):
    title: str
    year: int'''
answer = "TypedDict"
hint = "The class is a dict-like hybrid that lives in the typing module."

[[lessons.exercises]]
id = "s02-l04-e3"
type = "text"
points = 20
prompt = "What <code>@dataclass</code> parameter makes instances immutable after construction?"
answer = "frozen=True"
accept = ["frozen=true", "frozen = True"]
hint = "It is the same keyword a body of water uses when it turns to solid ice."

[[lessons.exercises]]
id = "s02-l04-w1"
type = "write"
points = 35
prompt = "Define a frozen dataclass <code>LogRecord</code> with fields <code>ts: str</code>, <code>level: str</code>, <code>message: str</code>. Define a <code>TypedDict</code> class <code>LogDict</code> with the same fields. Create one instance of each with the same data and print both."
starter = '''
from dataclasses import dataclass
from typing import TypedDict

# your code here
'''
expect = '''LogRecord(ts='2025-07-07', level='INFO', message='start')
{'ts': '2025-07-07', 'level': 'INFO', 'message': 'start'}'''
hint = "A dataclass prints its repr with field names; a TypedDict prints as a standard dict."
