id = "s05"
codename = "CHAPTER V // BEARING CORRECTIONS"
short = "Bearing Corrections"
title = "Descriptors & Attribute Access"
build = "Descriptor-validated LogRecord fields + LogParseError for invalid lines"
brief = "<p>The chart is drawn, but a chart without corrections is a chart that will ground a ship. In this bearing we add the ruled grid: <strong>descriptors</strong> that enforce field invariants at the moment of access, not in a separate validation pass. A <code>LogRecord</code> whose <code>level</code> field rejects an invalid value at assignment time, whose <code>message</code> is read-only, and whose <code>source</code> is computed lazily — these are not decorations; they are the chart's own grids, making it impossible to plot a wrong bearing.</p><p>Descriptors are Python's protocol for attribute access: <code>__get__</code>, <code>__set__</code>, <code>__delete__</code>. Properties are the most visible instance of the protocol. <code>__slots__</code> is its memory-efficient cousin. By the end of this bearing, Sextant's data model rejects invalid lines with a custom <code>LogParseError</code> that carries diagnostic context — never a silent corruption.</p>"
