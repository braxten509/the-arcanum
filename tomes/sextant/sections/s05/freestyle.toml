[freestyle]
title = "THE WORKING: BEARING CORRECTIONS"
brief = "<p>Upgrade <code>LogRecord</code> with descriptor-validated fields and a custom exception. Sextant must:</p><ul><li>Write a <code>ValidatedString</code> descriptor class with <code>__set_name__</code>, <code>__get__</code>, and <code>__set__</code> that validates against a set of allowed values (e.g., for <code>level</code>), or rejects empty strings (for <code>message</code>, <code>source</code>, <code>ts</code>)</li><li>Use the descriptor on <code>LogRecord.level</code> to enforce <code>level ∈ {INFO, WARN, ERROR}</code> at assignment time</li><li>Make <code>LogRecord.message</code> a read-only <code>@property</code> (strip trailing newlines and whitespace on access)</li><li>Define a custom exception <code>LogParseError</code> that stores the original <code>line: str</code> and <code>reason: str</code> for diagnostics</li><li>Update <code>parse_log()</code> to raise <code>LogParseError</code> (not <code>ValueError</code>) for invalid lines, carrying the original line text</li><li>In <code>main.py</code>, catch <code>LogParseError</code> per line and print <code>WARN: {e.reason} — line: {e.line}</code> before continuing</li></ul>"
reward = 190
xray = "The grader docks points for: descriptors without __set_name__ (older Python pattern with constructor args); property and descriptor both implemented for the same field (duplicate enforcement); LogParseError defined outside the exceptions module pattern; catching LogParseError too broadly. He gives style credit for: __slots__ on the descriptor class to save memory; using __set_name__ to auto-detect the field name; docstrings on the descriptor and property."

[freestyle.badge]
id = "badge-s05"
name = "BEARING CORRECTIONS"
desc = "The chart's grid holds tight — invalid records raise instead of corrupting state."

