[[lessons]]
id = "s05-l01"
title = "The Descriptor Protocol — The Chart's Ruled Grid"
body = '''
<p>A descriptor is an object whose class defines <code>__get__</code>, <code>__set__</code>, or <code>__delete__</code>. When a descriptor instance is assigned as a class attribute, Python intercepts attribute access on instances of that class and delegates to the descriptor's methods. This is the protocol underlying <code>@property</code>, <code>@classmethod</code>, <code>@staticmethod</code>, and <code>__slots__</code>.</p>
<pre><code><span class="k">class</span> <span class="nc">PositiveFloat</span>:
    <span class="k">def</span> <span class="nf">__set_name__</span><span class="p">(</span><span class="bp">self</span>, <span class="n">owner</span>, <span class="n">name</span><span class="p">):</span>
        <span class="bp">self</span>.<span class="n">_name</span> = <span class="n">name</span>

    <span class="k">def</span> <span class="nf">__get__</span><span class="p">(</span><span class="bp">self</span>, <span class="n">obj</span>, <span class="n">objtype</span> <span class="o">=</span> <span class="kc">None</span><span class="p">):</span>
        <span class="k">return</span> <span class="n">obj</span>.<span class="n">__dict__</span>[<span class="bp">self</span>.<span class="n">_name</span>]

    <span class="k">def</span> <span class="nf">__set__</span><span class="p">(</span><span class="bp">self</span>, <span class="n">obj</span>, <span class="n">value</span><span class="p">):</span>
        <span class="k">if</span> value &lt;= <span class="mi">0</span>:
            <span class="k">raise</span> <span class="ne">ValueError</span>(<span class="sa">f</span><span class="s">"{self._name} must be positive"</span>)
        <span class="n">obj</span>.<span class="n">__dict__</span>[<span class="bp">self</span>.<span class="n">_name</span>] = <span class="n">value</span>

<span class="k">class</span> <span class="nc">Reading</span>:
    azimuth = PositiveFloat()
    elevation = PositiveFloat()</code></pre>
<p>When you write <code>r = Reading(); r.azimuth = 45.0</code>, Python finds <code>PositiveFloat</code> on the class, sees it has <code>__set__</code>, and calls <code>PositiveFloat.__set__(r, 45.0)</code> instead of storing in <code>r.__dict__</code> directly. The descriptor intercepts and validates.</p>
<p><strong>Data descriptors</strong> define both <code>__get__</code> and <code>__set__</code>. They take priority over instance <code>__dict__</code> — you cannot override a data descriptor by assigning to the instance. <strong>Non-data descriptors</strong> define only <code>__get__</code>. They take lower priority than instance <code>__dict__</code>, which allows per-instance overrides.</p>
<pre><code><span class="k">class</span> <span class="nc">LazySource</span>:
    <span class="k">def</span> <span class="nf">__set_name__</span><span class="p">(</span><span class="bp">self</span>, <span class="n">owner</span>, <span class="n">name</span><span class="p">):</span>
        <span class="bp">self</span>.<span class="n">_name</span> = <span class="n">name</span>
    <span class="k">def</span> <span class="nf">__get__</span><span class="p">(</span><span class="bp">self</span>, <span class="n">obj</span>, <span class="n">objtype</span><span class="o">=</span><span class="kc">None</span><span class="p">):</span>
        <span class="k">if</span> <span class="n">obj</span> <span class="ow">is</span> <span class="kc">None</span>:
            <span class="k">return</span> <span class="bp">self</span>
        <span class="n">raw</span> = <span class="n">obj</span>.<span class="n">__dict__</span>.get(<span class="bp">self</span>.<span class="n">_name</span>)
        <span class="k">if</span> raw <span class="ow">is</span> <span class="kc">None</span>:
            <span class="k">return</span> <span class="s">"unknown"</span>
        <span class="k">return</span> raw.split(<span class="s">"/"</span>)[-<span class="mi">1</span>]</code></pre>
<p>This non-data descriptor computes the source basename lazily — it parses only on access, not at construction. If you assign <code>record.source = "custom"</code>, the instance dict shadows the descriptor and the computed value is replaced.</p>
<div class="callout"><strong>Consult the volumes:</strong> The descriptor protocol is documented in Python's language reference under "Implementing Descriptors" and in Raymond Hettinger's "Descriptor HowTo Guide" — the single best piece of Python pedagogy ever written. The CPython implementation lives in <code>Objects/descrobject.c</code>.</div>
'''

[[lessons.exercises]]
id = "s05-l01-e1"
type = "mc"
points = 15
prompt = "What is the difference between a data descriptor and a non-data descriptor?"
choices = ["A data descriptor works on classes; a non-data descriptor works on instances", "A data descriptor is defined with @property; a non-data descriptor is defined with a class", "A data descriptor raises TypeError; a non-data descriptor raises ValueError", "A data descriptor defines __set__ or __delete__; a non-data descriptor defines only __get__"]
answer = 3
whyWrong = "The distinction is whether the descriptor defines <code>__set__</code> or <code>__delete__</code>. If it does, it is a data descriptor and takes priority over instance <code>__dict__</code>. If it only defines <code>__get__</code>, it is a non-data descriptor and instance attributes can shadow it."
hint = "Think about what 'data' implies — which methods grant control over assignment?"
explain = "A data descriptor has __set__ or __delete__; a non-data descriptor only has __get__."

[[lessons.exercises]]
id = "s05-l01-e2"
type = "fill"
points = 20
prompt = "Fill the blank so the descriptor stores the attribute name automatically:"
code = '''class MyDescriptor:
    def ____(self, owner, name):
        self._name = name'''
answer = "__set_name__"
accept = ["__set_name__"]
hint = "The method is called when the descriptor is assigned to a class attribute — it tells the descriptor its own field name."

[[lessons.exercises]]
id = "s05-l01-d1"
type = "type"
points = 12
reps = 2
prompt = "Retype this descriptor that validates non-negative values:"
code = '''class NonNegative:
    def __set_name__(self, owner, name):
        self._name = name
    def __get__(self, obj, objtype=None):
        return obj.__dict__[self._name]
    def __set__(self, obj, value):
        if value < 0:
            raise ValueError(f"{self._name} must be >= 0")
        obj.__dict__[self._name] = value'''

[[lessons.exercises]]
id = "s05-l01-e3"
type = "text"
points = 20
prompt = "What built-in decorator is implemented as a data descriptor?"
answer = "property"
accept = ["@property"]
hint = "It is the most commonly used descriptor — every Python programmer meets it in their first week. It uses __get__ and __set__."

[[lessons.exercises]]
id = "s05-l01-w1"
type = "write"
points = 35
prompt = "Write a descriptor class <code>Uppercase</code> that stores strings in uppercase. <code>__set__</code> should convert the value to <code>.upper()</code> before storing. Use it in a class <code>Greeting</code> with a field <code>message = Uppercase()</code>. Set <code>g = Greeting(); g.message = \"hello\"</code> and print <code>g.message</code>."
starter = '''
class Uppercase:
    def __set_name__(self, owner, name):
        self._name = name
    def __get__(self, obj, objtype=None):
        return obj.__dict__[self._name]
    def __set__(self, obj, value):
        # your code here

class Greeting:
    message = Uppercase()

g = Greeting()
g.message = "hello"
print(g.message)
'''
expect = '''HELLO'''
hint = "Call value.upper() inside __set__ before storing in obj.__dict__."
