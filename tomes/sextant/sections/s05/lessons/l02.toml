[[lessons]]
id = "s05-l02"
title = "property — The Sextant's Read-Only Vernier"
body = '''
<p>The <code>@property</code> decorator is a data descriptor that turns a method into a getter. It is the most common descriptor in everyday Python — every time you write <code>@property</code>, you create a descriptor that calls your method on access, computes the value, and returns it. Add <code>@x.setter</code> and <code>@x.deleter</code> for write and delete handling.</p>
<pre><code><span class="k">class</span> <span class="nc">LogRecord</span>:
    <span class="k">def</span> <span class="nf">__init__</span><span class="p">(</span><span class="bp">self</span>, <span class="n">ts</span>, <span class="n">level</span>, <span class="n">message</span>, <span class="n">source</span><span class="p">):</span>
        <span class="bp">self</span>.<span class="n">_ts</span> = <span class="n">ts</span>
        <span class="bp">self</span>.<span class="n">_level</span> = <span class="n">level</span>
        <span class="bp">self</span>.<span class="n">_message</span> = <span class="n">message</span>
        <span class="bp">self</span>.<span class="n">_source</span> = <span class="n">source</span>

    <span class="nd">@property</span>
    <span class="k">def</span> <span class="nf">message</span><span class="p">(</span><span class="bp">self</span><span class="p">)</span> <span class="o">-></span> <span class="nb">str</span>:
        <span class="k">return</span> <span class="bp">self</span>.<span class="n">_message</span>.strip()

    <span class="nd">@message</span><span class="o">.</span><span class="n">setter</span>
    <span class="k">def</span> <span class="nf">message</span><span class="p">(</span><span class="bp">self</span>, <span class="n">value</span>: <span class="nb">str</span><span class="p">):</span>
        <span class="k">if</span> <span class="ow">not</span> value:
            <span class="k">raise</span> <span class="ne">ValueError</span>(<span class="s">"message must not be empty"</span>)
        <span class="bp">self</span>.<span class="n">_message</span> = <span class="n">value</span></code></pre>
<p>The <code>@property</code> getter is called on every access — <code>record.message</code> triggers the method. This means you can add computation, validation, or transformation without changing the caller's syntax. The field <em>was</em> an attribute and <em>became</em> a property; the callers never knew the difference.</p>
<p><strong>Read-only properties</strong> are a key idiom for maintaining immutable state in an otherwise mutable object. Define only the getter, and any code that tries to set the attribute gets <code>AttributeError: can't set attribute</code>:</p>
<pre><code><span class="k">class</span> <span class="nc">LogRecord</span>:
    <span class="k">def</span> <span class="nf">__init__</span><span class="p">(</span><span class="bp">self</span>, <span class="n">ts</span>, <span class="n">level</span>, <span class="n">message</span>, <span class="n">source</span><span class="p">):</span>
        <span class="bp">self</span>.<span class="n">_ts</span> = <span class="n">ts</span>
        <span class="bp">self</span>.<span class="n">_level</span> = <span class="n">level</span>
        <span class="bp">self</span>.<span class="n">_message</span> = <span class="n">message</span>

    <span class="nd">@property</span>
    <span class="k">def</span> <span class="nf">message</span><span class="p">(</span><span class="bp">self</span><span class="p">):</span>
        <span class="k">return</span> <span class="bp">self</span>.<span class="n">_message</span>.strip()

    <span class="nd">@property</span>
    <span class="k">def</span> <span class="nf">level</span><span class="p">(</span><span class="bp">self</span><span class="p">):</span>
        <span class="k">return</span> <span class="bp">self</span>.<span class="n">_level</span></code></pre>
<p>A property is a design tool: it says "you may read this attribute freely, but changing it requires going through the constructor." This is especially important for <code>LogRecord</code>, where a message after construction is a fact — the log said what it said.</p>
<p><strong>When to use a property vs a custom descriptor:</strong> Use <code>@property</code> for simple computed attributes on a single class. Use a custom descriptor when the same validation or transformation applies to multiple fields across multiple classes — the descriptor encapsulates the pattern once.</p>
<div class="callout"><strong>Consult the volumes:</strong> Read <code>builtins.py</code> for <code>property</code>'s C implementation signature — it is a type, not a function. The full signature is <code>property(fget=None, fset=None, fdel=None, doc=None)</code>. The decorator syntax <code>@property</code> calls this with the method as <code>fget</code>.</div>
'''

[[lessons.exercises]]
id = "s05-l02-d1"
type = "type"
points = 12
reps = 2
prompt = "Retype this read-only property:"
code = '''@property
def message(self):
    return self._message.strip()'''

[[lessons.exercises]]
id = "s05-l02-e1"
type = "mc"
points = 15
prompt = "What happens if you try to set a property that has no setter?"
choices = ["The value is silently ignored", "Python raises AttributeError", "Python raises TypeError", "Python creates a new instance attribute that shadows the property"]
answer = 1
whyWrong = "A property without a setter is a data descriptor with only <code>__get__</code>? No — property is always a data descriptor because it always defines <code>__set__</code> or <code>__delete__</code> (even if only to raise <code>AttributeError</code>). It takes priority over instance <code>__dict__</code>, so the assignment falls through to <code>__set__</code> which raises <code>AttributeError: can't set attribute</code>."
hint = "Property is a data descriptor — it always has __set__. What does the default setter do?"
explain = "Without a setter, property raises AttributeError because its __set__ always errors."

[[lessons.exercises]]
id = "s05-l02-e2"
type = "text"
points = 20
prompt = "What decorator creates a setter for a property named <code>message</code>?"
answer = "@message.setter"
accept = ["message.setter", "@message.setter"]
hint = "It is the property object's own method, used as a decorator on a method of the same name."

[[lessons.exercises]]
id = "s05-l02-w1"
type = "write"
points = 30
prompt = "Create a class <code>Circle</code> with a private attribute <code>_radius</code> set in <code>__init__</code>. Add a <code>@property</code> getter for <code>radius</code> and a <code>@radius.setter</code> that raises <code>ValueError</code> if the new value is negative. Create <code>Circle(5)</code> and print its radius."
starter = '''
class Circle:
    def __init__(self, radius):
        self._radius = radius

    @property
    def radius(self):
        return self._radius

    @radius.setter
    def radius(self, value):
        # your code here

c = Circle(5)
print(c.radius)
'''
expect = '''5'''
hint = "In the setter, check <code>if value < 0: raise ValueError(...)</code> then set <code>self._radius = value</code>."
