[freestyle]
title = "THE WORKING: READING THE CHARTS"
brief = "<p>Equip Sextant with full directory walking and aggregation. The tool must:</p><ul><li>Replace manual path handling with <code>pathlib.Path.rglob('*.log')</code> to discover all log files in a directory tree</li><li>Parse each line with a compiled <code>re.compile()</code> regex using named groups (<code>(?P&lt;ts&gt;...)</code>, <code>(?P&lt;level&gt;...)</code>, <code>(?P&lt;message&gt;...)</code>, <code>(?P&lt;source&gt;...)</code>) instead of <code>str.split()</code></li><li>Use <code>collections.Counter</code> to count records by level and by source, printing the top 3 of each</li><li>Use <code>collections.defaultdict(list)</code> to group records by day (extract date from <code>ts</code>)</li><li>Print the report: <code>=== REPORT FOR {directory} ===</code>, then per-level counts, per-source top 3, and per-day groupings showing 3 sample records each</li></ul>"
reward = 210
xray = "The grader docks points for: using os.path instead of pathlib.Path; not compiling the regex (re.compile); using Counter incorrectly on an already-built dict; not using rglob for directory walking; not handling non-.log files or subdirectories gracefully. He gives style credit for: re.VERBOSE for readable multi-line regexes; Path objects used throughout; f-strings with Path attributes like .stem, .name; using most_common() with a limit."

[freestyle.badge]
id = "badge-s07"
name = "READING THE CHARTS"
desc = "The chart-room's own volumes speak — Sextant walks, counts, and parses a full directory."

[[freestyle.rubric]]
criterion = "Compiles & runs"
weight = 35
desc = "Build succeeds; walks a real log directory and produces correct counts."

[[freestyle.rubric]]
criterion = "Meets the brief"
weight = 40
desc = "Every requirement in the checklist is present and correct."

[[freestyle.rubric]]
criterion = "Clean style"
weight = 25
desc = "PEP 8: snake_case, 4-space indent, no mutable globals, pathlib over os.path, re.VERBOSE for serious patterns."
