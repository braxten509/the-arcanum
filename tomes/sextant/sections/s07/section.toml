id = "s07"
codename = "CHAPTER VII // READING THE CHARTS"
short = "Reading the Charts"
title = "Stdlib in Depth — collections, pathlib, re"
build = "Directory walk + Counter aggregation + regex parsing — the core of every report"
brief = "<p>A chart-keeper who only knows the coastline has never sailed. The stdlib is the ocean — vast, charted by generations of mariners, and full of instruments that handle the common cases so you do not have to. This bearing opens the chart-room's own volumes: <code>collections</code> for specialised containers, <code>pathlib</code> for file paths that read as code, and <code>re</code> for patterns that parse what whitespace splitting cannot.</p><p>By the end of this bearing, Sextant walks an entire directory, counts events by type and level with <code>Counter.most_common()</code>, aggregates per-source totals with <code>defaultdict</code>, and parses log lines with named regex groups — the core of a real report that a real operator would trust.</p>"
