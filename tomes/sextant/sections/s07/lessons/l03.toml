[[lessons]]
id = "s07-l03"
title = "Patterns of the Deep — re at Full Depth"
body = '''
<p>Whitespace splitting works for a simple log format. A real log has timestamps, multi-word hostnames, bracketed severity, quoted messages — things <code>.split()</code> cannot parse because the spaces inside a message look like delimiters. Regex handles this because it names the tokens instead of splitting on every space.</p>
<p><strong>Named groups with <code>(?P&lt;name&gt;...)</code></strong> let you extract fields by name from a match, not by index:</p>
<pre><code><span class="kn">import</span> <span class="nn">re</span>

pattern = <span class="n">re</span>.<span class="n">compile</span>(
    <span class="sa">r</span><span class="s">"(?P&lt;ts&gt;\S+) (?P&lt;level&gt;\S+) (?P&lt;message&gt;.*)"</span>
)
match = pattern.match(<span class="s">"2025-07-07 INFO Connection established"</span>)
<span class="k">if</span> match:
    <span class="k">print</span>(match.group(<span class="s">"level"</span>))     <span class="c"># "INFO"</span>
    <span class="k">print</span>(match.groupdict())          <span class="c"># {'ts': '2025-07-07', 'level': 'INFO', ...}</span></code></pre>
<p><strong>Always compile your regex with <code>re.compile()</code>.</strong> It caches the compiled pattern object, so the same regex used in a hot loop does not re-parse the pattern string each time. It also makes the <code>.match()</code>, <code>.search()</code>, and <code>.findall()</code> calls cleaner — the pattern object carries its flags and behaviour with it.</p>
<pre><code><span class="c"># Bad: re-parses the pattern string every call in a loop</span>
<span class="k">for</span> line <span class="ow">in</span> file:
    m = <span class="n">re</span>.<span class="n">match</span>(<span class="sa">r</span><span class="s">"(?P&lt;level&gt;\S+) (?P&lt;msg&gt;.*)"</span>, line)

<span class="c"># Good: compiled once, used many times</span>
log_re = <span class="n">re</span>.<span class="n">compile</span>(<span class="sa">r</span><span class="s">"(?P&lt;ts&gt;\S+) (?P&lt;level&gt;\S+) (?P&lt;msg&gt;.*)"</span>)
<span class="k">for</span> line <span class="ow">in</span> file:
    m = log_re.match(line)</code></pre>
<p><strong>re.VERBOSE</strong> lets you write multi-line regexes with comments and whitespace (ignored in the pattern) — essential for non-trivial patterns that need to be readable:</p>
<pre><code>log_re = <span class="n">re</span>.<span class="n">compile</span>(<span class="sa">r</span><span class="s">"""
    (?P&lt;ts&gt;\S+)              # timestamp — non-whitespace
    \s+
    (?P&lt;level&gt;\S+)           # severity level — non-whitespace
    \s+
    (?P&lt;message&gt;.*)          # everything else
"""</span>, <span class="n">re</span>.<span class="n">VERBOSE</span>)</code></pre>
<p><strong>Lookarounds</strong> match positions in the text without consuming characters. A positive lookahead (<code>(?=...)</code>) checks that the pattern follows the current position; a negative lookahead (<code>(?!...)</code>) checks that it does not:</p>
<pre><code><span class="c"># Match ERROR but only when followed by a number (e.g., error code)</span>
error_with_code = <span class="n">re</span>.<span class="n">compile</span>(<span class="sa">r</span><span class="s">"ERROR(?=\s+\d+)"</span>)
<span class="n">error_with_code</span>.<span class="n">search</span>(<span class="s">"ERROR 404"</span>)   <span class="c"># matches</span>
<span class="n">error_with_code</span>.<span class="n">search</span>(<span class="s">"ERROR timeout"</span>)  <span class="c"># no match</span></code></pre>
<p><strong>Caching behaviour:</strong> The <code>re</code> module also caches the last several hundred patterns automatically (controlled by <code>re._MAXCACHE</code>). For scripts with a handful of patterns, the cache is sufficient. For libraries or hot loops, explicit <code>re.compile()</code> is still better — it communicates intent.</p>
<div class="callout"><strong>Consult the volumes:</strong> The <code>re</code> module is at <code>Lib/re/</code> — a package, not a single file. The engine is <code>Lib/re/compile.py</code> and <code>Lib/re/_parser.py</code>. For the C implementation of the matching engine, see <code>Modules/_sre.c</code> — the actual SRE (Secret Labs' Regular Expression) engine that runs the show.</div>
<div class="field-notes"><div class="fn-head">FIELD NOTES // BACKTRACKING & CATASTROPHIC BACKTRACKING</div>
<p>The SRE engine is a backtracking NFA — it tries every possible path through the pattern. A pattern like <code>(a+)+b</code> on input <code>"aaaaaaac"</code> can take exponential time because each <code>+</code> backtracks independently. The fix: <code>re.RE_NOGEN</code> is not available; instead, rewrite the pattern to avoid nested quantifiers, or use <code>(?>...)</code> atomic groups (Python 3.11+) to lock in a match once found. Always benchmark patterns on worst-case input.</p></div>
'''

[[lessons.exercises]]
id = "s07-l03-e1"
type = "mc"
points = 15
prompt = "What does <code>re.compile()</code> return?"
choices = ["A compiled regex pattern object with match/search/findall methods", "A string that can be passed to re.match", "A list of all matching patterns", "A boolean indicating whether the pattern is valid"]
answer = 0
whyWrong = "re.compile returns a <code>re.Pattern</code> object with methods like <code>.match()</code>, <code>.search()</code>, <code>.findall()</code>, and <code>.finditer()</code>. It is faster in loops because the pattern string is parsed only once."
hint = "What type of object would have .match() and .search() methods?"
explain = "re.compile() returns a compiled regex object with match/search/findall methods."

[[lessons.exercises]]
id = "s07-l03-e2"
type = "mc"
points = 15
prompt = "What does <code>(?P&lt;name&gt;...)</code> do in a regex?"
choices = ["Creates a named capturing group — the match is accessible by name via .group('name')", "Creates a non-capturing group", "Makes the group optional", "Inverts the match"]
answer = 0
whyWrong = "The <code>?P&lt;name&gt;</code> syntax assigns a name to the capturing group. Instead of <code>match.group(1)</code> you write <code>match.group('level')</code>, which is self-documenting and independent of group ordering."
hint = "What does 'P' stand for in the context of regex groups? (It stands for 'Python-specific extension')."
explain = "(?P<name>...) creates a named capturing group accessible via .group('name')."

[[lessons.exercises]]
id = "s07-l03-e3"
type = "text"
points = 20
prompt = "What flag makes whitespace and comments ignored in a regex pattern?"
answer = "re.VERBOSE"
accept = ["VERBOSE", "re.VERBOSE"]
hint = "It is a flag that allows the pattern to be 'wordy' with spaces and comments."

[[lessons.exercises]]
id = "s07-l03-e4"
type = "fill"
points = 20
prompt = "Fill the blank to compile a regex that uses the VERBOSE flag:"
code = '''import re
pattern = re.____(r"\d+", re.VERBOSE)'''
answer = "compile"
hint = "The function that parses a pattern string into a reusable regex object."

[[lessons.exercises]]
id = "s07-l03-w1"
type = "write"
points = 35
prompt = "Write a script that uses a compiled regex with named groups to parse log lines in the format <code>LEVEL: message</code>. The regex pattern should capture <code>level</code> (before the colon) and <code>message</code> (after the colon with leading space). Test it on <code>\"INFO: connection established\"</code> and print the matched groups as a dict."
starter = '''
import re

pattern = re.compile(r"(?P<level>\S+): (?P<message>.*)")
line = "INFO: connection established"
match = pattern.match(line)
if match:
    print(match.groupdict())
'''
expect = '''{'level': 'INFO', 'message': 'connection established'}'''
hint = "groupdict() returns all named groups as a dict — just call and print it."
