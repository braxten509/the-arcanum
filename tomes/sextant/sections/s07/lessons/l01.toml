[[lessons]]
id = "s07-l01"
title = "The Chart-Room's Shelves — collections"
body = '''
<p>The <code>collections</code> module is the chart-keeper's shelf of specialised containers. Each one solves a problem the builtin types handle poorly: counting frequencies, grouping keys to multiple values, preserving insertion order with reordering, composing multiple lookups, and efficient double-ended operations.</p>
<p><strong>Counter</strong> is a dict subclass designed for counting hashable objects. It is the tool for the most common aggregation task in log analysis: how many of each level, each source, each error type?</p>
<pre><code><span class="kn">from</span> <span class="nn">collections</span> <span class="kn">import</span> <span class="n">Counter</span>

levels = [<span class="s">"INFO"</span>, <span class="s">"ERROR"</span>, <span class="s">"INFO"</span>, <span class="s">"WARN"</span>, <span class="s">"INFO"</span>, <span class="s">"ERROR"</span>]
counts = Counter(levels)
<span class="k">print</span>(counts)                  <span class="c"># Counter({'INFO': 3, 'ERROR': 2, 'WARN': 1})</span>
<span class="k">print</span>(counts[<span class="s">"INFO"</span>])          <span class="c"># 3 — missing keys return 0, not KeyError</span>
<span class="k">print</span>(counts.most_common(<span class="mi">2</span>))   <span class="c"># [('INFO', 3), ('ERROR', 2)]</span></code></pre>
<p><strong>defaultdict</strong> is a dict that calls a factory function for missing keys. Use it when every key maps to a list, set, or int — no need to check <code>if key in d</code> before appending:</p>
<pre><code><span class="kn">from</span> <span class="nn">collections</span> <span class="kn">import</span> <span class="n">defaultdict</span>

by_source = defaultdict(<span class="nb">list</span>)     <span class="c"># missing key -> []</span>
by_source[<span class="s">"auth"</span>].append(<span class="s">"login"</span>)  <span class="c"># no KeyError, no init check</span>
by_source[<span class="s">"auth"</span>].append(<span class="s">"logout"</span>)
<span class="k">print</span>(by_source[<span class="s">"auth"</span>])         <span class="c"># ['login', 'logout']</span></code></pre>
<p><strong>OrderedDict</strong> preserves key insertion order and adds methods like <code>move_to_end()</code> for explicit reordering. Since Python 3.7, regular dicts also preserve insertion order, so <code>OrderedDict</code> is now used only when you need <code>move_to_end()</code> or equality checks that consider order.</p>
<p><strong>ChainMap</strong> groups multiple dicts into a single view. Lookups search each dict in order; writes affect the first dict. Useful for layered configuration (defaults overlayed by user settings):</p>
<pre><code><span class="kn">from</span> <span class="nn">collections</span> <span class="kn">import</span> <span class="n">ChainMap</span>
defaults = {<span class="s">"format"</span>: <span class="s">"text"</span>, <span class="s">"verbose"</span>: <span class="kc">False</span>}
overrides = {<span class="s">"verbose"</span>: <span class="kc">True</span>}
config = ChainMap(overrides, defaults)
<span class="k">print</span>(config[<span class="s">"format"</span>])         <span class="c"># "text" — from defaults</span>
<span class="k">print</span>(config[<span class="s">"verbose"</span>])        <span class="c"># True — from overrides</span></code></pre>
<p><strong>deque</strong> (double-ended queue) is a list-like container optimized for fast appends and pops at both ends (<code>O(1)</code> vs list's <code>O(1)</code> at the right and <code>O(n)</code> at the left). Use it for sliding windows, ring buffers, and tail-following:</p>
<pre><code><span class="kn">from</span> <span class="nn">collections</span> <span class="kn">import</span> <span class="n">deque</span>
last_10 = deque(maxlen=<span class="mi">10</span>)       <span class="c"># auto-evicts when full</span>
<span class="k">for</span> line <span class="ow">in</span> log_lines:
    last_10.append(line)          <span class="c"># only the most recent 10 are kept</span></code></pre>
<div class="callout"><strong>Consult the volumes:</strong> The <code>collections</code> module is at <code>Lib/collections/__init__.py</code>. <code>Counter</code> is one of the best-documented Python classes in the stdlib — its docstring is a thorough tutorial in itself. The ABCs in <code>collections.abc</code> are the underlying protocol definitions.</div>
'''

[[lessons.exercises]]
id = "s07-l01-e1"
type = "mc"
points = 15
prompt = "What does <code>Counter.most_common(n)</code> return when there are fewer than <code>n</code> distinct items?"
choices = ["An empty list", "All items, in descending order of frequency", "The n items with the last items set to 0", "A ValueError"]
answer = 1
whyWrong = "most_common(n) returns the n most common items, but if there are fewer than n distinct items, it returns all of them — never raises, never pads. This is a sensible default: 'give me the top N, or everything if there aren't that many'."
hint = "What would be the most useful behaviour — error, empty, or just return what exists?"
explain = "most_common returns all items if fewer than n exist — it does not raise or pad."

