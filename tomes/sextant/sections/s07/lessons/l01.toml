[[lessons.exercises]]
id = "s07-l01-e3"
type = "mc"
points = 15
prompt = "What is the advantage of <code>deque(maxlen=N)</code> over a list for tracking the most recent N items?"
choices = ["It automatically discards items beyond the max length at O(1) cost", "It is faster at random access", "It uses less memory for small collections", "It supports slicing like a list"]
answer = 0
whyWrong = "deque with maxlen provides an automatic sliding window: when you append beyond maxlen, the oldest item is discarded — O(1) at both ends. A list would require pop(0) which is O(n)."
hint = "What does a deque with maxlen do when it reaches capacity and a new item is added?"
explain = "A deque with maxlen automatically discards the oldest item in O(1) when appending beyond capacity."

[[lessons.exercises]]
id = "s07-l01-e4"
type = "fill"
points = 20
prompt = "Fill the blank to create a ChainMap with user settings overriding defaults:"
code = '''from collections import ChainMap
defaults = {"theme": "dark", "volume": 5}
user = {"theme": "light"}
config = ____(user, defaults)'''
answer = "ChainMap"
hint = "The class name — it chains multiple maps into a single view, searching in order."

[[lessons.exercises]]
id = "s07-l01-w1"
type = "write"
points = 35
prompt = "Write a script that uses <code>collections.Counter</code> to count the frequencies of each word in the list <code>words = [\"INFO\", \"ERROR\", \"INFO\", \"WARN\", \"INFO\", \"ERROR\"]</code>, then prints the two most common words."
starter = '''
from collections import Counter

words = ["INFO", "ERROR", "INFO", "WARN", "INFO", "ERROR"]
# your code here
'''
expect = '''[('INFO', 3), ('ERROR', 2)]'''
hint = "Pass the list to Counter(), then call .most_common(2) and print the result."
