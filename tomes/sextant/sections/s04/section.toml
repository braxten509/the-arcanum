id = "s04"
codename = "CHAPTER IV // THE CHART-ROOM'S TOOLS"
short = "The Chart-Room's Tools"
title = "Decorators & Closures"
build = "Plugin registry — @handler decorator registers analyses by side-effect at import time"
brief = "<p>A chart-keeper does not carve a new instrument for every new type of sighting. He mounts a bracket on the chart-table — a standard interface — and slides in whatever instrument the bearing demands. In Python, that bracket is the <strong>decorator</strong>: a function that takes another function and extends its behaviour without editing its body.</p><p>Decorators are the load-bearing idiom for the Sextant plugin registry. A <code>@handler(level=\"WARN\")</code> annotation on any function, anywhere in the codebase, registers that function as a handler for WARN-level logs. No central switch statement, no manual list of plugins — imports do the registration by side-effect. This is the power of treating functions as first-class values and closures as sealed orders that carry their own context.</p><p>By the end of this bearing, new analyses drop into Sextant as decorated functions, added to the registry by import alone.</p>"
