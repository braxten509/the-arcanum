[freestyle]
title = "THE WORKING: THE CHART-ROOM'S TOOLS"
brief = "<p>Add a decorator-based plugin registry to Sextant. The goal: any function decorated with <code>@handler</code> registers itself automatically:</p><ul><li>Create a global list <code>_registry: list[HANDLER]</code> that stores registered handler functions</li><li>Define <code>Handler</code> as a <code>Protocol</code> class with a single method signature: <code>def __call__(self, record: LogRecord) -> str | None</code> — handlers return a formatted string or None if they have nothing to say</li><li>Write a parameterised decorator <code>@handler(level=\"INFO\")</code> that registers the decorated function in <code>_registry</code> and wraps it with <code>functools.wraps</code>. The decorator should also attach a <code>.level</code> attribute to the function so the registry can filter by level</li><li>Write a function <code>run_handlers(records: Iterator[LogRecord], level: str) -> Iterator[str]</code> that runs all handlers registered for that level on each record and yields non-None results</li><li>Demonstrate by defining two handlers: one for ERROR that returns <code>[ALERT] {record.message}</code> and one for INFO that returns nothing (INFO is routine — no need to flag it)</li></ul>"
reward = 180
xray = "The grader docks points for: not using functools.wraps (the wrapped function loses its name and docstring); mutating global state in a way that breaks re-import; not attaching .level to the decorated function; handlers that crash on unexpected input. He gives style credit for: using Callable or a Protocol type for the registry; clean separation of registration from invocation; a design where adding a new handler requires editing nothing but the new handler's file."

