[[lessons]]
id = "s01-l01"
title = "Values, Types & the Chart-Keeper's Ink"
body = '''
<p>Every bearing begins with a sighting — a raw datum from the world outside the chart-room. In Python, every value is a <strong>first-class citizen</strong> with a type the interpreter knows: an integer, a float, a string, a boolean, <code>None</code>. You do not declare the type; the value brings it, and you discover it by reading the instrument (<code>type()</code>) or by trusting what you assigned.</p>
<pre><code><span class="c"># The sextant's first readings — every value carries its type</span>
lat = 51.4826             <span class="c"># float</span>
bearing = 7               <span class="c"># int</span>
name = <span class="s">"Aldren"</span>          <span class="c"># str</span>
at_sea = True             <span class="c"># bool</span>
log_line = <span class="s">"2025-07-07 14:30:00 INFO Chart plotted successfully"</span></code></pre>
<p>This is the dynamic type system that every Python practitioner navigates. The same variable can hold a string in one moment and an integer in the next — not that a chart-keeper <em>would</em> do that, but the language permits it where a stricter vessel would not. The discipline is yours, not the compiler's.</p>
<p><strong>Strings</strong> are the most common cargo in Sextant: log lines arrive as strings, file names are strings, report output is built from strings. Python gives you several ways to compose them:</p>
<pre><code>line = <span class="s">"INFO | Connection established"</span>
<span class="c"># f-strings — the sextant's own method, clear and direct</span>
greeting = <span class="s">f"[BEARING] {line}"</span>
<span class="k">print</span>(greeting)</code></pre>
<p>An f-string evaluates each <code>{expr}</code> at runtime and formats the result as a string. This is the tool you will reach for first in every bearing from now on — more readable than concatenation, faster than <code>%</code>-formatting, and understood by every modern Python interpreter.</p>
<p><strong>Booleans</strong> and <strong>None</strong> complete the basic set: <code>None</code> is the chart-room's empty slate, not zero, not false, just absent. A function that could not take a sighting returns <code>None</code>. A config key that was not set reads as <code>None</code>. Test for it with <code>is None</code>, never <code>== None</code>.</p>
<pre><code>result = <span class="k">None</span>  <span class="c"># the sighting failed — glass was clouded</span>
<span class="k">if</span> result <span class="ow">is</span> <span class="kc">None</span>:
    <span class="k">print</span>(<span class="s">"No reading. Check the horizon."</span>)</code></pre>
<div class="callout"><strong>Consult the volumes:</strong> <code>type()</code> is a built-in function, but the type system lives in <code>builtins</code> and the <code>types</code> module. Open the stdlib source for <code>builtins</code> and find how <code>bool</code> is a subclass of <code>int</code> — a quirk of history that still surfaces in edge cases today. The chart-room's own volumes hold the full account.</div>
<div class="field-notes"><div class="fn-head">FIELD NOTES // TYPE DISCIPLINE</div>
<p>The <code>is</code> operator compares <strong>identity</strong>, not equality. Python caches small integers (-5 to 256) and interns short strings, so <code>256 is 256</code> is <code>True</code> in CPython but <code>257 is 257</code> may be <code>False</code> — a detail that has mischarted many a bearing. Use <code>==</code> for value comparison (two logs with identical content) and <code>is</code> only for <code>None</code>, <code>True</code>, <code>False</code>, and sentinel objects you define. Consult <code>sys.intern()</code> if string interning ever becomes load-bearing in your own code — a tool the stdlib provides but you will seldom need.</p></div>
'''

[[lessons.exercises]]
id = "s01-l01-e1"
type = "mc"
points = 15
prompt = "What type does the expression <code>type(3.14)</code> return?"
choices = ["int", "float", "str", "decimal.Decimal"]
answer = 1
whyWrong = "In Python, <code>3.14</code> is a <code>float</code> literal. <code>int</code> would be the type of <code>3</code> (no decimal point), <code>str</code> would need quotes around it, and <code>decimal.Decimal</code> must be imported explicitly — the plain literal is always <code>float</code>."
hint = "Consider how Python's literal syntax works: a number with a decimal point is a <code>float</code>."
explain = "Any numeric literal with a decimal point is parsed as a <code>float</code> in Python, regardless of whether the fractional part is zero."

[[lessons.exercises]]
id = "s01-l01-e2"
type = "mc"
points = 15
prompt = "Which of these is NOT a valid Python variable name?"
choices = ["bearing_1", "_bearing_1", "1st_bearing", "bearing1"]
answer = 2
whyWrong = "Python variable names must start with a letter or underscore. <code>1st_bearing</code> begins with a digit, which is a syntax error. The other three are all valid: underscores are allowed anywhere and are conventional for private or internal names."
hint = "Check which character each name starts with — a variable name cannot begin with a number."
explain = "Python identifiers must start with a letter (A-Z, a-z) or underscore, followed by any number of letters, digits, or underscores."

[[lessons.exercises]]
id = "s01-l01-e3"
type = "text"
points = 20
prompt = "What built-in function do you call to display values to the console?"
answer = "print"
accept = ["print()"]
hint = "Think of the function that writes to standard output — it is what every lesson and every Great Working uses to report results."

[[lessons.exercises]]
id = "s01-l01-e4"
type = "fill"
points = 20
prompt = "Fill the blank to assign the string <code>\"Aldren\"</code> to the variable <code>keeper</code>:"
code = "keeper = ____"
answer = '"Aldren"'
accept = ["\"Aldren\"", "'Aldren'"]
hint = "Strings are enclosed in matching quotes — single or double, as long as they match."

[[lessons.exercises]]
id = "s01-l01-d1"
type = "type"
points = 12
reps = 2
prompt = "Retype this f-string that formats a log greeting:"
code = '''name = "navigator"
print(f"Welcome, {name}. The glass is set.")'''

[[lessons.exercises]]
id = "s01-l01-w1"
type = "write"
points = 30
prompt = "Write a Python script that defines a variable <code>bearing</code> with the value 7, a variable <code>keeper</code> with the value <code>\"Aldren\"</code>, and prints exactly: <code>BEARING 7 — KEEPER Aldren</code>. Use an f-string, not concatenation."
starter = '''
bearing = 7
keeper = "Aldren"
'''
expect = '''
BEARING 7 — KEEPER Aldren'''
hint = "Use an f-string: <code>f\"...{expression}...\"</code> to embed the variables directly."
