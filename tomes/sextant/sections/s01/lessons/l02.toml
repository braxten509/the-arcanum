[[lessons.exercises]]
id = "s01-l02-w1"
type = "write"
points = 30
prompt = "Write a Python script that defines a function <code>classify_line</code> taking one string argument <code>line</code>. If the line contains <code>\"ERROR\"</code>, print <code>\"[CRITICAL]\"</code>. If it contains <code>\"WARN\"</code>, print <code>\"[FLAG]\"</code>. Otherwise print <code>\"[OK]\"</code>. Then call it with the line <code>\"ERROR Disk full\"</code>."
starter = '''
def classify_line(line):
    # your code here

classify_line("ERROR Disk full")
'''
expect = '''[CRITICAL]'''
hint = "Use the <code>in</code> operator to check substring membership: <code>if \"ERROR\" in line:</code>"
