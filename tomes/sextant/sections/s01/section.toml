title = "Python Refresher & the Sextant Skeleton"
build = "First heartbeat — a one-file script that opens a log and greets the chart-keeper"
brief = "<p>The chart-room is quiet. The night sky is clear. On the table before you lie the first pieces of a real instrument: a plain Python file, a log, and the in-browser workbench that will carry every bearing to come.</p><p>This bearing is the one allowed look back. You already know the basics — variables, types, control flow, functions, lists, dicts — so we take them at pace, a chart-room review that names them in the tongue we will use for the rest of the commission. Every later bearing builds something Sextant needs; this one proves the toolchain runs and that you, navigator, can make it speak.</p><p>By the end you will have opened a log file, printed a formatted greeting, and felt the glass settle in your hand. The other bearings will add depth; this one gives you the horizon.</p>"
