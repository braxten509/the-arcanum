[freestyle]
title = "THE WORKING: THE FIRST BEARING"
brief = "<p>Sextant needs a single-file heartbeat. Open <code>main.py</code> in the Sextant workbench and make it a real tool that:</p><ul><li>Opens a log file whose path is given as a command-line argument (<code>sys.argv[1]</code>)</li><li>Reads only the <strong>first line</strong> of that file (proving the file opens — the streaming parser comes in s03)</li><li>Parses the line into four variables — <code>ts</code>, <code>level</code>, <code>message</code>, <code>source</code> — by splitting on whitespace (the <code>re</code> module waits until s07)</li><li>Prints a formatted greeting line: <code>[BEARING TAKEN] &lt;ts&gt; &lt;level&gt;: &lt;message&gt; (from &lt;source&gt;)</code></li><li>Handles the case where no path is given: prints <code>Usage: python main.py &lt;logfile&gt;</code> and exits</li><li>Does <strong>not</strong> hardcode the log content or the filename — the same script must work on any plain-text log</li></ul><p>No mocks, no fog-maps. If it runs on a real log, you have taken your first bearing.</p>"
reward = 150
xray = "The grader docks points for: missing usage message when argv is empty; hardcoded log content or filename; using read() instead of reading one line (slurping is the habit the course un-teaches); catching bare Exception (too wide). He gives style credit for: clean with statement (open inside a context manager even before s06 teaches them formally); meaningful variable names; the greeting format matching exactly."

[freestyle.badge]
id = "badge-s01"
name = "FIRST BEARING"
desc = "Plotted the first sight — the tool proves it runs."

[[freestyle.rubric]]
criterion = "Compiles & runs"
weight = 40
desc = "Build succeeds; runs without crashing on a normal log line."

[[freestyle.rubric]]
criterion = "Meets the brief"
weight = 40
desc = "Every requirement in the checklist is present and correct."

[[freestyle.rubric]]
criterion = "Clean style"
weight = 20
desc = "PEP 8: snake_case, 4-space indent, no mutable globals, meaningful names."
