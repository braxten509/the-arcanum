[[lessons]]
id = "s06-l04"
title = "Composing Managers with ExitStack"
body = '''
<p>When a <code>with</code> block needs only one manager, the <code>with</code> statement is elegant. When it needs a variable number — open files whose count is known only at runtime — you need <code>contextlib.ExitStack</code>. It is a context manager that manages other context managers, entering them as they are added and guaranteeing that all of them are exited, in reverse order, when the stack exits.</p>
<pre><code><span class="kn">from</span> <span class="nn">contextlib</span> <span class="kn">import</span> <span class="n">ExitStack</span>

<span class="k">def</span> <span class="nf">open_logs</span><span class="p">(</span><span class="o">*</span><span class="n">paths</span>: <span class="nb">str</span><span class="p">):</span>
    <span class="k">with</span> <span class="n">ExitStack</span>() <span class="k">as</span> <span class="n">stack</span>:
        files = [stack.enter_context(<span class="nb">open</span>(p)) <span class="k">for</span> p <span class="ow">in</span> paths]
        <span class="c"># All files are open. Exiting the with block closes them all,</span>
        <span class="c"># even if one of them raised on open.</span>
        <span class="k">for</span> f <span class="ow">in</span> files:
            <span class="k">print</span>(<span class="n">f</span>.<span class="n">readline</span>())
    <span class="c"># All files closed here, regardless of how we exited the block</span></code></pre>
<p><code>ExitStack.enter_context(cm)</code> calls <code>cm.__enter__()</code> and registers the manager so its <code>__exit__</code> will be called when the stack exits. If <code>enter_context</code> itself raises (e.g., <code>FileNotFoundError</code> on open), the managers already entered are cleaned up immediately — no orphaned resources.</p>
<p><strong>Partial failure preservation:</strong> This is the pattern Sextant uses to write a partial report even when some files are malformed. The top-level manager opens the report file and wraps the entire run:</p>
<pre><code><span class="nd">@contextmanager</span>
<span class="k">def</span> <span class="nf">partial_report</span><span class="p">(</span><span class="n">path</span>: <span class="nb">str</span><span class="p">):</span>
    <span class="k">with</span> <span class="nb">open</span>(<span class="n">path</span>, <span class="s">"w"</span>) <span class="k">as</span> <span class="n">f</span>:
        lines = []
        <span class="k">try</span>:
            <span class="k">yield</span> <span class="n">lines</span>               <span class="c"># caller appends to lines during processing</span>
        <span class="k">finally</span>:
            <span class="k">for</span> line <span class="ow">in</span> lines:          <span class="c"># write whatever we collected</span>
                <span class="n">f</span>.<span class="n">write</span>(<span class="n">line</span> + <span class="s">"\n"</span>)</code></pre>
<p>The caller appends report lines as it processes files. If file 5 of 100 raises an unhandled exception, the <code>finally</code> still writes the partial report from files 1–4 — Sextant fails gracefully with output, not silently with nothing.</p>
<p><strong>contextlib.suppress</strong> is a simpler tool for ignoring known exceptions without a try/except block:</p>
<pre><code><span class="kn">from</span> <span class="nn">contextlib</span> <span class="kn">import</span> <span class="n">suppress</span>

<span class="k">with</span> <span class="n">suppress</span>(<span class="ne">FileNotFoundError</span>):
    <span class="n">os</span>.<span class="n">remove</span>(<span class="s">"temp.log"</span>)          <span class="c"># silently continue if it doesn't exist</span></code></pre>
<div class="callout"><strong>Consult the volumes:</strong> The <code>contextlib</code> source (<code>Lib/contextlib.py</code>) implements <code>ExitStack</code> as a class with <code>__enter__</code>/<code>__exit__</code> and a list of registered callbacks. Its <code>pop_all()</code> method transfers registered managers to a new stack — useful for committing a transactional resource setup where partial failure should undo everything.</div>
<div class="field-notes"><div class="fn-head">FIELD NOTES // NESTED STACK CLEANUP ORDER</div>
<p>ExitStack exits managers in reverse registration order — last in, first out. This is consistent with <code>with</code> nesting where the outer manager exits after the inner one. If you register a resource that depends on another resource (a database connection that must close before the network socket), register the dependent resource first so it exits before its dependency.</p></div>
'''

[[lessons.exercises]]
id = "s06-l04-e1"
type = "mc"
points = 15
prompt = "What does <code>ExitStack</code> do when one of its <code>enter_context</code> calls raises?"
choices = ["Closes already-entered managers in reverse order, then re-raises", "Ignores the error and continues", "Keeps all entered managers open", "Raises without cleanup"]
answer = 0
whyWrong = "ExitStack guarantees cleanup on partial failure. If the third enter_context raises, the first two managers' __exit__ methods are called in reverse order before the exception propagates. This is the same guarantee that a `with` block gives for a single manager, extended to the dynamic case."
hint = "ExitStack's invariant is 'no leaked resources'. What must it do when a later enter fails?"
explain = "ExitStack cleans up already-entered managers in reverse order, then re-raises the exception."

[[lessons.exercises]]
id = "s06-l04-e2"
type = "fill"
points = 20
prompt = "Fill the blank to add a context manager to an ExitStack:"
code = '''with ExitStack() as stack:
    stream = stack.____(open("file.txt"))'''
answer = "enter_context"
hint = "The method name starts with 'enter' — it is the exit stack's equivalent of entering a with block."

[[lessons.exercises]]
id = "s06-l04-e3"
type = "text"
points = 20
prompt = "What <code>contextlib</code> utility ignores specified exceptions without a try/except block?"
answer = "suppress"
accept = ["contextlib.suppress"]
hint = "Its name means 'to stop yourself from showing a feeling' — applied to exceptions."

[[lessons.exercises]]
id = "s06-l04-w1"
type = "write"
points = 35
prompt = "Write a function <code>read_two(path1, path2)</code> that uses <code>ExitStack</code> to open both files, reads the first line of each, and returns them as a tuple. Use <code>with ExitStack() as stack:</code> and <code>stack.enter_context(open(p))</code> for each file. Call it on two files that you create for the purpose — use a simple <code>with open(path, 'w') as f: f.write('line1\n')</code> pattern before."
starter = '''
from contextlib import ExitStack

# Create test files first
with open("a.txt", "w") as f:
    f.write("first\n")
with open("b.txt", "w") as f:
    f.write("second\n")

def read_two(path1, path2):
    with ExitStack() as stack:
        f1 = stack.enter_context(open(path1))
        f2 = stack.enter_context(open(path2))
        return (f1.readline().strip(), f2.readline().strip())

result = read_two("a.txt", "b.txt")
print(result)
'''
expect = '''('first', 'second')'''
hint = "Enter each file into the stack, call readline().strip() on both, return the tuple."
