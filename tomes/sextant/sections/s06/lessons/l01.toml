[[lessons]]
id = "s06-l01"
title = "The Watch-Bell Protocol — __enter__ & __exit__"
body = '''
<p>A context manager is an object that defines <code>__enter__</code> and <code>__exit__</code>. The <code>with</code> statement calls <code>__enter__</code> at the top of the block, binds its return value to the <code>as</code> target, and guarantees that <code>__exit__</code> is called when the block exits — whether by normal completion, <code>return</code>, <code>break</code>, or an unhandled exception.</p>
<pre><code><span class="kn">import</span> <span class="nn">time</span>

<span class="k">class</span> <span class="nc">Timer</span>:
    <span class="k">def</span> <span class="nf">__enter__</span><span class="p">(</span><span class="bp">self</span><span class="p">):</span>
        <span class="bp">self</span>.<span class="n">start</span> = <span class="n">time</span>.<span class="n">time</span>()
        <span class="k">print</span>(<span class="s">"WATCH STARTED"</span>)
        <span class="k">return</span> <span class="bp">self</span>

    <span class="k">def</span> <span class="nf">__exit__</span><span class="p">(</span><span class="bp">self</span>, <span class="n">exc_type</span>, <span class="n">exc_val</span>, <span class="n">exc_tb</span><span class="p">):</span>
        <span class="n">elapsed</span> = <span class="n">time</span>.<span class="n">time</span>() - <span class="bp">self</span>.<span class="n">start</span>
        <span class="k">print</span>(<span class="sa">f</span><span class="s">"WATCH ENDED — {elapsed:.2f}s"</span>)
        <span class="k">return</span> <span class="kc">False</span>  <span class="c"># do not suppress exceptions</span></code></pre>
<p>Using it:</p>
<pre><code><span class="k">with</span> <span class="n">Timer</span>() <span class="k">as</span> <span class="n">t</span>:
    <span class="n">process_logs</span>(<span class="s">"syslog"</span>)
<span class="c"># WATCH STARTED</span>
<span class="c"># (work happens)</span>
<span class="c"># WATCH ENDED — 0.34s</span></code></pre>
<p>The <code>__exit__</code> method receives three arguments: the exception type (or <code>None</code> if no exception), the exception value, and the traceback. If the block raised, these are filled; if it succeeded, all three are <code>None</code>. The return value of <code>__exit__</code> controls exception propagation:</p>
<ul>
<li>Return <code>True</code> — the exception is <strong>suppressed</strong>. The <code>with</code> block completes as if nothing happened. Use this only when the manager truly handled the exception.</li>
<li>Return <code>False</code> — the exception <strong>propagates</strong> normally after <code>__exit__</code> completes. This is the safe default.</li>
</ul>
<p>The genius of the protocol is that <code>__exit__</code> runs even when an exception occurs. File handles are closed, locks are released, timers are stopped — all guaranteed by the language, not by the programmer's discipline. This is why you always open files with <code>with open(...) as f:</code> — it is not just convention; it is correctness.</p>
<div class="callout"><strong>Consult the volumes:</strong> <code>contextlib</code> is the stdlib module for context manager utilities. Its <code>contextmanager</code>, <code>closing</code>, <code>suppress</code>, <code>redirect_stdout</code>, and <code>ExitStack</code> are all implemented in pure Python — <code>Lib/contextlib.py</code> is a master class in the protocol.</div>
'''

[[lessons.exercises]]
id = "s06-l01-e1"
type = "fill"
points = 20
prompt = "Fill the blank to complete the __exit__ signature:"
code = '''def __exit__(self, exc_type, exc_val, ____):'''
answer = "exc_tb"
accept = ["exc_tb", "traceback"]
hint = "The third argument is the traceback object — short for 'traceback'."

[[lessons.exercises]]
id = "s06-l01-e2"
type = "mc"
points = 15
prompt = "What does returning <code>True</code> from <code>__exit__</code> do?"
choices = ["Reraises the exception with a new message", "Suppresses the exception — the with block completes without error", "Closes the context manager permanently", "Logs the exception and continues"]
answer = 1
whyWrong = "Returning True from __exit__ tells Python 'the exception has been handled, do not propagate it'. This is rarely what you want — it hides errors. The default (returning None/False) lets exceptions propagate normally."
hint = "What does 'True' signal about whether the exception was 'handled'?"
explain = "Returning True suppresses any exception that occurred — the caller sees no error."

[[lessons.exercises]]
id = "s06-l01-d1"
type = "type"
points = 12
reps = 2
prompt = "Retype this context manager skeleton:"
code = '''class MyManager:
    def __enter__(self):
        print("enter")
        return self
    def __exit__(self, exc_type, exc_val, exc_tb):
        print("exit")
        return False'''

[[lessons.exercises]]
id = "s06-l01-w1"
type = "write"
points = 30
prompt = "Write a context manager class <code>Greeter</code> that prints <code>HELLO</code> on entry and <code>GOODBYE</code> on exit. Use it with <code>with Greeter(): print(\"inside\")</code>."
starter = '''
class Greeter:
    def __enter__(self):
        print("HELLO")
        return self
    # you write __exit__

with Greeter():
    print("inside")
'''
expect = '''HELLO
inside
GOODBYE'''
hint = "The __exit__ method should print 'GOODBYE' and return False (don't suppress exceptions)."
