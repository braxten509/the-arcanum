id = "s06"
codename = "CHAPTER VI // THE WATCH-BELL"
short = "The Watch-Bell"
title = "Context Managers & Exception Discipline"
build = "Context-manager-wrapped run — timing, per-file error isolation, partial report on failure"
brief = "<p>The watch-bell rings once at the start of a watch and once at the end — a rhythm so constant that the sailor feels the gap when it misses. In Python, the <code>with</code> statement is that bell: it guarantees setup and teardown around a block of code, every time, without fail. A file is opened and closed. A lock is acquired and released. A timer is started and stopped.</p><p>This bearing teaches the navigator to build their own context managers — the <code>__enter__</code>/<code>__exit__</code> protocol for wrapped code and the <code>@contextmanager</code> decorator for concise single-use managers — and to compose them with <code>contextlib.ExitStack</code> for complex setups. Paired with disciplined exception handling (<code>try/except/else/finally</code>), these tools let Sextant time its runs, isolate per-file errors without aborting the directory walk, and write a partial report even when one file is malformed.</p>"
