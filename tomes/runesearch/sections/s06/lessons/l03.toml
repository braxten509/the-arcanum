# Lesson s06-l03 manifest
[[lessons]]
id = '''s06-l03'''
title = '''Walking the Archive'''
body = '''<p>To process every log in our collection, we must iterate over the vector. A scribe can iterate over immutable references, mutable references, or take ownership of the elements entirely. We use a <code>for</code> loop to walk the vector.</p>
<p>Iterating over immutable references allows us to read the elements without moving their ownership. We borrow each element in turn using the reference syntax <code>&amp;logs</code>:</p>
<pre><code>let logs = vec![String::from("A"), String::from("B")];
for log in &amp;logs {
    println!("Log: {}", log); // log is &amp;String
}</code></pre>
<p>If we need to modify the elements in place, we iterate over mutable references using <code>&amp;mut logs</code>. If we iterate over the vector directly (<code>for log in logs</code>), we consume the vector, moving ownership of its elements out of the collection.</p>
<div class="field-notes"><div class="fn-head">FIELD NOTES // ITERATOR CONVERSIONS</div>
<p>Rust automatically converts <code>&amp;logs</code> into an iterator using the <code>IntoIterator</code> trait. Under the hood, this calls <code>logs.iter()</code>, which yields immutable references to the collection's items.</p></div>
<p>Iterating over vectors processes elements sequentially. Scribes can borrow elements immutably to read them, borrow them mutably to modify them, or consume the vector to move ownership. This matches various pipeline tasks.</p>
<p>For loops automatically convert vector references into iterators under the hood, simplifying the loop syntax and keeping the iteration logic clear.</p>
<p>Scribes should avoid mutating vector structures (like pushing or popping elements) while iterating over them, as this causes compiler borrow checker failures.</p>
<p>The archivist monitors iteration loops. By processing elements via references, we walk through log collections without copying data, keeping memory usage constant.</p>
<p>Understanding reference loops is key to writing clean search algorithms. It enables walking through massive log lists in constant memory and high speed.</p>
<p>Ensure that iteration methods reflect ownership goals. Consuming loops use into_iter(), while simple lookups iterate over borrowed elements using standard loop patterns. Scribes must also ensure that reference iterations do not hold locks longer than necessary. Releasing references promptly allows subsequent steps in the database logic to access the vector without delays.</p>'''

