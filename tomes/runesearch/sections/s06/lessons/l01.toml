# Lesson s06-l01 manifest
[[lessons]]
id = '''s06-l01'''
title = '''The Growable Ledger'''
body = '''<p>Our log parser must parse many entries and store them in memory. To store multiple values of the same type in a single, growable collection, we use a Vector, written as <code>Vec&lt;T&gt;</code>. Vectors store values in contiguous memory on the heap.</p>
<p>To create a new, empty vector, we invoke <code>Vec::new()</code>. We must declare it as mutable if we intend to append elements. Alternatively, we can initialize a vector with starting values using the <code>vec![]</code> macro:</p>
<pre><code>let mut log_ids: Vec&lt;u32&gt; = Vec::new();
log_ids.push(101);
log_ids.push(102); // Growing the vector

let severities = vec![1, 2, 5]; // Initialized using macro</code></pre>
<p>Like any heap-allocated collection, a vector owns its elements. When a vector is dropped, all of its elements are dropped as well. If we push an owned value (like a <code>String</code>) into a vector, ownership of that value moves into the vector.</p>
<div class="field-notes"><div class="fn-head">FIELD NOTES // VECTOR MEMORY</div>
<p>A vector has a pointer to the heap, a length, and a capacity. When the length exceeds the capacity, the vector allocates a larger block of memory on the heap, copies its elements, and deallocates the old block.</p></div>
<p>Vectors store growable, contiguous lists on the heap. Scribes use Vec to collect log records in memory. Pushing elements grows the vector, causing reallocation when capacity is exceeded, which can be optimized by pre-allocating memory.</p>
<p>Vectors own their elements, dropping them when the collection goes out of scope. Understanding this lifecycles ensures safe collection management in the search engine.</p>
<p>Scribes should choose vector types that match domain attributes, ensuring all elements in the collection share the same structure and size for efficient memory alignment.</p>
<p>The archivist counts every vector allocation. By using Vec::with_capacity when the element count is known, we avoid multiple reallocations, minimizing memory copying steps.</p>
<p>Contiguous storage in memory ensures excellent CPU cache utilization, making vector iteration significantly faster than walking through linked node lists.</p>
<p>Scribes must remember that pushing values transfers ownership of the pushed item. If you push an owned String, the caller can no longer read it directly.</p>'''

