[[lessons.exercises]]
id = "s06-l02-w1"
type = "write"
points = 35
prompt = '''Given `logs_parsed = vec![10, 20]`, safely read index `1` using `get` and match it to print `Val: 20`.'''
expect = '''Val: 20
'''
solution = '''fn main() {
    let logs_parsed = vec![10, 20];
    match logs_parsed.get(1) {
        Some(val) => println!("Val: {}", val),
        None => {},
    }
}'''
