# Lesson s06-l02 manifest
[[lessons]]
id = '''s06-l02'''
title = '''Accessing the Ledger'''
body = '''<p>To read elements stored inside our vectors, a scribe can use two primary approaches: indexing using bracket syntax, or utilizing the safe <code>get</code> method. Let us examine the critical differences between these tools.</p>
<p>Indexing via brackets returns a reference directly, but if the index is out of bounds, the program will panic and crash. This is unsafe when dealing with unpredictable user inputs:</p>
<pre><code>let logs = vec!["auth_ok", "disk_warn"];
let first = &amp;logs[0]; // Returns "&amp;str", crashes if empty</code></pre>
<p>The <code>get</code> method takes an index and returns an <code>Option&lt;&amp;T&gt;</code>. If the index is valid, it returns <code>Some(&amp;value)</code>. If the index is out of bounds, it returns <code>None</code>, allowing the scribe to handle the error gracefully without panicking.</p>
<div class="field-notes"><div class="fn-head">FIELD NOTES // SAFETY PRINCIPLES</div>
<p>Prefer bracket indexing when you are certain the index is within bounds (e.g., inside loops bounded by length). Use <code>get</code> when the index comes from external sources like CLI input or config files.</p></div>
<p>Accessing vector elements requires checking index boundaries. Scribes should use the safe get method, which returns Option, handling None cases gracefully. This prevents panics when reading corrupted logs or invalid indexes.</p>
<p>Bracket indexing is faster but risks crashing the process if the index is out of bounds, so it should only be used when bounds are verified by code logic.</p>
<p>Scribes must handle out-of-bounds cases defensively, fallback to safe defaults or printing informative alerts, rather than letting the application crash abruptly.</p>
<p>The archivist checks access patterns. By checking boundaries safely, our search engine remains stable even when processing malformed index configurations or queries.</p>
<p>Safe access methods shift runtime index checks into standard Option patterns, matching the reliability standards required for the scriptorium tools.</p>
<p>Scribes who master vector boundary checks write robust CLI tools. By validating indices dynamically, you guarantee that runtime exceptions are completely avoided in production. By structuring our lookups dynamically, we ensure that index requests that fall outside the current vector capacity are intercepted before they can cause thread interruption or runtime failures.</p>'''

