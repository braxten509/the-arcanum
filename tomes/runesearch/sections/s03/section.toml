id = "s03"
codename = "TREATISE III // THE IMMUTABLE PACT"
short = "Ownership & Borrowing"
title = "The Immutable Pact"
build = "Teaches ownership and borrowing to satisfy the borrow checker—enabling safe, efficient parsing of log records without excess cloning."
brief = "<p>You have spoken control flow into existence. Now Vane reveals the deepest law of the archive: every resource has a single steward. Ownership and borrowing are not nuisances to dodge—they are the foundation of Rust's safety. In this treatise, you will master the rules that keep memory corruption out of your log engine: when a value is moved, when it is borrowed, and how lifetimes guard against dangling references. No garbage collector will save you; the compiler is your guardian.</p>"
