[[lessons]]
id = "s03-l03"
title = "Lifetimes: Guarding Against Dangling References"
body = '''<p>Every reference has a lifetime: the scope for which it is valid. Rust's compiler checks that references never outlive the data they point to. Most of the time, lifetimes are inferred automatically—you do not think about them. But when a function returns a reference, Rust needs your help to understand how the lifetimes of parameters relate to the lifetime of the return value.</p>
<p>Consider a bug that lifetimes prevent:</p>
<pre><code>fn get_dangling_reference() -&gt; &String {
    let s = String::from("temporary");
    &s  // ERROR: s is dropped when the function returns
}       // The reference points to deallocated memory: dangling!</code></pre>
<p>Rust rejects this code at compile time. The compiler sees that <code>s</code> is local to the function and will be dropped when the function exits. Returning a reference to <code>s</code> would create a dangling reference—a pointer to deallocated memory. Forbidden.</p>
<p>When a function takes parameters and returns a reference, you must annotate lifetimes to tell the compiler which parameter's lifetime the return value is tied to. Use a lifetime parameter—a name starting with an apostrophe, like <code>'a</code>—to label this relationship:</p>
<pre><code>fn longer_entry<'a>(e1: &'a String, e2: &'a String) -&gt; &'a String {
    if e1.len() &gt; e2.len() { e1 } else { e2 }
}</code></pre>
<p>This signature says: "The returned reference lives as long as the shorter of the two parameter lifetimes." The borrow checker now ensures the caller does not drop either parameter while the returned reference is still in use.</p>
<p>String literals have a special lifetime: <code>'static</code>. String literals are baked into the binary and exist for the entire program run:</p>
<pre><code>let s: &'static str = "immortal";  // Lives for the entire program</code></pre>
<p>In practice, many lifetimes are inferred by "lifetime elision" rules. Simple function signatures with one input reference often elide the lifetime—the compiler infers it. But in complex cases, especially struct fields that hold references, you must write the lifetimes explicitly.</p>
<p>Lifetimes are not about run-time duration; they are about compile-time proof that memory is safe. They prevent a whole class of bugs without run-time overhead.</p>
<div class="field-notes"><div class="fn-head">FIELD NOTES // LIFETIME ELISION</div>
<p>Rust's compiler applies three elision rules to infer lifetimes automatically in function signatures. If all parameters are references with one input lifetime and one output, the compiler assumes they are related. Only when the rules do not apply (e.g., multiple parameters with different lifetimes, or a struct field that is a reference) do you need to write lifetimes explicitly. Learning when to write them comes with practice.</p></div>'''

[[lessons.readings]]
label = "Validating References with Lifetimes"
url = "https://doc.rust-lang.org/book/ch10-03-lifetime-syntax.html"

[[lessons.readings]]
label = "Lifetime Elision"
url = "https://doc.rust-lang.org/book/ch10-03-lifetime-syntax.html#lifetime-elision"

[[lessons.exercises]]
id = "s03-l03-e1"
type = "fill"
points = 20
prompt = "Complete this function signature to annotate that the returned reference lives as long as the parameter:"
code = '''fn fetch<____>(entry: &____ String) -&gt; &____ String {
    entry
}'''
answer = "'a"
hint = "A lifetime parameter starts with an apostrophe. The same lifetime name applies to both the parameter and return type to show they are tied together. What single-letter lifetime name goes in all three blanks?"
whyWrong = "Lifetime parameters are written <code>'a</code>, <code>'b</code>, etc. Use <code>'a</code> in all three positions to connect the parameter's lifetime to the return value's lifetime."

[[lessons.exercises]]
id = "s03-l03-e2"
type = "mc"
points = 15
prompt = "What is the primary purpose of lifetime annotations in function signatures?"
choices = [
    "To measure how long a variable lives at runtime",
    "To tell the compiler which reference parameter a return value depends on",
    "To optimize memory allocation automatically",
    "To track how many times a variable is used"
]
answer = 1
hint = "Reread the second paragraph of the lesson, starting 'When a function takes parameters...'. What do lifetime annotations communicate to the compiler?"
whyWrong = "Lifetimes are compile-time annotations that show dependencies between references. They prevent dangling references, not measure runtime duration."
explain = "Lifetime annotations help the borrow checker verify that references never outlive their referenced data. They are a communication tool between you and the compiler."

[[lessons.exercises]]
id = "s03-l03-e3"
type = "text"
points = 20
prompt = "What special lifetime applies to string literals like `\"text\"`? (Answer: the lifetime <code>'____</code>.)"
answer = "static"
accept = ["static"]
hint = "The lesson introduces a special lifetime for data baked into the binary. Hint: it rhymes with 'static'."
whyWrong = "String literals have the <code>'static</code> lifetime because they are embedded in the binary and live for the entire program."

[[lessons.exercises]]
id = "s03-l03-e4"
type = "mc"
points = 15
prompt = "Will this code compile? `let s: &String; { let x = String::from(\"temp\"); s = &x; } println!(\"{}\", s);`"
choices = [
    "Yes, s is a valid reference",
    "No, x is dropped and s becomes a dangling reference",
    "Yes, but only because x is immutable",
    "No, but only if the String is large"
]
answer = 1
hint = "The code creates a reference <code>s</code> to <code>x</code>, then exits the inner scope. What happens to <code>x</code> when its scope ends? Is <code>s</code> still valid?"
whyWrong = "When the inner scope closes, <code>x</code> is dropped. The reference <code>s</code> now points to deallocated memory—a dangling reference. Rust's borrow checker rejects this code."
explain = "Lifetimes ensure references never outlive the data they point to. This code violates that rule and will not compile."

[[lessons.exercises]]
id = "s03-l03-w1"
type = "write"
points = 30
prompt = '''Write a function <code>echo&lt;'a&gt;(s: &'a str) -&gt; &'a str</code> that returns its parameter. In <code>main</code>, declare <code>entry = "ECHO"</code> and call <code>echo(entry)</code> twice, printing <code>ECHO ECHO</code>.'''
expect = "ECHO ECHO\n"
solution = '''fn echo<'a>(s: &'a str) -> &'a str {
    s
}
fn main() {
    let entry = "ECHO";
    println!("{} {}", echo(entry), echo(entry));
}'''
starter = '''fn echo<'a>(s: &'a str) -> &'a str {
    todo!()
}
fn main() {
    let entry = "ECHO";
    // Call echo twice and print the results
}'''
hint = "The function just returns its parameter unchanged. Replace <code>todo!()</code> with <code>s</code>. The lifetime annotation ties the return value to the input parameter, allowing safe reuse."
