# Lesson s10-l01 manifest
[[lessons]]
id = '''s10-l01'''
title = '''Commanding the Archive'''
body = '''<p>We now assemble our knowledge to build the final Runesearch CLI engine. First, our tool must accept query parameters from the user. In Rust, we read command-line arguments using the <code>std::env::args</code> function from the standard library.</p>
<p>This function returns an iterator over the arguments passed to the program. The first argument (index 0) is always the name of the executable itself. The subsequent arguments are the parameters provided by the user:</p>
<pre><code>use std::env;

fn main() {
    let args: Vec&lt;String&gt; = env::args().collect();
    if args.len() &lt; 3 {
        println!("Usage: runesearch &lt;file&gt; &lt;query&gt;");
        return;
    }
    let filepath = &amp;args[1];
    let query = &amp;args[2];
}</code></pre>
<p>Note that <code>env::args</code> will panic if any argument contains invalid Unicode. If you need to accept arbitrary binary arguments, use <code>env::args_os</code> which returns OS-specific string wrappers instead.</p>
<div class="field-notes"><div class="fn-head">FIELD NOTES // COLLECTION ANNOTATIONS</div>
<p>Because we want to access arguments by index, we collect the iterator into a <code>Vec&lt;String&gt;</code> immediately. We annotate the type explicitly as <code>Vec&lt;String&gt;</code> so the compiler knows how to collect it.</p></div>
<p>Command line arguments configure the search engine. Scribes read arguments using std::env::args, collecting them into a Vec for indexed access. Handling missing parameters gracefully is necessary for usability.</p>
<p>Since env::args panics on non-Unicode inputs, scribes should use env::args_os if supporting arbitrary binary inputs is a requirement for the CLI.</p>
<p>Scribes should validate argument lists at the start of main, printing clear usage instructions and exiting early if arguments are missing or incorrect.</p>
<p>The archivist monitors CLI boundaries. By parsing parameters cleanly, you build an accessible interface that routes queries and files to the correct functions.</p>
<p>Parsing CLI arguments provides the entry point for user interaction, mapping raw shell inputs to typed configuration variables inside the application.</p>
<p>Verify parameter scopes before indexing arguments. Scribes must check argument length to prevent index out of bounds exceptions on empty entries. Always verify that parameters are parsed before initiating search operations. Checking the argument length early prevents the CLI from crashing when run with missing query strings or invalid filenames.</p>'''

