# Lesson s10-l02 manifest
[[lessons]]
id = '''s10-l02'''
title = '''Unrolling the Scroll'''
body = '''<p>Once we have the path to our log file, we must read its contents into memory. The standard library provides the <code>std::fs::read_to_string</code> function, which opens a file and reads its entire contents into a single owned <code>String</code>.</p>
<p>This function returns a <code>std::io::Result&lt;String&gt;</code>. If the file cannot be opened (e.g., missing permissions or incorrect path), it returns an <code>Err</code>. We propagate this error to the caller or print a friendly error message using match:</p>
<pre><code>use std::fs;

fn read_logs(path: &amp;str) -&gt; Result&lt;String, std::io::Error&gt; {
    let contents = fs::read_to_string(path)?;
    Ok(contents)
}</code></pre>
<p>Using the <code>?</code> operator here makes error propagation clean. If the file is extremely large, reading it entirely into a string might exhaust memory; we will look at streaming alternatives in the field notes.</p>
<div class="field-notes"><div class="fn-head">FIELD NOTES // LINE STREAMING</div>
<p>For massive log files, prefer using <code>std::fs::File::open</code> combined with a <code>std::io::BufReader</code>. This allows you to read the file line-by-line using an iterator, keeping memory usage constant and low.</p></div>
<p>Reading files into strings is the first step of searching logs. Scribes use std::fs::read_to_string, handling errors via the ? operator. This keeps file reading simple and leverages safety to handle missing files.</p>
<p>If files are extremely large, reading them into memory at once can exhaust resources; streaming lines via BufReader is the preferred alternative.</p>
<p>Scribes must handle file access errors gracefully, returning Result from helper functions to allow parent processes to print friendly error messages.</p>
<p>The archivist validates file access paths. By checking that targets exist and are readable, we prevent unhandled IO crashes during search runs.</p>
<p>Using standard library filesystem methods ensures high portability, allowing your search engine to read scrolls across different operating systems safely.</p>
<p>By validating file targets before search execution, you avoid raw crashes. Scribes must handle permission issues dynamically using Result containers. Handle file reading exceptions cleanly to provide a polished experience for the terminal user. Returning descriptive errors from your file access methods helps trace issues like incorrect path syntax or missing files.</p>'''

