# Lesson s10-l03 manifest
[[lessons]]
id = '''s10-l03'''
title = '''The Search Algorithm'''
body = '''<p>With log contents in memory, we can search for the user's query. We split the log string into lines using the <code>lines()</code> method, which returns an iterator yielding each line as a string slice (<code>&amp;str</code>).</p>
<p>We filter these lines to keep only those containing our search query, and then print them. Let us write a helper function that performs this search operation cleanly:</p>
<pre><code>fn search_query(contents: &amp;str, query: &amp;str) {
    for line in contents.lines() {
        if line.contains(query) {
            println!("{}", line);
        }
    }
}</code></pre>
<p>This search function does not allocate any new strings: it references segments of the already allocated file content string. This keeps the execution extremely fast and lightweight.</p>
<div class="field-notes"><div class="fn-head">FIELD NOTES // CASE INSENSITIVITY</div>
<p>To implement case-insensitive search, convert both the line and the query to lowercase using <code>to_lowercase()</code> before checking. Note that this will allocate new strings, which has a performance cost.</p></div>
<p>The search algorithm splits file contents into lines. Scribes use the lines method to obtain string slices, filtering them to find matches. This approach avoids heap allocations, keeping the search fast.</p>
<p>By referencing existing string memory, the search remains lightweight and fast, showing the elegance of zero-cost borrows in Rust systems.</p>
<p>Scribes can use iterators combined with contains to check lines, creating short search pipelines that write matches directly to stdout.</p>
<p>The archivist searches text buffers. By filtering string slices in memory, we locate error records in massive log files without spending CPU cycles copying text.</p>
<p>This zero-allocation line traversal is key to Rust's performance advantage, allowing CLI tools to process large logs at high speeds.</p>
<p>Ensure that search checks use exact patterns. Scribes can combine lines checks with filter adaptors to assemble a highly efficient matching engine. Slices also ensure that log searching does not exhaust stack space. By referencing the file buffer, you can traverse millions of lines while keeping the program's memory footprint minimal and stable. This memory efficiency guarantees that the runesearch engine works perfectly on both low-power embed scrolls and massive archive hardware.</p>'''

