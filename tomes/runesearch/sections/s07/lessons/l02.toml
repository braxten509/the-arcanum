id = "s07-l02-w1"
type = "write"
points = 35
prompt = '''Write code returning a Result `Ok(5)`. Pattern match `logs_parsed` to print `Success: 5`.'''
expect = '''Success: 5
'''
solution = '''fn main() {
    let logs_parsed: Result<i32, &str> = Ok(5);
    match logs_parsed {
        Ok(val) => println!("Success: {}", val),
        Err(_) => {},
    }
}'''
