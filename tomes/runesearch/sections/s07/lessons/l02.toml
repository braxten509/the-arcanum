# Lesson s07-l02 manifest
[[lessons]]
id = '''s07-l02'''
title = '''The Scroll of Results'''
body = '''<p>Errors in systems programming are inevitable: files might be missing, or log lines might be corrupted. For recoverable errors, Rust provides the <code>Result&lt;T, E&gt;</code> enum. It represents either success (<code>Ok</code>) or failure (<code>Err</code>).</p>
<p>The <code>Result&lt;T, E&gt;</code> enum has two variants: <code>Ok(T)</code>, containing the success value of type <code>T</code>, and <code>Err(E)</code>, containing the error value of type <code>E</code>. Let us write a function that utilizes this construct:</p>
<pre><code>fn parse_id(raw: &amp;str) -&gt; Result&lt;u32, String&gt; {
    match raw.parse::&lt;u32&gt;() {
        Ok(num) =&gt; Ok(num),
        Err(_) =&gt; Err(String::from("Invalid number format")),
    }
}</code></pre>
<p>We handle the output of this function using a <code>match</code> block, routing the success path differently from the error handling logic, ensuring errors are never silently ignored.</p>
<div class="field-notes"><div class="fn-head">FIELD NOTES // PANIC VS RESULT</div>
<p>Use <code>Result</code> for recoverable errors where the calling code can decide how to handle the failure. Use the <code>panic!</code> macro only for unrecoverable errors where the program cannot safely continue execution.</p></div>
<p>Result represents success or recoverable failure. Scribes use Result to handle file system errors and parsing failures. The compiler forces handling of the Err variant, ensuring errors are processed at boundaries.</p>
<p>Using Result prevents silent errors and ensures that the CLI tool terminates cleanly with a helpful error message when operations fail in the field.</p>
<p>Scribes should define custom error types that describe failures clearly, enabling calling code to inspect and handle different failure causes dynamically.</p>
<p>The archivist routes all parser errors through Result. By returning descriptive Err variants from parsing functions, we diagnose corrupted log lines easily.</p>
<p>This pattern separates normal path execution from error recovery logic, keeping the main CLI application structured and readable under all conditions.</p>
<p>By returning Result, functions document their failures. This makes caller code self-documenting, as developers must explicitly route both success and error outcomes. Recoverable error design allows us to log failures while keeping the CLI application running. By capturing details in Result containers, scribes gain the insight needed to resolve structural file issues in the field.</p>'''

[[lessons.readings]]
label = '''Recoverable Errors with Result'''
url = '''https://doc.rust-lang.org/book/ch09-02-recoverable-errors-with-result.html'''


