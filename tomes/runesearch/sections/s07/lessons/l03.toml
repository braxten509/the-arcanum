# Lesson s07-l03 manifest
[[lessons]]
id = '''s07-l03'''
title = '''The Bubbling Rune'''
body = '''<p>When writing complex log parsing logic, we often want to return any encountered errors directly to the caller, letting them bubble up the call stack. To make error propagation concise, Rust provides the question mark operator (<code>?</code>).</p>
<p>The <code>?</code> operator can only be used in functions that return a <code>Result</code> or an <code>Option</code>. When placed after a <code>Result</code> value, if the value is <code>Ok(T)</code>, the inner value <code>T</code> is returned from the expression and execution continues. If the value is <code>Err(E)</code>, the error is returned early from the function:</p>
<pre><code>fn read_and_parse() -&gt; Result&lt;u32, String&gt; {
    let raw = get_raw_input()?; // Returns early if None/Err
    let parsed = parse_id(&amp;raw)?; // Returns early if Err
    Ok(parsed)
}</code></pre>
<p>This allows us to write clean, linear code that does not drown in nested <code>match</code> blocks, while maintaining strict error safety throughout our tool.</p>
<div class="field-notes"><div class="fn-head">FIELD NOTES // COERCION</div>
<p>The <code>?</code> operator automatically converts the error type to the function's return error type using the <code>From</code> trait, allowing different error types to bubble up to a unified error wrapper.</p></div>
<p>The question mark operator propagates errors concisely. Scribes use ? to bubble up failures to the caller, keeping the primary logic clean and linear. This operator automatically converts error types, simplifying error handling in complex database pipelines.</p>
<p>The operator converts error types automatically, allowing various errors to bubble up to a unified error type defined in the function signature.</p>
<p>Scribes must ensure that the function's return type matches the operator's output container (Result or Option), as using ? in other contexts fails builds.</p>
<p>The archivist recommends error propagation for nested operations. By bubbling errors to the top main function, we centralize exit logic and log output operations.</p>
<p>Using ? creates clean, readable function flows that resemble exception handling in other runtimes while preserving Rust's explicit error tracking safety.</p>
<p>Mastering error propagation is vital for complex scriptorium software. By bubbling file access errors up to the CLI root, you keep the tool reliable.</p>'''

