type = "write"
points = 35
prompt = '''Define a function `test() -> Result<i32, &'static str>` that bubbles up an error. In `main`, handle `logs_parsed` and print `Error`.'''
expect = '''Error
'''
solution = '''fn sub() -> Result<i32, &'static str> {
    Err("fail")
}
fn test() -> Result<i32, &'static str> {
    let logs_parsed = sub()?;
    Ok(logs_parsed)
}
fn main() {
    if test().is_err() {
        println!("Error");
    }
}'''
