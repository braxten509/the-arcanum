# Lesson s07-l04 manifest
[[lessons]]
id = '''s07-l04'''
title = '''Scribe Defaults'''
body = '''<p>Sometimes, we do not wish to bubble up an error, but instead want to fallback to a sensible default or explicitly crash the program if a assumption is breached. Rust provides shortcut methods on <code>Option</code> and <code>Result</code> to do this.</p>
<p>The <code>unwrap()</code> method extracts the success value. If the value is an error or absent, it triggers a program panic. The <code>expect("msg")</code> method does the same, but lets us specify a custom error message for the panic output:</p>
<pre><code>let port = "8080".parse::&lt;u32&gt;().unwrap();
let file = open_file().expect("Failed to open archives");</code></pre>
<p>A safer approach is to use <code>unwrap_or(default)</code>, which returns the default value if the receiver is an error or absent, preventing any panics.</p>
<div class="field-notes"><div class="fn-head">FIELD NOTES // PRODUCTION CODE</div>
<p>Avoid using <code>unwrap()</code> in production CLI tools unless you are absolutely certain a failure is impossible. Safe fallbacks via <code>unwrap_or</code> or propagation via <code>?</code> make for a better user experience.</p></div>
<p>Unwrapping methods extract values but panic on errors. Scribes should use expect to document panic assumptions or unwrap_or to supply fallbacks. This keeps the CLI tool robust and prevents crashes during operations.</p>
<p>Avoiding unwrap in production ensures a better experience, as the program handles unexpected file states gracefully rather than terminating abruptly.</p>
<p>Scribes can use unwrap_or_else to compute defaults lazily using closures, avoiding computation costs when the success value is present in the container.</p>
<p>The archivist checks panic sites. By replacing raw unwrap calls with descriptive expect messages, we document what system assumptions were violated during execution.</p>
<p>Using safe fallbacks prevents minor parsing errors from halting the entire search utility, keeping the archive index processing running smoothly.</p>
<p>Therefore, design your CLI boundaries around safe unwrap patterns. Scribes must reserve panics for truly unrecoverable issues like operating system memory exhaustion. Scribes must balance convenience and robustness when using unwrap shortcuts. In production scripts, replacing raw unwraps with pattern matches ensures that minor issues do not cause complete system failure or halt active database operations.</p>'''

