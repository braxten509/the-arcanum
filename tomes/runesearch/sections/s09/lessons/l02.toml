[[lessons.exercises]]
id = "s09-l02-w1"
type = "write"
points = 35
prompt = '''Given a HashMap `logs_parsed`, insert a key `"x"` with value `0` if missing, then increment it by `1`. Print the value.'''
expect = '''1
'''
solution = '''use std::collections::HashMap;
fn main() {
    let mut logs_parsed: HashMap<&str, i32> = HashMap::new();
    {
        let val = logs_parsed.entry("x").or_insert(0);
        *val += 1;
    }
    println!("{}", logs_parsed.get("x").unwrap());
}'''
