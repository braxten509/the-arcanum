# Lesson s09-l02 manifest
[[lessons]]
id = '''s09-l02'''
title = '''Reading the Index'''
body = '''<p>Retrieving values from a hash map requires providing the key. The <code>get</code> method takes a reference to the key and returns an <code>Option&lt;&amp;V&gt;</code>. If the key exists, it yields <code>Some(&amp;value)</code>; if not, it yields <code>None</code>.</p>
<pre><code>let team = String::from("Blue");
let score = scores.get(&amp;team); // Returns Option&lt;&amp;i32&gt;</code></pre>
<p>When aggregating counts (e.g., counting how many times each error message appears), we often want to check if a key exists, insert it with a value of 0 if not, and then mutate the value. Rust provides a highly idiomatic tool for this: the Entry API.</p>
<p>The <code>entry</code> method takes the key and returns an enum representing presence. Calling <code>or_insert</code> on the entry returns a mutable reference to the value, allowing direct mutation:</p>
<pre><code>let mut counts = HashMap::new();
let word = "error";
counts.entry(word).or_insert(0); // Inserts 0 if absent
*counts.entry(word).or_insert(0) += 1; // Increments count</code></pre>
<div class="field-notes"><div class="fn-head">FIELD NOTES // DEFERENCING MUTABLE REFS</div>
<p>The asterisks (<code>*</code>) in <code>*counts.entry(word).or_insert(0) += 1</code> is the dereference operator. It allows us to access and modify the integer value behind the mutable reference returned by <code>or_insert</code>.</p></div>
<p>The Entry API provides a clean way to update hash map values. Scribes use or_insert to initialize missing keys before modifying the value. This API avoids double lookups, keeping updates highly performant.</p>
<p>By returning a mutable reference to the value, the Entry API allows direct mutation, simplifying aggregation tasks like log counting.</p>
<p>Scribes can use entry to inspect key state dynamically, inserting defaults or updating existing entries in a single, fluent expression block.</p>
<p>The archivist recommends this API for frequency maps. By modifying mapped integers in place, we count error frequencies without searching key structures twice.</p>
<p>This API represents the idiomatic way to manage map collections in Rust, combining presence checks and mutations safely under the borrow checker rules.</p>
<p>Scribes who leverage Entry API avoid typical lookup performance traps. Updates compile down to highly efficient bucket modifications in the collection structure.</p>'''

