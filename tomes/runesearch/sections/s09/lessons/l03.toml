[[lessons.exercises]]
id = "s09-l03-w1"
type = "write"
points = 35
prompt = '''Given HashMap `logs_parsed` containing `"k" -> 5`, loop over references and print `k: 5`.'''
expect = '''k: 5
'''
solution = '''use std::collections::HashMap;
fn main() {
    let mut logs_parsed = HashMap::new();
    logs_parsed.insert("k", 5);
    for (k, v) in &logs_parsed {
        println!("{}: {}", k, v);
    }
}'''
