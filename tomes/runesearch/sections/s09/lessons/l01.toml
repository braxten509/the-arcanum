# Lesson s09-l01 manifest
[[lessons]]
id = '''s09-l01'''
title = '''The Indexed Scroll'''
body = '''<p>Vectors store values sequentially, but sometimes a scribe must locate records using keys rather than numeric indices. For mapping keys to values, Rust provides the <code>HashMap&lt;K, V&gt;</code> collection. It stores mappings using a hashing function.</p>
<p>To use a hash map, we must bring it into scope using the <code>use std::collections::HashMap;</code> directive. We create an empty map and insert key-value pairs using the <code>insert</code> method:</p>
<pre><code>use std::collections::HashMap;

let mut scores = HashMap::new();
scores.insert(String::from("Blue"), 10);
scores.insert(String::from("Yellow"), 50);</code></pre>
<p>Like vectors, hash maps are homogeneous: all keys must have the same type, and all values must have the same type. Pushing owned data into a hash map transfers ownership of that data to the map.</p>
<div class="field-notes"><div class="fn-head">FIELD NOTES // HASHING SECURITY</div>
<p>By default, <code>HashMap</code> uses a hashing function that provides resistance to Denial of Service (DoS) attacks. While secure, this hasher is not the fastest possible algorithm; you can swap it if performance is critical.</p></div>
<p>Hash maps map keys to values using a secure hashing function. Scribes use HashMap to aggregate stats, such as counts by log level. The collection is homogeneous, ensuring type safety for all keys and values.</p>
<p>Inserting elements transfers ownership to the map. Scribes must bring HashMap into scope explicitly, as it is not part of the standard prelude.</p>
<p>Scribes should verify that key types implement the Eq and Hash traits, which is required for the map to compare and locate buckets accurately.</p>
<p>The archivist aggregates entries in indexed catalogs. HashMap provides average constant-time lookups, making it ideal for tracking large collections of log stats.</p>
<p>Using hash maps ensures fast query resolution, allowing the CLI tool to summarize search metrics at the end of execution without slowdowns.</p>
<p>Scribes must design maps to pre-allocate capacity when counting lines. Pre-allocated hash maps avoid collision spikes and speed up aggregation. Scribes must choose map structures that match their indexing needs. When mapping keys to counts, ensure the keys are clean, as trailing spaces or casing differences will create separate, unintended entries.</p>'''

