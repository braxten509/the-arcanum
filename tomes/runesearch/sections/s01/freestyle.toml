[freestyle]
title = "THE WORKING: FORGE THE LOG PARSER SKELETON"
brief = '''<p>Arch-Archivist Vane places before you a parchment: <em>"Every great tool begins with a single heartbeat. The runesearch engine's first pulse is a CLI skeleton that announces itself to the world and records severity levels. Forge it now using only the skills you have learned."</em></p>
<p>Your program must:</p>
<ul>
<li>Print `LOG PARSER ONLINE` when the program starts.</li>
<li>Define a function `report_level(severity: i32) -> i32` that returns the severity unchanged (a simple pass-through for now).</li>
<li>In `main()`, use this function to report a hardcoded severity of `5`, and print `SEVERITY 5`.</li>
</ul>'''
reward = 150
xray = '''The grader checks:
- The program prints `LOG PARSER ONLINE` immediately on startup.
- The `report_level` function exists with signature `report_level(severity: i32) -> i32`.
- It is called from `main()` with the hardcoded severity value `5`.
- The output prints `SEVERITY 5` correctly.
Grader gives style credit for: function names in snake_case, no trailing semicolons on return expressions, consistent 4-space indentation, and immutable bindings where mutation is not needed.'''

[freestyle.badge]
id = "badge-s01"
name = "FIRST STEPS"
desc = "Forged the skeleton of the runesearch engine and announced yourself to the archive."

[[freestyle.rubric]]
criterion = "Compiles and runs"
weight = 25
desc = "The program builds successfully with `cargo build` and runs without crashing. No compile errors."

[[freestyle.rubric]]
criterion = "Startup message"
weight = 20
desc = "Prints `LOG PARSER ONLINE` as the first output."

[[freestyle.rubric]]
criterion = "Function call"
weight = 25
desc = "Defines and calls `report_level(5: i32) -> i32` from main, printing the severity value that the function returns."

[[freestyle.rubric]]
criterion = "Function definition"
weight = 15
desc = "Defines `report_level(severity: i32) -> i32` with explicit parameter type and return type. The function is called from `main()`."

[[freestyle.rubric]]
criterion = "Clean style"
weight = 15
desc = "Follows Rust conventions: snake_case for function and variable names, 4-space indentation, no trailing whitespace. Return expressions omit the semicolon. Bindings are immutable by default unless mutation is necessary."
