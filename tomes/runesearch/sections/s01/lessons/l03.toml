[[lessons]]
id = "s01-l03"
title = "Divine Functions"
body = '''<p>To prevent repetition of scribe work, we encapsulate operations within functions. Functions are declared with the <code>fn</code> keyword, followed by a name, parameters wrapped in parentheses, and optionally a return type specified after an arrow symbol <code>-&gt;</code>.</p>
<p>A function with no parameters looks like this:</p>
<pre><code>fn greet_archive() {
    println!("Welcome to the archive");
}</code></pre>
<p>To invoke a function, you write its name followed by parentheses:</p>
<pre><code>fn main() {
    greet_archive();
}</code></pre>
<p>Parameters are variables that form part of a function's contract. When a function has parameters, you must provide concrete values when calling it. Crucially, you must declare the type of each parameter explicitly—Rust does not infer parameter types. The function body can then use these parameters as immutable bindings:</p>
<pre><code>fn record_entry(id: u32, severity: i32) {
    println!("Entry {} has severity {}", id, severity);
}

fn main() {
    record_entry(5, -2);
}</code></pre>
<p>Functions can return values to the caller. You declare the return type after an arrow <code>-&gt;</code>. In Rust, the return value of a function is the value of the final expression in the block—that is, the last line <em>without a semicolon</em>. Adding a semicolon turns it into a statement that returns nothing:</p>
<pre><code>fn calculate_severity(base: i32) -&gt; i32 {
    base + 10  // No semicolon: this value is returned
}

fn main() {
    let result = calculate_severity(5);
    println!("Result: {}", result);  // Prints "Result: 15"
}</code></pre>
<p>Early returns are possible with the <code>return</code> keyword, though most Rust code omits it and relies on the final expression instead.</p>
<div class="field-notes"><div class="fn-head">FIELD NOTES // STATEMENTS VS. EXPRESSIONS</div>
<p>Statements are instructions that perform an action but return no value. Expressions evaluate to a resulting value that can be used. In Rust, adding a semicolon to an expression turns it into a statement, which then returns the empty unit type <code>()</code> instead of its value. This is why the line `base + 10;` would return nothing, while `base + 10` (without a semicolon) returns the sum. Understanding this distinction is critical to writing idiomatic Rust functions.</p></div>'''

[[lessons.readings]]
label = "Functions"
url = "https://doc.rust-lang.org/book/ch03-03-how-functions-work.html"

[[lessons.exercises]]
id = "s01-l03-e1"
type = "fill"
points = 20
prompt = "Complete this function signature that returns an `i32`:"
code = '''fn add_ten(x: i32) ____ i32 {
    x + 10
}'''
answer = "->"
hint = "The arrow operator separates the parameter list from the return type in a function signature."
whyWrong = "Rust uses the `->` operator to declare a return type. It appears after the closing parenthesis of the parameter list."

[[lessons.exercises]]
id = "s01-l03-e2"
type = "mc"
points = 15
prompt = "If you write `let result = base + 10;` inside a function, what does the function return?"
choices = ["the value of base + 10", "nothing (empty tuple)", "a compile error", "the value of base"]
answer = 1
hint = "The lesson emphasizes the critical rule: a semicolon turns an expression into a statement. The FIELD NOTES explain statements vs. expressions—the semicolon is the difference."
whyWrong = "The semicolon turns the expression into a statement, so the function returns nothing—the empty unit type `()`. Without the semicolon, it would return the sum."
explain = "In Rust, the presence or absence of a semicolon determines whether a line is an expression (returns a value) or a statement (returns nothing). This is why the lesson emphasizes: `base + 10` returns the sum, but `base + 10;` returns nothing."

[[lessons.exercises]]
id = "s01-l03-e3"
type = "text"
points = 20
prompt = "When you call a function with arguments, what must be true about each argument's type?"
answer = "must match the parameter type"
accept = ["match", "matches the parameter type", "the same as the parameter", "declared"]
hint = "Rust is statically typed—every argument passed to a function must align with what the function's signature declares."
whyWrong = "Each argument you pass must match the type declared in the function's parameter list. Rust enforces this at compile time."

[[lessons.exercises]]
id = "s01-l03-e4"
type = "mc"
points = 15
prompt = "Which of these function signatures is valid Rust?"
choices = [
    "fn count_logs(n) -> i32 { n }",
    "fn count_logs(n: i32) { n }",
    "fn count_logs(n: i32) -> i32 { n }",
    "fn count_logs(: i32) -> i32 { 0 }"
]
answer = 2
hint = "The lesson states: 'Crucially, you must declare the type of each parameter explicitly—Rust does not infer parameter types.' Also, return types use `->` notation."
whyWrong = "Parameters MUST have explicit type annotations. Option 1 is missing the type. Option 3 omits the return type (not ideal but valid). Option 4 has invalid syntax."
explain = "Valid Rust requires `fn name(param: Type) -> ReturnType { body }`. Every parameter must have an explicit type, and if the function returns a value, the return type must be declared."

[[lessons.exercises]]
id = "s01-l03-w1"
type = "write"
points = 35
prompt = '''Write a function `combine(count: u32, severity: i32) -> i32` that returns `severity * (count as i32)`. In `main`, call it with `count=8` and `severity=3`, then print `PRODUCT 24`.'''
expect = "PRODUCT 24\n"
solution = '''fn combine(count: u32, severity: i32) -> i32 {
    severity * (count as i32)
}

fn main() {
    let result = combine(8, 3);
    println!("PRODUCT {}", result);
}'''
starter = '''fn combine(count: u32, severity: i32) -> i32 {
    // return severity multiplied by count (cast count to i32)
}

fn main() {
    // call combine(8, 3) and print PRODUCT {result}
}'''
hint = "Cast `count` to `i32` using `count as i32`, multiply by `severity`, and return the result (no semicolon). Then call it from `main` and print the result."
