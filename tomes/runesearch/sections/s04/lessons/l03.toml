[[lessons.exercises]]
id = "s04-l03-w1"
type = "write"
points = 35
prompt = '''Define an enum `State` with variants `Active` and `Inactive`. Assign `State::Active` and match it to print `Active`.'''
expect = '''Active
'''
solution = '''#[allow(unused)]
enum State {
    Active,
    Inactive,
}
fn main() {
    let logs_parsed = State::Active;
    match logs_parsed {
        State::Active => println!("Active"),
        State::Inactive => println!("Inactive"),
    }
}'''
