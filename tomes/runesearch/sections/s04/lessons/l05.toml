# Lesson s04-l05 manifest
[[lessons]]
id = '''s04-l05'''
title = '''Deconstruction Rites'''
body = '''<p>To extract and use the data associated with our enum variants, we must deconstruct them. We accomplish this using pattern matching inside a <code>match</code> expression. The patterns in the match arms must match the shape of the enum variants.</p>
<p>When matching an enum variant that contains data, we bind variables to that data within the pattern. These bound variables then become available for use inside the corresponding match arm's block:</p>
<pre><code>let event = LogEvent::Failure(404);
match event {
    LogEvent::Start =&gt; println!("Starting engine"),
    LogEvent::Payload(msg) =&gt; println!("Message: {}", msg),
    LogEvent::Failure(code) =&gt; println!("Failed with code: {}", code),
}</code></pre>
<p>If we only care about a single variant and want to ignore all others, we can use the concise <code>if let</code> syntax. This syntax is sugar for a match that runs code for one pattern and ignores everything else, reducing boilerplates:</p>
<pre><code>if let LogEvent::Failure(code) = event {
    println!("Direct catch of error: {}", code);
}</code></pre>
<div class="field-notes"><div class="fn-head">FIELD NOTES // EXHAUSTIVENESS</div>
<p>The compiler enforces that matches cover all possibilities. If you omit a variant of your enum and do not include a catch-all pattern like <code>_</code>, the compiler will refuse to build your code, preventing unhandled state bugs.</p></div>
<p>Deconstructing enums via match or if let extracts payload data safely. Scribes must write exhaustive match blocks to handle all variant cases. The compiler checks this exhaustiveness, preventing new enum variants from breaking existing code.</p>
<p>If let provides a concise syntax when only a single variant is needed, reducing boilerplate and keeping the routing logic clear and maintainable.</p>
<p>Scribes can destructure fields selectively, using placeholders to ignore unused attributes. This keeps pattern matching focused and avoids compiler warnings about unused variables.</p>
<p>The archivist checks deconstruction patterns. By extracting event payloads cleanly, we process log data without raw pointers or type casting, maintaining safety across all parsing stages.</p>
<p>Using patterns to extract values ensures that data variables are only bound within the scope of successful matches, preventing invalid accesses.</p>
<p>By mastering deconstruction, scribes transform nested structs and enums into flat local bindings. This simplifies complex routing paths inside our query compiler.</p>'''

