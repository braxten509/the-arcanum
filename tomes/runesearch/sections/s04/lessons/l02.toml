# Lesson s04-l02 manifest
[[lessons]]
id = '''s04-l02'''
title = '''Diverse Skeletons'''
body = '''<p>Sometimes, we do not need to name every field in a structure. Rust supports tuple structs, which look similar to tuples but have an added type name. Tuple structs are useful when you want to give the entire tuple a name and make it a distinct type.</p>
<p>To define a tuple struct, start with the <code>struct</code> keyword and the struct name followed by the types in the tuple. Semicolons terminate the definition. We access elements in a tuple struct using dot notation followed by the index:</p>
<pre><code>struct Point(i32, i32, i32);
let origin = Point(0, 0, 0);
println!("X coordinate is {}", origin.0);</code></pre>
<p>You can also define structs that don't have any fields! These are called unit-like structs because they behave similarly to the unit type <code>()</code>. Unit-like structs are useful in situations where you need to implement a trait on some type but don't have any data that you need to store in the type itself.</p>
<pre><code>struct DatabaseConnector;
let conn = DatabaseConnector;</code></pre>
<div class="field-notes"><div class="fn-head">FIELD NOTES // NEWTYPE PATTERN</div>
<p>Tuple structs with a single element are often used to implement the "newtype pattern" in Rust. This pattern wraps a primitive type inside a custom struct to enforce type safety at compile time, preventing mixing up values of the same base type.</p></div>
<p>Tuple and unit-like structs provide diverse layouts for custom data models. Tuple structs are ideal for wrapper types that enforce strict separation between values of the same base type. Unit-like structs act as markers, enabling trait implementations without storing data.</p>
<p>These skeletons are optimized by the compiler, introducing no runtime memory overhead, allowing scribes to build type-safe abstractions with maximum performance.</p>
<p>When using tuple structs, name the wrapper clearly to indicate its purpose. For example, wrapping raw integers in a Kilobytes struct prevents confusing storage sizes in search algorithms.</p>
<p>Unit-like structs can also represent states in state machine designs. By combining them with traits, scribes can construct compile-time state transitions that prevent invalid operations from building.</p>
<p>Scribes should leverage tuple structs to implement domain invariants. For instance, wrapping a raw database pointer prevents illegal accesses and enforces security bounds statically.</p>'''

