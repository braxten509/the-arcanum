# Lesson s04-l01 manifest
[[lessons]]
id = '''s04-l01'''
title = '''Structures of Truth'''
body = '''<p>A scribe needs to group related data into cohesive units. In Rust, we achieve this using structs, short for structures. A struct is a custom data type that lets us package and name multiple related values that make up a meaningful group.</p>
<p>To define a struct, we enter the keyword <code>struct</code> and name the entire structure. Inside curly braces, we define the names and types of the data pieces, which we call fields. Each field must have an explicit type:</p>
<pre><code>struct ArchiveRecord {
    id: u32,
    message: String,
    severity: i32,
}</code></pre>
<p>To use a struct after defining it, we create an instance of that struct by specifying concrete values for each of the fields. We access the fields of an instance using dot notation: <code>instance.field_name</code>. If the instance is mutable, we can also modify fields:</p>
<pre><code>let mut rec = ArchiveRecord {
    id: 101,
    message: String::from("Auth failure"),
    severity: 4,
};
rec.severity = 5; // Modifying field</code></pre>
<div class="field-notes"><div class="fn-head">FIELD NOTES // STRUCT MUTABILITY</div>
<p>In Rust, mutability is a property of the entire struct instance; you cannot mark only specific fields as mutable while others remain immutable. The entire struct is either mutable or immutable.</p></div>
<p>Structs group related variables into custom structures. Scribes must define clear fields and types, mapping log attributes to the struct. The compiler enforces struct initialization, ensuring that no struct can be created with uninitialized fields, preventing memory errors.</p>
<p>Struct fields can be accessed via dot notation, and if the instance is mutable, modified inline. Grouping data into structures improves organization and clarity.</p>
<p>Scribes should also implement methods on structs to encapsulate logic. By packaging functions and data together, you build clean interfaces that hide internal representations from calling code.</p>
<p>The archivist values structured representation. Well-designed structs form the backbone of our CLI tool, ensuring that file records, parser options, and output writers are represented cleanly in memory.</p>
<p>Additionally, defining structures establishes a custom domain model. When we encapsulate query options in a designated configuration struct, the scriptorium logic remains clean, coherent, and simple to test.</p>'''

