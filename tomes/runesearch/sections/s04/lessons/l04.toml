# Lesson s04-l04 manifest
[[lessons]]
id = '''s04-l04'''
title = '''Enums with Payload'''
body = '''<p>Rust enums are far more powerful than their counterparts in other languages. We can associate data directly with each enum variant. This allows us to store different types and amounts of data inside different variants of the same enum.</p>
<p>Consider an enum representing log messages, where some variants carry simple string slices, others carry detailed status codes, and some carry no data at all. We define them by putting the payload type in parentheses after the variant name:</p>
<pre><code>enum LogEvent {
    Start,
    Payload(String),
    Failure(u32),
}</code></pre>
<p>To instantiate an enum variant that has associated data, we pass the data inside parentheses. This design allows us to group varying data formats under a single type, which makes routing and processing logical events clean and structured.</p>
<div class="field-notes"><div class="fn-head">FIELD NOTES // VARIANT TYPES</div>
<p>The data associated with an enum variant can be of any type, including primitives, structs, tuples, or even other enums. This is the primary building block for modeling complex domain states in Rust.</p></div>
<p>Enums with payloads associate data directly with variants. Scribes use them to store different attributes in different event types, grouping them under a single type. This keeps event routing clean and avoids using unsafe union structures.</p>
<p>By wrapping status codes or messages in enum payloads, you create self-contained events that can be routed and processed efficiently in the search pipeline.</p>
<p>Scribes can define struct payloads for complex variants, keeping attributes named and typed. This extends enums to act as algebraic data types, providing excellent flexibility.</p>
<p>The archivist uses algebraic enums to represent parse events. When an error event occurs, the variant carries the file line number and description, simplifying error reporting for CLI users.</p>
<p>This design combines event identification and event data into a single, type-safe entity, ensuring that data is only accessed when the variant type is verified.</p>
<p>Always verify the layout of your enum variants. By placing related details directly in the payload, you eliminate external mapping tables and keep state lookups fast.</p>'''

