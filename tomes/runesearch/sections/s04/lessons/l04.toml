[[lessons.exercises]]
id = "s04-l04-w1"
type = "write"
points = 35
prompt = '''Define an enum `Msg` with variant `Code(i32)`. Create an instance with value `200` and pattern match to print `Code: 200`.'''
expect = '''Code: 200
'''
solution = '''enum Msg {
    Code(i32),
}
fn main() {
    let logs_parsed = Msg::Code(200);
    match logs_parsed {
        Msg::Code(val) => println!("Code: {}", val),
    }
}'''
