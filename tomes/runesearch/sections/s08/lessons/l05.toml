[[lessons.exercises]]
id = "s08-l05-w1"
type = "write"
points = 35
prompt = '''Given `logs_parsed = vec![1, 2, 3, 4]`, filter even numbers, map them by doubling, collect to a Vec and print.'''
expect = '''[4, 8]
'''
solution = '''fn main() {
    let logs_parsed = vec![1, 2, 3, 4];
    let res: Vec<i32> = logs_parsed.iter().filter(|&&x| x % 2 == 0).map(|x| x * 2).collect();
    println!("{:?}", res);
}'''
starter = '''fn main() {
    let logs_parsed = vec![1, 2, 3, 4];
    // pipeline chain
}'''
hint = '''Use the correct types and write the function block for pipelines.'''


