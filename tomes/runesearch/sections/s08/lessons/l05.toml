# Lesson s08-l05 manifest
[[lessons]]
id = '''s08-l05'''
title = '''Declarative Archives'''
body = '''<p>By chaining multiple iterator adaptors and a consuming adaptor, a scribe can write powerful log-filtering operations in a single, clear pipeline. This declarative style is the hallmark of idiomatic Rust.</p>
<p>Let us look at a pipeline that takes a vector of raw log strings, filters out everything that is not an error, trims the messages, and collects them into a vector of owned strings, all without manual loop state:</p>
<pre><code>let raw_logs = vec!["INFO: ok", "ERROR: crash ", "DEBUG: test"];
let errors: Vec&lt;String&gt; = raw_logs.iter()
    .filter(|line| line.starts_with("ERROR"))
    .map(|line| line.trim().to_string())
    .collect();</code></pre>
<p>This layout is extremely readable and eliminates common looping bugs like off-by-one errors or unintended variable mutations, keeping our parser robust.</p>
<div class="field-notes"><div class="fn-head">FIELD NOTES // READABILITY</div>
<p>When chaining multiple adaptors, place each method call on its own line. This allows other scribes to scan the pipeline steps vertically and understand the data transformation flow instantly.</p></div>
<p>Chaining iterators creates elegant, declarative pipelines. Scribes should format chains with each adaptor call on a new line to keep them readable. This makes the transformation steps clear and scanable.</p>
<p>Declarative pipelines compile to optimal assembly code, matching the performance of manual loops while providing safety and readability.</p>
<p>Scribes should ensure that closures inside chained adaptors are small and focused, extracting complex logic to helper methods to maintain chain clarity.</p>
<p>The archivist values clean alignment. Well-formatted pipelines allow colleagues to review and modify search steps quickly as data requirements evolve.</p>
<p>Chaining adaptors provides an elegant alternative to nested loops, representing the idiomatic standard for collection processing in the scriptorium.</p>
<p>Scribes should default to iterator chains when parsing complex CSV logs. Chaining adaptors allows separating field splitting, trim operations, and error filters. Chaining also makes debugging simpler. Since each stage is a separate method call, you can insert inspect adaptors to view log data as it flows through the pipeline, simplifying error detection. This interactive debugging approach makes it easy to track variable shapes across the entire search lifecycle.</p>'''

