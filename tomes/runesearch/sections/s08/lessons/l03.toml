# Lesson s08-l03 manifest
[[lessons]]
id = '''s08-l03'''
title = '''Filtering the Ledger'''
body = '''<p>We can transform iterators into different iterators using methods known as iterator adaptors. These methods do not consume the iterator; instead, they return a new iterator with altered behavior. Common adaptors include <code>map</code> and <code>filter</code>.</p>
<p>The <code>map</code> adaptor takes a closure and calls it on each element as it passes through, yielding the transformed values. The <code>filter</code> adaptor takes a closure that returns a boolean, keeping only the elements that evaluate to true:</p>
<pre><code>let nums = vec![1, 2, 3, 4];
let even_squares = nums.iter()
    .filter(|&amp;x| x % 2 == 0) // Keeps [2, 4]
    .map(|x| x * x);       // Transforms to [4, 16]</code></pre>
<p>Because iterator adaptors are lazy, this code does not actually perform any operations. It simply builds the blueprint of the data pipeline. We must call a consuming method to run it.</p>
<div class="field-notes"><div class="fn-head">FIELD NOTES // ZERO-COST ABSTRACTIONS</div>
<p>Rust's iterators are zero-cost abstractions: the compiler optimizes them down to the same assembly code as manual loops, meaning you do not pay any runtime penalty for declarative style.</p></div>
<p>Iterator adaptors like map and filter transform data streams. Scribes chain adaptors to build complex filtering pipelines. These operations are lazy, producing no values until a consuming adaptor is called.</p>
<p>Using adaptors avoids manual index tracking and temporary collections, keeping memory usage constant and processing logic free of index bugs.</p>
<p>Scribes can combine multiple filters and map transformations, creating expressive data flows that describe what to do rather than how to loop.</p>
<p>The archivist monitors adaptor pipelines. By matching filters to query inputs, we discard irrelevant log lines early, reducing processing overhead in downstream steps.</p>
<p>Chained adaptors are solved and optimized by the compiler, removing helper bounds and compiling down to manual loop speeds in production builds.</p>
<p>By chaining map adaptors systematically, we transform raw strings into structured logs without allocation spikes, preserving systems throughput. These adaptor chains remain readable even as you add more complex filter operations. The compiler is able to optimize multiple adaptors into a single loop pass, maximizing data throughput.</p>'''

