# Lesson s08-l04 manifest
[[lessons]]
id = '''s08-l04'''
title = '''Gathering the Runes'''
body = '''<p>To execute our iterator pipeline and compile the results, we must call a method that consumes the iterator. These methods are called consuming adaptors. They call <code>next</code> in a loop until the iterator is exhausted.</p>
<p>The most common consuming adaptor is <code>collect()</code>, which transforms an iterator into a collection, such as a <code>Vec</code>. Because <code>collect</code> can build many different collections, we often need to provide a type annotation to guide the compiler:</p>
<pre><code>let nums = vec![1, 2, 3];
let squares: Vec&lt;i32&gt; = nums.iter().map(|x| x * x).collect();</code></pre>
<p>Other consuming adaptors include <code>sum()</code>, which adds all elements together, and <code>count()</code>, which returns the number of elements in the iterator. They consume the iterator and return a final value directly.</p>
<div class="field-notes"><div class="fn-head">FIELD NOTES // TURBOFISH</div>
<p>Instead of annotating the variable type, you can specify the target collection type using the turbofish operator on collect: <code>.collect::&lt;Vec&lt;_&gt;&gt;()</code>, letting the compiler infer the element type.</p></div>
<p>Consuming adaptors execute the iterator pipeline. Scribes use collect to compile results into collections or sum to aggregate values. Consuming the iterator is necessary to run the lazy adaptors, producing outputs.</p>
<p>Methods like collect require type annotations to guide the compiler, as they can build various collection types from the same iterator stream.</p>
<p>Scribes can also use fold or collect with turbofish syntax to compile elements. These methods consume the stream, releasing temporary iterator resources.</p>
<p>The archivist requires clear collection targets. By annotating the variable types, you ensure the compiler builds the correct vector or map from search runs.</p>
<p>Consuming adaptors resolve the laziness of pipelines, executing all transformation steps in a single loop and returning the compiled results directly.</p>
<p>Verify that your consuming adaptors match performance targets. Use sum or count adaptors when you only need aggregates, avoiding allocating memory bounds. By specifying the collection type, you tell the compiler exactly how to allocate heap resources for the search results. This ensures that the compiled binary is both memory-efficient and fast when executing queries.</p>'''

