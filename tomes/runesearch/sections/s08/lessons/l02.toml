# Lesson s08-l02 manifest
[[lessons]]
id = '''s08-l02'''
title = '''The Sealed Closures'''
body = '''<p>To transform data within our iterators, we need to pass behavior as arguments. Rust's closures are anonymous functions you can save in a variable or pass to other functions. Unlike normal functions, closures can capture values from the scope in which they’re defined.</p>
<p>We define a closure using vertical bars (<code>||</code>) to enclose the parameters, followed by the closure body. We do not need to declare parameter or return types, as the compiler infers them:</p>
<pre><code>let offset = 10;
let add_offset = |num: i32| num + offset; // Captures offset
let result = add_offset(5); // Returns 15</code></pre>
<p>Closures capture variables from their environment in three ways, which map directly to the three ways a function can take a parameter: borrowing immutably, borrowing mutably, and taking ownership.</p>
<div class="field-notes"><div class="fn-head">FIELD NOTES // CLOSURE TYPES</div>
<p>The compiler automatically implements the <code>Fn</code>, <code>FnMut</code>, or <code>FnOnce</code> traits for closures based on how they handle captured values, ensuring memory safety boundaries are strictly maintained.</p></div>
<p>Closures are anonymous functions that capture environmental variables. Scribes pass closures to iterator adaptors to customize transformations. The compiler infers closure parameters and return types, keeping code concise.</p>
<p>Closures capture variables by borrowing or moving, ensuring memory safety boundaries are respected when passing behavior to other modules.</p>
<p>Scribes can use the move keyword before closures to force ownership transfers of captured variables, which is necessary when closures outlive scopes.</p>
<p>The archivist checks capture patterns. By using closures to parameterize adaptor behaviors, we write flexible search filters that reuse local context variables cleanly.</p>
<p>This anonymous function design avoids declaring auxiliary global functions for simple, one-off mapping operations, keeping the scriptorium modules focused.</p>
<p>Scribes should leverage closures for dynamic transformations. For instance, mapping log levels to numeric indices using local configuration map offsets. Scribes who master closure variables write highly customizable filters. By passing custom behavior dynamically, you build general-purpose search utilities that adapt to varying log attributes without code duplication.</p>'''

