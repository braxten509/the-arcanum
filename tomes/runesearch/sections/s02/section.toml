codename = "TREATISE II // BRANCHING PATHS"
short = "Control Flow"
title = "Branching Paths"
build = "Adds if/else conditionals and loops (while, for) to filter and aggregate log entries based on severity and count thresholds."
brief = "<p>The archivist's work is not merely to transcribe—it is to judge and sort. In this treatise, you will master the logic gates that guide your program's path: if/else conditionals to branch on severity thresholds, and loops to process log entries in batches. Vane teaches that every decision point must be explicit; every repetition must be bounded.</p>"
