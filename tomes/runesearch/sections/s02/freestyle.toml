[freestyle]
title = "THE WORKING: CATEGORIZE AND COUNT"
brief = '''<p>Arch-Archivist Vane continues: <em>"Your skeleton announces itself. Now it must do the archivist's real work: handle many severity values and sort them by tier. Read integers from stdin, one per line, and categorize each by threshold. Use conditionals and loops to tally and report."</em></p>
<p>Your program must:</p>
<ul>
<li>Read severity integers from stdin (one per line, until EOF).</li>
<li>Use `if`/`else` to categorize each: severity > 7 is "CRITICAL", > 5 is "HIGH", > 2 is "NORMAL", else "INFO".</li>
<li>Count each category using mutable variables and a loop.</li>
<li>Print the final tally as `CRITICAL N`, `HIGH M`, `NORMAL P`, `INFO Q` (one per line, in that order).</li>
</ul>'''
reward = 200
xray = '''The grader checks:
- The program reads multiple severity integers from stdin until EOF (not just one).
- It uses if/else conditionals to categorize by severity thresholds (>7, >5, >2).
- It accumulates counts for each category using mutable variables.
- It prints the final tally in the correct order: CRITICAL, HIGH, NORMAL, INFO.
Grader gives style credit for: proper use of Boolean operators (no redundant conditions), mutable variables used only where needed, consistent 4-space indentation, and clear variable names that signal intent (e.g., `critical_count` over `c`).'''

[freestyle.badge]
id = "badge-s02"
name = "CATEGORIST SIGIL"
desc = "Mastered conditionals and counting—the parser now sorts and tallies the archive."

[[freestyle.rubric]]
criterion = "Compiles and runs"
weight = 20
desc = "The program builds successfully and runs without crashing on normal input."

[[freestyle.rubric]]
criterion = "Reads multiple lines"
weight = 20
desc = "Correctly reads all lines from stdin until EOF, not just the first line."

[[freestyle.rubric]]
criterion = "Severity extraction"
weight = 20
desc = "Reads each severity value as an integer from stdin. The `report_level` function from Treatise I may be reused or simplified (though the real work is the categorization logic)."

[[freestyle.rubric]]
criterion = "Categorization and counting"
weight = 25
desc = "Uses if/else to categorize by threshold (>7=CRITICAL, >5=HIGH, >2=NORMAL, else=INFO) and accumulates counts in mutable variables."

[[freestyle.rubric]]
criterion = "Output correctness"
weight = 10
desc = "Prints tally in exact format: `CRITICAL N`, `HIGH M`, `NORMAL P`, `INFO Q` (one per line, in order)."

[[freestyle.rubric]]
criterion = "Clean style"
weight = 5
desc = "Follows Rust conventions: snake_case names, 4-space indentation, Boolean conditions are clear and not redundant. Mutable bindings only where logic requires mutation."
