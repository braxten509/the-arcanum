[[lessons]]
id = "s02-l01"
title = "The Gate of Truth"
body = '''<p>At every crossroads, the scribe must decide: which path does the severity warrant? The <code>if</code> keyword opens a gate guarded by a Boolean condition. If the condition evaluates to <code>true</code>, the block following the condition executes. If <code>false</code>, execution skips that block:</p>
<pre><code>let severity = 7;

if severity &gt; 5 {
    println!("ALERT: Critical severity");
}</code></pre>
<p>The condition must be a Boolean—Rust will not coerce integers or other types into true/false. Your condition must be explicit:</p>
<pre><code>// Correct: explicit Boolean comparison
if severity &gt; 5 {
    println!("High severity");
}

// Error: severity alone is not a Boolean
// if severity { ... }  // Will not compile</code></pre>
<p>When you need an alternate path, use <code>else</code>:</p>
<pre><code>let severity = 3;

if severity &gt; 5 {
    println!("ALERT: Critical");
} else {
    println!("NOTICE: Normal");
}</code></pre>
<p>You can also chain multiple gates with <code>else if</code>:</p>
<pre><code>let severity = 5;

if severity &gt; 7 {
    println!("CRITICAL");
} else if severity &gt; 5 {
    println!("HIGH");
} else {
    println!("NORMAL");
}</code></pre>
<p>In Rust, <code>if</code> expressions can return values. The final expression in each arm is its return value. This allows you to assign the result directly to a variable:</p>
<pre><code>let severity = 5;
let level = if severity &gt; 7 {
    1  // No semicolon: return 1
} else {
    0  // No semicolon: return 0
};
println!("Level: {}", level);  // Prints "Level: 0"</code></pre>
<p>Notice the semicolon after the closing brace: it ends the assignment statement. Inside each arm, the final expression has no semicolon—this is how Rust knows it is a return value.</p>
<div class="field-notes"><div class="fn-head">FIELD NOTES // BOOLEAN OPERATORS</div>
<p>Rust provides three Boolean operators: `&amp;&amp;` (AND, returns true only if both operands are true), `||` (OR, returns true if either is true), and `!` (NOT, flips the Boolean). These are short-circuiting: in `a &amp;&amp; b`, if `a` is false, `b` is never evaluated. For complex conditions, use parentheses to clarify intent: `if (severity &gt; 5) &amp;&amp; (category != "archive") { ... }`.</p></div>'''

[[lessons.readings]]
label = "If Expressions"
url = "https://doc.rust-lang.org/book/ch03-05-control-flow.html#if-expressions"

[[lessons.readings]]
label = "Boolean Logic (Rust by Example)"
url = "https://doc.rust-lang.org/rust-by-example/primitives/bool.html"

[[lessons.exercises]]
id = "s02-l01-e1"
type = "mc"
points = 15
prompt = "In Rust, must the condition in an `if` statement be an explicit Boolean expression?"
choices = ["No, any value can be used", "Yes, it must evaluate to a Boolean", "Only numeric types are allowed", "It depends on the value"]
answer = 1
hint = "Recall that earlier in this lesson, we saw the compiler error when writing `if severity` without a comparison operator. The language requires an explicit Boolean."
whyWrong = "Rust requires explicit Boolean conditions. Unlike C or JavaScript, Rust does not coerce integers into Booleans—you must write `if severity > 5`, not `if severity`."
explain = "Explicit Booleans make code safer and clearer. You cannot accidentally use an integer when you meant a comparison."

[[lessons.exercises]]
id = "s02-l01-e2"
type = "fill"
points = 20
prompt = "Complete this conditional that branches on severity:"
code = '''let severity = ____;
if severity &gt; 7 {
    println!("ALERT: critical");
}'''
answer = "8"
hint = "Look at the first if expression shown at the top of the lesson body: it assigns a specific severity value to check against the threshold 7."
whyWrong = "The first code example in the lesson declares `severity = 7`, but this exercise shows a different value. Check the exact number used in the first `if` code block at the start of the lesson."

[[lessons.exercises]]
id = "s02-l01-e3"
type = "text"
points = 20
prompt = "When you assign the result of an `if` expression to a variable, which arms must the value return from?"
answer = "all"
accept = ["all arms", "every arm", "both", "each arm"]
hint = "In an expression like `let x = if cond { 10 } else { 5 };`, each branch must yield a value of the same type."
whyWrong = "Every branch of an `if` expression must return a value. If one arm returns a value and another does not, the types do not match."

[[lessons.exercises]]
id = "s02-l01-e4"
type = "mc"
points = 15
prompt = "What will this code print? `let x = if false { 1 } else { 2 }; println!(\"{}\", x);`"
choices = ["1", "2", "false", "nothing (compile error)"]
answer = 1
hint = "The condition `false` means the `else` arm runs. Which value does the `else` block return, and what gets assigned to `x`?"
whyWrong = "The condition is `false`, so the `else` arm executes, returning `2`. The variable `x` becomes `2`."
explain = "When the condition is false, the `else` block runs and its value is assigned to `x`. Both arms return integers, so the assignment succeeds."

[[lessons.exercises]]
id = "s02-l01-w1"
type = "write"
points = 30
prompt = '''Declare `severity` as `6`. If severity is greater than 7, print `CRITICAL`. Otherwise, print `NORMAL`. (Output exactly one line.)'''
expect = "NORMAL\n"
solution = '''fn main() {
    let severity = 6;
    if severity > 7 {
        println!("CRITICAL");
    } else {
        println!("NORMAL");
    }
}'''
starter = '''fn main() {
    let severity = 6;
    // if severity > 7, print CRITICAL; else print NORMAL
}'''
hint = "Use an `if` block with a `>` comparison. The else arm executes because 6 is not greater than 7."
