[[lessons]]
id = "s02-l03"
title = "The Logic of the Archive"
body = '''<p>A single gate—an `if` checking one condition—often does not suffice. The archivist must weigh multiple criteria: "Is the severity above the threshold AND the entry type is 'error'?" The Boolean operators combine conditions into more complex expressions.</p>
<p>The AND operator `&amp;&amp;` returns true only if both operands are true:</p>
<pre><code>let severity = 8;
let is_error = true;

if (severity &gt; 5) &amp;&amp; (is_error) {
    println!("Critical error found");
}</code></pre>
<p>The OR operator `||` returns true if at least one operand is true:</p>
<pre><code>let severity = 3;
let critical_flag = false;

if (severity &gt; 7) || (critical_flag) {
    println!("Needs attention");
} else {
    println!("Normal processing");  // This prints: severity is not &gt;7 and flag is not true
}</code></pre>
<p>The NOT operator `!` flips a Boolean:</p>
<pre><code>let is_archived = false;

if !is_archived {
    println!("Not yet archived");  // This prints
}</code></pre>
<p>Rust evaluates Boolean operators left to right and short-circuits: if an AND operator finds a false operand on the left, it does not evaluate the right. If an OR operator finds a true operand on the left, it does not evaluate the right. This efficiency is standard and intentional:</p>
<pre><code>let x = 5;

// The right side is never checked because 5 &lt; 3 is false
if (x &lt; 3) &amp;&amp; (expensive_function()) {
    // ...
}</code></pre>
<p>For complex conditions, use parentheses to clarify the order of evaluation and make your intent unambiguous:</p>
<pre><code>if (severity &gt; 5) &amp;&amp; (category == "critical" || category == "error") {
    println!("Handle with priority");
}</code></pre>
<div class="field-notes"><div class="fn-head">FIELD NOTES // COMPARISON OPERATORS</div>
<p>Rust provides six comparison operators: `==` (equal), `!=` (not equal), `&lt;` (less than), `&lt;=` (less than or equal), `&gt;` (greater than), `&gt;=` (greater than or equal). All return Booleans. Be careful to use `==` for comparison, not `=` (which is assignment). The compiler will catch `=` in an `if` condition, but such mistakes are a common source of confusion.</p></div>'''

