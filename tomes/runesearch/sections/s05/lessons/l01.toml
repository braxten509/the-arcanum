# Lesson s05-l01 manifest
[[lessons]]
id = '''s05-l01'''
title = '''The Owned String'''
body = '''<p>Handling text in systems languages is notoriously difficult. Rust separates text into two primary types: the owned, growable <code>String</code>, and the borrowed string slice <code>&amp;str</code>. We begin by examining the heap-allocated <code>String</code>.</p>
<p>A <code>String</code> is stored as a wrapper over a vector of bytes on the heap. It is growable, mutable, and guaranteed to contain valid UTF-8 text. We create a <code>String</code> from a literal string using the <code>String::from</code> function or the <code>to_string</code> method:</p>
<pre><code>let mut message = String::from("Archive");
message.push_str(" online"); // Append text</code></pre>
<p>Because a <code>String</code> owns its contents, passing it to another function moves ownership by default. If we wish to keep using the string after passing it, we must clone it explicitly or pass a reference instead. Cloning can be expensive as it copies the heap data.</p>
<div class="field-notes"><div class="fn-head">FIELD NOTES // INTERNAL REPS</div>
<p>A <code>String</code> consists of three parts on the stack: a pointer to the heap memory, a length (bytes currently used), and a capacity (total bytes allocated). The length and capacity can change as you append text.</p></div>
<p>String represents growable, heap-allocated UTF-8 text. Scribes use String to store text that changes at runtime. Since String owns its data, passing it transfers ownership, and cloning it copies the heap buffer, which requires resources.</p>
<p>By understanding String allocation, scribes can manage memory usage, opting to borrow slices when only reading text, keeping the search engine performant.</p>
<p>Scribes should also utilize String capacity methods to pre-allocate memory when building strings in loops. This avoids multiple reallocations and copies, optimizing performance.</p>
<p>The archivist monitors text allocations. By using owned String objects only for data that must be mutated or stored, we keep the stack clean and prevent memory fragmentation issues.</p>
<p>Always verify that string inputs are valid UTF-8, as Rust strings enforce this constraint at all times. This prevents encoding errors from corrupting the index databases.</p>
<p>Additionally, heap allocations are managed automatically by scope endings. When an owned String is dropped, the allocator frees the buffer buffer, preventing leakages.</p>'''

