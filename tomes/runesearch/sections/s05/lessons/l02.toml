# Lesson s05-l02 manifest
[[lessons]]
id = '''s05-l02'''
title = '''The Borrowed Slice'''
body = '''<p>We do not always wish to copy heap data when reading parts of a string. To reference a contiguous sequence of characters within a string without copying them, we use a string slice, written as <code>&amp;str</code>.</p>
<p>A string slice is a reference to a portion of a <code>String</code>'s underlying byte array. We create a slice using a range index inside brackets, specifying the starting and ending indices separated by two dots:</p>
<pre><code>let log = String::from("SYSTEM: ERROR_500");
let prefix: &amp;str = &amp;log[0..6]; // Contains "SYSTEM"
let suffix: &amp;str = &amp;log[8..17]; // Contains "ERROR_500"</code></pre>
<p>Slices are immutable references. They store a pointer to the starting byte of the slice and a length. Because they are borrowed, the compiler ensures that the slice cannot outlive the owned <code>String</code> it references. This prevents dangling pointers.</p>
<div class="field-notes"><div class="fn-head">FIELD NOTES // LITERALS ARE SLICES</div>
<p>String literals, such as <code>let s = "hello";</code>, are actually string slices pointing directly to a specific segment of the program's read-only binary data. Their type is <code>&amp;'static str</code>.</p></div>
<p>String slices borrow views of text segments. Scribes use &str to reference parts of strings without copying heap data. Slices are immutable and have a lifetime linked to the source string, preventing dangling references.</p>
<p>String literals are static slices pointing to read-only program binary data. Using slices keeps memory usage low and makes text processing fast and efficient.</p>
<p>Scribes must ensure that slice ranges align with UTF-8 character boundaries. Slicing in the middle of a multi-byte Unicode character causes runtime panics, so care is needed.</p>
<p>The archivist uses string slices for log indexing. By referencing segments of the main file buffer directly, we search and display logs without copying text, maximizing speed.</p>
<p>Since slices are lightweight pointer-length pairs, passing them is extremely cheap, enabling efficient text processing throughout the application.</p>
<p>Furthermore, slices abstract away structural differences. A function accepting &str can process segments of heap strings, stack arrays, or binary segments with equal ease.</p>'''

