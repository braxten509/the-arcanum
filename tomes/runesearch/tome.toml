[[progression.intrusionTiers]]
min = 5
time = 90
bounty = 80

[[progression.intrusionTiers.pool]]
t = "SCROLL SLICE"
brief = "Extract the signature from the scroll header."
starter = '''
fn main() {
    let scroll = "RUNESEARCH::VER3";
    // Extract and print the signature "RUNESEARCH" using a slice
    let sig = &scroll[0..1]; // slice: use correct range
    println!("{}", sig);
}
'''
expect = "RUNESEARCH"
solution = '''
fn main() {
    let scroll = "RUNESEARCH::VER3";
    let sig = &scroll[0..10];
    println!("{}", sig);
}
'''

[[progression.intrusionTiers.pool]]
t = "STRUCT BOUNDS"
brief = "Implement a struct coordinates and print x + y sum."
starter = '''
struct Point {
    x: i32,
    y: i32,
}
fn main() {
    let p = Point { x: 50, y: 150 };
    // print: SUM <p.x + p.y>
    println!("SUM {}", 0);
}
'''
expect = "SUM 200"
solution = '''
struct Point {
    x: i32,
    y: i32,
}
fn main() {
    let p = Point { x: 50, y: 150 };
    println!("SUM {}", p.x + p.y);
}
'''

[[progression.intrusionTiers.pool]]
t = "ENUM ALIGNMENT"
brief = "Check enum state matching."
starter = '''
#[allow(unused)]
enum Status {
    Ok,
    Err,
}
fn main() {
    let s = Status::Ok;
    // print 1 if s is Ok, 0 if s is Err
    println!("{}", 0);
}
'''
expect = "1"
solution = '''
#[allow(unused)]
enum Status {
    Ok,
    Err,
}
fn main() {
    let s = Status::Ok;
    match s {
        Status::Ok => println!("1"),
        Status::Err => println!("0"),
    }
}
'''

[[progression.intrusionTiers.pool]]
t = "STRING CONCAT"
brief = "Build log prefix by appending level to category."
starter = '''
fn main() {
    let mut s = String::from("SYS");
    // append ":ERR" and print
    println!("{}", s);
}
'''
expect = "SYS:ERR"
solution = '''
fn main() {
    let mut s = String::from("SYS");
    s.push_str(":ERR");
    println!("{}", s);
}
'''

[[progression.intrusionTiers.pool]]
t = "BORROWED COUNT"
brief = "Access vector element count by reference."
starter = '''
fn main() {
    let v = vec![1, 2, 3, 4, 5];
    let ref_v = &v;
    // print: COUNT <length of ref_v>
    println!("COUNT {}", 0);
}
'''
expect = "COUNT 5"
solution = '''
fn main() {
    let v = vec![1, 2, 3, 4, 5];
    let ref_v = &v;
    println!("COUNT {}", ref_v.len());
}
'''
