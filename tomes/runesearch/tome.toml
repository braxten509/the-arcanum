[[progression.intrusionTiers.pool]]
t = "THE COUNTERSIGN"
brief = "A rival mimics our secret countersign. Compute the true key."
starter = '''
fn main() {
    let a = 7;
    let b = 6;
    // print exactly: KEY <a times b> (compute it, don't hardcode)
    println!("KEY {}", 0); // compute: replace 0 with calculated key
}
'''
expect = "KEY 42"
solution = '''
fn main() {
    let a = 7;
    let b = 6;
    println!("KEY {}", a * b);
}
'''

[[progression.intrusionTiers.pool]]
t = "SUM OF PAGES"
brief = "Compute the sum of page counters."
starter = '''
fn main() {
    let p1 = 15;
    let p2 = 25;
    // print sum: SUM <p1 + p2>
    println!("SUM {}", 0);
}
'''
expect = "SUM 40"
solution = '''
fn main() {
    let p1 = 15;
    let p2 = 25;
    println!("SUM {}", p1 + p2);
}
'''

[[progression.intrusionTiers.pool]]
