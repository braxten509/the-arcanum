# RuneBound — the Python / PyGame RPG cartography tome.

[meta]
id = "rune-bound"
name = "RuneBound // Python RPG Cartography"
description = "Build and ship RuneBound, a playable single-player 2D top-down RPG in Python and PyGame across 11 charts, with scrolling tile maps, animated sprites, collision, NPC dialogue, turn-based combat, inventory, quests, a HUD, and JSON save/load."
author = "The Arcanum"
version = "0.1.0"
favicon = "◈"

[runtime]
name = "python"
project = "RuneBound"
language = "Python"
packages = false
editorLang = "python"
entryFile = "main.py"
newFileExt = ".py"
projectFile = "main.py"
runCommand = ["python3", "{entry}"]
buildCommand = []
codeExt = [".py", ".json", ".csv", ".md", ".txt"]
starterCode = '''# RuneBound begins as a small chart in Python.
print("RuneBound // the chart is open")
'''

[content]
sections = [
  "s01", "s02", "s03", "s04", "s05", "s06", "s07", "s08", "s09", "s10", "s11",
]
capabilityLedger = true

[narrative]
objective = "Build and ship RuneBound, a real playable 2D top-down RPG in Python and PyGame. By the final seal, the wayfinder will explore a scrolling tile world, animate a player, survive collisions, speak with NPCs, fight turn-based enemies, manage items and quests, and save and load the whole game state as JSON."
title = "ARCANUM // RUNEBOUND"
logo = "RUNEBOUND // WOODBOUND"
opsLabel = "CHARTS"
graderPersona = "THE CARTOGRAPHER"
studentTerm = "wayfinder"
currency = "gold"
currencyShort = "gp"
gradeScale = "S|A|B|C|D|F"
bootLines = [
  "The vellum is clear, wayfinder. Keep your hand steady and name each mark.",
  "RuneBound is not a painted map; it is a small world that must run when the work is done.",
  "Eleven charts stand between this commission and a game fit to hand to a friend.",
  "You will learn Python from its first honest values, then carry it into real PyGame.",
  "A tile is data. A frame is a promise. A traceback is a route back to the loose thread.",
  "I am THE CARTOGRAPHER. I have buried enough games that only worked once.",
  "Read the coordinate, find the owner, and change one thing before you trust the result.",
  "Gold buys relief, wayfinder; it never buys an excuse for an untested path.",
  "The first chart will be plain. Plain is useful: it shows what the machine truly does.",
  "When every chart is sealed, run RuneBound outside this study and let another machine judge it.",
]
gradingLines = [
  "Hold. I am checking the running world, not admiring the map legend.",
  "The frame tells the truth; I am tracing what your code actually makes it do.",
  "A misplaced tile can fell a whole route. I am following the break to its owner.",
  "This is close. Close is not sealed; I am checking the edge where it fails.",
  "Your choices matter only when the evidence survives a fresh run.",
  "I reward a readable chart, a defensible choice, and a repair you can repeat.",
]
completeText = "RUNEBOUND IS SEALED // Leave the chart open, wayfinder, and let the world run."

[defaults]
theme = "woodbound"

[defaults.ai]
oracle = "llama3.1:8b"
grader = "qwen2.5:14b"
graderKind = "claude-cli"
graderModel = "claude-opus-4-8"

[economy]
ranks = [[0, "UNMARKED WAYFINDER"], [900, "TRAIL SCRIBE"], [1800, "INK BEARER"], [2850, "CHART HAND"], [4000, "MAP WARDEN"], [5250, "WORLD BINDER"], [6700, "BOUND CARTOGRAPHER"], [8500, "RUNEBOUND MASTER"]]
hintCost = 80
oracleCost = 20
attemptMultipliers = [1, 0.6, 0.3]
comboStep = 0.05
comboCap = 0.5
sRankMultiplier = 1.5
attackStakePerDiff = 20
attackWinPerDiff = 15

[progression]
blackIceThreshold = 10
blackIcePerDiffCap = 2

[progression.earnedTheme]
id = "wayfinder-seal"
name = "WAYFINDER'S SEAL"
desc = "A fourth palette earned by answering the Cartographer's rivals and keeping every route true."
