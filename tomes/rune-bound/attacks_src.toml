[[challenge]]
tier = 6
title = "THE COLLIDE-BINDING"
starter = '''
x = 88
width = 24
tile = 32
# The rival blurs the sprite's bounding box.
'''
briefs = [
    "Give the left tile. Print exactly: «LEFT 2»",
    "Give the right tile. Append: «RIGHT 3»",
    "Count the tiles it spans. Append: «SPAN 2»",
]
solution = '''
