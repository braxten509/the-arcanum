# ==== tier 2 — after s02: dicts, len, sum, key lookup ====

[[challenge]]
tier = 2
title = "THE LEDGER-BINDING"
starter = '''
tiles = {"grass": False, "wall": True, "water": True}
# The rival forges the tile legend.
'''
briefs = [
    "Count the kinds. Print exactly: «KINDS 3»",
    "Count the solid ones. Append: «SOLID 2»",
    "Count the walkable ones. Append: «OPEN 1»",
]
solution = '''
tiles = {"grass": False, "wall": True, "water": True}
print(f"KINDS {len(tiles)}")
print(f"SOLID {sum(tiles.values())}")
print(f"OPEN {len(tiles) - sum(tiles.values())}")
'''
cuts = [1, 2, 3]

