# SPELL DUEL — reference solutions (authored here; generated/attacks.toml is sliced
# from this by `python3 tools/gen_attacks.py rune-bound` with the server up — never
# hand-edit the generated file). A rival cartographer casts a false chart across the
# leyline; the wayfinder casts the true binding, one demand arming each stage. Every
# stage APPENDS one line — the transcript only grows. Pure-Python stdout; tier N
# unlocks after N charts are sealed, so demands lean only on concepts taught by then.

# ==== tier 1 — after s01: variables, strings, arithmetic, lists, f-strings ====

[[challenge]]
tier = 1
title = "THE NAME-BINDING"
starter = '''
name = "Aldermark"
ward = 6
# The rival smears the chart's name. Bind it true.
'''
briefs = [
    "Bind the chart's name. Print exactly: «MARK Aldermark»",
    "Declare its ward. Append: «WARD 6»",
    "Seal name to ward. Append: «SEAL Aldermark-6»",
]
solution = '''
name = "Aldermark"
ward = 6
print(f"MARK {name}")
print(f"WARD {ward}")
print(f"SEAL {name}-{ward}")
'''
cuts = [1, 2, 3]

