id = "s05"
codename = "CHART V // LIFE IN THE TILES"
short = "Living Frames"
title = "Life in the Tiles"
build = "Create sprites.py with a timed AnimatedSprite, then layer one walking test sprite over the scrolling map."
brief = '''
<p>Wayfinder, the map has ground but no life. This chart gives RuneBound one animated inhabitant without disturbing the map’s data ownership: a sprite sheet supplies pixels, <code>AnimatedSprite</code> owns its visual state, and a group gathers actors for the frame route.</p><ul><li>cut a code-built sprite sheet into source rectangles instead of keeping a one-frame rectangle</li><li>advance frames from elapsed seconds, not from how quickly a computer loops</li><li>draw the animated test sprite after the tile ground and before the single display flip</li></ul><p>For this chart, you build the placeholder sheet yourself in <code>sprites.py</code> with <code>make_placeholder_sheet()</code> — a 4-column by 2-row Surface of 32×32 frames drawn with <code>pygame.draw</code>: idle is row 0, walk is row 1. No image file is downloaded, so nothing is missing and no other game’s art is copied.</p>
'''
