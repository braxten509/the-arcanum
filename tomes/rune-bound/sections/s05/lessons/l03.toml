[[lessons.exercises]]
id = "s05-l03-e1"
type = "mc"
points = 20
prompt = '''<p>A game stalls for 0.46 seconds while an animation frame lasts 0.15 seconds. Why does <code>AnimatedSprite.update(dt)</code> use a <code>while</code> loop?</p>'''
choices = ['It lets the sprite process each whole elapsed frame interval and keep the small remainder.', 'It redraws the tile map before the event pump.', 'It changes a world rect into a camera coordinate.', 'It makes <code>pygame.key.get_pressed()</code> report one-time key presses.']
answer = 0
hint = '''Compare 0.46 with multiple 0.15-second intervals. A single branch can advance at most one frame even though roughly three intervals elapsed.'''
whyWrong = '''Tile rendering and camera conversion belong to their existing owners, while held-key polling is unrelated to animation time. The loop is about consuming elapsed animation intervals without turning a pause into permanently delayed animation.'''
explain = '''Three 0.15-second intervals can be spent and about 0.01 seconds retained for the next update.'''

