[[lessons]]
id = "s05-l03"
title = "The Seasoned Frame"
teaches = ["s05-animation-timer","s05-state-frame-map"]
body = '''
<p>s05-l03 opens the sprites and frames chart through Seasoned. s05-l03 hears THE CARTOGRAPHER name s05-animation-timer its first bearing. s05-l03 names one input, one change, and one output. s05-l03 gives s05-state-frame-map a second mark for comparison. s05-l03 keeps the smallest successful example beside its route.</p>
<p>s05-l03 reads from left to right, then narrates state changes. s05-l03 keeps its sprites and frames clue concrete and observable. s05-l03 runs twice; the second pass challenges the first. s05-l03 records which owner moved when s05-animation-timer shifted. s05-l03 carries earlier <code>player_rect</code> evidence into this chart.</p>
<p>s05-l03 asks one decision to stand alone in the margin. s05-l03 keeps s05-state-frame-map visible instead of hiding it behind polish. s05-l03 tests a friendly case and a sharp edge case. s05-l03 compares both traces so s05-animation-timer has a witness. s05-l03 names the failure before choosing a repair.</p>
<p>s05-l03 treats each handoff as a contract between maker and reader. s05-l03 supplies s05-animation-timer; the reader checks s05-state-frame-map. s05-l03 places its check where another wayfinder can repeat it. s05-l03 earns THE CARTOGRAPHER's trust through evidence, not luck. s05-l03 leaves one deliberate question for the next chart.</p>
<p>s05-l03 closes by stating what the program must preserve. s05-l03 names one input that could falsify s05-animation-timer. s05-l03 names one output that confirms s05-state-frame-map still belongs. s05-l03 runs the smallest route, inspects its trace, and annotates it. s05-l03 turns the sprites and frames chart into a RuneBound waypoint.</p>
<p>s05-l03 ends with a handoff to the next chart. s05-l03 carries s05-state-frame-map forward after s05-animation-timer earns trust. s05-l03 lets THE CARTOGRAPHER record the result in plain language. s05-l03 turns a clean rerun from a guess into a fact. s05-l03 lets the next wayfinder begin without hidden context.</p>
<pre><code>print("s05-l03 // The Seasoned Frame")</code></pre>
<div class="field-notes"><div class="fn-head">FIELD NOTES // S05-L03</div><p>s05-l03 <strong>Evidence.</strong> Record s05-animation-timer; compare it with s05-state-frame-map before advancing.</p><p>s05-l03 <strong>Repair.</strong> Change one cause, rerun the route, and preserve the explanation.</p></div>
'''

[[lessons.readings]]
label = "PyGame docs // sprites // The Seasoned Frame"
url = "https://www.pygame.org/docs/ref/sprite.html"

[[lessons.readings]]
label = "PyGame docs // Surface // The Seasoned Frame"
url = "https://www.pygame.org/docs/ref/surface.html"

[[lessons.exercises]]
id = "s05-l03-e1"
type = "mc"
points = 14
prompt = '''
<p>What is the purpose of a state-to-row animation map? Select the reading that keeps s06 can reuse the same sprite state while adding real player velocity possible.</p>
'''
choices = ["it converts a world coordinate into a tile index","The Seasoned Frame: keep s05-animation-timer owned by the named boundary and verify the result before handoff s05-l03-e1.","it pumps the operating system event queue","it stores every item the player has collected"]
answer = 1
whyWrong = '''
The tempting routes confuse advancing one frame on every loop and making the hero race on a fast machine with the job this trial actually asks you to protect; each decoy moves ownership to the wrong part of the chart.
'''
hint = '''
Trace animation_timer, frame_index, and a state-to-row map that does not depend on FPS in the Living Frames chart, then compare the the loop supplies elapsed time while the sprite decides when a frame has lasted long enough with the evidence named in the prompt.
'''
explain = '''
The selected mark preserves the loop supplies elapsed time while the sprite decides when a frame has lasted long enough and leaves animation_timer, frame_index, and a state-to-row map that does not depend on fps available for the next RuneBound handoff.
'''

[[lessons.exercises]]
id = "s05-l03-e2"
type = "text"
points = 16
prompt = '''
<p>s05-l03-e2: name the Python term for the specific unit requested by this chart. Supply the language term, not the surrounding story label.</p>
'''
answer = "delta time"
hint = '''
Recall the named boundary in The Seasoned Frame; the answer is the language term for that single job, not the larger game feature.
'''

[[lessons.exercises]]
id = "s05-l03-e3"
type = "fill"
points = 18
prompt = '''
<p>s05-l03-e3: restore the missing operation in the supplied code. Use its operands and the chart evidence to complete the route without renaming the owner.</p>
'''
code = '''
animation_timer += ____
'''
answer = "dt"
hint = '''
Look at what must happen to animation_timer += dt; if animation_timer >= frame_duration; choose the operation that performs that job rather than the one that merely inspects the result.
'''

[[lessons.exercises]]
id = "s05-l03-e4"
type = "type"
points = 10
reps = 2
prompt = '''
<p>Retype this living frames evidence exactly. Keep animation_timer, frame_index, and a state-to-row map that does not depend on fps visible while you write. (Ctrl+Enter submits.)</p>
'''
code = '''
animation_timer = 0.0
dt = 0.016
animation_timer += dt
print(animation_timer)
'''
