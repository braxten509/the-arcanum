[[lessons.exercises]]
id = "s05-l03-e4"
type = "write"
points = 35
prompt = '''<p>Write <code>advance(timer, dt, duration, frame_index, frame_count)</code>. Add <code>dt</code>, spend every full duration, wrap the index, and return <code>(timer, frame_index)</code>. For <code>0.01, 0.46, 0.15, 0, 4</code>, print exactly <code>TIMER 0.02</code> and <code>FRAME 3</code>.</p>'''
starter = '''
def advance(timer, dt, duration, frame_index, frame_count):
    # Return the remaining timer and wrapped frame index.
    pass

timer, frame_index = advance(0.01, 0.46, 0.15, 0, 4)
print("TIMER", round(timer, 2))
print("FRAME", frame_index)
'''
expect = '''
TIMER 0.02
FRAME 3
'''
solution = '''
def advance(timer, dt, duration, frame_index, frame_count):
    timer += dt
    while timer >= duration:
        timer -= duration
        frame_index = (frame_index + 1) % frame_count
    return timer, frame_index

timer, frame_index = advance(0.01, 0.46, 0.15, 0, 4)
print("TIMER", round(timer, 2))
print("FRAME", frame_index)
'''
hint = '''After adding <code>dt</code>, repeat subtraction while the timer reaches duration; advance with <code>(frame_index + 1) % frame_count</code>.'''

