[[lessons]]
id = "s05-l03"
title = "Let the Frames Keep Season"
teaches = ["s05-animation-timer", "s05-state-frame-map"]
body = '''
<p>A fast computer may run a loop far more often than a slow one. If you advance the animation once per loop, the same walk sheet races on the fast machine. The clock already gives <code>dt</code> in seconds at the end of s04’s frame route. Give that elapsed time to every actor with <code>actors.update(dt)</code>; then let <code>AnimatedSprite</code>, not <code>main.py</code>, decide whether enough time has passed for another frame.</p>
<p>Add these methods inside the existing <code>AnimatedSprite</code> class in <code>sprites.py</code>, below its constructor. <code>set_state</code> maps a semantic state to a sheet row. Resetting its index prevents a walk frame from leaking into idle. <code>update</code> uses a <code>while</code>, rather than one <code>if</code>, so a long pause can consume every elapsed frame interval without leaving the timer far behind.</p>
<pre><code>def set_state(self, state):
    if state not in self.state_rows:
        raise ValueError(f"unknown animation state: {state}")
    if state != self.state:
        self.state = state
        self.frame_index = 0
        self.animation_timer = 0.0

def update(self, dt):
    self.animation_timer += dt
    while self.animation_timer &gt;= self.frame_duration:
        self.animation_timer -= self.frame_duration
        row = self.state_rows[self.state]
        self.frame_index = (self.frame_index + 1) % len(self.frame_rects[row])
    row = self.state_rows[self.state]
    source_rect = self.frame_rects[row][self.frame_index]
    self.image = self.sheet.subsurface(source_rect).copy()

def draw(self, surface, camera):
    screen_position = (self.rect.x - camera[0], self.rect.y - camera[1])
    surface.blit(self.image, screen_position)
</code></pre>
<p>Now replace all of <code>main.py</code> with the complete route below. It preserves s04’s initialization, event pump, held-arrow camera update, map render, one flip, clock, and shutdown. The only new behaviors are building the placeholder sheet in code, gathering the test sprite, moving it automatically as a temporary animation proof, updating the group, and painting actors after ground. The test sprite’s wraparound is intentionally temporary: s06 replaces that demo movement with Player input and collision.</p>
<pre><code>import pygame

from sprites import AnimatedSprite, make_placeholder_sheet
from tilemap import TILE_SIZE, TileMap

FPS = 60
CAMERA_SPEED = 240
DEMO_SPEED = 96

pygame.init()
screen = pygame.display.set_mode((800, 600))
pygame.display.set_caption("RuneBound")
clock = pygame.time.Clock()
tile_map = TileMap("data/tiles.json", "data/maps/overworld.csv")
sheet = make_placeholder_sheet()
test_sprite = AnimatedSprite(sheet, 96, 96)
test_sprite.set_state("walk")
actors = pygame.sprite.Group(test_sprite)
camera = [0.0, 0.0]
dt = 0.0
running = True

while running:
    # First preserve the window's operating-system conversation.
    for event in pygame.event.get():
        if event.type == pygame.QUIT:
            running = False

    # Then retain s04's viewport controls before the demo actor moves.
    keys = pygame.key.get_pressed()
    # West is clamped because the chart's origin remains at the upper-left.
    if keys[pygame.K_LEFT]:
        camera[0] = max(0, camera[0] - CAMERA_SPEED * dt)
    # East may continue beyond the starter view until s06 owns follow bounds.
    if keys[pygame.K_RIGHT]:
        camera[0] += CAMERA_SPEED * dt
    # North and south use the same viewport state, never sprite world positions.
    if keys[pygame.K_UP]:
        # Preserve the upper map boundary from the previous chart.
        camera[1] = max(0, camera[1] - CAMERA_SPEED * dt)
    # Downward panning remains deliberately open-ended in this milestone.
    if keys[pygame.K_DOWN]:
        camera[1] += CAMERA_SPEED * dt

    # This is the temporary s05 motion proof, not player control.
    test_sprite.rect.x += DEMO_SPEED * dt
    if test_sprite.rect.left &gt;= len(tile_map.grid[0]) * TILE_SIZE:
        test_sprite.rect.right = 0
    # A Group applies the elapsed-time update to every current actor.
    actors.update(dt)

    # Layer ground, then the camera-adjusted actor, then present once.
    screen.fill((0, 0, 0))
    tile_map.render(screen, camera)
    for actor in actors:
        actor.draw(screen, camera)
    pygame.display.flip()
    dt = clock.tick(FPS) / 1000.0

pygame.quit()</code></pre>
<p>Run <code>python3 main.py</code> from the project folder. You should see the 32×32 walker change poses at about 0.15-second intervals as it crosses the map; hold an arrow and it stays at the same world location while the map and sprite shift together on screen. If it is frozen, verify <code>actors.update(dt)</code> is inside the loop. If it is too fast, verify you did not increment <code>frame_index</code> once per loop. Close with X and launch again.</p>
<div class="callout"><strong>THE CARTOGRAPHER'S RULE:</strong> the loop measures time; the sprite spends it on frames.</div>
<div class="field-notes"><div class="fn-head">FIELD NOTES // NEXT CHART</div><p>s06 keeps <code>AnimatedSprite</code>, <code>sheet</code>, <code>frame_rects</code>, <code>animation_timer</code>, and <code>state_rows</code>. It retires only <code>test_sprite</code>, <code>DEMO_SPEED</code>, and wraparound when <code>Player</code> takes over movement.</p></div>
'''

