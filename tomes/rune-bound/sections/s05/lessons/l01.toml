[[lessons]]
id = "s05-l01"
title = "The Sprite Muster"
teaches = ["s05-sprite-class","s05-sprite-groups"]
body = '''
<p>s05-l01 opens the sprites and frames chart through Sprite. s05-l01 hears THE CARTOGRAPHER name s05-sprite-class its first bearing. s05-l01 names one input, one change, and one output. s05-l01 gives s05-sprite-groups a second mark for comparison. s05-l01 keeps the smallest successful example beside its route.</p>
<p>s05-l01 reads from left to right, then narrates state changes. s05-l01 keeps its sprites and frames clue concrete and observable. s05-l01 runs twice; the second pass challenges the first. s05-l01 records which owner moved when s05-sprite-class shifted. s05-l01 carries earlier <code>player_rect</code> evidence into this chart.</p>
<p>s05-l01 asks one decision to stand alone in the margin. s05-l01 keeps s05-sprite-groups visible instead of hiding it behind polish. s05-l01 tests a friendly case and a sharp edge case. s05-l01 compares both traces so s05-sprite-class has a witness. s05-l01 names the failure before choosing a repair.</p>
<p>s05-l01 treats each handoff as a contract between maker and reader. s05-l01 supplies s05-sprite-class; the reader checks s05-sprite-groups. s05-l01 places its check where another wayfinder can repeat it. s05-l01 earns THE CARTOGRAPHER's trust through evidence, not luck. s05-l01 leaves one deliberate question for the next chart.</p>
<p>s05-l01 closes by stating what the program must preserve. s05-l01 names one input that could falsify s05-sprite-class. s05-l01 names one output that confirms s05-sprite-groups still belongs. s05-l01 runs the smallest route, inspects its trace, and annotates it. s05-l01 turns the sprites and frames chart into a RuneBound waypoint.</p>
<p>s05-l01 ends with a handoff to the next chart. s05-l01 carries s05-sprite-groups forward after s05-sprite-class earns trust. s05-l01 lets THE CARTOGRAPHER record the result in plain language. s05-l01 turns a clean rerun from a guess into a fact. s05-l01 lets the next wayfinder begin without hidden context.</p>
<pre><code>print("s05-l01 // The Sprite Muster")</code></pre>
<div class="field-notes"><div class="fn-head">FIELD NOTES // S05-L01</div><p>s05-l01 <strong>Evidence.</strong> Record s05-sprite-class; compare it with s05-sprite-groups before advancing.</p><p>s05-l01 <strong>Repair.</strong> Change one cause, rerun the route, and preserve the explanation.</p></div>
'''

[[lessons.readings]]
label = "PyGame docs // sprites // The Sprite Muster"
url = "https://www.pygame.org/docs/ref/sprite.html"

[[lessons.readings]]
label = "PyGame docs // Surface // The Sprite Muster"
url = "https://www.pygame.org/docs/ref/surface.html"

[[lessons.exercises]]
id = "s05-l01-e1"
type = "mc"
points = 14
prompt = '''
<p>What does a sprite group contribute to the first living scene? Select the reading that keeps the frame can now place life above the tilemap ground possible.</p>
'''
choices = ["a replacement for the event pump","a JSON catalog of solid tiles","a timer that chooses animation frames automatically","The Sprite Muster: keep s05-sprite-class owned by the named boundary and verify the result before handoff s05-l01-e1."]
answer = 3
whyWrong = '''
The tempting routes confuse keeping a loose list that the draw pass forgets or drawing the same actor twice with the job this trial actually asks you to protect; each decoy moves ownership to the wrong part of the chart.
'''
hint = '''
Trace a sprite image, rect, and Group that can be updated and drawn together in the Living Frames chart, then compare the the sprite owns its visual state while the group owns collection and iteration with the evidence named in the prompt.
'''
explain = '''
The selected mark preserves the sprite owns its visual state while the group owns collection and iteration and leaves a sprite image, rect, and group that can be updated and drawn together available for the next RuneBound handoff.
'''

[[lessons.exercises]]
id = "s05-l01-e2"
type = "write"
points = 30
prompt = '''
<p>Complete the living frames route and print exactly <code>RUNEBOUND S05 L01 SEAL</code>. Preserve the named data before adding the final observation.</p>
'''
starter = '''
route_mark = "sprite-muster"
print("survey pending")
# Add the chart seal after checking the route.
'''
expect = '''
RUNEBOUND S05 L01 SEAL
'''
solution = '''
route_mark = "sprite-muster"
print("RUNEBOUND S05 L01 SEAL")
'''
hint = '''
For s05-l01-e2, leave the route data intact and add only its final s05 observation; compare the starter output with the target before submitting.
'''

[[lessons.exercises]]
id = "s05-l01-e3"
type = "type"
points = 10
reps = 2
prompt = '''
<p>Retype this living frames evidence exactly. Keep a sprite image, rect, and group that can be updated and drawn together visible while you write. (Ctrl+Enter submits.)</p>
'''
code = '''
scene_name = "tile_map"
actors = ["wayfinder"]
print(scene_name, len(actors))
'''

[[lessons.exercises]]
id = "s05-l01-e4"
type = "fill"
points = 18
prompt = '''
<p>s05-l01-e4: restore the missing operation in the supplied code. Use its operands and the chart evidence to complete the route without renaming the owner.</p>
'''
code = '''
sprites.____(player)
'''
answer = "add"
hint = '''
Look at what must happen to sprites.add(player) followed by sprites.draw(screen); choose the operation that performs that job rather than the one that merely inspects the result.
'''

[[lessons.exercises]]
id = "s05-l01-e5"
type = "text"
points = 16
prompt = '''
<p>s05-l01-e5: name the Python term for the specific unit requested by this chart. Supply the language term, not the surrounding story label.</p>
'''
answer = "Sprite"
hint = '''
Recall the named boundary in The Sprite Muster; the answer is the language term for that single job, not the larger game feature.
'''
