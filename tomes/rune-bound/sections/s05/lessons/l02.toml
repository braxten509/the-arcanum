[[lessons]]
id = "s05-l02"
title = "Cut the Sheet Into Frames"
teaches = ["s05-frame-rects", "s05-sheet-slicing"]
body = '''
<p>A sprite sheet is one image containing many poses. It is not a list of files and it is not an image that PyGame automatically animates. RuneBound needs no downloaded art file: we <em>draw</em> the sheet ourselves, in code, so the whole chart runs from the same folder that holds <code>main.py</code>. Add this function to <code>sprites.py</code>, above the class, then build the sheet as a plain <code>Surface</code> of four 32×32 cells across and two rows — row 0 idle, row 1 walk:</p>
<pre><code>def make_placeholder_sheet(frame_width=32, frame_height=32,
                           columns=4, rows=2):
    sheet = pygame.Surface((frame_width * columns, frame_height * rows),
                           pygame.SRCALPHA)
    body_by_row = [(60, 130, 90), (95, 175, 115)]  # idle darker, walk brighter
    for row in range(rows):
        for column in range(columns):
            cx = column * frame_width
            cy = row * frame_height
            pygame.draw.rect(sheet, body_by_row[row % len(body_by_row)],
                             (cx + 8, cy + 6, 16, 20))
            pygame.draw.circle(sheet, (230, 210, 150), (cx + 16, cy + 9), 5)
            # a leg marker that shifts with the column, so every frame differs
            leg_x = cx + 8 + (column * 6) % 16
            pygame.draw.rect(sheet, (40, 40, 40), (leg_x, cy + 24, 4, 6))
    return sheet
</code></pre>
<p>Each column shifts the dark leg marker, so a changing frame index visibly changes pixels; row 1 is a brighter body than row 0. This is honest placeholder art, not copied game sprites. In <code>main.py</code> you build the sheet once and hand it to the actor — no file load, no <code>convert_alpha()</code> needed because we own the Surface:</p>
<pre><code>sheet = make_placeholder_sheet()
test_sprite = AnimatedSprite(sheet, 96, 96)
</code></pre>
<p>Replace the temporary green <code>pygame.Surface((32, 32), ...)</code> route from l01 in <code>AnimatedSprite.__init__</code> with the complete constructor below. This is a replacement of that constructor, not a second class. A source <code>Rect</code> names pixels inside <code>self.sheet</code>; <code>self.rect</code> remains the destination rectangle in the world. Keeping those jobs separate is how one sheet can supply many actors at different map locations.</p>
<pre><code>def __init__(self, sheet, x, y, frame_width=32, frame_height=32,
             frames_per_row=4, frame_duration=0.15):
    super().__init__()
    self.sheet = sheet
    self.frame_rects = []
    for row in range(2):
        row_rects = []
        for column in range(frames_per_row):
            row_rects.append(pygame.Rect(
                column * frame_width, row * frame_height,
                frame_width, frame_height,
            ))
        self.frame_rects.append(row_rects)
    self.state_rows = {"idle": 0, "walk": 1}
    self.state = "idle"
    self.frame_index = 0
    self.frame_duration = frame_duration
    self.animation_timer = 0.0
    self.image = self.sheet.subsurface(self.frame_rects[0][0]).copy()
    self.rect = self.image.get_rect(topleft=(x, y))
</code></pre>
<p>The nested <code>frame_rects[row][column]</code> mirrors the earlier row-before-column rule: row 0 holds idle frames, row 1 holds walk frames, and each column is the next pose in that row. The final <code>.copy()</code> gives the sprite its own displayable image rather than a fragile view into the sheet. If you see <code>ValueError: subsurface rectangle outside surface area</code>, first check that <code>make_placeholder_sheet()</code> still returns a 128×64 Surface and the 32×32/4-column facts; do not randomly change world coordinates.</p>
<p>The one-frame placeholder rectangle is now retired. The final chart must use source rectangles cut from the built sheet, so a changed frame index visibly chooses different sheet pixels.</p>
<div class="callout"><strong>THE CARTOGRAPHER'S RULE:</strong> source rectangles cut pixels from the sheet; destination rectangles place the current image in the world.</div>
<div class="field-notes"><div class="fn-head">FIELD NOTES // ASSET RECOVERY</div><p>If a frame looks wrong, print <code>sheet.get_size()</code> — it must be <code>(128, 64)</code>. Because the sheet is drawn by <code>make_placeholder_sheet()</code> and not loaded from disk, there is no missing-file failure to recover from; swap in real 4×2 32-pixel art later only if it is yours to use.</p></div>
'''

[[lessons.readings]]
