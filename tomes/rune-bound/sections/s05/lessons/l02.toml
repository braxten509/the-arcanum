[[lessons.exercises]]
id = "s05-l02-e1"
type = "type"
points = 12
reps = 2
prompt = '''<p>Retype the calculation for frame 3 in the second sheet row. These are source coordinates, not a world destination.</p>'''
code = '''
row = 1
column = 3
frame_rect = pygame.Rect(column * 32, row * 32, 32, 32)
'''

[[lessons.exercises]]
id = "s05-l02-e2"
type = "fill"
points = 22
prompt = '''<p>Restore the Surface method that extracts the pixels named by the already-built source rectangle.</p>'''
code = '''
self.image = self.sheet.____(self.frame_rects[0][0]).copy()
'''
answer = "subsurface"
hint = '''The source rectangle selects part of an existing Surface; use the method named in the constructor replacement before calling <code>.copy()</code>.'''
whyWrong = '''<code>blit</code> paints onto a destination Surface, while <code>get_rect</code> describes geometry. This line needs a new Surface made from the selected sheet region.'''

[[lessons.exercises]]
id = "s05-l02-e3"
type = "mc"
points = 20
prompt = '''<p>For a 32×32 sheet cell, which source rectangle selects column 2 of the walk row?</p>'''
choices = ['<code>pygame.Rect(32, 64, 32, 32)</code>', '<code>pygame.Rect(64, 32, 32, 32)</code>', '<code>pygame.Rect(2, 1, 32, 32)</code>', '<code>pygame.Rect(64, 32, 2, 1)</code>']
answer = 1
hint = '''Convert the column and row indexes to pixels separately: 2×32 horizontal, 1×32 vertical.'''
whyWrong = '''The first choice swaps row and column, the third uses indexes as pixels, and the last gives the rectangle index-sized dimensions. The source rectangle needs pixel coordinates and a full cell size.'''
explain = '''Column 2 begins at x 64; walk row 1 begins at y 32; the selected frame remains 32×32 pixels.'''

[[lessons.exercises]]
id = "s05-l02-e4"
type = "write"
points = 35
prompt = '''<p>Build a pure-Python frame table for a 4-column, 2-row sheet whose cells are 32 pixels. Store each frame as <code>(x, y, 32, 32)</code>. Then print exactly <code>FRAMES 2 4</code> and <code>WALK-2 (64, 32, 32, 32)</code>.</p>'''
starter = '''
frame_width = 32
frame_height = 32
frame_rects = []

# Build two rows of four (x, y, width, height) tuples.
# Then report the table dimensions and walk row, column 2.
'''
expect = '''
FRAMES 2 4
WALK-2 (64, 32, 32, 32)
'''
solution = '''
frame_width = 32
frame_height = 32
frame_rects = []

for row in range(2):
    row_frames = []
    for column in range(4):
        row_frames.append((
            column * frame_width,
            row * frame_height,
            frame_width,
            frame_height,
        ))
    frame_rects.append(row_frames)

print("FRAMES", len(frame_rects), len(frame_rects[0]))
print("WALK-2", frame_rects[1][2])
'''
hint = '''Append one inner row per outer <code>row</code>; each tuple begins with <code>column * frame_width</code> and <code>row * frame_height</code>.'''
