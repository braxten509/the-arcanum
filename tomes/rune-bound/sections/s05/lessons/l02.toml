[[lessons]]
id = "s05-l02"
title = "The Sheet Cutter"
teaches = ["s05-frame-rects","s05-sheet-slicing"]
body = '''
<p>s05-l02 opens the sprites and frames chart through Sheet. s05-l02 hears THE CARTOGRAPHER name s05-frame-rects its first bearing. s05-l02 names one input, one change, and one output. s05-l02 gives s05-sheet-slicing a second mark for comparison. s05-l02 keeps the smallest successful example beside its route.</p>
<p>s05-l02 reads from left to right, then narrates state changes. s05-l02 keeps its sprites and frames clue concrete and observable. s05-l02 runs twice; the second pass challenges the first. s05-l02 records which owner moved when s05-frame-rects shifted. s05-l02 carries earlier <code>player_rect</code> evidence into this chart.</p>
<p>s05-l02 asks one decision to stand alone in the margin. s05-l02 keeps s05-sheet-slicing visible instead of hiding it behind polish. s05-l02 tests a friendly case and a sharp edge case. s05-l02 compares both traces so s05-frame-rects has a witness. s05-l02 names the failure before choosing a repair.</p>
<p>s05-l02 treats each handoff as a contract between maker and reader. s05-l02 supplies s05-frame-rects; the reader checks s05-sheet-slicing. s05-l02 places its check where another wayfinder can repeat it. s05-l02 earns THE CARTOGRAPHER's trust through evidence, not luck. s05-l02 leaves one deliberate question for the next chart.</p>
<p>s05-l02 closes by stating what the program must preserve. s05-l02 names one input that could falsify s05-frame-rects. s05-l02 names one output that confirms s05-sheet-slicing still belongs. s05-l02 runs the smallest route, inspects its trace, and annotates it. s05-l02 turns the sprites and frames chart into a RuneBound waypoint.</p>
<p>s05-l02 ends with a handoff to the next chart. s05-l02 carries s05-sheet-slicing forward after s05-frame-rects earns trust. s05-l02 lets THE CARTOGRAPHER record the result in plain language. s05-l02 turns a clean rerun from a guess into a fact. s05-l02 lets the next wayfinder begin without hidden context.</p>
<pre><code>print("s05-l02 // The Sheet Cutter")</code></pre>
<div class="field-notes"><div class="fn-head">FIELD NOTES // S05-L02</div><p>s05-l02 <strong>Evidence.</strong> Record s05-frame-rects; compare it with s05-sheet-slicing before advancing.</p><p>s05-l02 <strong>Repair.</strong> Change one cause, rerun the route, and preserve the explanation.</p></div>
'''

[[lessons.readings]]
label = "PyGame docs // sprites // The Sheet Cutter"
url = "https://www.pygame.org/docs/ref/sprite.html"

[[lessons.exercises]]
id = "s05-l02-e1"
type = "type"
points = 10
reps = 2
prompt = '''
<p>Retype this living frames evidence exactly. Keep frame_rects that select one row and column without copying image files visible while you write. (Ctrl+Enter submits.)</p>
'''
code = '''
frame_width = 16
frame_index = 1
source_x = frame_width * frame_index
print(source_x)
'''

[[lessons.exercises]]
id = "s05-l02-e2"
type = "text"
points = 16
prompt = '''
<p>s05-l02-e2: name the Python term for the specific unit requested by this chart. Supply the language term, not the surrounding story label.</p>
'''
answer = "Rect"
hint = '''
Recall the named boundary in The Sheet Cutter; the answer is the language term for that single job, not the larger game feature.
'''

[[lessons.exercises]]
id = "s05-l02-e3"
type = "write"
points = 30
prompt = '''
<p>Complete the living frames route and print exactly <code>RUNEBOUND S05 L02 SEAL</code>. Preserve the named data before adding the final observation.</p>
'''
starter = '''
route_mark = "sheet-cutter"
print("survey pending")
# Add the chart seal after checking the route.
'''
expect = '''
RUNEBOUND S05 L02 SEAL
'''
solution = '''
route_mark = "sheet-cutter"
print("RUNEBOUND S05 L02 SEAL")
'''
hint = '''
For s05-l02-e3, leave the route data intact and add only its final s05 observation; compare the starter output with the target before submitting.
'''

[[lessons.exercises]]
id = "s05-l02-e4"
type = "mc"
points = 14
prompt = '''
<p>Why keep source and destination rectangles as separate ideas? Select the reading that keeps the animation timer can advance an index without knowing the sheet's storage details possible.</p>
'''
choices = ["the source rectangle stores the player's inventory","the destination rectangle decides which event closes the window","separating them makes delta time unnecessary","The Sheet Cutter: keep s05-frame-rects owned by the named boundary and verify the result before handoff s05-l02-e4."]
answer = 3
whyWrong = '''
The tempting routes confuse using a destination position as a source rectangle or stepping by the wrong frame width with the job this trial actually asks you to protect; each decoy moves ownership to the wrong part of the chart.
'''
hint = '''
Trace frame_rects that select one row and column without copying image files in the Living Frames chart, then compare the a source rectangle names pixels in the sheet while the destination rect names world placement with the evidence named in the prompt.
'''
explain = '''
The selected mark preserves a source rectangle names pixels in the sheet while the destination rect names world placement and leaves frame_rects that select one row and column without copying image files available for the next RuneBound handoff.
'''

[[lessons.exercises]]
id = "s05-l02-e5"
type = "fill"
points = 18
prompt = '''
<p>s05-l02-e5: restore the missing operation in the supplied code. Use its operands and the chart evidence to complete the route without renaming the owner.</p>
'''
code = '''
frame = sheet.____(frame_rect)
'''
answer = "subsurface"
hint = '''
Look at what must happen to frame = sheet.subsurface(frame_rect); choose the operation that performs that job rather than the one that merely inspects the result.
'''
