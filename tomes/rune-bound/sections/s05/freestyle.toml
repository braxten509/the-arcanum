[freestyle]
title = "THE WORKING 5 // Life in the Tiles"
brief = '''
<p>Bind life in the tiles into the growing RuneBound route. The commission must leave a runnable artifact whose behavior can be inspected from the named evidence.</p><ul><li>preserve the chart's data boundary and use the established names</li><li>prove the requested behavior with a repeatable run that ends at <code>RUNEBOUND S05 SEAL</code></li><li>write a short repair note explaining the nearest failure and the change that corrected it</li></ul>
'''
requires = ["s05-sprite-class","s05-sprite-groups","s05-frame-rects","s05-sheet-slicing","s05-animation-timer","s05-state-frame-map"]
reward = 220
xray = '''
The Cartographer checks whether the living frames commission keeps a sprite image, rect, and group that can be updated and drawn together under the right owner, shows s06 can reuse the same sprite state while adding real player velocity, and leaves evidence beyond a decorative printout.
'''

[freestyle.badge]
id = "badge-s05"
name = "LIVING FRAMES SEALED"
desc = "Sealed the life in the tiles chart with evidence another wayfinder can inspect."

[[freestyle.rubric]]
criterion = "Living Frames runs"
weight = 25
desc = '''
The life in the tiles artifact parses and runs with the chart's named behavior visible.
'''

[[freestyle.rubric]]
criterion = "Living Frames keeps its boundary"
weight = 35
desc = '''
The commission keeps a sprite image, rect, and group that can be updated and drawn together and s06 can reuse the same sprite state while adding real player velocity in the owners established by the lessons.
'''

[[freestyle.rubric]]
criterion = "Living Frames shows proof"
weight = 25
desc = '''
The wayfinder supplies a repeatable observation, the exact s05 seal, and a useful comparison case rather than a one-time claim.
'''

[[freestyle.rubric]]
criterion = "Cartographer's repair note"
weight = 15
desc = '''
The explanation names the failing boundary, the evidence that exposed it, and the smallest correction that restored the route.
'''

