[freestyle]
title = "BUILD: Life in the Tiles"
brief = '''
<p>Wayfinder, turn the static overworld into a living scene. Work in your local RuneBound project. The commission is complete only when the visual route survives a close-and-rerun.</p>
<ul><li>build the placeholder sheet in code with a <code>make_placeholder_sheet()</code> function in <code>sprites.py</code> — a 4 columns × 2 rows Surface of 32×32 frames drawn with <code>pygame.draw</code>; depend on no external image file and copy no proprietary game art</li><li>create <code>sprites.py</code> with <code>AnimatedSprite(pygame.sprite.Sprite)</code>; it must own <code>sheet</code>, nested <code>frame_rects[row][column]</code>, <code>state_rows = {"idle": 0, "walk": 1}</code>, <code>state</code>, <code>frame_index</code>, <code>frame_duration</code>, <code>animation_timer</code>, a world-space <code>rect</code>, <code>set_state(state)</code>, <code>update(dt)</code>, and <code>draw(surface, camera)</code></li><li>derive source rectangles from the sheet and retire the section’s one-frame <code>pygame.Rect(0, 0, 32, 32)</code> placeholder; a new frame must replace <code>image</code> by slicing the sheet</li><li>update <code>main.py</code> without removing its map load, event pump, held-arrow camera controls, one clock, one flip, or shutdown: build the sheet after the display exists by calling <code>make_placeholder_sheet()</code>, put one walking test sprite in <code>actors</code>, call <code>actors.update(dt)</code>, render ground first, then draw actors with the camera</li><li>make the test sprite cross and wrap across the map at a delta-time speed. This temporary demo must be clearly named <code>test_sprite</code> and use <code>DEMO_SPEED</code>; s06 replaces it with Player input and collision</li><li>run <code>python3 main.py</code> from the project folder, close with X, run it again, and add a short <code>README.md</code> record of the exact command, visible frame change, camera observation, and one specific repair or an explicit no-repair result</li></ul>
'''
requires = ["s05-sprite-class", "s05-sprite-groups", "s05-frame-rects", "s05-sheet-slicing", "s05-animation-timer", "s05-state-frame-map"]
reward = 285
xray = '''
The Cartographer checks the actual sheet path and the constructor rather than accepting a colored rectangle as animation. He follows the frame timer across a slow update, checks that state labels choose rows, and confirms that map ground paints before world-space actors without a second display flip. He also finds the temporary demo named plainly enough for s06 to retire. Clear snake_case names, four-space indentation, focused methods, and a useful README recovery note earn the craft marks.
'''

[freestyle.badge]
id = "badge-s05"
name = "LIVING FRAMES SEALED"
desc = "Set a sheet of frames in motion over the mapped world."

[[freestyle.rubric]]
criterion = "Timed AnimatedSprite contract"
weight = 30
desc = '''<code>sprites.py</code> defines <code>AnimatedSprite(pygame.sprite.Sprite)</code> with the named sheet, nested frame rectangles, state-to-row dictionary, world rect, and delta-time update contract. Frame advancement is not tied to raw loop count.'''

[[freestyle.rubric]]
criterion = "Sheet Frames Replace the Placeholder"
weight = 20
desc = '''<code>make_placeholder_sheet()</code> builds the 4×2 32-pixel sheet after display setup; source rectangles select its pixels and replace the s05 single-frame rectangle placeholder. No external or copied proprietary art is required.'''

[[freestyle.rubric]]
criterion = "Map and Sprite Frame Integration"
weight = 25
desc = '''<code>main.py</code> preserves the s04 map/event/camera/clock route, updates a sprite Group with <code>dt</code>, paints tile ground before camera-adjusted actors, flips once, and cleanly quits.'''

[[freestyle.rubric]]
criterion = "Repeatable Visual Evidence"
weight = 10
desc = '''README records <code>python3 main.py</code>, a visible pose-change observation, a camera observation, and a precise repair with evidence or an explicit no-repair result; the window is closed and successfully launched again.'''

[[freestyle.rubric]]
criterion = "Python Chartcraft"
weight = 15
desc = '''Python uses descriptive snake_case names, four-space indentation, focused methods, and stable public AnimatedSprite names; temporary <code>test_sprite</code> and <code>DEMO_SPEED</code> are plainly isolated for s06 replacement.'''
