[freestyle]
title = "THE WORKING 4 // The Ground Beneath"
brief = '''
<p>Bind the ground beneath into the growing RuneBound route. The commission must leave a runnable artifact whose behavior can be inspected from the named evidence.</p><ul><li>preserve the chart's data boundary and use the established names</li><li>prove the requested behavior with a repeatable run that ends at <code>RUNEBOUND S04 SEAL</code></li><li>write a short repair note explaining the nearest failure and the change that corrected it</li></ul>
'''
requires = ["s04-csv-map","s04-grid-render-order","s04-tile-catalog","s04-solid-data","s04-world-blitting","s04-tile-rects","s04-camera-transform","s04-world-screen-boundary","s04-tilemap-class","s04-scrolling-proof"]
reward = 212
xray = '''
The Cartographer checks whether the ground survey commission keeps a rectangular list whose values can be handed to a renderer under the right owner, shows the next chart can add animated life to a ground contract that already works, and leaves evidence beyond a decorative printout.
'''

[freestyle.badge]
id = "badge-s04"
name = "GROUND SURVEY SEALED"
desc = "Sealed the the ground beneath chart with evidence another wayfinder can inspect."

[[freestyle.rubric]]
criterion = "Ground Survey runs"
weight = 25
desc = '''
The the ground beneath artifact parses and runs with the chart's named behavior visible.
'''

[[freestyle.rubric]]
criterion = "Ground Survey keeps its boundary"
weight = 35
desc = '''
The commission keeps a rectangular list whose values can be handed to a renderer and the next chart can add animated life to a ground contract that already works in the owners established by the lessons.
'''

[[freestyle.rubric]]
criterion = "Ground Survey shows proof"
weight = 25
desc = '''
The wayfinder supplies a repeatable observation, the exact s04 seal, and a useful comparison case rather than a one-time claim.
'''

[[freestyle.rubric]]
criterion = "Cartographer's repair note"
weight = 15
desc = '''
The explanation names the failing boundary, the evidence that exposed it, and the smallest correction that restored the route.
'''

