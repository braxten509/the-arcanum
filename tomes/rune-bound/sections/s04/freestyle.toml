[freestyle]
title = "BUILD: The Ground Beneath"
brief = '''
<p>Wayfinder, replace the s03 rectangle probe with RuneBound’s first real overworld. Work in your local RuneBound project; this commission is complete only when the window proves the route.</p>
<ul><li>create <code>data/tiles.json</code> with lower-case <code>grass</code>, <code>path</code>, and <code>wall</code> definitions; each must contain <code>name</code>, RGB <code>color</code>, and Boolean <code>solid</code></li><li>create <code>data/maps/overworld.csv</code> as a rectangular 19-row by 25-column grid using only those ids (25 columns × 32 pixels = 800; 19 rows × 32 pixels = 608)</li><li>create <code>tilemap.py</code> with canonical <code>GameEntity</code>, <code>Tile(GameEntity)</code>, <code>TileMap.load(filename)</code>, <code>TileMap.render(surface, camera)</code>, <code>TileMap.tile_at(world_x, world_y)</code>, and <code>TileMap.is_solid(world_x, world_y)</code></li><li>preserve row-major traversal and translate each cell through <code>world = (col * TILE_SIZE, row * TILE_SIZE)</code> and <code>screen = world - camera</code></li><li>update <code>main.py</code> to load the map, change only <code>camera</code> from held arrow keys using <code>CAMERA_SPEED * dt</code>, render ground before the single display flip, and remove the earlier hardcoded GRASS/AMBER/waystone probe and any inline map list</li><li>run <code>python3 main.py</code> from the project folder, close with X, rerun it, and include a short <code>README.md</code> note recording the command, initial view, right-scroll observation, and one specific repair or a statement that no repair was needed</li></ul>
'''
requires = ["s04-tile-catalog-data", "s04-csv-map-loading", "s04-tile-inheritance", "s04-row-major-render", "s04-tilemap-load-api", "s04-world-blitting", "s04-camera-offset-transform", "s04-tile-at-api", "s04-camera-scroll-input", "s04-scrolling-map-integration"]
reward = 260
xray = '''
The Cartographer opens the CSV and JSON rather than trusting painted colors. He checks that TileMap, not main.py, owns grid loading and rendering; that row is vertical and column horizontal; that Tile inherits rather than copies spatial setup; and that scrolling changes the camera instead of mutating tile world data. He also follows the README command through a close-and-rerun observation. Clear snake_case names, four-space indentation, and a short useful repair record earn the craft marks.
'''

[freestyle.badge]
id = "badge-s04"
name = "GROUND SURVEY SEALED"
desc = "Mapped a data-defined world and moved its viewport without moving the land."

[[freestyle.rubric]]
criterion = "Data-defined overworld"
weight = 25
desc = '''<code>data/tiles.json</code> and the rectangular 25×19 <code>data/maps/overworld.csv</code> exist, agree on lower-case ids, and provide visible colors plus solid data. No inline map is the delivered layout source.'''

[[freestyle.rubric]]
criterion = "TileMap contracts"
weight = 25
desc = '''<code>tilemap.py</code> preserves GameEntity spatial attributes through Tile inheritance and implements loading, row-major rendering, <code>tile_at(world_x, world_y)</code>, and data-driven <code>is_solid</code> with the documented world-pixel boundary.'''

[[freestyle.rubric]]
criterion = "Scrolling frame integration"
weight = 25
desc = '''<code>main.py</code> retains the s03 event pump, one flip, clock, and clean shutdown while replacing the probe with TileMap rendering. Held arrows update camera by delta time, and screen positions subtract that camera without mutating map data.'''

[[freestyle.rubric]]
criterion = "Repeatable visual evidence"
weight = 10
desc = '''The README records the exact launch command, the initial map view, a right-scroll observation, and either one precise repair with evidence or an explicit no-repair result; the window is closed and launched again successfully.'''

[[freestyle.rubric]]
criterion = "Python chartcraft"
weight = 15
desc = '''Python uses descriptive snake_case names, four-space indentation, focused methods, and avoids mutable module-level world data; JSON/CSV paths and public TileMap names match the lesson contracts exactly.'''
