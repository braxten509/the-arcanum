[[lessons]]
id = "s04-l02"
title = "Set Tiles on the Survey Grid"
teaches = ["s04-tile-inheritance", "s04-row-major-render"]
body = '''
<p>The ledger says what a tile means; a placed tile also needs a location. Copy the canonical <code>GameEntity(x, y, width, height)</code> class from s02 into <code>tilemap.py</code> unchanged. Directly below that complete base class, declare <code>Tile(GameEntity)</code>. Inside its initializer, call <code>super().__init__(x, y, width, height)</code> before assigning <code>self.tile_id = tile_id</code>. This is a member-only edit: do not create another <code>GameEntity</code> or repeat its four assignments. The parent remains the sole writer of spatial state, while the child records its catalog key.</p>
<p>Pixels and grid addresses are different maps. Given <code>TILE_SIZE = 32</code>, the cell at <code>row = 2</code>, <code>col = 3</code> has world pixel position <code>x = 3 * 32</code>, <code>y = 2 * 32</code>. The row chooses vertical distance; the column chooses horizontal distance. Do not reverse them because a square test map happened to look plausible.</p>
<p>Use the exact nested pattern learned in s01: the outer loop receives each row, the inner loop receives each cell. For the first isolated render proof only, use <code>[["grass", "wall"], ["path", "grass"]]</code>. Create a <code>Tile</code> for every cell and print its position and id. This makes the new class and coordinate conversion observable before PyGame hides the loop behind pixels.</p>
<pre><code>for row_index, row in enumerate(grid):
    for col_index, tile_id in enumerate(row):
        tile = Tile(col_index * TILE_SIZE, row_index * TILE_SIZE,
                    TILE_SIZE, TILE_SIZE, tile_id)</code></pre>
<p>That inline grid is deliberately temporary. In the next lesson replace it completely with <code>self.grid</code> loaded from <code>overworld.csv</code>; do not leave a second source of world layout in the delivered code. Later s05 sprites can stand over these tiles because tiles now have a stable world position and a single owner.</p>
<div class="field-notes"><div class="fn-head">FIELD NOTES // ROW BEFORE COLUMN</div><p><code>enumerate</code> supplies both the index and value. The grid remains <code>grid[row][col]</code>; only its pixel projection becomes <code>(col * TILE_SIZE, row * TILE_SIZE)</code>.</p></div>
'''

[[lessons.readings]]
label = "Python Docs // enumerate"
url = "https://docs.python.org/3/library/functions.html#enumerate"

[[lessons.exercises]]
id = "s04-l02-e1"
type = "type"
points = 12
reps = 2
prompt = '''<p>Retype the child initializer that preserves the base spatial owner and adds one tile-specific field.</p>'''
code = '''
class Tile(GameEntity):
    def __init__(self, x, y, width, height, tile_id):
        super().__init__(x, y, width, height)
        self.tile_id = tile_id
'''

[[lessons.exercises]]
id = "s04-l02-e2"
type = "mc"
points = 20
prompt = '''<p>For a 32-pixel tile at grid row 2, column 3, which world position is correct?</p>'''
choices = ['<code>(64, 96)</code>', '<code>(96, 64)</code>', '<code>(3, 2)</code>', '<code>(32, 32)</code>']
answer = 1
hint = '''Columns measure horizontal x; rows measure vertical y. Multiply each index by the tile size.'''
whyWrong = '''Swapping the pair treats a row as horizontal. Raw grid indexes are not pixel coordinates, and one tile size does not encode the cell’s location.'''
explain = '''Column 3 becomes x 96, and row 2 becomes y 64.'''

[[lessons.exercises]]
id = "s04-l02-e3"
type = "fill"
points = 22
prompt = '''<p>Restore the inner loop variable that names one tile-id string from the current row.</p>'''
code = '''
for row_index, row in enumerate(grid):
    for col_index, ____ in enumerate(row):
        print(row_index, col_index)
'''
answer = "tile_id"
hint = '''The value is later passed to <code>Tile(..., tile_id)</code> and used as the catalog key.'''
whyWrong = '''The inner value is not the row itself and not a pixel coordinate. It is the string that identifies the placed tile’s rules.'''

[[lessons.exercises]]
id = "s04-l02-e4"
type = "write"
points = 35
prompt = '''<p>Define the supplied spatial base and a <code>Tile</code> child. Walk the given two-row grid in row-major order, create 32×32 tiles, and print exactly <code>0 0 grass</code>, <code>0 1 wall</code>, <code>1 0 path</code>, and <code>1 1 grass</code>.</p>'''
starter = '''
grid = [["grass", "wall"], ["path", "grass"]]
TILE_SIZE = 32

class GameEntity:
    def __init__(s, x, y, width, height):
        s.x, s.y, s.width, s.height = x, y, width, height

# Define Tile, then print row, column, and id for each placed tile.
'''
expect = '''
0 0 grass
0 1 wall
1 0 path
1 1 grass
'''
solution = '''
grid = [["grass", "wall"], ["path", "grass"]]
TILE_SIZE = 32

class GameEntity:
    def __init__(s, x, y, width, height):
        s.x, s.y, s.width, s.height = x, y, width, height

class Tile(GameEntity):
    def __init__(self, x, y, width, height, tile_id):
        super().__init__(x, y, width, height)
        self.tile_id = tile_id

for row_index, row in enumerate(grid):
    for col_index, tile_id in enumerate(row):
        tile = Tile(col_index * TILE_SIZE, row_index * TILE_SIZE, TILE_SIZE, TILE_SIZE, tile_id)
        print(row_index, col_index, tile.tile_id)
'''
hint = '''Use nested <code>enumerate</code> loops, pass column-derived x and row-derived y to Tile, then print the two indexes and <code>tile.tile_id</code>.'''

[[lessons.exercises]]
id = "s04-l02-e5"
type = "text"
points = 18
prompt = '''<p>Which method delegates the four spatial arguments to the parent initializer from inside a child class?</p>'''
answer = "super"
accept = ["super()"]
hint = '''It is the built-in followed by a dot before <code>__init__</code> in the worked Tile constructor.'''
whyWrong = '''A child should not duplicate the base assignments. The parent-call mechanism retains one owner for x, y, width, and height.'''
