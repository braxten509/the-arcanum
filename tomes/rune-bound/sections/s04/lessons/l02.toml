[[lessons]]
id = "s04-l02"
title = "The Tile Rulebook"
teaches = ["s04-tile-catalog","s04-solid-data"]
body = '''
<p>s04-l02 opens the tiles and cameras chart through Tile. s04-l02 hears THE CARTOGRAPHER name s04-tile-catalog its first bearing. s04-l02 names one input, one change, and one output. s04-l02 gives s04-solid-data a second mark for comparison. s04-l02 keeps the smallest successful example beside its route.</p>
<p>s04-l02 reads from left to right, then narrates state changes. s04-l02 keeps its tiles and cameras clue concrete and observable. s04-l02 runs twice; the second pass challenges the first. s04-l02 records which owner moved when s04-tile-catalog shifted. s04-l02 carries earlier <code>tile_map</code> evidence into this chart.</p>
<p>s04-l02 asks one decision to stand alone in the margin. s04-l02 keeps s04-solid-data visible instead of hiding it behind polish. s04-l02 tests a friendly case and a sharp edge case. s04-l02 compares both traces so s04-tile-catalog has a witness. s04-l02 names the failure before choosing a repair.</p>
<p>s04-l02 treats each handoff as a contract between maker and reader. s04-l02 supplies s04-tile-catalog; the reader checks s04-solid-data. s04-l02 places its check where another wayfinder can repeat it. s04-l02 earns THE CARTOGRAPHER's trust through evidence, not luck. s04-l02 leaves one deliberate question for the next chart.</p>
<p>s04-l02 closes by stating what the program must preserve. s04-l02 names one input that could falsify s04-tile-catalog. s04-l02 names one output that confirms s04-solid-data still belongs. s04-l02 runs the smallest route, inspects its trace, and annotates it. s04-l02 turns the tiles and cameras chart into a RuneBound waypoint.</p>
<p>s04-l02 ends with a handoff to the next chart. s04-l02 carries s04-solid-data forward after s04-tile-catalog earns trust. s04-l02 lets THE CARTOGRAPHER record the result in plain language. s04-l02 turns a clean rerun from a guess into a fact. s04-l02 lets the next wayfinder begin without hidden context.</p>
<pre><code>print("s04-l02 // The Tile Rulebook")</code></pre>
<div class="field-notes"><div class="fn-head">FIELD NOTES // S04-L02</div><p>s04-l02 <strong>Evidence.</strong> Record s04-tile-catalog; compare it with s04-solid-data before advancing.</p><p>s04-l02 <strong>Repair.</strong> Change one cause, rerun the route, and preserve the explanation.</p></div>
'''

[[lessons.readings]]
label = "Python library // csv // The Tile Rulebook"
url = "https://docs.python.org/3/library/csv.html"

[[lessons.readings]]
label = "PyGame docs // Surface blit // The Tile Rulebook"
url = "https://www.pygame.org/docs/ref/surface.html"

[[lessons.exercises]]
id = "s04-l02-e1"
type = "write"
points = 30
prompt = '''
<p>Complete the ground survey route and print exactly <code>RUNEBOUND S04 L02 SEAL</code>. Preserve the named data before adding the final observation.</p>
'''
starter = '''
route_mark = "tile-rulebook"
print("survey pending")
# Add the chart seal after checking the route.
'''
expect = '''
RUNEBOUND S04 L02 SEAL
'''
solution = '''
route_mark = "tile-rulebook"
print("RUNEBOUND S04 L02 SEAL")
'''
hint = '''
For s04-l02-e1, leave the route data intact and add only its final s04 observation; compare the starter output with the target before submitting.
'''

[[lessons.exercises]]
id = "s04-l02-e2"
type = "mc"
points = 14
prompt = '''
<p>Why keep tile properties in a catalog instead of branching on every map cell? Select the reading that keeps tilemap can render and collide against new definitions without a rewrite possible.</p>
'''
choices = ["JSON automatically draws every tile without a Surface","the catalog makes row and column order irrelevant","a data file prevents a missing key from ever occurring","the renderer can support new ids by reading data rather than changing its loop"]
answer = 3
whyWrong = '''
The tempting routes confuse using a numeric key in python while the json object supplies a string key with the job this trial actually asks you to protect; each decoy moves ownership to the wrong part of the chart.
'''
hint = '''
Trace tile_types as a data lookup that keeps map placement independent from appearance in the Ground Survey chart, then compare the the map says which id is present while the catalog says what that id does with the evidence named in the prompt.
'''
explain = '''
The selected mark preserves the map says which id is present while the catalog says what that id does and leaves tile_types as a data lookup that keeps map placement independent from appearance available for the next RuneBound handoff.
'''

[[lessons.exercises]]
id = "s04-l02-e3"
type = "text"
points = 16
prompt = '''
<p>s04-l02-e3: name the Python term for the specific unit requested by this chart. Supply the language term, not the surrounding story label.</p>
'''
answer = "JSON"
hint = '''
Recall the named boundary in The Tile Rulebook; the answer is the language term for that single job, not the larger game feature.
'''

[[lessons.exercises]]
id = "s04-l02-e4"
type = "fill"
points = 18
prompt = '''
<p>s04-l02-e4: restore the missing operation in the supplied code. Use its operands and the chart evidence to complete the route without renaming the owner.</p>
'''
code = '''
tile_types = json.____(handle)
'''
answer = "load"
hint = '''
Look at what must happen to tile_types["1"]["solid"] is the rule for a wall mark; choose the operation that performs that job rather than the one that merely inspects the result.
'''
