print("tile rect", tile_rect)
'''

[[lessons.exercises]]
id = "s04-l03-e4"
type = "fill"
points = 18
prompt = '''
<p>s04-l03-e4: restore the missing operation in the supplied code. Use its operands and the chart evidence to complete the route without renaming the owner.</p>
'''
code = '''
screen.____(tile_surface, tile_rect)
'''
answer = "blit"
hint = '''
Look at what must happen to screen.blit(tile_surface, tile_rect); choose the operation that performs that job rather than the one that merely inspects the result.
'''

