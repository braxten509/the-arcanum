[[lessons]]
id = "s04-l03"
title = "Let the Map Paint Itself"
teaches = ["s04-tilemap-load-api", "s04-world-blitting"]
body = '''
<p>Now turn the survey into a system. In <code>tilemap.py</code>, <code>TileMap</code> owns the catalog and the grid. Its constructor loads the rules once, then calls <code>load(filename)</code> to replace the entire grid from a CSV file. This method is deliberately a public pattern: s10 will call it with a quest-gated map variation. Give it a filename; do not make later code reach in and edit individual rows.</p>
<pre><code>import csv
import json

TILE_SIZE = 32

class TileMap:
    def __init__(self, tiles_filename, map_filename):
        with open(tiles_filename, encoding="utf-8") as handle:
            self.tile_types = json.load(handle)
        self.grid = []
        self.load(map_filename)

    def load(self, filename):
        with open(filename, newline="", encoding="utf-8") as handle:
            self.grid = [row for row in csv.reader(handle) if row]</code></pre>
<p>Notice the replacement assignment. It retires l02’s inline grid instead of appending CSV rows beside it. A malformed blank line is skipped; an unknown nonblank id stays visible and will fail at strict catalog lookup during rendering. That is useful evidence: repair the data file’s spelling.</p>
<p><code>render(surface, camera)</code> repeats s01’s row-major walk. It calculates a tile’s world position from <code>col_index</code> and <code>row_index</code>, looks up the catalog definition, and asks PyGame to paint a rectangle. The ground is drawn before future sprites and UI. It does not call <code>pygame.display.flip()</code>; s03 established that <code>main.py</code> presents one completed frame.</p>
<pre><code>def render(self, surface, camera):
    for row_index, row in enumerate(self.grid):
        for col_index, tile_id in enumerate(row):
            definition = self.tile_types[tile_id]
            color = definition["color"]
            # camera conversion comes in the next lesson
            rect = pygame.Rect(col_index * TILE_SIZE, row_index * TILE_SIZE,
                               TILE_SIZE, TILE_SIZE)
            pygame.draw.rect(surface, color, rect)</code></pre>
<p>This is data-driven replacement for s03’s <code>GRASS</code>, <code>AMBER</code>, hardcoded waystone, and standalone probe <code>TILE_SIZE</code>. Keep the shared size as <code>tilemap.TILE_SIZE</code>; no separate visual constants remain in <code>main.py</code>. At this point the inline map is gone and the CSV is the only layout source.</p>
<div class="callout"><strong>THE CARTOGRAPHER'S RULE:</strong> TileMap paints ground; main.py schedules the frame and flips it once.</div>
'''

[[lessons.readings]]
label = "PyGame Docs // draw"
url = "https://www.pygame.org/docs/ref/draw.html"

[[lessons.exercises]]
id = "s04-l03-e1"
type = "fill"
points = 22
prompt = '''<p>Restore the comprehension condition that keeps a parsed CSV record only when it contains cells.</p>'''
code = '''
with open(filename, newline="", encoding="utf-8") as handle:
    self.grid = [row for row in csv.reader(handle) if ____]
'''
answer = "row"
hint = '''The comprehension keeps a row only when that row has content.'''
whyWrong = '''Testing the filename or catalog here would not filter blank CSV records. The condition must refer to the row just read.'''

[[lessons.exercises]]
id = "s04-l03-e2"
type = "mc"
points = 20
prompt = '''<p>Who should call <code>pygame.display.flip()</code> after a frame containing the map and future sprites is fully painted?</p>'''
choices = ['<code>TileMap.load</code>', '<code>TileMap.render</code>', '<code>main.py</code> after all drawing', '<code>data/tiles.json</code>']
answer = 2
hint = '''Recall s03’s one-flip frame route: presentation follows every draw layer.'''
whyWrong = '''Loading has no pixels, and rendering only contributes the ground layer. Letting a data file or a partial renderer present early would break the established draw order.'''
explain = '''The entry point owns the frame schedule, so it flips once after ground, later entities, and interface drawing are complete.'''

[[lessons.exercises]]
id = "s04-l03-e3"
type = "text"
points = 18
prompt = '''<p>What public TileMap method should s10 use to replace the current grid with a different map file?</p>'''
answer = "load"
accept = ["TileMap.load", "tile_map.load"]
hint = '''It receives a filename and assigns a newly read CSV list to the object’s grid.'''
whyWrong = '''The renderer paints existing data and the constructor creates the object. The reusable file-change operation has its own short method name.'''

[[lessons.exercises]]
id = "s04-l03-e4"
type = "write"
points = 34
prompt = '''<p>Given two CSV-shaped rows, use <code>csv.reader</code> to build a grid, then print exactly <code>ROWS 2</code> and <code>CELL wall</code>. This single-file lab models parsing; the delivered project reads the same shape from <code>data/maps/overworld.csv</code>.</p>'''
starter = '''
import csv
from io import StringIO

map_text = "grass,wall\npath,grass\n"

# Read the text with csv.reader, keep nonblank rows, and inspect the top-right cell.
'''
expect = '''
ROWS 2
CELL wall
'''
solution = '''
import csv
from io import StringIO

map_text = "grass,wall\npath,grass\n"
grid = [row for row in csv.reader(StringIO(map_text)) if row]
print("ROWS", len(grid))
print("CELL", grid[0][1])
'''
hint = '''Wrap <code>map_text</code> in <code>StringIO</code>, build the list with <code>csv.reader</code>, then use row 0 and column 1 for the top-right id.'''

