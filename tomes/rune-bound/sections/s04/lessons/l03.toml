[[lessons]]
id = "s04-l03"
title = "The Blit Order of the World"
teaches = ["s04-world-blitting","s04-tile-rects"]
body = '''
<p>s04-l03 opens the tiles and cameras chart through Blit. s04-l03 hears THE CARTOGRAPHER name s04-world-blitting its first bearing. s04-l03 names one input, one change, and one output. s04-l03 gives s04-tile-rects a second mark for comparison. s04-l03 keeps the smallest successful example beside its route.</p>
<p>s04-l03 reads from left to right, then narrates state changes. s04-l03 keeps its tiles and cameras clue concrete and observable. s04-l03 runs twice; the second pass challenges the first. s04-l03 records which owner moved when s04-world-blitting shifted. s04-l03 carries earlier <code>tile_map</code> evidence into this chart.</p>
<p>s04-l03 asks one decision to stand alone in the margin. s04-l03 keeps s04-tile-rects visible instead of hiding it behind polish. s04-l03 tests a friendly case and a sharp edge case. s04-l03 compares both traces so s04-world-blitting has a witness. s04-l03 names the failure before choosing a repair.</p>
<p>s04-l03 treats each handoff as a contract between maker and reader. s04-l03 supplies s04-world-blitting; the reader checks s04-tile-rects. s04-l03 places its check where another wayfinder can repeat it. s04-l03 earns THE CARTOGRAPHER's trust through evidence, not luck. s04-l03 leaves one deliberate question for the next chart.</p>
<p>s04-l03 closes by stating what the program must preserve. s04-l03 names one input that could falsify s04-world-blitting. s04-l03 names one output that confirms s04-tile-rects still belongs. s04-l03 runs the smallest route, inspects its trace, and annotates it. s04-l03 turns the tiles and cameras chart into a RuneBound waypoint.</p>
<p>s04-l03 ends with a handoff to the next chart. s04-l03 carries s04-tile-rects forward after s04-world-blitting earns trust. s04-l03 lets THE CARTOGRAPHER record the result in plain language. s04-l03 turns a clean rerun from a guess into a fact. s04-l03 lets the next wayfinder begin without hidden context.</p>
<pre><code>print("s04-l03 // The Blit Order of the World")</code></pre>
<div class="field-notes"><div class="fn-head">FIELD NOTES // S04-L03</div><p>s04-l03 <strong>Evidence.</strong> Record s04-world-blitting; compare it with s04-tile-rects before advancing.</p><p>s04-l03 <strong>Repair.</strong> Change one cause, rerun the route, and preserve the explanation.</p></div>
'''

[[lessons.readings]]
label = "Python library // csv // The Blit Order of the World"
url = "https://docs.python.org/3/library/csv.html"

[[lessons.exercises]]
id = "s04-l03-e1"
type = "mc"
points = 14
prompt = '''
<p>What belongs to the tile renderer's inner loop? Select the reading that keeps s05 can put a living sprite above a ground layer without hiding it possible.</p>
'''
choices = ["advancing the player's animation timer","deciding which dialogue node the Elder should speak","saving the entire game as JSON","choosing a tile rule and placing its pixels at the cell's screen rectangle"]
answer = 3
whyWrong = '''
The tempting routes confuse painting only the last row, reusing one rect incorrectly, or drawing entities before the ground with the job this trial actually asks you to protect; each decoy moves ownership to the wrong part of the chart.
'''
hint = '''
Trace TileMap.render(surface, camera_offset) as a repeatable world-painting operation in the Ground Survey chart, then compare the the map loop calculates placement while the Surface owns the visible pixels with the evidence named in the prompt.
'''
explain = '''
The selected mark preserves the map loop calculates placement while the surface owns the visible pixels and leaves tilemap.render(surface, camera_offset) as a repeatable world-painting operation available for the next RuneBound handoff.
'''

[[lessons.exercises]]
id = "s04-l03-e2"
type = "write"
points = 30
prompt = '''
<p>Complete the ground survey route and print exactly <code>RUNEBOUND S04 L03 SEAL</code>. Preserve the named data before adding the final observation.</p>
'''
starter = '''
route_mark = "world-blit"
print("survey pending")
# Add the chart seal after checking the route.
'''
expect = '''
RUNEBOUND S04 L03 SEAL
'''
solution = '''
route_mark = "world-blit"
print("RUNEBOUND S04 L03 SEAL")
'''
hint = '''
For s04-l03-e2, leave the route data intact and add only its final s04 observation; compare the starter output with the target before submitting.
'''

