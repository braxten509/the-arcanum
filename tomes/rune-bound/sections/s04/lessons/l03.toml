id = "s04-l03-e3"
type = "type"
points = 10
reps = 2
prompt = '''
<p>Retype this ground survey evidence exactly. Keep tilemap.render(surface, camera_offset) as a repeatable world-painting operation visible while you write. (Ctrl+Enter submits.)</p>
'''
code = '''
