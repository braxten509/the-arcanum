[[lessons]]
id = "s04-l04"
title = "Hold the World Still, Move the View"
teaches = ["s04-camera-offset-transform", "s04-tile-at-api"]
body = '''
<p>A camera is a viewport position in world pixels. Store it as <code>camera = [0, 0]</code> in <code>main.py</code>: a mutable two-value list whose first value is <code>camera_x</code> and second is <code>camera_y</code>. A tile still owns its stable world position. To paint it on screen, subtract the camera: <code>screen_x = world_x - camera[0]</code> and <code>screen_y = world_y - camera[1]</code>. Never add the camera to the tile’s stored coordinates, or repeated frames will drag the map permanently away.</p>
<pre><code>world_x = col_index * TILE_SIZE
world_y = row_index * TILE_SIZE
screen_x = world_x - camera[0]
screen_y = world_y - camera[1]
rect = pygame.Rect(screen_x, screen_y, TILE_SIZE, TILE_SIZE)</code></pre>
<p>Put that calculation inside <code>TileMap.render(surface, camera)</code>, replacing the unshifted rect from l03. It must happen for every map cell. The screen can paint off-screen rectangles harmlessly; later optimization is out of scope, so favor the clear version that paints the whole 25×19 grid.</p>
<p>TileMap also needs a query for future placement and collision work: <code>tile_at(world_x, world_y)</code>. Its inputs are world pixel coordinates, not screen pixels and not precomputed indexes. Divide each by <code>TILE_SIZE</code> with <code>//</code>, then return the string at <code>self.grid[row][col]</code>. Check bounds first and return <code>None</code> outside the map. This method does not subtract camera; an NPC’s world position must still refer to the same tile while the viewport scrolls.</p>
<pre><code>def tile_at(self, world_x, world_y):
    col = world_x // TILE_SIZE
    row = world_y // TILE_SIZE
    if row &lt; 0 or col &lt; 0 or row &gt;= len(self.grid) or col &gt;= len(self.grid[row]):
        return None
    return self.grid[row][col]

def is_solid(self, world_x, world_y):
    tile_id = self.tile_at(world_x, world_y)
    return tile_id is not None and self.tile_types[tile_id]["solid"]</code></pre>
<p>Do not use <code>is_solid</code> to block the camera today. s06 will apply it to every tile touched by the Player’s bounding box. For now it proves that solid behavior is read from data and that one coordinate conversion serves the whole map.</p>
<div class="field-notes"><div class="fn-head">FIELD NOTES // TWO MAPS</div><p>World coordinates answer “where is this thing?” Screen coordinates answer “where do I paint it this frame?” The camera is only the bridge.</p></div>
'''

[[lessons.readings]]
label = "PyGame Docs // Rect"
url = "https://www.pygame.org/docs/ref/rect.html"

[[lessons.exercises]]
id = "s04-l04-e1"
type = "mc"
points = 20
prompt = '''<p>A tile’s world x is 160 and the camera’s x is 64. Which x should its render Rect receive?</p>'''
choices = ['<code>224</code>', '<code>160</code>', '<code>96</code>', '<code>64</code>']
answer = 2
hint = '''The viewport moves the picture by subtracting its current world offset from the stable tile position.'''
whyWrong = '''Adding moves the visual in the wrong direction; keeping 160 ignores scrolling, and 64 is the camera position rather than the tile’s screen destination.'''
explain = '''160 minus 64 is 96, while the tile’s stored world x remains 160.'''

[[lessons.exercises]]
id = "s04-l04-e2"
type = "fill"
points = 22
prompt = '''<p>Restore the integer operation that turns a world x coordinate into a tile column for a 32-pixel map.</p>'''
code = '''
col = world_x ____ TILE_SIZE
'''
answer = "//"
hint = '''A location from pixel 0 through 31 belongs to column 0, so use whole-number division.'''
whyWrong = '''Ordinary division yields a float, and multiplication goes from an index to pixels rather than from pixels back to an index.'''

[[lessons.exercises]]
id = "s04-l04-e3"
type = "type"
points = 12
reps = 2
prompt = '''<p>Retype the camera transform exactly; the world values remain untouched.</p>'''
code = '''
screen_x = world_x - camera[0]
screen_y = world_y - camera[1]
'''

[[lessons.exercises]]
id = "s04-l04-e4"
type = "write"
points = 35
prompt = '''<p>Write <code>tile_at(grid, world_x, world_y)</code> for 32-pixel tiles. It must return the map id for an in-bounds world point and <code>None</code> outside. With the supplied grid, print exactly <code>wall</code> and <code>None</code>.</p>'''
starter = '''
TILE_SIZE = 32
grid = [["grass", "wall"], ["path", "grass"]]

# Define tile_at, then inspect world point (40, 8) and outside point (96, 0).
'''
expect = '''
wall
None
'''
solution = '''
TILE_SIZE = 32
grid = [["grass", "wall"], ["path", "grass"]]

def tile_at(grid, world_x, world_y):
    col = world_x // TILE_SIZE
    row = world_y // TILE_SIZE
    if row < 0 or col < 0 or row >= len(grid) or col >= len(grid[row]):
        return None
    return grid[row][col]

print(tile_at(grid, 40, 8))
print(tile_at(grid, 96, 0))
'''
hint = '''Calculate column and row with <code>// TILE_SIZE</code>, reject indexes past the grid before returning <code>grid[row][col]</code>.'''

[[lessons.exercises]]
id = "s04-l04-e5"
type = "text"
points = 18
prompt = '''<p>Which TileMap query accepts world pixel coordinates and returns the id at that map location or <code>None</code> beyond the edge?</p>'''
answer = "tile_at"
accept = ["TileMap.tile_at", "tile_map.tile_at"]
hint = '''Its name describes looking up one tile, and it performs the row/column conversion inside the map object.'''
whyWrong = '''The renderer paints many cells and <code>load</code> changes the grid. The required query returns one map cell from a world position.'''
