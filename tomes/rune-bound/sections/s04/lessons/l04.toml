[[lessons.exercises]]
id = "s04-l04-e4"
type = "mc"
points = 14
prompt = '''
<p>What does the camera transform contribute to a tile's screen position? Select the reading that keeps the player can later own a camera that follows without moving the world data possible.</p>
'''
choices = ["it changes the tile's solid flag in the catalog","it turns a CSV row into a JSON object","it advances a sprite frame every time the camera moves","it subtracts the current viewport offset from the stable world position"]
answer = 3
whyWrong = '''
The tempting routes confuse subtracting the camera twice or mixing tile indices with pixel offsets with the job this trial actually asks you to protect; each decoy moves ownership to the wrong part of the chart.
'''
hint = '''
Trace screen_x = world_x - camera_x and its matching vertical calculation in the Ground Survey chart, then compare the world positions stay stable while screen positions change with the camera with the evidence named in the prompt.
'''
explain = '''
The selected mark preserves world positions stay stable while screen positions change with the camera and leaves screen_x = world_x - camera_x and its matching vertical calculation available for the next RuneBound handoff.
'''

[[lessons.exercises]]
id = "s04-l04-e5"
type = "fill"
points = 18
prompt = '''
<p>s04-l04-e5: restore the missing operation in the supplied code. Use its operands and the chart evidence to complete the route without renaming the owner.</p>
'''
code = '''
screen_x = world_x - ____
'''
answer = "camera_x"
hint = '''
Look at what must happen to screen_x = world_x - camera_offset[0]; choose the operation that performs that job rather than the one that merely inspects the result.
'''
