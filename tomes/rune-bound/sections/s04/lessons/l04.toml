[[lessons]]
id = "s04-l04"
title = "The Camera Offset"
teaches = ["s04-camera-transform","s04-world-screen-boundary"]
body = '''
<p>s04-l04 opens the tiles and cameras chart through Camera. s04-l04 hears THE CARTOGRAPHER name s04-camera-transform its first bearing. s04-l04 names one input, one change, and one output. s04-l04 gives s04-world-screen-boundary a second mark for comparison. s04-l04 keeps the smallest successful example beside its route.</p>
<p>s04-l04 reads from left to right, then narrates state changes. s04-l04 keeps its tiles and cameras clue concrete and observable. s04-l04 runs twice; the second pass challenges the first. s04-l04 records which owner moved when s04-camera-transform shifted. s04-l04 carries earlier <code>tile_map</code> evidence into this chart.</p>
<p>s04-l04 asks one decision to stand alone in the margin. s04-l04 keeps s04-world-screen-boundary visible instead of hiding it behind polish. s04-l04 tests a friendly case and a sharp edge case. s04-l04 compares both traces so s04-camera-transform has a witness. s04-l04 names the failure before choosing a repair.</p>
<p>s04-l04 treats each handoff as a contract between maker and reader. s04-l04 supplies s04-camera-transform; the reader checks s04-world-screen-boundary. s04-l04 places its check where another wayfinder can repeat it. s04-l04 earns THE CARTOGRAPHER's trust through evidence, not luck. s04-l04 leaves one deliberate question for the next chart.</p>
<p>s04-l04 closes by stating what the program must preserve. s04-l04 names one input that could falsify s04-camera-transform. s04-l04 names one output that confirms s04-world-screen-boundary still belongs. s04-l04 runs the smallest route, inspects its trace, and annotates it. s04-l04 turns the tiles and cameras chart into a RuneBound waypoint.</p>
<p>s04-l04 ends with a handoff to the next chart. s04-l04 carries s04-world-screen-boundary forward after s04-camera-transform earns trust. s04-l04 lets THE CARTOGRAPHER record the result in plain language. s04-l04 turns a clean rerun from a guess into a fact. s04-l04 lets the next wayfinder begin without hidden context.</p>
<pre><code>print("s04-l04 // The Camera Offset")</code></pre>
<div class="field-notes"><div class="fn-head">FIELD NOTES // S04-L04</div><p>s04-l04 <strong>Evidence.</strong> Record s04-camera-transform; compare it with s04-world-screen-boundary before advancing.</p><p>s04-l04 <strong>Repair.</strong> Change one cause, rerun the route, and preserve the explanation.</p></div>
'''

[[lessons.readings]]
label = "Python library // csv // The Camera Offset"
url = "https://docs.python.org/3/library/csv.html"

[[lessons.readings]]
label = "PyGame docs // Surface blit // The Camera Offset"
url = "https://www.pygame.org/docs/ref/surface.html"

[[lessons.exercises]]
id = "s04-l04-e1"
type = "type"
points = 10
reps = 2
prompt = '''
<p>Retype this ground survey evidence exactly. Keep screen_x = world_x - camera_x and its matching vertical calculation visible while you write. (Ctrl+Enter submits.)</p>
'''
code = '''
world_x = 96
camera_x = 32
screen_x = world_x - camera_x
print(screen_x)
'''

