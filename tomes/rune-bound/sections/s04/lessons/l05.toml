[[lessons]]
id = "s04-l05"
title = "The First Traversable Map"
teaches = ["s04-tilemap-class","s04-scrolling-proof"]
body = '''
<p>s04-l05 opens the tiles and cameras chart through First. s04-l05 hears THE CARTOGRAPHER name s04-tilemap-class its first bearing. s04-l05 names one input, one change, and one output. s04-l05 gives s04-scrolling-proof a second mark for comparison. s04-l05 keeps the smallest successful example beside its route.</p>
<p>s04-l05 reads from left to right, then narrates state changes. s04-l05 keeps its tiles and cameras clue concrete and observable. s04-l05 runs twice; the second pass challenges the first. s04-l05 records which owner moved when s04-tilemap-class shifted. s04-l05 carries earlier <code>tile_map</code> evidence into this chart.</p>
<p>s04-l05 asks one decision to stand alone in the margin. s04-l05 keeps s04-scrolling-proof visible instead of hiding it behind polish. s04-l05 tests a friendly case and a sharp edge case. s04-l05 compares both traces so s04-tilemap-class has a witness. s04-l05 names the failure before choosing a repair.</p>
<p>s04-l05 treats each handoff as a contract between maker and reader. s04-l05 supplies s04-tilemap-class; the reader checks s04-scrolling-proof. s04-l05 places its check where another wayfinder can repeat it. s04-l05 earns THE CARTOGRAPHER's trust through evidence, not luck. s04-l05 leaves one deliberate question for the next chart.</p>
<p>s04-l05 closes by stating what the program must preserve. s04-l05 names one input that could falsify s04-tilemap-class. s04-l05 names one output that confirms s04-scrolling-proof still belongs. s04-l05 runs the smallest route, inspects its trace, and annotates it. s04-l05 turns the tiles and cameras chart into a RuneBound waypoint.</p>
<p>s04-l05 ends with a handoff to the next chart. s04-l05 carries s04-scrolling-proof forward after s04-tilemap-class earns trust. s04-l05 lets THE CARTOGRAPHER record the result in plain language. s04-l05 turns a clean rerun from a guess into a fact. s04-l05 lets the next wayfinder begin without hidden context.</p>
<pre><code>print("s04-l05 // The First Traversable Map")</code></pre>
<div class="field-notes"><div class="fn-head">FIELD NOTES // S04-L05</div><p>s04-l05 <strong>Evidence.</strong> Record s04-tilemap-class; compare it with s04-scrolling-proof before advancing.</p><p>s04-l05 <strong>Repair.</strong> Change one cause, rerun the route, and preserve the explanation.</p></div>
'''

[[lessons.readings]]
label = "Python library // csv // The First Traversable Map"
url = "https://docs.python.org/3/library/csv.html"

[[lessons.exercises]]
id = "s04-l05-e1"
type = "mc"
points = 14
prompt = '''
<p>What is the cleanest boundary for the first TileMap integration? Select the reading that keeps the next chart can add animated life to a ground contract that already works possible.</p>
'''
choices = ["the map owns every future combat decision","the map loads and renders ground while the main loop schedules frames and input","the camera replaces the map's stored world coordinates","main.py hard-codes one color for every tile"]
answer = 1
whyWrong = '''
The tempting routes confuse letting the map class reach into player input or duplicating the same transform in main.py with the job this trial actually asks you to protect; each decoy moves ownership to the wrong part of the chart.
'''
hint = '''
Trace one map object with a clear load path and a render method the main loop can call in the Ground Survey chart, then compare the TileMap owns ground knowledge while main.py owns the frame schedule with the evidence named in the prompt.
'''
explain = '''
The selected mark preserves tilemap owns ground knowledge while main.py owns the frame schedule and leaves one map object with a clear load path and a render method the main loop can call available for the next RuneBound handoff.
'''

[[lessons.exercises]]
id = "s04-l05-e2"
type = "text"
points = 16
prompt = '''
<p>s04-l05-e2: name the Python term for the specific unit requested by this chart. Supply the language term, not the surrounding story label.</p>
'''
answer = "TileMap"
hint = '''
Recall the named boundary in The First Traversable Map; the answer is the language term for that single job, not the larger game feature.
'''

[[lessons.exercises]]
id = "s04-l05-e3"
type = "fill"
points = 18
prompt = '''
<p>s04-l05-e3: restore the missing operation in the supplied code. Use its operands and the chart evidence to complete the route without renaming the owner.</p>
'''
code = '''
tile_map.____(screen, camera_offset)
'''
answer = "render"
hint = '''
Look at what must happen to tile_map.render(screen, camera_offset); choose the operation that performs that job rather than the one that merely inspects the result.
'''

[[lessons.exercises]]
id = "s04-l05-e4"
type = "type"
points = 10
reps = 2
prompt = '''
<p>Retype this ground survey evidence exactly. Keep one map object with a clear load path and a render method the main loop can call visible while you write. (Ctrl+Enter submits.)</p>
'''
code = '''
class TileMap:
    def render(self, screen, camera_offset):
        print("rendering", camera_offset)
TileMap().render(None, (0, 0))
'''
