[[lessons]]
id = "s04-l05"
title = "Seal a Scrolling Overworld"
teaches = ["s04-camera-scroll-input", "s04-scrolling-map-integration"]
body = '''
<p>Make the first RuneBound world run. Keep s03’s initialization, 800×600 display, event pump, one <code>pygame.key.get_pressed()</code> read per frame, clock, and shutdown. Replace its visual constants, <code>draw(screen)</code> probe, amber waystone, and standalone <code>TILE_SIZE</code> with the data-driven map route below. The source of tile size is now <code>tilemap.TILE_SIZE</code>; colors come only from <code>data/tiles.json</code>.</p>
<pre><code>import pygame
from tilemap import TileMap

FPS = 60
CAMERA_SPEED = 240

pygame.init()
screen = pygame.display.set_mode((800, 600))
pygame.display.set_caption("RuneBound")
clock = pygame.time.Clock()
tile_map = TileMap("data/tiles.json", "data/maps/overworld.csv")
camera = [0.0, 0.0]
running = True</code></pre>
<p>Inside each frame, pump events first, then read keys once. Arrow keys alter the camera, not a Tile and not <code>tile_map.grid</code>. Use <code>dt</code> from the previous frame for a frame-rate-independent amount: <code>CAMERA_SPEED * dt</code>. With the initial <code>dt = 0.0</code> before the loop, the first frame simply has no movement. Clamp the camera to zero at the upper-left; the full right/bottom clamp can wait until player-follow camera work in s06.</p>
<pre><code>keys = pygame.key.get_pressed()
if keys[pygame.K_LEFT]:
    camera[0] = max(0, camera[0] - CAMERA_SPEED * dt)
if keys[pygame.K_RIGHT]:
    camera[0] += CAMERA_SPEED * dt
if keys[pygame.K_UP]:
    camera[1] = max(0, camera[1] - CAMERA_SPEED * dt)
if keys[pygame.K_DOWN]:
    camera[1] += CAMERA_SPEED * dt

screen.fill((0, 0, 0))
tile_map.render(screen, camera)
pygame.display.flip()
dt = clock.tick(FPS) / 1000.0</code></pre>
<p>Run <code>python3 main.py</code> from the folder containing <code>main.py</code>. You should see the colored 25×19 CSV world and make it slide under arrow keys; close it with X, then launch it again. If the window stays black, verify that <code>tile_map.render(screen, camera)</code> occurs before the flip and that every CSV id exists in the JSON catalog. If it does not scroll, verify that key polling and camera update occur inside the running loop.</p>
<p>For the freestyle, record the command, what you saw at camera <code>[0.0, 0.0]</code>, what changed after holding Right, and one repair. Do not print a seal inside canonical <code>main.py</code>; the visual run is the proof.</p>
<div class="callout"><strong>THE CARTOGRAPHER'S SEAL:</strong> the map stays true in world space while the viewport moves across it.</div>
'''

[[lessons.readings]]
label = "PyGame Docs // key"
url = "https://www.pygame.org/docs/ref/key.html"

[[lessons.readings]]
label = "PEP 8 // Style Guide for Python Code"
url = "https://peps.python.org/pep-0008/"

[[lessons.exercises]]
id = "s04-l05-e1"
type = "mc"
points = 20
prompt = '''<p>While Right is held, which state should change to scroll the map without changing its CSV world coordinates?</p>'''
choices = ['<code>camera[0]</code>', '<code>tile_map.grid[0][0]</code>', '<code>definition["color"]</code>', '<code>Tile.x</code> for every tile']
answer = 0
hint = '''The camera is the viewport offset; world data and placed tile positions remain stable.'''
whyWrong = '''Changing a cell edits the map, changing a catalog color edits every type, and moving every Tile mutates the world. Scrolling only changes the viewport’s x offset.'''
explain = '''The renderer subtracts <code>camera[0]</code> from each stable world x while it builds screen rectangles.'''

[[lessons.exercises]]
id = "s04-l05-e2"
type = "fill"
points = 22
prompt = '''<p>Restore the per-frame quantity that makes camera movement depend on elapsed seconds rather than on raw loop count.</p>'''
code = '''
camera[0] += CAMERA_SPEED * ____
'''
answer = "dt"
hint = '''s03’s Clock converts its measured milliseconds to seconds and stores the result in this variable.'''
whyWrong = '''FPS is a target cap, not elapsed time, and a constant one-pixel step makes fast computers pan farther each second.'''

[[lessons.exercises]]
id = "s04-l05-e3"
type = "write"
points = 34
prompt = '''<p>Model one right-arrow camera update with <code>CAMERA_SPEED = 240</code> and <code>dt = 0.25</code>. Keep the supplied camera list, add the movement to its horizontal value, and print exactly <code>CAMERA 60.0 0.0</code>.</p>'''
starter = '''
CAMERA_SPEED = 240
dt = 0.25
camera = [0.0, 0.0]

# Apply one right-scroll update and print both camera coordinates.
'''
expect = '''
CAMERA 60.0 0.0
'''
solution = '''
CAMERA_SPEED = 240
dt = 0.25
camera = [0.0, 0.0]

camera[0] += CAMERA_SPEED * dt
print("CAMERA", camera[0], camera[1])
'''
hint = '''Right movement changes index 0 by speed multiplied by elapsed seconds; leave the vertical value alone.'''

[[lessons.exercises]]
id = "s04-l05-e4"
type = "text"
points = 18
prompt = '''<p>What command launches the integrated RuneBound project when the terminal is in the folder containing its entry file?</p>'''
answer = "python3 main.py"
hint = '''Use the same Python launcher and canonical entry file from the window chart.'''
whyWrong = '''The project is run by Python, not by a JSON or CSV tool. Running from another folder without a path risks a missing-file error for the data files.'''

