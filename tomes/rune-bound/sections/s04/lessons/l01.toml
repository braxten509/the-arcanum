[[lessons]]
id = "s04-l01"
title = "The CSV Ground Survey"
teaches = ["s04-csv-map","s04-grid-render-order"]
body = '''
<p>s04-l01 opens the tiles and cameras chart through CSV. s04-l01 hears THE CARTOGRAPHER name s04-csv-map its first bearing. s04-l01 names one input, one change, and one output. s04-l01 gives s04-grid-render-order a second mark for comparison. s04-l01 keeps the smallest successful example beside its route.</p>
<p>s04-l01 reads from left to right, then narrates state changes. s04-l01 keeps its tiles and cameras clue concrete and observable. s04-l01 runs twice; the second pass challenges the first. s04-l01 records which owner moved when s04-csv-map shifted. s04-l01 carries earlier <code>tile_map</code> evidence into this chart.</p>
<p>s04-l01 asks one decision to stand alone in the margin. s04-l01 keeps s04-grid-render-order visible instead of hiding it behind polish. s04-l01 tests a friendly case and a sharp edge case. s04-l01 compares both traces so s04-csv-map has a witness. s04-l01 names the failure before choosing a repair.</p>
<p>s04-l01 treats each handoff as a contract between maker and reader. s04-l01 supplies s04-csv-map; the reader checks s04-grid-render-order. s04-l01 places its check where another wayfinder can repeat it. s04-l01 earns THE CARTOGRAPHER's trust through evidence, not luck. s04-l01 leaves one deliberate question for the next chart.</p>
<p>s04-l01 closes by stating what the program must preserve. s04-l01 names one input that could falsify s04-csv-map. s04-l01 names one output that confirms s04-grid-render-order still belongs. s04-l01 runs the smallest route, inspects its trace, and annotates it. s04-l01 turns the tiles and cameras chart into a RuneBound waypoint.</p>
<p>s04-l01 ends with a handoff to the next chart. s04-l01 carries s04-grid-render-order forward after s04-csv-map earns trust. s04-l01 lets THE CARTOGRAPHER record the result in plain language. s04-l01 turns a clean rerun from a guess into a fact. s04-l01 lets the next wayfinder begin without hidden context.</p>
<pre><code>print("s04-l01 // The CSV Ground Survey")</code></pre>
<div class="field-notes"><div class="fn-head">FIELD NOTES // S04-L01</div><p>s04-l01 <strong>Evidence.</strong> Record s04-csv-map; compare it with s04-grid-render-order before advancing.</p><p>s04-l01 <strong>Repair.</strong> Change one cause, rerun the route, and preserve the explanation.</p></div>
'''

[[lessons.readings]]
label = "Python library // csv // The CSV Ground Survey"
url = "https://docs.python.org/3/library/csv.html"

[[lessons.exercises]]
id = "s04-l01-e1"
type = "text"
points = 16
prompt = '''
<p>s04-l01-e1: name the Python term for the specific unit requested by this chart. Supply the language term, not the surrounding story label.</p>
'''
answer = "csv"
hint = '''
Recall the named boundary in The CSV Ground Survey; the answer is the language term for that single job, not the larger game feature.
'''

[[lessons.exercises]]
id = "s04-l01-e2"
type = "fill"
points = 18
prompt = '''
<p>s04-l01-e2: restore the missing operation in the supplied code. Use its operands and the chart evidence to complete the route without renaming the owner.</p>
'''
code = '''
cells = line.____(",")
'''
answer = "split"
hint = '''
Look at what must happen to row = [int(mark) for mark in line.split(",")]; choose the operation that performs that job rather than the one that merely inspects the result.
'''

[[lessons.exercises]]
id = "s04-l01-e3"
type = "mc"
points = 14
prompt = '''
<p>What should the map loader decide before the renderer begins? Select the reading that keeps the tile catalog can interpret these ids without changing the loader possible.</p>
'''
choices = ["the final color of every sprite frame","the player's attack damage formula","the order of dialogue choices in an NPC tree","the row and column data structure that holds each tile id"]
answer = 3
whyWrong = '''
The tempting routes confuse silently accepting ragged rows and later indexing beyond the ground with the job this trial actually asks you to protect; each decoy moves ownership to the wrong part of the chart.
'''
hint = '''
Trace a rectangular list whose values can be handed to a renderer in the Ground Survey chart, then compare the parsing a comma is different from deciding what tile id 1 means with the evidence named in the prompt.
'''
explain = '''
The selected mark preserves parsing a comma is different from deciding what tile id 1 means and leaves a rectangular list whose values can be handed to a renderer available for the next RuneBound handoff.
'''

