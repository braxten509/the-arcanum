[[lessons]]
id = "s04-l01"
title = "Give the Ground a Ledger"
teaches = ["s04-tile-catalog-data", "s04-csv-map-loading"]
body = '''
<p>Wayfinder, a tile is not its paint. A tile is a named rule which happens to be painted one way today. Create a <code>data</code> folder and a <code>data/maps</code> folder beside <code>main.py</code>. In <code>data/tiles.json</code>, make the catalog below. JSON object keys are strings, so the CSV will use the same lower-case strings: <code>grass</code>, <code>path</code>, and <code>wall</code>.</p>
<pre><code>{
  "grass": {"name": "Grass", "color": [34, 102, 56], "solid": false},
  "path": {"name": "Path", "color": [156, 122, 72], "solid": false},
  "wall": {"name": "Stone wall", "color": [82, 86, 92], "solid": true}
}</code></pre>
<p><code>color</code> is a three-number RGB list that PyGame can use directly; <code>solid</code> is data reserved for s06 collision, not an instruction to stop the camera now. This continues s02’s strict lookup: <code>tile_types[tile_id]</code> first selects one definition, then <code>["color"]</code> or <code>["solid"]</code> selects a field. A missing id should raise <code>KeyError</code>; a silent fallback would conceal a misspelled map cell.</p>
<p>Now create <code>data/maps/overworld.csv</code>. Each line is one row and commas divide cells. Begin with a small readable map, then extend it to 25 rows of 19 ids before the freestyle. The first three rows could be:</p>
<pre><code>wall,wall,wall,wall,wall
wall,grass,path,grass,wall
wall,grass,grass,grass,wall</code></pre>
<p>CSV parsing turns each line into a list. Do not convert ids to integers: their useful identity is their catalog key. A file path is interpreted from the folder where you run <code>python3 main.py</code>, so run from the RuneBound project folder. If Python reports <code>FileNotFoundError</code>, inspect the spelling and working folder before changing parser code.</p>
<p>We will briefly render an inline list to isolate drawing, then retire it in l02. The delivered artifact loads this CSV; it must contain no inline stand-in map. That separation lets a later quest choose another map filename without rewriting renderer logic.</p>
<div class="callout"><strong>THE CARTOGRAPHER'S RULE:</strong> map placement names a tile; the catalog decides what that name means.</div>
'''

[[lessons.readings]]
label = "Python Docs // json"
url = "https://docs.python.org/3/library/json.html"

[[lessons.readings]]
label = "Python Docs // csv"
url = "https://docs.python.org/3/library/csv.html"

[[lessons.exercises]]
id = "s04-l01-e1"
type = "mc"
points = 20
prompt = '''<p>A CSV cell contains <code>wall</code>. Which expression obtains its reusable collision rule from the catalog?</p>'''
choices = ['<code>tile_id["solid"]</code>', '<code>tile_types["solid"][tile_id]</code>', '<code>tile_types[tile_id]["solid"]</code>', '<code>grid["wall"]</code>']
answer = 2
hint = '''Select the named tile definition first, then select its rule inside that definition.'''
whyWrong = '''The CSV cell is a string, not a rule-bearing object. The outer dictionary is keyed by tile id; only the selected definition has a <code>solid</code> field.'''
explain = '''The first brackets use the CSV id, and the second brackets select the reusable solid flag.'''

[[lessons.exercises]]
id = "s04-l01-e2"
type = "type"
points = 12
reps = 2
prompt = '''<p>Retype the file route that makes one CSV row into a list of tile ids.</p>'''
code = '''
with open("data/maps/overworld.csv", newline="", encoding="utf-8") as handle:
    rows = [row for row in csv.reader(handle) if row]
'''

[[lessons.exercises]]
id = "s04-l01-e3"
type = "fill"
points = 22
prompt = '''<p>Restore the JSON operation that reads the already-open tile catalog into a Python dictionary.</p>'''
code = '''
with open("data/tiles.json", encoding="utf-8") as handle:
    tile_types = json.____(handle)
'''
answer = "load"
hint = '''The file handle is already open; use the JSON function that turns its text into Python data.'''
whyWrong = '''<code>loads</code> accepts JSON text already held in a string, while this route reads from the open file object.'''

[[lessons.exercises]]
id = "s04-l01-e4"
type = "write"
points = 34
prompt = '''<p>Use the supplied JSON text as a catalog, parse it, select the <code>wall</code> entry through a tile-id variable, and print exactly <code>Stone wall True</code>.</p>'''
starter = '''
import json

catalog_text = '{"grass": {"name": "Grass", "solid": false}, "wall": {"name": "Stone wall", "solid": true}}'

# Parse the catalog, choose wall, and print its name and solid rule.
'''
expect = '''
Stone wall True
'''
solution = '''
import json

catalog_text = '{"grass": {"name": "Grass", "solid": false}, "wall": {"name": "Stone wall", "solid": true}}'
tile_types = json.loads(catalog_text)
tile_id = "wall"
definition = tile_types[tile_id]
print(definition["name"], definition["solid"])
'''
hint = '''Use <code>json.loads(catalog_text)</code>, then index the resulting dictionary with <code>tile_id</code>.'''

[[lessons.exercises]]
id = "s04-l01-e5"
type = "text"
points = 18
prompt = '''<p>What exception should a strict square-bracket lookup expose when a map uses an id absent from its tile catalog?</p>'''
answer = "KeyError"
hint = '''It is the same dictionary-specific exception from the earlier Rule Drawer.'''
whyWrong = '''A bad catalog key is neither a missing file nor a bad list position. Strict dictionary lookup reports its own missing-key exception.'''
