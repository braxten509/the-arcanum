[freestyle]
title = "BUILD: The Cartographer's First Ink"
brief = '''
<p>Wayfinder, make a small terminal proof for RuneBound before any window is raised. Create <code>level.txt</code> beside your Python script, containing exactly two comma-separated rows such as <code>G,G,W</code> and <code>W,G,G</code>. Your script must load that file, parse it, and show the map's cells as evidence.</p><ul><li>Define <code>parse_level(lines)</code> that returns a list of row lists after removing each line’s newline and splitting at commas.</li><li>Use <code>with open("level.txt", encoding="utf-8")</code> and <code>readlines()</code> to obtain the raw lines; do not hardcode the completed grid.</li><li>Walk the parsed grid with <code>for row in grid:</code> followed by <code>for cell in row:</code>, printing every cell in row-major order.</li><li>Use <code>grid[row][col]</code> once to print a labeled lookup for the second row, first column, and finish with <code>RUNEBOUND S01 SEAL</code>.</li><li>Add a short code comment naming the likely cause and repair for a missing <code>level.txt</code> file.</li></ul>
'''
requires = ["python-game-data-values", "typed-level-facts", "nested-grid-iteration", "grid-row-column-lookup", "level-grid-function", "text-level-file-reading", "comma-level-parser", "grid-inspection-output"]
reward = 180
xray = '''
The Cartographer looks for a real file boundary, not a pasted final grid. He checks the row-major loop and row-then-column lookup separately, then follows the printed evidence through the final seal. He rewards a small, readable Python script whose names describe game data.
'''

[freestyle.badge]
id = "badge-s01"
name = "FIRST INK SEALED"
desc = "Charted and inspected RuneBound's first file-backed level grid."

[[freestyle.rubric]]
criterion = "File-Backed Level"
weight = 30
desc = '''A script opens level.txt with a context manager, reads its lines, and passes them to parse_level(lines) instead of hardcoding the completed grid.'''

[[freestyle.rubric]]
criterion = "Grid Contract"
weight = 30
desc = '''parse_level returns a list of row lists; the script visits every cell using for row in grid followed by for cell in row and demonstrates grid[row][col] for second-row, first-column lookup.'''

[[freestyle.rubric]]
criterion = "Visible Evidence"
weight = 20
desc = '''A repeatable run prints cells in row-major order, a labeled lookup result, and the exact final line RUNEBOUND S01 SEAL.'''

[[freestyle.rubric]]
criterion = "Python Field Craft"
weight = 20
desc = '''Uses PEP 8-friendly snake_case names, four-space indentation, clear small functions, and a concise comment explaining the missing-file check and repair.'''
