[freestyle]
title = "THE WORKING 1 // The Cartographer's First Ink"
brief = '''
<p>Bind the cartographer's first ink into the growing RuneBound route. The commission must leave a runnable artifact whose behavior can be inspected from the named evidence.</p><ul><li>preserve the chart's data boundary and use the established names</li><li>prove the requested behavior with a repeatable run that ends at <code>RUNEBOUND S01 SEAL</code></li><li>write a short repair note explaining the nearest failure and the change that corrected it</li></ul>
'''
requires = ["s01-value-tracing","s01-value-contract","s01-grid-rows","s01-grid-indexing","s01-file-reading","s01-level-parsing"]
reward = 188
xray = '''
The Cartographer checks whether the first ink commission keeps the player name, a starting gold count, and a passable flag under the right owner, shows s02's objects can receive a clean level grid instead of raw file debris, and leaves evidence beyond a decorative printout.
'''

[freestyle.badge]
id = "badge-s01"
name = "FIRST INK SEALED"
desc = "Sealed the the cartographer's first ink chart with evidence another wayfinder can inspect."

[[freestyle.rubric]]
criterion = "First Ink runs"
weight = 25
desc = '''
The the cartographer's first ink artifact parses and runs with the chart's named behavior visible.
'''

[[freestyle.rubric]]
criterion = "First Ink keeps its boundary"
weight = 35
desc = '''
The commission keeps the player name, a starting gold count, and a passable flag and s02's objects can receive a clean level grid instead of raw file debris in the owners established by the lessons.
'''

[[freestyle.rubric]]
criterion = "First Ink shows proof"
weight = 25
desc = '''
The wayfinder supplies a repeatable observation, the exact s01 seal, and a useful comparison case rather than a one-time claim.
'''

[[freestyle.rubric]]
criterion = "Cartographer's repair note"
weight = 15
desc = '''
The explanation names the failing boundary, the evidence that exposed it, and the smallest correction that restored the route.
'''

