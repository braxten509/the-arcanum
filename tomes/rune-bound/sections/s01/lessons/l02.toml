[[lessons]]
id = "s01-l02"
title = "Rows, Cells, and Bearings"
teaches = ["nested-grid-iteration", "grid-row-column-lookup", "level-grid-function"]
body = '''
<p>A paper map has rows; RuneBound’s first map does too. In Python, a <strong>list</strong> keeps values in order. A grid is a list whose values are themselves row lists. The outer list selects a row. The inner list selects a cell in that row. That order is not decoration: it is the row-major pattern s04 will use when rendering every tile.</p>
<pre><code>grid = [
    ["G", "G", "W"],
    ["G", "W", "G"],
]

for row in grid:
    for cell in row:
        print(cell)</code></pre>
<p>Read the two loops as a route. The outer <code>for row in grid</code> takes one complete horizontal row. Only then does the inner loop visit each cell inside it. The output is <code>G</code>, <code>G</code>, <code>W</code>, then the second row. In s04, retain this exact pattern—<code>for row in grid: for cell in row</code>—when the map is rendered. Swapping the roles makes the program describe a different traversal and often hides a transposed-map bug.</p>
<p>To ask for one known cell, index in the same geography: <code>grid[row][col]</code>. Indexing starts at zero, so <code>grid[1][0]</code> means the second row, then its first column. It is not <code>grid[col][row]</code>. That canonical row-then-column address will be reused in s06 when collision code asks what tile a player touches.</p>
<pre><code>def tile_at(grid, row, col):
    return grid[row][col]

print(tile_at([["G", "W"], ["W", "G"]], 1, 0))</code></pre>
<p>A function gives a repeated question a name. Its parameters are local placeholders; calling <code>tile_at</code> supplies the actual grid and coordinates. Keep the function small and return the cell rather than printing inside it: later systems can decide whether to render, collide with, or label that returned value. Print outside the function only for today’s inspection evidence.</p>
<div class="field-notes"><div class="fn-head">FIELD NOTES // COORDINATE DISCIPLINE</div><p>Before indexing, verify that the row and column exist. An index outside the list raises an error; later collision code will use bounds checks before it asks the grid for a tile.</p></div>
'''

[[lessons.readings]]
label = "Python Docs // Lists and Loops"
url = "https://docs.python.org/3/tutorial/introduction.html#lists"

[[lessons.exercises]]
id = "s01-l02-e1"
type = "mc"
points = 20
prompt = '''<p>In the nested iteration pattern, what does the outer loop provide to the inner loop?</p>'''
choices = ["The current row list", "One cell from every row at once", "The last column number", "A file handle"]
answer = 0
hint = '''The inner loop needs something iterable that contains the cells of one horizontal strip.''' 
whyWrong = '''The outer loop does not flatten the grid or open a file. It selects one row list, which the inner loop then walks cell by cell.''' 
explain = '''The outer loop owns row selection; the inner loop owns cell selection within that row.''' 

[[lessons.exercises]]
id = "s01-l02-e2"
type = "fill"
points = 22
prompt = '''<p>Restore the expression that asks for row 1, column 0 from the map.</p>'''
code = '''
grid = [["G", "W"], ["W", "G"]]
tile = grid[____][0]
print(tile)
'''
answer = "1"
hint = '''The first brackets choose the row, and Python counts the top row as 0.''' 
whyWrong = '''Putting 0 first would inspect the top row. The requested location is on the second row, so its row index is 1.''' 

