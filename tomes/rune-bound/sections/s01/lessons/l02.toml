[[lessons.exercises]]
id = "s01-l02-e4"
type = "write"
points = 34
prompt = '''<p>Define <code>tile_at(grid, row, col)</code> so it returns the requested cell using row-then-column indexing. Use the supplied 2×3 grid and print exactly <code>TILE W</code> for row 1, column 1.</p>'''
starter = '''
grid = [["G", "G", "W"], ["W", "W", "G"]]

# Define tile_at here.

print("TILE", tile_at(grid, 1, 1))
'''
expect = '''
TILE W
'''
solution = '''
grid = [["G", "G", "W"], ["W", "W", "G"]]

def tile_at(grid, row, col):
    return grid[row][col]

print("TILE", tile_at(grid, 1, 1))
'''
hint = '''The function body needs one return statement: first index grid by row, then index that row by col.''' 

[[lessons.exercises]]
id = "s01-l02-e5"
type = "text"
points = 18
prompt = '''<p>What built-in collection type keeps the ordered row values in the first level grid?</p>'''
answer = "list"
hint = '''It is written with square brackets and can contain another collection as a row.''' 
whyWrong = '''A dictionary uses keys, while a string is one text value. The ordered bracketed collection used for rows is Python's list type.''' 
