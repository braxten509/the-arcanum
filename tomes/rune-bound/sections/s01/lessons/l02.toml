[[lessons]]
id = "s01-l02"
title = "Grid Lines"
teaches = ["s01-grid-rows","s01-grid-indexing"]
body = '''
<p>s01-l02 opens the values and rows chart through Grid. s01-l02 hears THE CARTOGRAPHER name s01-grid-rows its first bearing. s01-l02 names one input, one change, and one output. s01-l02 gives s01-grid-indexing a second mark for comparison. s01-l02 keeps the smallest successful example beside its route.</p>
<p>s01-l02 reads from left to right, then narrates state changes. s01-l02 keeps its values and rows clue concrete and observable. s01-l02 runs twice; the second pass challenges the first. s01-l02 records which owner moved when s01-grid-rows shifted. s01-l02 carries earlier <code>level_rows</code> evidence into this chart.</p>
<p>s01-l02 asks one decision to stand alone in the margin. s01-l02 keeps s01-grid-indexing visible instead of hiding it behind polish. s01-l02 tests a friendly case and a sharp edge case. s01-l02 compares both traces so s01-grid-rows has a witness. s01-l02 names the failure before choosing a repair.</p>
<p>s01-l02 treats each handoff as a contract between maker and reader. s01-l02 supplies s01-grid-rows; the reader checks s01-grid-indexing. s01-l02 places its check where another wayfinder can repeat it. s01-l02 earns THE CARTOGRAPHER's trust through evidence, not luck. s01-l02 leaves one deliberate question for the next chart.</p>
<p>s01-l02 closes by stating what the program must preserve. s01-l02 names one input that could falsify s01-grid-rows. s01-l02 names one output that confirms s01-grid-indexing still belongs. s01-l02 runs the smallest route, inspects its trace, and annotates it. s01-l02 turns the values and rows chart into a RuneBound waypoint.</p>
<p>s01-l02 ends with a handoff to the next chart. s01-l02 carries s01-grid-indexing forward after s01-grid-rows earns trust. s01-l02 lets THE CARTOGRAPHER record the result in plain language. s01-l02 turns a clean rerun from a guess into a fact. s01-l02 lets the next wayfinder begin without hidden context.</p>
<pre><code>print("s01-l02 // Grid Lines")</code></pre>
<div class="field-notes"><div class="fn-head">FIELD NOTES // S01-L02</div><p>s01-l02 <strong>Evidence.</strong> Record s01-grid-rows; compare it with s01-grid-indexing before advancing.</p><p>s01-l02 <strong>Repair.</strong> Change one cause, rerun the route, and preserve the explanation.</p></div>
'''

[[lessons.readings]]
label = "Python tutorial // first steps // Grid Lines"
url = "https://docs.python.org/3/tutorial/introduction.html"

[[lessons.exercises]]
id = "s01-l02-e1"
type = "write"
points = 30
prompt = '''
<p>Complete the first ink route and print exactly <code>RUNEBOUND S01 L02 SEAL</code>. Preserve the named data before adding the final observation.</p>
'''
starter = '''
route_mark = "row-marks"
print("survey pending")
# Add the chart seal after checking the route.
'''
expect = '''
RUNEBOUND S01 L02 SEAL
'''
solution = '''
route_mark = "row-marks"
print("RUNEBOUND S01 L02 SEAL")
'''
hint = '''
For s01-l02-e1, leave the route data intact and add only its final s01 observation; compare the starter output with the target before submitting.
'''

[[lessons.exercises]]
id = "s01-l02-e2"
type = "mc"
points = 14
prompt = '''
<p>What does the first loop own when printing a nested level grid? Select the reading that keeps tilemap.render can walk data in the same row-major order possible.</p>
'''
choices = ["the current row that the inner walk will inspect","the camera offset for every future sprite","the final column regardless of the map shape","the file handle that loaded the level"]
answer = 0
whyWrong = '''
The tempting routes confuse reading grid[column][row] and quietly transposing the world with the job this trial actually asks you to protect; each decoy moves ownership to the wrong part of the chart.
'''
hint = '''
Trace grid[row][column] as the address for each tile mark in the First Ink chart, then compare the the outer iteration chooses a row before the inner iteration chooses a cell with the evidence named in the prompt.
'''
explain = '''
The selected mark preserves the outer iteration chooses a row before the inner iteration chooses a cell and leaves grid[row][column] as the address for each tile mark available for the next RuneBound handoff.
'''

[[lessons.exercises]]
id = "s01-l02-e3"
type = "text"
points = 16
prompt = '''
<p>s01-l02-e3: name the Python term for the specific unit requested by this chart. Supply the language term, not the surrounding story label.</p>
'''
answer = "list"
hint = '''
Recall the named boundary in Grid Lines; the answer is the language term for that single job, not the larger game feature.
'''

[[lessons.exercises]]
id = "s01-l02-e4"
type = "fill"
points = 18
prompt = '''
<p>s01-l02-e4: restore the missing operation in the supplied code. Use its operands and the chart evidence to complete the route without renaming the owner.</p>
'''
code = '''
level_rows.____([0, 1, 0])
'''
answer = "append"
hint = '''
Look at what must happen to for row in level_rows: for mark in row: print(mark); choose the operation that performs that job rather than the one that merely inspects the result.
'''
