[[lessons]]
id = "s01-l01"
title = "Marks, Values, and Types"
teaches = ["s01-value-tracing","s01-value-contract"]
body = '''
<p>s01-l01 opens the values and rows chart through Marks. s01-l01 hears THE CARTOGRAPHER name s01-value-tracing its first bearing. s01-l01 names one input, one change, and one output. s01-l01 gives s01-value-contract a second mark for comparison. s01-l01 keeps the smallest successful example beside its route.</p>
<p>s01-l01 reads from left to right, then narrates state changes. s01-l01 keeps its values and rows clue concrete and observable. s01-l01 runs twice; the second pass challenges the first. s01-l01 records which owner moved when s01-value-tracing shifted. s01-l01 carries earlier <code>level_rows</code> evidence into this chart.</p>
<p>s01-l01 asks one decision to stand alone in the margin. s01-l01 keeps s01-value-contract visible instead of hiding it behind polish. s01-l01 tests a friendly case and a sharp edge case. s01-l01 compares both traces so s01-value-tracing has a witness. s01-l01 names the failure before choosing a repair.</p>
<p>s01-l01 treats each handoff as a contract between maker and reader. s01-l01 supplies s01-value-tracing; the reader checks s01-value-contract. s01-l01 places its check where another wayfinder can repeat it. s01-l01 earns THE CARTOGRAPHER's trust through evidence, not luck. s01-l01 leaves one deliberate question for the next chart.</p>
<p>s01-l01 closes by stating what the program must preserve. s01-l01 names one input that could falsify s01-value-tracing. s01-l01 names one output that confirms s01-value-contract still belongs. s01-l01 runs the smallest route, inspects its trace, and annotates it. s01-l01 turns the values and rows chart into a RuneBound waypoint.</p>
<p>s01-l01 ends with a handoff to the next chart. s01-l01 carries s01-value-contract forward after s01-value-tracing earns trust. s01-l01 lets THE CARTOGRAPHER record the result in plain language. s01-l01 turns a clean rerun from a guess into a fact. s01-l01 lets the next wayfinder begin without hidden context.</p>
<pre><code>print("s01-l01 // Marks, Values, and Types")</code></pre>
<div class="field-notes"><div class="fn-head">FIELD NOTES // S01-L01</div><p>s01-l01 <strong>Evidence.</strong> Record s01-value-tracing; compare it with s01-value-contract before advancing.</p><p>s01-l01 <strong>Repair.</strong> Change one cause, rerun the route, and preserve the explanation.</p></div>
'''

[[lessons.readings]]
label = "MANDATORY // Python installation and downloads"
url = "https://docs.python.org/3/tutorial/introduction.html"

[[lessons.readings]]
label = "MANDATORY // PyGame installation and getting started"
url = "https://docs.python.org/3/tutorial/datastructures.html"

[[lessons.exercises]]
id = "s01-l01-e1"
type = "text"
points = 16
prompt = '''
<p>s01-l01-e1: name the Python term for the specific unit requested by this chart. Supply the language term, not the surrounding story label.</p>
'''
answer = "int"
hint = '''
Recall the named boundary in Marks, Values, and Types; the answer is the language term for that single job, not the larger game feature.
'''

[[lessons.exercises]]
id = "s01-l01-e2"
type = "fill"
points = 18
prompt = '''
<p>s01-l01-e2: restore the missing operation in the supplied code. Use its operands and the chart evidence to complete the route without renaming the owner.</p>
'''
code = '''
gold = ____
'''
answer = "12"
hint = '''
Look at what must happen to gold = 12 beside label = "sun coins"; choose the operation that performs that job rather than the one that merely inspects the result.
'''

[[lessons.exercises]]
id = "s01-l01-e3"
type = "mc"
points = 14
prompt = '''
<p>Which pairing keeps the first clearing's data honest? Select the reading that keeps the level survey can record facts without guessing their kind possible.</p>
'''
choices = ["an integer for the count and a string for its display label","a string for every value so printing is always easy","a boolean for the gold total and a number for its label","one large list with no separate names"]
answer = 0
whyWrong = '''
The tempting routes confuse letting a display string masquerade as a number with the job this trial actually asks you to protect; each decoy moves ownership to the wrong part of the chart.
'''
hint = '''
Trace the player name, a starting gold count, and a passable flag in the First Ink chart, then compare the a number stays numeric while its display label remains text with the evidence named in the prompt.
'''
explain = '''
The selected mark preserves a number stays numeric while its display label remains text and leaves the player name, a starting gold count, and a passable flag available for the next RuneBound handoff.
'''

[[lessons.exercises]]
id = "s01-l01-e4"
type = "write"
points = 30
prompt = '''
<p>Complete the first ink route and print exactly <code>RUNEBOUND S01 L01 SEAL</code>. Preserve the named data before adding the final observation.</p>
'''
starter = '''
route_mark = "sun-coins"
print("survey pending")
# Add the chart seal after checking the route.
'''
expect = '''
RUNEBOUND S01 L01 SEAL
'''
solution = '''
route_mark = "sun-coins"
print("RUNEBOUND S01 L01 SEAL")
'''
hint = '''
For s01-l01-e4, leave the route data intact and add only its final s01 observation; compare the starter output with the target before submitting.
'''

