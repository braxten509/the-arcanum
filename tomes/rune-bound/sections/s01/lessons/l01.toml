[[lessons]]
id = "s01-l01"
title = "Marks on the Map"
teaches = ["tool-install", "tool-create-open", "tool-navigate", "tool-edit-save", "tool-run-test", "tool-diagnose", "python-game-data-values", "typed-level-facts"]
body = '''
<p>Before a world can be drawn, prepare the field table. Follow the mandatory Python and PyGame readings, then in a terminal create a folder such as <code>mkdir RuneBound</code>, enter it with <code>cd RuneBound</code>, and open that folder in your editor. Save a file named <code>survey.py</code>, run <code>python3 survey.py</code>, and keep the terminal in that same folder. Verify the interpreter before s03 with <code>python3 -c "import pygame; print(pygame.version.ver)"</code>. If that reports <code>ModuleNotFoundError</code>, run <code>python3 -m pip install pygame</code> and repeat the exact import check; if <code>python3</code> itself is missing, install Python 3 from the first reading and reopen the terminal. This is the real local-tool route; s01–s02’s small exercises can still be rehearsed in the browser, but the project folder and terminal become the durable delivery route from s03 onward.</p>
<p>Before a world can be drawn, it has to be described without lying. THE CARTOGRAPHER begins with three facts about a single map square: its label, how much gold rests there, and whether a wayfinder may cross it. Python lets a name point at a value, and the value’s <strong>type</strong> tells us what operations make sense. A string holds text, an integer holds a whole count, and a boolean holds one of two decisions: <code>True</code> or <code>False</code>.</p>
<pre><code>tile_name = "Moss Trail"
gold = 12
passable = True

print(tile_name)
print(gold + 3)
print(passable)</code></pre>
<p>Read that chart left to right. The first three lines establish facts; they do not display anything yet. The last three lines inspect them. Keeping <code>gold</code> as an integer matters because later code will add, subtract, and compare it. Keeping <code>tile_name</code> as text matters because it is a human-facing label. A boolean is not the text <code>"True"</code>: quoted text cannot make a branch behave like a yes/no fact.</p>
<p>Use names that explain ownership. <code>starting_gold</code> answers “whose number is this?” better than <code>x</code>. At this stage, print statements are deliberately useful debug scaffolding: they let you see the data before a PyGame window exists. In s03, the game loop will retire these terminal probes in favor of surface rendering; do not mistake a printout for the finished game.</p>
<div class="callout"><strong>THE CARTOGRAPHER'S RULE:</strong> choose the type for the work a value must perform, not for how convenient it looks when printed.</div>
<p>When an output surprises you, trace one name at a time: identify its assigned value, its type, and the expression that used it. That habit will make malformed map data much less mysterious. The eventual RuneBound game receives keyboard and window events, not terminal input; these one-file exercises are a safe place to practice Python’s data vocabulary before the event-driven world begins.</p>
<div class="field-notes"><div class="fn-head">FIELD NOTES // VALUE OWNERSHIP</div><p>A name can later be assigned a different value, but changing a type casually makes code harder to reason about. Keep numeric game facts numeric and convert them to display text only when rendering a label.</p></div>
'''

[[lessons.readings]]
label = "MANDATORY // Install Python 3"
url = "https://www.python.org/downloads/"
essential = true

[[lessons.readings]]
label = "MANDATORY // Install PyGame"
url = "https://www.pygame.org/wiki/GettingStarted"
essential = true

[[lessons.exercises]]
id = "s01-l01-e1"
type = "type"
points = 12
reps = 2
prompt = '''<p>Retype the survey exactly. It records text, a count, and a crossing decision.</p>'''
code = '''
tile_name = "Moss Trail"
gold = 12
passable = True
print(tile_name, gold, passable)
'''

[[lessons.exercises]]
id = "s01-l01-e2"
type = "fill"
points = 22
prompt = '''<p>Complete the literal that records that a bridge tile may be crossed.</p>'''
code = '''
bridge_passable = ____
print(bridge_passable)
'''
answer = "True"
hint = '''A crossing decision has exactly two unquoted Python literals; choose the affirmative one.''' 
whyWrong = '''Quoted text such as "True" only looks like a decision when printed. The program needs Python's boolean literal so a future condition can use it.''' 

[[lessons.exercises]]
id = "s01-l01-e3"
type = "mc"
points = 20
prompt = '''<p>A chest begins with 7 gold pieces and the game later adds 3. Which representation keeps that update honest?</p>'''
choices = ["gold = 7", "gold = \"7\"", "gold = True", "gold = [7]"]
answer = 0
hint = '''The later operation is arithmetic, so select the value that can be added to another number without parsing or indexing.''' 
whyWrong = '''A string is display text, a boolean represents a decision, and a one-item list is a collection. None is the direct numeric fact needed for arithmetic.''' 
explain = '''An integer represents a whole-number amount, so <code>gold + 3</code> produces the new count directly.''' 

[[lessons.exercises]]
id = "s01-l01-e4"
type = "text"
points = 18
prompt = '''<p>What Python type is the value produced by <code>2 + 5</code> when both operands are whole numbers?</p>'''
answer = "int"
hint = '''Use Python's short built-in name for a whole-number type.''' 
whyWrong = '''A result displayed by print is not automatically text. Adding two whole-number values produces another whole-number value.''' 

[[lessons.exercises]]
id = "s01-l01-e5"
type = "write"
points = 32
prompt = '''<p>Create three variables for the exact facts in the starter: the trail label, 12 gold pieces, and the passable decision. Print exactly the two lines shown: <code>Moss Trail</code> then <code>15</code>. Do not turn the gold count into text.</p>'''
starter = '''
# Record the trail facts here.
'''
expect = '''
Moss Trail
15
'''
solution = '''
tile_name = "Moss Trail"
gold = 12
passable = True
print(tile_name)
print(gold + 3)
'''
hint = '''Store 12 in a numeric variable, then print that variable plus 3 on the second line.''' 
