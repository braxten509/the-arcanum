[[lessons]]
id = "s01-l03"
title = "The Trailhead File"
teaches = ["text-level-file-reading", "comma-level-parser", "grid-inspection-output"]
body = '''
<p>Now the map stops being hardcoded in the program. A level description can be a plain text file whose lines contain comma-separated marks: <code>G,G,W</code>. The program has three separate jobs: open and read the file, parse each line into a row, and inspect the finished grid. Separation is a debugging tool. If a row is wrong, you can decide whether the file contents or the parser caused it instead of guessing.</p>
<pre><code>def parse_level(lines):
    grid = []
    for line in lines:
        row = line.strip().split(",")
        grid.append(row)
    return grid

lines = ["G,G,W\n", "G,W,G\n"]
print(parse_level(lines))</code></pre>
<p><code>strip()</code> removes the trailing newline from a line read from a file. Then <code>split(",")</code> turns the comma-separated text into a list of cell strings. Appending each parsed row makes the returned list-of-lists. This is a deliberate text-level format for learning, not a permanent final map format; s04 replaces the temporary terminal inspection with data-driven tile rendering and a real map loader.</p>
<p>When the level lives in a file named <code>level.txt</code> beside your script, use a context manager. The <code>with</code> block closes the handle after the indented block, including when a read fails. <code>readlines()</code> returns a list of the file’s lines, which is exactly what <code>parse_level</code> receives.</p>
<pre><code>with open("level.txt", encoding="utf-8") as handle:
    lines = handle.readlines()

grid = parse_level(lines)
for row in grid:
    for cell in row:
        print(cell)</code></pre>
<p>For a first recovery, read the error literally. <code>FileNotFoundError</code> means Python did not find the named path from the terminal’s current working directory. Check the file spelling, save it, and run the command in the folder that contains both files. Do not “fix” that problem by changing the parser. Once the file is read, inspect the grid with the same row-major loop from the previous lesson. These prints are evidence for this chapter only, and s03 must retire them when the game loop renders surfaces.</p>
<div class="callout"><strong>THE CARTOGRAPHER'S CHECK:</strong> first print raw lines, then print the parsed grid. Evidence at both boundaries makes a broken route locatable.</div>
<div class="field-notes"><div class="fn-head">FIELD NOTES // EMPTY CELLS</div><p>A blank line becomes <code>[""]</code> with this simple parser. For the controlled first map, do not include blank lines; later loaders can validate map shape and report malformed data clearly.</p></div>
'''

[[lessons.readings]]
label = "Python Docs // Reading and Writing Files"
url = "https://docs.python.org/3/tutorial/inputoutput.html#reading-and-writing-files"

[[lessons.exercises]]
id = "s01-l03-e1"
type = "fill"
points = 22
prompt = '''<p>Complete the method call that obtains every line from an already-open level file handle.</p>'''
code = '''
with open("level.txt", encoding="utf-8") as handle:
    lines = handle.____()
'''
answer = "readlines"
hint = '''Use the file method whose name says it returns multiple lines, not the one that reads a single line.''' 
whyWrong = '''Calling <code>read</code> would return one string, which this row-by-row parser cannot iterate as lines. The parser expects the list returned by <code>readlines()</code>.''' 

[[lessons.exercises]]
id = "s01-l03-e2"
type = "mc"
points = 20
prompt = '''<p>Which operation turns the text line <code>"G,W,G\\n"</code> into cells without the newline?</p>'''
choices = ["line.strip().split(\",\")", "line.append(\",\")", "line[0][1]", "print(line)"]
answer = 0
hint = '''One operation removes surrounding whitespace; the next divides text at comma boundaries.''' 
whyWrong = '''Appending changes a list rather than parsing text, indexing selects one character, and printing only observes the original line. The parser must remove the newline then split at commas.''' 
explain = '''<code>strip()</code> removes the trailing newline and <code>split(",")</code> produces the three cell strings.''' 

[[lessons.exercises]]
id = "s01-l03-e3"
type = "write"
points = 35
prompt = '''<p>Write <code>parse_level(lines)</code>. It must convert the supplied comma-separated lines into a list of row lists, then use the canonical nested loops to print each cell. Your program must print exactly the six marks shown, one per line: <code>G</code>, <code>G</code>, <code>W</code>, <code>W</code>, <code>G</code>, <code>G</code>.</p>'''
starter = '''
lines = ["G,G,W\n", "W,G,G\n"]

# Define parse_level, call it, and inspect every cell.
'''
expect = '''
G
G
W
W
G
G
'''
solution = '''
lines = ["G,G,W\n", "W,G,G\n"]

def parse_level(lines):
    grid = []
    for line in lines:
        grid.append(line.strip().split(","))
    return grid

grid = parse_level(lines)
for row in grid:
    for cell in row:
        print(cell)
'''
hint = '''Build grid with append inside a loop over lines, then reuse for row in grid and for cell in row to print it.''' 

[[lessons.exercises]]
id = "s01-l03-e4"
type = "text"
points = 18
prompt = '''<p>Which exception usually tells you that Python could not locate the named level file from the folder where you ran the command?</p>'''
answer = "FileNotFoundError"
hint = '''Its name combines the missing thing with the failure condition.''' 
whyWrong = '''A parser problem happens after text has been read. This exception occurs earlier, when the path supplied to <code>open()</code> cannot be found.''' 

[[lessons.exercises]]
id = "s01-l03-e5"
type = "type"
points = 12
reps = 2
prompt = '''<p>Retype the smallest complete parser. Keep its file-reading boundary separate from its parsing boundary.</p>'''
code = '''
def parse_level(lines):
    return [line.strip().split(",") for line in lines]

print(parse_level(["G,W\\n"]))
'''
