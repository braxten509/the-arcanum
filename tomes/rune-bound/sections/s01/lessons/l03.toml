[[lessons]]
id = "s01-l03"
title = "The File at the Trailhead"
teaches = ["s01-file-reading","s01-level-parsing"]
body = '''
<p>s01-l03 opens the values and rows chart through File. s01-l03 hears THE CARTOGRAPHER name s01-file-reading its first bearing. s01-l03 names one input, one change, and one output. s01-l03 gives s01-level-parsing a second mark for comparison. s01-l03 keeps the smallest successful example beside its route.</p>
<p>s01-l03 reads from left to right, then narrates state changes. s01-l03 keeps its values and rows clue concrete and observable. s01-l03 runs twice; the second pass challenges the first. s01-l03 records which owner moved when s01-file-reading shifted. s01-l03 carries earlier <code>level_rows</code> evidence into this chart.</p>
<p>s01-l03 asks one decision to stand alone in the margin. s01-l03 keeps s01-level-parsing visible instead of hiding it behind polish. s01-l03 tests a friendly case and a sharp edge case. s01-l03 compares both traces so s01-file-reading has a witness. s01-l03 names the failure before choosing a repair.</p>
<p>s01-l03 treats each handoff as a contract between maker and reader. s01-l03 supplies s01-file-reading; the reader checks s01-level-parsing. s01-l03 places its check where another wayfinder can repeat it. s01-l03 earns THE CARTOGRAPHER's trust through evidence, not luck. s01-l03 leaves one deliberate question for the next chart.</p>
<p>s01-l03 closes by stating what the program must preserve. s01-l03 names one input that could falsify s01-file-reading. s01-l03 names one output that confirms s01-level-parsing still belongs. s01-l03 runs the smallest route, inspects its trace, and annotates it. s01-l03 turns the values and rows chart into a RuneBound waypoint.</p>
<p>s01-l03 ends with a handoff to the next chart. s01-l03 carries s01-level-parsing forward after s01-file-reading earns trust. s01-l03 lets THE CARTOGRAPHER record the result in plain language. s01-l03 turns a clean rerun from a guess into a fact. s01-l03 lets the next wayfinder begin without hidden context.</p>
<pre><code>print("s01-l03 // The File at the Trailhead")</code></pre>
<div class="field-notes"><div class="fn-head">FIELD NOTES // S01-L03</div><p>s01-l03 <strong>Evidence.</strong> Record s01-file-reading; compare it with s01-level-parsing before advancing.</p><p>s01-l03 <strong>Repair.</strong> Change one cause, rerun the route, and preserve the explanation.</p></div>
'''

[[lessons.readings]]
label = "Python tutorial // first steps // The File at the Trailhead"
url = "https://docs.python.org/3/tutorial/introduction.html"

[[lessons.readings]]
label = "Python tutorial // data structures // The File at the Trailhead"
url = "https://docs.python.org/3/tutorial/datastructures.html"

[[lessons.exercises]]
id = "s01-l03-e1"
type = "mc"
points = 14
prompt = '''
<p>Why should file reading and level parsing remain separate? Select the reading that keeps s02's objects can receive a clean level grid instead of raw file debris possible.</p>
'''
choices = ["each stage has one observable job and one easier failure to diagnose","the parser can only work when it owns the operating system","separate stages prevent Python from storing strings","the renderer must read every file again each frame"]
answer = 0
whyWrong = '''
The tempting routes confuse assuming every line has equal width or leaving newline characters inside cells with the job this trial actually asks you to protect; each decoy moves ownership to the wrong part of the chart.
'''
hint = '''
Trace open(), readlines(), and a parser that turns marks into rows in the First Ink chart, then compare the file ownership, parsing, and printing are three separate jobs with the evidence named in the prompt.
'''
explain = '''
The selected mark preserves file ownership, parsing, and printing are three separate jobs and leaves open(), readlines(), and a parser that turns marks into rows available for the next RuneBound handoff.
'''

[[lessons.exercises]]
id = "s01-l03-e2"
type = "write"
points = 30
prompt = '''
<p>Complete the first ink route and print exactly <code>RUNEBOUND S01 L03 SEAL</code>. Preserve the named data before adding the final observation.</p>
'''
starter = '''
route_mark = "level-lines"
print("survey pending")
# Add the chart seal after checking the route.
'''
expect = '''
RUNEBOUND S01 L03 SEAL
'''
solution = '''
