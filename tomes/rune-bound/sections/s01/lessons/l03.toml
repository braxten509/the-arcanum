print("RUNEBOUND S01 L03 SEAL")
'''
hint = '''
For s01-l03-e2, leave the route data intact and add only its final s01 observation; compare the starter output with the target before submitting.
'''

[[lessons.exercises]]
id = "s01-l03-e3"
type = "type"
points = 10
reps = 2
prompt = '''
<p>Retype this first ink evidence exactly. Keep open(), readlines(), and a parser that turns marks into rows visible while you write. (Ctrl+Enter submits.)</p>
'''
code = '''
def parse_level(lines):
    return [line.strip().split(",") for line in lines]
print(parse_level(["0,1"]))
'''

[[lessons.exercises]]
id = "s01-l03-e4"
type = "fill"
points = 18
prompt = '''
<p>s01-l03-e4: restore the missing operation in the supplied code. Use its operands and the chart evidence to complete the route without renaming the owner.</p>
'''
code = '''
lines = handle.____()
'''
answer = "readlines"
hint = '''
Look at what must happen to with open("level.txt", encoding="utf-8") as handle; choose the operation that performs that job rather than the one that merely inspects the result.
'''

