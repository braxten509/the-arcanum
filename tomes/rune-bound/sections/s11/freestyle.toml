[freestyle]
title = "BUILD: The Bound World"
brief = '''
<p>Wayfinder, ship RuneBound as one coherent, playable, saveable RPG. This is a real PyGame delivery run from the project folder, not a terminal state-machine sketch.</p>
<ul><li>extend <code>state.py</code> with <code>ScreenState</code> containing exactly <code>TITLE</code>, <code>PLAYING</code>, <code>PAUSED</code>, <code>INVENTORY</code>, <code>QUEST_LOG</code>, <code>COMBAT</code>, and <code>GAME_OVER</code>, while preserving s10’s <code>GameState.to_dict()</code>, <code>GameState.from_dict()</code>, <code>save_game</code>, and <code>load_game</code> contracts</li><li>replace <code>inventory_open</code> and <code>quest_log_open</code> with one <code>screen_state</code> dispatcher; I and Q still open their screen-pixel panels from PLAYING and close back to PLAYING before one final flip</li><li>keep <code>pygame.event.get()</code>, QUIT, one held-key read, one <code>pygame.display.flip()</code>, and <code>clock.tick(FPS)</code> in every frame; dispatch only the legal route’s gameplay input, update, and draw work</li><li>wire enemy contact to COMBAT and preserve CombatSystem ownership: A/D/F resolve its actions, a win records flags/removes the defeated actor/updates quests, flee returns to play, and loss enters GAME_OVER with a new-game or title route</li><li>build TITLE with N New Game, L Load Game, and Esc Quit; New Game reconstructs default Player, QuestLog, flags, map, HP, inventory, quest completion, and gold, while Load calls the safe s10 <code>load_game</code> boundary, loads its map filename, and leaves TITLE usable after missing or malformed saves</li><li>add PAUSED with Esc Resume, S Save, and T Title; keep save/load logic in the canonical s10 functions rather than duplicating JSON parsing</li><li>add one screen-space HUD reporting canonical Player HP, persisted Player-owned <code>gold</code> in gp, and <code>len(quest_log.active())</code>; extend the s10 snapshot/restore contract to retain <code>gold</code> without moving HUD ownership into GameState</li><li>move retained <code>test_tilemap.py</code> and <code>test_combat.py</code> development loops into <code>tests/</code>, remove their execution from <code>main.py</code>, and document their commands and protected contracts in README</li><li>from a clean project folder with no save, run <code>python3 main.py</code>; choose New Game, walk ten tiles east to a wall, navigate three Elder nodes, defeat Slime with two attacks and one observed enemy response, collect Potion, inspect I and Q, save, quit, relaunch, Load, and prove world position, HP, gold, inventory order, quest state, dialogue/combat flags, and map variant survived; also prove missing and malformed loads keep TITLE usable, recording commands, observations, and repair/no-repair in README</li></ul>
'''
requires = ["s11-game-state-enum", "s11-frame-state-dispatch", "s11-overlay-state-replacement", "s11-title-menu-flow", "s11-safe-menu-load", "s11-screen-space-hud", "s11-pause-return", "s11-complete-state-integration", "s11-regression-suite-shipping", "s11-end-to-end-save-proof", "tool-deliver"]
reward = 480
xray = '''
The Cartographer starts at main.py and verifies TITLE is the first route, one event pump and one flip remain, every enum state has legal keys and a draw route, I/Q no longer depend on local Booleans, CombatSystem remains the combat owner, s10’s loader is the only load boundary, the HUD only reports canonical facts, and tests no longer hijack the playable entry point.
'''

[freestyle.badge]
id = "badge-s11"
name = "WORLD BOUND"
desc = "Shipped a coherent RuneBound world with a recoverable route through every screen."

[[freestyle.rubric]]
criterion = "Explicit State Dispatch"
weight = 30
desc = '''<code>ScreenState</code> has all seven canonical states; main has one state selector, one event pump, and one final flip. Local inventory/quest booleans are retired while I/Q, combat, game-over, and pause transitions remain playable.''' 

[[freestyle.rubric]]
criterion = "Safe Menu and Durable HUD"
weight = 25
desc = '''TITLE New Game resets canonical defaults, TITLE Load uses s10 safe restoration and map replacement, recovery leaves TITLE usable, pause uses canonical save, and screen-space HUD truthfully reports HP, persisted gold, and active quests without mutating them.''' 

[[freestyle.rubric]]
criterion = "Cumulative World Integration"
weight = 25
desc = '''Player collision, NPC dialogue, CombatSystem results, item pickup, QuestLog transitions, map variants, and s10 snapshot fields remain wired through their prior owners; terminal combat results choose PLAYING or GAME_OVER deliberately.''' 

[[freestyle.rubric]]
criterion = "Final Traverse Evidence"
weight = 20
desc = '''README records clean-start and relaunch commands/observations, missing and malformed-load recovery, persisted position/HP/gold/inventory/quest/dialogue/combat/map facts, and a precise repair or explicit no-repair. Retained tile-map and combat checks run from <code>tests/</code>, not main.py.''' 
