[freestyle]
title = "THE WORKING 11 // The Bound World"
brief = '''
<p>Bind the bound world into the growing RuneBound route. The commission must leave a runnable artifact whose behavior can be inspected from the named evidence.</p><ul><li>preserve the chart's data boundary and use the established names</li><li>prove the requested behavior with a repeatable run that ends at <code>RUNEBOUND S11 SEAL</code></li><li>write a short repair note explaining the nearest failure and the change that corrected it</li></ul>
'''
requires = ["s11-state-machine","s11-dispatch-loop","s11-menu-flow","s11-hud-pause","s11-final-integration","s11-acceptance-proof"]
reward = 268
xray = '''
The Cartographer checks whether the bound world commission keeps title, playing, paused, inventory, quest_log, combat, and game_over as named destinations under the right owner, shows runebound is ready to leave the study as a playable single-player artifact, and leaves evidence beyond a decorative printout.
'''

[freestyle.badge]
id = "badge-s11"
name = "BOUND WORLD SEALED"
desc = "Sealed the the bound world chart with evidence another wayfinder can inspect."

[[freestyle.rubric]]
criterion = "Bound World runs"
weight = 25
desc = '''
The the bound world artifact parses and runs with the chart's named behavior visible.
'''

[[freestyle.rubric]]
criterion = "Bound World keeps its boundary"
weight = 35
desc = '''
The commission keeps title, playing, paused, inventory, quest_log, combat, and game_over as named destinations and runebound is ready to leave the study as a playable single-player artifact in the owners established by the lessons.
'''

[[freestyle.rubric]]
criterion = "Bound World shows proof"
weight = 25
desc = '''
The wayfinder supplies a repeatable observation, the exact s11 seal, and a useful comparison case rather than a one-time claim.
'''

[[freestyle.rubric]]
criterion = "Cartographer's repair note"
weight = 15
desc = '''
The explanation names the failing boundary, the evidence that exposed it, and the smallest correction that restored the route.
'''

