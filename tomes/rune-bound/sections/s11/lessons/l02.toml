[[lessons]]
id = "s11-l02"
title = "The Bound Menu and HUD"
teaches = ["s11-title-menu-flow", "s11-safe-menu-load", "s11-screen-space-hud", "s11-pause-return"]
body = '''
<p>A title screen is a route, not a decorative image pasted over a live overworld. In the <code>TITLE</code> event branch, draw three screen-pixel labels with the canonical <code>render_text</code>: <code>N New Game</code>, <code>L Load Game</code>, and <code>Esc Quit</code>. N starts a deliberately fresh run: restore the original map with <code>tile_map.load("data/maps/overworld.csv")</code>, recreate the normal Player/QuestLog/flag setup through your existing setup function, rebuild <code>game_state</code>, clear <code>active_combat</code>, and set <code>screen_state = ScreenState.PLAYING</code>. Do not fake New Game by merely hiding old inventory or quest completion.</p>
<p>L uses the s10 boundary, not a second JSON reader. Call <code>load_game("save.json", player, quest_log)</code>; only when it returns a non-<code>None</code> state assign <code>game_state</code>, call <code>tile_map.load(game_state.map_filename)</code>, restore the camera from the restored Player rect on the next update, and enter <code>PLAYING</code>. On the recovery message <code>"No usable save found."</code>, remain at TITLE and paint that message there. A broken map filename after a valid JSON save is authored project data to repair, not a reason to erase a valid session.</p>
<pre><code>elif screen_state is ScreenState.TITLE:
    if event.key == pygame.K_n:
        reset_new_game()
        screen_state = ScreenState.PLAYING
    elif event.key == pygame.K_l:
        loaded, menu_message = load_game("save.json", player, quest_log)
        if loaded is not None:
            game_state = loaded
            tile_map.load(game_state.map_filename)
            screen_state = ScreenState.PLAYING
    elif event.key == pygame.K_ESCAPE:
        running = False</code></pre>
<p>Esc has a different meaning in play: <code>PLAYING → PAUSED</code>. The pause draw route paints a translucent or opaque screen-pixel panel and the explicit instructions <code>Esc Resume</code>, <code>S Save</code>, and <code>T Title</code>. Resume returns to PLAYING; S calls the same <code>save_game(game_state, "save.json")</code>; T returns to TITLE without silently changing the session. Keep s10’s S/L commands in PLAYING too if you want quick field access, but never duplicate their serialization logic. Inventory and quest-log routes close back to PLAYING, never to PAUSED, because they can only open from PLAYING.</p>
<p>Add <code>draw_hud(surface, player, quest_log, gold, render_text)</code> in <code>main.py</code> or a dedicated UI module—choose one owner and do not create a second. Give the Player a single <code>gold</code> integer initialized during new-game setup and included in <code>GameState.to_dict()</code>/<code>from_dict()</code> as <code>"gold"</code>; this is the final durable stat required by the HUD. The helper reads <code>player.stats</code>, <code>gold</code>, and <code>len(quest_log.active())</code>, then calls <code>draw_health_bar</code> and <code>render_text</code> at screen pixels. It never changes currency, completion, camera, or HP.</p>
<pre><code>def draw_hud(surface, player, quest_log, gold, render_text):
    draw_health_bar(surface, player.stats, 18, 18, width=180, height=14)
    render_text(surface, f"HP {player.stats.hp}/{player.stats.max_hp}", 18, 40)
    render_text(surface, f"Gold {gold} gp", 18, 68)
    render_text(surface, f"Active quests {len(quest_log.active())}", 18, 96)</code></pre>
<p>Draw world ground, actors, dialogue and receipts, then this HUD; draw the active pause, inventory, quest-log, combat, or game-over panel above it; finally flip once. The HUD is a report, so it stays visible while PLAYING and may remain beneath modal panels without taking their input.</p>
<div class="callout"><strong>THE CARTOGRAPHER'S RULE:</strong> a menu transition either builds a fresh canonical world or uses the tested loader; the HUD reports durable facts but never becomes their owner.</div>
<div class="field-notes"><div class="fn-head">SURVEY // FRESH MEANS FRESH</div><p>Test N after collecting the Shadow Key: the pack, flags, completion values, map filename, HP, and gold must be setup defaults. Test L with no save: the menu stays usable. If a load appears one frame at the old location, move camera follow into the restored PLAYING update before the next world draw.</p></div>
'''

[[lessons.readings]]
label = "PyGame Docs // keyboard events"
url = "https://www.pygame.org/docs/ref/key.html"

[[lessons.readings]]
label = "Python Docs // JSON"
url = "https://docs.python.org/3/library/json.html"

[[lessons.exercises]]
id = "s11-l02-e1"
type = "mc"
points = 22
prompt = '''<p>After a valid title-screen load, what must happen before the first restored world frame is drawn?</p>'''
choices = ["Replace the Player with a camera-space tuple", "Append saved CSV rows to the current map", "Set every quest to incomplete so the HUD is fresh", "Call <code>tile_map.load(game_state.map_filename)</code> and then use the restored Player rect for camera follow"]
answer = 3
hint = '''s10 restores the map filename and Player world pixels; both must become live world presentation before drawing.''' 
whyWrong = '''A tuple loses Player behavior, appending breaks the grid, and clearing quests contradicts the snapshot. The established map loader replaces the grid, while camera follows the restored world-space Player.''' 
explain = '''The saved wrapper supplies the exact CSV filename and restored canonical objects; main reconnects them to the normal render route.''' 

[[lessons.exercises]]
id = "s11-l02-e2"
type = "fill"
points = 24
prompt = '''<p>Restore the QuestLog call the HUD uses to count unfinished work without changing any completion fact.</p>'''
code = '''
active_count = len(quest_log.____())
'''
answer = "active"
hint = '''The existing QuestLog method returns a list filtered to incomplete Quest records.''' 
whyWrong = '''<code>update</code> evaluates and can record transitions, which a renderer must not do. The HUD needs the read-only query for currently unfinished quests.''' 

[[lessons.exercises]]
id = "s11-l02-e3"
type = "text"
points = 20
prompt = '''<p>Which s10 function must TITLE’s L command call so malformed or missing saves keep the menu usable?</p>'''
answer = "load_game"
hint = '''It returns both a reconstructed state-or-None and a human-facing recovery message.''' 
whyWrong = '''<code>json.load</code> alone has no safe recovery contract, while <code>save_game</code> writes rather than restores. Use the established boundary instead of duplicating parsing in the menu.''' 

[[lessons.exercises]]
id = "s11-l02-e4"
type = "write"
points = 36
prompt = '''<p>Model a read-only HUD. Given the supplied HP, gold, and quest records, print exactly <code>HP 18/30</code>, <code>GOLD 14 gp</code>, and <code>ACTIVE 2</code>. Do not alter the quest records.</p>'''
starter = '''
hp = 18
max_hp = 30
gold = 14
quests = [{"completed": False}, {"completed": True}, {"completed": False}]

# Report the three HUD lines without changing quests.
'''
expect = '''
HP 18/30
GOLD 14 gp
ACTIVE 2
'''
solution = '''
hp = 18
max_hp = 30
gold = 14
quests = [{"completed": False}, {"completed": True}, {"completed": False}]

active_count = len([quest for quest in quests if not quest["completed"]])
print(f"HP {hp}/{max_hp}")
print(f"GOLD {gold} gp")
print("ACTIVE", active_count)
'''
hint = '''Filter into a new list where <code>not quest["completed"]</code>, then take its length; formatting the first two lines must retain the supplied numbers.''' 

[[lessons.exercises]]
id = "s11-l02-e5"
type = "mc"
points = 22
prompt = '''<p>What is the correct Esc transition while the game is being played normally?</p>'''
choices = ["PLAYING → PAUSED", "PLAYING → GAME_OVER", "PLAYING → INVENTORY", "PLAYING → TITLE and discard the session"]
answer = 0
hint = '''Pause preserves the active session and offers a deliberate resume route.''' 
whyWrong = '''Game over requires a combat loss, inventory belongs to I, and title is an explicit menu choice. Esc pauses the current world without mutating it.''' 
explain = '''The PAUSED route is modal presentation and input routing around the same durable game session.''' 
