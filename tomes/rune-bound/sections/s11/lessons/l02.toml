[[lessons]]
id = "s11-l02"
title = "The Study's Controls"
teaches = ["s11-menu-flow","s11-hud-pause"]
body = '''
<p>s11-l02 opens the states and controls chart through Study's. s11-l02 hears THE CARTOGRAPHER name s11-menu-flow its first bearing. s11-l02 names one input, one change, and one output. s11-l02 gives s11-hud-pause a second mark for comparison. s11-l02 keeps the smallest successful example beside its route.</p>
<p>s11-l02 reads from left to right, then narrates state changes. s11-l02 keeps its states and controls clue concrete and observable. s11-l02 runs twice; the second pass challenges the first. s11-l02 records which owner moved when s11-menu-flow shifted. s11-l02 borrows a neighboring trace without hiding its owner.</p>
<p>s11-l02 asks one decision to stand alone in the margin. s11-l02 keeps s11-hud-pause visible instead of hiding it behind polish. s11-l02 tests a friendly case and a sharp edge case. s11-l02 compares both traces so s11-menu-flow has a witness. s11-l02 names the failure before choosing a repair.</p>
<p>s11-l02 treats each handoff as a contract between maker and reader. s11-l02 supplies s11-menu-flow; the reader checks s11-hud-pause. s11-l02 places its check where another wayfinder can repeat it. s11-l02 earns THE CARTOGRAPHER's trust through evidence, not luck. s11-l02 leaves one deliberate question for the next chart.</p>
<p>s11-l02 closes by stating what the program must preserve. s11-l02 names one input that could falsify s11-menu-flow. s11-l02 names one output that confirms s11-hud-pause still belongs. s11-l02 runs the smallest route, inspects its trace, and annotates it. s11-l02 turns the states and controls chart into a RuneBound waypoint.</p>
<p>s11-l02 ends with a handoff to the next chart. s11-l02 carries s11-hud-pause forward after s11-menu-flow earns trust. s11-l02 lets THE CARTOGRAPHER record the result in plain language. s11-l02 turns a clean rerun from a guess into a fact. s11-l02 lets the next wayfinder begin without hidden context.</p>
<pre><code>print("s11-l02 // The Study's Controls")</code></pre>
<div class="field-notes"><div class="fn-head">FIELD NOTES // S11-L02</div><p>s11-l02 <strong>Evidence.</strong> Record s11-menu-flow; compare it with s11-hud-pause before advancing.</p><p>s11-l02 <strong>Repair.</strong> Change one cause, rerun the route, and preserve the explanation.</p></div>
'''

[[lessons.readings]]
label = "Python library // enum // The Study's Controls"
url = "https://docs.python.org/3/library/enum.html"

[[lessons.exercises]]
id = "s11-l02-e1"
type = "type"
points = 10
reps = 2
prompt = '''
<p>Retype this bound world evidence exactly. Keep new game, load game, quit, hp, gold, active quests, and an explicit pause return visible while you write. (Ctrl+Enter submits.)</p>
'''
code = '''
hud = {"hp": 40, "gold": 12, "quests": 1}
print(hud["hp"], hud["gold"])
'''

[[lessons.exercises]]
id = "s11-l02-e2"
type = "text"
points = 16
prompt = '''
<p>s11-l02-e2: name the Python term for the specific unit requested by this chart. Supply the language term, not the surrounding story label.</p>
'''
answer = "PAUSED"
hint = '''
Recall the named boundary in The Study's Controls; the answer is the language term for that single job, not the larger game feature.
'''

[[lessons.exercises]]
id = "s11-l02-e3"
type = "write"
points = 30
prompt = '''
<p>Complete the bound world route and print exactly <code>RUNEBOUND S11 L02 SEAL</code>. Preserve the named data before adding the final observation.</p>
'''
starter = '''
route_mark = "study-controls"
print("survey pending")
# Add the chart seal after checking the route.
'''
expect = '''
RUNEBOUND S11 L02 SEAL
'''
solution = '''
route_mark = "study-controls"
print("RUNEBOUND S11 L02 SEAL")
'''
hint = '''
For s11-l02-e3, leave the route data intact and add only its final s11 observation; compare the starter output with the target before submitting.
'''

[[lessons.exercises]]
id = "s11-l02-e4"
type = "mc"
points = 14
prompt = '''
<p>What must New Game do before the player enters PLAYING? Select the reading that keeps the final play flow can move into inventory, quests, and combat without losing its route possible.</p>
'''
choices = ["reuse the prior inventory silently","load a corrupt save as a fresh world","let the HUD choose the spawn position","The Study's Controls: keep s11-menu-flow owned by the named boundary and verify the result before handoff s11-l02-e4."]
answer = 3
whyWrong = '''
The tempting routes confuse resetting state before the visible confirmation or drawing hud values from stale objects with the job this trial actually asks you to protect; each decoy moves ownership to the wrong part of the chart.
'''
hint = '''
Trace New Game, Load Game, Quit, HP, gold, active quests, and an explicit pause return in the Bound World chart, then compare the menu commands choose a GameState while HUD and pause only report or suspend the current one with the evidence named in the prompt.
'''
explain = '''
The selected mark preserves menu commands choose a gamestate while hud and pause only report or suspend the current one and leaves new game, load game, quit, hp, gold, active quests, and an explicit pause return available for the next RuneBound handoff.
'''

[[lessons.exercises]]
id = "s11-l02-e5"
type = "fill"
points = 18
prompt = '''
<p>s11-l02-e5: restore the missing operation in the supplied code. Use its operands and the chart evidence to complete the route without renaming the owner.</p>
'''
code = '''
screen.____(hud_surface, hud_rect)
'''
answer = "blit"
hint = '''
Look at what must happen to screen.blit(hud_surface, hud_rect); choose the operation that performs that job rather than the one that merely inspects the result.
'''
