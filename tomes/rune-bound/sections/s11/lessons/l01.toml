[[lessons]]
id = "s11-l01"
title = "The State Doors"
teaches = ["s11-game-state-enum", "s11-frame-state-dispatch", "s11-overlay-state-replacement"]
body = '''
<p>Wayfinder, the final chart does not add another Boolean beside <code>inventory_open</code>, <code>quest_log_open</code>, and <code>active_combat</code>. Those local signals did their surveying work, but together they permit impossible mixtures: an inventory over a pause screen, or movement while a combat panel claims the keys. In <code>state.py</code>, keep the existing save <code>GameState</code> class and add a separate <code>ScreenState</code> enum above it. This enum owns exactly one current doorway: <code>TITLE</code>, <code>PLAYING</code>, <code>PAUSED</code>, <code>INVENTORY</code>, <code>QUEST_LOG</code>, <code>COMBAT</code>, or <code>GAME_OVER</code>.</p>
<pre><code>from enum import Enum, auto


class ScreenState(Enum):
    TITLE = auto()
    PLAYING = auto()
    PAUSED = auto()
    INVENTORY = auto()
    QUEST_LOG = auto()
    COMBAT = auto()
    GAME_OVER = auto()</code></pre>
<p>In <code>main.py</code>, delete the pre-loop <code>inventory_open</code> and <code>quest_log_open</code> assignments and create <code>screen_state = ScreenState.TITLE</code>. Keep <code>active_combat</code>, but only as the current <code>CombatSystem</code> object while the screen state is <code>COMBAT</code>; it is not a competing screen selector. The permanent frame skeleton from s03 remains visible: pump every event, update only the active route, draw that route, call the one <code>pygame.display.flip()</code>, then get <code>dt</code> from <code>clock.tick(FPS)</code>.</p>
<pre><code>while running:
    for event in pygame.event.get():
        if event.type == pygame.QUIT:
            running = False
        else:
            handle_event(event)

    update_active_state(dt)
    draw_active_state(screen)
    pygame.display.flip()
    dt = clock.tick(FPS) / 1000.0</code></pre>
<p>Do not literally invent hidden global functions if your cumulative file already has inline branches. Treat the names above as a routing map: preserve the one event pump and place equivalent state branches in that loop. In the <code>PLAYING</code> branch, s06 movement, collision, pickup, dialogue, quest update, and camera follow remain in their established order. I and Q are <code>KEYDOWN</code> transitions to <code>INVENTORY</code> and <code>QUEST_LOG</code>; each overlay returns to <code>PLAYING</code> when its same key is pressed. Their existing <code>draw_inventory</code> and <code>draw_quest_log</code> helpers still paint screen pixels before the one flip.</p>
<p>Contact with an Enemy creates <code>CombatSystem(player, enemy)</code> and changes to <code>COMBAT</code>. Route A, D, and F only there. When it ends, copy its truthful <code>result</code> into the existing combat flags; a win removes that enemy and returns to <code>PLAYING</code>, a flee returns to <code>PLAYING</code> without removal, and <code>"lost"</code> enters <code>GAME_OVER</code>. Thus combat owns outcome facts, while the dispatcher owns which route gets input.</p>
<div class="callout"><strong>THE CARTOGRAPHER'S RULE:</strong> one named screen state selects one legal input/update/draw route; the event pump and final flip remain world-wide duties.</div>
<div class="field-notes"><div class="fn-head">SURVEY // DOORWAY AUDIT</div><p>If I can open the pack while paused, an old Boolean branch survived. Remove that branch rather than adding a second guard. If X fails during combat, the event pump was incorrectly put inside PLAYING; restore it to the top of every frame.</p></div>
'''

