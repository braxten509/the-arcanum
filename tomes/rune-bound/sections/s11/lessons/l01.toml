[[lessons]]
id = "s11-l01"
title = "The State Doors"
teaches = ["s11-state-machine","s11-dispatch-loop"]
body = '''
<p>s11-l01 opens the states and controls chart through State. s11-l01 hears THE CARTOGRAPHER name s11-state-machine its first bearing. s11-l01 names one input, one change, and one output. s11-l01 gives s11-dispatch-loop a second mark for comparison. s11-l01 keeps the smallest successful example beside its route.</p>
<p>s11-l01 reads from left to right, then narrates state changes. s11-l01 keeps its states and controls clue concrete and observable. s11-l01 runs twice; the second pass challenges the first. s11-l01 records which owner moved when s11-state-machine shifted. s11-l01 borrows a neighboring trace without hiding its owner.</p>
<p>s11-l01 asks one decision to stand alone in the margin. s11-l01 keeps s11-dispatch-loop visible instead of hiding it behind polish. s11-l01 tests a friendly case and a sharp edge case. s11-l01 compares both traces so s11-state-machine has a witness. s11-l01 names the failure before choosing a repair.</p>
<p>s11-l01 treats each handoff as a contract between maker and reader. s11-l01 supplies s11-state-machine; the reader checks s11-dispatch-loop. s11-l01 places its check where another wayfinder can repeat it. s11-l01 earns THE CARTOGRAPHER's trust through evidence, not luck. s11-l01 leaves one deliberate question for the next chart.</p>
<p>s11-l01 closes by stating what the program must preserve. s11-l01 names one input that could falsify s11-state-machine. s11-l01 names one output that confirms s11-dispatch-loop still belongs. s11-l01 runs the smallest route, inspects its trace, and annotates it. s11-l01 turns the states and controls chart into a RuneBound waypoint.</p>
<p>s11-l01 ends with a handoff to the next chart. s11-l01 carries s11-dispatch-loop forward after s11-state-machine earns trust. s11-l01 lets THE CARTOGRAPHER record the result in plain language. s11-l01 turns a clean rerun from a guess into a fact. s11-l01 lets the next wayfinder begin without hidden context.</p>
<pre><code>print("s11-l01 // The State Doors")</code></pre>
<div class="field-notes"><div class="fn-head">FIELD NOTES // S11-L01</div><p>s11-l01 <strong>Evidence.</strong> Record s11-state-machine; compare it with s11-dispatch-loop before advancing.</p><p>s11-l01 <strong>Repair.</strong> Change one cause, rerun the route, and preserve the explanation.</p></div>
'''

[[lessons.readings]]
label = "Python library // enum // The State Doors"
url = "https://docs.python.org/3/library/enum.html"

[[lessons.readings]]
label = "PyGame docs // display and event loop // The State Doors"
url = "https://www.pygame.org/docs/"

[[lessons.exercises]]
id = "s11-l01-e1"
type = "mc"
points = 14
prompt = '''
<p>What does the final dispatch loop decide each frame? Select the reading that keeps the menu and hud can render a world whose active owner is always known possible.</p>
'''
choices = ["which tile id should become solid forever","whether JSON can parse a save file","the sprite sheet's source rectangle only","The State Doors: keep s11-state-machine owned by the named boundary and verify the result before handoff s11-l01-e1."]
answer = 3
whyWrong = '''
The tempting routes confuse letting every system read every key and recreating boolean-flag spaghetti with the job this trial actually asks you to protect; each decoy moves ownership to the wrong part of the chart.
'''
hint = '''
Trace TITLE, PLAYING, PAUSED, INVENTORY, QUEST_LOG, COMBAT, and GAME_OVER as named destinations in the Bound World chart, then compare the the dispatch loop chooses which system receives input and update time with the evidence named in the prompt.
'''
explain = '''
The selected mark preserves the dispatch loop chooses which system receives input and update time and leaves title, playing, paused, inventory, quest_log, combat, and game_over as named destinations available for the next RuneBound handoff.
'''

[[lessons.exercises]]
id = "s11-l01-e2"
type = "write"
points = 30
prompt = '''
<p>Complete the bound world route and print exactly <code>RUNEBOUND S11 L01 SEAL</code>. Preserve the named data before adding the final observation.</p>
'''
starter = '''
route_mark = "state-doors"
print("survey pending")
# Add the chart seal after checking the route.
'''
expect = '''
RUNEBOUND S11 L01 SEAL
'''
solution = '''
route_mark = "state-doors"
print("RUNEBOUND S11 L01 SEAL")
'''
hint = '''
For s11-l01-e2, leave the route data intact and add only its final s11 observation; compare the starter output with the target before submitting.
'''

[[lessons.exercises]]
id = "s11-l01-e3"
type = "type"
points = 10
reps = 2
prompt = '''
<p>Retype this bound world evidence exactly. Keep title, playing, paused, inventory, quest_log, combat, and game_over as named destinations visible while you write. (Ctrl+Enter submits.)</p>
'''
code = '''
state = "TITLE"
if state == "TITLE":
    state = "PLAYING"
