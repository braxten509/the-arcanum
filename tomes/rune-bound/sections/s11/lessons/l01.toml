[[lessons.exercises]]
id = "s11-l01-e1"
type = "type"
points = 13
reps = 2
prompt = '''<p>Retype the canonical screen doors. Their names describe the active frame route, not a collection of simultaneous flags.</p>'''
code = '''
class ScreenState(Enum):
    TITLE = auto()
    PLAYING = auto()
    PAUSED = auto()
    INVENTORY = auto()
    QUEST_LOG = auto()
    COMBAT = auto()
    GAME_OVER = auto()
'''

[[lessons.exercises]]
id = "s11-l01-e2"
type = "mc"
points = 22
prompt = '''<p>Why must the <code>pygame.event.get()</code> pump stay outside the <code>PLAYING</code>-only branch?</p>'''
choices = ["It computes Player collision against solid tiles", "It converts world pixels into camera pixels", "It writes JSON before each frame", "It keeps QUIT and state-specific key presses responsive in every screen state"]
answer = 3
hint = '''Combat and overlays change gameplay input, but the window still needs its event queue serviced.''' 
whyWrong = '''Collision belongs to Player/TileMap, camera conversion belongs to rendering, and saving is a deliberate command. The event queue is frame-wide liveness work, including when gameplay movement is suppressed.''' 
explain = '''A finite state machine narrows which game route receives input; it does not suspend PyGame’s operating-system event duty.''' 

[[lessons.exercises]]
id = "s11-l01-e3"
type = "fill"
points = 24
prompt = '''<p>Restore the state entered after a lost combat result. This is an explicit screen transition, not a Boolean appended to the combat manager.</p>'''
code = '''
if active_combat.result == "lost":
    screen_state = ScreenState.____
'''
answer = "GAME_OVER"
hint = '''The terminal loss door is named in the enum and has its own input/draw route.''' 
whyWrong = '''Returning to PLAYING would permit movement with zero HP, while COMBAT is no longer active after a terminal result. The loss route must be a distinct state.''' 

[[lessons.exercises]]
id = "s11-l01-e4"
type = "write"
points = 36
prompt = '''<p>Model the dispatcher’s overlay replacement. Start in <code>PLAYING</code>; process the supplied I press, then the second I press. Print exactly <code>OPEN INVENTORY</code> and <code>CLOSE PLAYING</code>. Do not create an <code>inventory_open</code> Boolean.</p>'''
starter = '''
state = "PLAYING"

# Route the first and second I presses through the one state variable.
'''
expect = '''
OPEN INVENTORY
CLOSE PLAYING
'''
solution = '''
state = "PLAYING"

if state == "PLAYING":
    state = "INVENTORY"
print("OPEN", state)
if state == "INVENTORY":
    state = "PLAYING"
print("CLOSE", state)
'''
hint = '''On the first transition replace PLAYING with INVENTORY; on the second replace INVENTORY with PLAYING, then print each resulting state.''' 

[[lessons.exercises]]
id = "s11-l01-e5"
type = "text"
points = 20
prompt = '''<p>Which existing combat field must the dispatcher inspect after the encounter becomes inactive to distinguish a win, flee, and loss?</p>'''
answer = "result"
hint = '''s08 keeps this machine-readable field after <code>active</code> becomes false.''' 
whyWrong = '''<code>active</code> only says whether turns continue, and <code>message</code> is player-facing wording. The terminal outcome field is what selects the next screen route.''' 
