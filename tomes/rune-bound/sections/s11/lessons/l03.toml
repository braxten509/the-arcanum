[[lessons]]
id = "s11-l03"
title = "The Clean RuneBound Run"
teaches = ["s11-final-integration","s11-acceptance-proof"]
body = '''
<p>s11-l03 opens the states and controls chart through Clean. s11-l03 hears THE CARTOGRAPHER name s11-final-integration its first bearing. s11-l03 names one input, one change, and one output. s11-l03 gives s11-acceptance-proof a second mark for comparison. s11-l03 keeps the smallest successful example beside its route.</p>
<p>s11-l03 reads from left to right, then narrates state changes. s11-l03 keeps its states and controls clue concrete and observable. s11-l03 runs twice; the second pass challenges the first. s11-l03 records which owner moved when s11-final-integration shifted. s11-l03 borrows a neighboring trace without hiding its owner.</p>
<p>s11-l03 asks one decision to stand alone in the margin. s11-l03 keeps s11-acceptance-proof visible instead of hiding it behind polish. s11-l03 tests a friendly case and a sharp edge case. s11-l03 compares both traces so s11-final-integration has a witness. s11-l03 names the failure before choosing a repair.</p>
<p>s11-l03 treats each handoff as a contract between maker and reader. s11-l03 supplies s11-final-integration; the reader checks s11-acceptance-proof. s11-l03 places its check where another wayfinder can repeat it. s11-l03 earns THE CARTOGRAPHER's trust through evidence, not luck. s11-l03 leaves one deliberate question for the next chart.</p>
<p>s11-l03 closes by stating what the program must preserve. s11-l03 names one input that could falsify s11-final-integration. s11-l03 names one output that confirms s11-acceptance-proof still belongs. s11-l03 runs the smallest route, inspects its trace, and annotates it. s11-l03 turns the states and controls chart into a RuneBound waypoint.</p>
<p>s11-l03 ends with a handoff to the next chart. s11-l03 carries s11-acceptance-proof forward after s11-final-integration earns trust. s11-l03 lets THE CARTOGRAPHER record the result in plain language. s11-l03 turns a clean rerun from a guess into a fact. s11-l03 lets the next wayfinder begin without hidden context.</p>
<pre><code>print("s11-l03 // The Clean RuneBound Run")</code></pre>
<div class="field-notes"><div class="fn-head">FIELD NOTES // S11-L03</div><p>s11-l03 <strong>Evidence.</strong> Record s11-final-integration; compare it with s11-acceptance-proof before advancing.</p><p>s11-l03 <strong>Repair.</strong> Change one cause, rerun the route, and preserve the explanation.</p></div>
'''

[[lessons.readings]]
label = "Python library // enum // The Clean RuneBound Run"
url = "https://docs.python.org/3/library/enum.html"

[[lessons.readings]]
label = "PyGame docs // display and event loop // The Clean RuneBound Run"
url = "https://www.pygame.org/docs/"

