type = "mc"
points = 14
prompt = '''
<p>Which result closes the RuneBound commission? Select the reading that keeps runebound is ready to leave the study as a playable single-player artifact possible.</p>
'''
choices = ["a title screen appears with no playable route","The Clean RuneBound Run: keep s11-final-integration owned by the named boundary and verify the result before handoff s11-l03-e1.","the game prints a completion word without opening a window","one isolated combat function passes while save/load is untested"]
answer = 1
whyWrong = '''
The tempting routes confuse calling the world complete because each isolated screen works while the handoffs lose state with the job this trial actually asks you to protect; each decoy moves ownership to the wrong part of the chart.
'''
hint = '''
Trace ten tiles of movement, Elder dialogue, Slime combat, Potion pickup, quest progress, and a relaunch in the Bound World chart, then compare the integration is proven by behavior across state changes, not by a menu that merely opens with the evidence named in the prompt.
'''
explain = '''
The selected mark preserves integration is proven by behavior across state changes, not by a menu that merely opens and leaves ten tiles of movement, elder dialogue, slime combat, potion pickup, quest progress, and a relaunch available for the next RuneBound handoff.
'''

