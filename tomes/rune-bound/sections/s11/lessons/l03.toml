[[lessons]]
id = "s11-l03"
title = "The Final Traverse"
teaches = ["s11-complete-state-integration", "s11-regression-suite-shipping", "s11-end-to-end-save-proof", "tool-deliver"]
body = '''
<p>Now bind the routes into one finished traverse, wayfinder. In PLAYING, preserve the earlier execution order: held keys feed <code>player.handle_input(keys)</code>; <code>player.move_and_collide(tile_map, dt)</code> resolves world-pixel motion; pickups and dialogue/combat transitions record facts; <code>quest_log.update(player, combat_flags, dialogue_flags)</code> collects only new completions; then actors update, the camera follows the resolved Player, and world layers draw. When an overlap starts combat, set <code>active_combat</code> and enter <code>COMBAT</code> before accepting another movement route. The state dispatcher changes routing; it does not replace the owners s06–s10 already established.</p>
<p>COMBAT still pumps QUIT and routes only A/D/F to <code>active_combat.player_action</code>. When its result is <code>"won"</code>, retain the combat flag, remove the defeated Enemy from <code>actors</code>, update quests, show the existing one-time receipt, clear <code>active_combat</code>, and return to PLAYING. A flee clears it and returns to PLAYING with the enemy still present. A loss preserves the result for the final message, clears the manager, and enters GAME_OVER. The game-over panel must offer N for <code>reset_new_game()</code> and T for TITLE; it must not revive the old Player merely by repainting the HUD.</p>
<p>Move the development probes named in the plan—such as <code>test_tilemap.py</code> and <code>test_combat.py</code>—into <code>tests/</code> at the RuneBound project root. Do not leave their test calls in <code>main.py</code>; the shipped entry point begins with setup and TITLE. Keep tests runnable as regression evidence, for example <code>python3 tests/test_tilemap.py</code> and <code>python3 tests/test_combat.py</code>, and add a short README section naming each command and what contract it protects. These tests are intentionally shipped, not temporary debris.</p>
<pre><code>def draw_active_state(screen):
    if screen_state is ScreenState.TITLE:
        draw_title(screen)
    else:
        tile_map.render(screen, camera)
        draw_world_actors(screen)
        draw_hud(screen, player, quest_log, gold, render_text)
        if screen_state is ScreenState.PAUSED:
            draw_pause(screen)
        elif screen_state is ScreenState.INVENTORY:
            draw_inventory(screen, player.inventory, items, render_text)
        elif screen_state is ScreenState.QUEST_LOG:
            draw_quest_log(screen, quest_log, render_text)
        elif screen_state is ScreenState.COMBAT:
            draw_combat_panel(screen, active_combat)
        elif screen_state is ScreenState.GAME_OVER:
            draw_game_over(screen)</code></pre>
<p>Adapt names such as <code>draw_world_actors</code>, <code>draw_title</code>, and <code>draw_combat_panel</code> to your existing helpers; they label required routes rather than license duplicate renderers. Each screen-pixel UI helper remains above the world and before the sole flip. Do not render an old inventory/quest Boolean branch after this dispatch: the enum is now their single selector.</p>
<p>Perform the final proof from the RuneBound project folder. With no <code>save.json</code>, run <code>python3 main.py</code>, choose New Game, walk ten tiles east into the map edge, speak through three Elder nodes, defeat the Slime with two attacks while observing one enemy response, collect Potion, inspect I and Q, save, quit, relaunch, and choose Load Game. Confirm world position, HP, inventory order, quest completion, dialogue flags, combat flags, current map variant, and gold. Also choose Load with a missing and a malformed save, confirming TITLE remains usable. Record each command, observation, and precise repair or explicit no-repair in <code>README.md</code>.</p>
<p>Deliver the source project rather than an executable: hand over <code>main.py</code>, every named module, <code>data/</code>, <code>assets/</code>, <code>tests/</code>, and README together. On a second local Python + PyGame setup, follow README’s install command, run <code>python3 main.py</code>, and repeat the clean-launch and save/load proof. This verifies a real deliverable without silently expanding the course into PyInstaller packaging, which is outside RuneBound’s stated scope.</p>
<div class="callout"><strong>THE CARTOGRAPHER'S RULE:</strong> ship one entry route, one state selector, one presentation boundary, and regression tests that guard the old roads beneath the finished map.</div>
<div class="field-notes"><div class="fn-head">SURVEY // TRACE THE FIRST STEP</div><p>On a clean launch, the first visible state is TITLE—not a test loop, overworld, or stale save restore. If a state panel appears behind actors, repair only draw order; if it appears twice, find the duplicate call rather than adding another flip.</p></div>
'''

[[lessons.readings]]
label = "Python Docs // unittest basics"
url = "https://docs.python.org/3/library/unittest.html"

[[lessons.readings]]
label = "PyGame Docs // display.flip"
url = "https://www.pygame.org/docs/ref/display.html#pygame.display.flip"

[[lessons.exercises]]
id = "s11-l03-e1"
type = "mc"
points = 22
prompt = '''<p>After a combat manager finishes with <code>result == "won"</code>, which sequence preserves the established owners?</p>'''
choices = ["Let the HUD remove the enemy and invent a quest completion", "Set every screen state to PLAYING before recording the result", "Record the combat flag, remove the defeated enemy, update quests, clear the manager, then return to PLAYING", "Keep the manager active and poll arrow keys for attacks"]
answer = 2
hint = '''A win is a fact from CombatSystem; quest transitions are still evaluated by QuestLog, and the dispatcher chooses the next route only after that work.''' 
whyWrong = '''The HUD is read-only, skipping the combat fact loses quest evidence, and an inactive manager should not keep receiving actions. The ordered transition preserves each system’s narrow responsibility.''' 
explain = '''The dispatcher connects the systems without moving combat, quest, or UI ownership into one giant branch.''' 

[[lessons.exercises]]
id = "s11-l03-e2"
type = "fill"
points = 24
prompt = '''<p>Restore the final presentation call after the state-specific draw route. It remains exactly once per frame.</p>'''
code = '''
draw_active_state(screen)
pygame.display.____()
dt = clock.tick(FPS) / 1000.0
'''
answer = "flip"
hint = '''s03 established the display call that presents the completed back buffer.''' 
whyWrong = '''<code>update</code> is not this course’s presentation boundary and <code>blit</code> belongs to a Surface. One final flip preserves the established layer order.''' 

[[lessons.exercises]]
id = "s11-l03-e3"
type = "text"
points = 20
prompt = '''<p>Where do the retained tile-map and combat regression scripts belong in the shipped RuneBound project?</p>'''
answer = "tests/"
accept = ["tests"]
hint = '''They remain part of the project, but no longer execute from the game entry point.''' 
whyWrong = '''Leaving test loops in <code>main.py</code> changes the first executable route, and deleting them loses regression evidence. The project-root test directory isolates checks from the playable entry point.''' 

[[lessons.exercises]]
id = "s11-l03-e4"
type = "write"
points = 36
prompt = '''<p>Model the final combat transition. With the supplied outcome <code>"lost"</code>, set the screen state to <code>GAME_OVER</code> and print exactly <code>STATE GAME_OVER</code> and <code>MANAGER None</code>.</p>'''
starter = '''
combat_result = "lost"
screen_state = "COMBAT"
active_combat = "manager"

# Resolve the terminal result without returning to PLAYING.
'''
expect = '''
STATE GAME_OVER
MANAGER None
'''
solution = '''
combat_result = "lost"
screen_state = "COMBAT"
active_combat = "manager"

if combat_result == "lost":
    screen_state = "GAME_OVER"
    active_combat = None

print("STATE", screen_state)
print("MANAGER", active_combat)
'''
hint = '''The loss branch replaces COMBAT with GAME_OVER and clears the no-longer-active manager before both print calls.''' 

[[lessons.exercises]]
id = "s11-l03-e5"
type = "mc"
points = 22
prompt = '''<p>Which clean-launch observation proves the final entry route is correct?</p>'''
choices = ["A per-system test loop runs before PyGame initializes", "The game immediately restores any file without a menu choice", "The first visible screen is TITLE with New Game, Load Game, and Quit choices", "The inventory overlay is open before the event pump"]
answer = 2
hint = '''The finished artifact begins at a deliberate menu state, not a temporary development probe or implicit load.''' 
whyWrong = '''Test loops belong under tests, loading remains an explicit menu action, and overlays require a PLAYING transition. TITLE is the finished first screen and supplies the player’s first choice.''' 
explain = '''A clean start makes the state machine’s first executable promise visible and testable.''' 
