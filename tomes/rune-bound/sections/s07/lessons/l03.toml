[[lessons.exercises]]
id = "s07-l03-e1"
type = "mc"
points = 20
prompt = '''<p>Which responsibility is permitted inside <code>render_text</code>?</p>'''
choices = ['Change <code>DialogueTree.current_id</code> after drawing a choice', 'Subtract the world camera from an NPC rect', 'Poll held arrows for Player velocity', 'Create a text Surface and blit it at the supplied screen position']
answer = 3
hint = '''This helper is the UI painting boundary, not an input, world-coordinate, or conversation-routing boundary.''' 
whyWrong = '''Choice routing belongs to the event branch, camera subtraction belongs to world actor drawing, and held arrows belong to Player movement. The helper only turns current text into pixels on the UI surface.''' 
explain = '''Keeping rendering pure lets later quest hooks read a stable dialogue state rather than infer choices from pixels.''' 

[[lessons.exercises]]
id = "s07-l03-e2"
