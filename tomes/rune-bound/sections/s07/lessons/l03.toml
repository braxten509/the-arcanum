[[lessons.exercises]]
id = "s07-l03-e3"
type = "write"
points = 35
prompt = '''<p>Model dialogue selection in plain Python. The supplied node has three choices and starts at index 0. Define <code>move_selection(index, key, choice_count)</code> so “down” moves to 1, “up” returns to 0, and an “up” at 0 stays 0. Print exactly <code>DOWN 1</code>, <code>UP 0</code>, and <code>EDGE 0</code>.</p>'''
starter = '''
choice_count = 3
selected_choice = 0

# Define move_selection. Use it for down, up, then another up.
'''
expect = '''
DOWN 1
UP 0
EDGE 0
'''
solution = '''
choice_count = 3
selected_choice = 0

def move_selection(index, key, choice_count):
    if key == "down":
        return min(choice_count - 1, index + 1)
    if key == "up":
        return max(0, index - 1)
    return index

selected_choice = move_selection(selected_choice, "down", choice_count)
print("DOWN", selected_choice)
selected_choice = move_selection(selected_choice, "up", choice_count)
print("UP", selected_choice)
selected_choice = move_selection(selected_choice, "up", choice_count)
print("EDGE", selected_choice)
'''
hint = '''Use <code>min(choice_count - 1, index + 1)</code> for down and <code>max(0, index - 1)</code> for up.''' 

