[[lessons]]
id = "s07-l03"
title = "The Speaking Box"
teaches = ["s07-choice-routing", "s07-dialogue-render", "s07-dialogue-frame-integration"]
body = '''
<p>A dialogue tree becomes playable only when the frame route gives it both input and a visible surface. Add this module-level helper to <code>npc.py</code>. It converts a string into a new text Surface and blits it at screen pixels. Its <code>x</code> and <code>y</code> are deliberately screen coordinates because UI is pinned to the window, unlike actors and tiles. The helper returns nothing and never changes <code>current_id</code>, <code>selected_choice</code>, Player, or camera.</p>
<pre><code>def render_text(surface, text, x, y):
    font = pygame.font.Font(None, 28)
    image = font.render(text, True, (245, 229, 185))
    surface.blit(image, (x, y))


def render_dialogue(surface, dialogue_tree, selected_choice):
    box = pygame.Rect(24, surface.get_height() - 170,
                      surface.get_width() - 48, 146)
    pygame.draw.rect(surface, (25, 39, 31), box)
    pygame.draw.rect(surface, (232, 176, 64), box, 2)
    node = dialogue_tree.current_node()
    render_text(surface, node["text"], box.x + 16, box.y + 14)
    for index, choice in enumerate(node["choices"]):
        marker = ">" if index == selected_choice else " "
        render_text(surface, f"{marker} {choice['text']}", box.x + 16,
                    box.y + 54 + index * 28)</code></pre>
<p>Use a complete input branch in <code>main.py</code>. While <code>active_dialogue is not None</code>, Up and Down change only <code>selected_choice</code>, clamped to the current number of choices. Return calls <code>active_dialogue.choose(selected_choice)</code>. After a successful choice, reset selection to 0; if the new node has no choices, keep its farewell visible until the next E press closes it by setting <code>active_dialogue = None</code>. This keeps the terminal line readable rather than disappearing in the same key event.</p>
<pre><code>if event.type == pygame.KEYDOWN and active_dialogue is not None:
    choices = active_dialogue.current_node()["choices"]
    if event.key == pygame.K_UP and choices:
        selected_choice = max(0, selected_choice - 1)
    elif event.key == pygame.K_DOWN and choices:
        selected_choice = min(len(choices) - 1, selected_choice + 1)
    elif event.key == pygame.K_RETURN and choices:
        active_dialogue.choose(selected_choice)
        selected_choice = 0
    elif event.key == pygame.K_e and not choices:
        active_dialogue = None</code></pre>
<p>Keep drawing in the proven s06 order: event pump; Player input and collision; <code>actors.update(dt)</code>; resolved camera follow; clear; <code>tile_map.render(screen, camera)</code>; actor draws; then, only when active, <code>render_dialogue(screen, active_dialogue, selected_choice)</code>; one <code>pygame.display.flip()</code>. The box is painted after actors so it is readable, but its renderer is not a second display flip. Do not let arrow keys move Player while dialogue is active; make the Player input call an <code>elif active_dialogue is None</code> branch so arrows navigate choices instead.</p>
<p>Run <code>python3 main.py</code> from RuneBound’s project folder. Walk within 64 pixels of the Elder, press E, choose “Who are you?” with arrows and Return, then show the farewell. Press E once more at the terminal node to close the box. Relaunch and repeat. Record the command, the near/far observation, one selected response, and any smallest repair in <code>README.md</code>. No debug center print and no inline dialogue dictionary belongs in the shipped game.</p>
<div class="callout"><strong>THE CARTOGRAPHER'S RULE:</strong> input changes dialogue state; rendering reports that state; the frame presents every layer once.</div>
<div class="field-notes"><div class="fn-head">FIELD NOTES // EMPTY CHOICE LIST</div><p>Never compute <code>len(choices) - 1</code> for an empty list. The guards keep selection work out of terminal nodes. If text overlaps choices, adjust only the box layout constants; do not make the renderer choose a route to hide the overlap.</p></div>
'''

