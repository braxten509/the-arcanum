[[lessons]]
id = "s07-l03"
title = "The Speaking Box"
teaches = ["s07-choice-routing","s07-dialogue-render"]
body = '''
<p>s07-l03 opens the conversation and choice chart through Speaking. s07-l03 hears THE CARTOGRAPHER name s07-choice-routing its first bearing. s07-l03 names one input, one change, and one output. s07-l03 gives s07-dialogue-render a second mark for comparison. s07-l03 keeps the smallest successful example beside its route.</p>
<p>s07-l03 reads from left to right, then narrates state changes. s07-l03 keeps its conversation and choice clue concrete and observable. s07-l03 runs twice; the second pass challenges the first. s07-l03 records which owner moved when s07-choice-routing shifted. s07-l03 carries earlier <code>dialogue_tree</code> evidence into this chart.</p>
<p>s07-l03 asks one decision to stand alone in the margin. s07-l03 keeps s07-dialogue-render visible instead of hiding it behind polish. s07-l03 tests a friendly case and a sharp edge case. s07-l03 compares both traces so s07-choice-routing has a witness. s07-l03 names the failure before choosing a repair.</p>
<p>s07-l03 treats each handoff as a contract between maker and reader. s07-l03 supplies s07-choice-routing; the reader checks s07-dialogue-render. s07-l03 places its check where another wayfinder can repeat it. s07-l03 earns THE CARTOGRAPHER's trust through evidence, not luck. s07-l03 leaves one deliberate question for the next chart.</p>
<p>s07-l03 closes by stating what the program must preserve. s07-l03 names one input that could falsify s07-choice-routing. s07-l03 names one output that confirms s07-dialogue-render still belongs. s07-l03 runs the smallest route, inspects its trace, and annotates it. s07-l03 turns the conversation and choice chart into a RuneBound waypoint.</p>
<p>s07-l03 ends with a handoff to the next chart. s07-l03 carries s07-dialogue-render forward after s07-choice-routing earns trust. s07-l03 lets THE CARTOGRAPHER record the result in plain language. s07-l03 turns a clean rerun from a guess into a fact. s07-l03 lets the next wayfinder begin without hidden context.</p>
<pre><code>print("s07-l03 // The Speaking Box")</code></pre>
<div class="field-notes"><div class="fn-head">FIELD NOTES // S07-L03</div><p>s07-l03 <strong>Evidence.</strong> Record s07-choice-routing; compare it with s07-dialogue-render before advancing.</p><p>s07-l03 <strong>Repair.</strong> Change one cause, rerun the route, and preserve the explanation.</p></div>
'''

[[lessons.readings]]
label = "PyGame docs // keyboard and events // The Speaking Box"
url = "https://www.pygame.org/docs/ref/event.html"

[[lessons.readings]]
label = "Python library // JSON // The Speaking Box"
url = "https://docs.python.org/3/library/json.html"

[[lessons.exercises]]
id = "s07-l03-e1"
type = "mc"
points = 14
prompt = '''
<p>What is the dialogue renderer allowed to change during a frame? Select the reading that keeps quest hooks can later react to a stable dialogue flag instead of reading pixels possible.</p>
'''
choices = ["the JSON branch chosen by a key press","The Speaking Box: keep s07-choice-routing owned by the named boundary and verify the result before handoff s07-l03-e1.","the player's collision rectangle","the quest reward before a node is completed"]
answer = 1
whyWrong = '''
The tempting routes confuse letting drawing mutate the selected choice or losing the current node between frames with the job this trial actually asks you to protect; each decoy moves ownership to the wrong part of the chart.
'''
hint = '''
Trace choice order, next-node routing, and render_text() inside a surface-backed UI in the Speaking Tiles chart, then compare the input changes conversation state while rendering only displays the current state with the evidence named in the prompt.
'''
explain = '''
The selected mark preserves input changes conversation state while rendering only displays the current state and leaves choice order, next-node routing, and render_text() inside a surface-backed ui available for the next RuneBound handoff.
'''

[[lessons.exercises]]
id = "s07-l03-e2"
type = "write"
points = 30
prompt = '''
<p>Complete the speaking tiles route and print exactly <code>RUNEBOUND S07 L03 SEAL</code>. Preserve the named data before adding the final observation.</p>
'''
starter = '''
route_mark = "speaking-box"
print("survey pending")
# Add the chart seal after checking the route.
'''
expect = '''
RUNEBOUND S07 L03 SEAL
'''
solution = '''
route_mark = "speaking-box"
print("RUNEBOUND S07 L03 SEAL")
'''
hint = '''
For s07-l03-e2, leave the route data intact and add only its final s07 observation; compare the starter output with the target before submitting.
'''

[[lessons.exercises]]
id = "s07-l03-e3"
type = "type"
points = 10
reps = 2
prompt = '''
<p>Retype this speaking tiles evidence exactly. Keep choice order, next-node routing, and render_text() inside a surface-backed ui visible while you write. (Ctrl+Enter submits.)</p>
'''
code = '''
player_rect = (0, 0, 1, 1)
node_id = "greeting"
print(player_rect, node_id)
'''

[[lessons.exercises]]
id = "s07-l03-e4"
type = "fill"
points = 18
prompt = '''
<p>s07-l03-e4: restore the missing operation in the supplied code. Use its operands and the chart evidence to complete the route without renaming the owner.</p>
'''
code = '''
dialogue_box.____(screen, text)
'''
answer = "render_text"
hint = '''
Look at what must happen to dialogue_box.render_text(screen, node["text"]); choose the operation that performs that job rather than the one that merely inspects the result.
'''

[[lessons.exercises]]
id = "s07-l03-e5"
type = "text"
points = 16
prompt = '''
<p>s07-l03-e5: name the Python term for the specific unit requested by this chart. Supply the language term, not the surrounding story label.</p>
'''
answer = "next"
hint = '''
Recall the named boundary in The Speaking Box; the answer is the language term for that single job, not the larger game feature.
'''
