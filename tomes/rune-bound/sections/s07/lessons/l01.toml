prompt = '''<p>Which existing TileMap method returns the map id at a world-pixel location, or <code>None</code> beyond the map?</p>'''
answer = "tile_at"
accept = ["TileMap.tile_at", "tile_map.tile_at"]
hint = '''It is the s04 query that converts world pixels to row-first grid indexes internally.''' 
whyWrong = '''<code>render</code> paints the whole map and <code>is_solid</code> answers a Boolean. The requested method returns the tile identifier needed before reading its data definition.''' 

[[lessons.exercises]]
id = "s07-l01-e6"
type = "mc"
points = 20
prompt = '''<p>Which input boundary starts an NPC conversation without turning E into continuous movement?</p>'''
choices = ['Check <code>pygame.K_e</code> in the <code>KEYDOWN</code> event branch after confirming proximity', 'Put E into <code>Player.handle_input</code> and move the player once', 'Call <code>elder.can_interact(player)</code> every draw and always open dialogue', 'Use the camera list as the E-key state']
answer = 0
hint = '''A conversation start is one intentional action, unlike held arrows that repeatedly set velocity.''' 
whyWrong = '''Player’s held-key method owns movement, while drawing must not change dialogue state. A camera is only a viewport position. The event branch records the one press that asks to interact.''' 
explain = '''The proximity test makes interaction available; the E <code>KEYDOWN</code> makes the choice to begin it.''' 
