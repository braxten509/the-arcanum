[[lessons]]
id = "s07-l01"
title = "The Elder's Reach"
teaches = ["s07-npc-proximity","s07-interaction-trigger"]
body = '''
<p>s07-l01 opens the conversation and choice chart through Elder's. s07-l01 hears THE CARTOGRAPHER name s07-npc-proximity its first bearing. s07-l01 names one input, one change, and one output. s07-l01 gives s07-interaction-trigger a second mark for comparison. s07-l01 keeps the smallest successful example beside its route.</p>
<p>s07-l01 reads from left to right, then narrates state changes. s07-l01 keeps its conversation and choice clue concrete and observable. s07-l01 runs twice; the second pass challenges the first. s07-l01 records which owner moved when s07-npc-proximity shifted. s07-l01 carries earlier <code>dialogue_tree</code> evidence into this chart.</p>
<p>s07-l01 asks one decision to stand alone in the margin. s07-l01 keeps s07-interaction-trigger visible instead of hiding it behind polish. s07-l01 tests a friendly case and a sharp edge case. s07-l01 compares both traces so s07-npc-proximity has a witness. s07-l01 names the failure before choosing a repair.</p>
<p>s07-l01 treats each handoff as a contract between maker and reader. s07-l01 supplies s07-npc-proximity; the reader checks s07-interaction-trigger. s07-l01 places its check where another wayfinder can repeat it. s07-l01 earns THE CARTOGRAPHER's trust through evidence, not luck. s07-l01 leaves one deliberate question for the next chart.</p>
<p>s07-l01 closes by stating what the program must preserve. s07-l01 names one input that could falsify s07-npc-proximity. s07-l01 names one output that confirms s07-interaction-trigger still belongs. s07-l01 runs the smallest route, inspects its trace, and annotates it. s07-l01 turns the conversation and choice chart into a RuneBound waypoint.</p>
<p>s07-l01 ends with a handoff to the next chart. s07-l01 carries s07-interaction-trigger forward after s07-npc-proximity earns trust. s07-l01 lets THE CARTOGRAPHER record the result in plain language. s07-l01 turns a clean rerun from a guess into a fact. s07-l01 lets the next wayfinder begin without hidden context.</p>
<pre><code>print("s07-l01 // The Elder's Reach")</code></pre>
<div class="field-notes"><div class="fn-head">FIELD NOTES // S07-L01</div><p>s07-l01 <strong>Evidence.</strong> Record s07-npc-proximity; compare it with s07-interaction-trigger before advancing.</p><p>s07-l01 <strong>Repair.</strong> Change one cause, rerun the route, and preserve the explanation.</p></div>
'''

[[lessons.readings]]
label = "PyGame docs // keyboard and events // The Elder's Reach"
url = "https://www.pygame.org/docs/ref/event.html"

[[lessons.readings]]
label = "Python library // JSON // The Elder's Reach"
url = "https://docs.python.org/3/library/json.html"

[[lessons.exercises]]
id = "s07-l01-e1"
type = "text"
points = 16
prompt = '''
<p>s07-l01-e1: name the Python term for the specific unit requested by this chart. Supply the language term, not the surrounding story label.</p>
'''
answer = "distance"
hint = '''
Recall the named boundary in The Elder's Reach; the answer is the language term for that single job, not the larger game feature.
'''

[[lessons.exercises]]
id = "s07-l01-e2"
type = "fill"
points = 18
prompt = '''
<p>s07-l01-e2: restore the missing operation in the supplied code. Use its operands and the chart evidence to complete the route without renaming the owner.</p>
'''
code = '''
if elder_rect.____(player.rect.center):
'''
answer = "collidepoint"
hint = '''
Look at what must happen to distance(player.rect.center, elder.rect.center) <= 64; choose the operation that performs that job rather than the one that merely inspects the result.
'''

[[lessons.exercises]]
id = "s07-l01-e3"
type = "mc"
points = 14
prompt = '''
<p>What should begin an NPC conversation in RuneBound? Select the reading that keeps the conversation tree can start from a precise node instead of a global boolean possible.</p>
'''
choices = ["the NPC speaks every frame while the player is anywhere on the map","The Elder's Reach: keep s07-npc-proximity owned by the named boundary and verify the result before handoff s07-l01-e3.","a camera offset changes the dialogue node","the tile catalog stores the player's response key"]
answer = 1
whyWrong = '''
The tempting routes confuse opening dialogue merely because the player passed nearby or checking stale coordinates with the job this trial actually asks you to protect; each decoy moves ownership to the wrong part of the chart.
'''
hint = '''
Trace an interaction radius, a deliberate E press, and an NPC that inherits animated placement in the Speaking Tiles chart, then compare the being near a voice makes it available while the key press chooses when the conversation begins with the evidence named in the prompt.
'''
explain = '''
The selected mark preserves being near a voice makes it available while the key press chooses when the conversation begins and leaves an interaction radius, a deliberate e press, and an npc that inherits animated placement available for the next RuneBound handoff.
'''

[[lessons.exercises]]
id = "s07-l01-e4"
type = "write"
points = 30
prompt = '''
<p>Complete the speaking tiles route and print exactly <code>RUNEBOUND S07 L01 SEAL</code>. Preserve the named data before adding the final observation.</p>
'''
starter = '''
route_mark = "elder-reach"
print("survey pending")
# Add the chart seal after checking the route.
'''
expect = '''
RUNEBOUND S07 L01 SEAL
'''
solution = '''
