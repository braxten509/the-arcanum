[[lessons]]
id = "s07-l01"
title = "The Elder's Reach"
teaches = ["s07-npc-proximity", "s07-npc-walkable-placement", "s07-interaction-trigger"]
body = '''
<p>Wayfinder, a voice is an actor before it is a line of text. Create <code>npc.py</code> and make <code>NPC</code> inherit the existing <code>AnimatedSprite</code>; do not make a second sprite system. That inheritance keeps the supplied sheet, nested <code>frame_rects[row][column]</code>, animation timer, <code>image</code>, and world-pixel <code>rect</code> exactly where s05 established them. The camera remains outside both Player and NPC, and <code>actor.draw(screen, camera)</code> still does the only world-to-screen conversion.</p>
<p>Begin with this complete NPC class. Its constructor receives an already-loaded sheet, an NPC id, and a world-pixel position. A new <code>interaction_radius</code> belongs to the NPC because each NPC may later have a different reach. <code>distance_to</code> compares rectangle centers in world pixels. It deliberately does not use screen coordinates: a scrolling camera must not make an Elder appear nearer or farther away.</p>
<pre><code>import pygame

from sprites import AnimatedSprite


class NPC(AnimatedSprite):
    def __init__(self, sheet, npc_id, x, y, dialogue_path):
        super().__init__(sheet, x, y)
        self.npc_id = npc_id
        self.dialogue_path = dialogue_path
        self.interaction_radius = 64

    def distance_to(self, player):
        return pygame.Vector2(self.rect.center).distance_to(player.rect.center)

    def can_interact(self, player):
        return self.distance_to(player) &lt;= self.interaction_radius</code></pre>
<p>Before adding the Elder, validate the intended map position with s04’s existing query. In <code>main.py</code>, after <code>tile_map</code exists, ask <code>tile_map.tile_at(160, 160)</code>. If it returns <code>None</code> or its definition is solid, choose a nearby known non-solid cell and use that cell’s top-left world pixels for the NPC. This check uses the same lower-case tile id and nested lookup as <code>tile_types[tile_id]["solid"]</code>; it does not alter the CSV or pretend that a camera offset is a map coordinate.</p>
<p>Add the validated Elder to the existing group beside Player: <code>elder = NPC(sheet, "elder", 160, 160, "data/dialogue/elder.json")</code> and <code>actors.add(elder)</code>. In the event loop, an <code>event.type == pygame.KEYDOWN</code> check for <code>pygame.K_e</code> may begin a conversation only when <code>elder.can_interact(player)</code> is true. Held-key polling stays with Player movement; <code>KEYDOWN</code> is correct here because one press is one deliberate request, not continuous walking.</p>
<div class="callout"><strong>THE CARTOGRAPHER'S RULE:</strong> compare stable world rects for game rules; subtract the camera only when paint is due.</div>
<div class="field-notes"><div class="fn-head">FIELD NOTES // EDGE OF REACH</div><p>A distance of exactly 64 is eligible because <code>can_interact</code> uses <code>&lt;=</code>. At 65, E must do nothing. If the Elder seems to speak from across the map, print only the two world centers during this diagnosis, then remove that temporary print before shipping.</p></div>
'''

