prompt = '''<p>Retype the world-space interaction test. It is a one-time question asked when E is pressed, not a camera transform.</p>'''
code = '''
def can_interact(self, player):
    return self.distance_to(player) <= self.interaction_radius
'''

[[lessons.exercises]]
id = "s07-l01-e2"
type = "fill"
points = 22
prompt = '''<p>Restore the vector method that measures the distance between the Elder’s and Player’s world centers.</p>'''
code = '''
return pygame.Vector2(self.rect.center).____(player.rect.center)
'''
answer = "distance_to"
hint = '''The left Vector2 is the Elder’s center; call the method that returns its straight-line distance to Player’s center.''' 
whyWrong = '''<code>normalize</code> changes a vector’s length and <code>move_towards</code> changes a position. This method only measures the existing world-space separation.''' 

[[lessons.exercises]]
id = "s07-l01-e3"
type = "mc"
points = 20
prompt = '''<p>Why must the Elder’s placement check call <code>tile_map.tile_at</code> with world pixels rather than its camera-adjusted screen position?</p>'''
choices = ['<code>tile_at</code> needs sprite-sheet source rectangles', 'The map is stored in screen pixels after every flip', 'The camera changes what is painted, while tile identity and NPC placement stay in world space', 'Only a solid tile has a camera offset']
answer = 2
hint = '''Recall which coordinate system s04’s query accepts and which step subtracts the camera.''' 
whyWrong = '''Sprite-sheet rectangles select source artwork, not map cells. The map does not move when the viewport scrolls; supplying screen coordinates would inspect a different world tile as the camera changes.''' 
explain = '''NPC placement and collision are world rules. Rendering alone converts their stable world rects to screen positions.''' 

[[lessons.exercises]]
id = "s07-l01-e4"
type = "write"
points = 35
prompt = '''<p>Model an Elder’s interaction boundary without a window. Define <code>can_interact(elder_center, player_center, radius)</code> using Euclidean distance. With the supplied positions, print exactly <code>NEAR True</code> and <code>FAR False</code>. RuneBound receives E through PyGame events; this plain-Python lab isolates the geometry.</p>'''
starter = '''
elder_center = (160, 160)
near_player = (208, 160)
far_player = (225, 160)

# Define can_interact and report both positions using radius 64.
'''
expect = '''
NEAR True
FAR False
'''
solution = '''
import math

elder_center = (160, 160)
near_player = (208, 160)
far_player = (225, 160)

def can_interact(elder_center, player_center, radius):
    dx = elder_center[0] - player_center[0]
    dy = elder_center[1] - player_center[1]
    return math.hypot(dx, dy) <= radius

print("NEAR", can_interact(elder_center, near_player, 64))
print("FAR", can_interact(elder_center, far_player, 64))
'''
hint = '''Subtract x values and y values, pass them to <code>math.hypot</code>, then compare the result with the radius using <code>&lt;=</code>.'''

