[[lessons]]
id = "s07-l02"
title = "The JSON Conversation Tree"
teaches = ["s07-dialogue-json","s07-node-navigation"]
body = '''
<p>s07-l02 opens the conversation and choice chart through JSON. s07-l02 hears THE CARTOGRAPHER name s07-dialogue-json its first bearing. s07-l02 names one input, one change, and one output. s07-l02 gives s07-node-navigation a second mark for comparison. s07-l02 keeps the smallest successful example beside its route.</p>
<p>s07-l02 reads from left to right, then narrates state changes. s07-l02 keeps its conversation and choice clue concrete and observable. s07-l02 runs twice; the second pass challenges the first. s07-l02 records which owner moved when s07-dialogue-json shifted. s07-l02 carries earlier <code>dialogue_tree</code> evidence into this chart.</p>
<p>s07-l02 asks one decision to stand alone in the margin. s07-l02 keeps s07-node-navigation visible instead of hiding it behind polish. s07-l02 tests a friendly case and a sharp edge case. s07-l02 compares both traces so s07-dialogue-json has a witness. s07-l02 names the failure before choosing a repair.</p>
<p>s07-l02 treats each handoff as a contract between maker and reader. s07-l02 supplies s07-dialogue-json; the reader checks s07-node-navigation. s07-l02 places its check where another wayfinder can repeat it. s07-l02 earns THE CARTOGRAPHER's trust through evidence, not luck. s07-l02 leaves one deliberate question for the next chart.</p>
<p>s07-l02 closes by stating what the program must preserve. s07-l02 names one input that could falsify s07-dialogue-json. s07-l02 names one output that confirms s07-node-navigation still belongs. s07-l02 runs the smallest route, inspects its trace, and annotates it. s07-l02 turns the conversation and choice chart into a RuneBound waypoint.</p>
<p>s07-l02 ends with a handoff to the next chart. s07-l02 carries s07-node-navigation forward after s07-dialogue-json earns trust. s07-l02 lets THE CARTOGRAPHER record the result in plain language. s07-l02 turns a clean rerun from a guess into a fact. s07-l02 lets the next wayfinder begin without hidden context.</p>
<pre><code>print("s07-l02 // The JSON Conversation Tree")</code></pre>
<div class="field-notes"><div class="fn-head">FIELD NOTES // S07-L02</div><p>s07-l02 <strong>Evidence.</strong> Record s07-dialogue-json; compare it with s07-node-navigation before advancing.</p><p>s07-l02 <strong>Repair.</strong> Change one cause, rerun the route, and preserve the explanation.</p></div>
'''

[[lessons.readings]]
label = "PyGame docs // keyboard and events // The JSON Conversation Tree"
url = "https://www.pygame.org/docs/ref/event.html"

[[lessons.exercises]]
id = "s07-l02-e1"
type = "write"
points = 30
prompt = '''
<p>Complete the speaking tiles route and print exactly <code>RUNEBOUND S07 L02 SEAL</code>. Preserve the named data before adding the final observation.</p>
'''
starter = '''
route_mark = "dialogue-tree"
print("survey pending")
# Add the chart seal after checking the route.
'''
expect = '''
RUNEBOUND S07 L02 SEAL
'''
solution = '''
route_mark = "dialogue-tree"
print("RUNEBOUND S07 L02 SEAL")
'''
hint = '''
For s07-l02-e1, leave the route data intact and add only its final s07 observation; compare the starter output with the target before submitting.
'''

[[lessons.exercises]]
id = "s07-l02-e2"
type = "mc"
points = 14
prompt = '''
<p>Which part of a dialogue tree should hold the wording of an Elder's line? Select the reading that keeps s10 can reuse dialogue flags as one input to quest completion possible.</p>
'''
choices = ["the camera's pixel offset","The JSON Conversation Tree: keep s07-dialogue-json owned by the named boundary and verify the result before handoff s07-l02-e2.","the Player's velocity vector","the event queue's temporary list"]
answer = 1
whyWrong = '''
The tempting routes confuse hard-coding the next line in the renderer and making every branch share one ending with the job this trial actually asks you to protect; each decoy moves ownership to the wrong part of the chart.
'''
hint = '''
Trace DialogueTree that loads elder.json and moves from one node id to another in the Speaking Tiles chart, then compare the the data file owns the conversation graph while the class owns traversal rules with the evidence named in the prompt.
'''
explain = '''
The selected mark preserves the data file owns the conversation graph while the class owns traversal rules and leaves dialoguetree that loads elder.json and moves from one node id to another available for the next RuneBound handoff.
'''

[[lessons.exercises]]
id = "s07-l02-e3"
type = "text"
points = 16
prompt = '''
<p>s07-l02-e3: name the Python term for the specific unit requested by this chart. Supply the language term, not the surrounding story label.</p>
'''
answer = "next id"
hint = '''
Recall the named boundary in The JSON Conversation Tree; the answer is the language term for that single job, not the larger game feature.
'''

[[lessons.exercises]]
id = "s07-l02-e4"
type = "fill"
points = 18
prompt = '''
<p>s07-l02-e4: restore the missing operation in the supplied code. Use its operands and the chart evidence to complete the route without renaming the owner.</p>
'''
code = '''
tree = json.____(handle)
'''
answer = "load"
hint = '''
Look at what must happen to node = dialogue_tree.nodes[current_id]; choose the operation that performs that job rather than the one that merely inspects the result.
'''
