[[lessons]]
id = "s07-l02"
title = "The JSON Conversation Tree"
teaches = ["s07-dialogue-json", "s07-dialogue-tree-contract", "s07-node-navigation"]
body = '''
<p>Now give the Elder a chart that a writer can revise without opening <code>main.py</code>. A dialogue tree is a dictionary of nodes keyed by stable node ids. Each node owns its <code>text</code> and an ordered <code>choices</code> list; each choice owns visible <code>text</code> and the destination <code>next</code> node id. The file owns this conversation graph. <code>DialogueTree</code> owns loading and traversal. The renderer will later display state; it must never bury a branch in a drawing call.</p>
<p>Create <code>data/dialogue/elder.json</code>. This is the delivered source of dialogue. Do <strong>not</strong> leave an inline Python dictionary of Elder lines in <code>npc.py</code> or <code>main.py</code>: that lifecycle probe is retired now, replaced completely by this JSON file.</p>
<pre><code>{
  "start": "greeting",
  "nodes": {
    "greeting": {
      "text": "The north road is quiet, wayfinder.",
      "choices": [
        {"text": "Who are you?", "next": "name"},
        {"text": "I will continue.", "next": "farewell"}
      ]
    },
    "name": {"text": "I am the Elder who keeps this chart.", "choices": [{"text": "Farewell.", "next": "farewell"}]},
    "farewell": {"text": "Walk carefully.", "choices": []}
  }
}</code></pre>
<p>Add this complete class below <code>NPC</code> in <code>npc.py</code>. It repeats s02’s dictionary pattern honestly: <code>self.nodes[self.current_id]</code> is strict because an unknown destination is malformed authored data and should raise <code>KeyError</code> during a test. A valid choice index is selected from the visible ordered list. An empty <code>choices</code> list is a terminal node; <code>choose</code> returns <code>False</code> instead of inventing a next node.</p>
<pre><code>import json


class DialogueTree:
    def __init__(self, filename):
        with open(filename, encoding="utf-8") as handle:
            data = json.load(handle)
        self.nodes = data["nodes"]
        self.current_id = data["start"]

    def current_node(self):
        return self.nodes[self.current_id]

    def choose(self, choice_index):
        choices = self.current_node()["choices"]
        if choice_index &lt; 0 or choice_index &gt;= len(choices):
            return False
        self.current_id = choices[choice_index]["next"]
        return True</code></pre>
<p>When E passes l01’s proximity gate, construct <code>DialogueTree(elder.dialogue_path)</code>, store it as <code>active_dialogue</code> in <code>main.py</code>, and set <code>selected_choice = 0</code>. Main owns the currently open conversation because it will later decide which game state routes input. The NPC owns its path and identity. The tree owns only nodes and <code>current_id</code>. This separation lets s10 later inspect stable dialogue state instead of pixels.</p>
<div class="callout"><strong>THE CARTOGRAPHER'S RULE:</strong> a node id finds one named node; a choice index chooses one visible route from that node.</div>
<div class="field-notes"><div class="fn-head">FIELD NOTES // BAD DESTINATION</div><p>If a choice says <code>"next": "eldre"</code>, selecting it stores a bad id and the next <code>current_node()</code> raises <code>KeyError</code>. Repair the JSON id; do not replace strict lookup with <code>get</code> and silently render a blank conversation.</p></div>
'''

[[lessons.readings]]
label = "Python Docs // json.load"
url = "https://docs.python.org/3/library/json.html#json.load"

[[lessons.exercises]]
id = "s07-l02-e1"
type = "mc"
points = 20
prompt = '''<p>Where should the destination node id for “Who are you?” live?</p>'''
choices = ['In <code>main.py</code> beside the frame loop', 'Inside the selected choice dictionary under <code>"next"</code>', 'In the camera’s y coordinate', 'On <code>Player.velocity</code>']
answer = 1
hint = '''The graph’s authored edges sit beside the visible choice wording in the JSON data.''' 
whyWrong = '''The frame loop routes frames, the camera routes rendering, and velocity routes movement. A destination is conversation data, so it stays with that choice in the JSON tree.''' 
explain = '''A choice is both text for the player and an edge to the next named node.''' 

