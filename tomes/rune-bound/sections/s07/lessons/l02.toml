[[lessons.exercises]]
id = "s07-l02-e4"
type = "write"
points = 35
prompt = '''<p>Build a small data-driven tree in plain Python. Use the supplied <code>nodes</code>, start at <code>"greeting"</code>, select choice 0, and print exactly <code>NODE greeting</code> then <code>NEXT name</code>. This models JSON-loaded dictionaries; RuneBound itself reads <code>elder.json</code> with <code>json.load</code>.</p>'''
starter = '''
nodes = {
    "greeting": {"choices": [{"text": "Who are you?", "next": "name"}]},
    "name": {"choices": []},
}
current_id = "greeting"

# Look up the current node, follow its first choice, and print both ids.
'''
expect = '''
NODE greeting
NEXT name
'''
solution = '''
nodes = {
    "greeting": {"choices": [{"text": "Who are you?", "next": "name"}]},
    "name": {"choices": []},
}
current_id = "greeting"

node = nodes[current_id]
print("NODE", current_id)
current_id = node["choices"][0]["next"]
print("NEXT", current_id)
'''
hint = '''Use <code>nodes[current_id]</code>, then select the first choice with index 0 before reading its <code>"next"</code> field.''' 

