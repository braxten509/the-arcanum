[freestyle]
title = "THE WORKING 7 // Voices in the Tiles"
brief = '''
<p>Bind voices in the tiles into the growing RuneBound route. The commission must leave a runnable artifact whose behavior can be inspected from the named evidence.</p><ul><li>preserve the chart's data boundary and use the established names</li><li>prove the requested behavior with a repeatable run that ends at <code>RUNEBOUND S07 SEAL</code></li><li>write a short repair note explaining the nearest failure and the change that corrected it</li></ul>
'''
requires = ["s07-npc-proximity","s07-interaction-trigger","s07-dialogue-json","s07-node-navigation","s07-choice-routing","s07-dialogue-render"]
reward = 236
xray = '''
The Cartographer checks whether the speaking tiles commission keeps an interaction radius, a deliberate e press, and an npc that inherits animated placement under the right owner, shows quest hooks can later react to a stable dialogue flag instead of reading pixels, and leaves evidence beyond a decorative printout.
'''

[freestyle.badge]
id = "badge-s07"
name = "SPEAKING TILES SEALED"
desc = "Sealed the voices in the tiles chart with evidence another wayfinder can inspect."

[[freestyle.rubric]]
criterion = "Speaking Tiles runs"
weight = 25
desc = '''
The voices in the tiles artifact parses and runs with the chart's named behavior visible.
'''

[[freestyle.rubric]]
criterion = "Speaking Tiles keeps its boundary"
weight = 35
desc = '''
The commission keeps an interaction radius, a deliberate e press, and an npc that inherits animated placement and quest hooks can later react to a stable dialogue flag instead of reading pixels in the owners established by the lessons.
'''

[[freestyle.rubric]]
criterion = "Speaking Tiles shows proof"
weight = 25
desc = '''
The wayfinder supplies a repeatable observation, the exact s07 seal, and a useful comparison case rather than a one-time claim.
'''

[[freestyle.rubric]]
criterion = "Cartographer's repair note"
weight = 15
desc = '''
The explanation names the failing boundary, the evidence that exposed it, and the smallest correction that restored the route.
'''

