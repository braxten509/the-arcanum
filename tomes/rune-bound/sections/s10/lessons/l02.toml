[[lessons.exercises]]
id = "s10-l02-e2"
type = "fill"
points = 22
prompt = '''<p>Restore the dictionary call that treats an absent combat victory as false.</p>'''
code = '''
elif kind == "combat_won":
    satisfied = combat_flags.____(condition["flag"], False)
'''
answer = "get"
hint = '''This non-mutating lookup supplies <code>False</code> when the named victory has not been recorded.''' 
whyWrong = '''Square indexing would raise for an unrecorded victory and <code>pop</code> would delete evidence. The evaluator needs an optional read with a false default.''' 

[[lessons.exercises]]
id = "s10-l02-e3"
type = "mc"
points = 20
prompt = '''<p>What is the correct action when <code>shadow_key</code> changes from incomplete to complete?</p>'''
choices = ["Subtract the camera from the Player center", '''Call <code>tile_map.load("data/maps/overworld_unsealed.csv")</code> once''', "Append the variant CSV rows to the old grid", "Set every quest complete in the render function"]
answer = 1
hint = '''s04 gave TileMap a filename-based replacement operation; the transition is not a rendering concern.''' 
whyWrong = '''Camera math changes only presentation, appending creates a malformed combined world, and rendering must not mutate quest state. The completed transition selects the replacement CSV exactly once.''' 
explain = '''The existing loader replaces the grid with the unsealed quest variant.''' 

[[lessons.exercises]]
id = "s10-l02-e4"
type = "write"
points = 35
prompt = '''<p>Model the evaluator’s Shadow Key branch. With the supplied pack containing <code>shadow_key</code>, print exactly <code>COMPLETE True</code>. Keep the condition data separate from the Player-like object.</p>'''
starter = '''
from types import SimpleNamespace

condition = {"kind": "inventory_has", "item_id": "shadow_key"}
player = SimpleNamespace(inventory=SimpleNamespace(items=["potion", "shadow_key"]))

# Read the condition against the player's inventory and print the boolean.
'''
expect = '''
COMPLETE True
'''
solution = '''
from types import SimpleNamespace

condition = {"kind": "inventory_has", "item_id": "shadow_key"}
player = SimpleNamespace(inventory=SimpleNamespace(items=["potion", "shadow_key"]))

complete = condition["item_id"] in player.inventory.items
print("COMPLETE", complete)
'''
hint = '''Read <code>condition["item_id"]</code> and test membership in the nested <code>player.inventory.items</code> list.''' 
