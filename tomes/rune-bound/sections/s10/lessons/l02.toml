[[lessons]]
id = "s10-l02"
title = "The Condition Compass"
teaches = ["s10-condition-evaluator","s10-cross-system-facts"]
body = '''
<p>s10-l02 opens the quests and saves chart through Condition. s10-l02 hears THE CARTOGRAPHER name s10-condition-evaluator its first bearing. s10-l02 names one input, one change, and one output. s10-l02 gives s10-cross-system-facts a second mark for comparison. s10-l02 keeps the smallest successful example beside its route.</p>
<p>s10-l02 reads from left to right, then narrates state changes. s10-l02 keeps its quests and saves clue concrete and observable. s10-l02 runs twice; the second pass challenges the first. s10-l02 records which owner moved when s10-condition-evaluator shifted. s10-l02 borrows a neighboring trace without hiding its owner.</p>
<p>s10-l02 asks one decision to stand alone in the margin. s10-l02 keeps s10-cross-system-facts visible instead of hiding it behind polish. s10-l02 tests a friendly case and a sharp edge case. s10-l02 compares both traces so s10-condition-evaluator has a witness. s10-l02 names the failure before choosing a repair.</p>
<p>s10-l02 treats each handoff as a contract between maker and reader. s10-l02 supplies s10-condition-evaluator; the reader checks s10-cross-system-facts. s10-l02 places its check where another wayfinder can repeat it. s10-l02 earns THE CARTOGRAPHER's trust through evidence, not luck. s10-l02 leaves one deliberate question for the next chart.</p>
<p>s10-l02 closes by stating what the program must preserve. s10-l02 names one input that could falsify s10-condition-evaluator. s10-l02 names one output that confirms s10-cross-system-facts still belongs. s10-l02 runs the smallest route, inspects its trace, and annotates it. s10-l02 turns the quests and saves chart into a RuneBound waypoint.</p>
<p>s10-l02 ends with a handoff to the next chart. s10-l02 carries s10-cross-system-facts forward after s10-condition-evaluator earns trust. s10-l02 lets THE CARTOGRAPHER record the result in plain language. s10-l02 turns a clean rerun from a guess into a fact. s10-l02 lets the next wayfinder begin without hidden context.</p>
<pre><code>print("s10-l02 // The Condition Compass")</code></pre>
<div class="field-notes"><div class="fn-head">FIELD NOTES // S10-L02</div><p>s10-l02 <strong>Evidence.</strong> Record s10-condition-evaluator; compare it with s10-cross-system-facts before advancing.</p><p>s10-l02 <strong>Repair.</strong> Change one cause, rerun the route, and preserve the explanation.</p></div>
'''

[[lessons.readings]]
label = "Python library // dataclasses // The Condition Compass"
url = "https://docs.python.org/3/library/dataclasses.html"

[[lessons.readings]]
label = "Python library // JSON // The Condition Compass"
url = "https://docs.python.org/3/library/json.html"

[[lessons.exercises]]
id = "s10-l02-e1"
type = "write"
points = 30
prompt = '''
<p>Complete the ledger seal route and print exactly <code>RUNEBOUND S10 L02 SEAL</code>. Preserve the named data before adding the final observation.</p>
'''
starter = '''
route_mark = "condition-compass"
print("survey pending")
# Add the chart seal after checking the route.
'''
expect = '''
RUNEBOUND S10 L02 SEAL
'''
solution = '''
route_mark = "condition-compass"
print("RUNEBOUND S10 L02 SEAL")
'''
hint = '''
For s10-l02-e1, leave the route data intact and add only its final s10 observation; compare the starter output with the target before submitting.
'''

[[lessons.exercises]]
id = "s10-l02-e2"
type = "mc"
points = 14
prompt = '''
<p>Why should a quest evaluator inspect inventory and combat facts directly? Select the reading that keeps the questlog can update its rows whenever a fact changes possible.</p>
'''
choices = ["the journal text is the only source of truth","a condition can ignore the player because quests are visual","direct facts prevent objectives from having ids","The Condition Compass: keep s10-condition-evaluator owned by the named boundary and verify the result before handoff s10-l02-e2."]
answer = 3
whyWrong = '''
The tempting routes confuse marking a quest complete from a displayed label instead of the underlying state with the job this trial actually asks you to protect; each decoy moves ownership to the wrong part of the chart.
'''
hint = '''
Trace a predicate evaluator that reads player.inventory and recorded victory flags in the Ledger Seal chart, then compare the conditions inspect current facts while Quest owns whether the objective is complete with the evidence named in the prompt.
'''
explain = '''
The selected mark preserves conditions inspect current facts while quest owns whether the objective is complete and leaves a predicate evaluator that reads player.inventory and recorded victory flags available for the next RuneBound handoff.
'''

[[lessons.exercises]]
id = "s10-l02-e3"
type = "text"
points = 16
prompt = '''
<p>s10-l02-e3: name the Python term for the specific unit requested by this chart. Supply the language term, not the surrounding story label.</p>
'''
answer = "predicate"
hint = '''
Recall the named boundary in The Condition Compass; the answer is the language term for that single job, not the larger game feature.
'''

[[lessons.exercises]]
id = "s10-l02-e4"
type = "fill"
points = 18
prompt = '''
<p>s10-l02-e4: restore the missing operation in the supplied code. Use its operands and the chart evidence to complete the route without renaming the owner.</p>
'''
code = '''
has_key = inventory.____("shadow_key")
'''
answer = "contains"
hint = '''
Look at what must happen to inventory.contains("shadow_key"); choose the operation that performs that job rather than the one that merely inspects the result.
'''
