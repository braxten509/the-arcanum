[[lessons]]
id = "s10-l02"
title = "The Condition Compass"
teaches = ["s10-quest-condition-evaluator", "s10-quest-cross-system-facts"]
body = '''
<p>The ledger must evaluate facts, not remember a one-off event branch. In <code>quests.py</code>, add <code>Quest.check_completion(player, combat_flags, dialogue_flags)</code> directly inside the existing <code>Quest</code> class. It receives the Player only to read the established <code>player.inventory.items</code> list. Combat and dialogue arrive as explicit dictionaries: for example <code>{"wraith_defeated": True}</code> and <code>{"elder": "key_hint"}</code>. Neither dictionary is inferred from pixels or UI text.</p>
<pre><code>def check_completion(self, player, combat_flags, dialogue_flags):
    for condition in self.conditions:
        kind = condition["kind"]
        if kind == "inventory_has":
            satisfied = condition["item_id"] in player.inventory.items
        elif kind == "combat_won":
            satisfied = combat_flags.get(condition["flag"], False)
        elif kind == "dialogue_node":
            satisfied = dialogue_flags.get(condition["npc_id"]) == condition["node_id"]
        else:
            raise ValueError(f"Unknown quest condition: {kind}")
        if not satisfied:
            return False
    self.completed = True
    return True</code></pre>
<p>This replaces the phase-plan’s temporary inline <code>if "shadow_key" in player.inventory.items</code> completion path. Remove that inline completion assignment from <code>main.py</code>; call the method instead. An empty condition list completes because every required condition has been satisfied—use that only for deliberately automatic quests. Unknown kinds raise <code>ValueError</code> so malformed authored data is repaired, not silently accepted.</p>
<p>Use this method after resolved movement and after combat/dialogue state changes, before the UI draw layer. The call reads the Inventory’s ordered ids but never mutates them. For the quest-gated road, when <code>shadow_key_quest.check_completion(...)</code> first returns <code>True</code>, call the established <code>tile_map.load("data/maps/overworld_unsealed.csv")</code> once and retain that filename as current world state. <code>TileMap.load</code> replaces its grid from a CSV; it does not append a second map or accept camera coordinates.</p>
<div class="callout"><strong>THE CARTOGRAPHER'S RULE:</strong> conditions inspect canonical world facts; Quest alone records completion; the map loader replaces the world only on the one true transition.</div>
<div class="field-notes"><div class="fn-head">SURVEY // ONE TRANSITION</div><p>Guard the variant-map load with <code>if newly_completed:</code>. Loading the same CSV every frame wastes work and obscures the important edge: only the change from incomplete to complete opens the road.</p></div>
'''

[[lessons.readings]]
label = "Python Docs // membership tests"
url = "https://docs.python.org/3/reference/expressions.html#membership-test-operations"

