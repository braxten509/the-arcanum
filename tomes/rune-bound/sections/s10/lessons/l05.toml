[[lessons]]
id = "s10-l05"
title = "The Damaged Save Route"
teaches = ["s10-safe-load","s10-save-errors"]
body = '''
<p>s10-l05 opens the quests and saves chart through Damaged. s10-l05 hears THE CARTOGRAPHER name s10-safe-load its first bearing. s10-l05 names one input, one change, and one output. s10-l05 gives s10-save-errors a second mark for comparison. s10-l05 keeps the smallest successful example beside its route.</p>
<p>s10-l05 reads from left to right, then narrates state changes. s10-l05 keeps its quests and saves clue concrete and observable. s10-l05 runs twice; the second pass challenges the first. s10-l05 records which owner moved when s10-safe-load shifted. s10-l05 borrows a neighboring trace without hiding its owner.</p>
<p>s10-l05 asks one decision to stand alone in the margin. s10-l05 keeps s10-save-errors visible instead of hiding it behind polish. s10-l05 tests a friendly case and a sharp edge case. s10-l05 compares both traces so s10-safe-load has a witness. s10-l05 names the failure before choosing a repair.</p>
<p>s10-l05 treats each handoff as a contract between maker and reader. s10-l05 supplies s10-safe-load; the reader checks s10-save-errors. s10-l05 places its check where another wayfinder can repeat it. s10-l05 earns THE CARTOGRAPHER's trust through evidence, not luck. s10-l05 leaves one deliberate question for the next chart.</p>
<p>s10-l05 closes by stating what the program must preserve. s10-l05 names one input that could falsify s10-safe-load. s10-l05 names one output that confirms s10-save-errors still belongs. s10-l05 runs the smallest route, inspects its trace, and annotates it. s10-l05 turns the quests and saves chart into a RuneBound waypoint.</p>
<p>s10-l05 ends with a handoff to the next chart. s10-l05 carries s10-save-errors forward after s10-safe-load earns trust. s10-l05 lets THE CARTOGRAPHER record the result in plain language. s10-l05 turns a clean rerun from a guess into a fact. s10-l05 lets the next wayfinder begin without hidden context.</p>
<pre><code>print("s10-l05 // The Damaged Save Route")</code></pre>
<div class="field-notes"><div class="fn-head">FIELD NOTES // S10-L05</div><p>s10-l05 <strong>Evidence.</strong> Record s10-safe-load; compare it with s10-save-errors before advancing.</p><p>s10-l05 <strong>Repair.</strong> Change one cause, rerun the route, and preserve the explanation.</p></div>
'''

[[lessons.readings]]
label = "Python library // dataclasses // The Damaged Save Route"
url = "https://docs.python.org/3/library/dataclasses.html"

[[lessons.exercises]]
id = "s10-l05-e1"
type = "mc"
points = 14
prompt = '''
<p>What makes save recovery safe instead of silently destructive? Select the reading that keeps the final menu can tell the player whether it loaded, started new, or recovered safely possible.</p>
'''
choices = ["the loader ignores every exception and continues","The Damaged Save Route: keep s10-safe-load owned by the named boundary and verify the result before handoff s10-l05-e1.","the menu draws a save icon before parsing","a corrupt file is treated as a completed quest"]
answer = 1
whyWrong = '''
The tempting routes confuse catching every exception and hiding a real programming error behind a fresh game with the job this trial actually asks you to protect; each decoy moves ownership to the wrong part of the chart.
'''
hint = '''
Trace try/except around file access and JSON parsing with a safe default state in the Ledger Seal chart, then compare the file failure is handled at the save boundary while normal game state remains explicit with the evidence named in the prompt.
'''
explain = '''
The selected mark preserves file failure is handled at the save boundary while normal game state remains explicit and leaves try/except around file access and json parsing with a safe default state available for the next RuneBound handoff.
'''

[[lessons.exercises]]
id = "s10-l05-e2"
type = "text"
points = 16
prompt = '''
<p>s10-l05-e2: name the Python term for the specific unit requested by this chart. Supply the language term, not the surrounding story label.</p>
'''
answer = "except"
hint = '''
Recall the named boundary in The Damaged Save Route; the answer is the language term for that single job, not the larger game feature.
'''

[[lessons.exercises]]
id = "s10-l05-e3"
type = "fill"
points = 18
prompt = '''
<p>s10-l05-e3: restore the missing operation in the supplied code. Use its operands and the chart evidence to complete the route without renaming the owner.</p>
'''
code = '''
except ____:
    state = GameState.new()
'''
answer = "FileNotFoundError"
hint = '''
Look at what must happen to except (filenotfounderror, json.jsondecodeerror); choose the operation that performs that job rather than the one that merely inspects the result.
'''

[[lessons.exercises]]
id = "s10-l05-e4"
type = "type"
points = 10
reps = 2
prompt = '''
<p>Retype this ledger seal evidence exactly. Keep try/except around file access and json parsing with a safe default state visible while you write. (Ctrl+Enter submits.)</p>
'''
code = '''
try:
    raise FileNotFoundError("save missing")
except FileNotFoundError:
    print("new state")
'''
