[[lessons]]
id = "s10-l05"
title = "The Damaged Save Route"
teaches = ["s10-game-state-restore", "s10-safe-save-load"]
body = '''
<p>A mapmaker does not call a torn chart a destination. Add <code>GameState.from_dict(payload, player, quest_log)</code> as a class method in <code>state.py</code>. It first copies and validates every required value without touching the live world. Only after that staging pass succeeds does it patch the existing Player and QuestLog and return a new GameState wrapper. This order is essential: if a late key is missing, <code>load_game</code> must not leave a half-restored position or inventory behind. Its map filename later tells <code>main.py</code> exactly which CSV to pass to the established <code>TileMap.load</code>.</p>
<pre><code>@classmethod
def from_dict(cls, payload, player, quest_log):
    player_data = payload["player"]
    position = list(player_data["position"])
    stats = dict(player_data["stats"])
    inventory = list(player_data["inventory"])
    completed = dict(payload["quests"])
    dialogue_flags = dict(payload["dialogue_flags"])
    combat_flags = dict(payload["combat_flags"])
    map_filename = payload["map_filename"]

    if len(position) != 2 or not all(isinstance(value, (int, float)) for value in position):
        raise TypeError("position must contain two numbers")
    required_stats = {"hp", "max_hp", "attack", "defense"}
    if set(stats) != required_stats or not all(
            isinstance(value, int) for value in stats.values()):
        raise TypeError("stats do not match StatBlock")
    if not all(isinstance(item_id, str) for item_id in inventory):
        raise TypeError("inventory ids must be strings")
    if not isinstance(map_filename, str):
        raise TypeError("map filename must be text")
    for quest in quest_log.quests:
        if not isinstance(completed[quest.quest_id], bool):
            raise TypeError("quest completion must be boolean")

    player.rect.topleft = position
    for field, value in stats.items():
        setattr(player.stats, field, value)
    player.inventory.items = inventory
    for quest in quest_log.quests:
        quest.completed = completed[quest.quest_id]
    return cls(player, quest_log, dialogue_flags, combat_flags, map_filename)</code></pre>
<p>Then write <code>load_game(filename, player, quest_log)</code>. It catches only missing files, malformed JSON, and malformed required save keys: <code>FileNotFoundError</code>, <code>json.JSONDecodeError</code>, <code>KeyError</code>, and <code>TypeError</code>. Return <code>(None, "No usable save found.")</code> on those recovery cases; otherwise return <code>(state, "Save loaded.")</code>. Do not catch every <code>Exception</code>, because an implementation bug deserves a traceback during development.</p>
<pre><code>def load_game(filename, player, quest_log):
    try:
        with open(filename, encoding="utf-8") as handle:
            payload = json.load(handle)
        map_filename = payload["map_filename"]
        if not isinstance(map_filename, str):
            raise TypeError("map filename must be text")
        with open(map_filename, encoding="utf-8") as map_handle:
            if not any(line.strip() for line in map_handle):
                raise TypeError("map file is empty")
        return GameState.from_dict(payload, player, quest_log), "Save loaded."
    except (FileNotFoundError, json.JSONDecodeError, KeyError, TypeError):
        return None, "No usable save found."</code></pre>
<p>In the L-key event branch, call this loader. It verifies that the referenced map exists and is nonempty before <code>from_dict</code> changes live objects. Only if the returned state is not <code>None</code> assign it to <code>game_state</code>, call <code>tile_map.load(game_state.map_filename)</code>, and use the returned message for the timed screen-space toast. A missing, corrupt, or structurally incomplete save leaves the current running world intact. Test all three cases: use no <code>save.json</code>, put <code>{broken</code> in a disposable save, and remove one required key from otherwise valid JSON. Restore a valid save afterward.</p>
<div class="callout"><strong>THE CARTOGRAPHER'S RULE:</strong> loading restores canonical objects only after parsing succeeds; a damaged chart reports recovery and does not erase the world in hand.</div>
<div class="field-notes"><div class="fn-head">SURVEY // RESTORE, DO NOT REBUILD</div><p>Player keeps its AnimatedSprite, velocity, speed, and collision members because <code>from_dict</code> patches only durable fields. Likewise QuestLog keeps its authored definitions while the save supplies only their completion state.</p></div>
'''

[[lessons.readings]]
label = "Python Docs // JSONDecodeError"
url = "https://docs.python.org/3/library/json.html#json.JSONDecodeError"

[[lessons.exercises]]
id = "s10-l05-e1"
type = "mc"
points = 20
prompt = '''<p>What should happen after L finds malformed JSON in <code>save.json</code>?</p>'''
choices = ["Delete the player’s inventory and start over", "Silently catch every possible exception", "Keep the current world and return the recovery message", "Pass the broken text to <code>TileMap.load</code>"]
answer = 2
hint = '''A failed parse must not mutate the live Player or QuestLog before a valid state exists.''' 
whyWrong = '''Deleting state is destructive, a broad catch hides coding defects, and TileMap expects a CSV filename. The safe boundary leaves the current world alone and reports the recoverable failure.''' 
explain = '''Only a successfully reconstructed GameState is assigned back into the live frame route.''' 

[[lessons.exercises]]
id = "s10-l05-e2"
type = "fill"
points = 22
prompt = '''<p>Restore the exception class raised when a requested save path does not exist.</p>'''
code = '''
try:
    with open(filename, encoding="utf-8") as handle:
        payload = json.load(handle)
except ____:
    return None, "No usable save found."
'''
answer = "FileNotFoundError"
hint = '''This specific exception describes a missing path, distinct from JSON text that cannot parse.''' 
whyWrong = '''A missing file is not a key lookup or a malformed JSON document. Catching its named filesystem exception lets the caller keep the current session.''' 

[[lessons.exercises]]
id = "s10-l05-e3"
type = "text"
points = 18
prompt = '''<p>Which GameState method reconstructs durable fields from a parsed payload while preserving the existing Player and QuestLog objects?</p>'''
answer = "from_dict"
hint = '''It is the class method paired with the snapshot method introduced in the previous lesson.''' 
whyWrong = '''<code>to_dict</code> travels in the opposite direction, producing a portable snapshot. The restore boundary consumes that snapshot and patches canonical live owners.''' 

[[lessons.exercises]]
id = "s10-l05-e4"
type = "write"
points = 34
prompt = '''<p>Model safe parsing of one valid payload and one broken JSON string. Print exactly <code>VALID True</code> and <code>BROKEN False</code>.</p>'''
starter = '''
import json

valid_text = '{"quests": {"shadow_key": true}}'
broken_text = '{broken'

# Define can_load(text) to return True only when json.loads succeeds.
'''
expect = '''
VALID True
BROKEN False
'''
solution = '''
import json

valid_text = '{"quests": {"shadow_key": true}}'
broken_text = '{broken'

def can_load(text):
    try:
        json.loads(text)
        return True
    except json.JSONDecodeError:
        return False

print("VALID", can_load(valid_text))
print("BROKEN", can_load(broken_text))
'''
hint = '''Call <code>json.loads</code> in <code>try</code>, returning false only from an <code>except json.JSONDecodeError</code> branch.''' 
