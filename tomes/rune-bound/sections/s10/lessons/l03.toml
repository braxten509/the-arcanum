[[lessons]]
id = "s10-l03"
title = "The Active Journal"
teaches = ["s10-quest-log","s10-quest-ui"]
body = '''
<p>s10-l03 opens the quests and saves chart through Active. s10-l03 hears THE CARTOGRAPHER name s10-quest-log its first bearing. s10-l03 names one input, one change, and one output. s10-l03 gives s10-quest-ui a second mark for comparison. s10-l03 keeps the smallest successful example beside its route.</p>
<p>s10-l03 reads from left to right, then narrates state changes. s10-l03 keeps its quests and saves clue concrete and observable. s10-l03 runs twice; the second pass challenges the first. s10-l03 records which owner moved when s10-quest-log shifted. s10-l03 borrows a neighboring trace without hiding its owner.</p>
<p>s10-l03 asks one decision to stand alone in the margin. s10-l03 keeps s10-quest-ui visible instead of hiding it behind polish. s10-l03 tests a friendly case and a sharp edge case. s10-l03 compares both traces so s10-quest-log has a witness. s10-l03 names the failure before choosing a repair.</p>
<p>s10-l03 treats each handoff as a contract between maker and reader. s10-l03 supplies s10-quest-log; the reader checks s10-quest-ui. s10-l03 places its check where another wayfinder can repeat it. s10-l03 earns THE CARTOGRAPHER's trust through evidence, not luck. s10-l03 leaves one deliberate question for the next chart.</p>
<p>s10-l03 closes by stating what the program must preserve. s10-l03 names one input that could falsify s10-quest-log. s10-l03 names one output that confirms s10-quest-ui still belongs. s10-l03 runs the smallest route, inspects its trace, and annotates it. s10-l03 turns the quests and saves chart into a RuneBound waypoint.</p>
<p>s10-l03 ends with a handoff to the next chart. s10-l03 carries s10-quest-ui forward after s10-quest-log earns trust. s10-l03 lets THE CARTOGRAPHER record the result in plain language. s10-l03 turns a clean rerun from a guess into a fact. s10-l03 lets the next wayfinder begin without hidden context.</p>
<pre><code>print("s10-l03 // The Active Journal")</code></pre>
<div class="field-notes"><div class="fn-head">FIELD NOTES // S10-L03</div><p>s10-l03 <strong>Evidence.</strong> Record s10-quest-log; compare it with s10-quest-ui before advancing.</p><p>s10-l03 <strong>Repair.</strong> Change one cause, rerun the route, and preserve the explanation.</p></div>
'''

[[lessons.readings]]
label = "Python library // dataclasses // The Active Journal"
url = "https://docs.python.org/3/library/dataclasses.html"

[[lessons.exercises]]
id = "s10-l03-e1"
type = "mc"
points = 14
prompt = '''
<p>What should a QuestLog change when a condition becomes true? Select the reading that keeps save/load can serialize the same quest states that the journal displays possible.</p>
'''
choices = ["the map's tile colors","the player's sprite-sheet frame","the original quest definition text","The Active Journal: keep s10-quest-log owned by the named boundary and verify the result before handoff s10-l03-e1."]
answer = 3
whyWrong = '''
The tempting routes confuse recomputing completion only when q is pressed and showing stale progress with the job this trial actually asks you to protect; each decoy moves ownership to the wrong part of the chart.
'''
hint = '''
Trace ordered quest rows, completion checks, and a journal view that reports state in the Ledger Seal chart, then compare the the log coordinates many Quest records while each quest owns its own completion rule with the evidence named in the prompt.
'''
explain = '''
The selected mark preserves the log coordinates many quest records while each quest owns its own completion rule and leaves ordered quest rows, completion checks, and a journal view that reports state available for the next RuneBound handoff.
'''

[[lessons.exercises]]
id = "s10-l03-e2"
type = "write"
points = 30
prompt = '''
<p>Complete the ledger seal route and print exactly <code>RUNEBOUND S10 L03 SEAL</code>. Preserve the named data before adding the final observation.</p>
'''
starter = '''
route_mark = "active-journal"
print("survey pending")
# Add the chart seal after checking the route.
'''
expect = '''
RUNEBOUND S10 L03 SEAL
'''
solution = '''
route_mark = "active-journal"
print("RUNEBOUND S10 L03 SEAL")
'''
hint = '''
For s10-l03-e2, leave the route data intact and add only its final s10 observation; compare the starter output with the target before submitting.
'''

[[lessons.exercises]]
id = "s10-l03-e3"
type = "type"
points = 10
reps = 2
prompt = '''
<p>Retype this ledger seal evidence exactly. Keep ordered quest rows, completion checks, and a journal view that reports state visible while you write. (Ctrl+Enter submits.)</p>
'''
code = '''
active_quests = ["first_steps"]
print("active", len(active_quests))
'''

[[lessons.exercises]]
id = "s10-l03-e4"
type = "fill"
points = 18
prompt = '''
<p>s10-l03-e4: restore the missing operation in the supplied code. Use its operands and the chart evidence to complete the route without renaming the owner.</p>
'''
code = '''
quest_log.____(quest)
'''
answer = "append"
hint = '''
Look at what must happen to quest_log.append(quest) and quest_log.active(); choose the operation that performs that job rather than the one that merely inspects the result.
'''

[[lessons.exercises]]
id = "s10-l03-e5"
type = "text"
points = 16
prompt = '''
<p>s10-l03-e5: name the Python term for the specific unit requested by this chart. Supply the language term, not the surrounding story label.</p>
'''
answer = "active"
hint = '''
Recall the named boundary in The Active Journal; the answer is the language term for that single job, not the larger game feature.
'''
