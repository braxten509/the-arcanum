[[lessons]]
id = "s10-l03"
title = "The Active Journal"
teaches = ["s10-quest-log-update", "s10-quest-log-ui"]
body = '''
<p>One Quest is a marker; <code>QuestLog</code> is the ordered ledger the running game consults. Add it below <code>load_quests</code> in <code>quests.py</code>. The log owns its list of Quest records and the update pass. The first return value tells <code>main.py</code> which quests completed during this pass, letting the frame show a one-time reward banner without guessing from old screen text.</p>
<pre><code>class QuestLog:
    def __init__(self, quests):
        self.quests = quests

    def update(self, player, combat_flags, dialogue_flags):
        newly_completed = []
        for quest in self.quests:
            if not quest.completed and quest.check_completion(
                    player, combat_flags, dialogue_flags):
                newly_completed.append(quest)
        return newly_completed

    def active(self):
        return [quest for quest in self.quests if not quest.completed]</code></pre>
<p>Create <code>draw_quest_log(surface, quest_log, render_text)</code> in the same file. It draws the panel and calls the canonical s07 <code>render_text</code>; therefore every title, objective, and reward-banner coordinate is in screen pixels. It does not change completion, Player movement, or camera state. In <code>main.py</code>, add <code>quest_log_open = False</code> beside s09’s <code>inventory_open</code>. Toggle Q through the existing <code>pygame.KEYDOWN</code> branch only while combat is inactive. Draw the journal and a timed <code>quest_message</code> after world actors, dialogue, pickup toast, and inventory overlay, but before the sole final flip.</p>
<pre><code>def draw_quest_log(surface, quest_log, render_text):
    pygame.draw.rect(surface, (20, 24, 32), (70, 60, 660, 480))
    render_text(surface, "Quest Log", 100, 92)
    for index, quest in enumerate(quest_log.quests):
        status = "COMPLETE" if quest.completed else "ACTIVE"
        render_text(surface, f"[{status}] {quest.title}", 100, 132 + index * 58)
        render_text(surface, quest.objectives[0], 120, 160 + index * 58)</code></pre>
<p>When s07 advances the Elder tree, record <code>dialogue_flags[elder.npc_id] = active_dialogue.current_id</code> after a successful <code>choose</code>. That hook stores the data-state needed by <code>dialogue_node</code> conditions; it neither changes DialogueTree navigation nor writes flags from the renderer.</p>
<div class="callout"><strong>THE CARTOGRAPHER'S RULE:</strong> the journal updates facts after play changes them, then renders a screen-space report before the frame’s single flip.</div>
<div class="field-notes"><div class="fn-head">SURVEY // TEMPORARY PANEL MODE</div><p><code>quest_log_open</code> is a local display Boolean only through this chart. s11 must replace it with the GameState quest-log dispatcher while preserving Q access and the one-flip draw order.</p></div>
'''

[[lessons.readings]]
label = "PyGame Docs // draw"
url = "https://www.pygame.org/docs/ref/draw.html"

[[lessons.exercises]]
id = "s10-l03-e1"
type = "mc"
points = 20
prompt = '''<p>Why does <code>QuestLog.update</code> test <code>not quest.completed</code> before evaluating a quest?</p>'''
choices = ["To hide the title from the panel", "To change the order of Player inventory ids", "To make <code>render_text</code> use world coordinates", "To apply the reward banner only on the incomplete-to-complete transition"]
answer = 3
hint = '''The log needs a receipt for a new completion, not the same completed quest every frame.''' 
whyWrong = '''The guard has no camera, inventory-order, or font role. It prevents a completed Quest from being reported as newly complete on every update pass.''' 
explain = '''Only a transition belongs in <code>newly_completed</code>, so the message can remain a one-time receipt.''' 

[[lessons.exercises]]
id = "s10-l03-e2"
type = "fill"
points = 22
prompt = '''<p>Restore the list method that records a quest that changed during this update.</p>'''
code = '''
if not quest.completed and quest.check_completion(player, combat_flags, dialogue_flags):
    newly_completed.____(quest)
'''
answer = "append"
hint = '''The update pass preserves the order in which its quest list is traversed.''' 
whyWrong = '''<code>extend</code> expects an iterable of quests and <code>remove</code> would discard the transition. One Quest belongs at the end of this receipt list.''' 

[[lessons.exercises]]
id = "s10-l03-e3"
type = "text"
points = 18
prompt = '''<p>Which s07 helper should the journal receive to paint text at UI coordinates without creating another font renderer?</p>'''
answer = "render_text"
hint = '''It accepts a Surface, a string, and x/y values that are already screen pixels.''' 
whyWrong = '''<code>render_dialogue</code> owns a whole conversation box and <code>TileMap.render</code> paints ground. The journal needs the smaller established text-painting helper.''' 

[[lessons.exercises]]
id = "s10-l03-e4"
type = "write"
points = 34
prompt = '''<p>Given the two supplied records, select only incomplete quest ids in their original order. Print exactly <code>ACTIVE shadow_key, wraith</code>.</p>'''
starter = '''
quests = [
    {"id": "shadow_key", "completed": False},
    {"id": "road_open", "completed": True},
    {"id": "wraith", "completed": False},
]

# Build the active id list and print the journal line.
'''
expect = '''
ACTIVE shadow_key, wraith
'''
solution = '''
quests = [
    {"id": "shadow_key", "completed": False},
    {"id": "road_open", "completed": True},
    {"id": "wraith", "completed": False},
]

active_ids = [quest["id"] for quest in quests if not quest["completed"]]
print("ACTIVE", ", ".join(active_ids))
'''
hint = '''Use a comprehension that keeps records whose <code>"completed"</code> value is false, then join their ids.''' 
