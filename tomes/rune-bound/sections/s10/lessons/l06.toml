[[lessons]]
id = "s10-l06"
title = "The Reopened World"
teaches = ["s10-save-load-frame-route", "s10-persistence-verification"]
body = '''
<p>Bring the ledger into the frame route without breaking the routes already charted. Import <code>GameState</code>, <code>save_game</code>, and <code>load_game</code> in <code>main.py</code>; construct the QuestLog from <code>load_quests("data/quests.json")</code>, set <code>dialogue_flags = {}</code> and <code>combat_flags = {}</code>, then make <code>game_state = GameState(player, quest_log, dialogue_flags, combat_flags, "data/maps/overworld.csv")</code>. Keep s09’s item pickup after resolved movement. Follow it with <code>newly_completed = quest_log.update(player, combat_flags, dialogue_flags)</code>, using each new quest only once for its reward text and gated map transition.</p>
<pre><code>if event.type == pygame.KEYDOWN and event.key == pygame.K_s:
    save_game(game_state, "save.json")
    status_message = "Game saved."
elif event.type == pygame.KEYDOWN and event.key == pygame.K_l:
    restored_state, status_message = load_game("save.json", player, quest_log)
    if restored_state is not None:
        game_state = restored_state
        dialogue_flags = game_state.dialogue_flags
        combat_flags = game_state.combat_flags
        tile_map.load(game_state.map_filename)</code></pre>
<p>Place the status text with s07’s <code>render_text(screen, status_message, 16, 42)</code> while its timer is live. It is a UI receipt in screen pixels; it neither decides quest completion nor changes map data. Q opens the temporary journal panel from l03. I remains the temporary s09 inventory Boolean. Both are deliberately replaced in s11 by GameState dispatch, but their KEYDOWN access and the one final <code>pygame.display.flip()</code> must survive.</p>
<p>Run the real delivery from the RuneBound project folder: <code>python3 main.py</code>. Collect Shadow Key; verify Q reports the active/completed state and the north-road variant appears once. Press S. Close with X, reopen with the same command, press L, and verify the Player’s world location, HP, Shadow Key in I, quest progress in Q, and Elder dialogue flag. Then test L with no save and malformed JSON; both must show recovery without clearing the active session. Record command, valid relaunch evidence, recovery evidence, and any repair in <code>README.md</code>.</p>
<div class="callout"><strong>THE CARTOGRAPHER'S RULE:</strong> save and load are event routes; restoration precedes the next draw, and every UI layer still arrives before exactly one display flip.</div>
<div class="field-notes"><div class="fn-head">SURVEY // HANDOFF TO THE BOUND WORLD</div><p>s11 takes over <code>GameState.to_dict()</code> and <code>GameState.from_dict()</code>: New Game clears this state, Load Game restores it from the title screen, and state dispatch replaces the temporary inventory and quest-log Booleans without changing their controls.</p></div>
'''

[[lessons.readings]]
label = "PyGame Docs // event queue"
url = "https://www.pygame.org/docs/ref/event.html"

[[lessons.exercises]]
id = "s10-l06-e1"
type = "mc"
points = 20
prompt = '''<p>After a successful L-key restore, what must happen before the next world draw?</p>'''
choices = ["Flip the display twice so the old world disappears", "Reload the map using the restored map filename", "Recreate a second Player class", "Clear every dialogue flag"]
answer = 1
hint = '''The snapshot includes which quest-gated map is current, and s04’s loader replaces the grid from a filename.''' 
whyWrong = '''A second flip breaks the frame contract, duplicate types split ownership, and clearing flags loses saved dialogue progress. The restored CSV must replace the TileMap grid before drawing resumes.''' 
explain = '''Loading the saved map filename makes the visible world agree with restored quest state.''' 

[[lessons.exercises]]
id = "s10-l06-e2"
type = "fill"
points = 22
prompt = '''<p>Restore the event constant for the one-press save route.</p>'''
code = '''
if event.type == pygame.KEYDOWN and event.key == pygame.____:
    save_game(game_state, "save.json")
'''
answer = "K_s"
hint = '''PyGame letter constants use the key’s lowercase spelling after <code>K_</code>.''' 
whyWrong = '''<code>K_l</code> is the restore route and held-key polling would save every frame. This event branch assigns one press of S to writing the snapshot.''' 

[[lessons.exercises]]
id = "s10-l06-e3"
type = "text"
points = 18
prompt = '''<p>Name the two GameState methods s11 must integrate with its New Game and Load Game menu actions. Give them comma-separated in save-then-restore order.</p>'''
answer = "to_dict, from_dict"
accept = ["to_dict,from_dict"]
hint = '''One produces the portable JSON-shaped snapshot; the paired class method applies a parsed snapshot to canonical objects.''' 
whyWrong = '''<code>save_game</code> and <code>load_game</code> perform file I/O, but the future menu must preserve the lower-level snapshot and restoration contract itself.''' 

[[lessons.exercises]]
id = "s10-l06-e4"
type = "write"
points = 35
prompt = '''<p>Model a relaunch proof. Start with a snapshot containing position <code>[96, 64]</code>, Shadow Key, and a completed quest. Copy it through JSON text with <code>json.dumps</code>/<code>json.loads</code>, then print exactly <code>POS [96, 64]</code>, <code>KEY True</code>, and <code>QUEST True</code>.</p>'''
starter = '''
import json

snapshot = {
    "player": {"position": [96, 64], "inventory": ["shadow_key"]},
    "quests": {"shadow_key": True},
}

# Serialize, parse, and prove all three saved facts survived.
'''
expect = '''
POS [96, 64]
KEY True
QUEST True
'''
solution = '''
import json

snapshot = {
    "player": {"position": [96, 64], "inventory": ["shadow_key"]},
    "quests": {"shadow_key": True},
}

restored = json.loads(json.dumps(snapshot))
print("POS", restored["player"]["position"])
print("KEY", "shadow_key" in restored["player"]["inventory"])
print("QUEST", restored["quests"]["shadow_key"])
'''
hint = '''Pass <code>snapshot</code> to <code>json.dumps</code>, pass that text to <code>json.loads</code>, then inspect the nested fields.''' 
