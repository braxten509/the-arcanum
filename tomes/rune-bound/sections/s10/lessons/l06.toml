[[lessons]]
id = "s10-l06"
title = "The Reopened World"
teaches = ["s10-save-load-integration","s10-persistence-proof"]
body = '''
<p>s10-l06 opens the quests and saves chart through Reopened. s10-l06 hears THE CARTOGRAPHER name s10-save-load-integration its first bearing. s10-l06 names one input, one change, and one output. s10-l06 gives s10-persistence-proof a second mark for comparison. s10-l06 keeps the smallest successful example beside its route.</p>
<p>s10-l06 reads from left to right, then narrates state changes. s10-l06 keeps its quests and saves clue concrete and observable. s10-l06 runs twice; the second pass challenges the first. s10-l06 records which owner moved when s10-save-load-integration shifted. s10-l06 borrows a neighboring trace without hiding its owner.</p>
<p>s10-l06 asks one decision to stand alone in the margin. s10-l06 keeps s10-persistence-proof visible instead of hiding it behind polish. s10-l06 tests a friendly case and a sharp edge case. s10-l06 compares both traces so s10-save-load-integration has a witness. s10-l06 names the failure before choosing a repair.</p>
<p>s10-l06 treats each handoff as a contract between maker and reader. s10-l06 supplies s10-save-load-integration; the reader checks s10-persistence-proof. s10-l06 places its check where another wayfinder can repeat it. s10-l06 earns THE CARTOGRAPHER's trust through evidence, not luck. s10-l06 leaves one deliberate question for the next chart.</p>
<p>s10-l06 closes by stating what the program must preserve. s10-l06 names one input that could falsify s10-save-load-integration. s10-l06 names one output that confirms s10-persistence-proof still belongs. s10-l06 runs the smallest route, inspects its trace, and annotates it. s10-l06 turns the quests and saves chart into a RuneBound waypoint.</p>
<p>s10-l06 ends with a handoff to the next chart. s10-l06 carries s10-persistence-proof forward after s10-save-load-integration earns trust. s10-l06 lets THE CARTOGRAPHER record the result in plain language. s10-l06 turns a clean rerun from a guess into a fact. s10-l06 lets the next wayfinder begin without hidden context.</p>
<pre><code>print("s10-l06 // The Reopened World")</code></pre>
<div class="field-notes"><div class="fn-head">FIELD NOTES // S10-L06</div><p>s10-l06 <strong>Evidence.</strong> Record s10-save-load-integration; compare it with s10-persistence-proof before advancing.</p><p>s10-l06 <strong>Repair.</strong> Change one cause, rerun the route, and preserve the explanation.</p></div>
'''

[[lessons.readings]]
label = "Python library // dataclasses // The Reopened World"
url = "https://docs.python.org/3/library/dataclasses.html"

[[lessons.readings]]
label = "Python library // JSON // The Reopened World"
url = "https://docs.python.org/3/library/json.html"

[[lessons.exercises]]
id = "s10-l06-e1"
type = "fill"
points = 18
prompt = '''
<p>s10-l06-e1: restore the missing operation in the supplied code. Use its operands and the chart evidence to complete the route without renaming the owner.</p>
'''
code = '''
restored = GameState.____(payload)
'''
answer = "from_dict"
hint = '''
Look at what must happen to restored = gamestate.from_dict(payload); choose the operation that performs that job rather than the one that merely inspects the result.
'''

[[lessons.exercises]]
id = "s10-l06-e2"
type = "mc"
points = 14
prompt = '''
<p>What is the strongest save/load proof for RuneBound? Select the reading that keeps s11 can place load behind a title menu and prove the final world survives a relaunch possible.</p>
'''
choices = ["confirm only that a JSON file exists","reload the title text without entering play","check the player's color but not inventory or quests","The Reopened World: keep s10-save-load-integration owned by the named boundary and verify the result before handoff s10-l06-e2."]
answer = 3
whyWrong = '''
The tempting routes confuse saving only the current screen and mistaking a successful parse for a complete restore with the job this trial actually asks you to protect; each decoy moves ownership to the wrong part of the chart.
'''
hint = '''
Trace GameState.from_dict() restoring the same facts that to_dict() wrote in the Ledger Seal chart, then compare the save captures the whole contract while load validates and reconstructs it before play resumes with the evidence named in the prompt.
'''
explain = '''
The selected mark preserves save captures the whole contract while load validates and reconstructs it before play resumes and leaves gamestate.from_dict() restoring the same facts that to_dict() wrote available for the next RuneBound handoff.
'''

[[lessons.exercises]]
id = "s10-l06-e3"
type = "type"
points = 10
reps = 2
prompt = '''
<p>Retype this ledger seal evidence exactly. Keep gamestate.from_dict() restoring the same facts that to_dict() wrote visible while you write. (Ctrl+Enter submits.)</p>
'''
code = '''
before = {"position": [10, 4], "items": ["potion"]}
after = dict(before)
print(before == after)
'''

[[lessons.exercises]]
id = "s10-l06-e4"
type = "write"
points = 30
prompt = '''
<p>Complete the ledger seal route and print exactly <code>RUNEBOUND S10 L06 SEAL</code>. Preserve the named data before adding the final observation.</p>
'''
starter = '''
route_mark = "reopened-world"
print("survey pending")
# Add the chart seal after checking the route.
'''
expect = '''
RUNEBOUND S10 L06 SEAL
'''
solution = '''
route_mark = "reopened-world"
print("RUNEBOUND S10 L06 SEAL")
'''
hint = '''
For s10-l06-e4, leave the route data intact and add only its final s10 observation; compare the starter output with the target before submitting.
'''

[[lessons.exercises]]
id = "s10-l06-e5"
type = "text"
points = 16
prompt = '''
<p>s10-l06-e5: name the Python term for the specific unit requested by this chart. Supply the language term, not the surrounding story label.</p>
'''
answer = "from_dict"
hint = '''
Recall the named boundary in The Reopened World; the answer is the language term for that single job, not the larger game feature.
'''
