[[lessons]]
id = "s10-l04"
title = "The State Ledger in JSON"
teaches = ["s10-state-dict","s10-json-serialization"]
body = '''
<p>s10-l04 opens the quests and saves chart through State. s10-l04 hears THE CARTOGRAPHER name s10-state-dict its first bearing. s10-l04 names one input, one change, and one output. s10-l04 gives s10-json-serialization a second mark for comparison. s10-l04 keeps the smallest successful example beside its route.</p>
<p>s10-l04 reads from left to right, then narrates state changes. s10-l04 keeps its quests and saves clue concrete and observable. s10-l04 runs twice; the second pass challenges the first. s10-l04 records which owner moved when s10-state-dict shifted. s10-l04 borrows a neighboring trace without hiding its owner.</p>
<p>s10-l04 asks one decision to stand alone in the margin. s10-l04 keeps s10-json-serialization visible instead of hiding it behind polish. s10-l04 tests a friendly case and a sharp edge case. s10-l04 compares both traces so s10-state-dict has a witness. s10-l04 names the failure before choosing a repair.</p>
<p>s10-l04 treats each handoff as a contract between maker and reader. s10-l04 supplies s10-state-dict; the reader checks s10-json-serialization. s10-l04 places its check where another wayfinder can repeat it. s10-l04 earns THE CARTOGRAPHER's trust through evidence, not luck. s10-l04 leaves one deliberate question for the next chart.</p>
<p>s10-l04 closes by stating what the program must preserve. s10-l04 names one input that could falsify s10-state-dict. s10-l04 names one output that confirms s10-json-serialization still belongs. s10-l04 runs the smallest route, inspects its trace, and annotates it. s10-l04 turns the quests and saves chart into a RuneBound waypoint.</p>
<p>s10-l04 ends with a handoff to the next chart. s10-l04 carries s10-json-serialization forward after s10-state-dict earns trust. s10-l04 lets THE CARTOGRAPHER record the result in plain language. s10-l04 turns a clean rerun from a guess into a fact. s10-l04 lets the next wayfinder begin without hidden context.</p>
<pre><code>print("s10-l04 // The State Ledger in JSON")</code></pre>
<div class="field-notes"><div class="fn-head">FIELD NOTES // S10-L04</div><p>s10-l04 <strong>Evidence.</strong> Record s10-state-dict; compare it with s10-json-serialization before advancing.</p><p>s10-l04 <strong>Repair.</strong> Change one cause, rerun the route, and preserve the explanation.</p></div>
'''

[[lessons.readings]]
label = "Python library // dataclasses // The State Ledger in JSON"
url = "https://docs.python.org/3/library/dataclasses.html"

[[lessons.readings]]
label = "Python library // JSON // The State Ledger in JSON"
url = "https://docs.python.org/3/library/json.html"

[[lessons.exercises]]
id = "s10-l04-e1"
type = "type"
points = 10
reps = 2
prompt = '''
<p>Retype this ledger seal evidence exactly. Keep to_dict(), json.dumps(), and a payload containing position, stats, inventory, quests, and flags visible while you write. (Ctrl+Enter submits.)</p>
'''
code = '''
state_data = {"position": [10, 4], "gold": 12}
print(state_data["position"])
'''

[[lessons.exercises]]
id = "s10-l04-e2"
type = "text"
points = 16
prompt = '''
<p>s10-l04-e2: name the Python term for the specific unit requested by this chart. Supply the language term, not the surrounding story label.</p>
'''
answer = "to_dict"
hint = '''
Recall the named boundary in The State Ledger in JSON; the answer is the language term for that single job, not the larger game feature.
'''

[[lessons.exercises]]
id = "s10-l04-e3"
type = "write"
points = 30
prompt = '''
<p>Complete the ledger seal route and print exactly <code>RUNEBOUND S10 L04 SEAL</code>. Preserve the named data before adding the final observation.</p>
'''
starter = '''
route_mark = "state-ledger"
print("survey pending")
# Add the chart seal after checking the route.
'''
expect = '''
RUNEBOUND S10 L04 SEAL
'''
solution = '''
route_mark = "state-ledger"
print("RUNEBOUND S10 L04 SEAL")
'''
hint = '''
For s10-l04-e3, leave the route data intact and add only its final s10 observation; compare the starter output with the target before submitting.
'''

[[lessons.exercises]]
id = "s10-l04-e4"
type = "mc"
points = 14
prompt = '''
<p>Why serialize a dictionary rather than the live GameState object itself? Select the reading that keeps a later main menu can load the same snapshot without rebuilding it by hand possible.</p>
'''
choices = ["JSON can execute class methods while loading","a dictionary automatically preserves every private pointer","live objects are smaller because they contain no state","The State Ledger in JSON: keep s10-state-dict owned by the named boundary and verify the result before handoff s10-l04-e4."]
answer = 3
whyWrong = '''
The tempting routes confuse saving an object reference or omitting a nested fact that the final proof needs with the job this trial actually asks you to protect; each decoy moves ownership to the wrong part of the chart.
'''
hint = '''
Trace to_dict(), json.dumps(), and a payload containing position, stats, inventory, quests, and flags in the Ledger Seal chart, then compare the the live objects own behavior while the serialized dictionary owns a portable snapshot with the evidence named in the prompt.
'''
explain = '''
The selected mark preserves the live objects own behavior while the serialized dictionary owns a portable snapshot and leaves to_dict(), json.dumps(), and a payload containing position, stats, inventory, quests, and flags available for the next RuneBound handoff.
'''

[[lessons.exercises]]
id = "s10-l04-e5"
type = "fill"
points = 18
prompt = '''
<p>s10-l04-e5: restore the missing operation in the supplied code. Use its operands and the chart evidence to complete the route without renaming the owner.</p>
'''
code = '''
text = json.____(game_state.to_dict())
'''
answer = "dumps"
hint = '''
Look at what must happen to payload = game_state.to_dict(); choose the operation that performs that job rather than the one that merely inspects the result.
'''
