[[lessons]]
id = "s10-l04"
title = "The State Ledger in JSON"
teaches = ["s10-game-state-snapshot", "s10-json-save-write"]
body = '''
<p>Now bind the living world into a portable record. Create <code>state.py</code>; it is the canonical save boundary. <code>GameState</code> holds references to the live Player, QuestLog, dialogue flags, combat flags, and the current map filename. Its <code>to_dict()</code> copies only JSON-shaped values: Player world-pixel position, <code>player.stats.__dict__</code>, ordered inventory ids, completion flags keyed by <code>quest_id</code>, flags, and map filename. The s02 round-trip taught why this is a snapshot: <code>__dict__</code> is data, not a reconstructed object.</p>
<pre><code>class GameState:
    def __init__(self, player, quest_log, dialogue_flags, combat_flags, map_filename):
        self.player = player
        self.quest_log = quest_log
        self.dialogue_flags = dialogue_flags
        self.combat_flags = combat_flags
        self.map_filename = map_filename

    def to_dict(self):
        return {
            "player": {
                "position": [self.player.rect.x, self.player.rect.y],
                "stats": self.player.stats.__dict__,
                "inventory": list(self.player.inventory.items),
            },
            "quests": {quest.quest_id: quest.completed for quest in self.quest_log.quests},
            "dialogue_flags": dict(self.dialogue_flags),
            "combat_flags": dict(self.combat_flags),
            "map_filename": self.map_filename,
        }</code></pre>
<p>Add <code>save_game(state, filename)</code> below the class. It writes <code>state.to_dict()</code> through <code>json.dump(..., indent=2)</code>. In <code>main.py</code>, create one GameState after Player, QuestLog, and the flag dictionaries exist. S in the existing KEYDOWN pump calls <code>save_game(game_state, "save.json")</code> and starts a brief screen-space message. Saving must not move the event pump, duplicate display flips, or serialize camera offsets: Player’s rect is already world pixels.</p>
<pre><code>def save_game(state, filename):
    with open(filename, "w", encoding="utf-8") as handle:
        json.dump(state.to_dict(), handle, indent=2)</code></pre>
<p>Inspect <code>save.json</code> after one save. It should contain JSON arrays for position and inventory, an object for stats, and the literal <code>"shadow_key"</code> when collected. Never write <code>json.dumps(game_state)</code>: the live object includes references and behavior that JSON cannot encode.</p>
<div class="callout"><strong>THE CARTOGRAPHER'S RULE:</strong> GameState names what survives a relaunch; JSON stores only that explicit dictionary, never live PyGame objects.</div>
<div class="field-notes"><div class="fn-head">SURVEY // SAVE LOCATION</div><p>Run <code>python3 main.py</code> from the RuneBound project folder so the relative <code>save.json</code> location is predictable. s11 will invoke the same save boundary from its title menu.</p></div>
'''

[[lessons.readings]]
label = "Python Docs // json.dump"
url = "https://docs.python.org/3/library/json.html#json.dump"

[[lessons.exercises]]
id = "s10-l04-e1"
type = "type"
points = 12
reps = 2
prompt = '''<p>Retype the Player portion of the save snapshot. Its coordinates remain world pixels.</p>'''
code = '''
"player": {
    "position": [self.player.rect.x, self.player.rect.y],
    "stats": self.player.stats.__dict__,
    "inventory": list(self.player.inventory.items),
},
'''

[[lessons.exercises]]
id = "s10-l04-e2"
type = "fill"
points = 22
prompt = '''<p>Restore the JSON writer that sends the snapshot to the open save-file handle.</p>'''
code = '''
with open(filename, "w", encoding="utf-8") as handle:
    json.____(state.to_dict(), handle, indent=2)
'''
answer = "dump"
hint = '''This JSON function writes a Python value to a file handle; its string-producing sibling has an extra <code>s</code>.''' 
whyWrong = '''<code>dumps</code> returns JSON text rather than writing to the handle, and <code>load</code> reads instead. The save boundary must emit the structured snapshot.''' 

[[lessons.exercises]]
id = "s10-l04-e3"
type = "mc"
points = 20
prompt = '''<p>Which value belongs in the saved position field?</p>'''
choices = ["The camera-subtracted screen position", "The sprite sheet source rectangle", "The most recent Q-key event", "The Player rect’s x and y world pixels"]
answer = 3
hint = '''Tile lookup, collision, and Player rect ownership have used world coordinates since s06.''' 
whyWrong = '''Camera and sprite source values describe presentation, while an event is transient input. Restoring must put the Player back into the same world location.''' 
explain = '''The live Player rect is the canonical world-space position, so its x/y values survive the save.''' 

[[lessons.exercises]]
id = "s10-l04-e4"
type = "write"
points = 35
prompt = '''<p>Build a JSON-shaped snapshot from the supplied state values and print exactly <code>POS [64, 96]</code> and <code>KEY True</code>. Use a dictionary rather than serializing a custom object.</p>'''
starter = '''
position = [64, 96]
inventory = ["potion", "shadow_key"]
completed = {"shadow_key": True}

# Build the snapshot, then read back its position and completion flag.
'''
expect = '''
POS [64, 96]
KEY True
'''
solution = '''
position = [64, 96]
inventory = ["potion", "shadow_key"]
completed = {"shadow_key": True}

snapshot = {"player": {"position": position, "inventory": inventory}, "quests": completed}
print("POS", snapshot["player"]["position"])
print("KEY", snapshot["quests"]["shadow_key"])
'''
hint = '''Nest the position and inventory under <code>"player"</code>, and place the completion mapping under <code>"quests"</code>.''' 
