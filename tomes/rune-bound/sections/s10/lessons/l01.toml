[[lessons]]
id = "s10-l01"
title = "The Quest Contract"
teaches = ["s10-quest-definition","s10-objective-state"]
body = '''
<p>s10-l01 opens the quests and saves chart through Quest. s10-l01 hears THE CARTOGRAPHER name s10-quest-definition its first bearing. s10-l01 names one input, one change, and one output. s10-l01 gives s10-objective-state a second mark for comparison. s10-l01 keeps the smallest successful example beside its route.</p>
<p>s10-l01 reads from left to right, then narrates state changes. s10-l01 keeps its quests and saves clue concrete and observable. s10-l01 runs twice; the second pass challenges the first. s10-l01 records which owner moved when s10-quest-definition shifted. s10-l01 borrows a neighboring trace without hiding its owner.</p>
<p>s10-l01 asks one decision to stand alone in the margin. s10-l01 keeps s10-objective-state visible instead of hiding it behind polish. s10-l01 tests a friendly case and a sharp edge case. s10-l01 compares both traces so s10-quest-definition has a witness. s10-l01 names the failure before choosing a repair.</p>
<p>s10-l01 treats each handoff as a contract between maker and reader. s10-l01 supplies s10-quest-definition; the reader checks s10-objective-state. s10-l01 places its check where another wayfinder can repeat it. s10-l01 earns THE CARTOGRAPHER's trust through evidence, not luck. s10-l01 leaves one deliberate question for the next chart.</p>
<p>s10-l01 closes by stating what the program must preserve. s10-l01 names one input that could falsify s10-quest-definition. s10-l01 names one output that confirms s10-objective-state still belongs. s10-l01 runs the smallest route, inspects its trace, and annotates it. s10-l01 turns the quests and saves chart into a RuneBound waypoint.</p>
<p>s10-l01 ends with a handoff to the next chart. s10-l01 carries s10-objective-state forward after s10-quest-definition earns trust. s10-l01 lets THE CARTOGRAPHER record the result in plain language. s10-l01 turns a clean rerun from a guess into a fact. s10-l01 lets the next wayfinder begin without hidden context.</p>
<pre><code>print("s10-l01 // The Quest Contract")</code></pre>
<div class="field-notes"><div class="fn-head">FIELD NOTES // S10-L01</div><p>s10-l01 <strong>Evidence.</strong> Record s10-quest-definition; compare it with s10-objective-state before advancing.</p><p>s10-l01 <strong>Repair.</strong> Change one cause, rerun the route, and preserve the explanation.</p></div>
'''

[[lessons.readings]]
label = "Python library // dataclasses // The Quest Contract"
url = "https://docs.python.org/3/library/dataclasses.html"

[[lessons.exercises]]
id = "s10-l01-e1"
type = "text"
points = 16
prompt = '''
<p>s10-l01-e1: name the Python term for the specific unit requested by this chart. Supply the language term, not the surrounding story label.</p>
'''
answer = "objective"
hint = '''
Recall the named boundary in The Quest Contract; the answer is the language term for that single job, not the larger game feature.
'''

[[lessons.exercises]]
id = "s10-l01-e2"
type = "fill"
points = 18
prompt = '''
<p>s10-l01-e2: restore the missing operation in the supplied code. Use its operands and the chart evidence to complete the route without renaming the owner.</p>
'''
code = '''
quest = ____ (id="first_steps")
'''
answer = "Quest"
hint = '''
Look at what must happen to quest(id="first_steps", objectives=["find the shadow key"]); choose the operation that performs that job rather than the one that merely inspects the result.
'''

[[lessons.exercises]]
id = "s10-l01-e3"
type = "mc"
points = 14
prompt = '''
<p>What belongs in a data-driven quest definition? Select the reading that keeps the condition evaluator can read inventory, dialogue, and combat facts through one contract possible.</p>
'''
choices = ["the current screen pixels and frame timer","a duplicate copy of every inventory method","the player's next keyboard event only","The Quest Contract: keep s10-quest-definition owned by the named boundary and verify the result before handoff s10-l01-e3."]
answer = 3
whyWrong = '''
The tempting routes confuse encoding quest progress in a one-off if statement that cannot be reused with the job this trial actually asks you to protect; each decoy moves ownership to the wrong part of the chart.
'''
hint = '''
Trace Quest data with an id, objective text, condition kind, and reward in the Ledger Seal chart, then compare the the definition describes a promise while the evaluator decides whether its facts are true with the evidence named in the prompt.
'''
explain = '''
The selected mark preserves the definition describes a promise while the evaluator decides whether its facts are true and leaves quest data with an id, objective text, condition kind, and reward available for the next RuneBound handoff.
'''

[[lessons.exercises]]
id = "s10-l01-e4"
type = "write"
points = 30
prompt = '''
<p>Complete the ledger seal route and print exactly <code>RUNEBOUND S10 L01 SEAL</code>. Preserve the named data before adding the final observation.</p>
'''
starter = '''
route_mark = "quest-contract"
print("survey pending")
# Add the chart seal after checking the route.
'''
expect = '''
RUNEBOUND S10 L01 SEAL
'''
solution = '''
route_mark = "quest-contract"
print("RUNEBOUND S10 L01 SEAL")
'''
hint = '''
For s10-l01-e4, leave the route data intact and add only its final s10 observation; compare the starter output with the target before submitting.
'''

[[lessons.exercises]]
id = "s10-l01-e5"
type = "type"
points = 10
reps = 2
prompt = '''
<p>Retype this ledger seal evidence exactly. Keep quest data with an id, objective text, condition kind, and reward visible while you write. (Ctrl+Enter submits.)</p>
'''
code = '''
inventory = ["potion"]
quest_id = "first_steps"
print(inventory, quest_id)
'''

