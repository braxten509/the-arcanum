[[lessons]]
id = "s10-l01"
title = "The Quest Contract"
teaches = ["s10-quest-record", "s10-quest-data-loading"]
body = '''
<p>Wayfinder, a quest is not a sentence painted over the map. It is a record whose facts can be checked long after the player leaves the Elder. Create <code>data/quests.json</code> as the sole quest-definition source. Each record has a stable lower-case <code>id</code>, a player-facing <code>title</code>, ordered <code>objectives</code>, an ordered <code>conditions</code> list, and a <code>reward</code>. Start with <code>shadow_key</code>: its condition is <code>{"kind": "inventory_has", "item_id": "shadow_key"}</code>. The item id deliberately matches the literal id s09 puts in <code>player.inventory.items</code>.</p>
<pre><code>[
  {
    "id": "shadow_key",
    "title": "The Locked North Road",
    "objectives": ["Find the Shadow Key"],
    "conditions": [{"kind": "inventory_has", "item_id": "shadow_key"}],
    "reward": "The north road opens"
  }
]</code></pre>
<p>Create the canonical <code>quests.py</code>. A <code>Quest</code> owns authored fields plus its changing <code>completed</code> flag; it does not reach into Player or draw itself. <code>load_quests(filename)</code> opens the JSON file and constructs records. This is the same data boundary as s07’s <code>DialogueTree</code>: JSON chooses stable keys and Python gives them behavior. Do not leave an inline Python list of quests beside this loader.</p>
<pre><code>import json
from dataclasses import dataclass


@dataclass
class Quest:
    quest_id: str
    title: str
    objectives: list
    conditions: list
    reward: str
    completed: bool = False


def load_quests(filename):
    with open(filename, encoding="utf-8") as handle:
        records = json.load(handle)
    return [Quest(record["id"], record["title"], record["objectives"],
                  record["conditions"], record["reward"])
            for record in records]</code></pre>
<p>Run the small inspection before touching the frame route: <code>python3 -c "from quests import load_quests; print(load_quests('data/quests.json')[0].quest_id)"</code>. It should print <code>shadow_key</code>. A misspelled JSON key should fail loudly during loading; repair the authored data rather than adding guesses or defaults that hide it.</p>
<div class="callout"><strong>THE CARTOGRAPHER'S RULE:</strong> quest JSON describes a promise; a Quest record holds that promise and its completion, while later code supplies the world facts.</div>
<div class="field-notes"><div class="fn-head">SURVEY // STABLE NAMES</div><p>Use <code>quest_id</code> for the Quest field and keep the JSON key <code>"id"</code>. The distinction makes file data compact without losing a readable Python contract. It also makes a saved completion map unambiguous in the next charts.</p></div>
'''

[[lessons.readings]]
label = "Python Docs // dataclasses"
url = "https://docs.python.org/3/library/dataclasses.html"

[[lessons.exercises]]
id = "s10-l01-e1"
type = "type"
points = 12
reps = 2
prompt = '''<p>Retype the canonical Quest header. It separates authored conditions from the changing completion flag.</p>'''
code = '''
@dataclass
class Quest:
    quest_id: str
    title: str
    objectives: list
    conditions: list
    reward: str
    completed: bool = False
'''

[[lessons.exercises]]
id = "s10-l01-e2"
type = "fill"
points = 22
prompt = '''<p>Restore the JSON file-reader used by <code>load_quests</code>.</p>'''
code = '''
with open(filename, encoding="utf-8") as handle:
    records = json.____(handle)
'''
answer = "load"
hint = '''The source is an already-open file handle, just like Elder dialogue in s07.''' 
whyWrong = '''<code>loads</code> consumes a JSON string, while <code>dump</code> writes data. This loader must read the file handle into Python records.''' 

[[lessons.exercises]]
id = "s10-l01-e3"
type = "mc"
points = 20
prompt = '''<p>Where should the Shadow Key completion condition live so a designer can change it without editing the frame loop?</p>'''
choices = ["In <code>data/quests.json</code> as a condition record", "Inside <code>render_text</code>", "As a second copy of <code>Inventory.add</code>", "In the camera follow calculation"]
answer = 0
hint = '''The condition is authored quest data, whereas the evaluator will only read current game facts.''' 
whyWrong = '''Rendering and camera code know pixels, not authored game promises. Duplicating inventory behavior creates competing owners; the data file is the editable source of quest conditions.''' 
explain = '''A JSON condition keeps the quest definition data-driven while the evaluator stays reusable.''' 

[[lessons.exercises]]
id = "s10-l01-e4"
type = "write"
points = 34
prompt = '''<p>Build one Quest record for “The Locked North Road.” Give it the id <code>shadow_key</code>, one objective, and a reward. Print exactly <code>QUEST shadow_key</code> and <code>OBJECTIVE Find the Shadow Key</code>.</p>'''
starter = '''
from dataclasses import dataclass


# Define Quest, create the record, and print its id and first objective.
'''
expect = '''
QUEST shadow_key
OBJECTIVE Find the Shadow Key
'''
solution = '''
from dataclasses import dataclass


@dataclass
class Quest:
    quest_id: str
    objectives: list
    reward: str


quest = Quest("shadow_key", ["Find the Shadow Key"], "The north road opens")
print("QUEST", quest.quest_id)
print("OBJECTIVE", quest.objectives[0])
'''
hint = '''Make <code>objectives</code> a one-element list, then read index 0 for the second line.''' 
