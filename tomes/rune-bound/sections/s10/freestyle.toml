[freestyle]
title = "BUILD: The Cartographer's Ledger"
brief = '''
<p>Wayfinder, bind quests and persistence into the cumulative RuneBound world. This is a runnable PyGame delivery, not a terminal-only JSON sketch.</p>
<ul><li>create canonical <code>quests.py</code> with <code>Quest(quest_id, title, objectives, conditions, reward, completed=False)</code>, <code>Quest.check_completion(player, combat_flags, dialogue_flags)</code>, <code>QuestLog.update/active</code>, and <code>draw_quest_log</code></li><li>create <code>data/quests.json</code> as the sole quest-definition source with a Shadow Key condition that reads the literal <code>"shadow_key"</code> from <code>player.inventory.items</code>; retire every inline quest-completion <code>if</code></li><li>record dialogue node ids after successful DialogueTree choices and combat victory flags after CombatSystem results; evaluate those dictionaries and inventory facts after gameplay changes, not from rendered text</li><li>add the quest-gated CSV variant <code>data/maps/overworld_unsealed.csv</code>; when the quest first completes, call <code>TileMap.load(filename)</code> once to replace the grid and retain the current filename</li><li>add Q-key QuestLog UI and a one-time reward banner through the existing KEYDOWN pump; all quest text uses s07 <code>render_text</code> at screen pixels before one final flip</li><li>create <code>state.py</code> with <code>GameState.to_dict()</code>, <code>GameState.from_dict(payload, player, quest_log)</code>, <code>save_game</code>, and safe <code>load_game</code>; persist Player world position, StatBlock fields, ordered inventory ids, quest completion, dialogue flags, combat flags, and current map filename to <code>save.json</code></li><li>route S and L through main.py’s existing KEYDOWN loop; a missing or corrupt save reports recovery without erasing the current session, while a valid load restores objects and calls <code>TileMap.load</code> before the next draw</li><li>run <code>python3 main.py</code> from the RuneBound folder; collect Shadow Key, inspect Q, save, relaunch, load, and prove position, HP, I inventory, Q quest progress, Elder dialogue state, and quest-gated map survive; also test missing and malformed saves and record command, observations, and repair/no-repair in <code>README.md</code></li></ul>
'''
requires = ["s10-quest-record", "s10-quest-data-loading", "s10-quest-condition-evaluator", "s10-quest-cross-system-facts", "s10-quest-log-update", "s10-quest-log-ui", "s10-game-state-snapshot", "s10-json-save-write", "s10-game-state-restore", "s10-safe-save-load", "s10-save-load-frame-route", "s10-persistence-verification"]
reward = 430
xray = '''
The Cartographer starts at main.py’s event pump and traces one Shadow Key through Player.inventory.items, Quest.check_completion, QuestLog’s one-time transition, the quest-gated TileMap.load replacement, screen-space Q/report rendering, GameState.to_dict(), save.json, load_game recovery, GameState.from_dict(), and the one final flip.
'''

[freestyle.badge]
id = "badge-s10"
name = "LEDGER SEALED"
desc = "Bound quest truth and a recoverable world snapshot."

[[freestyle.rubric]]
criterion = "Data-Driven Quest Truth"
weight = 25
desc = '''<code>data/quests.json</code> is the sole quest-definition source. Quest conditions inspect canonical inventory, combat, and dialogue facts; the old inline completion check is retired.''' 

[[freestyle.rubric]]
criterion = "Cumulative Quest Route"
weight = 25
desc = '''QuestLog reports a one-time completion, Q and reward text are screen-space UI before one flip, dialogue node hooks preserve DialogueTree ownership, and the completed quest replaces the grid through <code>TileMap.load</code> once.''' 

[[freestyle.rubric]]
criterion = "Safe Complete Snapshot"
weight = 30
desc = '''GameState saves and restores world-pixel Player position, all StatBlock fields, ordered inventory ids, quest completion, dialogue/combat flags, and map filename. Missing or malformed saves preserve the active session and report recovery.''' 

[[freestyle.rubric]]
criterion = "Relaunch Evidence"
weight = 20
desc = '''README records the command, Shadow Key and journal observation, saved/relaunched/restored position and state, missing/corrupt-save recovery, and one repair or explicit no-repair result.''' 
