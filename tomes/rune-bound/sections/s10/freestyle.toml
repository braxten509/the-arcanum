[freestyle]
title = "THE WORKING 10 // The Cartographer's Ledger"
brief = '''
<p>Bind the cartographer's ledger into the growing RuneBound route. The commission must leave a runnable artifact whose behavior can be inspected from the named evidence.</p><ul><li>preserve the chart's data boundary and use the established names</li><li>prove the requested behavior with a repeatable run that ends at <code>RUNEBOUND S10 SEAL</code></li><li>write a short repair note explaining the nearest failure and the change that corrected it</li></ul>
'''
requires = ["s10-quest-definition","s10-objective-state","s10-condition-evaluator","s10-cross-system-facts","s10-quest-log","s10-quest-ui","s10-state-dict","s10-json-serialization","s10-safe-load","s10-save-errors","s10-save-load-integration","s10-persistence-proof"]
reward = 260
xray = '''
The Cartographer checks whether the ledger seal commission keeps quest data with an id, objective text, condition kind, and reward under the right owner, shows s11 can place load behind a title menu and prove the final world survives a relaunch, and leaves evidence beyond a decorative printout.
'''

[freestyle.badge]
id = "badge-s10"
name = "LEDGER SEAL SEALED"
desc = "Sealed the the cartographer's ledger chart with evidence another wayfinder can inspect."

[[freestyle.rubric]]
criterion = "Ledger Seal runs"
weight = 25
desc = '''
The the cartographer's ledger artifact parses and runs with the chart's named behavior visible.
'''

[[freestyle.rubric]]
criterion = "Ledger Seal keeps its boundary"
weight = 35
desc = '''
The commission keeps quest data with an id, objective text, condition kind, and reward and s11 can place load behind a title menu and prove the final world survives a relaunch in the owners established by the lessons.
'''

[[freestyle.rubric]]
criterion = "Ledger Seal shows proof"
weight = 25
desc = '''
The wayfinder supplies a repeatable observation, the exact s10 seal, and a useful comparison case rather than a one-time claim.
'''

[[freestyle.rubric]]
criterion = "Cartographer's repair note"
weight = 15
desc = '''
The explanation names the failing boundary, the evidence that exposed it, and the smallest correction that restored the route.
'''

