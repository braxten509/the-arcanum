[[lessons.exercises]]
id = "s02-l02-e4"
type = "mc"
points = 14
prompt = '''
<p>Why is a movement method clearer when it returns a small report? Select the reading that keeps later collision code can ask one entity to move and inspect the result possible.</p>
'''
choices = ["return prevents the method from touching self","the caller can inspect the result without guessing which attributes changed","the renderer requires every method to return a sprite","a return statement replaces the entity constructor"]
answer = 1
whyWrong = '''
The tempting routes confuse omitting self or returning a value that the caller never receives with the job this trial actually asks you to protect; each decoy moves ownership to the wrong part of the chart.
'''
hint = '''
Trace self as the receiver of position updates and return as a useful report in the Shape Ledger chart, then compare the a method's local calculation must end by changing or returning a named fact with the evidence named in the prompt.
'''
explain = '''
The selected mark preserves a method's local calculation must end by changing or returning a named fact and leaves self as the receiver of position updates and return as a useful report available for the next RuneBound handoff.
'''

[[lessons.exercises]]
id = "s02-l02-e5"
type = "fill"
points = 18
prompt = '''
<p>s02-l02-e5: restore the missing operation in the supplied code. Use its operands and the chart evidence to complete the route without renaming the owner.</p>
'''
code = '''
def move(self, dx, dy):
    self.x += dx
    ____ self.x, self.y
'''
answer = "return"
hint = '''
Look at what must happen to entity.move(4, -2) updates the same object the caller holds; choose the operation that performs that job rather than the one that merely inspects the result.
'''
