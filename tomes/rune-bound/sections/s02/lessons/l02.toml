[[lessons]]
id = "s02-l02"
title = "The Self-Carried Compass"
teaches = ["entity-move-method", "entity-inheritance-contract"]
body = '''
<p>An entity’s state becomes useful when the entity can change it deliberately. A <strong>method</strong> is a function defined in a class. Its first parameter is conventionally <code>self</code>, the instance that received the call. The method below moves one entity by a delta: a change in pixels, not an absolute destination. Calling <code>hero.move(4, -2)</code> changes the existing hero; it does not make a replacement hero.</p>
<pre><code>class GameEntity:
    def __init__(self, x, y, width, height):
        self.x, self.y = x, y
        self.width, self.height = width, height

    def move(self, dx, dy):
        self.x += dx
        self.y += dy

hero = GameEntity(10, 10, 16, 16)
hero.move(4, -2)
print(hero.x, hero.y)</code></pre>
<p><code>+=</code> is a compact assignment: <code>self.x += dx</code> means “take this entity’s current x and add dx.” It is not the same as <code>self.x = dx</code>, which would discard the old position. The explicit <code>self.</code> keeps instance state distinct from method parameters. In the final game, movement will later need collision checks; for now this method proves the direction and ownership of a state change.</p>
<p>Classes also let a specialized role keep an already-working contract. <code>class Tile(GameEntity)</code> says Tile inherits the base class. Its initializer calls <code>super().__init__(x, y, width, height)</code> so the base class remains the single owner of spatial setup; Tile adds only <code>tile_id</code>. This is the precise s04 bridge. Do not copy four assignments into Tile, because duplicated constructors drift when the base contract changes.</p>
<pre><code>class Tile(GameEntity):
    def __init__(self, x, y, width, height, tile_id):
        super().__init__(x, y, width, height)
        self.tile_id = tile_id

wall = Tile(0, 0, 32, 32, "wall")
wall.move(32, 0)
print(wall.x, wall.tile_id)</code></pre>
<p>This is inheritance as reuse, not a license for a child to overwrite every rule. s04 must preserve <code>GameEntity</code> and those four inherited attributes when it introduces tiles; future Player, NPC, and Enemy sprite classes will follow the same spatial vocabulary. Test the temporary terminal model now. s03 will retire the separate <code>test_entity.py</code> file, not this public contract.</p>
<div class="callout"><strong>THE CARTOGRAPHER'S CHECK:</strong> state moves only on the instance that received the method call.</div>
<div class="field-notes"><div class="fn-head">FIELD NOTES // ONE OWNER</div><p>Use <code>super()</code> when the base class owns initialization. A child should name only the state that its own role adds.</p></div>
'''

[[lessons.readings]]
label = "Python Docs // Method Objects and Inheritance"
url = "https://docs.python.org/3/tutorial/classes.html#inheritance"

[[lessons.exercises]]
id = "s02-l02-e1"
type = "type"
points = 12
reps = 2
prompt = '''<p>Retype the movement method that updates the object that receives it.</p>'''
code = '''
def move(self, dx, dy):
    self.x += dx
    self.y += dy
'''

[[lessons.exercises]]
id = "s02-l02-e2"
type = "mc"
points = 20
prompt = '''<p>Why should <code>Tile.__init__</code> call <code>super().__init__(x, y, width, height)</code>?</p>'''
choices = ["It turns tile coordinates into grid indexes", "It lets Tile reuse the base spatial setup before adding tile-specific state", "It creates a second GameEntity inside every Tile", "It makes <code>tile_id</code> a class variable"]
answer = 1
hint = '''Identify which class already owns x, y, width, and height.'''
whyWrong = '''Grid indexes are a separate coordinate system, and <code>super()</code> neither creates a second object nor changes an instance attribute into a class attribute. It delegates the base initialization to its one canonical owner.'''
explain = '''The child keeps the established spatial contract and adds only <code>tile_id</code>.'''

[[lessons.exercises]]
id = "s02-l02-e3"
type = "fill"
points = 22
prompt = '''<p>Complete the movement update so the entity adds the horizontal delta to its current position.</p>'''
code = '''
def move(self, dx, dy):
    self.x ____ dx
    self.y += dy
'''
answer = "+="
hint = '''Use the augmented assignment operator that keeps the old coordinate and adds the delta.'''
whyWrong = '''Plain assignment would replace the position with the delta. The method must accumulate a change from the entity’s current coordinate.'''

[[lessons.exercises]]
id = "s02-l02-e4"
type = "write"
points = 34
prompt = '''<p>Use the supplied <code>GameEntity</code> unchanged. Define <code>Tile(GameEntity)</code> with <code>tile_id</code>, call the parent initializer, move <code>wall = Tile(0, 0, 32, 32, "wall")</code> by 32 pixels horizontally, and print exactly <code>WALL 32 wall</code>.</p>'''
starter = '''
class GameEntity:
    def __init__(self, x, y, width, height):
        self.x, self.y = x, y
        self.width, self.height = width, height

    def move(self, dx, dy):
        self.x += dx
        self.y += dy

# Define Tile, make wall, move it, and print its evidence.
'''
expect = '''
WALL 32 wall
'''
solution = '''
class GameEntity:
    def __init__(self, x, y, width, height):
        self.x, self.y = x, y
        self.width, self.height = width, height

    def move(self, dx, dy):
        self.x += dx
        self.y += dy

class Tile(GameEntity):
    def __init__(self, x, y, width, height, tile_id):
        super().__init__(x, y, width, height)
        self.tile_id = tile_id

wall = Tile(0, 0, 32, 32, "wall")
wall.move(32, 0)
print("WALL", wall.x, wall.tile_id)
'''
hint = '''Put <code>Tile(GameEntity)</code> below the base class, call <code>super().__init__</code> with the first four values, then add <code>self.tile_id</code>.'''

[[lessons.exercises]]
id = "s02-l02-e5"
type = "text"
points = 18
prompt = '''<p>What is the conventional first parameter name for an instance method, representing the object receiving the call?</p>'''
answer = "self"
hint = '''It appears before <code>dx</code> and <code>dy</code> in the movement method.'''
whyWrong = '''The caller supplies movement deltas, but Python supplies the receiving instance as the first argument when a bound method is called.'''
