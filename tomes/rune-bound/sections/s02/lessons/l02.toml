[[lessons]]
id = "s02-l02"
title = "The Self-Carried Compass"
teaches = ["s02-method-behavior","s02-self-reference"]
body = '''
<p>s02-l02 opens the objects and behavior chart through Self-Carried. s02-l02 hears THE CARTOGRAPHER name s02-method-behavior its first bearing. s02-l02 names one input, one change, and one output. s02-l02 gives s02-self-reference a second mark for comparison. s02-l02 keeps the smallest successful example beside its route.</p>
<p>s02-l02 reads from left to right, then narrates state changes. s02-l02 keeps its objects and behavior clue concrete and observable. s02-l02 runs twice; the second pass challenges the first. s02-l02 records which owner moved when s02-method-behavior shifted. s02-l02 carries earlier <code>GameEntity</code> evidence into this chart.</p>
<p>s02-l02 asks one decision to stand alone in the margin. s02-l02 keeps s02-self-reference visible instead of hiding it behind polish. s02-l02 tests a friendly case and a sharp edge case. s02-l02 compares both traces so s02-method-behavior has a witness. s02-l02 names the failure before choosing a repair.</p>
<p>s02-l02 treats each handoff as a contract between maker and reader. s02-l02 supplies s02-method-behavior; the reader checks s02-self-reference. s02-l02 places its check where another wayfinder can repeat it. s02-l02 earns THE CARTOGRAPHER's trust through evidence, not luck. s02-l02 leaves one deliberate question for the next chart.</p>
<p>s02-l02 closes by stating what the program must preserve. s02-l02 names one input that could falsify s02-method-behavior. s02-l02 names one output that confirms s02-self-reference still belongs. s02-l02 runs the smallest route, inspects its trace, and annotates it. s02-l02 turns the objects and behavior chart into a RuneBound waypoint.</p>
<p>s02-l02 ends with a handoff to the next chart. s02-l02 carries s02-self-reference forward after s02-method-behavior earns trust. s02-l02 lets THE CARTOGRAPHER record the result in plain language. s02-l02 turns a clean rerun from a guess into a fact. s02-l02 lets the next wayfinder begin without hidden context.</p>
<pre><code>print("s02-l02 // The Self-Carried Compass")</code></pre>
<div class="field-notes"><div class="fn-head">FIELD NOTES // S02-L02</div><p>s02-l02 <strong>Evidence.</strong> Record s02-method-behavior; compare it with s02-self-reference before advancing.</p><p>s02-l02 <strong>Repair.</strong> Change one cause, rerun the route, and preserve the explanation.</p></div>
'''

[[lessons.readings]]
label = "Python tutorial // classes // The Self-Carried Compass"
url = "https://docs.python.org/3/tutorial/classes.html"

[[lessons.readings]]
label = "Python tutorial // dictionaries // The Self-Carried Compass"
url = "https://docs.python.org/3/tutorial/datastructures.html#dictionaries"

[[lessons.exercises]]
id = "s02-l02-e1"
type = "type"
points = 10
reps = 2
prompt = '''
<p>Retype this shape ledger evidence exactly. Keep self as the receiver of position updates and return as a useful report visible while you write. (Ctrl+Enter submits.)</p>
'''
code = '''
class GameEntity:
    def __init__(self, x, y):
        self.x = x
        self.y = y
    def move(self, dx, dy):
        self.x += dx
        self.y += dy
        return self.x, self.y
print(GameEntity(1, 1).move(2, 0))
'''

