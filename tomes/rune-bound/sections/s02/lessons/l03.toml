[[lessons]]
id = "s02-l03"
title = "The Inheritance Bridge"
teaches = ["s02-inheritance-contract","s02-shared-behavior"]
body = '''
<p>s02-l03 opens the objects and behavior chart through Inheritance. s02-l03 hears THE CARTOGRAPHER name s02-inheritance-contract its first bearing. s02-l03 names one input, one change, and one output. s02-l03 gives s02-shared-behavior a second mark for comparison. s02-l03 keeps the smallest successful example beside its route.</p>
<p>s02-l03 reads from left to right, then narrates state changes. s02-l03 keeps its objects and behavior clue concrete and observable. s02-l03 runs twice; the second pass challenges the first. s02-l03 records which owner moved when s02-inheritance-contract shifted. s02-l03 carries earlier <code>GameEntity</code> evidence into this chart.</p>
<p>s02-l03 asks one decision to stand alone in the margin. s02-l03 keeps s02-shared-behavior visible instead of hiding it behind polish. s02-l03 tests a friendly case and a sharp edge case. s02-l03 compares both traces so s02-inheritance-contract has a witness. s02-l03 names the failure before choosing a repair.</p>
<p>s02-l03 treats each handoff as a contract between maker and reader. s02-l03 supplies s02-inheritance-contract; the reader checks s02-shared-behavior. s02-l03 places its check where another wayfinder can repeat it. s02-l03 earns THE CARTOGRAPHER's trust through evidence, not luck. s02-l03 leaves one deliberate question for the next chart.</p>
<p>s02-l03 closes by stating what the program must preserve. s02-l03 names one input that could falsify s02-inheritance-contract. s02-l03 names one output that confirms s02-shared-behavior still belongs. s02-l03 runs the smallest route, inspects its trace, and annotates it. s02-l03 turns the objects and behavior chart into a RuneBound waypoint.</p>
<p>s02-l03 ends with a handoff to the next chart. s02-l03 carries s02-shared-behavior forward after s02-inheritance-contract earns trust. s02-l03 lets THE CARTOGRAPHER record the result in plain language. s02-l03 turns a clean rerun from a guess into a fact. s02-l03 lets the next wayfinder begin without hidden context.</p>
<pre><code>print("s02-l03 // The Inheritance Bridge")</code></pre>
<div class="field-notes"><div class="fn-head">FIELD NOTES // S02-L03</div><p>s02-l03 <strong>Evidence.</strong> Record s02-inheritance-contract; compare it with s02-shared-behavior before advancing.</p><p>s02-l03 <strong>Repair.</strong> Change one cause, rerun the route, and preserve the explanation.</p></div>
'''

[[lessons.readings]]
label = "Python tutorial // classes // The Inheritance Bridge"
url = "https://docs.python.org/3/tutorial/classes.html"

[[lessons.exercises]]
id = "s02-l03-e1"
type = "mc"
points = 14
prompt = '''
<p>What should a child class add after it inherits a working entity contract? Select the reading that keeps s03 can place a named entity beside the first pygame surface possible.</p>
'''
choices = ["a second copy of every base attribute with new spellings","a renderer that replaces the constructor entirely","only the player-specific state or behavior that the base does not own","a global variable that moves every entity at once"]
answer = 2
whyWrong = '''
The tempting routes confuse copying the base constructor by hand and letting the two versions drift with the job this trial actually asks you to protect; each decoy moves ownership to the wrong part of the chart.
'''
hint = '''
Trace inheritance that reuses spatial behavior while adding a role-specific attribute in the Shape Ledger chart, then compare the the child keeps the parent's contract and adds only what its role needs with the evidence named in the prompt.
'''
explain = '''
The selected mark preserves the child keeps the parent's contract and adds only what its role needs and leaves inheritance that reuses spatial behavior while adding a role-specific attribute available for the next RuneBound handoff.
'''

[[lessons.exercises]]
id = "s02-l03-e2"
type = "text"
points = 16
prompt = '''
<p>s02-l03-e2: name the Python term for the specific unit requested by this chart. Supply the language term, not the surrounding story label.</p>
'''
answer = "inheritance"
hint = '''
Recall the named boundary in The Inheritance Bridge; the answer is the language term for that single job, not the larger game feature.
'''

[[lessons.exercises]]
id = "s02-l03-e3"
type = "fill"
points = 18
prompt = '''
<p>s02-l03-e3: restore the missing operation in the supplied code. Use its operands and the chart evidence to complete the route without renaming the owner.</p>
'''
code = '''
class Player(____):
    pass
'''
answer = "GameEntity"
hint = '''
Look at what must happen to class player(gameentity) gives a player position before adding inventory; choose the operation that performs that job rather than the one that merely inspects the result.
'''

[[lessons.exercises]]
id = "s02-l03-e4"
type = "type"
points = 10
reps = 2
prompt = '''
<p>Retype this shape ledger evidence exactly. Keep inheritance that reuses spatial behavior while adding a role-specific attribute visible while you write. (Ctrl+Enter submits.)</p>
'''
code = '''
class GameEntity:
    def __init__(self, x):
        self.x = x
class Player(GameEntity):
    pass
print(Player(5).x)
'''
