[[lessons]]
id = "s02-l03"
title = "The Rule Drawer"
teaches = ["tile-type-dict-lookup", "nested-dict-properties"]
body = '''
<p>Not every difference between game things deserves a new class. A wall and grass tile share the same Tile behavior; their rules are data. A Python <strong>dictionary</strong> maps a unique key to a value. Here <code>tile_types</code> maps a tile id such as <code>"wall"</code> to a second dictionary of properties. The lookup is exact: <code>tile_types[tile_id]</code> uses the tile’s id to find its definition.</p>
<pre><code>tile_types = {
    "grass": {"color": "green", "solid": False},
    "wall": {"color": "gray", "solid": True},
}

tile_id = "wall"
definition = tile_types[tile_id]
print(definition["color"])
print(definition["solid"])</code></pre>
<p>The outer dictionary answers “which tile type?”; the inner dictionary answers “which property of that type?” This is not a list lookup: <code>tile_types[1]</code> would ask for the key <code>1</code>, not the second entry. Keys make the data readable and let s04 load tile definitions without adding an <code>if</code> branch for every new tile. Later s07 will use the same shape for dialogue nodes: node id first, then fields inside the selected node.</p>
<p>Square-bracket lookup is intentionally strict. If <code>tile_id</code> is not present, Python raises <code>KeyError</code>; that is useful when a map refers to a misspelled definition. When absence is acceptable, use <code>tile_types.get(tile_id)</code>, which returns <code>None</code> by default. Do not use <code>get</code> to hide a required wall definition—surface the bad data and repair its key.</p>
<p>Keep ownership clear: <code>GameEntity</code> and <code>Tile</code> own per-object position and behavior; <code>tile_types</code> owns reusable names and properties. s04 can turn a parsed cell id from s01 into <code>Tile(..., tile_id)</code>, then consult this dictionary for its visual and solid rule. The row-major parser remains intact, but terminal prints are still scheduled for retirement in s03.</p>
<pre><code>tile_types = {"water": {"solid": True}}
tile_id = "water"
if tile_types[tile_id]["solid"]:
    print("BLOCKED")</code></pre>
<div class="callout"><strong>THE CARTOGRAPHER'S RULE:</strong> use a key to find a named rule; use an attribute to find state belonging to one object.</div>
<div class="field-notes"><div class="fn-head">FIELD NOTES // SPELL THE KEY</div><p><code>"Wall"</code> and <code>"wall"</code> are different keys. Freeze ids in lower-case spelling before maps and dialogue begin to rely on them.</p></div>
'''

[[lessons.readings]]
label = "Python Docs // Dictionaries"
url = "https://docs.python.org/3/tutorial/datastructures.html#dictionaries"

[[lessons.exercises]]
id = "s02-l03-e1"
type = "mc"
points = 20
prompt = '''<p>Which expression gets the <code>solid</code> property for the tile id stored in <code>tile_id</code>?</p>'''
choices = ['<code>tile_types.solid(tile_id)</code>', '<code>tile_types[tile_id]["solid"]</code>', '<code>tile_types["solid"][tile_id]</code>', '<code>tile_id.solid</code>']
answer = 1
hint = '''Choose the type first with its id, then choose one property inside that definition.'''
whyWrong = '''The outer dictionary is keyed by tile ids, not property names, and dictionaries do not expose values as dot-method calls. The tile id is plain text, not an object carrying a solid attribute.'''
explain = '''The first brackets select the definition; the second brackets select its <code>solid</code> field.'''

[[lessons.exercises]]
id = "s02-l03-e2"
type = "fill"
points = 22
prompt = '''<p>Restore the strict lookup that selects the definition for the current tile id.</p>'''
code = '''
tile_types = {"wall": {"solid": True}}
tile_id = "wall"
definition = tile_types[____]
print(definition["solid"])
'''
answer = "tile_id"
hint = '''The variable holds the outer dictionary’s key, rather than a property inside the definition.'''
whyWrong = '''Using <code>"solid"</code> would try to find a tile named solid. The outer table must first be indexed by the current tile identifier.'''

[[lessons.exercises]]
id = "s02-l03-e3"
type = "type"
points = 12
reps = 2
prompt = '''<p>Retype the two-level lookup that reads a wall’s solid rule.</p>'''
code = '''
tile_types = {"wall": {"solid": True}}
tile_id = "wall"
print(tile_types[tile_id]["solid"])
'''

[[lessons.exercises]]
id = "s02-l03-e4"
type = "text"
points = 18
prompt = '''<p>Which exception exposes a missing key when code uses strict square-bracket dictionary lookup?</p>'''
answer = "KeyError"
hint = '''The exception name combines the missing dictionary part with an error condition.'''
whyWrong = '''A misspelled dictionary key is not an index-range problem or a file problem. Strict dictionary access reports the absent key with its dedicated exception.'''

[[lessons.exercises]]
id = "s02-l03-e5"
type = "write"
points = 34
prompt = '''<p>Create the exact <code>tile_types</code> table for <code>"grass"</code> (green, not solid) and <code>"wall"</code> (gray, solid). Look up the <code>"wall"</code> definition through a <code>tile_id</code> variable and print exactly <code>WALL gray True</code>.</p>'''
starter = '''
# Create tile_types, choose tile_id, and inspect the selected definition.
'''
expect = '''
WALL gray True
'''
solution = '''
tile_types = {
    "grass": {"color": "green", "solid": False},
    "wall": {"color": "gray", "solid": True},
}
tile_id = "wall"
definition = tile_types[tile_id]
print("WALL", definition["color"], definition["solid"])
'''
hint = '''Make each type id an outer key, then retrieve <code>definition = tile_types[tile_id]</code> before reading its color and solid keys.'''
