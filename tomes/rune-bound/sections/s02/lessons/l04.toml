[[lessons]]
id = "s02-l04"
title = "The Rule Drawer"
teaches = ["s02-dict-lookup","s02-json-data"]
body = '''
<p>s02-l04 opens the objects and behavior chart through Rule. s02-l04 hears THE CARTOGRAPHER name s02-dict-lookup its first bearing. s02-l04 names one input, one change, and one output. s02-l04 gives s02-json-data a second mark for comparison. s02-l04 keeps the smallest successful example beside its route.</p>
<p>s02-l04 reads from left to right, then narrates state changes. s02-l04 keeps its objects and behavior clue concrete and observable. s02-l04 runs twice; the second pass challenges the first. s02-l04 records which owner moved when s02-dict-lookup shifted. s02-l04 carries earlier <code>GameEntity</code> evidence into this chart.</p>
<p>s02-l04 asks one decision to stand alone in the margin. s02-l04 keeps s02-json-data visible instead of hiding it behind polish. s02-l04 tests a friendly case and a sharp edge case. s02-l04 compares both traces so s02-dict-lookup has a witness. s02-l04 names the failure before choosing a repair.</p>
<p>s02-l04 treats each handoff as a contract between maker and reader. s02-l04 supplies s02-dict-lookup; the reader checks s02-json-data. s02-l04 places its check where another wayfinder can repeat it. s02-l04 earns THE CARTOGRAPHER's trust through evidence, not luck. s02-l04 leaves one deliberate question for the next chart.</p>
<p>s02-l04 closes by stating what the program must preserve. s02-l04 names one input that could falsify s02-dict-lookup. s02-l04 names one output that confirms s02-json-data still belongs. s02-l04 runs the smallest route, inspects its trace, and annotates it. s02-l04 turns the objects and behavior chart into a RuneBound waypoint.</p>
<p>s02-l04 ends with a handoff to the next chart. s02-l04 carries s02-json-data forward after s02-dict-lookup earns trust. s02-l04 lets THE CARTOGRAPHER record the result in plain language. s02-l04 turns a clean rerun from a guess into a fact. s02-l04 lets the next wayfinder begin without hidden context.</p>
<pre><code>print("s02-l04 // The Rule Drawer")</code></pre>
<div class="field-notes"><div class="fn-head">FIELD NOTES // S02-L04</div><p>s02-l04 <strong>Evidence.</strong> Record s02-dict-lookup; compare it with s02-json-data before advancing.</p><p>s02-l04 <strong>Repair.</strong> Change one cause, rerun the route, and preserve the explanation.</p></div>
'''

[[lessons.readings]]
label = "Python tutorial // classes // The Rule Drawer"
url = "https://docs.python.org/3/tutorial/classes.html"

[[lessons.readings]]
label = "Python tutorial // dictionaries // The Rule Drawer"
url = "https://docs.python.org/3/tutorial/datastructures.html#dictionaries"

[[lessons.exercises]]
id = "s02-l04-e1"
type = "fill"
points = 18
prompt = '''
<p>s02-l04-e1: restore the missing operation in the supplied code. Use its operands and the chart evidence to complete the route without renaming the owner.</p>
'''
code = '''
solid = tile_types.____("wall", False)
'''
answer = "get"
hint = '''
Look at what must happen to tile_types.get("wall", {"solid": false}); choose the operation that performs that job rather than the one that merely inspects the result.
'''

[[lessons.exercises]]
id = "s02-l04-e2"
type = "mc"
points = 14
prompt = '''
<p>What belongs in a tile-type dictionary rather than inside the renderer's loop? Select the reading that keeps s04 can load tile definitions while keeping tilemap logic general possible.</p>
'''
choices = ["the player's current keyboard state","properties such as a name, color, and solid flag","the order in which frames are blitted","a hard-coded copy of every map coordinate"]
answer = 1
whyWrong = '''
The tempting routes confuse spelling a key differently in the data file and the lookup code with the job this trial actually asks you to protect; each decoy moves ownership to the wrong part of the chart.
'''
hint = '''
Trace tile_types["wall"] as data the renderer can look up without a new if branch in the Shape Ledger chart, then compare the the table owns names and properties while the class owns behavior with the evidence named in the prompt.
'''
explain = '''
The selected mark preserves the table owns names and properties while the class owns behavior and leaves tile_types["wall"] as data the renderer can look up without a new if branch available for the next RuneBound handoff.
'''

[[lessons.exercises]]
id = "s02-l04-e3"
type = "type"
points = 10
reps = 2
prompt = '''
<p>Retype this shape ledger evidence exactly. Keep tile_types["wall"] as data the renderer can look up without a new if branch visible while you write. (Ctrl+Enter submits.)</p>
'''
code = '''
tile_types = {"grass": {"solid": False}, "wall": {"solid": True}}
print(tile_types["wall"]["solid"])
'''

[[lessons.exercises]]
id = "s02-l04-e4"
type = "write"
points = 30
prompt = '''
<p>Complete the shape ledger route and print exactly <code>RUNEBOUND S02 L04 SEAL</code>. Preserve the named data before adding the final observation.</p>
'''
starter = '''
route_mark = "rule-drawer"
print("survey pending")
# Add the chart seal after checking the route.
'''
expect = '''
RUNEBOUND S02 L04 SEAL
'''
solution = '''
route_mark = "rule-drawer"
print("RUNEBOUND S02 L04 SEAL")
'''
hint = '''
For s02-l04-e4, leave the route data intact and add only its final s02 observation; compare the starter output with the target before submitting.
'''

[[lessons.exercises]]
id = "s02-l04-e5"
type = "text"
points = 16
prompt = '''
<p>s02-l04-e5: name the Python term for the specific unit requested by this chart. Supply the language term, not the surrounding story label.</p>
'''
answer = "dict"
hint = '''
Recall the named boundary in The Rule Drawer; the answer is the language term for that single job, not the larger game feature.
'''
