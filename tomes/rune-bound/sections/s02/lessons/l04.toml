[[lessons.exercises]]
id = "s02-l04-e4"
type = "write"
points = 35
prompt = '''<p>Define <code>Inventory</code> so each instance starts with its own <code>items</code> list and <code>add</code> appends a name. Create an <code>Item</code> class with a <code>heal</code> attribute, set <code>items = {"potion": Item(10)}</code>, add <code>"potion"</code> to one inventory, then serialize and reload <code>{"items": pack.items}</code>. Print exactly <code>PACK ['potion']</code>, <code>HEAL 10</code>, and <code>LOADED ['potion']</code>.</p>'''
starter = '''
import json

# Define Inventory and Item, then make the catalog and pack.
'''
expect = '''
PACK ['potion']
HEAL 10
LOADED ['potion']
'''
solution = '''
import json

class Inventory:
    def __init__(self):
        self.items = []

    def add(self, item_name):
        self.items.append(item_name)

class Item:
    def __init__(self, heal):
        self.heal = heal

items = {"potion": Item(10)}
pack = Inventory()
pack.add("potion")
saved_text = json.dumps({"items": pack.items})
loaded_state = json.loads(saved_text)
print("PACK", pack.items)
print("HEAL", items["potion"].heal)
print("LOADED", loaded_state["items"])
'''
hint = '''Initialize <code>self.items</code> in Inventory, make <code>Item(10)</code> the catalog value, and pass a plain dictionary containing the list to <code>json.dumps</code>.'''

