[[lessons.exercises]]
id = "s02-l04-e1"
type = "mc"
points = 20
prompt = '''<p>Why must <code>self.items = []</code> be inside <code>Inventory.__init__</code>?</p>'''
choices = ["So JSON can never read the list", "So every inventory instance receives its own list", "So item ids automatically become Item objects", "So the list is sorted alphabetically"]
answer = 1
hint = '''Consider what would happen if two separate players picked up different items.'''
whyWrong = '''JSON does not determine list ownership, appending a string does not create an Item object, and initialization does not sort anything. The placement prevents separate inventories from sharing one mutable list.'''
explain = '''An assignment in <code>__init__</code> runs for each newly created inventory.'''

