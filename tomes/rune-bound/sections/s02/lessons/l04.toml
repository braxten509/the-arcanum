[[lessons]]
id = "s02-l04"
title = "The Pack and the Sealed Record"
teaches = ["inventory-instance-list", "item-catalog-lookup", "json-object-roundtrip"]
body = '''
<p>A class can also own a collection. RuneBound’s later inventory needs a bag that belongs to one player, so <code>Inventory.__init__</code> creates <code>self.items = []</code>. That placement is vital: a list written directly in the class body would be shared by every Inventory. The <code>add</code> method appends one item name to this one bag. A list preserves the pickup order; an item catalog answers a different question—what a named item means.</p>
<pre><code>class Inventory:
    def __init__(self):
        self.items = []

    def add(self, item_name):
        self.items.append(item_name)

items = {"potion": {"heal": 10}}
pack = Inventory()
pack.add("potion")
print(pack.items)
print(items["potion"]["heal"])</code></pre>
<p>In s09, catalog values will become <code>Item</code> objects, so the public lookup becomes <code>items["potion"].heal</code>. This section deliberately teaches both sides: the dictionary is indexed by an item id, and dot notation reads the selected item instance’s attribute. The <code>Inventory</code> contract is <code>inventory.items</code>, a list of item references. Preserve it when pickup and UI code arrive.</p>
<p>JSON is a text data format for save files. <code>json.dumps</code> serializes supported Python data to a JSON string; <code>json.loads</code> parses that string back into Python data. A simple object’s <code>__dict__</code> is a dictionary of its instance attributes, making it a useful first save boundary. It is not magic persistence: methods are not saved, and nested custom objects need their own conversion later.</p>
<pre><code>import json

class SaveProbe:
    def __init__(self, x, height):
        self.x = x
        self.height = height

hero = SaveProbe(32, 16)
saved_text = json.dumps(hero.__dict__)
loaded_state = json.loads(saved_text)
print(loaded_state["x"], loaded_state["height"])</code></pre>
<p>The loaded value is a dictionary, not a restored <code>GameEntity</code>; s10 will deliberately feed its values into a reconstruction path while handling missing or corrupt save files. For now, prove the round trip without claiming it restores methods. This distinction keeps the future save system honest.</p>
<p>Run this section’s standalone <code>test_entity.py</code> from its folder while it is useful, with hardcoded entities and assertions as evidence. s03 must remove that file when entity construction moves inside the actual game loop. Keep the contracts—<code>GameEntity</code>, <code>tile_types</code>, <code>Inventory</code>, and JSON conversion—but not the temporary isolated runner.</p>
<div class="callout"><strong>THE CARTOGRAPHER'S CHECK:</strong> a bag belongs to one inventory, while a catalog belongs to the game’s shared rules.</div>
<div class="field-notes"><div class="fn-head">FIELD NOTES // LEGIBLE PYTHON</div><p>Use snake_case for functions, methods, variables, and attributes; PascalCase for classes; and four-space indentation. That is the PEP 8 trail marking expected in every RuneBound artifact.</p></div>
'''

