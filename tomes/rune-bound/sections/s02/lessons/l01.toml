[[lessons.exercises]]
id = "s02-l01-e3"
type = "type"
points = 10
reps = 2
prompt = '''
<p>Retype this shape ledger evidence exactly. Keep an object with x, y, width, and height that can be created twice visible while you write. (Ctrl+Enter submits.)</p>
'''
code = '''
class GameEntity:
    def __init__(self, x, y):
        self.x = x
        self.y = y
entity = GameEntity(2, 3)
print(entity.x)
'''

[[lessons.exercises]]
id = "s02-l01-e4"
type = "fill"
points = 18
prompt = '''
<p>s02-l01-e4: restore the missing operation in the supplied code. Use its operands and the chart evidence to complete the route without renaming the owner.</p>
'''
code = '''
class GameEntity:
    def __init__(self, x, y):
        self.x = x
        self.y = ____
'''
answer = "y"
hint = '''
Look at what must happen to entity = gameentity(32, 64, 16, 16); choose the operation that performs that job rather than the one that merely inspects the result.
'''

