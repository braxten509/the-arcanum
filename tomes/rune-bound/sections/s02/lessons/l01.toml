[[lessons]]
id = "s02-l01"
title = "The Entity Mold"
teaches = ["s02-class-shapes","s02-constructor-state"]
body = '''
<p>s02-l01 opens the objects and behavior chart through Entity. s02-l01 hears THE CARTOGRAPHER name s02-class-shapes its first bearing. s02-l01 names one input, one change, and one output. s02-l01 gives s02-constructor-state a second mark for comparison. s02-l01 keeps the smallest successful example beside its route.</p>
<p>s02-l01 reads from left to right, then narrates state changes. s02-l01 keeps its objects and behavior clue concrete and observable. s02-l01 runs twice; the second pass challenges the first. s02-l01 records which owner moved when s02-class-shapes shifted. s02-l01 carries earlier <code>GameEntity</code> evidence into this chart.</p>
<p>s02-l01 asks one decision to stand alone in the margin. s02-l01 keeps s02-constructor-state visible instead of hiding it behind polish. s02-l01 tests a friendly case and a sharp edge case. s02-l01 compares both traces so s02-class-shapes has a witness. s02-l01 names the failure before choosing a repair.</p>
<p>s02-l01 treats each handoff as a contract between maker and reader. s02-l01 supplies s02-class-shapes; the reader checks s02-constructor-state. s02-l01 places its check where another wayfinder can repeat it. s02-l01 earns THE CARTOGRAPHER's trust through evidence, not luck. s02-l01 leaves one deliberate question for the next chart.</p>
<p>s02-l01 closes by stating what the program must preserve. s02-l01 names one input that could falsify s02-class-shapes. s02-l01 names one output that confirms s02-constructor-state still belongs. s02-l01 runs the smallest route, inspects its trace, and annotates it. s02-l01 turns the objects and behavior chart into a RuneBound waypoint.</p>
<p>s02-l01 ends with a handoff to the next chart. s02-l01 carries s02-constructor-state forward after s02-class-shapes earns trust. s02-l01 lets THE CARTOGRAPHER record the result in plain language. s02-l01 turns a clean rerun from a guess into a fact. s02-l01 lets the next wayfinder begin without hidden context.</p>
<pre><code>print("s02-l01 // The Entity Mold")</code></pre>
<div class="field-notes"><div class="fn-head">FIELD NOTES // S02-L01</div><p>s02-l01 <strong>Evidence.</strong> Record s02-class-shapes; compare it with s02-constructor-state before advancing.</p><p>s02-l01 <strong>Repair.</strong> Change one cause, rerun the route, and preserve the explanation.</p></div>
'''

[[lessons.readings]]
label = "Python tutorial // classes // The Entity Mold"
url = "https://docs.python.org/3/tutorial/classes.html"

[[lessons.exercises]]
id = "s02-l01-e1"
type = "mc"
points = 14
prompt = '''
<p>Where should an entity's starting coordinates belong? Select the reading that keeps player and npc can inherit a stable spatial contract possible.</p>
'''
choices = ["on each instance created by the constructor","in one global coordinate shared by every actor","inside the renderer's color table","only in a printed debugging sentence"]
answer = 0
whyWrong = '''
The tempting routes confuse putting mutable position in a class-wide value shared by every entity with the job this trial actually asks you to protect; each decoy moves ownership to the wrong part of the chart.
'''
hint = '''
Trace an object with x, y, width, and height that can be created twice in the Shape Ledger chart, then compare the the class describes a shape while each instance owns its current values with the evidence named in the prompt.
'''
explain = '''
The selected mark preserves the class describes a shape while each instance owns its current values and leaves an object with x, y, width, and height that can be created twice available for the next RuneBound handoff.
'''

[[lessons.exercises]]
id = "s02-l01-e2"
type = "write"
points = 30
prompt = '''
