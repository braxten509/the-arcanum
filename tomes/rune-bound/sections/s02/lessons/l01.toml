[[lessons]]
id = "s02-l01"
title = "The Entity Mold"
teaches = ["game-entity-state", "entity-instance-attributes"]
body = '''
<p>A map is not yet a world until it has things that can occupy it. A <strong>class</strong> is RuneBound’s mold for one kind of thing; an <strong>instance</strong> is one particular thing made from that mold. Our first canonical contract is <code>GameEntity(x, y, width, height)</code>. Every instance owns four pixel-space attributes with those exact names. The top-left position is <code>x, y</code>; <code>width, height</code> describe its footprint. s04 will inherit this contract for <code>Tile</code>, and later sprites will keep it, so do not rename a bearing halfway through a map.</p>
<pre><code>class GameEntity:
    def __init__(self, x, y, width, height):
        self.x = x
        self.y = y
        self.width = width
        self.height = height

tree = GameEntity(32, 64, 16, 24)
chest = GameEntity(96, 64, 24, 16)
print(tree.x, tree.y)
print(chest.width, chest.height)</code></pre>
<p><code>__init__</code> runs when the class is called. The four values inside its parentheses become four attributes on the newly made object. The dot in <code>tree.x</code> means “the <code>x</code> belonging to this tree,” not a global coordinate shared by every entity. That ownership is the reason two objects may occupy different places without interfering with one another.</p>
<p>The first parameter, conventionally named <code>self</code>, is the instance receiving the setup. Python supplies it when you write <code>GameEntity(32, 64, 16, 24)</code>; do not pass it yourself. Put mutable per-entity state on <code>self</code>. A later <code>Inventory</code> will likewise create its list in <code>__init__</code>, so two players do not accidentally share one bag.</p>
<p>For this in-browser chapter, use prints and assertions as a small survey instrument. The standalone <code>test_entity.py</code> created by the freestyle is intentionally temporary: s03 retires it when the real game loop begins instantiating entities. Keep the class contract, retire the separate test script. The terminal is a measuring tape, not the finished view.</p>
<div class="callout"><strong>THE CARTOGRAPHER'S RULE:</strong> coordinates and dimensions belong to the entity that occupies them.</div>
<div class="field-notes"><div class="fn-head">FIELD NOTES // PIXELS FIRST</div><p>These are pixel-space values, not row-and-column grid indexes. s04 will convert tile data into positioned tiles; never silently mix the two coordinate systems.</p></div>
'''

[[lessons.readings]]
label = "Python Docs // A First Look at Classes"
url = "https://docs.python.org/3/tutorial/classes.html#a-first-look-at-classes"

[[lessons.exercises]]
id = "s02-l01-e1"
type = "mc"
points = 20
prompt = '''<p>Two RuneBound trees need different positions. Where must each tree’s <code>x</code> value be stored?</p>'''
choices = ["On each instance as <code>self.x</code>", "In one module-level <code>x</code> variable", "As a class name such as <code>GameEntity.x</code> only", "Inside the map’s row list"]
answer = 0
hint = '''Each tree must keep a value that is independent from the other tree.'''
whyWrong = '''A module-level value or one shared class attribute would make entities compete for the same coordinate. A row list describes map data, not the individual entity that occupies a position.'''
explain = '''Instance attributes are attached to one object, so <code>tree.x</code> and <code>chest.x</code> can differ.'''

[[lessons.exercises]]
id = "s02-l01-e2"
type = "type"
points = 12
reps = 2
prompt = '''<p>Retype the canonical entity constructor. Its four attribute names are RuneBound’s spatial contract.</p>'''
code = '''
class GameEntity:
    def __init__(self, x, y, width, height):
        self.x = x
        self.y = y
        self.width = width
        self.height = height
'''

[[lessons.exercises]]
id = "s02-l01-e3"
type = "fill"
points = 22
prompt = '''<p>Restore the attribute assignment that records the entity’s horizontal pixel position.</p>'''
code = '''
class GameEntity:
    def __init__(self, x, y, width, height):
        self.____ = x
        self.y = y
        self.width = width
        self.height = height
'''
answer = "x"
hint = '''The attribute name must match the first coordinate parameter and the later contract used as <code>entity.x</code>.'''
whyWrong = '''Using <code>y</code> would overwrite the vertical coordinate, while a new spelling would break the public <code>x</code> contract.'''

[[lessons.exercises]]
id = "s02-l01-e4"
type = "write"
points = 34
prompt = '''<p>Define the canonical <code>GameEntity</code> class in the starter. Create <code>tree = GameEntity(32, 64, 16, 24)</code> and <code>chest = GameEntity(96, 64, 24, 16)</code>. Print exactly <code>TREE 32 64</code> and <code>CHEST 24 16</code>, proving the instances own different attributes.</p>'''
starter = '''
# Define GameEntity, then create tree and chest.
'''
expect = '''
TREE 32 64
CHEST 24 16
'''
solution = '''
class GameEntity:
    def __init__(self, x, y, width, height):
        self.x = x
        self.y = y
        self.width = width
        self.height = height

tree = GameEntity(32, 64, 16, 24)
chest = GameEntity(96, 64, 24, 16)
print("TREE", tree.x, tree.y)
print("CHEST", chest.width, chest.height)
'''
hint = '''Construct each object with its four numbers, then read <code>x</code>/<code>y</code> from tree and <code>width</code>/<code>height</code> from chest.'''

[[lessons.exercises]]
id = "s02-l01-e5"
type = "text"
points = 18
prompt = '''<p>What special method runs automatically to initialize a newly created Python object?</p>'''
answer = "__init__"
hint = '''It begins and ends with two underscores and appears directly below the class header.'''
whyWrong = '''A normal method only runs when called explicitly. The initializer is the constructor hook that receives the arguments used when the class is instantiated.'''
