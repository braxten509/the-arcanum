[freestyle]
title = "THE WORKING 2 // The Shape of Things"
brief = '''
<p>Bind the shape of things into the growing RuneBound route. The commission must leave a runnable artifact whose behavior can be inspected from the named evidence.</p><ul><li>preserve the chart's data boundary and use the established names</li><li>prove the requested behavior with a repeatable run that ends at <code>RUNEBOUND S02 SEAL</code></li><li>write a short repair note explaining the nearest failure and the change that corrected it</li></ul>
'''
requires = ["s02-class-shapes","s02-constructor-state","s02-method-behavior","s02-self-reference","s02-inheritance-contract","s02-shared-behavior","s02-dict-lookup","s02-json-data"]
reward = 196
xray = '''
The Cartographer checks whether the shape ledger commission keeps an object with x, y, width, and height that can be created twice under the right owner, shows s04 can load tile definitions while keeping tilemap logic general, and leaves evidence beyond a decorative printout.
'''

[freestyle.badge]
id = "badge-s02"
name = "SHAPE LEDGER SEALED"
desc = "Sealed the the shape of things chart with evidence another wayfinder can inspect."

[[freestyle.rubric]]
criterion = "Shape Ledger runs"
weight = 25
desc = '''
The the shape of things artifact parses and runs with the chart's named behavior visible.
'''

[[freestyle.rubric]]
criterion = "Shape Ledger keeps its boundary"
weight = 35
desc = '''
The commission keeps an object with x, y, width, and height that can be created twice and s04 can load tile definitions while keeping tilemap logic general in the owners established by the lessons.
'''

[[freestyle.rubric]]
criterion = "Shape Ledger shows proof"
weight = 25
desc = '''
The wayfinder supplies a repeatable observation, the exact s02 seal, and a useful comparison case rather than a one-time claim.
'''

[[freestyle.rubric]]
criterion = "Cartographer's repair note"
weight = 15
desc = '''
The explanation names the failing boundary, the evidence that exposed it, and the smallest correction that restored the route.
'''

