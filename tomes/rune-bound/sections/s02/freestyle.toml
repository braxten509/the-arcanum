[freestyle]
title = "BUILD: The Cartographer's Shape Ledger"
brief = '''
<p>Wayfinder, make <code>test_entity.py</code>, a temporary terminal proof of the RuneBound model. This is the last isolated survey before s03 opens the actual PyGame loop, so make the contract visible and leave no mystery about what will be retired.</p><ul><li>Define canonical <code>GameEntity(x, y, width, height)</code>; make two instances and prove they keep independent pixel-space values.</li><li>Define <code>Tile(GameEntity)</code>; use <code>super().__init__(x, y, width, height)</code>, add <code>tile_id</code>, call <code>move(dx, dy)</code>, and print evidence of the inherited position plus tile id.</li><li>Create <code>tile_types</code> keyed by lower-case ids, including <code>"grass"</code> and <code>"wall"</code>; retrieve the wall’s <code>color</code> and <code>solid</code> values through <code>tile_types[tile_id]</code>.</li><li>Define <code>Inventory</code> with a new <code>self.items</code> list per instance, and an <code>Item</code> with <code>heal</code>; prove the catalog access <code>items["potion"].heal</code>.</li><li>Serialize one entity’s <code>__dict__</code> with <code>json.dumps</code>, parse it with <code>json.loads</code>, and print a loaded coordinate. End every successful run with exactly <code>RUNEBOUND S02 SEAL</code>.</li><li>Add a short comment: s03 removes <code>test_entity.py</code> when entities are created in the real game loop; it preserves the class and data contracts.</li></ul>
'''
requires = ["game-entity-state", "entity-instance-attributes", "entity-move-method", "entity-inheritance-contract", "tile-type-dict-lookup", "nested-dict-properties", "inventory-instance-list", "item-catalog-lookup", "json-object-roundtrip"]
reward = 210
xray = '''
The Cartographer checks the exact GameEntity attribute names, not a look-alike coordinate scheme. He looks for Tile's super call, strict dictionary lookup, a per-instance inventory list, and a real dumps/loads round trip. He awards craft for PEP 8 class and variable naming, four-space layout, and concise evidence; decorative prints that do not prove state earn nothing.
'''

[freestyle.badge]
id = "badge-s02"
name = "SHAPE LEDGER SEALED"
desc = "Recorded RuneBound's first entities, rule tables, and save-shaped state."

[[freestyle.rubric]]
criterion = "Entity and Tile Contract"
weight = 28
desc = '''GameEntity has x, y, width, and height instance attributes; Tile inherits it through super().__init__, adds tile_id, and move(dx, dy) visibly updates one instance.'''

[[freestyle.rubric]]
criterion = "Rule and Item Lookup"
weight = 22
desc = '''tile_types uses lower-case tile ids and nested properties, with wall read through tile_types[tile_id]; an Item catalog proves items["potion"].heal and Inventory owns its own items list.'''

[[freestyle.rubric]]
criterion = "JSON Evidence and Retirement"
weight = 20
desc = '''The script uses json.dumps on entity.__dict__ and json.loads to print loaded state, ends with RUNEBOUND S02 SEAL, and names test_entity.py's s03 retirement without retiring the contracts.'''

[[freestyle.rubric]]
criterion = "Python Field Craft"
weight = 15
desc = '''Uses PascalCase class names, snake_case methods/variables/attributes, four-space indentation, and clear short methods with no duplicate spatial setup in Tile.'''

[[freestyle.rubric]]
criterion = "Repeatable Survey"
weight = 15
desc = '''A clean run creates two distinct entities and prints enough labeled evidence to verify independent state, inherited movement, lookup results, and the JSON round trip.'''
