[freestyle]
title = "THE WORKING 6 // The Wayfinder Walks"
brief = '''
<p>Bind the wayfinder walks into the growing RuneBound route. The commission must leave a runnable artifact whose behavior can be inspected from the named evidence.</p><ul><li>preserve the chart's data boundary and use the established names</li><li>prove the requested behavior with a repeatable run that ends at <code>RUNEBOUND S06 SEAL</code></li><li>write a short repair note explaining the nearest failure and the change that corrected it</li></ul>
'''
requires = ["s06-held-input","s06-velocity-vector","s06-aabb-rect","s06-overlap-test","s06-tile-contact","s06-solid-query","s06-collision-resolution","s06-camera-follow"]
reward = 228
xray = '''
The Cartographer checks whether the safe step commission keeps pygame.key.get_pressed(), a velocity vector, and a speed that remains understandable under the right owner, shows s07 can place an npc in the same coordinate space and trust proximity checks, and leaves evidence beyond a decorative printout.
'''

[freestyle.badge]
id = "badge-s06"
name = "SAFE STEP SEALED"
desc = "Sealed the the wayfinder walks chart with evidence another wayfinder can inspect."

[[freestyle.rubric]]
criterion = "Safe Step runs"
weight = 25
desc = '''
The the wayfinder walks artifact parses and runs with the chart's named behavior visible.
'''

[[freestyle.rubric]]
criterion = "Safe Step keeps its boundary"
weight = 35
desc = '''
The commission keeps pygame.key.get_pressed(), a velocity vector, and a speed that remains understandable and s07 can place an npc in the same coordinate space and trust proximity checks in the owners established by the lessons.
'''

[[freestyle.rubric]]
criterion = "Safe Step shows proof"
weight = 25
desc = '''
The wayfinder supplies a repeatable observation, the exact s06 seal, and a useful comparison case rather than a one-time claim.
'''

[[freestyle.rubric]]
criterion = "Cartographer's repair note"
weight = 15
desc = '''
The explanation names the failing boundary, the evidence that exposed it, and the smallest correction that restored the route.
'''

