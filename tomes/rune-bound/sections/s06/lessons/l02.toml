[[lessons]]
id = "s06-l02"
title = "The Rectangle's Four Corners"
teaches = ["s06-aabb-rect","s06-overlap-test"]
body = '''
<p>s06-l02 opens the motion and contact chart through Rectangle's. s06-l02 hears THE CARTOGRAPHER name s06-aabb-rect its first bearing. s06-l02 names one input, one change, and one output. s06-l02 gives s06-overlap-test a second mark for comparison. s06-l02 keeps the smallest successful example beside its route.</p>
<p>s06-l02 reads from left to right, then narrates state changes. s06-l02 keeps its motion and contact clue concrete and observable. s06-l02 runs twice; the second pass challenges the first. s06-l02 records which owner moved when s06-aabb-rect shifted. s06-l02 borrows a neighboring trace without hiding its owner.</p>
<p>s06-l02 asks one decision to stand alone in the margin. s06-l02 keeps s06-overlap-test visible instead of hiding it behind polish. s06-l02 tests a friendly case and a sharp edge case. s06-l02 compares both traces so s06-aabb-rect has a witness. s06-l02 names the failure before choosing a repair.</p>
<p>s06-l02 treats each handoff as a contract between maker and reader. s06-l02 supplies s06-aabb-rect; the reader checks s06-overlap-test. s06-l02 places its check where another wayfinder can repeat it. s06-l02 earns THE CARTOGRAPHER's trust through evidence, not luck. s06-l02 leaves one deliberate question for the next chart.</p>
<p>s06-l02 closes by stating what the program must preserve. s06-l02 names one input that could falsify s06-aabb-rect. s06-l02 names one output that confirms s06-overlap-test still belongs. s06-l02 runs the smallest route, inspects its trace, and annotates it. s06-l02 turns the motion and contact chart into a RuneBound waypoint.</p>
<p>s06-l02 ends with a handoff to the next chart. s06-l02 carries s06-overlap-test forward after s06-aabb-rect earns trust. s06-l02 lets THE CARTOGRAPHER record the result in plain language. s06-l02 turns a clean rerun from a guess into a fact. s06-l02 lets the next wayfinder begin without hidden context.</p>
<pre><code>print("s06-l02 // The Rectangle's Four Corners")</code></pre>
<div class="field-notes"><div class="fn-head">FIELD NOTES // S06-L02</div><p>s06-l02 <strong>Evidence.</strong> Record s06-aabb-rect; compare it with s06-overlap-test before advancing.</p><p>s06-l02 <strong>Repair.</strong> Change one cause, rerun the route, and preserve the explanation.</p></div>
'''

[[lessons.readings]]
label = "PyGame docs // keyboard // The Rectangle's Four Corners"
url = "https://www.pygame.org/docs/ref/key.html"

[[lessons.readings]]
label = "PyGame docs // Rect collision // The Rectangle's Four Corners"
url = "https://www.pygame.org/docs/ref/rect.html"

[[lessons.exercises]]
id = "s06-l02-e1"
type = "fill"
points = 18
prompt = '''
<p>s06-l02-e1: restore the missing operation in the supplied code. Use its operands and the chart evidence to complete the route without renaming the owner.</p>
'''
code = '''
wall = pygame.____(64, 0, 32, 32)
'''
answer = "Rect"
hint = '''
Look at what must happen to player_rect.colliderect(wall_rect); choose the operation that performs that job rather than the one that merely inspects the result.
'''

[[lessons.exercises]]
id = "s06-l02-e2"
type = "mc"
points = 14
prompt = '''
<p>Why must a player collision test consider the complete bounding box? Select the reading that keeps tile queries can convert every touched pixel edge into map indices possible.</p>
'''
choices = ["the camera cannot move unless the center is colored","a full box makes all tiles the same size","the event queue only reports rectangles at corners","The Rectangle's Four Corners: keep s06-aabb-rect owned by the named boundary and verify the result before handoff s06-l02-e2."]
answer = 3
whyWrong = '''
The tempting routes confuse checking only the center point and letting a wide sprite slide through a wall with the job this trial actually asks you to protect; each decoy moves ownership to the wrong part of the chart.
'''
hint = '''
Trace an axis-aligned bounding box whose full width and height participate in collision in the Safe Step chart, then compare the a visual center is not enough when an edge or corner can cross a solid tile with the evidence named in the prompt.
'''
explain = '''
The selected mark preserves a visual center is not enough when an edge or corner can cross a solid tile and leaves an axis-aligned bounding box whose full width and height participate in collision available for the next RuneBound handoff.
'''

[[lessons.exercises]]
id = "s06-l02-e3"
type = "type"
points = 10
reps = 2
prompt = '''
<p>Retype this safe step evidence exactly. Keep an axis-aligned bounding box whose full width and height participate in collision visible while you write. (Ctrl+Enter submits.)</p>
'''
code = '''
player_left = 30
wall_left = 32
print("overlap candidate", player_left + 16 > wall_left)
'''

[[lessons.exercises]]
id = "s06-l02-e4"
type = "write"
points = 30
prompt = '''
<p>Complete the safe step route and print exactly <code>RUNEBOUND S06 L02 SEAL</code>. Preserve the named data before adding the final observation.</p>
'''
starter = '''
route_mark = "aabb-corners"
print("survey pending")
# Add the chart seal after checking the route.
'''
expect = '''
RUNEBOUND S06 L02 SEAL
'''
solution = '''
route_mark = "aabb-corners"
print("RUNEBOUND S06 L02 SEAL")
'''
hint = '''
For s06-l02-e4, leave the route data intact and add only its final s06 observation; compare the starter output with the target before submitting.
'''

[[lessons.exercises]]
id = "s06-l02-e5"
type = "text"
points = 16
prompt = '''
<p>s06-l02-e5: name the Python term for the specific unit requested by this chart. Supply the language term, not the surrounding story label.</p>
'''
answer = "colliderect"
hint = '''
Recall the named boundary in The Rectangle's Four Corners; the answer is the language term for that single job, not the larger game feature.
'''
