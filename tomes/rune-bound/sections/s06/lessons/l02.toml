[[lessons]]
id = "s06-l02"
title = "Survey the Whole Footprint"
teaches = ["s06-aabb-rect", "s06-aabb-overlap-helper"]
body = '''
<p>A player is not a center point. Its <code>rect</code> is an axis-aligned bounding box (AABB): a rectangle whose sides remain parallel to the screen axes. A wall contacts it when their horizontal spans overlap <em>and</em> their vertical spans overlap. A center-only check misses the case where the wayfinder’s shoulder has entered a wall but its center has not. Keep this small geometry question independent of tiles so s08 can reuse it for combat range checks.</p>
<p>Add this module-level helper below the imports in <code>player.py</code>. It accepts two <code>pygame.Rect</code> objects and has no camera argument because collision occurs in world pixels. PyGame also supplies <code>Rect.colliderect</code>; writing the four-edge rule once makes the AABB contract visible, while the tile resolver in l03 will use the same world rectangles.</p>
<pre><code>def rectangles_overlap(first, second):
    return (
        first.left &lt; second.right
        and first.right &gt; second.left
        and first.top &lt; second.bottom
        and first.bottom &gt; second.top
    )</code></pre>
<p>Each pair rejects one separated direction. If <code>first.right &lt;= second.left</code>, the first rectangle is entirely west of the second, so there is no overlap. Edges that merely touch are legal: the strict <code>&lt;</code> and <code>&gt;</code> tests make contact at exactly one boundary pixel false. This is valuable when resolving a player against a wall—after correction, the player may stand flush against it rather than jittering as if it were still inside.</p>
<p>For a quick, temporary geometry proof, make two explicit rectangles in a scratch run and print their result. Do not ship a hardcoded collision rectangle centered on the player. The artifact lifecycle retires that tempting fixture in this chart: Player collision must use <code>player.rect</code> and the solid tiles derived from the map.</p>
<div class="callout"><strong>THE CARTOGRAPHER'S RULE:</strong> test the whole rectangle in world space; the camera changes what is seen, never what collides.</div>
<div class="field-notes"><div class="fn-head">FIELD NOTES // CORNER CASE</div><p>If a player slides through a wall corner, log the proposed <code>rect</code> and the tile rectangle. A center coordinate cannot show an edge overlap; <code>left</code>, <code>right</code>, <code>top</code>, and <code>bottom</code> can.</p></div>
'''

[[lessons.readings]]
label = "PyGame Docs // Rect"
url = "https://www.pygame.org/docs/ref/rect.html"

[[lessons.exercises]]
id = "s06-l02-e1"
type = "fill"
points = 22
prompt = '''<p>Restore the edge property that says where the first rectangle ends horizontally.</p>'''
code = '''
first.____ > second.left
'''
answer = "right"
hint = '''The comparison asks whether the first box extends past the second box’s west edge.'''
whyWrong = '''<code>left</code> is the first box’s west edge and <code>width</code> is a size, not its absolute east edge. The overlap test needs the right boundary.'''

[[lessons.exercises]]
id = "s06-l02-e2"
type = "mc"
points = 20
prompt = '''<p>Two AABBs touch exactly at one vertical edge but have no shared interior. What should <code>rectangles_overlap</code> return?</p>'''
choices = ['<code>True</code>, because touching always blocks movement', '<code>None</code>, because a camera is required', '<code>False</code>, because strict overlap excludes edge-only contact', '<code>True</code>, because a sprite sheet has frames']
answer = 2
hint = '''Read the strict <code>&lt;</code> and <code>&gt;</code> comparisons in the helper rather than replacing them with inclusive comparisons.'''
whyWrong = '''The helper has no camera or sheet dependency. With edge-only contact, one strict comparison is false, which allows a resolved player to rest flush against a wall without being considered inside it.'''
explain = '''Only shared interior counts as an AABB overlap in this helper.'''

[[lessons.exercises]]
id = "s06-l02-e3"
type = "type"
points = 12
reps = 2
prompt = '''<p>Retype the horizontal half of the reusable AABB test.</p>'''
code = '''
first.left < second.right
first.right > second.left
'''

[[lessons.exercises]]
id = "s06-l02-e4"
type = "write"
points = 35
prompt = '''<p>Write <code>overlap(a, b)</code> for rectangles stored as <code>(left, top, right, bottom)</code>. It must use all four strict edge comparisons. Print exactly <code>OVERLAP True</code> for <code>(0, 0, 16, 16)</code> versus <code>(12, 4, 24, 20)</code>, then <code>TOUCH False</code> for the first rectangle versus <code>(16, 0, 32, 16)</code>.</p>'''
starter = '''
def overlap(a, b):
    # Return whether both horizontal and vertical spans share interior.
    pass

first = (0, 0, 16, 16)
crossing = (12, 4, 24, 20)
touching = (16, 0, 32, 16)

# Print the two required observations.
'''
expect = '''
OVERLAP True
TOUCH False
'''
solution = '''
def overlap(a, b):
    return a[0] < b[2] and a[2] > b[0] and a[1] < b[3] and a[3] > b[1]

first = (0, 0, 16, 16)
crossing = (12, 4, 24, 20)
touching = (16, 0, 32, 16)

print("OVERLAP", overlap(first, crossing))
print("TOUCH", overlap(first, touching))
'''
hint = '''Tuple positions are left, top, right, bottom. Join the two horizontal and two vertical strict comparisons with <code>and</code>.'''

[[lessons.exercises]]
id = "s06-l02-e5"
type = "text"
points = 18
prompt = '''<p>What is the name of the module-level helper that s08 will reuse for two world-space rectangles?</p>'''
answer = "rectangles_overlap"
hint = '''It is the plural-noun function defined before <code>Player</code> in <code>player.py</code>.'''
whyWrong = '''<code>colliderect</code> is PyGame’s Rect method, while <code>is_solid</code> belongs to map data. This chart creates a named project helper so later systems share the same AABB rule.'''
