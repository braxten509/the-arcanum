[[lessons.exercises]]
id = "s06-l03-e1"
type = "mc"
points = 20
prompt = '''<p>Why does the last touched column use <code>(rect.right - 1) // TILE_SIZE</code> rather than <code>rect.right // TILE_SIZE</code>?</p>'''
choices = ['The camera requires a negative offset', 'A right edge exactly on a tile boundary is not inside the next tile', 'CSV rows are one-indexed', 'The sprite group only updates columns']
answer = 1
hint = '''Picture a rect from x=0 through x=31 on a 32-pixel grid. Its boundary at 32 should not add the next cell.'''
whyWrong = '''Camera offsets never enter collision indexing, CSV rows use the established zero-based list indexes, and Groups do not know map columns. Subtracting one keeps an edge on a boundary in the tile it actually occupies.'''
explain = '''The formula avoids a false collision with an adjacent tile when the rect is flush with its boundary.'''

