[[lessons.exercises]]
id = "s06-l03-e3"
type = "write"
points = 35
prompt = '''<p>Model a 32-pixel collision survey with the supplied grid, where <code>"wall"</code> blocks movement. Define <code>touched_ids(grid, left, right, top, bottom)</code> that returns the ids of every touched cell in row-major order, using <code>right - 1</code> and <code>bottom - 1</code> for the last indexes. For the rectangle from x=16 to x=48 and y=0 to y=32, print exactly <code>TOUCHED grass wall</code> and <code>BLOCKED True</code>.</p>'''
starter = '''
TILE_SIZE = 32
grid = [["grass", "wall"], ["path", "grass"]]

# Define touched_ids, inspect the supplied rectangle, and report whether wall appears.
'''
expect = '''
TOUCHED grass wall
BLOCKED True
'''
solution = '''
TILE_SIZE = 32
grid = [["grass", "wall"], ["path", "grass"]]

def touched_ids(grid, left, right, top, bottom):
    first_col = left // TILE_SIZE
    last_col = (right - 1) // TILE_SIZE
    first_row = top // TILE_SIZE
    last_row = (bottom - 1) // TILE_SIZE
    ids = []
    for row in range(first_row, last_row + 1):
        for col in range(first_col, last_col + 1):
            ids.append(grid[row][col])
    return ids

ids = touched_ids(grid, 16, 48, 0, 32)
print("TOUCHED", *ids)
print("BLOCKED", "wall" in ids)
'''
hint = '''Compute row and column bounds with integer division, then append <code>grid[row][col]</code> inside row-major nested loops.'''

