[[lessons]]
id = "s06-l03"
title = "From Pixels to Solid Tiles"
teaches = ["s06-tile-contact","s06-solid-query"]
body = '''
<p>s06-l03 opens the motion and contact chart through From. s06-l03 hears THE CARTOGRAPHER name s06-tile-contact its first bearing. s06-l03 names one input, one change, and one output. s06-l03 gives s06-solid-query a second mark for comparison. s06-l03 keeps the smallest successful example beside its route.</p>
<p>s06-l03 reads from left to right, then narrates state changes. s06-l03 keeps its motion and contact clue concrete and observable. s06-l03 runs twice; the second pass challenges the first. s06-l03 records which owner moved when s06-tile-contact shifted. s06-l03 borrows a neighboring trace without hiding its owner.</p>
<p>s06-l03 asks one decision to stand alone in the margin. s06-l03 keeps s06-solid-query visible instead of hiding it behind polish. s06-l03 tests a friendly case and a sharp edge case. s06-l03 compares both traces so s06-tile-contact has a witness. s06-l03 names the failure before choosing a repair.</p>
<p>s06-l03 treats each handoff as a contract between maker and reader. s06-l03 supplies s06-tile-contact; the reader checks s06-solid-query. s06-l03 places its check where another wayfinder can repeat it. s06-l03 earns THE CARTOGRAPHER's trust through evidence, not luck. s06-l03 leaves one deliberate question for the next chart.</p>
<p>s06-l03 closes by stating what the program must preserve. s06-l03 names one input that could falsify s06-tile-contact. s06-l03 names one output that confirms s06-solid-query still belongs. s06-l03 runs the smallest route, inspects its trace, and annotates it. s06-l03 turns the motion and contact chart into a RuneBound waypoint.</p>
<p>s06-l03 ends with a handoff to the next chart. s06-l03 carries s06-solid-query forward after s06-tile-contact earns trust. s06-l03 lets THE CARTOGRAPHER record the result in plain language. s06-l03 turns a clean rerun from a guess into a fact. s06-l03 lets the next wayfinder begin without hidden context.</p>
<pre><code>print("s06-l03 // From Pixels to Solid Tiles")</code></pre>
<div class="field-notes"><div class="fn-head">FIELD NOTES // S06-L03</div><p>s06-l03 <strong>Evidence.</strong> Record s06-tile-contact; compare it with s06-solid-query before advancing.</p><p>s06-l03 <strong>Repair.</strong> Change one cause, rerun the route, and preserve the explanation.</p></div>
'''

[[lessons.readings]]
label = "PyGame docs // keyboard // From Pixels to Solid Tiles"
url = "https://www.pygame.org/docs/ref/key.html"

[[lessons.exercises]]
id = "s06-l03-e1"
type = "text"
points = 16
prompt = '''
<p>s06-l03-e1: name the Python term for the specific unit requested by this chart. Supply the language term, not the surrounding story label.</p>
'''
answer = "is_solid"
hint = '''
Recall the named boundary in From Pixels to Solid Tiles; the answer is the language term for that single job, not the larger game feature.
'''

[[lessons.exercises]]
id = "s06-l03-e2"
type = "fill"
points = 18
prompt = '''
<p>s06-l03-e2: restore the missing operation in the supplied code. Use its operands and the chart evidence to complete the route without renaming the owner.</p>
'''
code = '''
tile_x = world_x // ____
'''
answer = "TILE_SIZE"
hint = '''
Look at what must happen to tile_x = rect.left // tile_size; choose the operation that performs that job rather than the one that merely inspects the result.
'''

[[lessons.exercises]]
id = "s06-l03-e3"
type = "mc"
points = 14
prompt = '''
<p>What is the safe sequence for checking a player's proposed movement? Select the reading that keeps the resolver can push the player back using a known tile contract possible.</p>
'''
choices = ["read only the center cell and trust the sprite art","From Pixels to Solid Tiles: keep s06-tile-contact owned by the named boundary and verify the result before handoff s06-l03-e3.","move first and repair the map after drawing","ask the camera whether the tile looks green"]
answer = 1
whyWrong = '''
The tempting routes confuse checking one tile from the center and missing a second tile touched by the player's edge with the job this trial actually asks you to protect; each decoy moves ownership to the wrong part of the chart.
'''
hint = '''
Trace TileMap.is_solid(tile_x, tile_y) as the narrow question collision needs in the Safe Step chart, then compare the pixel geometry chooses candidate cells while tile data decides whether each cell blocks with the evidence named in the prompt.
'''
explain = '''
The selected mark preserves pixel geometry chooses candidate cells while tile data decides whether each cell blocks and leaves tilemap.is_solid(tile_x, tile_y) as the narrow question collision needs available for the next RuneBound handoff.
'''

[[lessons.exercises]]
id = "s06-l03-e4"
type = "write"
points = 30
prompt = '''
<p>Complete the safe step route and print exactly <code>RUNEBOUND S06 L03 SEAL</code>. Preserve the named data before adding the final observation.</p>
'''
starter = '''
route_mark = "solid-contact"
print("survey pending")
# Add the chart seal after checking the route.
'''
expect = '''
RUNEBOUND S06 L03 SEAL
'''
solution = '''
route_mark = "solid-contact"
print("RUNEBOUND S06 L03 SEAL")
'''
hint = '''
For s06-l03-e4, leave the route data intact and add only its final s06 observation; compare the starter output with the target before submitting.
'''

[[lessons.exercises]]
id = "s06-l03-e5"
type = "type"
points = 10
reps = 2
prompt = '''
<p>Retype this safe step evidence exactly. Keep tilemap.is_solid(tile_x, tile_y) as the narrow question collision needs visible while you write. (Ctrl+Enter submits.)</p>
'''
code = '''
TILE_SIZE = 32
world_x = 65
tile_x = world_x // TILE_SIZE
print(tile_x)
'''

