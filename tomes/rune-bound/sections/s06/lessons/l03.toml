[[lessons]]
id = "s06-l03"
title = "Ask Every Touched Tile"
teaches = ["s06-tile-grid-collision", "s06-axis-collision-resolution"]
body = '''
<p>Now bind rectangle geometry to the map. s04’s <code>TileMap.is_solid(world_x, world_y)</code> accepts a world pixel point, converts it with <code>// TILE_SIZE</code>, and ultimately reads <code>grid[row][col]</code>. The Player must ask it about every cell touched by the proposed AABB, not merely the cell under the player’s center. This is the promised return to s01’s row-then-column geography.</p>
<p>Add these methods inside <code>Player</code>. <code>hits_solid_tile</code> derives the first and last touched column and row from a rect. The <code>- 1</code> matters: a right edge at x=32 belongs just beyond column 0, so a 32-pixel-wide player resting from x=0 through x=31 should not claim column 1. For each candidate cell, <code>is_solid</code> receives that cell’s top-left <em>world pixel</em>, not the tile indexes themselves.</p>
<pre><code>from tilemap import TILE_SIZE

def hits_solid_tile(self, tile_map, rect):
    first_col = rect.left // TILE_SIZE
    last_col = (rect.right - 1) // TILE_SIZE
    first_row = rect.top // TILE_SIZE
    last_row = (rect.bottom - 1) // TILE_SIZE
    for row in range(first_row, last_row + 1):
        for col in range(first_col, last_col + 1):
            if tile_map.is_solid(col * TILE_SIZE, row * TILE_SIZE):
                return True
    return False

def move_and_collide(self, tile_map, dt):
    old_x = self.rect.x
    self.rect.x += self.velocity.x * dt
    if self.hits_solid_tile(tile_map, self.rect):
        self.rect.x = old_x
    old_y = self.rect.y
    self.rect.y += self.velocity.y * dt
    if self.hits_solid_tile(tile_map, self.rect):
        self.rect.y = old_y</code></pre>
<p>Resolve one axis at a time. Save the exact legal integer coordinate, propose the x motion, check the full footprint, and restore <code>old_x</code> if it enters a solid tile. Then do the same for y. This preserves legal movement along a wall instead of undoing a whole diagonal step. Restoring the saved coordinate is safer than subtracting the floating-point proposal from a <code>pygame.Rect</code>, because Rect rounds assignments to whole pixels and an add-then-subtract pair can otherwise drift by a pixel.</p>
<p>Use the same <code>dt</code> that already drives animation. At 160 pixels per second and <code>dt = 0.1</code>, a pure east step proposes 16 pixels. For this beginner-scale game, Rect’s whole-pixel motion is acceptable; the saved old coordinate guarantees a blocked proposal returns to the actual last legal position.</p>
<div class="callout"><strong>THE CARTOGRAPHER'S RULE:</strong> pixels choose candidate tile indexes; the tile map’s data decides whether each candidate blocks.</div>
<div class="field-notes"><div class="fn-head">FIELD NOTES // MAP BOUNDARY</div><p><code>TileMap.is_solid</code> returns false outside the map under its existing contract. The supplied overworld has walls at its border, so test collision against those deliberate wall cells rather than changing s04’s query semantics.</p></div>
'''

