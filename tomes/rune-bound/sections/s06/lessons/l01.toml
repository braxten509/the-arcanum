[[lessons]]
id = "s06-l01"
title = "Give the Wayfinder a Heading"
teaches = ["s06-held-input", "s06-velocity-vector"]
body = '''
<p>Wayfinder, s05’s <code>test_sprite</code> walks by itself only to prove that animation works. It cannot become a player by accepting a single <code>KEYDOWN</code> event: walking must continue for every frame a key remains down. Keep the event loop for window actions such as <code>pygame.QUIT</code>. Then, once per frame, ask <code>pygame.key.get_pressed()</code> for the current keyboard state. This is the same held-key boundary s03 used for the camera, but its owner now changes: the Player will turn keys into a proposed world movement.</p>
<p>In the new <code>player.py</code>, use <code>pygame.math.Vector2</code> for that proposal. A vector has an <code>x</code> and <code>y</code> component, so left/right and up/down can combine without four competing position assignments. This first method reads keys but deliberately does not move the rect yet; collision gets that responsibility in the next charts.</p>
<pre><code>import pygame

from sprites import AnimatedSprite


class Player(AnimatedSprite):
    def __init__(self, sheet, x, y):
        super().__init__(sheet, x, y)
        self.velocity = pygame.math.Vector2()
        self.speed = 160

    def handle_input(self, keys):
        self.velocity.update(0, 0)
        self.velocity.x = keys[pygame.K_RIGHT] - keys[pygame.K_LEFT]
        self.velocity.y = keys[pygame.K_DOWN] - keys[pygame.K_UP]
        if self.velocity.length_squared() &gt; 0:
            self.velocity = self.velocity.normalize() * self.speed
            self.set_state("walk")
        else:
            self.set_state("idle")</code></pre>
<p>Subtraction is useful here because PyGame’s pressed values behave as false/true, which act like <code>0</code>/<code>1</code> in arithmetic. Right minus left makes east positive and west negative; down minus up does the same vertically. When a diagonal has both components, normalization makes its length one before multiplication by <code>speed</code>, preventing diagonal travel from being faster. The velocity is measured in world pixels per second, not pixels per frame, so the later movement formula is <code>velocity * dt</code>.</p>
<p>Do not give the Player camera coordinates. The inherited <code>rect</code> stays in world pixels, while s05’s <code>draw(surface, camera)</code> subtracts the camera only when painting. That separation is what lets s07 later measure NPC proximity in the same world.</p>
<div class="callout"><strong>THE CARTOGRAPHER'S RULE:</strong> events announce one-time happenings; held-key polling reports a condition that movement may use every frame.</div>
<div class="field-notes"><div class="fn-head">FIELD NOTES // DIAGONAL CHECK</div><p>Hold Right alone, then Right+Down. Both routes should have the same overall speed. If the diagonal is faster, inspect whether normalization happened before multiplying by <code>speed</code>.</p></div>
'''

[[lessons.readings]]
label = "PyGame Docs // key"
url = "https://www.pygame.org/docs/ref/key.html"

[[lessons.readings]]
label = "PyGame Docs // Vector2"
url = "https://www.pygame.org/docs/ref/math.html"

[[lessons.exercises]]
id = "s06-l01-e1"
type = "mc"
points = 20
prompt = '''<p>Which input boundary should RuneBound use to keep a player walking while the Right arrow remains held?</p>'''
choices = ['<code>pygame.event.get()</code> only', '<code>pygame.key.get_pressed()</code> once per frame', '<code>pygame.display.flip()</code>', '<code>clock.tick(FPS)</code>']
answer = 1
hint = '''Look for the API that returns the current state of every key rather than one queued event.'''
whyWrong = '''The event queue remains essential for QUIT and one-press actions, but a KEYDOWN event is not a continuous movement state. Flipping presents pixels and ticking measures elapsed time; neither reads the keyboard.'''
explain = '''Polling once each frame gives Player.handle_input the current held-key state.'''

[[lessons.exercises]]
id = "s06-l01-e2"
type = "type"
points = 12
reps = 2
prompt = '''<p>Retype the diagonal-safe velocity conversion. It keeps the vector in pixels per second.</p>'''
code = '''
if velocity.length_squared() > 0:
    velocity = velocity.normalize() * speed
'''

[[lessons.exercises]]
id = "s06-l01-e3"
type = "fill"
points = 22
prompt = '''<p>Restore the vector operation that clears yesterday’s proposed movement before this frame reads keys.</p>'''
code = '''
self.velocity.____(0, 0)
'''
answer = "update"
hint = '''This Vector2 method replaces both components with the two supplied values.'''
whyWrong = '''<code>normalize</code> changes a nonzero direction to length one; it does not clear stale components. The method here assigns a fresh x and y before the key arithmetic.'''

[[lessons.exercises]]
id = "s06-l01-e4"
type = "write"
points = 34
prompt = '''<p>Model the input calculation without opening PyGame. With <code>right = 1</code>, <code>left = 0</code>, <code>down = 1</code>, and <code>up = 0</code>, calculate <code>velocity_x</code> and <code>velocity_y</code> by subtraction. Print exactly <code>VELOCITY 1 1</code> and <code>MOVING True</code>.</p>'''
starter = '''
right = 1
left = 0
down = 1
up = 0

# Derive the two velocity components and report whether either component is nonzero.
'''
expect = '''
VELOCITY 1 1
MOVING True
'''
solution = '''
right = 1
left = 0
down = 1
up = 0

velocity_x = right - left
velocity_y = down - up

print("VELOCITY", velocity_x, velocity_y)
print("MOVING", velocity_x != 0 or velocity_y != 0)
'''
hint = '''Right and down are the positive directions, so subtract left from right and up from down.'''

[[lessons.exercises]]
id = "s06-l01-e5"
type = "text"
points = 18
prompt = '''<p>What Vector2 method makes a nonzero diagonal direction have length one before speed is applied?</p>'''
answer = "normalize"
hint = '''It is called immediately before multiplication by <code>self.speed</code> in the worked method.'''
whyWrong = '''<code>update</code> assigns components and <code>length_squared</code> only measures the vector. The required method returns a direction whose magnitude is one.'''
