[[lessons]]
id = "s06-l01"
title = "Held Keys and Honest Velocity"
teaches = ["s06-held-input","s06-velocity-vector"]
body = '''
<p>s06-l01 opens the motion and contact chart through Held. s06-l01 hears THE CARTOGRAPHER name s06-held-input its first bearing. s06-l01 names one input, one change, and one output. s06-l01 gives s06-velocity-vector a second mark for comparison. s06-l01 keeps the smallest successful example beside its route.</p>
<p>s06-l01 reads from left to right, then narrates state changes. s06-l01 keeps its motion and contact clue concrete and observable. s06-l01 runs twice; the second pass challenges the first. s06-l01 records which owner moved when s06-held-input shifted. s06-l01 borrows a neighboring trace without hiding its owner.</p>
<p>s06-l01 asks one decision to stand alone in the margin. s06-l01 keeps s06-velocity-vector visible instead of hiding it behind polish. s06-l01 tests a friendly case and a sharp edge case. s06-l01 compares both traces so s06-held-input has a witness. s06-l01 names the failure before choosing a repair.</p>
<p>s06-l01 treats each handoff as a contract between maker and reader. s06-l01 supplies s06-held-input; the reader checks s06-velocity-vector. s06-l01 places its check where another wayfinder can repeat it. s06-l01 earns THE CARTOGRAPHER's trust through evidence, not luck. s06-l01 leaves one deliberate question for the next chart.</p>
<p>s06-l01 closes by stating what the program must preserve. s06-l01 names one input that could falsify s06-held-input. s06-l01 names one output that confirms s06-velocity-vector still belongs. s06-l01 runs the smallest route, inspects its trace, and annotates it. s06-l01 turns the motion and contact chart into a RuneBound waypoint.</p>
<p>s06-l01 ends with a handoff to the next chart. s06-l01 carries s06-velocity-vector forward after s06-held-input earns trust. s06-l01 lets THE CARTOGRAPHER record the result in plain language. s06-l01 turns a clean rerun from a guess into a fact. s06-l01 lets the next wayfinder begin without hidden context.</p>
<pre><code>print("s06-l01 // Held Keys and Honest Velocity")</code></pre>
<div class="field-notes"><div class="fn-head">FIELD NOTES // S06-L01</div><p>s06-l01 <strong>Evidence.</strong> Record s06-held-input; compare it with s06-velocity-vector before advancing.</p><p>s06-l01 <strong>Repair.</strong> Change one cause, rerun the route, and preserve the explanation.</p></div>
'''

[[lessons.readings]]
label = "PyGame docs // keyboard // Held Keys and Honest Velocity"
url = "https://www.pygame.org/docs/ref/key.html"

[[lessons.exercises]]
id = "s06-l01-e1"
type = "mc"
points = 14
prompt = '''
<p>Why is held-key polling the right shape for walking? Select the reading that keeps collision code can receive a proposed movement rather than raw keyboard symbols possible.</p>
'''
choices = ["it fires exactly once when the key first goes down","Held Keys and Honest Velocity: keep s06-held-input owned by the named boundary and verify the result before handoff s06-l01-e1.","it tests whether a tile is solid without a map","it advances a sprite sheet row by itself"]
answer = 1
whyWrong = '''
The tempting routes confuse using keydown for continuous walking and making movement depend on event repeat settings with the job this trial actually asks you to protect; each decoy moves ownership to the wrong part of the chart.
'''
hint = '''
Trace pygame.key.get_pressed(), a velocity vector, and a speed that remains understandable in the Safe Step chart, then compare the event triggers handle one press while polling describes a key still held down with the evidence named in the prompt.
'''
explain = '''
The selected mark preserves event triggers handle one press while polling describes a key still held down and leaves pygame.key.get_pressed(), a velocity vector, and a speed that remains understandable available for the next RuneBound handoff.
'''

[[lessons.exercises]]
id = "s06-l01-e2"
type = "text"
points = 16
prompt = '''
<p>s06-l01-e2: name the Python term for the specific unit requested by this chart. Supply the language term, not the surrounding story label.</p>
'''
answer = "get_pressed"
hint = '''
Recall the named boundary in Held Keys and Honest Velocity; the answer is the language term for that single job, not the larger game feature.
'''

[[lessons.exercises]]
id = "s06-l01-e3"
type = "fill"
points = 18
prompt = '''
<p>s06-l01-e3: restore the missing operation in the supplied code. Use its operands and the chart evidence to complete the route without renaming the owner.</p>
'''
code = '''
velocity = pygame.math.____()
'''
answer = "Vector2"
hint = '''
Look at what must happen to pressed = pygame.key.get_pressed(); velocity.x = pressed[pygame.k_right]; choose the operation that performs that job rather than the one that merely inspects the result.
'''

[[lessons.exercises]]
id = "s06-l01-e4"
type = "type"
points = 10
reps = 2
prompt = '''
<p>Retype this safe step evidence exactly. Keep pygame.key.get_pressed(), a velocity vector, and a speed that remains understandable visible while you write. (Ctrl+Enter submits.)</p>
'''
code = '''
speed = 120
velocity_x = 1
print(speed * velocity_x)
'''
