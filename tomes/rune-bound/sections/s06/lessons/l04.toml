[[lessons]]
id = "s06-l04"
title = "The Last Legal Step"
teaches = ["s06-collision-resolution","s06-camera-follow"]
body = '''
<p>s06-l04 opens the motion and contact chart through Last. s06-l04 hears THE CARTOGRAPHER name s06-collision-resolution its first bearing. s06-l04 names one input, one change, and one output. s06-l04 gives s06-camera-follow a second mark for comparison. s06-l04 keeps the smallest successful example beside its route.</p>
<p>s06-l04 reads from left to right, then narrates state changes. s06-l04 keeps its motion and contact clue concrete and observable. s06-l04 runs twice; the second pass challenges the first. s06-l04 records which owner moved when s06-collision-resolution shifted. s06-l04 borrows a neighboring trace without hiding its owner.</p>
<p>s06-l04 asks one decision to stand alone in the margin. s06-l04 keeps s06-camera-follow visible instead of hiding it behind polish. s06-l04 tests a friendly case and a sharp edge case. s06-l04 compares both traces so s06-collision-resolution has a witness. s06-l04 names the failure before choosing a repair.</p>
<p>s06-l04 treats each handoff as a contract between maker and reader. s06-l04 supplies s06-collision-resolution; the reader checks s06-camera-follow. s06-l04 places its check where another wayfinder can repeat it. s06-l04 earns THE CARTOGRAPHER's trust through evidence, not luck. s06-l04 leaves one deliberate question for the next chart.</p>
<p>s06-l04 closes by stating what the program must preserve. s06-l04 names one input that could falsify s06-collision-resolution. s06-l04 names one output that confirms s06-camera-follow still belongs. s06-l04 runs the smallest route, inspects its trace, and annotates it. s06-l04 turns the motion and contact chart into a RuneBound waypoint.</p>
<p>s06-l04 ends with a handoff to the next chart. s06-l04 carries s06-camera-follow forward after s06-collision-resolution earns trust. s06-l04 lets THE CARTOGRAPHER record the result in plain language. s06-l04 turns a clean rerun from a guess into a fact. s06-l04 lets the next wayfinder begin without hidden context.</p>
<pre><code>print("s06-l04 // The Last Legal Step")</code></pre>
<div class="field-notes"><div class="fn-head">FIELD NOTES // S06-L04</div><p>s06-l04 <strong>Evidence.</strong> Record s06-collision-resolution; compare it with s06-camera-follow before advancing.</p><p>s06-l04 <strong>Repair.</strong> Change one cause, rerun the route, and preserve the explanation.</p></div>
'''

[[lessons.readings]]
label = "PyGame docs // keyboard // The Last Legal Step"
url = "https://www.pygame.org/docs/ref/key.html"

[[lessons.readings]]
label = "PyGame docs // Rect collision // The Last Legal Step"
url = "https://www.pygame.org/docs/ref/rect.html"

[[lessons.exercises]]
id = "s06-l04-e1"
type = "write"
points = 30
prompt = '''
<p>Complete the safe step route and print exactly <code>RUNEBOUND S06 L04 SEAL</code>. Preserve the named data before adding the final observation.</p>
'''
starter = '''
route_mark = "legal-step"
print("survey pending")
# Add the chart seal after checking the route.
'''
expect = '''
RUNEBOUND S06 L04 SEAL
'''
solution = '''
route_mark = "legal-step"
print("RUNEBOUND S06 L04 SEAL")
'''
hint = '''
For s06-l04-e1, leave the route data intact and add only its final s06 observation; compare the starter output with the target before submitting.
'''

[[lessons.exercises]]
id = "s06-l04-e2"
type = "mc"
points = 14
prompt = '''
<p>When should camera follow use the player's position? Select the reading that keeps s07 can place an npc in the same coordinate space and trust proximity checks possible.</p>
'''
choices = ["before input is read so the camera predicts the future","The Last Legal Step: keep s06-collision-resolution owned by the named boundary and verify the result before handoff s06-l04-e2.","from the tile catalog's solid flag alone","only when a QUIT event arrives"]
answer = 1
whyWrong = '''
The tempting routes confuse moving both axes together and allowing a diagonal corner to tunnel through a wall with the job this trial actually asks you to protect; each decoy moves ownership to the wrong part of the chart.
'''
hint = '''
Trace a player position that keeps legal motion and a camera centered on the resulting rect in the Safe Step chart, then compare the collision correction belongs after the proposed step but before the frame is drawn with the evidence named in the prompt.
'''
explain = '''
The selected mark preserves collision correction belongs after the proposed step but before the frame is drawn and leaves a player position that keeps legal motion and a camera centered on the resulting rect available for the next RuneBound handoff.
'''

