[[lessons]]
id = "s06-l04"
title = "Let the Map Follow the Walker"
teaches = ["s06-player-integration", "s06-camera-follow"]
body = '''
<p>The final route retires s05’s automatic proof. In <code>main.py</code>, remove <code>DEMO_SPEED</code>, <code>test_sprite</code>, its wraparound block, and the old arrow-key camera controls. Keep the event pump, clock, TileMap, supplied sheet, actor Group, ground-first draw order, and one flip. Create a <code>Player</code>, put that one player in <code>actors</code>, then let Player own proposed movement and collision before the camera reads the resulting legal rect.</p>
<pre><code>from player import Player

player = Player(sheet, 96, 96)
actors = pygame.sprite.Group(player)
camera = [0.0, 0.0]

# Inside while running, after the QUIT event loop:
keys = pygame.key.get_pressed()
player.handle_input(keys)
player.move_and_collide(tile_map, dt)
actors.update(dt)

camera[0] = max(0, player.rect.centerx - screen.get_width() / 2)
camera[1] = max(0, player.rect.centery - screen.get_height() / 2)</code></pre>
<p>Camera follow happens after collision resolution. If a wall denies a step, the camera follows the legal world position, so it cannot show a viewpoint drifting past a stopped player. The <code>max(0, ...)</code> clamp retains the upper-left map boundary from s04. The supplied 25×19 map is only 800×608 pixels, so the camera can move only slightly downward at this milestone; that is honest behavior, not a failed follow system.</p>
<p>Then retain the existing render tail exactly: clear the screen, call <code>tile_map.render(screen, camera)</code>, loop over <code>actors</code> and call <code>actor.draw(screen, camera)</code>, and call <code>pygame.display.flip()</code> once. <code>AnimatedSprite.draw</code> uses <code>surface.blit</code> after subtracting the camera. The Player’s rect never receives that subtraction, which fulfills s03’s Surface/blit/flip contract.</p>
<p>Run <code>python3 main.py</code> from the RuneBound project folder. Walk into a wall from the west, then release and walk along it. The sprite must stop on entry but retain the non-blocked axis. Close with X and relaunch. If the player moves but animation freezes, ensure <code>actors.update(dt)</code> is still inside the loop; if the player and map separate during follow, inspect the draw method for a missing camera subtraction rather than mutating the rect for rendering.</p>
<div class="callout"><strong>THE CARTOGRAPHER'S RULE:</strong> resolve the world first, aim the camera second, paint the completed route last.</div>
<div class="field-notes"><div class="fn-head">FIELD NOTES // NEXT CHART</div><p>s07 may add NPCs to <code>actors</code> and compare their world rects with Player’s world rect. It must preserve Player’s input/collision ownership and the camera-adjusted draw boundary.</p></div>
'''

[[lessons.readings]]
label = "PyGame Docs // sprite Group"
url = "https://www.pygame.org/docs/ref/sprite.html"

[[lessons.readings]]
label = "PyGame Docs // display"
url = "https://www.pygame.org/docs/ref/display.html"

[[lessons.exercises]]
id = "s06-l04-e1"
type = "mc"
points = 20
prompt = '''<p>When should <code>main.py</code> calculate camera follow from <code>player.rect.centerx</code> and <code>centery</code>?</p>'''
choices = ['Before Player reads held keys', 'After collision resolution and before drawing', 'Inside TileMap.render before the grid loads', 'After pygame.quit()']
answer = 1
hint = '''The camera must read the final legal player position for this frame, but painting has not happened yet.'''
whyWrong = '''Before input and collision the rect is stale; TileMap should not own the Player camera; after quit there is no active frame. The camera follows the resolved world state before rendering converts it to screen pixels.'''
explain = '''Following after resolution prevents the viewpoint from moving beyond a player stopped by a wall.'''

[[lessons.exercises]]
id = "s06-l04-e2"
type = "fill"
points = 22
prompt = '''<p>Restore the display method that presents the completed ground-and-actor frame exactly once.</p>'''
code = '''
pygame.display.____()
'''
answer = "flip"
hint = '''s03 assigned presentation to the display module after every frame layer is painted.'''
whyWrong = '''<code>set_mode</code> creates the display Surface and <code>blit</code> belongs to a Surface. This final display call presents the already-drawn back buffer.'''

[[lessons.exercises]]
id = "s06-l04-e3"
type = "write"
points = 35
prompt = '''<p>Model the camera calculation in plain Python. A player center is <code>(460, 350)</code> and the screen is <code>800×600</code>. Compute camera coordinates by subtracting half the screen size and clamping each result to zero. Print exactly <code>CAMERA 60.0 50.0</code>. This lab models the GUI game; RuneBound itself receives movement through held keys, not stdin.</p>'''
starter = '''
player_center_x = 460
player_center_y = 350
screen_width = 800
screen_height = 600

# Compute and print the clamped camera coordinates.
'''
expect = '''
CAMERA 60.0 50.0
'''
solution = '''
player_center_x = 460
player_center_y = 350
screen_width = 800
screen_height = 600

camera_x = max(0, player_center_x - screen_width / 2)
camera_y = max(0, player_center_y - screen_height / 2)

print("CAMERA", camera_x, camera_y)
'''
hint = '''Use division by <code>2</code> for each screen midpoint, subtract it from the player center, then wrap each result in <code>max(0, ...)</code>.'''

