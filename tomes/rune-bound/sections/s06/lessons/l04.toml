'''

[[lessons.exercises]]
id = "s06-l04-e4"
type = "fill"
points = 18
prompt = '''
<p>s06-l04-e4: restore the missing operation in the supplied code. Use its operands and the chart evidence to complete the route without renaming the owner.</p>
'''
code = '''
player_rect.____(dx, 0)
'''
answer = "move_ip"
hint = '''
Look at what must happen to player_rect.move_ip(dx, 0) followed by a solid check; choose the operation that performs that job rather than the one that merely inspects the result.
'''
