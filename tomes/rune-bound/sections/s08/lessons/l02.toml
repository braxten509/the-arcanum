[[lessons]]
id = "s08-l02"
title = "The Turn Ledger"
teaches = ["s08-turn-order", "s08-player-actions"]
body = '''
<p>The map runs every frame, but a turn resolves only after one committed choice. Create <code>data/enemies.json</code> now and retire l01’s local Slime variables completely:</p>
<pre><code>{
  "slime": {"name": "Slime", "hp": 12, "max_hp": 12, "attack": 5, "defense": 1}
}</code></pre>
<p>In <code>combat.py</code>, load that file with <code>json.load</code> when creating the encounter and build <code>StatBlock(data["hp"], data["max_hp"], data["attack"], data["defense"])</code>. These values are authored data, not a second hardcoded balance table. Leave Player’s starting record in <code>player.py</code>: it is Player state, whereas the JSON entry describes an enemy template.</p>
<p>Add the complete <code>CombatSystem(player, enemy)</code> below <code>deal_damage</code> in <code>combat.py</code>. It owns <code>player</code>, <code>enemy</code>, <code>active = True</code>, <code>result = None</code>, <code>player_defending = False</code>, and a short <code>message</code>. Its <code>player_action(action)</code> rejects calls after an outcome; attack damages the enemy, defend changes only the immediately following enemy hit, and flee closes without a victory. The enemy response is complete here rather than left as an implied method: it refreshes the taught AI state, calculates the same minimum-one damage rule, halves that hit while defending, applies the zero HP floor, clears the defend flag, and records a loss if needed.</p>
<pre><code>class CombatSystem:
    def __init__(self, player, enemy):
        self.player = player
        self.enemy = enemy
        self.active = True
        self.result = None
        self.player_defending = False
        self.message = "A Slime blocks the road. A attack, D defend, F flee."

    def player_action(self, action):
        if not self.active:
            return
        if action not in {"attack", "defend", "flee"}:
            self.message = "Choose A, D, or F."
            return
        if action == "flee":
            self.active = False
            self.result = "fled"
            self.message = "You leave the Slime behind."
            return

        self.player_defending = action == "defend"
        if action == "attack":
            damage = deal_damage(self.player, self.enemy)
            self.message = f"You deal {damage} damage."
        else:
            self.message = "You brace for the next hit."

        if self.enemy.stats.hp == 0:
            self.active = False
            self.result = "won"
            self.message = "The Slime dissolves."
            return
        self.enemy_turn()

    def enemy_turn(self):
        state = self.enemy.update_ai(self.player)
        damage = max(1, self.enemy.stats.attack - self.player.stats.defense)
        if self.player_defending:
            damage = max(1, damage // 2)
        self.player.stats.hp = max(0, self.player.stats.hp - damage)
        self.player_defending = False
        self.message += f" Slime {state}: {damage} damage."
        if self.player.stats.hp == 0:
            self.active = False
            self.result = "lost"
            self.message = "The chart goes dark."</code></pre>
<p>The Slime’s 12 HP and Player’s 7 attack against defense 1 make the acceptance encounter deterministic: the first attack deals 6, the Slime answers once, and the second attack wins before a second response. Do not change those values while claiming the same two-attack proof.</p>
<p>Use the s03 split honestly. In the existing <code>for event in pygame.event.get()</code> block, <code>KEYDOWN</code> turns one press into Attack, Defend, or Flee: A, D, and F. Keep one <code>keys = pygame.key.get_pressed()</code> read per frame, but only call <code>player.handle_input(keys)</code> while no combat is active. Held arrows remain continuous walking; combat choices are single events, so holding a key cannot silently spend several turns.</p>
<div class="callout"><strong>THE CARTOGRAPHER'S RULE:</strong> one player action resolves, then at most one enemy response resolves, then the next prompt appears.</div>
<div class="field-notes"><div class="fn-head">FIELD NOTES // BAD INPUT</div><p>If an unfamiliar key reaches <code>player_action</code>, leave the ledger unchanged and set a helpful message. Never let drawing decide a turn, and never let a finished fight accept another key.</p></div>
'''

[[lessons.readings]]
label = "Python Docs // json.load"
url = "https://docs.python.org/3/library/json.html#json.load"

[[lessons.readings]]
label = "PyGame Docs // event queue"
url = "https://www.pygame.org/docs/ref/event.html"

[[lessons.exercises]]
id = "s08-l02-e1"
type = "fill"
points = 22
prompt = '''<p>Restore the event type for a single Attack key press. Do not use held-key polling for this one-off choice.</p>'''
code = '''
if event.type == pygame.____ and event.key == pygame.K_a:
    combat.player_action("attack")
'''
answer = "KEYDOWN"
hint = '''s03 distinguished an occurrence from the collection returned by <code>get_pressed()</code>.'''
whyWrong = '''<code>QUIT</code> closes the window and <code>KEYUP</code> reports release. A turn starts on the one press, so the event branch must recognize the key going down.'''

[[lessons.exercises]]
id = "s08-l02-e2"
type = "mc"
points = 20
prompt = '''<p>After an attack leaves the enemy above zero HP, what is the next combat operation?</p>'''
choices = ['Draw another menu before changing state', 'Call the enemy response once', 'Poll arrows until the player moves', 'Return to the title screen']
answer = 1
hint = '''The ledger is player action, outcome check, one enemy response, then the next player choice.'''
whyWrong = '''Drawing reports state and held arrows move the overworld player. The resolved action must give the surviving enemy exactly one response before the next player turn.'''
explain = '''This order makes an attack and its consequence auditable instead of depending on frame rate.'''

[[lessons.exercises]]
id = "s08-l02-e3"
type = "write"
points = 35
prompt = '''<p>Model one turn in plain Python. Start <code>enemy_hp = 6</code>, deal 4 damage, and if the enemy survives append <code>"enemy"</code> after <code>"player"</code> in a list. Print exactly <code>HP 2</code> and <code>ORDER player enemy</code>.</p>'''
starter = '''
enemy_hp = 6
damage = 4
order = []

# Record the player action, resolve damage, then record one enemy response if alive.
'''
expect = '''
HP 2
ORDER player enemy
'''
solution = '''
enemy_hp = 6
damage = 4
order = []

order.append("player")
enemy_hp = max(0, enemy_hp - damage)
if enemy_hp > 0:
    order.append("enemy")
print("HP", enemy_hp)
print("ORDER", *order)
'''
hint = '''Append <code>"player"</code> before damage; test the post-hit HP before appending the enemy response.'''

