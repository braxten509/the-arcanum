[[lessons]]
id = "s08-l02"
title = "The Turn Ledger"
teaches = ["s08-turn-order","s08-player-actions"]
body = '''
<p>s08-l02 opens the turns and damage chart through Turn. s08-l02 hears THE CARTOGRAPHER name s08-turn-order its first bearing. s08-l02 names one input, one change, and one output. s08-l02 gives s08-player-actions a second mark for comparison. s08-l02 keeps the smallest successful example beside its route.</p>
<p>s08-l02 reads from left to right, then narrates state changes. s08-l02 keeps its turns and damage clue concrete and observable. s08-l02 runs twice; the second pass challenges the first. s08-l02 records which owner moved when s08-turn-order shifted. s08-l02 carries earlier <code>StatBlock</code> evidence into this chart.</p>
<p>s08-l02 asks one decision to stand alone in the margin. s08-l02 keeps s08-player-actions visible instead of hiding it behind polish. s08-l02 tests a friendly case and a sharp edge case. s08-l02 compares both traces so s08-turn-order has a witness. s08-l02 names the failure before choosing a repair.</p>
<p>s08-l02 treats each handoff as a contract between maker and reader. s08-l02 supplies s08-turn-order; the reader checks s08-player-actions. s08-l02 places its check where another wayfinder can repeat it. s08-l02 earns THE CARTOGRAPHER's trust through evidence, not luck. s08-l02 leaves one deliberate question for the next chart.</p>
<p>s08-l02 closes by stating what the program must preserve. s08-l02 names one input that could falsify s08-turn-order. s08-l02 names one output that confirms s08-player-actions still belongs. s08-l02 runs the smallest route, inspects its trace, and annotates it. s08-l02 turns the turns and damage chart into a RuneBound waypoint.</p>
<p>s08-l02 ends with a handoff to the next chart. s08-l02 carries s08-player-actions forward after s08-turn-order earns trust. s08-l02 lets THE CARTOGRAPHER record the result in plain language. s08-l02 turns a clean rerun from a guess into a fact. s08-l02 lets the next wayfinder begin without hidden context.</p>
<pre><code>print("s08-l02 // The Turn Ledger")</code></pre>
<div class="field-notes"><div class="fn-head">FIELD NOTES // S08-L02</div><p>s08-l02 <strong>Evidence.</strong> Record s08-turn-order; compare it with s08-player-actions before advancing.</p><p>s08-l02 <strong>Repair.</strong> Change one cause, rerun the route, and preserve the explanation.</p></div>
'''

[[lessons.readings]]
label = "Python library // dataclasses // The Turn Ledger"
url = "https://docs.python.org/3/library/dataclasses.html"

[[lessons.readings]]
label = "PyGame docs // drawing // The Turn Ledger"
url = "https://www.pygame.org/docs/ref/draw.html"

[[lessons.exercises]]
id = "s08-l02-e1"
type = "type"
points = 10
reps = 2
prompt = '''
<p>Retype this steel turn evidence exactly. Keep combatsystem with a current actor, an action choice, and a repeatable turn boundary visible while you write. (Ctrl+Enter submits.)</p>
'''
code = '''
dialogue_tree = {"greeting": "offer"}
turn_number = 1
print(dialogue_tree["greeting"], turn_number)
'''

[[lessons.exercises]]
id = "s08-l02-e2"
type = "text"
points = 16
prompt = '''
<p>s08-l02-e2: name the Python term for the specific unit requested by this chart. Supply the language term, not the surrounding story label.</p>
'''
answer = "turn"
hint = '''
Recall the named boundary in The Turn Ledger; the answer is the language term for that single job, not the larger game feature.
'''

[[lessons.exercises]]
id = "s08-l02-e3"
type = "write"
points = 30
prompt = '''
<p>Complete the steel turn route and print exactly <code>RUNEBOUND S08 L02 SEAL</code>. Preserve the named data before adding the final observation.</p>
'''
starter = '''
route_mark = "turn-ledger"
print("survey pending")
# Add the chart seal after checking the route.
'''
expect = '''
RUNEBOUND S08 L02 SEAL
'''
solution = '''
route_mark = "turn-ledger"
print("RUNEBOUND S08 L02 SEAL")
'''
hint = '''
For s08-l02-e3, leave the route data intact and add only its final s08 observation; compare the starter output with the target before submitting.
'''

[[lessons.exercises]]
id = "s08-l02-e4"
type = "mc"
points = 14
prompt = '''
<p>When should an enemy response be resolved in this combat loop? Select the reading that keeps the ai state can now decide how the enemy responds after each player turn possible.</p>
'''
choices = ["while the action menu is being drawn","The Turn Ledger: keep s08-turn-order owned by the named boundary and verify the result before handoff s08-l02-e4.","before the player chooses whether to flee","only after the game returns to the overworld"]
answer = 1
whyWrong = '''
The tempting routes confuse allowing two attacks before the enemy responds or applying damage during menu drawing with the job this trial actually asks you to protect; each decoy moves ownership to the wrong part of the chart.
'''
hint = '''
Trace CombatSystem with a current actor, an action choice, and a repeatable turn boundary in the Steel Turn chart, then compare the one complete turn owns player choice, resolution, enemy response, and the next prompt with the evidence named in the prompt.
'''
explain = '''
The selected mark preserves one complete turn owns player choice, resolution, enemy response, and the next prompt and leaves combatsystem with a current actor, an action choice, and a repeatable turn boundary available for the next RuneBound handoff.
'''

[[lessons.exercises]]
id = "s08-l02-e5"
type = "fill"
points = 18
prompt = '''
<p>s08-l02-e5: restore the missing operation in the supplied code. Use its operands and the chart evidence to complete the route without renaming the owner.</p>
'''
code = '''
combat_system.____(player, enemy)
'''
answer = "attack"
hint = '''
Look at what must happen to combat_system.attack(player, enemy); choose the operation that performs that job rather than the one that merely inspects the result.
'''
