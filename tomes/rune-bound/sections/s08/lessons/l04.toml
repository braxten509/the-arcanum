[[lessons]]
id = "s08-l04"
title = "Bars, Victory, and Retreat"
teaches = ["s08-health-ui", "s08-combat-outcomes"]
body = '''
<p>A health bar is a report, not a second store of HP. Add <code>draw_health_bar(surface, stats, x, y, width=48, height=6)</code> to <code>combat.py</code>. Its <code>x</code> and <code>y</code> are screen pixels because the caller has already chosen a screen position. It draws a dark empty rectangle, computes <code>ratio = stats.hp / stats.max_hp</code>, and draws a green filled rectangle whose width is <code>int(width * ratio)</code>. Since l01 clamps HP, ratio remains in the visible 0–1 range. Do not let this helper damage, heal, select a turn, or subtract the camera.</p>
<pre><code>def draw_health_bar(surface, stats, x, y, width=48, height=6):
    pygame.draw.rect(surface, (35, 28, 24), (x, y, width, height))
    ratio = stats.hp / stats.max_hp
    pygame.draw.rect(surface, (80, 180, 90),
                     (x, y, int(width * ratio), height))</code></pre>
<p>When drawing actors, derive the bar location from their already camera-adjusted visual position: <code>screen_x = actor.rect.x - camera[0]</code>, <code>screen_y = actor.rect.y - camera[1] - 10</code>, then call the helper. Ground still renders first, actors second, bars after their actor, dialogue UI after world layers, and <code>pygame.display.flip()</code> exactly once in <code>main.py</code>. Calling <code>draw_health_bar</code> is not a reason to flip a second time.</p>
<p>Outcomes belong in <code>CombatSystem</code>. After each hit, if enemy HP is zero set <code>active = False</code>, <code>result = "won"</code>, and a message such as <code>"The Slime dissolves."</code>. If Player HP is zero, set <code>result = "lost"</code>. Flee sets <code>"fled"</code> before any enemy response. Keep <code>result</code> after <code>active</code> becomes false; s09 and s10 need a truthful combat fact rather than a vanished Slime sprite to award loot or satisfy a quest.</p>
<p>Return control cleanly. Main can keep <code>active_combat = None</code> after it reads a completed result and removes a defeated enemy from <code>actors</code>; on flee, leave the enemy in place. A loss currently displays a clear message and stops Player input for the run. s11 will replace this local routing with its explicit GAME_OVER and COMBAT state machine, so do not build a competing enum here.</p>
<div class="callout"><strong>THE CARTOGRAPHER'S RULE:</strong> UI observes stats, the combat system records outcomes, and main schedules the layers.</div>
<div class="field-notes"><div class="fn-head">FIELD NOTES // EMPTY BAR</div><p>If a bar stays full after a hit, inspect whether it receives <code>actor.stats</code>, not a copied integer from encounter creation. A renderer that caches HP becomes a second, stale source of truth.</p></div>
'''

[[lessons.readings]]
label = "PyGame Docs // draw.rect"
url = "https://www.pygame.org/docs/ref/draw.html#pygame.draw.rect"

[[lessons.exercises]]
id = "s08-l04-e1"
type = "mc"
points = 20
prompt = '''<p>Which component may change <code>result</code> from <code>None</code> to <code>"won"</code> when enemy HP reaches zero?</p>'''
choices = ['<code>draw_health_bar</code>', '<code>TileMap.render</code>', '<code>CombatSystem</code>', '<code>AnimatedSprite.draw</code>']
answer = 2
hint = '''The outcome follows a resolved action, whereas the listed renderers only paint what already happened.'''
whyWrong = '''Rendering code must not mutate game decisions, or a different draw order could change who wins. The manager owns the action sequence and records its terminal outcome.'''
explain = '''Keeping result in CombatSystem lets later systems inspect a stable fact after the fight closes.'''

[[lessons.exercises]]
id = "s08-l04-e2"
type = "fill"
points = 22
prompt = '''<p>Restore the conversion from a health fraction to an integer filled-bar width.</p>'''
code = '''
filled_width = ____(width * ratio)
'''
answer = "int"
hint = '''PyGame’s rectangle dimensions are whole pixels, while the multiplication may produce a decimal.'''
whyWrong = '''<code>str</code> would make text and <code>bool</code> would discard the size. The chosen conversion truncates the proportional pixel count to an integer.'''

[[lessons.exercises]]
id = "s08-l04-e3"
type = "text"
points = 18
prompt = '''<p>Which stored combat field must survive a finished fight so later inventory and quest code can distinguish a win from a flee?</p>'''
answer = "result"
hint = '''It starts as <code>None</code> and receives one of the terminal strings after the manager resolves an outcome.'''
whyWrong = '''<code>active</code> says only whether the encounter is still running, while <code>message</code> is player-facing wording. The requested field preserves the machine-readable terminal fact.'''

[[lessons.exercises]]
id = "s08-l04-e4"
type = "write"
points = 35
prompt = '''<p>Compute a 48-pixel health bar at 5 HP out of 20, then record a win when enemy HP is zero. Print exactly <code>BAR 12</code> and <code>RESULT won</code>.</p>'''
starter = '''
width = 48
hp = 5
max_hp = 20
enemy_hp = 0

# Compute the filled width and choose the terminal result.
'''
expect = '''
BAR 12
RESULT won
'''
solution = '''
width = 48
hp = 5
max_hp = 20
enemy_hp = 0

filled_width = int(width * (hp / max_hp))
result = "won" if enemy_hp == 0 else None
print("BAR", filled_width)
print("RESULT", result)
'''
hint = '''Divide current HP by max HP before multiplying width; compare the enemy’s current HP with zero for the outcome.'''
