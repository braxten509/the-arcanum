[[lessons]]
id = "s08-l04"
title = "Bars, Victory, and Retreat"
teaches = ["s08-health-ui","s08-combat-outcomes"]
body = '''
<p>s08-l04 opens the turns and damage chart through Bars. s08-l04 hears THE CARTOGRAPHER name s08-health-ui its first bearing. s08-l04 names one input, one change, and one output. s08-l04 gives s08-combat-outcomes a second mark for comparison. s08-l04 keeps the smallest successful example beside its route.</p>
<p>s08-l04 reads from left to right, then narrates state changes. s08-l04 keeps its turns and damage clue concrete and observable. s08-l04 runs twice; the second pass challenges the first. s08-l04 records which owner moved when s08-health-ui shifted. s08-l04 carries earlier <code>StatBlock</code> evidence into this chart.</p>
<p>s08-l04 asks one decision to stand alone in the margin. s08-l04 keeps s08-combat-outcomes visible instead of hiding it behind polish. s08-l04 tests a friendly case and a sharp edge case. s08-l04 compares both traces so s08-health-ui has a witness. s08-l04 names the failure before choosing a repair.</p>
<p>s08-l04 treats each handoff as a contract between maker and reader. s08-l04 supplies s08-health-ui; the reader checks s08-combat-outcomes. s08-l04 places its check where another wayfinder can repeat it. s08-l04 earns THE CARTOGRAPHER's trust through evidence, not luck. s08-l04 leaves one deliberate question for the next chart.</p>
<p>s08-l04 closes by stating what the program must preserve. s08-l04 names one input that could falsify s08-health-ui. s08-l04 names one output that confirms s08-combat-outcomes still belongs. s08-l04 runs the smallest route, inspects its trace, and annotates it. s08-l04 turns the turns and damage chart into a RuneBound waypoint.</p>
<p>s08-l04 ends with a handoff to the next chart. s08-l04 carries s08-combat-outcomes forward after s08-health-ui earns trust. s08-l04 lets THE CARTOGRAPHER record the result in plain language. s08-l04 turns a clean rerun from a guess into a fact. s08-l04 lets the next wayfinder begin without hidden context.</p>
<pre><code>print("s08-l04 // Bars, Victory, and Retreat")</code></pre>
<div class="field-notes"><div class="fn-head">FIELD NOTES // S08-L04</div><p>s08-l04 <strong>Evidence.</strong> Record s08-health-ui; compare it with s08-combat-outcomes before advancing.</p><p>s08-l04 <strong>Repair.</strong> Change one cause, rerun the route, and preserve the explanation.</p></div>
'''

[[lessons.readings]]
label = "Python library // dataclasses // Bars, Victory, and Retreat"
url = "https://docs.python.org/3/library/dataclasses.html"

[[lessons.readings]]
label = "PyGame docs // drawing // Bars, Victory, and Retreat"
url = "https://www.pygame.org/docs/ref/draw.html"

[[lessons.exercises]]
id = "s08-l04-e1"
type = "fill"
points = 18
prompt = '''
<p>s08-l04-e1: restore the missing operation in the supplied code. Use its operands and the chart evidence to complete the route without renaming the owner.</p>
'''
code = '''
hp = max(0, hp - ____)
'''
answer = "damage"
hint = '''
Look at what must happen to hp = max(0, hp - damage); choose the operation that performs that job rather than the one that merely inspects the result.
'''

[[lessons.exercises]]
id = "s08-l04-e2"
type = "mc"
points = 14
prompt = '''
<p>What should happen immediately after an enemy reaches zero hp? Select the reading that keeps inventory and quest facts can later respond to a clean combat result possible.</p>
'''
choices = ["increase the enemy's bar until it reaches max_hp","Bars, Victory, and Retreat: keep s08-health-ui owned by the named boundary and verify the result before handoff s08-l04-e2.","return to the title screen without recording the result","let the draw order decide whether combat is over"]
answer = 1
whyWrong = '''
The tempting routes confuse drawing a full bar after hp reaches zero or allowing a defeated enemy to receive another turn with the job this trial actually asks you to protect; each decoy moves ownership to the wrong part of the chart.
'''
hint = '''
Trace hp clamping, win and game-over checks, and a flee route that returns to play in the Steel Turn chart, then compare the the UI reports state while the combat system owns whether a fight has ended with the evidence named in the prompt.
'''
explain = '''
The selected mark preserves the ui reports state while the combat system owns whether a fight has ended and leaves hp clamping, win and game-over checks, and a flee route that returns to play available for the next RuneBound handoff.
'''

[[lessons.exercises]]
id = "s08-l04-e3"
type = "type"
points = 10
reps = 2
prompt = '''
<p>Retype this steel turn evidence exactly. Keep hp clamping, win and game-over checks, and a flee route that returns to play visible while you write. (Ctrl+Enter submits.)</p>
'''
code = '''
hp = 2
damage = 5
hp = max(0, hp - damage)
print(hp)
'''

[[lessons.exercises]]
id = "s08-l04-e4"
type = "write"
points = 30
prompt = '''
<p>Complete the steel turn route and print exactly <code>RUNEBOUND S08 L04 SEAL</code>. Preserve the named data before adding the final observation.</p>
'''
starter = '''
route_mark = "combat-bars"
print("survey pending")
# Add the chart seal after checking the route.
'''
expect = '''
RUNEBOUND S08 L04 SEAL
'''
solution = '''
route_mark = "combat-bars"
print("RUNEBOUND S08 L04 SEAL")
'''
hint = '''
For s08-l04-e4, leave the route data intact and add only its final s08 observation; compare the starter output with the target before submitting.
'''

[[lessons.exercises]]
id = "s08-l04-e5"
type = "text"
points = 16
prompt = '''
<p>s08-l04-e5: name the Python term for the specific unit requested by this chart. Supply the language term, not the surrounding story label.</p>
'''
answer = "hp"
hint = '''
Recall the named boundary in Bars, Victory, and Retreat; the answer is the language term for that single job, not the larger game feature.
'''
