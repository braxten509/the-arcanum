[[lessons]]
id = "s08-l05"
title = "The First Steel Encounter"
teaches = ["s08-combat-integration", "s08-encounter-proof"]
body = '''
<p>Now trace RuneBound from the first executable step, wayfinder. <code>main.py</code> still initializes PyGame, loads the tile map and sprite sheet, creates Player and the Elder, and owns the one event pump. Import <code>CombatSystem</code> and <code>Enemy</code>, load the Slime template from <code>data/enemies.json</code>, create one <code>Enemy(sheet, "slime", 320, 192, slime_stats)</code>, and add it to the existing <code>actors</code> group. Its world rect is the encounter position; never place it with a camera-adjusted coordinate.</p>
<p>After event handling and before ordinary Player movement, test <code>rectangles_overlap(player.rect, slime.rect)</code>. If it returns true and <code>active_combat is None</code>, create <code>active_combat = CombatSystem(player, slime)</code>. While that variable exists and its manager remains active, suppress <code>player.handle_input(keys)</code> and <code>player.move_and_collide(tile_map, dt)</code>. The event pump still runs every frame, so the X button remains responsive; keys A, D, and F route to <code>active_combat.player_action(...)</code>. This fulfills s03’s input contract without turning continuous arrow movement into repeated attacks.</p>
<pre><code>for event in pygame.event.get():
    if event.type == pygame.QUIT:
        running = False
    elif event.type == pygame.KEYDOWN and active_combat is not None:
        if event.key == pygame.K_a:
            active_combat.player_action("attack")
        elif event.key == pygame.K_d:
            active_combat.player_action("defend")
        elif event.key == pygame.K_f:
            active_combat.player_action("flee")

keys = pygame.key.get_pressed()
if active_combat is None:
    player.handle_input(keys)
    player.move_and_collide(tile_map, dt)</code></pre>
<p>Continue the familiar frame: <code>actors.update(dt)</code>, resolved Player camera follow, clear, map render, actor draws, health bars, optional dialogue, then a combat panel drawn after world layers with action labels and <code>active_combat.message</code>. Call <code>pygame.display.flip()</code> once and let <code>clock.tick(FPS)</code> create the next <code>dt</code>. When <code>active_combat.active</code> becomes false, record its result in a local <code>last_combat_result</code>; remove the Slime only for <code>"won"</code>, then clear <code>active_combat</code>. This is deliberately a small integration seam: s11 will replace it with the full state-machine dispatcher.</p>
<p>Run <code>python3 main.py</code> from the project folder. Walk into the Slime, press A twice: the first 6-point hit must leave it at 6 HP and produce exactly one enemy response; the second 6-point hit must win without another response. Then relaunch and use F to flee. Verify the window still closes with X during either encounter. In <code>README.md</code>, record the launch command, those damage/HP observations, a defend or flee observation, the outcome, close-and-rerun result, and one precise repair or explicit no-repair result. Do not ship print seals, local enemy stat variables, or a second display flip.</p>
<div class="callout"><strong>THE CARTOGRAPHER'S RULE:</strong> contact opens combat, event presses resolve turns, and the old overworld route resumes only after an outcome.</div>
<div class="field-notes"><div class="fn-head">FIELD NOTES // FROZEN WINDOW</div><p>If the combat panel appears but the X button fails, the event loop was placed under the non-combat branch. Move only the pump back to the top of every frame; suppress movement, never window events.</p></div>
'''

[[lessons.readings]]
label = "PyGame Docs // key events"
url = "https://www.pygame.org/docs/ref/key.html"

[[lessons.readings]]
label = "PyGame Docs // display flip"
url = "https://www.pygame.org/docs/ref/display.html#pygame.display.flip"

[[lessons.exercises]]
id = "s08-l05-e1"
type = "mc"
points = 20
prompt = '''<p>While <code>active_combat</code> is running, which route must remain available every frame?</p>'''
choices = ['The <code>pygame.event.get()</code> pump, including QUIT', 'Player arrow movement and collision', 'A second <code>pygame.display.flip()</code>', 'Replacing enemy JSON with local variables']
answer = 0
hint = '''Combat changes which game actions keys route to, but it never removes the operating system’s close-event duty.'''
whyWrong = '''Movement is intentionally suppressed during turns, a second flip breaks the established frame boundary, and local stats were retired. The event pump remains frame-wide so the window can close cleanly.'''
explain = '''The event pump is a liveness contract, not an overworld-only feature.'''

[[lessons.exercises]]
id = "s08-l05-e2"
type = "type"
points = 12
reps = 2
prompt = '''<p>Retype the exact branch that lets normal Player movement occur only outside combat.</p>'''
code = '''
if active_combat is None:
    player.handle_input(keys)
    player.move_and_collide(tile_map, dt)
'''

[[lessons.exercises]]
id = "s08-l05-e3"
type = "fill"
points = 22
prompt = '''<p>Restore the key constant for the one-press flee command in the combat event branch.</p>'''
code = '''
elif event.key == pygame.____:
    active_combat.player_action("flee")
'''
answer = "K_f"
hint = '''The visible action legend uses the letter F, and PyGame names letter key constants with the same lower-case suffix.'''
whyWrong = '''<code>K_ESCAPE</code> is not the taught flee action and <code>K_DOWN</code> belongs to navigation. The branch matches F with the string action <code>"flee"</code>.'''

[[lessons.exercises]]
id = "s08-l05-e4"
type = "write"
points = 35
prompt = '''<p>Model the input boundary in plain Python. With <code>active_combat = True</code>, do not append <code>"move"</code>; append <code>"attack"</code> for a one-shot A event. Print exactly <code>ACTIONS attack</code>.</p>'''
starter = '''
active_combat = True
event_key = "a"
actions = []

# Route the one event to attack. Add movement only when combat is not active.
'''
expect = '''
ACTIONS attack
'''
solution = '''
active_combat = True
event_key = "a"
actions = []

if active_combat and event_key == "a":
    actions.append("attack")
if not active_combat:
    actions.append("move")
print("ACTIONS", *actions)
'''
hint = '''First test both <code>active_combat</code> and the event key; put movement in a separate <code>if not active_combat</code> branch.'''

[[lessons.exercises]]
id = "s08-l05-e5"
type = "text"
points = 18
prompt = '''<p>Which strict world-space helper opens an encounter when the Player and Slime share interior?</p>'''
answer = "rectangles_overlap"
hint = '''It was introduced for AABBs in s06 and is called with <code>player.rect</code> and <code>slime.rect</code>.'''
whyWrong = '''<code>distance_to</code> is useful for AI range but does not test rectangles, and <code>tile_at</code> reads terrain. The required helper preserves the game’s established contact rule.'''
