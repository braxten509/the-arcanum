[[lessons]]
id = "s08-l05"
title = "The First Steel Encounter"
teaches = ["s08-combat-integration","s08-encounter-proof"]
body = '''
<p>s08-l05 opens the turns and damage chart through First. s08-l05 hears THE CARTOGRAPHER name s08-combat-integration its first bearing. s08-l05 names one input, one change, and one output. s08-l05 gives s08-encounter-proof a second mark for comparison. s08-l05 keeps the smallest successful example beside its route.</p>
<p>s08-l05 reads from left to right, then narrates state changes. s08-l05 keeps its turns and damage clue concrete and observable. s08-l05 runs twice; the second pass challenges the first. s08-l05 records which owner moved when s08-combat-integration shifted. s08-l05 carries earlier <code>StatBlock</code> evidence into this chart.</p>
<p>s08-l05 asks one decision to stand alone in the margin. s08-l05 keeps s08-encounter-proof visible instead of hiding it behind polish. s08-l05 tests a friendly case and a sharp edge case. s08-l05 compares both traces so s08-combat-integration has a witness. s08-l05 names the failure before choosing a repair.</p>
<p>s08-l05 treats each handoff as a contract between maker and reader. s08-l05 supplies s08-combat-integration; the reader checks s08-encounter-proof. s08-l05 places its check where another wayfinder can repeat it. s08-l05 earns THE CARTOGRAPHER's trust through evidence, not luck. s08-l05 leaves one deliberate question for the next chart.</p>
<p>s08-l05 closes by stating what the program must preserve. s08-l05 names one input that could falsify s08-combat-integration. s08-l05 names one output that confirms s08-encounter-proof still belongs. s08-l05 runs the smallest route, inspects its trace, and annotates it. s08-l05 turns the turns and damage chart into a RuneBound waypoint.</p>
<p>s08-l05 ends with a handoff to the next chart. s08-l05 carries s08-encounter-proof forward after s08-combat-integration earns trust. s08-l05 lets THE CARTOGRAPHER record the result in plain language. s08-l05 turns a clean rerun from a guess into a fact. s08-l05 lets the next wayfinder begin without hidden context.</p>
<pre><code>print("s08-l05 // The First Steel Encounter")</code></pre>
<div class="field-notes"><div class="fn-head">FIELD NOTES // S08-L05</div><p>s08-l05 <strong>Evidence.</strong> Record s08-combat-integration; compare it with s08-encounter-proof before advancing.</p><p>s08-l05 <strong>Repair.</strong> Change one cause, rerun the route, and preserve the explanation.</p></div>
'''

[[lessons.readings]]
label = "Python library // dataclasses // The First Steel Encounter"
url = "https://docs.python.org/3/library/dataclasses.html"

[[lessons.exercises]]
id = "s08-l05-e1"
type = "text"
points = 16
prompt = '''
<p>s08-l05-e1: name the Python term for the specific unit requested by this chart. Supply the language term, not the surrounding story label.</p>
'''
answer = "CombatSystem"
hint = '''
Recall the named boundary in The First Steel Encounter; the answer is the language term for that single job, not the larger game feature.
'''

[[lessons.exercises]]
id = "s08-l05-e2"
type = "fill"
points = 18
prompt = '''
<p>s08-l05-e2: restore the missing operation in the supplied code. Use its operands and the chart evidence to complete the route without renaming the owner.</p>
'''
code = '''
combat_system.____(dt)
'''
answer = "update"
hint = '''
Look at what must happen to combat_system.update(dt) runs only while the game state is combat; choose the operation that performs that job rather than the one that merely inspects the result.
'''

[[lessons.exercises]]
id = "s08-l05-e3"
type = "mc"
points = 14
prompt = '''
<p>What proves that the first combat integration is complete? Select the reading that keeps s09 can award an item or toast from the stored combat result possible.</p>
'''
choices = ["the Slime has a different color in the sprite sheet","the map stops loading JSON after the first frame","the player can attack without an enemy state","The First Steel Encounter: keep s08-combat-integration owned by the named boundary and verify the result before handoff s08-l05-e3."]
answer = 3
whyWrong = '''
The tempting routes confuse letting overworld movement continue underneath a combat menu or losing the player's hp on return with the job this trial actually asks you to protect; each decoy moves ownership to the wrong part of the chart.
'''
hint = '''
Trace enemy contact, a combat transition, and a result that returns to the correct world state in the Steel Turn chart, then compare the the overworld triggers combat while the combat manager owns turns until an outcome with the evidence named in the prompt.
'''
explain = '''
The selected mark preserves the overworld triggers combat while the combat manager owns turns until an outcome and leaves enemy contact, a combat transition, and a result that returns to the correct world state available for the next RuneBound handoff.
'''

[[lessons.exercises]]
id = "s08-l05-e4"
type = "write"
points = 30
prompt = '''
<p>Complete the steel turn route and print exactly <code>RUNEBOUND S08 L05 SEAL</code>. Preserve the named data before adding the final observation.</p>
'''
starter = '''
route_mark = "steel-encounter"
print("survey pending")
# Add the chart seal after checking the route.
'''
expect = '''
RUNEBOUND S08 L05 SEAL
'''
solution = '''
route_mark = "steel-encounter"
print("RUNEBOUND S08 L05 SEAL")
'''
hint = '''
For s08-l05-e4, leave the route data intact and add only its final s08 observation; compare the starter output with the target before submitting.
'''

