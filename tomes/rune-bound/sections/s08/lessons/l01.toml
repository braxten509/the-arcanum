[[lessons]]
id = "s08-l01"
title = "The Stat Block"
teaches = ["s08-stat-block","s08-damage-rule"]
body = '''
<p>s08-l01 opens the turns and damage chart through Stat. s08-l01 hears THE CARTOGRAPHER name s08-stat-block its first bearing. s08-l01 names one input, one change, and one output. s08-l01 gives s08-damage-rule a second mark for comparison. s08-l01 keeps the smallest successful example beside its route.</p>
<p>s08-l01 reads from left to right, then narrates state changes. s08-l01 keeps its turns and damage clue concrete and observable. s08-l01 runs twice; the second pass challenges the first. s08-l01 records which owner moved when s08-stat-block shifted. s08-l01 carries earlier <code>StatBlock</code> evidence into this chart.</p>
<p>s08-l01 asks one decision to stand alone in the margin. s08-l01 keeps s08-damage-rule visible instead of hiding it behind polish. s08-l01 tests a friendly case and a sharp edge case. s08-l01 compares both traces so s08-stat-block has a witness. s08-l01 names the failure before choosing a repair.</p>
<p>s08-l01 treats each handoff as a contract between maker and reader. s08-l01 supplies s08-stat-block; the reader checks s08-damage-rule. s08-l01 places its check where another wayfinder can repeat it. s08-l01 earns THE CARTOGRAPHER's trust through evidence, not luck. s08-l01 leaves one deliberate question for the next chart.</p>
<p>s08-l01 closes by stating what the program must preserve. s08-l01 names one input that could falsify s08-stat-block. s08-l01 names one output that confirms s08-damage-rule still belongs. s08-l01 runs the smallest route, inspects its trace, and annotates it. s08-l01 turns the turns and damage chart into a RuneBound waypoint.</p>
<p>s08-l01 ends with a handoff to the next chart. s08-l01 carries s08-damage-rule forward after s08-stat-block earns trust. s08-l01 lets THE CARTOGRAPHER record the result in plain language. s08-l01 turns a clean rerun from a guess into a fact. s08-l01 lets the next wayfinder begin without hidden context.</p>
<pre><code>print("s08-l01 // The Stat Block")</code></pre>
<div class="field-notes"><div class="fn-head">FIELD NOTES // S08-L01</div><p>s08-l01 <strong>Evidence.</strong> Record s08-stat-block; compare it with s08-damage-rule before advancing.</p><p>s08-l01 <strong>Repair.</strong> Change one cause, rerun the route, and preserve the explanation.</p></div>
'''

[[lessons.readings]]
label = "Python library // dataclasses // The Stat Block"
url = "https://docs.python.org/3/library/dataclasses.html"

[[lessons.exercises]]
id = "s08-l01-e1"
type = "mc"
points = 14
prompt = '''
<p>Why keep combat numbers in a StatBlock? Select the reading that keeps the turn ledger can apply one named damage rule in both directions possible.</p>
'''
choices = ["the block automatically chooses the enemy's next state","The Stat Block: keep s08-stat-block owned by the named boundary and verify the result before handoff s08-l01-e1.","stats belong in the tile CSV so the map can balance them","a stat record replaces the need for a turn order"]
answer = 1
whyWrong = '''
The tempting routes confuse scattering magic numbers through action handlers and making balance impossible to inspect with the job this trial actually asks you to protect; each decoy moves ownership to the wrong part of the chart.
'''
hint = '''
Trace hp, max_hp, attack, and defense as explicit combat facts in the Steel Turn chart, then compare the the stat record holds values while the combat system decides when to apply them with the evidence named in the prompt.
'''
explain = '''
The selected mark preserves the stat record holds values while the combat system decides when to apply them and leaves hp, max_hp, attack, and defense as explicit combat facts available for the next RuneBound handoff.
'''

[[lessons.exercises]]
id = "s08-l01-e2"
type = "write"
points = 30
prompt = '''
<p>Complete the steel turn route and print exactly <code>RUNEBOUND S08 L01 SEAL</code>. Preserve the named data before adding the final observation.</p>
'''
starter = '''
route_mark = "stat-block"
print("survey pending")
# Add the chart seal after checking the route.
'''
expect = '''
RUNEBOUND S08 L01 SEAL
'''
solution = '''
route_mark = "stat-block"
print("RUNEBOUND S08 L01 SEAL")
'''
hint = '''
For s08-l01-e2, leave the route data intact and add only its final s08 observation; compare the starter output with the target before submitting.
'''

[[lessons.exercises]]
id = "s08-l01-e3"
type = "type"
points = 10
reps = 2
prompt = '''
<p>Retype this steel turn evidence exactly. Keep hp, max_hp, attack, and defense as explicit combat facts visible while you write. (Ctrl+Enter submits.)</p>
'''
code = '''
attack = 7
defense = 3
damage = max(1, attack - defense)
print(damage)
'''

[[lessons.exercises]]
id = "s08-l01-e4"
type = "fill"
points = 18
prompt = '''
<p>s08-l01-e4: restore the missing operation in the supplied code. Use its operands and the chart evidence to complete the route without renaming the owner.</p>
'''
code = '''
damage = ____ (1, attack - defense)
'''
answer = "max"
hint = '''
Look at what must happen to damage = max(1, attacker.attack - target.defense); choose the operation that performs that job rather than the one that merely inspects the result.
'''

[[lessons.exercises]]
id = "s08-l01-e5"
type = "text"
points = 16
prompt = '''
<p>s08-l01-e5: name the Python term for the specific unit requested by this chart. Supply the language term, not the surrounding story label.</p>
'''
answer = "defense"
hint = '''
Recall the named boundary in The Stat Block; the answer is the language term for that single job, not the larger game feature.
'''
