[[lessons]]
id = "s08-l03"
title = "The Slime's State"
teaches = ["s08-enemy-ai", "s08-state-transitions"]
body = '''
<p>Enemy behavior should be a short route, not four booleans that can all be true by accident. Add <code>Enemy(AnimatedSprite)</code> in <code>combat.py</code>. Its constructor accepts <code>sheet, enemy_id, x, y, stats</code>, calls the existing sprite initializer with the supplied world pixels, then owns <code>enemy_id</code>, <code>stats</code>, <code>state = "idle"</code>, <code>aggro_range = 160</code>, and <code>attack_range = 48</code>. It does not own a camera: inherited <code>draw(surface, camera)</code> still subtracts camera only while painting.</p>
<p>Add <code>update_ai(player)</code>. Measure distance in world space with <code>Vector2(self.rect.center).distance_to(player.rect.center)</code>; this reuses s06’s velocity vocabulary without changing Player’s velocity. The states tell a reader why the enemy has chosen its next move: idle outside aggro range; aggro inside aggro range but outside attack range; attack inside attack range; retreat when its HP is at or below one quarter of <code>max_hp</code>. A defeated enemy does not update: combat ends before another AI choice.</p>
<pre><code>def update_ai(self, player):
    distance = Vector2(self.rect.center).distance_to(player.rect.center)
    if self.stats.hp &lt;= self.stats.max_hp // 4:
        self.state = "retreat"
    elif distance &lt;= self.attack_range:
        self.state = "attack"
    elif distance &lt;= self.aggro_range:
        self.state = "aggro"
    else:
        self.state = "idle"
    return self.state</code></pre>
<p>During <code>CombatSystem.enemy_turn()</code>, call <code>enemy.update_ai(player)</code>. An attack-state enemy uses <code>deal_damage(enemy, player)</code>. An aggro enemy moves toward the Player only in the overworld encounter route: calculate a direction from centers, normalize a nonzero <code>Vector2</code>, and move its world rect by <code>enemy_speed * dt</code>. Before accepting contact, reuse <code>rectangles_overlap(player.rect, enemy.rect)</code> from <code>player.py</code>; the helper tests strict shared interior in world pixels. It has no camera argument and must not be replaced by a screen-coordinate comparison.</p>
<p>Set the enemy animation state deliberately: idle and retreat use inherited <code>set_state("idle")</code>; aggro uses <code>set_state("walk")</code>. Attack art comes later, so do not invent an unavailable sprite-sheet row. This is a temporary visual limitation, not a temporary API. The combat state names remain real and visible in the combat message.</p>
<div class="callout"><strong>THE CARTOGRAPHER'S RULE:</strong> the world rect answers range; the AI state names intent; animation reports that intent.</div>
<div class="field-notes"><div class="fn-head">FIELD NOTES // CENTER IS NOT CONTACT</div><p>Distance selects an AI state. Rectangle overlap selects encounter contact. A sprite can be in aggro range long before its rectangles overlap; merging those tests makes a long-range alert look like a collision bug.</p></div>
'''

[[lessons.readings]]
label = "PyGame Docs // Vector2"
url = "https://www.pygame.org/docs/ref/math.html#pygame.math.Vector2"

[[lessons.exercises]]
id = "s08-l03-e1"
type = "type"
points = 12
reps = 2
prompt = '''<p>Retype the nearest-range transition. The equality case is still close enough to attack.</p>'''
code = '''
if distance <= self.attack_range:
    self.state = "attack"
'''

[[lessons.exercises]]
id = "s08-l03-e2"
type = "mc"
points = 20
prompt = '''<p>Which earlier helper decides whether Player and Enemy rectangles have shared interior for encounter contact?</p>'''
choices = ['<code>TileMap.tile_at</code>', '<code>render_text</code>', '<code>rectangles_overlap</code>', '<code>DialogueTree.choose</code>']
answer = 2
hint = '''s06 placed this module-level four-edge AABB rule in <code>player.py</code> specifically for later combat checks.'''
whyWrong = '''A tile lookup describes map data, text rendering paints UI, and DialogueTree follows a conversation edge. Combat contact uses the strict world-space rectangle helper.'''
explain = '''Using the shared helper preserves the same edge-touching rule used by collision work.'''

[[lessons.exercises]]
id = "s08-l03-e3"
type = "fill"
points = 22
prompt = '''<p>Restore the state assigned by the closest-distance branch, where the enemy is permitted to damage Player.</p>'''
code = '''
elif distance <= self.attack_range:
    self.state = "____"
'''
answer = "attack"
hint = '''This is the closest non-terminal state; its enemy turn is permitted to call <code>deal_damage</code>.'''
whyWrong = '''<code>aggro</code> means it has noticed the player but is not close enough to strike, while <code>retreat</code> is selected by low HP. The branch names the immediate strike state.'''

[[lessons.exercises]]
id = "s08-l03-e4"
type = "write"
points = 35
prompt = '''<p>Define <code>state_for(distance, hp, max_hp)</code>. Return <code>"retreat"</code> at 5 of 20 HP, <code>"attack"</code> at distance 40 with healthy HP, and <code>"aggro"</code> at distance 100 with healthy HP. Print exactly <code>LOW retreat</code>, <code>NEAR attack</code>, and <code>MID aggro</code>.</p>'''
starter = '''
def state_for(distance, hp, max_hp):
    # Retreat at one quarter HP or less; attack at <= 48; aggro at <= 160.
    pass

# Print the three required state observations.
'''
expect = '''
LOW retreat
NEAR attack
MID aggro
'''
solution = '''
def state_for(distance, hp, max_hp):
    if hp <= max_hp // 4:
        return "retreat"
    if distance <= 48:
        return "attack"
    if distance <= 160:
        return "aggro"
    return "idle"

print("LOW", state_for(20, 5, 20))
print("NEAR", state_for(40, 20, 20))
print("MID", state_for(100, 20, 20))
'''
hint = '''Check low HP first, then compare distance against 48 and 160 in that order.'''
