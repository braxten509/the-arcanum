[[lessons]]
id = "s08-l03"
title = "The Slime's State"
teaches = ["s08-enemy-ai","s08-state-transitions"]
body = '''
<p>s08-l03 opens the turns and damage chart through Slime's. s08-l03 hears THE CARTOGRAPHER name s08-enemy-ai its first bearing. s08-l03 names one input, one change, and one output. s08-l03 gives s08-state-transitions a second mark for comparison. s08-l03 keeps the smallest successful example beside its route.</p>
<p>s08-l03 reads from left to right, then narrates state changes. s08-l03 keeps its turns and damage clue concrete and observable. s08-l03 runs twice; the second pass challenges the first. s08-l03 records which owner moved when s08-enemy-ai shifted. s08-l03 carries earlier <code>StatBlock</code> evidence into this chart.</p>
<p>s08-l03 asks one decision to stand alone in the margin. s08-l03 keeps s08-state-transitions visible instead of hiding it behind polish. s08-l03 tests a friendly case and a sharp edge case. s08-l03 compares both traces so s08-enemy-ai has a witness. s08-l03 names the failure before choosing a repair.</p>
<p>s08-l03 treats each handoff as a contract between maker and reader. s08-l03 supplies s08-enemy-ai; the reader checks s08-state-transitions. s08-l03 places its check where another wayfinder can repeat it. s08-l03 earns THE CARTOGRAPHER's trust through evidence, not luck. s08-l03 leaves one deliberate question for the next chart.</p>
<p>s08-l03 closes by stating what the program must preserve. s08-l03 names one input that could falsify s08-enemy-ai. s08-l03 names one output that confirms s08-state-transitions still belongs. s08-l03 runs the smallest route, inspects its trace, and annotates it. s08-l03 turns the turns and damage chart into a RuneBound waypoint.</p>
<p>s08-l03 ends with a handoff to the next chart. s08-l03 carries s08-state-transitions forward after s08-enemy-ai earns trust. s08-l03 lets THE CARTOGRAPHER record the result in plain language. s08-l03 turns a clean rerun from a guess into a fact. s08-l03 lets the next wayfinder begin without hidden context.</p>
<pre><code>print("s08-l03 // The Slime's State")</code></pre>
<div class="field-notes"><div class="fn-head">FIELD NOTES // S08-L03</div><p>s08-l03 <strong>Evidence.</strong> Record s08-enemy-ai; compare it with s08-state-transitions before advancing.</p><p>s08-l03 <strong>Repair.</strong> Change one cause, rerun the route, and preserve the explanation.</p></div>
'''

[[lessons.readings]]
label = "Python library // dataclasses // The Slime's State"
url = "https://docs.python.org/3/library/dataclasses.html"

[[lessons.exercises]]
id = "s08-l03-e1"
type = "mc"
points = 14
prompt = '''
<p>What makes the Slime's AI easier to debug than a pile of boolean flags? Select the reading that keeps the health and win rules can stop the state machine at a deliberate terminal state possible.</p>
'''
choices = ["the AI never needs a distance check","a sprite group chooses combat actions by draw order","the state table stores all item descriptions","The Slime's State: keep s08-enemy-ai owned by the named boundary and verify the result before handoff s08-l03-e1."]
answer = 3
whyWrong = '''
The tempting routes confuse using unrelated booleans that allow idle and attack to be true at the same time with the job this trial actually asks you to protect; each decoy moves ownership to the wrong part of the chart.
'''
hint = '''
Trace a small AI transition table whose conditions can be narrated in the combat log in the Steel Turn chart, then compare the the state names intent while the update step applies one allowed transition with the evidence named in the prompt.
'''
explain = '''
The selected mark preserves the state names intent while the update step applies one allowed transition and leaves a small ai transition table whose conditions can be narrated in the combat log available for the next RuneBound handoff.
'''

[[lessons.exercises]]
id = "s08-l03-e2"
type = "text"
points = 16
prompt = '''
<p>s08-l03-e2: name the Python term for the specific unit requested by this chart. Supply the language term, not the surrounding story label.</p>
'''
answer = "aggro"
hint = '''
Recall the named boundary in The Slime's State; the answer is the language term for that single job, not the larger game feature.
'''

[[lessons.exercises]]
id = "s08-l03-e3"
type = "fill"
points = 18
prompt = '''
<p>s08-l03-e3: restore the missing operation in the supplied code. Use its operands and the chart evidence to complete the route without renaming the owner.</p>
'''
code = '''
enemy.state = ____
'''
answer = "\"aggro\""
hint = '''
Look at what must happen to enemy.state = "aggro" when the player enters range; choose the operation that performs that job rather than the one that merely inspects the result.
'''

[[lessons.exercises]]
id = "s08-l03-e4"
type = "type"
points = 10
reps = 2
prompt = '''
<p>Retype this steel turn evidence exactly. Keep a small ai transition table whose conditions can be narrated in the combat log visible while you write. (Ctrl+Enter submits.)</p>
'''
code = '''
state = "idle"
player_near = True
if player_near:
    state = "aggro"
print(state)
'''
