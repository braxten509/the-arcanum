[freestyle]
title = "THE WORKING 8 // Steel and Shadow"
brief = '''
<p>Bind steel and shadow into the growing RuneBound route. The commission must leave a runnable artifact whose behavior can be inspected from the named evidence.</p><ul><li>preserve the chart's data boundary and use the established names</li><li>prove the requested behavior with a repeatable run that ends at <code>RUNEBOUND S08 SEAL</code></li><li>write a short repair note explaining the nearest failure and the change that corrected it</li></ul>
'''
requires = ["s08-stat-block","s08-damage-rule","s08-turn-order","s08-player-actions","s08-enemy-ai","s08-state-transitions","s08-health-ui","s08-combat-outcomes","s08-combat-integration","s08-encounter-proof"]
reward = 244
xray = '''
The Cartographer checks whether the steel turn commission keeps hp, max_hp, attack, and defense as explicit combat facts under the right owner, shows s09 can award an item or toast from the stored combat result, and leaves evidence beyond a decorative printout.
'''

[freestyle.badge]
id = "badge-s08"
name = "STEEL TURN SEALED"
desc = "Sealed the steel and shadow chart with evidence another wayfinder can inspect."

[[freestyle.rubric]]
criterion = "Steel Turn runs"
weight = 25
desc = '''
The steel and shadow artifact parses and runs with the chart's named behavior visible.
'''

[[freestyle.rubric]]
criterion = "Steel Turn keeps its boundary"
weight = 35
desc = '''
The commission keeps hp, max_hp, attack, and defense as explicit combat facts and s09 can award an item or toast from the stored combat result in the owners established by the lessons.
'''

[[freestyle.rubric]]
criterion = "Steel Turn shows proof"
weight = 25
desc = '''
The wayfinder supplies a repeatable observation, the exact s08 seal, and a useful comparison case rather than a one-time claim.
'''

[[freestyle.rubric]]
criterion = "Cartographer's repair note"
weight = 15
desc = '''
The explanation names the failing boundary, the evidence that exposed it, and the smallest correction that restored the route.
'''

