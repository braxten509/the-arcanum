[[lessons]]
id = "s03-l03"
title = "The Candle, the Paint, and the Clock"
teaches = ["s03-draw-order","s03-frame-timing"]
body = '''
<p>s03-l03 opens the windows and timing chart through Candle. s03-l03 hears THE CARTOGRAPHER name s03-draw-order its first bearing. s03-l03 names one input, one change, and one output. s03-l03 gives s03-frame-timing a second mark for comparison. s03-l03 keeps the smallest successful example beside its route.</p>
<p>s03-l03 reads from left to right, then narrates state changes. s03-l03 keeps its windows and timing clue concrete and observable. s03-l03 runs twice; the second pass challenges the first. s03-l03 records which owner moved when s03-draw-order shifted. s03-l03 carries earlier <code>camera_offset</code> evidence into this chart.</p>
<p>s03-l03 asks one decision to stand alone in the margin. s03-l03 keeps s03-frame-timing visible instead of hiding it behind polish. s03-l03 tests a friendly case and a sharp edge case. s03-l03 compares both traces so s03-draw-order has a witness. s03-l03 names the failure before choosing a repair.</p>
<p>s03-l03 treats each handoff as a contract between maker and reader. s03-l03 supplies s03-draw-order; the reader checks s03-frame-timing. s03-l03 places its check where another wayfinder can repeat it. s03-l03 earns THE CARTOGRAPHER's trust through evidence, not luck. s03-l03 leaves one deliberate question for the next chart.</p>
<p>s03-l03 closes by stating what the program must preserve. s03-l03 names one input that could falsify s03-draw-order. s03-l03 names one output that confirms s03-frame-timing still belongs. s03-l03 runs the smallest route, inspects its trace, and annotates it. s03-l03 turns the windows and timing chart into a RuneBound waypoint.</p>
<p>s03-l03 ends with a handoff to the next chart. s03-l03 carries s03-frame-timing forward after s03-draw-order earns trust. s03-l03 lets THE CARTOGRAPHER record the result in plain language. s03-l03 turns a clean rerun from a guess into a fact. s03-l03 lets the next wayfinder begin without hidden context.</p>
<pre><code>print("s03-l03 // The Candle, the Paint, and the Clock")</code></pre>
<div class="field-notes"><div class="fn-head">FIELD NOTES // S03-L03</div><p>s03-l03 <strong>Evidence.</strong> Record s03-draw-order; compare it with s03-frame-timing before advancing.</p><p>s03-l03 <strong>Repair.</strong> Change one cause, rerun the route, and preserve the explanation.</p></div>
'''

[[lessons.readings]]
label = "PyGame docs // display // The Candle, the Paint, and the Clock"
url = "https://www.pygame.org/docs/ref/display.html"

[[lessons.readings]]
label = "PyGame docs // event queue // The Candle, the Paint, and the Clock"
url = "https://www.pygame.org/docs/ref/event.html"

[[lessons.exercises]]
id = "s03-l03-e1"
type = "text"
points = 16
prompt = '''
<p>s03-l03-e1: name the Python term for the specific unit requested by this chart. Supply the language term, not the surrounding story label.</p>
'''
answer = "flip"
hint = '''
Recall the named boundary in The Candle, the Paint, and the Clock; the answer is the language term for that single job, not the larger game feature.
'''

[[lessons.exercises]]
id = "s03-l03-e2"
type = "fill"
points = 18
prompt = '''
<p>s03-l03-e2: restore the missing operation in the supplied code. Use its operands and the chart evidence to complete the route without renaming the owner.</p>
'''
code = '''
clock.____(60)
'''
answer = "tick"
hint = '''
Look at what must happen to clock.tick(60) keeps the frame budget near sixty turns per second; choose the operation that performs that job rather than the one that merely inspects the result.
'''

[[lessons.exercises]]
id = "s03-l03-e3"
type = "mc"
points = 14
prompt = '''
<p>What does draw order control when several surfaces share one screen? Select the reading that keeps s04 can put the camera offset into a stable frame schedule possible.</p>
'''
choices = ["which class receives inheritance from GameEntity","whether the event queue contains a QUIT event","the number of rows in a CSV map","which later blit remains visible when rectangles overlap"]
answer = 3
whyWrong = '''
The tempting routes confuse painting the hud first and covering it with a later world blit, or advancing logic once per loop instead of by elapsed time with the job this trial actually asks you to protect; each decoy moves ownership to the wrong part of the chart.
'''
hint = '''
Trace background first, entities next, interface last, then display.flip() and Clock.tick() in the World Window chart, then compare the blit order is the depth rule because PyGame does not supply a hidden z-index with the evidence named in the prompt.
'''
explain = '''
The selected mark preserves blit order is the depth rule because pygame does not supply a hidden z-index and leaves background first, entities next, interface last, then display.flip() and clock.tick() available for the next RuneBound handoff.
'''

