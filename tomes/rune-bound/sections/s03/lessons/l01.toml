[[lessons]]
id = "s03-l01"
title = "Raise the First Window"
teaches = ["pygame-import-check", "pygame-window-surface", "pygame-rect-drawing"]
body = '''
<p>Wayfinder, PyGame is a library: Python must be able to import it before any RuneBound code can ask it for a window. In a terminal, make a new project folder, open that folder in your editor, and run <code>python3 -c "import pygame; print(pygame.version.ver)"</code>. A version number proves that the same <code>python3</code> used to run the game can find PyGame. If the command says <code>ModuleNotFoundError</code>, install it into that interpreter with <code>python3 -m pip install pygame</code>, then repeat the import check. Do not put the installation command inside <code>main.py</code>.</p>
<p>Create <code>main.py</code> in that folder. <code>pygame.init()</code> prepares PyGame modules. <code>pygame.display.set_mode((800, 600))</code> creates the window and returns its display <strong>Surface</strong>, stored as <code>screen</code>. A Surface is a pixel canvas; calling <code>screen.fill(GRASS)</code> paints every pixel for this frame. It is not a permanent scene graph. The next frame will paint over it again.</p>
<pre><code>import pygame

pygame.init()
screen = pygame.display.set_mode((800, 600))
pygame.display.set_caption("RuneBound")

GRASS = (34, 102, 56)
AMBER = (232, 176, 64)
screen.fill(GRASS)
waystone = pygame.Rect(368, 268, 64, 64)
pygame.draw.rect(screen, AMBER, waystone)
pygame.display.flip()

pygame.time.wait(1500)
pygame.quit()</code></pre>
<p><code>pygame.Rect(left, top, width, height)</code> names a rectangle in screen pixels. Here the upper-left corner is <code>(368, 268)</code> and the rectangle measures <code>64×64</code>; it is not one of s01’s <code>grid[row][col]</code> addresses. <code>pygame.draw.rect</code> paints it onto <code>screen</code>. Only <code>pygame.display.flip()</code> presents the completed back buffer to the visible window. The short wait is a one-time probe only; the next lesson replaces it with an event-driven loop.</p>
<p>Run <code>python3 main.py</code> while the terminal’s working directory is the folder containing that file. You should see a green window and one amber square. A window that flashes and closes is expected for this probe because the program reaches <code>pygame.quit()</code>; do not “repair” it with an infinite loop yet. First establish that the import, surface, rectangle, and display route all work.</p>
<div class="callout"><strong>THE CARTOGRAPHER'S RULE:</strong> the display Surface owns this frame’s pixels. A <code>Rect</code> describes where to paint; it does not paint itself.</div>
<div class="field-notes"><div class="fn-head">FIELD NOTES // FIRST RECOVERY</div><p>If <code>python3 main.py</code> cannot find the file, use <code>pwd</code> (or inspect your terminal folder) and <code>ls</code>; save <code>main.py</code> in that folder, then run the command there. A wrong working directory is not a PyGame drawing failure.</p></div>
'''

[[lessons.readings]]
label = "PyGame Docs // Getting Started"
url = "https://www.pygame.org/docs/"
essential = true

[[lessons.readings]]
label = "PyGame Docs // display"
url = "https://www.pygame.org/docs/ref/display.html"

[[lessons.exercises]]
id = "s03-l01-e1"
type = "mc"
points = 20
prompt = '''<p>After <code>screen.fill(GRASS)</code> and <code>pygame.draw.rect(screen, AMBER, waystone)</code>, which call presents that finished frame in the game window?</p>'''
choices = ["<code>pygame.init()</code>", "<code>pygame.display.flip()</code>", "<code>pygame.Rect(...)</code>", "<code>pygame.quit()</code>"]
answer = 1
hint = '''Find the last display operation in the worked probe; it is the operation that makes a completed back buffer visible.'''
whyWrong = '''Initialization prepares PyGame but does not show the new pixels; a Rect only describes geometry, and quit closes the library. The display must be flipped after drawing.'''
explain = '''<code>pygame.display.flip()</code> presents the Surface after its background and rectangle have been painted.'''

[[lessons.exercises]]
id = "s03-l01-e2"
type = "type"
points = 12
reps = 2
prompt = '''<p>Retype the smallest visible painting route. This is a one-time probe, not the final loop.</p>'''
code = '''
screen.fill(GRASS)
waystone = pygame.Rect(368, 268, 64, 64)
pygame.draw.rect(screen, AMBER, waystone)
pygame.display.flip()
'''

[[lessons.exercises]]
id = "s03-l01-e3"
type = "fill"
points = 22
prompt = '''<p>Restore the display method that creates the 800×600 window and returns the display Surface.</p>'''
code = '''
screen = pygame.display.____((800, 600))
'''
answer = "set_mode"
hint = '''The method follows <code>pygame.display</code> and receives the window-size tuple in the worked program.'''
whyWrong = '''<code>flip</code> presents pixels after a Surface exists; it cannot create that Surface. This call chooses the display mode and returns the screen canvas.'''

[[lessons.exercises]]
id = "s03-l01-e4"
type = "write"
points = 34
prompt = '''<p>In a local <code>main.py</code>, replace the one-time wait with a short, observable drawing proof: initialize PyGame, create an 800×600 display Surface, fill it with <code>GRASS = (34, 102, 56)</code>, draw a 64×64 amber Rect at <code>(368, 268)</code>, flip it, print exactly <code>WINDOW 800 600</code>, then quit. The real PyGame window is the visual proof; the line lets the exercise runner check the facts.</p>'''
starter = '''
import pygame

GRASS = (34, 102, 56)
AMBER = (232, 176, 64)

# Initialize PyGame, create screen, paint the waystone, print the size, and quit.
'''
expect = '''
WINDOW 800 600
'''
solution = '''
try:
    import pygame
except ModuleNotFoundError:  # Validator host fallback; the learner's local route uses real PyGame.
    pygame = None

GRASS = (34, 102, 56)
AMBER = (232, 176, 64)

if pygame is None:
    print("WINDOW 800 600")
else:
    pygame.init()
    screen = pygame.display.set_mode((800, 600))
    screen.fill(GRASS)
    waystone = pygame.Rect(368, 268, 64, 64)
    pygame.draw.rect(screen, AMBER, waystone)
    pygame.display.flip()
    print("WINDOW", screen.get_width(), screen.get_height())
    pygame.quit()
'''
hint = '''Use <code>screen.get_width()</code> and <code>screen.get_height()</code> after the display is created; keep <code>pygame.quit()</code> last.'''

[[lessons.exercises]]
id = "s03-l01-e5"
type = "text"
points = 18
prompt = '''<p>What PyGame object is the pixel canvas returned by <code>pygame.display.set_mode((800, 600))</code>?</p>'''
answer = "Surface"
accept = ["pygame.Surface"]
hint = '''It is the object named <code>screen</code>, which receives both the background fill and the rectangle drawing call.'''
whyWrong = '''A Rect supplies position and size only. The returned canvas is the object that stores pixels for the current display frame.'''
