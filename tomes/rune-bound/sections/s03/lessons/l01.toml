[[lessons]]
id = "s03-l01"
title = "The Window Rite"
teaches = ["s03-pygame-init","s03-surface-drawing"]
body = '''
<p>s03-l01 opens the windows and timing chart through Window. s03-l01 hears THE CARTOGRAPHER name s03-pygame-init its first bearing. s03-l01 names one input, one change, and one output. s03-l01 gives s03-surface-drawing a second mark for comparison. s03-l01 keeps the smallest successful example beside its route.</p>
<p>s03-l01 reads from left to right, then narrates state changes. s03-l01 keeps its windows and timing clue concrete and observable. s03-l01 runs twice; the second pass challenges the first. s03-l01 records which owner moved when s03-pygame-init shifted. s03-l01 carries earlier <code>camera_offset</code> evidence into this chart.</p>
<p>s03-l01 asks one decision to stand alone in the margin. s03-l01 keeps s03-surface-drawing visible instead of hiding it behind polish. s03-l01 tests a friendly case and a sharp edge case. s03-l01 compares both traces so s03-pygame-init has a witness. s03-l01 names the failure before choosing a repair.</p>
<p>s03-l01 treats each handoff as a contract between maker and reader. s03-l01 supplies s03-pygame-init; the reader checks s03-surface-drawing. s03-l01 places its check where another wayfinder can repeat it. s03-l01 earns THE CARTOGRAPHER's trust through evidence, not luck. s03-l01 leaves one deliberate question for the next chart.</p>
<p>s03-l01 closes by stating what the program must preserve. s03-l01 names one input that could falsify s03-pygame-init. s03-l01 names one output that confirms s03-surface-drawing still belongs. s03-l01 runs the smallest route, inspects its trace, and annotates it. s03-l01 turns the windows and timing chart into a RuneBound waypoint.</p>
<p>s03-l01 ends with a handoff to the next chart. s03-l01 carries s03-surface-drawing forward after s03-pygame-init earns trust. s03-l01 lets THE CARTOGRAPHER record the result in plain language. s03-l01 turns a clean rerun from a guess into a fact. s03-l01 lets the next wayfinder begin without hidden context.</p>
<pre><code>print("s03-l01 // The Window Rite")</code></pre>
<div class="field-notes"><div class="fn-head">FIELD NOTES // S03-L01</div><p>s03-l01 <strong>Evidence.</strong> Record s03-pygame-init; compare it with s03-surface-drawing before advancing.</p><p>s03-l01 <strong>Repair.</strong> Change one cause, rerun the route, and preserve the explanation.</p></div>
'''

[[lessons.readings]]
label = "PyGame docs // display // The Window Rite"
url = "https://www.pygame.org/docs/ref/display.html"

[[lessons.readings]]
label = "PyGame docs // event queue // The Window Rite"
url = "https://www.pygame.org/docs/ref/event.html"

[[lessons.exercises]]
id = "s03-l01-e1"
type = "mc"
points = 14
prompt = '''
<p>What is the screen Surface's job in a basic PyGame frame? Select the reading that keeps the game loop can clear and repaint a real screen instead of printing a promise possible.</p>
'''
choices = ["it stores every keyboard event forever","it decides which Python class inherits from Player","it replaces the clock so frames need no timing","it receives the background and shapes before the display is updated"]
answer = 3
whyWrong = '''
The tempting routes confuse drawing before a display exists or confusing the window with the pixels painted onto it with the job this trial actually asks you to protect; each decoy moves ownership to the wrong part of the chart.
'''
hint = '''
Trace pygame.init(), display.set_mode(), and a screen that can receive a draw in the World Window chart, then compare the initialization prepares the library while the Surface is the canvas for this frame with the evidence named in the prompt.
'''
explain = '''
The selected mark preserves initialization prepares the library while the surface is the canvas for this frame and leaves pygame.init(), display.set_mode(), and a screen that can receive a draw available for the next RuneBound handoff.
'''

[[lessons.exercises]]
id = "s03-l01-e2"
type = "text"
points = 16
prompt = '''
<p>s03-l01-e2: name the Python term for the specific unit requested by this chart. Supply the language term, not the surrounding story label.</p>
'''
answer = "pygame.Surface"
hint = '''
Recall the named boundary in The Window Rite; the answer is the language term for that single job, not the larger game feature.
'''

[[lessons.exercises]]
id = "s03-l01-e3"
type = "fill"
points = 18
prompt = '''
<p>s03-l01-e3: restore the missing operation in the supplied code. Use its operands and the chart evidence to complete the route without renaming the owner.</p>
'''
code = '''
screen = pygame.display.____((800, 600))
'''
answer = "set_mode"
hint = '''
Look at what must happen to screen = pygame.display.set_mode((800, 600)); choose the operation that performs that job rather than the one that merely inspects the result.
'''

[[lessons.exercises]]
id = "s03-l01-e4"
type = "type"
points = 10
reps = 2
prompt = '''
<p>Retype this world window evidence exactly. Keep pygame.init(), display.set_mode(), and a screen that can receive a draw visible while you write. (Ctrl+Enter submits.)</p>
'''
code = '''
screen_size = (320, 240)
print("surface size", screen_size)
'''
