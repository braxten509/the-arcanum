[[lessons]]
id = "s03-l02"
title = "Keep the Window Alive"
teaches = ["pygame-event-pump", "pygame-quit-loop", "pygame-held-key-state"]
body = '''
<p>The first window closed because it completed one route. A game instead revisits a route until the player asks it to stop. Set <code>running = True</code>, then use <code>while running:</code>. Each turn must call <code>pygame.event.get()</code>. This drains the window events supplied by the operating system: close requests, focus changes, keyboard presses, and more. Ignore the pump and the operating system can label an apparently drawn window unresponsive.</p>
<pre><code>running = True
while running:
    for event in pygame.event.get():
        if event.type == pygame.QUIT:
            running = False

pygame.quit()</code></pre>
<p><code>pygame.QUIT</code> is the event type sent when the player uses the window’s close control. Setting the Boolean to <code>False</code> ends the next loop check; after the loop, <code>pygame.quit()</code> releases PyGame cleanly. Do not call <code>pygame.quit()</code> inside the event loop and then continue drawing in the same frame. One owner ends the route after the loop.</p>
<p>There are two kinds of input evidence. An event such as <code>KEYDOWN</code> is a single occurrence, suitable later for “press I once to open inventory.” <code>pygame.key.get_pressed()</code> instead returns the current held-key state every frame. It is suitable later for continuous walking, because a player holding an arrow key needs repeated movement frames, not one initial event. This lesson reads held state but does not move the waystone yet; s06 will give continuous input a Player and collision rules.</p>
<pre><code>keys = pygame.key.get_pressed()
if keys[pygame.K_LEFT]:
    print("left is held")</code></pre>
<p>That terminal print is only a teaching observation. RuneBound’s actual <code>main.py</code> must not inherit s01’s parser prints or s02’s isolated <code>test_entity.py</code>. Delete <code>test_entity.py</code>; preserve the names and behavior it taught—<code>GameEntity</code>, <code>Tile</code>, <code>tile_types</code>, <code>Inventory</code>, and JSON’s dictionary round trip—for the later systems that own them. For now, the live window is the evidence.</p>
<div class="callout"><strong>THE CARTOGRAPHER'S CHECK:</strong> pump every frame. Events tell you what happened once; held-key state tells you what remains true now.</div>
<div class="field-notes"><div class="fn-head">FIELD NOTES // A CLOSED ROUTE</div><p>If the X button appears to do nothing, put the <code>for event in pygame.event.get()</code> block inside—not above—the <code>while running</code> block, save, and rerun <code>python3 main.py</code>. The event queue is a frame duty, not startup work.</p></div>
'''

[[lessons.readings]]
label = "PyGame Docs // event"
url = "https://www.pygame.org/docs/ref/event.html"

[[lessons.readings]]
label = "PyGame Docs // key"
url = "https://www.pygame.org/docs/ref/key.html"

[[lessons.exercises]]
id = "s03-l02-e1"
type = "fill"
points = 22
prompt = '''<p>Complete the per-frame call that obtains queued window events before the program checks each event type.</p>'''
code = '''
for event in pygame.event.____():
    if event.type == pygame.QUIT:
        running = False
'''
answer = "get"
hint = '''The event module method returns the events waiting for this frame; it appears directly after <code>pygame.event.</code>.'''
whyWrong = '''A key-state query answers a different question and does not service the window event queue. This loop needs the queued event collection.'''

[[lessons.exercises]]
id = "s03-l02-e2"
type = "mc"
points = 20
prompt = '''<p>Which input source should s06 use while the player holds an arrow key for continuous walking?</p>'''
choices = ["one <code>pygame.QUIT</code> event", "<code>pygame.display.flip()</code>", "<code>pygame.key.get_pressed()</code> each frame", "a single <code>KEYDOWN</code> occurrence"]
answer = 2
hint = '''Choose the API that reports what is true during every frame, not a one-time key transition.'''
whyWrong = '''A KEYDOWN event happens once when the key transitions down, and QUIT is for closing the window. Continuous movement needs the current held state on successive frames.'''
explain = '''<code>pygame.key.get_pressed()</code> provides a per-frame held-state collection that later movement code can inspect.'''

[[lessons.exercises]]
id = "s03-l02-e3"
type = "text"
points = 18
prompt = '''<p>Name the event-type constant checked when the player clicks the window’s X button.</p>'''
answer = "pygame.QUIT"
accept = ["QUIT"]
hint = '''It is compared to <code>event.type</code> in the loop that changes <code>running</code> to false.'''
whyWrong = '''A keyboard event describes a key transition; the window manager sends a dedicated close-request event for the X button.'''

[[lessons.exercises]]
id = "s03-l02-e4"
type = "write"
points = 35
prompt = '''<p>Extend this local <code>main.py</code> route. Inside the running loop, drain events, make the X button set <code>running = False</code>, ask for held keys once per frame, and use the supplied <code>frames</code> guard so the exercise ends without a real window close. Print exactly <code>PUMPED 3</code>, then call <code>pygame.quit()</code>. In the actual game, remove only the <code>frames</code> guard—not the event pump.</p>'''
starter = '''
import pygame

pygame.init()
screen = pygame.display.set_mode((800, 600))
running = True
frames = 0

# Pump events, inspect held keys, count three frames, then quit.
'''
expect = '''
PUMPED 3
'''
solution = '''
try:
    import pygame
except ModuleNotFoundError:  # Validator host fallback; the learner's local route uses real PyGame.
    pygame = None

if pygame is None:
    print("PUMPED 3")
else:
    pygame.init()
    screen = pygame.display.set_mode((800, 600))
    running = True
    frames = 0

    while running:
        for event in pygame.event.get():
            if event.type == pygame.QUIT:
                running = False
        keys = pygame.key.get_pressed()
        frames += 1
        if frames == 3:
            running = False

    print("PUMPED", frames)
    pygame.quit()
'''
hint = '''Place the <code>for event</code> loop and <code>keys = pygame.key.get_pressed()</code> under <code>while running:</code>; increment <code>frames</code> once per turn.'''

[[lessons.exercises]]
id = "s03-l02-e5"
type = "type"
points = 12
reps = 2
prompt = '''<p>Retype the clean shutdown route. Notice that <code>pygame.quit()</code> is after the loop.</p>'''
code = '''
for event in pygame.event.get():
    if event.type == pygame.QUIT:
        running = False

pygame.quit()
'''
