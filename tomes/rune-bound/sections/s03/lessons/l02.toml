[[lessons]]
id = "s03-l02"
title = "The Pump-or-Die Loop"
teaches = ["s03-event-pump","s03-game-loop"]
body = '''
<p>s03-l02 opens the windows and timing chart through Pump-or-Die. s03-l02 hears THE CARTOGRAPHER name s03-event-pump its first bearing. s03-l02 names one input, one change, and one output. s03-l02 gives s03-game-loop a second mark for comparison. s03-l02 keeps the smallest successful example beside its route.</p>
<p>s03-l02 reads from left to right, then narrates state changes. s03-l02 keeps its windows and timing clue concrete and observable. s03-l02 runs twice; the second pass challenges the first. s03-l02 records which owner moved when s03-event-pump shifted. s03-l02 carries earlier <code>camera_offset</code> evidence into this chart.</p>
<p>s03-l02 asks one decision to stand alone in the margin. s03-l02 keeps s03-game-loop visible instead of hiding it behind polish. s03-l02 tests a friendly case and a sharp edge case. s03-l02 compares both traces so s03-event-pump has a witness. s03-l02 names the failure before choosing a repair.</p>
<p>s03-l02 treats each handoff as a contract between maker and reader. s03-l02 supplies s03-event-pump; the reader checks s03-game-loop. s03-l02 places its check where another wayfinder can repeat it. s03-l02 earns THE CARTOGRAPHER's trust through evidence, not luck. s03-l02 leaves one deliberate question for the next chart.</p>
<p>s03-l02 closes by stating what the program must preserve. s03-l02 names one input that could falsify s03-event-pump. s03-l02 names one output that confirms s03-game-loop still belongs. s03-l02 runs the smallest route, inspects its trace, and annotates it. s03-l02 turns the windows and timing chart into a RuneBound waypoint.</p>
<p>s03-l02 ends with a handoff to the next chart. s03-l02 carries s03-game-loop forward after s03-event-pump earns trust. s03-l02 lets THE CARTOGRAPHER record the result in plain language. s03-l02 turns a clean rerun from a guess into a fact. s03-l02 lets the next wayfinder begin without hidden context.</p>
<pre><code>print("s03-l02 // The Pump-or-Die Loop")</code></pre>
<div class="field-notes"><div class="fn-head">FIELD NOTES // S03-L02</div><p>s03-l02 <strong>Evidence.</strong> Record s03-event-pump; compare it with s03-game-loop before advancing.</p><p>s03-l02 <strong>Repair.</strong> Change one cause, rerun the route, and preserve the explanation.</p></div>
'''

[[lessons.readings]]
label = "PyGame docs // display // The Pump-or-Die Loop"
url = "https://www.pygame.org/docs/ref/display.html"

[[lessons.exercises]]
id = "s03-l02-e1"
type = "fill"
points = 18
prompt = '''
<p>s03-l02-e1: restore the missing operation in the supplied code. Use its operands and the chart evidence to complete the route without renaming the owner.</p>
'''
code = '''
for event in pygame.event.____():
'''
answer = "get"
hint = '''
Look at what must happen to for event in pygame.event.get(): if event.type == pygame.quit; choose the operation that performs that job rather than the one that merely inspects the result.
'''

[[lessons.exercises]]
id = "s03-l02-e2"
type = "mc"
points = 14
prompt = '''
<p>Why must the event queue be serviced inside the frame loop? Select the reading that keeps s06 can combine event-driven actions with continuous player motion possible.</p>
'''
choices = ["the queue supplies the tile colors used by draw.rect","the operating system needs the application to acknowledge pending window events","event polling advances animation frames by itself","a loop without events cannot call Python functions"]
answer = 1
whyWrong = '''
The tempting routes confuse skipping the event queue and leaving the operating system to mark the window unresponsive with the job this trial actually asks you to protect; each decoy moves ownership to the wrong part of the chart.
'''
hint = '''
Trace pygame.event.get() and a running flag that responds to QUIT in the World Window chart, then compare the a KEYDOWN is a single occurrence while held-key polling describes a continuing state with the evidence named in the prompt.
'''
explain = '''
The selected mark preserves a keydown is a single occurrence while held-key polling describes a continuing state and leaves pygame.event.get() and a running flag that responds to quit available for the next RuneBound handoff.
'''

[[lessons.exercises]]
id = "s03-l02-e3"
type = "type"
points = 10
reps = 2
prompt = '''
<p>Retype this world window evidence exactly. Keep pygame.event.get() and a running flag that responds to quit visible while you write. (Ctrl+Enter submits.)</p>
'''
code = '''
running = True
for _ in range(1):
    print("pump checked", running)
'''

[[lessons.exercises]]
id = "s03-l02-e4"
type = "write"
points = 30
prompt = '''
<p>Complete the world window route and print exactly <code>RUNEBOUND S03 L02 SEAL</code>. Preserve the named data before adding the final observation.</p>
'''
starter = '''
route_mark = "pump-loop"
print("survey pending")
# Add the chart seal after checking the route.
'''
expect = '''
RUNEBOUND S03 L02 SEAL
'''
solution = '''
route_mark = "pump-loop"
print("RUNEBOUND S03 L02 SEAL")
'''
hint = '''
For s03-l02-e4, leave the route data intact and add only its final s03 observation; compare the starter output with the target before submitting.
'''

