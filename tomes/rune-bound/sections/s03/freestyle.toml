[freestyle]
title = "BUILD: RuneBound's First Living Frame"
brief = '''
<p>Wayfinder, turn the surveys into RuneBound’s canonical <code>main.py</code>. This is no terminal toy: run it from your project folder with <code>python3 main.py</code>, observe the window, then close it with the X button and run it again.</p><ul><li>Verify the local toolchain with <code>python3 -c "import pygame; print(pygame.version.ver)</code>, then create <code>main.py</code> that calls <code>pygame.init()</code>, opens a 800×600 display Surface, and gives the window the caption <code>RuneBound</code>.</li><li>Use <code>FPS = 60</code>, <code>TILE_SIZE = 32</code>, <code>GRASS = (34, 102, 56)</code>, and <code>AMBER = (232, 176, 64)</code>. Every frame must fill the display grass, draw one amber 64×64 Rect at <code>(12 * TILE_SIZE, 8 * TILE_SIZE)</code>, then call <code>pygame.display.flip()</code>.</li><li>Use <code>while running:</code>; inside it call <code>pygame.event.get()</code>, set <code>running = False</code> for <code>pygame.QUIT</code>, read <code>pygame.key.get_pressed()</code> once per frame, and end the program with <code>pygame.quit()</code> after the loop.</li><li>Create one <code>pygame.time.Clock()</code>; after drawing, assign <code>dt = clock.tick(FPS) / 1000.0</code>. Keep the frame route readable as events → update boundary → draw → flip → clock.</li><li>Delete the retired <code>test_entity.py</code> and do not copy s01’s terminal grid prints or a print seal into <code>main.py</code>. Preserve the earlier model contracts for later modules; this entry point only proves its world visually.</li><li>Add a two-line comment above the hardcoded constants stating that s04 replaces them with <code>data/tiles.json</code> definitions. Your delivery evidence is a short note recording the command, the visible green field and amber waystone, and that the X button closes cleanly on two consecutive runs.</li></ul>
'''
requires = ["pygame-import-check", "pygame-window-surface", "pygame-rect-drawing", "pygame-event-pump", "pygame-quit-loop", "pygame-held-key-state", "pygame-frame-draw-order", "pygame-surface-blit", "pygame-frame-clock", "pygame-delta-time"]
reward = 235
xray = '''
THE CARTOGRAPHER opens main.py from its first executable line. He looks for a real event pump inside the loop, a single completed drawing order, a clean quit after the loop, and a Clock that produces seconds. A decorative print cannot substitute for a visible window; leaving test_entity.py or terminal grid debugging behind means the earlier temporary route was not retired. He gives craft credit for names that tell the truth, four-space indentation, and small visual constants grouped at the top.
'''

[freestyle.badge]
id = "badge-s03"
name = "WORLD WINDOW SEALED"
desc = "Raised RuneBound's first responsive, paced, visible frame."

[[freestyle.rubric]]
criterion = "Responsive PyGame Window"
weight = 25
desc = '''main.py imports and initializes PyGame, opens a captioned 800×600 RuneBound window, and an X-button pygame.QUIT event ends the loop before pygame.quit() runs.'''

[[freestyle.rubric]]
criterion = "Visible Frame and Layer Route"
weight = 25
desc = '''Every frame fills GRASS, draws the amber 64×64 Rect at the required TILE_SIZE-based coordinates, and calls pygame.display.flip() only after the frame is completely painted; the learner’s note records two successful visible runs.'''

[[freestyle.rubric]]
criterion = "Pump, Held State, and Frame Clock"
weight = 20
desc = '''The loop calls pygame.event.get() and pygame.key.get_pressed() every frame, creates one pygame.time.Clock(), and assigns dt = clock.tick(FPS) / 1000.0 after drawing with FPS = 60.'''

[[freestyle.rubric]]
criterion = "Cumulative Retirement and Future Boundary"
weight = 15
desc = '''test_entity.py and terminal grid print debugging are removed from the runnable artifact; the earlier contracts are not redefined, and a comment identifies TILE_SIZE, GRASS, and AMBER as s04 replacements by data/tiles.json.'''

[[freestyle.rubric]]
criterion = "Python Field Craft"
weight = 15
desc = '''Uses snake_case variables and functions, UPPER_CASE constants, four-space indentation, blank lines between top-level blocks, and a readable events → update boundary → draw → flip → clock frame layout.'''
