[freestyle]
title = "THE WORKING 3 // A Window on the World"
brief = '''
<p>Bind a window on the world into the growing RuneBound route. The commission must leave a runnable artifact whose behavior can be inspected from the named evidence.</p><ul><li>preserve the chart's data boundary and use the established names</li><li>prove the requested behavior with a repeatable run that ends at <code>RUNEBOUND S03 SEAL</code></li><li>write a short repair note explaining the nearest failure and the change that corrected it</li></ul>
'''
requires = ["s03-pygame-init","s03-surface-drawing","s03-event-pump","s03-game-loop","s03-draw-order","s03-frame-timing"]
reward = 204
xray = '''
The Cartographer checks whether the world window commission keeps pygame.init(), display.set_mode(), and a screen that can receive a draw under the right owner, shows s04 can put the camera offset into a stable frame schedule, and leaves evidence beyond a decorative printout.
'''

[freestyle.badge]
id = "badge-s03"
name = "WORLD WINDOW SEALED"
desc = "Sealed the a window on the world chart with evidence another wayfinder can inspect."

[[freestyle.rubric]]
criterion = "World Window runs"
weight = 25
desc = '''
The a window on the world artifact parses and runs with the chart's named behavior visible.
'''

[[freestyle.rubric]]
criterion = "World Window keeps its boundary"
weight = 35
desc = '''
The commission keeps pygame.init(), display.set_mode(), and a screen that can receive a draw and s04 can put the camera offset into a stable frame schedule in the owners established by the lessons.
'''

[[freestyle.rubric]]
criterion = "World Window shows proof"
weight = 25
desc = '''
The wayfinder supplies a repeatable observation, the exact s03 seal, and a useful comparison case rather than a one-time claim.
'''

[[freestyle.rubric]]
criterion = "Cartographer's repair note"
weight = 15
desc = '''
The explanation names the failing boundary, the evidence that exposed it, and the smallest correction that restored the route.
'''

