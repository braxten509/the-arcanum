[[lessons]]
id = "s09-l03"
title = "The Pickup Boundary"
teaches = ["s09-pickup-detection", "s09-pickup-retirement"]
body = '''
<p>A colored tile is only a promise until the running frame turns it into possession. Add a small member-only method to the existing <code>TileMap</code> class in <code>tilemap.py</code>, directly below <code>tile_at(world_x, world_y)</code>. It uses the same world-pixel-to-row/column conversion and deliberately does not apply camera offsets. Returning <code>False</code> outside the map gives the caller a safe recovery path.</p>
<pre><code>def replace_tile(self, world_x, world_y, replacement):
    col = world_x // TILE_SIZE
    row = world_y // TILE_SIZE
    if not (0 &lt;= row &lt; len(self.grid) and 0 &lt;= col &lt; len(self.grid[row])):
        return False
    self.grid[row][col] = replacement
    return True</code></pre>
<p>In <code>main.py</code>, load the catalog once after the existing map and sprite setup: <code>items = load_items("data/items.json")</code>. Build <code>items_by_tile = {item.pickup_tile: item for item in items.values()}</code> beside it. After Player movement has resolved, before actor update and drawing, inspect the Player’s world-space center. This placement means a blocked movement cannot collect through a wall, and every later draw reports the updated state.</p>
<pre><code>tile_id = tile_map.tile_at(player.rect.centerx, player.rect.centery)
item = items_by_tile.get(tile_id)
if item is not None and player.inventory.add(item.item_id):
    apply_modifiers(player.stats, item.modifiers)
    tile_map.replace_tile(player.rect.centerx, player.rect.centery, "grass")
    pickup_message = f"Picked up {item.name}!"
    pickup_message_until = pygame.time.get_ticks() + 1800</code></pre>
<p>Add <code>pickup_message = ""</code> and <code>pickup_message_until = 0</code> before the loop. In the UI layer, after world actors and HP bars but before the one existing display flip, call the existing s07 <code>render_text(screen, pickup_message, 16, 16)</code> only while <code>pygame.time.get_ticks() &lt; pickup_message_until</code>. Those coordinates are screen pixels; the item test remains world space. Do not move the toast into <code>draw_health_bar</code>, which only reports statistics.</p>
<p>This retires the inline phase-plan potion dictionary completely. More importantly, replacing the collected grid cell with <code>"grass"</code> is the visible retirement of the map pickup: no repeated pickup, no repeated toast, no hidden duplicate even after the overlay is closed. The JSON catalog persists as data; only this specific spawned tile is consumed.</p>
<div class="callout"><strong>THE CARTOGRAPHER'S RULE:</strong> test the world, change possession once, retire the source tile, then draw a screen-space receipt.</div>
<div class="field-notes"><div class="fn-head">FIELD NOTES // MISSED PICKUP</div><p>If the toast never appears, temporarily inspect the returned <code>tile_id</code> with one local print, confirm the map cell and Player center, then remove that debug print before delivery. If the toast repeats, verify both the <code>add</code> receipt and the <code>replace_tile(..., "grass")</code> call.</p></div>
'''

[[lessons.readings]]
label = "PyGame Docs // Rect"
url = "https://www.pygame.org/docs/ref/rect.html"

[[lessons.readings]]
label = "PyGame Docs // time"
url = "https://www.pygame.org/docs/ref/time.html"

[[lessons.exercises]]
id = "s09-l03-e1"
type = "text"
points = 18
prompt = '''<p>Which existing TileMap method reads the lower-case tile id at the Player center before the pickup lookup?</p>'''
answer = "tile_at"
hint = '''It accepts world pixel coordinates and was introduced before collision work.''' 
whyWrong = '''<code>render</code> paints terrain and <code>is_solid</code> answers a collision rule. The pickup route first needs the tile id itself.''' 

[[lessons.exercises]]
id = "s09-l03-e2"
type = "mc"
points = 20
prompt = '''<p>Why does the pickup route use <code>player.rect.centerx</code> and <code>centery</code> without camera subtraction?</p>'''
choices = ["The toast text must follow the player", "TileMap stores its grid in world coordinates", "The camera owns inventory membership", "<code>pygame.Rect</code> cannot have a center"]
answer = 1
hint = '''Compare the world-space collision API with the screen-pixel UI drawing API.''' 
whyWrong = '''The camera changes presentation only; subtracting it would query the wrong map cell. Rects do have centers, and inventory membership is unrelated to viewport state.''' 
explain = '''Game rules query world coordinates; only the toast is drawn in screen coordinates.''' 

[[lessons.exercises]]
id = "s09-l03-e3"
type = "fill"
points = 22
prompt = '''<p>Restore the dictionary operation that safely says there is no item for an ordinary grass tile.</p>'''
code = '''
item = items_by_tile.____(tile_id)
if item is not None:
    print(item.name)
'''
answer = "get"
hint = '''Unlike square indexing, this lookup returns <code>None</code> when the id has no catalog entry.''' 
whyWrong = '''<code>items</code> is not a dictionary method, and <code>pop</code> would remove catalog data. The route needs a non-mutating optional lookup.''' 

[[lessons.exercises]]
id = "s09-l03-e4"
type = "write"
points = 34
prompt = '''<p>Model one consumed map pickup. Start with <code>tile = "potion"</code>; when the catalog maps that tile to <code>"potion"</code>, add the id, replace the tile with <code>"grass"</code>, and print exactly <code>PICKED potion</code> and <code>TILE grass</code>.</p>'''
starter = '''
tile = "potion"
items_by_tile = {"potion": "potion"}
inventory = []

# Look up the item, record it, and retire the source tile.
'''
expect = '''
PICKED potion
TILE grass
'''
solution = '''
tile = "potion"
items_by_tile = {"potion": "potion"}
inventory = []

item_id = items_by_tile.get(tile)
if item_id is not None and item_id not in inventory:
    inventory.append(item_id)
    tile = "grass"
print("PICKED", inventory[0])
print("TILE", tile)
'''
hint = '''Use <code>items_by_tile.get(tile)</code>, append the resulting id once, then assign <code>"grass"</code> to <code>tile</code>.''' 
