[[lessons]]
id = "s09-l03"
title = "The Pickup Boundary"
teaches = ["s09-pickup-detection","s09-pickup-feedback"]
body = '''
<p>s09-l03 opens the items and inventory chart through Pickup. s09-l03 hears THE CARTOGRAPHER name s09-pickup-detection its first bearing. s09-l03 names one input, one change, and one output. s09-l03 gives s09-pickup-feedback a second mark for comparison. s09-l03 keeps the smallest successful example beside its route.</p>
<p>s09-l03 reads from left to right, then narrates state changes. s09-l03 keeps its items and inventory clue concrete and observable. s09-l03 runs twice; the second pass challenges the first. s09-l03 records which owner moved when s09-pickup-detection shifted. s09-l03 carries earlier <code>GameState</code> evidence into this chart.</p>
<p>s09-l03 asks one decision to stand alone in the margin. s09-l03 keeps s09-pickup-feedback visible instead of hiding it behind polish. s09-l03 tests a friendly case and a sharp edge case. s09-l03 compares both traces so s09-pickup-detection has a witness. s09-l03 names the failure before choosing a repair.</p>
<p>s09-l03 treats each handoff as a contract between maker and reader. s09-l03 supplies s09-pickup-detection; the reader checks s09-pickup-feedback. s09-l03 places its check where another wayfinder can repeat it. s09-l03 earns THE CARTOGRAPHER's trust through evidence, not luck. s09-l03 leaves one deliberate question for the next chart.</p>
<p>s09-l03 closes by stating what the program must preserve. s09-l03 names one input that could falsify s09-pickup-detection. s09-l03 names one output that confirms s09-pickup-feedback still belongs. s09-l03 runs the smallest route, inspects its trace, and annotates it. s09-l03 turns the items and inventory chart into a RuneBound waypoint.</p>
<p>s09-l03 ends with a handoff to the next chart. s09-l03 carries s09-pickup-feedback forward after s09-pickup-detection earns trust. s09-l03 lets THE CARTOGRAPHER record the result in plain language. s09-l03 turns a clean rerun from a guess into a fact. s09-l03 lets the next wayfinder begin without hidden context.</p>
<pre><code>print("s09-l03 // The Pickup Boundary")</code></pre>
<div class="field-notes"><div class="fn-head">FIELD NOTES // S09-L03</div><p>s09-l03 <strong>Evidence.</strong> Record s09-pickup-detection; compare it with s09-pickup-feedback before advancing.</p><p>s09-l03 <strong>Repair.</strong> Change one cause, rerun the route, and preserve the explanation.</p></div>
'''

[[lessons.readings]]
label = "Python library // dataclasses // The Pickup Boundary"
url = "https://docs.python.org/3/library/dataclasses.html"

[[lessons.readings]]
label = "Python tutorial // dictionaries // The Pickup Boundary"
url = "https://docs.python.org/3/tutorial/datastructures.html"

[[lessons.exercises]]
id = "s09-l03-e1"
type = "text"
points = 16
prompt = '''
<p>s09-l03-e1: name the Python term for the specific unit requested by this chart. Supply the language term, not the surrounding story label.</p>
'''
answer = "overlap"
hint = '''
Recall the named boundary in The Pickup Boundary; the answer is the language term for that single job, not the larger game feature.
'''

[[lessons.exercises]]
id = "s09-l03-e2"
type = "fill"
points = 18
prompt = '''
<p>s09-l03-e2: restore the missing operation in the supplied code. Use its operands and the chart evidence to complete the route without renaming the owner.</p>
'''
code = '''
inventory.____(potion)
'''
answer = "add"
hint = '''
Look at what must happen to inventory.add(potion) after the player overlaps the chest tile; choose the operation that performs that job rather than the one that merely inspects the result.
'''

[[lessons.exercises]]
id = "s09-l03-e3"
type = "mc"
points = 14
prompt = '''
<p>What makes pickup feedback trustworthy? Select the reading that keeps the item becomes available to the inventory screen and quest conditions possible.</p>
'''
choices = ["the toast appears before collision is checked","the inventory screen owns the map tile","the item is printed but never stored","The Pickup Boundary: keep s09-pickup-detection owned by the named boundary and verify the result before handoff s09-l03-e3."]
answer = 3
whyWrong = '''
The tempting routes confuse adding the same item every frame or showing a toast without changing inventory with the job this trial actually asks you to protect; each decoy moves ownership to the wrong part of the chart.
'''
hint = '''
Trace overlap detection, Inventory.add(), and a short toast that confirms the item was collected in the Spoils Ledger chart, then compare the the world event fires once at the pickup boundary while the UI reports the resulting fact with the evidence named in the prompt.
'''
explain = '''
The selected mark preserves the world event fires once at the pickup boundary while the ui reports the resulting fact and leaves overlap detection, inventory.add(), and a short toast that confirms the item was collected available for the next RuneBound handoff.
'''

