[[lessons]]
id = "s09-l02"
title = "The Pack Ledger"
teaches = ["s09-inventory-collection","s09-inventory-api"]
body = '''
<p>s09-l02 opens the items and inventory chart through Pack. s09-l02 hears THE CARTOGRAPHER name s09-inventory-collection its first bearing. s09-l02 names one input, one change, and one output. s09-l02 gives s09-inventory-api a second mark for comparison. s09-l02 keeps the smallest successful example beside its route.</p>
<p>s09-l02 reads from left to right, then narrates state changes. s09-l02 keeps its items and inventory clue concrete and observable. s09-l02 runs twice; the second pass challenges the first. s09-l02 records which owner moved when s09-inventory-collection shifted. s09-l02 carries earlier <code>GameState</code> evidence into this chart.</p>
<p>s09-l02 asks one decision to stand alone in the margin. s09-l02 keeps s09-inventory-api visible instead of hiding it behind polish. s09-l02 tests a friendly case and a sharp edge case. s09-l02 compares both traces so s09-inventory-collection has a witness. s09-l02 names the failure before choosing a repair.</p>
<p>s09-l02 treats each handoff as a contract between maker and reader. s09-l02 supplies s09-inventory-collection; the reader checks s09-inventory-api. s09-l02 places its check where another wayfinder can repeat it. s09-l02 earns THE CARTOGRAPHER's trust through evidence, not luck. s09-l02 leaves one deliberate question for the next chart.</p>
<p>s09-l02 closes by stating what the program must preserve. s09-l02 names one input that could falsify s09-inventory-collection. s09-l02 names one output that confirms s09-inventory-api still belongs. s09-l02 runs the smallest route, inspects its trace, and annotates it. s09-l02 turns the items and inventory chart into a RuneBound waypoint.</p>
<p>s09-l02 ends with a handoff to the next chart. s09-l02 carries s09-inventory-api forward after s09-inventory-collection earns trust. s09-l02 lets THE CARTOGRAPHER record the result in plain language. s09-l02 turns a clean rerun from a guess into a fact. s09-l02 lets the next wayfinder begin without hidden context.</p>
<pre><code>print("s09-l02 // The Pack Ledger")</code></pre>
<div class="field-notes"><div class="fn-head">FIELD NOTES // S09-L02</div><p>s09-l02 <strong>Evidence.</strong> Record s09-inventory-collection; compare it with s09-inventory-api before advancing.</p><p>s09-l02 <strong>Repair.</strong> Change one cause, rerun the route, and preserve the explanation.</p></div>
'''

[[lessons.readings]]
label = "Python library // dataclasses // The Pack Ledger"
url = "https://docs.python.org/3/library/dataclasses.html"

[[lessons.exercises]]
id = "s09-l02-e1"
type = "fill"
points = 18
prompt = '''
<p>s09-l02-e1: restore the missing operation in the supplied code. Use its operands and the chart evidence to complete the route without renaming the owner.</p>
'''
code = '''
inventory.____("potion")
'''
answer = "contains"
hint = '''
Look at what must happen to inventory.contains("potion"); choose the operation that performs that job rather than the one that merely inspects the result.
'''

[[lessons.exercises]]
id = "s09-l02-e2"
type = "mc"
points = 14
prompt = '''
<p>Why should the HUD ask Inventory for its contents instead of editing the list? Select the reading that keeps quest completion can later ask about an item without knowing how the list is stored possible.</p>
'''
choices = ["the HUD can only draw immutable data","The Pack Ledger: keep s09-inventory-collection owned by the named boundary and verify the result before handoff s09-l02-e2.","a list cannot be changed outside a class","direct edits make JSON load faster"]
answer = 1
whyWrong = '''
The tempting routes confuse letting ui code mutate the list directly and losing one source of truth with the job this trial actually asks you to protect; each decoy moves ownership to the wrong part of the chart.
'''
hint = '''
Trace player.inventory.items as a deliberate collection with a small public API in the Spoils Ledger chart, then compare the Inventory owns membership while the HUD only reads a view of its contents with the evidence named in the prompt.
'''
explain = '''
The selected mark preserves inventory owns membership while the hud only reads a view of its contents and leaves player.inventory.items as a deliberate collection with a small public api available for the next RuneBound handoff.
'''

[[lessons.exercises]]
id = "s09-l02-e3"
type = "type"
points = 10
reps = 2
prompt = '''
<p>Retype this spoils ledger evidence exactly. Keep player.inventory.items as a deliberate collection with a small public api visible while you write. (Ctrl+Enter submits.)</p>
'''
code = '''
items = ["key"]
print("key" in items)
'''

[[lessons.exercises]]
id = "s09-l02-e4"
type = "write"
points = 30
prompt = '''
<p>Complete the spoils ledger route and print exactly <code>RUNEBOUND S09 L02 SEAL</code>. Preserve the named data before adding the final observation.</p>
'''
starter = '''
route_mark = "pack-ledger"
print("survey pending")
# Add the chart seal after checking the route.
'''
expect = '''
RUNEBOUND S09 L02 SEAL
'''
solution = '''
route_mark = "pack-ledger"
print("RUNEBOUND S09 L02 SEAL")
'''
hint = '''
For s09-l02-e4, leave the route data intact and add only its final s09 observation; compare the starter output with the target before submitting.
'''

[[lessons.exercises]]
id = "s09-l02-e5"
type = "text"
points = 16
prompt = '''
<p>s09-l02-e5: name the Python term for the specific unit requested by this chart. Supply the language term, not the surrounding story label.</p>
'''
answer = "list"
hint = '''
Recall the named boundary in The Pack Ledger; the answer is the language term for that single job, not the larger game feature.
'''
