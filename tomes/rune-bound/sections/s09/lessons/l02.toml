[[lessons]]
id = "s09-l02"
title = "The Pack Ledger"
teaches = ["s09-inventory-api", "s09-stat-modifier-application"]
body = '''
<p>s02 made an <code>Inventory</code> whose instance owns <code>self.items</code>. Now replace that temporary teaching version with the canonical class in <code>items.py</code>. Its list holds item ids in pickup order, not copies of <code>Item</code> objects. That makes <code>player.inventory.items</code> a simple, inspectable list for s10’s quest conditions, while the catalog remains the one owner of names and modifiers.</p>
<pre><code>class Inventory:
    def __init__(self):
        self.items = []

    def add(self, item_id):
        if item_id in self.items:
            return False
        self.items.append(item_id)
        return True

    def remove(self, item_id):
        if item_id not in self.items:
            return False
        self.items.remove(item_id)
        return True

    def contains(self, item_id):
        return item_id in self.items</code></pre>
<p>This API supplies a receipt: <code>True</code> means the collection changed; <code>False</code> means it did not. The pickup boundary will use that to avoid granting the same map item on every frame. Do not let the HUD append directly to the list, and do not turn the list into a set: pickup order is useful to display and s10 explicitly reads <code>player.inventory.items</code>.</p>
<p>Below <code>Inventory</code> in <code>items.py</code>, add the stat bridge. It changes the existing <code>StatBlock</code>, whose four fields remain <code>hp</code>, <code>max_hp</code>, <code>attack</code>, and <code>defense</code>. Only supported keys are changed; an unknown JSON key is an error worth fixing in data. HP is clamped after any maximum change.</p>
<pre><code>def apply_modifiers(stats, modifiers):
    unknown = set(modifiers) - {"hp", "max_hp", "attack", "defense"}
    if unknown:
        raise ValueError(f"unknown stat modifier: {unknown}")
    for field in ("max_hp", "attack", "defense"):
        if field in modifiers:
            setattr(stats, field, getattr(stats, field) + modifiers[field])
    if "hp" in modifiers:
        stats.hp += modifiers["hp"]
    stats.hp = max(0, min(stats.hp, stats.max_hp))</code></pre>
<p>Make a member-only patch in <code>player.py</code>: import <code>Inventory</code> from <code>items</code>, then add <code>self.inventory = Inventory()</code> inside the existing <code>Player.__init__</code>, immediately after its existing <code>self.stats = StatBlock(30, 30, 7, 2)</code>. Keep every inherited sprite setup, vector, speed, input, and collision method exactly where it is. Player owns this inventory because it belongs to this player; <code>items.py</code> owns how a pack changes.</p>
<div class="callout"><strong>THE CARTOGRAPHER'S RULE:</strong> a catalog describes an item, an Inventory records possession, and a StatBlock remains the owner of combat numbers.</div>
<div class="field-notes"><div class="fn-head">FIELD NOTES // ONE-TIME EFFECT</div><p>Call <code>apply_modifiers</code> only after <code>inventory.add(item_id)</code> returns <code>True</code>. Otherwise standing on the same potion would heal every frame. The map retirement in the next lesson makes the visual state agree with that receipt.</p></div>
'''

[[lessons.readings]]
label = "Python Docs // list methods"
url = "https://docs.python.org/3/tutorial/datastructures.html#more-on-lists"

[[lessons.exercises]]
id = "s09-l02-e1"
type = "mc"
points = 20
prompt = '''<p>After a player already carries <code>"potion"</code>, what should <code>inventory.add("potion")</code> return?</p>'''
choices = ["A second <code>Item</code> record", "<code>True</code>, because the modifier runs again", "<code>False</code>, because the collection did not change", "The current HP value"]
answer = 2
hint = '''The method’s boolean is a receipt for whether it appended an id.''' 
whyWrong = '''Creating another record would duplicate catalog ownership, and current HP is not a collection receipt. A duplicate id leaves the list unchanged, so the method reports <code>False</code>.''' 
explain = '''That false receipt is how the pickup route avoids repeating a one-time effect.''' 

[[lessons.exercises]]
id = "s09-l02-e2"
type = "type"
points = 12
reps = 2
prompt = '''<p>Retype the Player member-only addition. It belongs after the existing StatBlock assignment in <code>Player.__init__</code>.</p>'''
code = '''
self.inventory = Inventory()
'''

[[lessons.exercises]]
id = "s09-l02-e3"
type = "fill"
points = 22
prompt = '''<p>Restore the list operation that makes the new id visible through <code>player.inventory.items</code>.</p>'''
code = '''
if item_id not in self.items:
    self.items.____(item_id)
    return True
'''
answer = "append"
hint = '''The existing list stays ordered, so use its one-value-at-the-end method.''' 
whyWrong = '''<code>extend</code> would iterate through a string’s characters and <code>remove</code> deletes an existing value. The new item id needs one <code>append</code>.''' 

[[lessons.exercises]]
id = "s09-l02-e4"
type = "write"
points = 35
prompt = '''<p>Model the potion receipt in plain Python. Start at 12 of 30 HP, add <code>"potion"</code> once, apply 20 HP only when the add succeeds, and attempt the same pickup again. Print exactly <code>FIRST True HP 30</code> and <code>SECOND False HP 30</code>.</p>'''
starter = '''
items = []
hp = 12
max_hp = 30

# Add the id once, heal only on a true receipt, then try the duplicate.
'''
expect = '''
FIRST True HP 30
SECOND False HP 30
'''
solution = '''
items = []
hp = 12
max_hp = 30

first = "potion" not in items
if first:
    items.append("potion")
    hp = min(max_hp, hp + 20)
print("FIRST", first, "HP", hp)
second = "potion" not in items
print("SECOND", second, "HP", hp)
'''
hint = '''Use membership before each attempt; only the first true test appends and raises HP with <code>min(max_hp, hp + 20)</code>.''' 
