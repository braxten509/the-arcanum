[[lessons]]
id = "s09-l04"
title = "The Weight of a Relic"
teaches = ["s09-stat-modifiers","s09-inventory-display"]
body = '''
<p>s09-l04 opens the items and inventory chart through Weight. s09-l04 hears THE CARTOGRAPHER name s09-stat-modifiers its first bearing. s09-l04 names one input, one change, and one output. s09-l04 gives s09-inventory-display a second mark for comparison. s09-l04 keeps the smallest successful example beside its route.</p>
<p>s09-l04 reads from left to right, then narrates state changes. s09-l04 keeps its items and inventory clue concrete and observable. s09-l04 runs twice; the second pass challenges the first. s09-l04 records which owner moved when s09-stat-modifiers shifted. s09-l04 carries earlier <code>GameState</code> evidence into this chart.</p>
<p>s09-l04 asks one decision to stand alone in the margin. s09-l04 keeps s09-inventory-display visible instead of hiding it behind polish. s09-l04 tests a friendly case and a sharp edge case. s09-l04 compares both traces so s09-stat-modifiers has a witness. s09-l04 names the failure before choosing a repair.</p>
<p>s09-l04 treats each handoff as a contract between maker and reader. s09-l04 supplies s09-stat-modifiers; the reader checks s09-inventory-display. s09-l04 places its check where another wayfinder can repeat it. s09-l04 earns THE CARTOGRAPHER's trust through evidence, not luck. s09-l04 leaves one deliberate question for the next chart.</p>
<p>s09-l04 closes by stating what the program must preserve. s09-l04 names one input that could falsify s09-stat-modifiers. s09-l04 names one output that confirms s09-inventory-display still belongs. s09-l04 runs the smallest route, inspects its trace, and annotates it. s09-l04 turns the items and inventory chart into a RuneBound waypoint.</p>
<p>s09-l04 ends with a handoff to the next chart. s09-l04 carries s09-inventory-display forward after s09-stat-modifiers earns trust. s09-l04 lets THE CARTOGRAPHER record the result in plain language. s09-l04 turns a clean rerun from a guess into a fact. s09-l04 lets the next wayfinder begin without hidden context.</p>
<pre><code>print("s09-l04 // The Weight of a Relic")</code></pre>
<div class="field-notes"><div class="fn-head">FIELD NOTES // S09-L04</div><p>s09-l04 <strong>Evidence.</strong> Record s09-stat-modifiers; compare it with s09-inventory-display before advancing.</p><p>s09-l04 <strong>Repair.</strong> Change one cause, rerun the route, and preserve the explanation.</p></div>
'''

[[lessons.readings]]
label = "Python library // dataclasses // The Weight of a Relic"
url = "https://docs.python.org/3/library/dataclasses.html"

[[lessons.exercises]]
id = "s09-l04-e1"
type = "write"
points = 30
prompt = '''
<p>Complete the spoils ledger route and print exactly <code>RUNEBOUND S09 L04 SEAL</code>. Preserve the named data before adding the final observation.</p>
'''
starter = '''
route_mark = "relic-weight"
print("survey pending")
# Add the chart seal after checking the route.
'''
expect = '''
RUNEBOUND S09 L04 SEAL
'''
solution = '''
route_mark = "relic-weight"
print("RUNEBOUND S09 L04 SEAL")
'''
hint = '''
For s09-l04-e1, leave the route data intact and add only its final s09 observation; compare the starter output with the target before submitting.
'''

[[lessons.exercises]]
id = "s09-l04-e2"
type = "mc"
points = 14
prompt = '''
<p>What is the safest time to apply a permanent item modifier? Select the reading that keeps s10 can read inventory contents as a stable quest fact possible.</p>
'''
choices = ["whenever the inventory screen redraws","before the item exists in the catalog","only when the camera crosses a tile boundary","The Weight of a Relic: keep s09-stat-modifiers owned by the named boundary and verify the result before handoff s09-l04-e2."]
answer = 3
whyWrong = '''
The tempting routes confuse applying the same modifier every frame or showing a bonus that the combat stats never receive with the job this trial actually asks you to protect; each decoy moves ownership to the wrong part of the chart.
'''
hint = '''
Trace modifier application that updates the Player's StatBlock and a display that explains the change in the Spoils Ledger chart, then compare the the item supplies a modifier while Player or StatBlock owns the resulting value with the evidence named in the prompt.
'''
explain = '''
The selected mark preserves the item supplies a modifier while player or statblock owns the resulting value and leaves modifier application that updates the player's statblock and a display that explains the change available for the next RuneBound handoff.
'''

[[lessons.exercises]]
id = "s09-l04-e3"
type = "text"
points = 16
prompt = '''
<p>s09-l04-e3: name the Python term for the specific unit requested by this chart. Supply the language term, not the surrounding story label.</p>
'''
answer = "StatBlock"
hint = '''
Recall the named boundary in The Weight of a Relic; the answer is the language term for that single job, not the larger game feature.
'''

[[lessons.exercises]]
id = "s09-l04-e4"
type = "fill"
points = 18
prompt = '''
<p>s09-l04-e4: restore the missing operation in the supplied code. Use its operands and the chart evidence to complete the route without renaming the owner.</p>
'''
code = '''
item.____("attack")
'''
answer = "remove"
hint = '''
Look at what must happen to player.stats.hp += item.modifiers.get("hp", 0); choose the operation that performs that job rather than the one that merely inspects the result.
'''
