[[lessons]]
id = "s09-l01"
title = "The Item Record"
teaches = ["s09-item-record", "s09-json-item-catalog"]
body = '''
<p>Combat already gives each actor a <code>StatBlock</code>; this chart gives a found thing a durable description. Do not add a new <code>Item</code> class to <code>player.py</code>. Create the new canonical owner, <code>items.py</code>. An <code>Item</code> records an id, a player-facing name, a description, the map tile that represents the pickup, and a dictionary of numeric stat modifiers. The id is the stable machine name. The name is what the inventory panel shows. Keeping those separate lets a later quest ask for <code>"shadow_key"</code> without depending on capitalization in prose.</p>
<pre><code>from dataclasses import dataclass
import json

@dataclass
class Item:
    item_id: str
    name: str
    description: str
    pickup_tile: str
    modifiers: dict[str, int]

def load_items(filename):
    with open(filename, encoding="utf-8") as source:
        raw_items = json.load(source)
    return {
        item_id: Item(item_id=item_id, **values)
        for item_id, values in raw_items.items()
    }</code></pre>
<p>Make <code>data/items.json</code> the sole catalog. It replaces the phase-plan placeholder <code>{"name": "Potion", "heal": 10}</code>; do not leave that inline dictionary in <code>main.py</code>, <code>player.py</code>, or a test. Start with a visible potion tile and a future quest item:</p>
<pre><code>{
  "potion": {
    "name": "Potion", "description": "A warm draught from the old road.",
    "pickup_tile": "potion", "modifiers": {"hp": 20}
  },
  "shadow_key": {
    "name": "Shadow Key", "description": "Cold iron marked with a crescent.",
    "pickup_tile": "shadow_key", "modifiers": {}
  }
}</code></pre>
<p>Patch <code>data/tiles.json</code>, not the map loader, with lower-case <code>potion</code> and <code>shadow_key</code> definitions. Each needs a readable RGB color and <code>"solid": false</code>, so the Player can stand on it. Then replace chosen cells in the existing <code>data/maps/overworld.csv</code> with those ids. CSV remains the one map layout source; item JSON says what a pickup means. That distinction is the same dictionary lookup s02 taught: <code>items[item_id]</code> chooses one authored record.</p>
<div class="callout"><strong>THE CARTOGRAPHER'S RULE:</strong> terrain identifies where a thing lies; the item catalog identifies what it is.</div>
<div class="field-notes"><div class="fn-head">FIELD NOTES // DATA RECOVERY</div><p>If <code>load_items("data/items.json")</code> raises <code>FileNotFoundError</code>, launch <code>python3 main.py</code> from the RuneBound project folder, the same working-directory rule used for maps and sprite assets. If JSON parsing fails, fix the comma or quotation in the data file; do not conceal it with a second inline catalog.</p></div>
'''

[[lessons.readings]]
label = "Python Docs // dataclasses"
url = "https://docs.python.org/3/library/dataclasses.html"

[[lessons.readings]]
label = "Python Docs // json.load"
url = "https://docs.python.org/3/library/json.html#json.load"

[[lessons.exercises]]
id = "s09-l01-e1"
type = "type"
points = 12
reps = 2
prompt = '''<p>Retype the constructor call that preserves the JSON key as the stable item id.</p>'''
code = '''
item = Item(item_id="shadow_key", name="Shadow Key", description="Cold iron.", pickup_tile="shadow_key", modifiers={})
'''

[[lessons.exercises]]
id = "s09-l01-e2"
type = "fill"
points = 22
prompt = '''<p>Restore the module that turns the opened item-data stream into Python dictionaries.</p>'''
code = '''
with open("data/items.json", encoding="utf-8") as source:
    raw_items = json.____(source)
'''
answer = "load"
hint = '''The function receives an already-open file object; <code>loads</code> would instead receive JSON text.''' 
whyWrong = '''<code>dump</code> writes Python data as JSON, while <code>loads</code> parses a string. The open source file needs <code>json.load</code>.'''

[[lessons.exercises]]
id = "s09-l01-e3"
type = "mc"
points = 20
prompt = '''<p>Which file should become the sole definition of Potion’s pickup tile and modifier?</p>'''
choices = ["<code>data/items.json</code>", "The event loop in <code>main.py</code>", "<code>data/maps/overworld.csv</code>", "The Player constructor"]
answer = 0
hint = '''One file describes item meaning; the CSV only places lower-case tile ids.''' 
whyWrong = '''The map places a tile but cannot describe its name or modifiers, and Player and the event loop are runtime owners. The JSON catalog is the authored source for an item record.''' 
explain = '''Loading one catalog lets new items arrive as data rather than branches scattered through the program.''' 

[[lessons.exercises]]
id = "s09-l01-e4"
type = "write"
points = 34
prompt = '''<p>Build a tiny catalog record for the Shadow Key. Use the literal id <code>"shadow_key"</code>, an empty modifier dictionary, and print exactly <code>KEY shadow_key Shadow Key</code>. This is a one-file data-model proof; RuneBound itself reads the catalog from JSON.</p>'''
starter = '''
from dataclasses import dataclass

@dataclass
class Item:
    item_id: str
    name: str
    modifiers: dict

# Construct the Shadow Key record and report its id and display name.
'''
expect = '''
KEY shadow_key Shadow Key
'''
solution = '''
from dataclasses import dataclass

@dataclass
class Item:
    item_id: str
    name: str
    modifiers: dict

item = Item("shadow_key", "Shadow Key", {})
print("KEY", item.item_id, item.name)
'''
hint = '''Instantiate <code>Item</code> with the three declared fields, then print <code>item.item_id</code> before <code>item.name</code>.''' 
