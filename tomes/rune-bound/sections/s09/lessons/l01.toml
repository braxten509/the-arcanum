choices = ["the current frame's event queue","the camera's world-to-screen subtraction","the complete combat turn history","The Item Record: keep s09-item-data owned by the named boundary and verify the result before handoff s09-l01-e1."]
answer = 3
whyWrong = '''
The tempting routes confuse creating a special case for every item and making a new key require engine edits with the job this trial actually asks you to protect; each decoy moves ownership to the wrong part of the chart.
'''
