[[lessons]]
id = "s09-l01"
title = "The Item Record"
teaches = ["s09-item-data","s09-item-catalog"]
body = '''
<p>s09-l01 opens the items and inventory chart through Item. s09-l01 hears THE CARTOGRAPHER name s09-item-data its first bearing. s09-l01 names one input, one change, and one output. s09-l01 gives s09-item-catalog a second mark for comparison. s09-l01 keeps the smallest successful example beside its route.</p>
<p>s09-l01 reads from left to right, then narrates state changes. s09-l01 keeps its items and inventory clue concrete and observable. s09-l01 runs twice; the second pass challenges the first. s09-l01 records which owner moved when s09-item-data shifted. s09-l01 carries earlier <code>GameState</code> evidence into this chart.</p>
<p>s09-l01 asks one decision to stand alone in the margin. s09-l01 keeps s09-item-catalog visible instead of hiding it behind polish. s09-l01 tests a friendly case and a sharp edge case. s09-l01 compares both traces so s09-item-data has a witness. s09-l01 names the failure before choosing a repair.</p>
<p>s09-l01 treats each handoff as a contract between maker and reader. s09-l01 supplies s09-item-data; the reader checks s09-item-catalog. s09-l01 places its check where another wayfinder can repeat it. s09-l01 earns THE CARTOGRAPHER's trust through evidence, not luck. s09-l01 leaves one deliberate question for the next chart.</p>
<p>s09-l01 closes by stating what the program must preserve. s09-l01 names one input that could falsify s09-item-data. s09-l01 names one output that confirms s09-item-catalog still belongs. s09-l01 runs the smallest route, inspects its trace, and annotates it. s09-l01 turns the items and inventory chart into a RuneBound waypoint.</p>
<p>s09-l01 ends with a handoff to the next chart. s09-l01 carries s09-item-catalog forward after s09-item-data earns trust. s09-l01 lets THE CARTOGRAPHER record the result in plain language. s09-l01 turns a clean rerun from a guess into a fact. s09-l01 lets the next wayfinder begin without hidden context.</p>
<pre><code>print("s09-l01 // The Item Record")</code></pre>
<div class="field-notes"><div class="fn-head">FIELD NOTES // S09-L01</div><p>s09-l01 <strong>Evidence.</strong> Record s09-item-data; compare it with s09-item-catalog before advancing.</p><p>s09-l01 <strong>Repair.</strong> Change one cause, rerun the route, and preserve the explanation.</p></div>
'''

[[lessons.readings]]
label = "Python library // dataclasses // The Item Record"
url = "https://docs.python.org/3/library/dataclasses.html"

[[lessons.readings]]
label = "Python tutorial // dictionaries // The Item Record"
url = "https://docs.python.org/3/tutorial/datastructures.html"

