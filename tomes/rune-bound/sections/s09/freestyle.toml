[freestyle]
title = "THE WORKING 9 // Spoils of the Tiles"
brief = '''
<p>Bind spoils of the tiles into the growing RuneBound route. The commission must leave a runnable artifact whose behavior can be inspected from the named evidence.</p><ul><li>preserve the chart's data boundary and use the established names</li><li>prove the requested behavior with a repeatable run that ends at <code>RUNEBOUND S09 SEAL</code></li><li>write a short repair note explaining the nearest failure and the change that corrected it</li></ul>
'''
requires = ["s09-item-data","s09-item-catalog","s09-inventory-collection","s09-inventory-api","s09-pickup-detection","s09-pickup-feedback","s09-stat-modifiers","s09-inventory-display"]
reward = 252
xray = '''
The Cartographer checks whether the spoils ledger commission keeps item name, description, pickup tile, and stat modifiers in one inspectable definition under the right owner, shows s10 can read inventory contents as a stable quest fact, and leaves evidence beyond a decorative printout.
'''

[freestyle.badge]
id = "badge-s09"
name = "SPOILS LEDGER SEALED"
desc = "Sealed the spoils of the tiles chart with evidence another wayfinder can inspect."

[[freestyle.rubric]]
criterion = "Spoils Ledger runs"
weight = 25
desc = '''
The spoils of the tiles artifact parses and runs with the chart's named behavior visible.
'''

[[freestyle.rubric]]
criterion = "Spoils Ledger keeps its boundary"
weight = 35
desc = '''
The commission keeps item name, description, pickup tile, and stat modifiers in one inspectable definition and s10 can read inventory contents as a stable quest fact in the owners established by the lessons.
'''

[[freestyle.rubric]]
criterion = "Spoils Ledger shows proof"
weight = 25
desc = '''
The wayfinder supplies a repeatable observation, the exact s09 seal, and a useful comparison case rather than a one-time claim.
'''

[[freestyle.rubric]]
criterion = "Cartographer's repair note"
weight = 15
desc = '''
The explanation names the failing boundary, the evidence that exposed it, and the smallest correction that restored the route.
'''

