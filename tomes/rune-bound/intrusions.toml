# HEX DEFENSE — rival cartographers hurl a hex across the leyline while you study;
# you cast the exact counter (print the true value) before the sandglass empties.
# The engine reads ONLY the `tiers` key: each [[tiers]] gates on `min` sections passed
# and picks one challenge from its [[tiers.pool]] at random. Pure-Python stdout only —
# no PyGame here; a hex tests whether the wayfinder can still read the numbers cold.

# ---- tier 1 — min 1: first ink. variables, arithmetic, strings, lists, f-strings.
[[tiers]]
min = 1
time = 90
bounty = 50

[[tiers.pool]]
t = "THE OFFSET MARK"
brief = "A rival smears a tile's true column. Recompute it. Print EXACTLY: «COL 7»."
starter = '''origin = 3
step = 4
# print exactly:  COL <origin + step>   (compute it, don't hardcode)
'''
expect = "COL 7"
solution = '''origin = 3
step = 4
print(f"COL {origin + step}")
'''

[[tiers.pool]]
t = "THE SURVEYED SPAN"
brief = "The hex hides a road's length between two survey stakes. Total it. Print EXACTLY: «SPAN 26»."
starter = '''legs = [8, 5, 13]
# print exactly:  SPAN <sum of legs>   (compute it, don't hardcode)
'''
expect = "SPAN 26"
solution = '''legs = [8, 5, 13]
print(f"SPAN {sum(legs)}")
'''

[[tiers.pool]]
t = "THE CHART NAME"
brief = "A rival scrambles the map's true name. Bind the two halves. Print EXACTLY: «MAP Runebound»."
starter = '''head = "Rune"
tail = "bound"
# print exactly:  MAP <head joined to tail>
'''
expect = "MAP Runebound"
solution = '''head = "Rune"
tail = "bound"
print(f"MAP {head + tail}")
'''

[[tiers.pool]]
t = "THE MARKER COUNT"
brief = "Count the waypoints the wayfinder has planted. Print EXACTLY: «MARKS 4»."
starter = '''waypoints = ["spawn", "well", "gate", "shrine"]
# print exactly:  MARKS <how many waypoints>   (compute it, don't hardcode)
'''
expect = "MARKS 4"
solution = '''waypoints = ["spawn", "well", "gate", "shrine"]
print(f"MARKS {len(waypoints)}")
'''

[[tiers.pool]]
t = "THE PLOTTED FIELD"
brief = "A rival blurs the map's area. Multiply its width by its height. Print EXACTLY: «AREA 300»."
starter = '''cols = 25
rows = 12
# print exactly:  AREA <cols times rows>   (compute it, don't hardcode)
'''
expect = "AREA 300"
solution = '''cols = 25
rows = 12
print(f"AREA {cols * rows}")
'''

