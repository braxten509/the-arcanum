id = "s01"
codename = "CHAPTER I // TOOLS, DATA, AND A FIRST EXECUTABLE"
short = "Tools, Data, and a First Executable"
title = "Tools, Data, and a First Executable"
build = "install and verify tools before source. Five separate low-density lessons, each with guided practice, teach in order: tool/editor use; NASM file structure and data; register/integer operations; exported `main` and C-runtime return status; Make. Working creates source, Makefile, object, and executable."
brief = '''<p>Mara will not open the court until the workshop answers. Install and verify the Linux toolchain, learn how NASM lays out data and how registers carry integer scores, export a C-runtime <code>main</code> that returns a visible status, then wire a Make pipeline. The Working is where you author <code>src/pong.asm</code>, the <code>Makefile</code>, the object file, and the first executable—no starter implementation is handed to you.</p>'''

[proof]
mode = "guided"
expectedFiles = ["src/pong.asm", "Makefile"]
guidedChecks = [
  "From the project root after install diagnostics, make (or make build) creates build/register-rally-pong.o via nasm -f elf64 and build/register-rally-pong via cc linked with pkg-config SDL2 libraries.",
  "make check runs the learner-authored binary and exits zero using main's process status path without opening an SDL window.",
]
mechanisms = [
  "terminal-create-project-directories",
  "nasm-section-directive",
  "nasm-global-extern-directives",
  "nasm-data-reserve-directives",
  "nasm-label-addressing",
  "nasm-static-string-layout",
  "x64-general-registers",
  "nasm-mov-instruction",
  "nasm-integer-add-sub",
  "nasm-xor-zeroing",
  "c-main-entry-symbol",
  "c-main-return-status",
  "nasm-ret-instruction",
  "make-target-prerequisite-recipe",
  "make-variable-expansion",
  "nasm-elf64-object-command",
  "cc-sdl2-link-command",
  "make-build-check-run-targets",
]
