mechanisms = ["nasm-static-string-layout", "nasm-data-reserve-directives"]
prompt = "Complete the disposable static string so it is zero-terminated."
code = "beacon_msg db \"pad-ok\", ____"
answer = "0"
hint = "The terminator is a numeric zero byte."

[[lessons.exercises]]
id = "s01-l02-e3"
type = "mc"
required = true
capabilities = ["language-static-data-strings-addressing"]
cognitiveTask = "predict"
scaffold = "guided"
contextFamily = "beacon-symbols"
aidPolicy = "learning"
points = 16
mechanisms = ["nasm-global-extern-directives"]
prompt = "You need other object files to call your label `beacon_mark`. Which directive exports it?"
choices = [
  "extern beacon_mark",
  "global beacon_mark",
  "section beacon_mark",
  "db beacon_mark",
]
answer = 1
whyWrong = "extern imports a name defined elsewhere; section and db do not export symbols."
hint = "Export uses the directive named global."
explain = "global advertises the symbol to the linker."

[[lessons.exercises]]
id = "s01-l02-e4"
type = "text"
required = true
capabilities = ["language-static-data-strings-addressing"]
cognitiveTask = "recall"
scaffold = "guided"
contextFamily = "beacon-reserve"
aidPolicy = "learning"
points = 16
mechanisms = ["nasm-data-reserve-directives"]
prompt = "Which NASM directive form defines initialized byte data (as used for characters in the beacon string)?"
answer = "db"
accept = ["DB", "define byte"]
hint = "Two letters: define byte."

[[lessons.exercises]]
id = "s01-l02-e5"
type = "mc"
required = true
capabilities = ["language-static-data-strings-addressing"]
cognitiveTask = "explain"
scaffold = "guided"
contextFamily = "beacon-label"
aidPolicy = "learning"
points = 16
mechanisms = ["nasm-label-addressing"]
prompt = "In `beacon_msg db \"pad-ok\", 0`, what does the name `beacon_msg` represent?"
choices = [
  "The runtime length of the string only",
  "A CPU register that holds the letters",
  "A Make variable expanded at assemble time",
  "The address of the first byte of that data",
]
answer = 3
whyWrong = "The label names a location. It is not automatically the length, a register, or a Make variable."
hint = "Labels mark locations in the object."
explain = "References to beacon_msg mean that address."

