[[lessons]]
id = "s01-l04"
title = "Return a Visible Verdict"
teaches = ["c-main-status-contract"]
introduces = [
  "c-main-entry-symbol",
  "c-main-return-status",
  "nasm-ret-instruction",
]
body = '''
<p>When you link with the C runtime, the process does not start at a random label. It starts at an exported symbol named <code>main</code>. Your job in this disposable sketch is to provide that symbol, set a status, and return to the runtime.</p>
<pre><code data-kind="runnable">section .text
global main

main:
    mov eax, 0
    ret
</code></pre>
<p>Read the parts in order. <code>section .text</code> holds instructions. <code>global main</code> exports the entry name the C runtime looks up. The label <code>main:</code> marks the first instruction of that function. Without <code>global main</code>, the linker often reports an undefined reference to <code>main</code> even if a local label exists.</p>
<p>Process status on this ABI is returned in <code>eax</code> (the 32-bit view of <code>rax</code>). Zero conventionally means success for shell tools; non-zero means failure. Setting the verdict is ordinary register work you already practiced:</p>
<pre><code data-kind="runnable">main:
    mov eax, 7
    ret
</code></pre>
<p>After this program exits, a shell can show the status with <code>echo $?</code> on many systems—observing <code>7</code> proves the path from <code>mov</code> through return. For a success path, zero the status deliberately:</p>
<pre><code data-kind="runnable">main:
    xor eax, eax
    ret
</code></pre>
<p>The <code>ret</code> instruction returns to the caller. Here the caller is the C runtime startup, which turns <code>eax</code> into the process exit status and ends the program. Forgetting <code>ret</code> lets execution fall into whatever bytes follow—undefined behavior, not a clean verdict.</p>
<p>Mara cares about this contract because later <code>make check</code> targets will run your binary and treat a non-zero status as a failed light on the scoreboard. The arithmetic you leave in registers only matters if the final status in <code>eax</code> is intentional.</p>
<p>A slightly longer disposable path still ends the same way:</p>
<pre><code data-kind="runnable">main:
    mov eax, 1
    add eax, 2
    sub eax, 3
    xor eax, eax
    ret
</code></pre>
<p>The arithmetic is only practice; the visible contract is: export <code>main</code>, leave the intended status in <code>eax</code>, execute <code>ret</code>. Later chapters keep this process-status idea when checks pass or fail without opening a window.</p>
<div class="callout"><p>This lesson still uses disposable fragments. The Working is where <code>src/pong.asm</code> becomes the real exported <code>main</code>.</p></div>
<div class="field-notes"><div class="fn-head">FIELD NOTES // STATUS IS EVIDENCE</div>
<p>Mara treats exit status as a scoreboard light. A check target that runs your binary and expects zero is only meaningful if <code>main</code> actually sets <code>eax</code> and returns.</p></div>
'''

[[lessons.concepts]]
id = "c-main-status-contract"
purpose = "Export main, place a process status in eax, and return to the C runtime."
anatomy = "global main, label main, set eax to the status, then ret."
example = "The success xor eax,eax / ret sketch and the status 7 sketch."
observable = "The process exit code matches the value left in eax."
failure = "Missing global main fails link; missing ret fails to return a clean status."
practice = "s01-l04-e1"

[[lessons.concepts]]
id = "c-main-entry-symbol"
purpose = "Provide the exported main symbol the C runtime calls."
anatomy = "Declare global main and define the main label in .text."
example = "global main and main: in the first code block."
observable = "The linker finds main and produces an executable."
failure = "A non-global main label yields undefined reference to main."
practice = "s01-l04-e2"

[[lessons.concepts]]
id = "c-main-return-status"
purpose = "Communicate process success or failure through eax at return."
anatomy = "mov or xor into eax with the intended status before ret."
example = "mov eax, 7 and xor eax, eax examples."
observable = "The shell exit status matches eax."
failure = "Leaving a garbage value in eax makes checks flake."
practice = "s01-l04-e3"

[[lessons.concepts]]
id = "nasm-ret-instruction"
purpose = "Return control to the caller."
anatomy = "Write ret at the end of the function path."
example = "ret after setting eax in every sketch."
observable = "The process ends through the runtime instead of falling through."
failure = "Omitting ret continues into following memory."
practice = "s01-l04-e4"

[[lessons.readings]]
label = "System V AMD64 ABI — function return values overview"
url = "https://gitlab.com/x86-psABIs/x86-64-ABI"

[[lessons.exercises]]
id = "s01-l04-e1"
type = "mc"
required = true
capabilities = ["language-status-results-cleanup-failure"]
cognitiveTask = "explain"
scaffold = "guided"
contextFamily = "main-contract"
aidPolicy = "learning"
points = 18
mechanisms = ["c-main-entry-symbol", "c-main-return-status", "nasm-ret-instruction"]
prompt = "Which sequence matches the C-runtime main status contract taught here?"
choices = [
  "extern main only; never define it",
  "global main; main sets eax to the status; ret",
  "Jump to _start and ignore eax forever",
  "Print the status with db only and never ret",
]
answer = 1
whyWrong = "extern main does not define the entry. Skipping eax/ret breaks the status contract."
hint = "Export, set eax, return."
explain = "The runtime calls main and reads eax after return."

