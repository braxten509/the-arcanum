[[freestyle.referenceSteps]]
id = "s01-write-makefile"
path = "Makefile"
mode = "write"
mechanisms = [
  "make-target-prerequisite-recipe",
  "make-variable-expansion",
  "nasm-elf64-object-command",
  "cc-sdl2-link-command",
  "make-build-check-run-targets",
  "s01-working-outcome-choices",
  "s01-working-constraints-commands",
  "s01-working-diagnostics-acceptance",
  "terminal-install-toolchain-packages",
  "terminal-check-nasm-version",
  "terminal-check-make-version",
  "terminal-check-cc-version",
  "pkg-config-check-sdl2",
]
instruction = "Private replay writes the learner-owned Make pipeline for assemble, SDL2 link, check, and run."
content = '''
ASM ?= nasm
CC ?= cc
OBJDIR := build
SRC := src/pong.asm
OBJ := $(OBJDIR)/register-rally-pong.o
BIN := $(OBJDIR)/register-rally-pong
SDL_LIBS := $(shell pkg-config --libs sdl2)

.PHONY: all build check run clean

all: build

build: $(BIN)

$(OBJ): $(SRC)
	mkdir -p $(OBJDIR)
	$(ASM) -f elf64 -o $@ $<

$(BIN): $(OBJ)
	$(CC) -no-pie -o $@ $^ $(SDL_LIBS)

check: $(BIN)
	./$(BIN)

run: $(BIN)
	./$(BIN)

clean:
	rm -f $(OBJ) $(BIN)
'''

