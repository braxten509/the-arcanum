xray = "Mara checks real version diagnostics before source, learner-authored paths only, ELF64 main that returns status through eax/ret, Make recipes that assemble then link with pkg-config SDL2 libs, and make check exiting zero. She docks pasted lesson labels renamed into the project, missing object/bin paths, and a check that never runs the binary."

