instruction = "Private replay replaces the blank entry scaffold with the s01 foundation source."
content = '''
section .data
    rally_tag db "register-rally-s01", 0

section .text
    global main

main:
    mov eax, 1
    add eax, 2
    sub eax, 3
    xor eax, eax
    ret
'''

