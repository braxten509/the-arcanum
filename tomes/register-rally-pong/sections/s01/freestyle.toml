[freestyle]
title = "THE WORKING: Raise the First Executable"
brief = '''
<p><strong>Outcome:</strong> From an empty project root, install and verify the declared Linux toolchain, then author the first Register Rally artifacts so <code>make</code> produces <code>build/register-rally-pong.o</code> and <code>build/register-rally-pong</code>, and <code>make check</code> exits zero.</p>
<p><strong>Your choices:</strong> label names inside the source, Make variable names, and how you split targets—so long as the named paths and observable checks hold.</p>
<ul>
<li>Install on clean Debian/Ubuntu x86-64: NASM, build-essential, Make, pkg-config, and libsdl2-dev. Record <code>nasm -v</code>, <code>make --version</code>, <code>cc --version</code>, and <code>pkg-config --modversion sdl2</code> before writing source.</li>
<li>Create project directories you need (at least a place for source and a place for build products).</li>
<li>Author <code>src/pong.asm</code>: NASM sections, at least one static zero-terminated string under a label, an exported <code>main</code> for the C runtime, integer register work (including a zeroed status path), and <code>ret</code> so process status is visible.</li>
<li>Author a root <code>Makefile</code> with variables, tabbed recipes, a NASM ELF64 assemble step into <code>build/register-rally-pong.o</code>, a link step that pulls SDL2 flags from <code>pkg-config</code> into <code>build/register-rally-pong</code>, plus <code>build</code>, <code>check</code>, and <code>run</code> targets.</li>
<li><strong>Commands:</strong> version diagnostics, then <code>make</code> / <code>make build</code>, <code>make check</code>, and <code>make run</code> from the project root.</li>
<li><strong>Diagnostics:</strong> separate assembly errors, link/undefined-symbol errors, missing SDL2 <code>pkg-config</code> results, and a non-zero process status from <code>main</code>.</li>
<li><strong>Acceptance:</strong> <code>src/pong.asm</code> and <code>Makefile</code> exist; <code>build/register-rally-pong.o</code> and <code>build/register-rally-pong</code> exist after build; <code>make check</code> exits zero. Do not open an SDL window yet—later chapters own graphics.</li>
</ul>
'''
