# ARCANUM tome manifest — scaffolded by tools/new_tome.py.
# Replace every TODO, then run:  python3 tools/validate_tome.py tomes/untitled-7
# Read tome-authoring/2-tome-toml.md before filling this in — every key here is documented there.

[meta]
id = "register-rally-pong"                       # MUST equal the folder name
name = "Register Rally: Pong in x86-64 Assembly"
description = "Build, test, play, and package a two-player Pong game in NASM x86-64 assembly with SDL2 on Linux."
author = "The Arcanum"
version = "0.1.0"
favicon = "RR"

[runtime]
name = "nasm-make-sdl2"                # a global-configs/runtimes/<name>.toml id
project = "RegisterRallyPong"
language = "NASM x86-64 Assembly"
starterCode = ""                   # learner authors the canonical entry file
scaffoldCommand = []               # learner assembles project structure/configuration
entryFile = "src/pong.asm"
projectFile = "Makefile"
editorLang = "nasm"
newFileExt = ".asm"
externalWorkspace = true
validationDependencies = []
# packages = false                 # true only for dotnet/NuGet tomes
# externalWorkspace = true         # ONLY for courses whose real work lives in the player's
                                   # own external tools; the player chooses its location.

[content]
sections = ["s01", "s02", "s03", "s04", "s05", "s06", "s07", "s08"]  # ordered section ids; each maps to sections/<id>/
capabilityLedger = true             # keep this: lessons declare `teaches`, capstones
                                    # declare cumulative `requires`; validator proves order
proofVersion = 1                    # future-tome contract: replay learner edits + run milestones
# OPTIONAL duel bank → generated/attacks.toml (the engine default). Do NOT hand-write it:
# author attacks_src.toml, then run  python3 tools/gen_attacks.py untitled-7

[mastery]
evidenceVersion = 1                # central, language-neutral evidence policy
level = 1                 # sealed Phase-0 Finish selection; never lower per tome

[acceptance]
version = 1
mode = "run"                       # run; guided only for inherently unautomatable external work
artifact = "package"               # runtime | package
runArgs = ["--acceptance"]
scenarios = ["clean-toolchain", "clean-build", "assembly-foundation-check", "safe-sdl-lifecycle", "court-frame", "deterministic-motion", "two-player-control", "score-round-match-restart", "clean-quit-and-relaunch-reset", "six-variant-speed-cleanup-rationale", "packaged-replay"]
controls = ["input", "clock", "frame-limit"]

[defaults]
theme = "signature"                # a [[themes]] id below (this tome's own default look)

[defaults.ai]
oracle = "llama3.1:8b"
grader = "qwen2.5:14b"
graderKind = "claude-cli"
graderModel = "claude-opus-4-8"

[economy]
# TODO: rebalance once your exercise/freestyle points are set (see § [economy]).
