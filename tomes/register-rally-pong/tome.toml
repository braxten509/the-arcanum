hintCost = 50
oracleCost = 10
attemptMultipliers = [1, 0.6, 0.3]
comboStep = 0.05
comboCap = 0.5
sRankMultiplier = 1.5
attackStakePerDiff = 20
attackWinPerDiff = 15

[narrative]
objective = "Build and deliver Register Rally, a learner-authored two-player Pong game in NASM x86-64 assembly with deterministic checks and a replayable Linux package."
title = "ARCANUM // REGISTER RALLY"
logo = "REGISTER RALLY"
opsLabel = "CIRCUITS"
graderPersona = "MARA // SCOREKEEPER"
studentTerm = "arcade apprentice"
currency = "rally marks"
currencyShort = "rm"
gradeScale = "S|A|B|C|D|F"
bootLines = [
  "Cabinet powered. Court dark. Toolchain channel open.",
  "I am Mara, scorekeeper for every branch, bounce, and release.",
  "Eight circuits stand between an empty folder and a traveling Pong match.",
  "You will author the source, Makefile, checks, documentation, and package yourself.",
  "Registers become coordinates; labels become decisions; procedures keep the rally ordered.",
  "SDL2 supplies the window, but your assembly owns the state and every failure path.",
  "Live controls prove playability; fixed inputs and ticks prove repeatability.",
  "A clean score is observed evidence, not a lucky frame.",
  "The final archive must survive extraction beyond the practice court.",
  "Take the serve, arcade apprentice. Build what the scoreboard can verify.",
]
gradingLines = [
  "Mara traces the current state from input to rendered court...",
  "Register values and memory fields are compared with the claimed invariant...",
  "Branches, calls, and stack alignment are checked at their first boundary...",
  "Acquired SDL resources are counted against every release path...",
  "Fixed ticks and input records are replayed against the observed score...",
  "The six speed-and-cleanup variants are weighed beside the rationale...",
  "Source behavior and extracted-package behavior face the same scoreboard...",
]
completeText = "MATCH SEALED // Register Rally builds, plays, checks, extracts, and relaunches from its learner-authored package. The court is yours, arcade apprentice."

