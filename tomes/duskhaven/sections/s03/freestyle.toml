[freestyle]
title = "BUILD: The Duskhaven Gate Watch"
brief = '''<p>The gate ledger can speak; now teach it vigilance, apprentice. Extend the same external <code>duskhaven/main.py</code>. Keep its existing <code>import pygame</code>, Forge I proof lines, oil calculation, keeper prompt, and keeper report—do not make a second file or erase earlier work.</p><ul><li>After the keeper report, ask exactly <code>Gate status (open/closed): </code> and store the typed text in <code>gate_status</code>.</li><li>Use <code>if</code>/<code>elif</code>/<code>else</code> with <code>==</code>: <code>open</code> prints <code>Gate is open, &lt;keeper&gt;.</code>; <code>closed</code> prints <code>Gate is closed, &lt;keeper&gt;.</code>; every other response prints <code>Gate status unknown, &lt;keeper&gt;.</code>.</li><li>Use a <code>while</code> loop and a numeric <code>watch_number</code> to print exactly <code>Watch round 1</code>, <code>Watch round 2</code>, and <code>Watch round 3</code>, in order.</li><li>Use a separate <code>for</code> loop with <code>range(2)</code> to print exactly <code>Ward mark 0</code> and <code>Ward mark 1</code>.</li><li>Save <code>main.py</code>, run it in the VS Code terminal, and prove one known path and one unknown-status path. For keeper Mira and <code>open</code>, the branch line must be <code>Gate is open, Mira.</code>.</li></ul>'''
requires = ["pygame-import-check", "python-input-store", "python-fstring-output", "python-comparison-result", "python-if-branch", "python-elif-else-branch", "python-while-counter-loop", "python-for-range-loop", "tool-edit-save", "tool-run-test", "traceback-locate"]
reward = 240
xray = "I dock embers when an apprentice hardcodes an open reply, compares with =, lets the watch counter stand still, or claims range(2) makes marks 1 and 2. I reward a single readable main.py: each branch owns its message, loop bodies use four spaces, and terminal proof includes an unfamiliar status rather than only the comfortable open route."

[freestyle.badge]
id = "badge-s03"
name = "GATEWATCH"
desc = "Set the first repeating watch over Duskhaven's living gate."

[[freestyle.rubric]]
criterion = "Preserved Runnable Chronicle"
weight = 15
desc = "The external main.py keeps import pygame, the Forge I proof lines, the earlier oil calculation, keeper input, and formatted keeper report; it saves and runs normally from the project terminal."

[[freestyle.rubric]]
criterion = "Status Choice"
weight = 30
desc = "gate_status receives the exact stated prompt, and if/elif/else with == produces the required open, closed, and unknown f-string messages using keeper_name rather than a hardcoded name."

[[freestyle.rubric]]
criterion = "Three-Round Watch"
weight = 25
desc = "A while loop with a changing numeric watch_number prints Watch round 1 through Watch round 3 exactly once and terminates."

[[freestyle.rubric]]
criterion = "Ward Mark Range"
weight = 15
desc = "A separate for loop over range(2) prints Ward mark 0 and Ward mark 1 exactly once each."

[[freestyle.rubric]]
criterion = "Worldwright's Python Craft"
weight = 15
desc = "main.py keeps imports at the top; uses descriptive lowercase snake_case names; places one space around comparison and assignment operators; and indents every branch and loop body with four spaces, never tabs."
