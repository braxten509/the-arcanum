brief = '''<p>A world that only recites one answer is a painted backdrop, apprentice. This forge teaches Duskhaven to notice: a gate may be open or closed, an unfamiliar report needs a careful reply, and a watch makes more than one round. You will extend the one real <code>main.py</code> from the earlier forges with comparisons, branches, and counted repetition.</p><p>These are terminal drills in the external <code>duskhaven</code> workspace, not a pretend game loop. The final RPG will receive keyboard events through PyGame; terminal input simply gives us clear evidence that a program can choose and repeat. Save, run <code>python main.py</code>, and let the transcript show which path the loom took.</p><div class="callout">A condition is a question with a true-or-false answer. A loop is a deliberate return to the same small task. Name both plainly, or the thread will tangle when the game grows.</div>'''
