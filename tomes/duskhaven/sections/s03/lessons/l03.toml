[[lessons]]
id = "s03-l03"
title = "Keep The Lantern Rounds"
teaches = ["python-while-condition", "python-while-counter-loop", "python-counter-update"]
body = '''
<p>A watch is not one glance. A <strong>while loop</strong> repeats its indented body while its condition is true. For a known number of rounds, give it a counter: a numeric variable that begins at a clear value, is tested in the header, and changes inside the body. Forgetting the change creates the classic endless watch: Python keeps finding the same true condition.</p>
<p>Leave the three-path gate decision in canonical <code>main.py</code>. Add these lines after its final <code>else</code> print block, with no indentation before <code>watch_number</code>. This is a member-only addition. <code>&lt;=</code> means “less than or equal to,” and <code>+= 1</code> adds one to the current value.</p>
<pre><code>watch_number = 1

while watch_number &lt;= 3:
    print(f"Watch round {watch_number}")
    watch_number += 1</code></pre>
<p>Run after any gate response. The transcript adds rounds 1, 2, and 3. At the end of the third pass, the counter becomes 4; <code>4 &lt;= 3</code> is false, so Python leaves the loop. The false check is the exit, not a failure.</p>
<p>Keep the update aligned with the print, both four spaces inside the loop. If it sits outside, the counter stays 1 during every pass. Starting at 0 would print a zero label; that is useful for an index later, but this human-facing watch intentionally begins at 1. The terminal exposes off-by-one choices before they become game bugs.</p>
<div class="callout">For a counted while loop, point to start value, condition, and update before running. Missing one makes the watch lie or never end.</div>
<div class="field-notes"><div class="fn-head">FIELD NOTES // STOP, THEN REPAIR</div><p>If you make an endless loop, press <code>Ctrl+C</code> to stop that run. Then repair the update, save, and rerun. Stopping is safety, not the fix; prove the tested value will eventually make the condition false. Read the final counter value aloud before testing; that small prediction catches a surprising number of loose threads.</p></div>
'''

[[lessons.readings]]
label = "Python Tutorial — while Statements"
url = "https://docs.python.org/3/tutorial/introduction.html#first-steps-towards-programming"

[[lessons.exercises]]
id = "s03-l03-e1"
type = "text"
points = 19
prompt = "In a counted watch loop, what must change inside the indented body so the condition eventually becomes false?"
answer = "the counter"
accept = ["counter", "watch_number", "the counter variable"]
hint = "Look at the line that adds one to watch_number after each printed round."
whyWrong = "The status text and keeper name do not control repetition. The numeric counter is what the while condition tests, so it must advance toward stopping."

[[lessons.exercises]]
id = "s03-l03-e2"
type = "mc"
points = 22
prompt = "What happens if <code>watch_number += 1</code> is omitted from a loop starting at 1 with <code>watch_number &lt;= 3</code>?"
choices = ["It prints 1, 2, and 3 once", "It skips because 1 is not less than 3", "It keeps printing round 1 until stopped", "Python changes the counter automatically"]
answer = 2
hint = "Without the update, the condition keeps testing the stored value 1."
whyWrong = "Python does not advance a plain variable automatically, and 1 satisfies the test. Without the update, the same true condition repeats round 1 indefinitely."
explain = "A while loop needs code that changes the condition's inputs; otherwise a true condition stays true."

[[lessons.exercises]]
id = "s03-l03-d1"
type = "type"
points = 14
reps = 2
prompt = "Retype the complete three-round watch loop."
code = '''watch_number = 1

while watch_number <= 3:
    print(f"Watch round {watch_number}")
    watch_number += 1'''

[[lessons.exercises]]
id = "s03-l03-e3"
type = "fill"
points = 23
prompt = "Restore the update statement that advances the watch after it prints its current round."
code = '    watch_number ____ 1'
answer = "+="
hint = "This two-character operator adds one and stores the result back in watch_number."
whyWrong = "= would replace the counter with 1 every time, and -= moves it away from the stop. The loop requires add-and-store."

[[lessons.exercises]]
id = "s03-l03-w1"
type = "write"
points = 35
prompt = "Starting from <code>watch_number = 1</code>, write a while loop that computes—not hardcodes—three announcements: <code>Watch round 1</code>, <code>Watch round 2</code>, and <code>Watch round 3</code>."
expect = '''Watch round 1
Watch round 2
Watch round 3'''
hint = "Test through 3, print the counter in an f-string, and add one inside the same indented body."
starter = '''watch_number = 1

# Repeat until the numbered watch has announced rounds 1 through 3.
'''
solution = '''watch_number = 1

while watch_number <= 3:
    print(f"Watch round {watch_number}")
    watch_number += 1'''
