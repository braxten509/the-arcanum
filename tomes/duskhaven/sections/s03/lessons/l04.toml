[[lessons]]
id = "s03-l04"
title = "Mark The Wards By Range"
teaches = ["python-for-range-loop", "python-range-start-stop", "python-loop-index", "python-branch-loop-integration"]
body = '''
<p>A <strong>for loop</strong> is cleaner when Python should visit a prepared sequence of values. <code>range(2)</code> supplies two numbers: 0, then 1. The number in parentheses is a stopping boundary, not the last included value. That zero-based start differs from the watch's human-facing 1 through 3, but it is exact and will later suit map positions.</p>
<p>Keep the gate decision and completed <code>while</code> watch in the one canonical <code>main.py</code>. Add this separate loop after the while loop finishes—flush left, with its print indented four spaces. It does not replace the counter loop: each loop owns a different job.</p>
<pre><code>for ward_mark in range(2):
    print(f"Ward mark {ward_mark}")</code></pre>
<p>Run the file. After the three watch rounds, it prints <code>Ward mark 0</code> and <code>Ward mark 1</code>. On each pass Python assigns the next range value to <code>ward_mark</code>, prints it, and stops when no values remain. There is no <code>ward_mark += 1</code> because <code>for</code> receives each value from <code>range</code>.</p>
<p>Use <code>range(2)</code> when the exact count is two and starting at zero is useful. If a later display needs labels 1 and 2, print <code>ward_mark + 1</code>; arithmetic and f-strings from Forge II already make that possible. We do not adjust these canonical ward labels. Terminal input remains practice for Python control flow; the real game later receives keys through PyGame events.</p>
<div class="callout">Say <code>range(2)</code> as “start at zero, stop before two.” That wording prevents the phantom third mark.</div>
<div class="field-notes"><div class="fn-head">FIELD NOTES // TWO LOOP OWNERS</div><p>A while loop makes its changing stop condition visible. A for-range loop receives a fixed count directly. Neither is universally better; keeping them separate lets a reader see the watch counter and ward indices without confusing their responsibilities. When the range describes positions, retain zero as data rather than hiding it behind a friendlier display label forever in map work.</p></div>
'''

[[lessons.readings]]
label = "Python Tutorial — The range Function"
url = "https://docs.python.org/3/tutorial/controlflow.html#the-range-function"

[[lessons.exercises]]
id = "s03-l04-d1"
type = "type"
points = 14
reps = 2
prompt = "Retype the complete two-mark for-range loop."
code = '''for ward_mark in range(2):
    print(f"Ward mark {ward_mark}")'''

[[lessons.exercises]]
id = "s03-l04-e1"
type = "fill"
points = 23
prompt = "Restore the built-in that supplies the two indices for this ward loop."
code = 'for ward_mark in ____ (2):'
answer = "range"
hint = "Use the built-in that creates the zero-through-one sequence from the stop boundary 2."
whyWrong = "input waits for terminal text and print sends output; neither supplies a countable sequence. range(2) yields the two loop values."

[[lessons.exercises]]
id = "s03-l04-e2"
type = "mc"
points = 22
prompt = "Which pair of values does <code>range(2)</code> provide to <code>ward_mark</code>?"
choices = ["0 and 1", "1 and 2", "0, 1, and 2", "only 2"]
answer = 0
hint = "The stop boundary is excluded, and a one-argument range begins at zero."
whyWrong = "range does not include its stop value and does not begin at one by default. With a stop of 2, its only values are 0 and 1."
explain = "Python's one-argument range starts at 0 and ends immediately before the stated boundary."

[[lessons.exercises]]
id = "s03-l04-w1"
type = "write"
points = 34
prompt = "A warding clerk needs the two zero-based marks from <code>range(2)</code>. Write a for loop that uses its supplied value in an f-string and produces <code>Ward mark 0</code> and <code>Ward mark 1</code> on separate lines; do not hardcode two prints."
expect = '''Ward mark 0
Ward mark 1'''
hint = "Put ward_mark after for, use in range(2), then print ward_mark inside braces under the header."
starter = '''# Use a for-range loop to announce the two supplied ward marks.
'''
solution = '''for ward_mark in range(2):
    print(f"Ward mark {ward_mark}")'''
