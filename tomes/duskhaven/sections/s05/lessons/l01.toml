[[lessons]]
id = "s05-l03"
title = "Bring Back A Reckoning"
teaches = ["python-return-value", "python-return-result-store", "python-function-calculation"]
body = '''
<p>A report function performs an outward action with <code>print</code>. A calculation spell needs to hand an answer back to the caller so later code can decide what to print or store. Use <strong>return</strong> for that handoff. When Python reaches <code>return</code>, it sends the expression's value back to the call site and leaves that function invocation.</p>
<p>Add this complete new function below the other function definitions in canonical <code>main.py</code>. Place the call after the existing numeric facts, where <code>lantern_oil</code> and <code>oil_delivered</code> already exist. This is a new calculation owner; do not delete the earlier <code>oil_total = lantern_oil + oil_delivered</code> until you have verified the new result.</p>
<pre><code>def calculate_oil_total(current_oil, delivered_oil):
    return current_oil + delivered_oil


recounted_oil_total = calculate_oil_total(lantern_oil, oil_delivered)
print(f"Recounted oil: {recounted_oil_total}")</code></pre>
<p>The parameters receive the two integers, and the addition produces their total. <code>return</code> does not print anything. Instead, the call expression becomes the returned integer, which this program stores in <code>recounted_oil_total</code>. With the earlier values 3 and 2, the final report reads <code>Recounted oil: 5</code>. Keeping calculation and presentation separate gives the answer one inspectable name.</p>
<p>Do not write <code>print(current_oil + delivered_oil)</code> when the caller needs the result later. That would display a number but leave no returned answer to store. Conversely, do not expect <code>return</code> to display the result on its own. The caller chooses what happens next: it can assign, print, compare, or pass the returned value onward. Those choices will matter when Duskhaven later computes battle damage.</p>
<p>Call the function with values in the intended order: current oil first, delivery second. Addition happens to give the same result when swapped, but naming the arguments honestly builds a habit that protects later subtraction formulas.</p>
<div class="callout">Print shows a result to a person. Return gives a result back to Python. A real game needs both at different boundaries.</div>
<div class="field-notes"><div class="fn-head">FIELD NOTES // ONE WAY OUT</div><p>For these first calculation functions, place one clear <code>return</code> at the end of the body. Python can support several return paths later, but a single visible handoff makes the input-to-output contract easy to trace.</p></div>
'''

[[lessons.readings]]
label = "Python Reference — return Statement"
url = "https://docs.python.org/3/reference/simple_stmts.html#the-return-statement"

