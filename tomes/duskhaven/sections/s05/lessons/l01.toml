[[lessons]]
id = "s05-l02"
title = "Pass A Fact Through The Spell"
teaches = ["python-function-parameter", "python-function-argument", "python-parameterized-report"]
body = '''
<p><code>report_supplies()</code> can only read the one global hoard already named in <code>main.py</code>. A better report spell can accept a value from its caller. A <strong>parameter</strong> is the placeholder written in a function definition; an <strong>argument</strong> is the actual value written in a call. The caller hands the value in, and the parameter names it inside the function body.</p>
<p>Add this new function below <code>report_supplies</code> in the existing file. It is a new member-only block, not a replacement for the supply spell. Then call it after <code>town_ledger</code> has been created, because the call supplies a value taken from that prior dictionary.</p>
<pre><code>def report_town_name(name):
    print(f"Town: {name}")


report_town_name(town_ledger['name'])</code></pre>
<p>Here <code>name</code> is the parameter: it is a temporary local name for whichever argument arrives. The call first looks up <code>town_ledger['name']</code>, using Forge IV's dictionary key lookup. That produces <code>"Duskhaven"</code>, so the function prints <code>Town: Duskhaven</code>. Do not put quotes around <code>town_ledger['name']</code> in the call; quoted text would hand the function those literal characters instead of the stored town.</p>
<p>Parameters make one small behavior useful with different facts. A second call, <code>report_town_name("Ashcross")</code>, would print a different town without redefining the function. The parameter name need not match the argument's name. What matters is the value flowing from the call into the parameter. Give parameters singular, descriptive names when they represent one fact.</p>
<p>This is still terminal practice, not a replacement for future PyGame input. We are practicing the value flow that later lets game systems hand a function an enemy, a tile, or an item. Run the entire canonical file so the earlier gate and supply behavior remains intact.</p>
<div class="callout">Definition: parameter. Call: argument. One is the receiving hook; the other is the fact carried to it.</div>
<div class="field-notes"><div class="fn-head">FIELD NOTES // KEEP THE DOOR NARROW</div><p>A function that receives the one value it needs is easier to reuse and test than one that silently reaches for many unrelated names. Pass the fact that belongs to this job; do not pass the whole kingdom merely because it is nearby.</p></div>
'''

[[lessons.readings]]
label = "Python Tutorial — More on Defining Functions"
url = "https://docs.python.org/3/tutorial/controlflow.html#more-on-defining-functions"

