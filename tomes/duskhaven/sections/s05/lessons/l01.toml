[[lessons]]
id = "s05-l04"
title = "Keep The Spell's Ashes Local"
teaches = ["python-local-scope", "python-function-decomposition", "python-function-boundary"]
body = '''
<p>Functions make a program readable only when their names and temporary work stay in the right place. A name assigned inside a function body is normally <strong>local</strong>: it belongs to that invocation and is not a reliable name for code outside the function. This boundary prevents a private calculation from accidentally becoming the whole realm's shared ledger.</p>
<p>Add these new member-only functions beneath the previous function definitions in the same <code>main.py</code>. They reuse Forge IV's dictionary shape and this forge's parameter and return rules. Call them after <code>town_ledger</code> exists. Do not create a second class or file; classes are the next forge's tool.</p>
<pre><code>def calculate_supply_count(supplies):
    supply_count = 0
    for supply_name in supplies:
        supply_count += 1
    return supply_count


def report_supply_count(count):
    print(f"Supplies stocked: {count}")


stocked_count = calculate_supply_count(town_supplies)
report_supply_count(stocked_count)</code></pre>
<p><code>supply_count</code> begins at zero every time <code>calculate_supply_count</code> is called. The direct-list loop reaches backward to Forge IV and adds one for each supplied item. The return moves the finished number across the boundary into <code>stocked_count</code>; the separate report function receives that number as its <code>count</code> parameter. With oil, bread, bandage, and torch, the output is <code>Supplies stocked: 4</code>.</p>
<p>Do not try to print <code>supply_count</code> at the file's left margin after the function call. That name was local to the calculation spell. Print <code>stocked_count</code>, or pass it to a reporting function, because those are names that exist at the caller level. This division is <strong>decomposition</strong>: calculate one fact in one function, present it in another, and let the main path state the order of the world.</p>
<p>Run the full program after each small move. If a name error appears, use Forge I's traceback habit: read the final <code>main.py</code> frame, decide whether the name belongs inside or outside a function, repair the boundary, save, and run again.</p>
<div class="callout">A local name is ash inside one spell circle. Return the useful ember; do not reach through the circle for the ash.</div>
<div class="field-notes"><div class="fn-head">FIELD NOTES // MAIN PATH AS A MAP</div><p>The calls at the left margin read like a short itinerary: calculate, then report. Keep definitions together above that itinerary and calls below the data they require. This layout is PEP 8-friendly, easy to scan, and ready for later game systems.</p></div>
'''

