[[lessons.exercises]]
id = "s05-l01-e2"
type = "mc"
points = 23
prompt = "Why does the worked supply spell need <code>report_supplies()</code> after its definition?"
choices = ["It converts town_supplies into a dictionary", "It performs the stored report instructions at that point", "It adds a fourth indentation level to the print", "It makes the function name a string"]
answer = 1
hint = "Separate the act of storing instructions with def from the act of asking Python to run them."
whyWrong = "The parentheses here are a call, not a data conversion or indentation mark. A definition alone records the body; the call is what reaches that body during the run."
explain = "Python skips over the stored body while defining it, then enters the body when the later call is executed."

