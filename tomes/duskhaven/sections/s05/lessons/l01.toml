[[lessons.exercises]]
id = "s05-l04-w1"
type = "write"
points = 35
prompt = "A caravan list contains <code>[&quot;grain&quot;, &quot;salt&quot;, &quot;rope&quot;]</code>. Define <code>calculate_caravan_count</code> with one parameter. Start a local <code>caravan_count</code> at 0, use a direct-list <code>for</code> loop to add 1 for each item, and return it. Store the call's result in <code>arriving_count</code>, then print exactly <code>Caravan goods: 3</code>."
expect = '''Caravan goods: 3'''
hint = "The loop's item name is singular, caravan_count begins inside the function, and only the returned result is stored outside in arriving_count."
starter = '''caravan_goods = ["grain", "salt", "rope"]

# Define calculate_caravan_count with a local counter and direct-list loop.
# Store the returned count in arriving_count, then print the report.
'''
solution = '''caravan_goods = ["grain", "salt", "rope"]

def calculate_caravan_count(goods):
    caravan_count = 0
    for good_name in goods:
        caravan_count += 1
    return caravan_count


arriving_count = calculate_caravan_count(caravan_goods)
print(f"Caravan goods: {arriving_count}")'''
