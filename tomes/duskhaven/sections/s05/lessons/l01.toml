[[lessons]]
id = "s05-l01"
title = "Name A Repeated Spell"
teaches = ["python-function-define", "python-function-call", "python-function-indented-body"]
body = '''
<p>Forge IV made a supply report with a direct-list <code>for</code> loop. That loop works, but a growing game will need to report supplies more than once. Rather than copying its body wherever it is needed, give the job a name with <strong>def</strong>. A function definition records instructions; it does not perform them until a later call uses the name followed by parentheses.</p>
<p>In canonical <code>main.py</code>, add this member-only block after the existing data assignments and before the first place you want the report. Keep the earlier top-level supply loop only long enough to compare it, then replace that report with the call shown here. Do not create a second <code>main.py</code>, and do not put the old gate prompts inside this function.</p>
<pre><code>def report_supplies():
    for supply_name in town_supplies:
        print(f"Supply: {supply_name}")


report_supplies()</code></pre>
<p>The colon after <code>report_supplies()</code> begins the function body. Its four-space indentation says that the <code>for</code> loop belongs to the spell. The loop's own print receives another four spaces because it belongs to the loop. When Python first passes the definition, it stores the instructions. When execution reaches <code>report_supplies()</code> at the left margin, the function runs and prints oil, bread, bandage, and torch from the existing list.</p>
<p>The empty parentheses mean this first function needs no supplied information; it reads the earlier <code>town_supplies</code> list. That is suitable for a narrow refactor of the one canonical report. Later threads will pass values in deliberately, which makes a function reusable for more than one ledger. For now, distinguish the two actions: <code>def</code> defines once; a call runs whenever it is reached. Calling the function twice prints the whole report twice.</p>
<p>Save and run the full file, including the terminal prompts from previous forges. A function is not a replacement file; it is a labeled boundary inside the same loom.</p>
<div class="callout">Put a verb in a function name. <code>report_supplies</code> says what happens; <code>thing</code> makes the next repair need divination.</div>
<div class="field-notes"><div class="fn-head">FIELD NOTES // DEFINITION IS NOT OUTPUT</div><p>If you see no supply lines, first check that the call is below the definition and is flush left. A correctly defined function that is never called is stored work, not performed work.</p></div>
'''

[[lessons.readings]]
label = "Python Tutorial — Defining Functions"
url = "https://docs.python.org/3/tutorial/controlflow.html#defining-functions"

