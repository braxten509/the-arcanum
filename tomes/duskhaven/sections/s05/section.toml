title = "Incantations"
build = "Turn repeated Duskhaven reports into small, reusable Python functions."
brief = '''<p>A ledger can grow until its lines obscure the work they perform. A world-smith cuts such work into named incantations: one small spell for one clear job. In this forge, apprentice, you will reshape the repeated reports in the one real external <code>duskhaven/main.py</code> into functions that accept facts and return answers.</p><p>These are ordinary Python functions, not pretend PyGame callbacks. The future RPG will call functions to calculate damage, draw scenes, and load saves; today we learn the boundary before the world has a window. Preserve the existing import, lantern proof, gate watch, supply hoard, and ledgers. We add named function blocks and call them from that same canonical file.</p><div class="callout">The Worldwright's measure: a function earns its name when a reader can say what it does without reading its whole body. A nameless tangle is merely a loose thread with confidence.</div>'''
