[freestyle]
title = "BUILD: Bind The Duskhaven Steward"
brief = '''<p>The town has gathered enough facts that a steward must keep its reports from sprawling across the ledger. Extend the same real external <code>duskhaven/main.py</code>; retain the PyGame import, Forge I lantern proof, keeper report, gate decision and rounds, supply and ledger data. Do not create another file or a class.</p><ul><li>Define <code>report_supplies()</code> with no parameters. It must use a direct-list <code>for</code> loop over the existing <code>town_supplies</code> and print each final item as <code>Supply: &lt;name&gt;</code>; call it once after the list is complete.</li><li>Define <code>report_town_name(name)</code> with one parameter. Call it with <code>town_ledger['name']</code>, and make its f-string print exactly <code>Town: Duskhaven</code>.</li><li>Define <code>calculate_supply_count(supplies)</code>. It must start a local counter at <code>0</code>, count the passed list with direct-list iteration, and <code>return</code> the count.</li><li>Store <code>calculate_supply_count(town_supplies)</code> in <code>stocked_count</code>. Define <code>report_supply_count(count)</code>, call it with <code>stocked_count</code>, and print exactly <code>Supplies stocked: 4</code> for the four final supplies.</li><li>Save the one canonical <code>main.py</code>, run it from the VS Code integrated terminal, and use the final <code>main.py</code> traceback frame to repair any name or indentation error before your final proof run.</li></ul>'''
requires = ["tool-edit-save", "tool-run-test", "traceback-locate", "pygame-import-check", "python-fstring-output", "python-list-for-iterate", "python-list-append", "python-dict-key-lookup", "python-function-define", "python-function-call", "python-function-indented-body", "python-function-parameter", "python-function-argument", "python-parameterized-report", "python-return-value", "python-return-result-store", "python-function-calculation", "python-local-scope", "python-function-decomposition", "python-function-boundary"]
reward = 175
xray = "I dock embers when a definition is never called, a report hardcodes a supply or town name, a count is typed as 4 instead of returned from a loop, or a learner reaches for a function-local counter outside its spell circle. I reward a single orderly main.py: definitions above the calls they need, descriptive snake_case names, four-space bodies, and terminal proof that the earlier Duskhaven thread still holds."

[freestyle.badge]
id = "badge-s05"
name = "STEWARD'S SEAL"
desc = "Bound the town's repeated work into clear, reusable spells."

[[freestyle.rubric]]
criterion = "Reusable Supply Report"
weight = 25
desc = "report_supplies is defined, called after town_supplies is complete, uses direct-list iteration, and prints every final supply as Supply: <name> rather than hardcoded lines."

[[freestyle.rubric]]
criterion = "Passed Town Fact"
weight = 20
desc = "report_town_name has one parameter, receives town_ledger['name'] at its call, and its f-string produces Town: Duskhaven without hardcoding the town inside the function."

[[freestyle.rubric]]
criterion = "Returned Local Count"
weight = 25
desc = "calculate_supply_count receives a list, starts a local counter at 0, counts through direct-list iteration, returns the computed count, and stocked_count feeds report_supply_count so Supplies stocked: 4 is produced."

[[freestyle.rubric]]
criterion = "Runs The Existing Realm"
weight = 15
desc = "The single canonical main.py keeps the PyGame import and earlier Duskhaven behavior, saves cleanly, and runs from the external workspace with any final name or indentation error repaired from the traceback."

[[freestyle.rubric]]
criterion = "Worldwright's Python Craft"
weight = 15
desc = "Uses descriptive snake_case function, parameter, and variable names; keeps function definitions above the calls that use them; uses four-space indentation for each body; and avoids a second file, class, or duplicated report logic."
