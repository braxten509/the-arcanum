id = "s12"
codename = "FORGE XII // VOICES IN THE DARK"
short = "Voices in the Dark"
title = "Voices in the Dark"
build = "Place one world-space NPC and give her a deliberate, visible dialogue exchange."
brief = '''<p>Stone can bar a road, apprentice; it cannot answer a traveler. In this forge you will give Duskhaven its first witness: a named NPC in world space, a small radius of welcome, a dialogue state that remembers where the exchange stands, and a parchment panel rendered above the road.</p><p>This extends the one external <code>duskhaven/main.py</code>. Its map, camera, wall rules, bounds, float Mira position, event queue, held-arrow movement, sprite, Clock, and one display remain their established owners. A voice is neither a second loop nor terminal <code>input()</code>; it is a discrete key event woven through the existing game frame.</p><div class="callout">A conversation is state: a fact the world remembers between frames, not a print that vanishes into the terminal.</div>'''
