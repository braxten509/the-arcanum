[[lessons]]
id = "s12-l01"
title = "Set A Voice Upon The Road"
teaches = ["pygame-npc-record-owner", "pygame-npc-world-rect", "pygame-npc-proximity-test"]
body = '''
<p>Before a character can speak, she needs one honest owner. Add these top-level members beside Forge XI's <code>wall_rects</code> in canonical <code>main.py</code>. The dictionary reaches back to Forge IV: its string keys name facts, while the Rect gives those facts a physical place in the same world coordinates as Mira and the walls. This is one NPC record, not a new <code>Player</code> class and not a second coordinate system.</p>
<pre><code>npc = {
    "name": "Warden Ilyra",
    "lines": ["The east road remembers every footstep.", "Keep your ember dry, Mira."],
}
npc_rect = pygame.Rect(336, 432, 32, 32)
npc_color = (179, 111, 218)</code></pre>
<p>The compact lines are intentionally short so the first dialogue panel needs no untaught text wrapping. <code>npc_rect</code> is world space: its x and y stay fixed while the camera later subtracts its view origin for drawing. Add this helper below <code>hits_wall</code>; it is a complete new function and changes no earlier helper. <code>inflate(64, 64)</code> returns a larger Rect centered on the NPC. Calling <code>colliderect</code> on Mira's established frame Rect asks whether she has entered that welcome zone.</p>
<pre><code>def is_near_npc(mira_rect, npc_rect):
    interaction_rect = npc_rect.inflate(64, 64)
    return mira_rect.colliderect(interaction_rect)</code></pre>
<p>In the existing draw phase, after the wall loop and before Mira's blit, add the NPC mark. This is a members-only insertion: preserve <code>draw_world</code>, wall drawing, and camera calculations. Its destination uses the same subtraction as a wall, because both belong to the world.</p>
<pre><code>pygame.draw.rect(
    screen,
    npc_color,
    (npc_rect.x - camera_x, npc_rect.y - camera_y, npc_rect.width, npc_rect.height),
)</code></pre>
<p>Run the real game and walk near the violet mark. It does not speak yet; that is correct. Confirm it scrolls with the tiles and stonework rather than clinging to the window. If it stays still, inspect the two camera subtractions before changing the Rect's world facts.</p>
<div class="callout">The camera translates a witness for the eye; it never moves the witness through the world.</div>
<div class="field-notes"><div class="fn-head">FIELD NOTES // A ZONE IS NOT A WALL</div><p><code>interaction_rect</code> is a temporary enlarged query zone. It is never appended to <code>wall_rects</code>: a person invites proximity, while stone denies passage.</p></div>
'''

[[lessons.readings]]
label = "PyGame Rect — inflate and overlap"
url = "https://www.pygame.org/docs/ref/rect.html"

[[lessons.exercises]]
id = "s12-l01-d1"
type = "type"
points = 14
reps = 2
prompt = "Retype the complete helper that turns Ilyra's world Rect into a nearby interaction test."
code = '''def is_near_npc(mira_rect, npc_rect):
    interaction_rect = npc_rect.inflate(64, 64)
    return mira_rect.colliderect(interaction_rect)'''

[[lessons.exercises]]
id = "s12-l01-e1"
type = "fill"
points = 25
prompt = "Restore the Rect method that makes Ilyra's 32-by-32 body into the larger 96-by-96 welcome zone."
code = 'interaction_rect = npc_rect.____(64, 64)'
answer = "inflate"
hint = "Use the Rect method that returns a widened copy; it takes how much width and height to add."
whyWrong = "move would relocate a copy without making a zone, while colliderect only asks an overlap question. inflate creates the deliberately larger temporary boundary."

[[lessons.exercises]]
id = "s12-l01-e2"
type = "mc"
points = 27
prompt = "Why must the NPC draw tuple subtract <code>camera_x</code> and <code>camera_y</code> even though <code>npc_rect</code> is fixed?"
choices = ["The subtraction changes Ilyra's saved world position every frame", "The subtraction converts the fixed world position into the current window position", "The subtraction makes the NPC collide with wall_rects", "The subtraction turns npc_color into an alpha sprite"]
answer = 1
hint = "Reach back to the wall and tile drawing rule: permanent world facts pass through the moving view only when drawn."
whyWrong = "Changing saved position would make the NPC wander with the camera; collision and color are different concerns. The misconception is confusing a rendering conversion with a mutation of world data."
explain = "World-space NPC coordinates stay true; camera subtraction produces only this frame's screen destination."

[[lessons.exercises]]
id = "s12-l01-e3"
type = "text"
points = 23
prompt = "Which established Rect method supplies the Boolean answer at the end of <code>is_near_npc</code>?"
answer = "colliderect"
hint = "Forge XI used this same method when a proposed Mira boundary met stone."
whyWrong = "inflate creates the larger zone but does not compare it, and move proposes an offset. The needed final question is the overlap method colliderect."

[[lessons.exercises]]
id = "s12-l01-w1"
type = "write"
points = 35
prompt = "Ilyra stands at world x 336 while the camera begins at x 240. Her welcome zone adds 64 pixels to her 32-pixel width. Compute both values from the named inputs and print exactly <code>NPC screen x: 96</code> then <code>Welcome width: 96</code>."
expect = '''NPC screen x: 96
Welcome width: 96'''
hint = "Subtract camera_x from npc_x, then add extra_width to npc_width; the two calculations answer different world questions."
starter = '''npc_x = 336
camera_x = 240
npc_width = 32
extra_width = 64

# Derive Ilyra's screen x and the widened interaction-zone width.
'''
solution = '''npc_x = 336
camera_x = 240
npc_width = 32
extra_width = 64

npc_screen_x = npc_x - camera_x
welcome_width = npc_width + extra_width

print(f"NPC screen x: {npc_screen_x}")
print(f"Welcome width: {welcome_width}")'''
