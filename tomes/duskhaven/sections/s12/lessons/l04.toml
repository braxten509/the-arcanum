[[lessons]]
id = "s12-l04"
title = "Lay The Words On Parchment"
teaches = ["pygame-font-owner", "pygame-font-render-surface", "pygame-dialogue-panel-render"]
body = '''
<p>A conversation state must become a visible promise. After the existing display and before <code>running = True</code>, add the one reusable font owner. <code>pygame.font.Font(None, 28)</code> asks PyGame for its default font at 28 pixels; it does not load a file the apprentice must hunt down. Then add the following members in the existing draw phase after Mira's blit and before the one <code>pygame.display.flip()</code>. This keeps the panel above the world and does not disturb the map, wall, NPC, or actor order beneath it.</p>
<pre><code>dialogue_font = pygame.font.Font(None, 28)

if dialogue_active:
    panel_rect = pygame.Rect(36, 390, 888, 114)
    pygame.draw.rect(screen, (38, 30, 48), panel_rect)
    speaker_surface = dialogue_font.render(npc["name"], True, (255, 181, 81))
    line_surface = dialogue_font.render(dialogue_lines[dialogue_index], True, (244, 232, 204))
    screen.blit(speaker_surface, (60, 410))
    screen.blit(line_surface, (60, 448))</code></pre>
<p><code>render</code> returns a new Surface containing text. It does not draw directly, so each returned <code>speaker_surface</code> or <code>line_surface</code> still needs the established <code>screen.blit</code> step. The second argument, <code>True</code>, requests antialiasing for smoother glyph edges. The guarded block reads <code>dialogue_lines[dialogue_index]</code> only while the transition helper has left dialogue open, which is why Thread II's close-before-index rule matters.</p>
<p>Run the external Duskhaven build. Walk to Ilyra, press E, read the first line, press Space for the second, then Space again to close the panel. Continue walking and verify that the camera still scrolls the NPC and walls, arrow travel still stops at stone, and the normal close control returns the terminal cleanly. If text is hidden, first inspect draw order: a panel drawn before the map will be painted over. If a list error appears on the final Space, inspect <code>advance_dialogue</code> rather than adding a blanket try/except.</p>
<div class="callout">Render makes ink on a temporary Surface; blit lays that Surface on the one real screen.</div>
<div class="field-notes"><div class="fn-head">FIELD NOTES // SHORT LINES ARE A DELIBERATE LIMIT</div><p>This first panel does not wrap paragraphs. Keep the two taught lines short enough for the 888-pixel panel; a later forge may teach text measurement and wrapping as its own capability rather than smuggling it into a dialogue exercise.</p></div>
'''

