[[lessons.exercises]]
id = "s12-l04-d1"
type = "type"
points = 14
reps = 2
prompt = "Retype the two-stage text path: render Ilyra's current line, then blit the returned Surface on the panel."
code = '''line_surface = dialogue_font.render(dialogue_lines[dialogue_index], True, (244, 232, 204))
screen.blit(line_surface, (60, 448))'''

[[lessons.exercises]]
id = "s12-l04-e1"
type = "fill"
points = 26
prompt = "Restore the font method that turns the active dialogue string into a Surface before it can be blitted."
code = 'line_surface = dialogue_font.____(dialogue_lines[dialogue_index], True, (244, 232, 204))'
answer = "render"
hint = "The missing method produces a new text Surface; the next line uses screen.blit to place it."
whyWrong = "blit belongs to screen and places an existing Surface, while fill paints a Surface with a color. render is the font operation that creates the text image."

[[lessons.exercises]]
id = "s12-l04-e2"
type = "mc"
points = 28
prompt = "Why is the dialogue-panel block placed after Mira's blit but before pygame.display.flip()?"
choices = ["It lets the panel cover the scene as a foreground layer before the completed frame is presented", "It makes dialogue_index advance without a key event", "It moves npc_rect into screen coordinates permanently", "It causes clock.tick(60) to create the font"]
answer = 0
hint = "Recall the scene-layering rule: later drawing overlays earlier drawing, while flip only reveals the completed Surface."
whyWrong = "State transitions belong to the event branch, NPC world ownership must remain fixed, and Clock does not make fonts. The relevant rule is foreground draw order before presentation."
explain = "Map, walls, NPC, and Mira are drawn first; the panel then overlays them, and flip shows that finished stack."

[[lessons.exercises]]
id = "s12-l04-e3"
type = "text"
points = 23
prompt = "What object must be passed as the first argument to screen.blit after dialogue_font.render(...) returns?"
answer = "line_surface"
hint = "Name the returned text-image owner from the taught two-line render-and-place sequence."
whyWrong = "dialogue_font creates text but is not the rendered image, while dialogue_lines is a list of strings. line_surface is the Surface returned by render and therefore the thing blit can place."

[[lessons.exercises]]
id = "s12-l04-w1"
type = "write"
points = 37
prompt = "Ilyra's dialogue list has two lines and the state selects index 1. Use list indexing to choose the current string, then print exactly <code>Panel line: Keep your ember dry, Mira.</code>. Do not print the target literal without reading the named list and index."
expect = '''Panel line: Keep your ember dry, Mira.'''
hint = "Square brackets with dialogue_index select the current list entry; place that selected string in the f-string."
starter = '''dialogue_lines = ["The east road remembers every footstep.", "Keep your ember dry, Mira."]
dialogue_index = 1

# Select the active dialogue entry for the panel.
'''
solution = '''dialogue_lines = ["The east road remembers every footstep.", "Keep your ember dry, Mira."]
dialogue_index = 1

current_line = dialogue_lines[dialogue_index]

print(f"Panel line: {current_line}")'''
