build = "Install Python and PyGame, configure VS Code, and establish Duskhaven's runnable main.py."
brief = '''<p>Before a realm has roads or monsters, it needs a forge that answers when struck. In this first forge you will build the real, external workspace for <strong>Duskhaven</strong>: Python, VS Code, PyGame, and one small file that proves they are joined.</p><p>Nothing here is a painted simulation. You will run commands in your own terminal, save a real <code>main.py</code>, and read the errors the machine gives you. Keep the path to your Duskhaven folder close; every later forge returns to it.</p><div class="callout">The Worldwright's rule: change one thing, save it, run it, then believe the result—not the story you told yourself about the result.</div>'''
