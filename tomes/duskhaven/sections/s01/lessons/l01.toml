[[lessons]]
id = "s01-l01"
title = "Choose The Anvil"
teaches = ["tool-install", "tool-create-open", "tool-navigate", "tool-edit-save"]
body = '''
<p>A game is not made inside this study's little editor, apprentice. Duskhaven will live in a real folder on your machine, and we will use the same tools a working Python game uses outside these walls. Install a current Python 3 from <code>python.org</code>. On Windows, tick the installer option that adds Python to PATH; on macOS and Linux, follow the platform instructions. Then install VS Code and its <strong>Python</strong> extension. The extension is the editor's lens: it recognizes <code>.py</code> files, offers diagnostics, and lets you choose the interpreter that actually runs your work.</p>
<p>Make one folder named <code>duskhaven</code> somewhere you can find again—your Documents folder is sensible. In VS Code choose <em>File → Open Folder</em> and open that exact folder, not a random file beside it. The Explorer at the left is now your map of the workspace; the integrated terminal, opened with <em>Terminal → New Terminal</em>, should start at that folder. If its prompt ends in <code>duskhaven</code>, you stand at the right anvil.</p>
<p>In Explorer, create <code>main.py</code>. The <code>.py</code> ending matters: it tells Python and VS Code which language owns the file. Put this complete first program in it, then save with <code>Ctrl+S</code> or <code>Cmd+S</code>. A dot on the editor tab means unsaved changes; do not run by hope when the dot is still there.</p>
<pre><code>print("Duskhaven: the lantern is lit.")</code></pre>
<p>We use <code>print()</code> to send text to the terminal. Parentheses hold what a command receives; quotation marks make visible text, called a string. You do not need to memorize those names yet. You do need to preserve the spelling, quotes, and parentheses. This one line is deliberately plain: it proves the file, editor, and workspace exist before we ask them to carry a whole world.</p>
<div class="callout">Do not create a second <code>main.py</code> in a second folder. One project folder and one canonical entry file keep every later forge on the same loom.</div>
<div class="field-notes"><div class="fn-head">FIELD NOTES // FIND THE REAL FOLDER</div><p>VS Code can show many open files while the terminal stands somewhere else. The Explorer folder and terminal prompt are better evidence than a familiar-looking tab. If you lose the project, use Explorer's right-click <em>Reveal in File Explorer/Finder</em>, then reopen that folder in VS Code.</p></div>
'''

[[lessons.readings]]
label = "Python Downloads"
url = "https://www.python.org/downloads/"

[[lessons.readings]]
label = "Getting Started with Python in VS Code"
url = "https://code.visualstudio.com/docs/python/python-tutorial"

[[lessons.exercises]]
id = "s01-l01-e1"
type = "mc"
points = 18
prompt = "You created <code>main.py</code> inside Documents/duskhaven. Which VS Code action makes the Explorer and integrated terminal refer to that project workspace?"
choices = ["Open only main.py from the Recent list", "Open the Python download page inside VS Code", "Create a new untitled editor and paste the code", "Choose File → Open Folder and select duskhaven"]
answer = 3
hint = "The workspace must be the folder that contains main.py, not merely the file tab."
whyWrong = "A lone file tab can be open while the terminal is in another directory. Opening the duskhaven folder gives the Explorer and terminal one shared project root."
explain = "A folder workspace is the durable home for the growing game and its terminal commands."

[[lessons.exercises]]
id = "s01-l01-d1"
type = "type"
points = 12
reps = 2
prompt = "Retype the complete first line for <code>main.py</code>."
code = 'print("Duskhaven: the lantern is lit.")'

[[lessons.exercises]]
