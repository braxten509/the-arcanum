[freestyle]
title = "BUILD: Light The Duskhaven Lantern"
brief = '''<p>Set the first honest stone of <strong>Duskhaven</strong>, apprentice. In your real external project folder, create <code>main.py</code> and prove that the installed tools can meet there.</p><ul><li>Run <code>main.py</code> from the VS Code integrated terminal using Python.</li><li>Import <code>pygame</code> successfully before either message is printed.</li><li>Print exactly <code>Duskhaven: the lantern is lit.</code> on one line and <code>PyGame import: ready.</code> on the next.</li><li>If the run first fails, use the traceback or terminal message to locate the named file or missing package, repair it, save, and run again.</li></ul>'''
requires = ["tool-install", "tool-create-open", "tool-navigate", "tool-edit-save", "tool-run-test", "tool-diagnose", "python-program", "pygame-install", "pygame-import-check", "traceback-locate"]
reward = 200
xray = "I dock marks for a file that only looks right in the editor, for a missing PyGame import, and for output that drifts from the two required lines. I reward an apprentice who can point to the real project folder, run from its terminal, and leaves a small, readable main.py rather than a tangle of rituals."

[freestyle.badge]
id = "badge-s01"
name = "LANTERN LIT"
desc = "Lit Duskhaven's first lamp with a real Python and PyGame workspace."

[[freestyle.rubric]]
criterion = "Real Workspace And Run"
weight = 25
desc = "A real external Duskhaven folder contains main.py, and the student can run that file with Python from the VS Code integrated terminal."

[[freestyle.rubric]]
criterion = "PyGame Boundary"
weight = 25
desc = "main.py imports pygame successfully before printing, demonstrating that PyGame was installed into the interpreter used to run the project."

[[freestyle.rubric]]
criterion = "Lantern Transcript"
weight = 25
desc = "The program prints exactly the two required lines, in order: Duskhaven: the lantern is lit. then PyGame import: ready."

[[freestyle.rubric]]
criterion = "Traceable Worldwright Craft"
weight = 25
desc = "The student can use the terminal diagnostic or traceback to repair a failed run; main.py uses descriptive snake_case names if a name is needed, four-space indentation for any block, and clean, readable layout without unnecessary clutter."
