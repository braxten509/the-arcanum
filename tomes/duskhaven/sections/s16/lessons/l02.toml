[[lessons]]
id = "s16-l02"
title = "Write And Recover The Seal"
teaches = ["save-file-write", "save-file-load", "player-load-method", "save-load-recovery"]
body = '''
<p>A seal must cross the closing of the window and return without snapping the loom, apprentice. Add these <strong>complete new top-level members</strong> in canonical <code>main.py</code> after <code>calculate_damage</code> and before the Player and wolf constructions. They reuse the <code>json</code> import and the <code>Player.to_save_data</code> method from Thread I. Do not place them inside Player, the event loop, or a renderer; do not create another file.</p>
<pre><code>SAVE_PATH = "duskhaven_save.json"


def save_game(player):
    with open(SAVE_PATH, "w", encoding="utf-8") as save_file:
        json.dump(player.to_save_data(), save_file, indent=2)
    return "World sealed."


def load_save_data(player):
    try:
        with open(SAVE_PATH, "r", encoding="utf-8") as save_file:
            save_data = json.load(save_file)
    except (OSError, json.JSONDecodeError):
        return "No valid seal found."

    player.health = save_data["health"]
    player.max_health = save_data["max_health"]
    player.attack = save_data["attack"]
    player.defense = save_data["defense"]
    player.inventory = save_data["inventory"]
    player.experience = save_data["experience"]
    player.level = save_data["level"]
    return "World restored."</code></pre>
<p><code>with open(...)</code> closes the file when its indented block ends, even if the operation fails. The <code>"w"</code> mode writes a fresh JSON document; <code>"r"</code> reads it. <code>json.dump</code> writes a Python value to a file, while <code>json.load</code> reads JSON from a file back into a Python dictionary. The two exceptions are a narrow boundary: <code>OSError</code> covers a missing or inaccessible file; <code>json.JSONDecodeError</code> covers text that is not valid JSON. Neither should kill a game that merely has no usable save yet.</p>
<p>After a successful load, each assignment restores the exact Player-owned field taught before this forge. Do not use <code>player.__dict__ = save_data</code>: it would make an unexamined file dictate the object's whole shape and hides the contract the player must maintain. First run the game, press F5 after a battle change, close it normally, reopen it, and later use F9 once its event branch exists. If the file is missing, the recovery message is correct evidence, not a bug to conceal.</p>
<div class="callout">Catch a broken external seam, then report it. Do not wrap combat or ordinary empty-satchel decisions in a giant try/except net.</div>
<div class="field-notes"><div class="fn-head">FIELD NOTES // LOAD IS NOT TRUST</div><p>This lesson promises recovery for missing or malformed JSON, not defense against malicious save files. For this small local game, explicit field assignments make the normal contract visible. A commercial game would additionally validate value ranges and schema versions.</p></div>
'''

[[lessons.readings]]
label = "Python Documentation — open and File Objects"
url = "https://docs.python.org/3/tutorial/inputoutput.html#reading-and-writing-files"

[[lessons.readings]]
label = "Python Documentation — JSONDecoder"
url = "https://docs.python.org/3/library/json.html#json.JSONDecodeError"

[[lessons.exercises]]
id = "s16-l02-e1"
type = "mc"
points = 35
prompt = "Why does <code>load_save_data</code> catch <code>OSError</code> and <code>json.JSONDecodeError</code> around reading the save?"
choices = ["To let one missing or malformed external save report recovery instead of crashing the live game", "To make every battle hit silently do zero damage", "To let Player ignore its named fields", "To keep F5 from writing any file"]
answer = 0
hint = "The protected lines cross the file boundary, where no file and bad JSON are ordinary recovery cases."
whyWrong = "Combat damage and Player ownership are unrelated to file parsing, and F5 still needs writing. The mistake is treating an expected external-file failure as a reason for the whole PyGame loop to stop."
explain = "The narrow handler turns absent or malformed save text into a visible recovery message while leaving current state intact."

[[lessons.exercises]]
id = "s16-l02-d1"
type = "type"
points = 14
reps = 2
prompt = "Retype the complete write boundary that serializes Player's snapshot to the named save file."
code = '''def save_game(player):
    with open(SAVE_PATH, "w", encoding="utf-8") as save_file:
        json.dump(player.to_save_data(), save_file, indent=2)
    return "World sealed."'''

[[lessons.exercises]]
id = "s16-l02-e2"
type = "fill"
points = 30
prompt = "Restore the json function that writes Player's dictionary to the already-open save_file."
code = '        json.____(player.to_save_data(), save_file, indent=2)'
answer = "dump"
hint = "This version sends a Python value into a file object; the sibling function ending in s produces text instead."
whyWrong = "dumps returns JSON text rather than writing to save_file, while load reads from a file. dump is the writer that receives both the record and the open file."

[[lessons.exercises]]
id = "s16-l02-e3"
type = "text"
points = 28
prompt = "Which open mode reads the existing JSON document rather than replacing it?"
answer = "r"
hint = "The restore helper opens SAVE_PATH with the single-letter mode paired with reading."
whyWrong = "w starts a write operation and would replace the file, while a and x have different write-oriented purposes. r requests the existing file for reading."

[[lessons.exercises]]
id = "s16-l02-w1"
type = "write"
points = 44
prompt = "Use the supplied JSON text for a sealed Mira. Convert it with <code>json.loads</code>, read the recovered <code>health</code> and <code>level</code> fields, and print exactly <code>Restored Mira: HP 11, level 2</code>. Compute from <code>save_text</code>; do not print the target literal. This plain-file drill models the same decoding step that <code>json.load(save_file)</code> performs in Duskhaven."
expect = '''Restored Mira: HP 11, level 2'''
hint = "Call json.loads(save_text), then use recovered['health'] and recovered['level'] in the requested f-string."
starter = '''import json

save_text = '{"health": 11, "level": 2}'

# Decode the supplied save text and report its two recovered facts.
'''
solution = '''import json

save_text = '{"health": 11, "level": 2}'

recovered = json.loads(save_text)
print(f"Restored Mira: HP {recovered['health']}, level {recovered['level']}")'''
