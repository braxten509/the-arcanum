[[lessons]]
id = "s16-l01"
title = "Choose What A Seal Remembers"
teaches = ["json-module-import", "player-save-record", "player-save-method", "save-state-boundary"]
body = '''
<p>A save file should remember facts, not attempt to pickle the whole living window, apprentice. JSON stores numbers, strings, lists, and dictionaries—the shapes Forge IV and Forge XV already made familiar. It cannot directly hold a <code>Player</code> instance or a PyGame display. Therefore Player gives the save boundary a dictionary, while the later file helper decides where that dictionary travels.</p>
<p>At the very top of canonical <code>main.py</code>, beside the existing <code>import pygame</code>, add <code>import json</code>. In the existing canonical <code>Player</code> class, add only this complete <code>to_save_data</code> method directly after <code>gain_experience</code>. Every combat, tonic, and growth member remains where the earlier forges established it; do not create a second Player class. The method returns fresh dictionary and list containers, so the record describes the current state without becoming another owner of it.</p>
<ol><li>At four spaces inside Player, add <code>def to_save_data(self):</code>.</li><li>At eight spaces, return one dictionary with <code>"health"</code>, <code>"max_health"</code>, <code>"attack"</code>, <code>"defense"</code>, <code>"inventory"</code>, <code>"experience"</code>, and <code>"level"</code> keys.</li><li>Each value reads the matching <code>self</code> attribute—for example, <code>"health": self.health</code>—and the <code>inventory</code> value is <code>self.inventory</code>.</li></ol>
<p>Notice the deliberate omission of <code>name</code>: this chapter always restores the authored hero Mira, so name is not a player choice to persist. Inventory is already a list of item dictionaries, which JSON can carry without translation. Keep <code>health</code> and <code>max_health</code> separate; collapsing them would erase the tonic ceiling Forge XV established. Run the game after the class replacement. An indentation error means a method drifted out of Player; a name error for <code>json</code> means its import did not reach the top of the file.</p>
<div class="callout">Player remains the source of truth. A save dictionary is a courier carrying a snapshot, never a shadow Player with competing health.</div>
<div class="field-notes"><div class="fn-head">FIELD NOTES // PLAIN SHAPES SURVIVE</div><p>JSON keys become quoted strings and its values must be plain data. This is why the inventory's existing dictionaries are convenient, while a Surface, Clock, or Player object is not placed in the record. Save only facts you can deliberately rebuild.</p></div>
'''

[[lessons.readings]]
label = "Python Documentation — json"
url = "https://docs.python.org/3/library/json.html"

[[lessons.exercises]]
id = "s16-l01-d1"
type = "type"
points = 14
reps = 2
prompt = "Retype the complete Player method that turns Mira's current health and rank into a JSON-ready record."
code = '''    def to_save_data(self):
        return {
            "health": self.health,
            "level": self.level,
        }'''

[[lessons.exercises]]
id = "s16-l01-e1"
type = "fill"
points = 29
prompt = "Restore the Player method name that returns the dictionary for the file boundary."
code = '''    def ____ (self):
        return {"health": self.health}'''
answer = "to_save_data"
hint = "This snake_case verb says Player is producing data for a save, not opening a file itself."
whyWrong = "save_game belongs to the later file helper, while load_save_data restores facts. Here Player only assembles the snapshot named to_save_data."

[[lessons.exercises]]
id = "s16-l01-e2"
type = "mc"
points = 34
prompt = "Which value is appropriate inside Mira's JSON save record?"
choices = ["The current pygame.display Surface", "player.inventory, the list of item dictionaries", "The running Clock object", "The Player instance itself"]
answer = 1
hint = "Choose the existing value made only of JSON-friendly lists, dictionaries, strings, and numbers."
whyWrong = "A display, Clock, and Player are live Python/PyGame objects rather than JSON data. The misconception is saving an object graph when the file needs plain facts; the inventory list already has the correct data shape."
explain = "JSON can represent the satchel's list of item dictionaries directly, just as it can represent health and level numbers."

[[lessons.exercises]]
id = "s16-l01-e3"
type = "text"
points = 27
prompt = "What standard-library module turns the plain save record into text for a file?"
answer = "json"
hint = "It is the lower-case module imported beside pygame at the top of main.py."
whyWrong = "pygame owns the game window, and pathlib concerns paths, not JSON encoding. The required standard module is json."

[[lessons.exercises]]
id = "s16-l01-w1"
type = "write"
points = 43
prompt = "Mira currently has <code>health = 12</code>, <code>level = 2</code>, and one Ember Tonic record in <code>inventory</code>. Build a dictionary named <code>save_data</code> containing those three facts, then use <code>json.dumps</code> to print its JSON text. The required output is exactly <code>{&quot;health&quot;: 12, &quot;level&quot;: 2, &quot;inventory&quot;: [{&quot;name&quot;: &quot;Ember Tonic&quot;, &quot;heal&quot;: 5}]}</code>."
expect = '''{"health": 12, "level": 2, "inventory": [{"name": "Ember Tonic", "heal": 5}]}'''
hint = "Import json, make save_data in the requested key order, and pass that dictionary—not a hand-written output string—to json.dumps."
starter = '''import json

health = 12
level = 2
inventory = [{"name": "Ember Tonic", "heal": 5}]

# Build save_data from the supplied state, then encode and print it.
'''
solution = '''import json

health = 12
level = 2
inventory = [{"name": "Ember Tonic", "heal": 5}]

save_data = {
    "health": health,
    "level": level,
    "inventory": inventory,
}

print(json.dumps(save_data))'''
