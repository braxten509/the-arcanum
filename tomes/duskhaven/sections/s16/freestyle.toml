[freestyle]
title = "BUILD: Seal And Deliver Duskhaven"
brief = '''<p>Set the last seal, apprentice. Extend the same real external <code>duskhaven/main.py</code> from Forge XV. Preserve one display, Clock, event queue, scene manager, overworld, camera, collision, dialogue, title/menu cards, battle order, outcome lock, Player, and Mist Wolf. Do not add a second program, loop, display, Player class, shadow state, terminal <code>input()</code>, or an untaught asset dependency.</p><ul><li>Add <code>import json</code>. The one canonical Player must retain all Forge XV fields and methods, then add <code>to_save_data()</code> returning a JSON-ready dictionary with <code>health</code>, <code>max_health</code>, <code>attack</code>, <code>defense</code>, <code>inventory</code>, <code>experience</code>, and <code>level</code>.</li><li>Define <code>SAVE_PATH = "duskhaven_save.json"</code>, <code>save_game(player)</code>, and <code>load_save_data(player)</code>. Saving must use <code>json.dump</code> on Player's record and return <code>World sealed.</code>. Loading must use <code>json.load</code>, restore each named Player field explicitly, and return <code>World restored.</code>. Missing, inaccessible, or malformed JSON must be caught as <code>OSError</code> or <code>json.JSONDecodeError</code>, leave current state safe, and return <code>No valid seal found.</code>.</li><li>In the existing <code>pygame.KEYDOWN</code> ladder, F5 assigns <code>battle_message = save_game(player)</code> and F9 assigns <code>battle_message = load_save_data(player)</code>. Keep the existing H/Space live-battle guards, Escape route, close behavior, and one-way renderer contract intact.</li><li>Run the source game outside this study: reach battle, change Mira's state by using a tonic or winning, press F5, close normally, reopen, press F9, and visibly verify the saved HP/max HP, level, XP, stats, and inventory return. Test a missing or deliberately malformed save once; it must show the recovery message without a traceback. Remove or repair that test file.</li><li>Install PyInstaller with <code>python -m pip install pyinstaller</code>, then run <code>python -m PyInstaller --onefile --windowed --name Duskhaven main.py</code>. Launch the platform-matching artifact from <code>dist</code> outside VS Code and repeat save → close → relaunch → load. Hand over that launcher with the honest note that it runs only on its build platform.</li></ul>'''
requires = ["json-module-import", "player-save-record", "player-save-method", "save-state-boundary", "save-file-write", "save-file-load", "player-load-method", "save-load-recovery", "save-key-routing", "save-status-feedback", "tool-package-build", "tool-deliver", "delivery-end-to-end-proof", "inventory-list-owner", "player-maximum-health", "inventory-use-method", "player-experience-owner", "player-level-up", "pygame-event-queue", "pygame-keydown-event", "combat-outcome-lock", "battle-win-experience", "scene-active-input-routing", "tool-run-test", "tool-diagnose"]
reward = 520
xray = "I dock embers for serializing a live Player or PyGame object, a duplicate Player, a save that loses inventory or maximum health, broad exception fog, an F5/F9 branch outside the real event queue, or a claim of delivery backed only by a terminal command. I reward one explicit data boundary, narrow recovery, truthful status, and a launcher proved through save, close, relaunch, and load."

[freestyle.badge]
id = "badge-s16"
name = "REALMSEALER"
desc = "Sealed Mira's journey in a durable file and carried Duskhaven beyond the workshop door."

[[freestyle.rubric]]
criterion = "Models A Complete JSON Snapshot"
weight = 20
desc = "One canonical Player retains prior combat, satchel, and growth behavior and adds to_save_data() with the required JSON-ready health, max_health, attack, defense, inventory, experience, and level fields; no live Player, Surface, Clock, duplicate class, or shadow state is serialized."

[[freestyle.rubric]]
criterion = "Writes And Restores Safely"
weight = 25
desc = "SAVE_PATH is duskhaven_save.json; save_game uses json.dump and returns World sealed.; load_save_data uses json.load, explicitly restores every required Player field, returns World restored., and narrowly recovers OSError or json.JSONDecodeError with No valid seal found. while preserving the running game."

[[freestyle.rubric]]
criterion = "Routes The Living Save Controls"
weight = 20
desc = "The one existing pygame.KEYDOWN ladder maps F5 to battle_message = save_game(player) and F9 to battle_message = load_save_data(player); visible feedback works without new loops or render-time mutation, and existing H/Space outcome locks, Escape, and close behavior remain correct."

[[freestyle.rubric]]
criterion = "Delivers And Proves The Artifact"
weight = 20
desc = "A PyInstaller onefile windowed Duskhaven launcher is built in dist and launched outside VS Code; the student demonstrates changed state saved, normal close, relaunch, and restored state, plus one missing or malformed-save recovery check and the platform-matching handoff limit."

[[freestyle.rubric]]
criterion = "Worldwright's Python Craft"
weight = 15
desc = "Uses CapWords classes, descriptive snake_case functions and variables, UPPER_CASE constants, four-space indentation, one space around operators, focused helper boundaries, and one main.py without duplicate classes, loops, displays, or blocking input()."
