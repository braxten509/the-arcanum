title = "Sealing The World"
build = "Persist Mira's true state as JSON, recover it safely, and deliver Duskhaven as a runnable program."
brief = '''<p>A realm that vanishes when its window closes is a candle guttering in the rain, apprentice. This final forge seals the real external <code>duskhaven/main.py</code> without replacing its single display, Clock, event queue, scene manager, overworld, collision, dialogue, battle, satchel, or growth rule. We will choose a small JSON record for the state Player already owns, write it to a named file, recover it without letting a broken save crash the game, and then make a runnable delivery.</p><p>The seal is deliberately modest: Mira's health, maximum health, attack, defense, inventory, experience, and level. The map and Mist Wolf remain the authored opening of this small RPG; they are not silently promised as a full world serializer. F5 saves during the live game, F9 tries to restore a valid seal, and a missing or malformed seal leaves the current game safe while reporting what happened.</p><div class="callout">Saving is a boundary, not a second game: Player supplies facts, file helpers carry them across a closing window, and the existing event loop asks for the work.</div>'''
