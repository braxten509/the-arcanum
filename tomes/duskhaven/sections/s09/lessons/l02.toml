[[lessons]]
id = "s09-l02"
title = "Set The Wanderer's Direction"
teaches = ["pygame-direction-update", "pygame-directional-key-branches", "pygame-position-owner"]
body = '''
<p>A held key is only intent until it changes a stored place. Give Mira two position owners before the existing <code>running = True</code> line in canonical <code>main.py</code>: <code>mira_x = 132.0</code> and <code>mira_y = 398.0</code>. These begin at the Forge VIII sprite location, but their decimal points deliberately make them floats. A later time calculation can add a fraction of a pixel without throwing that fraction away.</p>
<p>Then place the following <strong>members only</strong> after Thread I's <code>keys = pygame.key.get_pressed()</code> line and before the existing draw calls, still inside the one <code>while running</code> loop. This thread uses a one-pixel rehearsal step; Thread III replaces that amount with a time-scaled distance. Do not wrap these members in a new loop or class.</p>
<pre><code>    if keys[pygame.K_LEFT]:
        mira_x -= 1
    if keys[pygame.K_RIGHT]:
        mira_x += 1
    if keys[pygame.K_UP]:
        mira_y -= 1
    if keys[pygame.K_DOWN]:
        mira_y += 1</code></pre>
<p><code>-=</code> means “take the current value and subtract this amount”; <code>+=</code> means “add to the current value.” Four independent <code>if</code> statements are intentional. Holding Up and Right moves diagonally because both branches may run. An <code>elif</code> chain would allow only one direction. The y-axis reaches downward in PyGame, as Forge VIII established: Up subtracts from <code>mira_y</code>; Down adds to it. Left and Right change x.</p>
<p>For the moment, keep Forge VIII's fixed <code>screen.blit(mira_sprite, (132, 398))</code> so this lesson can isolate direction updates without claiming they are visible yet. You may print <code>mira_x</code> once while testing, then remove the print. The next thread makes the updates fair across frame rates, and the final thread replaces that fixed blit with the stored position. This staged work is not avoidance; it makes each thread's owner inspectable.</p>
<div class="callout">Position belongs in named variables, not hidden inside a blit tuple. A traveler can change a named position; a hardcoded coordinate cannot remember a step.</div>
<div class="field-notes"><div class="fn-head">FIELD NOTES // DIAGONALS ARE FASTER FOR NOW</div><p>Two branches can change x and y in one frame. That is correct input behavior; normalizing diagonal speed is a later refinement, not a reason to deny the apprentice two-axis travel today.</p></div>
'''

[[lessons.readings]]
label = "PyGame Key — keyboard state polling"
url = "https://www.pygame.org/docs/ref/key.html"

[[lessons.exercises]]
id = "s09-l02-e1"
type = "mc"
points = 26
prompt = "Which direction update respects the PyGame screen axes taught for Duskhaven?"
choices = ["Up adds to mira_y and Left adds to mira_x", "Down subtracts from mira_y and Right subtracts from mira_x", "Up changes mira_x and Left changes mira_y", "Up subtracts from mira_y and Right adds to mira_x"]
answer = 3
hint = "Recall Forge VIII's coordinate map: x grows rightward and y grows downward."
whyWrong = "The wrong choices reverse an axis or swap x with y. Screen y increases downward, so walking up lowers y while walking right raises x."
explain = "Use mira_y -= 1 for Up and mira_x += 1 for Right."

[[lessons.exercises]]
id = "s09-l02-e2"
type = "fill"
points = 25
prompt = "Restore the augmented assignment that moves Mira left by one rehearsal pixel when Left is held."
code = '''if keys[pygame.K_LEFT]:
    mira_x ____ 1'''
answer = "-="
hint = "The x value must become one smaller while preserving the same variable owner."
whyWrong = "+= would move right, = would replace the position with 1, and -= 1 belongs specifically to the existing mira_x value. The left branch subtracts from that value."

[[lessons.exercises]]
id = "s09-l02-w1"
type = "write"
points = 35
prompt = "Mira begins at <code>mira_x = 132.0</code> and <code>mira_y = 398.0</code>. With <code>up_held = True</code> and <code>right_held = True</code>, use two independent <code>if</code> statements to subtract 1 from y and add 1 to x. Print exactly <code>Position: 133.0, 397.0</code>."
expect = '''Position: 133.0, 397.0'''
hint = "Do not use elif: both held values are true, so both coordinate updates must run."
starter = '''mira_x = 132.0
mira_y = 398.0
up_held = True
right_held = True

# Apply each held direction to Mira's stored position.
'''
solution = '''mira_x = 132.0
mira_y = 398.0
up_held = True
right_held = True

if up_held:
    mira_y -= 1
if right_held:
    mira_x += 1

print(f"Position: {mira_x}, {mira_y}")'''

[[lessons.exercises]]
id = "s09-l02-e3"
type = "text"
points = 21
prompt = "Why do the taught movement branches use separate <code>if</code> statements rather than one <code>if</code>/<code>elif</code> chain? Answer with the capability this permits."
answer = "diagonal movement"
accept = ["move diagonally", "diagonal travel", "diagonal"]
hint = "Think about holding Up and Right during the same frame."
whyWrong = "An elif chain stops after its first true branch, so it prevents one of the two axis changes. Separate tests permit both directions to affect a frame."
