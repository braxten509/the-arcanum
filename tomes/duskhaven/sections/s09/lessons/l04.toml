[[lessons]]
id = "s09-l04"
title = "Draw The Moving Mark"
teaches = ["pygame-float-position-render", "pygame-moving-sprite-blit", "pygame-movement-loop-integration"]
body = '''
<p>The traveler now has intent, a position, and a fair step; bind those threads into the visible scene. This is the complete replacement for the <strong>changed setup and loop members only</strong> in canonical <code>main.py</code>. Keep every earlier import, report, class, instance, display, gate, sprite-loading, event branch, <code>screen.fill</code>, rectangle, <code>pygame.display.flip()</code>, and <code>pygame.quit()</code>. Do not create another file, class, window, or loop.</p>
<pre><code>mira_x = 132.0
mira_y = 398.0
mira_speed = 180.0

while running:
    dt = clock.tick(60) / 1000.0

    for event in pygame.event.get():
        if event.type == pygame.QUIT:
            running = False

    keys = pygame.key.get_pressed()
    if keys[pygame.K_LEFT]:
        mira_x -= mira_speed * dt
    if keys[pygame.K_RIGHT]:
        mira_x += mira_speed * dt
    if keys[pygame.K_UP]:
        mira_y -= mira_speed * dt
    if keys[pygame.K_DOWN]:
        mira_y += mira_speed * dt

    screen.fill(night_color)
    pygame.draw.rect(screen, gate_color, (80, 360, 180, 90))
    screen.blit(mira_sprite, (int(mira_x), int(mira_y)))
    pygame.display.flip()</code></pre>
<p>Replace Forge VIII's fixed blit destination with <code>(int(mira_x), int(mira_y))</code>. The position owners remain floats so small delta steps accumulate accurately. <code>int()</code> performs the conversion only at the drawing boundary because the display needs pixel coordinates. Do not convert on every update: repeated rounding would lose the fractional travel that makes time-scaled motion smooth.</p>
<p>The order matters. Tick measures and paces this frame, the event queue still permits clean closing, key state updates the two position owners, then Forge VIII's background-to-actor draw order uses those owners. Flip presents the finished frame. Notice that the old standalone <code>clock.tick(60)</code> after flip is gone; it was replaced, not duplicated. Run the external project in VS Code, click the window, hold each arrow, and verify Mira walks in the correct direction while the gate remains behind her. Release a key and Mira stops. Close normally and ensure the terminal returns cleanly.</p>
<p>This forge deliberately reaches backward: the Boolean loop, nested QUIT branch, RGB scene, rectangle bounds, loaded alpha sprite, and draw order all remain alive. Movement is a new thread woven into the existing realm, not a replacement realm.</p>
<div class="callout">Keep precise state until the last responsible moment. Floats own travel; integers serve the renderer.</div>
<div class="field-notes"><div class="fn-head">FIELD NOTES // NO WALLS YET</div><p>Mira may leave the gate or screen in this forge. Forge XI gives movement collision and world bounds; do not smuggle untaught Rect or clamp rules into this clean movement owner.</p></div>
'''

[[lessons.readings]]
label = "PyGame Surface — blit destination coordinates"
url = "https://www.pygame.org/docs/ref/surface.html#pygame.Surface.blit"

[[lessons.readings]]
label = "PEP 8 — Naming and indentation"
url = "https://peps.python.org/pep-0008/"

[[lessons.exercises]]
id = "s09-l04-e1"
type = "mc"
points = 26
prompt = "Why does the final blit use <code>int(mira_x)</code> and <code>int(mira_y)</code> instead of replacing the stored position owners with integers every movement update?"
choices = ["int makes pygame.key.get_pressed() receive events", "int changes the gate rectangle into a sprite", "The float owners retain fractional delta-time travel; conversion happens only when drawing needs pixel coordinates", "Integers make clock.tick return seconds"]
answer = 2
hint = "Separate the precise state that accumulates travel from the display boundary that needs whole pixels."
whyWrong = "Integer conversion has nothing to do with events, rectangles, or Clock units. The misconception is rounding away small movement steps before they can accumulate in the stored float position."
explain = "Keep mira_x and mira_y as floats, then pass their integer forms only to screen.blit."

[[lessons.exercises]]
id = "s09-l04-e2"
type = "fill"
points = 25
prompt = "Restore the conversion at the established sprite draw boundary."
code = 'screen.blit(mira_sprite, (____(mira_x), int(mira_y)))'
answer = "int"
hint = "This built-in function turns the float x owner into a whole-pixel drawing coordinate."
whyWrong = "float would keep a float rather than perform the taught draw-boundary conversion, while str would make text rather than a coordinate. int matches the companion conversion on mira_y."

[[lessons.exercises]]
id = "s09-l04-e3"
type = "text"
points = 21
prompt = "After the key-driven position updates, which existing PyGame call presents the completed night scene to the real window?"
answer = "pygame.display.flip()"
accept = ["pygame.display.flip", "flip", "pygame.display.flip()"]
hint = "Reach back to Forge VII's presentation boundary after the draw calls."
whyWrong = "screen.blit copies the sprite onto the Surface but does not present it, and clock.tick measures/paces rather than displays. flip reveals the completed frame."

[[lessons.exercises]]
id = "s09-l04-w1"
type = "write"
points = 35
prompt = "A movement owner holds <code>mira_x = 132.75</code> and <code>mira_y = 398.25</code>. Convert each only for a display tuple, then print exactly <code>Draw at: (132, 398)</code>."
expect = '''Draw at: (132, 398)'''
hint = "Call int on each named float, store the two-item tuple, then place that tuple in the f-string."
starter = '''mira_x = 132.75
mira_y = 398.25

# Make a whole-pixel drawing destination without changing the float owners.
'''
solution = '''mira_x = 132.75
mira_y = 398.25

draw_position = (int(mira_x), int(mira_y))

print(f"Draw at: {draw_position}")'''
