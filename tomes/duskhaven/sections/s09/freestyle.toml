[freestyle]
title = "BUILD: Let Mira Walk The Dusk Road"
brief = '''<p>The gate is lit, but its keeper must be able to leave it, apprentice. Extend the one real external <code>duskhaven/main.py</code> from Forge VIII. Retain the earlier terminal work, Player and Enemy owners, one initialized display, one Clock, one close-aware event loop, night field, gate, sprite resource, draw order, flip, and clean quit. Do not create a second program, display, Clock, loop, class, or sprite file.</p><ul><li>Before the existing <code>running = True</code>, define float owners <code>mira_x = 132.0</code>, <code>mira_y = 398.0</code>, and <code>mira_speed = 180.0</code>.</li><li>Replace the old once-per-frame <code>clock.tick(60)</code> member with exactly one <code>dt = clock.tick(60) / 1000.0</code> inside the existing loop before event handling. Do not call <code>tick</code> a second time.</li><li>Keep the existing <code>pygame.QUIT</code> event branch. After it, poll <code>keys = pygame.key.get_pressed()</code> every frame and use <code>pygame.K_LEFT</code>, <code>pygame.K_RIGHT</code>, <code>pygame.K_UP</code>, and <code>pygame.K_DOWN</code> in independent branches. Each held direction must change the appropriate float position by <code>mira_speed * dt</code>; up lowers y and down raises y.</li><li>Keep Forge VIII's background, gate, and sprite layer order. Replace its fixed sprite destination with <code>screen.blit(mira_sprite, (int(mira_x), int(mira_y)))</code> before the existing <code>pygame.display.flip()</code>.</li><li>Save and run from VS Code. Outside the study, focus the titled 960-by-540 window, hold each arrow to verify that Mira moves in the matching direction and stops on release, then close the normal window control and confirm the terminal returns without a traceback.</li></ul>'''
requires = ["tool-edit-save", "tool-run-test", "tool-diagnose", "pygame-running-flag", "pygame-event-queue", "pygame-quit-event", "pygame-clean-quit", "pygame-clock-create", "pygame-fps-cap", "pygame-display-flip", "pygame-rgb-color", "pygame-surface-fill", "pygame-rectangle-draw", "pygame-screen-coordinate", "pygame-surface-blit", "pygame-draw-order", "pygame-scene-layering", "pygame-key-state", "pygame-key-constants", "pygame-event-state-distinction", "pygame-position-owner", "pygame-direction-update", "pygame-directional-key-branches", "pygame-clock-delta-ms", "pygame-delta-seconds", "pygame-frame-rate-independent-movement", "pygame-float-position-render", "pygame-moving-sprite-blit", "pygame-movement-loop-integration"]
reward = 275
xray = "I dock embers for a second loop or tick call, a fixed blit that ignores Mira's stored position, arrow tests placed inside the event loop, reversed vertical movement, or an integer position rounded on every update. I reward one readable loop: time, events, held state, position update, ordered scene, present."

[freestyle.badge]
id = "badge-s09"
name = "DUSK ROAD WALKER"
desc = "Set Mira walking through the living scene at a fair speed."

[[freestyle.rubric]]
criterion = "Owns Mira's Travel State"
weight = 20
desc = "Before running is set True, main.py defines mira_x = 132.0, mira_y = 398.0, and mira_speed = 180.0 as the single float owners of Mira's moving position and speed."

[[freestyle.rubric]]
criterion = "Measures One Fair Frame"
weight = 20
desc = "The one existing Clock is ticked exactly once per loop with dt = clock.tick(60) / 1000.0 before event handling; each movement change uses mira_speed * dt rather than a fixed pixels-per-frame step."

[[freestyle.rubric]]
criterion = "Reads Held Direction Correctly"
weight = 25
desc = "Keeps the existing QUIT event branch and polls pygame.key.get_pressed() after it; independent arrow-key branches move left/right on x and up/down on y with PyGame's downward-growing y axis."

[[freestyle.rubric]]
criterion = "Shows A Moving Ordered Scene"
weight = 20
desc = "Retains the night fill, gate rectangle, sprite, and flip order; blits mira_sprite at (int(mira_x), int(mira_y)); the real titled window moves on held arrows, stops on release, and closes cleanly."

[[freestyle.rubric]]
criterion = "Worldwright's Python Craft"
weight = 15
desc = "Uses descriptive snake_case names such as mira_speed and draw_position, four-space indentation, one space around assignment and arithmetic operators, and no duplicate loop, Clock, display, class, or source file."
