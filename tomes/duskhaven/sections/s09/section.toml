title = "The Wanderer"
build = "Give Mira held-key movement with float positions and delta-time speed in the existing PyGame scene."
brief = '''<p>A painted traveler cannot cross a realm, apprentice. In this forge Mira takes her first steps through the real <strong>Duskhaven</strong> window. You will distinguish a single event from a key that remains held, keep her position as numbers that can move between pixels, and measure each frame's elapsed time so a slow machine does not make her crawl.</p><p>This is an extension of the one external <code>duskhaven/main.py</code>, not a new keyboard demo. The scene from Forge VIII remains: one initialized PyGame display, one clock, one close-aware loop, dark field, gate, and self-made <code>mira_sprite</code>. We replace named loop members without making a second window, sprite, loop, Player class, or Enemy class.</p><div class="callout">The Worldwright's law of travel: events tell you what happened once; key state tells you what is still being held. Time turns speed into distance.</div>'''
