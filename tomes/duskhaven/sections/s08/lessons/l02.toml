[[lessons]]
id = "s08-l02"
title = "Lay The Ember Gate"
teaches = ["pygame-rectangle-draw", "pygame-rectangle-bounds"]
body = '''
<p>A night field gives us contrast; a landmark gives the player a place to read. PyGame can draw a filled rectangle directly onto the existing display Surface. Add the following <strong>members only</strong> after <code>screen.fill(night_color)</code> inside the one existing <code>while running</code> loop and before <code>pygame.display.flip()</code>. Do not create <code>pygame.Rect</code> yet; that collision tool waits for Forge XI. Here a four-number tuple supplies the rectangle's position and size.</p>
<pre><code>    gate_color = (224, 122, 48)
    pygame.draw.rect(screen, gate_color, (80, 360, 180, 90))</code></pre>
<p><code>pygame.draw.rect</code> receives three facts: the Surface to mark, the color, and a rectangle tuple in <code>(x, y, width, height)</code> order. The gate's upper-left corner is at x 80, y 360. It reaches 180 pixels right and 90 pixels down from there. That puts it low in the 540-pixel-tall window, because screen y grows down. The rect call draws immediately on <code>screen</code>; <code>flip()</code>, still owned by Forge VII, later makes the completed frame visible.</p>
<p>The color assignment is inside the loop in this small lesson so the worked code sits beside the drawing call; it is valid, though a later cleanup may move stable colors to top-level setup. More important is the order: <code>fill</code> first, then gate. Reversing those lines paints night vellum over the landmark. A rectangle is not an object class, and these parentheses do not construct an instance. They are simply four positional values for this drawing function.</p>
<p>Run the actual external workspace and look for an ember-orange block near the lower-left portion of the dusk field. If it appears at the top, revisit the y number; if it disappears, check whether <code>screen.fill</code> was accidentally moved below it. If you receive an indentation error, align both draw-space lines with the existing <code>pygame.display.flip()</code> line—inside <code>while</code>, outside the event <code>for</code>.</p>
<div class="callout">The four numbers are not four corners: they are one corner followed by a width and a height. Read them in that order before blaming the canvas.</div>
<div class="field-notes"><div class="fn-head">FIELD NOTES // DRAW NOW, COLLIDE LATER</div><p>The drawing function accepts a rectangle-shaped tuple, but it does not make a collision boundary for the player. Forge XI introduces <code>pygame.Rect</code> and <code>colliderect</code>; keep this visual landmark separate from future world rules.</p></div>
'''

[[lessons.readings]]
label = "PyGame Draw — rect"
url = "https://www.pygame.org/docs/ref/draw.html#pygame.draw.rect"

[[lessons.exercises]]
id = "s08-l02-e1"
type = "mc"
points = 25
prompt = "What does the final tuple <code>(80, 360, 180, 90)</code> mean in the taught <code>pygame.draw.rect</code> call?"
choices = ["left, top, right, bottom", "x, y, width, height", "red, green, blue, alpha", "x1, y1, x2, y2"]
answer = 1
hint = "The first two values locate one corner; the remaining two describe how far the rectangle extends."
whyWrong = "Treating the last values as opposite corners or color channels changes the function's contract. PyGame's rectangle tuple begins at x and y, then supplies width and height."
explain = "The gate begins at (80, 360), then spans 180 pixels wide by 90 pixels high."

[[lessons.exercises]]
id = "s08-l02-d1"
type = "type"
points = 14
reps = 2
prompt = "Retype the two ordered draw-space lines that clear a night frame before laying the ember gate."
code = '''screen.fill(night_color)
pygame.draw.rect(screen, gate_color, (80, 360, 180, 90))'''

[[lessons.exercises]]
id = "s08-l02-e2"
type = "fill"
points = 25
prompt = "Restore the PyGame drawing function that places the gate after the night Surface has been cleared."
code = 'pygame.draw.____(screen, gate_color, (80, 360, 180, 90))'
answer = "rect"
hint = "The missing lowercase shape name is the same one described by the four-value x, y, width, height tuple."
whyWrong = "line would require endpoints, circle has a center and radius, and fill is a Surface method rather than pygame.draw's rectangle function. rect matches the taught tuple."

[[lessons.exercises]]
id = "s08-l02-w1"
type = "write"
points = 35
prompt = "A gate begins at <code>gate_x = 80</code> and is <code>gate_width = 180</code> pixels wide. Compute <code>gate_right</code> from those variables and print exactly <code>Gate right edge: 260</code>. This arithmetic rehearses why a rectangle's width is an extent, not its second x coordinate."
expect = '''Gate right edge: 260'''
hint = "The right edge lies gate_width pixels to the right of gate_x, so add those two named values."
starter = '''gate_x = 80
gate_width = 180

# Compute the gate's right edge from its x position and width.
'''
solution = '''gate_x = 80
gate_width = 180
gate_right = gate_x + gate_width
print(f"Gate right edge: {gate_right}")'''

