[[lessons]]
id = "s08-l04"
title = "Order The Living Frame"
teaches = ["pygame-draw-order", "pygame-scene-layering"]
body = '''
<p>We now have all the marks of a first scene, but the loop must weave them in a stable order. Add no new window, class, or loop. In the existing <code>while running</code> loop, keep Forge VII's event block first. Then use this complete replacement for the current <strong>draw members only</strong>, placed after that event block and before the existing <code>pygame.display.flip()</code>. Leave <code>clock.tick(60)</code> after flip and <code>pygame.quit()</code> after the loop.</p>
<pre><code>    screen.fill(night_color)
    pygame.draw.rect(screen, gate_color, (80, 360, 180, 90))
    screen.blit(mira_sprite, (132, 398))</code></pre>
<p>PyGame draws in order: a later mark can cover an earlier mark. The fill must be first because it is the full background. The gate follows because it sits on the road. Mira's blit follows the gate so her mark remains visible over it. Finally <code>pygame.display.flip()</code> presents the finished Surface. This is a tiny <strong>scene layering</strong> rule: background, landmark, actor, present. Forge IX will change Mira's position; it will not invent a new way to draw her.</p>
<p>Notice what has not changed. The event queue still hears the close control before drawing. The clock still paces after presentation. <code>mira_sprite</code> was loaded once before the loop, not reloaded here. And the terminal reports from the early forges, plus Player and Enemy ownership from Forge VI, remain in the same canonical <code>main.py</code>. A growing game is not a succession of discarded demos.</p>
<p>Run the external project and inspect the picture. A dark 960-by-540 field, a warm gate at the lower-left, and a small warm square within it are enough evidence for this forge. If the square vanishes, confirm its <code>blit</code> comes after the rectangle. If the gate vanishes, confirm <code>fill</code> comes before it. If closing the window fails, do not diagnose drawing first: return to the nested event indentation from Forge VII.</p>
<p>This lesson reaches backward on purpose. The game loop is a repeated branch-and-iteration boundary; colors and positions are stored values; the loaded sprite is an object-like resource with a method call. You are using older threads together, not abandoning them when a new tool appears.</p>
<div class="callout">A picture is not a pile of calls. It is an order of ownership: one Surface receives layers, then one presentation call reveals them.</div>
<div class="field-notes"><div class="fn-head">FIELD NOTES // THE NEXT THREAD MOVES, NOT REPAINTS</div><p>Forge IX introduces held-key state and time-scaled movement. It will update a position value before this existing drawing sequence; the background, gate, sprite, flip, and clock order remain the loom around that new behavior.</p></div>
'''

[[lessons.readings]]
label = "PyGame Display — presenting the completed Surface"
url = "https://www.pygame.org/docs/ref/display.html#pygame.display.flip"

[[lessons.exercises]]
id = "s08-l04-e1"
type = "mc"
points = 26
prompt = "Which frame order keeps Mira visible on top of the gate while still presenting a fresh night background?"
choices = ["blit Mira, draw gate, fill night, flip", "fill night, draw gate, blit Mira, flip", "flip, fill night, blit Mira, draw gate", "draw gate, flip, fill night, blit Mira"]
answer = 1
hint = "Start with the operation that touches every pixel, then layer the landmark, then the actor, and present last."
whyWrong = "Drawing the full fill later erases prior marks, drawing the gate after Mira covers her, and flip cannot reveal work that has not happened. The visible scene requires background, gate, sprite, then presentation."
explain = "Each later drawing call overlays the earlier Surface contents, so the actor must be blitted after the gate and before flip()."

[[lessons.exercises]]
id = "s08-l04-e2"
type = "fill"
points = 25
prompt = "Restore the existing display call that must follow all drawing calls to show the completed frame."
code = 'pygame.display.____()'
answer = "flip"
hint = "Forge VII placed this no-argument presentation call immediately before clock.tick(60)."
whyWrong = "set_mode creates the one display during setup, fill paints the Surface earlier in the frame, and tick controls pacing. flip is the established call that presents completed drawing."

[[lessons.exercises]]
id = "s08-l04-w1"
type = "write"
points = 35
prompt = "Rehearse the layer order with the names <code>&quot;night&quot;</code>, <code>&quot;gate&quot;</code>, and <code>&quot;mira&quot;</code>. Start with <code>layers = []</code>, append those three names in background-to-actor order, then use a <code>for</code> loop to print exactly these three lines: <code>Layer: night</code>, <code>Layer: gate</code>, and <code>Layer: mira</code>."
expect = '''Layer: night
Layer: gate
Layer: mira'''
hint = "Append night before gate before mira, then let the earlier list-for loop print each layer with one f-string."
starter = '''layers = []

# Add the three scene layers in draw order, then report each layer.
'''
solution = '''layers = []
layers.append("night")
layers.append("gate")
layers.append("mira")

for layer in layers:
    print(f"Layer: {layer}")'''

[[lessons.exercises]]
id = "s08-l04-e3"
type = "text"
points = 21
prompt = "Before the PyGame setup, Forge VI keeps Mira's object report in the canonical main path. What call prints the stored status from that existing Player instance?"
answer = "player.report_status()"
accept = ["player.report_status", "report_status()"]
hint = "Use the Player instance name from Forge VI, then the method name joined by a dot and parentheses."
whyWrong = "Player is the blueprint, while player is Mira's constructed instance; print alone does not use the object's established reporting behavior. The existing instance call is player.report_status()."
