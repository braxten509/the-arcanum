[[lessons]]
id = "s08-l03"
title = "Bind A Sprite To The Road"
teaches = ["pygame-placeholder-surface", "pygame-self-made-sprite-file", "pygame-image-load", "pygame-alpha-convert", "pygame-surface-blit"]
body = '''
<p>A rectangle can mark a gate, but a character needs a reusable image. Do not fetch random art or silently depend on a file you were never given. Before the existing <code>running = True</code> line, after the display setup, add this complete new top-level asset block. It makes a legal placeholder PNG from PyGame itself, then loads the file exactly as a future hand-drawn sprite will be loaded.</p>
<pre><code>placeholder_sprite = pygame.Surface((32, 32), pygame.SRCALPHA)
placeholder_sprite.fill((224, 122, 48))
pygame.image.save(placeholder_sprite, "mira.png")
mira_sprite = pygame.image.load("mira.png").convert_alpha()</code></pre>
<p><code>pygame.Surface((32, 32), pygame.SRCALPHA)</code> creates an off-screen 32-by-32 canvas with an alpha channel. The capitalized <code>SRCALPHA</code> flag permits transparency; <code>convert_alpha()</code> keeps that alpha information when the saved PNG returns from <code>pygame.image.load</code>. Here the whole placeholder is orange, but this path means the commission remains self-contained. Later, you may replace <code>mira.png</code> with artwork you made or are licensed to use, keeping the filename and loading line stable.</p>
<p>Next add this single member inside the existing loop after the gate <code>pygame.draw.rect(...)</code> line and before <code>pygame.display.flip()</code>:</p>
<pre><code>    screen.blit(mira_sprite, (132, 398))</code></pre>
<p><code>blit</code> copies one Surface onto another. Its tuple is a destination <code>(x, y)</code>, not width and height. Position <code>(132, 398)</code> begins inside the gate that starts at <code>(80, 360)</code> and extends to x 260, y 450. That is deliberate coordinate reasoning, not a lucky number. The background still clears, the gate still draws, and now the sprite draws last before flip.</p>
<p>Run <code>main.py</code> in VS Code. It will create <code>mira.png</code> in the same workspace as the program, then show a small orange square over the orange gate. A missing-file error means the save or load path was changed; restore the exact matching filename. Do not put this file generation inside the loop: rewriting an asset sixty times a second is a loose, wasteful thread.</p>
<div class="callout">A sprite file is a resource; a blit is a per-frame placement. Generate/load once, then draw many times.</div>
<div class="field-notes"><div class="fn-head">FIELD NOTES // ALPHA IS PART OF THE IMAGE</div><p>Transparency is stored with image pixels, not guessed from an orange color. <code>convert_alpha()</code> is therefore paired with the transparent placeholder Surface, while a plain screen fill needs only RGB.</p></div>
'''

[[lessons.readings]]
label = "PyGame Image — load and save"
url = "https://www.pygame.org/docs/ref/image.html"

[[lessons.readings]]
label = "PyGame Surface — blit and convert_alpha"
url = "https://www.pygame.org/docs/ref/surface.html#pygame.Surface.blit"

[[lessons.exercises]]
id = "s08-l03-e1"
type = "text"
points = 21
prompt = "Which Surface method copies <code>mira_sprite</code> onto the existing display at a destination coordinate?"
answer = "blit"
accept = ["screen.blit", "screen.blit()", "blit()"]
hint = "It is called on screen and takes the image followed by its (x, y) destination."
whyWrong = "fill covers a Surface with one color, flip presents the display, and load reads a file. blit is the operation that copies the sprite onto screen."

[[lessons.exercises]]
id = "s08-l03-d1"
type = "type"
points = 14
reps = 2
prompt = "Retype the self-contained asset boundary: make the transparent placeholder, save its PNG, load it with alpha, and place it on screen."
code = '''placeholder_sprite = pygame.Surface((32, 32), pygame.SRCALPHA)
placeholder_sprite.fill((224, 122, 48))
pygame.image.save(placeholder_sprite, "mira.png")
mira_sprite = pygame.image.load("mira.png").convert_alpha()
screen.blit(mira_sprite, (132, 398))'''

[[lessons.exercises]]
id = "s08-l03-e2"
type = "fill"
points = 25
prompt = "Restore the conversion method that preserves the PNG's alpha channel after it is loaded."
code = 'mira_sprite = pygame.image.load("mira.png").____()'
answer = "convert_alpha"
hint = "The missing method includes the word alpha and is called after load(...), not on the filename string."
whyWrong = "convert has no explicit alpha preservation, SRCALPHA is the Surface creation flag, and fill only paints pixels. convert_alpha() prepares the loaded image with transparency information."

[[lessons.exercises]]
id = "s08-l03-e3"
type = "mc"
points = 25
prompt = "Why do the placeholder creation, save, and load lines belong before <code>running = True</code> rather than inside the frame loop?"
choices = ["They are event messages that must be drained every frame", "They need a larger y coordinate than the gate", "They create/load one stable resource; repeating file work every frame is unnecessary", "They must occur after pygame.quit() so the file can close"]
answer = 2
hint = "Separate one-time resource preparation from the repeated blit that draws the prepared resource."
whyWrong = "Asset setup is not an event or coordinate operation, and pygame.quit() ends the program. The file and loaded Surface are stable resources, so recreating them on every frame wastes work."
explain = "Prepare mira_sprite once after display setup, then blit that same object during each frame."

[[lessons.exercises]]
id = "s08-l03-w1"
type = "write"
points = 35
prompt = "Mira stands at <code>sprite_x = 132</code>, <code>sprite_y = 398</code> inside a 960-by-540 display. Use comparisons and an <code>if</code>/<code>else</code> branch to set <code>placement</code> to <code>&quot;on road&quot;</code> when both coordinates are within the screen (x less than 960 and y less than 540); otherwise use <code>&quot;beyond road&quot;</code>. Print exactly <code>Sprite placement: on road</code>."
expect = '''Sprite placement: on road'''
hint = "Use the earlier comparison and branch skills: both coordinate tests are true for 132 and 398, so the first branch supplies placement."
starter = '''sprite_x = 132
sprite_y = 398

# Set placement from both screen-bound comparisons, then report it.
'''
solution = '''sprite_x = 132
sprite_y = 398

if sprite_x < 960 and sprite_y < 540:
    placement = "on road"
else:
    placement = "beyond road"

print(f"Sprite placement: {placement}")'''
