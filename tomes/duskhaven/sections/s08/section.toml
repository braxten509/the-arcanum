build = "Give Duskhaven its first visible night field, drawn landmarks, and a self-made sprite on the existing display Surface."
brief = '''<p>A frame that shows nothing is only a promise, apprentice. In this forge you give the existing Duskhaven window a night sky, a firelit gate, and Mira's first small mark on the road. The work is real PyGame: pixels are placed on the one <code>screen</code> Surface before the loop presents it.</p><p>Keep every earlier owner in the canonical external <code>duskhaven/main.py</code>: the import, ledgers, functions, Player and Enemy classes, instances, <code>pygame.init()</code>, one display, one <code>clock</code>, and one close-aware loop. We add members at the named locations; we do not start a second game file or window. A tiny PNG is generated by the program itself, so no borrowed art is required.</p><div class="callout">The Worldwright's law of light: clear the canvas, draw the world, place the sprite, then flip the frame. A pixel placed after the flip belongs to tomorrow.</div>'''

