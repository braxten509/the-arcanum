[freestyle]
title = "BUILD: Light Duskhaven's First Scene"
brief = '''<p>The dusk road must now be visible, apprentice. Extend the one real external <code>duskhaven/main.py</code> from Forge VII; retain its earlier terminal work, Player and Enemy owners, window setup, event queue, one loop, <code>flip()</code>, <code>tick(60)</code>, and one cleanup call. Do not make a second program, display, loop, or class.</p><ul><li>After the existing display setup but before <code>running = True</code>, define <code>night_color = (14, 18, 38)</code>, create a 32-by-32 transparent <code>placeholder_sprite</code> with <code>pygame.Surface((32, 32), pygame.SRCALPHA)</code>, fill it ember orange, save it as <code>mira.png</code>, then load it into <code>mira_sprite</code> with <code>pygame.image.load("mira.png").convert_alpha()</code>.</li><li>Inside the existing <code>while running</code> loop, after event handling and before <code>pygame.display.flip()</code>, clear <code>screen</code> with <code>night_color</code>.</li><li>In that same draw space, use <code>pygame.draw.rect</code> to make one warm-orange gate rectangle at <code>(80, 360, 180, 90)</code>, then use <code>screen.blit(mira_sprite, (132, 398))</code>. The sprite position must sit inside the gate: x moves right and the larger y value places it lower on the window.</li><li>Save and run from VS Code. Observe the titled 960-by-540 window outside the study, verify the dark field, orange gate, and orange Mira mark appear together, then close the normal window control and confirm the terminal returns without a traceback.</li></ul>'''
requires = ["tool-edit-save", "tool-run-test", "tool-diagnose", "traceback-locate", "pygame-import-check", "python-tuple-value", "python-variable-store", "python-while-condition", "python-for-range-loop", "python-class-declaration", "python-player-enemy-wiring", "pygame-init", "pygame-display-surface", "pygame-window-caption", "pygame-running-flag", "pygame-event-queue", "pygame-quit-event", "pygame-clean-quit", "pygame-display-flip", "pygame-clock-create", "pygame-fps-cap", "pygame-window-loop-wiring", "pygame-rgb-color", "pygame-surface-fill", "pygame-screen-coordinate", "pygame-rectangle-draw", "pygame-rectangle-bounds", "pygame-placeholder-surface", "pygame-self-made-sprite-file", "pygame-image-load", "pygame-alpha-convert", "pygame-surface-blit", "pygame-draw-order", "pygame-scene-layering"]
reward = 250
xray = "I dock embers for a second display or loop, drawing after flip(), a background that is never cleared, a missing image file, or a sprite positioned with the y-axis imagined upside down. I reward one canonical main.py: setup once, then events, fill, landmark, sprite, flip, tick, and clean quit."

[freestyle.badge]
id = "badge-s08"
name = "LAMPLIGHT PAINTER"
desc = "Lit Duskhaven's first visible road without borrowing an asset."

[[freestyle.rubric]]
criterion = "Makes A Self-Contained Sprite"
weight = 20
desc = "Before the existing running flag, main.py creates a 32-by-32 SRCALPHA placeholder Surface, fills it ember orange, saves mira.png, and loads it with pygame.image.load(...).convert_alpha() into mira_sprite."

[[freestyle.rubric]]
criterion = "Draws The Ordered Night Scene"
weight = 25
desc = "Inside the one existing loop after event handling and before flip(), screen.fill(night_color) precedes one pygame.draw.rect gate at (80, 360, 180, 90), which precedes screen.blit(mira_sprite, (132, 398))."

[[freestyle.rubric]]
criterion = "Uses Coordinates With Intent"
weight = 20
desc = "Defines night_color as (14, 18, 38), uses the taught RGB and rectangle tuple order, and places the sprite within the gate with rightward x and downward-growing y coordinates."

[[freestyle.rubric]]
criterion = "Keeps The Growing Realm Alive"
weight = 20
desc = "The canonical external main.py retains its earlier PyGame setup, Player and Enemy work, one responsive event loop, flip(), tick(60), and pygame.quit(); the titled 960-by-540 window shows all three scene elements and returns cleanly after normal close."

[[freestyle.rubric]]
criterion = "Worldwright's Python Craft"
weight = 15
desc = "Uses stable snake_case names such as night_color and mira_sprite, four-space loop indentation, and one readable draw order without duplicate files, displays, loops, classes, or untaught external artwork."

