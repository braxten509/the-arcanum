[[lessons]]
id = "s13-l04"
title = "Let Each Realm Hear Its Own Keys"
teaches = ["scene-active-input-routing", "scene-overworld-gate", "scene-card-loop-integration"]
body = '''
<p>Now stitch the doors into the one living frame, apprentice. Do not add a loop. In the existing <code>pygame.KEYDOWN</code> branch from Forge XII, replace only its dialogue-condition ladder with the following complete ladder; preserve the outer QUIT branch and the surrounding <code>for event in pygame.event.get()</code>. These branches read <code>event.key</code> only after KEYDOWN, and each scene admits only its own threshold.</p>
<pre><code>if scene == SCENE_TITLE and event.key == pygame.K_RETURN:
    scene = set_scene(SCENE_OVERWORLD)
elif scene == SCENE_OVERWORLD and event.key == pygame.K_m:
    scene = set_scene(SCENE_MENU)
elif scene == SCENE_MENU and event.key == pygame.K_b:
    scene = set_scene(SCENE_BATTLE)
elif scene in (SCENE_MENU, SCENE_BATTLE) and event.key == pygame.K_ESCAPE:
    scene = set_scene(SCENE_OVERWORLD)
elif scene == SCENE_OVERWORLD and event.key == pygame.K_e and is_near_npc(mira_rect, npc_rect):
    dialogue_active, dialogue_index = begin_dialogue()
elif scene == SCENE_OVERWORLD and event.key == pygame.K_SPACE and dialogue_active:
    dialogue_active, dialogue_index = advance_dialogue(dialogue_index, dialogue_lines)</code></pre>
<p><code>in</code> checks whether the current scene matches either value in the tuple, so Escape has one shared home. The dialogue branches now state the overworld condition explicitly; a Space on the title must not advance an invisible conversation. PyGame's <code>K_RETURN</code>, <code>K_m</code>, <code>K_b</code>, and <code>K_ESCAPE</code> are named key constants, just like the arrows and E/Space already taught.</p>
<p>Next, gate the existing held-arrow updates, camera calculations, <code>draw_world</code>, wall/NPC/Mira marks, and dialogue-panel block together under <code>if scene == SCENE_OVERWORLD:</code>. This is an indentation-only integration of their existing members: preserve all of their statements and their order. Immediately after that guarded block and before the one existing <code>pygame.display.flip()</code>, add this new members-only branch:</p>
<pre><code>if scene != SCENE_OVERWORLD:
    draw_scene_card(screen, scene, scene_font)</code></pre>
<p>Now test the real external game: title → Enter → road → M → menu → B → preview → Escape → road. Reopen Ilyra with E on the road, and hold an arrow while a card is visible: Mira must not move. If an event crashes on close, ensure QUIT remains above KEYDOWN. If a card appears over the road instead of replacing it, inspect whether <code>draw_scene_card</code>'s fill still comes before its blits.</p>
<div class="callout">Input is part of a scene. A key with no current meaning should do nothing, not tug on a hidden realm.</div>
<div class="field-notes"><div class="fn-head">FIELD NOTES // PRESERVE THE OWNERS</div><p>The overworld block does not rewrite collision, camera, dialogue, or drawing; it merely decides when their established owners may run. That narrow gate keeps the next forge free to replace the preview with real battle behavior.</p></div>
'''

[[lessons.readings]]
label = "PyGame Key — key constants"
url = "https://www.pygame.org/docs/ref/key.html"

[[lessons.exercises]]
id = "s13-l04-e1"
type = "mc"
points = 29
prompt = "Why must the E and Space dialogue branches include <code>scene == SCENE_OVERWORLD</code> after scene cards are introduced?"
choices = ["It makes pygame.K_e a held-arrow key", "It prevents title, menu, or preview keypresses from changing hidden dialogue state", "It changes npc_rect into a screen-space Rect", "It lets pygame.QUIT have a key attribute"]
answer = 1
hint = "Ask whether Ilyra's road interaction should be meaningful while a full title or menu card is the active realm."
whyWrong = "Key roles, Rect coordinates, and QUIT event attributes do not change here. The guard prevents an inactive overworld system from reacting behind another scene."
explain = "A scene controls both its drawing and the discrete actions that are currently allowed."

[[lessons.exercises]]
id = "s13-l04-e2"
type = "fill"
points = 27
prompt = "Restore the named key constant that carries the apprentice from the initial title card to the overworld."
code = 'if scene == SCENE_TITLE and event.key == pygame.____:'
answer = "K_RETURN"
hint = "The title card literally instructs Press Enter; PyGame names the Enter key with this all-caps constant."
whyWrong = "K_SPACE advances dialogue, K_ESCAPE returns from cards, and K_m opens the menu only from the road. K_RETURN is the title threshold's named control."

[[lessons.exercises]]
id = "s13-l04-e3"
type = "text"
points = 24
prompt = "Which scene is allowed to run the established held-arrow movement and camera calculations?"
answer = "SCENE_OVERWORLD"
hint = "It is the realm containing Mira, walls, the map, and Ilyra rather than a full-screen card."
whyWrong = "Title, menu, and battle preview deliberately freeze road simulation. SCENE_OVERWORLD is the one state that retains the earlier movement and camera owners."

[[lessons.exercises]]
id = "s13-l04-d1"
type = "type"
points = 14
reps = 2
prompt = "Retype the shared Escape threshold that returns either non-road card to the existing overworld."
code = '''elif scene in (SCENE_MENU, SCENE_BATTLE) and event.key == pygame.K_ESCAPE:
    scene = set_scene(SCENE_OVERWORLD)'''

[[lessons.exercises]]
id = "s13-l04-w1"
type = "write"
points = 38
prompt = "A key rehearsal receives <code>scene = &quot;menu&quot;</code> and <code>key = &quot;b&quot;</code>. Use an if/else to change scene to <code>&quot;battle&quot;</code> only for that menu-and-B combination, then print exactly <code>Scene after key: battle</code>. Use both named inputs in the condition."
expect = '''Scene after key: battle'''
hint = "Combine scene == menu and key == b with and; assign the supplied battle destination only in the true branch."
starter = '''scene = "menu"
key = "b"

# Route this rehearsal key only when the current realm is the menu.
'''
solution = '''scene = "menu"
key = "b"

if scene == "menu" and key == "b":
    scene = "battle"
else:
    scene = scene

print(f"Scene after key: {scene}")'''
