[[lessons]]
id = "s13-l01"
title = "Name The Realm That Exists"
teaches = ["scene-state-owner", "scene-name-constants", "scene-current-realm-test"]
body = '''
<p>A scene is not a new window, apprentice. It is the answer to one durable question: which realm should the next frame draw and accept input for? Give that answer one owner in canonical <code>main.py</code>. Add these complete new top-level members after Forge XII's <code>dialogue_font</code> and before <code>running = True</code>. They are strings because the names are human-readable, and the all-caps constants keep the permitted spellings in one visible place.</p>
<pre><code>SCENE_TITLE = "title"
SCENE_OVERWORLD = "overworld"
SCENE_MENU = "menu"
SCENE_BATTLE = "battle"

scene = SCENE_TITLE</code></pre>
<p><code>scene</code> sits outside <code>while running:</code> for the same reason <code>dialogue_active</code> does: tomorrow's frame must remember today's transition. Beginning at the title is deliberate. The old overworld has not been deleted; it simply waits until the apprentice crosses its first threshold. Do not write bare variations such as <code>"over_world"</code> in later branches. Compare against the named constant, so a misspelling has one obvious owner instead of four hidden threads.</p>
<p>Inside a later branch, <code>scene == SCENE_OVERWORLD</code> is a Boolean question, not an assignment. Forge III established <code>==</code> for comparison; a lone <code>=</code> changes a value and cannot stand where Python expects a condition. This question will guard the old map, wall, NPC, Mira, and dialogue work. Title, menu, and battle are states of the same game, not copies of the project.</p>
<p>Save and run the real PyGame program after adding only these owners. The screen still looks like the overworld for one thread because rendering will change later; that is honest staging. If Python reports a name error, verify every constant was placed before the loop. If it reports an indentation error, these are top-level owners and therefore begin at the left margin.</p>
<div class="callout">Name the realms once. A scene value that resets inside the frame loop is a door painted on a wall.</div>
<div class="field-notes"><div class="fn-head">FIELD NOTES // CONSTANTS ARE A SMALL FENCE</div><p>Python does not lock an uppercase variable, but the convention marks a value intended to be reused unchanged. It makes the allowed scene vocabulary visible before the transition code grows.</p></div>
'''

[[lessons.readings]]
label = "Python Tutorial — strings and comparisons"
url = "https://docs.python.org/3/tutorial/introduction.html#strings"

[[lessons.exercises]]
id = "s13-l01-d1"
type = "type"
points = 14
reps = 2
prompt = "Retype the complete named scene vocabulary and its title-first durable owner."
code = '''SCENE_TITLE = "title"
SCENE_OVERWORLD = "overworld"
SCENE_MENU = "menu"
SCENE_BATTLE = "battle"

scene = SCENE_TITLE'''

[[lessons.exercises]]
id = "s13-l01-e1"
type = "mc"
points = 28
prompt = "Why does <code>scene = SCENE_TITLE</code> belong before <code>while running:</code> rather than as the first line inside it?"
choices = ["A title scene needs a second pygame.display Surface", "A per-frame assignment would force the scene back to title before a later frame can remember Enter", "PyGame constants may only appear before pygame.init()", "Strings cannot be compared inside a while loop"]
answer = 1
hint = "Consider what must survive from the frame where Enter is pressed to the frame that draws the road."
whyWrong = "The display remains singular, constants may be used after initialization, and strings compare normally in loops. The real mistake is resetting durable scene state on every frame."
explain = "A top-level scene owner carries the chosen realm forward until a guarded key transition changes it."

[[lessons.exercises]]
id = "s13-l01-e2"
type = "fill"
points = 25
prompt = "Restore the comparison operator that asks whether the current scene is the overworld before its old drawing path runs."
code = 'if scene ____ SCENE_OVERWORLD:'
answer = "=="
hint = "Use Forge III's two-character equality question, not the one-character assignment mark."
whyWrong = "A single equals sign changes a variable and is invalid as this condition; != asks the opposite question. == is the Boolean comparison that admits only the overworld."

[[lessons.exercises]]
id = "s13-l01-e3"
type = "text"
points = 23
prompt = "What exact all-caps owner names the scene value used before the apprentice has pressed Enter?"
answer = "SCENE_TITLE"
hint = "It is the first named constant in the four-realm vocabulary, and scene receives it at setup."
whyWrong = "SCENE_OVERWORLD is the road after entry, while scene is the changing owner rather than the fixed vocabulary constant. The title constant marks the initial realm."

[[lessons.exercises]]
id = "s13-l01-w1"
type = "write"
points = 35
prompt = "A title-first game has <code>scene = &quot;title&quot;</code> and the named road value <code>overworld = &quot;overworld&quot;</code>. Compare the two supplied values and print exactly <code>Draw overworld: False</code>. Compute the Boolean rather than printing the target literal."
expect = '''Draw overworld: False'''
hint = "Store the equality result of scene and overworld, then put that Boolean in the f-string."
starter = '''scene = "title"
overworld = "overworld"

# Decide whether the old map renderer may draw this frame.
'''
solution = '''scene = "title"
overworld = "overworld"

draw_overworld = scene == overworld

print(f"Draw overworld: {draw_overworld}")'''
