[freestyle]
title = "BUILD: Hang Doors Between Duskhaven's Realms"
brief = '''<p>The road has a beginning and a pause now, apprentice. Extend the one real external <code>duskhaven/main.py</code> from Forge XII. Preserve its map, camera, walls, bounds, float Mira position, NPC, dialogue helpers and panel, one display, one Clock/tick, QUIT branch, and clean quit. Do not create a second file, loop, display, Clock, class, terminal <code>input()</code>, or combat-stat system.</p><ul><li>Define <code>SCENE_TITLE</code>, <code>SCENE_OVERWORLD</code>, <code>SCENE_MENU</code>, and <code>SCENE_BATTLE</code> as the exact strings <code>"title"</code>, <code>"overworld"</code>, <code>"menu"</code>, and <code>"battle"</code>. Own <code>scene = SCENE_TITLE</code> outside the loop and define <code>set_scene(next_scene)</code> that returns its argument.</li><li>Define one reusable <code>scene_font = pygame.font.Font(None, 42)</code> and <code>draw_scene_card(screen, scene, scene_font)</code>. It must draw a full title screen whose rendered text includes <code>Duskhaven</code> and <code>Press Enter</code>, a visible menu card that includes <code>M — menu</code> and <code>B — battle preview</code>, and a visible battle-placeholder card that includes <code>Battle preview</code> and <code>Esc — return</code>. It must not invent combat damage, enemies, or stats before Forge XIV.</li><li>Route discrete <code>pygame.KEYDOWN</code> actions in the existing event queue by the active scene: Enter changes title to overworld; M changes overworld to menu; B changes menu to battle; Escape changes menu or battle to overworld. Keep E and Space dialogue actions only in the overworld and retain <code>pygame.key.get_pressed()</code> arrows only for overworld movement.</li><li>When the scene is overworld, retain the established movement, camera, map/wall/NPC/Mira drawing, and dialogue panel. When it is title, menu, or battle, do not update Mira from held arrows; instead draw the appropriate scene card before the one existing <code>pygame.display.flip()</code>.</li><li>Run it from VS Code outside this study. Verify the game opens at the title, Enter reaches the working overworld, M reaches the menu, B reaches the battle preview, Escape returns to the overworld from both menu and preview, Ilyra still opens with E only on the road, arrows do not move Mira while a card is active, and the normal window close returns without a traceback.</li></ul>'''
requires = ["python-string-value", "python-function-define", "python-function-parameter", "python-return-value", "python-if-branch", "python-elif-else-branch", "pygame-event-queue", "pygame-quit-event", "pygame-clean-quit", "pygame-key-state", "pygame-key-constants", "pygame-event-state-distinction", "pygame-surface-blit", "pygame-draw-order", "pygame-display-flip", "pygame-font-owner", "pygame-font-render-surface", "pygame-dialogue-event-wiring", "pygame-interaction-gate", "pygame-dialogue-panel-render", "scene-state-owner", "scene-name-constants", "scene-transition-helper", "scene-card-renderer", "scene-active-input-routing", "scene-overworld-gate"]
reward = 390
xray = "I dock embers for a second loop, a scene value reset every frame, unguarded keys that open a menu from the title, Mira moving behind a card, dialogue reachable outside the overworld, or a pretend battle system that claims Forge XIV's work. I reward one named scene owner, explicit thresholds, readable cards, and an overworld whose older seams still hold."

[freestyle.badge]
id = "badge-s13"
name = "THRESHOLD KEEPER"
desc = "Set true doors between the road, its menu, and the promise of battle."

[[freestyle.rubric]]
criterion = "Owns Named Scene State"
weight = 20
desc = "main.py defines the four exact scene constants, starts scene at SCENE_TITLE outside the loop, and uses set_scene(next_scene) to return intentional next-state values rather than resetting or duplicating the game loop."

[[freestyle.rubric]]
criterion = "Draws Readable Realm Cards"
weight = 20
desc = "Defines scene_font and draw_scene_card; the title visibly says Duskhaven and Press Enter, the menu visibly says M — menu and B — battle preview, and the battle placeholder visibly says Battle preview and Esc — return without inventing Forge XIV combat mechanics."

[[freestyle.rubric]]
criterion = "Routes Threshold Keys By Scene"
weight = 25
desc = "The existing KEYDOWN path routes Enter title-to-overworld, M overworld-to-menu, B menu-to-battle, and Escape menu/battle-to-overworld; E/Space dialogue remains gated to the overworld and event.key is read only after KEYDOWN."

[[freestyle.rubric]]
criterion = "Preserves The Living Overworld"
weight = 20
desc = "Only the overworld runs held-arrow movement, camera, map/wall/NPC/Mira drawing, and the dialogue panel; title/menu/battle draw cards before the existing one flip, and the original QUIT/Clock/one-display boundaries still work."

[[freestyle.rubric]]
criterion = "Worldwright's Python Craft"
weight = 15
desc = "Uses descriptive snake_case function and variable names, UPPER_CASE scene constants, four-space indentation in functions and branches, one space around operators, and extends the one main.py without duplicate files, loops, displays, classes, or blocking input()."
