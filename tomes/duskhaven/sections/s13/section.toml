codename = "FORGE XIII // REALMS & THRESHOLDS"
short = "Realms & Thresholds"
title = "Realms & Thresholds"
build = "Give the one Duskhaven loop named scenes and deliberate, visible thresholds between them."
brief = '''<p>A world needs doors, apprentice. Duskhaven has learned to walk, collide, and speak; now it must know which realm it is showing. In this forge you will add one scene owner, a small transition helper, separate title/menu/battle-placeholder drawings, and key routes that are valid only in their current realm.</p><p>This is still one real external <code>duskhaven/main.py</code>, one PyGame display, one Clock, and one frame loop. The established overworld—map, camera, walls, Mira, Ilyra, dialogue, held arrows, and normal close—remains its own craft. A scene manager is not an engine or a second program; it is a string of durable state plus guarded branches in the loop already alive.</p><div class="callout">A threshold changes what the next frame is allowed to hear and paint. It must not erase the road beneath it.</div>'''
