title = "Trial by Steel"
build = "Replace the battle preview with stat-owned, turn-based combat that resolves a win or loss."
brief = '''<p>The preview card has done its honest work, apprentice. Now it must become a trial that can wound, answer, and end. This forge preserves Duskhaven's one window, one Clock, one event queue, scene doors, map, collision, and dialogue; then gives its existing <code>Player</code> and <code>Enemy</code> owners attack and defense, a damage rule, a Space-key turn, and a visible battle screen.</p><p>This is real PyGame work in the same external <code>duskhaven/main.py</code>. Battle is not terminal input and not a second loop. The menu's B threshold still enters <code>SCENE_BATTLE</code>; while that realm is active, Space makes one player strike and, only if the enemy survives, one answering enemy strike. A winner remains visible and further Space presses do not keep changing health.</p><div class="callout">A turn is a durable consequence: calculate it from the two objects that own the facts, store the wound, then draw the new state.</div>'''
