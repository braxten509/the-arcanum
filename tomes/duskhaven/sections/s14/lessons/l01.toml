[[lessons]]
id = "s14-l01"
title = "Give The Combatants Their Measure"
teaches = ["combat-stat-owner", "combat-health-clamp", "combat-object-stat-report"]
body = '''
<p>Steel needs facts before spectacle, apprentice. Forge VI gave <code>Player</code> and <code>Enemy</code> their own <code>name</code>, <code>health</code>, status report, and wound method. Replace each existing class at its current location in canonical <code>main.py</code> with these complete replacements. Do not create a second class or a loose <code>player_attack</code> variable: health, attack, and defense belong to the creature they describe.</p>
<pre><code>class Player:
    def __init__(self, name, health, attack, defense):
        self.name = name
        self.health = health
        self.attack = attack
        self.defense = defense

    def report_status(self):
        print(f"{self.name} has {self.health} HP.")

    def take_damage(self, damage):
        self.health = self.health - damage
        if self.health &lt; 0:
            self.health = 0


class Enemy:
    def __init__(self, name, health, attack, defense):
        self.name = name
        self.health = health
        self.attack = attack
        self.defense = defense

    def report_status(self):
        print(f"{self.name} has {self.health} HP.")

    def take_damage(self, damage):
        self.health = self.health - damage
        if self.health &lt; 0:
            self.health = 0</code></pre>
<p>Replace the old construction lines with <code>player = Player("Mira", 12, 5, 2)</code> and <code>mist_wolf = Enemy("Mist Wolf", 8, 4, 1)</code>. The first extra number is attack; the second is defense. Dot access makes every later rule legible: <code>player.attack</code> belongs to Mira, while <code>mist_wolf.defense</code> belongs to the wolf. Both classes retain their old members; the only new policy is that a wound cannot leave health below zero.</p>
<p>The clamp is an <code>if</code> after subtraction, not a magical integer property. A 3-HP wolf taking 5 damage first reaches -2, then stores 0. That makes defeat readable for the coming turn logic. Run the external game after both constructors change. A missing-argument traceback means an old two-value construction survived; find that call and supply attack and defense rather than weakening the initializer.</p>
<div class="callout">One object owns one creature's changing numbers. Duplicate owners make a battle impossible to trust.</div>
<div class="field-notes"><div class="fn-head">FIELD NOTES // ZERO IS A STATE</div><p>Zero prevents contradictory “-2 HP” displays. It does not decide victory or stop turns; those are later rules with their own boundary.</p></div>
'''

[[lessons.readings]]
label = "Python Tutorial — Instance Objects"
url = "https://docs.python.org/3/tutorial/classes.html#instance-objects"

