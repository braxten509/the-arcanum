[[lessons.exercises]]
id = "s14-l01-e1"
type = "mc"
points = 29
prompt = "Why should Mira's attack be read as <code>player.attack</code> instead of kept in a loose <code>player_attack</code> variable?"
choices = ["A loose variable makes Python unable to subtract numbers", "The Player instance is the canonical owner of Mira's combat state", "Only Enemy objects may have attack attributes", "PyGame requires every number to be global"]
answer = 1
hint = "Forge VI placed Mira's health on her Player instance; place the new combat fact beside it."
whyWrong = "Python can subtract loose numbers, both object types may own attack, and PyGame does not require globals. The error is splitting one creature's state across competing owners."
explain = "player.attack keeps Mira's combat value beside player.health and player.defense."

[[lessons.exercises]]
id = "s14-l01-e2"
type = "fill"
points = 26
prompt = "Restore the attribute that keeps this initializer's final received combat number on the particular Enemy instance."
code = '''    def __init__(self, name, health, attack, defense):
        self.name = name
        self.health = health
        self.attack = attack
        self.____ = defense'''
answer = "defense"
hint = "The final parameter belongs under the same lower-case attribute name on self."
whyWrong = "attack would overwrite another stat, while name and health hold different inputs. defense receives this final parameter."

[[lessons.exercises]]
id = "s14-l01-w1"
type = "write"
points = 37
prompt = "A Cinder Boar begins with <code>health = 3</code> and receives <code>damage = 5</code>. Store the subtraction, use an if guard to clamp any negative result to zero, and print exactly <code>Cinder Boar HP: 0</code>. Compute from both supplied values."
expect = '''Cinder Boar HP: 0'''
hint = "Subtract damage from health first; then compare the stored result with 0 and replace it only when lower."
starter = '''health = 3
damage = 5

# Apply the wound and keep displayed health from falling below zero.
'''
solution = '''health = 3
damage = 5

health = health - damage
if health < 0:
    health = 0

print(f"Cinder Boar HP: {health}")'''
