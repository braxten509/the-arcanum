[[lessons]]
id = "s14-l03"
title = "Show The Steel's Verdict"
teaches = ["combat-battle-screen-render", "combat-battle-hud-text", "combat-scene-loop-integration"]
body = '''
<p>A hidden wound is a loose thread, apprentice. Keep Forge XIII's <code>draw_scene_card</code> untouched for title and menu. Add this complete new helper below it in canonical <code>main.py</code>. It uses the established <code>scene_font</code>, one screen, and the render-then-blit path that made dialogue visible. It receives objects and message instead of inventing duplicate health owners.</p>
<pre><code>def draw_battle_screen(screen, player, enemy, battle_message, scene_font):
    screen.fill((24, 18, 39))
    title_surface = scene_font.render("Trial by Steel", True, (255, 181, 81))
    player_surface = scene_font.render(f"{player.name} HP: {player.health} ATK: {player.attack} DEF: {player.defense}", True, (244, 232, 204))
    enemy_surface = scene_font.render(f"{enemy.name} HP: {enemy.health} ATK: {enemy.attack} DEF: {enemy.defense}", True, (244, 232, 204))
    message_surface = scene_font.render(battle_message, True, (147, 220, 237))
    screen.blit(title_surface, (230, 120))
    screen.blit(player_surface, (120, 220))
    screen.blit(enemy_surface, (120, 280))
    screen.blit(message_surface, (120, 360))</code></pre>
<p>Now replace only Forge XIII's two-line non-overworld card branch immediately before its one existing <code>pygame.display.flip()</code>. Preserve the overworld gate and flip itself. This is a members-only replacement, not a second loop:</p>
<pre><code>if scene == SCENE_BATTLE:
    draw_battle_screen(screen, player, mist_wolf, battle_message, scene_font)
elif scene != SCENE_OVERWORLD:
    draw_scene_card(screen, scene, scene_font)</code></pre>
<p>The battle test must come first. It needs live objects and a message; title and menu still need the older helper. Run title → Enter → M → B → Space. Read the HP and last action; press until either final message appears, then press again and verify fixed numbers. Escape still returns to the overworld because its older threshold remains in the event ladder.</p>
<p>If the battle is dark, check that every rendered Surface is blitted after fill. If a name error cites <code>battle_message</code>, its owner is not top-level. Do not cure either problem with a second display or by moving damage into the renderer; drawing reports state, while the event branch changes it.</p>
<div class="callout">The event branch changes the world. The draw helper tells the player what changed world now exists.</div>
<div class="field-notes"><div class="fn-head">FIELD NOTES // DRAWING READS</div><p>Calling this renderer each frame is safe because it reads objects and paints. If it applied damage, a redraw would make an unearned turn.</p></div>
'''

[[lessons.readings]]
label = "PyGame Font — render text"
url = "https://www.pygame.org/docs/ref/font.html#pygame.font.Font.render"

[[lessons.readings]]
label = "PEP 8 — Naming and indentation"
url = "https://peps.python.org/pep-0008/"

[[lessons.exercises]]
id = "s14-l03-e1"
type = "mc"
points = 31
prompt = "Which branch order preserves Forge XIII title/menu cards while giving battle its live HP display?"
choices = ["Call draw_scene_card for every non-overworld scene before checking battle", "Call draw_battle_screen for SCENE_BATTLE, then draw_scene_card for other non-overworld scenes", "Draw overworld under every card and flip first", "Create a second display for battle"]
answer = 1
hint = "The live helper needs priority for one scene; the earlier card remains the fallback."
whyWrong = "A broad card branch first hides battle, flip must follow drawing, and a scene is not another display. Battle's specific test must precede the fallback."
explain = "The first branch renders live combat; elif retains title and menu."

[[lessons.exercises]]
id = "s14-l03-e2"
type = "fill"
points = 27
prompt = "Restore the screen method that places a rendered battle message Surface."
code = 'screen.____(message_surface, (120, 360))'
answer = "blit"
hint = "The screen uses this method after a font has produced a Surface."
whyWrong = "render belongs to the font and creates text, while fill clears the background. blit lays message_surface at coordinates."

[[lessons.exercises]]
id = "s14-l03-w1"
type = "write"
points = 39
prompt = "Use supplied <code>name = &quot;Mira&quot;</code>, <code>health = 8</code>, and <code>message = &quot;Mist Wolf answers for 2.&quot;</code> to build f-string reports. Print exactly <code>Mira HP: 8</code> then <code>Battle: Mist Wolf answers for 2.</code>; do not hardcode either report."
expect = '''Mira HP: 8
Battle: Mist Wolf answers for 2.'''
hint = "Use name and health in the first f-string, then put the supplied message after Battle in the second."
starter = '''name = "Mira"
health = 8
message = "Mist Wolf answers for 2."

# Report supplied state as the battle HUD would read it.
'''
solution = '''name = "Mira"
health = 8
message = "Mist Wolf answers for 2."

print(f"{name} HP: {health}")
print(f"Battle: {message}")'''

[[lessons.exercises]]
id = "s14-l03-e3"
type = "text"
points = 24
prompt = "What existing scene constant must the live renderer test before it replaces the title/menu fallback?"
answer = "SCENE_BATTLE"
hint = "Forge XIII named this all-caps realm for the preview this forge replaces."
whyWrong = "SCENE_OVERWORLD keeps map rendering, while title and menu retain older cards. SCENE_BATTLE is the realm now receiving live combat."
