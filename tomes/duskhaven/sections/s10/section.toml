id = "s10"
codename = "FORGE X // THE OVERWORLD"
short = "The Overworld"
title = "The Overworld"
build = "Render a data-driven tile map and follow the player with a camera."
brief = '''<p>A road painted at one coordinate is a stage prop, apprentice. A world is a ledger of places that can extend beyond the window. In this forge you will turn Duskhaven's earlier list-shaped data into a small tiled overworld, draw it from one map owner, and shift the view with a camera that follows Mira.</p><p>This is a careful extension of the one external <code>duskhaven/main.py</code>: retain its display, Clock, event branch, held-arrow movement, floating Mira position, night field, sprite resource, and one frame presentation. The camera changes drawing coordinates; it does not move the world data or invent collision. Walls and bounds wait for the next forge.</p><div class="callout">The Worldwright's cartographer rule: world coordinates say where a thing is; camera coordinates say which slice of that world the window may see.</div>'''
