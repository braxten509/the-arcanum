[freestyle]
title = "BUILD: Unroll Duskhaven's Overworld"
brief = '''<p>The gate has become too small for Mira's road, apprentice. Extend the one real external <code>duskhaven/main.py</code> from Forge IX. Preserve its earlier terminal work, Player and Enemy owners, one display, one Clock and tick, QUIT branch, held-key movement, float Mira position, sprite resource, and one flip. Do not create a second program, display, loop, Clock, class, or sprite file.</p><ul><li>Before <code>running = True</code>, define <code>tile_size = 48</code> and a rectangular nested-list <code>world_map</code> with at least 8 rows and 12 columns. Use only <code>"g"</code> and <code>"w"</code> tile symbols, with both symbols visibly represented.</li><li>Define <code>tile_colors = {"g": (42, 91, 70), "w": (49, 78, 116)}</code> and a <code>draw_world(screen, world_map, tile_size, camera_x, camera_y)</code> function. Its nested <code>enumerate</code> loops must draw every map tile with <code>pygame.draw.rect</code>; each rectangle's destination must be computed as <code>column_index * tile_size - camera_x</code> and <code>row_index * tile_size - camera_y</code>.</li><li>Inside the one existing loop after Mira's held-key updates, set <code>camera_x = mira_x - 480</code> and <code>camera_y = mira_y - 270</code>. After <code>screen.fill(night_color)</code>, call <code>draw_world(screen, world_map, tile_size, camera_x, camera_y)</code>, then draw Mira at <code>(int(mira_x - camera_x), int(mira_y - camera_y))</code> before the existing <code>pygame.display.flip()</code>.</li><li>Save and run from VS Code. Outside the study, hold every arrow key: the colored map must scroll opposite Mira's travel while Mira stays near the center of the 960-by-540 window. Close the normal window control and confirm the terminal returns without a traceback.</li></ul>'''
requires = ["tool-edit-save", "tool-run-test", "tool-diagnose", "python-list-literal", "python-list-for-iterate", "python-nested-list-dict", "python-for-range-loop", "python-function-define", "python-function-parameter", "python-float-value", "pygame-running-flag", "pygame-event-queue", "pygame-quit-event", "pygame-clean-quit", "pygame-display-flip", "pygame-surface-fill", "pygame-rectangle-draw", "pygame-screen-coordinate", "pygame-surface-blit", "pygame-draw-order", "pygame-key-state", "pygame-position-owner", "pygame-directional-key-branches", "pygame-delta-seconds", "pygame-frame-rate-independent-movement", "pygame-moving-sprite-blit", "tile-grid-owner", "tile-symbol-color-lookup", "python-enumerate-index", "pygame-nested-tile-render", "pygame-world-pixel-coordinate", "camera-offset-owner", "camera-world-to-screen", "camera-follow-player", "pygame-overworld-loop-wiring", "pygame-camera-sprite-render"]
reward = 300
xray = "I dock embers for a second loop, a map drawn as one hardcoded landmark, reversed row/column coordinates, a camera added to world positions, or Mira still blitted at raw world coordinates. I reward one readable map owner, a small drawing function, and the clear subtraction that turns world places into the camera's view."

[freestyle.badge]
id = "badge-s10"
name = "NIGHT CARTOGRAPHER"
desc = "Wove a scrolling tile world beneath Mira's feet."

[[freestyle.rubric]]
criterion = "Owns A Data-Driven Map"
weight = 15
desc = "main.py defines tile_size = 48, a rectangular world_map of at least 8 by 12 g/w symbols, and tile_colors with visibly different RGB colors for both symbols."

[[freestyle.rubric]]
criterion = "Renders Every Tile From Data"
weight = 25
desc = "draw_world(screen, world_map, tile_size, camera_x, camera_y) uses nested enumerate loops and tile_colors[tile] to call pygame.draw.rect once for each map cell at column_index * tile_size - camera_x and row_index * tile_size - camera_y."

[[freestyle.rubric]]
criterion = "Follows Mira With A Camera"
weight = 25
desc = "After the established held-key updates, the one loop derives camera_x = mira_x - 480 and camera_y = mira_y - 270; its sprite blit subtracts those same offsets so Mira stays near the 960-by-540 view center while the map scrolls opposite travel."

[[freestyle.rubric]]
criterion = "Keeps The Living Loop Intact"
weight = 15
desc = "Retains exactly one initialized display, Clock tick, QUIT branch, held-key movement, fill, flip, and clean quit; the real external PyGame window scrolls on arrows and closes without a traceback."

[[freestyle.rubric]]
criterion = "Worldwright's Python Craft"
weight = 20
desc = "Uses descriptive snake_case names such as world_map and camera_x, CapWords only for existing classes, four-space indentation for nested loops, one space around operators, and a focused draw_world function rather than duplicate files or loops."
