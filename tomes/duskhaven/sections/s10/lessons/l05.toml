[[lessons]]
id = "s10-l05"
title = "Weave The Scrolling Realm"
teaches = ["pygame-overworld-loop-wiring", "pygame-camera-sprite-render"]
body = '''
<p>Now inspect the whole weave, apprentice. The map has a single data owner, the renderer has a single function owner, Mira keeps her float world position, and the camera converts both terrain and sprite into one view. Keep the <code>world_map</code>, <code>tile_colors</code>, and complete <code>draw_world</code> function from Thread III unchanged. In the one existing <code>while running</code> loop, replace only its old drawing tail—after the held-key updates and before its existing frame cap—with these indented members. Preserve every earlier import, Player and Enemy class, display setup, placeholder sprite creation, Clock, running flag, QUIT event branch, delta-time line, and <code>pygame.quit()</code>. Do not turn this excerpt into a new program.</p>
<pre><code>    camera_x = mira_x - 480
    camera_y = mira_y - 270
    screen.fill(night_color)
    draw_world(screen, world_map, tile_size, camera_x, camera_y)
    screen.blit(mira_sprite, (int(mira_x - camera_x), int(mira_y - camera_y)))
    pygame.display.flip()</code></pre>
<p>The actual loop lines remain indented four spaces beneath <code>while running:</code>; they are shown flush-left only because this is a members-only replacement. The 8-by-12 map is 384 pixels tall and 576 pixels wide, smaller than the initial view, so empty night appears around its edges. That is expected before Forge XI teaches a larger world and bounds. The crucial proof is relative motion: a rightward Mira produces a larger camera_x, so every map rectangle's screen x becomes smaller and the map drifts left.</p>
<p>Run this external artifact. Confirm both colors appear, arrows move the background opposite Mira, and the normal close control still ends without a traceback. If the sprite disappears, check draw order and the two camera subtractions. A bug is a loose thread: follow the coordinate owner rather than adding a second blit to hide it.</p>
<div class="callout">One map, one rendering function, one camera conversion, one live loop. That is enough structure for an overworld that can survive the next forge.</div>
<div class="field-notes"><div class="fn-head">FIELD NOTES // CAMERA IS NOT COLLISION</div><p>The camera may look beyond the map and Mira may still walk through water. Those are deliberately separate rules. Forge XI gives tile or Rect boundaries a proper owner instead of hiding them in draw_world.</p></div>
'''

[[lessons.readings]]
label = "PyGame Draw — pygame.draw.rect"
url = "https://www.pygame.org/docs/ref/draw.html#pygame.draw.rect"

[[lessons.exercises]]
id = "s10-l05-e1"
type = "mc"
points = 28
prompt = "When Mira walks right and <code>camera_x</code> increases, what should happen to a fixed map tile's computed screen x?"
choices = ["It becomes smaller, so the map appears to scroll left", "It becomes larger, so the map follows Mira right", "It stays unchanged because the tile is fixed", "It turns into the tile's RGB color"]
answer = 0
hint = "The renderer uses world_x - camera_x; consider what subtracting a larger offset does."
whyWrong = "A fixed world tile does not keep a fixed screen coordinate when the view changes, and RGB comes from tile_colors. Increasing a value that is subtracted makes the displayed coordinate smaller, producing opposite map motion."
explain = "Camera motion is visible as inverse terrain motion: move the view right, and the map slides left across it."

[[lessons.exercises]]
id = "s10-l05-d1"
type = "type"
points = 14
reps = 2
prompt = "Retype the ordered per-frame map and camera draw members after movement has updated Mira."
code = '''camera_x = mira_x - 480
camera_y = mira_y - 270
screen.fill(night_color)
draw_world(screen, world_map, tile_size, camera_x, camera_y)
screen.blit(mira_sprite, (int(mira_x - camera_x), int(mira_y - camera_y)))'''

[[lessons.exercises]]
id = "s10-l05-e2"
type = "fill"
points = 26
prompt = "Restore the function call that draws the map with the current camera before Mira is blitted."
code = '____(screen, world_map, tile_size, camera_x, camera_y)'
answer = "draw_world"
hint = "Use the helper whose parameters include screen, the map, tile size, and both camera offsets."
whyWrong = "screen.blit draws one sprite, pygame.draw.rect draws one rectangle, and pygame.display.flip presents work already done. draw_world is the function that walks every map cell."

[[lessons.exercises]]
id = "s10-l05-e3"
type = "text"
points = 22
prompt = "Name the function that is the one canonical owner of nested map rendering in this forge."
answer = "draw_world"
hint = "It begins with draw and takes world_map plus camera offsets as parameters."
whyWrong = "world_map is data rather than behavior, and screen.blit draws only Mira. The nested enumerate loops belong together in draw_world."

[[lessons.exercises]]
id = "s10-l05-w1"
type = "write"
points = 36
prompt = "A tile is at <code>world_x = 288</code> and the view begins at <code>camera_x = 192</code>. Compute <code>tile_screen_x</code>. Mira is at <code>mira_x = 600.0</code> with the same camera; compute <code>mira_screen_x</code>. Print exactly two lines: <code>Tile screen x: 96</code> then <code>Mira screen x: 408.0</code>."
expect = '''Tile screen x: 96
Mira screen x: 408.0'''
hint = "Both fixed terrain and Mira use world position minus the same camera_x; preserve Mira's decimal value."
starter = '''world_x = 288
camera_x = 192
mira_x = 600.0

# Convert both world positions through the same camera, then report each result.
'''
solution = '''world_x = 288
camera_x = 192
mira_x = 600.0

tile_screen_x = world_x - camera_x
mira_screen_x = mira_x - camera_x

print(f"Tile screen x: {tile_screen_x}")
print(f"Mira screen x: {mira_screen_x}")'''
