[[lessons]]
id = "s10-l01"
title = "Set Down The Tile Ledger"
teaches = ["tile-grid-owner", "tile-symbol-color-lookup"]
body = '''
<p>A map is not a painted rectangle, apprentice. It is data that says what occupies each place. Forge IV gave you nested lists: a list may hold rows, and each row may hold small tile symbols. Add these new top-level owners in canonical <code>main.py</code>, after the earlier asset setup and before <code>running = True</code>. They do not replace Mira, the display, or the loop. They give later drawing one dependable source to read.</p>
<pre><code>tile_size = 48
world_map = [
    ["g", "g", "g", "w"],
    ["g", "w", "g", "g"],
    ["g", "g", "g", "g"],
]
tile_colors = {
    "g": (42, 91, 70),
    "w": (49, 78, 116),
}</code></pre>
<p><code>world_map</code> is a list of rows. The first inner list is row 0 at the top of the world; the next is below it, because screen y grows downward. Each <code>"g"</code> means ground and each <code>"w"</code> means water. The symbols are intentionally small; their meaning belongs in <code>tile_colors</code>, the dictionary that maps a symbol to an RGB tuple. A later forge can change a color or add a tile without rewriting every map cell.</p>
<p><code>tile_size = 48</code> is the shared width and height of one square tile. Keep it a number rather than repeating 48 across drawing code. A four-column rehearsal map is enough to inspect the shape, but the freestyle grows it to a proper 8-by-12 world. Make every row the same length. A ragged row is a torn map: later rendering may leave a gap without any deliberate world design.</p>
<p>This is old Python serving a new craft. The list owns order; the dictionary owns named meaning; RGB tuples still feed PyGame drawing. Save and run the existing program. Nothing visible changes yet because data does not draw itself. That quiet run is correct: the next thread teaches the reader that converts this ledger into tiles.</p>
<div class="callout">Do not use a separate variable for every patch of ground. One named grid lets the realm grow without scattering its geography through the loop.</div>
<div class="field-notes"><div class="fn-head">FIELD NOTES // SYMBOLS ARE NOT COLORS</div><p>Keep <code>"g"</code> and <code>"w"</code> as map facts, not RGB tuples repeated in every cell. The color lookup is a boundary: data describes the terrain; rendering decides how it appears.</p></div>
'''

[[lessons.readings]]
label = "Python Tutorial — Lists and Dictionaries"
url = "https://docs.python.org/3/tutorial/datastructures.html"

[[lessons.exercises]]
id = "s10-l01-d1"
type = "type"
points = 14
reps = 2
prompt = "Retype the small rectangular tile ledger and its symbol-to-color dictionary."
code = '''world_map = [["g", "w"], ["w", "g"]]
tile_colors = {"g": (42, 91, 70), "w": (49, 78, 116)}'''

[[lessons.exercises]]
id = "s10-l01-e1"
type = "fill"
points = 25
prompt = "Restore the dictionary lookup that obtains the RGB tuple for the current cell's symbol."
code = 'color = tile_colors[____]'
answer = "tile"
hint = "The bracket needs the variable holding one map symbol, not the dictionary's own name or a color tuple."
whyWrong = "A dictionary lookup uses the current key. Supplying tile_colors again is the wrong object, while hardcoding a color abandons the symbol-to-color mapping."

[[lessons.exercises]]
id = "s10-l01-e2"
type = "mc"
points = 26
prompt = "Which owner should change if an existing <code>\"w\"</code> map cell needs a different water color everywhere?"
choices = ["The RGB tuple stored at tile_colors[\"w\"]", "mira_speed", "The pygame.QUIT branch", "Every \"w\" cell in world_map"]
answer = 0
hint = "Separate the tile's symbolic identity in the grid from the dictionary that decides its appearance."
whyWrong = "Mira speed and QUIT do not describe terrain. Replacing every map symbol would change data rather than its shared appearance; the water entry in tile_colors is the one rendering owner."
explain = "The grid continues to say where water is, while tile_colors decides how that symbol is painted."

[[lessons.exercises]]
id = "s10-l01-e3"
type = "text"
points = 21
prompt = "What named collection holds the ordered rows and tile symbols for Duskhaven's map?"
answer = "world_map"
hint = "It is the outer nested list, not the dictionary that translates a symbol into RGB."
whyWrong = "tile_colors maps symbols to appearance, while tile_size is one number. The row-and-cell geography belongs in the nested list named world_map."

[[lessons.exercises]]
id = "s10-l01-w1"
type = "write"
points = 35
prompt = "A two-row scout map is <code>[[\"g\", \"w\", \"g\"], [\"w\", \"g\", \"w\"]]</code>. Store it in <code>scout_map</code>. Use two <code>for</code> loops to count each <code>\"w\"</code> symbol in <code>water_count</code>, then print exactly <code>Water tiles: 3</code>. The real game receives terrain through map data, not stdin."
expect = '''Water tiles: 3'''
hint = "Start water_count at 0, loop over each row and then each tile, and add one only when tile == \"w\"."
starter = '''scout_map = [["g", "w", "g"], ["w", "g", "w"]]
water_count = 0

# Count water symbols from the nested map, then print the count.
'''
solution = '''scout_map = [["g", "w", "g"], ["w", "g", "w"]]
water_count = 0

for row in scout_map:
    for tile in row:
        if tile == "w":
            water_count += 1

print(f"Water tiles: {water_count}")'''
