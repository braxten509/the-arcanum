[[lessons]]
id = "s10-l03"
title = "Shift The Cartographer's View"
teaches = ["camera-offset-owner", "camera-world-to-screen"]
body = '''
<p>World coordinates can grow far beyond a 960-by-540 window. A <strong>camera offset</strong> is the world coordinate currently aligned with the screen's upper-left corner. To draw a world point on screen, subtract that offset: <code>screen_x = world_x - camera_x</code>. Subtraction is the hinge, apprentice. Adding the camera would make the view run with the world instead of revealing a different slice of it.</p>
<p>Replace the entire <code>draw_world</code> function from Thread II—only that existing function—with this complete version. Keep the earlier <code>tile_size</code>, <code>world_map</code>, <code>tile_colors</code>, setup, and one game loop. Do not create a second function with the same name.</p>
<pre><code>def draw_world(screen, world_map, tile_size, camera_x, camera_y):
    for row_index, row in enumerate(world_map):
        for column_index, tile in enumerate(row):
            color = tile_colors[tile]
            world_x = column_index * tile_size
            world_y = row_index * tile_size
            screen_x = world_x - camera_x
            screen_y = world_y - camera_y
            pygame.draw.rect(
                screen, color, (screen_x, screen_y, tile_size, tile_size)
            )</code></pre>
<p>The map data is unchanged. <code>world_x</code> and <code>world_y</code> still describe the tile's permanent place. <code>screen_x</code> and <code>screen_y</code> are temporary drawing positions for this frame. If <code>camera_x</code> is 96, the world tile at x 144 appears at screen x 48. A tile behind the camera may have a negative screen coordinate; drawing it is harmless, and PyGame clips the invisible part of a rectangle outside the display.</p>
<p>For a static camera rehearsal, add <code>camera_x = 0.0</code> and <code>camera_y = 0.0</code> before <code>running = True</code>, then replace the old call with <code>draw_world(screen, world_map, tile_size, camera_x, camera_y)</code> after the fill. Zero means world and screen origins coincide, so the picture should initially match Thread II. This gentle first step proves the new parameters before Forge X makes them follow Mira.</p>
<p>Keep the sprite's established floating world position untouched for now. A camera must eventually affect both terrain and actor drawing; changing only one makes the world appear to slip apart. Thread IV gives the camera its per-frame owner and then applies the same subtraction to Mira.</p>
<div class="callout">World position is a fact stored by the game. Screen position is a view calculation made only because a camera is looking.</div>
<div class="field-notes"><div class="fn-head">FIELD NOTES // NEGATIVE IS OFFSCREEN, NOT WRONG</div><p>A negative draw coordinate does not mean the map has broken. It says that portion of the world lies left or above the current view. Collision and camera clamping are different problems reserved for Forge XI.</p></div>
'''

[[lessons.readings]]
label = "PyGame Draw — Rect coordinates and clipping"
url = "https://www.pygame.org/docs/ref/draw.html#pygame.draw.rect"

[[lessons.exercises]]
id = "s10-l03-e1"
type = "mc"
points = 27
prompt = "A tile has <code>world_x = 144</code> and the camera has <code>camera_x = 96</code>. Which expression places that tile at the correct screen x?"
choices = ["world_x + camera_x", "camera_x - world_x", "world_x - camera_x", "world_x * camera_x"]
answer = 2
hint = "The camera marks the world distance already passed by the view, so remove that amount from the permanent world coordinate."
whyWrong = "Adding moves a visible tile farther right, reversing produces a negative position for a tile ahead of the view, and multiplying has no coordinate meaning here. Camera rendering subtracts the offset from world space."
explain = "144 - 96 is 48, so the tile appears 48 pixels from the window's left edge."

[[lessons.exercises]]
id = "s10-l03-e2"
type = "text"
points = 22
prompt = "What is the name of the coordinate that remains a tile's permanent place in the map before camera subtraction?"
answer = "world coordinate"
accept = ["world coordinates", "world position", "world_x"]
hint = "It is not the temporary value used by pygame.draw.rect after the camera view is applied."
whyWrong = "A screen coordinate is relative to the current view, while camera_x is the view offset itself. The enduring map-space location is a world coordinate."

[[lessons.exercises]]
id = "s10-l03-d1"
type = "type"
points = 14
reps = 2
prompt = "Retype the two coordinate conversions that turn a tile's map position into its camera-relative destination."
code = '''world_x = column_index * tile_size
world_y = row_index * tile_size
screen_x = world_x - camera_x
screen_y = world_y - camera_y'''

[[lessons.exercises]]
id = "s10-l03-e3"
type = "fill"
points = 25
prompt = "Restore the operator that converts a world y coordinate into a screen y coordinate through the camera."
code = 'screen_y = world_y ____ camera_y'
answer = "-"
hint = "The camera offset is the part of the world already outside the view's upper edge."
whyWrong = "Adding shifts the view in the wrong direction, assignment would discard world_y, and multiplication would make a scale rather than a translation. Camera conversion subtracts."

[[lessons.exercises]]
id = "s10-l03-w1"
type = "write"
points = 36
prompt = "A shrine is at <code>world_x = 336</code>, and the camera begins at <code>camera_x = 240</code>. Compute <code>screen_x</code> with the taught camera conversion and print exactly <code>Shrine screen x: 96</code>."
expect = '''Shrine screen x: 96'''
hint = "Use subtraction in the same direction as screen_x = world_x - camera_x; do not alter either owner."
starter = '''world_x = 336
camera_x = 240

# Convert the shrine's world coordinate into this camera's screen coordinate.
'''
solution = '''world_x = 336
camera_x = 240

screen_x = world_x - camera_x
print(f"Shrine screen x: {screen_x}")'''
