    for column_index, tile in enumerate(row):
        color = tile_colors[tile]'''

[[lessons.exercises]]
id = "s10-l02-e1"
type = "fill"
points = 25
prompt = "Restore the index-producing built-in that gives the outer loop both row_index and row."
code = 'for row_index, row in ____(world_map):'
answer = "enumerate"
hint = "This built-in wraps the list and yields a count paired with each item."
whyWrong = "range would produce numbers without the row values, while list would merely copy the collection. enumerate provides the paired index and row required by the two target names."

[[lessons.exercises]]
id = "s10-l02-e2"
type = "mc"
points = 26
prompt = "For <code>column_index = 3</code> and <code>tile_size = 48</code>, what x coordinate must the renderer compute?"
choices = ["48", "144", "51", "3"]
answer = 1
hint = "A column index is a count of whole tile widths before this tile."
whyWrong = "Using 48 ignores the column, 51 adds unrelated values, and 3 is an index rather than a pixel position. Three complete 48-pixel widths place the tile at x 144."
explain = "The coordinate is column_index * tile_size, so 3 * 48 is 144."

[[lessons.exercises]]
id = "s10-l02-w1"
type = "write"
points = 35
prompt = "Set <code>tile_size = 48</code> and <code>column_index = 3</code>. Compute <code>x</code> from those names, then print exactly <code>Tile x: 144</code>. This plain-file lab isolates the map arithmetic; PyGame itself draws the result through pygame.draw.rect."
expect = '''Tile x: 144'''
hint = "The coordinate begins after column_index complete tile widths; multiply the two given values before the f-string."
starter = '''tile_size = 48
column_index = 3

# Compute the tile's world x coordinate, then report it.
'''
solution = '''tile_size = 48
column_index = 3

x = column_index * tile_size
print(f"Tile x: {x}")'''
