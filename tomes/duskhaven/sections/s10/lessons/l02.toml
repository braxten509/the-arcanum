[[lessons]]
id = "s10-l02"
title = "Count Rows And Columns"
teaches = ["python-enumerate-index", "pygame-nested-tile-render", "pygame-world-pixel-coordinate"]
body = '''
<p>A grid gives each tile two addresses: its row and its column. A plain <code>for row in world_map</code> retrieves a row but not its number. Python's <code>enumerate</code> supplies both: it yields an index paired with an item. Add this complete new function after the map owners and before <code>running = True</code> in the existing <code>main.py</code>. Do not make a second window or loop; this function is a small renderer the one loop will call.</p>
<pre><code>def draw_world(screen, world_map, tile_size):
    for row_index, row in enumerate(world_map):
        for column_index, tile in enumerate(row):
            color = tile_colors[tile]
            x = column_index * tile_size
            y = row_index * tile_size
            pygame.draw.rect(screen, color, (x, y, tile_size, tile_size))</code></pre>
<p>On the first outer turn, <code>row_index</code> is 0 and <code>row</code> is the first inner list. The inner loop similarly gives <code>column_index</code> and one <code>tile</code>. The dictionary expression <code>tile_colors[tile]</code> turns the symbol into the RGB tuple PyGame needs. This combines Forge IV's dictionary lookup with Forge VIII's rectangle drawing, but neither old owner changes.</p>
<p>Position comes from multiplication, not guesswork. Column 3 at a 48-pixel tile size begins at x 144. Row 2 begins at y 96. The final tuple is still <code>(x, y, width, height)</code>; here width and height are both <code>tile_size</code>. Because y grows downward, a larger row index naturally draws lower in the window. The renderer knows nothing about held keys or time. That separation is useful: data enters the function, the function paints it, and movement remains where Forge IX established it.</p>
<p>For this first proof, put <code>draw_world(screen, world_map, tile_size)</code> after <code>screen.fill(night_color)</code> and before Mira's existing blit. Run the real project: the small grid should appear behind the sprite. If all tiles lie atop one another, inspect whether you accidentally used <code>tile_size</code> without multiplying by an index. If Python complains about indentation, both loops and their bodies must be indented four spaces deeper than the function header.</p>
<div class="callout">An index is the tile's place in a row or column. Multiply that place by the common tile size to get a pixel coordinate.</div>
<div class="field-notes"><div class="fn-head">FIELD NOTES // RENDERING IS A READER</div><p><code>draw_world</code> reads world_map and tile_colors without modifying either. That makes it safe to call once per frame; later camera work will change only the coordinate calculation.</p></div>
'''

[[lessons.readings]]
label = "Python Built-in Functions — enumerate"
url = "https://docs.python.org/3/library/functions.html#enumerate"

