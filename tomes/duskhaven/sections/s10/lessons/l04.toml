[[lessons]]
id = "s10-l04"
title = "Keep Mira In The Lantern's Center"
teaches = ["camera-follow-player", "pygame-overworld-loop-integration"]
body = '''
<p>A static camera was only a measuring stick. Now bind it to the wanderer. The window is 960 pixels wide and 540 pixels tall, so its center is <code>(480, 270)</code>. After Forge IX's held-key branches update <code>mira_x</code> and <code>mira_y</code>, add these members inside the one existing <code>while running</code> loop, before the draw calls:</p>
<pre><code>    camera_x = mira_x - 480
    camera_y = mira_y - 270</code></pre>
<p>These owners are recalculated every frame; they are not new permanent player state. When Mira is at world x 600, <code>camera_x</code> becomes 120. Her screen x is then <code>600 - 120</code>, or 480. The same proof gives screen y 270. That is why the camera follows: it places the camera's upper-left world coordinate half a window before Mira in each direction.</p>
<p>Replace the Thread III map call after <code>screen.fill(night_color)</code> with <code>draw_world(screen, world_map, tile_size, camera_x, camera_y)</code>. Then replace only the existing Mira blit destination with <code>(int(mira_x - camera_x), int(mira_y - camera_y))</code>. Keep the same <code>mira_sprite</code>, same float owners, and same integer conversion at the drawing boundary. Do not subtract a camera offset when updating held-key movement: keys move Mira in world space; the camera affects rendering afterward.</p>
<p>The ordered draw space is now fill, map, Mira, flip. The old gate rectangle is a local landmark from Forge VIII; remove that one old gate draw member rather than drawing it over the map, because the map is now the background owner. Keep all earlier setup and the clean close branch. Run the external program and hold an arrow. The terrain should slide opposite travel while Mira remains near center. If Mira runs toward an edge, inspect the sprite blit: it must subtract the same camera values used by the map.</p>
<p>This is an intentional reach backward. Delta time still decides how far Mira moves; nested list data decides what terrain exists; the camera merely translates those facts into a viewport. We have not taught bounds, collision, or a camera clamp. Near the map edge, empty night may be visible. That honest limitation is Forge XI's work.</p>
<div class="callout">Move the player in world space. Move the view only when drawing. Mixing those two jobs is how a map tears loose from its traveler.</div>
<div class="field-notes"><div class="fn-head">FIELD NOTES // ONE CAMERA, TWO SUBTRACTIONS</div><p>Every object that should stay fixed in the world must use the same camera conversion. A future NPC will use its own world position minus camera_x and camera_y; it must not borrow Mira's screen position.</p></div>
'''

[[lessons.readings]]
label = "PyGame Surface — blit destination"
url = "https://www.pygame.org/docs/ref/surface.html#pygame.Surface.blit"

[[lessons.exercises]]
id = "s10-l04-w1"
type = "write"
points = 36
prompt = "Mira stands at <code>mira_x = 600.0</code> in a 960-pixel-wide view. Compute <code>camera_x</code> as taught, then compute <code>mira_screen_x</code> from Mira's world x and the camera. Print exactly <code>Mira screen x: 480.0</code>."
expect = '''Mira screen x: 480.0'''
hint = "First subtract 480 from mira_x for camera_x; then subtract camera_x from the unchanged mira_x."
starter = '''mira_x = 600.0

# Center the camera horizontally, then derive Mira's screen x.
'''
solution = '''mira_x = 600.0

camera_x = mira_x - 480
mira_screen_x = mira_x - camera_x
print(f"Mira screen x: {mira_screen_x}")'''

[[lessons.exercises]]
id = "s10-l04-e1"
type = "mc"
points = 27
prompt = "Where must the camera assignments occur in Duskhaven's existing loop?"
choices = ["Before pygame.init(), so the display receives them", "After held-key position updates and before drawing", "Inside the pygame.QUIT branch only", "After pygame.quit()"]
answer = 1
hint = "The camera must observe this frame's latest world position, then feed that view to the renderer."
whyWrong = "Camera values need neither initialization before PyGame nor cleanup after it, and a close event is not the only time Mira moves. They belong between movement updates and the drawing phase."
explain = "That order lets the camera reflect the current frame's Mira position before map and sprite coordinates are rendered."

[[lessons.exercises]]
id = "s10-l04-e2"
type = "fill"
points = 25
prompt = "Restore the camera calculation that leaves Mira 270 pixels below the view's upper edge."
code = 'camera_y = mira_y ____ 270'
answer = "-"
hint = "The center point is removed from the world position to find the view's top edge."
whyWrong = "Adding would place the camera below Mira, while assignment discards the world position. Subtraction makes mira_y - camera_y equal the desired center y."

[[lessons.exercises]]
id = "s10-l04-e3"
type = "text"
points = 22
prompt = "At what screen x coordinate does the taught 960-pixel-wide camera keep Mira?"
answer = "480"
hint = "It is half of the established display width, not the full 960 pixels."
whyWrong = "960 is the right edge of the window, while 270 is the vertical center. Half of 960 is the horizontal center where the camera keeps Mira."
