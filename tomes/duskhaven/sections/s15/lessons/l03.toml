[[lessons]]
id = "s15-l03"
title = "Measure The Growing Flame"
teaches = ["player-experience-owner", "player-level-owner", "player-level-threshold", "player-level-up"]
body = '''
<p>Experience must change the traveler, not float as a congratulatory string, apprentice. In the existing canonical <code>Player.__init__</code>, add <code>self.experience = 0</code> and <code>self.level = 1</code> immediately after the inventory assignment. Then add the complete <code>gain_experience</code> member after the existing <code>use_item</code> method. Preserve every earlier Player member in place; do not make a fresh second class. The method owns the whole growth rule: it receives earned experience, stores it, checks the threshold, and returns the sentence the battle card can show.</p>
<ol><li>At eight spaces inside <code>__init__</code>, add <code>self.experience = 0</code> and <code>self.level = 1</code>.</li><li>At four spaces after <code>use_item</code>, start <code>def gain_experience(self, amount):</code>, then add the received amount to <code>self.experience</code>.</li><li>At eight spaces, test <code>if self.experience &gt;= self.level * 10:</code>. Its twelve-space body subtracts that current-level price, increments level, adds 2 to maximum health, sets current health to that ceiling, and adds 1 each to attack and defense.</li><li>Return <code>f"{self.name} reaches level {self.level}!"</code> from the level-up branch; after that branch, return <code>f"{self.name} gains {amount} XP."</code>.</li></ol>
<p>At level 1, the threshold is <code>1 * 10</code>, or 10 XP. Awarding 10 subtracts exactly that cost, leaving 0 experience, then raises the level. The same method increases the maximum first and copies it into current health, so leveling heals to the new lawful ceiling rather than inventing a loose heal amount. Attack and defense gain one, preserving Forge XIV's damage calculation without changing its helper.</p>
<p>This version handles one threshold per award; call it with the win reward the section defines, <code>player.gain_experience(10)</code>. It intentionally does not attempt to process a giant 30-XP award through three levels yet. That restraint is a clear contract, not a missing loop. Test with the existing player object and print the returned result. If level stays 1 after a 10-XP award, check the comparison direction: the condition asks whether stored XP is at least the threshold.</p>
<div class="callout">Current XP is a purse. Level is the rank earned after the purse pays the threshold price.</div>
<div class="field-notes"><div class="fn-head">FIELD NOTES // ORDER MAKES THE RULE LEGIBLE</div><p>Subtract the old level's price before incrementing level. Reversing those lines would charge the next rank's price, turning a visible 10-XP threshold into an accidental 20-XP one.</p></div>
'''

[[lessons.readings]]
label = "Python Tutorial — if Statements and Assignment"
url = "https://docs.python.org/3/tutorial/controlflow.html#if-statements"

[[lessons.exercises]]
id = "s15-l03-e1"
type = "text"
points = 26
prompt = "At level 1, how many stored experience points are required by the taught threshold expression before Mira levels?"
answer = "10"
hint = "Substitute the starting level into level * 10; this is a threshold, not Mira's attack value."
whyWrong = "Attack, defense, and health are combat facts with different owners. The level rule multiplies the current level of 1 by 10, so the first price is 10."

[[lessons.exercises]]
id = "s15-l03-e2"
type = "mc"
points = 33
prompt = "Why does <code>gain_experience</code> subtract <code>self.level * 10</code> before increasing <code>self.level</code>?"
choices = ["It pays the current rank's threshold instead of accidentally charging the next rank's larger threshold", "It lets player.health go below zero safely", "It makes calculate_damage add defense", "It redraws the PyGame display without flip"]
answer = 0
hint = "At level 1 the price is 10; after level becomes 2, the same expression would describe 20."
whyWrong = "Health clamping, combat arithmetic, and display presentation are separate systems. The misconception is evaluating a threshold after changing the very level that defines it."
explain = "The method consumes the price for the rank just earned, then advances the rank that will define a later price."

[[lessons.exercises]]
id = "s15-l03-d1"
type = "type"
points = 14
reps = 2
prompt = "Retype the ordered level-up core that spends current-rank XP before raising level."
code = '''        self.experience = self.experience - self.level * 10
        self.level = self.level + 1
        self.max_health = self.max_health + 2
        self.health = self.max_health'''

[[lessons.exercises]]
id = "s15-l03-e3"
type = "fill"
points = 29
prompt = "Restore the comparison that lets exactly enough experience cross the rank boundary."
code = '        if self.experience ____ self.level * 10:'
answer = ">="
hint = "The branch must run at 10 XP for level 1, not only after the total exceeds 10."
whyWrong = "> would reject an exactly paid threshold, while < or <= reverse the meaning and level too early. >= admits the required amount and anything above it."

[[lessons.exercises]]
id = "s15-l03-w1"
type = "write"
points = 43
prompt = "Use supplied <code>experience = 10</code>, <code>level = 1</code>, and <code>threshold_step = 10</code>. If the experience meets the computed <code>level * threshold_step</code> threshold, subtract it, increase level by one, and print exactly <code>Level: 2, XP: 0</code>. Derive both numbers rather than printing the target."
expect = '''Level: 2, XP: 0'''
hint = "Compare experience with level * threshold_step using >=, then subtract that same expression before adding one to level."
starter = '''experience = 10
level = 1
threshold_step = 10

# Pay the current rank threshold when it is met, then report both changed values.
'''
solution = '''experience = 10
level = 1
threshold_step = 10

if experience >= level * threshold_step:
    experience = experience - level * threshold_step
    level = level + 1

print(f"Level: {level}, XP: {experience}")'''
