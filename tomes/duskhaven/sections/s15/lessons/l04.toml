[[lessons]]
id = "s15-l04"
title = "Bind Growth To The Trial"
teaches = ["inventory-battle-key", "battle-win-experience", "inventory-battle-hud", "growth-battle-integration"]
body = '''
<p>Now bind the satchel and growth to the living trial, apprentice. In the existing <code>pygame.KEYDOWN</code> ladder, add this complete <code>elif</code> after Forge XIV's Space battle branch and before its Escape branch. It reuses the one event queue and only permits H during a live battle. The return from <code>use_item(0)</code> becomes the already-visible <code>battle_message</code>; no renderer is allowed to consume an item.</p>
<pre><code>elif scene == SCENE_BATTLE and event.key == pygame.K_h and not battle_over:
    battle_message = player.use_item(0)</code></pre>
<p>Next, in Forge XIV's existing Space branch, replace only its win body—the two lines that announce the wolf's fall and set <code>battle_over</code>—with this member-only replacement. It awards exactly the 10 XP that Thread III taught as the first threshold. Keep it after <code>mist_wolf.health == 0</code>, so no still-living wolf grants a victory reward.</p>
<pre><code>    if mist_wolf.health == 0:
        battle_message = player.gain_experience(10)
        battle_over = True</code></pre>
<p>Finally, replace the existing <code>player_surface</code> line inside the canonical <code>draw_battle_screen</code> helper with this complete line. Keep the rest of the helper unchanged. It reads state each frame and adds no state: current health, maximum health, level, experience, and the current satchel count all remain owned by Player.</p>
<pre><code>    player_surface = scene_font.render(f"{player.name} HP: {player.health}/{player.max_health} LVL: {player.level} XP: {player.experience} Items: {len(player.inventory)}", True, (244, 232, 204))</code></pre>
<p>Run the real route title → Enter → M → B. Press H once: the message should name Ember Tonic and Items should fall from 1 to 0. Press H again: it should say the satchel is empty without changing health. Win with Space and read level 2, XP 0, larger maximum health, and the level message. The earlier outcome lock still stops later Space and H presses because both branches require <code>not battle_over</code>.</p>
<div class="callout">Events change Player. The battle card reads Player. Keep that one-way thread unbroken.</div>
<div class="field-notes"><div class="fn-head">FIELD NOTES // A WIN IS A PARTICULAR MOMENT</div><p>Place the reward inside the wolf-zero branch, not beside every Space press. Otherwise a normal strike would grant progress before the battle's stated victory condition is true.</p></div>
'''

[[lessons.readings]]
label = "PyGame Key Constants and Keyboard Events"
url = "https://www.pygame.org/docs/ref/key.html"

[[lessons.readings]]
label = "PEP 8 — Code Layout"
url = "https://peps.python.org/pep-0008/"

[[lessons.exercises]]
id = "s15-l04-e1"
type = "mc"
points = 34
prompt = "Where must <code>player.gain_experience(10)</code> run so Duskhaven awards growth only for a real battle victory?"
choices = ["At the top of every frame before screen.fill", "Inside draw_battle_screen after blit", "Whenever H is pressed in the overworld", "Inside the branch after Mist Wolf health reaches 0"]
answer = 3
hint = "Find the one point Forge XIV already names Mira's win: after her strike leaves the wolf at zero."
whyWrong = "Frames and renderers repeat without proving a win, while H is an item action and overworld is the wrong scene. Experience belongs at the checked zero-HP victory boundary."
explain = "The wolf's zero-health branch is reached only after Mira's legal strike ends the encounter."

[[lessons.exercises]]
id = "s15-l04-e2"
type = "fill"
points = 29
prompt = "Restore the key constant that makes the new battle-only tonic branch answer the H key."
code = 'elif scene == SCENE_BATTLE and event.key == pygame.____ and not battle_over:'
answer = "K_h"
hint = "PyGame key constants use K_ followed by the lower-case letter shown on the physical key."
whyWrong = "K_H is not the taught constant spelling, K_SPACE would repeat the strike control, and QUIT is an event type rather than a key. K_h names the H key."

[[lessons.exercises]]
id = "s15-l04-e3"
type = "text"
points = 27
prompt = "What Player-owned collection does <code>len(...)</code> count for the battle card's Items number?"
answer = "player.inventory"
accept = ["inventory"]
hint = "The list made in Player's initializer holds the tonic records; the card reads that exact instance attribute."
whyWrong = "healing_potion is one dictionary, battle_message is a string, and town_supplies is an older unrelated list. The displayed count belongs to Mira's inventory list."

[[lessons.exercises]]
id = "s15-l04-e4"
type = "mc"
points = 32
prompt = "Why does the H-key branch retain <code>and not battle_over</code> even though using a tonic does not strike?"
choices = ["It lets a fallen enemy take another response", "It converts held arrows into KEYDOWN events", "It keeps post-outcome keys from changing Mira's health or inventory", "It makes len return a dictionary"]
answer = 2
hint = "Reach back to Forge XIV's outcome lock: after a visible result, no battle action should continue changing state."
whyWrong = "The guard does not alter enemy turns, event types, or len's return type. It extends the established finished-battle lock to healing so a resolved trial stays resolved."
explain = "Both Space and H mutate battle state, so both are blocked once battle_over becomes True."

[[lessons.exercises]]
id = "s15-l04-w1"
type = "write"
points = 44
prompt = "A battle card reads <code>health = 12</code>, <code>max_health = 14</code>, <code>level = 2</code>, <code>experience = 0</code>, and an inventory holding one tonic record. Compute the list count with <code>len</code> and use one f-string to print exactly <code>Mira HP: 12/14 LVL: 2 XP: 0 Items: 1</code>. Do not hardcode the count or values."
expect = '''Mira HP: 12/14 LVL: 2 XP: 0 Items: 1'''
hint = "Store item_count = len(inventory), then weave health, max_health, level, experience, and item_count into the requested report."
starter = '''health = 12
max_health = 14
level = 2
experience = 0
inventory = [{"name": "Ember Tonic", "heal": 5}]

# Count the carried records and report the live battle state.
'''
solution = '''health = 12
max_health = 14
level = 2
experience = 0
inventory = [{"name": "Ember Tonic", "heal": 5}]

item_count = len(inventory)
print(f"Mira HP: {health}/{max_health} LVL: {level} XP: {experience} Items: {item_count}")'''
