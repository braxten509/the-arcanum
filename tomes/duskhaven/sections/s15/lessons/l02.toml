[[lessons]]
id = "s15-l02"
title = "Spend An Ember Tonic"
teaches = ["inventory-consume-item", "inventory-use-method", "inventory-health-ceiling", "inventory-use-feedback"]
body = '''
<p>A carried tonic matters only when the player can spend it, apprentice. In the existing canonical <code>Player</code> class in <code>main.py</code>, add this complete <code>use_item</code> member after <code>take_damage</code>. The initializer, report, and wound behavior remain in their earlier canonical locations; do not create a second Player class. The method takes an index because the satchel is ordered, and it returns a message because the existing battle renderer already knows how to display <code>battle_message</code>.</p>
<ol><li>At four spaces, insert <code>def use_item(self, item_index):</code>.</li><li>At eight spaces, guard with <code>if item_index &gt;= len(self.inventory):</code>; at twelve spaces, return <code>"Satchel is empty."</code>.</li><li>After the guard, store <code>item = self.inventory.pop(item_index)</code>, then add <code>item["heal"]</code> to <code>self.health</code>.</li><li>Use <code>if self.health &gt; self.max_health:</code>, with <code>self.health = self.max_health</code> in that branch.</li><li>Finish at eight spaces with <code>return f"{self.name} uses {item['name']} for {item['heal']} HP."</code>.</li></ol>
<p><code>len(self.inventory)</code> counts the carried records. With one tonic, index 0 is legal and index 1 is not, so the <code>&gt;=</code> guard catches both “one past the end” and an empty list. Only a legal index reaches <code>pop</code>. Unlike a lookup, <code>pop(item_index)</code> removes that record and returns it, so one tonic cannot be drunk forever. The item dictionary's <code>"heal"</code> number is added to current health, then the second guard caps the result at <code>max_health</code>.</p>
<p>Test in plain Python first if you need a small proof: construct a Player, append the known tonic, call <code>player.use_item(0)</code>, and print its returned message. In the real game, no terminal <code>input()</code> belongs here; Forge VII's PyGame event queue will summon the method next. An empty satchel is an ordinary game state, not a crash to conceal with <code>try</code>. The early return reports it and leaves health untouched.</p>
<div class="callout">Retrieve does not spend. <code>pop</code> makes the inventory change honest, then the returned record supplies the heal fact.</div>
<div class="field-notes"><div class="fn-head">FIELD NOTES // GUARD BEFORE POP</div><p>Do not call <code>pop(0)</code> and hope an empty list forgives it: there is no first element to remove. The guard makes the boundary explicit, just as Forge XIV checked a battle outcome before allowing another turn.</p></div>
'''

[[lessons.readings]]
label = "Python Documentation — list.pop and len"
url = "https://docs.python.org/3/tutorial/datastructures.html#more-on-lists"

[[lessons.exercises]]
id = "s15-l02-e1"
type = "mc"
points = 32
prompt = "Why does <code>use_item</code> use <code>self.inventory.pop(item_index)</code> rather than only <code>self.inventory[item_index]</code>?"
choices = ["pop converts the item dictionary into a Player", "pop automatically raises health to max_health", "pop makes item_index start at one", "pop removes and returns the used record, preventing unlimited reuse"]
answer = 3
hint = "Compare the two operations: one changes the satchel while giving back its record; the other only looks."
whyWrong = "pop neither changes an item's type nor heals by itself, and Python indexes still begin at zero. The key distinction is consumption: the method must remove the tonic it uses."
explain = "The returned record supplies name and heal, while its removal keeps the one tonic from being used twice."

[[lessons.exercises]]
id = "s15-l02-d1"
type = "type"
points = 14
reps = 2
prompt = "Retype the complete legal-index consumption line and its health addition."
code = '''        item = self.inventory.pop(item_index)
        self.health = self.health + item["heal"]'''

[[lessons.exercises]]
id = "s15-l02-e2"
type = "fill"
points = 28
prompt = "Restore the list operation that consumes the selected record and gives it back to item."
code = '        item = self.inventory.____(item_index)'
answer = "pop"
hint = "Use the operation that both removes one selected list entry and returns that entry."
whyWrong = "append adds a new entry, while len only counts. pop is required because the tonic must leave the satchel after it is used."

[[lessons.exercises]]
id = "s15-l02-w1"
type = "write"
points = 42
prompt = "Mira has <code>health = 10</code>, <code>max_health = 12</code>, and one tonic whose <code>heal</code> fact is <code>5</code>. Remove that first tonic with <code>pop(0)</code>, add its heal amount, cap the result with an if guard, and print exactly <code>After tonic: 12 HP</code>. Compute from the supplied values."
expect = '''After tonic: 12 HP'''
hint = "Store inventory.pop(0), add item['heal'] to health, then replace health only if it rose above max_health."
starter = '''health = 10
max_health = 12
inventory = [{"name": "Ember Tonic", "heal": 5}]

# Consume the first tonic, cap recovery, then report the resulting health.
'''
solution = '''health = 10
max_health = 12
inventory = [{"name": "Ember Tonic", "heal": 5}]

item = inventory.pop(0)
health = health + item["heal"]
if health > max_health:
    health = max_health

print(f"After tonic: {health} HP")'''
