[freestyle]
title = "BUILD: Give Mira A Satchel And A Rank"
brief = '''<p>The Mist Wolf yields more than a message now, apprentice. Extend the same real external <code>duskhaven/main.py</code> from Forge XIV. Preserve one display, one Clock, one event queue, the map, camera, collision, dialogue, scenes, title/menu cards, battle order, and outcome lock. Do not add a second file, loop, display, Player class, loose HP/XP/inventory variables, or terminal <code>input()</code>.</p><ul><li>Define <code>healing_potion</code> as a dictionary with <code>"name": "Ember Tonic"</code> and <code>"heal": 5</code>. The complete canonical <code>Player</code> stores <code>name</code>, <code>health</code>, <code>max_health</code>, <code>attack</code>, <code>defense</code>, <code>inventory</code>, <code>experience</code>, and <code>level</code>; after construction, append the potion to <code>player.inventory</code>.</li><li>Keep Player's prior <code>report_status</code> and clamped <code>take_damage</code>. Add <code>use_item(self, item_index)</code>: an empty satchel or index at/above its length returns <code>Satchel is empty.</code>; a legal index uses <code>pop</code>, adds its <code>"heal"</code> amount, never exceeds <code>max_health</code>, and returns a message naming the used item and its heal amount.</li><li>Add <code>gain_experience(self, amount)</code>. It stores the amount; at <code>level * 10</code> or more it spends that current-rank threshold, raises level by 1, raises max health by 2, restores health to the new maximum, raises attack and defense by 1, and returns a level-up message. Award <code>player.gain_experience(10)</code> only when Mira reduces Mist Wolf to 0 HP.</li><li>In the existing KEYDOWN ladder, H during a live <code>SCENE_BATTLE</code> assigns <code>battle_message = player.use_item(0)</code>. Update the existing battle HUD to visibly read current/max HP, level, XP, and <code>len(player.inventory)</code>. H and Space must still do nothing after <code>battle_over</code>.</li><li>Run the real PyGame program outside this study: reach battle through title → Enter → M → B; use H once to consume Ember Tonic and again to prove the empty response; win with Space; then visibly verify level 2, XP 0, max HP 14, attack 6, defense 3, and the preserved outcome lock. Confirm Escape, arrows, dialogue, collision, and close still work.</li></ul>'''
requires = ["item-record-dict", "inventory-list-owner", "player-maximum-health", "inventory-item-lookup", "inventory-consume-item", "inventory-use-method", "inventory-health-ceiling", "inventory-use-feedback", "player-experience-owner", "player-level-owner", "player-level-threshold", "player-level-up", "inventory-battle-key", "battle-win-experience", "inventory-battle-hud", "growth-battle-integration", "combat-stat-owner", "combat-health-clamp", "combat-player-turn", "combat-outcome-lock", "combat-battle-screen-render", "pygame-event-queue", "pygame-keydown-event", "scene-active-input-routing"]
reward = 450
xray = "I dock embers for a duplicate Player, a tonic that can be reused forever, healing beyond max_health, a missing empty-satchel response, XP awarded before victory, the next level's threshold charged by mistake, or a HUD that edits state. I reward a single clear Player owner, guarded event work, and a battle card that tells the truth about satchel and rank."

[freestyle.badge]
id = "badge-s15"
name = "EMBERBEARER"
desc = "Packed a true satchel and made victory kindle a stronger traveler."

[[freestyle.rubric]]
criterion = "Owns Satchel Records And Health Ceiling"
weight = 20
desc = "One canonical Player owns health, max_health, combat stats, and inventory; healing_potion is the required name/heal dictionary, is appended to player.inventory, and prior report_status/take_damage behavior remains intact."

[[freestyle.rubric]]
criterion = "Consumes A Tonic Honestly"
weight = 20
desc = "use_item guards an empty satchel or index at/above its length with Satchel is empty., uses pop for a legal item, adds its heal value without exceeding max_health, removes it once used, and returns a truthful item-use message."

[[freestyle.rubric]]
criterion = "Awards Growth At The Victory Boundary"
weight = 20
desc = "gain_experience stores XP and at the current level * 10 threshold spends that current-rank cost before leveling; it raises level, max health, health, attack, and defense as specified, and 10 XP is awarded only when Mist Wolf reaches 0 HP."

[[freestyle.rubric]]
criterion = "Integrates The Live Battle"
weight = 25
desc = "The existing live-battle KEYDOWN ladder maps H to player.use_item(0), preserves not battle_over for H and Space, and the existing battle HUD visibly reads HP/max HP, level, XP, and inventory count without mutating them; the real title-to-battle route proves use, empty response, level-up, and outcome lock."

[[freestyle.rubric]]
criterion = "Worldwright's Python Craft"
weight = 15
desc = "Uses CapWords class names, descriptive snake_case functions and variables, UPPER_CASE scene constants, four-space indentation, one space around operators, and focused member-only edits in one main.py without duplicate classes, loops, displays, or blocking input()."
