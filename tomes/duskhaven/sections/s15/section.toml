build = "Give Mira item records, a usable battle satchel, experience, and visible levels."
brief = '''<p>A victory that leaves nothing in the traveler is only a spark, apprentice. This forge gives Mira a satchel that owns item records and a growth rule that turns hard-won experience into a visible change. We retain Duskhaven's one <code>main.py</code>, display, Clock, event queue, scene gates, map, collision, dialogue, and turn-based trial. No second program, loop, player class, or shadow health ledger is permitted.</p><p>The real external game now carries a <code>healing_potion</code> dictionary inside <code>player.inventory</code>. In battle, H uses the first carried item, removes it only when used, and reports the result on the existing battle card. Experience belongs to Player as well: a win can call a method that crosses a clear threshold, raises level and stats, and refreshes health only to its grown maximum.</p><div class="callout">A satchel stores objects; a level stores a rule's consequence. Neither is decorative text painted by the renderer.</div>'''
