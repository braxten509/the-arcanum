[freestyle]
title = "BUILD: The Duskhaven Supply Ledger"
brief = '''<p>The gate is watched; now stock the town, apprentice. Extend the same real external <code>duskhaven/main.py</code>; retain its PyGame import, lantern transcript, keeper report, gate decision, three watch rounds, and two ward marks. Do not create a second file.</p><ul><li>Create a <code>town_supplies</code> list containing exactly <code>"oil"</code>, <code>"bread"</code>, and <code>"bandage"</code>, then append <code>"torch"</code>.</li><li>Use indexing to print exactly <code>First supply: oil</code> and use a <code>for</code> loop to print every final supply as <code>Supply: &lt;name&gt;</code>, including <code>Supply: torch</code>.</li><li>Create a <code>town_ledger</code> dictionary with keys <code>"name"</code>, <code>"population"</code>, and <code>"danger"</code>; use key lookup and an f-string to print <code>Duskhaven has 12 residents.</code>.</li><li>Add a <code>gate_record</code> dictionary whose <code>"guards"</code> value is a list containing <code>"Mira"</code> and <code>"Tala"</code>; print exactly <code>First guard: Mira</code> by indexing through that nested data.</li><li>Use one list comprehension to build <code>ember_labels</code> from <code>range(3)</code> so it contains <code>"Ember 0"</code>, <code>"Ember 1"</code>, and <code>"Ember 2"</code>, then print the complete list.</li></ul>'''
requires = ["pygame-import-check", "python-for-range-loop", "python-fstring-output", "python-list-literal", "python-list-append", "python-list-index", "python-list-for-iterate", "python-dict-literal", "python-dict-key-lookup", "python-nested-list-dict", "python-list-comprehension"]
reward = 260
xray = "I dock embers for a torch typed into the original list instead of appended, a hardcoded first supply or guard, a dictionary treated like a numbered list, or a second main.py. I reward one legible data ledger: snake_case vessel names, quoted dictionary keys, four-space loop bodies, and output that proves each lookup uses the data rather than a painted sentence."

[freestyle.badge]
id = "badge-s04"
name = "LEDGER KEEPER"
desc = "Gave Duskhaven its first durable hoard of world facts."

[[freestyle.rubric]]
criterion = "Preserved Living Chronicle"
weight = 15
desc = "The external canonical main.py retains the earlier pygame import, lantern transcript, keeper/gate logic, while watch, and for-range ward marks, and runs normally."

[[freestyle.rubric]]
criterion = "Supply Hoard Operations"
weight = 25
desc = "town_supplies begins with oil, bread, and bandage; append adds torch; an indexed first-supply report and a for-loop supply transcript are computed from that list."

[[freestyle.rubric]]
criterion = "Town Ledger Lookup"
weight = 20
desc = "town_ledger is a dictionary with the stated name, population, and danger keys, and key lookup plus an f-string produces Duskhaven has 12 residents."

[[freestyle.rubric]]
criterion = "Nested Guard And Ember Data"
weight = 25
desc = "gate_record stores guards as a list, nested lookup produces First guard: Mira, and a list comprehension over range(3) creates and prints the three Ember labels."

[[freestyle.rubric]]
criterion = "Worldwright's Python Craft"
weight = 15
desc = "main.py uses descriptive lowercase snake_case names, quoted dictionary keys, imports at the top, spaces around operators, four-space indentation in loops, and readable multi-line list/dictionary layout consistent with PEP 8."
