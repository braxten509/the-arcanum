[[lessons]]
id = "s04-l04"
title = "Bind Facts Into A Ledger"
teaches = ["python-dict-literal", "python-dict-key-lookup", "python-nested-list-dict"]
body = '''
<p>A list answers “what is at position two?” A <strong>dictionary</strong> answers “what fact belongs to this name?” It uses curly braces, quoted keys, colons, and values. Add this complete new data block below the supply loop in the existing <code>main.py</code>; it is an addition only, so the gatewatch still runs first.</p>
<pre><code>town_ledger = {
    "name": "Duskhaven",
    "population": 12,
    "danger": "mist",
}

print(f"{town_ledger['name']} has {town_ledger['population']} residents.")

gate_record = {
    "guards": ["Mira", "Tala"],
    "status": "open",
}
print(f"First guard: {gate_record['guards'][0]}")</code></pre>
<p>Each key is a descriptive string. <code>town_ledger['population']</code> looks up the value paired with that exact key, yielding the integer <code>12</code>. Brackets appear here too, but this is not list indexing: the bracket contains a named key instead of a numeric position. Misspelling a key is a different lookup and will fail, so preserve its letters and quotes.</p>
<p><code>gate_record</code> demonstrates nested data: its <code>"guards"</code> value is itself a list. Read <code>gate_record['guards'][0]</code> from left to right: get the guards list by key, then get the first guard by zero-based position. This is the shape later game data uses—a character record can hold a name, numbers, and collections together.</p>
<p>Choose a list when order is the point; choose a dictionary when named fields are the point. The two can nest because real world facts often need both. Run the program and confirm that its ledger line is computed from the keys, not typed as a lone hardcoded sentence.</p>
<div class="callout">Square brackets are a lookup doorway. A number selects a list position; a quoted key selects a dictionary fact.</div>
<div class="field-notes"><div class="fn-head">FIELD NOTES // ONE QUOTE INSIDE ANOTHER</div><p>The f-string uses double quotes outside, so the dictionary keys use single quotes inside its braces. This keeps the string boundaries clear. The trailing commas in the multi-line dictionaries are accepted and make later additions less error-prone. A ledger stays dependable when every lookup uses the same exact key rather than a near-spelling guessed from memory.</p></div>
'''

[[lessons.readings]]
label = "Python Tutorial — Dictionaries"
url = "https://docs.python.org/3/tutorial/datastructures.html#dictionaries"

[[lessons.exercises]]
id = "s04-l04-e1"
type = "mc"
points = 23
prompt = "Which expression retrieves the named population fact from the worked town ledger?"
choices = ["town_ledger[1]", "town_ledger.population", "town_ledger['population']", "town_ledger('population')"]
answer = 2
hint = "The ledger uses a quoted key inside square brackets, while the matching value is 12."
whyWrong = "A numeric index belongs to list positions, dot access was not taught for dictionaries, and parentheses call something. Dictionary lookup uses the exact quoted key in brackets."
explain = "The key population maps directly to the integer stored for that field."

[[lessons.exercises]]
id = "s04-l04-d1"
type = "type"
points = 14
reps = 2
prompt = "Retype the complete nested guard record and its first-guard report."
code = '''gate_record = {
    "guards": ["Mira", "Tala"],
    "status": "open",
}
print(f"First guard: {gate_record['guards'][0]}")'''

[[lessons.exercises]]
id = "s04-l04-e2"
type = "fill"
points = 24
prompt = "Restore the key that first retrieves the guard list before the zero index selects Mira."
code = "print(gate_record['____'][0])"
answer = "guards"
hint = "Use the plural field name whose value is the square-bracket list containing Mira and Tala."
whyWrong = "status holds one string and cannot provide a first guard; a numeric key would confuse dictionary lookup with list indexing. The guards key owns the list."

[[lessons.exercises]]
id = "s04-l04-w1"
type = "write"
points = 35
prompt = "Create <code>inn_record</code> with key <code>&quot;name&quot;</code> mapped to <code>&quot;Moon Rest&quot;</code> and key <code>&quot;beds&quot;</code> mapped to <code>4</code>. Use key lookups in one f-string to print exactly <code>Moon Rest offers 4 beds.</code>."
expect = '''Moon Rest offers 4 beds.'''
hint = "Use curly braces for the dictionary, quoted keys before colons, then inn_record['name'] and inn_record['beds'] in f-string braces."
starter = '''# Create the inn record, then report its named facts.
'''
solution = '''inn_record = {
    "name": "Moon Rest",
    "beds": 4,
}
print(f"{inn_record['name']} offers {inn_record['beds']} beds.")'''
