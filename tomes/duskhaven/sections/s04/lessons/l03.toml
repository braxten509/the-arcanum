[[lessons]]
id = "s04-l03"
title = "Walk Every Supply"
teaches = ["python-list-for-iterate", "python-loop-item-name", "python-list-report-loop"]
body = '''
<p>Indexing finds one known item. A town clerk often needs every item in the hoard, in order. Forge III already taught a <code>for</code> loop over <code>range(2)</code>; a list can stand on the right side of <code>in</code> instead. Python takes each list value in turn and stores it in the loop name you choose.</p>
<p>Keep <code>town_supplies</code> and its appended torch. Add this member-only loop after the indexed reports in canonical <code>main.py</code>. It is a full loop, not a replacement for the earlier ward range loop.</p>
<pre><code>for supply_name in town_supplies:
    print(f"Supply: {supply_name}")</code></pre>
<p>On the first pass, <code>supply_name</code> holds <code>"oil"</code>; the f-string prints <code>Supply: oil</code>. Then it holds bread, bandage, and torch. Python stops after the list has no more values. There is no manual <code>+= 1</code>: like the range loop, <code>for</code> receives its next value from what follows <code>in</code>.</p>
<p>Name the loop variable after the <em>one thing</em> it holds. <code>supply_name</code> is a single string during one pass, while <code>town_supplies</code> remains the whole list. Calling both <code>supplies</code> blurs that distinction and invites a loose thread. This same singular/plural discipline will matter when later loops draw tiles and inspect items.</p>
<p>Do not put the print flush left. Four spaces make it the repeated body; if it is flush left, Python prints once after the loop and only remembers the last value. Run it and check that the output includes four Supply lines in the list's order. Terminal input was a practice vehicle for earlier Python; Duskhaven's real game will later receive actions from PyGame events, not from this loop.</p>
<div class="callout">Read <code>for supply_name in town_supplies</code> as “for each one supply in the whole town hoard.” Singular left, plural right.</div>
<div class="field-notes"><div class="fn-head">FIELD NOTES // LOOP WITHOUT A COUNTER</div><p>You can combine indexes and lists later, but do not manufacture an index when only each value is needed. Direct list iteration reduces off-by-one risk and says the intent plainly.</p></div>
'''

[[lessons.readings]]
label = "Python Tutorial — for Statements"
url = "https://docs.python.org/3/tutorial/controlflow.html#for-statements"

[[lessons.exercises]]
id = "s04-l03-d1"
type = "type"
points = 14
reps = 2
prompt = "Retype the complete direct-list report loop."
code = '''for supply_name in town_supplies:
    print(f"Supply: {supply_name}")'''

[[lessons.exercises]]
id = "s04-l03-e1"
type = "fill"
points = 23
prompt = "Restore the collection name on the right side so the loop visits every stored supply."
code = 'for supply_name in ____:'
answer = "town_supplies"
hint = "The right side must be the plural hoard created earlier, not the one-item loop name."
whyWrong = "supply_name is only one item during a pass and range would create numbers instead of supply strings. town_supplies is the collection that supplies all four values."

[[lessons.exercises]]
id = "s04-l03-e2"
type = "mc"
points = 22
prompt = "Why should the print beneath <code>for supply_name in town_supplies:</code> have four leading spaces?"
choices = ["It makes the f-string part of the repeated loop body", "It converts supply_name into a list", "It tells Python to append another supply", "It makes the loop start at index 1"]
answer = 0
hint = "Recall the ward loop: indentation marks what repeats for each supplied value."
whyWrong = "Indentation neither changes a variable's type nor its starting position. In Python it defines the block that the for loop executes each pass."
explain = "The indented print runs once for oil, bread, bandage, and torch because it belongs to the loop body."

[[lessons.exercises]]
id = "s04-l03-e3"
type = "text"
points = 19
prompt = "Inside a direct list loop, what does the singular variable <code>supply_name</code> hold during one pass?"
answer = "one list item"
accept = ["one item", "a single list item", "one supply"]
hint = "On the first pass it holds oil, not the complete square-bracket hoard."
whyWrong = "The list itself remains in town_supplies. The loop variable is reassigned to one element at a time as Python walks the collection."

[[lessons.exercises]]
id = "s04-l03-e4"
type = "mc"
points = 21
prompt = "A previous gate report stored <code>keeper_name = &quot;Mira&quot;</code>. With <code>first_supply = &quot;oil&quot;</code>, what does <code>print(f&quot;{keeper_name} checked {first_supply}.&quot;)</code> print?"
choices = ["keeper_name checked first_supply.", "Mira checked first_supply.", "oil checked Mira.", "Mira checked oil."]
answer = 3
hint = "An f-string replaces each braced variable with its stored value, just as the earlier gate message used keeper_name."
whyWrong = "The common slip is printing variable labels or swapping their positions. Braces look up keeper_name first and first_supply second, yielding their stored strings in that order."
explain = "This callback combines Forge II's f-string substitution with the first indexed list value from this forge."

[[lessons.exercises]]
id = "s04-l03-w1"
type = "write"
points = 35
prompt = "A patrol list contains <code>&quot;north&quot;</code>, <code>&quot;east&quot;</code>, and <code>&quot;west&quot;</code>. Use direct list iteration—not three prints—to produce exactly <code>Patrol: north</code>, <code>Patrol: east</code>, and <code>Patrol: west</code>."
expect = '''Patrol: north
Patrol: east
Patrol: west'''
hint = "Put one singular route_name after for, patrol_routes after in, and print route_name in an indented f-string."
starter = '''patrol_routes = ["north", "east", "west"]

# Report each route with one direct-list for loop.
'''
solution = '''patrol_routes = ["north", "east", "west"]

for route_name in patrol_routes:
    print(f"Patrol: {route_name}")'''
