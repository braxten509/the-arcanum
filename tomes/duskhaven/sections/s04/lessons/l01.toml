[[lessons]]
id = "s04-l01"
title = "Gather A Supply Hoard"
teaches = ["python-list-literal", "python-list-order", "python-list-append"]
body = '''
<p>Three separate variables for oil, bread, and bandages would make a poor storeroom. A <strong>list</strong> holds an ordered run of values inside square brackets. Commas separate its items. Make this member-only addition near the bottom of the canonical <code>main.py</code>, after the earlier ward loop. Do not replace the gate watch or create a supply file; the game has one owner.</p>
<pre><code>town_supplies = ["oil", "bread", "bandage"]
town_supplies.append("torch")

print(town_supplies)</code></pre>
<p>The first line makes one list object and binds it to <code>town_supplies</code>. Its order matters: oil comes before bread. The method call <code>.append("torch")</code> adds one item to the <em>end</em> of that existing list. It does not make a second list, and it does not replace oil. The printed result is <code>['oil', 'bread', 'bandage', 'torch']</code>; Python displays strings in a list with quotes.</p>
<p>This is the first place Duskhaven can grow a collection without inventing a new variable for every fact. Later, an inventory will use the same broad idea. For now, distinguish the list itself from one item inside it. <code>town_supplies</code> names the whole hoard; <code>"torch"</code> is one string value placed into it. If you append twice, you get two torches—Python follows the request, so run after each change.</p>
<p>Lists are mutable, meaning their contents can change after creation. That is why <code>append</code> belongs after the literal, not inside a print call. Save and run the complete program. The older prompts still appear because this is an addition to the loom, not a replacement of its earlier threads.</p>
<div class="callout">Square brackets make the vessel; <code>append</code> adds at its far end. Say which job you need before you type either one.</div>
<div class="field-notes"><div class="fn-head">FIELD NOTES // ORDER IS A PROMISE</div><p>A list preserves the order you place into it. That makes it useful for a turn queue, a map row, or a backpack display. A dictionary, introduced shortly, is chosen for named facts rather than this positional promise.</p></div>
'''

[[lessons.readings]]
label = "Python Tutorial — Lists"
url = "https://docs.python.org/3/tutorial/introduction.html#lists"

[[lessons.exercises]]
id = "s04-l01-d1"
type = "type"
points = 14
reps = 2
prompt = "Retype the complete supply-hoard addition."
code = '''town_supplies = ["oil", "bread", "bandage"]
town_supplies.append("torch")

print(town_supplies)'''

[[lessons.exercises]]
id = "s04-l01-e1"
type = "fill"
points = 23
prompt = "Restore the list method that adds the requested torch to the end of the existing hoard."
code = 'town_supplies.____("torch")'
answer = "append"
hint = "Use the method named in the worked hoard that changes one existing list by adding at its end."
whyWrong = "A list literal creates a list and print only displays it; neither adds a new member to town_supplies. append changes the existing hoard."

[[lessons.exercises]]
id = "s04-l01-e2"
type = "mc"
points = 22
prompt = "After the worked code runs once, which list is stored in <code>town_supplies</code>?"
choices = ['["torch", "oil", "bread", "bandage"]', '["oil", "bread", "bandage"]', '["oil", "bread", "bandage", "torch"]', '"oil, bread, bandage, torch"']
answer = 2
hint = "append places its argument after the current final item; it does not turn the list into one string."
whyWrong = "append does not prepend, discard prior contents, or join the values into text. It preserves the existing order and adds torch at the end."
explain = "The list literal supplies the first three ordered strings, then append extends that same list with torch."

[[lessons.exercises]]
id = "s04-l01-w1"
type = "write"
points = 34
prompt = "A tiny supply chest begins with <code>&quot;rope&quot;</code> and <code>&quot;salt&quot;</code>. Build the list, append <code>&quot;flint&quot;</code>, and print the list so the terminal shows exactly <code>['rope', 'salt', 'flint']</code>."
expect = '''['rope', 'salt', 'flint']'''
hint = "Create chest_supplies with square brackets, then call append with flint before printing that same variable."
starter = '''# Build the two-item chest and add flint before reporting it.
'''
solution = '''chest_supplies = ["rope", "salt"]
chest_supplies.append("flint")
print(chest_supplies)'''
