brief = '''<p>A gate watch remembers one name at a time. A realm remembers many things at once: supplies, places, and the facts attached to each. In this forge you will give <strong>Duskhaven</strong> its first hoard and ledger with Python lists and dictionaries.</p><p>These are still honest terminal proofs inside the external <code>duskhaven</code> workspace. The later PyGame world will read the same data shapes for tiles, items, and characters. For now, keep the one canonical <code>main.py</code>, preserve the gate watch, and make the terminal reveal exactly what your data says.</p><div class="callout">The Worldwright's warning: do not scatter a kingdom into unrelated variables. Put related things in one well-named vessel, then ask that vessel for what you need.</div>'''
