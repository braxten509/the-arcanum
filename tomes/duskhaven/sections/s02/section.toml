build = "Turn Duskhaven's lantern transcript into a small gate ledger with stored values, arithmetic, formatted text, and a keeper's name."
brief = '''<p>A lantern is not a world, apprentice; it is only proof that the tools answer. This forge gives that proof a little memory. You will keep values in named places, reckon the oil at Duskhaven's gate, and weave the result into a sentence a traveler can read.</p><p>We remain in the real external <code>duskhaven</code> workspace from the first forge. Every complete replacement below belongs in the one canonical <code>main.py</code>; do not make a second practice file and expect the game to inherit it. Save, run <code>python main.py</code>, and read the terminal transcript. PyGame is still imported as the boundary check, but the window and keyboard events arrive in later forges.</p><div class="callout">The Worldwright's measure: a name is a hook in the loom. If a number matters later, give it a clear name now instead of burying it inside a sentence.</div>'''
