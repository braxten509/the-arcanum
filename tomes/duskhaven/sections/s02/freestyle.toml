[freestyle]
title = "BUILD: The Duskhaven Gate Ledger"
brief = '''<p>Give the lantern a voice, apprentice. Extend the real external <code>duskhaven/main.py</code> from Forge I; this is not a browser imitation and not a second practice file. The ledger must retain its PyGame boundary while gathering the first live fact from a traveler.</p><ul><li>Keep <code>import pygame</code> before the program's output and retain the two Forge I proof lines in their original order.</li><li>Store <code>"Duskhaven"</code> in <code>town_name</code>, store whole-number starting oil and a whole-number delivery in descriptively named variables, and compute their sum in <code>oil_total</code> with <code>+</code>.</li><li>Ask exactly <code>Name the lantern keeper: </code> with <code>input()</code> and store the answer in <code>keeper_name</code>.</li><li>After the typed response, print one f-string report using <code>keeper_name</code>, <code>town_name</code>, and <code>oil_total</code>; with Mira and a total of 5 it must read <code>Mira, Duskhaven holds 5 flasks of oil.</code>.</li><li>Save the canonical <code>main.py</code>, run it from the VS Code integrated terminal, and use the traceback's final <code>main.py</code> frame to repair any failed spelling before the final run.</li></ul>'''
requires = ["pygame-import-check", "python-print-value", "python-variable-store", "python-string-value", "python-integer-value", "python-addition-result", "python-input-store", "python-fstring-output", "tool-edit-save", "tool-run-test", "traceback-locate"]
reward = 220
xray = "I dock embers when a ledger prints a hardcoded total, leaves the keeper answer unused, or loses the PyGame import and Forge I transcript while replacing main.py. I reward one readable owner file: clear snake_case names, a calculated oil_total, and a final terminal run that proves the report accepts a real name rather than a painted placeholder."

[freestyle.badge]
id = "badge-s02"
name = "GATE LEDGER"
desc = "Bound Duskhaven's first stored facts into a living gate report."

[[freestyle.rubric]]
criterion = "Runnable Ledger Boundary"
weight = 20
desc = "The real external main.py imports pygame before output, keeps the two Forge I proof lines in order, and runs from the project's Python terminal without a normal-path crash."

[[freestyle.rubric]]
criterion = "Named Facts And Arithmetic"
weight = 25
desc = "town_name stores Duskhaven; descriptive whole-number oil variables exist; oil_total is computed from the starting oil and delivery with + rather than hardcoded."

[[freestyle.rubric]]
criterion = "Keeper Input And Report"
weight = 25
desc = "input() displays exactly Name the lantern keeper: , stores its response in keeper_name, and one f-string report uses keeper_name, town_name, and oil_total; Mira with total 5 yields Mira, Duskhaven holds 5 flasks of oil."

[[freestyle.rubric]]
criterion = "Evidence Of Repair"
weight = 15
desc = "The apprentice saves and runs main.py in the VS Code integrated terminal and can use the traceback's final main.py frame to correct a misspelled variable or other named source error before rerunning."

[[freestyle.rubric]]
criterion = "Worldwright's Python Craft"
weight = 15
desc = "main.py uses descriptive lowercase snake_case variable names, imports at the top, one space around = and +, no unnecessary duplicate file, and clean readable spacing; any future block uses four spaces rather than tabs."
