[[lessons]]
id = "s02-l01"
title = "Name The Lantern Things"
teaches = ["python-variable-store", "python-string-value", "python-integer-value", "python-print-value"]
body = '''
<p>The lantern transcript from the first forge says fixed words. A game cannot grow from fixed words alone: it needs named places to keep facts. A <strong>variable</strong> is a name joined to a value with <code>=</code>. Read the line from right to left: make the value, then bind the name to it. Here <code>town_name</code> holds a string—text inside quotes—and <code>lantern_oil</code> holds an integer, a whole number.</p>
<p>Open the existing <code>main.py</code>. Replace its entire contents with this complete version. It deliberately preserves the PyGame import and the two proof lines from Forge I; this is the same file, extended, not a second program.</p>
<pre><code>import pygame

town_name = "Duskhaven"
lantern_oil = 3

print("Duskhaven: the lantern is lit.")
print("PyGame import: ready.")
print(town_name)
print(lantern_oil)</code></pre>
<p><code>print()</code> can send a quoted string directly, as it did before, or it can send the value currently held by a variable. Do not put quotes around <code>town_name</code> in the last two calls: <code>print(town_name)</code> looks up the stored text, while <code>print("town_name")</code> prints the six letters of the label. Run the file and make the last two terminal lines read <code>Duskhaven</code> and <code>3</code>.</p>
<p>Choose names that say what the value measures. Python convention uses lowercase words separated by underscores, so <code>lantern_oil</code> is easier to revisit than <code>x</code> or <code>LanternOil</code>. A value may be replaced later by another assignment, but this thread gives each fact one clear first owner. Next we will make two named numbers work together.</p>
<div class="callout">A quote marks text data. No quote marks a variable lookup or a number. That single visual difference prevents many early loose threads.</div>
<div class="field-notes"><div class="fn-head">FIELD NOTES // NAMES ARE PART OF THE DESIGN</div><p>Python is case-sensitive: <code>town_name</code> and <code>Town_Name</code> are different names. Keep the spelling identical wherever you use it. For this small file, variables sit below the import and above the prints, so a reader finds the stored world facts before the transcript that reports them.</p></div>
'''

[[lessons.readings]]
label = "Python Tutorial — Numbers and Strings"
url = "https://docs.python.org/3/tutorial/introduction.html"

[[lessons.exercises]]
id = "s02-l01-e1"
type = "mc"
points = 20
prompt = "Which line stores the whole-number oil count under a descriptive Python name?"
choices = ["lantern_oil = 3", "\"lantern_oil\" = 3", "print(lantern_oil = 3)", "lantern oil = 3"]
answer = 0
whyWrong = "A variable name is an unquoted identifier with no spaces; quoting it makes text, putting assignment inside print changes the task, and a space splits the name into invalid syntax."
hint = "Find the choice with the snake_case name on the left of one equals sign and the numeral on the right."
explain = "<code>lantern_oil = 3</code> binds the integer value 3 to a descriptive variable name."

[[lessons.exercises]]
id = "s02-l01-e2"
type = "type"
points = 13
reps = 2
prompt = "Retype the complete pair of named gate facts exactly."
code = '''town_name = "Duskhaven"
lantern_oil = 3'''

[[lessons.exercises]]
id = "s02-l01-e3"
type = "fill"
points = 22
prompt = "Restore the value lookup so the terminal displays the stored town rather than the letters of its label."
code = 'print(____)'
answer = "town_name"
hint = "The missing token is the unquoted snake_case name that holds Duskhaven's text."
whyWrong = "Quoted text would print a literal label, and the oil variable would print a number. This print call needs the existing variable that stores the town's name."

[[lessons.exercises]]
id = "s02-l01-e4"
type = "text"
points = 18
prompt = "What data kind is the unquoted <code>3</code> on the right side of the oil assignment?"
answer = "integer"
accept = ["int", "a whole number"]
hint = "It counts whole flasks; it is not quoted text and has no decimal point."
whyWrong = "The numeral represents a whole-number value, not a string label. Python calls this kind of whole number an integer, or int."

[[lessons.exercises]]
id = "s02-l01-w1"
type = "write"
points = 30
prompt = "A gate slate already holds <code>town_name = \"Duskhaven\"</code>. Write the one print call that uses that stored value to produce exactly <code>Town: Duskhaven</code>; do not hardcode the town inside the print call."
expect = '''Town: Duskhaven'''
hint = "Give print two arguments: the literal label ending in a colon and the provided town_name variable."
starter = '''town_name = "Duskhaven"

# Print the gate label and the stored town_name here.
'''
solution = '''town_name = "Duskhaven"

print("Town:", town_name)'''
