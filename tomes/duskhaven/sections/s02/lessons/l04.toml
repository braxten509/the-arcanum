[[lessons]]
id = "s02-l04"
title = "Ask The Keeper's Name"
teaches = ["python-input-store", "python-input-report"]
body = '''
<p>Duskhaven now knows its own facts. Let it receive one fact from a person. <code>input()</code> displays a prompt, waits in the terminal, and returns what the person types as a string. Store that returned text in a named variable, then place it into the gate report with the f-string form you already own. This is a terminal practice loop; the finished RPG will take player actions from PyGame keyboard events, which we teach when the game has a window.</p>
<p>Keep every earlier line in the canonical <code>main.py</code>. Directly below <code>lamp_price = 1.5</code>, add the input assignment. Then replace the existing one-line formatted gate report beneath the numeric prints with the new report below. Do not make a second <code>main.py</code>, and do not convert the input to a number—we have taught input as text only.</p>
<pre><code>keeper_name = input("Name the lantern keeper: ")

print(f"{keeper_name}, {town_name} holds {oil_total} flasks of oil.")</code></pre>
<p>Save and run <code>python main.py</code>. At <code>Name the lantern keeper:</code>, type <code>Mira</code> and press Enter. The final report contains <code>Mira, Duskhaven holds 5 flasks of oil.</code>. The variable <code>keeper_name</code> receives the typed characters; it is not a magic word and it does not know numbers or choices yet. We will teach those decisions and conversions in later forges.</p>
<p>When a run waits quietly, check whether its input prompt is visible rather than assuming it has crashed. If you misspell <code>keeper_name</code> in the final print, use the traceback rule from Forge I: inspect the last frame naming <code>main.py</code>, repair that spelling, save, and run again. This is the same honest loop, now with a human voice entering the loom.</p>
<div class="callout">For every input, name the answer on the left of <code>=</code>. The prompt asks the question; the variable preserves the answer for later code.</div>
<div class="field-notes"><div class="fn-head">FIELD NOTES // TERMINAL DOOR, NOT GAME CONTROL</div><p><code>input()</code> always gives us text in this forge, even if someone types digits. That is perfect for a keeper's name. Do not use it inside the future PyGame frame loop: a graphical game receives input through its event queue instead. We are practicing Python's value flow here, not simulating the final control scheme.</p></div>
'''

[[lessons.readings]]
label = "Python Built-in Functions — input"
url = "https://docs.python.org/3/library/functions.html#input"

[[lessons.exercises]]
id = "s02-l04-d1"
type = "type"
points = 13
reps = 2
prompt = "Retype the complete keeper-name line that asks and stores the terminal response."
code = 'keeper_name = input("Name the lantern keeper: ")'

[[lessons.exercises]]
id = "s02-l04-e1"
type = "fill"
points = 22
prompt = "Complete the built-in call that waits for the keeper's typed name and stores it in <code>keeper_name</code>."
code = 'keeper_name = ____ ("Name the lantern keeper: ")'
answer = "input"
hint = "Use the built-in function that pauses at the terminal prompt and returns the characters the keeper enters."
whyWrong = "print sends information outward and cannot collect a reply. The assignment needs input(), whose returned text becomes the keeper_name value."

[[lessons.exercises]]
id = "s02-l04-e2"
type = "mc"
points = 20
prompt = "After a person types <code>Mira</code> at the keeper prompt, which value does <code>keeper_name</code> hold in this forge?"
choices = ["The string Mira", "The text of the prompt", "The current oil_total", "A PyGame keyboard event"]
answer = 0
hint = "input() returns the characters entered after the prompt, and this lesson stores that return value on the left of =."
whyWrong = "The prompt is only the question displayed to the terminal, and PyGame events are a later graphical-input topic. input() returns the typed text, which this assignment stores."
explain = "With Mira typed and Enter pressed, keeper_name holds the string Mira for the f-string report."

[[lessons.exercises]]
id = "s02-l04-e3"
type = "text"
points = 18
prompt = "When a terminal run is waiting after the lantern-keeper prompt, what key completes the entered response and lets the program continue?"
answer = "enter"
accept = ["return", "the enter key", "the return key"]
hint = "It is the key you press after typing the keeper's name into a command-line prompt."
whyWrong = "Saving changes the editor file and a mouse click is not part of this terminal exchange. input() receives the line when the user confirms it with Enter or Return."

[[lessons.exercises]]
id = "s02-l04-w1"
type = "write"
points = 34
prompt = "The gate asks for a keeper and already holds <code>town_name = \"Duskhaven\"</code> plus <code>oil_total = 5</code>. Store the supplied name from the existing prompt, then print an f-string report. With input <code>Mira</code>, the exact transcript must be <code>Name the lantern keeper: Mira, Duskhaven holds 5 flasks of oil.</code>"
stdin = '''Mira'''
expect = '''Name the lantern keeper: Mira, Duskhaven holds 5 flasks of oil.'''
hint = "Assign input(...) to keeper_name, then use keeper_name, town_name, and oil_total in braces inside one f-string print call."
starter = '''town_name = "Duskhaven"
oil_total = 5

# Ask for the keeper_name using the stated prompt.
# Print the formatted oil report using all three values.
'''
solution = '''town_name = "Duskhaven"
oil_total = 5
keeper_name = input("Name the lantern keeper: ")

print(f"{keeper_name}, {town_name} holds {oil_total} flasks of oil.")'''

[[lessons.exercises]]
id = "s02-l04-e4"
type = "mc"
points = 19
prompt = "Your report crashes because its f-string uses <code>{keeper_nmae}</code> after the input line stored <code>keeper_name</code>. What is the focused Forge I repair?"
choices = ["Delete the input line so the report skips the name", "Install PyGame again before reading the traceback", "Put quote marks around keeper_nmae so Python ignores it", "Change the f-string placeholder to keeper_name, save main.py, and run again"]
answer = 3
hint = "Compare the exact spelling on the assignment's left side with the spelling inside the braces."
whyWrong = "This is a misspelled variable reference in your file, not a package failure or a reason to erase the feature. Restore the canonical keeper_name spelling, then verify by rerunning."
explain = "Variable names must match exactly. The traceback points to the f-string use site, where keeper_nmae must become keeper_name."
