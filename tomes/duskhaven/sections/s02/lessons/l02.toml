[[lessons]]
id = "s02-l02"
title = "Reckon The Oil"
teaches = ["python-addition-result", "python-subtraction-result", "python-float-value"]
body = '''
<p>Named values become useful when they can answer a question. The gate has <code>lantern_oil</code> flasks already and a courier brings <code>oil_delivered</code> more. Python's <code>+</code> adds numbers; store that answer under a third name so the later message has one trustworthy source. This is arithmetic, not a special game rule: the same pattern will later reckon hit points, coins, and experience.</p>
<p>Keep the existing <code>main.py</code>; do not create another file or discard its import, proof lines, or named facts. Add the three assignments below directly below <code>lantern_oil = 3</code>. Then add the two print lines directly below the existing <code>print(lantern_oil)</code>. These are member-only additions to the canonical file, not a complete replacement.</p>
<pre><code>oil_delivered = 2
oil_total = lantern_oil + oil_delivered
lamp_price = 1.5

print(oil_total)
print(lamp_price)</code></pre>
<p>Run it. The last two numeric lines are <code>5</code> and <code>1.5</code>. The decimal point makes <code>1.5</code> a <strong>float</strong>, Python's name for a decimal number. Keep a float when a value can contain a fraction; keep an integer for whole flasks. Do not write <code>"3" + "2"</code> to reckon oil: those quoted values are strings, so they are text rather than the numeric facts this addition needs.</p>
<p>Subtraction uses <code>-</code> in the same shape: <code>oil_after_burning = oil_total - 1</code>. The operator sits between two numeric values, and the result can be stored under a fresh, descriptive name. We are not adding choices or repetition yet, so this forge only calculates a single known result. In the next thread, we will report that result without manually stitching text and numbers together.</p>
<div class="field-notes"><div class="fn-head">FIELD NOTES // KEEP THE RECEIPT</div><p><code>oil_total</code> records how the total was made. Writing <code>print(3 + 2)</code> may show the same number today, but it hides the meaning and cannot respond when the delivery changes. Named operands make a correction local: change <code>oil_delivered</code>, run again, and the transcript proves the new reckoning.</p></div>
'''

[[lessons.readings]]
label = "Python Tutorial — Using Python as a Calculator"
url = "https://docs.python.org/3/tutorial/introduction.html#using-python-as-a-calculator"

[[lessons.exercises]]
id = "s02-l02-d1"
type = "type"
points = 13
reps = 2
prompt = "Retype the complete oil-total calculation from the gate ledger."
code = '''lantern_oil = 3
oil_delivered = 2
oil_total = lantern_oil + oil_delivered'''

[[lessons.exercises]]
id = "s02-l02-e1"
type = "fill"
points = 22
prompt = "Complete the operator that combines the three stored flasks with the two delivered flasks."
code = 'oil_total = lantern_oil ____ oil_delivered'
answer = "+"
hint = "The total grows by the delivery, so use the arithmetic mark that adds the two named integers."
whyWrong = "A minus sign would remove the delivery, while quotes would turn the operands into text. The total is formed by numeric addition."

[[lessons.exercises]]
id = "s02-l02-e2"
type = "mc"
points = 20
prompt = "After the ledger assigns <code>lamp_price = 1.5</code>, why is that value a float rather than an integer?"
choices = ["It is stored in a variable", "It will be printed later", "It appears after an import", "It has a decimal point"]
answer = 3
hint = "Look at the visible punctuation inside the number itself."
whyWrong = "Variables, imports, and printing do not choose a numeric type. The decimal point in 1.5 marks it as a floating-point number."
explain = "A float represents a number with a decimal component; an integer such as 3 represents a whole number."

[[lessons.exercises]]
id = "s02-l02-w1"
type = "write"
points = 32
prompt = "The courier's receipt starts with <code>lantern_oil = 4</code> and <code>oil_delivered = 3</code>. Compute their sum in a named <code>oil_total</code> variable, then print that variable so the terminal produces exactly <code>7</code>."
expect = '''7'''
hint = "Assign lantern_oil plus oil_delivered to oil_total, then pass oil_total—not a quoted 7—to print."
starter = '''lantern_oil = 4
oil_delivered = 3

# Calculate the combined flasks in oil_total.
# Print the calculated total.
'''
solution = '''lantern_oil = 4
oil_delivered = 3
oil_total = lantern_oil + oil_delivered

print(oil_total)'''
