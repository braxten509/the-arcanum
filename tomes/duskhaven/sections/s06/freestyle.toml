[freestyle]
title = "BUILD: Wake The First Encounter"
brief = '''<p>The road beyond Duskhaven's gate has produced its first honest encounter. Extend the one real external <code>duskhaven/main.py</code>; retain the PyGame import and the earlier gate, supply, ledger, and function work. Do not create a second file or a second declaration of either class.</p><ul><li>Define one complete <code>Player</code> class with <code>__init__(self, name, health)</code>. It must store both received values as <code>self.name</code> and <code>self.health</code>, and include <code>report_status(self)</code> that prints <code>&lt;name&gt; has &lt;health&gt; HP.</code>.</li><li>Define one complete <code>Enemy</code> class with the same name/health initializer and <code>report_status(self)</code>. Add <code>take_damage(self, damage)</code>; it must replace that Enemy's stored health with <code>self.health - damage</code> and print a damage report.</li><li>Construct <code>player = Player("Mira", 12)</code> and <code>mist_wolf = Enemy("Mist Wolf", 8)</code>. Call <code>player.report_status()</code>, then <code>mist_wolf.take_damage(3)</code>, then <code>mist_wolf.report_status()</code>.</li><li>Your final run must visibly include <code>Mira has 12 HP.</code>, a Mist Wolf damage line, and <code>Mist Wolf has 5 HP.</code>. Save the canonical file, run it from the VS Code integrated terminal, and use the final <code>main.py</code> traceback frame to repair any class, indentation, or name mistake before proof.</li></ul>'''
requires = ["tool-edit-save", "tool-run-test", "traceback-locate", "pygame-import-check", "python-fstring-output", "python-subtraction-result", "python-function-parameter", "python-class-declaration", "python-init-method", "python-instance-construct", "python-instance-attributes", "python-instance-method", "python-self-attribute-read", "python-object-status-report", "python-enemy-class", "python-second-object-type", "python-enemy-instance", "python-self-attribute-update", "python-object-method-call", "python-player-enemy-wiring"]
reward = 190
xray = "I dock embers for a duplicate Player or Enemy class, loose health variables competing with an object's health, a method placed outside its class, an initializer misspelled without its paired underscores, or a damage print that never stores the subtraction. I reward one orderly main.py: imports remain at the top, CapWords class names, descriptive snake_case variables and methods, four-space bodies, and a proof run where the wolf truly falls from 8 HP to 5."

[freestyle.badge]
id = "badge-s06"
name = "FIRST BREATH"
desc = "Gave Duskhaven's first hero and foe their own living state."

[[freestyle.rubric]]
criterion = "Player Owns Hero State"
weight = 20
desc = "One complete Player class has __init__(self, name, health), stores self.name and self.health, and report_status prints the constructed player's actual stored name and health."

[[freestyle.rubric]]
criterion = "Enemy Owns Foe State"
weight = 20
desc = "One complete Enemy class has its own name/health initializer and report_status, and mist_wolf is constructed as Enemy(\"Mist Wolf\", 8) rather than modeled through loose competing health variables."

[[freestyle.rubric]]
criterion = "Damage Changes The Correct Object"
weight = 25
desc = "Enemy.take_damage receives damage, stores self.health - damage back into self.health, reports the action, and the subsequent mist_wolf status proves the stored value is 5 after 3 damage."

[[freestyle.rubric]]
criterion = "Runs The Growing Realm"
weight = 20
desc = "The single canonical main.py retains the PyGame import and earlier Duskhaven work, runs in the external workspace, and visibly prints Mira has 12 HP., a Mist Wolf damage line, and Mist Wolf has 5 HP."

[[freestyle.rubric]]
criterion = "Worldwright's Python Craft"
weight = 15
desc = "Uses CapWords class names and descriptive snake_case instance variables and methods; keeps imports at the file top, class definitions separated from top-level code, methods indented four spaces inside their class, and avoids duplicate classes or files."
