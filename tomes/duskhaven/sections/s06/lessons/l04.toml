[[lessons]]
id = "s06-l04"
title = "Let Objects Keep Their Wounds"
teaches = ["python-self-attribute-update", "python-object-method-call", "python-player-enemy-wiring"]
body = '''
<p>A health attribute becomes useful when its owner can change it. In the existing <code>Enemy</code> class below <code>Player</code>, add only this new method directly after <code>report_status</code>. Do not replace the class, create a second Enemy declaration, or duplicate <code>health</code> as a left-margin variable; its initializer and report method stay exactly where Forge VI put them.</p>
<ol><li>Insert <code>def take_damage(self, damage):</code> at the same four-space indentation as <code>report_status</code>.</li><li>Inside that method, indent <code>self.health = self.health - damage</code> by eight spaces.</li><li>On the next eight-space line, insert <code>print(f"{self.name} takes {damage} damage.")</code>.</li></ol>
<p>The parameter <code>damage</code> receives one integer from the caller. On the right side, <code>self.health - damage</code> calculates a new number using the old stored health and Forge II subtraction. The assignment then writes that result back onto the same Enemy instance. The final print reports the action; it does not perform the subtraction by itself.</p>
<p>After <code>mist_wolf = Enemy("Mist Wolf", 8)</code>, add these left-margin calls. They deliberately reach backward to the Player's method and then forward to the enemy's changing state:</p>
<pre><code>player.report_status()
mist_wolf.take_damage(3)
mist_wolf.report_status()</code></pre>
<p>The resulting enemy status is 5 HP because 8 minus 3 is 5. The call uses parentheses because it runs a method and supplies its argument; the later dot lookup happens inside the method through <code>self</code>. Do not write <code>mist_wolf.health - 3</code> alone: that calculates a value and throws it away. Do not write <code>self.health</code> at the file's left margin either; <code>self</code> exists only while a method is serving a particular object.</p>
<p>Run the full file after inserting the member and calls. This is a tiny encounter proof, not turn-based combat yet. The later battle forge will choose damage formulas and turns; today the important contract is narrower and sturdier: the Enemy object owns its own health, and a method updates that owner.</p>
<div class="callout">Compute from the old attribute, then assign the result back to that same attribute. Otherwise the wound is only spoken, never kept.</div>
<div class="field-notes"><div class="fn-head">FIELD NOTES // A CONTROLLED FIRST CHANGE</div><p>This first method permits health to fall below zero if given too much damage. That is intentional scope: comparisons and branches exist, but clamping and battle rules belong to their later forge. Do not silently invent future combat policy here.</p></div>
'''

[[lessons.readings]]
label = "Python Tutorial — Instance Objects"
url = "https://docs.python.org/3/tutorial/classes.html#instance-objects"

[[lessons.exercises]]
id = "s06-l04-e1"
type = "text"
points = 20
prompt = "When <code>take_damage</code> runs, what kind of thing has its hit points changed: a parameter, a class blueprint, or the creature created from <code>Enemy</code>?"
answer = "instance"
accept = ["an instance", "enemy instance", "the enemy instance"]
hint = "The call begins with mist_wolf, which was made by Enemy(...); that constructed creature is the target of the method's self."
whyWrong = "damage is only the incoming parameter, and Enemy is the reusable blueprint. The method acts on the particular constructed instance that made the call."

[[lessons.exercises]]
id = "s06-l04-e2"
type = "mc"
points = 24
prompt = "A mist wolf begins with 8 health. What does <code>mist_wolf.take_damage(3)</code> leave in <code>mist_wolf.health</code> after the taught method runs?"
choices = ["3, because the argument replaces health", "8, because print cannot change a value", "5, because the method stores 8 - 3 back on the instance", "11, because damage is added"]
answer = 2
hint = "Follow the right-side subtraction first, then the assignment back through self.health."
whyWrong = "The argument is subtracted rather than substituted or added, and the assignment—not merely print—updates the attribute. Starting at 8 and subtracting 3 leaves 5."
explain = "take_damage reads this Enemy's old health, subtracts the received damage, and stores the result on that same object."

[[lessons.exercises]]
id = "s06-l04-e3"
type = "fill"
points = 25
prompt = "Restore the received amount in the calculation that lowers this Enemy's own health."
code = '''    def take_damage(self, damage):
        self.health = self.health - ____'''
answer = "damage"
hint = "Use the second parameter from this method header; it is the value supplied by a call such as mist_wolf.take_damage(3)."
whyWrong = "self.health is the old stored value already present on the other side of the minus, while mist_wolf is an outside instance variable. The received damage parameter is what must be subtracted."

[[lessons.exercises]]
id = "s06-l04-w1"
type = "write"
points = 35
prompt = "Define a complete <code>Enemy</code> class with its name/health initializer and <code>take_damage</code> method. Construct <code>cinder_rat = Enemy(&quot;Cinder Rat&quot;, 6)</code>, call <code>cinder_rat.take_damage(2)</code>, then print its stored health with an f-string so stdout is exactly <code>Cinder Rat remaining HP: 4</code>."
expect = '''Cinder Rat remaining HP: 4'''
hint = "The method must assign self.health = self.health - damage; the final report reads cinder_rat.name and the changed cinder_rat.health, not literal numbers."
starter = '''# Define Enemy with __init__ and take_damage.

# Construct cinder_rat, apply 2 damage, then report its stored result.
'''
solution = '''class Enemy:
    def __init__(self, name, health):
        self.name = name
        self.health = health

    def take_damage(self, damage):
        self.health = self.health - damage


cinder_rat = Enemy("Cinder Rat", 6)
cinder_rat.take_damage(2)
print(f"{cinder_rat.name} remaining HP: {cinder_rat.health}")'''

