brief = '''<p>A ledger records facts, apprentice; a living form keeps its own facts together and knows what may be done with them. In this forge, you bind the first inhabitants of the real external <code>duskhaven/main.py</code>: a <code>Player</code> and an <code>Enemy</code> with names, health, and small honest behaviors.</p><p>We are still writing ordinary Python in the same canonical file, not simulating PyGame. The window arrives in the next forge. Keep the existing import, lantern proof, gate work, hoards, ledgers, and functions; add the class owners below the earlier function definitions and create their instances after the data they need. A class is the pattern; an instance is one creature made from it.</p><div class="callout">The Worldwright's rule: give each creature one keeper for its state. A name and health scattered through loose variables are a thread waiting to be pulled.</div>'''
