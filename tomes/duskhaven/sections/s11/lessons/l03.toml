[[lessons]]
id = "s11-l03"
title = "Refuse The Bad Step"
teaches = ["python-boolean-not", "pygame-proposed-rect-movement", "pygame-axis-wall-blocking"]
body = '''
<p>Now give the stonework teeth. A collision answer must govern movement before the float owner changes. Add this complete new helper after <code>draw_world</code> in canonical <code>main.py</code>; do not place it inside <code>draw_world</code>, and do not make a second game loop. A function is the correct owner because both horizontal and vertical proposals need the same question.</p>
<pre><code>def hits_wall(candidate_rect, wall_rects):
    for wall_rect in wall_rects:
        if candidate_rect.colliderect(wall_rect):
            return True
    return False</code></pre>
<p>Forge V's <code>return</code> ends this helper with an answer. The first overlapping wall proves the proposal is blocked, so returning <code>True</code> early is enough; when the direct-list loop finishes without an overlap, <code>False</code> says the space is clear. This helper does not draw, move Mira, or modify the wall list. Those boundaries keep a loose thread easy to find.</p>
<p>Replace only Forge IX's four direct coordinate-changing key branches with the following members in the existing loop, after <code>keys = pygame.key.get_pressed()</code>. The Rect from Thread I must be made immediately before these members. Each branch makes a candidate on one axis, checks it, and commits the matching float owner only when clear.</p>
<pre><code>if keys[pygame.K_LEFT]:
    candidate_rect = mira_rect.move(-int(mira_speed * dt), 0)
    if not hits_wall(candidate_rect, wall_rects):
        mira_x -= mira_speed * dt
if keys[pygame.K_RIGHT]:
    candidate_rect = mira_rect.move(int(mira_speed * dt), 0)
    if not hits_wall(candidate_rect, wall_rects):
        mira_x += mira_speed * dt
if keys[pygame.K_UP]:
    candidate_rect = mira_rect.move(0, -int(mira_speed * dt))
    if not hits_wall(candidate_rect, wall_rects):
        mira_y -= mira_speed * dt
if keys[pygame.K_DOWN]:
    candidate_rect = mira_rect.move(0, int(mira_speed * dt))
    if not hits_wall(candidate_rect, wall_rects):
        mira_y += mira_speed * dt</code></pre>
<p><code>move</code> returns a proposed Rect; it does not alter <code>mira_rect</code>. The separate axis checks are intentional. A diagonal held-key move can accept x and refuse y, sliding along a wall instead of locking both directions. <code>not</code>, learned with Booleans in Forge III, reverses the helper's blocked answer so the nested update runs only for clear space.</p>
<p>Run the real game and press each arrow into a wall. Mira should stop instead of crossing its colored boundary while open directions still work. The camera remains a rendering conversion after movement; never subtract <code>camera_x</code> when testing world-space Rects.</p>
<div class="callout">Propose, ask, then commit. Moving first and apologizing later is how a traveler leaks through stone.</div>
<div class="field-notes"><div class="fn-head">FIELD NOTES // SMALL STEPS</div><p>This beginner collision uses one frame's candidate Rect. At the taught speed and 60 FPS the step is only a few pixels, safe against the 48-pixel walls. Very fast future movement needs a sweep or smaller substeps; do not pretend this simple check is a teleport-proof physics engine.</p></div>
'''

[[lessons.readings]]
label = "PyGame Rect — move and colliderect"
url = "https://www.pygame.org/docs/ref/rect.html#pygame.Rect.move"

[[lessons.exercises]]
id = "s11-l03-e1"
type = "mc"
points = 28
prompt = "Why does the right-arrow branch test <code>candidate_rect</code> before changing <code>mira_x</code>?"
choices = ["It lets screen.blit choose a sprite image", "It makes the camera follow twice as fast", "It prevents a blocked proposal from becoming Mira's stored world position", "It converts every wall into a map symbol"]
answer = 2
hint = "The candidate is a possible next boundary, while mira_x is the durable float owner that should remain safe on a collision."
whyWrong = "Sprite selection, camera speed, and terrain symbols are unrelated to the order of a collision test. The specific mistake is committing the bad coordinate and only then discovering it overlaps stone."
explain = "A clear candidate authorizes the float update; a colliding candidate leaves Mira at the last safe world position."

[[lessons.exercises]]
id = "s11-l03-e2"
type = "fill"
points = 26
prompt = "Restore the Boolean word that permits the coordinate update only when the helper reports a clear candidate."
code = 'if ____ hits_wall(candidate_rect, wall_rects):'
answer = "not"
hint = "hits_wall returns True for blocked space, but the nested movement needs the opposite condition."
whyWrong = "Using True directly would update Mira when a wall was found, and False is a value rather than the taught inversion of the helper call. not reverses the blocked answer."

[[lessons.exercises]]
id = "s11-l03-d1"
type = "type"
points = 14
reps = 2
prompt = "Retype the wall-check helper that returns early on the first overlapping Rect."
code = '''def hits_wall(candidate_rect, wall_rects):
    for wall_rect in wall_rects:
        if candidate_rect.colliderect(wall_rect):
            return True
    return False'''

[[lessons.exercises]]
id = "s11-l03-e3"
type = "text"
points = 23
prompt = "What helper returns <code>True</code> as soon as a proposed boundary overlaps any member of the wall list?"
answer = "hits_wall"
hint = "It begins with hits and takes a candidate Rect plus the shared wall collection."
whyWrong = "draw_world paints terrain and colliderect is a Rect method, not the reusable list-walking helper. The helper that owns the early-return scan is hits_wall."

[[lessons.exercises]]
id = "s11-l03-w1"
type = "write"
points = 36
prompt = "A rightward proposal moves Mira from x 144 by 18 pixels. A wall begins at x 192, and Mira is 32 pixels wide. Compute the candidate right edge, then decide whether it is clear using <code>&lt;=</code> against the wall x. Print exactly <code>Candidate right: 194</code> and <code>Clear: False</code>."
expect = '''Candidate right: 194
Clear: False'''
hint = "First add move_x to mira_x, then add mira_size; 194 is not <= the wall's 192 edge."
starter = '''mira_x = 144
move_x = 18
mira_size = 32
wall_x = 192

# Compute the proposed right edge and whether it stays at or before the wall.
'''
solution = '''mira_x = 144
move_x = 18
mira_size = 32
wall_x = 192

candidate_right = mira_x + move_x + mira_size
clear = candidate_right <= wall_x

print(f"Candidate right: {candidate_right}")
print(f"Clear: {clear}")'''
