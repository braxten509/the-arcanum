[[lessons]]
id = "s11-l04"
title = "Close The World's Edge"
teaches = ["pygame-world-dimensions", "pygame-world-bound-clamp", "pygame-collision-loop-integration"]
body = '''
<p>Walls stop Mira from entering forbidden places inside the map. Bounds stop her from leaving the map entirely. First add these top-level members after <code>wall_rects</code>. <code>len</code> counts items in a list: the first row's count is the number of columns, while the outer map's count is the number of rows. Multiplying each count by Forge X's <code>tile_size</code> converts map facts into world pixels.</p>
<pre><code>world_width = len(world_map[0]) * tile_size
world_height = len(world_map) * tile_size</code></pre>
<p>Now add this helper below <code>hits_wall</code>. <code>min(a, b)</code> chooses the smaller value; <code>max(a, b)</code> chooses the larger. Nesting them clamps a value between a low and high limit: first <code>min</code> prevents crossing the far edge, then <code>max</code> prevents crossing zero. The upper limit subtracts <code>mira_size</code>, because Mira's right and bottom edges—not merely her upper-left point—must remain inside the realm.</p>
<pre><code>def clamp_mira_to_world():
    global mira_x, mira_y
    mira_x = max(0, min(mira_x, world_width - mira_size))
    mira_y = max(0, min(mira_y, world_height - mira_size))</code></pre>
<p>A function normally reads a global owner, but assignment would otherwise create a local variable with the same name. The two <code>global</code> names explicitly say these assignments repair the established top-level float owners. Call <code>clamp_mira_to_world()</code> once after all four proposed movement branches and before camera calculations. Do not clamp camera values: the camera is a lens, whereas these limits are a rule about Mira's world position.</p>
<p>The previous thread's walls and this thread's bounds cooperate. A candidate that intersects stone is refused before it changes a float. A clear candidate can change the float, then the clamp catches an outer edge. Keep both mechanisms. Replacing wall tests with a clamp would make internal stone passable; relying only on walls lets Mira walk beyond the final row.</p>
<p>For the freestyle, enlarge Forge X's map before calculating these dimensions so there is real ground beyond the 960-by-540 window. Run it outside the study, hold every arrow at the world edge and against every wall, and verify the sprite never leaves the colored realm or crosses stone. The callback is deliberate: nested lists define the map, delta time produces movement, camera subtraction draws it, and Rects judge where it may go.</p>
<div class="callout">The map owns its size. Derive the fence from that owner; never scatter a guessed last coordinate through four key branches.</div>
<div class="field-notes"><div class="fn-head">FIELD NOTES // GLOBAL IS A NARROW TOOL</div><p>Use <code>global</code> here only because this small course still keeps Mira's state at module level. A later larger project may put state on an object, but that design has not been taught and must not be smuggled into this forge.</p></div>
'''

[[lessons.readings]]
label = "Python Built-in Functions — len, min, and max"
url = "https://docs.python.org/3/library/functions.html"

[[lessons.exercises]]
id = "s11-l04-e1"
type = "fill"
points = 27
prompt = "Restore the built-in that counts the rows in the outer world map before converting them to pixels."
code = 'world_height = ____(world_map) * tile_size'
answer = "len"
hint = "Use the built-in introduced in this thread that returns how many list members exist."
whyWrong = "range creates a sequence rather than counting this existing list, while min and max compare values. len measures the outer map's row count."

[[lessons.exercises]]
id = "s11-l04-e2"
type = "mc"
points = 28
prompt = "Why is the right-hand clamp limit <code>world_width - mira_size</code> instead of merely <code>world_width</code>?"
choices = ["Because camera_x must always equal world_width", "Because len returns pixels rather than list members", "Because colliderect changes a Rect into a list", "Because the sprite's whole 32-pixel body must fit before the world’s right edge"]
answer = 3
hint = "Think about where Mira's right edge lands if her upper-left x were allowed to equal the map width."
whyWrong = "Camera state, list counting, and Rect method behavior do not account for the body's width. Allowing the upper-left point at world_width would leave the entire sprite outside the realm; subtract its size to keep its far edge inside."
explain = "A 32-pixel Mira at world_width - 32 ends exactly at the right edge instead of extending past it."

[[lessons.exercises]]
id = "s11-l04-e3"
type = "text"
points = 23
prompt = "Which helper must run after the four movement branches so a clear step cannot leave the outer map?"
answer = "clamp_mira_to_world"
hint = "Its name begins with clamp and it repairs the established float position owners against derived map dimensions."
whyWrong = "hits_wall only scans internal stone and draw_world only paints map data. The post-movement helper that enforces the outer limits is clamp_mira_to_world."

[[lessons.exercises]]
id = "s11-l04-d1"
type = "type"
points = 14
reps = 2
prompt = "Retype the exact clamp assignments that keep both float coordinate owners inside the map after movement."
code = '''mira_x = max(0, min(mira_x, world_width - mira_size))
mira_y = max(0, min(mira_y, world_height - mira_size))'''

[[lessons.exercises]]
id = "s11-l04-w1"
type = "write"
points = 36
prompt = "A world is 576 pixels wide and Mira is 32 pixels wide. Her proposed x is 560. Use the taught nested <code>max</code>/<code>min</code> clamp to compute a legal x, then print exactly <code>Clamped x: 544</code>. The result must come from the three named values."
expect = '''Clamped x: 544'''
hint = "The farthest legal upper-left x is world_width - mira_size, or 544; use min before max exactly as the helper does."
starter = '''world_width = 576
mira_size = 32
mira_x = 560

# Clamp mira_x between zero and the last legal upper-left position.
'''
solution = '''world_width = 576
mira_size = 32
mira_x = 560

clamped_x = max(0, min(mira_x, world_width - mira_size))
print(f"Clamped x: {clamped_x}")'''
