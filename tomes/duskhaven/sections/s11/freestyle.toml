[freestyle]
title = "BUILD: Seal Duskhaven's Stone Roads"
brief = '''<p>The Overworld is painted, apprentice. Now make it inhabitable. Extend the one real external <code>duskhaven/main.py</code> from Forge X. Preserve its earlier terminal work, Player and Enemy owners, one display, Clock and tick, QUIT branch, held-key input, float Mira position, sprite resource, map renderer, camera conversion, fill, flip, and clean quit. Do not create a second program, display, loop, Clock, class, sprite, or coordinate system.</p><ul><li>Expand the existing rectangular <code>world_map</code> to at least 14 rows and 22 columns while retaining only visible <code>"g"</code> and <code>"w"</code> terrain symbols and <code>tile_size = 48</code>. Derive <code>world_width = len(world_map[0]) * tile_size</code> and <code>world_height = len(world_map) * tile_size</code>.</li><li>Define <code>mira_size = 32</code>, a visible <code>wall_color</code>, and a non-empty <code>wall_rects</code> list containing at least three <code>pygame.Rect</code> walls in world coordinates. Draw every wall after <code>draw_world(...)</code> and before Mira, converting each wall x/y through <code>wall_rect.x - camera_x</code> and <code>wall_rect.y - camera_y</code>.</li><li>Rebuild <code>mira_rect = pygame.Rect(int(mira_x), int(mira_y), mira_size, mira_size)</code> each frame. Define <code>hits_wall(candidate_rect, wall_rects)</code> that returns whether any wall overlaps a proposal. Replace the old direct arrow-coordinate changes with proposed one-axis Rect moves: a direction changes <code>mira_x</code> or <code>mira_y</code> by <code>mira_speed * dt</code> only when its candidate does not hit a wall.</li><li>Define and call <code>clamp_mira_to_world()</code> after the movement branches and before camera calculations. It must retain the established float owners and clamp x/y between zero and <code>world_width - mira_size</code> / <code>world_height - mira_size</code>.</li><li>Save and run from VS Code. Outside the study, hold every arrow into each world edge and at least one colored wall: Mira must stop rather than leave the map or cross stone, must still move through open ground, the map and walls must scroll opposite travel, and the normal window close must return the terminal without a traceback.</li></ul>'''
requires = ["python-list-literal", "python-list-for-iterate", "python-function-define", "python-function-parameter", "python-return-value", "python-float-value", "python-boolean-not", "pygame-running-flag", "pygame-event-queue", "pygame-quit-event", "pygame-clean-quit", "pygame-display-flip", "pygame-surface-fill", "pygame-rectangle-draw", "pygame-surface-blit", "pygame-draw-order", "pygame-key-state", "pygame-position-owner", "pygame-directional-key-branches", "pygame-delta-seconds", "pygame-frame-rate-independent-movement", "tile-grid-owner", "pygame-nested-tile-render", "camera-world-to-screen", "camera-follow-player", "pygame-overworld-loop-wiring", "pygame-rect-owner", "pygame-rect-overlap-test", "pygame-wall-rect-list", "pygame-world-space-wall-draw", "pygame-proposed-rect-movement", "pygame-axis-wall-blocking", "pygame-world-dimensions", "pygame-world-bound-clamp", "pygame-collision-loop-integration"]
reward = 330
xray = "I dock embers for raw camera coordinates in collision, a Rect that replaces Mira's float owners, a wall list painted but never tested, a movement update committed before its test, a clamp that lets the sprite's far edge leave the map, or a second loop. I reward named world-space owners, one small early-return wall helper, separate axis proposals, and a clamp derived from the map instead of guessed constants."

[freestyle.badge]
id = "badge-s11"
name = "STONEBOUND WAYFINDER"
desc = "Sealed the road against broken edges and false passages."

[[freestyle.rubric]]
criterion = "Builds A Bounded World"
weight = 20
desc = "main.py retains tile_size = 48, expands world_map to at least 14 by 22 visible g/w cells, and derives world_width and world_height with len rather than hardcoded map-pixel limits."

[[freestyle.rubric]]
criterion = "Draws World-Space Stonework"
weight = 20
desc = "Defines mira_size = 32, wall_color, and at least three world-space pygame.Rect wall_rects; a direct-list loop draws every wall after draw_world and before Mira using x/y minus the established camera offsets."

[[freestyle.rubric]]
criterion = "Blocks Proposed Movement"
weight = 25
desc = "Rebuilds mira_rect from int(mira_x), int(mira_y), and mira_size each frame; hits_wall scans wall_rects with colliderect; each arrow direction tests an axis-specific proposed Rect and changes the matching float owner by mira_speed * dt only when clear."

[[freestyle.rubric]]
criterion = "Holds The Outer Boundary"
weight = 20
desc = "Calls clamp_mira_to_world after all movement branches and before camera calculations; it clamps both float owners to zero through world_width - mira_size and world_height - mira_size, so Mira neither crosses internal stone nor leaves the outer map during the real run."

[[freestyle.rubric]]
criterion = "Worldwright's Python Craft"
weight = 15
desc = "Uses descriptive snake_case names such as wall_rects and candidate_rect, CapWords only for existing classes, four-space indentation for functions, loops, and branches, one space around operators, and extends the one existing main.py loop without duplicate files, displays, loops, or classes."
