id = "s11"
codename = "FORGE XI // WALLS & BOUNDS"
short = "Walls & Bounds"
title = "Walls & Bounds"
build = "Give Mira solid wall collision and keep her inside the tiled realm."
brief = '''<p>A camera can show a world, apprentice; it cannot keep a traveler from walking through its bones. In this forge you will give Mira a rectangular body, give the overworld a small, named set of solid walls, test a proposed step before committing it, and set the outer limits of the realm.</p><p>This is a careful extension of the one external <code>duskhaven/main.py</code>. Its map, camera conversion, display, Clock, held-key input, floating Mira position, sprite, event branch, fill, flip, and clean quit remain. A wall lives in world coordinates just like a tile, then the camera converts it for drawing. The Worldwright permits no second loop, display, player class, or secret coordinate system.</p><div class="callout">A wall is not paint. It is a rule checked before a position becomes true.</div>'''
