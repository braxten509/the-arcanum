[freestyle]
title = "BUILD: Raise Duskhaven's First Window"
brief = '''<p>The realm has outgrown the terminal, apprentice. Extend the one real external <code>duskhaven/main.py</code> from Forge VI. Keep its existing PyGame import, ledgers, functions, Player, Enemy, instances, and encounter proof; do not create another file, loop, display Surface, or copy of either class. This commission is real PyGame work: run it from VS Code and operate its window outside the study.</p><ul><li>After the existing top-level Duskhaven work, call <code>pygame.init()</code>, create exactly one <code>screen</code> with <code>pygame.display.set_mode((960, 540))</code>, and set the window caption to <code>Duskhaven</code>.</li><li>Create exactly one <code>clock = pygame.time.Clock()</code> before the loop and one Boolean <code>running = True</code>.</li><li>Use one <code>while running</code> loop. Inside it, use <code>for event in pygame.event.get()</code>; when <code>event.type == pygame.QUIT</code>, set <code>running = False</code>.</li><li>Still inside that same loop and after event handling, call <code>pygame.display.flip()</code> and <code>clock.tick(60)</code>. After the loop ends, call <code>pygame.quit()</code> exactly once.</li><li>Save <code>main.py</code>, run it in the VS Code integrated terminal, leave the titled 960-by-540 window open long enough to prove it remains responsive, then close it using the window's normal close control. The terminal must return without a traceback.</li></ul>'''
requires = ["tool-edit-save", "tool-run-test", "tool-diagnose", "traceback-locate", "pygame-import-check", "python-boolean-value", "python-comparison-result", "python-if-branch", "python-while-condition", "python-for-range-loop", "python-class-declaration", "python-enemy-class", "python-player-enemy-wiring", "pygame-init", "pygame-display-surface", "pygame-window-caption", "pygame-running-flag", "pygame-event-queue", "pygame-quit-event", "pygame-clean-quit", "pygame-display-flip", "pygame-clock-create", "pygame-fps-cap", "pygame-window-loop-wiring"]
reward = 230
xray = "I dock embers for a second window or loop, a naked while True that ignores the close control, pygame.quit() placed inside the loop, event handling outside the loop, or a Clock that never ticks. I reward the one clean frame order: setup once, drain events, flip, tick, then quit; imports topmost, descriptive snake_case state names, four-space bodies, and the earlier Player/Enemy proof left intact."

