desc = "One running Boolean controls one while running loop; the loop drains pygame.event.get(), tests event.type == pygame.QUIT, sets running to False for that event, and reaches one pygame.quit() after the loop."

[[freestyle.rubric]]
criterion = "Presents A Capped Frame"
weight = 20
desc = "One clock = pygame.time.Clock() is created before the loop, and each live loop iteration calls pygame.display.flip() then clock.tick(60) after event handling."

[[freestyle.rubric]]
criterion = "Runs The Growing Realm"
weight = 20
desc = "The canonical external main.py retains its earlier PyGame import, ledger/function work, Player and Enemy encounter proof, opens a titled 960-by-540 window that stays responsive, and returns to the terminal without a traceback after its normal close control is used."

[[freestyle.rubric]]
criterion = "Worldwright's Python Craft"
weight = 15
desc = "Uses lowercase snake_case names such as screen, running, and clock; keeps imports at the file top and top-level setup ordered before the loop; uses four-space indentation for while, for, and if bodies; and keeps one readable window lifecycle rather than duplicate files, classes, loops, or displays."
