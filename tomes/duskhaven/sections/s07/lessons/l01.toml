[[lessons]]
id = "s07-l01"
title = "Light The Display Surface"
teaches = ["pygame-init", "pygame-display-surface", "pygame-window-caption"]
body = '''
<p>PyGame was installed back in the first forge, but importing a loom is not the same as threading it. At the bottom of the existing canonical <code>main.py</code>, after the previous Player and Enemy proof calls, add this new top-level window setup. Do not put it inside <code>Player</code>, <code>Enemy</code>, or an earlier reporting function; the window belongs to the game's outer path.</p>
<pre><code>pygame.init()
screen = pygame.display.set_mode((960, 540))
pygame.display.set_caption("Duskhaven")</code></pre>
<p><code>pygame.init()</code> asks PyGame to initialize its imported modules. Then <code>pygame.display.set_mode((960, 540))</code> creates the one display window and returns its <strong>display Surface</strong>. Store that returned object in the canonical variable <code>screen</code>. The tuple is a width followed by a height, so this first window is 960 pixels wide and 540 pixels high. We will draw on <code>screen</code> in the next forge; for now, it is the canvas reserved for the realm.</p>
<p><code>pygame.display.set_caption("Duskhaven")</code> gives the operating system's title bar a useful name. It does not draw title text inside the game—there is no game art yet. That distinction matters: the display API owns the outer window, while later drawing code owns pixels on its Surface. Keep the existing <code>import pygame</code> at the very top of the file. Calling <code>pygame.init()</code> before a later <code>pygame.display</code> operation makes the initialization boundary visible to a reader.</p>
<p>Save <code>main.py</code> and run it from the VS Code integrated terminal. A window may appear only briefly in this first thread because the script reaches its end; that is expected evidence that setup works, not a defect to paper over. Do not add an endless <code>while True</code> yet. We need a named running condition and a way to heed a close request before a real loop is safe.</p>
<div class="callout">The returned Surface is a thing, not a magic global. Preserve <code>screen</code>; later threads will use that exact owner to show Duskhaven's frames.</div>
<div class="field-notes"><div class="fn-head">FIELD NOTES // ONE DISPLAY, ONE OWNER</div><p>PyGame maintains one active display Surface. Calling <code>set_mode</code> again replaces that display, so this forge establishes one named <code>screen</code> rather than scattering window creation through functions or classes.</p></div>
'''

[[lessons.readings]]
label = "PyGame Display — set_mode and the Display Surface"
url = "https://www.pygame.org/docs/ref/display.html#pygame.display.set_mode"

[[lessons.exercises]]
id = "s07-l01-d1"
type = "type"
points = 14
reps = 2
prompt = "Retype the three top-level lines that initialize PyGame, preserve the returned display Surface, and name the Duskhaven window."
code = '''pygame.init()
screen = pygame.display.set_mode((960, 540))
pygame.display.set_caption("Duskhaven")'''

[[lessons.exercises]]
id = "s07-l01-e1"
type = "fill"
points = 25
prompt = "Restore the display function that creates the 960-by-540 window and hands its Surface to <code>screen</code>."
code = 'screen = pygame.display.____((960, 540))'
answer = "set_mode"
hint = "The missing call lives on pygame.display and its name describes selecting the window's mode, not drawing into the Surface."
whyWrong = "flip only presents work already drawn, while set_caption changes the title bar. set_mode is the display call that creates the window and returns the Surface."

[[lessons.exercises]]
id = "s07-l01-e2"
type = "mc"
points = 24
prompt = "After the taught setup, which variable owns the Surface that later drawing code will use?"
choices = ["pygame", "screen", "Duskhaven", "caption"]
answer = 1
hint = "Look at the left side of the assignment whose right side is pygame.display.set_mode(...)."
whyWrong = "pygame is the imported module, Duskhaven is caption text, and caption is not a variable created by the setup. The returned Surface is stored in screen."
explain = "set_mode returns the display Surface, and the assignment gives that object the stable name screen."

[[lessons.exercises]]
id = "s07-l01-w1"
type = "write"
points = 34
prompt = "A window request must keep width and height as numbers, not a painted answer. Store <code>960</code> in <code>window_width</code> and <code>540</code> in <code>window_height</code>. Compute their product in <code>pixel_count</code> and use one f-string to print exactly <code>Duskhaven canvas: 518400 pixels</code>. This plain-file lab rehearses the arithmetic behind the real external PyGame call; the game itself receives window input through the display API, not stdin."
expect = '''Duskhaven canvas: 518400 pixels'''
hint = "Multiply window_width by window_height before the f-string; 960 times 540 is the pixel count you must report."
starter = '''window_width = 960
window_height = 540

# Compute pixel_count from both dimensions, then report it with an f-string.
'''
solution = '''window_width = 960
window_height = 540
pixel_count = window_width * window_height
print(f"Duskhaven canvas: {pixel_count} pixels")'''

[[lessons.exercises]]
id = "s07-l01-e3"
type = "text"
points = 20
prompt = "What is the PyGame object returned by <code>pygame.display.set_mode((960, 540))</code> called?"
answer = "display surface"
accept = ["surface", "a display surface", "the display surface"]
hint = "It is the canvas-like object stored in screen, not the module or the title-bar text."
whyWrong = "The window is the operating-system container and pygame is the library module. set_mode specifically returns the display Surface that later receives drawing operations."
