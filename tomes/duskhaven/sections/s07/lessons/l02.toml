[[lessons]]
id = "s07-l02"
title = "Hear The Closing Bell"
teaches = ["pygame-running-flag", "pygame-event-queue", "pygame-quit-event", "pygame-clean-quit"]
body = '''
<p>A real window belongs partly to the operating system. Click its close control and the system places a <code>pygame.QUIT</code> event in PyGame's event queue; it does not rewrite your Python variable for you. Replace nothing from Thread I. Immediately after its setup lines, add this complete new top-level loop block. It is the first owner of <code>running</code>, and it uses the already-created <code>screen</code> only as a future promise.</p>
<pre><code>running = True

while running:
    for event in pygame.event.get():
        if event.type == pygame.QUIT:
            running = False

pygame.quit()</code></pre>
<p><code>running = True</code> gives the loop a named condition. Unlike <code>while True</code>, it has a deliberate exit door. Every trip around <code>while running:</code>, <code>pygame.event.get()</code> retrieves the pending events so the operating system sees a responsive application. The <code>for event</code> loop reaches back to Forge III's direct iteration: each <code>event</code> is one message, not a key held down or a command the player typed into the terminal.</p>
<p>Use <code>==</code>, not <code>=</code>, in <code>event.type == pygame.QUIT</code>. The comparison asks whether this particular message is the close request. When it is, set <code>running = False</code>. The loop condition fails on the next check, execution reaches <code>pygame.quit()</code>, and PyGame releases its initialized resources. <code>pygame.quit()</code> does not by itself stop Python; the condition is what lets the program reach the end cleanly.</p>
<p>Save and run the external <code>main.py</code>. Close the titled window using its normal close control. If it ignores the request, first inspect indentation: the <code>if</code> belongs inside the <code>for</code>, and the <code>for</code> belongs inside <code>while</code>. If the terminal points at a misspelled constant such as <code>pygame.QIUT</code>, repair that named token, save, and run again. This is event-driven input; no <code>input()</code> belongs in the game loop.</p>
<div class="callout">Do not hide a close request with <code>while True</code>. A named flag makes the loop's lifetime readable, testable, and fit for later scene changes.</div>
<div class="field-notes"><div class="fn-head">FIELD NOTES // QUEUE, NOT KEY STATE</div><p>The queue records discrete happenings such as a close request. Held-key movement needs a different API and arrives in Forge IX. Do not invent keyboard movement from this loop yet; collecting events is the foundation, not the whole control scheme.</p></div>
'''

[[lessons.readings]]
label = "PyGame Event — event.get and QUIT"
url = "https://www.pygame.org/docs/ref/event.html#pygame.event.get"

[[lessons.exercises]]
id = "s07-l02-e1"
type = "mc"
points = 25
prompt = "What should the close-request branch change so the taught <code>while running</code> loop can end?"
choices = ["Set running to False", "Call screen = False", "Change event.type to pygame.QUIT", "Set pygame to False"]
answer = 0
hint = "The while condition reads one Boolean variable; alter that variable rather than the message or the module."
whyWrong = "screen is the display Surface, event.type describes the received event, and pygame is the imported module. The loop stops only when its own running condition becomes False."
explain = "The next condition check sees running as False, leaves the loop, and then reaches pygame.quit()."

[[lessons.exercises]]
id = "s07-l02-d1"
type = "type"
points = 14
reps = 2
prompt = "Retype the nested queue loop that detects the operating system's QUIT event without adding key movement."
code = '''running = True

while running:
    for event in pygame.event.get():
        if event.type == pygame.QUIT:
            running = False

pygame.quit()'''

[[lessons.exercises]]
id = "s07-l02-e2"
type = "fill"
points = 25
prompt = "Restore the event constant that represents the user asking PyGame to close the window."
code = '''if event.type == pygame.____:
    running = False'''
answer = "QUIT"
hint = "This all-capitals constant names the close message and is spelled with Q-U-I-T, not as a method call."
whyWrong = "quit() is the cleanup function called after the loop, while KEYDOWN is a keyboard event that has not been taught for movement. QUIT is the event type from the window close request."

[[lessons.exercises]]
id = "s07-l02-w1"
type = "write"
points = 35
prompt = "Rehearse the running-flag decision in plain Python. Begin with <code>close_requested = True</code>. Use an <code>if</code> to set <code>running</code> to <code>False</code> when a close is requested, otherwise set it to <code>True</code>. Print exactly <code>Window running: False</code>. This lab isolates the Boolean contract that the real PyGame event branch uses."
expect = '''Window running: False'''
hint = "The true branch represents receiving QUIT: assign False to running there, then place running in the final f-string."
starter = '''close_requested = True

# Set running from close_requested, then print the resulting Boolean.
'''
solution = '''close_requested = True

if close_requested:
    running = False
else:
    running = True

print(f"Window running: {running}")'''
