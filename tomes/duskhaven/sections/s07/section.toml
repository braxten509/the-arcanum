brief = '''<p>The ledger has learned to name its people. Now it must meet the sky, apprentice. In this forge the same real external <code>duskhaven/main.py</code> crosses from terminal proof into an honest PyGame window: a small, dark frame that stays awake until its keeper closes it.</p><p>Keep every earlier import, function, ledger, class, instance, and report in the one canonical file. We add the PyGame boundary after the current top-level encounter calls; we do not build a second toy program. The external workspace—not the study editor—is where you must see the window and close it yourself.</p><div class="callout">A window that opens is not yet a game. A game must keep taking messages from its operating system, present frames, and leave its tools clean when the keeper asks it to stop.</div>'''
