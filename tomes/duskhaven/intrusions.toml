[[tiers.pool]]
t = "THE SWIFTER FOE"
brief = "In turn-based combat the swifter combatant strikes first. Print the faster foe's name. Print exactly: «FIRST bat»."
starter = '''
foes = [("hero", 5), ("bat", 8)]
# Print the name of the fastest foe, computed from the list.
'''
expect = "FIRST bat"
solution = '''
foes = [("hero", 5), ("bat", 8)]
best_name = ""
best_spd = -1
