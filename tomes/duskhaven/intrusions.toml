[[tiers.pool]]
t = "THE FORGED VESSEL"
brief = "Shape a Hero class that holds a name and health, then read them back. Print exactly: «HERO Ash 30»."
starter = '''
name = "Ash"
hp = 30
# Model the champion as a class, then print its name and hp.
'''
expect = "HERO Ash 30"
solution = '''
name = "Ash"
hp = 30
