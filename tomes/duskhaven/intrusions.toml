# HEX DEFENSE — rival world-smiths hurl hexes at Duskhaven while the apprentice studies.
# The engine reads ONLY the `tiers` key: each [[tiers]] gates by `min` (sections passed)
# and picks one [[tiers.pool]] challenge, scored by exact stdout `expect`. Every challenge
# demands a COMPUTED value (the starter's variables force it) and carries a `solution` the
# validator runs to prove `expect` is winnable. In the Worldwright's voice throughout.

# ---- tier 1: after The Forge + Words & Numbers (variables, arithmetic, f-strings)
[[tiers]]
min = 2
time = 90
bounty = 60

[[tiers.pool]]
t = "THE FALSE COORD"
brief = "A rival smears our map's grid. Multiply the tile column by the tile size and print exactly: «PIXEL 160»."
starter = '''
col = 5
size = 32
# Compute the pixel column; do not hardcode it.
'''
expect = "PIXEL 160"
solution = '''
col = 5
size = 32
print(f"PIXEL {col * size}")
'''

[[tiers.pool]]
t = "THE PHANTOM PURSE"
brief = "A cutpurse hex drains the satchel. Subtract what was spent from the purse. Print exactly: «PURSE 75»."
