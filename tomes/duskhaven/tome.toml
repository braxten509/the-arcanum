# Duskhaven — the Python / PyGame 2D RPG tome manifest.

[meta]
id = "duskhaven"
name = "Duskhaven // Python RPG Workshop"
description = "Build and ship Duskhaven, a focused single-player 2D top-down RPG in Python and PyGame across 16 candlelit forges, with movement, tile maps, animated characters, collision, combat, inventory, quests, UI, and persistent game state."
author = "The Arcanum"
version = "0.1.0"
favicon = "✦"

[runtime]
name = "python"
project = "Duskhaven"
language = "Python"
packages = false
editorLang = "python"
entryFile = "main.py"
newFileExt = ".py"
externalWorkspace = true
projectFile = "main.py"
starterCode = '''# Duskhaven begins as a small Python program.
print("Duskhaven: the lantern is lit.")
'''

[content]
sections = [
  "s01", "s02", "s03", "s04", "s05", "s06", "s07", "s08",
  "s09", "s10", "s11", "s12", "s13", "s14", "s15", "s16",
]
capabilityLedger = true

[defaults]
theme = "night-vellum"

[defaults.ai]
oracle = "llama3.1:8b"
grader = "qwen2.5:14b"
graderKind = "claude-cli"
graderModel = "claude-opus-4-8"

[economy]
# Audited fixed face value: 7,261 exercise + 4,810 freestyle = 12,071.
# Repeatable hex defenses pay 60–220 per win. Their bonus income, combos, and S-rank
# play bridge the deliberate 729-credit gap to the Worldwright title.
ranks = [[0, "LANTERN-BEARER"], [1600, "INK APPRENTICE"], [3200, "MAP-KNITTER"], [4800, "WAYFINDER"], [6400, "EMBER WARDEN"], [8000, "NIGHT CARTOGRAPHER"], [9600, "DUSKSMITH"], [11200, "WORLDWRIGHT'S HAND"], [12800, "WORLDWRIGHT"]]
hintCost = 80
oracleCost = 20
attemptMultipliers = [1, 0.6, 0.3]
comboStep = 0.05
comboCap = 0.5
sRankMultiplier = 1.5
attackStakePerDiff = 20
attackWinPerDiff = 15

[narrative]
objective = "Build and ship Duskhaven, a real playable 2D top-down RPG made in Python and PyGame. By the final seal, the apprentice will walk a tiled overworld, speak with NPCs, survive turn-based battles, manage items and levels, save and load JSON data, and hand the runnable game to another person."
title = "ARCANUM // DUSKHAVEN"
logo = "DUSKHAVEN // NIGHT VELLUM"
opsLabel = "FORGES"
graderPersona = "THE WORLDWRIGHT"
studentTerm = "apprentice"
currency = "embers"
currencyShort = "em"
gradeScale = "S|A|B|C|D|F"
bootLines = [
  "The dusk-lantern is lit, apprentice. Keep your hands clear of the moving parts.",
  "DUSKHAVEN is not a sketch. It is a small world that must run when the work is done.",
  "Sixteen forges stand between this commission and a game fit to hand to a friend.",
  "You will learn Python from the first honest line, then carry it into real PyGame.",
  "A map is data. A frame is a promise. A bug is a thread pulled loose from the loom.",
  "I am the Worldwright. I judge the running artifact, not the confidence of its description.",
  "Each forge contains threads of practice. Seal the thread before you open the next door.",
  "Embers buy relief, not excuses. Read the traceback, find its owner, mend the work.",
  "The first window will be plain. Plain is useful: it lets us see what the machine truly does.",
  "When every forge is sealed, run Duskhaven outside this study and let another machine judge it."
]
gradingLines = [
  "Hold. I am checking the running world, not admiring the blueprint.",
  "The frame tells the truth. I am tracing what your code actually makes it do.",
  "A loose coordinate can fell a whole scene. I am following the failure to its owner.",
  "This is close. Close is not shipped; I am checking the edge of the map.",
  "The forge is quiet while I test the result against the commission.",
  "You earn the mark when the work runs, explains its choices, and can be repaired.",
  "A good worldwright leaves a trail another apprentice can follow."
]
completeText = "DUSKHAVEN IS SEALED // Run it beyond the study, apprentice. Let the world travel."

[progression]
attackTime = 180             # SPELL DUEL: total seconds in the sandglass
attackStages = [0, 60, 120]  # seconds at which the rival's three demands arm
blackIceThreshold = 10       # qualifying duel wins to earn the AURORA SEAL palette
blackIcePerDiffCap = 2       # per-circle cap on wins that count toward it

[progression.earnedTheme]
id = "aurora-seal"
name = "AURORA SEAL"
desc = "A duel-earned palette for an apprentice who kept the lantern alive through every rival's demand."
