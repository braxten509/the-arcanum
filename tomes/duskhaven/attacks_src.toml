print(f"ATK {e.atk}")
print(f"RAID {e.raid(2)}")
'''
cuts = [1, 2, 3]

[[challenge]]
tier = 6
title = "THE FORGED LEDGER"
starter = '''
level = 1
xp = 100
# A rival erases your growth. Forge a leveling record.
'''
briefs = [
  "Show the level. Print exactly: «LVL 1»",
  "Show the stored XP. Append: «XP 100»",
  "Advance one level and show it. Append: «NEXT 2»",
]
solution = '''
level = 1
xp = 100
class Record:
    def __init__(self, level, xp):
        self.level = level
        self.xp = xp
    def advance(self):
        self.level += 1
r = Record(level, xp)
print(f"LVL {r.level}")
print(f"XP {r.xp}")
r.advance()
print(f"NEXT {r.level}")
'''
cuts = [1, 2, 3]

[[challenge]]
tier = 6
title = "THE FORGED TILE"
starter = '''
kind = "wall"
solid = True
# A rival dissolves your walls. Forge a Tile that holds fast.
'''
briefs = [
  "Forge the tile. Print exactly: «TILE wall»",
  "Reveal whether it blocks passage. Append: «SOLID True»",
  "State its block value as an integer. Append: «BLOCK 1»",
]
solution = '''
kind = "wall"
solid = True
class Tile:
    def __init__(self, kind, solid):
        self.kind = kind
        self.solid = solid
    def block(self):
        return 1 if self.solid else 0
t = Tile(kind, solid)
print(f"TILE {t.kind}")
print(f"SOLID {t.solid}")
print(f"BLOCK {t.block()}")
'''
cuts = [1, 2, 3]


