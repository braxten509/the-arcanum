# ===== circle 6: after Living Forms — classes as the entity backbone
[[challenge]]
tier = 6
title = "THE FORGED CHAMPION"
starter = '''
name = "Ash"
hp = 30
blow = 12
# A rival denies your champion form. Forge a Hero and take a blow.
'''
briefs = [
  "Forge the hero and name it. Print exactly: «HERO Ash»",
  "Reveal its health. Append: «HP 30»",
  "Let a 12-point blow land, then show the health. Append: «AFTER 18»",
]
solution = '''
name = "Ash"
hp = 30
blow = 12
class Hero:
    def __init__(self, name, hp):
        self.name = name
        self.hp = hp
h = Hero(name, hp)
print(f"HERO {h.name}")
print(f"HP {h.hp}")
h.hp -= blow
print(f"AFTER {h.hp}")
'''
cuts = [1, 2, 3]

[[challenge]]
tier = 6
title = "THE FORGED RELIC"
starter = '''
kind = "potion"
value = 25
# A rival scorns your relic. Forge an Item and value it.
'''
briefs = [
  "Forge the item. Print exactly: «ITEM potion»",
  "Reveal its value. Append: «VALUE 25»",
  "Show a stacked pair's worth (value times two). Append: «STACK 50»",
]
solution = '''
kind = "potion"
value = 25
class Item:
    def __init__(self, kind, value):
        self.kind = kind
        self.value = value
    def stack(self, n):
        return self.value * n
i = Item(kind, value)
print(f"ITEM {i.kind}")
print(f"VALUE {i.value}")
print(f"STACK {i.stack(2)}")
'''
cuts = [1, 2, 3]

[[challenge]]
tier = 6
title = "THE FORGED FOE"
starter = '''
name = "bat"
atk = 6
# A rival summons a foe against you. Forge an Enemy and let it strike twice.
'''
briefs = [
  "Forge the foe. Print exactly: «FOE bat»",
  "Reveal its attack. Append: «ATK 6»",
  "Show a double raid (attack times two). Append: «RAID 12»",
]
solution = '''
name = "bat"
atk = 6
class Enemy:
    def __init__(self, name, atk):
        self.name = name
        self.atk = atk
