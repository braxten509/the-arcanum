# HEX-DEFENSE intrusion bank for hex-forge.
# Voice: Foreman Vandr. Tiers gate by `min` (sections passed) and pick one
# challenge from `pool`, scoring by exact stdout `expect`. Author here, not in
# tome.toml — the engine folds `tiers` back into progression.intrusionTiers.

[[tiers]]
min = 0
time = 90
bounty = 50

[[tiers.pool]]
t = "COLD ANVIL"
brief = "A rival slab sits cold on the bench. Strike one clean mark through sys_write and leave by sys_exit."
starter = '''
section .data
mark: db "CRUCIBLE OPEN", 10   ; print exactly: CRUCIBLE OPEN
mlen equ $-mark
section .text
    global _start
_start:
    ; dress the anvil: rax=1 rdi=1 rsi=&mark rdx=mlen, syscall, then exit
'''
expect = "CRUCIBLE OPEN"

[[tiers.pool]]
t = "TALLY STAMP"
brief = "The foreman's bench keeps a tally. Stamp the first ingot count through the air-gate."
starter = '''
section .data
stamp: db "INGOT 0", 10       ; print exactly: INGOT 0
slen equ $-stamp
section .text
    global _start
_start:
    ; write the stamp, then exit clean
'''
expect = "INGOT 0"

[[tiers.pool]]
t = "SPARK GATE"
brief = "The first heat is the cheapest. Light the forge with one fixed spark of text."
starter = '''
section .data
spark: db "FORGE LIT", 10     ; print exactly: FORGE LIT
klen equ $-spark
section .text
    global _start
_start:
    ; one sys_write, one sys_exit — no more
'''
expect = "FORGE LIT"

[[tiers]]
min = 1
time = 90
bounty = 60

[[tiers.pool]]
t = "ORE COUNT"
brief = "Two ore heaps wait on the bench. Add them as alloy and print SUM <total>."
starter = '''
section .data
a equ 37   ; first heap
b equ 29   ; second heap
pre: db "SUM "            ; print exactly: SUM 66  (a+b, computed)
plen equ $-pre
section .bss
decbuf: resb 32
decbuf_end:
section .text
    global _start
_start:
    ; print "SUM ", then a+b as decimal, then newline
'''
expect = "SUM 66"

[[tiers.pool]]
t = "THE ALLOY"
brief = "Forge two ingots into one. Multiply the weighs and print PROD <product>."
starter = '''
section .data
a equ 12   ; first ingot
b equ 12   ; second ingot
pre: db "PROD "          ; print exactly: PROD 144  (a*b, computed)
plen equ $-pre
section .bss
decbuf: resb 32
decbuf_end:
section .text
    global _start
_start:
    ; print "PROD ", then a*b, then newline
'''
expect = "PROD 144"

[[tiers.pool]]
t = "SCALE WEIGHT"
brief = "Two slabs on the scale; one is heavier. Subtract and print DIFF <result>."
