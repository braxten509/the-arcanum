'''
expect = "DIFF 193"

[[tiers]]
min = 2
time = 90
bounty = 75

[[tiers.pool]]
t = "THE BELL"
brief = "The bell swings n times. Loop from 1 to n and print BELL <i> each strike."
starter = '''
section .data
n equ 5                 ; print exactly:
pre: db "BELL "         ;   BELL 1 / BELL 2 / BELL 3 / BELL 4 / BELL 5
plen equ $-pre
nl_c: db 10
section .bss
decbuf: resb 32
decbuf_end:
section .text
    global _start
_start:
    ; r12 = counter 1..n, loop and print each
'''
expect = '''
BELL 1
BELL 2
BELL 3
BELL 4
BELL 5'''

[[tiers.pool]]
t = "GATE OR SHUT"
brief = "A gauge reads v. Open the gate if v is at least 40, else shut it."
starter = '''
section .data
v equ 42                ; print exactly: OPEN   (v >= 40 ? OPEN : SHUT)
open: db "OPEN", 10
shut: db "SHUT", 10
section .text
    global _start
_start:
    ; cmp v, 40 ; jump to the right label
'''
expect = "OPEN"

[[tiers.pool]]
t = "DOWSE TO TEN"
brief = "Count the dowsing strikes down from n to 1. Print DOWSE <i> each pass."
starter = '''
section .data
n equ 4                 ; print exactly:
pre: db "DOWSE "        ;   DOWSE 4 / DOWSE 3 / DOWSE 2 / DOWSE 1
plen equ $-pre
nl_c: db 10
section .bss
decbuf: resb 32
decbuf_end:
section .text
    global _start
_start:
    ; r12 = n ; loop while r12 >= 1 ; print ; dec
'''
expect = '''
DOWSE 4
DOWSE 3
DOWSE 2
DOWSE 1'''

[[tiers]]
