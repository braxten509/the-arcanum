t = "THE GUTTER"
brief = "Dress a byte run for the ASCII gutter: print each byte, controls as a dot."
starter = '''
section .data
row: db 72, 73, 33, 10  ; print exactly: HI!.   (H I ! .)
rlen equ $-row
section .bss
gut: resb 32
section .text
    global _start
_start:
    ; for each byte: if 32..126 print it else '.' ; write gut then newline
'''
expect = "HI!."

