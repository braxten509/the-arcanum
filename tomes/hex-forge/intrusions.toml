nl_c: db 10
section .bss
decbuf: resb 32
decbuf_end:
section .text
    global _start
_start:
    ; walk s until byte 0 ; count ; print "LEN " + count
'''
expect = "LEN 5"

[[tiers]]
min = 7
time = 90
bounty = 140

[[tiers.pool]]
t = "HEX STAMP"
brief = "Strike one ore byte into two hex digits. Print the byte's hex mark, lower-case."
starter = '''
section .data
ore: db 0x3c            ; print exactly: 3c   (lower-case hex of the byte)
section .bss
hexc: resb 2
nl_c: db 10
section .text
    global _start
_start:
    ; load ore, split two nibbles, map 0-9/a-f, write
'''
expect = "3c"

[[tiers.pool]]
t = "OFFSET MARK"
brief = "Every dump line begins with an offset. Print the value as eight hex digits."
starter = '''
section .data
off equ 255             ; print exactly: 000000ff   (8-digit lower-case hex)
section .bss
hexbuf: resb 8
nl_c: db 10
section .text
    global _start
_start:
    ; roll nibbles off rax, map each, write into hexbuf, then print
'''
expect = "000000ff"

[[tiers.pool]]
t = "GUTTER MARK"
brief = "Print the ASCII gutter of a byte run: printable bytes as-is, controls as a dot."
starter = '''
section .data
row: db 0x41, 0x07, 0x42   ; print exactly: A.B   (A .  B)
rlen equ $-row
section .bss
gut: resb 32
section .text
    global _start
_start:
    ; classify each byte 32..126 printable else '.' ; print gut + newline
'''
expect = "A.B"

