ore: db 8, 4, 2         ; print exactly: SUM 14   (sum of bytes, computed)
olen equ $-ore
pre: db "SUM "
plen equ $-pre
nl_c: db 10
section .bss
decbuf: resb 32
decbuf_end:
section .text
    global _start
_start:
    ; rbx = 0 sum ; rsi = ore ; loop olen bytes adding each byte
'''
