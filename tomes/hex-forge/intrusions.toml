olen equ $-ore
pre: db "MAX "
plen equ $-pre
nl_c: db 10
section .bss
decbuf: resb 32
decbuf_end:
section .text
    global _start
_start:
    ; rbx = max ; walk ore ; cmp each byte, keep greater
'''
