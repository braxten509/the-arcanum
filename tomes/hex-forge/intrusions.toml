t = "PRINTABLE?"
brief = "A rival slips slag among the ore. Print only the printable bytes as a string."
starter = '''
section .data
row: db 65, 31, 122, 7, 90  ; print exactly: AzZ   (keep only 32..126)
rlen equ $-row
section .bss
out: resb 32
section .text
    global _start
_start:
    ; walk row ; copy printable bytes into out ; print them + newline
'''
