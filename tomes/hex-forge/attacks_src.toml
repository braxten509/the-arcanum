[[challenge]]
tier = 5
title = "TONG ROUTINE"
starter = '''
section .bss
decbuf: resb 32
decbuf_end:
section .text
    global _start
_start:
    ; define a proc ward(n) that prints "WARD n" (arg in rdi per the ABI)
    ; stage 1: WARD 7 ; stage 2: WARD 7 ; stage 3: WBL 14   (7+7, computed)
'''
briefs = ["Forge a ward jig that prints WARD and its argument; call it with seven.", "Strike the same ward a second time.", "Twin the two wards — print their combined weight, computed."]
solution = '''
section .data
pre: db "WBL "
plen equ $-pre
wonP: db "WARD "
wlen equ $-wonP
nl_c: db 10
section .bss
decbuf: resb 32
decbuf_end:
section .text
    global _start
_start:
    mov rdi, 7
    call ward
    mov rdi, 7
    call ward
    mov rax, 1
    mov rdi, 1
    lea rsi, [rel pre]
    mov rdx, plen
    syscall
    mov rax, 7+7
    call print_dec
    mov rax, 60
    xor rdi, rdi
    syscall
ward:
    mov r8, rdi         ; save the ABI arg before the sys_write clobbers rdi
    mov rax, 1
    mov rdi, 1
    lea rsi, [rel wonP]
    mov rdx, wlen
    syscall
    mov rax, r8         ; arg n
    call print_dec
    ret

print_dec:
    lea rsi, [rel decbuf_end]
    mov rcx, 10
.pd_l:
    dec rsi
    xor rdx, rdx
    div rcx
    add dl, '0'
    mov [rsi], dl
    test rax, rax
    jnz .pd_l
    mov r8, rsi
    lea r9, [rel decbuf_end]
    mov rax, 1
    mov rdi, 1
    mov rsi, r8
    mov rdx, r9
    sub rdx, r8
    syscall
    mov rax, 1
