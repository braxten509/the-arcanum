[[challenge]]
tier = 2
title = "ADD THE HEAPS"
starter = '''
section .data
a equ 48   ; stage 1: HEAP A 48
b equ 23   ; stage 2: HEAP B 23
           ; stage 3: SUM 71   (a + b, computed)
section .bss
decbuf: resb 32
decbuf_end:
section .text
    global _start
_start:
    ; print "HEAP A ",a, "HEAP B ",b, "SUM ",a+b
'''
briefs = ["Weigh the first heap and mark its count.", "Weigh the second heap and append its count.", "Forge both heaps together — print the true sum, computed."]
solution = '''
section .data
p1: db "HEAP A "
ln1 equ $-p1
p2: db "HEAP B "
ln2 equ $-p2
p3: db "SUM "
ln3 equ $-p3
nl_c: db 10
section .bss
decbuf: resb 32
decbuf_end:
section .text
    global _start
_start:
    mov rax, 1
    mov rdi, 1
    lea rsi, [rel p1]
    mov rdx, ln1
    syscall
    mov rax, 48
    call print_dec
    mov rax, 1
    mov rdi, 1
    lea rsi, [rel p2]
    mov rdx, ln2
    syscall
    mov rax, 23
    call print_dec
    mov rax, 1
    mov rdi, 1
    lea rsi, [rel p3]
    mov rdx, ln3
    syscall
    mov rax, 71
    call print_dec
    mov rax, 60
    xor rdi, rdi
    syscall

print_dec:
    lea rsi, [rel decbuf_end]
    mov rcx, 10
.pd_l:
    dec rsi
    xor rdx, rdx
    div rcx
    add dl, '0'
    mov [rsi], dl
    test rax, rax
    jnz .pd_l
    mov r8, rsi
    lea r9, [rel decbuf_end]
    mov rax, 1
    mov rdi, 1
    mov rsi, r8
    mov rdx, r9
    sub rdx, r8
    syscall
    mov rax, 1
    mov rdi, 1
    lea rsi, [rel nl_c]
    mov rdx, 1
    syscall
    ret
'''
