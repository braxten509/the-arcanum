# SPELL DUEL reference solutions for hex-forge — authored in NASM, in the
# forge voice. Run:  python3 tools/gen_attacks.py hex-forge  (server up) to slice
# each `solution` into generated/attacks.toml. NOTE: the shipped nasm runtime's
# `command` omits `./` before the binary, so runsnip cannot execute today; the
# generated/attacks.toml below was hand-authored from these locally-verified
# solutions (nasm -f elf64 + ld + ./bin) — regenerate once the runtime is fixed.

[[challenge]]
tier = 1
title = "COLD COUNTER"
starter = '''
section .data
l1: db "MARK SET", 10        ; stage 1 prints exactly: MARK SET
l2: db "FORGE LIT", 10       ; stage 2 then appends: FORGE LIT
l3: db "ANVIL DRESSED", 10  ; stage 3 then appends: ANVIL DRESSED
section .text
    global _start
_start:
    ; three sys_write strikes, then sys_exit
'''
briefs = ["Strike the first mark and hold it.", "The rival arms a second demand — light the forge.", "A third hex lands — dress the anvil and hold all three."]
solution = '''
section .data
l1: db "MARK SET", 10
l2: db "FORGE LIT", 10
l3: db "ANVIL DRESSED", 10
section .text
    global _start
_start:
    mov rax, 1
    mov rdi, 1
    lea rsi, [rel l1]
    mov rdx, 9
    syscall
    mov rax, 1
    mov rdi, 1
    lea rsi, [rel l2]
    mov rdx, 10
    syscall
    mov rax, 1
    mov rdi, 1
    lea rsi, [rel l3]
