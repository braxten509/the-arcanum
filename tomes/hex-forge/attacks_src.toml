[[challenge]]
tier = 4
title = "RICH SEAM"
starter = '''
section .data
ore: db 4, 9, 1     ; stage 1: MIN 1
                   ; stage 2: MAX 9
                   ; stage 3: SPR 8   (max - min, computed)
pre1: db "MIN "
pre2: db "MAX "
pre3: db "SPR "
nl_c: db 10
section .bss
decbuf: resb 32
decbuf_end:
section .text
    global _start
_start:
    ; one pass: track min (rbx) and max (r12) ; print MIN, MAX, SPR=max-min
'''
briefs = ["Find the leanest ore in the seam and mark it.", "Find the richest ore and append it.", "The spread is rich minus lean — print it, computed."]
solution = '''
section .data
ore: db 4, 9, 1
orelen equ $-ore
pre1: db "MIN "
p1len equ $-pre1
pre2: db "MAX "
p2len equ $-pre2
pre3: db "SPR "
p3len equ $-pre3
nl_c: db 10
section .bss
decbuf: resb 32
decbuf_end:
section .text
    global _start
_start:
    lea rbp, [rel ore]
    mov r13, orelen
    mov rbx, 255        ; min
    mov r12, 0          ; max
.seam:
    movzx rax, byte [rbp]
    cmp rax, rbx
    jge .chkmax
    mov rbx, rax
.chkmax:
    cmp rax, r12
    jle .next
    mov r12, rax
.next:
    inc rbp
    dec r13
    jnz .seam
    mov rax, 1
    mov rdi, 1
    lea rsi, [rel pre1]
    mov rdx, p1len
    syscall
    mov rax, rbx
    call print_dec
    mov rax, 1
    mov rdi, 1
    lea rsi, [rel pre2]
    mov rdx, p2len
    syscall
    mov rax, r12
    call print_dec
    mov rax, 1
    mov rdi, 1
    lea rsi, [rel pre3]
    mov rdx, p3len
    syscall
    mov rax, r12
    sub rax, rbx
    call print_dec
    mov rax, 60
    xor rdi, rdi
    syscall

print_dec:
    lea rsi, [rel decbuf_end]
    mov rcx, 10
.pd_l:
    dec rsi
    xor rdx, rdx
    div rcx
    add dl, '0'
    mov [rsi], dl
    test rax, rax
    jnz .pd_l
    mov r8, rsi
    lea r9, [rel decbuf_end]
    mov rax, 1
    mov rdi, 1
    mov rsi, r8
    mov rdx, r9
    sub rdx, r8
    syscall
    mov rax, 1
    mov rdi, 1
    lea rsi, [rel nl_c]
    mov rdx, 1
    syscall
    ret
'''
