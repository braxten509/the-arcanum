[freestyle]
title = "THE WORKING: Read the Three Silver Tracks"
brief = "Rowan asks the integrated engine to leave a trustworthy trail.<ul><li>Preserve every s01-s10 proof and ordinary launch; <code>--debug</code> must remain opt-in.</li><li>Add <code>--arcanum-proof s11</code>: load the real World, query a world-space probe through <code>walls_near</code>, and derive one candidate.</li><li>Use QueryProfiler to run that real wall index query exactly three times; do not print unstable elapsed time.</li><li>Run release_audit against the real project with debug false and no frame limit; derive credits and ready state.</li><li>Print exactly <code>S11_OK debug=False candidates=1 calls=3 credits=True release=ready</code>.</li></ul>"
requires = ["opt-in-runtime-diagnostics", "spatial-collision-broad-phase", "injected-query-profiler", "release-readiness-audit", "clamped-world-camera", "package-safe-asset-root", "elapsed-animation-state", "deterministic-game-loop"]
reward = 310
xray = "Rowan docks unconditional overlays, mutated world walls, screen-space collision, full-map candidate scans disguised as an index, removed exact collision, hardcoded counts, elapsed time in exact output, empty credits, hidden transient files, or a deleted failing check. He rewards disabled-by-default observation, canonical Rect identity, injected measurement edges, named blockers, and cumulative proof."

