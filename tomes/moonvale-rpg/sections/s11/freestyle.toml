[[freestyle.referenceSteps]]
id = "s11-add-diagnostic-receipt"
path = "src/moonvale/app.py"
mode = "replace"
instruction = "Insert the real world query, repeated profiler evidence, and release audit receipt before main."
find = '''
def main(args=None):
'''
content = '''
def diagnostic_receipt():
    diagnostics = Diagnostics()
    world = World(asset_root() / "maps" / "moonvale.tmx")
    probe = pygame.Rect(64, 32, 64, 32)
    candidates = world.walls_near(probe)
    evidence = QueryProfiler().measure(world.wall_index, [probe], repeats=3)
    audit = release_audit(
        asset_root().parent,
        debug=diagnostics.enabled,
        frame_limit=None,
    )
    release = "ready" if audit["ready"] else "blocked"
    return (
        f"S11_OK debug={diagnostics.enabled} candidates={len(candidates)} "
        f"calls={evidence['calls']} credits={audit['credits']} "
        f"release={release}"
    )


def main(args=None):
'''

