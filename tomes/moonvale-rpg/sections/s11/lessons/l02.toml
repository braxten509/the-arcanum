[[lessons.artifactSteps]]
id = "s11-add-spatial-tests"
path = "tests/test_spatial.py"
mode = "write"
instruction = "Create tests/test_spatial.py to prove local candidate reduction, multi-cell deduplication, and invalid cell diagnostics."
content = '''
import pygame
import pytest

from moonvale.spatial import SpatialIndex


def test_query_returns_nearby_canonical_wall_only():
    walls = [
        pygame.Rect(0, 0, 32, 32),
        pygame.Rect(512, 0, 32, 32),
        pygame.Rect(1024, 0, 32, 32),
    ]
    index = SpatialIndex(walls, 128)
    candidates = index.query(pygame.Rect(0, 0, 64, 64))
    assert candidates == [walls[0]]
    assert candidates[0] is walls[0]


def test_wall_spanning_cells_is_returned_once():
    wall = pygame.Rect(96, 0, 96, 32)
    index = SpatialIndex([wall], 128)
    assert index.query(pygame.Rect(80, 0, 128, 32)) == [wall]


def test_cell_size_must_be_positive():
    with pytest.raises(ValueError):
        SpatialIndex([], 0)
'''

