[[lessons]]
id = "s11-l02"
title = "Ask Nearby Cells First"
teaches = ["spatial-collision-broad-phase"]
body = '''
<p>Collision has two stages. The broad phase cheaply finds possible walls; the narrow phase performs the existing exact Rect overlap and axis correction. Checking every wall is correct on the current one-wall map, but its work grows with every room even when most walls are far away.</p>
<p><code>SpatialIndex(rects, cell_size)</code> divides world space into square cells represented by integer coordinate pairs. During construction, each wall is registered under every cell it overlaps. The index stores references to canonical Rect objects; it does not transform or copy them.</p>
<pre><code data-kind="runnable">positions = [32, 96, 320]
cell_size = 128
cells = [position // cell_size for position in positions]
print("CELLS", cells)</code></pre>
<p>The probe prints <code>CELLS [0, 0, 2]</code>. Integer floor division maps world pixels to cell coordinates. A likely failure is using screen coordinates after camera subtraction; scrolling would then change which walls appear nearby even though collision occurs in world space.</p>
<p><code>_keys_for(rect)</code> computes the first and last occupied x/y cells. Rect.right and Rect.bottom are exclusive, so subtract one before dividing the far edge. Nested loops yield every coordinate pair. <code>yield</code> produces values one at a time; callers can loop over them without first building another list.</p>
<p><code>query(rect)</code> visits only overlapping cells and deduplicates walls that span several cells. It tracks <code>id(wall)</code>, Python's identity token for that exact object, while returning walls in first-seen order. The narrow phase can pass this candidate list to <code>Player.move</code> unchanged.</p>
<p>World constructs its index after loading Tiled walls, using four tile widths per cell, and exposes <code>walls_near(rect)</code>. The original <code>walls</code> list remains public for drawing, diagnostics, and earlier proofs. This extends rather than replaces the canonical map owner.</p>
<p>A test creates many separated rectangles, queries one small area, and compares candidates with a brute-force overlap expansion. Optimization is accepted only while results remain correct. To diagnose a missed collision, log query rect, cell keys, candidate ids, and the exact narrow-phase result.</p>
<div class="field-notes"><div class="fn-head">FIELD NOTES // BROAD MEANS PERMISSIVE</div><p>The broad phase may return a wall that does not collide. It must never omit one that could collide during the movement under test.</p></div>
'''

[[lessons.concepts]]
id = "spatial-collision-broad-phase"
purpose = "Reduce exact collision candidates by indexing canonical world walls into fixed-size world-space cells without changing narrow-phase behavior."
anatomy = "Validate cell size; map each rect's inclusive occupied pixels with floor division; register in all cells; query overlapping cells; deduplicate by object identity; return canonical walls; keep exact resolver unchanged."
example = "The worked positions map 32 and 96 to cell zero and 320 to cell two at a 128-pixel cell size."
observable = "A local query returns the nearby wall instead of the whole map, while collision and wall coordinates remain identical."
failure = "Screen-space indexing changes with camera motion, far-edge division adds wrong cells, missing multi-cell registration skips walls, and replacing exact checks permits false collisions."
practice = "s11-l02-w1"

[[lessons.artifactSteps]]
id = "s11-add-spatial-index"
path = "src/moonvale/spatial.py"
mode = "write"
instruction = "Create src/moonvale/spatial.py with fixed-size world-cell registration and deduplicated candidate queries."
content = '''
class SpatialIndex:
    def __init__(self, rects, cell_size):
        if cell_size <= 0:
            raise ValueError("cell_size must be positive")
        self.cell_size = cell_size
        self.cells = {}
        for rect in rects:
            for key in self._keys_for(rect):
                self.cells.setdefault(key, []).append(rect)

    def _keys_for(self, rect):
        first_x = rect.left // self.cell_size
        last_x = (rect.right - 1) // self.cell_size
        first_y = rect.top // self.cell_size
        last_y = (rect.bottom - 1) // self.cell_size
        for cell_y in range(first_y, last_y + 1):
            for cell_x in range(first_x, last_x + 1):
                yield cell_x, cell_y

    def query(self, rect):
        candidates = []
        seen = set()
        for key in self._keys_for(rect):
            for wall in self.cells.get(key, ()):
                identity = id(wall)
                if identity not in seen:
                    seen.add(identity)
                    candidates.append(wall)
        return candidates
'''

