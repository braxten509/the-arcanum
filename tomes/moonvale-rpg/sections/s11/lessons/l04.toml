[[lessons]]
id = "s11-l04"
title = "Read the Release Compass"
teaches = ["release-readiness-audit"]
body = '''
<p>A release checklist converts memory into repeatable evidence. <code>RELEASE_CHECKLIST</code> names the human commands still required: run pytest, run cumulative acceptance, build the package, launch it outside source, inspect credits, and confirm no transient data ships. Chapter XII performs those delivery steps; this chapter makes their inputs explicit.</p>
<p><code>release_audit(project_root, debug=False, frame_limit=None)</code> checks facts available before packaging. The canonical map and credits ledger must exist. Debug must be disabled. An ordinary release must have no test frame limit. save.tmp, save.corrupt, and a temporary debug map must not exist at the project root.</p>
<pre><code data-kind="runnable">checks = {"map": True, "credits": True, "debug_disabled": True}
ready = all(checks.values())
print("RELEASE", "ready" if ready else "blocked")</code></pre>
<p>The probe prints <code>RELEASE ready</code>. <code>dict.values()</code> yields the Boolean results; <code>all</code> returns True only if every value is truthy. A likely failure is checking only that a file is named credits.md while leaving it empty. The audit requires non-whitespace text.</p>
<p>The returned dictionary contains each named check and an overall ready field. A UI or proof can explain which check failed instead of exposing one opaque Boolean. New packaging requirements should add a named check and a test rather than being hidden in a release-day note.</p>
<p>The credits ledger truthfully says programmatic fallbacks ship and optional media requires a real source/license record. The audit does not pretend to verify a human asset's legal terms; the learner performs that review. It does prove the ledger is present before packaging.</p>
<p>pytest covers disabled diagnostics, non-mutating camera projection, enabled animation labels, spatial reduction, deduplication, timer injection, and audit failures. Run <code>python -m pytest -q</code> from the project root. If one test fails, repair the first meaningful traceback rather than deleting the assertion or changing expected evidence.</p>
<p>The s11 proof loads the real World, asks its wall index for a local candidate, profiles three identical queries, and audits the real project. It prints counts and readiness derived from public methods. Timing is deliberately omitted from the exact receipt because environmental duration is not stable.</p>
<div class="field-notes"><div class="fn-head">FIELD NOTES // BLOCKERS NEED NAMES</div><p>A checklist is useful when each false result points to one repairable condition. “Release failed” is not a diagnostic.</p></div>
'''

[[lessons.concepts]]
id = "release-readiness-audit"
purpose = "Turn required files, disabled development controls, absent transient data, media provenance, tests, acceptance, and packaging actions into a named release checklist."
anatomy = "Resolve project root; check map and nonempty credits; require debug false and frame limit None; reject known transient paths; combine named Booleans with all; retain human delivery commands for s12."
example = "The worked checks dictionary combines map, credits, and debug truth into RELEASE ready."
observable = "The canonical learner project reports credits true and ready; introducing a temp save, debug flag, missing map, empty ledger, or frame limit identifies a false named check."
failure = "An opaque Boolean cannot guide repair, an empty ledger hides provenance, test controls leak into release, and deleting failing checks creates false confidence."
practice = "s11-l04-w1"

[[lessons.artifactSteps]]
id = "s11-add-release-audit"
path = "src/moonvale/release.py"
mode = "write"
instruction = "Create src/moonvale/release.py with named pre-package checks and the commands Chapter XII must execute."
content = '''
from pathlib import Path


RELEASE_CHECKLIST = (
    "python -m pytest -q",
    "python -m moonvale --arcanum-acceptance",
    "build the PyInstaller artifact",
    "launch the artifact outside the source tree",
    "review assets/credits.md",
    "exclude saves, caches, debug files, and test fixtures",
)


def release_audit(project_root, debug=False, frame_limit=None):
    root = Path(project_root)
    credits_path = root / "assets" / "credits.md"
    required_map = root / "assets" / "maps" / "moonvale.tmx"
    transients = (
        root / "save.tmp",
        root / "save.corrupt",
        root / "assets" / "maps" / "debug.tmx",
    )
    checks = {
        "map": required_map.is_file(),
        "credits": credits_path.is_file()
        and bool(credits_path.read_text(encoding="utf-8").strip()),
        "debug_disabled": debug is False,
        "frame_limit_unbounded": frame_limit is None,
        "transients_absent": not any(path.exists() for path in transients),
    }
    checks["ready"] = all(checks.values())
    return checks
'''

[[lessons.artifactSteps]]
id = "s11-add-diagnostics-tests"
path = "tests/test_diagnostics.py"
mode = "write"
instruction = "Create tests/test_diagnostics.py for disabled/enabled observation and named release blockers."
content = '''
from types import SimpleNamespace

import pygame

from moonvale.camera import Camera
from moonvale.diagnostics import Diagnostics
from moonvale.release import release_audit


def test_diagnostics_are_disabled_and_non_mutating_by_default():
    wall = pygame.Rect(100, 50, 32, 32)
    world = SimpleNamespace(walls=[wall])
    camera = Camera()
    camera.offset.update(20, 10)
    animator = SimpleNamespace(state="walk-east", frame_index=1)
    diagnostics = Diagnostics()
    assert diagnostics.record("frame", state="walk-east") is None
    assert diagnostics.world_rects(world, camera) == []
    assert diagnostics.animation_label(animator) == ""
    assert wall.topleft == (100, 50)


def test_enabled_diagnostics_project_copies_and_stable_labels():
    wall = pygame.Rect(100, 50, 32, 32)
    world = SimpleNamespace(walls=[wall])
    camera = Camera()
    camera.offset.update(20, 10)
    animator = SimpleNamespace(state="walk-east", frame_index=1)
    diagnostics = Diagnostics(enabled=True)
    assert diagnostics.world_rects(world, camera)[0].topleft == (80, 40)
    assert diagnostics.animation_label(animator) == "walk-east frame=1"
    assert diagnostics.record("frame", state="walk-east", frame=1) == (
        "frame frame=1 state=walk-east"
    )
    assert wall.topleft == (100, 50)


def test_release_audit_names_transient_blocker(tmp_path):
    maps = tmp_path / "assets" / "maps"
    maps.mkdir(parents=True)
    (maps / "moonvale.tmx").write_text("map", encoding="utf-8")
    (tmp_path / "assets" / "credits.md").write_text("No media", encoding="utf-8")
    assert release_audit(tmp_path)["ready"] is True
    (tmp_path / "save.tmp").write_text("partial", encoding="utf-8")
    audit = release_audit(tmp_path)
    assert audit["transients_absent"] is False
    assert audit["ready"] is False
'''

