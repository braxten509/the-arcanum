[[lessons]]
id = "s11-l01"
title = "Make Diagnostics Ask Permission"
teaches = ["opt-in-runtime-diagnostics"]
body = '''
<p>A traceback answers where an exception escaped: read its final line for type and message, then move upward to the last frame in Moonvale source. Logging answers what lawful path occurred before failure. A visual overlay answers whether world and screen coordinates disagree. These are three different instruments, and none should remain noisy during ordinary play.</p>
<p><code>Diagnostics(enabled=False)</code> is the one permission boundary. <code>record(event, **values)</code> sorts named values, stores a stable line, and sends it to Python logging only when enabled. The double-star parameter gathers named arguments into a dictionary. Sorting makes two runs comparable.</p>
<pre><code data-kind="runnable">values = {"state": "walk-east", "frame": 1}
details = " ".join(f"{key}={values[key]}" for key in sorted(values))
print("TRACE", details)</code></pre>
<p>The probe prints <code>TRACE frame=1 state=walk-east</code>. A generator expression produces one string per sorted key, and join places spaces between them. A likely failure is logging an entire mutable object, creating enormous unstable output. Record small ids, counts, coordinates, and state names.</p>
<p><code>world_rects(world, camera)</code> returns no rectangles while disabled. When enabled, it maps each canonical wall through <code>camera.world_to_screen</code>, which returns copies. <code>draw_world_overlay</code> draws one-pixel outlines around those copies. It never appends screen rectangles to World.walls.</p>
<p><code>animation_label(animator)</code> similarly returns an empty string unless enabled; otherwise it combines stable state and frame index. A PlayScene can render that label with its existing font. The earlier debug label is now explicitly controlled rather than always visible.</p>
<p>Game accepts a debug Boolean and constructs Diagnostics. Ordinary launch uses False. The dedicated <code>--debug</code> argument passes True and draws a thin viewport border; world-aware rendering may call the overlay method. To diagnose a bad transform, record the wall's world rect, camera offset, and returned screen rect in that order.</p>
<div class="field-notes"><div class="fn-head">FIELD NOTES // SIGNAL HAS A COST</div><p>Diagnostics change observation, not domain rules. A disabled flag must leave movement, collision, animation, and scene results untouched.</p></div>
'''

[[lessons.concepts]]
id = "opt-in-runtime-diagnostics"
purpose = "Unify focused log records, transformed collision outlines, and animation labels behind one disabled-by-default runtime flag."
anatomy = "Construct enabled truth; ignore record/draw/label calls when false; sort small log values; transform wall copies through Camera; draw outlines only; expose stable state/frame label; let Game own the flag."
example = "The worked generator sorts frame and state into one reproducible TRACE line."
observable = "Ordinary launch has no overlay or label; --debug enables a viewport mark, world outline copies, stable label, and buffered records without changing world geometry."
failure = "Unconditional overlays clutter packages, screen rectangles corrupt world collision, broad object logs obscure evidence, and diagnostics that mutate state change the bug."
practice = "s11-l01-w1"

[[lessons.artifactSteps]]
id = "s11-add-diagnostics"
path = "src/moonvale/diagnostics.py"
mode = "write"
instruction = "Create src/moonvale/diagnostics.py with disabled-by-default logging, collision projection/drawing, and animation labels."
content = '''
import logging

import pygame


class Diagnostics:
    def __init__(self, enabled=False):
        self.enabled = enabled
        self.records = []
        self.logger = logging.getLogger("moonvale")

    def record(self, event, **values):
        if not self.enabled:
            return None
        details = " ".join(
            f"{key}={values[key]}" for key in sorted(values)
        )
        message = f"{event} {details}".strip()
        self.records.append(message)
        self.logger.info(message)
        return message

    def world_rects(self, world, camera):
        if not self.enabled:
            return []
        return [camera.world_to_screen(wall) for wall in world.walls]

    def draw_world_overlay(self, surface, world, camera):
        rects = self.world_rects(world, camera)
        for rect in rects:
            pygame.draw.rect(surface, (180, 205, 230), rect, 1)
        return len(rects)

    def animation_label(self, animator):
        if not self.enabled:
            return ""
        return f"{animator.state} frame={animator.frame_index}"
'''

[[lessons.artifactSteps]]
id = "s11-connect-debug-owner"
path = "src/moonvale/game.py"
mode = "replace"
instruction = "Import Diagnostics into Game and extend its constructor with one debug flag."
find = '''
import pygame

from moonvale.scenes import SceneDirector
'''
content = '''
import pygame

from moonvale.diagnostics import Diagnostics
from moonvale.scenes import SceneDirector
'''

[[lessons.artifactSteps]]
id = "s11-construct-diagnostics"
path = "src/moonvale/game.py"
mode = "replace"
instruction = "Extend the exact injected Game constructor and create the diagnostics permission owner."
find = '''
    def __init__(self, clock=None, event_source=None):
        self.clock = clock or pygame.time.Clock()
        self.event_source = event_source or pygame.event.get
        self.director = SceneDirector()
'''
content = '''
    def __init__(self, clock=None, event_source=None, debug=False):
        self.clock = clock or pygame.time.Clock()
        self.event_source = event_source or pygame.event.get
        self.diagnostics = Diagnostics(debug)
        self.director = SceneDirector()
'''

[[lessons.artifactSteps]]
id = "s11-draw-debug-border"
path = "src/moonvale/game.py"
mode = "replace"
instruction = "Draw a minimal viewport marker only when diagnostics are enabled, leaving scene and world rendering unchanged."
find = '''
            self.scene.render(screen)
            pygame.display.flip()
'''
content = '''
            self.scene.render(screen)
            if self.diagnostics.enabled:
                pygame.draw.rect(screen, (180, 205, 230), screen.get_rect(), 1)
            pygame.display.flip()
'''

