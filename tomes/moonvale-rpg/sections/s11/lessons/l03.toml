[[lessons]]
id = "s11-l03"
title = "Measure Before Moving the Road"
teaches = ["injected-query-profiler"]
body = '''
<p>Profiling measures where time and work go. A wall-clock duration alone is noisy: operating-system scheduling, other programs, and hardware change it. For the collision query, record both elapsed seconds and deterministic work counts. Calls and returned candidates remain comparable even when timing fluctuates.</p>
<p><code>QueryProfiler(timer=time.perf_counter)</code> receives a timer function. The default high-resolution monotonic clock measures durations and cannot move backward when the system clock changes. Tests inject a tiny fake timer, applying the same dependency-injection idea used for Game's Clock.</p>
<pre><code data-kind="runnable">candidate_counts = [1, 2, 1]
calls = len(candidate_counts)
checks = sum(candidate_counts)
print("PROFILE", f"calls={calls}", f"candidates={checks}")</code></pre>
<p>The probe prints <code>PROFILE calls=3 candidates=4</code>. <code>sum</code> adds the integers and <code>len</code> counts probes. A likely failure is reporting only “faster” after changing code. Without the same map, probes, repeats, and evidence fields, the comparison cannot support that claim.</p>
<p><code>measure(index, probes, repeats)</code> validates a positive repeat count, captures a start time, queries every probe for every repetition, totals calls and candidate list lengths, captures an end time, and returns a dictionary. It never changes the index or rectangles.</p>
<p>Use representative probes: open floor, a wall approach, a corner, and a camera-scrolled location expressed in world coordinates. First compare every broad-phase candidate with the brute-force wall collection. Then compare counts and elapsed time. Correctness is a gate; performance is evidence after it.</p>
<p>pytest tests the profiler with a SpatialIndex and a fake timer returning 10.0 then 10.25. The expected elapsed value is exactly 0.25, while call and candidate counts come from real queries. This keeps regression proof stable without pretending production timing is deterministic.</p>
<p>For deeper investigation, Python's cProfile can identify expensive call stacks around a representative run. The focused profiler remains in source because it captures domain-specific counts that a generic function table does not. To diagnose a surprising count, print each probe Rect, its cell keys, and returned canonical wall coordinates.</p>
<div class="field-notes"><div class="fn-head">FIELD NOTES // BASELINE BEFORE OPTIMIZATION</div><p>Keep a before/after fixture and identical workload. A smaller number without preserved behavior is not an optimization.</p></div>
'''

[[lessons.concepts]]
id = "injected-query-profiler"
purpose = "Measure spatial-query elapsed time and deterministic call/candidate work with an injectable clock and repeatable probes."
anatomy = "Inject perf_counter-compatible timer; validate repeats; start timer; query each probe repeatedly; count calls and candidate lengths; stop timer; return evidence without mutating inputs."
example = "The worked three candidate counts produce calls three and candidate checks four."
observable = "A fake-timer test reports exact elapsed 0.25 and real query-derived counts; production runs report comparable workload plus measured duration."
failure = "Timing without a stable workload proves little, direct state edits invalidate correctness, zero repeats produce empty evidence, and fake production claims confuse tests with benchmarks."
practice = "s11-l03-w1"

[[lessons.artifactSteps]]
id = "s11-add-query-profiler"
path = "src/moonvale/profiling.py"
mode = "write"
instruction = "Create src/moonvale/profiling.py with an injected timer and deterministic query-work counters."
content = '''
import time


class QueryProfiler:
    def __init__(self, timer=time.perf_counter):
        self.timer = timer

    def measure(self, index, probes, repeats=1):
        if repeats <= 0:
            raise ValueError("repeats must be positive")
        calls = 0
        candidates = 0
        started = self.timer()
        for _ in range(repeats):
            for probe in probes:
                candidates += len(index.query(probe))
                calls += 1
        elapsed = self.timer() - started
        return {
            "calls": calls,
            "candidates": candidates,
            "elapsed": elapsed,
        }
'''

