[[lessons.artifactSteps]]
id = "s11-test-query-profiler"
path = "tests/test_spatial.py"
mode = "append"
instruction = "Append an injected-timer profiler regression to the existing spatial tests."
content = '''


def test_profiler_counts_real_queries_with_injected_time():
    wall = pygame.Rect(0, 0, 32, 32)
    index = SpatialIndex([wall], 128)
    times = iter((10.0, 10.25))
    profiler = QueryProfiler(timer=lambda: next(times))
    evidence = profiler.measure(
        index,
        [pygame.Rect(0, 0, 32, 32), pygame.Rect(512, 0, 32, 32)],
        repeats=2,
    )
    assert evidence == {"calls": 4, "candidates": 2, "elapsed": 0.25}
'''

