'''

[[freestyle.referenceSteps]]
id = "s09-add-save-receipt"
path = "src/moonvale/app.py"
mode = "replace"
instruction = "Insert the isolated real-owner round-trip and corrupt-recovery receipt before main."
find = '''
def main(args=None):
'''
content = '''
def save_receipt():
    player = Player(64, 96)
    player.stats["health"] = 8
    player.inventory.add("lantern-herb", 3)
    player.inventory.select("lantern-herb")
    quests = QuestLog()
    quests.accept(QUEST_ID)
    quests.collect(QUEST_ID, 3)
    quests.turn_in(QUEST_ID)
    with TemporaryDirectory() as root:
        repository = SaveRepository(root)
        repository.save(make_snapshot(player, quests))
        loaded = repository.load()
        restored_player = Player()
        restored_quests = QuestLog()
        restore_snapshot(loaded, restored_player, restored_quests)
        repository.path.write_text("{broken", encoding="utf-8")
        _, recovered = repository.load_or_recover()
        return (
            f"S09_OK version={SCHEMA_VERSION} "
            f"quest={restored_quests.status(QUEST_ID)} "
            f"herbs={restored_player.inventory.quantity('lantern-herb')} "
            f"hp={restored_player.stats['health']} recovered={recovered}"
        )


def main(args=None):
'''

