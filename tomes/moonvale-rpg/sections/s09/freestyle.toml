[freestyle]
title = "THE WORKING: Reopen the Sealed Waypoint"
brief = "Rowan asks one disposable bottle to survive a full close and reopen.<ul><li>Preserve every s01-s08 proof and ordinary launch.</li><li>Add <code>--arcanum-proof s09</code> using TemporaryDirectory and SaveRepository.</li><li>Drive a real Player to health eight with three selected lantern herbs and drive the real quest to completed; make, save, and load schema one into fresh owners.</li><li>Corrupt only the disposable save, call load_or_recover, and derive its recovery Boolean.</li><li>Print exactly <code>S09_OK version=1 quest=completed herbs=3 hp=8 recovered=True</code>.</li></ul>"
requires = ["versioned-save-snapshot", "atomic-save-repository", "save-round-trip-restoration", "finite-quest-state-machine", "inventory-selection-and-use", "player-world-state"]
reward = 280
xray = "Rowan docks real-user paths, raw object serialization, direct quest completion, renamed keys, unvalidated load, direct final-file writes, swallowed corruption, aliased dictionaries, or a receipt made from constants. He rewards isolated roots, public transitions, atomic replacement, quarantined evidence, exact restoration, and values read from fresh owners."

