[[lessons.artifactSteps]]
id = "s09-append-save-repository"
path = "src/moonvale/savegame.py"
mode = "append"
instruction = "Append SaveRepository after validate_snapshot so file effects remain outside the state owners."
content = '''


class SaveRepository:
    def __init__(self, root):
        self.root = Path(root)
        self.path = self.root / "save.json"
        self.temporary_path = self.root / "save.tmp"
        self.corrupt_path = self.root / "save.corrupt"

    def save(self, data):
        validate_snapshot(data)
        self.root.mkdir(parents=True, exist_ok=True)
        text = json.dumps(data, indent=2, sort_keys=True)
        self.temporary_path.write_text(text, encoding="utf-8")
        os.replace(self.temporary_path, self.path)

    def load(self):
        try:
            text = self.path.read_text(encoding="utf-8")
        except FileNotFoundError:
            return None
        except OSError as exc:
            raise SaveError(f"cannot read save: {exc}") from exc
        try:
            return validate_snapshot(json.loads(text))
        except (json.JSONDecodeError, SaveError) as exc:
            raise SaveError(f"invalid save file: {exc}") from exc

    def load_or_recover(self):
        try:
            return self.load(), False
        except SaveError:
            try:
                os.replace(self.path, self.corrupt_path)
            except OSError as exc:
                raise SaveError(f"cannot quarantine corrupt save: {exc}") from exc
            return None, True
'''

