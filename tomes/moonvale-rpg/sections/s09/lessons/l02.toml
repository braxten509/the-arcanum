[[lessons]]
id = "s09-l02"
title = "Replace the Bottle Atomically"
teaches = ["atomic-save-repository"]
body = '''
<p>A save repository owns file-system effects. <code>SaveRepository(root)</code> accepts an injected directory and derives <code>save.json</code>. Ordinary play supplies a platform-appropriate player-data folder; tests and acceptance supply a temporary root. Injection prevents tests from overwriting a learner's real progress.</p>
<p><code>save</code> validates first, creates the directory, serializes to text, writes <code>save.tmp</code> in the same directory, then calls <code>os.replace</code>. Replacement on one filesystem is atomic: readers see the previous complete file or the new complete file, rather than half-written JSON.</p>
<pre><code data-kind="runnable">from pathlib import Path
path = Path("save.json")
temporary = path.with_suffix(".tmp")
print("FILES", temporary.name, path.name)</code></pre>
<p>The probe prints <code>FILES save.tmp save.json</code>. <code>Path.with_suffix</code> returns a new path; it does not rename anything. A common failure is placing the temporary file in the operating system temp directory. That may be a different filesystem, weakening the atomic replacement guarantee.</p>
<p><code>load</code> returns None when the file is absent because a first launch is normal. It converts malformed JSON, read errors, and schema rejection into SaveError with a focused message. It never returns partly validated data. A scene can offer a new game while logging the reason.</p>
<p><code>load_or_recover</code> distinguishes missing from corrupt. Missing returns <code>(None, False)</code>. Corrupt data is moved to <code>save.corrupt</code> with <code>os.replace</code>, then returns <code>(None, True)</code>. The Boolean lets UI say recovery occurred without parsing exception text. Keeping the quarantined bytes supports diagnosis and prevents an infinite crash on the next launch.</p>
<p>If even quarantine fails, SaveError propagates; silently deleting the only evidence is not recovery. To diagnose file trouble, print the absolute root, whether save/tmp/corrupt exist, and the wrapped error. Do not print raw save contents. Guided practice computes the sibling names before performing any write.</p>
<div class="field-notes"><div class="fn-head">FIELD NOTES // ONE FILESYSTEM, ONE COMMIT POINT</div><p>The temporary write prepares a candidate. Atomic replace is the commit point that publishes it.</p></div>
'''

[[lessons.concepts]]
id = "atomic-save-repository"
purpose = "Own save-file paths, publish only validated complete JSON, treat missing files normally, and quarantine corrupt input with explicit recovery evidence."
anatomy = "Inject root; derive save/tmp/corrupt siblings; validate; mkdir; serialize; write temp; os.replace temp to save; load and decode; wrap bad input; quarantine on recover."
example = "The worked Path probe derives save.tmp beside save.json."
observable = "A successful save leaves complete save.json and no temp file; missing load returns None; corrupt load_or_recover returns recovered True and creates save.corrupt."
failure = "Direct writes expose partial JSON, cross-filesystem temp paths weaken replacement, and silent deletion destroys evidence or repeats crashes."
practice = "s09-l02-w1"

