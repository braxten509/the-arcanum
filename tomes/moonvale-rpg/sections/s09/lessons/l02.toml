[[lessons.exercises]]
id = "s09-l02-e1"
type = "mc"
points = 15
prompt = "Why write save.tmp beside save.json before os.replace?"
choices = ["To create two player profiles", "To keep replacement on one filesystem and publish a complete candidate", "To skip validation", "To make JSON executable"]
answer = 1
whyWrong = "The temporary file is a commit candidate, not another profile, executable, or validation bypass."
hint = "Atomic replacement is strongest when both paths share a filesystem."
explain = "Readers see a complete old or new file at the final path."

