[[lessons.exercises]]
id = "s09-l01-w1"
type = "write"
points = 30
prompt = "Import json, create version=1 and position=[64, 96], then print exactly SAVE version=1 x=64 y=96 from the round-tripped value."
expect = '''
SAVE version=1 x=64 y=96'''
solution = '''
import json

snapshot = {"version": 1, "position": [64, 96]}
loaded = json.loads(json.dumps(snapshot))
print("SAVE", f"version={loaded['version']}", f"x={loaded['position'][0]}", f"y={loaded['position'][1]}")
'''
hint = "Use json.dumps followed by json.loads, then index the two position elements."

