[[lessons]]
id = "s07-l03"
title = "Attach Rules, Keep the Overlay Thin"
teaches = ["player-inventory-owner"]
body = '''
<p>The canonical <code>Player</code> owns inventory because items change player stats and must later save with position and health. Extending the class means adding one import and <code>self.inventory = Inventory()</code>; do not replace position, Rect, direction, speed, stats, or movement methods. Earlier collision and animation adapters continue reading the same attributes.</p>
<pre><code data-kind="runnable">quantities = {"lantern-herb": 2, "healing-tonic": 0}
rows = [(item_id, quantity) for item_id, quantity in quantities.items()]
print("SLOTS", len(rows))</code></pre>
<p>The list comprehension visits each dictionary pair and prints <code>SLOTS 2</code>. <code>overlay_rows</code> similarly returns tuples containing id, display name, quantity, and selected truth. A scene may render those tuples, but Inventory never imports fonts, creates a Surface, or processes events.</p>
<p>The proof sets Player health to six, picks up two lantern herbs and one healing tonic, selects the tonic, and calls <code>use_selected(player)</code>. The method caps health at ten and leaves tonic quantity zero. Both dictionary keys remain, so slots equals two. Every receipt field comes from catalog, Inventory, and Player state.</p>
<p>A seeded inventory fixture belongs only in deterministic proof or tests. Ordinary play should create an empty Inventory and add items when real pickup overlap succeeds. This Working constructs pickups explicitly to prove rules; it does not make Player begin every game with a tonic. Save work in Chapter IX will serialize quantities and selected slot.</p>
<p>To build the visible overlay, scene code reads rows and draws them after the world. It highlights the Boolean selected field and shows quantity text. Pressing the inventory key toggles scene/UI state; pressing use invokes the rule method once. If UI and rule quantities disagree, delete any UI-owned counter and render the returned rows.</p>
<p>If earlier proofs fail after the Player edit, compare the exact import and constructor addition. Inventory construction has no side effects and should not change movement. Repair the extension rather than weakening collision or animation evidence.</p>
<div class="field-notes"><div class="fn-head">FIELD NOTES // VIEW MODELS ARE VALUES</div><p>overlay_rows is a small view model: plain values ready for rendering. It prevents UI widgets from becoming a second inventory database.</p></div>
'''

[[lessons.concepts]]
id = "player-inventory-owner"
purpose = "Extend the canonical Player with one Inventory and expose overlay-ready values while keeping UI drawing and input outside rule state."
anatomy = "Import Inventory; construct it beside stats; add items only from successful pickups; select/use through Inventory; return plain overlay tuples; let scenes render without owning quantities."
example = "The row-comprehension probe counts two stable dictionary slots, including a zero-quantity tonic."
observable = "Player owns two slots, tonic use restores capped health, and the overlay reads the same quantities used by rules."
failure = "A UI-owned counter diverges from Inventory; seeded items in ordinary construction leak a proof fixture into play; replacing Player breaks earlier contracts."
practice = "s07-l03-e1"

[[lessons.artifactSteps]]
id = "s07-import-inventory-owner"
path = "src/moonvale/entities.py"
mode = "replace"
instruction = "Add Inventory to the exact entities import block without changing the collision or settings imports."
find = '''
from moonvale.collision import move_with_collisions
from moonvale.settings import TILE_SIZE
'''
content = '''
from moonvale.collision import move_with_collisions
from moonvale.inventory import Inventory
from moonvale.settings import TILE_SIZE
'''

[[lessons.artifactSteps]]
id = "s07-attach-player-inventory"
path = "src/moonvale/entities.py"
mode = "replace"
instruction = "Add an empty Inventory immediately after the exact Player stats assignment and preserve all existing attributes."
find = '''
        self.stats = {"health": 10, "max_health": 10, "power": 3}
'''
content = '''
        self.stats = {"health": 10, "max_health": 10, "power": 3}
        self.inventory = Inventory()
'''

[[lessons.readings]]
label = "Python tutorial: list comprehensions"
url = "https://docs.python.org/3/tutorial/datastructures.html#list-comprehensions"

[[lessons.exercises]]
id = "s07-l03-e1"
type = "mc"
points = 15
prompt = "Which owner stores item quantities?"
choices = ["The overlay", "Camera", "Player.inventory", "World.pixel_size"]
answer = 2
whyWrong = "Rendering and coordinate owners must not duplicate rules; the inventory attached to Player is canonical."
hint = "The overlay receives rows rather than a second counter."
explain = "All views read one rule-state owner."

[[lessons.exercises]]
id = "s07-l03-e2"
type = "fill"
points = 20
prompt = "Construct the empty canonical inventory in Player."
code = 'self.inventory = ____()'
answer = "Inventory"
hint = "Use the owner class imported from moonvale.inventory."
whyWrong = "A dictionary alone would omit validation, selection, use, and overlay contracts."

[[lessons.exercises]]
id = "s07-l03-d1"
type = "type"
points = 12
reps = 2
prompt = "Retype the rule-owned overlay read."
code = 'rows = player.inventory.overlay_rows()'

[[lessons.exercises]]
id = "s07-l03-w1"
type = "write"
points = 30
prompt = "Given quantities with lantern-herb=2 and healing-tonic=0, count dictionary slots and print exactly OVERLAY slots=2."
expect = '''
OVERLAY slots=2'''
solution = '''
quantities = {"lantern-herb": 2, "healing-tonic": 0}
slots = len(quantities)
print("OVERLAY", f"slots={slots}")
'''
hint = "len counts keys even when a value is zero."

[[lessons.exercises]]
id = "s07-l03-e3"
type = "text"
points = 20
prompt = "Which method returns plain values for the scene to draw?"
answer = "overlay_rows"
hint = "It lives on Inventory and returns tuples."
whyWrong = "use_selected changes rules; the view-model method is overlay_rows."
