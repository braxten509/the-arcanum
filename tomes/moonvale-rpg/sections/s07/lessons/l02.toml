[[lessons.exercises]]
id = "s07-l02-w1"
type = "write"
points = 30
prompt = "Start health=8, max_health=10, heal=4, and quantity=1. Apply capped healing, decrement once, and print exactly USE hp=10 qty=0."
expect = '''
USE hp=10 qty=0'''
solution = '''
health = 8
max_health = 10
heal = 4
quantity = 1
health = min(max_health, health + heal)
quantity -= 1
print("USE", f"hp={health}", f"qty={quantity}")
'''
hint = "Use min before subtracting one quantity."

