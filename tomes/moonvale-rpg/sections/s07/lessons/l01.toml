id = "s07-l01-e1"
type = "mc"
points = 15
prompt = "Why is healing-tonic the stored id instead of Healing Tonic?"
choices = ["Hyphens heal the player", "Stable machine ids avoid display-text and capitalization drift", "Python forbids spaces in strings", "Tiled requires tonic ids"]
answer = 1
whyWrong = "Strings may contain spaces and neither healing nor Tiled mandates this format; stability across systems is the reason."
hint = "Display names may later be localized."
explain = "The id remains stable while presentation can change."

