[[lessons.exercises]]
id = "s07-l01-w1"
type = "write"
points = 30
prompt = "Start quantities={}, add quantity=2 for lantern-herb using get default zero, and print exactly PICKUP lantern-herb=2."
expect = '''
PICKUP lantern-herb=2'''
solution = '''
quantities = {}
item_id = "lantern-herb"
quantity = 2
quantities[item_id] = quantities.get(item_id, 0) + quantity
print("PICKUP", f"{item_id}={quantities[item_id]}")
'''
hint = "Store the existing-or-zero amount plus quantity under the exact id."

