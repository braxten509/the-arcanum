id = "s10"
codename = "CHAPTER X // CONDUCT THE WHOLE TALE"
short = "Conduct the Whole Tale"
title = "Conduct the Whole Tale"
build = "compose title, play, pause, and game-over scenes under one loop; add menus, optional audio with silent fallback, graceful quit, and package-safe asset paths."
brief = "The systems now need one conductor. You will extend the established Scene door with four modes, let Game alone apply transition requests, load optional sounds through the asset root with silent substitutes, and prove the canonical module launch and clean quit path."

[proof]
mode = "run"
expectedFiles = ["main.py", "src/moonvale/__main__.py", "src/moonvale/scenes.py", "src/moonvale/game.py", "src/moonvale/audio.py", "tests/test_scenes.py"]
runArgs = ["--arcanum-proof", "s10"]
expect = "S10_OK flow=title>play>pause>play>game-over>title audio=silent quit=clean"

[[assets]]
id = "optional-title-audio"
kind = "audio"
lesson = "s10-l02"
destination = "assets/audio/title.ogg"
sourceGuidance = "Optionally choose one human-made title or menu sound from the real collection page, download and extract it, convert it to Ogg Vorbis only with a trusted audio editor if necessary, rename it title.ogg, and place it at this exact relative path. The SilentSound fallback remains the default proof path."
licenseGuidance = "Verify the license on the asset page, retain any included license file, and record creator, source page, original filename, title.ogg, exact license, conversion, and required attribution in assets/credits.md before shipping."
sources = [{ label = "Kenney RPG Audio", url = "https://kenney.nl/assets/rpg-audio", license = "CC0 as stated on the asset page; still record the source and chosen filename" }]

[[assets]]
id = "optional-action-audio"
kind = "audio"
lesson = "s10-l02"
destination = "assets/audio/action.wav"
sourceGuidance = "Optionally choose one human-made action sound from the real collection page, download and extract it, convert it to WAV only with a trusted audio editor if necessary, rename it action.wav, and place it at this exact relative path. The SilentSound fallback remains the default proof path."
licenseGuidance = "Verify the license on the asset page, retain any included license file, and record creator, source page, original filename, action.wav, exact license, conversion, and required attribution in assets/credits.md before shipping."
sources = [{ label = "Kenney RPG Audio", url = "https://kenney.nl/assets/rpg-audio", license = "CC0 as stated on the asset page; still record the source and chosen filename" }]
