'''
content = '''
def conductor_receipt():
    director = SceneDirector()
    flow = [director.current.name]
    for name in ("play", "pause", "play", "game-over", "title"):
        flow.append(director.switch(name).name)
    audio = AudioBank.load_optional(asset_root() / "missing-audio")
    quit_event = SimpleNamespace(type=pygame.QUIT)
    game = Game(clock=FixedClock(16), event_source=lambda: [quit_event])
    result = game.run(frame_limit=1)
    return (
        f"S10_OK flow={'>'.join(flow)} audio={audio.mode} "
        f"quit={result['quit']}"
    )


def main(args=None):
'''

