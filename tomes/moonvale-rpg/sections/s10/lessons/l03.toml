[[lessons]]
id = "s10-l03"
title = "Close Through the Canonical Gate"
teaches = ["canonical-launch-and-clean-quit"]
body = '''
<p>Moonvale has two thin doors into one function: root main.py supports the workshop command, while <code>python -m moonvale</code> executes package <code>__main__.py</code>. Both delegate to <code>moonvale.app.main</code>. Neither owns a scene, save, or loop. PyInstaller will later target this same application surface.</p>
<p>Ordinary <code>main()</code> reaches <code>Game().run()</code>. Game initializes PyGame, opens the display, and owns every frame. A pygame QUIT event clears its running flag. After the loop, <code>pygame.quit()</code> releases initialized subsystems and the method returns a receipt with <code>quit="clean"</code>.</p>
<pre><code data-kind="runnable">commands = ["python", "-m", "moonvale"]
print("LAUNCH", " ".join(commands))</code></pre>
<p>The probe prints <code>LAUNCH python -m moonvale</code>. The <code>-m</code> option asks Python to locate a package on its import path and execute that package's __main__.py. A likely failure is running from a directory where the installed package or configured src path is unavailable; Python then reports that it cannot find moonvale.</p>
<p>The deterministic proof does not wait for a person. It constructs one synthetic object whose type equals <code>pygame.QUIT</code>, injects a fixed clock and event source into the real Game, and permits one frame. This controls the event edge while exercising the actual initialization, loop condition, cleanup, and return value.</p>
<p>The same receipt traverses SceneDirector directly through each legal name and loads AudioBank from a deliberately absent directory. These are public boundaries, not prepared output. Scene tests additionally send synthetic key events to Title, Play, Pause, and GameOver so key mapping remains independent from the proof formatting.</p>
<p>If ordinary module launch closes unexpectedly, read the final traceback line, confirm the active virtual environment, then run <code>python -c "import moonvale; print(moonvale.__file__)"</code>. If the window refuses to close, print event types and verify QUIT reaches Game rather than a nested loop.</p>
<p>Graceful quit does not mean saving automatically in this chapter; a scene may request save before exit through the repository. It means all loop ownership returns through one path and PyGame cleanup executes. The final package will reuse this gate outside the source tree.</p>
<div class="field-notes"><div class="fn-head">FIELD NOTES // THIN ENTRYPOINTS</div><p>Entrypoints translate process arguments into one application call. Keeping them thin prevents source and packaged launches from becoming different games.</p></div>
'''

[[lessons.concepts]]
id = "canonical-launch-and-clean-quit"
purpose = "Keep root, module, and future packaged launch on one app.main/Game lifecycle and prove a real injected QUIT reaches PyGame cleanup."
anatomy = "Python resolves moonvale.__main__; it delegates to app.main; ordinary args create Game; Game consumes QUIT, leaves its one loop, calls pygame.quit, and returns clean evidence."
example = "The worked command list joins into the exact canonical module invocation."
observable = "python -m moonvale opens the ordinary game; injected QUIT makes the real Game return quit=clean without waiting."
failure = "Duplicated entrypoint logic drifts, a missing installed/src package fails module resolution, and nested loops prevent QUIT from reaching cleanup."
practice = "s10-l03-w1"

[[lessons.artifactSteps]]
id = "s10-add-scene-tests"
path = "tests/test_scenes.py"
mode = "write"
instruction = "Create tests/test_scenes.py to drive public key requests, director flow, and silent optional audio."
content = '''
from types import SimpleNamespace

import pygame

from moonvale.audio import AudioBank
from moonvale.scenes import SceneDirector


def key_event(key):
    return SimpleNamespace(type=pygame.KEYDOWN, key=key)


def test_scene_keys_follow_single_director():
    director = SceneDirector()
    assert director.current.name == "title"
    director.switch(director.current.handle_event(key_event(pygame.K_RETURN)))
    assert director.current.name == "play"
    director.switch(director.current.handle_event(key_event(pygame.K_p)))
    assert director.current.name == "pause"
    director.switch(director.current.handle_event(key_event(pygame.K_ESCAPE)))
    assert director.current.name == "play"
    director.switch("game-over")
    director.switch(director.current.handle_event(key_event(pygame.K_SPACE)))
    assert director.current.name == "title"


def test_missing_audio_uses_stable_silence(tmp_path):
    audio = AudioBank.load_optional(tmp_path / "absent")
    assert audio.mode == "silent"
    assert audio.play("title") is None
    assert audio.play("action") is None
'''

