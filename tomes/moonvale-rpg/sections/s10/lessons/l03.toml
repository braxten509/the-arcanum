[[lessons.exercises]]
id = "s10-l03-e1"
type = "text"
points = 20
prompt = "Which package file does Python execute for a module launch?"
answer = "__main__.py"
accept = ["moonvale/__main__.py", "src/moonvale/__main__.py"]
hint = "Its double-underscore name matches the module entry convention."
whyWrong = "app.py owns behavior, but Python's -m package lookup begins at the package entry file."

