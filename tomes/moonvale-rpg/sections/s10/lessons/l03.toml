id = "s10-l03-e2"
type = "mc"
points = 15
prompt = "What makes the injected quit proof meaningful?"
choices = ["It prints clean before starting", "It assigns Game's return dictionary", "It sends pygame.QUIT through the real Game lifecycle", "It skips pygame initialization"]
answer = 2
whyWrong = "Prepared text, direct result assignment, or skipped initialization would bypass the behavior under proof."
hint = "Control the external event, not the target outcome."
explain = "The real loop observes QUIT and performs its own cleanup."

