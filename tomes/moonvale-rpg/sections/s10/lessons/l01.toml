type = "mc"
points = 15
prompt = "Who applies a scene's returned transition request?"
choices = ["The audio file", "The Game lifecycle through SceneDirector", "The inventory overlay", "A nested scene loop"]
answer = 1
whyWrong = "Audio and overlays do not own control flow, and nested loops violate the established lifecycle boundary."
hint = "The same object already owns events, update, render, and quit."
explain = "Game applies requests at a known point in its one frame loop."

