[[lessons.exercises]]
id = "s10-l02-e1"
type = "mc"
points = 15
prompt = "Why does SilentSound implement play()?"
choices = ["To synthesize music", "To keep the caller interface valid when optional media is absent", "To replace the Game loop", "To serialize mixer channels"]
answer = 1
whyWrong = "The null object neither creates media, owns lifecycle, nor enters save data; it preserves a callable boundary."
hint = "Scenes should not branch before every sound request."
explain = "Real and silent entries respond to the same play method."

[[lessons.exercises]]
id = "s10-l02-e2"
type = "fill"
points = 20
prompt = "Complete the focused fallback for a missing candidate path."
code = '''
if not path.____():
    sounds[name] = SilentSound()
'''
answer = "exists"
hint = "Call pathlib's Boolean file-presence method."
whyWrong = "Reading or playing before this check would raise before the fallback is installed."

