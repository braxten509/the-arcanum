[[lessons.exercises]]
id = "s08-l02-w1"
type = "write"
points = 30
prompt = "Start enemy_hp=3, apply damage=4 with a zero clamp, choose victory when zero, and print exactly TURN enemy=0 result=victory."
expect = '''
TURN enemy=0 result=victory'''
solution = '''
enemy_hp = 3
damage = 4
enemy_hp = max(0, enemy_hp - damage)
result = "victory" if enemy_hp == 0 else "ongoing"
print("TURN", f"enemy={enemy_hp}", f"result={result}")
'''
hint = "Clamp first, then use a conditional expression based on equality with zero."

