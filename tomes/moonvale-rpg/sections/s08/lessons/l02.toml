choices = ["To close PyGame", "To prevent a defeated enemy response and preserve turn/RNG order", "To erase inventory", "To reload the map"]
answer = 1
whyWrong = "The return ends this method's turn resolution only; it does not close, erase, or reload unrelated owners."
hint = "A zero-health wisp cannot take its half of the turn."
explain = "Victory and reward complete the turn before enemy damage is rolled."

