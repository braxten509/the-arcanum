[[lessons]]
id = "s08-l01"
title = "Deal Damage Through One Rule"
teaches = ["combat-health-and-damage"]
body = '''
<p>Combat consumes the canonical <code>Player.stats</code> keys: health, max_health, and power. It does not create a second player model. The wisp owns a small dictionary with health seven and power two. Damage is an integer calculated once, then health becomes <code>max(0, health - damage)</code>. The lower clamp prevents negative values from leaking into UI, saves, or victory checks.</p>
<pre><code data-kind="runnable">health = 7
damage = 4
health = max(0, health - damage)
print("WISP_HP", health)</code></pre>
<p>The probe prints <code>WISP_HP 3</code>. <code>max</code> chooses the greater of zero and the proposed result. A likely failure is subtracting damage in both the encounter and a scene animation callback; health then changes twice. Domain rules mutate health, while animation only observes emitted events.</p>
<p><code>CombatEncounter</code> receives a Player and a seed. <code>random.Random(seed)</code> creates an isolated generator, so tests do not depend on global random calls from other systems. Player attack damage is power plus a bonus of zero or one. With seed seven, the first bonus is one and the first strike deals four. Enemy damage is power plus the next seeded bonus.</p>
<p>The encounter owns <code>result</code> as <code>ongoing</code>, <code>victory</code>, or <code>defeat</code>. Its private damage helper returns the clamped health but does not decide scenes. A turn method checks that the battle is ongoing before any action. Calling another turn after victory raises <code>ValueError</code> rather than duplicating rewards.</p>
<p>To diagnose combat, print seed, actor, base power, rolled bonus, damage, and health after. Never repair a mismatch by changing the receipt; confirm the sequence of generator calls. Injecting the generator keeps replay exact while ordinary play may choose a fresh seed at encounter creation.</p>
<div class="field-notes"><div class="fn-head">FIELD NOTES // RANDOM AT THE EDGE</div><p>Randomness chooses a permitted variation; it does not own health or victory. Seeded injection makes the same rule path reproducible.</p></div>
'''

[[lessons.concepts]]
id = "combat-health-and-damage"
purpose = "Apply bounded damage to the established Player stats and a wisp record using one injected seeded random source."
anatomy = "Construct Random(seed); read actor power; roll randint(0,1); add once; subtract once; clamp health at zero; reject turns after a terminal result."
example = "The worked seven-health wisp takes four damage and remains at three."
observable = "Seed seven produces the same damage sequence every run, health never drops below zero, and terminal encounters refuse more turns."
failure = "Global randomness drifts with unrelated calls, duplicate mutations apply damage twice, and negative health complicates all later checks."
practice = "s08-l01-w1"

[[lessons.artifactSteps]]
id = "s08-add-combat-owner"
path = "src/moonvale/combat.py"
mode = "write"
instruction = "Create src/moonvale/combat.py with this initial seeded encounter and bounded damage owner."
content = '''
import random


class CombatEncounter:
    def __init__(self, player, seed=0):
        self.player = player
        self.enemy = {"id": "wisp", "health": 7, "max_health": 7, "power": 2}
        self.rng = random.Random(seed)
        self.result = "ongoing"
        self.animation_events = []
        self.reward = None

    @staticmethod
    def _after_damage(health, damage):
        return max(0, health - damage)

    def _require_ongoing(self):
        if self.result != "ongoing":
            raise ValueError(f"encounter already ended: {self.result}")
'''

[[lessons.readings]]
label = "Python random documentation: Random objects"
url = "https://docs.python.org/3/library/random.html#random.Random"

[[lessons.exercises]]
id = "s08-l01-e1"
type = "mc"
points = 15
prompt = "Why inject random.Random(seed) into one encounter?"
choices = ["It draws the wisp", "It makes permitted random choices reproducible and isolated", "It replaces Player.stats", "It opens a scene"]
answer = 1
whyWrong = "Randomness does not render, own player data, or manage scenes; the isolated sequence is for deterministic rule variation."
hint = "Unrelated random calls should not change the battle proof."
explain = "A local seeded generator produces the same bonuses in the same order."

