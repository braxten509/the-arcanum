type = "mc"
points = 15
prompt = "What makes seed seven a valid fixture rather than a fake victory?"
choices = ["It assigns result directly", "It controls random choices while public turns still apply all rules", "It disables enemy health", "It prints expected text first"]
answer = 1
whyWrong = "Direct result, disabled health, or prepared output skip behavior; seeded turns still execute real damage and reward methods."
hint = "Control the edge, not the outcome state."
explain = "The seed supplies reproducible bonuses while rules determine victory."

