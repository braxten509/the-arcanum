[[lessons.exercises]]
id = "s01-l03-e1"
type = "fill"
points = 20
prompt = "Complete the function so the computed pixel coordinate reaches its caller."
code = '''
def tile_to_world(tile, tile_size):
    ____ tile * tile_size
'''
answer = "return"
hint = "Use the keyword that sends one value out of a function call."
whyWrong = "Printing would display a value but leave the caller with None; this rule must provide a reusable result."

[[lessons.exercises]]
id = "s01-l03-e2"
type = "text"
points = 20
prompt = "Which standard-library class should own portable filesystem locations instead of manually concatenated slash strings?"
answer = "Path"
hint = "It is imported from pathlib in the worked example."
whyWrong = "A plain string can name a path, but it does not provide portable joining and parent traversal operations."

[[lessons.exercises]]
id = "s01-l03-d1"
type = "type"
points = 12
reps = 2
prompt = "Retype the narrow exception header exactly."
code = 'except ValueError as error:'

[[lessons.exercises]]
id = "s01-l03-e3"
type = "mc"
points = 15
prompt = "A call to float('fast') fails. Which response preserves useful diagnostic boundaries?"
choices = ["Catch every Exception and ignore it", "Delete the conversion", "Return the original string as though it were numeric", "Catch ValueError, report the bad value, and choose an explicit fallback"]
answer = 3
whyWrong = "Ignoring all exceptions hides unrelated defects; deleting or pretending away conversion breaks the numeric contract."
hint = "Select the route whose exception type matches failed numeric conversion."
explain = "ValueError is the expected failure for a syntactically invalid numeric string, so it is the narrow recoverable boundary."

[[lessons.exercises]]
id = "s01-l03-w1"
type = "write"
points = 30
prompt = "Define tile_to_world(tile, tile_size), call it for tile 7 and size 32, and print exactly PIXEL 224. The output must use the returned multiplication result."
starter = '''
def tile_to_world(tile, tile_size):
    # return the computed coordinate
    pass
'''
expect = '''
PIXEL 224'''
solution = '''
def tile_to_world(tile, tile_size):
    return tile * tile_size

print("PIXEL", tile_to_world(7, 32))
'''
hint = "Replace pass with a return of the two parameters multiplied, then call the function inside print."

[[lessons.exercises]]
id = "s01-l03-e4"
type = "fill"
points = 20
prompt = "Complete the portable expression that selects the directory containing the current source file."
code = 'ROOT = Path(__file__).resolve().____'
answer = "parent"
hint = "Use the Path attribute for the containing directory, after resolve has made the location absolute."
whyWrong = "The name or suffix of the file is not its containing folder; path composition needs the parent directory."
