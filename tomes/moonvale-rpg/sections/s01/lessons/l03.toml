[[lessons]]
id = "s01-l03"
title = "Draw Boundaries with Functions"
teaches = ["python-functions-modules-errors"]
body = '''
<p>A function gives a meaningful name to a repeatable rule. <code>def</code> means “define”; the function name follows, parentheses hold parameter names, and a colon opens the four-space body. <code>return</code> sends one result back to the caller. The definition does not run the body. A later call such as <code>tile_to_world(3, 16)</code> supplies arguments and triggers it.</p>
<pre><code data-kind="runnable">def tile_to_world(tile, tile_size):
    return tile * tile_size

world_x = tile_to_world(3, 16)
print("WORLD", world_x)</code></pre>
<p>The output <code>WORLD 48</code> is evidence that the arguments reached the parameters and the returned number reached <code>world_x</code>. Forgetting parentheses gives you the function object instead of calling it. Forgetting <code>return</code> makes the result <code>None</code>, Python's “no value” marker.</p>
<p>A module is one <code>.py</code> file. An <code>import</code> lets another file use names from it. <code>from pathlib import Path</code> finds the standard-library <code>pathlib</code> module and brings its <code>Path</code> class into this module. <code>Path(__file__).resolve().parent</code> starts at the current source file, makes its location absolute, and selects its containing directory. Unlike a string joined with hard-coded slashes, a <code>Path</code> works across operating systems.</p>
<p>Errors are observations, not verdicts. A traceback reads from the most recent call at the bottom: note the exception type, message, file, and line. A <code>try</code> block marks an operation that may fail. A matching <code>except ValueError as error:</code> handles only conversion failures and binds the exception to <code>error</code>. Catching bare <code>Exception</code> everywhere hides programming defects, so use the narrow type you can recover from.</p>
<pre><code data-kind="runnable">def parse_speed(text):
    try:
        return float(text)
    except ValueError as error:
        print("BAD SPEED", error)
        return 0.0

print(parse_speed("2.5"))</code></pre>
<p>The valid example prints <code>2.5</code>. Changing the input to <code>"fast"</code> follows the recovery path. Later save loading will apply this same boundary: validate outside data, report the precise failure, and keep a safe in-memory state.</p>
<div class="field-notes"><div class="fn-head">FIELD NOTES // SMALL SURFACES</div><p>Functions and modules reduce the number of facts each caller must hold. A caller needs the function's name, inputs, result, and failure promise; implementation details remain behind that surface.</p></div>
'''

[[lessons.concepts]]
id = "python-functions-modules-errors"
purpose = "Name reusable computations, split source into importable files, build portable paths, and recover from narrowly understood external-data failures."
anatomy = "Define with def, parameters, colon, indented body, and return; call with arguments; import module names; compose Path objects; read traceback type/file/line; wrap a risky operation in try and catch a specific exception with except."
example = "tile_to_world returns 48, while parse_speed demonstrates both a valid float conversion and a ValueError recovery route."
observable = "The worked calls print WORLD 48 and 2.5; an invalid speed additionally prints a BAD SPEED diagnostic."
failure = "Omitted call parentheses, a missing return, a wrong import path, or an overly broad except produces function objects, None, import failures, or hidden defects."
practice = "s01-l03-e1"

