[[lessons.exercises]]
id = "s01-l04-e2"
type = "fill"
points = 20
prompt = "Fill the instance name that owns the modules attribute inside a method."
code = '____.modules.append(module_name)'
answer = "self"
hint = "Use the first parameter supplied automatically by an instance method call."
whyWrong = "A class name would target class-level state; this list belongs to the current object."

[[lessons.exercises]]
id = "s01-l04-w1"
type = "write"
points = 30
prompt = "Create a Hero class whose constructor stores health 10 and whose take_damage(amount) method clamps health at zero. Apply damage 4 and then 9; print exactly HP 0 using the final attribute."
starter = '''
class Hero:
    def __init__(self):
        self.health = 10
'''
expect = '''
HP 0'''
solution = '''
class Hero:
    def __init__(self):
        self.health = 10

    def take_damage(self, amount):
        self.health = max(0, self.health - amount)

hero = Hero()
hero.take_damage(4)
hero.take_damage(9)
print("HP", hero.health)
'''
hint = "Define take_damage at class indentation, assign max(0, old health minus amount), then call it twice on one Hero object."

[[lessons.exercises]]
id = "s01-l04-e3"
type = "text"
points = 20
prompt = "What naming style does PEP 8 recommend for a Python class such as WorkshopState?"
answer = "CapWords"
accept = ["PascalCase"]
hint = "The style capitalizes each word without underscores."
whyWrong = "snake_case is the convention for methods and variables; class names normally use capitalized words."

[[lessons.exercises]]
id = "s01-l04-e4"
type = "text"
points = 20
prompt = "Which exact first parameter name does PEP 8 prescribe for ordinary instance methods?"
answer = "self"
hint = "It is supplied automatically for a call such as state.add_module('settings')."
whyWrong = "The conventional instance parameter is not an arbitrary class name or cls, which is reserved for class methods."
