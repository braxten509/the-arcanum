[[lessons]]
id = "s01-l04"
title = "Keep State inside a Model"
teaches = ["python-class-state"]
body = '''
<p>A class defines a family of objects that share behavior. Games have many values that belong together: a hero's name, health, and position should not drift through unrelated global variables. <code>class WorkshopState:</code> opens a class body. The specially documented method <code>__init__</code> runs when a caller constructs an object. Its first parameter, <code>self</code>, names that particular object inside its methods.</p>
<pre><code data-kind="runnable">class WorkshopState:
    def __init__(self, project):
        self.project = project
        self.modules = []

    def add_module(self, module_name):
        self.modules.append(module_name)

state = WorkshopState("MoonvaleRPG")
state.add_module("settings")
print(state.project, len(state.modules))</code></pre>
<p>Read construction in order: <code>WorkshopState("MoonvaleRPG")</code> creates a new object, passes it as <code>self</code>, passes the string as <code>project</code>, and assigns two attributes. A method call, <code>state.add_module("settings")</code>, automatically supplies <code>state</code> as <code>self</code>. The output <code>MoonvaleRPG 1</code> proves both attributes changed on the same object.</p>
<p>An attribute is a name stored on an object and accessed with a dot. A local variable exists only during one function call; an instance attribute such as <code>self.modules</code> survives for the object's lifetime. A common failure is writing <code>modules.append(...)</code> inside the method. Python then searches for a local or global name and raises <code>NameError</code>, because the list belongs to <code>self</code>. Another mistake is using a shared class-level list; every instance would then mutate the same collection.</p>
<p>Methods can protect state rules. A health method can clamp damage rather than asking every caller to remember the lower bound. The <code>max</code> function returns the larger input, so <code>self.health = max(0, self.health - amount)</code> prevents negative health. Later <code>Player</code>, quest, inventory, and combat objects will use this ownership pattern. Each owns its data, exposes a small method surface, and lets callers observe results instead of editing internals from anywhere.</p>
<p>Python convention uses <code>CapWords</code> for class names and <code>snake_case</code> for variables, functions, and methods. Four spaces indent each class and method suite. Those choices are not merely cosmetic: consistent shapes let a reader recognize the kind of name before tracing it.</p>
<div class="field-notes"><div class="fn-head">FIELD NOTES // OWNERSHIP</div><p>“Who is allowed to change this value?” is a powerful design question. If the answer is one model method, debugging has one boundary; if the answer is every scene and widget, state bugs can arrive from anywhere.</p></div>
'''

[[lessons.concepts]]
id = "python-class-state"
purpose = "Group related mutable values with the methods that are allowed to change them."
anatomy = "Declare a CapWords class; initialize each object in __init__; use self.attribute for owned values; construct with ClassName(arguments); call snake_case methods with dot syntax."
example = "WorkshopState constructs one project object, adds a module through its method, and reports one stored module."
observable = "The example prints MoonvaleRPG 1 after add_module mutates that object's list."
failure = "Omitting self from an attribute access raises NameError or mutates the wrong shared location; bad indentation can place a method outside the class."
practice = "s01-l04-d1"

[[lessons.artifactSteps]]
id = "s01-add-workshop-model"
path = "src/moonvale/model.py"
mode = "write"
instruction = "Create src/moonvale/model.py with this complete WorkshopState model; preserve its class and method spellings for the chapter proof."
content = '''
class WorkshopState:
    def __init__(self, project):
        self.project = project
        self.modules = []

    def add_module(self, module_name):
        if module_name not in self.modules:
            self.modules.append(module_name)

    def receipt(self):
        return f"S01_OK project={self.project} modules={len(self.modules)}"
'''

[[lessons.readings]]
label = "Python tutorial: classes"
url = "https://docs.python.org/3/tutorial/classes.html"

[[lessons.exercises]]
id = "s01-l04-e1"
type = "mc"
points = 15
prompt = "Why does add_module access self.modules instead of a bare modules name?"
choices = ["Dot access makes append faster", "The list belongs to that WorkshopState instance", "Python requires every list to be inside a class", "self converts strings into modules"]
answer = 1
whyWrong = "The dot is about ownership and lookup on one instance, not speed, list restrictions, or conversion."
hint = "Ask where the list was first assigned in __init__."
explain = "self.modules retrieves the collection created for the same object during construction."

