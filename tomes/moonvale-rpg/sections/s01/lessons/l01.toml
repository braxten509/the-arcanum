[[lessons]]
id = "s01-l01"
title = "Light the Workshop Lantern"
teaches = ["external-python-workshop", "tool-install", "tool-create-open", "tool-navigate", "tool-edit-save", "tool-run-test", "tool-diagnose"]
body = '''
<p>A game project begins with a repeatable workshop. <strong>Python</strong> is the interpreter that reads our source files. A <strong>terminal</strong> is the text window where we ask that interpreter to work. An <strong>editor</strong> is where we create, open, change, and save files. Install Python 3.12 or newer and a code editor before continuing; both are mandatory. Tiled is optional until Chapter IV, but installing it now is convenient.</p>
<p>Open a terminal, create an empty folder named <code>MoonvaleRPG</code>, enter it, and open that same folder in your editor. The terminal's current directory and the editor's project root must name the same place. Run this sequence one line at a time:</p>
<pre><code data-kind="terminal">python3 --version
python3 -m venv .venv
source .venv/bin/activate
python -m pip install pygame-ce pytmx pytest pyinstaller
python -c "print('WORKSHOP READY')"</code></pre>
<p><code>python3 -m venv .venv</code> asks Python's <code>venv</code> module to make an isolated environment in the hidden <code>.venv</code> directory. Activation changes which <code>python</code> and <code>pip</code> the terminal finds. The install command puts libraries inside this project environment, not into unrelated projects. On Windows PowerShell, activation is <code>.venv\Scripts\Activate.ps1</code>. The final <code>-c</code> command runs the quoted Python statement directly; seeing <code>WORKSHOP READY</code> proves the interpreter answers.</p>
<p>Create a file with the editor, type a line, save it, then run it from the terminal. The save step matters: Python reads bytes on disk, not unsaved editor text. If <code>python</code> is not found, activation failed or Python is not installed. If an import later says <code>ModuleNotFoundError</code>, run <code>python -m pip --version</code> and confirm its path contains this project's <code>.venv</code>. Recovery is evidence-led: check the directory, interpreter, saved file, and first traceback line before reinstalling anything.</p>
<div class="field-notes"><div class="fn-head">FIELD NOTES // ONE INTERPRETER</div><p>Using <code>python -m pip</code> binds the installer to the same interpreter that will run the game. A green install from a different <code>pip</code> executable can still leave the active Python unable to import the package.</p></div>
'''

[[lessons.concepts]]
id = "external-python-workshop"
purpose = "Create, open, navigate, edit, save, run, test, diagnose, and recover a real isolated Python project before game code depends on it."
anatomy = "Create and enter MoonvaleRPG; open that folder in an editor; create .venv; activate it; install with python -m pip; create and save a file; run it; read the command, file, and final traceback line when it fails."
example = "The five-command terminal sequence creates the environment and runs a one-line observable Python probe."
observable = "The terminal prints WORKSHOP READY, and python -m pip --version points inside MoonvaleRPG/.venv."
failure = "A command-not-found or ModuleNotFoundError usually means the environment is inactive, the wrong directory is open, or the file was not saved."
practice = "s01-l01-d1"

[[lessons.concepts]]
id = "tool-install"
purpose = "Install the mandatory Python toolchain and project dependencies into one isolated environment."
anatomy = "Verify Python; create .venv; activate it; run python -m pip install with the four named packages; verify pip's environment path."
example = "The opening terminal sequence installs pygame-ce, pytmx, pytest, and pyinstaller after activation."
observable = "python -m pip --version reports a path under MoonvaleRPG/.venv."
failure = "A package installed by a different pip remains unavailable to the active Python interpreter."
practice = "s01-l01-e1"

[[lessons.concepts]]
id = "tool-create-open"
purpose = "Create the MoonvaleRPG folder and open that exact folder as the editor project."
anatomy = "Make an empty MoonvaleRPG directory; enter it in the terminal; choose Open Folder in the editor; compare both displayed roots."
example = "The lesson directs the learner to align the terminal current directory with the editor project root before file work."
observable = "The editor file tree and terminal prompt both identify MoonvaleRPG."
failure = "Opening the parent or a sibling folder causes files and commands to land in different projects."
practice = "s01-l01-w1"

[[lessons.concepts]]
id = "tool-navigate"
purpose = "Keep commands anchored at the project root so relative file and environment paths resolve predictably."
anatomy = "Read the terminal's current directory; enter MoonvaleRPG; locate .venv, requirements.txt, and later src beneath that root."
example = "Every setup command in the worked sequence is run after entering the empty project folder."
observable = "Created paths appear under the editor's MoonvaleRPG tree rather than elsewhere on disk."
failure = "Running from the wrong directory creates .venv or source files outside the open project."
practice = "s01-l01-d1"

[[lessons.concepts]]
id = "tool-edit-save"
purpose = "Make the on-disk source match the code visible in the editor before execution."
anatomy = "Create a file in the project tree; type the complete line; save; confirm the editor's unsaved marker disappears; then run."
example = "The learner creates, edits, saves, and executes a one-line Python probe after setup."
observable = "The terminal prints the newly saved text rather than an older file version."
failure = "Unsaved editor changes are absent when Python reads the file from disk."
practice = "s01-l01-w1"

[[lessons.concepts]]
id = "tool-run-test"
purpose = "Execute a saved Python program and use a concrete expected line as a tiny test."
anatomy = "Run python -c for the initial probe; later run a saved file with python; compare stdout character for character with the promised output."
example = "python -c executes print('WORKSHOP READY') and produces one observable line."
observable = "The command exits successfully and stdout reads WORKSHOP READY."
failure = "Running a different file or interpreter produces missing output or an unrelated traceback."
practice = "s01-l01-e3"

[[lessons.concepts]]
id = "tool-diagnose"
purpose = "Use command paths and traceback details to locate setup and source failures without blind reinstalls."
anatomy = "Read the command; confirm current directory and active interpreter; confirm the file is saved; then read the final traceback exception, message, file, and line."
example = "The lesson diagnoses ModuleNotFoundError by checking python -m pip --version for the project .venv path."
observable = "The checked interpreter, installer, and project path agree before a targeted correction is made."
failure = "Reinstalling without checking paths can repeat the same mismatch and destroy useful evidence."
practice = "s01-l01-e2"

[[lessons.artifactSteps]]
id = "s01-declare-dependencies"
path = "requirements.txt"
mode = "write"
instruction = "At the MoonvaleRPG project root, create requirements.txt with these four dependency lines; save it and compare each distribution name before continuing."
content = '''
pygame-ce
pytmx
pytest
pyinstaller
'''

[[lessons.readings]]
label = "Python documentation: creating virtual environments"
url = "https://docs.python.org/3/library/venv.html"

[[lessons.exercises]]
id = "s01-l01-e1"
type = "mc"
points = 15
prompt = "Which command most reliably installs a package for the interpreter that will run Moonvale RPG?"
choices = ["pip install pygame-ce", "python -m pip install pygame-ce", "python pygame-ce install", "venv install pygame-ce"]
answer = 1
whyWrong = "A bare pip may belong to another interpreter; Python does not install packages by running a distribution name, and venv creates environments rather than fetching libraries."
hint = "Choose the command that begins by selecting the active Python interpreter."
explain = "python -m pip runs pip as a module of the selected Python, keeping install and run paths aligned."

[[lessons.exercises]]
id = "s01-l01-d1"
type = "type"
points = 12
reps = 2
prompt = "Retype the environment-creation command exactly."
code = 'python3 -m venv .venv'

[[lessons.exercises]]
id = "s01-l01-e2"
type = "text"
points = 20
prompt = "After activation, which command displays the installer path so you can verify that it belongs to the active project environment?"
answer = "python -m pip --version"
hint = "Ask pip for its version through Python; the response also includes a filesystem path."
whyWrong = "Checking only Python's version does not reveal which pip module is attached to it."

[[lessons.exercises]]
id = "s01-l01-e3"
type = "fill"
points = 20
prompt = "Complete the direct interpreter probe so its observable output is WORKSHOP READY."
code = 'python -c "____"'
answer = "print('WORKSHOP READY')"
accept = ["print(\"WORKSHOP READY\")"]
hint = "The quoted fragment is one Python print call, not a shell echo command."
whyWrong = "The -c flag expects Python source inside the quotes; terminal syntax placed there is parsed as Python and fails."

[[lessons.exercises]]
id = "s01-l01-w1"
type = "write"
points = 30
prompt = "Write a complete Python program that stores the string MoonvaleRPG in a variable named project and prints exactly WORKSHOP MoonvaleRPG."
starter = '''
project = "MoonvaleRPG"
'''
expect = '''
WORKSHOP MoonvaleRPG'''
solution = '''
project = "MoonvaleRPG"
print("WORKSHOP", project)
'''
hint = "Pass the label string and the project variable to print as two comma-separated values."
