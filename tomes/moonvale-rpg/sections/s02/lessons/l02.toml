[[lessons.exercises]]
id = "s02-l02-e1"
type = "mc"
points = 15
prompt = "Why is movement multiplied by delta time?"
choices = ["To make pixels brighter", "To force exactly sixty events", "To express speed per second despite different frame durations", "To convert every coordinate into an integer"]
answer = 2
whyWrong = "Delta time scales a per-second rate by elapsed seconds; it does not affect color, event count, or require integer positions."
hint = "Compare the distance traveled during a fast frame with a slower frame."
explain = "speed * dt yields the portion of one second's movement that belongs to this update."

