[[lessons]]
id = "s02-l02"
title = "Measure One Honest Tick"
teaches = ["deterministic-game-loop"]
body = '''
<p>A game loop repeats four responsibilities in one order: gather input, update the model, render the new state, and regulate time. A <code>while</code> statement repeats its indented body while its condition remains true. <code>running = True</code> gives the loop an explicit switch; a close event changes it to <code>False</code>, and the next condition check ends repetition.</p>
<p>Games should describe movement in units per second, not units per frame. <code>pygame.time.Clock().tick(TARGET_FPS)</code> waits when necessary and returns elapsed milliseconds. Dividing by <code>1000.0</code> converts milliseconds to seconds. The conventional name <code>dt</code> means delta time: the duration since the previous update. A speed of 120 pixels per second moves <code>120 * dt</code> pixels this update. At 60 stable frames, <code>dt</code> is about 0.0167; during a slower frame it grows, preserving roughly the same real-world speed.</p>
<pre><code data-kind="pseudocode">while running:
    events = event_source()
    running = handle(events)
    scene.update(dt)
    scene.render(screen)
    pygame.display.flip()
    dt = clock.tick(TARGET_FPS) / 1000.0</code></pre>
<p>The pseudocode names the architecture but is not pasted as an independent program because its collaborators need definitions. Notice that only the outer loop asks the clock to tick. A sprite or scene that creates another clock would disagree about elapsed time and make deterministic testing difficult.</p>
<p><strong>Dependency injection</strong> means the <code>Game</code> receives a clock and event source instead of constructing every edge internally. Normal launch uses <code>pygame.time.Clock</code> and <code>pygame.event.get</code>. Tests use <code>FixedClock</code> and a scripted event callable. The loop still performs the real ordering and scene methods. This makes time and input reproducible without assigning the target scene or printing a prepared result.</p>
<p>A frame limit is another injected boundary. <code>None</code> means no limit; an integer means stop after that many completed frames. The comparison must happen around the real loop. If the proof simply prints “three frames” without calling update and render three times, it has measured nothing.</p>
<div class="field-notes"><div class="fn-head">FIELD NOTES // FIRST DT</div><p>The first update may use zero seconds because no previous tick exists. That is safe: render the initial state, then let the clock provide elapsed time for the next update. Consistency matters more than forcing motion into frame zero.</p></div>
'''

[[lessons.concepts]]
id = "deterministic-game-loop"
purpose = "Run input, update, render, presentation, and timing in one stable order while allowing controlled clocks, event sources, and frame limits."
anatomy = "Start running; initialize dt; while running and below the optional limit, gather events, handle, update with dt, render, flip, tick one clock, and count the completed frame; then quit."
example = "The loop pseudocode shows the single authority and the lesson explains swapping only the clock and event-source edges."
observable = "A three-frame proof calls the real scene update and render three times before reporting frames=3."
failure = "Nested loops, multiple clocks, frame-based speed, or a receipt printed without exercised methods makes timing inconsistent or proof meaningless."
practice = "s02-l02-e1"

[[lessons.artifactSteps]]
id = "s02-add-game-loop"
path = "src/moonvale/game.py"
mode = "write"
instruction = "Create src/moonvale/game.py with the single Game lifecycle below; keep all future frame timing inside this class."
content = '''
import pygame

from moonvale.scenes import TitleScene
from moonvale.settings import TARGET_FPS, WINDOW_SIZE


class Game:
    def __init__(self, clock=None, event_source=None):
        self.clock = clock or pygame.time.Clock()
        self.event_source = event_source or pygame.event.get
        self.scene = TitleScene()

    def run(self, frame_limit=None):
        pygame.init()
        screen = pygame.display.set_mode(WINDOW_SIZE)
        pygame.display.set_caption("Moonvale RPG")
        running = True
        frames = 0
        dt = 0.0
        while running and (frame_limit is None or frames < frame_limit):
            for event in self.event_source():
                if event.type == pygame.QUIT:
                    running = False
                else:
                    self.scene.handle_event(event)
            self.scene.update(dt)
            screen.fill((24, 29, 50))
            self.scene.render(screen)
            pygame.display.flip()
            dt = self.clock.tick(TARGET_FPS) / 1000.0
            frames += 1
        pygame.quit()
        return {"scene": self.scene.name, "frames": frames, "quit": "clean"}
'''

