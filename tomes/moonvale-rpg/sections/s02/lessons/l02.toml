id = "s02-l02-e3"
type = "fill"
points = 20
prompt = "Complete the loop condition so a limit of three stops before a fourth frame."
code = 'while running and (frame_limit is None or frames ____ frame_limit):'
answer = "<"
hint = "The loop may continue only while the completed count is strictly below the limit."
whyWrong = "Using <= permits frame counts 0, 1, 2, and 3, which completes four frames."

[[lessons.exercises]]
id = "s02-l02-w1"
type = "write"
points = 30
prompt = "Given speed 120 and frame durations [0.25, 0.5, 0.25], accumulate speed * dt for each duration and print exactly DISTANCE 120.0."
starter = '''
speed = 120
durations = [0.25, 0.5, 0.25]
distance = 0.0
'''
expect = '''
DISTANCE 120.0'''
solution = '''
speed = 120
durations = [0.25, 0.5, 0.25]
distance = 0.0
for dt in durations:
    distance = distance + speed * dt
print("DISTANCE", distance)
'''
hint = "Loop over durations and add speed multiplied by the current dt to distance."

