[[lessons.exercises]]
id = "s02-l04-w1"
type = "write"
points = 30
prompt = "Create FixedClock with ticks 0 and tick(target_fps) adding one and returning 16. Call it three times, sum the returned milliseconds, and print exactly TIME 48 TICKS 3."
expect = '''
TIME 48 TICKS 3'''
solution = '''
class FixedClock:
    def __init__(self):
        self.ticks = 0

    def tick(self, target_fps):
        self.ticks += 1
        return 16

clock = FixedClock()
total = 0
for _ in range(3):
    total += clock.tick(60)
print("TIME", total, "TICKS", clock.ticks)
'''
hint = "Keep one clock object, add each returned 16 to total, and read clock.ticks after the loop."

