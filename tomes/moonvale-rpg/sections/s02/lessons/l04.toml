[[lessons]]
id = "s02-l04"
title = "Control the Test Horizon"
teaches = ["headless-proof-controls"]
body = '''
<p>Deterministic evidence controls only the unstable edges. <code>FixedClock</code> stores a millisecond value and returns it from every <code>tick</code> call. It also records how many ticks occurred. The real <code>Game</code> receives it through the same clock attribute used in normal play. Three frames therefore call <code>tick(60)</code> three times and each update after the first sees a stable elapsed interval.</p>
<pre><code data-kind="runnable">class FixedClock:
    def __init__(self, milliseconds=16):
        self.milliseconds = milliseconds
        self.ticks = 0

    def tick(self, target_fps):
        self.ticks += 1
        return self.milliseconds

clock = FixedClock()
print(clock.tick(60), clock.ticks)</code></pre>
<p>The program prints <code>16 1</code>. A default parameter such as <code>milliseconds=16</code> supplies a value when the caller omits that argument. Callers may still override it with <code>FixedClock(20)</code>. The unused-looking <code>target_fps</code> parameter is intentionally present because the injected object must match the real clock's call surface.</p>
<p>The proof branch asks <code>Game(clock=FixedClock(), event_source=lambda: [])</code> to run with <code>frame_limit=3</code>. <code>lambda: []</code> defines a tiny no-argument function that returns a new empty event list. This is the only lambda required in the course; read it as “when called, yield no queued events.” The loop still initializes PyGame, creates its surface, updates and renders the real <code>TitleScene</code>, flips, ticks, and quits.</p>
<p>The resulting dictionary is formatted into <code>S02_OK scene=title frames=3 quit=clean</code>. The receipt values come from <code>Game.run</code>, not from constants printed beside an unexercised object. The earlier s01 proof remains in <code>app.main</code>; proof dispatch adds a branch rather than replacing an old capability.</p>
<p>A seed will control random enemy choices later, and input snapshots will drive movement. Those controls must enter at edges before domain methods run. Setting a scene's final name, health, or quest status directly inside a proof would manufacture the observation. Withholding a control during final acceptance must cause a real scenario to fail, which is why the boundary design begins now.</p>
<div class="field-notes"><div class="fn-head">FIELD NOTES // DETERMINISM</div><p>Determinism does not mean removing time or events. It means supplying known versions, running the same rules, and observing repeatable effects.</p></div>
'''

[[lessons.concepts]]
id = "headless-proof-controls"
purpose = "Inject known time, events, and a frame horizon into the real game lifecycle so automated evidence is repeatable and bounded."
anatomy = "Construct FixedClock; supply a callable event source; pass both into Game; set a frame limit; run the normal loop; derive the receipt from returned observations."
example = "The worked FixedClock reports its returned milliseconds and tick count, then the Working uses it for three real frames."
observable = "The proof exits and prints S02_OK scene=title frames=3 quit=clean."
failure = "Hardcoding a successful receipt or assigning final state bypasses domain behavior, while an absent frame limit can leave automated execution waiting forever."
practice = "s02-l04-e1"

[[lessons.artifactSteps]]
id = "s02-add-fixed-clock"
path = "src/moonvale/testing.py"
mode = "write"
instruction = "Create src/moonvale/testing.py with the bounded clock test double used by the chapter proof."
content = '''
class FixedClock:
    def __init__(self, milliseconds=16):
        self.milliseconds = milliseconds
        self.ticks = 0

    def tick(self, target_fps):
        self.ticks += 1
        return self.milliseconds
'''

[[lessons.readings]]
label = "Python documentation: callable objects and lambda expressions"
url = "https://docs.python.org/3/tutorial/controlflow.html#lambda-expressions"

[[lessons.exercises]]
id = "s02-l04-e1"
type = "mc"
points = 15
prompt = "Which proof design provides trustworthy evidence?"
choices = ["Print a constant success string before running Game", "Assign scene.name to title inside the proof", "Skip display and scene methods entirely", "Inject a fixed clock and empty event source, run three real frames, then format returned observations"]
answer = 3
whyWrong = "Prepared output and direct state assignment manufacture the result; skipping real methods proves no application behavior."
hint = "Choose the option that controls edges but leaves the actual loop and scene work intact."
explain = "Known inputs plus executed domain behavior produce repeatable evidence without replacing the mechanism under test."

