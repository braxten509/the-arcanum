[[lessons.exercises]]
id = "s02-l01-e1"
type = "mc"
points = 15
prompt = "Why must the loop call pygame.event.get even before gameplay input exists?"
choices = ["It changes the target frame rate", "It services queued operating-system events, including window close requests", "It automatically moves every sprite", "It saves the screen to disk"]
answer = 1
whyWrong = "The event queue carries OS and input records; it does not control timing, move entities, or capture images."
hint = "Think about what happens when a desktop window stops responding to its operating system."
explain = "Draining the queue lets the application inspect close/input events and keeps the window responsive."

