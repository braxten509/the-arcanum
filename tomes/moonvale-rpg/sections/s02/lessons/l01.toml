[[lessons.exercises]]
id = "s02-l01-w1"
type = "write"
points = 30
prompt = "Without importing PyGame, model a frame snapshot with right=True and left=False, compute int(right) - int(left), and print exactly DX 1."
starter = '''
left = False
right = True
'''
expect = '''
DX 1'''
solution = '''
left = False
right = True
dx = int(right) - int(left)
print("DX", dx)
'''
hint = "Convert each Boolean to an integer and subtract the left value from the right value."

