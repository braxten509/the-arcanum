[[lessons]]
id = "s02-l03"
title = "Give Scenes One Door"
teaches = ["scene-transition-contract"]
body = '''
<p>A scene owns one mode of the game, such as title, play, pause, or game over. Every scene must respond to the same three moments: <code>handle_event(event)</code>, <code>update(dt)</code>, and <code>render(surface)</code>. This shared method shape is a <strong>protocol</strong>: callers depend on behavior and names rather than on one concrete class.</p>
<p><code>TitleScene</code> begins with <code>name = "title"</code> and counts updates and renders. The counters make work observable during headless proof. Its rendering uses <code>pygame.draw.rect(surface, color, rectangle)</code>. A rectangle tuple reads left position, top position, width, then height. Drawing a solid panel needs no external image, so deterministic proof and a fresh learner project stay media-independent.</p>
<pre><code data-kind="runnable">class CounterScene:
    name = "counter"

    def __init__(self):
        self.updates = 0

    def update(self, dt):
        self.updates += 1

scene = CounterScene()
scene.update(0.016)
print(scene.name, scene.updates)</code></pre>
<p>The output <code>counter 1</code> demonstrates class attributes, construction, augmented assignment, and a method call. <code>+= 1</code> means take the existing integer, add one, and assign the result back. If <code>updates</code> is never initialized, the first method call raises <code>AttributeError</code>.</p>
<p>A scene must not start its own <code>while</code> loop. The <code>Game</code> already owns the one loop, event queue, clock, and display. Nested loops cause pause or combat screens to steal control, stop other systems from updating, and complicate clean quit. Instead, a scene may return or request a next-scene name; the game applies that switch between updates. Chapter X will extend this exact door with title, play, pause, and game-over implementations.</p>
<p>For now, <code>handle_event</code> deliberately returns <code>None</code>. The <code>return</code> statement makes that no-transition result explicit and keeps the method callable even before action presses have behavior. It is different from forgetting the method: callers can safely invoke it. Later sections replace the explicit no-transition route when action and pause presses become meaningful.</p>
<div class="field-notes"><div class="fn-head">FIELD NOTES // PROTOCOL BEFORE HIERARCHY</div><p>A base class is optional in Python. A small protocol can remain simple until shared implementation actually appears; matching method names are enough for the game loop's calls.</p></div>
'''

[[lessons.concepts]]
id = "scene-transition-contract"
purpose = "Give every game mode one event, update, and render surface so the Game can switch modes without nested loops."
anatomy = "Each scene exposes name plus handle_event(event), update(dt), and render(surface); Game owns the current scene and calls those methods once per frame."
example = "CounterScene performs one update and reports counter 1 through the same update method shape."
observable = "The title scene records exactly one update and one render per completed Game frame."
failure = "Missing attributes raise AttributeError, while a scene-owned loop steals timing, events, and quit control from Game."
practice = "s02-l03-e1"

[[lessons.artifactSteps]]
id = "s02-add-title-scene"
path = "src/moonvale/scenes.py"
mode = "write"
instruction = "Create src/moonvale/scenes.py with the media-free TitleScene protocol implementation."
content = '''
import pygame


class TitleScene:
    name = "title"

    def __init__(self):
        self.updates = 0
        self.renders = 0

    def handle_event(self, event):
        return None

    def update(self, dt):
        self.updates += 1

    def render(self, surface):
        self.renders += 1
        pygame.draw.rect(surface, (92, 117, 145), (80, 60, 240, 120))
'''

[[lessons.readings]]
label = "PyGame documentation: drawing rectangles"
url = "https://pyga.me/docs/ref/draw.html#pygame.draw.rect"

[[lessons.exercises]]
id = "s02-l03-e1"
type = "fill"
points = 20
prompt = "Complete the exact scene method the loop calls to advance state with elapsed time."
code = '''
def ____(self, dt):
    self.updates += 1
'''
answer = "update"
hint = "The protocol separates event handling, state advancement, and painting."
whyWrong = "render receives a surface, while this method receives delta time and changes model counters."

[[lessons.exercises]]
id = "s02-l03-e2"
type = "mc"
points = 15
prompt = "Why should PauseScene avoid starting its own while loop?"
choices = ["Python permits only one while statement per file", "A scene loop would own a second display", "The Game already owns timing, events, rendering order, and clean quit", "Pause scenes cannot have methods"]
answer = 2
whyWrong = "Python allows many loops and scenes have methods; the design issue is competing ownership of the application lifecycle."
hint = "Identify the object already responsible for every frame boundary."
explain = "One Game loop keeps event, time, render, and quit authority consistent across scene changes."

[[lessons.exercises]]
id = "s02-l03-e3"
type = "text"
points = 20
prompt = "Which exception type usually identifies access to an instance attribute that was never created?"
answer = "AttributeError"
hint = "Its name points to a failed dot lookup on an object."
whyWrong = "NameError concerns an unresolved standalone name; this failure follows object.attribute syntax."

[[lessons.exercises]]
id = "s02-l03-w1"
type = "write"
points = 30
prompt = "Create CounterScene with updates initialized to 0 and update(dt) adding one. Call update three times with 0.016 and print exactly UPDATES 3."
expect = '''
UPDATES 3'''
solution = '''
class CounterScene:
    def __init__(self):
        self.updates = 0

    def update(self, dt):
        self.updates += 1

scene = CounterScene()
for _ in range(3):
    scene.update(0.016)
print("UPDATES", scene.updates)
'''
hint = "Construct one scene, loop over range(3), and call update on that same object."
