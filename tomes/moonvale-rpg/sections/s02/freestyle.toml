[freestyle]
title = "THE WORKING: Turn Three Frames"
brief = "Rowan asks for one bounded revolution of the real wheel.<ul><li>Extend <code>moonvale.app.main</code> without removing the s01 proof.</li><li>For <code>--arcanum-proof s02</code>, construct <code>Game</code> with <code>FixedClock(16)</code> and an empty callable event source.</li><li>Run exactly three frames through initialization, <code>TitleScene</code> update/render, display flip, clock tick, and clean quit.</li><li>Format returned observations as exactly <code>S02_OK scene=title frames=3 quit=clean</code>.</li><li>Ordinary launch must enter the unbounded interactive <code>Game.run()</code> path.</li></ul>"
requires = ["pygame-window-lifecycle", "deterministic-game-loop", "scene-transition-contract", "headless-proof-controls", "moonvale-package-skeleton"]
reward = 190
xray = "Rowan checks that Game alone owns the loop and clock, proof values come from Game.run, s01 remains green, and ordinary launch does not silently use the three-frame horizon. He docks nested scene loops, hardcoded receipts, skipped event draining, or missing pygame.quit."

[[freestyle.referenceSteps]]
id = "s02-reference-app-loop"
path = "src/moonvale/app.py"
mode = "rewrite"
preserves = "all-active"
instruction = "Replace app.py with the complete additive proof dispatcher and ordinary Game launch."
content = '''
import sys

from moonvale.game import Game
from moonvale.model import WorkshopState
from moonvale.testing import FixedClock


def workshop_receipt():
    state = WorkshopState("MoonvaleRPG")
    for module_name in ["settings", "model", "app"]:
        state.add_module(module_name)
    return state.receipt()


def main(args=None):
    args = list(sys.argv[1:] if args is None else args)
    if args == ["--arcanum-proof", "s01"]:
        print(workshop_receipt())
        return 0
    if args == ["--arcanum-proof", "s02"]:
        game = Game(clock=FixedClock(16), event_source=lambda: [])
        receipt = game.run(frame_limit=3)
        print(
            f"S02_OK scene={receipt['scene']} frames={receipt['frames']} "
            f"quit={receipt['quit']}"
        )
        return 0
    return Game().run()
'''

