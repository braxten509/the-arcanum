id = "s12"
codename = "CHAPTER XII // SEAL THE MOONVALE ATLAS"
short = "Seal the Moonvale Atlas"
title = "Seal the Moonvale Atlas"
build = "run cumulative acceptance from a clean install, verify persistence and the full playable journey, build with PyInstaller, launch outside the source tree, and prove the distributed RPG reports every promised milestone."
brief = "The final seal belongs to behavior that survives a clean road. You will drive every promised milestone through one acceptance adapter, prove each control matters with negative challenges, bundle the map and credits beside the executable, and launch the same app surface outside the authoring tree."

[proof]
mode = "package"
expectedFiles = ["main.py", "requirements.txt", "src/moonvale/acceptance.py", "src/moonvale/app.py", "src/moonvale/world.py", "src/moonvale/release.py", "tests/test_acceptance.py", "assets/credits.md", "assets/maps/moonvale.tmx"]
runArgs = ["--arcanum-proof", "s12"]
expect = "S12_OK scenarios=10 status=PASS release=ready package=prepared"
requirementsFile = "requirements.txt"
artifactPath = "dist/MoonvaleRPG"
packageArgs = ["--onefile", "--name", "MoonvaleRPG", "--paths", "src", "--add-data", "assets:assets", "main.py"]

[[assets]]
id = "optional-player-sheet-delivery"
kind = "sprite"
lesson = "s12-l04"
destination = "assets/sprites/player.png"
sourceGuidance = "Reuse the licensed human-made player sheet you selected in Chapter V, or choose one now with at least two 32x32 frames in each of four facing rows. Download it from its real asset page, rename it player.png, and place it at this exact destination before the visible and packaged walkthrough. If you omit it, Moonvale deliberately uses the media-free colored-frame fallback."
licenseGuidance = "Verify the license on the chosen asset page for your intended distribution, follow every use and attribution term, and record the creator, source page, exact license, filename, and required credit in assets/credits.md before packaging."
sources = [{ label = "Kenney Tiny Dungeon", url = "https://kenney.nl/assets/tiny-dungeon", license = "CC0 as stated on the asset page; still record the source and chosen file in assets/credits.md" }]
