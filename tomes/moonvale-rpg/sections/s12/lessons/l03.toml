[[lessons]]
id = "s12-l03"
title = "Carry Assets into the Frozen Atlas"
teaches = ["pyinstaller-package-boundary"]
body = '''
<p>PyInstaller analyzes main.py and imports, collects Python modules into an executable, and exposes bundled data from a temporary extraction directory in one-file mode. It does not automatically include arbitrary TMX or credits files, so the package command must name <code>assets:assets</code> with <code>--add-data</code>.</p>
<p>The command also supplies <code>--paths src</code> so analysis can find the src-layout moonvale package, <code>--name MoonvaleRPG</code> for the executable, and <code>--onefile</code> for one launch artifact. On this Linux build surface, the source/destination separator inside add-data is a colon.</p>
<pre><code data-kind="terminal">python -m PyInstaller --onefile --name MoonvaleRPG --paths src --add-data assets:assets main.py
cd /tmp
/path/to/project/dist/MoonvaleRPG --arcanum-acceptance</code></pre>
<p>The first command creates dist/MoonvaleRPG. The second deliberately launches it while the current directory is outside the project, proving no accidental relative path is required. A likely failure is omitting assets; imports succeed, but World raises FileNotFoundError for moonvale.tmx.</p>
<p><code>asset_root()</code> now supports both surfaces. In source, the fallback base remains the project root derived from world.py. In a frozen PyInstaller process, <code>sys._MEIPASS</code> identifies the extraction root. <code>getattr(sys, "_MEIPASS", fallback)</code> reads that special value when present and otherwise returns the supplied fallback.</p>
<p>Convert the selected base to Path, then append assets once. The rest of Moonvale continues asking asset_root for maps, credits, and optional audio. No caller knows whether it runs from source or a package.</p>
<p>The package proof installs requirements.txt into a fresh delivery environment, invokes PyInstaller without a shell, checks the declared artifact path, launches the s12 receipt, then runs the same acceptance and scenario challenges against the executable. pytest is a validation dependency but tests, caches, saves, corrupt quarantines, debug maps, and source fixtures are not added as data.</p>
<p>If packaging fails, read the first PyInstaller error and confirm the active interpreter. If launch fails, inspect the resolved asset root and bundled file list before changing code. Keep dist generated; rebuild rather than hand-editing its contents.</p>
<div class="field-notes"><div class="fn-head">FIELD NOTES // CODE AND DATA TRAVEL DIFFERENTLY</div><p>Import analysis finds Python. Explicit data declarations carry non-Python runtime files.</p></div>
'''

[[lessons.concepts]]
id = "pyinstaller-package-boundary"
purpose = "Build one MoonvaleRPG executable that finds the installed src package and bundled map/credits from outside the source tree."
anatomy = "Install requirements; invoke PyInstaller module; choose onefile/name; add src analysis path; add assets data destination; resolve _MEIPASS or source root; verify artifact path; launch acceptance externally."
example = "The terminal sequence builds dist/MoonvaleRPG and launches it from /tmp with the acceptance argument."
observable = "The artifact opens or emits acceptance JSON outside the project, while World loads moonvale.tmx and release audit finds credits."
failure = "Missing --paths loses src imports, missing --add-data loses maps, cwd-relative assets fail externally, and hand-edited dist cannot be reproduced."
practice = "s12-l03-w1"

[[lessons.artifactSteps]]
id = "s12-import-frozen-runtime"
path = "src/moonvale/world.py"
mode = "replace"
instruction = "Add sys to the canonical world asset-boundary imports."
find = '''
from pathlib import Path

import pygame
'''
content = '''
import sys
from pathlib import Path

import pygame
'''

[[lessons.artifactSteps]]
id = "s12-make-asset-root-package-safe"
path = "src/moonvale/world.py"
mode = "replace"
instruction = "Replace the source-only asset root with a PyInstaller extraction-root fallback that preserves source behavior."
find = '''
def asset_root():
    return Path(__file__).resolve().parents[2] / "assets"
'''
content = '''
def asset_root():
    source_root = Path(__file__).resolve().parents[2]
    runtime_root = Path(getattr(sys, "_MEIPASS", source_root))
    return runtime_root / "assets"
'''

[[lessons.readings]]
label = "PyInstaller documentation: using data files"
url = "https://pyinstaller.org/en/stable/spec-files.html#adding-data-files"

[[lessons.exercises]]
id = "s12-l03-e1"
type = "mc"
points = 15
prompt = "Why does the package command need --add-data assets:assets?"
choices = ["PyInstaller otherwise ignores non-Python TMX and credits data", "It installs pygame-ce", "It runs pytest inside the game", "It enables the debug overlay"]
answer = 0
whyWrong = "Dependency installation, tests, and diagnostics are separate concerns; add-data carries runtime files import analysis does not collect."
hint = "Python imports and arbitrary map files travel through different mechanisms."
explain = "The declaration places the source assets directory at the bundled assets destination."

[[lessons.exercises]]
id = "s12-l03-e2"
type = "fill"
points = 20
prompt = "Complete the frozen-runtime extraction-root lookup."
code = 'runtime_root = Path(getattr(sys, "____", source_root))'
answer = "_MEIPASS"
hint = "Use PyInstaller's documented private extraction-directory attribute."
whyWrong = "__file__ remains the source fallback; the frozen process exposes this different sys attribute."

[[lessons.exercises]]
id = "s12-l03-d1"
type = "type"
points = 12
reps = 2
prompt = "Retype the package-safe final join."
code = 'return runtime_root / "assets"'

[[lessons.exercises]]
id = "s12-l03-w1"
type = "write"
points = 30
prompt = "Given flags ['--onefile', '--name', 'MoonvaleRPG'], join with spaces and print exactly PACKAGE --onefile --name MoonvaleRPG."
expect = '''
PACKAGE --onefile --name MoonvaleRPG'''
solution = '''
flags = ["--onefile", "--name", "MoonvaleRPG"]
print("PACKAGE", " ".join(flags))
'''
hint = "Keep each command token separate, then join the list with one space."

[[lessons.exercises]]
id = "s12-l03-e3"
type = "text"
points = 20
prompt = "Which declared artifact path must exist after the build?"
answer = "dist/MoonvaleRPG"
hint = "It combines PyInstaller's default output directory with the chosen executable name."
whyWrong = "build holds intermediate analysis; the launchable artifact is under dist."
