[[lessons]]
id = "s12-l02"
title = "Prove Every Control Matters"
teaches = ["acceptance-challenge-regressions"]
body = '''
<p>A positive acceptance run proves the intended route works. A negative challenge proves the report depends on its controls. The harness launches the same adapter once per scenario with <code>ARCANUM_ACCEPTANCE_CHALLENGE</code> set to that exact id.</p>
<p>ControlDeck does not assign a false result. It changes one declared edge before the ordinary method path runs. A neutral movement snapshot never reaches the wall. Zero animation time leaves frame zero. Seed two does not defeat the wisp in two attacks. Zero save frames leave no restorable file. Empty scene input leaves the director at title.</p>
<pre><code data-kind="runnable">expected = ["boot", "walk", "save"]
observed = {name: name != "walk" for name in expected}
print("NEGATIVE", observed["walk"], list(observed) == expected)</code></pre>
<p>The probe prints <code>NEGATIVE False True</code>. The dictionary comprehension derives one Boolean per ordered name. This tiny example illustrates report shape only; the real challenge changes controls and lets domain behavior decide. A likely failure is setting <code>observed[challenge] = False</code>, which tests formatting rather than control dependence.</p>
<p>pytest parameterization runs one test body with every SCENARIOS value. The decorator supplies a different scenario argument for each case. Each case uses a unique tmp_path child, calls run_acceptance, verifies status FAIL, confirms the challenged scenario is false, and checks every value remains Boolean in exact order.</p>
<p>The positive regression expects PASS, ten true observations, release ready, and no temp save. Another test calls acceptance_main with ARCANUM_SAVE_ROOT and parses captured stdout as JSON. It verifies the public object has only version, status, and scenarios. Human-readable diagnostics belong on stderr or in pytest, because a package harness must parse stdout as exactly one JSON object.</p>
<p>A challenged adapter should still complete normally enough to emit evidence. FAIL is a tested observation report, not a process crash. Therefore acceptance_main returns zero after printing either PASS or FAIL; malformed configuration may still raise a clear exception.</p>
<p>When a negative test unexpectedly passes, inspect the scenario's chosen kind and confirm the domain path actually consumes that control. When several unrelated scenarios fail, find the shared canonical owner instead of weakening multiple assertions.</p>
<div class="field-notes"><div class="fn-head">FIELD NOTES // COUNTERFACTUAL EVIDENCE</div><p>If removing a required control changes nothing, either the control is not required or the adapter bypasses the promised behavior.</p></div>
'''

[[lessons.concepts]]
id = "acceptance-challenge-regressions"
purpose = "Prove every declared scenario depends on a real input, clock, seed, or frame-limit edge while preserving ordered Boolean JSON output."
anatomy = "Parameterize exact scenario ids; create isolated save root; invalidate that scenario's control; run the same journey; require FAIL and challenged false; require Boolean ordered values; parse one public JSON object."
example = "The worked ordered comprehension produces a false walk observation while preserving the expected key order."
observable = "The positive test passes all ten; ten negative cases each make their challenged scenario false and status FAIL without a crash or prepared report."
failure = "Directly assigning false skips behavior, a non-Boolean value breaks schema, extra stdout breaks JSON parsing, and shared save roots make tests order-dependent."
practice = "s12-l02-w1"

[[lessons.artifactSteps]]
