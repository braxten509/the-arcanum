[[lessons.artifactSteps]]
id = "s12-add-acceptance-tests"
path = "tests/test_acceptance.py"
mode = "write"
instruction = "Create tests/test_acceptance.py with clean positive, per-scenario negative, and exact public JSON regressions."
content = '''
import json

import pytest

from moonvale.acceptance import SCENARIOS, acceptance_main, run_acceptance


def test_clean_acceptance_journey_passes(tmp_path):
    report = run_acceptance(save_root=tmp_path / "positive")
    assert report["version"] == 1
    assert report["status"] == "PASS"
    assert list(report["scenarios"]) == list(SCENARIOS)
    assert all(report["scenarios"].values())
    assert report["release"] == "ready"


@pytest.mark.parametrize("scenario", SCENARIOS)
def test_each_challenge_invalidates_real_control(tmp_path, scenario):
    report = run_acceptance(
        challenge=scenario,
        save_root=tmp_path / scenario,
    )
    assert report["status"] == "FAIL"
    assert report["scenarios"][scenario] is False
    assert list(report["scenarios"]) == list(SCENARIOS)
    assert all(isinstance(value, bool) for value in report["scenarios"].values())


def test_acceptance_main_prints_one_public_json_object(tmp_path, monkeypatch, capsys):
    monkeypatch.delenv("ARCANUM_ACCEPTANCE_CHALLENGE", raising=False)
    monkeypatch.setenv("ARCANUM_SAVE_ROOT", str(tmp_path / "public"))
    assert acceptance_main() == 0
    output = capsys.readouterr().out
    public = json.loads(output)
    assert list(public) == ["version", "status", "scenarios"]
    assert public["status"] == "PASS"
    assert list(public["scenarios"]) == list(SCENARIOS)
'''

