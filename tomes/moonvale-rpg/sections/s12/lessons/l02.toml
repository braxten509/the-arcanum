[[lessons.exercises]]
id = "s12-l02-w1"
type = "write"
points = 30
prompt = "Build ordered names boot, walk, save with walk false and the others true, then print exactly NEGATIVE False True for walk and order equality."
expect = '''
NEGATIVE False True'''
solution = '''
expected = ["boot", "walk", "save"]
observed = {name: name != "walk" for name in expected}
print("NEGATIVE", observed["walk"], list(observed) == expected)
'''
hint = "Use a comprehension comparing each name with walk, then compare list(observed) with expected."

