[[lessons]]
id = "s12-l01"
title = "Drive the Whole Journey"
teaches = ["cumulative-acceptance-adapter"]
body = '''
<p>Acceptance answers whether the finished RPG keeps its promises, not whether ten labels can be printed. <code>SCENARIOS</code> copies the exact planned order. <code>run_acceptance</code> constructs real World, Player, Camera, Animator, QuestLog, Inventory, CombatEncounter, SaveRepository, SceneDirector, AudioBank, SpatialIndex, and release-audit behavior.</p>
<p>Each scenario stores a Boolean observation after public methods run. Walking supplies InputSnapshot, calls Player.move with World.walls_near, and observes the collision stop. Scrolling calls Camera.follow. Animation selects Player.direction and advances with controlled dt. Quest and inventory use their transition methods. Combat calls two seeded turns.</p>
<pre><code data-kind="runnable">observations = {"boot": True, "walk": True, "save": True}
status = "PASS" if all(observations.values()) else "FAIL"
print("ACCEPT", status, len(observations))</code></pre>
<p>The probe prints <code>ACCEPT PASS 3</code>. <code>all</code> evaluates the observed Boolean values; it does not create them. A likely failure is initializing every scenario to True and changing none. That report says nothing about the game.</p>
<p><code>ControlDeck</code> owns the four declared deterministic edges: input, clock, seed, and frame-limit. For an ordinary positive run it returns the supplied control. When the harness challenges one scenario, it invalidates that scenario's edge: neutral input, zero elapsed time, seed two, or zero frames. The same domain path then derives a false observation.</p>
<p>The save milestone uses an injected clean root. It drives quest completion and inventory state, atomically saves schema one, restores fresh owners, then corrupts only the disposable file and verifies quarantine. No real player path is touched.</p>
<p>The final scene-flow observation switches through the canonical director, while package readiness checks silent audio, map/credits resolution, debug disabled, frame limit unbounded, and release audit. The adapter returns an ordered report with version one, status, and scenarios. app.main alone prints its compact JSON.</p>
<p>To diagnose a false milestone, run pytest for that scenario, inspect its controlled input, then trace the first public method whose observed state diverges. Never repair acceptance by assigning the result.</p>
<div class="field-notes"><div class="fn-head">FIELD NOTES // CONTROL THE EDGE</div><p>Determinism fixes external choices. Rules still decide collision, rewards, victory, restoration, and transitions.</p></div>
'''

[[lessons.concepts]]
id = "cumulative-acceptance-adapter"
purpose = "Drive every planned milestone through the real cumulative Moonvale project and return one ordered versioned JSON-ready observation report."
anatomy = "Freeze scenario order; inject input/clock/seed/frame-limit; construct canonical owners; call public behavior; store Boolean observations; combine with all; preserve exact ids; return version/status/scenarios."
example = "The worked observations dictionary derives PASS from three true behaviors and reports their count."
observable = "A positive clean-root run reports version 1, status PASS, and all ten planned scenario ids true in order."
failure = "Literal true milestones, direct health/status assignment, fake output, real-save access, or reordered ids can pass formatting while proving no journey."
practice = "s12-l01-w1"

[[lessons.artifactSteps]]
id = "s12-add-acceptance-adapter"
path = "src/moonvale/acceptance.py"
mode = "write"
instruction = "Create src/moonvale/acceptance.py with the complete real-behavior journey, control invalidation, clean save root, and ordered report."
content = '''
import json
import os
from pathlib import Path
from tempfile import TemporaryDirectory

import pygame

from moonvale.animation import Animator, FrameLibrary
from moonvale.audio import AudioBank
from moonvale.camera import Camera
from moonvale.combat import CombatEncounter
from moonvale.diagnostics import Diagnostics
from moonvale.entities import Player
from moonvale.input import InputSnapshot
from moonvale.quests import QUEST_ID, QuestLog
from moonvale.release import release_audit
from moonvale.savegame import (
    SCHEMA_VERSION,
    SaveRepository,
    make_snapshot,
    restore_snapshot,
)
from moonvale.scenes import SceneDirector
from moonvale.world import World, asset_root


SCENARIOS = (
    "boot-title",
    "walk-and-collide",
    "scroll-tiled-world",
    "animate-player",
    "accept-village-quest",
    "collect-and-use-item",
    "win-seeded-encounter",
    "save-quit-and-resume",
    "navigate-scene-flow",
    "launch-packaged-rpg",
)


class ControlDeck:
    def __init__(self, challenge=None):
        if challenge is not None and challenge not in SCENARIOS:
            raise ValueError(f"unknown acceptance challenge: {challenge}")
        self.challenge = challenge

    def value(self, scenario, kind, normal):
        if self.challenge != scenario:
            return normal
        if kind == "input":
            if isinstance(normal, InputSnapshot):
                return InputSnapshot()
            if isinstance(normal, bool):
                return False
            return []
        if kind == "clock":
            return 0.0
        if kind == "seed":
            return 2
        if kind == "frame-limit":
            return 0
        raise ValueError(f"unknown acceptance control: {kind}")


def _journey(save_root, challenge=None):
    controls = ControlDeck(challenge)
    observed = {}

    director = SceneDirector()
    boot_frames = controls.value("boot-title", "frame-limit", 1)
    observed["boot-title"] = boot_frames > 0 and director.current.name == "title"

    world = World(asset_root() / "maps" / "moonvale.tmx")
    player = Player(32, 32)
    movement = controls.value(
        "walk-and-collide",
        "input",
        InputSnapshot(right=True),
    )
    player.set_intent(movement)
    blocked = player.move(0.5, world.walls_near(pygame.Rect(32, 32, 128, 32)))
    observed["walk-and-collide"] = blocked and player.rect.x == 64

    camera = Camera()
    scroll_frames = controls.value("scroll-tiled-world", "frame-limit", 1)
    if scroll_frames > 0:
        camera.follow(pygame.Rect(1008, 32, 32, 32), world.pixel_size)
    observed["scroll-tiled-world"] = tuple(camera.offset) == (544, 0)

    animated_player = Player()
    animated_player.set_intent(InputSnapshot(right=True))
    library = FrameLibrary.load_optional()
    animator = Animator(library)
    animator.select_motion(animated_player.direction)
    animation_dt = controls.value("animate-player", "clock", 0.15)
    animator.update(animation_dt)
    observed["animate-player"] = (
        animator.state == "walk-east"
        and animator.frame_index == 1
        and library.uses_fallback
    )

    quests = QuestLog()
    quest_action = controls.value("accept-village-quest", "input", True)
    if quest_action and "herbalist" in world.zones:
        quests.accept(QUEST_ID)
    observed["accept-village-quest"] = quests.status(QUEST_ID) == "accepted"

    inventory_player = Player()
    inventory_player.stats["health"] = 6
    inventory_player.inventory.add("healing-tonic")
    inventory_player.inventory.select("healing-tonic")
    item_action = controls.value("collect-and-use-item", "input", True)
    used = inventory_player.inventory.use_selected(inventory_player) if item_action else False
    observed["collect-and-use-item"] = (
        used
        and inventory_player.stats["health"] == 10
        and inventory_player.inventory.quantity("healing-tonic") == 0
    )

    combat_player = Player()
    seed = controls.value("win-seeded-encounter", "seed", 7)
    encounter = CombatEncounter(combat_player, seed=seed)
    encounter.attack_turn()
    encounter.attack_turn()
    defeated_player = Player()
    defeated_player.stats["health"] = 1
    defeated_encounter = CombatEncounter(defeated_player, seed=7)
    defeated_encounter.attack_turn()
    observed["win-seeded-encounter"] = (
        encounter.result == "victory"
        and encounter.next_scene() == "play"
        and combat_player.inventory.quantity("healing-tonic") == 1
        and defeated_encounter.result == "defeat"
        and defeated_encounter.next_scene() == "game-over"
    )

    saved_player = Player(64, 96)
    saved_player.stats["health"] = 8
    saved_player.inventory.add("lantern-herb", 3)
    saved_player.inventory.select("lantern-herb")
    saved_quests = QuestLog()
    saved_quests.accept(QUEST_ID)
    saved_quests.collect(QUEST_ID, 3)
    saved_quests.turn_in(QUEST_ID)
    repository = SaveRepository(save_root)
    save_frames = controls.value("save-quit-and-resume", "frame-limit", 1)
    if save_frames > 0:
        repository.save(make_snapshot(saved_player, saved_quests))
    loaded = repository.load()
    restored_player = Player()
    restored_quests = QuestLog()
    restored = loaded is not None
    if restored:
        restore_snapshot(loaded, restored_player, restored_quests)
    repository.root.mkdir(parents=True, exist_ok=True)
    repository.path.write_text("{broken", encoding="utf-8")
    _, recovered = repository.load_or_recover()
    observed["save-quit-and-resume"] = (
        restored
        and SCHEMA_VERSION == 1
        and restored_player.stats["health"] == 8
        and restored_player.inventory.quantity("lantern-herb") == 3
        and restored_quests.status(QUEST_ID) == "completed"
        and recovered
        and repository.corrupt_path.exists()
        and not repository.temporary_path.exists()
    )

    scene_names = controls.value(
        "navigate-scene-flow",
        "input",
        ["play", "pause", "play", "game-over", "title"],
    )
    scene_director = SceneDirector()
    flow = [scene_director.current.name]
    for name in scene_names:
        flow.append(scene_director.switch(name).name)
    observed["navigate-scene-flow"] = flow == [
        "title",
        "play",
        "pause",
        "play",
        "game-over",
        "title",
    ]

    package_frames = controls.value("launch-packaged-rpg", "frame-limit", 1)
    diagnostics = Diagnostics()
    audio = AudioBank.load_optional(asset_root() / "missing-audio")
    audit = release_audit(
        asset_root().parent,
        debug=diagnostics.enabled,
        frame_limit=None,
    )
    observed["launch-packaged-rpg"] = (
        package_frames > 0
        and audio.mode == "silent"
        and audit["ready"]
        and (asset_root() / "maps" / "moonvale.tmx").is_file()
        and (asset_root() / "credits.md").is_file()
    )
    return observed, audit


def run_acceptance(challenge=None, save_root=None):
    if save_root is not None:
        observed, audit = _journey(Path(save_root), challenge)
    else:
        with TemporaryDirectory() as temporary_root:
            observed, audit = _journey(Path(temporary_root), challenge)
    return {
        "version": 1,
        "status": "PASS" if all(observed.values()) else "FAIL",
        "scenarios": observed,
        "release": "ready" if audit["ready"] else "blocked",
    }


def acceptance_main():
    challenge = os.environ.get("ARCANUM_ACCEPTANCE_CHALLENGE")
    save_root = os.environ.get("ARCANUM_SAVE_ROOT")
    report = run_acceptance(challenge=challenge, save_root=save_root)
    public_report = {
        "version": report["version"],
        "status": report["status"],
        "scenarios": report["scenarios"],
    }
    print(json.dumps(public_report, separators=(",", ":")))
    return 0 if report["status"] == "PASS" else 1
'''

[[lessons.readings]]
label = "Python documentation: json.dumps"
url = "https://docs.python.org/3/library/json.html#json.dumps"

