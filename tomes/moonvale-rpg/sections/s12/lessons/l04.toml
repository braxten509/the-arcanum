[[lessons.exercises]]
id = "s12-l04-w1"
type = "write"
points = 30
prompt = "Given scenarios=10, status=PASS, release=ready, and package=prepared, print exactly S12_OK scenarios=10 status=PASS release=ready package=prepared."
expect = '''
S12_OK scenarios=10 status=PASS release=ready package=prepared'''
solution = '''
scenarios = 10
status = "PASS"
release = "ready"
package = "prepared"
print(
    "S12_OK",
    f"scenarios={scenarios}",
    f"status={status}",
    f"release={release}",
    f"package={package}",
)
'''
hint = "Print one label plus four f-string fields in the exact requested order."

[[lessons.exercises]]
id = "s12-l04-w2"
type = "write"
points = 30
prompt = "Create one dictionary with quest locked, give title_context and play_context references to it, change quest through play_context to accepted, and print exactly SHARED accepted through title_context."
expect = '''
SHARED accepted'''
solution = '''
shared = {"quest": "locked"}
title_context = shared
play_context = shared
play_context["quest"] = "accepted"
print("SHARED", title_context["quest"])
'''
hint = "Assign both context names to the same dictionary before changing the value through one name."
