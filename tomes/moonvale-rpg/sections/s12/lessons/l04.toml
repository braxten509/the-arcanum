[[lessons]]
id = "s12-l04"
title = "Launch Beyond the Writing Desk"
teaches = ["clean-external-delivery-proof", "tool-deliver"]
body = '''
<p>Delivery begins from a clean external folder, not from a warm development shell. Verify Python, create and activate .venv, install requirements.txt and the local project, run pytest, run source acceptance, build, then launch dist/MoonvaleRPG while the terminal's current directory is elsewhere.</p>
<pre><code data-kind="terminal">python3 -m venv .venv
source .venv/bin/activate
python -m pip install -r requirements.txt
python -m pip install -e .
python -m pytest -q
python -m moonvale --arcanum-acceptance
python -m PyInstaller --onefile --name MoonvaleRPG --paths src --add-data assets:assets main.py</code></pre>
<p>Read the sequence top to bottom. Environment creation isolates dependencies. The requirements install uses that interpreter and the editable dot install registers this src-layout project so <code>python -m moonvale</code> resolves from a clean shell. pytest checks deterministic rules. Source acceptance proves the cumulative adapter. PyInstaller creates the artifact. A likely failure is skipping the editable project install or building before tests, then debugging an import error or expensive frozen traceback whose cause was already visible.</p>
<p>app.main recognizes <code>--arcanum-acceptance</code> before chapter proof branches and delegates to acceptance_main. Root main.py, <code>python -m moonvale</code>, and the bundled executable all reach this one dispatcher. Ordinary arguments still create Game; <code>--debug</code> remains explicit.</p>
<p>The final Working adds <code>--arcanum-proof s12</code>. Its receipt calls run_acceptance, counts the ordered scenario observations, reads derived PASS/release readiness, and reports package prepared only when both are clean. It does not claim that text itself is a package; the package-mode harness builds and launches the declared artifact afterward.</p>
<p>From outside the project, source acceptance and packaged acceptance must each print one JSON object with the ten ids in order. The harness repeats every negative challenge against both surfaces. Preserve stdout for machine evidence; use tracebacks, pytest output, or stderr for diagnosis.</p>
<p>Inspect dist contents conceptually even in one-file mode: assets are declared, while tests, .venv, __pycache__, saves, save.tmp, save.corrupt, debug maps, and authoring fixtures are not. Review assets/credits.md and license any optional files personally.</p>
<p>Completion means the visible game also follows title, collision, scrolling, herbalist quest, item use, wisp victory, pause/resume, save, quit, and reload. The final composition therefore gives <code>Game</code> one shared context containing World, Player, Camera, Animator, QuestLog, AudioBank, CombatEncounter, and SaveRepository. Scene replacements receive that context instead of constructing disconnected demo owners.</p>
<p>In ordinary play, arrows or WASD move, E talks or gathers, C begins and advances the seeded wisp encounter, Q uses a selected tonic, I opens the inventory, F5 saves, F9 reloads, and P or Escape pauses. The herbalist zone and three visible herb markers turn the quest state into a walkable route. The save root lives under <code>Path.home() / ".moonvale-rpg"</code>, outside both source and package, so rebuilds do not erase progress.</p>
<p>The visible path still honors deterministic boundaries: PlayScene builds InputSnapshot, asks World for nearby walls, moves Player, follows with Camera, and advances Animator with Game dt. Combat calls the same public turn method as acceptance. Save and load call the same snapshot functions. A likely failure is leaving these systems only in receipts while ordinary Game renders placeholder panels; always perform the walkthrough after the external package launch.</p>
<pre><code data-kind="runnable">shared = {"quest": "locked"}
title_context = shared
play_context = shared
play_context["quest"] = "accepted"
print("SHARED", title_context["quest"])</code></pre>
<p>The probe prints <code>SHARED accepted</code>: both names refer to one mutable owner, just as every SceneDirector replacement receives one GameContext. Do not copy the Player or QuestLog into each scene; returning from pause would otherwise resurrect stale state.</p>
<p>The final scene source introduces a few focused PyGame actions. A <code>set()</code> stores currently held movement keys: KEYDOWN adds a key and KEYUP discards it, so motion continues between events and stops on release. <code>Rect.inflate(width, height)</code> returns a larger rectangle for a nearby-wall or interaction query without changing the original player rectangle. <code>pygame.font.Font(None, size)</code> selects PyGame's packaged default font, <code>font.render(text, True, color)</code> creates a text Surface, and <code>surface.blit(image, position)</code> copies either text or the current animation frame onto the window. <code>pygame.draw.circle</code> marks each media-free herb pickup. F5 and F9 are the named save/load key constants.</p>
<p><code>Path.home()</code> returns the player's home directory as a Path; joining <code>.moonvale-rpg</code> gives persistence a stable location independent of current working directory. An injected <code>save_root</code> still replaces it for disposable checks. If held keys stick, inspect KEYUP handling. If text is invisible, call <code>pygame.init()</code> before rendering and verify the foreground contrasts with the panel. If interaction triggers too far away, print both the original and inflated rectangles.</p>
<p>The adapter is repeatable evidence for those contracts, not a substitute for the learner's final visible walkthrough.</p>
<div class="field-notes"><div class="fn-head">FIELD NOTES // TWO COLD STARTS</div><p>Test source from a clean environment and the artifact from another directory. Each catches a different hidden dependency.</p></div>
'''

[[lessons.concepts]]
id = "clean-external-delivery-proof"
purpose = "Rebuild, test, accept, package, and externally launch Moonvale through one canonical dispatcher with no warm workspace or player-data dependency."
anatomy = "Compose one shared visible Game context; drive its public systems through scene controls; create/activate environment; install exact requirements and the editable src project; run pytest; run source acceptance; build declared artifact; change directory; launch proof/acceptance; run challenges; inspect credits/exclusions; perform visible walkthrough and relaunch its save."
example = "The shared-context probe proves two scene-facing names observe one quest mutation; the terminal sequence then progresses from a new virtual environment through tests, source acceptance, and the reproducible PyInstaller command."
observable = "Source and dist/MoonvaleRPG emit identical positive ordered JSON and challenged FAIL evidence from outside source; ordinary launch exposes movement, collision, camera, quest, inventory, combat, pause, save, and reload controls."
failure = "Warm dependencies hide missing requirements, source cwd hides asset bugs, extra stdout breaks JSON, disconnected panel scenes hide an unplayable final game, packaged saves leak state, and receipt text without artifact launch proves no delivery."
practice = "s12-l04-w2"

