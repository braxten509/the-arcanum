brief = "Rowan asks the complete atlas to survive beyond the desk.<ul><li>Preserve every s01-s11 proof, ordinary Game launch, and explicit <code>--debug</code> path.</li><li>Route <code>--arcanum-acceptance</code> through the real cumulative adapter and add <code>--arcanum-proof s12</code>.</li><li>The s12 receipt must call run_acceptance, count its ordered scenarios, and derive status, release, and package readiness; do not prepare success fields.</li><li>Keep seed seven and seeded inventory only inside tests/acceptance, and keep saves inside TemporaryDirectory or <code>ARCANUM_SAVE_ROOT</code>.</li><li>Print exactly <code>S12_OK scenarios=10 status=PASS release=ready package=prepared</code>; then build and externally launch the declared PyInstaller artifact.</li></ul>"
