[[lessons.exercises]]
id = "s06-l01-w1"
type = "write"
points = 30
prompt = "Create a nested dictionary with herbalist completed text 'Lamps lit', look it up by both exact keys, and print exactly DIALOGUE Lamps lit."
expect = '''
DIALOGUE Lamps lit'''
solution = '''
dialogue = {"herbalist": {"completed": "Lamps lit"}}
line = dialogue["herbalist"]["completed"]
print("DIALOGUE", line)
'''
hint = "Index the NPC key first, then the status key."

