points = 15
prompt = "From which status may turn_in grant the reward?"
choices = ["locked", "accepted", "ready", "completed"]
answer = 2
whyWrong = "Locked and accepted have not met the requirement; completed has already paid; only ready represents collected requirements awaiting turn-in."
hint = "The three herbs have been collected but the reward has not."
explain = "The ready state is the single legal reward edge."

