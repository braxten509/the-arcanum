[[lessons]]
id = "s06-l02"
title = "Guard the Lantern-Herb Promise"
teaches = ["finite-quest-state-machine"]
body = '''
<p>A finite state machine has a known set of states and explicit legal transitions. The lantern-herb quest begins <code>locked</code>. <code>accept</code> moves locked to accepted. <code>collect</code> adds herb quantity only while accepted or ready, and reaching three moves to ready. <code>turn_in</code> moves ready to completed and returns a five-moonmark reward exactly once.</p>
<pre><code data-kind="runnable">legal = {"locked": ["accepted"], "accepted": ["ready"], "ready": ["completed"]}
status = "locked"
status = legal[status][0]
print("STATUS", status)</code></pre>
<p>The dictionary selects allowed next states; the probe prints <code>STATUS accepted</code>. Production methods do not automatically pick a list element, but the example makes the graph observable. A common failure is allowing <code>turn_in</code> from accepted, which grants rewards before the required quantity. Guided practice identifies the required source status.</p>
<p><code>QuestLog.world_state</code> is one JSON-shaped dictionary. Under <code>quests</code>, the <code>lantern-herb</code> record stores exact keys <code>status</code> and <code>herbs</code>. Under <code>npc_flags</code>, completion sets <code>herbalist_helped=True</code>. Chapter IX will serialize this shape, so spelling and meaning are public contracts.</p>
<p>Each transition calls <code>_record(quest_id)</code>. An unknown id raises <code>KeyError</code>. An illegal transition raises <code>ValueError</code> naming the current state. Exceptions make programmer and corrupted-data mistakes visible; ordinary UI code can disable unavailable actions before calling. <code>collect</code> rejects negative quantities because subtracting pickups would violate the domain.</p>
<p>Completion is idempotent only at the UI boundary, not in <code>turn_in</code>. Calling it twice raises instead of issuing a second reward. This protects the economy. To diagnose a test, print quest id, status, herb count, requested action, and exception message in that order. Do not repair an illegal sequence by assigning status directly; drive the missing transition.</p>
<div class="field-notes"><div class="fn-head">FIELD NOTES // GRAPH, NOT FLAGS</div><p>One status string excludes contradictory combinations such as accepted=false and completed=true. Additional counts and NPC flags supplement the state rather than replace it.</p></div>
'''

[[lessons.concepts]]
id = "finite-quest-state-machine"
purpose = "Protect acceptance, collection, readiness, completion, NPC flags, and one-time reward behind explicit legal transitions."
anatomy = "Own JSON-shaped world_state; look up exact quest id; require locked for accept; require accepted/ready and nonnegative quantity for collect; promote at three; require ready for turn_in; set completed and NPC flag; return reward."
example = "The legal-transition dictionary moves the example from locked to accepted and prints the new status."
observable = "The legal sequence locked to accepted to ready to completed returns reward 5; early or repeated turn-in raises ValueError."
failure = "Direct status assignment bypasses invariants, negative collection corrupts quantity, and repeated completion can duplicate rewards."
practice = "s06-l02-w1"

[[lessons.artifactSteps]]
id = "s06-add-quest-log"
path = "src/moonvale/quests.py"
mode = "write"
instruction = "Create src/moonvale/quests.py with this complete finite state machine and retain every public id/key for save data."
content = '''
QUEST_ID = "lantern-herb"
REQUIRED_HERBS = 3


class QuestLog:
    def __init__(self):
        self.world_state = {
            "quests": {QUEST_ID: {"status": "locked", "herbs": 0}},
            "npc_flags": {},
        }

    def _record(self, quest_id):
        try:
            return self.world_state["quests"][quest_id]
        except KeyError as exc:
            raise KeyError(f"unknown quest id: {quest_id}") from exc

    def status(self, quest_id):
        return self._record(quest_id)["status"]

    def accept(self, quest_id):
        record = self._record(quest_id)
        if record["status"] != "locked":
            raise ValueError(f"cannot accept from {record['status']}")
        record["status"] = "accepted"

    def collect(self, quest_id, quantity=1):
        record = self._record(quest_id)
        if record["status"] not in ("accepted", "ready") or quantity < 0:
            raise ValueError("cannot collect for this quest state")
        record["herbs"] += quantity
        if record["herbs"] >= REQUIRED_HERBS:
            record["status"] = "ready"

    def turn_in(self, quest_id):
        record = self._record(quest_id)
        if record["status"] != "ready":
            raise ValueError(f"cannot turn in from {record['status']}")
        record["status"] = "completed"
        self.world_state["npc_flags"]["herbalist_helped"] = True
        return 5
'''

