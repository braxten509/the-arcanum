[[lessons]]
id = "s06-l03"
title = "Join the Map, Words, and Deed"
teaches = ["mapped-quest-interaction"]
body = '''
<p>The interaction adapter joins three established owners by id. <code>World.zones</code> proves that <code>herbalist</code> exists in the real TMX map. <code>DialogueBook</code> resolves words for that NPC. <code>QuestLog</code> owns the lantern-herb transitions. The adapter never copies the herbalist's x/y coordinates into dialogue or quest code.</p>
<pre><code data-kind="runnable">zones = {"herbalist": (320, 160, 64, 64)}
npc_id = "herbalist"
print("MAPPED", npc_id in zones)</code></pre>
<p>The membership operator <code>in</code> asks whether the dictionary contains the key and prints <code>MAPPED True</code>. A likely failure is checking for the quest id inside zones; <code>lantern-herb</code> identifies the deed, not the map object. Guided practice distinguishes those contracts.</p>
<p>The cumulative proof loads <code>moonvale.tmx</code> through <code>asset_root</code>, selects the mapped NPC id, reads the locked dialogue line, accepts the exact quest id, collects three herbs through the state machine, verifies the ready line, and turns in. Only then does it read status completed and reward five. This is a deterministic story path, not a set of target assignments.</p>
<p>Illegal paths deserve tests. A new QuestLog cannot turn in while locked. After accept, it cannot pay while merely accepted. After completion, a second turn-in cannot pay again. In pytest, use <code>with pytest.raises(ValueError)</code> to assert that a call fails for the intended reason. The proof receipt focuses on the legal path; the test artifact protects the negative boundaries.</p>
<p>When wiring a visible scene later, detect a player world Rect overlapping <code>world.zones["herbalist"]</code>, then respond to the action button once. Show <code>DialogueBook.line_for</code> using the current status. A choice or completed requirement invokes the appropriate QuestLog method. No nested dialogue loop is needed; scene update remains controlled by Game.</p>
<p>If the interaction disappears, inspect the TMX id first. If words are wrong, inspect status. If reward repeats, inspect the transition guard. Following the id/status/action trail localizes responsibility without rewriting the map or scene.</p>
<div class="field-notes"><div class="fn-head">FIELD NOTES // LOCATION IS NOT IDENTITY</div><p>World coordinates answer where; stable ids answer who and what. Keeping both lets designers move content without migrating story state.</p></div>
'''

[[lessons.concepts]]
id = "mapped-quest-interaction"
purpose = "Connect the real Tiled herbalist zone to dialogue and the lantern-herb state machine through stable ids while preserving one scene lifecycle."
anatomy = "Load World through asset_root; verify herbalist in zones; look up line by NPC id and quest status; invoke QuestLog legal transitions; observe completion and reward; test illegal reward edges."
example = "The membership probe confirms the herbalist id exists in map zones, and the Working drives the complete mapped quest path."
observable = "The path finishes with npc=herbalist, quest=lantern-herb, status=completed, reward=5; invalid turn-ins raise."
failure = "Using quest id as NPC id misses the zone; copying coordinates duplicates map data; nested dialogue loops break Game ownership."
practice = "s06-l03-e1"

[[lessons.artifactSteps]]
id = "s06-add-quest-transition-tests"
path = "tests/test_quests.py"
mode = "write"
instruction = "Create tests/test_quests.py with legal and illegal transition evidence, then run python -m pytest -q from the project root."
content = '''
import pytest

from moonvale.quests import QUEST_ID, QuestLog


def test_lantern_herb_legal_path():
    log = QuestLog()
    log.accept(QUEST_ID)
    log.collect(QUEST_ID, 3)
    assert log.turn_in(QUEST_ID) == 5
    assert log.status(QUEST_ID) == "completed"


def test_lantern_herb_rejects_early_and_repeat_turn_in():
    log = QuestLog()
    with pytest.raises(ValueError):
        log.turn_in(QUEST_ID)
    log.accept(QUEST_ID)
    log.collect(QUEST_ID, 3)
    log.turn_in(QUEST_ID)
    with pytest.raises(ValueError):
        log.turn_in(QUEST_ID)
'''

[[lessons.readings]]
label = "pytest documentation: asserting exceptions"
url = "https://docs.pytest.org/en/stable/how-to/assert.html#assertions-about-expected-exceptions"

