'''
content = '''
def quest_receipt():
    world = World(asset_root() / "maps" / "moonvale.tmx")
    npc_id = "herbalist"
    if npc_id not in world.zones:
        raise ValueError("herbalist zone is missing from the map")
    dialogue = DialogueBook()
    log = QuestLog()
    dialogue.line_for(npc_id, log.status(QUEST_ID))
    log.accept(QUEST_ID)
    log.collect(QUEST_ID, 3)
    dialogue.line_for(npc_id, log.status(QUEST_ID))
    reward = log.turn_in(QUEST_ID)
    return (
        f"S06_OK npc={npc_id} quest={QUEST_ID} "
        f"status={log.status(QUEST_ID)} reward={reward}"
    )


def main(args=None):
'''

