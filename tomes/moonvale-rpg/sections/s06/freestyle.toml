[freestyle]
title = "THE WORKING: Light Moonvale's Eastern Lamps"
brief = "Rowan asks one mapped conversation to become a kept promise.<ul><li>Preserve all s01-s05 proofs and ordinary launch.</li><li>Add <code>--arcanum-proof s06</code>: load the real World and verify <code>herbalist</code> is a mapped zone.</li><li>Use <code>DialogueBook</code> with current statuses; accept <code>QUEST_ID</code>, collect exactly three herbs, and turn in through <code>QuestLog</code>.</li><li>Derive completed status and the returned reward; never assign completion or reward fields directly.</li><li>Print exactly <code>S06_OK npc=herbalist quest=lantern-herb status=completed reward=5</code>.</li></ul>"
requires = ["data-driven-dialogue", "finite-quest-state-machine", "mapped-quest-interaction", "interaction-zone-query", "python-data-and-branches"]
reward = 250
xray = "Rowan docks duplicated coordinates, case-drifted ids, dialogue that mutates state, direct completion assignment, early/repeated rewards, or nested loops. He rewards exact map ids, explicit transition guards, JSON-shaped state, and exceptions that localize illegal actions."

