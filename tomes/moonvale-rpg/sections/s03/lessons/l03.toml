[[lessons.exercises]]
id = "s03-l03-e2"
type = "mc"
points = 15
prompt = "Why resolve x and y movement in separate passes?"
choices = ["Rect supports only one coordinate at a time", "It allows stable sliding along walls and clearer corner correction", "Python forbids two additions before a loop", "It makes Vector2 unnecessary"]
answer = 1
whyWrong = "Rect and Python can change both axes; the separation is a collision-design choice that preserves sliding and deterministic boundaries."
hint = "Imagine moving diagonally into the corner of a vertical wall."
explain = "Correcting one axis at a time keeps the unblocked axis available for movement along the surface."

