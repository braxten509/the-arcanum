[[lessons.exercises]]
id = "s03-l03-w1"
type = "write"
points = 30
prompt = "A 32-pixel body starts at x=32, attempts to move to x=96, and hits a wall whose left edge is 96. Compute corrected_x as wall_left - body_width and print exactly COLLISION x=64 blocked=True."
starter = '''
body_width = 32
wall_left = 96
attempted_x = 96
'''
expect = '''
COLLISION x=64 blocked=True'''
solution = '''
body_width = 32
wall_left = 96
attempted_x = 96
blocked = attempted_x + body_width > wall_left
corrected_x = wall_left - body_width if blocked else attempted_x
print("COLLISION", f"x={corrected_x}", f"blocked={blocked}")
'''
hint = "Compare the attempted right edge with wall_left, then subtract body_width when blocked."

[[lessons.exercises]]
id = "s03-l03-e4"
type = "mc"
points = 15
prompt = "What happens if collision corrects Rect but never copies that coordinate back to Player.position?"
choices = ["Nothing; Rect automatically owns Vector2", "The next sync can restore the stale float position and re-enter the wall", "PyGame deletes the wall", "The frame cap becomes zero"]
answer = 1
whyWrong = "Rect and Vector2 are separate objects; neither deletes walls nor changes timing, so explicit synchronization is required."
hint = "Recall which representation is authoritative before each new collision pass."
explain = "The precise vector must receive the boundary correction or its next synchronization undoes the collision response."

