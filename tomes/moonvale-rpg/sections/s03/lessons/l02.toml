[[lessons]]
id = "s03-l02"
title = "Turn Intent into Fair Motion"
teaches = ["normalized-input-motion"]
body = '''
<p>The <code>InputSnapshot.movement()</code> method introduced in Chapter II returns a pair: horizontal intent and vertical intent. Right contributes one, left subtracts one; down contributes one, up subtracts one. Opposites cancel. <code>Player.set_intent</code> feeds that pair into the existing <code>Vector2</code> with <code>direction.update(x, y)</code>, changing its components without replacing the owned object.</p>
<pre><code data-kind="runnable">import pygame

direction = pygame.Vector2(1, 1)
print(round(direction.length(), 3))
direction.normalize_ip()
print(round(direction.length(), 3))</code></pre>
<p>The first length is about <code>1.414</code>, the square root of two. Without correction, pressing right and down would move roughly forty-one percent faster than pressing right alone. <code>normalize_ip()</code> changes the vector in place to length one while preserving direction; the second line prints <code>1.0</code>. Only normalize when <code>length_squared() &gt; 1.0</code>. Normalizing a zero vector would have no direction to preserve, and the conditional also leaves single-axis unit intent unchanged.</p>
<p>Movement uses the Chapter II time contract: <code>delta = direction * speed * dt</code>. Read multiplication left to right: the unit direction chooses heading, pixels-per-second speed chooses rate, and elapsed seconds chooses this frame's distance. With speed 128 and <code>dt=0.5</code>, rightward intent produces a 64-pixel delta. The player's <code>move</code> method passes that delta and the walls list to collision resolution.</p>
<p>Input intent and actual displacement are deliberately separate. A player may intend to move right while a wall allows only part of the delta. Animation can still read direction to choose a facing state, while collision reports whether the path was blocked. Later combat reuses the exact direction and stats ownership, so do not rename <code>direction</code> to a screen-specific key.</p>
<p>A common failure is applying speed in both <code>set_intent</code> and <code>move</code>. That squares the rate and makes tuning impossible. The snapshot supplies dimensionless intent; the model applies speed and time exactly once.</p>
<div class="field-notes"><div class="fn-head">FIELD NOTES // LENGTH SQUARED</div><p><code>length_squared()</code> avoids a square root when only comparing magnitudes. The threshold one means diagonal input needs normalization; a zero or cardinal vector does not.</p></div>
'''

[[lessons.concepts]]
id = "normalized-input-motion"
purpose = "Convert the stable InputSnapshot into equal-speed cardinal or diagonal movement scaled once by per-second speed and Game dt."
anatomy = "Call snapshot.movement; update Player.direction; if its squared length exceeds one normalize in place; compute direction * speed * dt; send the delta to collision."
example = "The worked diagonal Vector2 changes from length 1.414 to length 1.0 after normalization."
observable = "Right and right-down intent cover the same distance per second, while opposite keys cancel to zero."
failure = "Skipping normalization makes diagonal travel faster; applying speed twice produces explosive motion; ignoring dt ties distance to frame rate."
practice = "s03-l02-e1"

[[lessons.artifactSteps]]
id = "s03-extend-input-movement"
path = "src/moonvale/input.py"
mode = "replace"
instruction = "In src/moonvale/input.py, replace the compact movement method with named horizontal and vertical calculations so each intent contribution stays observable."
find = '''
    def movement(self):
        return (int(self.right) - int(self.left), int(self.down) - int(self.up))
'''
content = '''
    def movement(self):
        horizontal = int(self.right) - int(self.left)
        vertical = int(self.down) - int(self.up)
        return (horizontal, vertical)
'''

[[lessons.readings]]
label = "PyGame Vector2 documentation: normalize_ip"
url = "https://pyga.me/docs/ref/math.html#pygame.math.Vector2.normalize_ip"

[[lessons.exercises]]
id = "s03-l02-e1"
type = "mc"
points = 15
prompt = "Why normalize direction (1, 1) before multiplying by speed and dt?"
choices = ["To convert it into a Rect", "To prevent diagonal movement from having a larger magnitude than cardinal movement", "To make dt an integer", "To change world coordinates into screen coordinates"]
answer = 1
whyWrong = "Normalization changes vector magnitude only; it does not create rectangles, convert time types, or apply camera transforms."
hint = "Compare the length of (1, 1) with the length of (1, 0)."
explain = "A unit direction makes speed mean the same pixels per second in every heading."

[[lessons.exercises]]
id = "s03-l02-e2"
type = "fill"
points = 20
prompt = "Complete the one place where rate and elapsed seconds turn intent into displacement."
code = 'delta = self.direction * self.____ * dt'
answer = "speed"
hint = "Use the Player attribute measured in pixels per second."
whyWrong = "TILE_SIZE describes geometry and TARGET_FPS is a cap; neither is the entity's travel rate."

[[lessons.exercises]]
id = "s03-l02-d1"
type = "type"
points = 12
reps = 2
prompt = "Retype the diagonal-only normalization guard."
code = '''
if self.direction.length_squared() > 1.0:
    self.direction.normalize_ip()
'''

[[lessons.exercises]]
id = "s03-l02-w1"
type = "write"
points = 30
prompt = "Set speed=128.0 and dt=0.5, use rightward unit direction 1.0, compute the delta, and print exactly DELTA 64.0."
starter = '''
speed = 128.0
dt = 0.5
direction_x = 1.0
'''
expect = '''
DELTA 64.0'''
solution = '''
speed = 128.0
dt = 0.5
direction_x = 1.0
delta_x = direction_x * speed * dt
print("DELTA", delta_x)
'''
hint = "Multiply the three starter values exactly once and print the result."

[[lessons.exercises]]
id = "s03-l02-e3"
type = "text"
points = 20
prompt = "Which exact earlier class supplies left, right, up, and down intent to Player.set_intent?"
answer = "InputSnapshot"
hint = "Reuse the frame-owned input boundary from Chapter II."
whyWrong = "A pygame Event is one raw observation; the stable normalized contract is the snapshot class."
