type = "mc"
points = 15
prompt = "Why does Player keep a Vector2 position as well as a Rect?"
choices = ["Vector2 stores precise subpixel motion while Rect provides integer collision bounds", "Rect cannot store width", "Vector2 opens the display", "Every PyGame class requires two shapes"]
answer = 0
whyWrong = "Rect does store size, Vector2 does not create displays, and PyGame has no two-shape rule; the split preserves precision and collision semantics."
hint = "Compare a movement step of 0.5 pixels with an integer rectangle coordinate."
explain = "The vector accumulates fractions, then the rectangle mirrors the rounded result for overlap tests."

