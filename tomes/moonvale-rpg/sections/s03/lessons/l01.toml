[[lessons]]
id = "s03-l01"
title = "Mark a Hero in World Space"
teaches = ["player-world-state"]
body = '''
<p>The player needs two related shapes. <code>pygame.Vector2</code> stores a precise two-dimensional position with floating-point <code>x</code> and <code>y</code> components. <code>pygame.Rect</code> stores an integer rectangle used for overlap tests and drawing. The vector is the authoritative <strong>world-space</strong> position; the rectangle is synchronized from it before collision. World space means coordinates in the game map, independent of a camera or monitor.</p>
<pre><code data-kind="runnable">import pygame

position = pygame.Vector2(32, 48)
position.x += 8.5
body = pygame.Rect(round(position.x), round(position.y), 32, 32)
print(position, body.topleft)</code></pre>
<p>The vector becomes <code>[40.5, 48]</code>, while the collision rectangle's top-left corner is <code>(40, 48)</code>. <code>round</code> converts a float to the nearest integer for the rectangle. If each frame discarded the fractional vector and moved only the rectangle by <code>int(speed * dt)</code>, small steps could round to zero and the player would stick. Keep precision in <code>position</code>, then synchronize the collision view.</p>
<p>The <code>Player</code> class owns <code>position</code>, <code>rect</code>, <code>direction</code>, <code>speed</code>, and a <code>stats</code> dictionary. The familiar key-value form keeps <code>health</code>, <code>max_health</code>, and later combat values under one owner. Health begins at ten. Callers may read those keys, but methods will control changes so inventory and combat cannot disagree about the lower and upper bounds.</p>
<p>The constructor imports <code>TILE_SIZE</code> from the canonical <code>settings.py</code> established in Chapter I. That one constant sizes both player and early walls. Reusing it avoids a hidden 31-pixel player colliding against 32-pixel tiles. A misspelled import raises <code>ImportError</code> or <code>ModuleNotFoundError</code>; read the last traceback line and compare the package path with the file tree.</p>
<p>For now, the visible player can be a solid rectangle drawn by PyGame. That is not generated art; it is a programmatic debug/fallback shape. Chapter V teaches the human asset-sourcing path and animation, while deterministic proof remains independent of decorative files.</p>
<div class="field-notes"><div class="fn-head">FIELD NOTES // ONE AUTHORITY</div><p>When two representations exist, name one authoritative. Here the float vector owns position and the rectangle mirrors it. Collision corrections update both, preventing slow drift between physics and pixels.</p></div>
'''

[[lessons.concepts]]
id = "player-world-state"
purpose = "Own the hero's precise world position, collision rectangle, direction, speed, and health in one stable Player model."
anatomy = "Construct Vector2 position; construct a TILE_SIZE Rect from rounded coordinates; store zero direction, per-second speed, and a stats dictionary; synchronize the rect after position changes."
example = "The worked vector moves by 8.5 pixels and then creates an integer rectangle at the rounded top-left location."
observable = "The probe prints a precise vector and the synchronized integer rect coordinates."
failure = "Using only an integer Rect loses subpixel motion; allowing vector and rect to become independent creates collision/drawing drift."
practice = "s03-l01-d1"

[[lessons.artifactSteps]]
id = "s03-add-player-entity"
path = "src/moonvale/entities.py"
mode = "write"
instruction = "Create src/moonvale/entities.py with the complete Player owner below; retain these attribute spellings for inventory, combat, save data, and animation."
content = '''
import pygame

from moonvale.collision import move_with_collisions
from moonvale.settings import TILE_SIZE


class Player:
    def __init__(self, x=32, y=32):
        self.position = pygame.Vector2(x, y)
        self.rect = pygame.Rect(round(x), round(y), TILE_SIZE, TILE_SIZE)
        self.direction = pygame.Vector2()
        self.speed = 128.0
        self.stats = {"health": 10, "max_health": 10, "power": 3}

    def sync_rect(self):
        self.rect.topleft = (round(self.position.x), round(self.position.y))

    def set_intent(self, snapshot):
        self.direction.update(snapshot.movement())
        if self.direction.length_squared() > 1.0:
            self.direction.normalize_ip()

    def move(self, dt, walls):
        delta = self.direction * self.speed * dt
        return move_with_collisions(self, delta, walls)
'''

