[[lessons.exercises]]
id = "s03-l01-w1"
type = "write"
points = 30
prompt = "Store x=32.0, add three steps of 0.5 in a loop, and print exactly POSITION 33.5. This practices keeping fractional position instead of truncating each step."
starter = '''
x = 32.0
step = 0.5
'''
expect = '''
POSITION 33.5'''
solution = '''
x = 32.0
step = 0.5
for _ in range(3):
    x += step
print("POSITION", x)
'''
hint = "Add the float step to the same x value three times before printing."

