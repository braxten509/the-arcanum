[freestyle]
title = "THE WORKING: Halt at the Eastern Wall"
brief = "Rowan chalks one temporary room so the hero's contract can be proven before the real map arrives.<ul><li>Preserve every s01 and s02 proof branch.</li><li>Add <code>--arcanum-proof s03</code>: create <code>Player(32, 32)</code>, a wall <code>pygame.Rect(96, 32, 32, 32)</code>, and <code>InputSnapshot(right=True)</code>.</li><li>Apply the snapshot, move with <code>dt=0.5</code>, and derive all receipt values from the resulting player and collision return.</li><li>Print exactly <code>S03_OK position=64,32 blocked=True hp=10</code>.</li></ul>"
requires = ["player-world-state", "normalized-input-motion", "axis-separated-rect-collision", "deterministic-game-loop", "python-data-and-branches"]
reward = 210
xray = "Rowan docks integer-only movement, unnormalized diagonals, hardcoded proof fields, combined-axis pushout, or a Rect correction not copied back to position. He rewards stable canonical names, one speed application, and evidence produced through Player.set_intent and Player.move."

[[freestyle.referenceSteps]]
id = "s03-reference-app-player-proof"
path = "src/moonvale/app.py"
mode = "rewrite"
preserves = "all-active"
instruction = "Replace app.py with this complete cumulative dispatcher, adding the real Player collision probe without changing earlier receipts or ordinary launch."
content = '''
import sys

import pygame

from moonvale.entities import Player
from moonvale.game import Game
from moonvale.input import InputSnapshot
from moonvale.model import WorkshopState
from moonvale.testing import FixedClock


def workshop_receipt():
    state = WorkshopState("MoonvaleRPG")
    for module_name in ["settings", "model", "app"]:
        state.add_module(module_name)
    return state.receipt()


def player_collision_receipt():
    player = Player(32, 32)
    wall = pygame.Rect(96, 32, 32, 32)
    player.set_intent(InputSnapshot(right=True))
    blocked = player.move(0.5, [wall])
    return (
        f"S03_OK position={player.rect.x},{player.rect.y} "
        f"blocked={blocked} hp={player.stats['health']}"
    )


def main(args=None):
    args = list(sys.argv[1:] if args is None else args)
    if args == ["--arcanum-proof", "s01"]:
        print(workshop_receipt())
        return 0
    if args == ["--arcanum-proof", "s02"]:
        game = Game(clock=FixedClock(16), event_source=lambda: [])
        receipt = game.run(frame_limit=3)
        print(
            f"S02_OK scene={receipt['scene']} frames={receipt['frames']} "
            f"quit={receipt['quit']}"
        )
        return 0
    if args == ["--arcanum-proof", "s03"]:
        print(player_collision_receipt())
        return 0
    return Game().run()
'''

