[[lessons]]
id = "s05-l01"
title = "Open a Sheet Without Trusting It"
teaches = ["optional-sprite-sheet-loader"]
body = '''
<p>A sprite sheet is one image containing several equal-size frames. Moonvale treats it as optional presentation: game rules must still work when the file is absent. <code>FrameLibrary.load_optional</code> therefore checks the path before calling <code>pygame.image.load</code>. If no valid file exists, it creates small in-memory debug surfaces and marks <code>uses_fallback=True</code>. Nothing is written as generated art.</p>
<p>When a sheet exists, the loader validates its dimensions before slicing. <code>subsurface</code> selects a rectangle from the sheet; <code>copy</code> gives that frame independent pixel storage. The taught layout uses four rows in south, west, east, north order and two columns per row. Each row becomes an idle state using its first frame and a walk state using both frames.</p>
<pre><code data-kind="runnable">rows = ["south", "west", "east", "north"]
states = []
for facing in rows:
    states.append(f"walk-{facing}")
print(states[2])</code></pre>
<p>The loop prints <code>walk-east</code>. An f-string inserts each facing into the stable state name. A likely failure is a sheet narrower than two <code>TILE_SIZE</code> frames or shorter than four rows. The loader raises <code>ValueError</code> with the required size rather than returning partial animation.</p>
<p>If you add optional art, use the sourcing guide attached to this lesson. Download from the actual creator page, place the file at <code>assets/sprites/player.png</code>, and update <code>assets/credits.md</code>. Do not save an image from search results without verifying its license. The code never assumes that optional path exists during proof.</p>
<p>Run the loader once during setup, not on every frame. Disk access and image decoding belong at the boundary; animation later selects already-loaded Surface objects. If an image fails to load, print the resolved path, check the extension and license ledger, then remove or replace the optional file while keeping the fallback available.</p>
<div class="field-notes"><div class="fn-head">FIELD NOTES // RULES OUTLIVE ART</div><p>Stable state names are behavior. Pixels are replaceable presentation. Keeping that boundary lets tests prove motion without redistributing an artist's work.</p></div>
'''

[[lessons.concepts]]
id = "optional-sprite-sheet-loader"
purpose = "Load and validate a licensed two-by-four player sheet when supplied while preserving deterministic in-memory fallback frames when it is absent."
anatomy = "Check the optional Path; load with pygame.image.load; validate width and height against TILE_SIZE; slice copied frames by row; otherwise build debug Surfaces; return states and a fallback flag."
example = "The worked loop derives the stable walk-east state name from the third facing row."
observable = "A valid sheet yields eight named state lists with uses_fallback False; no path yields the same state keys with uses_fallback True."
failure = "A too-small sheet raises ValueError, while an unlicensed or misplaced file should be removed so the explicit fallback is used."
practice = "s05-l01-e1"

[[lessons.artifactSteps]]
id = "s05-add-frame-library"
path = "src/moonvale/animation.py"
mode = "write"
instruction = "Create src/moonvale/animation.py with this complete optional loader and fallback; do not add any image file unless you personally follow the sourcing and credit steps."
content = '''
from pathlib import Path

import pygame

from moonvale.settings import TILE_SIZE


FACINGS = ("south", "west", "east", "north")


def _debug_frame(color):
    frame = pygame.Surface((TILE_SIZE, TILE_SIZE), pygame.SRCALPHA)
    frame.fill(color)
    return frame


class FrameLibrary:
    def __init__(self, states, uses_fallback):
        self.states = states
        self.uses_fallback = uses_fallback

    @classmethod
    def load_optional(cls, path=None):
        if path is None or not Path(path).is_file():
            states = {}
            for row, facing in enumerate(FACINGS):
                frames = [
                    _debug_frame((90 + row * 20, 130, 190)),
                    _debug_frame((120 + row * 20, 160, 220)),
                ]
                states[f"idle-{facing}"] = [frames[0]]
                states[f"walk-{facing}"] = frames
            return cls(states, True)

        sheet = pygame.image.load(str(path))
        required_size = (TILE_SIZE * 2, TILE_SIZE * len(FACINGS))
        if sheet.get_width() < required_size[0] or sheet.get_height() < required_size[1]:
            raise ValueError(f"player sheet must be at least {required_size}")
        states = {}
        for row, facing in enumerate(FACINGS):
            frames = [
                sheet.subsurface(
                    pygame.Rect(column * TILE_SIZE, row * TILE_SIZE, TILE_SIZE, TILE_SIZE)
                ).copy()
                for column in range(2)
            ]
            states[f"idle-{facing}"] = [frames[0]]
            states[f"walk-{facing}"] = frames
        return cls(states, False)
'''

