[[lessons]]
id = "s05-l03"
title = "Bind Pose to the Real Hero"
teaches = ["player-animation-adapter"]
body = '''
<p>The adapter is deliberately small: after <code>Player.set_intent(snapshot)</code>, pass <code>player.direction</code> to <code>Animator.select_motion</code>; during the same update, pass the Game loop's <code>dt</code> to <code>Animator.update</code>. The Animator observes movement but never changes Player.position, Rect, speed, or stats.</p>
<pre><code data-kind="runnable">from pygame import Vector2

direction = Vector2(1, 0)
facing = "east" if direction.x &gt; 0 else "west"
print("walk-" + facing)</code></pre>
<p>The probe prints <code>walk-east</code>. The comparison reads the signed x component already established by InputSnapshot. A common ordering bug updates animation before the current frame's input, causing one-frame-late states. Use input, movement/collision, animation, camera, then rendering inside the one lifecycle.</p>
<p>The Working proves integration without a display or optional sheet. It creates a real Player, applies <code>InputSnapshot(right=True)</code>, selects animation from that Player.direction, and advances by 0.15 seconds. The receipt reads the Animator's state and index and the FrameLibrary's fallback flag. No field is assigned merely to manufacture output.</p>
<p>When rendering, draw <code>animator.current_frame</code> at <code>camera.world_to_screen(player.rect)</code>. The frame is presentation; Player.rect remains the world-space destination and collision shape. If the pose points east but the hero moves north, print direction, facing, and state after input. If movement is correct but the frame never changes, print dt, elapsed, and frame_index.</p>
<p>Later combat will reuse facing and state names for attack and hurt animation. Retain the spelling <code>idle-*</code> and <code>walk-*</code>, and extend rather than replace the state owner. Deterministic fallback frames stay available for headless acceptance even after optional art is installed.</p>
<div class="field-notes"><div class="fn-head">FIELD NOTES // OBSERVE, DO NOT COMMAND</div><p>Animation mirrors domain state. It must not move the player or decide combat; that prevents visual timing from becoming a hidden game rule.</p></div>
'''

[[lessons.concepts]]
id = "player-animation-adapter"
purpose = "Connect the existing Player direction and Game dt to animation while keeping movement, collision, and presentation ownership separate."
anatomy = "Apply InputSnapshot to Player; select Animator motion from Player.direction; advance with the same dt; render current_frame at the camera-transformed Player.rect."
example = "The worked rightward Vector2 derives walk-east, matching the cumulative proof's real Player input path."
observable = "Right input plus 0.15 seconds yields walk-east frame 1 with the deterministic fallback."
failure = "Selecting before input lags one frame; letting animation mutate Player state makes visual rate affect gameplay."
practice = "s05-l03-e1"

[[lessons.artifactSteps]]
id = "s05-record-animation-contract"
path = "assets/credits.md"
mode = "append"
instruction = "Append this animation note to assets/credits.md so optional media placement and the deterministic fallback remain explicit."
content = '''

## Player animation

The canonical optional destination is `assets/sprites/player.png`.
If no licensed sheet is supplied, FrameLibrary uses in-memory debug surfaces.
Any supplied sheet must be recorded above with creator, source page, license, and attribution.
'''

[[lessons.readings]]
label = "PyGame Vector2 documentation"
url = "https://pyga.me/docs/ref/math.html#pygame.math.Vector2"

[[lessons.exercises]]
id = "s05-l03-e1"
type = "mc"
points = 15
prompt = "Which update ordering gives animation current input?"
choices = ["Animate, input, render", "Render, animate, input", "Input, move, animate, camera, render", "Camera, render, quit, input"]
answer = 2
whyWrong = "Other orders select stale intent or draw before state is updated; the established loop resolves rules before presentation."
hint = "The pose should reflect this frame's snapshot."
explain = "Input and domain updates precede camera projection and rendering."

[[lessons.exercises]]
id = "s05-l03-e2"
type = "fill"
points = 20
prompt = "Pass the canonical movement vector into state selection."
code = 'animator.select_motion(player.____)'
answer = "direction"
hint = "Reuse the Vector2 owned by Player."
whyWrong = "Player.rect is a position/shape, not signed movement intent."

[[lessons.exercises]]
id = "s05-l03-d1"
type = "type"
points = 12
reps = 2
prompt = "Retype the single-clock animation update."
code = 'animator.update(dt)'

[[lessons.exercises]]
id = "s05-l03-w1"
type = "write"
points = 30
prompt = "Given direction_x=1 and moving=True, derive facing and state and print exactly PLAYER state=walk-east."
expect = '''
PLAYER state=walk-east'''
solution = '''
direction_x = 1
moving = True
facing = "east" if direction_x > 0 else "west"
state = f"{'walk' if moving else 'idle'}-{facing}"
print("PLAYER", f"state={state}")
'''
hint = "Choose east from the positive x value, then build the state with an f-string."

[[lessons.exercises]]
id = "s05-l03-e3"
type = "text"
points = 20
prompt = "Which earlier class supplies the rightward Boolean used by this proof?"
answer = "InputSnapshot"
hint = "It is the frame-owned input boundary from Chapter II."
whyWrong = "Animator consumes the resulting direction; it does not read keyboard events itself."
