'''

[[lessons.exercises]]
id = "s05-l02-w1"
type = "write"
points = 30
prompt = "Starting frame=0 and elapsed=0.15, consume 0.10-second intervals for two frames and print exactly ANIM frame=1 remainder=0.05."
expect = '''
ANIM frame=1 remainder=0.05'''
solution = '''
frame = 0
elapsed = 0.15
while elapsed >= 0.10:
    elapsed -= 0.10
    frame = (frame + 1) % 2
print("ANIM", f"frame={frame}", f"remainder={elapsed:.2f}")
'''
hint = "Subtract inside a while loop, wrap with modulo, and format the remainder to two decimals."

