[freestyle]
title = "THE WORKING: Give the Eastward Step a Pulse"
brief = "Rowan asks the atlas to show motion without borrowing time or art.<ul><li>Preserve every s01-s04 proof and ordinary launch.</li><li>Construct a real Player and apply <code>InputSnapshot(right=True)</code>.</li><li>Load <code>FrameLibrary.load_optional()</code> with no media path, create Animator, and select motion from <code>player.direction</code>.</li><li>Advance the animator by exactly 0.15 seconds through its elapsed-time method.</li><li>Derive and print exactly <code>S05_OK state=walk-east frame=1 fallback=True</code>.</li></ul>"
requires = ["optional-sprite-sheet-loader", "elapsed-animation-state", "player-animation-adapter", "deterministic-game-loop", "player-world-state"]
reward = 240
xray = "Rowan docks required decorative art, a second Clock, frame-per-render advancement, direct assignment of proof state, or animation that changes Player geometry. He rewards explicit asset licensing, leftover-time preservation, stable state names, and evidence driven by real InputSnapshot and Player.direction."

[[freestyle.referenceSteps]]
id = "s05-reference-cumulative-animation-proof"
path = "src/moonvale/app.py"
mode = "rewrite"
preserves = "all-active"
instruction = "Replace app.py with this complete cumulative dispatcher, adding the real fallback animation receipt while retaining all prior proof branches and ordinary Game launch."
content = '''
import sys

import pygame

from moonvale.animation import Animator, FrameLibrary
from moonvale.camera import Camera
from moonvale.entities import Player
from moonvale.game import Game
from moonvale.input import InputSnapshot
from moonvale.model import WorkshopState
from moonvale.settings import TILE_SIZE
from moonvale.testing import FixedClock
from moonvale.world import World, asset_root


def workshop_receipt():
    state = WorkshopState("MoonvaleRPG")
    for module_name in ["settings", "model", "app"]:
        state.add_module(module_name)
    return state.receipt()


def player_collision_receipt():
    player = Player(32, 32)
    wall = pygame.Rect(96, 32, 32, 32)
    player.set_intent(InputSnapshot(right=True))
    blocked = player.move(0.5, [wall])
    return (
        f"S03_OK position={player.rect.x},{player.rect.y} "
        f"blocked={blocked} hp={player.stats['health']}"
    )


def world_receipt():
    world = World(asset_root() / "maps" / "moonvale.tmx")
    camera = Camera()
    target = pygame.Rect(1008, 32, TILE_SIZE, TILE_SIZE)
    camera.follow(target, world.pixel_size)
    return (
        f"S04_OK map={world.map_path.name} walls={len(world.walls)} "
        f"zones={len(world.zones)} "
        f"camera={round(camera.offset.x)},{round(camera.offset.y)}"
    )


def animation_receipt():
    player = Player()
    player.set_intent(InputSnapshot(right=True))
    library = FrameLibrary.load_optional()
    animator = Animator(library)
    animator.select_motion(player.direction)
    animator.update(0.15)
    return (
        f"S05_OK state={animator.state} frame={animator.frame_index} "
        f"fallback={library.uses_fallback}"
    )


def main(args=None):
    args = list(sys.argv[1:] if args is None else args)
    if args == ["--arcanum-proof", "s01"]:
        print(workshop_receipt())
        return 0
    if args == ["--arcanum-proof", "s02"]:
        game = Game(clock=FixedClock(16), event_source=lambda: [])
        receipt = game.run(frame_limit=3)
        print(
            f"S02_OK scene={receipt['scene']} frames={receipt['frames']} "
            f"quit={receipt['quit']}"
        )
        return 0
    if args == ["--arcanum-proof", "s03"]:
        print(player_collision_receipt())
        return 0
    if args == ["--arcanum-proof", "s04"]:
        print(world_receipt())
        return 0
    if args == ["--arcanum-proof", "s05"]:
        print(animation_receipt())
        return 0
    return Game().run()
'''

