id = "s05"
codename = "CHAPTER V // MAKE MOTION SPEAK"
short = "Make Motion Speak"
title = "Make Motion Speak"
build = "load sprite sheets safely, select idle/walk states and facing, advance animation by elapsed time, and keep deterministic fallback frames for headless validation."
brief = "Footsteps now need a readable pose. You will separate licensed presentation from deterministic state, choose idle or walk from the established Player.direction, and advance frames with the one Game-loop clock."

[proof]
mode = "run"
expectedFiles = ["main.py", "src/moonvale/animation.py", "src/moonvale/app.py"]
runArgs = ["--arcanum-proof", "s05"]
expect = "S05_OK state=walk-east frame=1 fallback=True"

[[assets]]
id = "optional-player-sheet"
kind = "sprite"
lesson = "s05-l01"
destination = "assets/sprites/player.png"
sourceGuidance = "Optionally choose a human-made top-down character sheet with at least two 32x32 frames per row, download it from its real asset page, rename it player.png, and place it at this exact destination. The deterministic fallback remains valid if you skip this optional art."
licenseGuidance = "Verify the license on the chosen asset page, follow its use and attribution terms, and record creator, source page, exact license, and required credit in assets/credits.md before shipping."
sources = [{ label = "Kenney Tiny Dungeon", url = "https://kenney.nl/assets/tiny-dungeon", license = "CC0 as stated on the asset page; still record the source in credits.md" }]
