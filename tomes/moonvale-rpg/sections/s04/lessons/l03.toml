answer = "return a transformed copy"
accept = ["transformed copy", "return a copy", "copy"]
hint = "Collision still needs the canonical world rectangle after drawing."
whyWrong = "Mutating Player.rect mixes screen and world coordinates and causes gameplay geometry to drift when the camera moves."

