[[lessons.exercises]]
id = "s04-l03-w1"
type = "write"
points = 30
prompt = "Set target_center_x=1024 and viewport_width=960, compute camera_x using integer half-width, and print exactly CAMERA x=544."
starter = '''
target_center_x = 1024
viewport_width = 960
'''
expect = '''
CAMERA x=544'''
solution = '''
target_center_x = 1024
viewport_width = 960
camera_x = target_center_x - viewport_width // 2
print("CAMERA", f"x={camera_x}")
'''
hint = "Subtract viewport_width // 2 from the target center, then label the result in an f-string."

[[lessons.exercises]]
id = "s04-l03-e4"
type = "mc"
points = 15
prompt = "Why calculate maximum_x with max(0, world_width - viewport_width)?"
choices = ["To double the world width", "To prevent a negative offset when the world is narrower than the viewport", "To convert pixels to tiles", "To change Player.speed"]
answer = 1
whyWrong = "The expression only protects the camera's upper bound; it does not rescale the map, convert units, or alter player motion."
hint = "Try subtracting a 960-pixel viewport from a 640-pixel world."
explain = "A small world has no positive scrolling range, so its maximum legal offset is zero."
