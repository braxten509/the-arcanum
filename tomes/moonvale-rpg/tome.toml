# ARCANUM tome manifest for The Moonvale Atlas.

[meta]
id = "moonvale-rpg"                       # MUST equal the folder name
name = "The Moonvale Atlas"
description = "Build and ship Moonvale RPG, a complete top-down PyGame adventure with a scrolling world, quests, inventory, combat, save data, tests, and a desktop package."
author = "The Arcanum Guild"
version = "0.1.0"
favicon = "☾"

[runtime]
name = "python"                # a global-configs/runtimes/<name>.toml id
project = "MoonvaleRPG"
language = "Python"           # display name, used in grader/oracle prompts
packages = false
externalWorkspace = true          # this course teaches a real local editor, terminal, Tiled, and packager
                                   # own external tools; the player chooses its location.
entryFile = "main.py"
projectFile = "pyproject.toml"
runLabel = "python3 main.py"
validationDependencies = ["pygame-ce", "pytmx", "pytest", "pyinstaller"]
# starterCode inherits from the complete Python runtime configuration.

[content]
sections = ["s01", "s02", "s03", "s04", "s05", "s06", "s07", "s08", "s09", "s10", "s11", "s12"]  # ordered section ids; each maps to sections/<id>/
capabilityLedger = true             # keep this: lessons declare `teaches`, capstones
                                    # declare cumulative `requires`; validator proves order
proofVersion = 1                    # future-tome contract: replay learner edits + run milestones
# OPTIONAL duel bank → generated/attacks.toml (the engine default). Do NOT hand-write it:
# author attacks_src.toml, then run  python3 tools/gen_attacks.py untitled-6

[acceptance]
version = 1
mode = "run"
artifact = "package"
runArgs = ["--arcanum-acceptance"]
scenarios = ["boot-title", "walk-and-collide", "scroll-tiled-world", "animate-player", "accept-village-quest", "collect-and-use-item", "win-seeded-encounter", "save-quit-and-resume", "navigate-scene-flow", "launch-packaged-rpg"]
controls = ["input", "clock", "seed", "frame-limit"]

[defaults]
theme = "signature"                # a [[themes]] id below (this tome's own default look)

[defaults.ai]
oracle = "llama3.1:8b"
grader = "qwen2.5:14b"
graderKind = "claude-cli"
graderModel = "claude-opus-4-8"

[progression]
attackTime = 180
attackStages = [0, 60, 120]
blackIceThreshold = 10
blackIcePerDiffCap = 2

[progression.earnedTheme]
id = "wisp-crown"
name = "WISP-CROWNED FOLIO"
desc = "A night-vellum atlas granted after ten proven spell-duel victories."

[economy]
# Fixed face value: 4,234 exercise credits + 3,050 Working rewards = 7,284.
# Repeatable hex/duel income is bonus only; the final 316-credit rise rewards mastery.
ranks = [
  [0, "UNMAPPED WANDERER"],
  [800, "LANTERN BEARER"],
  [1600, "ROAD SCRIBE"],
  [2400, "MOONVALE SCOUT"],
  [3200, "MAP KEEPER"],
  [4000, "QUEST WARDEN"],
  [4800, "WISP BREAKER"],
  [5600, "ATLAS MAKER"],
  [6400, "SILVER CARTOGRAPHER"],
  [7600, "STAR-CROWNED WAYFINDER"],
]
hintCost = 60
oracleCost = 35
attemptMultipliers = [1, 0.6, 0.3]
comboStep = 0.05
comboCap = 0.4
sRankMultiplier = 1.5
attackStakePerDiff = 18
attackWinPerDiff = 15

[narrative]
objective = "Build Moonvale RPG into a complete top-down adventure, prove its systems deterministically, and seal it as a launchable desktop package."
title = "ARCANUM // THE MOONVALE ATLAS"
logo = "MOONVALE ATLAS"
opsLabel = "MAP LEAVES"
graderPersona = "ROWAN VALE"
studentTerm = "wayfinder"
currency = "moonmark"
currencyShort = "mm"
gradeScale = "S|A|B|C|D|F"
bootLines = [
  "Unroll the atlas, wayfinder; Moonvale has blank roads where a game should be.",
  "I am Rowan Vale. I have shipped worlds, buried bugs, and kept the useful maps.",
  "This folio holds {N} map leaves, each ending in something you can run and observe.",
  "We begin with the real Python workshop: terminal, environment, packages, and tracebacks.",
  "Then one game wheel will carry every event, update, scene, and painted frame.",
  "Your hero will walk, collide, animate, speak, carry, fight, save, and return.",
  "Decorative art may change; deterministic evidence will not depend on it.",
  "When a trail vanishes, reproduce the last good step before guessing at the fog.",
  "The final seal belongs on a package that launches beyond this writing desk.",
  "Set your first compass point. We raise the workshop now.",
]
gradingLines = [
  "Rowan checks the compass against the observable trail...",
  "The atlas turns to the exact file named in the commission...",
  "A lantern passes over state changes and hidden assumptions...",
  "The mapmaker follows the run evidence before judging the ink...",
  "Rowan tests the boundary where the happy path leaves the road...",
  "The field notes are compared with Python's own conventions...",
  "The seal waits while every rubric weight finds its evidence...",
]
completeText = "THE ATLAS IS SEALED // Moonvale walks, remembers, and launches beyond the desk."

# --- the peddler's shop -------------------------------------------------------
# Every tome stocks these FIVE engine power-ups. The mechanic is fixed by `id`;
# reflavor name/desc/cost/ico to this course's world (validator requires all 5,
# each filled). oracle is an optional 6th (needs an [runtime] oracle model).
