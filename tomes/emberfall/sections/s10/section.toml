id = "s10"
codename = "FORGE X // THE GAME LOOP"
short = "Game Loop"
title = "The Game Loop"
build = "Bind HUD values and build menu, play, pause, and game-over states into one controllable game loop."
brief = "A world with a sword and a dialogue box is still a pile of parts, artificer. In this forge you give <code>Emberfall</code> one foreman: <code>GameStateManager</code>. It decides whether the game is in its main menu, being played, paused, or ended; the HUD reports the existing Health machine without owning it; and Canvas panels obey that single decision. These are real Unity Editor assemblies, not a console imitation. By the final hammer blow, the player can start a run, pause without letting physics advance, resume, die into a game-over screen, and return to the menu.<ul><li>Create one scene-level <code>GameStateManager</code> with the <code>GameState</code> enum values <code>MainMenu</code>, <code>Playing</code>, <code>Paused</code>, and <code>GameOver</code>; expose <code>CurrentState</code> with a private setter.</li><li>Give it explicit public transitions for starting, pausing, resuming, ending, and returning to the menu. Each transition must show only its intended Canvas panel and set <code>Time.timeScale</code> correctly.</li><li>Build a HUD whose Health text subscribes to the existing <code>HealthChanged</code> event in <code>OnEnable</code>, unsubscribes in <code>OnDisable</code>, and immediately shows the current HP.</li><li>Wire Main Menu, Pause, and Game Over buttons in the Inspector to the manager's public methods. A pause input may call <code>TogglePause()</code> only while a run is playing or paused.</li><li>In Play mode prove the whole chain: menu first, Start enters play, HP changes redraw the HUD, Pause freezes scaled movement/coroutines, Resume restores them, death opens Game Over, and Return To Menu restores normal time.</li></ul>"
