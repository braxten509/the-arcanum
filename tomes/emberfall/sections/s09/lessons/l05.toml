[[lessons.exercises]]
id = "s09-l05-w1"
type = "write"
points = 35
prompt = "Model the one-time quest reward guard in plain C#. QuestLog already has SetFlag and HasFlag. Write GrantRustKey(QuestLog questLog, ref int keys): if keeper_spoken_to is not set, increment keys once and set that flag; otherwise do nothing. Call it twice and compute exactly:\nRUST KEYS 1\nSPOKEN True"
starter = '''using System.Collections.Generic;

// Implement QuestLog and GrantRustKey. The second call must not add another key.
// Define QuestLog below the top-level calls.

'''
expect = '''RUST KEYS 1
SPOKEN True'''
solution = '''QuestLog questLog = new QuestLog();
int keys = 0;
GrantRustKey(questLog, ref keys);
GrantRustKey(questLog, ref keys);
Console.WriteLine($"RUST KEYS {keys}");
Console.WriteLine($"SPOKEN {questLog.HasFlag("keeper_spoken_to")}");

static void GrantRustKey(QuestLog questLog, ref int keys)
{
    if (questLog.HasFlag("keeper_spoken_to")) return;
    keys++;
    questLog.SetFlag("keeper_spoken_to");
}

class QuestLog
{
    private Dictionary<string, bool> flags = new Dictionary<string, bool>();
    public void SetFlag(string flagId) { flags[flagId] = true; }
    public bool HasFlag(string flagId)
    {
        return flags.TryGetValue(flagId, out bool isSet) && isSet;
    }
}'''
hint = "Use HasFlag as an early return before incrementing. The first call adds the key and writes the flag; the second sees the flag and exits."
