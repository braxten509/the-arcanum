id = "s09-l05-e3"
type = "fill"
points = 24
prompt = "Fill the QuestLog call that records the keeper's completed opening conversation."
code = '''questLog.____("keeper_spoken_to");'''
answer = "SetFlag"
hint = "Use the public verb that writes completion, not the question method that only reads it."

