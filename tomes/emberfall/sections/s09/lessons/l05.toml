[[lessons.exercises]]
id = "s09-l05-e1"
type = "mc"
points = 22
prompt = "Which component should own the flag keeper_spoken_to after the keeper's opening conversation finishes?"
choices = ["DialoguePanel, because it draws the words", "ItemDefinition, because every quest is an item asset", "Rigidbody2D, because it saw the player approach", "QuestLog, because it owns runtime quest facts keyed by stable ids"]
answer = 3
whyWrong = "DialoguePanel owns display, ItemDefinition is shared authored item data, and Rigidbody2D owns motion. A completion flag is mutable world state, so QuestLog's dictionary is its proper ledger."
hint = "Ask which object already owns Dictionary<string, bool> and the safe HasFlag question."
explain = "QuestLog centralizes completion state so later NPCs and rules can ask the same source of truth."

[[lessons.exercises]]
id = "s09-l05-e2"
type = "text"
points = 19
prompt = "What DialogueController property may another script read to decide whether an interact press should advance an active conversation?"
answer = "IsOpen"
hint = "It is the public boolean property whose setter remains private to DialogueController."

