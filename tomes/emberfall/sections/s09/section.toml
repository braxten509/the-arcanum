id = "s09"
codename = "FORGE IX // VOICES IN THE DARK"
short = "Dialogue"
title = "Voices in the Dark"
build = "Create a Canvas UI, an NPC interaction, dialogue text, and simple quest flags that react to the player."
brief = "<p>Steel and loot make a world solid, artificer. They do not make it inhabited. This forge gives <code>Emberfall</code> a voice: a real Canvas panel, a wary keeper who can be approached, lines that advance one at a time, and a quest flag that remembers the promise after the panel closes. You will keep the jobs separate—UI displays, an NPC offers interaction, a controller owns the current line, and a quest ledger owns facts.</p><p>This is external Unity work. The plain-C# benches test string, list, and dictionary decisions; they cannot pretend to render a Canvas or receive a scene trigger. Wire those pieces in the Unity Editor, then prove them in Play mode.</p>"
