id = "s08"
codename = "FORGE VIII // VAULTS & LOOT"
short = "Loot Data"
title = "Vaults & Loot"
build = "Use ScriptableObjects and C# collections to data-drive items, enemy stats, and Emberfall's inventory."
brief = "<p>A chest is not a list of numbers nailed separately onto every scene object, artificer. That is how a small game becomes a junkyard of mismatched copies. This forge separates <strong>what an item is</strong> from <strong>which items the player currently carries</strong>. You will mint reusable ScriptableObject assets for potions, keys, weapons, and enemy archetypes; index their stable ids; then give ArtificerRig an inventory that stacks, picks up, and consumes a healing draught.</p><p>This is real Unity work in your external <code>Emberfall</code> project. The plain-C# benches rehearse collection decisions only; the ScriptableObject assets, Inspector references, trigger pickup, and Play-mode proof are forged in the Unity Editor.</p>"
