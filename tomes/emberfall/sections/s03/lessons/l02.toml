[[lessons.exercises]]
id = "s03-l02-e5"
type = "fill"
points = 20
prompt = "Fill in the missing action from the Inspector — the one that strips a single capability off a GameObject without touching any of its other components."
code = '''Right-click a component's header and choose ____ Component, and the GameObject
loses exactly that ability and nothing else — the rest keep working untouched.'''
answer = "Remove"
hint = "It's the mirror image of Add Component, named earlier in this same lesson."

[[lessons.exercises]]
id = "s03-l02-w1"
type = "write"
points = 30
prompt = "Model a GameObject's component list in plain C#: a class Rig with a public string Name and a public List<string> Components (initialized empty in a constructor Rig(string name)). Build a Rig named \"ArtificerRig\", then in order Add \"Transform\", \"SpriteRenderer\", \"BoxCollider2D\" to Components. Write a method AttachedCount() on Rig returning Components.Count. Print, exactly:\nArtificerRig has 3 components\n1. Transform\n2. SpriteRenderer\n3. BoxCollider2D"
starter = '''
// Build the ArtificerRig and its component list below, then define class Rig
// at the BOTTOM of the file (top-level statements must come first).

'''
expect = '''
ArtificerRig has 3 components
1. Transform
2. SpriteRenderer
3. BoxCollider2D'''
solution = '''
Rig rig = new Rig("ArtificerRig");
rig.Components.Add("Transform");
rig.Components.Add("SpriteRenderer");
rig.Components.Add("BoxCollider2D");

Console.WriteLine($"{rig.Name} has {rig.AttachedCount()} components");
int number = 1;
foreach (string component in rig.Components)
{
    Console.WriteLine($"{number}. {component}");
    number++;
}

class Rig
{
    public string Name;
    public List<string> Components;

    public Rig(string name)
    {
        this.Name = name;
        Components = new List<string>();
    }

    public int AttachedCount()
    {
        return Components.Count;
    }
}
'''
hint = "This is the same numbered foreach pattern PrintInventory used in chapter II — count with an int you increment each pass, starting at 1."
