[[lessons]]
id = "s03-l05"
title = "The MonoBehaviour Lifecycle — Order Is a Promise"
body = '''
<p>A MonoBehaviour never runs top to bottom the way <code>Program.cs</code> did. Instead, Unity calls a fixed set of specially-named methods on it at specific moments — you never call them yourself, and you don't get to choose the order, because Unity already chose it, and every script in the project depends on that choice staying consistent. Getting this order into your head now is the single highest-value fact in this entire forge: chase, attack, and physics bugs later in the course trace back to it more than any other cause.</p>
<pre><code><span class="k">using</span> UnityEngine;

<span class="k">public</span> <span class="k">class</span> ArtificerRig : MonoBehaviour
{
    <span class="k">void</span> Awake()  { Debug.Log(<span class="s">"AWAKE"</span>); }
    <span class="k">void</span> OnEnable() { Debug.Log(<span class="s">"ENABLE"</span>); }
    <span class="k">void</span> Start()  { Debug.Log(<span class="s">"START"</span>); }
    <span class="k">void</span> Update() { Debug.Log(<span class="s">"UPDATE"</span>); }
    <span class="k">void</span> LateUpdate() { Debug.Log(<span class="s">"LATE"</span>); }
}</code></pre>
<p>On the frame this GameObject first exists, Unity calls these once each, strictly in this order: <strong>Awake</strong> — the earliest hook, before anything else on this object has necessarily finished setting up, good for "prepare my own state" work that must not depend on another script yet. Then <strong>OnEnable</strong> — fires here on first activation, and again every later time the GameObject or component is re-enabled after being switched off. Then <strong>Start</strong> — called once, but critically, only after every object already in the scene has finished its own Awake, which is why "look up another GameObject's component" work belongs in Start, never Awake — the other object might not have run Awake yet if you reach for it too early.</p>
<p>After that one-time setup, every single frame repeats a different order for as long as the object stays enabled: <strong>FixedUpdate</strong> runs zero or more times per frame on a fixed physics timestep (you will use it for movement once Rigidbody2D enters the course), then <strong>Update</strong> runs exactly once — the default home for ordinary per-frame game logic — and finally <strong>LateUpdate</strong> runs once, after every script's Update has already finished, which is why camera-follow logic belongs there: it needs the player to have already moved this frame before it decides where to look.</p>
<pre><code>Frame 1:   Awake → OnEnable → Start → FixedUpdate(0+) → Update → LateUpdate
Frame 2+:                             FixedUpdate(0+) → Update → LateUpdate</code></pre>
<div class="callout">Awake and OnEnable run per-OBJECT the instant that object exists or is enabled — they do not wait for every other GameObject in the scene. Start is the one that waits for every Awake in the scene to finish first. Confusing "runs once" with "runs first, before anyone else's Awake" is the exact trap that breaks a lookup written in the wrong method.</div>
<div class="field-notes"><div class="fn-head">FIELD NOTES // UPDATE VS. COROUTINE, A CHOICE COMING SOON</div>
<p>Update fires every frame no matter what — even when nothing has changed and there is genuinely nothing to do this frame, which is why a "wait three seconds, then do X" behavior written naively inside Update turns into a manually-tracked timer field, checked and decremented on every single call. A later forge introduces coroutines specifically for waiting-and-resuming logic that doesn't belong crammed into a once-per-frame check — for now, just notice that Update being unconditional, every frame, forever, is a cost as much as a convenience.</p></div>
'''

[[lessons.readings]]
label = "MANDATORY // Unity Manual: Event function execution order"
url = "https://docs.unity3d.com/Manual/execution-order.html"
essential = true

