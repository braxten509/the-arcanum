id = "s03"
codename = "FORGE III // ANATOMY OF A SCENE"
short = "Scene Anatomy"
title = "Anatomy of a Scene"
build = "Compose GameObjects and Components, then read the MonoBehaviour lifecycle in a real Unity scene."
brief = "Every Emberfall system you will ever build — a walking Artificer, a chasing enemy, a dialogue box — is the same two ingredients wearing different clothes: a <strong>GameObject</strong> holding a bag of <strong>Components</strong>. Console.WriteLine and try/catch built your instincts for the language; this forge turns you loose on the real Unity Editor, where the Hierarchy replaces Program.cs and a script is one component among several, not the whole program. You will build an empty GameObject, hang a Transform and a script on it, expose a field to the Inspector without breaking encapsulation, and read the exact order Unity calls your code in every single frame — the #1 fact that separates artificers who ship from artificers debugging a race condition at 2am. By the end you turn your first GameObject into a reusable Prefab and prove, in the Console, that you understand the machine's heartbeat."
