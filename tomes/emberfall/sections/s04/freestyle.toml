[freestyle]
title = "THE GREAT WORKING: PAINTED WORLD"
brief = "ArtificerRig can log his own heartbeat, but Forge III left him standing in a gray void. Give him a body and a floor, in the real Emberfall project — no simulation, no shortcuts.<ul><li>In Project Settings &gt; Tags and Layers &gt; Sorting Layers, create <code>Ground</code> and <code>Characters</code>, then order them exactly top-to-bottom as <code>Ground</code>, <code>Characters</code>. Unity renders lower entries later, so Characters must be BELOW Ground for the artificer to appear in front.</li><li>Create the course's self-contained placeholder art through <code>Assets &gt; Create &gt; 2D &gt; Sprites &gt; Square</code>: duplicate and rename it <code>KessBody</code>, <code>GroundTile</code>, and <code>WallTile</code>. Tint them distinctly in their renderers or Tile assets; no downloaded art is required.</li><li>Add a SpriteRenderer to the ArtificerRig GameObject from Forge III. Assign KessBody, then set its Sorting Layer to <code>Characters</code>, Order in Layer <code>0</code>.</li><li>Create ONE Grid GameObject named exactly <code>Overworld</code>. Under it, create a Tilemap child named exactly <code>Floor</code> (Sorting Layer <code>Ground</code>, Order in Layer <code>0</code>) and a second Tilemap child named exactly <code>Walls</code> (Sorting Layer <code>Ground</code>, Order in Layer <code>1</code>).</li><li>Build a Tile Palette from GroundTile and WallTile. Paint Floor solid across an area at least 8 cells wide by 8 cells tall, with no gaps. Paint at least 6 Walls tiles somewhere on top of that painted Floor area.</li><li>Set Main Camera's Projection to Orthographic. Choose and record an orthographicSize (must be 3 or greater), and position the camera so the ENTIRE painted 8x8 area is visible in the Game view with Play pressed.</li><li>Move ArtificerRig's Transform so it sits on a painted Floor cell inside the 8x8 area, visually on top of the floor and not overlapping a Walls tile.</li><li>Save the scene as <code>Assets/Scenes/Overworld.unity</code>. Write <code>Assets/WORLD-LOG.md</code> recording: the Sorting Layers list in exact top-to-bottom order, the Floor and Walls tile counts and renderer settings, ArtificerRig's SpriteRenderer settings, and the camera's orthographicSize plus position.</li></ul>Every value in WORLD-LOG.md must match what is actually configured in the scene — a log describing a scene that doesn't match the real Inspector values earns no credit for that line."
reward = 240
packages = []
xray = "The Worldwright docks the tally for: Characters left above Ground in the Sorting Layers list (the invisible-artificer bug this forge named twice), a Floor/Walls pair sharing one Tilemap instead of two separate children under one Grid, a painted area under 8x8 or with visible gaps, an orthographicSize so small the painted area doesn't fully fit the Game view, ArtificerRig positioned outside the painted floor or overlapping a Walls cell, an unsaved Overworld scene, and a WORLD-LOG.md whose recorded values don't match the Inspector. He grants favor for a Grid/Tilemap hierarchy that mirrors the lesson's exact structure (Overworld > Floor, Walls), distinct descriptive placeholder assets, and a WORLD-LOG.md that reads as an honest inspection rather than a copy of the brief."

[freestyle.badge]
id = "badge-s04"
name = "MAP PAINTER"
desc = "Gave ArtificerRig a body, painted Emberfall's first walkable ground, and proved the whole Sorting Layer stack holds together where the camera can see it."

[[freestyle.rubric]]
criterion = "Sprite & sorting on ArtificerRig"
weight = 20
desc = "ArtificerRig carries a SpriteRenderer with an assigned Sprite, on Characters; Characters is below Ground in the Sorting Layers list so it renders later and stays visible."

[[freestyle.rubric]]
criterion = "Tilemap overworld built correctly"
weight = 30
desc = "One Grid GameObject named Overworld parents two separate Tilemap children, Floor and Walls, each with a Tilemap Renderer on Sorting Layer Ground; Floor is Order in Layer 0 and Walls is Order in Layer 1; Floor is painted solid across at least an 8x8 area with no gaps and Walls has at least 6 tiles painted on top of it."

[[freestyle.rubric]]
criterion = "Camera frames the scene"
weight = 20
desc = "Main Camera is Orthographic with orthographicSize 3 or greater, positioned so the full painted 8x8 area is visible in the Game view with Play running, and ArtificerRig's Transform sits inside that area on a Floor cell, not overlapping a Walls cell."

[[freestyle.rubric]]
criterion = "WORLD-LOG.md accuracy"
weight = 15
desc = "Assets/WORLD-LOG.md truthfully records the Sorting Layers list order, Floor/Walls tile counts and their Sorting Layer + Order in Layer values, ArtificerRig's SpriteRenderer settings, and the camera's orthographicSize and position, matching the actual configured scene."

[[freestyle.rubric]]
criterion = "Clean style"
weight = 15
desc = "Follows Microsoft's C# naming conventions carried into Unity's own asset-naming idiom: PascalCase GameObject and Prefab names (Overworld, Floor, Walls, ArtificerRig), descriptive Sprite and Tile Palette asset names rather than defaults like New Tile, and a WORLD-LOG.md organized under clear headers rather than one unbroken paragraph."
