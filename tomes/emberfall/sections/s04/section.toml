id = "s04"
codename = "FORGE IV // PAINTING THE WORLD"
short = "World Painting"
title = "Painting the World"
build = "Import sprites, place a 2D camera, and paint Emberfall's walkable tilemap overworld."
brief = "ArtificerRig can log its own heartbeat now — Awake, Start, Update, every frame accounted for — but drop it into Play mode and there is nothing to look at: a bare Transform in an empty gray void. This forge gives Emberfall a body a player can actually see. You will import a real image and hang it off a <strong>SpriteRenderer</strong>, the drawing component every visible thing in a 2D Unity game wears; learn how Unity decides what draws in front of what when nothing has real depth; point an <strong>orthographic camera</strong> at the result so the Game view shows something besides gray; and then stop placing GameObjects one at a time entirely — a <strong>Tilemap</strong> lets you paint a whole walkable floor the way you'd paint a wall, one brush stroke covering hundreds of cells that would otherwise be hundreds of GameObjects choking the Hierarchy. By the end, ArtificerRig stands on ground you painted, inside a camera frame you configured, and the void has a floor."
