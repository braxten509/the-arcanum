type = "fill"
points = 22
prompt = "Fill in the missing word describing where in the Sorting Layers list a layer draws relative to everything below it."
code = '''Project Settings, Tags and Layers, Sorting Layers
  Ground       (top of list) = drawn BEHIND
  Characters   (bottom of list) = drawn in ____'''
answer = "FRONT"
hint = "It's the direct opposite of BEHIND, already spelled out on the very next line of this same sketch."

[[lessons.exercises]]
id = "s04-l02-e5"
type = "type"
points = 12
reps = 2
prompt = "Retype this same-layer Order in Layer sketch exactly."
code = '''Same Sorting Layer ("Ground"), different Order in Layer:
  Walls   Order in Layer: 1   (drawn on top)
  Floor   Order in Layer: 0   (drawn behind)'''

[[lessons.exercises]]
id = "s04-l02-w1"
type = "write"
points = 30
prompt = "Model Unity's two-rule priority in plain C#: ListIndex 0 is the top and higher indices are rendered later/in front. DrawsInFrontOf compares higher ListIndex first, then higher OrderInLayer when both objects share a Layer. Build Ground at 0, Characters at 1, ArtificerRig on Characters and Floor on Ground. Print exactly:\nArtificerRig in front of Floor: True"
starter = '''
// Build the two Layers and two Drawables, then print the DrawsInFrontOf result.
// Define classes Layer and Drawable at the BOTTOM of the file.

'''
expect = '''
ArtificerRig in front of Floor: True'''
solution = '''
Layer ground = new Layer("Ground", 0);
Layer characters = new Layer("Characters", 1);
Drawable artificerRig = new Drawable("ArtificerRig", characters, 0);
Drawable floor = new Drawable("Floor", ground, 0);

Console.WriteLine($"ArtificerRig in front of Floor: {artificerRig.DrawsInFrontOf(floor)}");

class Layer
{
    public string Name;
    public int ListIndex;

    public Layer(string name, int listIndex)
    {
        Name = name;
        ListIndex = listIndex;
    }
}

class Drawable
{
    public string Name;
    public Layer OnLayer;
    public int OrderInLayer;

    public Drawable(string name, Layer onLayer, int orderInLayer)
    {
        Name = name;
        OnLayer = onLayer;
        OrderInLayer = orderInLayer;
    }

    public bool DrawsInFrontOf(Drawable other)
    {
        if (OnLayer == other.OnLayer)
        {
            return OrderInLayer > other.OrderInLayer;
        }
        return OnLayer.ListIndex > other.OnLayer.ListIndex;
    }
}
'''
hint = "Higher ListIndex means lower in the list and rendered later, so it appears in front; only compare OrderInLayer when both share a Layer."
