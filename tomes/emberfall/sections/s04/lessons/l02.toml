[[lessons]]
id = "s04-l02"
title = "Sorting Layers & Order in Layer — Draw Order Without Depth"
body = '''
<p>A top-down 2D scene has no real depth the way a 3D one does — the floor, the walls, and ArtificerRig can all sit at the exact same Z position, so Unity needs a different rule to decide which SpriteRenderer paints over which. It uses two Inspector fields on every SpriteRenderer: <strong>Sorting Layer</strong>, a named bucket you define once in <code>Project Settings &gt; Tags and Layers &gt; Sorting Layers</code>, and <strong>Order in Layer</strong>, a plain integer that breaks ties inside one bucket.</p>
<p>The Sorting Layers list itself is the first rule, and its direction is easy to get backwards: Unity renders the list <strong>top to bottom</strong>, so a layer nearer the <strong>bottom</strong> is rendered later and appears <strong>in front of</strong> a layer above it. Order in Layer cannot overturn that cross-layer order.</p>
<pre><code>Project Settings &gt; Tags and Layers &gt; Sorting Layers
  Ground       ← top of list = drawn first, BEHIND
  Characters   ← bottom of list = drawn later, in FRONT</code></pre>
<p>Order in Layer only matters for two SpriteRenderers sharing the SAME Sorting Layer — there, Unity renders sublayers in numerical order, so a lower number draws behind a higher one. A Floor tilemap on Order 0 and a Walls tilemap on Order 1, both on the "Ground" layer, means Walls always paints over Floor even where they overlap — without either of them needing to know the other exists.</p>
<pre><code>Same Sorting Layer ("Ground"), different Order in Layer:
  Walls   Order in Layer: 1   ← drawn on top
  Floor   Order in Layer: 0   ← drawn behind</code></pre>
<p>Put the two rules together and the priority is unambiguous: Sorting Layer decides the bucket first, Order in Layer only settles ties within that same bucket — a SpriteRenderer with a sky-high Order in Layer number still loses to any SpriteRenderer sitting in a Sorting Layer positioned below it in the list.</p>
<div class="callout">For Emberfall, place <code>Ground</code> above <code>Characters</code> in the list. If Characters is above Ground, the floor is rendered later and can hide the player.</div>
<div class="field-notes"><div class="fn-head">FIELD NOTES // THE "Default" LAYER EVERYTHING STARTS ON</div>
<p>Every SpriteRenderer you have added so far — including ArtificerRig's from the last lesson — started on the built-in "Default" Sorting Layer, because that is what a brand-new project ships with and nothing you have done yet has changed it. Two SpriteRenderers both left on "Default" fall back entirely to Order in Layer to settle their draw order, both starting at 0 — which is why two overlapping default sprites can render in an order that looks arbitrary until you check their Order in Layer numbers directly; nothing about creation order or Hierarchy position affects 2D draw order at all.</p></div>
'''

[[lessons.readings]]
label = "MANDATORY // Unity Manual: Sorting layers in 2D"
url = "https://docs.unity3d.com/Manual/2d-renderer-sorting.html"

[[lessons.readings]]
label = "OPTIONAL // Unity Manual: Sprite Renderer component reference"
url = "https://docs.unity3d.com/Manual/sprite/renderer/sprite-renderer-reference.html"

[[lessons.exercises]]
id = "s04-l02-e1"
type = "mc"
points = 20
prompt = "Characters is below Ground in the Sorting Layers list. ArtificerRig uses Characters and Floor uses Ground. What happens visually?"
choices = ["ArtificerRig draws in front of Floor, because Characters is rendered later", "Floor draws in front of ArtificerRig, because Ground is above Characters", "They render identically regardless of list order", "Unity throws a compile-time error"]
answer = 0
whyWrong = "List position, not creation recency, is what this lesson said decides front-vs-back — a newer layer left at the bottom does NOT automatically win; there is no scenario here where identical custom layer names render identically when their LIST POSITIONS differ, that's the entire mechanism being tested; and Sorting Layer is a plain Inspector dropdown, not something the compiler enforces at all — nothing here can produce a compile error."
hint = "The callout named this exact mistake — a layer left at the bottom of the list after being created. Which layer is higher, Ground or the newly-added Characters?"
explain = "Unity renders the list top to bottom, so Characters is rendered after Ground and ArtificerRig appears in front."

[[lessons.exercises]]
id = "s04-l02-e2"
type = "mc"
points = 20
prompt = "Floor and Walls are both on the Sorting Layer \"Ground\". Floor has Order in Layer 0; Walls has Order in Layer 1. Why does Walls draw on top of Floor wherever the two overlap?"
choices = ["Order in Layer only matters when two SpriteRenderers share the same Sorting Layer, and within that shared layer a higher number draws on top of a lower one", "Walls was added to the Hierarchy after Floor, and Hierarchy order alone decides 2D draw order", "Order in Layer numbers are compared globally across every Sorting Layer in the project, not just within one", "A GameObject named \"Walls\" alphabetically outranks one named \"Floor\" in Unity's default sort"]
answer = 0
whyWrong = "Hierarchy position has no bearing on 2D draw order at all — the field notes were explicit that neither creation order nor Hierarchy position factors in, only Sorting Layer and Order in Layer do; Order in Layer numbers are compared WITHIN a shared Sorting Layer, not globally across every layer in the project, which is exactly why Sorting Layer is checked first; and Unity's 2D sorting has no alphabetical fallback on GameObject names whatsoever."
hint = "This lesson said Order in Layer only breaks ties between SpriteRenderers sharing the exact same Sorting Layer — Floor and Walls share which one?"
explain = "Both are on \"Ground\", so their shared Sorting Layer no longer decides anything between them — it falls to Order in Layer, where the higher value (Walls at 1) draws over the lower one (Floor at 0)."

[[lessons.exercises]]
id = "s04-l02-e3"
type = "text"
points = 18
prompt = "A fresh SpriteRenderer, never touched in the Inspector, ships on which built-in Sorting Layer by default?"
answer = "Default"
hint = "The field notes named this exact built-in layer as the one every new project starts with and nothing has changed yet."

[[lessons.exercises]]
