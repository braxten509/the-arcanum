[freestyle]
title = "THE GREAT WORKING: BLOOD & STEEL"
brief = "The diorama is over, artificer. In the real <code>Emberfall</code> Unity project, forge the first two-sided combat loop. Attach scripts, wire Inspector references, press Play, and prove both bodies can hurt and react.<ul><li>Create the complete <code>Health.cs</code> taught in this forge on ArtificerRig: private Inspector maxHP; CurrentHP and MaxHP readers; Awake initialization; clamped TakeDamage, Heal, and Restore; IsDead; and HealthChanged invoked after every sanctioned change.</li><li>A separate listener must subscribe in OnEnable, unsubscribe in OnDisable, and visibly log or display received HP; Health must not know the listener.</li><li>Create a goblin prefab with Rigidbody2D, collider/layer discipline, its own Health, and EnemyController. Assign ArtificerRig's Transform. Use exact Idle, Chase, and Attack states; the attack coroutine calls player Health.TakeDamage at visible intervals.</li><li>Add an <code>AttackPoint</code> child to ArtificerRig and attach the taught <code>SwordSwing</code>. Put the goblin on an Enemy layer, assign enemyLayers, and call BeginSwing once from Space's wasPressedThisFrame. OverlapCircleAll must find goblin Health and deal damage through TakeDamage.</li><li>Add an EnemyDeath listener that disables or destroys the goblin when its Health reaches zero. It subscribes and unsubscribes with the same lifecycle discipline as the player readout.</li><li>In Play mode demonstrate Idle, Chase, Attack, two separated player HealthChanged observations, at least two spaced player swings, and goblin defeat. Neither Health may display below zero.</li></ul>"
reward = 320
xray = "The Worldwright docks points for a goblin that edits CurrentHP directly, a timer that freezes the scene, an Attack state that restarts its coroutine every physics tick, or a listener left subscribed after OnDisable. He looks for assigned Inspector references, HealthChanged after the clamped value, and the exact Idle/Chase/Attack trail. Craft credit: PascalCase types, methods, properties, and enum members; camelCase private fields and parameters; four-space indentation and Allman braces."
packages = []

[freestyle.badge]
id = "badge-s07"
name = "STEELHEART"
desc = "Forged the first enemy that can chase, strike, and be heard."

[[freestyle.rubric]]
criterion = "Health Boundary & Signal"
weight = 20
desc = "ArtificerRig has Health: Awake initializes CurrentHP, TakeDamage clamps 0..maxHP, IsDead is correct, and a separate listener receives HealthChanged after changes without Health hard-referencing it."

[[freestyle.rubric]]
criterion = "Enemy State Machine & Physics Chase"
weight = 20
desc = "A Play-mode goblin with Rigidbody2D uses exact Idle, Chase, Attack states, has its target assigned, chases with Rigidbody2D movement, and attacks at or within attackRange."

[[freestyle.rubric]]
criterion = "Timed Damage Is Real"
weight = 20
desc = "Attack fetches Health and calls TakeDamage rather than editing HP. IEnumerator with WaitForSeconds and a recovery guard creates separated repeat damage, not damage every FixedUpdate or a frozen scene."

[[freestyle.rubric]]
criterion = "Player Strike & Enemy Defeat"
weight = 20
desc = "Space begins one guarded SwordSwing, the assigned AttackPoint and Enemy LayerMask find goblin Health, repeated spaced hits lower it through TakeDamage, and an event listener removes the defeated goblin."

[[freestyle.rubric]]
criterion = "C# Craft & Scene Proof"
weight = 20
desc = "Uses PascalCase for types, methods, properties, enum members; camelCase for private fields and parameters; consistent four-space indentation and Allman braces. Scene proof shows both damage directions, Idle/Chase/Attack, and non-negative HP."
