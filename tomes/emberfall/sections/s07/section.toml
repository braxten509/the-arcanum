id = "s07"
codename = "FORGE VII // BLOOD & STEEL"
short = "Combat"
title = "Blood & Steel"
build = "Build health, damage, events, timed attacks, and a state-machine enemy that can chase and strike."
brief = "\"A world you can only walk through is a diorama,\" the Worldwright says, \"not a game.\" Every forge since the fourth has made Emberfall more solid to look at and stand in — but nothing in it has ever fought back, and nothing in it can be hurt. This forge changes both. HitPoints stops being a plain number the Worldwright showed you back in Forge II and becomes a real component with a floor at zero and a door it opens for other systems to hear through — a C# event, so a health bar or a death screen can react to a hit without Health ever needing to know they exist. IEnumerator and yield teach a script to wait without freezing the whole game around it. And an enum walks a goblin through three minds — Idle, Chase, Attack — the same state-machine shape that will later run menus and pause screens too. By the end, the artificer can be struck, can strike back, and Emberfall has its first real enemy: one that notices him, closes the distance, and hits."
