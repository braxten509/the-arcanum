id = "s11"
codename = "FORGE XI // SEALING THE EMBER"
short = "Release"
title = "Sealing the Ember"
build = "Save and load progress as JSON, add final audio and polish, then export the standalone Emberfall build."
brief = "The last fault is always the one that ruins the journey, artificer. This forge gives <code>Emberfall</code> a memory on disk, sound with a proper owner, a final inspection pass, and a standalone build a player can launch without the Editor. These are real Unity operations in your external workspace—not a console simulation.<ul><li>Define a small serializable save record for player position, current HP, inventory item ids, and quest flags; serialize it with <code>JsonUtility</code>.</li><li>Write and read one JSON file beneath <code>Application.persistentDataPath</code>, handling a missing or broken file without crashing the game.</li><li>Wire a scene-level audio owner with assigned AudioSource references, then call it from existing player, combat, and UI events without scattering sound logic through every script.</li><li>Polish the playable loop: check references, pause/menu behavior, readable HUD and dialogue, and save/load in Play mode.</li><li>Use Build Profiles to make a desktop standalone build, launch that build outside Unity, and prove new-game, save, quit, relaunch, and load.</li></ul>"
