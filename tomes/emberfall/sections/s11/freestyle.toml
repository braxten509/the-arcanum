[freestyle]
title = "THE GREAT WORKING: THE EMBER SEALED"
brief = "No more loose nails, artificer. Finish the real Unity <code>Emberfall</code> workspace and place a playable build in another pair of hands.<ul><li>Create a <code>[System.Serializable]</code> <code>SaveData</code> record with <code>playerX</code>, <code>playerY</code>, <code>currentHP</code>, <code>List&lt;string&gt; inventoryItemIds</code>, and <code>List&lt;string&gt; questFlags</code>. Create a scene-level <code>SaveManager</code> that uses <code>JsonUtility</code> and exactly one JSON file under <code>Application.persistentDataPath</code>.</li><li>Expose public <code>SaveGame()</code> and <code>LoadGame()</code> methods. Save current player position, Health HP, inventory ids, and quest flags; load all four through their existing system boundaries. A missing or malformed file must warn and preserve a usable current/new session rather than crash.</li><li>Create a scene-level <code>AudioManager</code> with Inspector-assigned music/effects AudioSources and clips. Make actual gameplay/UI events request at least a pickup effect, a damage effect, and a button-click effect; do not poll audio in Update or create a source per event.</li><li>Perform a Play-mode release pass: MainMenu → play, tile collision/movement, dialogue, pickup, damage plus HUD update, pause/resume, save, alter state, and load. Fix missing serialized references and Console errors you encounter.</li><li>In Build Profiles configure a desktop standalone including the opening Emberfall scene, set product name <code>Emberfall</code> and a visible version, build outside Assets, then launch the generated executable outside Unity. Prove a clean start and a save → quit → relaunch → load route where position, HP, inventory, and quest flag return.</li></ul>"
reward = 450
packages = []
xray = "The Worldwright reads the save file and watches the built executable, not a heroic Editor screenshot. He docks saving GameObjects or UI references instead of stable values, a path under Assets, missing-file crashes, load code that bypasses Health or inventory boundaries, and audio scattered through Update. He also docks a green build that was never launched. Craft credit requires PascalCase types, methods, properties, and public fields; camelCase private fields and parameters; four-space indentation; Allman braces; and small owner-focused methods."

[freestyle.badge]
id = "badge-s11"
name = "EMBER SEALED"
desc = "Shipped Emberfall as a tested, persistent standalone game."

[[freestyle.rubric]]
criterion = "Durable Save Contract"
weight = 25
desc = "SaveData is serializable with the exact required position, HP, inventory-id, and quest-flag fields; SaveManager writes and reads one JsonUtility JSON file beneath Application.persistentDataPath, never scene objects or Assets paths."

[[freestyle.rubric]]
criterion = "Safe Restore Through Owners"
weight = 20
desc = "SaveGame and LoadGame restore position, Health, inventory, and quest state through the existing systems; missing or malformed files log a useful warning and leave a playable session rather than crashing or silently corrupting state."

[[freestyle.rubric]]
criterion = "Audio & Release Polish"
weight = 15
desc = "A scene-level AudioManager owns Inspector-assigned music/effects sources and clips; gameplay/UI requests pickup, damage, and button sounds through it, while the demonstrated loop has assigned references, readable UI, collision, dialogue, HUD updates, and correct pause/resume behavior."

[[freestyle.rubric]]
criterion = "Standalone Proof"
weight = 25
desc = "Build Profiles includes the opening Emberfall scene and produces a desktop build outside Assets with visible product/version settings; the executable is launched outside Unity and visibly proves clean start plus save, quit, relaunch, and load restoring all four saved facts."

[[freestyle.rubric]]
criterion = "C# Craft"
weight = 15
desc = "Uses PascalCase types, methods, properties, and public fields; camelCase private fields and parameters; consistent four-space indentation; Allman braces; and small methods with clear single owners for save, audio, and UI work."
