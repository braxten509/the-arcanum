[freestyle]
title = "THE GREAT WORKING: THE EMBER SEALED"
brief = "No more loose nails, artificer. Finish the real Unity <code>Emberfall</code> workspace and place a playable build in another pair of hands.<ul><li>Create the taught <code>[System.Serializable]</code> SaveData plus the exact Inventory and QuestLog snapshot/restoration methods. Attach the canonical scene-level SaveManager, assign all five owner references, and use one JSON file under <code>Application.persistentDataPath</code>.</li><li>Wire public <code>SaveGame()</code> and <code>LoadGame()</code> to UI Buttons. Save current player position, Health HP, inventory ids, and quest flags; load all four through their owners. A missing or malformed file must preserve a usable session rather than crash.</li><li>Record or create the three taught placeholder clips, import them into Assets/Audio, and assign one effects AudioSource plus pickup, damage, and button clips to AudioManager. Make those three real events request their named sounds; do not poll audio in Update or create a source per event. Music is optional.</li><li>Perform a Play-mode release pass: MainMenu → play, tile collision/movement, dialogue, pickup, damage plus HUD update, pause/resume, save, alter state, and load. Fix missing serialized references and Console errors you encounter.</li><li>In Build Profiles configure a desktop standalone including <code>Overworld.unity</code> as the opening scene, set product name <code>Emberfall</code> and version <code>0.1.0</code>, build outside Assets, then launch the executable outside Unity. Prove both a clean start and a save → quit → relaunch → load route where position, HP, inventory, and quest flag return.</li></ul>"
reward = 450
packages = []
xray = "The Worldwright reads the save file and watches the built executable, not a heroic Editor screenshot. He docks saving GameObjects or UI references instead of stable values, a path under Assets, missing-file crashes, load code that bypasses Health or inventory boundaries, and audio scattered through Update. He also docks a green build that was never launched. Craft credit requires PascalCase types, methods, properties, and public fields; camelCase private fields and parameters; four-space indentation; Allman braces; and small owner-focused methods."

[freestyle.badge]
id = "badge-s11"
name = "EMBER SEALED"
desc = "Shipped Emberfall as a tested, persistent standalone game."

[[freestyle.rubric]]
criterion = "Durable Save Contract"
weight = 25
desc = "SaveData is serializable with the exact required position, HP, inventory-id, and quest-flag fields; SaveManager writes and reads one JsonUtility JSON file beneath Application.persistentDataPath, never scene objects or Assets paths."

[[freestyle.rubric]]
criterion = "Safe Restore Through Owners"
weight = 20
desc = "SaveGame and LoadGame restore position, Health, inventory, and quest state through the existing systems; missing or malformed files log a useful warning and leave a playable session rather than crashing or silently corrupting state."

[[freestyle.rubric]]
criterion = "Audio & Release Polish"
weight = 15
desc = "A scene-level AudioManager owns one Inspector-assigned effects source and the three imported placeholder clips; gameplay/UI requests pickup, damage, and button sounds through named methods, while the demonstrated loop has readable UI, collision, dialogue, HUD updates, and correct pause/resume behavior."

[[freestyle.rubric]]
criterion = "Standalone Proof"
weight = 25
desc = "Build Profiles includes the opening Emberfall scene and produces a desktop build outside Assets with visible product/version settings; the executable is launched outside Unity and visibly proves clean start plus save, quit, relaunch, and load restoring all four saved facts."

[[freestyle.rubric]]
criterion = "C# Craft"
weight = 15
desc = "Uses PascalCase types, methods, properties, and public fields; camelCase private fields and parameters; consistent four-space indentation; Allman braces; and small methods with clear single owners for save, audio, and UI work."
