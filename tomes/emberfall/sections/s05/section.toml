id = "s05"
codename = "FORGE V // BREATH OF MOTION"
short = "Motion"
title = "Breath of Motion"
build = "Read input, move with Rigidbody2D at the right clock, and animate Emberfall's player."
brief = "Emberfall now has a body and a floor — ArtificerRig stands on painted ground inside a framed camera — but it stands there like a puppet with its strings cut: press a key and nothing happens. This forge gives the artificer motion. You will read the keyboard through Unity's <strong>Input System</strong> package rather than polling raw hardware yourself; learn why moving a Transform straight off <strong>Time.deltaTime</strong> in Update is an honest first draft but the wrong final answer once physics enters the picture; put real movement in <strong>FixedUpdate</strong>, the physics clock chapter III's lifecycle lesson named but never used; and drive an <strong>Animator</strong> so a walk cycle plays exactly when — and only when — ArtificerRig is actually moving. By the end, a key press becomes a step, and the floor you painted last forge finally has feet on it."
