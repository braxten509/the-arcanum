id = "s06"
codename = "FORGE VI // WALLS & TRIGGERS"
short = "Collision"
title = "Walls & Triggers"
build = "Make walls solid and pickups, doors, and hazards responsive with Collider2D triggers and layers."
brief = "\"A wall you can walk through isn't a wall,\" the Worldwright says, \"it's a rumor.\" Forge IV painted Walls tiles that LOOK solid and left them exactly that — a promise, deferred on purpose, to this forge. Emberfall's overworld stops being a picture and starts being a place: Collider2D gives shapes something to hit, isTrigger forks that into solid-versus-sensor, Tags tell a script WHAT it hit, Layers tell the physics engine WHETHER to even check, and OnTriggerEnter2D turns an overlap into code. By the end, ArtificerRig stops at a wall he used to walk through, collects a pickup that vanishes the instant he touches it, and opens a door that never re-triggers — three different responses to the same collision event, and the artificer now decides which."
