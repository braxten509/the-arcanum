codename = "FORGE II // THE SHAPE OF CODE"
short = "Code Shape"
title = "The Shape of Code"
build = "Model Emberfall's rules and data in plain C# before binding them to Unity objects."
brief = "The Worldwright sets the console proofs aside and picks up a blueprint: a program that only prints in a straight line cannot run a game. Before a scene exists you learn to branch, repeat, bundle facts into objects, and hold a growing pile of them — the shape every later Emberfall system gets cast from."
