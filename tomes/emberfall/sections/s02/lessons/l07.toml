[[lessons.exercises]]
id = "s02-l07-w1"
type = "write"
points = 35
prompt = "Given List&lt;string&gt; donations containing \"50\", \"12\", \"oops\", \"8\" in that order, loop over it and for each entry try int.Parse inside a try/catch: on success print DONATION followed by the parsed value then OK, and add it to a running total; on FormatException print DONATION followed by the raw text then SKIPPED. After the loop print TOTAL DONATIONS followed by the sum (must be 70, computed from the three valid entries)."
starter = '''
List<string> donations = new List<string>() { "50", "12", "oops", "8" };
int total = 0;
// foreach donation: try int.Parse, print OK and add to total, or catch FormatException and print SKIPPED.

'''
expect = '''
DONATION 50 OK
DONATION 12 OK
DONATION oops SKIPPED
DONATION 8 OK
TOTAL DONATIONS 70'''
solution = '''
List<string> donations = new List<string>() { "50", "12", "oops", "8" };
int total = 0;
foreach (string raw in donations)
{
    try
    {
        int amount = int.Parse(raw);
        Console.WriteLine($"DONATION {amount} OK");
        total += amount;
    }
    catch (FormatException)
    {
        Console.WriteLine($"DONATION {raw} SKIPPED");
    }
}
Console.WriteLine($"TOTAL DONATIONS {total}");
'''
hint = "Put the int.Parse and the total += inside the try block together — if Parse throws, total += never runs for that entry, which is exactly what you want."
