[freestyle]
title = "THE GREAT WORKING: FIRST SPARK"
brief = "The Worldwright doesn't grade blueprints — he grades a machine that runs. Install Unity 6.3 LTS with desktop build support. Under one course parent, create separate Console and Unity folders. In Console, raise the cold anvil into Emberfall's first real artifact: a <code>dotnet</code> console project that proves C# is alive on your machine before a single Unity scene exists.<ul><li>Scaffold it for real with <code>dotnet new console -n Emberfall</code>, so <code>Program.cs</code> and <code>Emberfall.csproj</code> exist in the folder you chose</li><li>Declare an artificer's starting stats as variables: a <code>string</code> name holding <code>\"Kess\"</code>, an <code>int</code> level holding <code>1</code>, and an <code>int</code> hitPoints holding <code>20</code></li><li>Write a local function that takes hitPoints and level as parameters and returns a formatted readout string built with string interpolation, in the exact shape <code>HP 20 LVL 1</code></li><li>Print the artificer's name on its own line, then the formatted readout on the next line — exactly:<br><code>Kess</code><br><code>HP 20 LVL 1</code></li><li>Prove it with <code>dotnet run</code> — the Worldwright reads what the console actually prints, not a screenshot of the Editor</li></ul>In Hub, also create Unity/Emberfall from the 2D template and open it once with a clean Console; later forges use that project, never the console folder."
reward = 150
packages = []
xray = "The Worldwright strikes gold from the tally for: a project that doesn't build (a missing .csproj, a typo the compiler never saw fixed), hardcoding the readout string instead of computing it with real variables and interpolation, an artificer name or stats that don't match the commission, and output that doesn't match the required lines exactly (extra blank lines, wrong casing, a missing HP/LVL word). He grants favor for a local function with a clean single-return body, camelCase locals paired with a PascalCase function name, and Allman braces held consistently."

[freestyle.badge]
id = "badge-s01"
name = "FIRST SPARK"
desc = "The first C# proof burns cleanly — variables, a method, and a readout the console can prove."

[[freestyle.rubric]]
criterion = "Compiles & runs"
weight = 30
desc = "dotnet run succeeds from a clean checkout with no manual fixes; the project is a real dotnet new console scaffold (Program.cs + Emberfall.csproj present)."

[[freestyle.rubric]]
criterion = "Meets the brief"
weight = 35
desc = "The three artificer stats exist as real typed variables (not hardcoded into the print calls), a local function builds the readout string via interpolation from hitPoints and level, and the two required lines print in the exact order and wording: Kess then HP 20 LVL 1."

[[freestyle.rubric]]
criterion = "Real computation, not a printed literal"
weight = 15
desc = "The readout string is genuinely built from the hitPoints and level variables through interpolation — a Console.WriteLine that just prints the literal text \"HP 20 LVL 1\" with no variables behind it does not satisfy this."

[[freestyle.rubric]]
criterion = "Clean style"
weight = 20
desc = "Follows Microsoft's C# naming conventions: camelCase locals and parameters (hitPoints, level), PascalCase for the local function's name, Allman braces (opening brace on its own line), and a semicolon-terminated statement style consistent throughout — no dead or commented-out code left in the file."
