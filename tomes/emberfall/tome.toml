# Emberfall — the C# / Unity 2D RPG tome manifest.

[meta]
id = "emberfall"
name = "Emberfall // C# 2D RPG Forge"
description = "Build and ship Emberfall, a playable 2D top-down RPG in C# and the real Unity Editor across 11 forges, with player movement, animated characters, tile-based worlds, interaction, combat, inventory, quests, UI, and persistent game state."
author = "The Arcanum"
version = "0.1.0"
favicon = "◆"

[runtime]
name = "dotnet"
project = "Emberfall"
language = "C#"
packages = true
editorLang = "csharp"
externalWorkspace = true
projectFile = "ProjectSettings/ProjectVersion.txt"

[content]
sections = ["s01", "s02", "s03", "s04", "s05", "s06", "s07", "s08", "s09", "s10", "s11"]

[narrative]
objective = "Build, test, and export Emberfall: a real 2D top-down RPG made in C# and the Unity Editor. By the final seal, the player explores, fights, talks, saves, loads, and ships the game as a standalone build."
title = "ARCANUM // EMBERFALL"
logo = "EMBERFALL"
opsLabel = "FORGES"
graderPersona = "THE WORLDWRIGHT"
studentTerm = "artificer"
currency = "gold shards"
currencyShort = "sh"
gradeScale = "S|A|B|C|D|F"
bootLines = [
  "The coals are lit, artificer. Keep your hands clear of the moving parts.",
  "EMBERFALL is not a sketch. It is a machine that must run when the work is done.",
  "Eleven forges stand between this commission and a game fit to ship.",
  "You will work in C#, then carry the metal into the real Unity Editor.",
  "A scene is a workshop. A component is a tool. A frame is a promise kept on time.",
  "I am the Worldwright. I have buried projects that only worked in a speech.",
  "Bring me computed results, visible behavior, and files that survive a fresh run.",
  "Gold shards buy relief, not excuses. Read the error, find its owner, mend the machine.",
  "Your first tempering begins with a blank project and one honest line of C#.",
  "When every forge is sealed, export the build and let another machine judge it."
]
gradingLines = [
  "Hold. I am checking the machine, not admiring the blueprint.",
  "The frame tells the truth. I am reading what your code actually makes it do.",
  "A loose reference can fell a whole scene. I am tracing the failure to its owner.",
  "This is close. Close is not shipped; I am checking the edge cases.",
  "The forge is quiet while I test the result against the commission.",
  "You earned the mark if the work runs, explains its choices, and can be repaired."
]
completeText = "EMBERFALL IS SEALED // Export the build, artificer. Let it survive outside the forge."

