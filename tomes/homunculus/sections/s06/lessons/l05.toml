[[lessons]]
id = "s06-l05"
teaches = ["controlled-sweep"]
title = "Change One Cause at a Time"
body = '''
<p>Do not launch a large hyperparameter sweep because the first answer felt imperfect. First run the complete gate. If the adapter has no broad voice gain but preserves capability, choose one plausible lever: more authentic data, rank, learning rate, or training duration. If it regresses capability or memorizes, choose a conservative lever such as better curation, lower rank, or lower learning rate. Data defects are not repaired by knob searches.</p>
<p>A controlled comparison changes one declared variable while keeping the base id, data hashes, split, tokenizer, seed, sequence length, sampling, and evaluation suite fixed. For example, compare <code>bind-001</code> at rank 16 with <code>bind-r8-001</code> at rank 8; do not also change learning rate and corpus. The two manifests are the proof that only the intended field differs.</p>
<pre><code>comparison = {
    "control": "bind-001",
    "candidate": "bind-r8-001",
    "changed": {"rank": [16, 8]},
    "fixed_hashes": ["train", "eval", "suite", "base"],
}</code></pre>
<p>Run the same dry gate, full training, paired evaluation, blind rubric, and regression suite. Compare category-level results, critical failures, evaluation loss, and memory—not just a single average. Stop when a candidate passes the predefined product gate. Endless tuning against one held-out suite gradually overfits the evaluation itself; if you make many decisions from it, reserve a final untouched acceptance suite.</p>
<p>Elapsed time is measured, never promised. Store every abandoned run and its reason in the run manifest so the next retraining cycle does not repeat failed experiments. A failed candidate does not replace the last known-good adapter.</p>
<div class="field-notes"><div class="fn-head">FIELD NOTES // EXPERIMENTS NEED ONE DELTA</div>
<p>Record the parent run and the single intended change before launching a rebind. If rank, learning rate, corpus, and sequence length all move together, a better score cannot teach you which lever mattered. One-delta trials may feel slower, but they build a reusable map of this model, dataset, and card instead of a pile of anecdotes.</p></div>
'''

[[lessons.readings]]
label = "Hugging Face hyperparameter search concepts"
url = "https://huggingface.co/docs/transformers/v5.13.0/hpo_train"

[[lessons.exercises]]
id = "s06-l05-e2"
type = "text"
points = 15
prompt = "What artifact proves all supposedly fixed inputs remained fixed?"
answer = "the run manifests"
accept = ["run manifests", "manifest hashes", "the manifests"]
hint = "They record config and input hashes for each run."

[[lessons.exercises]]
id = "s06-l05-e3"
type = "fill"
points = 20
prompt = "Complete the rule for a candidate that fails the product gate."
code = "failed_candidate_replaces_known_good = ____"
answer = "False"
accept = ["false", "False"]
hint = "A comparison does not automatically become production."

[[lessons.exercises]]
id = "s06-l05-e1"
type = "mc"
points = 20
prompt = "Why change only one intended variable?"
choices = [
  "Because PEFT supports only one field",
  "Because JSON cannot store two changes",
  "To avoid evaluation",
  "So an observed difference has an attributable cause",
]
answer = 3
whyWrong = "The libraries permit multiple changes; the constraint exists for inference, not syntax."
explain = "Controlled comparisons turn results into knowledge rather than just another score."
hint = "Ask which change caused the outcome."

[[lessons.exercises]]
id = "s06-l05-e4"
type = "write"
points = 35
prompt = "List changed configuration keys and print exactly: CHANGED rank"
starter = '''control = {"rank": 16, "lr": 1e-4, "max_length": 1024}
candidate = {"rank": 8, "lr": 1e-4, "max_length": 1024}

changed = []
print("CHANGED " + ", ".join(changed))
'''
solution = '''control = {"rank": 16, "lr": 1e-4, "max_length": 1024}
candidate = {"rank": 8, "lr": 1e-4, "max_length": 1024}

changed = [key for key in control if control[key] != candidate[key]]
print("CHANGED " + ", ".join(changed))
'''
expect = "CHANGED rank"
hint = "Keep keys whose values differ between the two dicts."
