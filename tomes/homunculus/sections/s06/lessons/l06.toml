[[lessons]]
id = "s06-l06"
teaches = ["merge-gate"]
title = "Issue a Merge Permit, Not a Vibe"
body = '''
<p>Write the acceptance thresholds before revealing the adapted scores. The course's starting gate is: zero privacy or memorization criticals; zero missing prompt ids; mean voice improvement of at least 0.5 on the 0–2 scale across at least three categories; mean correctness and usefulness may each decline by no more than 0.2; no more than one newly failed noncritical capability case out of at least fifteen; and a finite held-out evaluation loss. These are defaults you may tighten for your own work. If you change them after seeing results, document why and treat the decision as exploratory.</p>
<p>Create <code>reports/evaluation-decision.md</code> with a table containing every gate, threshold, observed value, evidence path, and pass/fail. End with exactly one verdict: <code>MERGE</code>, <code>REBIND</code>, or <code>STOP</code>. <code>MERGE</code> identifies the adapter manifest hash authorized for Section IX. <code>REBIND</code> names one causal hypothesis and one controlled change. <code>STOP</code> is for critical privacy, provenance, or data-integrity failures that require returning to curation.</p>
<p>A passing average cannot overrule a critical failure. Likewise, an adapter that sounds more personal but gets requested formats wrong is not useful. Read the raw paired responses after unblinding and add at least three representative wins and every regression by id. Keep the frozen base outputs in the report; they remain the comparison for later quantization and serving.</p>
<pre><code>decision = {
    "verdict": "MERGE",
    "adapter_manifest_sha256": "...",
    "suite_sha256": "...",
    "critical_failures": [],
}</code></pre>
<p>Section IX must refuse to merge an adapter whose manifest hash is absent from this permit. That small contract prevents “final-v2” directory names from silently choosing the wrong bind.</p>
<div class="field-notes"><div class="fn-head">FIELD NOTES // SOME FAILURES ARE VETOES</div>
<p>Average scores can conceal a memorized private string, a broken output contract, or a severe new capability failure. The merge permit should therefore contain both thresholds and vetoes. It is a signed decision artifact—not a celebratory note—and it must identify the exact adapter, suite, policy, evaluator, and raw reports it authorized.</p></div>
'''

[[lessons.readings]]
label = "Hugging Face model evaluation overview"
url = "https://huggingface.co/docs/evaluate/index"

[[lessons.exercises]]
id = "s06-l06-e1"
type = "mc"
points = 20
prompt = "Which event overrides a strong average score?"
choices = ["A privacy or memorization critical failure", "One response uses bullets", "The adapter directory is small", "Training used one epoch"]
answer = 0
whyWrong = "Formatting preferences and training size matter only through predefined criteria; critical exposure blocks the artifact."
explain = "Some defects are categorical release blockers."
hint = "A secret cannot be averaged away."

[[lessons.exercises]]
id = "s06-l06-e4"
type = "write"
points = 35
prompt = "Apply the critical and voice gates and print exactly: VERDICT MERGE"
starter = '''critical_failures = 0
voice_gain = 0.7
minimum_voice_gain = 0.5

verdict = "STOP"
print(f"VERDICT {verdict}")
'''
solution = '''critical_failures = 0
voice_gain = 0.7
minimum_voice_gain = 0.5

if critical_failures:
    verdict = "STOP"
elif voice_gain >= minimum_voice_gain:
    verdict = "MERGE"
else:
    verdict = "REBIND"
print(f"VERDICT {verdict}")
'''
expect = "VERDICT MERGE"
hint = "Critical failures stop; otherwise compare voice gain with its minimum."

[[lessons.exercises]]
id = "s06-l06-e3"
type = "fill"
points = 20
prompt = "Complete the required minimum mean voice improvement on the 0–2 scale."
code = "minimum_voice_gain = ____"
answer = "0.5"
hint = "It is half a rubric point."

[[lessons.exercises]]
id = "s06-l06-e2"
type = "text"
points = 15
prompt = "Which verdict authorizes sealing?"
answer = "MERGE"
accept = ["merge"]
hint = "It is one of three exact verdict words."

[[lessons.exercises]]
id = "s06-l06-e5"
type = "mc"
points = 20
prompt = "A contributor withdraws consent for a note that appears in the training lineage. What must happen before any affected adapter can be shipped?"
choices = [
  "Delete only the public receipt because hashes prove the text is gone",
  "Rename the adapter and keep serving it",
  "Quarantine the affected release, trace every derivative, remove the source, and rebuild or document why a derivative is unaffected",
  "Lower the evaluation threshold",
]
answer = 2
whyWrong = "A receipt edit, rename, or scoring change does not propagate a deletion through derived data and model artifacts."
explain = "The lifecycle contract follows consent changes through source, curated rows, evaluation copies, indexes, adapters, and releases."
hint = "Recall the deletion-propagation map from curation."
