prompt = "Fill the missing argument in the <code>generate</code> call from the lesson — the one that controls how many new tokens the model produces beyond the input prompt, which must be identical across the adapted and base runs to avoid confounding the comparison."
code = '''from peft import PeftModel
from transformers import AutoModelForCausalLM, AutoTokenizer

base = AutoModelForCausalLM.from_pretrained(
    "your-base-id", device_map="auto", torch_dtype=torch.bfloat16
)
tokenizer = AutoTokenizer.from_pretrained("your-base-id")
adapted = PeftModel.from_pretrained(base, "./my-adapter")

inputs = tokenizer("Explain your note-taking style.", return_tensors="pt").to("cuda")
