[[lessons.exercises]]
id = "s06-l01-e1"
type = "type"
points = 12
reps = 2
code = '''from peft import PeftModel
from transformers import AutoModelForCausalLM, AutoTokenizer

# Load the frozen base (no adapter) for the baseline:
base = AutoModelForCausalLM.from_pretrained(
    "your-base-id", device_map="auto", torch_dtype=torch.bfloat16
)
tokenizer = AutoTokenizer.from_pretrained("your-base-id")

# Load the adapted model (base + adapter) for the test:
adapted = PeftModel.from_pretrained(base, "./my-adapter")

# Generate on each held-out prompt — identical parameters for both:
for prompt in held_out_prompts:
    inputs = tokenizer(prompt, return_tensors="pt").to("cuda")
    base_out = tokenizer.decode(base.generate(**inputs, max_new_tokens=128)[0])
    adapt_out = tokenizer.decode(adapted.generate(**inputs, max_new_tokens=128)[0])
    # save prompt, base_out, adapt_out as a comparison row'''

[[lessons.exercises]]
id = "s06-l01-e2"
type = "mc"
points = 20
prompt = "Per this rite, why must the evaluation prompts never appear in the training set — not even in a reworded form?"
choices = [
  "The tokenizer caches training-set tokens in GPU memory, and reusing them during evaluation would cause an out-of-memory error from duplicate token IDs",
  "Any prompt the model has seen during training — even reworded — measures memorization of that specific record rather than whether the bind learned the artificer's general style pattern; the held-out mirror only reflects generalization when the prompt is genuinely unseen in any form the training set covers",
  "The SFTTrainer from the fifth rite permanently locks the model's output format to the training templates, so held-out prompts with different phrasing would cause the model to refuse generation entirely",
  "Evaluation on seen prompts is actually fine — the model needs to prove it absorbed the exact records it was trained on, and any output that differs from the training answer is a regression"
]
answer = 1
whyWrong = "The issue is not a technical memory constraint (tokenizer cache does not carry training-set tokens into evaluation) nor a template lock (the model generates on any prompt; the question is what quality of output it produces). And evaluating on training prompts is the opposite of the point: memorization checking tells you whether the model can recite, not whether it can generalize — a recited answer on the exact same prompt proves nothing about the bind's real-world usefulness."
hint = "The lesson's FIELD NOTES section distinguishes between a memorization test and a generalization test: 'a training record and an evaluation record are nearly identical' means the evaluation is 'a memorization test wearing a held-out mask.' The correct choice explains that reworded prompts still measure recall of the specific record, not the style pattern behind it."
explain = "The goal of evaluation is to measure generalization — can the model produce style-consistent answers on topics it hasn't seen before? If an evaluation prompt covers the same specific topic as a training record (even reworded), the model may recite from memory rather than apply a learned style pattern. A genuine held-out test uses topics the artificer writes about but in combinations or contexts no training record covered."

