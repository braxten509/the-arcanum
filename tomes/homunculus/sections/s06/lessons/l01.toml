[[lessons]]
id = "s06-l01"
teaches = ["held-out-evaluation"]
title = "Generate the Fair Before-and-After"
body = '''
<p>Evaluate on the frozen prompt ids from Section II, never on a training completion. Create <code>src/homunculus/evaluate.py</code>. Load Qwen once with the same NF4 configuration, attach the saved adapter, then use PEFT's <code>disable_adapter()</code> context for the base response. This avoids holding two 8B models in a 16 GB card while preserving an honest same-base comparison.</p>
<pre><code>from contextlib import nullcontext
import torch
from peft import PeftModel
from transformers import AutoModelForCausalLM, AutoTokenizer

def generate(model, tokenizer, prompt, use_adapter):
    messages = [{"role": "user", "content": prompt}]
    text = tokenizer.apply_chat_template(
        messages, tokenize=False, add_generation_prompt=True,
        enable_thinking=False)
    inputs = tokenizer(text, return_tensors="pt").to(model.device)
    context = nullcontext() if use_adapter else model.disable_adapter()
    with context, torch.inference_mode():
        output = model.generate(
            **inputs, max_new_tokens=256, do_sample=False,
            pad_token_id=tokenizer.eos_token_id)
    new_tokens = output[0, inputs.input_ids.shape[1]:]
    return tokenizer.decode(new_tokens, skip_special_tokens=True).strip()</code></pre>
<p>Use the quantization and adapter configs from <code>train.py</code>, load <code>artifacts/adapters/bind-001</code> with <code>PeftModel.from_pretrained</code>, and write one row per case to <code>reports/eval-bind-001.jsonl</code>: id, category, prompt, generation settings, base response, adapted response, adapter hash, and suite hash. Slice off the input tokens as shown; decoding the full sequence would contaminate the answer with the prompt.</p>
<p><code>do_sample=False</code> removes sampling as a confound for this comparison. It does not make all GPU arithmetic byte-identical across software changes, so the manifest still matters. Shuffle which response is displayed as A or B in the human review and store the reveal key separately until scoring is complete. The evaluator must fail if a prompt id appears in the training corpus or if any expected row is missing.</p>
<div class="callout">The goal is paired evidence: same model family, tokenizer, prompt, template, token limit, and generation policy; adapter disabled versus enabled is the only intended difference.</div>
<div class="field-notes"><div class="fn-head">FIELD NOTES // PAIRED MEANS SAME CONDITIONS</div>
<p>The strongest comparison changes only adapter state. Use the same base load, prompt, template, generation settings, and evaluator, then toggle the adapter contribution. Separate processes are still useful for artifact reload proof, but paired evaluation removes unrelated serving differences from the question “what did this adapter change?”</p></div>
'''

[[lessons.readings]]
label = "PEFT adapter inference"
url = "https://huggingface.co/docs/peft/package_reference/peft_model"

[[lessons.exercises]]
id = "s06-l01-e1"
type = "mc"
points = 20
prompt = "Why use disable_adapter for the base side?"
choices = ["It deletes the adapter", "It quantizes the output", "It adds training prompts", "It compares the same loaded base with only the adapter contribution toggled"]
answer = 3
whyWrong = "The context manager is temporary; it neither deletes data nor changes quantization or the suite."
explain = "It isolates the learned delta without loading a second 8B model."
hint = "Only one comparison variable should change."

[[lessons.exercises]]
id = "s06-l01-e2"
type = "text"
points = 15
prompt = "Which setting removes random sampling from this paired test?"
answer = "do_sample=False"
accept = ["do_sample false", "do_sample=False"]
hint = "It appears in model.generate."

[[lessons.exercises]]
id = "s06-l01-e3"
type = "fill"
points = 20
prompt = "Complete the start index that removes prompt tokens from the decoded response."
code = '''new_tokens = output[0, ____:]'''
answer = "inputs.input_ids.shape[1]"
hint = "The prompt occupies exactly the input sequence length."

[[lessons.exercises]]
id = "s06-l01-e4"
type = "write"
points = 35
prompt = "Find leaked evaluation ids and print exactly: LEAK eval-02"
starter = '''training_ids = {"train-01", "eval-02", "train-03"}
evaluation_ids = ["eval-01", "eval-02", "eval-03"]

leaked = []
print("LEAK " + ", ".join(leaked))
'''
solution = '''training_ids = {"train-01", "eval-02", "train-03"}
evaluation_ids = ["eval-01", "eval-02", "eval-03"]

leaked = [case_id for case_id in evaluation_ids if case_id in training_ids]
print("LEAK " + ", ".join(leaked))
'''
expect = "LEAK eval-02"
hint = "Keep evaluation ids that also occur in the training-id set."
