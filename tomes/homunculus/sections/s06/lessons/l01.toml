[[lessons]]
id = "s06-l01"
title = "The Held-Out Mirror"
body = '''
<p>The binding rite produced an adapter — a seam pressed onto the frozen vessel, trained on the artificer's own records. The proving rite asks the one question the binder cannot answer: does it actually work? The answer comes from a mirror the binder never saw. Every record the training run fed to the <code>SFTTrainer</code> is a witness with a conflict of interest — of course the model does well on the data it was trained on. That tells you about memorization, not about the bind. The evaluation that matters uses records the binder <strong>never touched</strong>.</p>
<p>The fourth rite's curation pass taught the artificer to reserve a held-out set — a portion of the collected records, typically 10–20%, set aside before any training begins and never passed to the <code>SFTTrainer</code>. That set is the held-out mirror: generate on it with the adapted model, generate on it with the frozen base, and compare the two outputs side by side. The difference between them — in tone, in style, in factual accuracy — is the first real measurement of what the bind actually changed. A model that recites training records verbatim on the held-out set has memorized, not learned; a model whose held-out output is indistinguishable from the frozen base absorbed nothing.</p>
<p>The evaluation pass is a separate script from the training pass — the same one-job-per-tool discipline the first rite's toolchain lesson drilled and the fourth rite's curation pass reaffirmed. Write an <code>evaluate.py</code> that loads the adapter (the fifth rite's <code>PeftModel.from_pretrained</code>), loads the held-out prompt file (plain JSON — one prompt per line, never touched by the trainer), generates a response from both the adapted model and the frozen base for each prompt, and saves the pairs for human comparison. The generation parameters — temperature, top-p, max tokens — must be identical across the adapted and base runs, because any difference in sampling confounds the comparison: the detector cannot tell whether the output shifted because the bind changed the weights or because the sampler landed on a different random draw.</p>
<pre><code><span class="k">from</span> peft <span class="k">import</span> PeftModel
<span class="k">from</span> transformers <span class="k">import</span> AutoModelForCausalLM, AutoTokenizer

<span class="c"># Load the frozen base (no adapter) for the baseline:</span>
base = AutoModelForCausalLM.from_pretrained(
    <span class="s">"your-base-id"</span>, device_map=<span class="s">"auto"</span>, torch_dtype=torch.bfloat16
)
tokenizer = AutoTokenizer.from_pretrained(<span class="s">"your-base-id"</span>)

<span class="c"># Load the adapted model (base + adapter) for the test:</span>
adapted = PeftModel.from_pretrained(base, <span class="s">"./my-adapter"</span>)

<span class="c"># Generate on each held-out prompt — identical parameters for both:</span>
<span class="k">for</span> prompt <span class="k">in</span> held_out_prompts:
    inputs = tokenizer(prompt, return_tensors=<span class="s">"pt"</span>).to(<span class="s">"cuda"</span>)
    base_out = tokenizer.decode(base.generate(**inputs, max_new_tokens=<span class="k">128</span>)[0])
    adapt_out = tokenizer.decode(adapted.generate(**inputs, max_new_tokens=<span class="k">128</span>)[0])
    <span class="c"># save prompt, base_out, adapt_out as a comparison row</span></code></pre>
<p>The held-out prompts must be representative — they test the same kind of task the binding rite was meant to teach (style-consistent answers to the kind of questions the artificer actually writes about), not generic trivia. A held-out set of ten "what is the capital of France?" prompts proves nothing about whether the familiar absorbed the artificer's note-taking voice. The fourth rite's curation discipline already shaped the training records; the evaluation prompts are the same discipline applied to the test side — specific, on-domain, and unseen.</p>
<div class="field-notes"><div class="fn-head">FIELD NOTES // HELD-OUT BY RECORD, NOT BY TOKEN</div>
<p>There is a subtler failure mode: splitting at the token level rather than the record level. If a training record and an evaluation record are nearly identical — same user question, trivially reworded — the evaluation is a memorization test wearing a held-out mask. The safe split happens at the record level at the moment of curation (the fourth rite), not at the prompt level during evaluation. If the artificer wrote a note about CSS grid layout and included it in the training set, a held-out prompt that asks "explain CSS grid" is measuring recall of that specific record, not generalization to the artificer's broader explanation style. The evaluation set should cover topics the artificer writes about but in new, unseen contexts — "explain the difference between grid and flexbox for a page layout" where no training record covered that exact comparison.</p></div>
'''
body_words = 510

