[[lessons]]
id = "s06-l04"
teaches = ["loss-diagnostics"]
title = "Use Loss as Evidence, Not a Fortune Teller"
body = '''
<p>Training loss answers a narrow question: how well is the current model predicting supervised completion tokens in the training batches? Its absolute value has no universal healthy range across tokenizers, corpora, masking, sequence lengths, and model families. Delete rules such as “below 0.5 means the mask failed” or “above 4 means the data is bad.” Prove the mask directly, then read loss comparatively.</p>
<p>The full run must produce finite training loss and evaluation loss. A NaN or infinity is an immediate failure. A downward training trend shows optimization on the seen rows, but it does not prove useful style transfer. Evaluation loss on the frozen prompt-completion split is the better checkpoint signal: if training loss keeps improving while evaluation loss worsens, the run is fitting seen tokens at the expense of held-out prediction.</p>
<pre><code>history = trainer.state.log_history
loss_rows = [row for row in history if "loss" in row or "eval_loss" in row]
Path(f"runs/{run_id}/loss-history.json").write_text(
    json.dumps(loss_rows, indent=2) + "\n", encoding="utf-8")</code></pre>
<p>One epoch may provide only one evaluation point, so do not invent a curve it did not measure. If the initial adapter fails and you need checkpoint selection, configure matching step-based evaluation and saving intervals on the next controlled run. Choose the lowest held-out evaluation loss only as a candidate; the paired human rubric and regression suite still decide whether it is useful.</p>
<p>Loss diagnostics also expose pipeline defects: no loss rows means logging was not preserved; zero evaluation rows means the held-out split was not actually used; a sudden OOM after several steps calls for the peak-memory report and sequence-length distribution. Record observations in <code>reports/loss-bind-001.md</code> with exact step numbers and values.</p>
<div class="field-notes"><div class="fn-head">FIELD NOTES // LOSS IS A TRAINING INSTRUMENT</div>
<p>Training and evaluation loss describe token prediction under the prepared dataset; they do not directly measure usefulness, privacy, or personal voice. Use curves to catch instability and overfitting, then decide with held-out behavioral suites. A lower loss paired with worse blind judgments is not a paradox—it means the optimization target and product target diverged.</p></div>
'''

[[lessons.readings]]
label = "Transformers Trainer state and logs"
url = "https://huggingface.co/docs/transformers/v5.13.0/main_classes/trainer"

[[lessons.exercises]]
id = "s06-l04-e3"
type = "fill"
points = 20
prompt = "Complete the key used to extract held-out loss rows."
code = '''row["____"]'''
answer = "eval_loss"
hint = "Trainer log history prefixes evaluation metrics with eval_."

[[lessons.exercises]]
id = "s06-l04-e1"
type = "mc"
points = 20
prompt = "What does a falling training loss prove by itself?"
choices = [
  "The assistant now sounds like the learner",
  "No capability regressed",
  "The model is getting better at predicting supervised tokens in seen batches",
  "The GGUF will fit",
]
answer = 2
whyWrong = "Voice, regression, and serving footprint require separate evidence."
explain = "Loss is an optimization signal, not the product verdict."
hint = "Keep the claim inside the data used to compute the number."

[[lessons.exercises]]
id = "s06-l04-e2"
type = "text"
points = 15
prompt = "Which held-out metric helps identify overfitting during training?"
answer = "evaluation loss"
accept = ["eval_loss", "evaluation loss", "held-out evaluation loss"]
hint = "It is computed on the frozen eval split."

[[lessons.exercises]]
id = "s06-l04-e4"
type = "write"
points = 35
prompt = "Select the step with lowest eval loss and print exactly: BEST step=20 loss=1.40"
starter = '''rows = [
    {"step": 10, "eval_loss": 1.55},
    {"step": 20, "eval_loss": 1.40},
    {"step": 30, "eval_loss": 1.47},
]

best = rows[0]
print(f"BEST step={best['step']} loss={best['eval_loss']:.2f}")
'''
solution = '''rows = [
    {"step": 10, "eval_loss": 1.55},
    {"step": 20, "eval_loss": 1.40},
    {"step": 30, "eval_loss": 1.47},
]

best = min(rows, key=lambda row: row["eval_loss"])
print(f"BEST step={best['step']} loss={best['eval_loss']:.2f}")
'''
expect = "BEST step=20 loss=1.40"
hint = "Use min with a key that returns each row's eval_loss."
