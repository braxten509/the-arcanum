[freestyle]
title = "THE WORKING: THE FIRST RESPONSE"
brief = "Run a base model and an instruct model locally, note the sampling settings, and record what changes when the chat template is obeyed or broken."
reward = 200
xray = "Look for whether the student can tell baseline behavior from template behavior. A correct run is not enough; they must notice the shape of the output."

[freestyle.badge]
id = "s02-badge"
name = "FIRST RESPONSE"
desc = "Awarded for waking the first local model."

[[freestyle.rubric]]
criterion = "Baseline run"
weight = 35
desc = "A local model is run successfully and the result is read, not just shown."

[[freestyle.rubric]]
criterion = "Template awareness"
weight = 35
desc = "The response shows awareness of chat formatting and sampling settings."

[[freestyle.rubric]]
criterion = "Comparison"
weight = 30
desc = "Base and instruct behavior are compared with a clear reason."
