[freestyle]
requires = ["tool-run-test", "python-craft", "ollama-baseline", "model-types", "model-card", "sampling-contract", "baseline-suite"]
title = "THE WORKING: FREEZE THE FIRST RESPONSE"
brief = '''Extend the same <code>Homunculus/</code> project with <code>data/eval/baseline-prompts.jsonl</code>, <code>src/homunculus/baseline.py</code>, <code>reports/baseline.jsonl</code>, and <code>reports/baseline-review.md</code>.<ul><li>Use at least ten stable prompt ids spanning voice, format, task correctness, uncertainty, and future grounding.</li><li>Record the exact <code>qwen3:8b</code> model id and fixed sampling options.</li><li>Call the live Ollama chat API; do not invent or paste responses.</li><li>Save every raw response, then score each 0–2 for correctness, format, usefulness, and voice.</li><li>Demonstrate once what a missing chat template changes, but keep that experiment separate from the frozen product baseline.</li><li>Run <code>python -m compileall -q src tests</code> and <code>python -m homunculus.baseline</code> from the project root, then confirm the report contains every frozen id exactly once.</li><li>Keep <code>baseline.py</code> to the Section I Python naming and layout contract.</li></ul>A missing id, HTTP failure, or malformed JSONL row blocks the rite and must be repaired at that boundary. These prompt ids are now evaluation assets and may not be copied into the training split.'''
reward = 200
xray = "The report must be reproducible from code and a live model. Reject a baseline with mutable prompt ids, unstated settings, hand-written outputs, or evaluation prompts later leaked into training."

[freestyle.badge]
id = "s02-badge"
name = "FIRST RESPONSE"
desc = "Awarded for a frozen, repeatable before-picture of the assistant."

[[freestyle.rubric]]
criterion = "Live baseline"
weight = 30
desc = "The module calls Ollama and preserves raw responses with model and sampling metadata."

[[freestyle.rubric]]
criterion = "Representative suite"
weight = 30
desc = "Ten or more stable, leak-free prompts exercise the assistant's actual daily job."

[[freestyle.rubric]]
criterion = "Repeatable judgment"
weight = 30
desc = "The review uses the stated four-axis rubric and names concrete failures by prompt id."

[[freestyle.rubric]]
criterion = "Python craft"
weight = 10
desc = "baseline.py keeps snake_case names, UPPER_CASE constants, four-space indentation, grouped imports at the top, and clearly separated top-level functions."
