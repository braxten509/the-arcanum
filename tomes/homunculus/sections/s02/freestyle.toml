[freestyle]
requires = ["tool-run-test", "python-craft", "ollama-baseline", "model-types", "model-card", "sampling-contract", "baseline-suite"]
title = "THE WORKING: FREEZE THE FIRST RESPONSE"
brief = '''Extend the same project with a private frozen baseline and a sanitized receipt.<ul><li>Use at least ten stable private prompt ids spanning the real job; never copy prompts or responses into assessable evidence.</li><li>Bind the suite to the full Ollama digest, Ollama version, settings, seed where honored, and prompt-suite hash.</li><li>Call the live local API and preserve raw responses privately.</li><li>Repeat a frozen subset to characterize residual variation under greedy decoding.</li><li>Write <code>evidence/receipts/s02.json</code> with ids, counts, hashes, aggregate scores, repeat differences, and redacted failure summaries.</li><li>Prove every id occurs exactly once and no baseline id enters training.</li></ul>A missing id, mutable identity, HTTP/schema failure, leakage, fabricated output, or raw text in evidence blocks the Working.'''
reward = 200
xray = "The report must be reproducible from code and a live model. Reject a baseline with mutable prompt ids, unstated settings, hand-written outputs, or evaluation prompts later leaked into training."

[freestyle.badge]
id = "s02-badge"
name = "FIRST RESPONSE"
desc = "Awarded for a frozen, repeatable before-picture of the assistant."

[[freestyle.rubric]]
criterion = "Live baseline"
weight = 30
desc = "The module calls Ollama and preserves raw responses with model and sampling metadata."
essential = true
minimumScore = 8

[[freestyle.rubric]]
criterion = "Representative suite"
weight = 30
desc = "Ten or more stable, leak-free prompts exercise the assistant's actual daily job."
essential = true
minimumScore = 7

[[freestyle.rubric]]
criterion = "Repeatable judgment"
weight = 30
desc = "The review uses the stated four-axis rubric and names concrete failures by prompt id."
essential = true
minimumScore = 7

[[freestyle.rubric]]
criterion = "Python craft"
weight = 10
desc = "baseline.py keeps snake_case names, UPPER_CASE constants, four-space indentation, grouped imports at the top, and clearly separated top-level functions."

[[freestyle.verification]]
id = "compile-s02"
command = "compile"
label = "Compile source and tests"
required = true
expect = { exitCode = 0 }

[[freestyle.verification]]
id = "tests-s02"
command = "tests"
label = "Run unit tests"
required = true
expect = { exitCode = 0 }

[[freestyle.verification]]
id = "evidence-s02"
command = "evidence"
label = "Validate sanitized Section II receipt"
required = true
args = ["s02"]
expect = { exitCode = 0 }
