[[lessons]]
id = "s02-l05"
teaches = ["baseline-suite"]
title = "Freeze the Before Picture"
body = '''
<p>A personal fine-tune is only useful if you can show what improved. Build the comparison before the adapter exists. Create <code>data/eval/baseline-prompts.jsonl</code> with at least ten rows. Each row needs a stable <code>id</code>, a <code>category</code>, and a <code>prompt</code>. Cover the real job: rewriting rough notes, summarizing a decision, formatting standard Markdown for Notion, explaining uncertainty, following an exact output shape, and answering a question that will later use a style reference. Do not put the desired answers into training data later.</p>
<pre><code>{"id":"rewrite-01","category":"voice","prompt":"Rewrite this as a concise project note: We tried three layouts and the second one was easiest to scan."}
{"id":"format-01","category":"format","prompt":"Return a Markdown heading, two bullets, and one next action for a project review."}</code></pre>
<p>Create <code>src/homunculus/baseline.py</code>. It reads those rows, calls the live Ollama chat endpoint, and writes the complete responses rather than a hand-written impression:</p>
<pre><code>import json
from pathlib import Path
import httpx

MODEL = "qwen3:8b"
OPTIONS = {"temperature": 0.2, "top_p": 0.8, "seed": 42}

def main():
    source = Path("data/eval/baseline-prompts.jsonl")
    target = Path("reports/baseline.jsonl")
    target.parent.mkdir(parents=True, exist_ok=True)
    with source.open(encoding="utf-8") as rows, target.open("w", encoding="utf-8") as report:
        for line in rows:
            case = json.loads(line)
            payload = {
                "model": MODEL,
                "messages": [{"role": "user", "content": case["prompt"]}],
                "stream": False,
                "think": False,
                "options": OPTIONS,
            }
            response = httpx.post("http://127.0.0.1:11434/api/chat", json=payload, timeout=180)
            response.raise_for_status()
            result = {**case, "model": MODEL, "options": OPTIONS,
                      "response": response.json()["message"]["content"]}
            report.write(json.dumps(result, ensure_ascii=False) + "\n")
    print(f"BASELINE {target}")

if __name__ == "__main__":
    main()</code></pre>
<p>Run <code>python -m homunculus.baseline</code>, then open <code>reports/baseline.jsonl</code>. Score each response manually in a separate <code>reports/baseline-review.md</code> on task correctness, requested format, usefulness, and resemblance to your preferred voice, each from 0–2. Record concrete observations, such as “added an unnecessary preamble” or “ignored the two-bullet limit.” These same prompt IDs and settings become the frozen comparison in Section VI.</p>
<p>A base-versus-instruct experiment is still useful for understanding templates, but it is not the product baseline. The product baseline is the exact Qwen3 service the final model will replace, using a fixed suite, fixed settings, saved raw outputs, and a rubric another run can repeat.</p>
<div class="field-notes"><div class="fn-head">FIELD NOTES // FREEZE THE QUESTIONS FIRST</div>
<p>A baseline created after seeing the tuned model is easy to manipulate unconsciously. Freeze case IDs, prompts, settings, and scoring criteria before training; save raw responses as well as scores. Later comparisons can then ask whether the adapter changed behavior on the same work, rather than whether a reviewer invented friendlier tests.</p></div>
'''

[[lessons.readings]]
label = "Ollama chat API"
url = "https://docs.ollama.com/api/chat"

[[lessons.readings]]
label = "Qwen3-8B model card"
url = "https://huggingface.co/Qwen/Qwen3-8B"

[[lessons.exercises]]
id = "s02-l05-e1"
type = "mc"
points = 20
prompt = "Why must the baseline suite be created before training?"
choices = [
  "TRL refuses to train unless Ollama has already scored the data",
  "It increases the GPU's physical memory",
  "It prevents choosing only prompts that make the finished adapter look good",
  "It converts Qwen weights into GGUF",
]
answer = 2
whyWrong = "The suite is an evaluation control, not a trainer requirement, memory feature, or converter."
explain = "A frozen before-picture makes improvement and regression claims falsifiable."
hint = "Think about selection bias after seeing the final output."

[[lessons.exercises]]
id = "s02-l05-e2"
type = "text"
points = 15
prompt = "Which report stores the untouched model responses as JSONL?"
answer = "reports/baseline.jsonl"
accept = ["baseline.jsonl", "reports/baseline.jsonl"]
hint = "It is the target path in baseline.py."

[[lessons.exercises]]
id = "s02-l05-e3"
type = "fill"
points = 20
prompt = "Complete the Ollama payload field that disables streamed response fragments for a simple one-response-per-row report."
code = '''payload = {
    "model": "qwen3:8b",
    "____": False,
}'''
answer = "stream"
hint = "The API otherwise yields multiple incremental chunks."

[[lessons.exercises]]
id = "s02-l05-e4"
type = "mc"
points = 20
prompt = "Which observation is reproducible enough for the review?"
choices = [
  "format-01 added prose before the requested heading and returned three bullets instead of two",
  "It felt vaguely worse",
  "The colors seemed strange",
  "I liked the second answer more",
]
answer = 0
whyWrong = "Unanchored impressions do not name the case or the contract that failed."
explain = "A case id plus an observable deviation can be checked again after training."
hint = "Choose the statement that another person could verify from the saved row."

[[lessons.exercises]]
id = "s02-l05-e5"
type = "write"
points = 35
prompt = "Compute the mean of four 0–2 rubric scores and print exactly: SCORE 1.5"
starter = '''scores = {"correct": 2, "format": 1, "useful": 2, "voice": 1}

mean = 0
print(f"SCORE {mean:.1f}")
'''
solution = '''scores = {"correct": 2, "format": 1, "useful": 2, "voice": 1}

mean = sum(scores.values()) / len(scores)
print(f"SCORE {mean:.1f}")
'''
expect = "SCORE 1.5"
hint = "Divide the sum of the values by the number of rubric axes."
