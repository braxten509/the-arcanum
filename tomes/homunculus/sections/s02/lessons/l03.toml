[[lessons]]
id = "s02-l03"
title = "Reading the Vial's Label"
body = '''
<p>Every vial worth drinking has a label, and a model is no different. Before you run anything unfamiliar, its <strong>model card</strong> — the documentation page on Hugging Face or in Ollama's library entry — answers the questions you'd otherwise learn the hard way, mid-chat or mid-fine-tune. Skipping it is how an artificer ends up training against a license that forbids it, or budgeting VRAM for the wrong parameter count.</p>
<p>A few fields matter more than the rest. <strong>License</strong> states what you're actually allowed to do with the weights — some are fully open, some restrict commercial use, some gate access behind an application. <strong>Parameters</strong> gives the raw size (7B, 8B, 70B) that drives your VRAM math two rites from now. <strong>Context length</strong> is the maximum number of tokens the model can hold in a single conversation before earlier turns start falling out of its window — get this wrong and a long chat degrades in ways that look like the model "forgetting," when really the window simply ran out. <strong>Quantization</strong> notes, when present, tell you whether the weights on offer are full precision or already compressed — a <code>q4_0</code> tag in a GGUF's filename is the same idea the last rite's registry ledger already showed you, just spelled out formally here.</p>
<pre><code><span class="k">ollama</span> show llama3.1 --modelfile</code></pre>
<p>That command is the local equivalent of reading the label without leaving your terminal — it prints the exact <code>Modelfile</code> bound to a locally pulled model: its base GGUF path, its chat template, its default parameters. Hugging Face's web page is the fuller label, with the license, intended use, and known limitations section spelled out in prose the terminal command doesn't carry.</p>
<div class="callout">A card's <strong>limitations</strong> section is not boilerplate — it is the model's authors telling you, in their own words, where it breaks: languages it's weak in, tasks it hallucinates on, biases it inherited from its training data. Read it before you trust an output you can't independently verify.</div>
<div class="field-notes"><div class="fn-head">FIELD NOTES // THE CARD YOU'LL WRITE YOURSELF</div>
<p>Every field this rite teaches you to read, you will eventually write for your own fine-tuned vessel — a base model, a parameter count, a context length inherited from the base, a license you choose, and a limitations section describing exactly what your own personal model does badly. Reading these carefully now is rehearsal for the honesty your own homunculus's documentation will need later.</p></div>
'''

[[lessons.readings]]
label = "Hugging Face model cards"
url = "https://huggingface.co/docs/hub/en/model-cards"

[[lessons.exercises]]
id = "s02-l03-e1"
type = "type"
points = 12
prompt = "Retype the exact local command that prints a pulled model's Modelfile — its base GGUF, chat template, and default parameters — without opening a browser."
code = "ollama show llama3.1 --modelfile"

[[lessons.exercises]]
id = "s02-l03-e2"
type = "mc"
points = 20
prompt = "Which model-card field tells you the maximum number of tokens a conversation can hold before earlier turns start falling out of the model's window?"
choices = [
  "License",
  "Parameter count",
  "Quantization",
  "Context length",
]
answer = 3
whyWrong = "License governs legal use, parameter count governs raw size and VRAM math, and quantization governs precision/compression — none of the three describes how much conversation the model can hold at once, which is what context length alone specifies."
explain = "Context length is the token budget for a whole conversation; run past it and earlier turns are dropped from the model's view, which looks like forgetting but is really just the window filling up."

[[lessons.exercises]]
id = "s02-l03-e3"
type = "text"
points = 15
prompt = "What is the name of the model-card section that states a model's known weaknesses, failure modes, and inherited biases in the authors' own words?"
answer = "limitations"
accept = ["known limitations", "limitations section"]
hint = "It's named directly in this rite's callout, right after the license/context/parameters/quantization list."

[[lessons.exercises]]
id = "s02-l03-e4"
type = "fill"
points = 20
prompt = "Fill the missing key from this parsed model-card dict — the field holding the token budget for a single conversation."
code = '''card = {
    "license": "apache-2.0",
    "params": "8B",
    "____": 128000,
    "quantization": "none (fp16)",
}'''
answer = "context_length"
accept = ["context_window"]
hint = "It's the field this rite's body defines as the maximum tokens a conversation can hold before earlier turns fall out of the window."
