[[lessons]]
id = "s11-l01"
title = "Speaking to the Machine"
body = '''
<p>Every rite in this cabinet — loading a model, shaping a dataset, training an adapter — is written in one language: Python. Before you can command the homunculus, you must be able to say the smallest possible thing and have the machine obey. That smallest thing is <code>print</code>.</p>
<p>A Python <em>script</em> is a plain text file, by convention ending in <code>.py</code>, read from the top line to the bottom line, one instruction at a time. When you run it, the machine does exactly what each line says, in order, and then stops. There is no hidden magic and no memory between runs — only the lines you wrote.</p>
<pre><code>print("The bench is lit.")</code></pre>
<p>Run that one-line file and the machine writes <code>The bench is lit.</code> to the terminal. <code>print</code> is a <strong>function</strong> — a named rite you invoke by writing its name followed by parentheses. Whatever you place inside the parentheses is the <em>argument</em>, the thing handed to the rite. Here the argument is a <em>string</em>: a run of text wrapped in quotes.</p>
<div class="callout">The quotes are the walls of the string. <code>print("hello")</code> writes <code>hello</code>; the quotes themselves are never printed — they only mark where the text begins and ends.</div>
<p>You will want to leave notes to yourself that the machine ignores. A <code>#</code> begins a <em>comment</em>: everything after it on that line is for human eyes only and is never run.</p>
<pre><code># prove the interpreter answers
print("ready")   # this half of the line runs; this half does not</code></pre>
<p>Two ways to run Python. The <strong>REPL</strong> (type <code>python3</code> with no file) is a live bench — you type one line, it answers, you type the next; good for trying a single idea. A <strong>script</strong> (<code>python3 bench.py</code>) runs a whole saved file top to bottom; this is how every real working in this course is built.</p>
<div class="field-notes"><div class="fn-head">FIELD NOTES // ORDER IS EVERYTHING</div>
<p>The machine has no intuition. If line 1 prints a greeting and line 2 prints a warning, the greeting always comes first — not because it is friendlier, but because it is higher in the file. Later, when a training script loads a model before it moves it to the GPU, that order will matter for real. Learn now to read a file the way the machine does: strictly downward.</p></div>
'''

[[lessons.readings]]
label = "Python — The `print` function"
url = "https://docs.python.org/3/library/functions.html#print"
essential = true

[[lessons.readings]]
label = "Python tutorial — An Informal Introduction"
url = "https://docs.python.org/3/tutorial/introduction.html"

[[lessons.exercises]]
id = "s11-l01-e1"
type = "type"
points = 10
prompt = "Retype the single line that writes the words <code>The bench is lit.</code> to the terminal."
code = 'print("The bench is lit.")'

[[lessons.exercises]]
id = "s11-l01-e2"
type = "mc"
points = 18
prompt = "What does the machine write when it runs <code>print(\"hello\")</code>?"
choices = [
  '<code>"hello"</code> — including the quotes',
  "<code>hello</code> — the quotes only mark where the text starts and ends",
  "<code>print(hello)</code>",
  "Nothing, until you type it again in the REPL",
]
answer = 1
whyWrong = "The quotes are not part of the text — they are the walls that tell Python where the string begins and ends. Python strips them and writes only what is between them."
explain = "A string literal's quotes are syntax, not content. <code>print</code> receives the text <code>hello</code> and writes exactly that; the quotes never reach the terminal."
hint = "Ask what the quotes are FOR. They mark the boundary of the text — they are not text themselves."

[[lessons.exercises]]
id = "s11-l01-e3"
type = "mc"
points = 18
prompt = "In the line <code>print(\"ready\")   # answer the summons</code>, what happens to <code>answer the summons</code>?"
choices = [
  "It is printed on a second line",
  "It is a comment — everything after the <code>#</code> is ignored when the file runs",
  "It causes an error because it is not in quotes",
  "It becomes the argument to <code>print</code> instead of <code>ready</code>",
]
answer = 1
whyWrong = "A <code>#</code> starts a comment. Python does not try to run the words after it, so they are neither printed nor an error — they are simply skipped."
explain = "Comments are for the human reading the file. From the <code>#</code> to the end of the line, the text is invisible to the interpreter; only <code>print(\"ready\")</code> actually runs."
hint = "The <code>#</code> is the key mark. What is its whole job in a Python file?"

[[lessons.exercises]]
id = "s11-l01-e4"
type = "text"
points = 14
prompt = "What single character begins a comment in Python — the mark after which the rest of the line is ignored?"
answer = "#"
accept = ["hash", "pound", "# (hash)", "the # symbol"]
hint = "It sits at the start of the note the machine skips over in the field-notes example above."

[[lessons.exercises]]
id = "s11-l01-e5"
type = "write"
points = 28
prompt = "Write a script that prints exactly two lines — first <code>The bench is lit.</code> then <code>ready</code>. The order must match: the first line of output is the greeting, the second is the readiness. Use one <code>print</code> per line."
starter = '''# the machine reads top to bottom — put the two print lines in the right order
'''
expect = '''The bench is lit.
ready'''
hint = "Two separate print calls, one under the other. Whichever print you write first runs first, so the greeting line goes above the readiness line."
