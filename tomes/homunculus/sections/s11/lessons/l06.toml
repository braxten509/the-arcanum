[[lessons]]
id = "s11-l06"
title = "Naming a Rite"
body = '''
<p>You have already <em>called</em> functions — <code>print(...)</code>, <code>len(...)</code>, <code>int(...)</code>. Now you learn to <em>write</em> your own: to name a small piece of work once and invoke it by name wherever you need it. In this cabinet a function is a rite — a bound procedure you can perform on demand.</p>
<pre><code>def adapter_path(base, rank):
    return f"adapters/{base}_rank-{rank}"

print(adapter_path("qwen2.5", 8))   # adapters/qwen2.5_rank-8
print(adapter_path("llama3", 16))   # adapters/llama3_rank-16</code></pre>
<p>Four parts to read here:</p>
<ul>
<li><code>def</code> begins the definition, followed by the rite's name.</li>
<li><code>(base, rank)</code> are the <strong>parameters</strong> — named slots the caller fills in.</li>
<li>The colon and indented block are the body, exactly like an <code>if</code>.</li>
<li><code>return</code> hands a value back to whoever called the rite.</li>
</ul>
<p>Defining a function does not run its body — it only teaches the machine the rite. The body runs each time you <em>call</em> it, and each call may pass different <strong>arguments</strong> into the parameters. Above, the one definition serves both a rank-8 and a rank-16 path.</p>
<h3>return versus print</h3>
<p>This is the distinction beginners most often blur. <code>print</code> writes text to the terminal and is gone. <code>return</code> hands a value back so the caller can keep working with it — store it, pass it on, compare it. A function that computes should <code>return</code>; only the outermost, human-facing line should <code>print</code>.</p>
<pre><code>def fits(vram_gb):
    return vram_gb &gt;= 6          # hands back True or False

if fits(16):                     # the returned value feeds the decision
    print("load it")</code></pre>
<div class="callout">A function with no <code>return</code> hands back the special value <code>None</code> — Python's word for "nothing here." If you <code>print</code> inside a function but forget to <code>return</code>, the caller gets <code>None</code>, and a later <code>None</code> where a path or number was expected is a classic crash two steps downstream.</div>
<div class="field-notes"><div class="fn-head">FIELD NOTES // WHY THE WHOLE COURSE IS FUNCTIONS</div>
<p>Every real training script is a handful of named rites — build the dataset, load the model, wrap it in an adapter, run one training step — each a function you call in order. Learn to see a wall of code as a short list of well-named rites and the later chapters stop being intimidating: you are only ever reading one small rite at a time.</p></div>
'''

