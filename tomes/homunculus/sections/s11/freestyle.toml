[freestyle]
title = "THE WORKING: THE FIRST SCRIPT"
brief = "Write one small, complete Python script that greets the artificer by name and reports one fact about their bench — proving you can hold names, strings, a number, and a decision together in a single file that runs top to bottom.<ul><li>Store a name and a GPU size (in GB) in well-named variables.</li><li>Use an f-string to print a greeting that includes both.</li><li>Use an <code>if/else</code> to print whether the card has enough room for a 7B model in 4-bit (roughly ≥ 6 GB).</li></ul>"
reward = 160
xray = "This is the first real test of whether the tongue is steady. Dock a script that only prints a fixed string with no variables, that hardcodes the verdict instead of deciding it with an <code>if</code>, or that concatenates with <code>+</code> where an f-string was asked for. Reward a clean, readable file that would run without error on a bare Python install."

[freestyle.badge]
id = "s11-badge"
name = "FIRST WORD SPOKEN"
desc = "Awarded for writing your first complete Python script that runs top to bottom."

[[freestyle.rubric]]
criterion = "Names & types"
weight = 35
desc = "A name (string) and a GPU size (number) are held in clearly named variables, not literals dropped into the print."

[[freestyle.rubric]]
criterion = "String formatting"
weight = 30
desc = "The greeting is built with an f-string that interpolates both variables, not with manual <code>+</code> concatenation."

[[freestyle.rubric]]
criterion = "A real decision"
weight = 35
desc = "An <code>if/else</code> computes the verdict from the size variable — the script would print a different line for a 4 GB card than for a 16 GB one."
