[[lessons]]
id = "s12-l04"
title = "The Map: Names to Values"
body = '''
<p>A list holds many things <em>in order</em>. But a config is not an order — it is a set of <em>named</em> settings: rank is 8, learning rate is 0.0002, base is qwen2.5. For "look this up by name," Python gives you the <strong>dictionary</strong> — a map from keys to values.</p>
<pre><code>config = {"base": "qwen2.5", "rank": 8, "lr": 0.0002}
print(config["rank"])    # 8   — look up by key, not by position
print(config["base"])    # qwen2.5</code></pre>
<p>Curly braces hold the pairs; each pair is <code>key: value</code>; commas separate them. You reach a value by its key in square brackets — <code>config["rank"]</code> — exactly the shape of list indexing, but the "index" is a name you chose, not a position.</p>
<div class="callout">Ask for a key that is not there — <code>config["epochs"]</code> — and Python raises a <code>KeyError</code>. When a key might be missing, use <code>config.get("epochs", 1)</code>: it returns the value if present, or the fallback <code>1</code> if not, without crashing.</div>
<h3>Adding and changing</h3>
<p>Assign to a key to set or overwrite it. A new key is created; an existing key is replaced.</p>
<pre><code>config["epochs"] = 3        # new key added
config["rank"] = 16         # existing key overwritten
print(config["rank"])       # 16</code></pre>
<h3>Walking a dict</h3>
<p>Looping over a dict gives its keys; <code>.items()</code> gives both key and value together, the form you will use most:</p>
<pre><code>config = {"base": "qwen2.5", "rank": 8}
for key, value in config.items():
    print(f"{key} = {value}")</code></pre>
<pre><code>base = qwen2.5
rank = 8</code></pre>
<p>You can also ask <code>"rank" in config</code> — a True/False test for whether a key exists — the safe check before a lookup.</p>
<div class="field-notes"><div class="fn-head">FIELD NOTES // THE SHAPE OF EVERY CONFIG</div>
<p>Hyperparameters, a chat message (<code>{"role": "user", "content": "..."}</code>), a JSON log line, an evaluation result — all are dicts. When a later chapter says "build a config" or "each training example is a dict with keys role and content," it is describing this exact structure. Reading a dict fluently is reading half the code in the course.</p></div>
'''

[[lessons.readings]]
label = "Python tutorial — Dictionaries"
url = "https://docs.python.org/3/tutorial/datastructures.html#dictionaries"
essential = true

[[lessons.readings]]
label = "dict — the mapping type"
url = "https://docs.python.org/3/library/stdtypes.html#mapping-types-dict"

[[lessons.exercises]]
id = "s12-l04-e1"
type = "mc"
points = 20
prompt = "For <code>config = {\"base\": \"qwen2.5\", \"rank\": 8}</code>, how do you get the value <code>8</code>?"
choices = [
  "<code>config[1]</code> — by position",
  "<code>config[\"rank\"]</code> — by its key",
  "<code>config.rank</code>",
  "<code>config(8)</code>",
]
answer = 1
whyWrong = "A dict is looked up by KEY, not by position, and not with a dot. <code>config[1]</code> would look for a key <code>1</code> (a KeyError here), and <code>config.rank</code> is not dict syntax. Use <code>config[\"rank\"]</code>."
explain = "Dictionaries map keys to values. You retrieve a value by putting its key in square brackets: <code>config[\"rank\"]</code> returns <code>8</code>. Position-based access (<code>[1]</code>) belongs to lists, not dicts."
hint = "A dict has no positions — it has names. Which access uses the name <code>rank</code>?"

[[lessons.exercises]]
id = "s12-l04-e2"
type = "mc"
points = 22
prompt = "<code>config = {\"rank\": 8}</code>. What is the difference between <code>config[\"epochs\"]</code> and <code>config.get(\"epochs\", 1)</code>?"
choices = [
  "Nothing — both return 1",
  "<code>config[\"epochs\"]</code> raises a KeyError because the key is missing; <code>.get(\"epochs\", 1)</code> returns the fallback 1 instead of crashing",
  "<code>.get</code> is slower but otherwise identical",
  "<code>.get</code> adds the key to the dict",
]
answer = 1
whyWrong = "Square-bracket access on a missing key is an error, not a fallback. <code>.get(key, default)</code> is the crash-proof form: it returns the default when the key is absent."
explain = "<code>config[\"epochs\"]</code> raises KeyError because there is no such key. <code>config.get(\"epochs\", 1)</code> returns <code>1</code> instead — the safe way to read a setting that might not be present. <code>.get</code> does not modify the dict."
hint = "One of these crashes when the key is absent; the other hands back a fallback. Which is which?"

[[lessons.exercises]]
id = "s12-l04-e3"
type = "text"
points = 16
prompt = "Which dict method, used as <code>for k, v in config.____():</code>, yields each key together with its value?"
answer = "items"
accept = ["items()", ".items", ".items()"]
hint = "It is named for the key–value pairs it hands back, used in the 'walking a dict' example."

[[lessons.exercises]]
id = "s12-l04-e4"
type = "write"
points = 30
prompt = "Build a dict <code>config</code> with keys <code>base</code> = <code>\"qwen2.5\"</code> and <code>rank</code> = <code>8</code>. Then add a key <code>epochs</code> set to <code>3</code>, and print the value stored under <code>epochs</code>. Output must be exactly <code>3</code>."
starter = '''# make the dict with base and rank, then add epochs = 3, then print config["epochs"]
config = ...   # replace ... with the { } dict literal
'''
expect = "3"
hint = "<code>config = {\"base\": \"qwen2.5\", \"rank\": 8}</code>, then <code>config[\"epochs\"] = 3</code>, then <code>print(config[\"epochs\"])</code>."

[[lessons.exercises]]
id = "s12-l04-e5"
type = "write"
points = 34
prompt = "Given <code>config = {\"base\": \"qwen2.5\", \"rank\": 8}</code>, loop over it with <code>.items()</code> and print each pair as <code>key = value</code>, one per line. Output must be exactly <code>base = qwen2.5</code> then <code>rank = 8</code>."
starter = '''config = {"base": "qwen2.5", "rank": 8}
# walk config.items() and print each as "key = value" with an f-string
'''
expect = '''base = qwen2.5
rank = 8'''
hint = "<code>for key, value in config.items():</code> then indented <code>print(f\"{key} = {value}\")</code>. Dicts preserve the insertion order, so base comes before rank."
