[[lessons.exercises]]
id = "s07-l01-e4"
type = "fill"
points = 20
prompt = "Fill the missing operation in the cosine similarity computation from the lesson — the step that converts a raw embedding vector into a unit-length vector so the dot product measures only the angle, not the magnitude."
code = '''import numpy as np
from sentence_transformers import SentenceTransformer

model = SentenceTransformer("all-MiniLM-L6-v2")
vec = model.encode("Style guides for Notion headings.")

# Convert to unit-length vector for cosine similarity:
norm = vec / np.linalg.____(vec)

# Dot product of two unit-length vectors = cosine similarity:
sim = np.dot(norm, norm)
print(sim)  # 1.0 — a vector dotted with itself'''
answer = "norm"
accept = ["norm"]
hint = "NumPy's norm function — np.linalg.norm(vec) — returns the Euclidean length (magnitude) of the vector. Dividing the vector by its magnitude produces a unit-length vector pointing in the same direction. The fill is the name of the function that computes this magnitude."

[[lessons.exercises]]
id = "s07-l01-e5"
type = "write"
points = 35
prompt = "The embedding model has already turned a query and two reference texts into these short vectors (they are unit-length, so cosine similarity is just the dot product). Reference <code>a</code> is a style-guide line about fonts; reference <code>b</code> is about colors. Compute the dot product of the query vector with each reference, and print <code>BEST 1</code> if reference a scores higher, <code>BEST 2</code> if b does — computed from the vectors, not hardcoded."
starter = '''# These are what model.encode(...) + normalize would return — given to you
# so the exercise is the *comparison logic*, not the embedding call.
q = [0.6, 0.8, 0.0]   # query: "what font size for headings?"
a = [0.8, 0.6, 0.0]   # ref a: about fonts/headings
b = [0.0, 0.6, 0.8]   # ref b: about colors

# Cosine similarity here is the dot product: sum of q[i]*x[i] over the 3 slots.
# Compute the dot product q.a and q.b, then print BEST 1 if q.a is larger,
# else BEST 2.  (A short loop, or sum(q[i]*a[i] for i in range(3)), does it.)
print("BEST 0")
'''
expect = "BEST 1"
hint = "dot(q, a) = 0.6*0.8 + 0.8*0.6 + 0.0*0.0 = 0.96. dot(q, b) = 0.6*0.0 + 0.8*0.6 + 0.0*0.8 = 0.48. Since 0.96 > 0.48, print 'BEST 1'. Write a small helper: def dot(x, y): return sum(x[i]*y[i] for i in range(len(x)))."
