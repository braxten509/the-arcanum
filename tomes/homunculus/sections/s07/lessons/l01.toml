[[lessons.exercises]]
id = "s07-l01-e1"
type = "type"
points = 12
reps = 2
code = '''from sentence_transformers import SentenceTransformer
import numpy as np

model = SentenceTransformer("all-MiniLM-L6-v2")

guide = "Use sentence case for headings. Capitalize only the first word and proper nouns."
query = "How should I format my Notion headings?"

guide_vec = model.encode(guide)
query_vec = model.encode(query)

guide_norm = guide_vec / np.linalg.norm(guide_vec)
query_norm = query_vec / np.linalg.norm(query_vec)
sim = np.dot(guide_norm, query_norm)
print("style-guide similarity:", sim.round(4))'''

[[lessons.exercises]]
id = "s07-l01-e2"
type = "mc"
points = 20
prompt = "Per this rite, why can two texts with no shared vocabulary still produce a high cosine similarity (>0.8)?"
choices = [
  "The embedding model was trained to place semantically similar texts near each other in the 384-dimensional vector space — it learned conceptual relationships ('headings' ≈ 'titles,' 'format' ≈ 'style') from billions of sentence pairs, so paraphrases and related concepts produce close vectors even when the exact words differ",
  "The embedding model hashes all words to integers and compares the integer sequences — two texts with the same integer hash sequence produce similarity 1.0 regardless of vocabulary overlap",
  "The cosine similarity formula divides by the vector magnitudes, which cancels out any vocabulary difference — two texts about any topic produce the same similarity as long as they have the same number of words",
  "SentenceTransformers automatically runs the input through a synonym dictionary before encoding — it replaces every word with the closest synonym, so any two texts that roughly describe the same thing produce identical vectors"
]
answer = 0
whyWrong = "Embeddings capture semantic similarity, not keyword overlap — the model was trained on sentence-pair data to learn that different words can mean the same thing. It does not use integer hashing (that would be a bag-of-words model, not an embedding), the cosine formula does not cancel vocabulary differences (different texts produce different vectors with different directions), and there is no synonym dictionary step — the model's weights encode the semantic relationships directly."
hint = "The lesson's FIELD NOTES section explains this: 'The embedding space is a map, not a dictionary — semantic search works because the model was trained to place texts with similar meanings near each other, not because it memorized specific question-answer pairs.' The correct choice names the model's training on sentence pairs as the reason unrelated vocabularies can produce close vectors."
explain = "A keyword-based system would miss the connection between 'headings' and 'titles' because they share no letters. An embedding model captures it because during training, it saw millions of examples where different words appeared in the same semantic context — sentences about headings often also mention titles, captions, and labels. The model's weights encode these co-occurrence patterns into the vector geometry: words that appear in the same contexts get pushed toward similar vector directions."

