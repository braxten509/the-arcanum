[[lessons]]
id = "s07-l01"
teaches = ["embedding-contract"]
title = "Separate What You Sound Like from What You Look Up"
body = '''
<p>The adapter learns relatively stable behavior and voice. External style guidance belongs in retrieval because it can change, can conflict by source, and should remain citeable. Start <code>data/references/sources.jsonl</code> with lawful local notes or short excerpts from authoritative pages—not an untracked scrape of entire websites. Each row names <code>source_id</code>, title, canonical URL, retrieval date, local Markdown path, and a rights/provenance note.</p>
<pre><code>{"source_id":"notion-import","title":"Notion import guidance","url":"https://www.notion.com/help/import-data-into-notion","retrieved_at":"2026-07-13","path":"data/references/notion-import.md","rights_note":"Learner-authored summary with short attributed excerpts"}</code></pre>
<p>Use at least three sources: official Notion guidance for what standard Markdown imports cleanly, plus two writing or visual-style authorities you genuinely want the assistant to consult. In the local Markdown file, preserve headings and write only claims you can trace back to the URL. The retrieval system will cite <code>source_id</code> and URL; it cannot repair invented provenance later.</p>
<p>The pinned embedder is <code>sentence-transformers/all-MiniLM-L6-v2</code>. It maps text to 384-dimensional vectors and has a limited input window, so documents must be chunked before encoding. Use the asymmetric API even though this model may map both through the same underlying prompt: <code>encode_document</code> for stored reference chunks and <code>encode_query</code> for user searches. That makes the document/query roles explicit and lets a later retrieval-specific embedder supply different prompts without rewriting the pipeline.</p>
<pre><code>from sentence_transformers import SentenceTransformer

EMBEDDER_ID = "sentence-transformers/all-MiniLM-L6-v2"
embedder = SentenceTransformer(EMBEDDER_ID)
document_vectors = embedder.encode_document(chunks, convert_to_numpy=True)
query_vector = embedder.encode_query([query], convert_to_numpy=True)</code></pre>
<p>Embeddings rank statistical similarity; they do not certify relevance, truth, recency, or permission to use a source. Those properties live in metadata and in the retrieval test set.</p>
<div class="field-notes"><div class="fn-head">FIELD NOTES // WEIGHTS AND REFERENCES AGE DIFFERENTLY</div>
<p>Your personal voice changes slowly and belongs in the adapter. External style guidance can change tomorrow and belongs in retrieval, with source URL, retrieval date, and local snapshot. This boundary also makes correction affordable: replace a bad reference and rebuild the index without spending another training run or obscuring which claim came from where.</p></div>
'''

[[lessons.readings]]
label = "Sentence-Transformers semantic search"
url = "https://www.sbert.net/examples/sentence_transformer/applications/semantic-search/README.html"

[[lessons.readings]]
label = "Notion import guidance"
url = "https://www.notion.com/help/import-data-into-notion"

[[lessons.exercises]]
id = "s07-l01-e1"
type = "mc"
points = 20
prompt = "Using Section IV's separation between durable personal voice and replaceable source material, why does current external style guidance belong in RAG rather than adapter weights?"
choices = ["It stays updateable, inspectable, and citeable without retraining", "Adapters cannot learn text", "FAISS changes GPU drivers", "Ollama requires URLs in weights"]
answer = 0
whyWrong = "Adapters can learn text; hardware and Ollama impose no such URL rule. The architectural reason is ownership and changeability."
explain = "Retrieval keeps reference knowledge separable from personal voice."
hint = "Ask how a corrected source is updated tomorrow."

[[lessons.exercises]]
id = "s07-l01-e2"
type = "text"
points = 15
prompt = "Which method encodes stored reference chunks?"
answer = "encode_document"
accept = ["embedder.encode_document", "encode_document()"]
hint = "Queries use the paired query method."

[[lessons.exercises]]
id = "s07-l01-e3"
type = "fill"
points = 20
prompt = "Complete the required provenance field containing the canonical web location."
code = '''{"source_id": "notion-import", "____": "https://www.notion.com/help/import-data-into-notion"}'''
answer = "url"
hint = "The final assistant uses it in citations."

[[lessons.exercises]]
id = "s07-l01-e4"
type = "write"
points = 35
prompt = "Select records with every required provenance field and print exactly: VALID 1"
starter = '''rows = [
    {"source_id": "a", "title": "A", "url": "https://a.example", "path": "a.md"},
    {"source_id": "b", "title": "B", "url": "", "path": "b.md"},
]
required = ["source_id", "title", "url", "path"]

valid = []
print(f"VALID {len(valid)}")
'''
solution = '''rows = [
    {"source_id": "a", "title": "A", "url": "https://a.example", "path": "a.md"},
    {"source_id": "b", "title": "B", "url": "", "path": "b.md"},
]
required = ["source_id", "title", "url", "path"]

valid = [row for row in rows if all(row.get(key) for key in required)]
print(f"VALID {len(valid)}")
'''
expect = "VALID 1"
hint = "Keep a row only if row.get(key) is truthy for every required key."
