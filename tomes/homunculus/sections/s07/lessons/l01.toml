[[lessons]]
id = "s07-l01"
title = "The Quintessence of Text"
body = '''
<div class="callout"><strong>How this chapter's exercises work.</strong> The grey code boxes call real ML libraries (<code>sentence-transformers</code>, <code>faiss</code>) — you run those in your own workspace once the toolchain from the first chapter is installed. The <em>write</em> exercises you solve here, in the tome, hand you the numbers those libraries would produce — the vectors, the similarity scores — and ask you for the <strong>logic around them</strong>: compare the scores, pick the closest, map the winner back to its text. That logic is pure Chapter I–II Python (a loop, a comparison, list indexing), which is the part worth drilling — the embedding call itself is one line you already see above.</div>
<p>The binding rite pressed a seam onto the frozen vessel; the proving rite judged whether the seam held. Both rites measured their answers with the same tool: an <strong>embedding</strong> — a dense vector of floating-point numbers that represents what a piece of text means, not just what words it contains. The proving rite's voice-judge lesson (the second lesson of the sixth chapter) introduced <code>sentence-transformers/all-MiniLM-L6-v2</code> for measuring style similarity between the artificer's reference text and the homunculus's output. This rite takes the same tool and applies it to a different problem: given a library of reference texts — online style guides, documentation pages, writing samples — find the ones that matter for a particular query and feed them to the homunculus as evidence. That is the heart of a <strong>grimoire</strong>: a search ritual that maps words to vectors and vectors to retrieved pages.</p>

<p>An embedding model takes a string of text and returns a fixed-size array of floats — 384 floats for the MiniLM model the proving rite introduced, 768 for a larger model like <code>all-mpnet-base-v2</code>. Every array has the same length regardless of input length, because the model compresses the meaning into that fixed-dimensional space. Two texts about the same topic produce vectors that point in roughly the same direction — the angle between them is small. Two texts about unrelated topics produce vectors that point in different directions — the angle is large. The <strong>cosine similarity</strong> the proving rite already defined — the dot product of two unit-length vectors — measures exactly that angle. A cosine of 1.0 means identical direction (same meaning); a cosine near 0 means orthogonal (unrelated); a cosine near -1 means opposite direction (semantically opposed — rare with modern embedding models).</p>

<pre><code><span class="k">from</span> sentence_transformers <span class="k">import</span> SentenceTransformer
<span class="k">import</span> numpy <span class="k">as</span> np

model = SentenceTransformer(<span class="s">"all-MiniLM-L6-v2"</span>)

<span class="c"># Two texts about the same concept — a style guide fragment and a query:</span>
guide = <span class="s">"Use sentence case for headings. Capitalize only the first word and proper nouns."</span>
query = <span class="s">"How should I format my Notion headings?"</span>

guide_vec = model.encode(guide)     <span class="c"># → [0.12, -0.34, …, 0.08]  (384 floats)</span>
query_vec = model.encode(query)

<span class="c"># Cosine similarity — the dot product of two normalized vectors:</span>
guide_norm = guide_vec / np.linalg.norm(guide_vec)
query_norm = query_vec / np.linalg.norm(query_vec)
sim = np.dot(guide_norm, query_norm)
<span class="k">print</span>(<span class="s">"style-guide similarity:"</span>, sim.round(<span class="k">4</span>))</code></pre>

<p>The embedding model itself is a <strong>separate, compact model</strong> — roughly 90 MB for all-MiniLM-L6-v2 — that loads alongside the base vessel without competing for VRAM. It runs on CPU by default and produces one embedding in tens of milliseconds. The artificer does not need to fine-tune it; the pre-trained embedding space already captures the semantic relationships that matter for retrieval — it knows that "headings" and "titles" are related, that "format" and "style" are connected, and that "Notion" is a writing platform, not a mathematical concept. The proving rite proved that this same embedding model can measure whether a generated answer sounds like the artificer; this rite proves that it can also measure whether a reference page is relevant to a query.</p>

<div class="field-notes"><div class="fn-head">FIELD NOTES // THE EMBEDDING SPACE IS A MAP, NOT A DICTIONARY</div>
<p>Semantic search via embeddings works because the model was trained to place texts with similar meanings near each other in the 384-dimensional space — not because it memorized specific question-answer pairs. A style guide about CSS grid and a query about "two-column layouts" will be close in the embedding space even if they share no words, because the model learned that those concepts are semantically related from its training on billions of sentence pairs. This is the deep advantage of embeddings over keyword search: synonyms, paraphrases, and conceptual connections all survive the vector mapping. The disadvantage is that the model's notion of "similar" is a statistical average of its training data, not a definition — two texts about different things that happen to use the same rare vocabulary may end up close in the embedding space even though they are unrelated. The proving rite already warned about surface metrics misleading the judgment; the same caution applies to retrieval — cosine similarity ranks candidates, it does not guarantee relevance.</p></div>
'''
body_words = 530

