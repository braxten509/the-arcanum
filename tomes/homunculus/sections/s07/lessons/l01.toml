[[lessons]]
id = "s07-l01"
title = "The Shelves and the Search"
body = '''
<p>The grimoire is not a pile of embeddings. It is a search ritual with rules: how text is broken into pieces, how those pieces are represented, and how the nearest ones are chosen when the model needs a reference. Bad chunking produces bad retrieval even if the vector store itself is sound.</p>
<div class="field-notes"><div class="fn-head">FIELD NOTES // SEARCH DISCIPLINE</div>
<p>Teach the student to compare naive and grounded answers. The model should not be trusted to remember every source detail from the base; the point of the grimoire is to fetch the right slice on demand and let the answer stand on its own evidence.</p></div>
