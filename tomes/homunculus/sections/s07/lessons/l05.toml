[[lessons]]
id = "s07-l05"
teaches = ["rag-assistant"]
title = "Make the Grimoire a Rebuildable Command"
body = '''
<p>Assemble the preceding functions in <code>src/homunculus/rag.py</code> with two subcommands:</p>
<pre><code>python -m homunculus.rag build
python -m homunculus.rag search "How should a Notion decision note be structured?"</code></pre>
<p><code>build</code> validates <code>sources.jsonl</code>, hashes every local source, chunks it, writes <code>chunks.jsonl</code>, encodes documents, normalizes vectors, writes <code>index.faiss</code>, writes the manifest, reloads everything, and checks the vector/metadata counts. It must fail rather than reuse a stale index when a source hash, embedder id, or chunk parameter changes.</p>
<p><code>search</code> loads only persisted artifacts, checks their hashes against the manifest, encodes and normalizes the query, and prints ranked JSON rows with score, chunk id, source id, heading, text, and URL. It does not call Ollama. That separation lets <code>python -m homunculus.rag evaluate</code> run the fifteen-case retrieval suite and write <code>reports/retrieval.json</code> before generation can hide a bad hit behind fluent prose.</p>
<p>Set the initial acceptance gate before tuning: every source has provenance, index and metadata counts match, no duplicate chunk ids exist, and hit-rate@4 is at least 0.80 on the learner's suite. The numeric gate is a project default, not a universal property of RAG; preserve the per-query failures and improve sources or chunking rather than raising <code>k</code> until everything technically appears.</p>
<p>Open the worst results in the editor. Fix the owner: missing knowledge means add or improve a source summary; truncated rules mean fix chunking; wrong semantic neighbors may justify a better embedder; duplicate top hits mean deduplicate chunks. Record the chosen configuration and failed alternatives in <code>reports/retrieval-review.md</code>.</p>
<div class="field-notes"><div class="fn-head">FIELD NOTES // A RETRIEVAL PASS HAS TWO HALVES</div>
<p>Offline retrieval evaluation asks whether the right source appears in the top results. Served evaluation asks whether the assistant uses that evidence accurately and emits the required citations. Passing only the first leaves generation unproved; passing only the second on hand-picked context leaves the index unproved. Seal both reports with the same RAG manifest hash.</p></div>
'''

[[lessons.readings]]
label = "FAISS index persistence"
url = "https://github.com/facebookresearch/faiss/wiki/Index-IO%2C-cloning-and-hyper-parameter-tuning"

[[lessons.exercises]]
id = "s07-l05-e2"
type = "text"
points = 15
prompt = "Which subcommand is allowed to call Ollama in this section?"
answer = "none"
accept = ["none", "neither", "no subcommand"]
hint = "Generation is deliberately a later serving concern."

[[lessons.exercises]]
id = "s07-l05-e3"
type = "fill"
points = 20
prompt = "Complete the initial retrieval acceptance threshold."
code = "minimum_hit_rate_at_4 = ____"
answer = "0.80"
accept = ["0.8", "0.80", "80%"]
hint = "Twelve of fifteen queries would meet it."

[[lessons.exercises]]
id = "s07-l05-e1"
type = "mc"
points = 20
prompt = "Why does rag search refuse a manifest hash mismatch?"
choices = [
  "It makes the GPU faster",
  "The index and citation metadata may no longer describe the current sources",
  "It retrains Qwen",
  "It changes Notion permissions",
]
answer = 1
whyWrong = "Hash validation protects artifact identity; it does not affect model training, permissions, or hardware speed."
explain = "A stale index can return plausible evidence with false provenance."
hint = "Which physical files did the vectors represent?"

[[lessons.exercises]]
id = "s07-l05-e4"
type = "write"
points = 35
prompt = "Check all three build invariants and print exactly: RAG READY"
starter = '''provenance_complete = True
counts_match = True
duplicate_ids = 0

status = "NOT READY"
print(f"RAG {status}")
'''
solution = '''provenance_complete = True
counts_match = True
duplicate_ids = 0

ready = provenance_complete and counts_match and duplicate_ids == 0
print("RAG READY" if ready else "RAG NOT READY")
'''
expect = "RAG READY"
hint = "All booleans must pass and the duplicate count must be zero."

[[lessons.exercises]]
id = "s07-l05-e5"
type = "mc"
points = 20
prompt = "A reference URL still resolves, but its content has changed since the index was built. Which earlier reproducibility rule detects that the vectors are stale?"
choices = [
  "Compare the frozen content hash and source-manifest hash, then rebuild if either identity differs",
  "Assume a working URL means identical bytes",
  "Increase generation temperature",
  "Rename the FAISS directory",
]
answer = 0
whyWrong = "Reachability, sampling, and filenames do not establish content identity."
explain = "Resolved content hashes connect retrieval artifacts to the exact source bytes they represent."
hint = "A mutable name is not an immutable identity."

[[lessons.exercises]]
id = "s07-l05-e6"
type = "write"
points = 35
prompt = "Debug the stale-index guard: it currently reports READY when a source hash changed. Preserve the supplied manifest and print exactly: STALE source_hash"
starter = '''manifest = {
    "source_hash": "old-source",
    "embedder_id": "all-MiniLM-L6-v2",
    "chunk_tokens": 200,
}
current = {
    "source_hash": "new-source",
    "embedder_id": "all-MiniLM-L6-v2",
    "chunk_tokens": 200,
}

changed = [key for key in manifest if manifest[key] == current[key]]
print("READY" if changed else "STALE " + ", ".join(changed))
'''
solution = '''manifest = {
    "source_hash": "old-source",
    "embedder_id": "all-MiniLM-L6-v2",
    "chunk_tokens": 200,
}
current = {
    "source_hash": "new-source",
    "embedder_id": "all-MiniLM-L6-v2",
    "chunk_tokens": 200,
}

changed = [key for key in manifest if manifest[key] != current[key]]
print("STALE " + ", ".join(changed) if changed else "READY")
'''
expect = "STALE source_hash"
hint = "Inspect both the comparison operator and which branch should run when the mismatch list is nonempty."
