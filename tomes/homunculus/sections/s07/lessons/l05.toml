type = "text"
points = 18
prompt = "Per this rite, what are the three common silent failure modes of a naive RAG retrieval pipeline — the diagnostic problems the FIELD NOTES section names that cause a pipeline to appear correct on one query but fail on the next?"
answer = "wrong chunk size, wrong embedding model, and index contamination"
accept = ["wrong chunk size, wrong embedding model, and index contamination", "wrong chunk size, wrong embedding model, index contamination", "chunk size, embedding model, and index contamination", "wrong chunk size, wrong model, index contamination", "wrong chunk size, wrong embedder, index contamination"]
