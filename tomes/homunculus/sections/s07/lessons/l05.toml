[[lessons.exercises]]
id = "s07-l05-e3"
type = "mc"
points = 20
prompt = "Per this rite, what condition in the reference corpus causes index contamination — the failure mode where the top-3 retrieved chunks all say effectively the same thing?"
choices = [
  "The reference corpus contains near-duplicate chunks — the same style rule appearing in multiple sources creates multiple embeddings with near-identical vectors, which crowd the top-k and displace the actually-different relevant chunks; the fix is corpus deduplication before embedding",
  "The FAISS index has accumulated floating-point rounding errors across multiple add() calls — each addition to the index introduces a small numerical drift that eventually causes the nearest-neighbor search to return random chunks",
  "The embedding model has been fine-tuned on the reference corpus — the model overfits to the specific vocabulary of the reference texts, causing all chunk embeddings to collapse toward the same region of the vector space",
  "The chunk overlap parameter is set too high — chunks with 50% or greater overlap produce vectors so similar that the FAISS index cannot distinguish them, returning all overlapping variants as the top-k"
]
answer = 0
whyWrong = "FAISS exact indexes have no floating-point accumulation error (they search by direct computation, not incremental updates), the embedding model is pre-trained and not fine-tuned on the corpus, and high overlap does produce similar vectors but not to the point of indistinguishability — the index can still rank them by small score differences. The real cause is corpus duplication: the same content appears in multiple chunks (from different sources or from overlapping sections of the same source), and the vector for each copy is nearly identical, so they cluster at the top of every relevant search. Deduplication — checking for chunks with cosine similarity > 0.95 and keeping only one — solves it."
explain = "Index contamination is a data problem, not a numerical one. When one rule appears in three guides, its three chunks embed to near-identical vectors, so a query that matches one matches all three — and they fill the whole top-k, crowding out the different chunk that held the real answer. FAISS is ranking correctly; the fix is upstream: deduplicate near-identical chunks (cosine > 0.95) before they ever enter the index."
hint = "The lesson's FIELD NOTES says 'the reference corpus contains near-duplicate chunks (the same style rule appears in three different guides), and all three fill the top-3 — crowding out the actually-different chunks that might contain the answer.' The correct choice identifies near-duplicate chunks as the contamination source and deduplication as the fix."

