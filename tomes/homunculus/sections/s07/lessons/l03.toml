[[lessons]]
id = "s07-l03"
teaches = ["faiss-index"]
title = "Build an Exact, Persistent Cosine Index"
body = '''
<p>For a personal shelf of hundreds or a few thousand chunks, exact search is fast enough and easier to reason about than an approximate index. Encode all chunk texts with <code>encode_document</code>, convert to contiguous float32, normalize every row, and add them to <code>faiss.IndexFlatIP</code>. Inner product over unit vectors is cosine similarity.</p>
<pre><code>import faiss
import numpy as np

vectors = embedder.encode_document(
    [chunk["text"] for chunk in chunks], convert_to_numpy=True)
vectors = np.ascontiguousarray(vectors, dtype="float32")
faiss.normalize_L2(vectors)
index = faiss.IndexFlatIP(vectors.shape[1])
index.add(vectors)

Path("artifacts/rag").mkdir(parents=True, exist_ok=True)
faiss.write_index(index, "artifacts/rag/index.faiss")</code></pre>
<p>Persist <code>chunks.jsonl</code> in exactly the same order as vectors are added. A returned integer id is an array position, so reordering metadata without rebuilding the index creates convincing but false citations. Write <code>artifacts/rag/manifest.json</code> with embedder id and revision if available, dimension, chunk settings, source-file hashes, chunk-file hash, vector count, and index hash.</p>
<p>Round-trip the artifact immediately: load the FAISS index from disk, reload the JSONL, and assert <code>index.ntotal == len(chunks)</code> and <code>index.d</code> matches the manifest. Run a query only after those invariants pass. The final assistant should load these persisted files at startup; rebuilding the entire shelf for every question wastes time and makes results depend on whatever source files happen to exist that moment.</p>
<p>Normalization is not optional. Without it, vector magnitude influences inner product, so the ranking is not cosine similarity even if the code comments call it cosine. Normalize stored documents once and every query before search.</p>
<div class="field-notes"><div class="fn-head">FIELD NOTES // ORDER IS PART OF THE INDEX</div>
<p>FAISS stores vectors, not your citation objects. The metadata list must remain in the exact same order as insertion, and its manifest must hash the embedder, chunk settings, source snapshots, vector count, and dimensions. Normalize both document and query vectors before inner-product search when cosine ranking is the intended metric.</p></div>
'''

[[lessons.readings]]
label = "FAISS index types"
url = "https://github.com/facebookresearch/faiss/wiki/Faiss-indexes"

[[lessons.exercises]]
id = "s07-l03-e1"
type = "mc"
points = 20
prompt = "When does IndexFlatIP implement cosine ranking?"
choices = ["When stored vectors and queries are L2-normalized", "Whenever vectors are float64", "Only on GPU", "When k equals one"]
answer = 0
whyWrong = "Precision, device, and k do not remove vector magnitude from inner product."
explain = "Unit-length vectors make inner product equal cosine similarity."
hint = "Cosine divides by both magnitudes."

[[lessons.exercises]]
id = "s07-l03-e2"
type = "text"
points = 15
prompt = "Which file preserves vector-to-citation metadata order?"
answer = "artifacts/rag/chunks.jsonl"
accept = ["chunks.jsonl", "artifacts/rag/chunks.jsonl"]
hint = "The index itself stores vectors, not source URLs."

[[lessons.exercises]]
id = "s07-l03-e3"
type = "fill"
points = 20
prompt = "Complete the FAISS normalization call."
code = "faiss.____(vectors)"
answer = "normalize_L2"
hint = "It changes every row to unit L2 length."

[[lessons.exercises]]
id = "s07-l03-e4"
type = "write"
points = 35
prompt = "Reuse Section III's <code>bytes_per_element</code> ledger while checking index and metadata counts; print exactly: INDEX OK 42"
starter = '''index_total = 42
metadata_count = 42
dimensions = 384
bytes_per_element = 4

status = "BAD"
print(f"INDEX {status} {index_total}")
'''
solution = '''index_total = 42
metadata_count = 42
dimensions = 384
bytes_per_element = 4

vector_bytes = index_total * dimensions * bytes_per_element
status = "OK" if index_total == metadata_count and vector_bytes > 0 else "BAD"
print(f"INDEX {status} {index_total}")
'''
expect = "INDEX OK 42"
hint = "The two counts must be equal."
