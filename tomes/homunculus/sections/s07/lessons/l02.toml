[[lessons]]
id = "s07-l02"
teaches = ["reference-chunking"]
title = "Cut Citeable Chunks Within the Embedder Window"
body = '''
<p>Chunk boundaries should preserve meaning and provenance. Split a source by Markdown headings first, then apply a token window only when a section is too long. For MiniLM, use a conservative <code>chunk_tokens=200</code> with <code>overlap_tokens=30</code>, below its 256-token input limit. A 512-token chunk would be silently truncated by this embedder and could lose the sentence you thought was indexed.</p>
<pre><code>from transformers import AutoTokenizer

tokenizer = AutoTokenizer.from_pretrained(
    "sentence-transformers/all-MiniLM-L6-v2")

def token_windows(text, size=200, overlap=30):
    token_ids = tokenizer.encode(text, add_special_tokens=False)
    chunks = []
    step = size - overlap
    for start in range(0, len(token_ids), step):
        window = token_ids[start:start + size]
        if not window:
            break
        chunks.append(tokenizer.decode(window, skip_special_tokens=True))
        if start + size >= len(token_ids):
            break
    return chunks</code></pre>
<p>Every chunk record needs its text plus <code>chunk_id</code>, <code>source_id</code>, URL, local path, heading, ordinal, and source-file hash. Derive the id from stable metadata, for example <code>source_id:heading-slug:0003</code>. Do not cite a naked vector index such as “chunk 47”; its meaning changes after a rebuild.</p>
<p>Normalize whitespace but do not strip Markdown structure that helps the answer. Avoid splitting code fences and tables mid-row. For the Notion delivery use case, prefer self-contained rules: a chunk should say both what to do and when it applies. Overlap protects boundary sentences, but too much overlap creates near-duplicates that can occupy every top result. Inspect the generated <code>artifacts/rag/chunks.jsonl</code> before embedding and reject empty, truncated, duplicate, or provenance-free rows.</p>
<p>Chunk size is evaluated, not worshipped. Add known queries with expected source ids; if the relevant rule is consistently buried or truncated, revise heading parsing or window size and rebuild under a new manifest.</p>
<div class="field-notes"><div class="fn-head">FIELD NOTES // CHUNKS MUST FIT THE EMBEDDER</div>
<p>Chunk length is constrained by the embedding model's real input window, not by the language model's context length. Tokenize before splitting, preserve heading and source metadata on every chunk, and use overlap only to protect boundary meaning. Oversized chunks can be silently truncated, producing a valid-looking index whose later paragraphs were never represented.</p></div>
'''

[[lessons.readings]]
label = "MiniLM model card"
url = "https://huggingface.co/sentence-transformers/all-MiniLM-L6-v2"

[[lessons.exercises]]
id = "s07-l02-e1"
type = "mc"
points = 20
prompt = "Why is 512 tokens an invalid default for this embedder?"
choices = ["MiniLM's input window is 256 tokens, so later content may be truncated", "FAISS permits only 200 vectors", "Ollama rejects long Markdown", "URLs use 312 tokens"]
answer = 0
whyWrong = "FAISS vector count, Ollama, and URL length do not define the embedding model's input window."
explain = "Chunks must fit the component that encodes them."
hint = "Read the embedder's maximum sequence length."

[[lessons.exercises]]
id = "s07-l02-e2"
type = "text"
points = 15
prompt = "What token overlap does the course start with?"
answer = "30"
accept = ["30 tokens", "30"]
hint = "It is passed beside the 200-token size."

[[lessons.exercises]]
id = "s07-l02-e3"
type = "fill"
points = 20
prompt = "Complete the non-overlapping advance between windows."
code = "step = size - ____"
answer = "overlap"
hint = "Each next window repeats exactly the overlap."

[[lessons.exercises]]
id = "s07-l02-e4"
type = "write"
points = 35
prompt = "Compute the step and print exactly: STEP 170"
starter = '''size = 200
overlap = 30

step = 0
print(f"STEP {step}")
'''
solution = '''size = 200
overlap = 30

step = size - overlap
print(f"STEP {step}")
'''
expect = "STEP 170"
hint = "Subtract repeated tokens from total window size."
