[[lessons]]
id = "s07-l02"
title = "The Grimoire's Pages"
body = '''
<p>The third rite of this chapter taught the embedding — a map from text to a point in a 384-dimensional space. The fourth rite teaches how to break the reference texts into pieces small enough to embed and retrieve independently. An embedding model turns text into a fixed-size vector, but it cannot turn an entire style guide — ten thousand words of CSS rules, formatting conventions, and layout patterns — into a single meaningful vector. The vector that tries to compress a whole book into 384 floats loses every detail; the vector that encodes a single sentence captures one idea with high fidelity. The solution is <strong>chunking</strong>: splitting each reference document into overlapping slices, embedding each slice independently, and retrieving the specific slices that match a query.</p>

<p>A chunk is defined by two numbers: <strong>size</strong> (how many tokens or characters per slice) and <strong>overlap</strong> (how many tokens the adjacent slices share). The size controls the tradeoff between precision and context. A small chunk — 128 tokens, roughly two or three sentences — captures a single idea cleanly. The embedding is focused, and a query about "heading font sizes" will retrieve exactly the chunk that says "Use 24px for headings" and nothing else. But a small chunk may lack the context that makes the idea useful — the chunk says "use 24px" but does not say whether that's for an H1, an H2, or all headings, because that distinction appeared two sentences earlier in the original text and the chunk boundary cut it off.</p>

<p>A large chunk — 512 tokens, roughly a long paragraph — preserves the surrounding context. The embedding captures that "24px for H1, 20px for H2, 16px for body" is a hierarchy, not three unrelated numbers. But a large chunk is noisy: a query about "heading font sizes" retrieves a chunk that also contains material about line spacing, margin widths, and color contrast — information the homunculus does not need and that may distract it from the answer it is supposed to ground in the reference. The chunk-embedding model also averages the meaning across all the words in the chunk, and a 512-token average dilutes the specific signal the query was looking for.</p>

<p><strong>Overlap</strong> is the hedge against the boundary problem. If the artificer splits a style guide into 256-token chunks with zero overlap, a sentence that falls exactly on the boundary between chunk 3 and chunk 4 may be split across both — half the rule in one chunk, half in the other, neither usable. An overlap of 32 tokens (roughly one sentence) means the last sentence of chunk 3 also appears as the first sentence of chunk 4 — a guarantee that no single sentence is eviscerated by a cut. The cost is storage: an overlap of 32 tokens on 256-token chunks increases the total number of chunks by roughly 14% — a small overhead in exchange for retrieval that never loses a sentence to a boundary.</p>

<pre><code><span class="k">def</span> <span class="nf">chunk_text</span>(text, chunk_tokens=<span class="k">256</span>, overlap_tokens=<span class="k">32</span>):
    <span class="s">"""Split text into overlapping chunks by token count."""</span>
    tokens = tokenizer.encode(text)
    chunks = []
    start = <span class="k">0</span>
    <span class="k">while</span> start &lt; <span class="k">len</span>(tokens) - overlap_tokens:
        end = <span class="k">min</span>(start + chunk_tokens, <span class="k">len</span>(tokens))
        chunk = tokenizer.decode(tokens[start:end], skip_special_tokens=<span class="k">True</span>)
        chunks.append(chunk)
        start += (chunk_tokens - overlap_tokens)  <span class="c"># advance by the non-overlapping step</span>
    <span class="k">return</span> chunks</code></pre>

<p>The tokenizer used for chunking should match the embedding model's tokenizer — the splitting logic must count tokens the same way the embedder will read them, or the "256-token" chunk may actually be 230 tokens (if the embedder's tokenizer compresses differently). For <code>all-MiniLM-L6-v2</code>, <code>AutoTokenizer.from_pretrained("all-MiniLM-L6-v2")</code> returns the correct tokenizer — the same library the sixth rite taught for chat-template formatting, now applied to text splitting instead of instruction/response assembly.</p>

<div class="field-notes"><div class="fn-head">FIELD NOTES // CHUNK SIZE IS A RETRIEVAL KNOB, NOT A FIXED CONSTANT</div>
<p>The proving rite taught the artificer to sweep hyperparameters (rank, alpha, learning rate) because the best value depends on the data. Chunk size is the same kind of knob — a retrieval hyperparameter. A corpus of dense technical documentation (API references, formal specifications) benefits from larger chunks (384–512 tokens), because a single API description is self-contained and splitting it across multiple chunks fragments the signature from its explanation. A corpus of inline style rules (one- or two-sentence formatting commands) benefits from smaller chunks (128–256 tokens), because each rule is self-contained and neighboring rules are often unrelated — bundling them into a large chunk dilutes the retrieval signal. The artificer should treat chunk size as a tuning parameter, not a default — try 128, 256, and 384 on the actual reference corpus, retrieve on a handful of known-good queries, and read the top-3 results. If the top chunk contains the right answer, the size is working; if the right answer is buried in chunk 7, the size is wrong.</p></div>
'''
body_words = 550

