[[lessons.exercises]]
id = "s07-l02-e1"
type = "mc"
points = 20
prompt = "Per this rite, what is the specific failure mode of using chunks that are too small (e.g., 64 tokens) for a style guide that describes hierarchical heading rules across multiple sentences?"
choices = [
  "The embedding model cannot encode chunks shorter than 128 tokens — the SentenceTransformer library raises a ValueError when encode() receives a string with fewer than 128 tokens",
  "The FAISS index cannot store vectors from chunks shorter than 128 tokens — the index requires all vectors to have the same dimensionality, and short texts produce shorter vectors from the embedding model",
  "Small chunks produce embeddings with higher cosine similarity scores across unrelated topics because the vector has fewer dimensions to encode meaning — a 64-token embedding is mathematically noisier than a 256-token embedding",
  "The chunk loses the surrounding context that connects a specific value (e.g. '24px') to the heading level it applies to (e.g. 'for H1 only') — that distinction appeared in the previous sentence, but the chunk boundary severed it, making the retrieved chunk factually incomplete"
]
answer = 3
whyWrong = "The embedding model always outputs a fixed 384-dim vector regardless of input length — it does not reject short texts, produce shorter vectors, or become mathematically noisier (the fixed-dim compression handles short texts fine). The real failure is context loss: a chunk that cuts a sentence boundary loses the relationship between the claimed value and the condition it depends on, producing a retrieved fact that is technically correct but practically useless because the qualification is missing."
hint = "The lesson's second paragraph says a small chunk 'may lack the context that makes the idea useful — the chunk says use 24px but does not say whether that's for an H1, an H2, or all headings, because that distinction appeared two sentences earlier and the chunk boundary cut it off.' The correct choice names this context-severing problem."
explain = "Chunk boundaries are arbitrary cuts through continuous text — they don't respect paragraph structure, section breaks, or semantic units unless the chunker is explicitly designed to do so. When a rule spans two sentences ('Use 24px for H1. Use 20px for H2.') and the chunk cut falls between those sentences, the second chunk contains 'Use 20px for H2' but the reader no longer knows what 'H2' is relative to — the context that established the heading hierarchy was in the previous chunk."

