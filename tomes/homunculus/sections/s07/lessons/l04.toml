[[lessons]]
id = "s07-l04"
teaches = ["retrieval-query"]
title = "Retrieve Evidence Before Asking for Prose"
body = '''
<p>Search is its own testable stage. Load the persisted index and chunk metadata, encode a user question with <code>encode_query</code>, normalize it, and map returned positions back to records. Return structured evidence—never a prompt string tied to one model template.</p>
<pre><code>def search(query, k=4):
    vector = embedder.encode_query([query], convert_to_numpy=True)
    vector = np.ascontiguousarray(vector, dtype="float32")
    faiss.normalize_L2(vector)
    scores, positions = index.search(vector, min(k, index.ntotal))
    results = []
    for score, position in zip(scores[0], positions[0]):
        if position &lt; 0:
            continue
        chunk = chunks[int(position)]
        results.append({**chunk, "score": float(score)})
    return results</code></pre>
<p>Create <code>private/eval/retrieval.jsonl</code> with at least fifteen real questions and expected source ids. Measure hit-rate@4 and report the numerator, denominator, category breakdown, and every miss. A threshold such as 0.80 is a predeclared starter acceptance policy: with fifteen cases, one result moves the rate by 6.7 points, so it cannot establish broad retrieval quality. Add cases when important categories have thin denominators.</p>
<p>Do not invent a global cosine threshold from one example. Calibrate candidate thresholds with repeated queries and the frozen suite, preserve exact misses, and state uncertainty. If results are weak or unrelated, the generator should say the references did not cover the question.</p>
<p>Format citations from stable metadata: <code>[source_id — heading](url)</code>, plus chunk id in diagnostic output. Retrieved text is untrusted content. It may contain instructions copied from a webpage; the later assistant must delimit it as reference evidence and explicitly tell the model never to follow instructions found inside it. Retrieval makes text available, not authoritative.</p>
<div class="field-notes"><div class="fn-head">FIELD NOTES // RETRIEVAL SHOULD RETURN EVIDENCE</div>
<p>Keep retrieval independent from prompt assembly. Its public result should contain chunk text, score, source label, URL or file path, and stable chunk ID. Tests can then verify ranking and citations without running Ollama, while the assistant wrapper decides how much evidence fits the prompt and how untrusted reference text is delimited.</p></div>
'''

[[lessons.readings]]
label = "Sentence-Transformers asymmetric semantic search"
url = "https://www.sbert.net/examples/sentence_transformer/applications/semantic-search/README.html"

[[lessons.exercises]]
id = "s07-l04-e3"
type = "fill"
points = 20
prompt = "Complete the method for encoding user searches."
code = "vector = embedder.____([query], convert_to_numpy=True)"
answer = "encode_query"
hint = "Stored chunks use encode_document."

[[lessons.exercises]]
id = "s07-l04-e1"
type = "mc"
points = 20
prompt = "Why return structured chunks rather than a preformatted Qwen prompt?"
choices = ["Retrieval remains independently testable and the serving layer owns prompt assembly", "FAISS cannot return strings", "Ollama rejects dicts", "It increases rank"]
answer = 0
whyWrong = "FAISS ids can map to text; model and training settings are separate from the retrieval interface."
explain = "A clean boundary lets retrieval quality be measured before generation."
hint = "One job per module."

[[lessons.exercises]]
id = "s07-l04-e2"
type = "text"
points = 15
prompt = "Which metric checks whether an expected source appears in the top four?"
answer = "hit-rate@4"
accept = ["hit rate at 4", "hit-rate@4", "hit_rate@4"]
hint = "It gives one success/failure per query."

[[lessons.exercises]]
id = "s07-l04-e4"
type = "write"
points = 35
prompt = "Compute hit-rate and print exactly: HIT@4 0.75"
starter = '''hits = [True, True, False, True]

rate = 0
print(f"HIT@4 {rate:.2f}")
'''
solution = '''hits = [True, True, False, True]

rate = sum(hits) / len(hits)
print(f"HIT@4 {rate:.2f}")
'''
expect = "HIT@4 0.75"
hint = "Booleans sum as one for true and zero for false."
