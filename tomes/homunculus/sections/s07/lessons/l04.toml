answer = "apply_chat_template"
accept = ["apply_chat_template"]
hint = "This method was introduced in the sixth rite's lesson on chat templates (s04-l02) and has appeared in both the fill exercise s04-l02-e3 and the SFTTrainer scaffold lesson. It converts role/content dictionaries into the base model's native chat format — ChatML for Llama, Mistral format for Mistral bases."

[[lessons.exercises]]
id = "s07-l04-e4"
type = "mc"
points = 20
prompt = "Per this rite, what is the practical diagnostic for determining whether a retrieval pipeline's top-k value is working correctly?"
choices = [
  "If the FAISS search returns in under 10 milliseconds — search speed is the primary indicator of retrieval quality because a slow search means the index is fragmented and producing partial results",
  "If the cosine similarity score of the top-1 chunk exceeds 0.9 — a high similarity score guarantees the chunk contains the right answer, and any score below 0.9 indicates the retrieval step failed regardless of what the chunk actually says",
  "The right reference material appears in the top-k chunks — the artificer should test with known-good queries and read the retrieved text with human eyes, incrementing k until the relevant passages appear; high similarity scores or fast search speeds are secondary signals that don't prove the chunks contain the answer",
  "If k equals the square root of the total number of chunks — this is the mathematically optimal k for any retrieval task because it balances precision (k small) against recall (k large)"
]
answer = 2
whyWrong = "Search speed is a performance metric, not a quality metric — a fast search returning wrong chunks is still wrong. Cosine similarity is a ranking signal, not a relevance proof — a chunk at 0.95 cosine may be lexically similar but factually wrong (as the proving rite already warned about surface-metric traps). There is no mathematical rule tying k to sqrt(n) — it depends on the corpus density and the query type. The correct diagnostic is human judgment: retrieve the chunks, read them, and decide whether they contain the answer."
hint = "The lesson says 'try k=1, k=3, and k=5 on a handful of real queries, retrieve the chunks, and read whether the right reference material appears in the top-k.' The correct choice identifies direct human inspection of the retrieved content as the diagnostic."
explain = "RAG retrieval is an information-retrieval task, and retrieval quality is ultimately measured by whether the right information is in the result set — not by speed, similarity scores, or mathematical heuristics. Cosine similarity and search speed are useful signals for tuning (high similarity + wrong content = the embedding model is the problem; fast search + wrong content = the reference corpus or chunking is the problem), but the ground truth is the chunk text itself. The proving rite's habit of reading actual output (not just numbers) applies here: read the chunks."

