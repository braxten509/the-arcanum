[[lessons.exercises]]
id = "s07-l04-e3"
type = "fill"
points = 20
prompt = "Fill the missing method in the RAG prompt builder from the lesson — the Hugging Face tokenizer method that converts a list of role/content message dictionaries into the base model's expected chat format, which the sixth rite's template lesson taught."
code = '''def build_rag_prompt(query, retrieved_chunks, tokenizer):
    context = "\n\n".join(
        "<reference id=" + str(i+1) + ">" + chunk + "</reference>"
        for i, chunk in enumerate(retrieved_chunks)
    )
