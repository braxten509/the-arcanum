[[lessons.exercises]]
id = "s07-l04-e1"
type = "mc"
points = 20
prompt = "Per this rite, why is a bad generated answer not necessarily a generation-model failure?"
choices = [
  "The chat template's special tokens overlap with the reference text delimiters — the tokenizer merges <reference> into the model's control tokens, causing the model to interpret reference chunks as system instructions rather than source material",
  "The generation model's temperature parameter interacts with the embedding similarity scores — a high temperature scrambles the context tokens before the model reads them, making even correctly retrieved chunks appear as noise",
  "The FAISS index degrades over time as more vectors are added — an index that was accurate at 200 chunks may produce random results at 2,000 chunks because the inner product computation accumulates floating-point error",
  "The generation model may have received bad retrieval context — if the retrieved chunks don't cover the question, the model's only source of grounding is irrelevant or contradictory material; the failure may be in the retrieval step (wrong chunks) rather than the generation step (wrong model), and re-running with better chunks is cheaper than retraining"
]
answer = 3
whyWrong = "Temperature does not scramble context tokens (it only affects token sampling during generation, not the prompt the model receives), FAISS index accuracy does not degrade with size (exact search is exact at any n), and special tokens do not merge with reference delimiters (the tokenizer treats <reference> as plain text, not a control token). The real diagnostic: 'a bad answer may be a retrieval failure, not a generation failure' — the generation step is downstream of retrieval, and the model can only answer from the chunks it was given. Blaming the model for bad context is like blaming the binding rite for a bad dataset — the fault is upstream."
hint = "The lesson says 'a bad answer may be a retrieval failure, not a generation failure — and re-running the generation step with different context is cheaper than retraining the model.' The correct choice identifies the upstream retrieval quality as the possible root cause."
explain = "In RAG, the generation model's answer is bounded by the context it receives. If the retrieval step returns chunks about color palettes when the query is about font sizes, the generation model has two options: produce a wrong answer based on the wrong context, or refuse to answer because the context is irrelevant. Either way, the fix is in the retrieval pipeline (better chunks, better embeddings, better k), not in the generation model itself. Diagnosing whether the failure is retrieval or generation is a core RAG debugging skill."

