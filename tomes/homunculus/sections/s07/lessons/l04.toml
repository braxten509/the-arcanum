[[lessons]]
id = "s07-l04"
title = "The Search Ritual"
body = '''
<p>Three rites built the grimoire's machinery piece by piece — the embedding (a map from text to vector), the chunker (a way to split references into slices), and the index (a structure that finds the nearest stored vectors to a query). This rite assembles those three pieces into a single <strong>retrieval pipeline</strong>: the sequence of steps that takes a question, consults the reference shelf, and returns the evidence the homunculus needs to ground its answer. The pipeline has four stages: embed the query, search the index, retrieve the top-k chunks, and format them as context for the generation model. Every stage except the last is a machine operation — the first three rites already taught them in isolation. The fourth stage is where the artificer's judgment enters: how many chunks to retrieve, how to delimit them, and where in the prompt template to insert them.</p>

<p><strong>Top-k</strong> — the number of chunks to retrieve — is the pipeline's simplest and most load-bearing knob. k=1 retrieves the single closest chunk — precise but fragile. If the single best chunk missed a relevant detail that was in the second-best chunk, the homunculus answers from incomplete evidence. k=5 retrieves the five closest chunks — comprehensive but noisy. The homunculus must now read through five paragraphs of reference material to find the relevant sentence, adding tokens to its context window and diluting the signal. For a personal reference shelf of a few hundred style-guide chunks, k=3 is a practical default: enough coverage to survive one noisy top hit (the chunk that is lexically similar but semantically off-target), not so much coverage that the context becomes a wall of text the model treats as background noise. The proving rite taught the artificer to sweep hyperparameters and evaluate the results — the same habit applies here: try k=1, k=3, and k=5 on a handful of real queries, retrieve the chunks, and read whether the right reference material appears in the top-k for each query.</p>

<p><strong>Formatting</strong> the retrieved chunks for the homunculus requires the same discipline the sixth rite's chat-template lesson drilled: the context must match the base vessel's expected prompt structure, and every chunk must carry a source marker so the artificer can trace which reference the answer drew from. The simplest format wraps each chunk in a <code>&lt;reference&gt;</code> block with a chunk number — the homunculus reads it as "here is what the grimoire found; answer using this material." The prompt template the sixth rite taught — ChatML for Llama-based vessels, the Mistral format for Mistral bases — stays the same; the only addition is a block of reference text inserted into the system prompt or the user message, depending on where the base model expects context to appear.</p>

<pre><code><span class="k">def</span> <span class="nf">build_rag_prompt</span>(query, retrieved_chunks, tokenizer):
    <span class="s">"""Wrap the query and retrieved context in the base model's chat template."""</span>
    context = <span class="s">"\n\n"</span>.join(
        <span class="s">"&lt;reference id=</span><span class="k">"</span> + <span class="k">str</span>(i+<span class="k">1</span>) + <span class="k">"</span><span class="s">>"
</span>        + chunk
        + <span class="s">"&lt;/reference&gt;"</span>
        <span class="k">for</span> i, chunk <span class="k">in</span> <span class="nb">enumerate</span>(retrieved_chunks)
    )
    system_msg = (
        <span class="s">"You are a style assistant. Answer using the reference material below. "</span>
        <span class="s">"If the references don't cover the question, say so."</span>
    )
    messages = [
        {<span class="s">"role"</span>: <span class="s">"system"</span>, <span class="s">"content"</span>: system_msg + <span class="s">"\n\n"</span> + context},
        {<span class="s">"role"</span>: <span class="s">"user"</span>, <span class="s">"content"</span>: query},
    ]
    <span class="k">return</span> tokenizer.apply_chat_template(messages, tokenize=<span class="k">False</span>)</code></pre>

<p>The retrieval pipeline does not generate the answer — that is the base vessel's job once the context is inserted. The pipeline's output is a prompt: the user's question plus the retrieved reference chunks, formatted so the model treats the chunks as authoritative source material. The distinction is load-bearing: the retrieval step <strong>finds</strong> relevant information, and the generation step <strong>uses</strong> it to produce an answer. A retrieval pipeline that produces bad context — chunks that don't cover the question, or chunks that contradict each other — cannot be rescued by a good generation model, because the model's only source of grounding is the context it was given. The proving rite's evaluation habit applies again: measure the quality of the retrieved context separately from the quality of the generated answer. A bad answer may be a retrieval failure, not a generation failure — and re-running the generation step with different context is cheaper than retraining the model.</p>

<div class="field-notes"><div class="fn-head">FIELD NOTES // RETRIEVAL WITHOUT A GENERATOR — THE STANDALONE TEST</div>
<p>The quickest way to debug a retrieval pipeline is to run it without a generation model: embed a query, search the index, and print the top-k chunks alongside their similarity scores. Read the chunks with human eyes. If the top-3 chunks for "what font size for headings?" are about color palettes and line spacing, the embedding model is retrieving on lexical similarity (the query contains the word "for" twice, which matches chunks with high "for" frequency) rather than semantic similarity — and the fix is not a better generation model but a better embedding model or better chunk boundaries. If the top-3 chunks all come from the same section of the reference material and cover the same subtopic, the corpus is over-representing that section — and the fix is better chunk curation, not a different k value. The sixth rite's curation discipline (hold out records, inspect the data before training) is the same habit applied to the retrieval shelf: inspect the retrieved chunks before trusting the generated answers they produce.</p></div>
'''
body_words = 570

