[freestyle]
requires = ["python-craft", "embedding-contract", "reference-chunking", "faiss-index", "retrieval-query", "rag-assistant"]
title = "THE WORKING: BUILD THE CITEABLE GRIMOIRE"
brief = '''Extend <code>Homunculus/</code> with at least three provenance-backed style references, persistent RAG artifacts, and build/search/evaluate commands.<ul><li>Use learner-authored summaries or lawful excerpts with source id, canonical URL, retrieval date, local path, rights note, and source hash.</li><li>Chunk by Markdown structure, then 200-token windows with 30-token overlap; preserve stable chunk-level citations.</li><li>Use encode_document/encode_query, float32 L2 normalization, and exact IndexFlatIP cosine search.</li><li>Persist and round-trip index, ordered metadata, and a manifest; refuse stale hashes.</li><li>Pass at least fifteen expected-source queries at hit-rate@4 ≥ 0.80 and manually inspect every miss.</li><li>From the root run <code>python -m compileall -q src tests</code>, <code>python -m homunculus.rag build</code>, <code>python -m homunculus.rag search "How should a Notion decision note be structured?"</code>, and <code>python -m homunculus.rag evaluate</code>.</li><li>Keep retrieval code to the Section I Python naming and layout contract.</li></ul>Diagnose a failure by its owner—source, chunk, vector/metadata order, stale manifest, or ranking—before rebuilding. Retrieval remains independent of generation so fluent output cannot conceal irrelevant evidence.'''
reward = 240
xray = "Reject whole-page embeddings, 512-token MiniLM chunks, unnormalized inner products called cosine, vector ids without stable citations, indexes rebuilt per query, or source text without provenance."

[freestyle.badge]
id = "s07-badge"
name = "THE GRIMOIRE"
desc = "Awarded for a persistent, measured, citeable reference shelf."

[[freestyle.rubric]]
criterion = "Provenance and chunking"
weight = 30
desc = "Every self-contained chunk fits the embedder window and maps to a lawful, hash-tracked source."

[[freestyle.rubric]]
criterion = "Exact persistent retrieval"
weight = 30
desc = "Normalized document/query vectors, IndexFlatIP, ordered metadata, manifests, and round-trip checks agree."

[[freestyle.rubric]]
criterion = "Measured relevance"
weight = 30
desc = "The frozen retrieval suite passes its gate and failures are diagnosed at the owning layer."

[[freestyle.rubric]]
criterion = "Python craft"
weight = 10
desc = "rag.py uses snake_case names, UPPER_CASE model constants, four-space indentation, grouped imports, and separate functions for chunking, persistence, search, and evaluation."
