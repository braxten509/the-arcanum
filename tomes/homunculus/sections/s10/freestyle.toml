[freestyle]
title = "THE WORKING: KEEP THE FAMILIAR ALIVE"
brief = "Assemble the full living pipeline from the twelfth rite: a versioned cabinet run log, a re-distillation trigger, a drift monitor, an architecture audit, and <code>pipeline.py</code> that chains every prior rite end to end. Show that a cold start — delete every artefact except raw export + reference corpus + pipeline — rebuilds the familiar to the same held-out Jaccard score."
reward = 300
xray = "The grader punishes any artefact path that depends on a filename not derived from the cabinet convention (run_date must be the sole key, as the l01 lesson requires). It punishes a defence that makes a claim without a concrete number from a prior rite's evaluation (l04 — every assertion must be backed by a score, a GB count, or a rank-vs-fidelity delta, not an impression). It punishes a cold-start test that passes only because a cached GGUF was left on disk (l05 — the FIELD NOTES require deleting everything but the export, the corpus, and pipeline.py). It rewards a RUNS.md that records the eval score, the verdict, and the exact quant string — not just 'q4_k_m' in prose, but as a field the next function can read."

[freestyle.badge]
id = "s10-badge"
name = "LIVING FAMILIAR"
desc = "Awarded for owning the whole pipeline."

[[freestyle.rubric]]
criterion = "Architecture audit — defence of the full design"
weight = 30
desc = "The defence document (l04) covers base model, quant level, LoRA config, RAG-vs-weights assignment, and ward configuration. Every claim is backed by a concrete number from a prior rite's evaluation (held-out Jaccard score, budget-GB figure, rank-vs-fidelity gap from l04-e5's runner-up comparison, or a refusal-rate threshold from the tenth rite). Impressions ('sounded better') without numeric evidence lose points. The base-model choice must name the specific model and the numeric score that justified it over the nearest alternative."

[[freestyle.rubric]]
criterion = "Versioned cabinet & run logging"
weight = 25
desc = "Artifacts use the date-prefixed convention from l01 (adapters/{date}_rank-{rank}_lr-{lr}, datasets/{date}_{count}_records.jsonl). RUNS.md records each run with at minimum: date, base model name, exact quant string (q4_k_m, not '4-bit'), adapter path, eval score, and a one-line verdict. A run log that records only the verdict without the quant string or eval score — or one that buries these in freeform prose with no consistent field names — is incomplete."

[[freestyle.rubric]]
criterion = "Re-distillation trigger & drift monitoring"
weight = 25
desc = "The trigger (l02) checks both corpus growth (net-new notes >= a stated threshold) and quality regression (held-out Jaccard drop versus the frozen baseline >= a stated threshold). The drift monitor (l03) distinguishes corpus drift from config drift and records the current eval score alongside the baseline it was compared against. Both the corpus threshold and the regression threshold must be numeric constants stated in RUNS.md, not hardcoded only in the code — so a future artificer can adjust them without reading the source."

[[freestyle.rubric]]
criterion = "Style & craft — Python conventions and cold-start reproducibility"
weight = 20
desc = "All Python follows PEP 8: snake_case functions, 4-space indent, no mutable globals, docstrings on each pipeline function naming its inputs/outputs (especially the run_date convention from l05). The cold-start test from l05's FIELD NOTES must actually run — delete every artefact except the raw export directory, reference corpus, and pipeline.py, and verify the pipeline rebuilds the familiar without errors. A pipeline that succeeds only because a cached adapter, GGUF, or FAISS index from a previous run was left on disk fails this criterion."
