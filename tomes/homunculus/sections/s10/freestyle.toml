[freestyle]
requires = ["python-craft", "project-doctor", "dataset-curation", "rocm-training", "merge-gate", "faiss-index", "policy-decision", "served-verification", "run-manifest", "retrain-trigger", "drift-monitor", "architecture-defense", "pipeline-orchestration", "tool-deliver"]
title = "THE WORKING: PROVE THE LIVING HOMUNCULUS"
brief = '''Finish the commission as a maintainable, privacy-bounded product.<ul><li>Implement immutable run/release manifests, component-aware rebuild planning, timestamped monitoring, and exact argument-array orchestration.</li><li>Defend ownership: voice in the adapter, changing guidance in RAG, desired behavior in policy, and enforcement/delivery in the wrapper.</li><li>Use a fresh empty derived root, preserve the known-good release, and stop at MERGE, POLICY APPROVED, and served-suite gates.</li><li>Rebuild deterministic artifacts to matching hashes and learned artifacts to the same behavioral gates.</li><li>Execute the retention/deletion map: prove a removed source is absent from current private splits and planned out of derivative adapters, merged models, GGUFs, Ollama imports, and controlled backups.</li><li>Use the clean served assistant on a new private task and record only a redacted Notion-delivery receipt.</li><li>Write <code>evidence/receipts/s10.json</code> with manifest hashes, planned/executed stages, gate results, deletion coverage, suite counts, and redacted delivery facts.</li></ul>Any nonzero child, altered manifest, destructive destination, missing gate, privacy/deletion failure, or failed served suite blocks completion while preserving the known-good release.'''
reward = 300
xray = "Reject date-only provenance, auto-promotion past human gates, monolithic scripts that hide failed subprocesses, byte-equality demands for nondeterministic GPU training, destructive cold-start deletion, component changes routed to retraining by default, or a final artifact never used by a person in Notion."

[freestyle.badge]
id = "s10-badge"
name = "LIVING FAMILIAR"
desc = "Awarded for a useful, local, grounded, policy-owned assistant that can be rebuilt safely."

[[freestyle.rubric]]
criterion = "Traceable living pipeline"
weight = 20
desc = "Immutable manifests, hashes, commands, environments, stages, decisions, and monitoring make every release explainable."
essential = true
minimumScore = 8

[[freestyle.rubric]]
criterion = "Correct component ownership"
weight = 25
desc = "Change planning and architecture route voice, references, policy, serving, and delivery to their actual owners."
essential = true
minimumScore = 8

[[freestyle.rubric]]
criterion = "Safe clean rebuild"
weight = 25
desc = "A fresh derived root rebuilds without caches or deletion, stops at gates, and preserves the known-good release."
essential = true
minimumScore = 9

[[freestyle.rubric]]
criterion = "Human-useful delivery"
weight = 20
desc = "The clean local endpoint passes all suites and a new cited personal-voice Markdown artifact survives a real Notion import."
essential = true
minimumScore = 9

[[freestyle.rubric]]
criterion = "Python craft"
weight = 10
desc = "Pipeline and monitoring modules use snake_case names, UPPER_CASE immutable gates, four-space indentation, grouped imports, and small stage functions with explicit failure propagation."

[[freestyle.verification]]
id = "compile-s10"
command = "compile"
label = "Compile source and tests"
required = true
expect = { exitCode = 0 }

[[freestyle.verification]]
id = "tests-s10"
command = "tests"
label = "Run unit tests"
required = true
expect = { exitCode = 0 }

[[freestyle.verification]]
id = "evidence-s10"
command = "evidence"
label = "Validate rebuild and lifecycle receipt"
required = true
args = ["s10"]
expect = { exitCode = 0 }
