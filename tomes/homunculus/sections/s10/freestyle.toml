[freestyle]
requires = ["project-doctor", "dataset-curation", "rocm-training", "merge-gate", "faiss-index", "policy-decision", "served-verification", "run-manifest", "retrain-trigger", "drift-monitor", "architecture-defense", "pipeline-orchestration", "tool-deliver"]
title = "THE WORKING: PROVE THE LIVING HOMUNCULUS"
brief = '''Finish the original commission as a maintainable product, not a pile of lesson snippets.<ul><li>Implement immutable run/release manifests, hash verification, a human RUNS index, component-aware rebuild planning, and timestamped monitoring.</li><li>Write ARCHITECTURE.md assigning personal voice to the adapter, changing cited guidance to RAG, desired runtime behavior to policy, and enforcement/delivery to the wrapper.</li><li>Implement build, seal, and publish orchestration with exact argument arrays, logs, environment boundaries, and hard stops at MERGE, POLICY APPROVED, and served-suite gates.</li><li>Use a fresh empty derived root to rebuild every derived artifact while preserving the known-good release; require deterministic artifacts to match hashes and learned artifacts to pass the same behavioral gates.</li><li>Run the clean served assistant on a new real task, save cited standard Markdown, import it into a Notion scratch page, and record the delivery result.</li><li>Demonstrate a reference-only change plans RAG rather than retraining, and a policy-only change reruns policy/publish gates rather than touching voice weights.</li></ul>The final evidence must show a useful private assistant on local hardware, in the learner's evaluated voice, grounded in online style references, under visible learner-owned policy, rebuildable from declared inputs.'''
reward = 300
xray = "Reject date-only provenance, auto-promotion past human gates, monolithic scripts that hide failed subprocesses, byte-equality demands for nondeterministic GPU training, destructive cold-start deletion, component changes routed to retraining by default, or a final artifact never used by a person in Notion."

[freestyle.badge]
id = "s10-badge"
name = "LIVING FAMILIAR"
desc = "Awarded for a useful, local, grounded, policy-owned assistant that can be rebuilt safely."

[[freestyle.rubric]]
criterion = "Traceable living pipeline"
weight = 25
desc = "Immutable manifests, hashes, commands, environments, stages, decisions, and monitoring make every release explainable."

[[freestyle.rubric]]
criterion = "Correct component ownership"
weight = 25
desc = "Change planning and architecture route voice, references, policy, serving, and delivery to their actual owners."

[[freestyle.rubric]]
criterion = "Safe clean rebuild"
weight = 25
desc = "A fresh derived root rebuilds without caches or deletion, stops at gates, and preserves the known-good release."

[[freestyle.rubric]]
criterion = "Human-useful delivery"
weight = 25
desc = "The clean local endpoint passes all suites and a new cited personal-voice Markdown artifact survives a real Notion import."
