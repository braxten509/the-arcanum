[[lessons]]
id = "s10-l01"
title = "The Cabinet That Rebuilds Itself"
body = '''
<p>The final rite is not a victory lap. It is a maintenance plan. The student has to treat the notes, the adapter, the evaluation set, and the serving config as parts of one living cabinet that can be rebuilt when the corpus grows or the behavior drifts.</p>
<div class="field-notes"><div class="fn-head">FIELD NOTES // LIVING PIPELINE</div>
<p>The best endpoint is not a single model snapshot but a defensible system. A maintainer should be able to explain the base choice, the quantization choice, the adapter choice, the RAG choice, and what evidence would make them revisit any of them.</p></div>
