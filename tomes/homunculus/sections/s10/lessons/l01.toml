[[lessons]]
id = "s10-l01"
teaches = ["run-manifest"]
title = "Give Every Release an Immutable Lineage"
body = '''
<p>A date is useful to a person but insufficient to reproduce a model. Create a unique run id such as <code>2026-07-13-bind-001</code> and never reuse its directory. <code>runs/&lt;run-id&gt;/manifest.json</code> is the machine-readable source of truth; <code>reports/RUNS.md</code> is a human index that links to manifests rather than duplicating their fields inconsistently.</p>
<p>The manifest records: objective, timestamp and timezone, base id and resolved revision, source/curated/evaluation/reference/policy hashes, complete training and serving configuration, Python/package/ROCm/Ollama/llama.cpp versions, commands, GPU architecture, stage status, artifact paths and hashes, evaluation gates, decisions, and the parent release if any.</p>
<pre><code>{
  "run_id": "2026-07-13-bind-001",
  "parent_release": null,
  "base": {"id": "Qwen/Qwen3-8B", "revision": "resolved-commit"},
  "inputs": {"train_sha256": "...", "eval_suite_sha256": "..."},
  "stages": {"curate": "passed", "train": "passed", "evaluate": "MERGE"},
  "artifacts": {"adapter_manifest_sha256": "...", "gguf_sha256": "..."}
}</code></pre>
<p>Hash files by bytes and directories by a sorted list of relative paths plus individual hashes. Store exact commands as argument arrays where possible, not ambiguous shell prose. Capture package versions from the environment that ran each stage; training-container versions and host-serving versions belong in separate subobjects.</p>
<p>Immutability means a later policy edit or regenerated GGUF creates a new child run or release record. Do not update an old manifest to describe new bytes. If a stage fails, preserve <code>failed</code>, the error report path, and completed inputs. The artifact may be retried under a new run id, while the failure remains useful evidence.</p>
<p>Add a manifest verifier that recomputes every present hash and fails on missing files, unexpected changed bytes, unknown stage states, or an artifact whose permit points to a different parent hash.</p>
<div class="field-notes"><div class="fn-head">FIELD NOTES // A RELEASE IS A GRAPH OF IDENTITIES</div>
<p>The release manifest ties together source hashes, dataset manifest, base revision, adapter, evaluation permit, RAG index, policy, merged checkpoint, GGUF, Ollama name, settings, and software versions. A date or friendly folder name cannot answer which input produced an output. Content identities can—and make rollback a selection rather than a reconstruction.</p></div>
'''

[[lessons.readings]]
label = "Python hashlib"
url = "https://docs.python.org/3/library/hashlib.html"

[[lessons.exercises]]
id = "s10-l01-e1"
type = "mc"
points = 20
prompt = "Why is a date-only directory name insufficient?"
choices = ["It does not identify exact inputs, software, decisions, or artifact bytes", "JSON cannot store dates", "Ollama rejects dates", "Hashes require cloud access"]
answer = 0
whyWrong = "Dates are valid JSON and Ollama is unrelated; hashes are computed locally."
explain = "Reproducibility needs lineage, not chronology alone."
hint = "Two different runs can happen on the same day."

[[lessons.exercises]]
id = "s10-l01-e2"
type = "text"
points = 15
prompt = "Which file is the machine-readable source of truth for a run?"
answer = "runs/<run-id>/manifest.json"
accept = ["manifest.json", "the run manifest", "runs/<run-id>/manifest.json"]
hint = "RUNS.md is only the human index."

[[lessons.exercises]]
id = "s10-l01-e3"
type = "fill"
points = 20
prompt = "Complete the rule for editing an already finalized manifest."
code = "finalized_manifest_mutable = ____"
answer = "False"
accept = ["false", "False"]
hint = "Changed bytes create a child release record."

[[lessons.exercises]]
id = "s10-l01-e4"
type = "write"
points = 35
prompt = "Find hashes that changed and print exactly: CHANGED policy"
starter = '''recorded = {"train": "aaa", "policy": "bbb", "gguf": "ccc"}
current = {"train": "aaa", "policy": "new", "gguf": "ccc"}

changed = []
print("CHANGED " + ", ".join(changed))
'''
solution = '''recorded = {"train": "aaa", "policy": "bbb", "gguf": "ccc"}
current = {"train": "aaa", "policy": "new", "gguf": "ccc"}

changed = [name for name in recorded if recorded[name] != current[name]]
print("CHANGED " + ", ".join(changed))
'''
expect = "CHANGED policy"
hint = "Compare each recorded hash with the current hash under the same key."
