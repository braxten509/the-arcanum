[[lessons]]
id = "s10-l02"
teaches = ["retrain-trigger"]
title = "Rebuild Only the Component That Changed"
body = '''
<p>“Something changed” does not always mean retrain. Compare current input hashes with the active release and plan the narrowest stages. New or revised personal voice examples may require curation, QLoRA, evaluation, merge, and serving. A changed style-reference summary requires only RAG rebuild and endpoint evaluation. A policy edit requires policy evaluation, Modelfile regeneration/Ollama create, and endpoint evaluation. An Ollama update calls for the served suites, not a new adapter.</p>
<pre><code>def plan(changes):
    stages = set()
    if "voice_data" in changes:
        stages |= {"curate", "train", "evaluate", "seal", "publish"}
    if "references" in changes:
        stages |= {"rag", "served_evaluate"}
    if "policy" in changes:
        stages |= {"policy_evaluate", "modelfile", "publish", "served_evaluate"}
    if "serving_environment" in changes:
        stages |= {"served_evaluate"}
    return stages</code></pre>
<p>A corpus-count threshold is only a scheduling aid. Start with twenty newly approved, diverse voice examples or an explicit manual request before spending a training run, but do not append low-quality rows to reach the number. A quality regression is a diagnosis trigger: compare manifests first. Retraining cannot fix a stale FAISS index, changed policy, bad template, or CPU fallback.</p>
<p>Create <code>src/homunculus/pipeline.py plan</code> to hash current inputs, compare them with a chosen release manifest, and write <code>reports/rebuild-plan.json</code> containing detected changes, planned stages, skipped stages with reasons, and required human gates. Planning never trains or publishes.</p>
<p>No trigger auto-promotes a model. Training stops after paired evaluation until a human issues <code>MERGE</code>; policy changes stop until <code>POLICY APPROVED</code>; publishing stops until served suites pass. Automation repeats understood work, while decisions remain explicit artifacts.</p>
<div class="field-notes"><div class="fn-head">FIELD NOTES // REBUILD THE AFFECTED DESCENDANTS</div>
<p>Think of the pipeline as a dependency graph. A reference edit invalidates chunks, vectors, RAG evaluation, and served reports, but not the voice adapter. A training-row edit invalidates the adapter and everything derived from it. Component-aware rebuilds save time while manifests prevent accidental reuse of a stale descendant.</p></div>
'''

[[lessons.readings]]
label = "Python pathlib"
url = "https://docs.python.org/3/library/pathlib.html"

[[lessons.exercises]]
id = "s10-l02-e1"
type = "mc"
points = 20
prompt = "A reference Markdown file changes but voice data does not. What is the narrow plan?"
choices = ["Rebuild RAG and rerun served retrieval evaluation", "Retrain the adapter automatically", "Merge the old adapter again", "Delete all artifacts"]
answer = 0
whyWrong = "Reference knowledge is owned by retrieval; training and destructive cleanup do not repair that component."
explain = "Artifact ownership determines the rebuild stage."
hint = "Which component indexed the changed file?"

[[lessons.exercises]]
id = "s10-l02-e2"
type = "text"
points = 15
prompt = "How many newly approved examples is the initial scheduling threshold?"
answer = "20"
accept = ["twenty", "20"]
hint = "It is not a quality substitute."

[[lessons.exercises]]
id = "s10-l02-e3"
type = "fill"
points = 20
prompt = "Complete the stage a policy change must pass before publish."
code = '''stages.add("policy_____")'''
answer = "evaluate"
hint = "The policy suite produces APPROVED or REVISE."

[[lessons.exercises]]
id = "s10-l02-e4"
type = "write"
points = 35
prompt = "Plan reference-only changes and print exactly: STAGES rag, served_evaluate"
starter = '''changes = {"references"}
stages = []

print("STAGES " + ", ".join(stages))
'''
solution = '''changes = {"references"}
stages = []
if "references" in changes:
    stages.extend(["rag", "served_evaluate"])
print("STAGES " + ", ".join(stages))
'''
expect = "STAGES rag, served_evaluate"
hint = "Use the two stages owned by reference changes, in the listed order."
