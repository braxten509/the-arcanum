[[lessons]]
id = "s10-l05"
teaches = ["pipeline-orchestration", "tool-deliver"]
title = "Rebuild in Stages and Deliver from a Clean Root"
body = '''
<p>The pipeline has human gates and two environments, so one magical uninterrupted command would be dishonest. Make each command complete its authorized stage and stop visibly:</p>
<pre><code># In the tested ROCm container:
python -m homunculus.pipeline build --run-id 2026-07-13-bind-002

# After blind scoring produces MERGE and POLICY APPROVED; in the trusted
# environment with enough system RAM and llama.cpp tools:
python -m homunculus.pipeline seal --run-id 2026-07-13-bind-002

# On the host where Ollama runs:
python -m homunculus.pipeline publish --run-id 2026-07-13-bind-002

# Daily delivery:
python -m homunculus.assistant --query "..." --out outbox/note.md</code></pre>
<p><code>build</code> verifies the doctor, curation, RAG build/evaluation, one-step memory gate, full training, and paired evaluation generation, then stops for blind human scores. <code>seal</code> verifies the hash-bound decisions, merges, converts, quantizes, and renders the Modelfile. <code>publish</code> imports into Ollama, runs every served suite, and writes the release manifest. Use <code>subprocess.run([...], check=True)</code> with argument lists, stage logs, and no <code>shell=True</code>. A failure marks the manifest and prevents later stages.</p>
<p>Refactor paths through a <code>ProjectPaths</code> configuration with a read-only logical input root and a separate derived-output root. Then prove a cold rebuild without deleting anything:</p>
<pre><code>python -m homunculus.pipeline build \
  --run-id clean-001 \
  --derived-root rebuilds/clean-001</code></pre>
<p>The pipeline must refuse a nonempty derived root. It reads source, configuration, policies, raw Notion export, reference summaries, and frozen suites from the project; every dataset, adapter, report, index, merged model, and GGUF is newly written beneath the fresh root. Deterministic curation and RAG artifacts should reproduce their hashes. GPU training may not reproduce byte-identical weights, so the clean adapter must pass the same behavioral gates rather than match a hash.</p>
<p>After the clean candidate is scored and sealed under its own model name, run the served suites and import its new Markdown output into a Notion scratch page. Preserve the existing known-good release throughout. This proves the course's end artifact can be rebuilt from declared inputs, used daily, delivered to the target tool, and maintained without destructive cleanup.</p>
<div class="field-notes"><div class="fn-head">FIELD NOTES // CLEAN DOES NOT MEAN DESTRUCTIVE</div>
<p>Prove reproducibility by targeting a newly created, empty derived-artifact root. Build, evaluate, seal, and publish as separate stages, then compare the new manifest and required behavior with the approved release. Never “clean” by deleting the only known-good artifacts; a fresh destination provides stronger evidence and preserves recovery.</p></div>
'''

[[lessons.readings]]
label = "Python subprocess"
url = "https://docs.python.org/3/library/subprocess.html"

[[lessons.readings]]
label = "Notion import data"
url = "https://www.notion.com/help/import-data-into-notion"

[[lessons.exercises]]
id = "s10-l05-e1"
type = "mc"
points = 20
prompt = "Why are build, seal, and publish separate commands?"
choices = ["They cross human approval and environment boundaries that must not be hidden", "Python permits only one stage per file", "Ollama cannot use manifests", "FAISS requires deletion"]
answer = 0
whyWrong = "The separation is a workflow and safety contract, not a language or library limitation."
explain = "Automation stops where new evidence or authority is required."
hint = "Blind scoring and host Ollama happen at different boundaries."

[[lessons.exercises]]
id = "s10-l05-e2"
type = "text"
points = 15
prompt = "What must the pipeline do when the requested derived root is nonempty?"
answer = "refuse"
accept = ["refuse", "fail", "stop", "exit nonzero"]
hint = "The proof cannot depend on warm-cache artifacts."

[[lessons.exercises]]
id = "s10-l05-e3"
type = "fill"
points = 20
prompt = "Complete the safe subprocess option that turns a nonzero child exit into a failure."
code = '''subprocess.run(command, ____=True)'''
answer = "check"
hint = "It prevents a failed stage from silently continuing."

[[lessons.exercises]]
id = "s10-l05-e4"
type = "write"
points = 35
prompt = "Stop at the first failed stage and print exactly: STOP train"
starter = '''stages = [("doctor", True), ("curate", True), ("train", False), ("seal", True)]

failed = "none"
print(f"STOP {failed}")
'''
solution = '''stages = [("doctor", True), ("curate", True), ("train", False), ("seal", True)]

failed = "none"
for name, passed in stages:
    if not passed:
        failed = name
        break
print(f"STOP {failed}")
'''
expect = "STOP train"
hint = "Loop in order, assign the first false stage, and break."
