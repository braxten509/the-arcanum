[[lessons]]
id = "s10-l05"
title = "The Living Pipeline — One Command, No Amnesia"
body = '''
<p>The third rite established a chain of single-purpose tools. The fifth rite assembled a budget from five line items. The sixth rite curates, the fifth binds, the sixth proves, the seventh retrieves, the eighth wards, the ninth seals, and the fourth rite taught the first summoning. Every one of those rites produced a working artefact. The twelfth rite's final lesson assembles them into a single pipeline — one command that builds the familiar end to end, not a mental checklist the artificer must remember to follow in order.</p>

<p>The shape is a single Python file, <code>pipeline.py</code>, with one function per rite and a <code>main()</code> that calls them in sequence. <code>curate()</code> reads the raw Notion export, applies the sixth rite's three curation checks, and writes a dated JSONL. <code>bind()</code> loads the QLoRA config from the seventh rite, tokenizes with the base's chat template from the fourth, applies the loss mask, and saves the adapter. <code>prove()</code> loads the held-out prompts from the eighth rite, evaluates against the new adapter, and writes the score to the run log. <code>grind()</code> rebuilds the grimoire's FAISS index from the ninth rite against the current reference corpus. <code>seal()</code> merges the adapter, converts to GGUF, quantizes, and writes the Modelfile from the eleventh rite. <code>serve()</code> runs <code>ollama create</code> and verifies the familiar answers a known prompt. Each function takes the dated artefact directory name from the first lesson's cabinet, reads its inputs from paths the cabinet discipline guarantees are consistent, and writes its outputs to predictable locations the next function expects.</p>

<pre><code><span class="k">def</span> <span class="k">main</span>(run_date):
    dataset = curate(run_date)          <span class="c"># sixth rite</span>
    adapter = bind(run_date, dataset)   <span class="c"># seventh rite</span>
    score = prove(run_date, adapter)    <span class="c"># eighth rite</span>
    grim = grind(run_date)              <span class="c"># ninth rite</span>
    model = seal(run_date, adapter)     <span class="c"># eleventh rite</span>
    serve(model, grim, run_date)        <span class="c"># fourth rite + ninth</span>
    log(run_date, adapter, model, score)<span class="c"># twelfth rite</span></code></pre>

<p>The pipeline is not autonomous — each function succeeds or reports exactly which step failed and what the artificer should investigate. A failed <code>bind()</code> that reports "bitsandbytes paged-optimizer assertion failed at step 847" is actionable — the fifth rite's QLoRA lesson named that exact rough edge. A failed <code>seal()</code> that reports "merge_and_unload: base model checkpoint not found at expected path" is a cabinet-discipline error — the adapter was saved to a location that doesn't match the convention. The pipeline's value is not perfection; it is that every failure points to a specific rite's lesson and a specific field-notes entry, not a generic "run failed" with no diagnosis.</p>

<p>The final habit of the twelfth rite: run the whole pipeline on a clean checkout — a fresh directory, no cached adapter, no leftover GGUF — before calling the familiar done. A pipeline that works from a warm cache is a pipeline that breaks the first time it is actually needed, which is always six months later when the cache doesn't exist. The true test of a living pipeline is whether it can rebuild the familiar from scratch, from only the cabinet directory and the reference corpus, with no artefacts left over from the last run.</p>

<div class="callout">The pipeline is a test of every previous rite's discipline, not a new rite's skill. If the cabinet naming convention isn't consistent, <code>bind()</code> can't find the dataset. If the modelfile template doesn't match the base, <code>seal()</code> produces a broken artefact. If the held-out set was corrupted, <code>prove()</code> reports success for a failing familiar. The pipeline surfaces every short-cut the earlier rites permitted; the living familiar is the one that can be rebuilt cold, from nothing but the cabinet, and produce the same held-out score as last month.</div>
<div class="field-notes"><div class="fn-head">FIELD NOTES // THE COLD-START TEST</div>
<p>Delete every artefact except the raw export directory, the reference corpus, and <code>pipeline.py</code>. Run <code>python pipeline.py</code>. If it cannot rebuild the familiar to within 0.03 Jaccard of last month's served version, the pipeline has an implicit dependency — a cached intermediate file, an environment variable the docstring doesn't name, a library version that drifted. The cold-start test catches it before the real crisis (a disk failure, a migrated machine) catches it for you. Run it once per month, on the same schedule as the drift check from the third lesson.</p></div>
'''

[[lessons.exercises]]
id = "s10-l05-e1"
type = "mc"
points = 20
prompt = "Per this rite, why does <code>pipeline.py</code> assemble every previous rite's work into one file rather than keeping them as separate scripts the artificer runs by hand?"
choices = [
  "A single file guarantees each step receives correctly dated artefact paths from the cabinet convention — when functions share a run_date and a path convention, the output of one step is the predictable input of the next, so the chain can't silently skip a step or pass the wrong artefact version",
  "The Ollama Modelfile from the eleventh rite requires all training components to be referenced from a single Python file — ollama create refuses to read a GGUF path that was constructed in a different script, enforcing a single-entry-point constraint across the entire pipeline",
  "Hugging Face's PEFT library only supports fine-tuning when the dataset, tokenizer, and training config are all defined within the same Python process — attempting to load a pre-saved dataset from disk into SFTTrainer triggers a stale-format error that requires in-memory construction",
  "The ROCm HIP runtime enforces a single-process constraint on GPU memory allocation — if the training and evaluation scripts run in separate Python processes, the GPU driver deallocates the weight buffer between processes and the adapter cannot be compared against the evaluation set within the same VRAM session",
]
answer = 0
whyWrong = "Ollama has no single-file-source constraint (it reads the GGUF and Modelfile as static files regardless of their origin), PEFT's SFTTrainer can load datasets from disk (Arrow, JSONL, Hugging Face Dataset.from_disk all work), and the ROCm runtime has no cross-process GPU memory constraint for sequential steps (each process gets its own allocation, and the adapter file persists on disk between steps). The real value is the pipeline's function-hygiene: shared path conventions enforced by a single entry point eliminate version-skew between steps."
explain = "Each function takes a run_date and reads/writes to predictable paths derived from the cabinet convention — the single entry point guarantees that the adapter path curate() wrote to is the exact same path bind() reads from, which is the same path prove() evaluates and seal() merges."
hint = "The lesson's code block shows each function receiving the same run_date — the shared parameter enforces a consistent naming convention across the whole chain. The correct answer identifies this function-hygiene as the value of a single pipeline file."

[[lessons.exercises]]
id = "s10-l05-e2"
type = "text"
points = 18
prompt = "Per this rite, what is the name of the test where the artificer deletes every artefact except the raw export, the reference corpus, and pipeline.py, and then runs the pipeline from scratch to verify it can rebuild the familiar to within 0.03 Jaccard of the last served version?"
answer = "the cold-start test"
accept = ["cold-start test", "cold start test"]
hint = "It's named in the FIELD NOTES section, right at the bottom of the lesson — the test that catches implicit dependencies before a real crisis does."

[[lessons.exercises]]
id = "s10-l05-e3"
type = "mc"
points = 20
prompt = "Per this rite, a <code>bind()</code> call fails with the error: 'bitsandbytes paged-optimizer assertion failed at step 847.' Why is this more useful than a generic 'run failed'?"
choices = [
  "The CUDA runtime version on the GPU is too old — the assertion failure indicates bitsandbytes attempted a kernel launch that requires a compute-capability level the 9070 XT's HIP runtime cannot provide, and the step number narrows the failure to the exact PyTorch autograd graph node",
  "Assertion errors terminate the Python process cleanly — the step number corresponds to a line in the PyTorch source code where the assertion was placed, and each assertion has a unique help message that names the Hugging Face documentation page covering the fix",
  "The error is actionable because the fifth rite's QLoRA lesson explicitly named that exact rough edge — the paged-optimizer bug on ROCm is documented, and the artefact step number tells the artificer exactly where in the training loop the assertion failed, which is enough to decide whether to disable paged optimizers or switch to a different bitsandbytes backend",
  "The step number is a checkpoint index — the SFTTrainer from the seventh rite can resume training from exactly step 847, skipping the failed operation and continuing from the last successfully-completed gradient update",
]
answer = 2
whyWrong = "The CUDA/compute-capability angle is wrong for ROCm (which doesn't report CUDA compute-capability). PyTorch assertion errors don't link to Hugging Face fix documentation — they are raw C-level checks. And SFTTrainer checkpointing resumes from saved checkpoint steps, not from arbitrary assertion-failure points (the step number in the error is a training-step counter, not a recoverable checkpoint index). The correct answer ties the specific error to the specific lesson that taught it: the fifth rite's QLoRA lesson named paged-optimizer bugs on ROCm as a known rough edge."
explain = "The lesson's paragraph is explicit: 'A failed bind() that reports bitsandbytes paged-optimizer assertion failed at step 847 is actionable — the fifth rite's QLoRA lesson named that exact rough edge.' The error's value is the direct line to the prior lesson that documented it, not a generic recovery mechanism."
hint = "The lesson says the error points to 'a specific rite's lesson and a specific field-notes entry, not a generic run failed with no diagnosis.' The correct answer references the exact lesson (fifth rite's QLoRA), the exact bug (paged optimizer), and the diagnosis that makes the error actionable."

