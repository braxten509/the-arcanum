prompt = "Fill the missing function in the pipeline's <code>main()</code> — the step from the ninth rite that rebuilds the FAISS index from the current reference corpus before the familiar is served with grounding."
code = '''def main(run_date):
    dataset = curate(run_date)
    adapter = bind(run_date, dataset)
    score = prove(run_date, adapter)
    grim = ____(run_date)
    model = seal(run_date, adapter)
    serve(model, grim, run_date)
    log(run_date, adapter, model, score)'''
answer = "grind"
accept = ["grind"]
hint = "It's the function named in the lesson's pipeline diagram, with a comment marking it as 'ninth rite' — the one that rebuilds the grimoire's index."

