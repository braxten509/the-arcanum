[[lessons]]
id = "s10-l04"
teaches = ["architecture-defense"]
title = "Defend the Owner of Every Behavior"
body = '''
<p>Create <code>ARCHITECTURE.md</code> as a maintenance decision document. For each component—base, adapter, curated corpus, retrieval sources/index, policy, merge/GGUF quant, Ollama model, assistant wrapper, and evaluation suites—record: what behavior it owns, why it belongs there, its inputs/outputs, evidence for the current choice, failure signs, rebuild trigger, and rollback artifact.</p>
<p>The key ownership decisions follow from the original objective. Personal cadence, structure, and repeated writing habits live in the adapter because they should generalize across topics. Changing style facts and external guidance live in RAG because they need citations and cheap updates. Desired runtime instructions live in a policy file because the learner controls them. Retrieval authority, citation validation, Notion output, and timeouts live in application code because prose prompts cannot enforce them. Q4_K_M is a serving child of a higher-precision master, not the only surviving model artifact.</p>
<pre><code>| Component | Owns | Change trigger | Gate |
|---|---|---|---|
| Adapter | personal voice | approved voice corpus change | MERGE |
| RAG | current style facts | source hash change | retrieval suite |
| Policy | desired runtime behavior | intentional policy edit | POLICY APPROVED |
| Wrapper | citations and Markdown delivery | code/API change | served suites + Notion import |</code></pre>
<p>Back every claim with a path and measured result. “Qwen felt best” is not evidence; “the fixed base id matches the adapter, passed the baseline-qualified capability suite, and the served Q4_K_M release stayed within the 0.2 tolerance” is. Name unresolved limitations: learned behavior cannot be fully removed, personal data quality bounds voice quality, retrieval cannot validate truth automatically, and 16 GB constrains context and model size.</p>
<p>End with a replacement checklist. A future model upgrade is not a filename edit: baseline, tokenizer/data compatibility, training, paired evaluation, policy, merge, quantization, and endpoint delivery all repeat under a new lineage.</p>
<div class="field-notes"><div class="fn-head">FIELD NOTES // PUT CHANGE IN THE CHEAPEST HONEST LAYER</div>
<p>Corrected external facts belong in provenance-backed retrieval; a changed operating choice belongs in policy; a stable shift in personal voice may justify new curated examples and a rebind. Choosing the layer by meaning keeps updates explainable and avoids using expensive training to patch information that should remain visible and replaceable.</p></div>
'''

[[lessons.readings]]
label = "Hugging Face model card guidance"
url = "https://huggingface.co/docs/hub/model-cards"

[[lessons.exercises]]
id = "s10-l04-e1"
type = "mc"
points = 20
prompt = "Where should a corrected online typography rule live?"
choices = ["The provenance-backed RAG corpus and rebuilt index", "A new LoRA rank", "The GPU driver", "A hidden Python string"]
answer = 0
whyWrong = "Current citeable facts are retrieval-owned, not training, hardware, or hidden policy."
explain = "Architecture follows change rate and accountability."
hint = "The rule may change again and needs a citation."

[[lessons.exercises]]
id = "s10-l04-e2"
type = "text"
points = 15
prompt = "Which component owns valid citation enforcement?"
answer = "the assistant wrapper"
accept = ["assistant wrapper", "wrapper", "application code"]
hint = "A prompt can request citations but code checks ids."

[[lessons.exercises]]
id = "s10-l04-e3"
type = "fill"
points = 20
prompt = "Complete the gate that authorizes a new adapter lineage."
code = "adapter_gate = \"____\""
answer = "MERGE"
hint = "It comes from the blinded evaluation decision."

[[lessons.exercises]]
id = "s10-l04-e4"
type = "write"
points = 35
prompt = "Map changed components to owners and print exactly: REBUILD rag, policy"
starter = '''changes = ["style_reference", "runtime_instructions"]
owners = {"style_reference": "rag", "runtime_instructions": "policy"}

rebuild = []
print("REBUILD " + ", ".join(rebuild))
'''
solution = '''changes = ["style_reference", "runtime_instructions"]
owners = {"style_reference": "rag", "runtime_instructions": "policy"}

rebuild = [owners[change] for change in changes]
print("REBUILD " + ", ".join(rebuild))
'''
expect = "REBUILD rag, policy"
hint = "Look up each changed concern in the owners dict, preserving order."
