[[lessons]]
id = "s01-l01"
title = "What the Vessel Demands"
body = '''
<p>The homunculus is not a metaphor for a toy model. It is a real local assistant, bound to a real GPU, trained with real examples, and served through real tooling. In this third rite, the concern is not clever prompts; it is whether the bench itself is ready.</p>
<div class="callout"><strong>Fresh from the first two rites?</strong> Good — you already have <code>print</code>, variables, conditionals, functions, loops, lists, and dicts, and that is every Python tool this chapter's exercises ask of you. Most of this rite is about the <em>bench</em> — the outside tools and the card they run on — so most of its work is <em>recognizing</em> the pieces, not writing code. Where you do write code, it is the list-filtering and f-strings you learned in Chapters I and II. Let the ROCm words wash over you on the first read; you are being asked to name these tools, not to build them.</div>
<p>Start with the hardware path. On an AMD card, the language of victory is not "it installed" but "PyTorch sees the device through ROCm." That means the lesson cannot stop at package names. You need the driver, the ROCm stack, the matching PyTorch build, and a verification command that names the device and shows tensor work on the GPU.</p>
<p>That verification command has a shape worth reading slowly, because the first exercise asks you to retype it exactly: <code>python3 -c "..."</code> runs the quoted Python program straight from the shell, with no file — a quick way to ask the interpreter one question. Inside the quotes, <code>torch.cuda.is_available()</code> answers "can the runtime reach a compute device?" and <code>torch.cuda.get_device_name(0)</code> prints the name of card number 0. Two facts, one line. You are not expected to write this from memory — only to read it and know what each half proves.</p>
<p>The rest of the stack follows the same rule. Hugging Face libraries are not abstract virtues; they are the actual tools for loading models, shaping datasets, and training adapters. llama.cpp and Ollama are not optional decorations; they are how the finished vessel becomes a GGUF file and then a local service. You are building a chain, and every link must be named before you trust it.</p>
<div class="callout">A rite that only says "install the tools" is not a rite. It must say which tools, what they prove, and which failure each check would expose.</div>
<p>Keep the external-project boundary clear. The tome lives in the engine, but the finished homunculus lives in the student’s own folder in their own editor. The first section teaches the install and the proof, not a fake sandbox version of the workflow.</p>
<div class="field-notes"><div class="fn-head">FIELD NOTES // BENCH DISCIPLINE</div>
<p>When you teach ROCm, do not let CUDA habits blur the shape of the story. The practical question is whether the AMD GPU is usable for the fine-tuning path you plan to teach later. Every verification step should answer a real operational question: can the runtime see the card, can tensors land on it, can the model stack load there, and can the final assistant still be served locally?</p></div>
'''

[[lessons.readings]]
label = "PyTorch ROCm installation"
url = "https://pytorch.org/get-started/locally/"

[[lessons.readings]]
label = "Hugging Face docs"
url = "https://huggingface.co/docs"

[[lessons.exercises]]
id = "s01-l01-e1"
type = "type"
points = 12
prompt = "Retype the exact one-liner that proves PyTorch's ROCm build can see the card and name it."
code = 'python3 -c "import torch; print(torch.cuda.is_available(), torch.cuda.get_device_name(0))"'

[[lessons.exercises]]
id = "s01-l01-e2"
type = "mc"
points = 20
prompt = "On an AMD Radeon card running ROCm, <code>torch.cuda.is_available()</code> returning <code>True</code> mostly proves what?"
choices = [
  "The GPU driver package is up to date",
  "PyTorch's ROCm build is routing through the HIP backend under the historic <code>cuda</code> device namespace, and the runtime can see a compute device",
  "CUDA itself is installed alongside ROCm",
  "The base model has finished downloading",
]
answer = 1
whyWrong = "A driver version number and a working compute path are two different checks — an up-to-date driver can still leave the runtime blind to the card, and a stale one can still pass this exact test."
explain = "ROCm's PyTorch build reuses the <code>torch.cuda</code> namespace for HIP, so the name is a historical accident, not a sign CUDA is present — there is no CUDA on this box at all."
hint = "The function name's <code>cuda</code> prefix is a ROCm layout choice, not genuine CUDA — the check proves the HIP backend can route to a compute device under that inherited namespace, regardless of driver version."

[[lessons.exercises]]
id = "s01-l01-e3"
type = "mc"
points = 20
prompt = "Which pairing correctly separates the TRAIN-side tools from the SERVE-side tools in the vessel's chain?"
choices = [
  "transformers and peft train the adapter; llama.cpp and Ollama convert and serve the finished vessel",
  "Ollama trains the adapter; transformers only serves the finished chat",
  "llama.cpp trains on the ROCm GPU; peft only quantizes afterward",
  "ROCm serves the finished model to the artificer; transformers only measures VRAM",
]
answer = 0
whyWrong = "llama.cpp and Ollama never touch gradients — they convert and run already-trained weights. Training is transformers loading the base and peft wrapping it with a LoRA adapter; serving is downstream of that, not the same step."
explain = "The boundary is gradients. <code>transformers</code> loads the base weights and <code>peft</code> wraps them in the trainable LoRA adapter — the only place learning happens. <code>llama.cpp</code> and Ollama never compute a gradient; they take already-trained weights, convert them to GGUF, and serve them. Train-side forges the adapter, serve-side only runs the finished vessel."
hint = "One side touches gradients and adapters; the other only converts and runs already-trained weights — the lesson's paragraph on the serving toolchain names that boundary explicitly."

[[lessons.exercises]]
id = "s01-l01-e4"
type = "text"
points = 15
prompt = "What is the name of the quantized, single-file weight format that llama.cpp produces and Ollama loads to serve a model?"
answer = "GGUF"
accept = ["gguf"]
hint = "It is the format llama.cpp's convert script writes and the one named in the 'Sealing the Vessel' rite later in this course."

[[lessons.exercises]]
id = "s01-l01-e5"
type = "write"
points = 30
prompt = "A bench check has a <code>required</code> list of five tools and an <code>installed</code> set. Compute which required tools are missing, in the order they appear in <code>required</code>, and print exactly: <code>MISSING: peft, ollama</code> (comma-and-space separated, no trailing items)."
starter = '''required = ["rocm", "pytorch", "peft", "llama.cpp", "ollama"]
installed = {"rocm", "pytorch", "llama.cpp"}

# This is a list comprehension from Chapter II: keep each name from
# `required` that is NOT in `installed`, in the order `required` lists them.
#   missing = [name for name in required if name not in installed]
# Write that, then the print below joins the names with ", ".
missing = []
print("MISSING: " + ", ".join(missing))
'''
expect = "MISSING: peft, ollama"
hint = "Loop over `required` in order and keep only the names that are not in `installed` — don't loop over `installed` instead, its order isn't the one the output needs."
