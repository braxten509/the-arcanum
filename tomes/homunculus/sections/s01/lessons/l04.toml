[[lessons.exercises]]
id = "s01-l04-e1"
type = "mc"
points = 20
prompt = "What evidence proves GPU compute rather than mere device discovery?"
choices = [
  "pip prints Successfully installed",
  "The editor can open doctor.py",
  "A tensor allocated on the ROCm device produces the checked sum 10",
  "Ollama returns its version",
]
answer = 2
whyWrong = "Package, editor, and service checks prove other boundaries. Only a checked tensor operation exercises actual GPU computation."
explain = "The doctor requires both discovery and a correct device-side result."
hint = "Look for the check that asks the card to calculate."

