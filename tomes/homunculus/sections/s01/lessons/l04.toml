[[lessons.exercises]]
id = "s01-l04-e4"
type = "mc"
points = 20
prompt = "An import traceback points at a different Homunculus directory. What is the narrow recovery?"
choices = [
  "Delete private/notion and begin the corpus again",
  "Set HSA_OVERRIDE_GFX_VERSION",
  "Quantize the untrained model",
  "Confirm pwd, remove the accidental installed copy, return to /workspace, and reinstall this project editable",
]
answer = 3
whyWrong = "Corpus deletion, GPU impersonation, and premature quantization do not correct Python's import path."
explain = "The printed module path identifies an environment/cwd ownership mistake, so repair that boundary only."
hint = "Fix the location Python imports, not unrelated data or GPU settings."

