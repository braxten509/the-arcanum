[[lessons]]
id = "s01-l04"
teaches = ["tool-run-test", "project-doctor"]
title = "Make Readiness Executable"
body = '''
<p>A successful installation message is not evidence that the assistant can be built. Turn readiness into a command that fails at the first broken boundary. Create <code>src/homunculus/doctor.py</code> in your editor, save it, and enter this real diagnostic:</p>
<pre><code>import argparse
import importlib.metadata
import json
import sys
import urllib.request

EXPECTED = {
    "bitsandbytes": "0.49.2",
    "datasets": "5.0.0",
    "peft": "0.19.1",
    "transformers": "5.13.0",
    "trl": "1.8.0",
}

def require(condition: bool, message: str) -&gt; None:
    if not condition:
        raise RuntimeError(message)

def check_packages() -&gt; None:
    for name, wanted in EXPECTED.items():
        found = importlib.metadata.version(name)
        require(found == wanted, f"{name}: wanted {wanted}, found {found}")
        print(f"PACKAGE {name} {found}")

def check_training() -&gt; None:
    import torch
    require(sys.version_info[:2] == (3, 12), "training image must use Python 3.12")
    require(torch.version.hip is not None, "this is not a ROCm PyTorch build")
    require(torch.cuda.is_available(), "ROCm cannot see a compute device")
    arch = torch.cuda.get_device_properties(0).gcnArchName
    require("gfx1201" in arch, f"expected gfx1201, found {arch}")
    value = torch.arange(1, 5, device="cuda").sum().item()
    require(value == 10, f"GPU tensor check returned {value}")
    print(f"GPU {torch.cuda.get_device_name(0)} {arch} TENSOR {value}")

def check_serving() -&gt; None:
    with urllib.request.urlopen("http://127.0.0.1:11434/api/version", timeout=3) as response:
        payload = json.load(response)
    require("version" in payload, "Ollama returned no version")
    print(f"OLLAMA {payload['version']}")

def main() -&gt; None:
    parser = argparse.ArgumentParser()
    parser.add_argument("mode", choices=["training", "serving", "all"])
    mode = parser.parse_args().mode
    if mode in {"training", "all"}:
        check_packages()
        check_training()
    if mode in {"serving", "all"}:
        check_serving()
    print("READY")

if __name__ == "__main__":
    main()</code></pre>
<p>Create <code>tests/test_doctor.py</code> with a standard-library failure test. The project may also use pytest locally, but the grading sandbox can execute this suite without downloading dependencies:</p>
<pre><code>import unittest
from homunculus.doctor import require

class DoctorTests(unittest.TestCase):
    def test_require_names_failed_boundary(self):
        with self.assertRaisesRegex(RuntimeError, "tensor failed"):
            require(False, "tensor failed")</code></pre>
<p>Run the compile and unit-test checks inside the networkless container. Run the Ollama check separately on the host, then sanitize the result through <code>src/homunculus/verify.py s01</code>:</p>
<pre><code>python -m compileall -q src tests
python -m unittest discover -s tests -q
python -m homunculus.doctor training | tee reports/doctor-training.txt
python src/homunculus/verify.py s01</code></pre>
<p>The exit bar is literal: the test passes; the report names the pinned packages, Radeon and <code>gfx1201</code>; the tensor result is 10; Ollama returns a version; the final line is <code>READY</code>. Open <code>reports/doctor.txt</code> in the editor and confirm it contains this run rather than an old copy.</p>
<p>When it fails, read the final exception and the first traceback frame in your own source. Confirm <code>pwd</code>, then rerun the smallest owner check. The container is disposable, but <code>private/</code>, <code>artifacts/</code>, and <code>reports/</code> are not. Recreate a broken environment; never “recover” by deleting learner-owned data. The sanitized receipt records tool versions, hashes, device identity, boolean checks, and redacted failure classes—never raw environment variables, credentials, prompts, or generations.</p>
<div class="field-notes"><div class="fn-head">FIELD NOTES // A DOCTOR SHOULD NAME THE OWNER</div>
<p>Useful diagnostics do more than print red or green. They report the working directory, imported module path, package versions, detected architecture, available devices, and the first failed boundary. That turns “training is broken” into a specific statement such as “the container imported a host package” or “PyTorch cannot allocate on the ROCm device.”</p></div>
'''

