[[lessons]]
id = "s01-l02"
teaches = ["amd-support-matrix", "tool-diagnose"]
title = "Prove the Radeon Path Without Disguising It"
body = '''
<p>Your Radeon RX 9070 XT identifies itself to compute software as <strong>gfx1201</strong>. Current AMD documentation lists the card in the Radeon ROCm support matrix, and current bitsandbytes documentation lists <code>gfx1201</code> in its preview ROCm wheels. That changes an important decision from older course material: you should use the card's true target, not make it impersonate an older GPU.</p>
<p>Do <strong>not</strong> set <code>HSA_OVERRIDE_GFX_VERSION</code> for this supported path. The variable lies to the runtime about the hardware target; an old forum workaround can therefore select kernels compiled for a different architecture. If AMD support asks you to use an override for a particular diagnostic, keep it isolated to that support session. It is not part of the Homunculus environment.</p>
<p>First check the host boundary:</p>
<pre><code>ls -l /dev/kfd /dev/dri/render*
rocminfo | grep -m1 gfx1201</code></pre>
<p>Then, from the <code>Homunculus/</code> root, launch AMD's tested image with the project mounted at <code>/workspace</code>:</p>
<pre><code>docker run --rm -it \
  --device=/dev/kfd --device=/dev/dri \
  --group-add video --ipc=host --shm-size 8g \
  --network=host \
  -v "$PWD:/workspace" -w /workspace \
  rocm/pytorch:rocm7.2.1_ubuntu24.04_py3.12_pytorch_release_2.9.1 bash</code></pre>
<p>Inside the container, ask PyTorch three different questions:</p>
<pre><code>python -c 'import torch; print("HIP", torch.version.hip); print("GPU", torch.cuda.get_device_name(0)); print("ARCH", torch.cuda.get_device_properties(0).gcnArchName)'
python -c 'import torch; x=torch.arange(1, 5, device="cuda"); print("TENSOR", x.sum().item())'</code></pre>
<p>On ROCm, PyTorch retains the historical <code>torch.cuda</code> namespace; it does not mean NVIDIA CUDA is installed. A valid proof names a HIP version, names the Radeon, reports a <code>gfx1201</code> architecture, and prints <code>TENSOR 10</code> after real device work.</p>
<p>Diagnose bottom-up. Missing <code>/dev/kfd</code> or <code>gfx1201</code> in <code>rocminfo</code> is a host driver or permission problem. A host pass but container failure points to device mapping or the image. A tensor failure after the device is named points to the runtime/kernel layer. If your host distribution is outside AMD's published support list and these checks fail, the course's reliable recovery is a supported Ubuntu installation—not a pile of undocumented environment overrides.</p>
<div class="field-notes"><div class="fn-head">FIELD NOTES // SUPPORT IS A COMPLETE CHAIN</div>
<p>A supported GPU name does not prove a training stack. The kernel driver, ROCm runtime, PyTorch build, bitsandbytes wheel, and model operation must all agree on <code>gfx1201</code>. Record each layer separately so a failure has an owner. An architecture override hides evidence; a tensor allocation and one-step QLoRA run create evidence.</p></div>
'''

[[lessons.readings]]
label = "AMD Radeon Linux compatibility matrix"
url = "https://rocm.docs.amd.com/projects/radeon-ryzen/en/latest/docs/compatibility/compatibility_linux.html"

[[lessons.readings]]
label = "bitsandbytes installation and ROCm targets"
url = "https://huggingface.co/docs/bitsandbytes/installation"

[[lessons.exercises]]
id = "s01-l02-e1"
type = "mc"
points = 20
prompt = "What is the correct 2026 treatment of gfx1201 on this course's supported path?"
choices = [
  "Always export HSA_OVERRIDE_GFX_VERSION=11.0.0",
  "Use the real gfx1201 target and verify that every binary layer supports it",
  "Install NVIDIA CUDA beside ROCm",
  "Assume any wheel mentioning AMD supports every Radeon target",
]
answer = 1
whyWrong = "The override disguises supported hardware, CUDA is not the AMD backend, and binary wheels still have explicit architecture contracts."
explain = "Both the card and the installed kernels must agree on gfx1201; the checks preserve that truth end to end."
hint = "The lesson explicitly retires an old override workaround."

[[lessons.exercises]]
id = "s01-l02-e2"
type = "text"
points = 15
prompt = "Which exact architecture string should the RX 9070 XT report?"
answer = "gfx1201"
accept = ["GFX1201"]
hint = "It begins with gfx and is printed by the architecture check."

[[lessons.exercises]]
id = "s01-l02-e3"
type = "fill"
points = 20
prompt = "Complete the device used for the real tensor operation inside the ROCm PyTorch container."
code = '''x = torch.arange(1, 5, device="____")
print("TENSOR", x.sum().item())'''
answer = "cuda"
hint = "ROCm's PyTorch build intentionally reuses PyTorch's historical device namespace."

[[lessons.exercises]]
id = "s01-l02-e4"
type = "mc"
points = 20
prompt = "The host has no /dev/kfd entry. Where should diagnosis begin?"
choices = [
  "At the host driver, supported-OS, and device-permission layer",
  "By changing the model's chat template",
  "By lowering LoRA rank",
  "By reinstalling the Notion export",
]
answer = 0
whyWrong = "Model, training, and data settings live above the missing device boundary and cannot create a host compute device."
explain = "No Python or model-level action can repair a device node the operating-system layer never exposed."
hint = "Diagnose from the lowest failing layer upward."

[[lessons.exercises]]
id = "s01-l02-e5"
type = "type"
points = 12
prompt = "Retype the host command that asks rocminfo for the card's true architecture."
code = "rocminfo | grep -m1 gfx1201"

[[lessons.exercises]]
id = "s01-l02-e6"
type = "write"
points = 30
prompt = "Given four observed checks, print only the names of failed layers in order. The exact output must be: FAIL: container, tensor"
starter = '''checks = {
    "host": True,
    "container": False,
    "architecture": True,
    "tensor": False,
}

failed = []
print("FAIL: " + ", ".join(failed))
'''
solution = '''checks = {
    "host": True,
    "container": False,
    "architecture": True,
    "tensor": False,
}

failed = [name for name, ok in checks.items() if not ok]
print("FAIL: " + ", ".join(failed))
'''
expect = "FAIL: container, tensor"
hint = "Walk checks.items() and keep each name whose value is false."
