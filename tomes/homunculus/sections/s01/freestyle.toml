[freestyle]
requires = ["tool-install", "tool-create-open", "tool-navigate", "tool-edit-save", "tool-run-test", "tool-diagnose", "project-doctor"]
title = "THE WORKING: KINDLE THE REAL BENCH"
brief = '''Create and keep the external <code>Homunculus/</code> project that every later Working will extend. Submit the project tree, its pinned <code>pyproject.toml</code>, <code>src/homunculus/doctor.py</code>, <code>tests/test_doctor.py</code>, and <code>reports/doctor.txt</code>.<ul><li>Show that you opened the project root in your editor, edited and saved the visible source, and ran commands from that same root.</li><li>Use AMD's tested Python 3.12 ROCm container without replacing its PyTorch build.</li><li>Prove HIP, the Radeon name, <code>gfx1201</code>, and the result of a real GPU tensor operation.</li><li>Prove the pinned application imports, the llama.cpp build, and the host Ollama version endpoint.</li><li>Run the pytest check and the doctor; the saved report must end in <code>READY</code>.</li><li>Add <code>reports/recovery.md</code> naming the owner and narrow recovery for a host-device failure, container-mapping failure, wrong import path, and Ollama failure.</li></ul>Do not submit screenshots without command output, a copied report from another machine, an HSA target override, or files outside the one evolving project.'''
reward = 180
xray = "A passing-looking report is insufficient if the script never performs its claimed checks. Inspect the code and evidence together. The GPU proof must execute a device tensor, package versions must be read from the environment, and Ollama must answer its live endpoint."

[freestyle.badge]
id = "s01-badge"
name = "KINDLED BENCH"
desc = "Awarded for a reproducible Radeon workshop with executable readiness proof."

[[freestyle.rubric]]
criterion = "Persistent project and editor workflow"
weight = 20
desc = "The required tree is one real external project; root navigation, edit/save, run, and preserved report are demonstrated."

[[freestyle.rubric]]
criterion = "ROCm compute proof"
weight = 35
desc = "The tested image reports HIP, the Radeon, gfx1201, and a correct GPU tensor result without a target override."

[[freestyle.rubric]]
criterion = "Toolchain and tests"
weight = 30
desc = "Pinned imports, pytest, llama.cpp, and live Ollama are verified by commands whose saved output matches the implementation."

[[freestyle.rubric]]
criterion = "Diagnosis and recovery"
weight = 15
desc = "Recovery notes assign each failure to the correct layer and preserve learner-owned data and artifacts."
