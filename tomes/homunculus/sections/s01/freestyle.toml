[freestyle]
title = "THE WORKING: KINDLE THE BENCH"
brief = "Assemble the first working bench for the homunculus: a verified ROCm/PyTorch/HF/llama.cpp/Ollama toolchain, with the GPU seen by the runtime and the tools named in the notes.<ul><li>Show the exact install and verification path for the external toolchain.</li><li>Prove the GPU is visible to PyTorch on ROCm.</li><li>Keep the commission grounded in the real project folder the student will choose later.</li></ul>"
reward = 180
xray = "The first failure is usually a false victory: a driver installed but the GPU never seen, a package installed but not the ROCm build, or a model run in the wrong place. Dock anything that does not prove the whole chain."

[freestyle.badge]
id = "s01-badge"
name = "KINDLED BENCH"
desc = "Awarded for lighting the first working bench."

[[freestyle.rubric]]
criterion = "Toolchain proof"
weight = 40
desc = "The exact external tools are named and their install/verification path is explicit."

[[freestyle.rubric]]
criterion = "GPU verification"
weight = 35
desc = "The bench proves the AMD GPU is visible to the ROCm PyTorch stack."

[[freestyle.rubric]]
criterion = "Project framing"
weight = 25
desc = "The work is clearly framed as the student's external project, not a sandbox toy."
