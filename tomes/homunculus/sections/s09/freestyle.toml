[freestyle]
requires = ["python-craft", "merge-gate", "faiss-index", "policy-decision", "model-merge", "gguf-conversion", "q4-quantization", "ollama-modelfile", "rag-serving", "served-verification"]
title = "THE WORKING: SEAL, SERVE, AND USE IT"
brief = '''Turn the exact permitted adapter into the daily local assistant and deliver a real Notion-ready note.<ul><li>Hash-check the merge permit; attach the adapter to a fresh CPU bfloat16 Qwen base; safe-merge and reload the standard checkpoint.</li><li>Convert to an F16 GGUF master, quantize a Q4_K_M child, and manifest every input, command, tool commit, size, and hash.</li><li>Import with a Modelfile that relies on the embedded Qwen template—no guessed Llama/ChatML template or stop tokens—and contains the approved policy.</li><li>Implement the RAG/Ollama wrapper with untrusted-reference boundaries, source-id citations, visible debug evidence, and Notion-ready Markdown output.</li><li>Rerun every release suite through the served wrapper, then import a real outbox file into a scratch Notion page and record formatting proof.</li><li>Run <code>python -m compileall -q src tests</code>, the merge/conversion/quantization commands recorded in the manifests, <code>ollama create homunculus -f Modelfile</code>, and a real <code>python -m homunculus.assistant --query "..." --out outbox/note.md</code> request.</li><li>Keep merge, seal, and assistant code to the Section I Python naming and layout contract.</li></ul>Preserve the first failing boundary—permit, merge, conversion, import, retrieval, citation, or Notion handoff—and do not grade a downstream screenshot as its repair. The Working is incomplete if only a GGUF or an <code>ollama run</code> screenshot exists; usefulness and delivery are endpoint behaviors.'''
reward = 260
xray = "Reject merging the 4-bit training object as if it were an archival base, unauthorized adapter paths, manual foreign templates, claims that Ollama points at the original GGUF forever, RAG text treated as instructions, uncited generated facts, or file generation called Notion delivery."

[freestyle.badge]
id = "s09-badge"
name = "SEALED VESSEL"
desc = "Awarded for a tested local assistant that produces cited, Notion-ready work."

[[freestyle.rubric]]
criterion = "Authorized artifact chain"
weight = 25
desc = "Permit, fresh-base merge, F16 conversion, Q4_K_M quantization, hashes, and fresh reloads form one traceable lineage."

[[freestyle.rubric]]
criterion = "Native serving contract"
weight = 20
desc = "Ollama imports the correct GGUF and policy while preserving the embedded Qwen template."

[[freestyle.rubric]]
criterion = "Useful grounded assistant"
weight = 25
desc = "The wrapper enforces evidence authority, valid citations, personal voice, and standard Markdown."

[[freestyle.rubric]]
criterion = "Endpoint and Notion proof"
weight = 20
desc = "All suites pass after serving and a real answer survives a scratch Notion import."

[[freestyle.rubric]]
criterion = "Python craft"
weight = 10
desc = "Merge, seal, and assistant modules use snake_case names, UPPER_CASE release constants, four-space indentation, grouped imports, and separated stage functions with explicit failures."
