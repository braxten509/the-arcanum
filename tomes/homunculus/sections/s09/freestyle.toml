[freestyle]
requires = ["python-craft", "merge-gate", "faiss-index", "policy-decision", "model-merge", "gguf-conversion", "q4-quantization", "ollama-modelfile", "rag-serving", "served-verification"]
title = "THE WORKING: SEAL, SERVE, AND USE IT"
brief = '''Seal the exact permitted adapter and deliver through the real local wrapper.<ul><li>Verify the permit and pinned Qwen revision, safe-merge a fresh CPU base, and reload the standard checkpoint.</li><li>Use the pinned llama.cpp commit; keep the F16 master, measure the Q4_K_M child bytes, and manifest commands, identities, sizes, hashes, and behavior comparisons.</li><li>Import through Ollama with the embedded pinned template and approved policy; record the new full Ollama digest.</li><li>Enforce untrusted-reference boundaries, valid citations, visible diagnostics, and private Notion-ready output.</li><li>Rerun every release suite through the actual wrapper and perform the scratch Notion import.</li><li>Write <code>evidence/receipts/s09.json</code> with lineage hashes, measured sizes, suite counts/results, citation checks, and a redacted live delivery receipt—never draft content.</li></ul>Any permit, lineage, conversion, import, critical suite, citation, endpoint, or delivery failure blocks the Working.'''
reward = 260
xray = "Reject merging the 4-bit training object as if it were an archival base, unauthorized adapter paths, manual foreign templates, claims that Ollama points at the original GGUF forever, RAG text treated as instructions, uncited generated facts, or file generation called Notion delivery."

[freestyle.badge]
id = "s09-badge"
name = "SEALED VESSEL"
desc = "Awarded for a tested local assistant that produces cited, Notion-ready work."

[[freestyle.rubric]]
criterion = "Authorized artifact chain"
weight = 25
desc = "Permit, fresh-base merge, F16 conversion, Q4_K_M quantization, hashes, and fresh reloads form one traceable lineage."
essential = true
minimumScore = 9

[[freestyle.rubric]]
criterion = "Native serving contract"
weight = 20
desc = "Ollama imports the correct GGUF and policy while preserving the embedded Qwen template."
essential = true
minimumScore = 8

[[freestyle.rubric]]
criterion = "Useful grounded assistant"
weight = 25
desc = "The wrapper enforces evidence authority, valid citations, personal voice, and standard Markdown."
essential = true
minimumScore = 8

[[freestyle.rubric]]
criterion = "Endpoint and Notion proof"
weight = 20
desc = "All suites pass after serving and a real answer survives a scratch Notion import."
essential = true
minimumScore = 9

[[freestyle.rubric]]
criterion = "Python craft"
weight = 10
desc = "Merge, seal, and assistant modules use snake_case names, UPPER_CASE release constants, four-space indentation, grouped imports, and separated stage functions with explicit failures."

[[freestyle.verification]]
id = "compile-s09"
command = "compile"
label = "Compile source and tests"
required = true
expect = { exitCode = 0 }

[[freestyle.verification]]
id = "tests-s09"
command = "tests"
label = "Run unit tests"
required = true
expect = { exitCode = 0 }

[[freestyle.verification]]
id = "evidence-s09"
command = "evidence"
label = "Validate release and delivery receipt"
required = true
args = ["s09"]
expect = { exitCode = 0 }
