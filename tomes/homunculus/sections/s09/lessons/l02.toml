[[lessons]]
id = "s09-l02"
teaches = ["gguf-conversion"]
title = "Convert the Standard Checkpoint to an F16 GGUF Master"
body = '''
<p>Run llama.cpp's converter from the project root. The merged directory contains the Qwen architecture, weights, tokenizer, and native chat template; the converter carries those into GGUF metadata:</p>
<pre><code>mkdir -p artifacts/gguf
python vendor/llama.cpp/convert_hf_to_gguf.py \
  artifacts/merged/bind-001 \
  --outfile artifacts/gguf/homunculus-f16.gguf \
  --outtype f16</code></pre>
<p><code>f16</code> is an intermediate master, not the daily serving file. It provides a conventional input to llama.cpp's quantizer and a higher-precision comparison artifact. Do not use <code>f32</code> to double disk usage when the merged weights were saved in bfloat16/half precision.</p>
<p>Read the converter output. It must recognize Qwen, load every safetensors shard, import the tokenizer and chat template, and exit zero. Verify the artifact rather than trusting its filename:</p>
<pre><code>python -c 'from pathlib import Path; p=Path("artifacts/gguf/homunculus-f16.gguf"); print(p.read_bytes()[:4], p.stat().st_size)'
vendor/llama.cpp/build/bin/llama-cli \
  -m artifacts/gguf/homunculus-f16.gguf --help</code></pre>
<p>The first four bytes must be <code>b'GGUF'</code> and the file must be plausibly large and nonzero. Use llama.cpp's GGUF inspection tooling when available to compare architecture, block count, vocabulary size, and context metadata with the merged <code>config.json</code>. Do not hard-code Llama metadata keys for a Qwen model; architecture-prefixed fields differ.</p>
<p>Write <code>artifacts/gguf/f16-manifest.json</code> containing the merged-manifest hash, converter repository commit, exact command, byte size, SHA-256, and verification results. If the converter lacks Qwen support, update llama.cpp deliberately, rebuild its tools, record the new commit, and rerun from the unchanged merged checkpoint.</p>
<div class="field-notes"><div class="fn-head">FIELD NOTES // KEEP THE CONVERSION MASTER</div>
<p>The F16 GGUF is larger than the serving artifact, but it is the stable input for quantization trials. Keeping it lets you compare Q4 variants or regenerate after a llama.cpp update without repeating the adapter merge. Validate metadata, tokenizer, architecture, and a prompt at the F16 boundary before blaming a later quantized file.</p></div>
'''

[[lessons.readings]]
label = "llama.cpp Hugging Face converter"
url = "https://github.com/ggml-org/llama.cpp/blob/master/convert_hf_to_gguf.py"

[[lessons.exercises]]
id = "s09-l02-e1"
type = "mc"
points = 20
prompt = "Why preserve an F16 GGUF master?"
choices = ["It is the stable higher-precision input for quantization and comparison", "Ollama cannot load quantized GGUF", "It contains the LoRA optimizer", "FAISS searches it"]
answer = 0
whyWrong = "Ollama supports quantized GGUF; optimizer state and retrieval indexes are separate artifacts."
explain = "The master separates conversion from later lossy quantization."
hint = "Which stage should you rerun when testing another quant?"

[[lessons.exercises]]
id = "s09-l02-e2"
type = "text"
points = 15
prompt = "What four-byte magic should the file begin with?"
answer = "GGUF"
accept = ["b'GGUF'", "GGUF"]
hint = "It is also the format name."

[[lessons.exercises]]
id = "s09-l02-e3"
type = "fill"
points = 20
prompt = "Complete the converter output precision."
code = "--outtype ____"
answer = "f16"
hint = "It is the half-precision master used by the quantizer."

[[lessons.exercises]]
id = "s09-l02-e4"
type = "write"
points = 35
prompt = "Check magic and nonzero size and print exactly: GGUF VALID"
starter = '''magic = b"GGUF"
size = 16_000_000_000

status = "INVALID"
print(f"GGUF {status}")
'''
solution = '''magic = b"GGUF"
size = 16_000_000_000

valid = magic == b"GGUF" and size > 0
print("GGUF VALID" if valid else "GGUF INVALID")
'''
expect = "GGUF VALID"
hint = "Require both the exact magic and a positive byte size."
