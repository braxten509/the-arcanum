[[lessons]]
id = "s09-l03"
title = "The Quantization — Shrinking the Vessel"
body = '''
<p>The FP16 GGUF from the second lesson is a full-precision vessel — too large to serve efficiently and too large to leave headroom for the KV cache the fifth rite taught lives underneath every generation. This lesson quantizes it, shrinking the vessel by roughly a factor of four while preserving the binder's contribution. The same quantization math the fifth rite drilled — bits per weight, the q4_k_m sweet spot, the accuracy-size trade-off — now meets the artificer's own model: no longer a downloaded base from someone else's repository, but the homunculus itself.</p>

<p>The quantization tool is <code>llama-quantize</code>, a compiled C++ binary distributed with llama.cpp. Its command is a single line with three arguments: <code>./llama-quantize homunculus-f16.gguf homunculus-q4_k_m.gguf q4_k_m</code>. The tool reads every weight tensor from the input GGUF, applies the quantization algorithm for the specified type, and writes the compressed tensors to the output GGUF. Quantization is a conversion, not a training step — no gradients flow, no loss is computed, and the model's behavior changes solely because the quantized weights approximate the original FP16 weights with reduced numerical precision. The metadata header is preserved intact — the quantized GGUF reports the same architecture, context length, and vocabulary as the FP16 original.</p>

<p>The quant types, recalled from the fifth rite's GGUF naming lesson and now applied to the artificer's own vessel. <code>q4_0</code> is the simplest scheme: round each weight to the nearest 4-bit value, store one shared FP16 scale factor per block of 32 weights. It produces the smallest file but loses the most information — output quality degrades noticeably, especially on tasks requiring precise numerical reasoning. <code>q4_k_m</code> — the "k-quant medium" — is the sweet spot: it uses a more sophisticated scheme that allocates more bits to important layers (attention output projections, the first embedding layer, the final output head) and fewer to intermediate MLP layers, while keeping the average at 4 bits per weight. The result is a model nearly as small as q4_0 (within 10% of file size) but whose output quality is measurably closer to the unquantized FP16 baseline. The fifth rite's capstone budget lesson assumed q4_k_m as the quant level for its VRAM calculation; this lesson makes that assumption material. <code>q8_0</code> is 8-bit quantization — twice the size, higher quality, useful as a comparison point to measure what q4_k_m loses. The artificer should produce both q4_k_m and q8_0 versions and compare them against the held-out prompts the proving rite established — the evaluation habit the eighth rite drilled becomes the quantization gate.</p>

<p>Why the homunculus tolerates q4_k_m quantization especially well. The seventh rite's binding trained the adapter on a 4-bit quantized base — the "Q" in QLoRA — using the nf4 quantization scheme. The adapter's weights were optimized to shift a quantized model's output, not a full-precision model's output. When the merged weights are re-quantized to q4_k_m, the adapter's contribution passes through quantization the same way the base model's weights do. The adapter learned to work with quantized representations during training; the quantization at this stage is not a new distortion but a return to the precision regime the adapter was designed for. This is not to say quantization is lossless — information is discarded, and the quantized model's output will differ from the FP16 merged model's output — but the loss is bounded by the same mechanism that made QLoRA viable in the first place: a low-rank adapter trained in 4-bit generalizes well to 4-bit inference.</p>

<div class="field-notes"><div class="fn-head">FIELD NOTES // QUANTIZATION ARTIFACT INSPECTION — WHEN THE WALLS GET THIN</div>
<p>The quantized model can be inspected with <code>llama.cpp</code>'s <code>llama-perplexity</code> tool: it computes the model's perplexity on a calibration text and reports a single number that quantifies (no pun) how well the quantized weights approximate the original. A perplexity increase of more than 0.5 from FP16 to q4_k_m on a standard calibration set (WikiText-2, for example) suggests a quantization problem — a corrupted GGUF input, an incompatible converter version, or a quant type that is too aggressive for this particular model. For the homunculus, the more relevant test is the proving rite's evaluation: run the same six held-out prompts through both the FP16 merged model and the q4_k_m quantized model and compare the outputs. If the quantized model's answers are substantially different (the style score drops more than 0.1, or the model produces refusal on prompts the FP16 model answered), the quantization is too aggressive — fall back to q5_k_m or q8_0. Quantization time on the RX 9070 XT: approximately 3–5 minutes for an 8B model with llama.cpp's ROCm backend. The output file size for the homunculus at q4_k_m: approximately params × 4.5 / 8 bytes ≈ 4.5 GB for an 8B model (including the ~1 MB metadata header).</p></div>
'''
body_words = 510

