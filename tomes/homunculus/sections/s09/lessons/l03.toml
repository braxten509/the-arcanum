[[lessons.exercises]]
id = "s09-l03-e4"
type = "mc"
points = 20
prompt = "Per this rite and the fifth rite's bits-per-weight lesson, approximately what compression ratio does q4_k_m achieve relative to the unquantized FP16 GGUF, and why is the practical ratio slightly less than the theoretical 4×?"
choices = [
  "Approximately 8× — the q4_k_m scheme quantizes from 32 bits per weight (the FP32 precision the original base model was trained in) down to 4 bits, and the FP16 intermediate format is transparent to the quantizer because llama-quantize reads the weights as 32-bit values regardless of the storage format",
  "Approximately 2× — only the attention projection weights (q, k, v, o) are quantized to 4 bits; the MLP layers, embedding table, and output head remain at FP16 precision, producing an average of roughly 8 bits per weight across the entire model",
  "Approximately 3× — the q4_k_m scheme requires an additional 1.33 bits per weight on average for per-block scale factors and minimum values, giving an effective 5.33 bits per weight vs 16 bits FP16, which yields 16 / 5.33 ≈ 3× compression",
  "Approximately 4× — 16 bits per weight ÷ 4 bits per weight = 4× theoretical. The practical ratio is slightly less because q4_k_m stores per-block scale factors (one FP16 value per 32-weight block ≈ 0.5 bits per weight overhead) and because the fixed-size metadata header (~1 MB) is constant regardless of quant level, adding a larger relative overhead to the smaller quantized file"
]
answer = 3
whyWrong = "q4_k_m does not quantize from FP32 (llama-quantize reads the actual storage format — FP16 weights as 16-bit values — and the 4 bits are derived from the stored precision; the ratio is 16/4=4×, not 32/4=8×). The quantization applies to all layers, not just attention projections (the non-uniform bit allocation means MLP layers get slightly fewer bits than attention layers, but all layers are quantized — no layer stays at FP16). And the per-block overhead is approximately 0.5 bits per weight (one FP16 scale factor ÷ 32 weights = 16/32 = 0.5), not 1.33 bits. The correct answer: 16÷4=4× theoretically, with a small practical reduction from per-block scale factors (~0.5 bits/weight overhead) and the fixed metadata header."
hint = "The lesson's FIELD NOTES calculate the output size as 'params × 4.5 / 8 bytes ≈ 4.5 GB for an 8B model' — the 4.5 effective bits (not 4.0) accounts for the per-block overhead. 16 ÷ 4.5 ≈ 3.56× actual compression, slightly less than the 4× theoretical. The correct choice names this overhead and the fixed header as the reasons."
explain = "The q4_k_m scheme's bit allocation is not uniform across the model — some layers get 3 bits, critical layers get 6 bits, the average is 4 bits per weight. But the per-block metadata (one FP16 scale factor per block of 32 weights = 16/32 = 0.5 extra bits per weight) raises the effective bit count slightly above 4. The practical file size is ~4.5 GB for an 8B model, compared to ~16 GB for FP16 — a 3.6× reduction, not quite 4×. The difference is small in absolute terms but matters when comparing quant levels: q8_0 at 8.5 effective bits/weight = ~8.5 GB, q5_k_m at ~5.5 effective bits = ~5.5 GB."

[[lessons.exercises]]
id = "s09-l03-e5"
type = "write"
points = 33
prompt = "Compute the quantized GGUF file size. The FP16 GGUF file is <code>fp16_size_gb = 16.0</code> GB. Quantization at q4_k_m reduces the effective bits per weight from <code>bits_fp16 = 16</code> to <code>bits_quant = 4.5</code> (4 bits for the weights plus ~0.5 bits for per-block scale factors). The metadata header is <code>header_mb = 1</code> MB regardless of quant level. Print <code>QUANT &lt;v&gt; GB</code> where &lt;v&gt; is the quantized file size in GB, rounded to one decimal place. Compute from the FP16 size (scaling by the bit ratio) — don't hardcode."
starter = '''fp16_size_gb = 16.0
bits_fp16 = 16
bits_quant = 4.5
header_mb = 1

# weight_bytes_fp16 = (fp16_size_gb * 1_000_000_000) - (header_mb * 1_000_000)
# weight_bytes_quant = weight_bytes_fp16 * (bits_quant / bits_fp16)
# total_bytes_quant = weight_bytes_quant + (header_mb * 1_000_000)
# total_gb_quant = total_bytes_quant / 1_000_000_000
# Print QUANT <v> GB rounded to one decimal place

print("QUANT 0.0 GB")
'''
expect = "QUANT 4.5 GB"
hint = "weight_bytes_fp16 = 16_000_000_000 - 1_000_000 = 15_999_000_000. weight_bytes_quant = 15_999_000_000 * (4.5 / 16.0) = 15_999_000_000 * 0.28125 = 4_499_718_750. total_bytes_quant = 4_499_718_750 + 1_000_000 = 4_500_718_750. total_gb = 4_500_718_750 / 1_000_000_000 = 4.50071875. round(total_gb, 1) = 4.5 GB. Print f'QUANT {round(total_gb, 1)} GB'."
