[[lessons]]
id = "s09-l03"
teaches = ["q4-quantization"]
title = "Quantize the Master for the 16 GB Serving Budget"
body = '''
<p>Quantization is a deterministic artifact transformation, not another training run. Use the binary built in Section I and the quant spelling accepted by current llama.cpp:</p>
<pre><code>vendor/llama.cpp/build/bin/llama-quantize \
  artifacts/gguf/homunculus-f16.gguf \
  artifacts/gguf/homunculus-Q4_K_M.gguf \
  Q4_K_M</code></pre>
<p><code>Q4_K_M</code> is the course's starting balance for an 8B model on 16 GB. The output should be substantially smaller than the F16 master, but a parameter-times-bits estimate is only a sanity range: embeddings, metadata, tensor-specific quantization, and alignment affect exact bytes. Record actual sizes and hashes.</p>
<p>Check the output magic, converter/quantizer exit code, and that its byte size is between 20% and 45% of the F16 master as a broad corruption screen—not a quality test. Keep the F16 file until the served comparison passes. If disk space forces cleanup later, preserve its manifest and the merged checkpoint so it can be reproduced.</p>
<p>Quantization can change behavior. Section VI's direct adapter report is the quality reference; after Ollama import, rerun the same frozen prompt, regression, and policy suites with the same generation contract. A quantized artifact is accepted only if it retains the required voice gain, adds no critical failures, and stays within the predefined correctness/usefulness tolerances. If Q4_K_M fails, produce a Q5_K_M or Q8_0 sibling from the same F16 hash and compare one variable.</p>
<p>Write <code>artifacts/gguf/Q4_K_M-manifest.json</code> with input F16 hash, llama.cpp commit, exact command, quant type, byte size, SHA-256, and verification evidence.</p>
<div class="field-notes"><div class="fn-head">FIELD NOTES // QUANTIZATION IS A PRODUCT TEST</div>
<p>A plausible file-size ratio proves only that bytes were produced. Run fixed prompts against merged HF, F16 GGUF, and Q4_K_M, then compare output contract, citations, style, and key capabilities. The acceptable quant is the smallest artifact that still passes those checks on the target hardware—not simply the smallest file llama.cpp can write.</p></div>
'''

[[lessons.readings]]
label = "llama.cpp quantization guide"
url = "https://github.com/ggml-org/llama.cpp/blob/master/tools/quantize/README.md"

[[lessons.exercises]]
id = "s09-l03-e1"
type = "mc"
points = 20
prompt = "What does the file-size ratio prove?"
choices = ["Only a broad artifact sanity check, not output quality", "The style score", "The policy boundary", "The adapter was trained"]
answer = 0
whyWrong = "Behavior and training provenance require their own reports; bytes cannot measure them."
explain = "Quantized output must still pass endpoint evaluation."
hint = "A smaller valid file can still be a worse model."

[[lessons.exercises]]
id = "s09-l03-e2"
type = "text"
points = 15
prompt = "What exact quant type does the starting artifact use?"
answer = "Q4_K_M"
accept = ["q4_k_m", "Q4_K_M"]
hint = "Use the spelling passed to llama-quantize."

[[lessons.exercises]]
id = "s09-l03-e3"
type = "fill"
points = 20
prompt = "Complete the upper sanity bound for quantized/F16 byte ratio."
code = "ratio <= ____"
answer = "0.45"
accept = ["0.45", "45%"]
hint = "The broad range begins at 20 percent and ends at 45 percent."

[[lessons.exercises]]
id = "s09-l03-e4"
type = "write"
points = 35
prompt = "Compute the ratio and print exactly: RATIO 0.31 PASS"
starter = '''f16_bytes = 16_000
quant_bytes = 4_960

ratio = 0
status = "FAIL"
print(f"RATIO {ratio:.2f} {status}")
'''
solution = '''f16_bytes = 16_000
quant_bytes = 4_960

ratio = quant_bytes / f16_bytes
status = "PASS" if 0.20 <= ratio <= 0.45 else "FAIL"
print(f"RATIO {ratio:.2f} {status}")
'''
expect = "RATIO 0.31 PASS"
hint = "Divide quantized bytes by F16 bytes, then apply both range bounds."
