[[lessons.exercises]]
id = "s09-l03-e1"
type = "mc"
points = 20
prompt = "Per this rite and the fifth rite's memory-budget lesson, why is q4_k_m the recommended quant type for the homunculus rather than q4_0 or q8_0?"
choices = [
  "q4_k_m allocates more bits to critical layers (attention output projections, embedding layer, output head) and fewer to intermediate MLP layers while averaging 4 bits per weight — it achieves nearly q8_0 output quality at nearly q4_0 file size. Additionally, the homunculus's adapter was trained on a 4-bit base during the binding rite, so the adapter weights are already optimized for quantized inference: re-quantizing the merged model returns it to the precision regime the adapter was designed for",
  "q4_k_m uses a vector-quantization scheme with a codebook of 16 prototype values per block — the codebook is shared across layers and acts as a regularizer that suppresses overfitting artifacts in the adapter weights, producing a quantized model whose output is often better than the unquantized FP16 baseline",
  "q4_k_m discards the metadata header after quantization and reconstructs it at load time from the model's architecture fingerprint — the resulting file is 30% smaller than q4_0 because the header, not the weights, dominates GGUF file size for models under 10B parameters",
  "q4_k_m quantizes the attention projection layers to 4 bits but leaves the MLP layers at FP16 precision — the attention layers dominate VRAM usage during generation through the KV cache, so quantizing them produces the largest memory savings, while keeping MLP layers at full precision preserves the model's general knowledge"
]
answer = 0
whyWrong = "q4_k_m does not use a vector-quantization codebook (it uses block-wise importance-weighted scalar quantization — per-block scale factors, not a shared codebook, and it never improves on FP16 quality because quantization is lossy, not regularization), the metadata header is negligible (~1 MB vs gigabytes of weights — discarding it saves essentially nothing), and q4_k_m does not leave MLP layers at full precision (all layers are quantized; the bit allocation varies by layer importance, not by layer type — MLP intermediate layers get fewer bits, but they are still quantized, not kept at FP16). The correct answer: importance-weighted bit allocation (more bits for critical layers) plus the adapter's QLoRA compatibility (trained on 4-bit, optimized for 4-bit inference)."
hint = "The lesson says q4_k_m 'allocates more bits to important layers' and that the adapter 'was optimized to shift a quantized model's output' because it was trained on a 4-bit base. The correct choice combines both: the importance-weighted scheme AND the adapter's QLoRA provenance making it robust to re-quantization."
explain = "The binding rite's choice of QLoRA-as-training-method was not just about fitting training into 16 GB VRAM — it also made the resulting adapter quantization-tolerant. An adapter trained on a full-precision base would have learned weight shifts that assume FP16 precision; quantizing those shifts to 4 bits could erase small but important deltas. An adapter trained on a 4-bit base learned its weight shifts in the same quantized regime it will be served in, so the quantization step is a return to familiar ground rather than a new distortion."

