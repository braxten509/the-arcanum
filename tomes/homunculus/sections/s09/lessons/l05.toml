[[lessons.exercises]]
id = "s09-l05-e1"
type = "mc"
points = 20
prompt = "Per this rite, why is injecting retrieved RAG context directly into the prompt token sequence (between the system message and user query) more reliable than relying solely on a SYSTEM prompt instruction like 'consult the provided reference material'?"
choices = [
  "Direct injection forces the model to attend to the context tokens because they are physically present in the input — the attention mechanism processes every input token, and the model cannot ignore evidence that is literally in its prompt. A SYSTEM prompt instruction is a soft constraint: the model may follow it on most queries but ignore it on some, producing ungrounded answers when the instruction fails — the same hard-vs-soft distinction the tenth rite taught between weight modifications (permanent) and prompt instructions (probabilistic)",
  "Direct injection enables KV-cache reuse — the context tokens are computed once and cached across multiple queries to the same reference corpus, reducing inference latency by 40–60%, while a SYSTEM prompt instruction requires re-tokenizing and re-computing the context for every query",
  "Direct injection avoids tokenization-related context loss — when context is placed in the SYSTEM prompt as free text, the tokenizer may split reference citations at word boundaries, making the cited values unrecognizable to the attention heads, while direct injection places context tokens immediately before the user query where the tokenizer processes them as a contiguous block",
  "Direct injection enables multi-turn retrieval — the retrieval script can be called between conversation turns to update the context as the topic changes, while a SYSTEM prompt instruction is fixed at conversation start and cannot respond to topic shifts mid-conversation"
]
answer = 0
whyWrong = "KV-cache reuse is not specific to direct injection — both approaches (injection and SYSTEM-prompt-only) build a prompt with context tokens; the KV-cache behavior is identical because the token sequence is what matters, not how it was constructed. Tokenization does not make context 'unrecognizable' — the tokenizer represents all text faithfully regardless of position; the attention heads process token embeddings, not word boundaries, and context placed in the SYSTEM prompt is processed identically to context placed elsewhere in the sequence. And multi-turn retrieval is available in both patterns — the retrieval script can run before every generation regardless of where the context is placed. The correct answer: hard constraint (physical presence in the prompt) vs. soft constraint (instruction to use context) — the same distinction the tenth rite's ward-control lesson established."
hint = "The lesson says 'the context tokens are physically present in the prompt, so attention to them is compulsory, not probabilistic,' while 'a SYSTEM prompt instruction is the soft complement.' The correct choice identifies the reliability gap between physically present tokens (attention is mandatory) and instructional prompts (attention is probabilistic)."
explain = "This is the same hard-constraint-vs-soft-constraint framework the tenth rite established for weight modifications vs. system prompts. A weight modification (merge, abliteration) changes what the model can do — it's a structural change. A prompt instruction changes what the model is asked to do — it's a suggestion. Directly injected context tokens are closer to the structural end: they are input, not instruction, and the model processes input deterministically. A system prompt that says 'use the reference material' without actually providing reference material in the prompt is an instruction without the evidence the instruction refers to — a recipe without ingredients."

