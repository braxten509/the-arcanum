[[lessons.exercises]]
id = "s09-l05-e3"
type = "fill"
points = 20
prompt = "Fill the missing serving-time prompt component — the block that sits between the system message and user query in the ChatML format, carrying the retrieved reference passages the grimoire's FAISS search returned."
code = '''def build_serving_prompt(system_prompt, query, retrieved_context):
    """Assemble the ChatML prompt with RAG context."""
    prompt = "<|im_start|>system\\n"
    prompt += f"{system_prompt}\\n\\n"
    prompt += "____\\n"
    prompt += f"{retrieved_context}<|im_end|>\\n"
    prompt += f"<|im_start|>user\\n{query}<|im_end|>\\n"
    prompt += "<|im_start|>assistant\\n"
    return prompt'''
answer = "Reference material:"
accept = ["Reference material:", "reference material:", "Reference material"]
hint = "The lesson shows the prompt structure as '<|im_start|>system\\n{system prompt}\\n\\nReference material:\\n{retrieved context}<|im_end|>.' The label 'Reference material:' precedes the retrieved context in the prompt — it signals to the model that the following text is external evidence to ground its answer in."

[[lessons.exercises]]
id = "s09-l05-e4"
type = "mc"
points = 20
prompt = "Per this rite, if the homunculus answers 'probably 14px to 18px' when the reference passage explicitly states 'Use 16px for body text,' what is the most likely root cause — and why should the artificer check retrieval quality before blaming the model or the system prompt?"
choices = [
  "The root cause is likely that the top-k retrieved chunks are not relevant to the query — the FAISS index returned passages about headings or color palettes instead of the body-text passage, so the model correctly ignored irrelevant context and generated from its general knowledge. Retrieval quality (measured by precision@k, the metric the ninth rite's final lesson taught) is upstream of generation quality — if the wrong context is injected, no prompting strategy can make the model produce a correct grounded answer",
  "The root cause is likely a tokenizer mismatch between the retrieval embedding model (e.g., all-MiniLM-L6-v2) and the generation model (Llama-3.1-8B) — the two tokenizers produce different token sequences for the same text, causing the context to be embedded in the prompt using tokens the generation model cannot parse, effectively making the context invisible",
  "The root cause is likely the SYSTEM prompt's grounding instruction being too weak — the phrase 'ground your answers in it' is too vague, and the model interprets 'it' as referring to its own training data rather than the provided context. A stronger instruction like 'you MUST cite the exact value from the reference material' would force the model to use the context on every query",
  "The root cause is likely that the serving script is placing the context AFTER the user query in the token sequence — the model generates its answer before attending to the context tokens, so the context arrives too late to influence the generation and is effectively ignored"
]
answer = 0
whyWrong = "Tokenizer mismatch between the embedding model and generation model is not a cause of context invisibility — the context is tokenized by the generation model's tokenizer when it enters the prompt, not the embedding model's tokenizer; the embedding model only runs during retrieval (to compute similarity scores), and the retrieved text is tokenized fresh by the generation model at serving time. While a stronger SYSTEM prompt might help in some cases, it cannot compensate for irrelevant context — the model correctly ignores unrelated passages, and no amount of instruction-following can make it ground an answer in text that doesn't contain the answer. And context placement after the user query is explicitly not the pattern this lesson describes — the lesson states context goes between system and user. The correct answer: retrieval quality (precision@k) is the upstream diagnostic — fix the search before blaming the generation."
hint = "The lesson says 'if the top-k chunks are not relevant to the query, the model correctly ignores irrelevant context and generates from its own knowledge instead. The grimoire's precision@k metric is the diagnostic: fix retrieval before blaming generation.' The correct choice identifies relevance failure as the root cause and precision@k as the measurement."
explain = "This is the upstream-diagnosis habit the eighth rite drilled: when a system's output is wrong, measure the quality of each upstream component before adjusting the downstream ones. In the RAG pipeline, the components are retrieval quality (does FAISS return relevant passages?) → context placement (is the context in the right position in the prompt?) → generation quality (does the model use the context?). Most RAG failures are retrieval failures — the model is doing its job (generating plausible text from its input), but its input is wrong. The precision@k metric the ninth rite taught computes exactly this: what fraction of the top-k retrieved chunks are relevant to the query. A precision@k below 0.5 means retrieval is the bottleneck."

