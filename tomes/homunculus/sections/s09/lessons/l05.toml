[[lessons]]
id = "s09-l05"
title = "RAG & Wards in the Bottle"
body = '''
<p>The Modelfile's SYSTEM prompt is the instruction half of the homunculus's serving-time behavior. The retrieval pipeline the ninth rite's grimoire chapter built — embeddings, FAISS index, chunked reference documents — is the context half. They meet at serving time: the retrieval script runs first, returning relevant context from the reference corpus, and that context is injected into the prompt before the homunculus generates its answer. This lesson teaches the integration point — where the grimoire's output enters the vessel's prompt — and why the placement of that context determines whether the model actually grounds its answers in the reference material.</p>

<p>The integration follows a two-stage pattern. <strong>Stage one: retrieval.</strong> The retrieval script the ninth rite built — the one that chunks the style-reference corpus, embeds document fragments with sentence-transformers, indexes them in FAISS, and returns the top-k most relevant chunks for a given query — runs independently before each generation. Its output is a block of text: the retrieved reference passages, labeled with their source document ids, formatted for insertion into a prompt. The script is the same artifact the grimoire chapter's final lab produced; this lesson does not rebuild it, it wires its output into the serving pipeline.</p>

<p><strong>Stage two: prompt assembly.</strong> The retrieved context block is inserted directly into the prompt token sequence — between the system prompt and the user query, in the ChatML format the sixth rite's template lesson established. The full serving-time prompt: <code>&lt;|im_start|&gt;system\n{system prompt}\n\nReference material:\n{retrieved context}&lt;|im_end|&gt;\n&lt;|im_start|&gt;user\n{user query}&lt;|im_end|&gt;\n&lt;|im_start|&gt;assistant\n</code>. The context sits between the system message and the user query for the same reason the system prompt sits at the very beginning of the sequence: the tenth rite's second lesson established that early tokens have the longest reach through the attention layers. Placing the context early — after the role framing but before the question — means every subsequent token the model generates attends to the reference passages. This is a hard constraint, not a soft instruction: the context tokens are physically present in the prompt, so attention to them is compulsory, not probabilistic. The SYSTEM prompt's grounding instruction ("When reference material is provided, ground your answers in it") is the soft complement — it biases the model toward using the context, but the physical presence of the context in the prompt is what makes that bias effective.</p>

<p>Compare the alternative: omitting the context from the prompt and relying solely on the SYSTEM prompt to instruct the model to "consult the grimoire." The model cannot consult anything — it has no access to the FAISS index, no ability to run the retrieval script, no vector store to query. A SYSTEM prompt that says "When reference material is provided" is a promise the prompt must keep: the reference material must arrive in the prompt token sequence before the model begins generating. The ninth rite introduced this pattern as "retrieve-then-generate"; this lesson is the fulfillment: the grimoire's retrieval output is serialized as text and concatenated into the prompt the Ollama TEMPLATE builds. The Modelfile does not change — the TEMPLATE still wraps the system prompt and user query in ChatML — but the serving script wraps the user query with the retrieved context before calling Ollama. The integration lives in the serving script, not the Modelfile; the Modelfile provides the format, the script provides the content.</p>

<p>The artificer should verify the integration before claiming the homunculus is finished. Test with a query whose answer is explicitly in the reference corpus — for example, "What font size should body text use according to the reference?" — and confirm that the model's answer cites the specific value from the reference passages (e.g., "16px") rather than generating a plausible-sounding but ungrounded number. A model that answers "probably 14px to 18px" when the reference says "16px" is not using the context — the context is present in the prompt but the model is ignoring it. The remedy is not a stronger SYSTEM prompt (the model already ignored it) but a review of the retrieval quality: if the top-k chunks are not relevant to the query, the model correctly ignores irrelevant context and generates from its own knowledge instead. The grimoire's precision@k metric — the ninth rite's final lesson drilled its computation — is the diagnostic: fix retrieval before blaming generation.</p>

<div class="field-notes"><div class="fn-head">FIELD NOTES // CONTEXT WINDOW BUDGET — DON'T FILL THE BOTTLE PAST THE RIM</div>
<p>The retrieved context competes with the system prompt and user query for space in the model's context window — the fifth rite's KV-cache math lesson established that a 7–8B model with a typical 8192-token context window at q4_k_m quantization leaves roughly 7000 tokens for the prompt and response combined after the KV cache is allocated. A system prompt of ~150 tokens, a retrieved context block of ~500 tokens (the top-3 chunks from a typical style-reference corpus), and a user query of ~50 tokens consume ~700 tokens of the prompt budget — leaving ~6300 tokens for the model's response. This is ample for formatting advice. But a reference corpus with long documents can produce context blocks that fill the window: if the retrieval returns a 4000-token passage for every query, the model has only ~3000 tokens for its response, and long multi-turn conversations will exceed the context limit. The ninth rite's chunk-size lesson chose 256-token chunks for this reason — short enough that the top-3 chunks never exceed ~800 tokens total, long enough that each chunk captures a complete formatting rule. The grimoire's chunking discipline and the vessel's context budget are the same equation viewed from opposite ends.</p></div>
'''
body_words = 530

