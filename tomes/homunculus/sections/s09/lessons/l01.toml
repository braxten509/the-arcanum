[[lessons]]
id = "s09-l01"
teaches = ["model-merge"]
title = "Merge the Permitted Adapter into a Fresh Base"
body = '''
<p>The NF4 training object is not the archival model you convert. Create <code>src/homunculus/merge.py</code> that first reads <code>reports/evaluation-decision.md</code> or its machine-readable companion and refuses unless the verdict is <code>MERGE</code> and the permitted adapter-manifest hash matches the directory on disk.</p>
<p>Load a fresh, unquantized Qwen base on CPU, attach that exact adapter, and merge safely:</p>
<pre><code>import torch
from pathlib import Path
from peft import PeftModel
from transformers import AutoModelForCausalLM, AutoTokenizer

MODEL_ID = "Qwen/Qwen3-8B"
MODEL_REVISION = "b968826d9c46dd6066d109eabc6255188de91218"

def merge(adapter_dir, output_dir):
    base = AutoModelForCausalLM.from_pretrained(
        MODEL_ID,
        revision=MODEL_REVISION,
        dtype=torch.bfloat16,
        device_map={"": "cpu"},
        low_cpu_mem_usage=True,
    )
    model = PeftModel.from_pretrained(base, adapter_dir)
    merged = model.merge_and_unload(safe_merge=True)
    merged.save_pretrained(
        output_dir, safe_serialization=True, max_shard_size="5GB")
    AutoTokenizer.from_pretrained(
        MODEL_ID, revision=MODEL_REVISION).save_pretrained(output_dir)
</code></pre>
<p><code>safe_merge=True</code> checks adapter weights for invalid values before adding the scaled LoRA delta to the base. The standalone adapter is not deleted or modified. The merged output under <code>artifacts/merged/bind-001/</code> is a full bfloat16 Hugging Face model split into manageable safetensors shards, plus config and tokenizer files.</p>
<p>This stage needs substantial system RAM and disk even though training fit in 16 GB VRAM. Before starting, use <code>free -h</code> and <code>df -h .</code>; plan for roughly the full half-precision model plus another copy during downstream conversion and quantization. If local RAM is insufficient, stop and add RAM/swap cautiously or perform this artifact stage on another trusted local machine; do not pretend GPU fit implies CPU merge fit.</p>
<p>After saving, reload the merged model in a fresh process and run one deterministic prompt. Compare its output with the adapter-enabled result as a smoke test. Small floating-point differences are possible; grossly different or incoherent output blocks conversion. Hash every shard and tokenizer/config file in <code>artifacts/merged/bind-001/manifest.json</code>.</p>
<div class="field-notes"><div class="fn-head">FIELD NOTES // MERGE FROM A CLEAN BASE</div>
<p>Reload the exact unquantized base named by the adapter manifest, attach the approved adapter, and merge once in a fresh process. Do not merge into the 4-bit training object or reuse a model mutated by evaluation. Hash the resulting checkpoint and rerun a small comparison before conversion so the merge boundary has its own evidence.</p></div>
'''

[[lessons.readings]]
label = "PEFT merge and unload"
url = "https://huggingface.co/docs/peft/v0.19.0/package_reference/peft_model"

[[lessons.exercises]]
id = "s09-l01-e2"
type = "text"
points = 15
prompt = "Which merge argument checks adapter values before addition?"
answer = "safe_merge=True"
accept = ["safe_merge", "safe_merge=true"]
hint = "It is passed to merge_and_unload."

[[lessons.exercises]]
id = "s09-l01-e1"
type = "mc"
points = 20
prompt = "Why reload a fresh unquantized base for merge?"
choices = [
  "The adapter contains no weights",
  "FAISS requires bfloat16",
  "Ollama trains during merge",
  "The approved LoRA delta should be folded into full-precision base weights for a standard HF checkpoint",
]
answer = 3
whyWrong = "The adapter contains learned weights; FAISS and Ollama are not participants in PEFT merging."
explain = "Training quantization is a memory technique, while the archival merge starts from the original precision."
hint = "The next converter expects a conventional Hugging Face model."

[[lessons.exercises]]
id = "s09-l01-e3"
type = "fill"
points = 20
prompt = "Complete the device mapping that keeps the full merge out of GPU memory."
code = '''device_map={"": "____"}'''
answer = "cpu"
hint = "This stage is limited by system RAM, not the 16 GB training card."

[[lessons.exercises]]
id = "s09-l01-e4"
type = "write"
points = 35
prompt = "Apply the permit hash check and print exactly: MERGE AUTHORIZED"
starter = '''verdict = "MERGE"
permitted_hash = "abc123"
actual_hash = "abc123"

status = "BLOCKED"
print(f"MERGE {status}")
'''
solution = '''verdict = "MERGE"
permitted_hash = "abc123"
actual_hash = "abc123"

authorized = verdict == "MERGE" and permitted_hash == actual_hash
print("MERGE AUTHORIZED" if authorized else "MERGE BLOCKED")
'''
expect = "MERGE AUTHORIZED"
hint = "Both the verdict and exact manifest identity must match."

[[lessons.exercises]]
id = "s09-l01-e5"
type = "type"
points = 12
reps = 2
prompt = "Retype the guarded PEFT operation that folds the approved adapter into the fresh base."
code = '''merged = model.merge_and_unload(safe_merge=True)'''
