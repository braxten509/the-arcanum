[[lessons]]
id = "s09-l01"
title = "From Adapter to Familiar"
body = '''
<p>At the seal, the student turns the trained adapter into a finished artifact. The merged model must survive quantization, conversion, and local serving without losing the behavior the earlier rites earned. If the chain breaks here, the earlier work was only a rehearsal.</p>
<div class="field-notes"><div class="fn-head">FIELD NOTES // FINAL SEAL</div>
<p>Every tool in this step is part of the deliverable: merge, convert, quantize, and serve. The final assistant is not complete until the local serving path is proven against the same sort of real use that will happen after the course ends.</p></div>
