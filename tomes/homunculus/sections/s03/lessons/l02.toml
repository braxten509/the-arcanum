[[lessons]]
id = "s03-l02"
teaches = ["gguf-quantization"]
title = "The GGUF Ladder"
body = '''
<p>The last rite's math used clean bytes-per-parameter numbers — 4, 2, 1, 0.5 — as if quantization only ever lands on a whole-byte boundary. GGUF, the format llama.cpp converts to and Ollama serves from, mostly doesn't. Its quant names encode a specific bit-width and a specific bucketing strategy, and reading them correctly is how you predict a model's real VRAM cost before you ever download it.</p>
<p>The legacy names are the simplest: <code>q8_0</code> and <code>q4_0</code> use fixed block formats whose metadata makes their effective storage exceed the headline integer. K-quant names such as <code>Q4_K_M</code> identify llama.cpp recipes, not an exact universal rate. The recipe may assign different tensor types by architecture and tensor category, and its implementation can change with the pinned llama.cpp commit. The S/M suffix is a named recipe choice; it is not a general law that every “sensitive early layer” receives a fixed number of extra bits.</p>
<pre><code><span class="k">quant_bits</span> = {
    "Q4_K_M_REFERENCE": 4.8944,
    "source": "llama.cpp quantize table for its stated Llama 3.1 8B example",
}</code></pre>
<p>The current official quantization table reports <code>4.8944</code> bits per weight for its specific Llama 3.1 8B Q4_K_M example. Treat that as a planning reference, not a Qwen file-size promise. For the artifact you actually produce, record bytes from <code>stat</code>, parameter count from GGUF metadata, the exact quantizer commit and command, and the measured ratio. File size also includes metadata and tensors that may use other formats, so measured bytes outrank arithmetic.</p>
<div class="callout">A quant name is not a promise of quality on its own — <code>q2_K</code> exists and will run, but pushing bits-per-weight that low measurably degrades output on anything but the largest base models. Smaller isn't free; it trades accuracy you may need back later.</div>
<div class="field-notes"><div class="fn-head">FIELD NOTES // WHY K-QUANTS BEAT A FLAT BIT-WIDTH</div>
<p>Quantization is an empirical release choice. Keep the F16 master, create the Q4_K_M child with the pinned tool, then compare actual bytes, loadability, throughput, and the frozen behavior suites. Two artifacts called “4-bit” can differ by recipe, architecture, metadata, and tool revision; the label alone is neither a memory measurement nor a quality verdict.</p></div>
'''

[[lessons.readings]]
label = "llama.cpp quantization overview"
url = "https://github.com/ggml-org/llama.cpp/blob/master/tools/quantize/README.md"

[[lessons.exercises]]
id = "s03-l02-e1"
type = "mc"
points = 20
prompt = "Why must the course measure its produced <code>Q4_K_M</code> artifact instead of treating the name as an exact four-bit file-size formula?"
choices = [
  "It's a labeling error in llama.cpp's naming scheme with no technical cause",
  "The name selects a quantization recipe; tensor formats, metadata, architecture, and the pinned implementation determine the produced bytes",
  "It stores the model twice, once at 4-bit and once at full precision, then averages the file size",
  "The K stands for 'kilobyte-aligned', which pads the file size upward with no effect on precision",
]
answer = 1
whyWrong = "There is no duplicate full-precision copy or meaningless padding explanation. The recipe and concrete artifact—not the headline digit—own the storage result."
explain = "A quant label selects an implementation recipe. Reproducible budgeting records the tool commit, command, produced bytes, metadata, and behavioral comparison."
hint = "Ask whether the label describes bytes, or selects the process that produces them."

[[lessons.exercises]]
id = "s03-l02-e2"
type = "text"
points = 15
prompt = "In a GGUF quant name like <code>q4_0</code>, what does the trailing <code>_0</code> specifically mark, as opposed to a K-quant suffix like <code>_K_M</code>?"
answer = "the oldest, plainest bucketing scheme with one scale factor per block"
accept = ["legacy quantization", "the legacy scheme", "one scale per block, no per-weight nuance", "the old flat quantization scheme"]
hint = "It's described in the lesson's second paragraph, contrasted directly against the newer K-quant family's variable bit spend."

[[lessons.exercises]]
id = "s03-l02-e3"
type = "fill"
points = 20
prompt = "Fill the reference-table bits-per-weight value for the stated llama.cpp Llama 3.1 8B example."
code = '''quant_bits = {
    "Q4_K_M_REFERENCE": ____,
}'''
answer = "4.8944"
hint = "Read the official-table value precisely; do not round the recipe to its headline digit."

[[lessons.exercises]]
id = "s03-l02-e4"
type = "write"
points = 30
prompt = "Given measured artifact bytes and an F16 master size, compute the Q4_K_M size in GiB and compression ratio. Print exactly: <code>Q4 4.88 GiB RATIO 0.31</code>."
starter = '''artifact_bytes = 5_239_497_728
f16_bytes = 16_900_000_000

size_gib = 0
ratio = 0
print(f"Q4 {size_gib:.2f} GiB RATIO {ratio:.2f}")
'''
expect = "Q4 4.88 GiB RATIO 0.31"
solution = '''artifact_bytes = 5_239_497_728
f16_bytes = 16_900_000_000

size_gib = artifact_bytes / (1024 ** 3)
ratio = artifact_bytes / f16_bytes
print(f"Q4 {size_gib:.2f} GiB RATIO {ratio:.2f}")
'''
hint = "Convert bytes with 1024 cubed, then divide the measured child bytes by the measured master bytes."
