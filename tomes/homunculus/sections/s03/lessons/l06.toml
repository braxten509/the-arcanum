[[lessons]]
id = "s03-l06"
teaches = ["model-selection"]
title = "Commit to a Budget That Can Be Tested"
body = '''
<p>Serving and training use different 4-bit formats. A <code>Q4_K_M</code> GGUF estimate belongs to llama.cpp inference; it is not the memory footprint of a bitsandbytes NF4 training run. QLoRA memory includes the quantized base plus quantization metadata and work buffers, trainable adapter state, activations, gradients, optimizer state, framework reservations, and allocator fragmentation. During training, <code>use_cache=False</code>, so the inference KV cache is not the dominant line item. Sequence length and activation storage are.</p>
<p>Use estimates to reject impossible choices, then let a real one-batch dry run prove the candidate. For a 16 GB card, <code>Qwen/Qwen3-8B</code> is the course default: it is small enough to attempt with NF4, useful enough to be a real assistant, Apache-2.0 licensed, and matched to the <code>qwen3:8b</code> baseline. A 14B candidate may serve quantized yet leave too little training headroom. The course does not promise a fabricated GB total before the exact kernel and sequence shape run.</p>
<p>Open <code>homunculus.toml</code> and save the first durable configuration:</p>
<pre><code>[model]
base_id = "Qwen/Qwen3-8B"
base_revision = "b968826d9c46dd6066d109eabc6255188de91218"
tokenizer_config_sha256 = "record-the-downloaded-file-hash"

[toolchain]
container_digest = "sha256:96a2fb24dec9896e2f8238178f0c49d0dcc4c7dcc597be09e4564316bd86d191"
llama_cpp_commit = "555881ebc8b0fc0402b30e09258a32a7bfd13c52"
ollama_model_digest = "record-the-full-local-api-digest"
environment_lock_sha256 = "record-the-resolved-lock-hash"

[training]
max_length = 1024
batch_size = 1
gradient_accumulation = 8
rank = 16
alpha = 32
dropout = 0.05
learning_rate = 0.0001
epochs = 1
seed = 42

[serving]
ollama_name = "homunculus"
quant = "Q4_K_M"
num_ctx = 4096

[memory]
physical_gib = 16
required_headroom_gib = 2</code></pre>
<p>The quoted “record” values are instructions to copy resolved identities, not values to leave in a finished contract. Fetch the Hugging Face model and tokenizer at the stated revision, hash the downloaded configuration files, and bind every report to those hashes. The two-gibibyte headroom is a stop condition, not a claim that training will use exactly fourteen. Section V records allocated and reserved peaks after a dry step.</p>
<p>Write <code>reports/memory-budget.md</code> with two separate tables—one for NF4 training and one for GGUF serving. Name every uncertain term and its proof command. The document is complete when it says what would make the choice fail, not when every row contains a confident-looking number.</p>
<p>Before trusting the saved contract, parse it with <code>python -c 'import tomllib; tomllib.load(open("homunculus.toml","rb"))'</code>. No output and a zero exit mean the syntax is sound; a traceback names the line to repair. Then rerun <code>python -m homunculus.doctor training</code>. That second command checks the live training bench, not the budget arithmetic, so keep those failure owners separate.</p>
<div class="field-notes"><div class="fn-head">FIELD NOTES // ESTIMATES CHOOSE A TEST</div>
<p>The ledger is a planning instrument, not a certificate. It helps choose sequence length, microbatch size, accumulation, and reserve before expensive work begins. The certificate is the peak memory from the exact training path. Keep both: the estimate explains the choice, while the measurement catches allocator, kernel, and activation costs the estimate omitted.</p></div>
'''

[[lessons.readings]]
label = "Qwen3-8B model card"
url = "https://huggingface.co/Qwen/Qwen3-8B"

[[lessons.readings]]
label = "Transformers bitsandbytes quantization"
url = "https://huggingface.co/docs/transformers/v5.13.0/quantization/bitsandbytes"

[[lessons.exercises]]
id = "s03-l06-e1"
type = "mc"
points = 20
prompt = "Why is a Q4_K_M file-size estimate not a complete QLoRA training budget?"
choices = [
  "GGUF is the serving representation, while training uses NF4 plus activations and training state",
  "Q4_K_M always consumes exactly twice the file size in VRAM",
  "GGUF includes an Adam optimizer",
  "QLoRA does not load base weights",
]
answer = 0
whyWrong = "There is no universal two-times rule, GGUF has no optimizer state, and QLoRA still loads the frozen base."
explain = "The two phases use different formats and simultaneous memory line items."
hint = "Separate the llama.cpp serving path from the bitsandbytes training path."

[[lessons.exercises]]
id = "s03-l06-e2"
type = "text"
points = 15
prompt = "What exact Hugging Face model id does the course freeze?"
answer = "Qwen/Qwen3-8B"
accept = ["qwen/qwen3-8b"]
hint = "It is the base_id in homunculus.toml."

[[lessons.exercises]]
id = "s03-l06-e3"
type = "fill"
points = 20
prompt = "Complete the first training knob to reduce when the measured dry run leaves too little headroom."
code = '''[training]
____ = 1024'''
answer = "max_length"
hint = "It controls the number of tokens whose activations must be retained."

[[lessons.exercises]]
id = "s03-l06-e4"
type = "mc"
points = 20
prompt = "Which result finally proves this model/config pair fits training?"
choices = [
  "The GGUF filename contains Q4",
  "A real dry training step whose peak reserved memory preserves the configured headroom",
  "The model card says 8B",
  "Ollama can open the downloaded model",
]
answer = 1
whyWrong = "Names and inference success are useful estimates but do not allocate training activations or optimizer state."
explain = "The exact software, kernels, sequence shape, and card meet only in the measured dry step."
hint = "Choose runtime evidence from the training path."

[[lessons.exercises]]
id = "s03-l06-e5"
type = "write"
points = 35
prompt = "Given physical and reserved GiB, print exactly: HEADROOM 3.2 GiB PASS"
starter = '''physical_gib = 16.0
reserved_gib = 12.8
required_headroom_gib = 2.0

headroom = 0
status = "FAIL"
print(f"HEADROOM {headroom:.1f} GiB {status}")
'''
solution = '''physical_gib = 16.0
reserved_gib = 12.8
required_headroom_gib = 2.0

headroom = physical_gib - reserved_gib
status = "PASS" if headroom >= required_headroom_gib else "FAIL"
print(f"HEADROOM {headroom:.1f} GiB {status}")
'''
expect = "HEADROOM 3.2 GiB PASS"
hint = "Subtract reserved from physical, then compare the result with the required headroom."
