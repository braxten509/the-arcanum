[[lessons.exercises]]
id = "s03-l05-e6"
type = "write"
points = 35
prompt = "Given <code>adapter_params = 8_000_000</code> and the <code>bytes_per_param</code> dict below, compute the adapter's training-state footprint in whole megabytes (sum the dict's values, multiply by adapter_params, integer-divide by 1,000,000) and print exactly: <code>ADAPTER FOOTPRINT 96 MB</code> — computed from the dict, not hardcoded."
starter = '''adapter_params = 8_000_000
bytes_per_param = {"weights": 2, "gradients": 2, "adam_m": 4, "adam_v": 4}

# Implement: sum bytes_per_param's values, multiply by adapter_params,
# integer-divide by 1_000_000 to get whole MB, then print:
#   ADAPTER FOOTPRINT 96 MB
footprint_mb = 0
print(f"ADAPTER FOOTPRINT {footprint_mb} MB")
'''
expect = "ADAPTER FOOTPRINT 96 MB"
solution = '''adapter_params = 8_000_000
bytes_per_param = {"weights": 2, "gradients": 2, "adam_m": 4, "adam_v": 4}

footprint_mb = adapter_params * sum(bytes_per_param.values()) // 1_000_000
print(f"ADAPTER FOOTPRINT {footprint_mb} MB")
'''
hint = "total bytes/param is sum(bytes_per_param.values()) = 12, so footprint_mb = adapter_params * 12 // 1_000_000 (use // for a whole-number MB, not /)."
