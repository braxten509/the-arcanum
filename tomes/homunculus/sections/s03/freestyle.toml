[freestyle]
requires = ["python-craft", "vram-budget", "gguf-quantization", "kv-cache", "training-memory", "qlora-budget", "model-selection"]
title = "THE WORKING: FREEZE THE VESSEL CONTRACT"
brief = '''Freeze the complete model and memory contract in <code>homunculus.toml</code>.<ul><li>Record the Qwen id and revision, tokenizer/config hashes, Ollama digest/version, ROCm image digest, llama.cpp commit, and resolved dependency-lock hash.</li><li>Keep NF4 training and Q4_K_M serving separate; use the official table only as a labeled reference example and make produced artifact bytes authoritative.</li><li>Derive the all-linear adapter estimate from the actual module graph and require PEFT's trainable report.</li><li>Name every training-memory line item, uncertainty, two-GiB headroom gate, and recovery order.</li><li>Write <code>evidence/receipts/s03.json</code> with parsed identities, formula inputs, and schema/check results, never model files or private text.</li></ul>A missing identity, mixed-format budget, parse failure, or unmeasured fit claim blocks the Working.'''
reward = 220
xray = "The decisive defect is a mixed budget that treats GGUF serving numbers as NF4 training proof. Require explicit uncertainties and a measurable dry-run gate."

[freestyle.badge]
id = "s03-badge"
name = "VESSEL SIZED"
desc = "Awarded for a fixed base and a falsifiable 16 GB memory contract."

[[freestyle.rubric]]
criterion = "Phase-correct memory model"
weight = 35
desc = "Training and serving formats and line items are separated correctly."
essential = true
minimumScore = 8

[[freestyle.rubric]]
criterion = "Frozen configuration"
weight = 25
desc = "The exact base, sequence, adapter, serving, and headroom values are saved in homunculus.toml."
essential = true
minimumScore = 8

[[freestyle.rubric]]
criterion = "Live acceptance gate"
weight = 30
desc = "A future measured dry step, its pass threshold, and the narrow recovery order are explicit."
essential = true
minimumScore = 7

[[freestyle.rubric]]
criterion = "Python and configuration craft"
weight = 10
desc = "Any supporting Python uses snake_case names, UPPER_CASE constants, four-space indentation, grouped imports, and separated top-level definitions; the TOML is consistently laid out and parses cleanly."

[[freestyle.verification]]
id = "compile-s03"
command = "compile"
label = "Compile source and tests"
required = true
expect = { exitCode = 0 }

[[freestyle.verification]]
id = "tests-s03"
command = "tests"
label = "Run unit tests"
required = true
expect = { exitCode = 0 }

[[freestyle.verification]]
id = "evidence-s03"
command = "evidence"
label = "Validate model and memory receipt"
required = true
args = ["s03"]
expect = { exitCode = 0 }
