[freestyle]
requires = ["python-craft", "model-selection", "dataset-curation", "completion-only-loss", "lora-math", "qlora-config", "sft-trainer", "hyperparameter-plan", "rocm-training", "adapter-artifact"]
title = "THE WORKING: PERFORM THE REAL BIND"
brief = '''Run a genuine, pinned NF4 QLoRA bind and preserve a reloadable private adapter.<ul><li>Load the exact Qwen revision/tokenizer hashes and private split hashes with completion-only loss.</li><li>Enumerate all-linear target names/shapes and record PEFT's 43.65M-class rank-16 trainable count; do not use a one-layer estimate.</li><li>Treat rank, alpha, learning rate, and epochs as measured candidates; predeclare gates and vary one factor at a time.</li><li>Require a real gfx1201 dry step, finite metrics, measured two-GiB headroom, and a fresh-process reload before the full bind.</li><li>Keep raw metrics and artifacts excluded; write <code>evidence/receipts/s05.json</code> with hashes, counts, peak values, gate results, and a redacted live receipt.</li></ul>A failed dry run, identity mismatch, non-finite loss, headroom failure, missing completion mask, or failed reload blocks the Working.'''
reward = 260
xray = "Inspect code, metrics, and artifact together. A printout claiming QLoRA is not proof if the model was CPU-bound, the base was unquantized, completion masking was absent, or the adapter cannot reload."

[freestyle.badge]
id = "s05-badge"
name = "THE BIND"
desc = "Awarded for a measured, reloadable QLoRA adapter trained on the target Radeon."

[[freestyle.rubric]]
criterion = "Current training contract"
weight = 30
desc = "Pinned TRL/PEFT/bitsandbytes APIs, data schema, mask, and QLoRA configuration agree."
essential = true
minimumScore = 8

[[freestyle.rubric]]
criterion = "Live Radeon run"
weight = 30
desc = "Dry and full paths execute on gfx1201 with finite metrics and the configured headroom."
essential = true
minimumScore = 9

[[freestyle.rubric]]
criterion = "Durable adapter"
weight = 30
desc = "The exact artifact reloads, matches the base, and carries data/config/environment/file hashes."
essential = true
minimumScore = 9

[[freestyle.rubric]]
criterion = "Python craft"
weight = 10
desc = "train.py and artifact utilities use snake_case names, UPPER_CASE constants, four-space indentation, grouped imports, and clearly separated top-level functions."

[[freestyle.verification]]
id = "compile-s05"
command = "compile"
label = "Compile source and tests"
required = true
expect = { exitCode = 0 }

[[freestyle.verification]]
id = "tests-s05"
command = "tests"
label = "Run unit tests"
required = true
expect = { exitCode = 0 }

[[freestyle.verification]]
id = "evidence-s05"
command = "evidence"
label = "Validate sanitized training receipt"
required = true
args = ["s05"]
expect = { exitCode = 0 }
