[[lessons]]
id = "s05-l03"
teaches = ["sft-trainer"]
title = "Write the Current TRL Training Command"
body = '''
<p>Current TRL accepts the structured prompt-completion dataset directly. It does not need the older <code>formatting_func</code>, <code>dataset_text_field</code>, or <code>tokenizer=</code> examples. Add this trainer construction to <code>src/homunculus/train.py</code>:</p>
<pre><code>import argparse
import json
from pathlib import Path
import torch
from datasets import load_dataset
from transformers import AutoTokenizer
from trl import SFTConfig, SFTTrainer

MODEL_ID = "Qwen/Qwen3-8B"

def build_trainer(run_id, max_steps=-1):
    data = load_dataset("json", data_files={
        "train": "data/curated/train.jsonl",
        "eval": "data/curated/eval.jsonl",
    })
    tokenizer = AutoTokenizer.from_pretrained(MODEL_ID)
    args = SFTConfig(
        output_dir=f"runs/{run_id}/checkpoints",
        max_length=1024,
        completion_only_loss=True,
        per_device_train_batch_size=1,
        per_device_eval_batch_size=1,
        gradient_accumulation_steps=8,
        learning_rate=1e-4,
        num_train_epochs=1,
        max_steps=max_steps,
        logging_steps=5,
        eval_strategy="epoch",
        save_strategy="epoch",
        bf16=True,
        fp16=False,
        optim="adamw_torch",
        gradient_checkpointing=True,
        report_to="none",
        seed=42,
        model_init_kwargs={"dtype": "bfloat16", "use_cache": False},
    )
    return SFTTrainer(
        model=MODEL_ID,
        args=args,
        train_dataset=data["train"],
        eval_dataset=data["eval"],
        processing_class=tokenizer,
        quantization_config=quantization,
        peft_config=adapter,
    ), tokenizer</code></pre>
<p><code>processing_class</code> is the current tokenizer/preprocessor parameter. The trainer recognizes conversational prompt-completion rows, applies Qwen's native template, and—because the config says so—computes loss only over completion tokens. <code>gradient_accumulation_steps=8</code> means each microbatch performs forward and backward, but the optimizer updates after eight microbatches; it does not retain eight batches' activations simultaneously.</p>
<p>The standard PyTorch AdamW optimizer avoids making an optional paged optimizer another compatibility boundary. Gradient checkpointing trades extra computation for lower activation memory. <code>use_cache=False</code> avoids inference caching during training. The eval and save strategies are both epoch-based so the held-out set is measured under the same token boundary.</p>
<p>Complete <code>main()</code> in the AMD lesson after the dry-run gate is defined. Do not begin a full run until the dataset loader reports both splits, the template sample is correct, trainable parameters are nonzero, and a one-step run leaves the required memory headroom.</p>
<div class="field-notes"><div class="fn-head">FIELD NOTES // THE PINNED API IS THE COURSE API</div>
<p>TRL examples age quickly because argument names and dataset pathways change. The project therefore treats its pinned constructor signature as a contract: conversational prompt/completion rows, <code>processing_class</code>, completion-only loss, PEFT configuration, and a bounded <code>max_length</code>. If upstream documentation differs, inspect the installed signature before translating code.</p></div>
'''

[[lessons.readings]]
label = "TRL SFTTrainer"
url = "https://huggingface.co/docs/trl/sft_trainer"

[[lessons.readings]]
label = "TRL dataset formats"
url = "https://huggingface.co/docs/trl/dataset_formats"

[[lessons.exercises]]
id = "s05-l03-e1"
type = "mc"
points = 20
prompt = "Which argument replaces the older tokenizer= parameter in this pinned TRL API?"
choices = ["processing_class", "dataset_text_field", "formatting_func", "vocab_path"]
answer = 0
whyWrong = "The other choices are old pathways or invented; current SFTTrainer receives the tokenizer through processing_class."
explain = "The course code matches the installed TRL 1.8 interface."
hint = "It is passed immediately after eval_dataset in the constructor."

[[lessons.exercises]]
id = "s05-l03-e2"
type = "text"
points = 15
prompt = "Which class owns completion_only_loss and max_length?"
answer = "SFTConfig"
accept = ["trl.SFTConfig", "sftconfig"]
hint = "It is imported beside SFTTrainer."

[[lessons.exercises]]
id = "s05-l03-e3"
type = "fill"
points = 20
prompt = "Complete the option that disables inference caching during training."
code = '''model_init_kwargs={"dtype": "bfloat16", "____": False}'''
answer = "use_cache"
hint = "KV caching belongs to generation, not this training pass."

[[lessons.exercises]]
id = "s05-l03-e4"
type = "mc"
points = 20
prompt = "What does gradient accumulation of eight mean?"
choices = ["Backward runs per microbatch, and the optimizer steps after eight accumulated microbatches", "Eight batches of activations are retained before any backward pass", "The model trains eight adapters at once", "The dataset is repeated eight epochs"]
answer = 0
whyWrong = "Accumulation delays the optimizer update; it does not multiply adapters, epochs, or simultaneous activation storage."
explain = "It increases effective batch size while preserving a microbatch size of one."
hint = "Separate backward from optimizer.step."

[[lessons.exercises]]
id = "s05-l03-e5"
type = "write"
points = 35
prompt = "Compute effective batch size and print exactly: EFFECTIVE BATCH 8"
starter = '''per_device = 1
accumulation = 8
devices = 1

effective = 0
print(f"EFFECTIVE BATCH {effective}")
'''
solution = '''per_device = 1
accumulation = 8
devices = 1

effective = per_device * accumulation * devices
print(f"EFFECTIVE BATCH {effective}")
'''
expect = "EFFECTIVE BATCH 8"
hint = "Multiply microbatch, accumulation steps, and device count."
