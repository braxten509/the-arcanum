[[lessons]]
id = "s05-l02"
teaches = ["qlora-config"]
title = "Configure the Frozen Base and the Trainable Seam"
body = '''
<p>QLoRA combines two independent configurations. <code>BitsAndBytesConfig</code> controls how the frozen Qwen base is stored and computed; <code>LoraConfig</code> controls which new parameters can learn. Save both in <code>src/homunculus/train.py</code> exactly, then let the live dry run verify the preview ROCm backend.</p>
<pre><code>import torch
from peft import LoraConfig
from transformers import BitsAndBytesConfig

quantization = BitsAndBytesConfig(
    load_in_4bit=True,
    bnb_4bit_quant_type="nf4",
    bnb_4bit_compute_dtype=torch.bfloat16,
    bnb_4bit_use_double_quant=True,
)

adapter = LoraConfig(
    r=16,
    lora_alpha=32,
    lora_dropout=0.05,
    target_modules="all-linear",
    bias="none",
    task_type="CAUSAL_LM",
)</code></pre>
<p>NF4 is the four-bit representation designed for normally distributed weights. Computation still uses bfloat16; the adapter itself is not trained in four-bit arithmetic. Double quantization compresses quantization constants as well as base weights. None of these settings makes gradients flow into the base model.</p>
<p>PEFT's current <code>"all-linear"</code> shorthand targets eligible linear/Conv1D modules while excluding the output layer for standard pretrained models. It is a supported QLoRA default and avoids a brittle hand-written list of Qwen module names. After <code>SFTTrainer</code> prepares the model, call <code>trainer.model.print_trainable_parameters()</code>. The trainable count must be greater than zero and a small fraction of the total. Record the printed value in the run report; do not accept “the trainer started” as proof that adapters attached.</p>
<p>The pinned bitsandbytes wheel lists <code>gfx1201</code> as a preview ROCm target. Preview means runtime proof is mandatory, not that you should fetch an old experimental source branch. If the one-step run fails in a bitsandbytes kernel, capture the complete traceback, package versions, ROCm version, and architecture from the doctor. Changing quantization libraries without updating the course contract would be a new experiment, not a hidden repair.</p>
<div class="field-notes"><div class="fn-head">FIELD NOTES // ATTACHMENT IS MEASURABLE</div>
<p>Do not infer that LoRA attached because model loading returned without an exception. Print trainable parameter counts, target module names, dtype, and the trainable fraction. A nonzero but tiny fraction is the expected shape. Zero means nothing can learn; a large fraction usually means the base was not frozen as intended.</p></div>
'''

[[lessons.readings]]
label = "Transformers bitsandbytes quantization"
url = "https://huggingface.co/docs/transformers/v5.13.0/quantization/bitsandbytes"

[[lessons.readings]]
label = "PEFT LoRA configuration"
url = "https://huggingface.co/docs/peft/v0.19.0/package_reference/lora"

[[lessons.exercises]]
id = "s05-l02-e1"
type = "mc"
points = 20
prompt = "Which values remain trainable in this QLoRA configuration?"
choices = [
  "Every NF4 base weight",
  "The bfloat16 LoRA adapter parameters",
  "The GGUF metadata header",
  "The FAISS index vectors",
]
answer = 1
whyWrong = "The base is frozen; GGUF and FAISS belong to later serving and retrieval stages."
explain = "QLoRA stores the large base cheaply while retaining higher-precision trainable adapters."
hint = "The Q compresses the frozen part; LoRA names the learned part."

[[lessons.exercises]]
id = "s05-l02-e2"
type = "text"
points = 15
prompt = "Which NF4 option also compresses the quantization constants?"
answer = "bnb_4bit_use_double_quant"
accept = ["bnb_4bit_use_double_quant=True", "double quantization"]
hint = "Its name contains both double and quant."

[[lessons.exercises]]
id = "s05-l02-e3"
type = "fill"
points = 20
prompt = "Complete PEFT's model-independent QLoRA target shorthand."
code = '''adapter = LoraConfig(
    target_modules="____",
)'''
answer = "all-linear"
hint = "It targets the eligible linear layers without a hand-written Qwen list."

[[lessons.exercises]]
id = "s05-l02-e4"
type = "mc"
points = 20
prompt = "What is the acceptance evidence that adapters attached?"
choices = [
  "The model download completes",
  "The baseline report exists",
  "print_trainable_parameters reports a nonzero, small trainable fraction",
  "Ollama lists qwen3:8b",
]
answer = 2
whyWrong = "Those checks prove other boundaries but do not inspect the prepared PEFT model."
explain = "Trainable-parameter reporting directly observes the adapter attachment."
hint = "Inspect the parameters that require gradients."

[[lessons.exercises]]
id = "s05-l02-e5"
type = "write"
points = 35
prompt = "Compute the trainable percentage and print exactly: TRAINABLE 0.200%"
starter = '''trainable = 16_000_000
total = 8_000_000_000

percent = 0
print(f"TRAINABLE {percent:.3f}%")
'''
solution = '''trainable = 16_000_000
total = 8_000_000_000

percent = trainable / total * 100
print(f"TRAINABLE {percent:.3f}%")
'''
expect = "TRAINABLE 0.200%"
hint = "Divide trainable by total, multiply by 100, and format to three decimals."
