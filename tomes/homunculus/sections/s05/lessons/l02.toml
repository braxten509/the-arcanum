[[lessons.exercises]]
id = "s05-l02-e5"
type = "write"
points = 35
prompt = "Given <code>base_params = 7_000_000_000</code> (the frozen base model's parameter count) and a config dict <code>adapter_spec</code> with rank, target in/out dimensions, and module count, compute the adapter's total trainable parameters and the ratio <code>adapter / base × 100</code>. Print <code>RATIO &lt;percent&gt;%</code> rounded to 4 decimal places — computed from the variables, not hardcoded."
starter = '''base_params = 7_000_000_000

# adapter_spec: rank=16, in_dim=4096, out_dim=4096, modules=4
rank = 16
in_dim = 4096
out_dim = 4096
modules = 4

# TODO: adapter params = rank * (in_dim + out_dim) * modules
# ratio = adapter_params / base_params * 100
# Print RATIO <ratio>% with 4 decimal places
print("RATIO 0.0000%")
'''
expect = "RATIO 0.0075%"
hint = "adapter_params = rank * (in_dim + out_dim) * modules = 16 * 8192 * 4 = 524288. ratio = 524288 / 7_000_000_000 * 100 ≈ 0.0074898… rounds to 0.0075%. Use f'RATIO {ratio:.4f}%' to format."
