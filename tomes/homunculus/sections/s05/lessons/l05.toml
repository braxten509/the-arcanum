starter = '''loss_log = [
    2.35, 2.18, 2.41, 1.97, 2.05, 1.88,
    1.92, 1.76, 1.83, 1.95, 1.71, 1.79,
]

# TODO: find the index (step number) of the lowest loss value.
# Print BEST STEP <index> LOSS <value rounded to 2 places>.
