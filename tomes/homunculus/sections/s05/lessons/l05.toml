[[lessons]]
id = "s05-l05"
teaches = ["rocm-training"]
title = "Dry-Step, Measure, Then Bind"
body = '''
<p>Finish <code>train.py</code> with a CLI that makes the one-step proof and the full run the same code path:</p>
<pre><code>def main():
    parser = argparse.ArgumentParser()
    parser.add_argument("--run-id", required=True)
    parser.add_argument("--max-steps", type=int, default=-1)
    cli = parser.parse_args()
    trainer, tokenizer = build_trainer(cli.run_id, cli.max_steps)
    trainer.model.print_trainable_parameters()
    torch.cuda.reset_peak_memory_stats()
    result = trainer.train()
    torch.cuda.synchronize()
    adapter_dir = Path("artifacts/adapters") / cli.run_id
    trainer.save_model(adapter_dir)
    tokenizer.save_pretrained(adapter_dir)
    metrics = dict(result.metrics)
    metrics["max_memory_allocated_gib"] = torch.cuda.max_memory_allocated() / 1024**3
    metrics["max_memory_reserved_gib"] = torch.cuda.max_memory_reserved() / 1024**3
    metrics["gpu"] = torch.cuda.get_device_name(0)
    metrics["architecture"] = torch.cuda.get_device_properties(0).gcnArchName
    run_dir = Path("runs") / cli.run_id
    run_dir.mkdir(parents=True, exist_ok=True)
    (run_dir / "training-metrics.json").write_text(
        json.dumps(metrics, indent=2, default=str) + "\n", encoding="utf-8")

if __name__ == "__main__":
    main()</code></pre>
<p>Inside the tested ROCm container, run <code>python -m homunculus.doctor training</code>, then <code>python -m homunculus.train --run-id dry-001 --max-steps 1</code>. Inspect the report rather than guessing from fan noise. It must name <code>gfx1201</code>, report a finite training loss, save a reloadable adapter, and leave at least two GiB between physical VRAM and peak reserved memory. A one-step adapter is disposable evidence, not the product.</p>
<p>If the dry step fails, preserve the traceback. An out-of-memory error calls for the Section III recovery order: reduce <code>max_length</code>, confirm gradient checkpointing and batch size one, then reconsider the base. An import or missing-kernel error calls for the doctor and pinned-environment checks. A NaN loss calls for inspecting the data boundary and compute dtype. Do not change five knobs together.</p>
<p>After the dry step passes, run <code>python -m homunculus.train --run-id bind-001</code>. There is no universal “correct starting loss” or guaranteed runtime. Judge the run by finite loss, completed evaluation, measured peaks, saved artifacts, and later held-out behavior. Hardware speed, corpus length, sequence distribution, and library kernels all affect elapsed time.</p>
<div class="field-notes"><div class="fn-head">FIELD NOTES // ONE STEP CROSSES MANY BOUNDARIES</div>
<p>A real dry step proves far more than an import test: the model quantizes, adapters attach, rows tokenize, labels contain supervised tokens, forward and backward kernels execute, the optimizer updates, peak memory is measured, and an adapter checkpoint is written. Preserve its report and traceback because it is the smallest reproducible version of the full bind.</p></div>
'''

[[lessons.readings]]
label = "AMD PyTorch verification"
url = "https://rocm.docs.amd.com/projects/radeon-ryzen/en/latest/docs/install/installrad/native_linux/install-pytorch.html"

[[lessons.readings]]
label = "PyTorch CUDA memory APIs used by ROCm"
url = "https://docs.pytorch.org/docs/stable/cuda.html#memory-management"

[[lessons.exercises]]
id = "s05-l05-e1"
type = "mc"
points = 20
prompt = "Why must the dry step use the same train.py path as the full bind?"
choices = [
  "So the one-step adapter becomes the final model",
  "So evaluation data enters training",
  "So Ollama can merge during the step",
  "So its compatibility and memory proof covers the code that will actually train",
]
answer = 3
whyWrong = "The dry artifact is disposable; evaluation leakage and Ollama merging would break stage boundaries."
explain = "A separate toy smoke script can pass while the real trainer still fails."
hint = "The proof is valuable only if it exercises the production path."

[[lessons.exercises]]
id = "s05-l05-e2"
type = "text"
points = 15
prompt = "Which metric is compared with physical VRAM for the conservative headroom gate?"
answer = "max_memory_reserved_gib"
accept = ["peak reserved memory", "torch.cuda.max_memory_reserved", "max_memory_reserved_gib"]
hint = "Reserved includes memory held by the allocator."

[[lessons.exercises]]
id = "s05-l05-e3"
type = "fill"
points = 20
prompt = "Complete the CLI option that limits the smoke run to one optimizer step."
code = "python -m homunculus.train --run-id dry-001 ____ 1"
answer = "--max-steps"
hint = "It maps to SFTConfig.max_steps."

[[lessons.exercises]]
id = "s05-l05-e4"
type = "mc"
points = 20
prompt = "The dry step hits OOM at max_length 1024. What is the first narrow change?"
choices = [
  "Reduce max_length and rerun the identical measurement",
  "Set a false HSA architecture override",
  "Move evaluation rows into training",
  "Switch to an unrelated base without recording it",
]
answer = 0
whyWrong = "Overrides, leakage, and silent base changes do not address the measured activation budget honestly."
explain = "Sequence length is the first configured activation lever in the recovery order."
hint = "Change the term most directly tied to retained activations."

[[lessons.exercises]]
id = "s05-l05-e5"
type = "write"
points = 35
prompt = "Compute measured headroom and print exactly: DRY PASS headroom=2.4"
starter = '''physical = 16.0
reserved = 13.6
required = 2.0

headroom = 0
status = "FAIL"
print(f"DRY {status} headroom={headroom:.1f}")
'''
solution = '''physical = 16.0
reserved = 13.6
required = 2.0

headroom = physical - reserved
status = "PASS" if headroom >= required else "FAIL"
print(f"DRY {status} headroom={headroom:.1f}")
'''
expect = "DRY PASS headroom=2.4"
hint = "Subtract peak reserved from physical, then apply the required threshold."
