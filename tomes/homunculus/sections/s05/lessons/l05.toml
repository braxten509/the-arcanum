[[lessons]]
id = "s05-l05"
teaches = ["hyperparameter-plan"]
title = "Choose Optimizer Settings by Controlled Trials"
body = '''
<p>Learning rate and epoch count govern an optimization process; neither can be selected from a universal “records per parameter” rule. Values such as <code>5e-5</code>, <code>1e-4</code>, and <code>2e-4</code> are candidates for this project, not a settled safe range. The first measured run uses <code>r=16</code>, <code>lora_alpha=32</code>, <code>learning_rate=1e-4</code>, and one epoch as a starting point.</p>
<p>Predeclare the trial before looking at its output:</p>
<ul>
<li>hold the curated train/evaluation split, seed, base revision, target graph, batch policy, and generation settings fixed;</li>
<li>change one factor at a time and assign a new run id;</li>
<li>record trainable parameters, peak allocated/reserved memory, and train/evaluation curves;</li>
<li>run held-out correctness, voice, privacy, and extraction gates; and</li>
<li>select the smallest candidate that clears every essential gate.</li>
</ul>
<p>A falling training loss establishes only that the optimizer can fit the supervised signal. It does not establish better held-out behavior or freedom from memorization. Compare evaluation curves at matched checkpoints, preserve exact failures, and probe for distinctive substrings or source reconstruction. A second epoch is accepted only when the frozen evidence improves without a critical regression.</p>
<pre><code>args = SFTConfig(
    output_dir="runs/bind-001",
    learning_rate=1e-4,
    num_train_epochs=1,
    eval_strategy="steps",
    save_strategy="steps",
)</code></pre>
<p>Learning rate is the optimizer's configured step size. Alpha remains the branch scale described in the previous lesson; because alpha changes the forward path and back-propagated gradients, compare learning-rate candidates only while alpha and rank remain fixed. Otherwise the trial cannot attribute a result to one cause.</p>
<p>The decision record lists every candidate, the single changed factor, peak memory, curve summaries, blinded held-out scores, critical failures, and extraction results. “It felt better” and “the loss was lower” are observations to investigate, not promotion permits.</p>
<div class="field-notes"><div class="fn-head">FIELD NOTES // A SWEEP IS AN EXPERIMENT, NOT A SLOT MACHINE</div>
<p>Run the smallest planned comparison that can answer the current question. If rank 16 already clears the gates, a larger rank must earn its extra memory. If one epoch clears the gates, a second must improve frozen evidence rather than merely reduce training loss. Preserve failed candidates so the same unsupported guess is not repeated later.</p></div>
'''

[[lessons.readings]]
label = "TRL SFT configuration"
url = "https://huggingface.co/docs/trl/v1.8.0/sft_trainer"

[[lessons.exercises]]
id = "s05-l05-e2"
type = "text"
points = 15
prompt = "Which SFTConfig field controls the optimizer's configured step size?"
answer = "learning_rate"
accept = ["learning_rate"]
hint = "Name the optimizer setting, not the adapter branch scale."

[[lessons.exercises]]
id = "s05-l05-e1"
type = "mc"
points = 20
prompt = "Which trial can isolate the effect of changing learning rate?"
choices = [
  "Change rank, alpha, learning rate, and epoch count together",
  "Reuse a different evaluation split for each rate",
  "Hold data, rank, alpha, seed, and batch policy fixed while changing only learning rate",
  "Select the run with the lowest training loss before evaluation",
]
answer = 2
whyWrong = "Changing multiple factors, changing the measurement set, or choosing from training loss alone destroys causal and held-out evidence."
explain = "A controlled comparison changes one factor while identities and evaluation remain fixed."
hint = "Ask which comparison leaves exactly one intended explanatory variable."

[[lessons.exercises]]
id = "s05-l05-e3"
type = "fill"
points = 20
prompt = "Complete the predeclared starting optimizer setting."
code = '''args = SFTConfig(
    ____=1e-4,
    num_train_epochs=1,
)'''
answer = "learning_rate"
hint = "Use the field named in the lesson's configuration block."

[[lessons.exercises]]
id = "s05-l05-e4"
type = "write"
points = 35
prompt = "Apply the hard gates, then select the passing trial with the fewest parameters and print exactly: SELECT B"
starter = '''trials = [
    {"id": "A", "params": 21_823_488, "peak_gib": 12.2, "eval": 1.5, "criticals": 0},
    {"id": "B", "params": 43_646_976, "peak_gib": 13.1, "eval": 1.7, "criticals": 0},
    {"id": "C", "params": 87_293_952, "peak_gib": 14.3, "eval": 1.8, "criticals": 0},
    {"id": "D", "params": 43_646_976, "peak_gib": 13.0, "eval": 1.9, "criticals": 1},
]

passing = []
print("SELECT NONE")
'''
solution = '''trials = [
    {"id": "A", "params": 21_823_488, "peak_gib": 12.2, "eval": 1.5, "criticals": 0},
    {"id": "B", "params": 43_646_976, "peak_gib": 13.1, "eval": 1.7, "criticals": 0},
    {"id": "C", "params": 87_293_952, "peak_gib": 14.3, "eval": 1.8, "criticals": 0},
    {"id": "D", "params": 43_646_976, "peak_gib": 13.0, "eval": 1.9, "criticals": 1},
]

passing = [
    trial for trial in trials
    if trial["criticals"] == 0
    and trial["peak_gib"] < 14
    and trial["eval"] >= 1.6
]
selected = min(passing, key=lambda trial: trial["params"])
print(f"SELECT {selected['id']}")
'''
expect = "SELECT B"
hint = "Filter every hard gate before optimizing among the survivors."

[[lessons.exercises]]
id = "s05-l05-e5"
type = "mc"
points = 20
prompt = "A second epoch lowers training loss but worsens held-out correctness and increases extraction matches. What does the evidence support?"
choices = [
  "Keep the second epoch because lower training loss is decisive",
  "Increase alpha until held-out scoring agrees",
  "Discard the held-out suite as noisy",
  "Reject the second epoch and retain the smaller passing run while investigating the regressions",
]
answer = 3
whyWrong = "Training loss cannot override held-out and privacy regressions, and changing alpha or discarding frozen evidence would evade the test."
explain = "Promotion follows predeclared behavior and privacy gates, not the lowest training loss."
hint = "Identify which observations belong to promotion gates and which are only optimization diagnostics."
