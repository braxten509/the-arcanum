[[lessons]]
id = "s05-l01"
teaches = ["lora-math"]
title = "A Low-Rank Delta"
body = '''
<p>The bind is not a second vessel. It is a low-rank delta pressed onto the base model, small enough to fit the measured memory budget and powerful enough to move behavior. Section V begins with the shape of the targeted weights because “parameter efficient” is a count to verify, not a slogan.</p>
<div class="callout"><strong>Reading with Chapters I-II under your belt:</strong> this chapter's ideas are heavy, but its <em>code</em> stays light — every write exercise is a loop over a list of dicts, an <code>if</code>, and an f-string, exactly the toolkit you already have. Two small built-ins show up when you compare a list of numbers: <code>min(nums)</code> returns the smallest value, and <code>nums.index(v)</code> gives the position where <code>v</code> first appears. Where a number needs rounding for display, the <code>f"{x:.2f}"</code> form from the memory-budget chapter returns. Nothing else here is new Python — only new vocabulary for the machine.</div>
<p>A transformer layer has weight matrices — dense slabs of floating-point numbers the model learned during pre-training. A full fine-tune updates every one of those numbers: billions of parameters receiving gradient updates, each demanding its own optimizer state (momentum, variance), consuming the 6× multiplier the memory-budget section already proved. On a 16 GB card, that path is closed before the first batch — a 7 B-parameter model at 16-bit precision alone costs 14 GB in weights, leaving nothing for gradients, optimizer state, or activations.</p>
<p>For a weight <code>W ∈ ℝ<sup>out×in</sup></code>, LoRA freezes W and learns <code>A ∈ ℝ<sup>r×in</sup></code> plus <code>B ∈ ℝ<sup>out×r</sup></code>. The forward pass is <code>h = Wx + (α/r)BAx</code>. Those shapes multiply cleanly: A maps the input into r coordinates and B maps those coordinates to the output. One targeted matrix adds <code>r × (in + out)</code> parameters.</p>
<pre><code><span class="c"># The LoRA forward pass, decomposed:</span>
<span class="c"># original:  h = W @ x          (W frozen, no gradients)</span>
<span class="c"># adapted:   h = W @ x + B @ A @ x   (only A and B train)</span>
<span class="c"># A shape:   (rank, in_features)     — small</span>
<span class="c"># B shape:   (out_features, rank)    — small</span></code></pre>
<p>The actual configuration uses <code>target_modules="all-linear"</code>. For the pinned Qwen3-8B graph—36 layers with 4096 hidden size, 12288 intermediate size, and grouped-query attention—the simple rank-16 total across q, k, v, o, gate, up, and down projections is 43,646,976 trainable parameters, about 0.53% of the 8.19B base. Do not substitute a one-layer, four-projection sketch. Enumerate the instantiated PEFT target names and shapes, then preserve <code>print_trainable_parameters()</code> output as the authoritative count.</p>
<p>QLoRA stores the frozen training base with bitsandbytes NF4 plus its quantization metadata; Q4_K_M belongs to the later GGUF serving path. The adapter's training footprint includes its weights, gradients, optimizer state, and any precision copies used by the optimizer. Measure the real peak rather than borrowing a GGUF file-size estimate.</p>
<div class="field-notes"><div class="fn-head">FIELD NOTES // RANK, NOT RANK — THE MATH VS. THE KNOB</div>
<p>The rank in "low-rank adaptation" is the mathematical rank of the product BA—the maximum number of independent directions that layer's delta can express. Setting <code>r=16</code> constrains capacity; it does not make the adapter inherently style-only or regression-proof. A LoRA can still alter facts, formatting, refusals, and general capability, especially with poor data or aggressive training. That is why the course preserves a base comparison and requires the Section VI regression gate.</p></div>
'''
body_words = 520

[[lessons.readings]]
label = "LoRA: Low-Rank Adaptation of Large Language Models (the paper)"
url = "https://arxiv.org/abs/2106.09685"

[[lessons.readings]]
label = "QLoRA: Efficient Finetuning of Quantized LLMs"
url = "https://arxiv.org/abs/2305.14314"

[[lessons.exercises]]
id = "s05-l01-e1"
type = "type"
prompt = "Retype the annotated LoRA forward-pass sketch; focus on which matrix stays frozen and which two low-rank matrices receive gradients."
points = 12
reps = 2
code = '''# The LoRA forward pass, decomposed:
# original:  h = W @ x          (W frozen, no gradients)
# adapted:   h = W @ x + B @ A @ x   (only A and B train)
# A shape:   (rank, in_features)     — small
# B shape:   (out_features, rank)    — small'''

[[lessons.exercises]]
id = "s05-l01-e2"
type = "mc"
points = 20
prompt = "Why does a full fine-tune of the pinned 8B model exceed a 16 GB card while its measured QLoRA plan can fit?"
choices = [
  "QLoRA runs the base model on the CPU while only the adapter trains on the GPU, splitting the memory across both devices automatically",
  "QLoRA compresses the optimizer state to 4-bit as well, so both weights and gradients fit in a single 16 GB allocation",
  "Full fine-tune would work on 16 GB if you reduce the batch size to 1, but QLoRA is chosen because it converges in fewer steps",
  "Full fine-tuning allocates trainable state for every base parameter; QLoRA freezes the NF4 base and limits trainable state to the measured 43,646,976-parameter adapter, leaving capacity that the dry run must verify",
]
answer = 3
whyWrong = "QLoRA does not automatically offload the base, quantize every optimizer tensor, or make full-model training state disappear through batch size. It freezes the quantized base and trains only the instantiated adapter graph."
hint = "Return to the memory ledger: identify which tensors remain frozen and quantized, then identify which much smaller tensors receive gradients and optimizer state."
explain = "The simplified full-fine-tune ledger is about 96 GB for 8B parameters before activations. The rank-16 all-linear adapter is 43,646,976 parameters (about 0.53% of the base) and about 524 MB under the same 12-byte trainable-state ledger; a real dry step measures the remaining NF4, activation, and framework costs."

[[lessons.exercises]]
id = "s05-l01-e3"
type = "text"
points = 18
prompt = "In <code>h = Wx + (α/r)BAx</code>, which two matrices are trainable?"
answer = "A and B"
accept = ["B and A", "A, B", "B, A", "matrices A and B", "the A and B matrices"]
hint = "In the equation, separate the original weight matrix from the two factors composing the added low-rank path."

[[lessons.exercises]]
id = "s05-l01-e4"
type = "mc"
points = 20
prompt = "For the pinned Qwen3-8B graph with <code>target_modules=\"all-linear\"</code>, what is the reliable way to establish adapter size?"
choices = [
  "Enumerate every instantiated targeted module and shape, sum <code>r × (in + out)</code> across all layers, and confirm PEFT's trainable-parameter report",
  "About 50% — LoRA inserts a full copy of each targeted weight matrix alongside the original",
  "About 5–10% — LoRA must match the full parameter count of all attention layers",
  "Less than 0.001% — rank 16 means exactly 16 new parameters total, independent of the model's dimensions",
]
answer = 0
whyWrong = "LoRA does not add a full copy or a fixed number of parameters. The count depends on rank, each targeted module's input/output shape, how many modules are selected, and how many layers contain them."
hint = "Account for module shape, number of targeted modules, and number of layers before trusting a percentage."
explain = "The count grows with width, targeted module set, and depth. The all-linear rank-16 course configuration is about 43.65M trainable parameters, and PEFT's instantiated report must confirm it."

[[lessons.exercises]]
id = "s05-l01-e5"
type = "write"
points = 35
prompt = "Compute the rank-16 all-linear LoRA count for 36 Qwen3-8B layers from the seven projection shapes below. Print <code>ADAPTER PARAMS 43646976</code>."
starter = '''layers = 36
rank = 16
shapes = [
    (4096, 4096), (4096, 1024), (4096, 1024), (4096, 4096),
    (4096, 12288), (4096, 12288), (12288, 4096),
]

total = 0
print("ADAPTER PARAMS 0")
'''
expect = "ADAPTER PARAMS 43646976"
solution = '''layers = 36
rank = 16
shapes = [
    (4096, 4096), (4096, 1024), (4096, 1024), (4096, 4096),
    (4096, 12288), (4096, 12288), (12288, 4096),
]

per_layer = sum(rank * (in_features + out_features)
                for in_features, out_features in shapes)
total = layers * per_layer
print(f"ADAPTER PARAMS {total}")
'''
hint = "Sum rank times input-plus-output for the seven shapes in one layer, then multiply by 36."
