[[lessons]]
id = "s05-l04"
teaches = ["lora-capacity-scale"]
title = "Separate Adapter Capacity from Adapter Scale"
body = '''
<p>Rank and alpha both change a LoRA branch, but they own different questions. <strong>Rank</strong> (<code>r</code>) limits the degrees of freedom in each targeted delta and increases trainable parameter count linearly. <strong>Alpha</strong> (<code>lora_alpha</code>) changes the branch scale <code>α/r</code> without changing its matrix shapes. Keep those effects separate before choosing either value.</p>
<table><thead><tr><th>Knob</th><th>Direct effect</th><th>Must be measured</th></tr></thead><tbody>
<tr><td><code>r</code></td><td>Capacity, parameter count, optimizer state</td><td>Instantiated targets, peak memory, held-out behavior</td></tr>
<tr><td><code>alpha</code></td><td>Scale of the adapter contribution</td><td>Loss behavior, output gates, extraction probes</td></tr>
</tbody></table>
<p>For a targeted linear layer with <code>in_features</code> inputs and <code>out_features</code> outputs, LoRA adds <code>r × (in_features + out_features)</code> parameters. Sum that expression over every targeted layer; never infer a model-wide count from one projection. For the pinned Qwen3-8B graph and <code>target_modules="all-linear"</code>, rank 16 produces about 43,646,976 trainable parameters. Rank 128 scales that count to about 349,175,808.</p>
<p>Under the course's simplified 12-bytes-per-trainable-parameter ledger, rank 128 needs about 4.19 GB for adapter weights, gradients, and Adam state before activations and framework overhead. That is a planning estimate, not a fit guarantee. The instantiated PEFT target list, <code>print_trainable_parameters()</code>, and measured dry-run peak remain authoritative.</p>
<pre><code># Same capacity, different branch scale:
r = 16
alpha = 32
branch_scale = alpha / r  # 2.0

# Same branch scale, more capacity and cost:
r = 32
alpha = 64
branch_scale = alpha / r  # still 2.0</code></pre>
<p>Alpha is distinct from optimizer learning rate, but it is not gradient-neutral. Because <code>α/r</code> participates in the forward computation, the chain rule also scales gradients flowing into A and B. Changing rank can also change optimization behavior even when <code>α/r</code> is held constant. Treat both values as experiment inputs, not universal rules derived from dataset size.</p>
<div class="field-notes"><div class="fn-head">FIELD NOTES // COUNT, SCALE, THEN MEASURE</div>
<p>A proposed rank must survive three separate questions: what graph-wide parameter count does it create, what measured memory peak follows, and does its held-out behavior beat a smaller candidate without new critical failures? Alpha answers none of those alone. It only states how strongly the current low-rank path enters the forward computation.</p></div>
'''

[[lessons.readings]]
label = "PEFT LoRA concepts"
url = "https://huggingface.co/docs/peft/v0.19.1/conceptual_guides/lora"

[[lessons.exercises]]
id = "s05-l04-e1"
type = "mc"
points = 20
prompt = "What changes when <code>lora_alpha</code> rises from 16 to 32 while rank remains 16?"
choices = [
  "The adapter gains twice as many matrix entries",
  "The branch scale rises from 1.0 to 2.0 without adding parameters",
  "The optimizer learning rate doubles",
  "The dropout rate doubles",
]
answer = 1
whyWrong = "Alpha does not resize A or B and does not rewrite the optimizer or dropout configuration."
explain = "With rank fixed, alpha changes α/r, which scales the adapter contribution and the gradients through that path."
hint = "Evaluate the ratio α/r while holding every matrix shape fixed."

[[lessons.exercises]]
id = "s05-l04-e2"
type = "text"
points = 15
prompt = "What formula gives the number of LoRA parameters added to one targeted linear layer?"
answer = "r * (in_features + out_features)"
accept = ["r*(in_features+out_features)", "r × (in_features + out_features)", "rank * (in_features + out_features)"]
hint = "Count the entries in A and B, then add them."

[[lessons.exercises]]
id = "s05-l04-e3"
type = "fill"
points = 20
prompt = "Complete the scale while keeping the branch ratio equal to 2.0."
code = '''r = 32
alpha = ____
branch_scale = alpha / r'''
answer = "64"
hint = "Solve alpha divided by 32 equals 2."

[[lessons.exercises]]
id = "s05-l04-e4"
type = "write"
points = 35
prompt = "Calculate the graph-wide rank-128 training-state estimate from the supplied measured rank-16 count and print exactly: R128 349175808 PARAMS 4.19 GB"
starter = '''rank_16_params = 43_646_976
target_rank = 128
bytes_per_trainable_param = 12

rank_128_params = 0
training_state_gb = 0
print(f"R128 {rank_128_params} PARAMS {training_state_gb:.2f} GB")
'''
solution = '''rank_16_params = 43_646_976
target_rank = 128
bytes_per_trainable_param = 12

rank_128_params = rank_16_params * target_rank // 16
training_state_gb = rank_128_params * bytes_per_trainable_param / 1_000_000_000
print(f"R128 {rank_128_params} PARAMS {training_state_gb:.2f} GB")
'''
expect = "R128 349175808 PARAMS 4.19 GB"
hint = "Scale the model-wide count linearly by rank before converting the byte ledger to decimal gigabytes."

[[lessons.exercises]]
id = "s05-l04-e5"
type = "type"
points = 12
reps = 2
prompt = "Retype the two configurations with the same branch scale but different capacity."
code = '''small = {"r": 16, "alpha": 32}
large = {"r": 32, "alpha": 64}'''
