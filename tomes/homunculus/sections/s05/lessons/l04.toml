[[lessons.exercises]]
id = "s05-l04-e6"
type = "write"
points = 35
prompt = "Given the three configs below — each a dict with <code>r</code>, <code>lora_alpha</code>, and <code>lr</code> — compute the alpha/r scaling factor for each and find the config(s) where both conditions hold: scaling > 1.5 AND lr > 1e-4. Print each qualifying config's ID letter on its own line as <code>PASS &lt;id&gt;</code> — computed from the data, not hardcoded."
starter = '''configs = [
    {"id": "A", "r": 16, "lora_alpha": 16, "lr": 2e-4},   # scaling 1.0, lr 0.0002
    {"id": "B", "r": 8,  "lora_alpha": 32, "lr": 1.5e-4}, # scaling 4.0, lr 0.00015
    {"id": "C", "r": 16, "lora_alpha": 32, "lr": 2e-4},   # scaling 2.0, lr 0.0002
    {"id": "D", "r": 32, "lora_alpha": 32, "lr": 8e-5},   # scaling 1.0, lr 0.00008
]

# For each config, compute scaling = lora_alpha / r.
# If scaling > 1.5 AND lr > 1e-4, print PASS <id>.
for c in configs:
    pass
print("NO PASS")
'''
expect = '''PASS B
PASS C'''
hint = "For each config: scaling = c['lora_alpha'] / c['r']. Check if scaling > 1.5 and c['lr'] > 1e-4. B: 32/8=4.0, lr=0.00015 (>0.0001) → PASS. C: 32/16=2.0, lr=0.0002 (>0.0001) → PASS. A fails scaling (1.0), D fails lr (0.00008). Print both as separate PASS lines."
