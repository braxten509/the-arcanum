[[lessons]]
id = "s05-l04"
teaches = ["hyperparameter-plan"]
title = "The Knobs: Rank, Alpha, and Learning Rate"
body = '''
<p>Three numbers decide what the bind can learn and how hard it pulls. They are not interchangeable, and none of them can be read off a table of dataset sizes. Separate what each one owns before you set any of them.</p>
<table><thead><tr><th>Knob</th><th>Direct effect</th><th>Must be measured</th></tr></thead><tbody>
<tr><td><code>r</code></td><td>Capacity, trainable count, optimizer state</td><td>Instantiated targets, peak memory, held-out behavior</td></tr>
<tr><td><code>lora_alpha</code></td><td>Scale <code>α/r</code> of the adapter contribution</td><td>Loss behavior, output gates, extraction probes</td></tr>
<tr><td><code>learning_rate</code></td><td>Optimizer step size</td><td>Curves at matched checkpoints, gate results</td></tr>
</tbody></table>
<p><strong>Rank</strong> limits the degrees of freedom in each targeted delta and raises the trainable count linearly. This chapter's first rite gave you the per-layer expression, <code>r × (in_features + out_features)</code>, summed over every instantiated target — never inferred from one projection. Rank 16 on the pinned Qwen3-8B all-linear graph is 43,646,976 trainable parameters; rank 128 scales that to 349,175,808, roughly 4.19 GB of weights, gradients, and Adam state under the course's simplified twelve-bytes-per-trainable-parameter ledger. That is a planning estimate, not a fit guarantee. The measured dry-run peak in the next lesson stays authoritative.</p>
<p><strong>Alpha</strong> changes the branch scale <code>α/r</code> without changing a single matrix shape:</p>
<pre><code># Same branch scale, different capacity and cost:
small = {"r": 16, "alpha": 32}   # branch scale 2.0
large = {"r": 32, "alpha": 64}   # branch scale 2.0, twice the parameters</code></pre>
<p>Alpha is not the learning rate, and it is not gradient-neutral: because <code>α/r</code> sits inside the forward computation, the chain rule scales the gradients entering A and B as well. Changing rank can shift optimization behavior even when <code>α/r</code> is held constant. <strong>Learning rate</strong> is the optimizer's configured step size and lives on <code>SFTConfig</code>. Values such as <code>5e-5</code>, <code>1e-4</code>, and <code>2e-4</code> are candidates for this project, not a settled safe range. The predeclared first run is <code>r=16</code>, <code>lora_alpha=32</code>, <code>learning_rate=1e-4</code>, one epoch.</p>
<pre><code>args = SFTConfig(
    output_dir="runs/bind-001",
    learning_rate=1e-4,
    num_train_epochs=1,
    eval_strategy="steps",
    save_strategy="steps",
)</code></pre>
<p>Choose among the candidates by controlled trial, written down before you look at any output:</p>
<ul>
<li>hold the curated train/evaluation split, seed, base revision, target graph, batch policy, and generation settings fixed;</li>
<li>change one factor at a time and assign the run a new id;</li>
<li>record trainable parameters, peak allocated and reserved memory, and both curves;</li>
<li>run the held-out correctness, voice, privacy, and extraction gates; and</li>
<li>promote the smallest candidate that clears every essential gate.</li>
</ul>
<p>A falling training loss establishes only that the optimizer can fit the supervised signal. It does not establish better held-out behavior or freedom from memorization. Compare evaluation curves at matched checkpoints, preserve the exact failures, and probe for distinctive substrings. Because alpha alters both the forward path and the gradients through it, compare learning-rate candidates only while alpha and rank stay fixed; otherwise the trial cannot attribute its result to one cause.</p>
<div class="field-notes"><div class="fn-head">FIELD NOTES // A SWEEP IS AN EXPERIMENT, NOT A SLOT MACHINE</div>
<p>Run the smallest planned comparison that can answer the current question. If rank 16 already clears the gates, a larger rank must earn its extra memory against the Section III headroom rule. If one epoch clears them, a second must improve frozen evidence rather than merely lower training loss. Keep every failed candidate beside the single factor that changed it — a record that says only "it felt better" will repeat the same unsupported guess three runs later.</p></div>
'''

[[lessons.readings]]
label = "PEFT adapters concept guide (LoRA rank and alpha)"
url = "https://huggingface.co/docs/peft/v0.19.0/conceptual_guides/adapter"

[[lessons.readings]]
label = "TRL SFT configuration"
url = "https://huggingface.co/docs/trl/v1.8.0/sft_trainer"

[[lessons.exercises]]
id = "s05-l04-e1"
type = "type"
points = 12
reps = 2
prompt = "Retype the paired configurations from the lesson; watch which value moves when capacity doubles and the branch scale does not."
code = '''small = {"r": 16, "alpha": 32}   # branch scale 2.0
large = {"r": 32, "alpha": 64}   # branch scale 2.0, twice the parameters'''

[[lessons.exercises]]
id = "s05-l04-e2"
type = "mc"
points = 20
prompt = "What changes when <code>lora_alpha</code> rises from 16 to 32 while rank remains 16?"
choices = [
  "The adapter gains twice as many matrix entries",
  "The branch scale rises from 1.0 to 2.0 without adding a single parameter",
  "The configured optimizer step size doubles",
  "The adapter dropout rate doubles",
]
answer = 1
whyWrong = "Alpha does not resize A or B, and it does not rewrite the learning rate or dropout entries in the configuration."
explain = "With rank pinned at 16, doubling alpha doubles α/r, which scales the adapter contribution in the forward pass and the gradients flowing back through that path."
hint = "Evaluate α/r with every matrix shape held fixed, then ask which line of the configuration actually changed."

[[lessons.exercises]]
id = "s05-l04-e3"
type = "text"
points = 15
prompt = "What expression gives the number of LoRA parameters added to one targeted linear layer?"
answer = "r * (in_features + out_features)"
accept = ["r*(in_features+out_features)", "r × (in_features + out_features)", "rank * (in_features + out_features)"]
hint = "Count the entries in A, count the entries in B, then add the two counts."

[[lessons.exercises]]
id = "s05-l04-e4"
type = "fill"
points = 20
prompt = "Complete the field that carries the predeclared optimizer step size for the first bind."
code = '''args = SFTConfig(
    ____=1e-4,
    num_train_epochs=1,
)'''
answer = "learning_rate"
hint = "Name the optimizer setting from the configuration block, not the adapter's branch scale."

[[lessons.exercises]]
id = "s05-l04-e5"
type = "write"
points = 35
prompt = "Four candidate binds were recorded below. Apply the predeclared gates — zero criticals, peak reserved memory under 14.0 GiB (the Section III two-GiB headroom rule on a 16 GB card), and a blinded held-out voice score of at least 3.5 — then promote the surviving candidate with the fewest trainable parameters. Print exactly: PROMOTE B"
starter = '''trials = [
    {"id": "A", "params": 21_823_488, "peak_reserved_gib": 12.2, "voice": 3.4, "criticals": 0},
    {"id": "B", "params": 43_646_976, "peak_reserved_gib": 13.1, "voice": 3.7, "criticals": 0},
    {"id": "C", "params": 87_293_952, "peak_reserved_gib": 14.3, "voice": 3.8, "criticals": 0},
    {"id": "D", "params": 43_646_976, "peak_reserved_gib": 13.0, "voice": 3.9, "criticals": 1},
]

passing = []
print("PROMOTE NONE")
'''
solution = '''trials = [
    {"id": "A", "params": 21_823_488, "peak_reserved_gib": 12.2, "voice": 3.4, "criticals": 0},
    {"id": "B", "params": 43_646_976, "peak_reserved_gib": 13.1, "voice": 3.7, "criticals": 0},
    {"id": "C", "params": 87_293_952, "peak_reserved_gib": 14.3, "voice": 3.8, "criticals": 0},
    {"id": "D", "params": 43_646_976, "peak_reserved_gib": 13.0, "voice": 3.9, "criticals": 1},
]

passing = [
    trial for trial in trials
    if trial["criticals"] == 0
    and trial["peak_reserved_gib"] < 14.0
    and trial["voice"] >= 3.5
]
promoted = min(passing, key=lambda trial: trial["params"])
print(f"PROMOTE {promoted['id']}")
'''
expect = "PROMOTE B"
hint = "Filter on all three hard gates first; only then take the smallest params value among the survivors."

[[lessons.exercises]]
id = "s05-l04-e6"
type = "mc"
points = 20
prompt = "A second epoch lowers training loss, but held-out correctness falls and extraction probes match more of your private notes verbatim. What does that evidence support?"
choices = [
  "Keep the second epoch, because the lower training loss is the decisive measurement",
  "Raise alpha until the held-out scoring agrees with the training loss",
  "Reject the second epoch, keep the smaller passing run, and investigate both regressions",
  "Retire the held-out suite as too noisy to block a promotion",
]
answer = 2
whyWrong = "Training loss cannot outvote held-out and extraction results, and raising alpha or retiring the frozen suite alters the measurement instead of answering it."
explain = "Promotion follows the predeclared behavior and privacy gates; on a small personal corpus, a falling training loss beside rising verbatim matches is what memorization looks like."
hint = "Sort the three observations into promotion gates and optimization diagnostics before deciding which one may move the verdict."
