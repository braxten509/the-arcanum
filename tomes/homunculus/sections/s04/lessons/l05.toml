[[lessons]]
id = "s04-l05"
teaches = ["dataset-curation"]
title = "Freeze a Corpus You Can Defend"
body = '''
<p>Create <code>src/homunculus/curate.py</code> as a separate command. Its contract is strict: read <code>private/dataset/drafts.jsonl</code>; accept only human-approved prompt-completion rows; reject duplicate ids, duplicate normalized completions, malformed roles, unknown splits, missing source hashes, and obvious secret patterns; write <code>private/dataset/train.jsonl</code>, <code>private/dataset/eval.jsonl</code>, and <code>reports/curation.json</code>. It never trains.</p>
<pre><code>import hashlib
import json
import re
from pathlib import Path

SECRET_PATTERNS = [
    re.compile(r"-----BEGIN [A-Z ]*PRIVATE KEY-----"),
    re.compile(r"(?i)(api[_-]?key|token|password)\s*[:=]\s*\S+"),
]

def normalized(text):
    return " ".join(text.casefold().split())

def validate(row):
    assert row["approved"] is True
    assert row["split"] in {"train", "eval"}
    assert row["source_sha256"]
    assert row["prompt"][-1]["role"] == "user"
    assert row["completion"] == [{"role": "assistant",
                                  "content": row["completion"][0]["content"]}]
    full_text = json.dumps(row, ensure_ascii=False)
    assert not any(pattern.search(full_text) for pattern in SECRET_PATTERNS)

def main():
    rows = [json.loads(line) for line in Path("private/dataset/drafts.jsonl").read_text(encoding="utf-8").splitlines() if line.strip()]
    ids = set()
    completions = set()
    accepted = {"train": [], "eval": []}
    for row in rows:
        validate(row)
        assert row["id"] not in ids, f"duplicate id: {row['id']}"
        key = normalized(row["completion"][0]["content"])
        assert key not in completions, f"duplicate completion: {row['id']}"
        ids.add(row["id"])
        completions.add(key)
        accepted[row["split"]].append(row)
    Path("private/dataset").mkdir(parents=True, exist_ok=True)
    for split, items in accepted.items():
        text = "".join(json.dumps(item, ensure_ascii=False) + "\n" for item in items)
        Path(f"private/dataset/{split}.jsonl").write_text(text, encoding="utf-8")
    summary = {"counts": {k: len(v) for k, v in accepted.items()},
               "draft_sha256": hashlib.sha256(Path("private/dataset/drafts.jsonl").read_bytes()).hexdigest()}
    Path("reports/curation.json").write_text(json.dumps(summary, indent=2) + "\n", encoding="utf-8")

if __name__ == "__main__":
    main()</code></pre>
<p>Regex is triage, not a privacy guarantee. Before approval, apply a governance checklist:</p>
<ul><li>confirm ownership, license, or consent for the text and every attachment;</li><li>remove personal identifiers, confidential entities, client facts, secrets, and quoted third-party material;</li><li>record source provenance, allowed use, retention date, and the person responsible for deletion;</li><li>keep the raw export, backups, version-control history, curated rows, adapters, merged models, and delivery drafts in the deletion map.</li></ul>
<p>Read every accepted completion and a documented sample of rejected material without copying sensitive text into the rejection ledger. Keep a source page wholly in one split and compare hashes to catch sibling leakage. “I wrote this page” does not grant permission over every embedded name, quotation, attachment, or business fact.</p>
<p>Run <code>python -m homunculus.curate</code>, reopen both private output files, and validate every line. Save the full manual checklist privately. The sanitized Section IV receipt contains only corpus and rejection counts, schema results, source-group leakage result, hash identities, review coverage, and redaction categories. It also records the retention deadline and deletion propagation plan. A deleted source must be removed from curated splits, caches, adapters, merged models, GGUFs, Ollama imports, backups under your control, and future releases; learned derivatives generally require rebuilding rather than pretending a row can be subtracted.</p>
<div class="field-notes"><div class="fn-head">FIELD NOTES // CURATION NEEDS A REJECTION LOG</div>
<p>Keep rejected row IDs and reason codes without retaining the secret or unwanted content itself. Counts such as <code>secret-pattern</code>, <code>pii</code>, <code>no-consent</code>, <code>confidential-third-party</code>, <code>attachment</code>, <code>duplicate</code>, and <code>source-leakage</code> show why material was excluded. Later evaluation must include memorization and extraction probes because curation lowers risk but cannot guarantee that an adapter never reproduces source text.</p></div>
'''

[[lessons.readings]]
label = "Notion export documentation"
url = "https://www.notion.com/help/export-your-content"

[[lessons.readings]]
label = "Hugging Face Datasets JSON loading"
url = "https://huggingface.co/docs/datasets/v5.0.0/loading"

[[lessons.exercises]]
id = "s04-l05-e1"
type = "mc"
points = 20
prompt = "Why is approved=true insufficient by itself?"
choices = [
  "JSON booleans are ignored by Python",
  "Automated validation and a final human review still need to catch schema, duplication, provenance, and privacy failures",
  "TRL requires approved=false",
  "Approval automatically quantizes the row",
]
answer = 1
whyWrong = "Python reads booleans normally; approval is project metadata, not a trainer or quantizer switch."
explain = "Curation combines an accountable human decision with repeatable mechanical gates."
hint = "One field cannot prove every property of a row."

[[lessons.exercises]]
id = "s04-l05-e2"
type = "text"
points = 15
prompt = "Which report stores the draft corpus hash and split counts?"
answer = "reports/curation.json"
accept = ["curation.json", "reports/curation.json"]
hint = "It is written after the two split files."

[[lessons.exercises]]
id = "s04-l05-e3"
type = "fill"
points = 20
prompt = "Complete the method used before comparing completion text for exact normalized duplicates."
code = '''def normalized(text):
    return " ".join(text.____().split())'''
answer = "casefold"
hint = "It is a stronger Unicode-aware lowercase normalization."

[[lessons.exercises]]
id = "s04-l05-e4"
type = "mc"
points = 20
prompt = "A page produced three examples. Where should they be assigned?"
choices = [
  "Round-robin across both splits",
  "Copy all three into both",
  "All to train or all to eval, never across both",
  "Choose randomly during each epoch",
]
answer = 2
whyWrong = "Cross-split siblings and duplicates leak source language into evaluation; mutable assignment breaks reproducibility."
explain = "The source document is the grouping unit for a leak-resistant split."
hint = "Split by source, not by fragment."

[[lessons.exercises]]
id = "s04-l05-e5"
type = "write"
points = 35
prompt = "Count rows by their frozen split and print exactly: train=3 eval=2"
starter = '''rows = [
    {"split": "train"}, {"split": "eval"}, {"split": "train"},
    {"split": "train"}, {"split": "eval"},
]

counts = {"train": 0, "eval": 0}
print(f"train={counts['train']} eval={counts['eval']}")
'''
solution = '''rows = [
    {"split": "train"}, {"split": "eval"}, {"split": "train"},
    {"split": "train"}, {"split": "eval"},
]

counts = {"train": 0, "eval": 0}
for row in rows:
    counts[row["split"]] += 1
print(f"train={counts['train']} eval={counts['eval']}")
'''
expect = "train=3 eval=2"
hint = "Increment the dict entry named by each row's split."
