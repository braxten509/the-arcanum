[[lessons]]
id = "s04-l05"
teaches = ["dataset-curation"]
title = "Freeze a Corpus You Can Defend"
body = '''
<p>Create <code>src/homunculus/curate.py</code> as a separate command. Its contract is strict: read <code>data/drafts.jsonl</code>; accept only human-approved prompt-completion rows; reject duplicate ids, duplicate normalized completions, malformed roles, unknown splits, missing source hashes, and obvious secret patterns; write <code>data/curated/train.jsonl</code>, <code>data/curated/eval.jsonl</code>, and <code>reports/curation.json</code>. It never trains.</p>
<pre><code>import hashlib
import json
import re
from pathlib import Path

SECRET_PATTERNS = [
    re.compile(r"-----BEGIN [A-Z ]*PRIVATE KEY-----"),
    re.compile(r"(?i)(api[_-]?key|token|password)\s*[:=]\s*\S+"),
]

def normalized(text):
    return " ".join(text.casefold().split())

def validate(row):
    assert row["approved"] is True
    assert row["split"] in {"train", "eval"}
    assert row["source_sha256"]
    assert row["prompt"][-1]["role"] == "user"
    assert row["completion"] == [{"role": "assistant",
                                  "content": row["completion"][0]["content"]}]
    full_text = json.dumps(row, ensure_ascii=False)
    assert not any(pattern.search(full_text) for pattern in SECRET_PATTERNS)

def main():
    rows = [json.loads(line) for line in Path("data/drafts.jsonl").read_text(encoding="utf-8").splitlines() if line.strip()]
    ids = set()
    completions = set()
    accepted = {"train": [], "eval": []}
    for row in rows:
        validate(row)
        assert row["id"] not in ids, f"duplicate id: {row['id']}"
        key = normalized(row["completion"][0]["content"])
        assert key not in completions, f"duplicate completion: {row['id']}"
        ids.add(row["id"])
        completions.add(key)
        accepted[row["split"]].append(row)
    Path("data/curated").mkdir(parents=True, exist_ok=True)
    for split, items in accepted.items():
        text = "".join(json.dumps(item, ensure_ascii=False) + "\n" for item in items)
        Path(f"data/curated/{split}.jsonl").write_text(text, encoding="utf-8")
    summary = {"counts": {k: len(v) for k, v in accepted.items()},
               "draft_sha256": hashlib.sha256(Path("data/drafts.jsonl").read_bytes()).hexdigest()}
    Path("reports/curation.json").write_text(json.dumps(summary, indent=2) + "\n", encoding="utf-8")

if __name__ == "__main__":
    main()</code></pre>
<p>Regex is triage, not a privacy guarantee. Read every accepted completion and inspect the exported attachments. Remove secrets, private third-party material, boilerplate, low-effort fragments, and facts you do not want reflected in weights. Keep a source page wholly in one split, and compare source hashes to catch sibling leakage. Reserve enough evaluation examples to cover every category; do not move weak examples into training merely to improve the score.</p>
<p>Run <code>python -m homunculus.curate</code>, reopen both output files, and validate each line with <code>python -m json.tool</code> or a short loader. Save a human checklist in <code>reports/curation-review.md</code>. Quality matters more than a magical row count, but a handful of examples cannot establish a stable personal style; keep collecting until the categories and variations in the real daily workflow are represented.</p>
<div class="field-notes"><div class="fn-head">FIELD NOTES // CURATION NEEDS A REJECTION LOG</div>
<p>Keep rejected row IDs and reason codes without retaining the secret or unwanted content itself. Counts such as <code>secret-pattern</code>, <code>too-short</code>, <code>duplicate</code>, and <code>source-leakage</code> show whether a rebuild changed the corpus for a legitimate reason. They also make manual review finite: inspect the exceptions, not every byte again.</p></div>
'''

[[lessons.readings]]
label = "Notion export documentation"
url = "https://www.notion.com/help/workspace-settings"

[[lessons.readings]]
label = "Hugging Face Datasets JSON loading"
url = "https://huggingface.co/docs/datasets/loading"

[[lessons.exercises]]
id = "s04-l05-e1"
type = "mc"
points = 20
prompt = "Why is approved=true insufficient by itself?"
choices = [
  "Automated validation and a final human review still need to catch schema, duplication, provenance, and privacy failures",
  "JSON booleans are ignored by Python",
  "TRL requires approved=false",
  "Approval automatically quantizes the row",
]
answer = 0
whyWrong = "Python reads booleans normally; approval is project metadata, not a trainer or quantizer switch."
explain = "Curation combines an accountable human decision with repeatable mechanical gates."
hint = "One field cannot prove every property of a row."

[[lessons.exercises]]
id = "s04-l05-e2"
type = "text"
points = 15
prompt = "Which report stores the draft corpus hash and split counts?"
answer = "reports/curation.json"
accept = ["curation.json", "reports/curation.json"]
hint = "It is written after the two split files."

[[lessons.exercises]]
id = "s04-l05-e3"
type = "fill"
points = 20
prompt = "Complete the method used before comparing completion text for exact normalized duplicates."
code = '''def normalized(text):
    return " ".join(text.____().split())'''
answer = "casefold"
hint = "It is a stronger Unicode-aware lowercase normalization."

[[lessons.exercises]]
id = "s04-l05-e4"
type = "mc"
points = 20
prompt = "A page produced three examples. Where should they be assigned?"
choices = [
  "All to train or all to eval, never across both",
  "Round-robin across both splits",
  "Copy all three into both",
  "Choose randomly during each epoch",
]
answer = 0
whyWrong = "Cross-split siblings and duplicates leak source language into evaluation; mutable assignment breaks reproducibility."
explain = "The source document is the grouping unit for a leak-resistant split."
hint = "Split by source, not by fragment."

[[lessons.exercises]]
id = "s04-l05-e5"
type = "write"
points = 35
prompt = "Count rows by their frozen split and print exactly: train=3 eval=2"
starter = '''rows = [
    {"split": "train"}, {"split": "eval"}, {"split": "train"},
    {"split": "train"}, {"split": "eval"},
]

counts = {"train": 0, "eval": 0}
print(f"train={counts['train']} eval={counts['eval']}")
'''
solution = '''rows = [
    {"split": "train"}, {"split": "eval"}, {"split": "train"},
    {"split": "train"}, {"split": "eval"},
]

counts = {"train": 0, "eval": 0}
for row in rows:
    counts[row["split"]] += 1
print(f"train={counts['train']} eval={counts['eval']}")
'''
expect = "train=3 eval=2"
hint = "Increment the dict entry named by each row's split."
