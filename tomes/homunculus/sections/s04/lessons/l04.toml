[[lessons]]
id = "s04-l04"
teaches = ["completion-only-loss"]
title = "Make the Loss Learn the Answer"
body = '''
<p>Supervised fine-tuning predicts the next token, but the objective is not to teach Homunculus to generate its own user requests. The prompt provides conditions; the assistant completion is the target. With the conversational prompt-completion rows from the previous lesson, current TRL exposes that decision directly:</p>
<pre><code>from trl import SFTConfig

args = SFTConfig(
    output_dir="artifacts/training",
    max_length=1024,
    completion_only_loss=True,
)</code></pre>
<p><code>completion_only_loss=True</code> masks the prompt portion when TRL prepares labels. Underneath, ignored labels use PyTorch's <code>-100</code> convention, while completion labels carry their token ids. You should understand that mechanism, but you should not manually search Qwen control-token subsequences or copy an outdated <code>DataCollatorForCompletionOnlyLM</code> tutorial. The structured dataset already gives the trainer an unambiguous boundary.</p>
<p>Prove the boundary before an expensive run. Load one row, render <code>row["prompt"] + row["completion"]</code> through <code>tokenizer.apply_chat_template(..., tokenize=False, add_generation_prompt=False)</code>, and print it to <code>reports/template-sample.txt</code>. Then let the trainer prepare a tiny batch and inspect its labels: prompt content must be ignored and at least one completion token must remain learnable. An all-<code>-100</code> batch has no target; an entirely unmasked batch teaches prompt imitation.</p>
<p>Do not confuse this with LoRA parameter selection. PEFT decides <em>which parameters</em> can change. Completion-only loss decides <em>which token errors</em> drive those changes. Both are needed. Also keep the training and evaluation schemas identical: TRL can compute evaluation loss on the held-out prompt-completion rows with the same mask.</p>
<div class="callout">The acceptance proof is observable: a saved native-template sample, a structured prompt/completion row, <code>completion_only_loss=True</code>, and a tiny prepared batch containing both ignored and learnable labels.</div>
<div class="field-notes"><div class="fn-head">FIELD NOTES // INSPECT LABELS BEFORE LOSS</div>
<p>A believable loss curve cannot prove that the intended tokens were supervised. Print one prepared example's token IDs, decoded segments, and label mask. There must be ignored prompt positions and non-ignored completion positions. This direct boundary check is faster and more reliable than diagnosing a mask from an unusually small first loss.</p></div>
'''

[[lessons.readings]]
label = "TRL SFTTrainer"
url = "https://huggingface.co/docs/trl/v1.8.0/sft_trainer"

[[lessons.exercises]]
id = "s04-l04-e1"
type = "mc"
points = 20
prompt = "What does completion_only_loss change?"
choices = [
  "The base model weights become trainable",
  "The GGUF becomes smaller",
  "FAISS returns only one chunk",
  "Prompt tokens stop contributing to loss while completion tokens remain supervised",
]
answer = 3
whyWrong = "Parameter freezing, quantization, and retrieval are owned by other layers."
explain = "The option controls token-level supervision at the prompt/completion boundary."
hint = "It changes labels, not model size or retrieval."

[[lessons.exercises]]
id = "s04-l04-e2"
type = "text"
points = 15
prompt = "Which label value means ignore this token in PyTorch cross-entropy?"
answer = "-100"
accept = ["negative 100", "-100"]
hint = "Zero is a real token id."

[[lessons.exercises]]
id = "s04-l04-e3"
type = "fill"
points = 20
prompt = "Enable the SFTConfig option that supervises only the answer side."
code = '''args = SFTConfig(
    ____=True,
)'''
answer = "completion_only_loss"
hint = "Its name describes the desired loss region."

[[lessons.exercises]]
id = "s04-l04-e4"
type = "mc"
points = 20
prompt = "A prepared batch has every label set to -100. What does that prove?"
choices = [
  "No completion token can drive learning, so the schema or boundary is broken",
  "The mask is perfect",
  "The adapter has merged",
  "The model is deterministic",
]
answer = 0
whyWrong = "A loss requires at least one supervised target token; merging and sampling are unrelated."
explain = "All ignored labels make the training example inert."
hint = "Ask what target remains for cross-entropy."

[[lessons.exercises]]
id = "s04-l04-e5"
type = "write"
points = 35
prompt = "Count ignored and learnable labels and print exactly: MASK ignored=3 learnable=2"
starter = '''labels = [-100, -100, -100, 41, 92]

ignored = 0
learnable = 0
print(f"MASK ignored={ignored} learnable={learnable}")
'''
solution = '''labels = [-100, -100, -100, 41, 92]

ignored = sum(1 for label in labels if label == -100)
learnable = sum(1 for label in labels if label != -100)
print(f"MASK ignored={ignored} learnable={learnable}")
'''
expect = "MASK ignored=3 learnable=2"
hint = "Count labels equal to -100 separately from all remaining labels."
