[[lessons]]
id = "s04-l03"
teaches = ["tokenizer-template"]
title = "The Template the Vessel Speaks"
body = '''
<p>The previous lesson shaped your notes into conversational <code>prompt</code> and <code>completion</code> message lists. That is the <em>logical</em> shape. The <strong>chat template</strong> is the <em>physical</em> token sequence the chosen model expects around those roles. Pinned TRL 1.8.0 applies that template from the Qwen tokenizer; the dataset should preserve messages rather than hard-code control tokens by hand.</p>
<p>Three template families dominate the models you can actually run on this card. <strong>ChatML</strong> (used by Qwen and some other instruct families) wraps turns in <code>&lt;|im_start|&gt;role\ncontent&lt;|im_end|&gt;</code> tokens. <strong>Llama 3/3.1</strong> uses <code>&lt;|begin_of_text|&gt;</code> to open, then <code>&lt;|start_header_id|&gt;role&lt;|end_header_id|&gt;</code> around each role label. Some <strong>Mistral/Llama 2</strong> instruct templates bracket user instructions with <code>[INST]</code>/<code>[/INST]</code>. These are not stylistic choices: each tokenizer and post-training contract defines the control sequence the matching instruct model learned to interpret. Inspect the pinned tokenizer rather than transferring markers between families.</p>
<pre><code><span class="k">from</span> transformers <span class="k">import</span> AutoTokenizer
tokenizer = AutoTokenizer.from_pretrained(
    <span class="s">"Qwen/Qwen3-8B"</span>,
    revision=<span class="s">"b968826d9c46dd6066d109eabc6255188de91218"</span>,
)
messages = [
    {<span class="s">"role"</span>: <span class="s">"user"</span>, <span class="s">"content"</span>: <span class="s">"justify my chunk-size choice"</span>},
    {<span class="s">"role"</span>: <span class="s">"assistant"</span>, <span class="s">"content"</span>: <span class="s">"Use 200-token chunks with 30-token overlap so every chunk stays below the 256-token embedder window."</span>},
]
formatted = tokenizer.apply_chat_template(messages, tokenize=<span class="k">False</span>, add_generation_prompt=<span class="k">False</span>)
<span class="k">print</span>(formatted)</code></pre>
<p><code>apply_chat_template</code> with <code>tokenize=False</code> gives you the raw string the model expects. The method reads the tokenizer configuration at the pinned Hugging Face revision. Save and hash <code>tokenizer_config.json</code>, <code>tokenizer.json</code>, and <code>config.json</code> before curation; a mutable repository name is not enough to freeze the template contract.</p>
<div class="callout">A dataset built for the wrong template does not typically fail with an error message — the tokenizer still tokenizes the text, the trainer still runs, and the loss still drops. The failure shows up later: the model generates template tokens as if they were natural language, or fails to recognize role boundaries in multi-turn conversations, producing garbled output that looks like training worked but the model forgot how to format.</div>
<div class="field-notes"><div class="fn-head">FIELD NOTES // MATCHING THE TEMPLATE BETWEEN TRAINING AND SERVING</div>
<p>The instruction/chat behavior comes from the tokenizer and post-training contract, not from pretraining alone. Transformers and the GGUF converter must consume the same pinned tokenizer files, and the served artifact must expose the same embedded template. Compare a fixed rendered fixture at training and serving boundaries; a falling loss cannot prove those boundaries agree.</p></div>
'''

[[lessons.exercises]]
id = "s04-l03-e1"
type = "mc"
points = 20
prompt = "Per this rite, why does the chat template matter for a training dataset, beyond the logical role names?"
choices = [
  "The template is only cosmetic — the model learns from role names alone and ignores control tokens entirely",
  "The matching instruct model's post-training used a tokenizer-defined control sequence (such as ChatML or <code>[INST]</code>); rendering another family's contract can silently corrupt role boundaries",
  "The template controls the generation temperature, so the wrong template silently changes the model's creativity during training",
  "The template is required only for multi-GPU training setups and has no effect on a single-card QLoRA run",
]
answer = 1
whyWrong = "The template is very much not cosmetic — its control tokens have dedicated tokenizer IDs the model was trained to interpret as structure, not content. It has nothing to do with temperature; and it matters regardless of GPU count because it changes what token sequence the trainer feeds the model, which is a data-level concern, not a hardware one."
hint = "Trace how logical roles become the exact token sequence consumed by the model."
explain = "Special control tokens belong to the tokenizer and post-training conversation contract. If training and serving render different sequences, the loss curve does not reveal the boundary mismatch."

[[lessons.exercises]]
id = "s04-l03-e2"
type = "text"
points = 18
prompt = "What tokenizer method renders a messages list according to the pinned tokenizer's chat contract?"
answer = "apply_chat_template"
accept = ["tokenizer.apply_chat_template", "apply_chat_template()"]
hint = "Identify the operation that applies a template to structured chat messages."

[[lessons.exercises]]
id = "s04-l03-e3"
type = "fill"
points = 20
prompt = "Fill the missing argument from the lesson's <code>apply_chat_template</code> call — the one that returns the formatted string without converting it to token IDs."
code = '''from transformers import AutoTokenizer
tokenizer = AutoTokenizer.from_pretrained("your-base-model-id")
messages = [{"role": "user", "content": "justify my chunk-size choice"}]
formatted = tokenizer.apply_chat_template(messages, ____)'''
answer = "tokenize=False"
accept = ["tokenize = False", "tokenize=false"]
hint = "Use the Boolean argument that asks the template method to return text for inspection."

[[lessons.exercises]]
id = "s04-l03-e4"
type = "mc"
points = 20
prompt = "What is the likely symptom of fine-tuning with a dataset rendered differently from the model's tokenizer and post-training chat contract?"
choices = [
  "The trainer immediately throws a ValueError with a clear message about the template mismatch",
  "The model converges faster because it sees unfamiliar tokens it has to learn from scratch",
  "The training loss drops normally and the trainer reports no error, but the served model later generates template tokens as if they were natural language or garbles role boundaries in multi-turn output",
  "The loss curve spikes uncontrollably, making the failure obvious within the first few training steps",
]
answer = 2
whyWrong = "The failure is deliberately quiet — template tokens are just token IDs to the trainer, and the model can still produce plausible next-token predictions on them without error. It doesn't cause a crash, a faster convergence, or a loss spike; it causes a subtle degradation in output formatting that only becomes visible when you actually talk to the model after the bind."
hint = "Distinguish a syntactically valid training run from a semantic mismatch in role boundaries."
explain = "The exact hazard this rite's callout names: the trainer runs fine, the loss drops, but the finished model emits control tokens as content because it never learned to treat them as structure during the fine-tune — a problem undetectable by any training metric but immediately visible in a conversation."

[[lessons.exercises]]
id = "s04-l03-e5"
type = "write"
points = 32
prompt = "Given the two messages below and a simple ChatML-style template rule — wrap each message as <code>&lt;|im_start|&gt;role\ncontent&lt;|im_end|&gt;</code>, with a newline after the role name — format both messages in order and print the complete formatted string — computed from the messages list, not hardcoded."
starter = '''messages = [
    {"role": "user", "content": "why do we use NF4 during QLoRA training"},
    {"role": "assistant", "content": "NF4 stores the frozen training base compactly while gradients and optimizer state belong only to the LoRA parameters."},
]

# Implement: for each message in messages, build a line like
#   <|im_start|>{role}\n{content}<|im_end|>
# join them with a newline between pairs, and print the result.
print("TEMPLATE NOT BUILT")
'''
expect = '''<|im_start|>user
why do we use NF4 during QLoRA training<|im_end|>
<|im_start|>assistant
NF4 stores the frozen training base compactly while gradients and optimizer state belong only to the LoRA parameters.<|im_end|>'''
solution = '''messages = [
    {"role": "user", "content": "why do we use NF4 during QLoRA training"},
    {"role": "assistant", "content": "NF4 stores the frozen training base compactly while gradients and optimizer state belong only to the LoRA parameters."},
]

rendered = []
for message in messages:
    rendered.append(f"<|im_start|>{message['role']}\n{message['content']}<|im_end|>")
print("\n".join(rendered))
'''
hint = "Build a list of formatted strings: for each message m, f'<|im_start|>{m[\"role\"]}\\n{m[\"content\"]}<|im_end|>'. Then '\\n'.join(lines) and print."
