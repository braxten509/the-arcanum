[[lessons]]
id = "s04-l02"
teaches = ["prompt-completion-schema"]
title = "Turn a Note into an Elicitable Example"
body = '''
<p>A raw note teaches next-token continuation, but the assistant's job is to respond to a request in your voice. Store each reviewed example as conversational <strong>prompt-completion</strong> JSONL—the exact structured format current TRL understands. The prompt is what a future user might ask; the completion is a response you actually wrote or personally rewrote. Do not ask another model to generate hundreds of completions and call that your voice.</p>
<pre><code>{
  "id": "decision-001",
  "category": "decision-note",
  "source_path": "data/raw/notion/Project Alpha/Decision.md",
  "source_sha256": "...",
  "split": "train",
  "approved": true,
  "prompt": [
    {"role": "user", "content": "Turn these findings into a concise decision note: layout two scanned fastest; layout one hid status; layout three wasted space."}
  ],
  "completion": [
    {"role": "assistant", "content": "## Decision\n\nUse layout two. It surfaced status fastest without spending space on decoration.\n\n- Layout one hid the state.\n- Layout three used space without improving the scan.\n\n**Next action:** test layout two with real project data."}
  ]
}</code></pre>
<p>The metadata is for your pipeline, not the model. <code>id</code> is immutable. <code>category</code> lets evaluation cover different writing jobs. <code>source_sha256</code> proves which export produced the row. <code>split</code> is assigned during human review, before training. Keep every fragment from the same source document in the same split; otherwise a near-duplicate paragraph can leak from train into evaluation. <code>approved</code> records the human decision that the completion really represents you and contains no secret.</p>
<p>The roles are also deliberate. The system policy is not baked into every training record because Section VIII keeps policy user-controlled and reversible. The prompt contains the task and any source facts; the completion contains only the answer to learn. Current TRL applies the tokenizer's native chat template to this conversational pair. It can then compute loss on completion tokens only, which Section IV makes explicit.</p>
<p>Write draft rows to <code>data/drafts.jsonl</code> one JSON object per line. Use <code>json.dumps(row, ensure_ascii=False)</code> so punctuation and non-English text survive. A row that parses is not automatically good: it still needs source provenance, manual approval, and a completion that would be useful in daily work.</p>
<div class="field-notes"><div class="fn-head">FIELD NOTES // EXAMPLES ARE BEHAVIORAL CONTRACTS</div>
<p>Each row should demonstrate one recognizable job: what was asked, what a good answer looks like, and where it came from. A giant note converted into one row teaches topic continuation more than assistant behavior. Smaller, reviewed prompt/completion pairs make errors removable and let evaluation refer back to the source without exposing unrelated personal text.</p></div>
'''

[[lessons.readings]]
label = "TRL dataset formats"
url = "https://huggingface.co/docs/trl/dataset_formats"

[[lessons.exercises]]
id = "s04-l02-e1"
type = "mc"
points = 20
prompt = "Why does the course use separate prompt and completion message lists?"
choices = [
  "It lets JSON contain trailing commas",
  "It converts Markdown into a FAISS vector",
  "It removes the need for a tokenizer",
  "It preserves the response boundary so TRL can train only on the assistant completion",
]
answer = 3
whyWrong = "JSON syntax, retrieval, and tokenization are separate concerns. The schema's key benefit is an explicit supervised-response boundary."
explain = "The structure maps directly to conversational prompt-completion training."
hint = "Ask which tokens should contribute to supervised loss."

[[lessons.exercises]]
id = "s04-l02-e2"
type = "text"
points = 15
prompt = "Which boolean field records that a human accepted the row?"
answer = "approved"
accept = ["approved = true", "approved"]
hint = "It is shown beside split and provenance metadata."

[[lessons.exercises]]
id = "s04-l02-e3"
type = "fill"
points = 20
prompt = "Complete the role attached to the text the model should learn to produce."
code = '''"completion": [
  {"role": "____", "content": "## Decision..."}
]'''
answer = "assistant"
hint = "The user asks; the other conversational role answers."

[[lessons.exercises]]
id = "s04-l02-e4"
type = "mc"
points = 20
prompt = "How should two examples cut from the same exported page be split?"
choices = [
  "Keep both in the same split to prevent source-level leakage",
  "Put one in train and one in evaluation",
  "Duplicate both into every split",
  "Choose again during every training run",
]
answer = 0
whyWrong = "Cross-split fragments can carry nearly identical wording, and mutable splits destroy comparability."
explain = "Source-grouped, frozen splits protect the held-out boundary."
hint = "The model must not see a sibling paragraph of an evaluation answer."

[[lessons.exercises]]
id = "s04-l02-e5"
type = "write"
points = 35
prompt = "Build the exact conversational record and print one JSON line with sorted keys."
starter = '''import json

prompt_text = "Summarize the choice."
answer_text = "Use layout two."
record = {}
print(json.dumps(record, sort_keys=True))
'''
solution = '''import json

prompt_text = "Summarize the choice."
answer_text = "Use layout two."
record = {
    "completion": [{"role": "assistant", "content": answer_text}],
    "prompt": [{"role": "user", "content": prompt_text}],
}
print(json.dumps(record, sort_keys=True))
'''
expect = '''{"completion": [{"content": "Use layout two.", "role": "assistant"}], "prompt": [{"content": "Summarize the choice.", "role": "user"}]}'''
hint = "Each key maps to a one-item list containing a role/content dict."
