[freestyle]
title = "THE WORKING: SET THE WARD"
brief = "Decide the ward the homunculus will wear: name the base model, write the system prompt, set the inference parameters, and justify each choice against the trade-offs this chapter taught — concrete refusal boundary, not an abstract philosophy."
reward = 230
xray = "A shallow answer names a base model. A strong answer names the three layers the third rite taught, writes a system prompt with the three FIELD NOTES patterns from the fourth rite, weighs uncensored vs abliterated from the fifth rite, computes the expected refusal rate from the sixth rite, and uses the three-question decision matrix from the seventh rite to justify the final configuration."

[freestyle.badge]
id = "s08-badge"
name = "THE WARD"
desc = "Awarded for shaping the ward without breaking the vessel."

[[freestyle.rubric]]
criterion = "Layer identification & base choice"
weight = 30
desc = "Names the three layers (base model, alignment fine-tuning, system prompt) and picks a specific base model with its alignment level — the reason maps to the homunculus's use case (Notion style assistant, personal use, 16 GB VRAM), not to a generic benchmark score."

[[freestyle.rubric]]
criterion = "System prompt specificity"
weight = 30
desc = "Writes a concrete system prompt that uses role anchoring, permission enumeration, and redirection over refusal — the prompt names the task, the domain, and the refusal boundary, not a one-line 'be helpful' placeholder."

[[freestyle.rubric]]
criterion = "Trade-off analysis"
weight = 20
desc = "Weighs at least one concrete trade-off from the chapter: alignment tax (spurious refusals vs safety), uncensored vs abliterated (compliance vs coherence), or tight vs loose ward (usability cost vs safety cost) — with the homunculus's specific use case as evidence, not an abstract debate."

[[freestyle.rubric]]
criterion = "Documented decision"
weight = 20
desc = "Ends with a documented, justified ward configuration: which base, which prompt, which parameters, and the expected refusal rate — the choice is explicit and revisable, matching the seventh rite's decision-framework discipline."
