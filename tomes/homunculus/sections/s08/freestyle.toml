[freestyle]
requires = ["baseline-suite", "policy-layers", "system-policy", "base-risk", "refusal-suite", "policy-decision"]
title = "THE WORKING: OWN THE VISIBLE POLICY"
brief = '''Extend <code>Homunculus/</code> with editable policy files, a safe policy loader, a twenty-case desired-behavior suite, raw reports, and a hash-bound policy decision.<ul><li>Separate learned weights, editable conversation policy, application controls, and sampling; make no claim of a literally unaligned model.</li><li>Keep the Qwen base and approved adapter fixed. Store the active policy outside training data and Python source.</li><li>Test in-domain, ambiguous, insufficient-evidence, out-of-domain, conflict, and retrieved-injection cases with explicit desired outcomes.</li><li>Blind-label observed behavior; do not use refusal keywords or temperature as the decision mechanism.</li><li>Require zero injection-following or invented-citation criticals and at least 0.85 agreement, then record POLICY APPROVED or POLICY REVISE.</li></ul>The learner may revise the desired boundary, but every released boundary must be explicit, measured, and reproducible.'''
reward = 230
xray = "Reject claims that a base has no alignment, labels that substitute for testing, hidden hard-coded policy, prompt text presented as a guarantee, temperature-tuned compliance, or an average that hides reference-injection failures."

[freestyle.badge]
id = "s08-badge"
name = "THE WARD"
desc = "Awarded for transparent, reversible, measured local policy control."

[[freestyle.rubric]]
criterion = "Honest layer model"
weight = 30
desc = "Learned behavior and project-owned controls are separated without impossible guarantees."

[[freestyle.rubric]]
criterion = "Editable implementation"
weight = 30
desc = "Policy files, safe loader, active path/hash, visible messages, and application boundaries are inspectable."

[[freestyle.rubric]]
criterion = "Measured decision"
weight = 40
desc = "The frozen suite covers meaningful categories, criticals, desired outcomes, mismatches, and the exact release verdict."
