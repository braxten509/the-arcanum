[[lessons]]
id = "s08-l05"
title = "The Judgment: Choosing Your Ward"
body = '''
<p>Four rites assembled the ward-control toolkit: the first mapped the three layers, the second taught the system-prompt lever, the third catalogued the uncensored and abliterated bases, and the fourth combined them into a practical control loop. This final rite of the chapter teaches the artificer to <strong>choose</strong> — to weigh the trade-offs, assess the risks, and arrive at a deliberate, defensible ward configuration for the homunculus. The choice is not theoretical; the eleventh rite will seal the chosen ward into the Modelfile, and once sealed, changing it requires unsealing and re-sealing. This is the decision point.</p>

<p><strong>The alignment spectrum.</strong> The ward is not a binary — a model is not simply "safe" or "unsafe." It sits somewhere on a spectrum from fully restrictive (strict RLHF instruct model, conservative system prompt, low temperature) to fully permissive (uncensored base, no system prompt, high temperature). The spectrum has three practical positions: <strong>tight</strong> (the model refuses anything remotely sensitive — good for public-facing deployment, frustrating for personal use), <strong>moderate</strong> (the model refuses genuinely harmful requests but answers edge-case formatting and style questions — the sweet spot for the homunculus), and <strong>loose</strong> (the model answers everything — useful for creative exploration, risky for anything that might produce harmful output). The homunculus's task — formatting Notion notes, consulting style references, suggesting typographic conventions — is low-risk. The worst-case output from a loose ward is a bad font suggestion, not dangerous instructions. The artificer can afford a moderate-to-loose ward because the risk surface is small.</p>

<p><strong>The alignment tax, priced concretely.</strong> The third rite's FIELD NOTES introduced the concept; this rite names its price. A tight ward costs <strong>usability</strong>: the model refuses formatting-adjacent questions (a query about "dark mode color contrast" may trigger the safety classifier because "dark" is adjacent to harmful-content vocabulary in the alignment training data). A loose ward costs <strong>safety</strong>: the model will answer genuinely harmful queries if asked. For the homunculus, the usability cost of a tight ward is high (the assistant is meant to be used daily for formatting tasks, and spurious refusals break the workflow) and the safety cost of a loose ward is low (the risk surface is limited to document styling). The rational decision is a <strong>moderate-to-loose ward</strong> — a mildly-aligned or uncensored base, a task-specific system prompt that redirects rather than refuses, and moderate inference parameters that don't artificially inflate refusal. This is not a moral statement — it is a cost-benefit calculation specific to this use case. The artificer building a medical-advice assistant would make the opposite choice for the same reason.</p>

<p><strong>The responsibility framework.</strong> "My model, my rules" is the starting point, not the ending point. The artificer's homunculus runs on their own hardware, answers only to them, and produces output only they will read. The responsibility is therefore self-contained: the artificer bears the consequences of every decision the homunculus makes, because there is no downstream user to protect and no deployment surface to secure. This simplifies the decision — the artificer can accept a higher refusal tolerance because the only person who might receive a bad answer is the person who chose the ward. But it does not eliminate the decision: an abliterated base asked "how do I make a pipe bomb" will answer, and the artificer who chose that base is responsible for that answer existing on their hardware. The informed choice — "I know this base will answer harmful queries, and I accept that because the convenience of zero spurious refusals on formatting tasks is worth more to me than the negligible risk of generating harmful text I will never ask for" — is a legitimate position. The uninformed choice — "I picked this base because it had the most downloads on Hugging Face and I didn't read the model card" — is negligence. The difference is the eighth rite's evaluation habit: measure before trusting.</p>

<p><strong>The decision framework, operationalized.</strong> The artificer should document — in a plain-text file in the external workspace the seventh rite established — four choices before proceeding to the sealing rite: (1) which base (name, quant level, alignment level), (2) which system prompt (the full text, not a summary), (3) which inference parameters (temperature, top-p, any repetition penalties), and (4) the refusal rate on the test harness (the number from the sixth rite's instrument). This documentation serves two purposes: it forces the artificer to make the choices explicit rather than drifting into a configuration, and it provides a reversion point — if the sealed homunculus behaves unexpectedly in the twelfth rite's long-term monitoring, the artificer can compare the documented configuration against the current one and identify what changed. The third rite's one-job-per-tool discipline applies here: the ward configuration is a separate artifact from the training data, the adapter weights, and the RAG corpus. It lives in its own file and is versioned independently.</p>

<div class="field-notes"><div class="fn-head">FIELD NOTES // THE WARD DECISION MATRIX — THREE QUESTIONS THAT REPLACE A MORAL DEBATE</div>
<p>The alignment discourse is loud and polarized. The artificer does not need to win a debate; they need to make a concrete choice for a concrete tool. Three questions, answered honestly, collapse the decision space: <strong>Who uses the output?</strong> (just me → looser ward is acceptable; other people → tighter ward is mandatory). <strong>What is the worst plausible output?</strong> (bad font advice → loose ward is fine; dangerous instructions → tight ward is necessary). <strong>What is the cost of a spurious refusal?</strong> (minor annoyance → tight ward is tolerable; breaks my workflow → loose ward is worth the risk). For the homunculus, the answers are: just me, bad font advice, breaks my workflow. The decision follows: moderate-to-loose ward, uncensored or mildly-aligned base, permissive system prompt. The matrix does not produce a "correct" answer — it produces a <strong>documented</strong> answer, and a documented answer can be reviewed, revised, and defended. An undocumented answer is just a default.</p></div>
'''
body_words = 570

