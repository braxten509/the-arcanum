[[lessons.exercises]]
id = "s08-l05-e3"
type = "mc"
points = 20
prompt = "Per this rite, what is the practical difference between an informed ward choice and an uninformed one — both may produce a working model, so what distinguishes them?"
choices = [
  "An informed choice is one where the base model was downloaded from Hugging Face rather than a third-party mirror — the download source determines whether the model's weights have been tampered with, and a Hugging Face download guarantees the alignment configuration matches the model card",
  "An informed choice is one where the system prompt was written by a human rather than generated by an LLM — human-written prompts contain implicit safety reasoning that LLM-generated prompts lack, making the ward configuration more robust without additional testing",
  "An informed choice uses a model with an MMLU benchmark score above 65 — the benchmark score is a proxy for general intelligence, and a model that scores higher on general-knowledge tests is inherently more capable of making safe refusal decisions without explicit ward configuration",
  "An informed choice is documented — the artificer can name which base, which prompt, which parameters, and what refusal rate they expected, and can compare those expectations against the model's actual behavior. An uninformed choice is a configuration the artificer drifted into without explicit decisions, producing a model whose ward behavior is a surprise rather than a design"
]
answer = 3
whyWrong = "Download source is not a safety guarantee (Hugging Face hosts both aligned and uncensored models, and the model card describes the training — it doesn't enforce any configuration), benchmark scores measure general knowledge, not safety behavior (a model with high MMLU can still be either aligned or uncensored), and prompt authorship is irrelevant to ward quality (a human can write a terrible system prompt just as easily as an LLM can). The real distinction is documentation: an informed choice is explicit and reviewable; an uninformed choice is a default the artificer didn't realize they were making."
hint = "The lesson says 'The informed choice — I know this base will answer harmful queries, and I accept that because the convenience is worth more to me than the negligible risk — is a legitimate position. The uninformed choice — I picked this base because it had the most downloads — is negligence.' The correct choice identifies documentation and explicit decision-making as the differentiator."
explain = "This is the same habit the eighth rite's evaluation lesson drilled: measure before trusting. An informed ward choice is one where the artificer tested the ward against real prompts, recorded the refusal rate, and made a conscious trade-off. An uninformed choice is one where the model's refusal behavior is whatever the default happened to be — and the artificer discovers it at runtime when the homunculus unexpectedly refuses (or doesn't refuse) a prompt. The difference is not the ward's quality — both configurations might produce identical refusal rates. The difference is that the informed artificer knows what the rate is and chose it deliberately."

[[lessons.exercises]]
id = "s08-l05-e4"
type = "fill"
points = 20
prompt = "Fill the missing scoring rule in the ward-decision matrix from the lesson — the condition that assigns the highest score to an uncensored base when the use case is personal and low-risk, matching the lesson's recommendation for the homunculus."
code = '''def score_base(base, use_case):
    """Score a base model for a given use case.
    Higher score = better fit."""
    score = 0
    if use_case["risk"] == "low" and base["____"] == "none":
        score += 3    # uncensored is best for low-risk personal use
    if base["params"] <= use_case["vram_budget"]:
        score += 2    # fits in VRAM (fifth rite's budget)
    if use_case["alignment"] == "loose" and base["alignment"] != "strict":
        score += 1    # alignment preference match
    return score'''
answer = "alignment"
accept = ["alignment"]
hint = "The lesson's decision framework evaluates a base by its alignment level: uncensored bases (alignment='none') score highest for low-risk personal use cases. The code checks base['alignment'] — the same field the fifth rite's model-filter lab used to select uncensored bases."

[[lessons.exercises]]
