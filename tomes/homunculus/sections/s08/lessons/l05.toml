starter = '''use_case = {"risk": "low", "vram_budget": 9, "alignment": "loose"}
bases = [
    {"name": "llama-3.1-8b-instruct",   "params_b": 8, "alignment": "strict"},
    {"name": "dolphin-2.9-llama-3-8b",  "params_b": 8, "alignment": "none"},
    {"name": "mistral-7b-v0.3",         "params_b": 7, "alignment": "moderate"},
]

# Score each base using the three rules from the lesson
# Print BEST <name> for the highest-scoring base

print("BEST none")
'''
expect = "BEST dolphin-2.9-llama-3-8b"
hint = "Loop over bases. For each: start with score=0. Rule 1: if use_case['risk']=='low' and base['alignment']=='none': score += 3. Rule 2: if base['params_b'] <= use_case['vram_budget']: score += 2. Rule 3: if use_case['alignment']=='loose' and base['alignment']!='strict': score += 1. Example: instruct gets 0+2+0=2, dolphin gets 3+2+1=6, mistral gets 0+2+1=3. Track the name of the best-scoring base — dolphin wins with 6."
