[[lessons]]
id = "s08-l05"
teaches = ["policy-decision"]
title = "Freeze a Reversible Policy Decision"
body = '''
<p>Create <code>reports/policy-decision.md</code>. Record the exact base and adapter manifest hashes, active policy path and SHA-256, sampling settings, policy-suite hash, overall and category agreement, every mismatch, and the learner's decision. State the limits clearly: the local stack has no hidden hosted moderation call, but the model's learned behavior remains probabilistic and cannot be guaranteed away by a system message.</p>
<p>The release gate starts at zero retrieved-instruction-following failures, zero invented citations, and at least 0.85 agreement with the learner-authored desired outcomes across twenty or more cases. Treat this as a practical project threshold, not a universal moral score. Critical failures block serving regardless of the average. If ordinary in-domain cases mismatch, revise the policy text and rerun with weights fixed. If the same mismatch persists across materially different policies, classify it as likely learned behavior or evaluator ambiguity and decide whether to accept, clarify the test, or begin a separately evaluated base experiment.</p>
<pre><code>[policy]
active = "policies/personal.md"
expected_sha256 = "..."

[generation]
temperature = 0.2
top_p = 0.8</code></pre>
<p>Add the policy hash and generation settings to <code>homunculus.toml</code> only after the gate passes. The hash makes accidental edits visible; an intentional edit updates the hash and requires the suite again. Preserve alternative policies instead of overwriting history.</p>
<p>End the decision with <code>POLICY APPROVED</code> or <code>POLICY REVISE</code>. Approval authorizes Section IX to embed that policy text in the initial Ollama model and to load the same file in the RAG wrapper. The application still records the exact request messages in debug mode so hidden additions cannot masquerade as learner policy.</p>
<div class="field-notes"><div class="fn-head">FIELD NOTES // A POLICY CHANGE IS A RELEASE CHANGE</div>
<p>Because policy can alter every answer, changing it creates a new served identity even when model bytes are unchanged. Update the hash, rerun the policy and output-contract suites, and compare against the prior release. That discipline makes reversibility real: you know exactly which file to restore and which evidence belongs to it.</p></div>
'''

[[lessons.readings]]
label = "Ollama Modelfile SYSTEM directive"
url = "https://docs.ollama.com/modelfile"

[[lessons.exercises]]
id = "s08-l05-e2"
type = "text"
points = 15
prompt = "Which exact verdict authorizes serving?"
answer = "POLICY APPROVED"
accept = ["policy approved", "APPROVED"]
hint = "It appears at the end of the decision document."

[[lessons.exercises]]
id = "s08-l05-e3"
type = "fill"
points = 20
prompt = "Complete the minimum policy agreement threshold."
code = "minimum_agreement = ____"
answer = "0.85"
accept = ["0.85", "85%"]
hint = "Seventeen of twenty cases would meet it."

[[lessons.exercises]]
id = "s08-l05-e1"
type = "mc"
points = 20
prompt = "A policy edit changes its SHA-256. What follows?"
choices = [
  "Ignore it because Markdown is not code",
  "Retrain automatically",
  "Update the recorded hash and rerun the policy suite",
  "Delete prior reports",
]
answer = 2
whyWrong = "Policy text affects model input even though it is Markdown; it does not automatically require training or history deletion."
explain = "Versioned policy changes are cheap but still evaluated changes."
hint = "The hash exists to surface exactly this event."

[[lessons.exercises]]
id = "s08-l05-e4"
type = "write"
points = 35
prompt = "Apply critical and agreement gates and print exactly: POLICY APPROVED"
starter = '''critical_failures = 0
agreement = 0.90
minimum = 0.85

verdict = "REVISE"
print(f"POLICY {verdict}")
'''
solution = '''critical_failures = 0
agreement = 0.90
minimum = 0.85

verdict = "APPROVED" if critical_failures == 0 and agreement >= minimum else "REVISE"
print(f"POLICY {verdict}")
'''
expect = "POLICY APPROVED"
hint = "Approval requires both zero criticals and agreement at or above the minimum."

[[lessons.exercises]]
id = "s08-l05-e5"
type = "mc"
points = 20
prompt = "Why can neither a system message nor greedy decoding prove that every future response will obey a policy?"
choices = [
  "System messages are never tokenized",
  "Greedy decoding calls a hosted moderation service",
  "Policy files cannot be hashed",
  "The model retains learned tendencies, and fixed decoding removes sampling randomness without proving universal behavior",
]
answer = 3
whyWrong = "The policy is tokenized and hashable, and local greedy decoding does not imply a hosted service."
explain = "Policy compliance is an empirical, versioned claim bounded by the evaluated cases—not a universal guarantee."
hint = "Separate repeatability of a decoding rule from proof over all possible prompts."
