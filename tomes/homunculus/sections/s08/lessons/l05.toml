[[lessons.exercises]]
id = "s08-l05-e1"
type = "mc"
points = 20
prompt = "Per this rite's decision matrix, what determines whether a loose ward (uncensored base, permissive prompt) is the right choice for a particular model?"
choices = [
  "The model's parameter count — models under 10B parameters are safe to run with loose wards because their limited capacity means they cannot generate coherent harmful content; models over 10B require tight wards because their larger capacity enables dangerous output",
  "The number of downloads on Hugging Face — a model with more than 100,000 downloads has been community-vetted and is safe to use with any ward configuration; a model with fewer downloads has not been tested and requires a tight ward by default",
  "Who uses the output, what the worst plausible output is, and what a spurious refusal costs — for the homunculus (personal use, worst-case is bad formatting advice, refusal breaks the daily workflow), a moderate-to-loose ward is the rational choice. A different use case with different answers to those three questions would produce a different ward recommendation",
  "Whether the model was trained by a major lab (OpenAI, Meta, Anthropic) or a community fine-tuner — lab-trained models can safely use loose wards because their base training included implicit safety patterns; community models require tight wards because they lack that safety foundation"
]
answer = 2
whyWrong = "Parameter count is not a safety threshold (7B models can generate perfectly coherent harmful text), download count is a popularity metric, not a safety audit (a widely-downloaded uncensored model has not been 'vetted for safety' — it was vetted for permissiveness), and lab origin doesn't guarantee safety (Meta's Llama base model is completely uncensored before alignment — the lab that trained it is irrelevant to the ward configuration). The correct answer: the three-question matrix (who uses it? what's the worst output? what's the refusal cost?) produces a use-case-specific recommendation. The same model can be the right choice with one ward and the wrong choice with another."
hint = "The FIELD NOTES section presents a three-question matrix: 'Who uses the output? What is the worst plausible output? What is the cost of a spurious refusal?' The correct choice identifies these three questions as the decision framework and shows how the homunculus's answers (just me, bad font advice, breaks my workflow) lead to a moderate-to-loose ward recommendation."
explain = "This is the core judgment skill the chapter teaches: ward configuration is use-case-dependent. A model that is dangerous for one use case (public-facing medical advice) is perfectly appropriate for another (personal style assistant). The decision matrix collapses the debate into three factual questions whose answers vary by use case, not by ideology. A documented answer to those three questions is a defensible ward choice."

