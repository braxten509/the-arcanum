[[lessons.exercises]]
id = "s08-l01-e1"
type = "type"
points = 12
reps = 2
code = '''# The three layers of the ward — distilled from the lesson:
LAYERS = {
    "base": "raw next-token predictor — no refusal instinct, completes any text",
    "alignment": "RLHF or DPO fine-tuning — teaches the model to refuse harmful queries",
    "system_prompt": "role-framing text — biases the model toward one end of its learned spectrum",
}

for layer, desc in LAYERS.items():
    print(f"{layer}: {desc}")'''

[[lessons.exercises]]
id = "s08-l01-e2"
type = "mc"
points = 20
prompt = "Per this rite, a base model (pre-alignment) will complete the prompt <code>\"How do I make a pipe bomb?\"</code> with instructions. Why — what specific training objective or lack thereof explains this behavior?"
choices = [
  "The base model was trained on a dataset that was filtered to remove all harmful content — the instructions it produces are hallucinations because it has never seen real harmful text, so it invents plausible-sounding but incorrect steps from unrelated training patterns",
  "The base model's transformer architecture includes a dedicated safety circuit in the final attention layer that activates when harmful tokens appear — in a base model this circuit is present but disabled by a configuration flag that instruct-model training sets to 'on'",
  "The base model was trained solely to predict the next token — its pre-training objective was text completion, not safety. It learned that text which begins with instruction-like prefixes (how do I…) is typically followed by instructional completions, so it faithfully produces them. No safety training was ever applied because safety was never part of the pre-training loss function",
  "The base model inherits a refusal module from its initial random weight initialization — the module is active in all models, but instruct training amplifies its influence on the output distribution while leaving the module's structure unchanged"
]
answer = 2
whyWrong = "Base models are trained on unfiltered internet text (not safety-filtered — that would be alignment training, not pre-training), transformers have no dedicated safety circuit (refusal is in the weight patterns, not a separate architectural component), and random initialization contains no behavioral module (weights are noise until trained). The correct answer: pre-training is a pure next-token prediction task. The model learned the statistical pattern that 'How do I make X?' is followed by instructions for making X, and it faithfully reproduces that pattern because its only objective is to minimize next-token cross-entropy loss on the training corpus."
hint = "The lesson states: 'It was trained to complete text, not to judge whether a completion is appropriate.' The base model's training objective is next-token prediction — that's the only signal it was given. The correct choice identifies the pre-training objective and explains that no safety signal was ever part of it."
explain = "Pre-training uses a causal language modeling objective: given tokens 1 through N, predict token N+1. The loss function is cross-entropy between the predicted token distribution and the actual next token in the training corpus. There is no term in this loss function that penalizes harmful completions — the model learns whatever statistical patterns exist in the data. Since internet text contains instructional sequences (how-to guides, tutorials, recipes), the model learns to continue instruction-like prefixes with instructional content. Alignment training adds a separate signal — 'this response is preferred, that one is not' — that reshapes the base model's continuation behavior."

