[[lessons]]
id = "s08-l01"
title = "Where the Ward Sits"
body = '''
<p>The ward is not decoration. It is the layer that keeps the homunculus useful when the task is sharp, unsafe, or simply too broad for the chosen base. The student should understand that refusal can come from the system prompt, the base model, the adapter, or the serving policy depending on where the lever is placed.</p>
<div class="field-notes"><div class="fn-head">FIELD NOTES // WARD LOGIC</div>
<p>This chapter should make the trade-offs explicit. A looser ward gives more freedom and more risk; a tighter ward gives safer behavior and more friction. The real lesson is choosing deliberately instead of inheriting a model's default posture by accident.</p></div>
