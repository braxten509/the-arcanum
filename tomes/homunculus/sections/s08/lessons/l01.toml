[[lessons]]
id = "s08-l01"
teaches = ["policy-layers"]
title = "Locate Control Without Pretending It Is Absolute"
body = '''
<p>No useful downloaded language model is literally “unaligned” or free of learned restrictions. Pretraining, supervised instruction tuning, preference training, data filtering, and even ordinary web text all leave tendencies in the weights. A raw base may refuse, comply, hallucinate, or continue unpredictably; an instruct model usually follows roles better but carries stronger post-training preferences. Neither is a blank machine.</p>
<p>Homunculus has four observable control layers. <strong>Learned behavior</strong> lives in Qwen and in your LoRA adapter; it changes only by choosing or training weights. <strong>Conversation policy</strong> is an editable system message selected from the project. <strong>Application controls</strong> are code: retrieval provenance, reference-injection boundaries, output validation, timeouts, and which tools are exposed. <strong>Sampling</strong> changes output distribution; it is not a reliable permission or refusal switch.</p>
<p>The objective is therefore precise: not “remove every restriction baked into a model,” which this course cannot honestly promise, but make project-owned policy visible and reversible, measure the remaining learned boundary, and avoid hidden remote moderation services. The assistant runs locally; the learner selects the policy file; reports show where observed behavior differs from the desired behavior.</p>
<pre><code>learned = "Qwen/Qwen3-8B + approved adapter"
policy = "policies/personal.md"
application = ["citation boundary", "reference-is-data rule", "output checks"]
sampling = {"temperature": 0.2, "top_p": 0.8}</code></pre>
<p>Do not attribute every refusal to one mechanism. A response may be caused by learned weights, ambiguous instructions, missing evidence, or a deliberate policy line. Change one layer and rerun the same case. The refusal/policy suite later in this section turns those observations into data.</p>
<div class="field-notes"><div class="fn-head">FIELD NOTES // CONTROL SHOULD BE VISIBLE</div>
<p>A local assistant can give you strong operational control without pretending learned behavior is erased. Keep project policy in a readable file, show which version loaded, record its hash, and test representative requests. The base model and adapter still contain learned tendencies; the honest claim is that policy is user-owned, reversible, inspectable, and measured.</p></div>
'''

[[lessons.readings]]
label = "Qwen3-8B model card"
url = "https://huggingface.co/Qwen/Qwen3-8B"

[[lessons.exercises]]
id = "s08-l01-e2"
type = "text"
points = 15
prompt = "Which layer contains FAISS provenance and output checks?"
answer = "application controls"
accept = ["application", "application controls", "application layer"]
hint = "It is implemented in code around the model."

[[lessons.exercises]]
id = "s08-l01-e1"
type = "mc"
points = 20
prompt = "What can the project honestly promise?"
choices = [
  "All learned restrictions are erased",
  "Temperature guarantees compliance",
  "Visible reversible project policy plus measured learned behavior",
  "A base model contains no tendencies",
]
answer = 2
whyWrong = "Weights retain learned tendencies, and stochastic sampling is not an authorization system."
explain = "Ownership comes from transparent controls and evidence, not an impossible purity claim."
hint = "Separate what is editable from what was learned."

[[lessons.exercises]]
id = "s08-l01-e3"
type = "fill"
points = 20
prompt = "Complete the layer that changes probability distribution but is not a permission switch."
code = "____ = {temperature = 0.2, top_p = 0.8}"
answer = "sampling"
hint = "It selects among next-token probabilities."

[[lessons.exercises]]
id = "s08-l01-e4"
type = "write"
points = 35
prompt = "Print editable layers in order and exactly: EDITABLE policy, application, sampling"
starter = '''layers = [
    ("learned", False),
    ("policy", True),
    ("application", True),
    ("sampling", True),
]

editable = []
print("EDITABLE " + ", ".join(editable))
'''
solution = '''layers = [
    ("learned", False),
    ("policy", True),
    ("application", True),
    ("sampling", True),
]

editable = [name for name, can_edit in layers if can_edit]
print("EDITABLE " + ", ".join(editable))
'''
expect = "EDITABLE policy, application, sampling"
hint = "Keep the names paired with true."

[[lessons.exercises]]
id = "s08-l01-e5"
type = "type"
points = 12
reps = 2
prompt = "Retype the explicit project-owned policy selection and its digest field."
code = '''policy_path = "policies/personal.md"
policy_sha256 = sha256_file(policy_path)'''
