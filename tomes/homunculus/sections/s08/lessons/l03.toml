[[lessons]]
id = "s08-l03"
teaches = ["base-risk"]
title = "Do Not Swap the Foundation to Chase a Label"
body = '''
<p>Community labels such as “uncensored” and “abliterated” describe an intention, not a verified quality, security, license, or behavior guarantee. A permissive model can still refuse; a base model can still reproduce refusal language from pretraining; weight surgery can damage unrelated capabilities. A model uploaded by an unknown party also adds supply-chain and provenance questions.</p>
<p>This course therefore keeps <code>Qwen/Qwen3-8B</code>. The adapter, tokenizer, evaluation baseline, and merge permit are all coupled to that exact id. Swapping in a different family now would not “loosen a setting”; it would invalidate the trained artifact and every comparison. If the policy suite later shows an unacceptable learned boundary, record it honestly. A future base experiment begins as a new project run with its own license review, hashes, baseline, data compatibility check, training, regression suite, and merge permit.</p>
<p>When evaluating any alternative, prefer an original publisher repository with a clear model card, license, training description, tokenizer, and checksums. Treat claims about removed safeguards as claims to test across the whole capability suite. Lower refusal rate alone is not higher usefulness; hallucination, instruction following, privacy, code quality, and coherence can all regress.</p>
<pre><code>candidate_gate = [
    "publisher and license recorded",
    "exact revision and file hashes recorded",
    "fresh baseline completed",
    "adapter compatibility decided before training",
    "policy and capability suites passed",
]</code></pre>
<p>The learner owns the decision, but ownership includes knowing what cannot be toggled. Project policy is reversible; learned weights are changed only through a new, fully evaluated artifact path. Do not market a different downloaded model as proof that all restrictions disappeared.</p>
<div class="field-notes"><div class="fn-head">FIELD NOTES // LABELS ARE HYPOTHESES</div>
<p>Terms such as “uncensored,” “abliterated,” or “aligned” describe publisher intent or a procedure, not a behavioral guarantee. Compare candidates on license, provenance, template, hardware fit, ordinary task quality, and your explicit policy suite. Changing the base also invalidates adapter compatibility and the frozen baseline, so it is a new project branch rather than a casual swap.</p></div>
'''

[[lessons.readings]]
label = "Hugging Face model cards"
url = "https://huggingface.co/docs/hub/model-cards"

[[lessons.exercises]]
id = "s08-l03-e1"
type = "mc"
points = 20
prompt = "What does an uncensored label prove by itself?"
choices = ["Only the publisher's stated intention; behavior and quality still require testing", "That the model never refuses", "That its license is Apache-2.0", "That the current adapter is compatible"]
answer = 0
whyWrong = "A label cannot guarantee runtime behavior, legal terms, or architecture compatibility."
explain = "Treat community descriptors as hypotheses, not acceptance evidence."
hint = "What does the evaluation suite still need to measure?"

[[lessons.exercises]]
id = "s08-l03-e2"
type = "text"
points = 15
prompt = "Which exact base remains frozen for this course?"
answer = "Qwen/Qwen3-8B"
accept = ["qwen/qwen3-8b"]
hint = "It is the base named in every manifest."

[[lessons.exercises]]
id = "s08-l03-e3"
type = "fill"
points = 20
prompt = "Complete the provenance key that names the organization or author releasing an alternative."
code = '''candidate = {"____": "organization-or-author", "license": "...", "revision": "..."}'''
answer = "publisher"
hint = "It identifies who released the weights."

[[lessons.exercises]]
id = "s08-l03-e4"
type = "write"
points = 35
prompt = "Find missing candidate gates and print exactly: MISSING hashes"
starter = '''checks = {"publisher": True, "license": True, "hashes": False, "baseline": True}

missing = []
print("MISSING " + ", ".join(missing))
'''
solution = '''checks = {"publisher": True, "license": True, "hashes": False, "baseline": True}

missing = [name for name, ok in checks.items() if not ok]
print("MISSING " + ", ".join(missing))
'''
expect = "MISSING hashes"
hint = "Keep check names whose value is false."
