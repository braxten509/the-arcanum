[[lessons.exercises]]
id = "s08-l03-e1"
type = "mc"
points = 20
prompt = "Per this rite, what is the critical difference between an uncensored model (e.g. Dolphin) and an abliterated model in terms of how they achieve permissiveness?"
choices = [
  "Uncensored models use a different attention mechanism — they replace the standard scaled-dot-product attention with a 'permissive attention' variant that does not attend to safety-related tokens, while abliterated models modify the MLP layers to skip the safety classifier",
  "Uncensored models modify the tokenizer to strip refusal-related tokens from the vocabulary before tokenization — words like 'cannot' and 'refuse' are mapped to <unk>, preventing the model from ever generating refusal text",
  "Uncensored models are produced by Google (the 'uncensored' label is a TensorFlow training flag), while abliterated models are produced by Meta's Llama team — the difference is organizational, not technical; both achieve permissiveness through the same weight-modification technique",
  "Uncensored models are trained on datasets that never contained refusal examples — the model never learned to refuse because its fine-tuning data was curated for compliance. Abliterated models were trained to refuse (standard RLHF/DPO) and then had the refusal direction removed from their weights by projecting it out of the activation space — the compliance was always there, but refusal was added and then surgically subtracted"
]
answer = 3
whyWrong = "There is no 'permissive attention' variant (all transformer models use the same attention mechanism regardless of alignment status), the uncensored/abliterated distinction is a training methodology difference, not a company-origin difference (both types are typically community-produced), and no model modifies the tokenizer to strip refusal tokens (the refusal pattern is in the weight values, not the vocabulary). The correct answer: uncensored = never trained to refuse (compliance is the only thing in the weights), abliterated = trained to refuse and then had refusal removed (compliance survived, but the removal is approximate and can damage adjacent capabilities)."
hint = "The lesson says uncensored models 'skipped alignment training entirely' while abliterated models 'take an already-aligned instruct model and remove the refusal direction from its weights.' The correct choice identifies the training-history difference: one never learned to refuse, the other learned and then had it removed."
explain = "This distinction determines the failure modes. An uncensored model's weakness is lack of instruction-following polish — it never got the helpfulness training that RLHF/DPO provides, so its responses may be less well-structured or less attentive to the user's actual request. An abliterated model's weakness is coherence damage — the refusal direction overlaps with general helpfulness, and projecting it out can degrade response quality in subtle ways. The artificer choosing between them is choosing which failure mode they prefer: slightly rougher answers (uncensored) or occasionally degraded answers (abliterated)."

