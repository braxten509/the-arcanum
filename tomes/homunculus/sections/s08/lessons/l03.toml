id = "s08-l03-e3"
type = "fill"
points = 20
prompt = "Fill the missing library in the abliteration procedure — the step that loads the instruct model's weights so the refusal direction can be extracted from the residual-stream activations at a middle layer."
code = '''import torch
from transformers import AutoModelForCausalLM, AutoTokenizer

model_name = "meta-llama/Llama-3.1-8B-Instruct"
tokenizer = AutoTokenizer.from_pretrained(model_name)
model = ____.from_pretrained(model_name, torch_dtype=torch.bfloat16)

# Step 1: collect paired prompts (refusal vs compliance)
# Step 2: extract residual-stream activations at layer 14
# Step 3: compute the refusal direction vector
# Step 4: project it out of the attention + MLP output matrices'''
answer = "AutoModelForCausalLM"
