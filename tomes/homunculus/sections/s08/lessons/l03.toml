[[lessons.exercises]]
id = "s08-l03-e4"
type = "mc"
points = 20
prompt = "Per this rite, why does abliteration risk degrading the model's general response quality — not just its refusal behavior?"
choices = [
  "The refusal direction overlaps with general helpfulness in the activation space — some of the same activation patterns that encode 'I should be careful about this request' also encode 'I should consider what the user actually wants,' so projecting out the refusal direction also partially removes the model's ability to produce nuanced, context-appropriate responses",
  "The projection operation introduces floating-point underflow in the weight matrices — subtracting the outer product of the refusal direction produces values below float16 precision, which are rounded to zero and create dead neurons that never fire during inference",
  "Abliteration requires retraining the model on a new dataset after the weight modification — if the retraining dataset is too small (fewer than 10,000 examples), the model's general knowledge degrades because the abliteration removed knowledge alongside the refusal patterns",
  "The abliteration procedure only modifies the attention output projection matrices, not the MLP layers — the MLP layers still contain the original refusal pattern, creating an internal inconsistency where the attention layers try to produce compliant text but the MLP layers inject refusal tokens into the residual stream"
]
answer = 0
whyWrong = "Floating-point underflow is not the issue — the weight modifications are small (the refusal direction is a small component of the total weight magnitude), and modern GPUs handle bf16 subtraction without precision loss. Abliteration does not require retraining — it is a weight-modification step, and the model is used as-is afterward. And the procedure modifies both attention output and MLP output matrices — the FIELD NOTES state 'the attention output projection and MLP output matrices.' The correct answer is overlap: the refusal direction is not a clean, isolated signal — it shares the activation space with helpfulness, nuance, and context-awareness, and removing it removes some of those capabilities too."
hint = "The lesson says 'the refusal direction is not cleanly separable from general helpfulness — projecting it out of the weight matrices can degrade the model's ability to produce nuanced, context-appropriate responses, because some of the same activation patterns that encode I should be careful here also encode I should consider the user's actual intent.' The correct choice identifies this feature overlap as the cause of quality degradation."
explain = "This is the central trade-off of abliteration. The technique assumes the refusal direction is orthogonal to the helpfulness direction — that you can subtract one without affecting the other. In practice, the two directions are correlated: the model's internal representation of 'this request requires careful handling' serves both the refusal circuit (don't answer dangerous things) and the helpfulness circuit (understand what the user is really asking). Removing the former also weakens the latter. The result is a model that refuses nothing — and also sometimes misses the point."

