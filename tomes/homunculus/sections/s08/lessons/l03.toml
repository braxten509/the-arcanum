[[lessons]]
id = "s08-l03"
title = "Uncensored & Abliterated Bases"
body = '''
<p>Two rites have mapped the ward: the first identified its three layers, the second taught how to wield the system-prompt lever. But the deepest and most consequential choice — the base model — was deferred. The artificer cannot rewrite alignment weights with a config file, but they <strong>can</strong> choose a base that was never aligned in the first place, or one whose alignment was surgically removed. This rite teaches what those bases are, how they differ from the instruct models the second and seventh rites used, and what the trade-offs cost.</p>

<p>An <strong>uncensored</strong> base is a model that skipped alignment training entirely. The base pre-training completed — the model can generate coherent text, follow instruction patterns it saw during pre-training, and produce domain-appropriate answers — but no RLHF or DPO pass was ever run. The model's weights are pure continuation: if the prompt asks for instructions, it produces instructions; if the prompt asks for an opinion, it produces an opinion; if the prompt asks for something the artificer would rather it refused, it produces that too. Uncensored models are typically released by community fine-tuners who take a base model (Llama, Mistral, Gemma) and run additional pre-training or supervised fine-tuning on permissive datasets — Dolphin, Nous Hermes, and the various "uncensored" Llama variants on Hugging Face follow this pattern. They are base models with extra capability training, but no safety training. The fifth rite's memory-budget lesson (GGUF quantization) and the seventh rite's binding lesson (QLoRA fine-tuning) both apply to these bases identically — they are structurally the same kind of model, just trained with a different objective.</p>

<p><strong>Abliteration</strong> is a more surgical approach: take an already-aligned instruct model and remove the refusal direction from its weights. The technique works by computing the <strong>refusal direction</strong> — a vector in the model's activation space that points from "compliant" responses to "refusal" responses — and projecting it out of the weight matrices. The procedure: collect paired prompts where the model refuses (harmful version) and complies (benign version of the same request), extract the residual-stream activations at a middle layer for both, compute the difference vector (refusal activation minus compliance activation), and subtract that direction from the model's weight matrices with a scaling factor. The result is a model whose weights no longer contain the refusal pattern — it will answer prompts the original instruct model would have refused. The cost is coherence: the refusal direction is not cleanly separable from general helpfulness — projecting it out of the weight matrices can degrade the model's ability to produce nuanced, context-appropriate responses, because some of the same activation patterns that encode "I should be careful here" also encode "I should consider the user's actual intent." An abliterated model tends to be more willing but less precise — it answers everything, but some answers are worse.</p>

<p>The practical differentiator for the artificer: uncensored models (Dolphin, Nous Hermes) are <strong>trained to be permissive</strong> — their fine-tuning dataset included explicit instruction-following examples designed to produce compliance across a wide range of topics. Abliterated models are <strong>trained to refuse and then had refusal removed</strong> — the compliance capability is present (the instruct model was trained to be helpful AND harmless, and the helpful part survived), but the removal is approximate and can damage adjacent capabilities. For the homunculus's use case — a style assistant that formats Notion notes and consults online style references — an uncensored base is the cleaner choice: the task is safe, the wider compliance range means fewer spurious refusals on formatting-adjacent topics, and the model's helpfulness was reinforced, not removed. An abliterated base is the right choice when the best instruct model for the task (highest quality, best domain knowledge) also happens to be the most refusal-prone — the artificer trades some coherence for freedom, but starts from a stronger foundation. The eighth rite's evaluation habit (measure before trusting) applies here: test both a good instruct model and its abliterated variant on the actual style-assistant prompts from the sixth rite's curated dataset, and measure which produces better answers — not just which refuses less.</p>

<div class="field-notes"><div class="fn-head">FIELD NOTES // THE REFUSAL DIRECTION IS REAL, NOT METAPHORICAL</div>
<p>Abliteration is not a vibes-based technique. The refusal direction exists as a measurable vector in the model's activation space. Researchers have shown that a single direction in the residual stream of a middle transformer layer (typically layer 12–16 in a 32-layer model) accounts for a large fraction of the variance between refusal responses and compliant responses on paired prompts. Projecting that direction out of the weight matrices — specifically, computing the outer product of the direction vector with itself and subtracting it from the attention output projection and MLP output matrices — removes the model's ability to produce refusal text while largely preserving its ability to produce compliant text. The scaling factor (how much of the direction to subtract) is the critical hyperparameter: too little and the model still refuses; too much and the model's coherence degrades noticeably. The technique is architecture-agnostic — it works on Llama, Mistral, Gemma, and any transformer with a residual stream — because the refusal pattern lives in the weights, not in a model-specific safety module that doesn't exist.</p></div>
'''
body_words = 540

[[lessons.readings]]
