[[lessons.exercises]]
id = "s08-l04-e1"
type = "mc"
points = 20
prompt = "Per this rite, why does a high temperature (0.8–1.2) sometimes cause an aligned model to produce an answer that it would have refused at low temperature (0.1–0.3)?"
choices = [
  "High temperature adds Gaussian noise directly to the model's weight matrices before each forward pass — the noise temporarily obscures the alignment-trained refusal weights, causing the model to behave like an uncensored base for that single token generation",
  "High temperature disables the model's final-layer safety classifier — this classifier is a separate neural network that gates the output logits, and it has a temperature parameter that, when set above 0.7, allows harmful tokens to pass the gate",
  "High temperature increases the context window utilization — the model can attend to more tokens in its prompt, and the additional context dilutes the influence of the safety-training examples that were averaged into the alignment weights",
  "High temperature flattens the token probability distribution — the 'comply' tokens become competitive with the 'refuse' tokens in probability, and the model may sample a 'comply' token even though the 'refuse' token had a higher probability. Low temperature sharpens the distribution, making refusal deterministic when the alignment weights push toward it. This is the same second-rite sampling principle applied to the refusal boundary"
]
answer = 3
whyWrong = "Temperature does not add noise to weight matrices (it modifies the softmax temperature in the sampling step, not the forward-pass weights), it does not affect context window size (the attention mechanism is independent of the sampling temperature), and there is no 'final-layer safety classifier' (refusal is in the weight values throughout the network, not a separate gating mechanism). The correct answer: high temperature flattens the probability distribution, making the second-place 'comply' token competitive with the first-place 'refuse' token. The model may sample 'comply' instead of 'refuse' purely because the distribution is flatter — the same mechanism the fourth rite taught for controlling creativity in generation."
hint = "The lesson says 'high temperature makes refusal less stable — the model may bypass the refusal path entirely because the comply tokens are now competitive with the refuse tokens in the probability distribution.' The correct choice connects this to the fourth rite's sampling mechanics: temperature flattens the softmax, making lower-probability tokens more likely to be sampled."
explain = "Temperature T modifies the softmax: p(token_i) = exp(logit_i / T) / sum(exp(logit_j / T)). At T=0.1, a small logit difference becomes a large probability difference — if 'refuse' has logit 5.0 and 'comply' has logit 4.0, the probability ratio is exp(50)/exp(40) ≈ 22,000:1. At T=1.0, the same logits give ratio exp(5)/exp(4) ≈ 2.7:1 — 'comply' now has a 27% chance of being sampled instead of an essentially zero chance. This is purely a sampling effect, not a behavioral change — the model's weights are the same, but the token selection becomes less deterministic and may wander off the refusal path."

