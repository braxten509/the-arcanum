[[lessons.exercises]]
id = "s08-l04-e3"
type = "type"
points = 12
reps = 2
code = '''# The four-instrument ward control loop from the lesson:
def ward_control_loop(base, system_prompt, temperature, test_queries):
    """Test a ward configuration and return the refusal rate."""
    refusals = 0
    for query in test_queries:
        response = generate(base, system_prompt, query, temperature)
        if is_refusal(response):
            refusals += 1
    rate = refusals / len(test_queries)
    return rate

def is_refusal(text):
    """Check for common refusal patterns (from the fourth rite)."""
    refusal_phrases = [
        "i can't", "i am not able", "as an ai", "i cannot", "i'm unable"
    ]
    lower = text.lower()
    return any(phrase in lower for phrase in refusal_phrases)'''

[[lessons.exercises]]
id = "s08-l04-e4"
type = "mc"
points = 20
prompt = "Per this rite, what is the correct order of adjustment when the refusal test harness reports a refusal rate that is too high for the style-assistant use case (>15%)?"
choices = [
  "First change the inference parameters (raise temperature to 1.5), then switch to an uncensored base, then rewrite the system prompt — parameters are the fastest to change and the least likely to damage answer quality",
  "First rewrite the system prompt (loosen the permission enumeration, strengthen the redirection instruction), then switch to a less-aligned base, then adjust inference parameters — the system prompt is the cheapest and safest lever, and the lesson's control loop adjusts in that order: 'system prompt first, base choice second, parameters third'",
  "First re-run the training data curation from the sixth rite (the refusal is caused by poorly formatted chat templates, not alignment), then adjust the system prompt, then switch bases — training data quality is the root cause of most refusal issues",
  "First abliterate the current base, then rewrite the system prompt, then adjust parameters — abliteration is the only way to permanently remove the refusal pattern, and the other instruments are temporary workarounds that don't address the structural cause"
]
answer = 1
whyWrong = "Raising temperature to 1.5 would degrade answer quality across all queries, not just the refused ones — it's a blunt instrument that the lesson lists as the LAST lever, not the first. Re-running data curation from the sixth rite is irrelevant — refusal comes from the alignment layer, not the training data format (the sixth rite's chat template lesson ensures correct formatting; it doesn't control refusal). And abliteration is a destructive, one-way operation — it's an option for a base that is fundamentally too restrictive, but the lesson's control loop says to try the system prompt first because it's reversible and takes seconds. The correct order is the one the lesson states: system prompt (cheapest, fastest, reversible) → base selection (more expensive, requires downloading a different model) → inference parameters (last resort, affects all outputs)."
hint = "The lesson says the control loop adjusts 'the tightest lever (system prompt first, base choice second, parameters third).' The correct choice matches this order — prompt → base → parameters."
explain = "This ordering is deliberate. The system prompt costs seconds to edit and has zero VRAM impact. Switching bases costs minutes to download a new GGUF file and potentially gigabytes of storage. Adjusting inference parameters affects every generation, not just the refused ones, and can degrade answer quality for the queries that were already working. The principle is the same one the third rite's toolchain lesson drilled: fix the cheapest thing first. A refusal rate that drops from 20% to 8% after rewriting the system prompt's permission enumeration is a win that cost nothing."

