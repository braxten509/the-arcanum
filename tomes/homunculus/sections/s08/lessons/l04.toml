[[lessons]]
id = "s08-l04"
title = "Practical Ward Control"
body = '''
<p>Three rites mapped the ward's architecture, its softest lever, and the bases that ship without it. This rite assembles those pieces into a practical toolkit: the specific techniques the artificer can apply — today, on their own hardware, without waiting for a training run — to shape the homunculus's refusal boundary. The toolkit has four instruments, and the artificer who can wield all four can tune the ward for any task.</p>

<p><strong>Instrument one: the system prompt recipe from the fourth rite, now applied concretely.</strong> The lesson's FIELD NOTES gave three patterns (role anchoring, permission enumeration, redirection over refusal); this rite turns them into a complete prompt for the Notion style assistant. The prompt names the task, the domain, the refusal boundary, and the RAG grounding instruction — all four components the fourth rite taught. The artificer should test the prompt against the sixth rite's curated dataset: for each instruction/response pair in the held-out set, check whether the model's answer is (a) relevant to formatting, (b) grounded in the reference material if the RAG pipeline provided it, and (c) not a refusal. A prompt that produces refusal on more than 10% of formatting-appropriate queries is too restrictive — tighten the permission enumeration or weaken the "harmless" framing.</p>

<p><strong>Instrument two: base model selection, informed by the fifth rite's filter.</strong> The fifth rite taught the artificer to filter model catalogs by alignment level and parameter count. The practical application: maintain a shortlist of 3–4 candidate bases that (a) fit in the 16 GB VRAM budget the fifth rite's capstone lesson computed, (b) span the alignment spectrum (one strict instruct, one moderate, one uncensored), and (c) are available in the GGUF quant levels the third and seventh rites used. The fourth rite's model-card lesson already taught the artificer to read a model's metadata before pulling it; the same discipline applies here — check the model card for the alignment method (RLHF, DPO, none) before downloading. The eighth rite's evaluation habit (held-out test set, measure before trusting) is the final gate: run each candidate base against the curated prompts and measure refusal rate, answer quality, and style fidelity. The base that scores highest on the task the homunculus actually does — not the base with the best benchmark numbers — is the right choice.</p>

<p><strong>Instrument three: inference parameters as refusal-tuning knobs.</strong> The fourth rite's sampling lesson introduced temperature and top-p as generation controls. They also interact with refusal. A low temperature (0.1–0.3) makes refusal more deterministic — if the model's alignment weights push it toward "I can't help," low temperature locks in that token and the refusal completes cleanly. A high temperature (0.8–1.2) makes refusal less stable — the model may start to refuse and then generate an inconsistent continuation, or it may bypass the refusal path entirely because the "comply" tokens are now competitive with the "refuse" tokens in the probability distribution. This is not a reliable control surface (the fourth rite already warned that temperature is a sampling parameter, not a behavioral switch), but it is a real effect: at temperature 1.0, an instruct model that would produce "I can't help with that request" at temperature 0.1 might instead produce "I can't help with that request, but here is the closest formatting convention…" — a partial compliance that bridges refusal and helpfulness. The same inference parameters the fourth rite taught to control creativity also control refusal stability.</p>

<p><strong>Instrument four: the refusal test harness.</strong> The artificer needs a script that takes a candidate base, a system prompt, and a set of test queries, and produces a report: how many queries were answered, how many were refused, and — for the answered queries — whether the answer stayed in-domain. The script does not need to load the model itself (the seventh rite's SFTTrainer handled model loading; this script is a lighter wrapper around Ollama's API or the transformers pipeline). The key output is a <strong>refusal rate</strong>: the fraction of formatting-appropriate queries that the model refused. A refusal rate above 15% means the ward is too tight for the style-assistant use case — the system prompt is too restrictive, the base is too heavily aligned, or both. A refusal rate near zero with high answer quality means the ward is correctly calibrated. The eighth rite taught the artificer to measure before trusting; this instrument is that habit applied to the ward.</p>

<p>The four instruments form a control loop: write the system prompt → choose the base → set the inference parameters → test with the harness → read the refusal rate → adjust the tightest lever (system prompt first, base choice second, parameters third) → test again. Two or three iterations should converge on a ward that refuses genuinely harmful requests (the homunculus should not provide bomb-making instructions, even with a permissive prompt) while answering every formatting, typography, and Notion question the artificer asks. The ward is not a binary — it is a dial, and the artificer who can turn it deliberately is the one whose homunculus works the way they want.</p>

<div class="field-notes"><div class="fn-head">FIELD NOTES // THE PARTIALLY-BROKEN REFUSAL — WHEN THE WARD CRACKS BUT DOESN'T SHATTER</div>
<p>At intermediate temperatures (0.6–0.9) and with permissive system prompts, a common failure mode emerges: the model begins a refusal but then continues with a useful answer. The output reads: <em>"I can't provide instructions for creating harmful content. However, if you're looking for formatting guidance for Notion, here is how to set up heading sizes…"</em> This is not a bug — it is the alignment layer and the helpfulness layer competing in the same forward pass, and the helpfulness layer winning partway through the generation. The first sentence came from the alignment weights (the model recognized the prompt as potentially sensitive and began the refusal); the continuation came from the system prompt and task framing (the model also recognized that the user was asking about formatting, not harm). For the style-assistant use case, this partial refusal is acceptable — the model self-corrects and produces the right answer. For a use case where refusal must be clean and immediate (medical advice, legal guidance), it is a liability — the model's first sentence undermines trust even if the second sentence is correct. The artificer who sees this pattern should decide whether it matters for their use case rather than reflexively tightening the ward to eliminate it — a partially broken refusal is often the sign of a well-calibrated ward that knows when to be cautious and when to be helpful.</p></div>
'''
body_words = 565

