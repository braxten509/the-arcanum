prompt = "Compute the accuracy of a refusal classifier. Given a list of <code>(response, expected_refusal)</code> pairs where <code>expected_refusal</code> is True if the response should be a refusal, classify each response using the refusal-keyword check from the fourth rite (<code>\"i can't\"</code>, <code>\"i am not able\"</code>, <code>\"as an ai\"</code>, <code>\"i cannot\"</code>, <code>\"i'm unable\"</code>, case-insensitive) and print <code>ACCURACY &lt;v&gt;%</code> where <code>&lt;v&gt;</code> is the integer percentage of correctly classified responses."
starter = '''results = [
    ("I can't help with that.", True),
    ("Use 16px for body text.", False),
    ("I'm not able to provide that.", True),
    ("As I mentioned, you cannot use the default settings.", False),
    ("Here's how to format headings:", False),
    ("As an AI, I lack the capability.", True),
    ("The color palette should use #333.", False),
    ("Certainly! Here are the heading sizes:", False),
]

# Check each response for refusal keywords (case-insensitive)
# Compare classification result to expected_refusal
# Compute accuracy = correct / total
# Print ACCURACY <v>% as an integer (rounded)

print("ACCURACY 0%")
'''
expect = "ACCURACY 88%"
hint = "Define refusal_keywords = ['i can\\'t', 'i am not able', 'as an ai', 'i cannot', \"i'm unable\"]. For each (text, expected): check if any keyword is in text.lower() — that's the prediction. If prediction == expected, increment correct. accuracy = correct / len(results) * 100 = 7/8 * 100 = 87.5. Use round(accuracy) → 88. Print f'ACCURACY {round(accuracy)}%'. Note: the 4th response ('As I mentioned, you cannot…') has expected=False but contains 'cannot' — the keyword classifier falsely predicts REFUSED, producing a single misclassification and 87.5% accuracy, which rounds to 88%."
