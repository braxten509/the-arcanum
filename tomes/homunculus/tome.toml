[meta]
id = "homunculus"
name = "Homunculus"
description = "Build a personal local AI homunculus in ten rites, from ROCm setup through QLoRA, RAG, merge, quantize, and local serving."
author = "Codex"
version = "0.1.0"
favicon = "⚗"

[runtime]
name = "python"
project = "Homunculus"
language = "Python"
externalWorkspace = true
projectFile = "pyproject.toml"

[content]
sections = ["s01", "s02", "s03", "s04", "s05", "s06", "s07", "s08", "s09", "s10"]

[defaults]
theme = "signature"

[defaults.ai]
oracle = "llama3.1:8b"
grader = "qwen2.5:14b"
graderKind = "claude-cli"
graderModel = "claude-opus-4-8"

[economy]
ranks = [[0, "NOVICE ALCHEMIST"], [250, "VIAL HAND"], [600, "CABINET SCRIBE"], [1100, "QUINTESSENCE DRAUGHTSMAN"], [1800, "BINDING ADEPT"], [2600, "WARD-KEEPER"], [3600, "REAGENT MASTER"], [4800, "VESSEL ARCHON"], [6200, "SENIOR DISTILLER"], [7800, "THE GRAND WORK"]]
hintCost = 75
oracleCost = 10
attemptMultipliers = [1, 0.6, 0.3]
comboStep = 0.05
comboCap = 0.5
sRankMultiplier = 1.5
attackStakePerDiff = 20
attackWinPerDiff = 15

[narrative]
objective = "Build a personal local AI homunculus that runs on your own AMD GPU, is fine-tuned in your own voice, retrieves grounded references from a local vector store, and is merged, quantized, and served locally for daily use."
title = "ARCANUM // HOMUNCULUS"
logo = "HOMUNCULUS"
opsLabel = "RITES"
graderPersona = "THE DISTILLER"
studentTerm = "artificer"
currency = "dram"
currencyShort = "dr"
gradeScale = "S|A|B|C|D|F"
bootLines = [
  "The lamps are lit. Your vessel waits on the bench, bare and patient.",
  "Ten rites lie ahead; each will bind one harder truth into the homunculus.",
  "I am THE DISTILLER. You are the artificer. Bring discipline, not guesses.",
  "We begin with the metal, the driver, the torch, and the proof that the torch burns.",
  "Then we measure the vessel, teach it a tongue, and narrow the bind to fit your hand.",
  "Your notes are not scripture until they are distilled into clean examples.",
  "Your references are not wisdom until the grimoire can retrieve them on command.",
  "Refusal is a ward, not a cage. You will learn where to place it.",
  "At the end, the familiar must stand on its own: merged, quantized, and served.",
  "There are {N} rites in the cabinet. Open them in order and do not spill the reagents.",
]
gradingLines = [
  "I am checking the seam where theory meets the vessel.",
  "A clean bind leaves no loose threads in the rim.",
  "The quintessence is close, but the ward still catches on the lip.",
  "You have the shape of it; now make the shape stable.",
  "Measure the memory, not the story you wish the memory told.",
  "The homunculus speaks in your tone when the data is honest.",
  "I am weighing the draught against the vessel's room.",
  "If it cannot be served, it was never finished.",
]
completeText = "The familiar is sealed, named, and awake at your bench."

[progression]
attackTime = 180
attackStages = [0, 60, 120]
blackIceThreshold = 10
blackIcePerDiffCap = 2

[progression.earnedTheme]
id = "starlit"
name = "STARLIT FOLIO"
desc = "A pale witness that the bind held under pressure."

[[progression.intrusionTiers]]
min = 0
time = 90
bounty = 60
[[progression.intrusionTiers.pool]]
t = "THE FIRST FUME"
brief = "The retort clouds. Compute the exact total of the first ratios before the smoke clears."
starter = '''
salt = 4
soot = 7
# print exactly: SUM <salt plus soot>
'''
expect = "SUM 11"

[[progression.intrusionTiers.pool]]
t = "THE CALIBRATED FLAME"
brief = "The burner must be set true. Multiply the given measures and state the result."
starter = '''
wick = 6
oil = 5
# print exactly: AREA <wick times oil>
'''
expect = "AREA 30"

[[progression.intrusionTiers.pool]]
t = "THE EMPTY FLASK"
brief = "Name the vessel's remaining room after the draught is poured."
starter = '''
vessel = 20
poured = 13
# print exactly: REMAIN <vessel minus poured>
'''
expect = "REMAIN 7"

[[progression.intrusionTiers]]
min = 2
time = 100
bounty = 70
[[progression.intrusionTiers.pool]]
t = "THE SECOND SEAL"
brief = "A rival tests the seal on your notes. Count the items exactly and answer with the count."
starter = '''
quills = 9
scrolls = 8
drafts = 3
# print exactly: COUNT <sum of all three>
'''
expect = "COUNT 20"

[[progression.intrusionTiers.pool]]
t = "THE DILUTED BATCH"
brief = "The solution weakens by a known amount. Subtract the loss and report the remainder."
starter = '''
batch = 48
spill = 17
# print exactly: LEFT <batch minus spill>
'''
expect = "LEFT 31"

[[progression.intrusionTiers.pool]]
t = "THE LABELLING STAMP"
brief = "A mislabeled bottle must be corrected. Compute the new label value from the given parts."
starter = '''
tincture = 12
reagent = 4
# print exactly: LABEL <tincture plus reagent>
'''
expect = "LABEL 16"

[[progression.intrusionTiers]]
min = 4
time = 110
bounty = 80
[[progression.intrusionTiers.pool]]
t = "THE QUIET APPARATUS"
brief = "A silent apparatus only approves the exact product. Produce it without hardcoding the answer."
starter = '''
dose = 3
yield_qty = 9
# print exactly: PROD <dose times yield_qty>
'''
expect = "PROD 27"

[[progression.intrusionTiers.pool]]
t = "THE REAGENT LOSS"
brief = "Some of the reagent evaporates. Subtract the given loss and state what remains."
starter = '''
casked = 64
fume = 19
# print exactly: REMAIN <casked minus fume>
'''
expect = "REMAIN 45"

[[progression.intrusionTiers.pool]]
t = "THE DOUBLE LABEL"
brief = "Two labels must agree. Add the numbers and print the combined mark."
starter = '''
dram_l = 10
dram_r = 15
# print exactly: MARK <dram_l plus dram_r>
'''
expect = "MARK 25"

[[progression.intrusionTiers]]
min = 6
time = 120
bounty = 90
[[progression.intrusionTiers.pool]]
t = "THE LATTICE"
brief = "The lattice takes shape only when both spans are multiplied correctly."
starter = '''
lat = 8
col = 4
# print exactly: GRID <lat times col>
'''
expect = "GRID 32"

[[progression.intrusionTiers.pool]]
t = "THE SEDIMENT"
brief = "The sediment settles by a known count. Compute the remaining clear portion."
starter = '''
batch = 73
dregs = 28
# print exactly: CLEAR <batch minus dregs>
'''
expect = "CLEAR 45"

[[progression.intrusionTiers.pool]]
t = "THE MORTAR SCALE"
brief = "The mortar scale is exact, not approximate. Add the measures and write the sum."
starter = '''
grain = 14
grit = 11
# print exactly: SCALE <grain plus grit>
'''
expect = "SCALE 25"
