[[challenge]]
tier = 4
title = "THE PARAMETER COUNT"
starter = '''
modules = 4
rank = 8
dim = 4096
# Calculate the low-rank delta parameters.
'''
briefs = [
    "Calculate parameters per module (2 * rank * dim). Print exactly: «PER_MODULE 65536»",
    "Calculate total adapter parameters. Append: «TOTAL 262144»",
    "State the megabytes (2 bytes per param). Append: «SIZE 0.52 MB»"
]
solution = '''
modules = 4
rank = 8
dim = 4096
per = 2 * rank * dim
print(f"PER_MODULE {per}")
total = per * modules
print(f"TOTAL {total}")
mb = (total * 2) / 1000000.0
print(f"SIZE {mb:.2f} MB")
'''
cuts = [1, 2, 3]


[[challenge]]
tier = 5
title = "THE ORTHOGONAL WARD"
starter = '''
vec_a = [1, 0]
vec_b = [0, 1]
# A rival challenges the similarity of two thoughts.
'''
briefs = [
    "Calculate the dot product. Print exactly: «DOT 0»",
    "Since both are normalized, dot product is cosine similarity. Append: «COSINE 0»",
    "Are they orthogonal? Append: «ORTHOGONAL True»"
]
solution = '''
vec_a = [1, 0]
vec_b = [0, 1]
dot = vec_a[0]*vec_b[0] + vec_a[1]*vec_b[1]
print(f"DOT {dot}")
print(f"COSINE {dot}")
print(f"ORTHOGONAL {dot == 0}")
'''
cuts = [1, 2, 3]

