[[challenge]]
tier = 5
title = "THE PRECISION RITE"
starter = '''
retrieved = ["A", "B", "C", "D"]
relevant = ["B", "E"]
# Measure the truth in the grimoire's return.
'''
briefs = [
    "Count the retrieved items. Print exactly: «RETRIEVED 4»",
    "Count the relevant items in the retrieved set. Append: «MATCHES 1»",
    "Calculate Precision@4 (Matches / Retrieved). Append: «PRECISION 0.25»"
]
solution = '''
retrieved = ["A", "B", "C", "D"]
relevant = ["B", "E"]
print(f"RETRIEVED {len(retrieved)}")
matches = sum(1 for r in retrieved if r in relevant)
print(f"MATCHES {matches}")
print(f"PRECISION {matches / len(retrieved)}")
'''
cuts = [1, 2, 3]


