[[tiers]]
min = 1
time = 90
bounty = 60

[[tiers.pool]]
t = "THE TRUE TARGET"
brief = "Build the real RDNA4 architecture code from its parts. Print EXACTLY: «TARGET gfx1201»."
starter = '''prefix = "gfx"
family = 12
revision = 1
'''
expect = "TARGET gfx1201"
solution = '''prefix = "gfx"
family = 12
revision = 1
target = f"{prefix}{family:02d}0{revision}"
print(f"TARGET {target}")
'''

[[tiers.pool]]
t = "THE MEMORY THIEF"
brief = "A process claims 3 GB of the 16 GB card. Compute what remains. Print EXACTLY: «REMAINING 13 GB»."
starter = '''total_vram = 16
claimed_vram = 3
'''
expect = "REMAINING 13 GB"
solution = '''total_vram = 16
claimed_vram = 3
remaining = total_vram - claimed_vram
print(f"REMAINING {remaining} GB")
'''

[[tiers.pool]]
t = "THE PROJECT ROOT"
brief = "Join the host folder name from two variables. Print EXACTLY: «PROJECT Homunculus»."
starter = '''label = "Homun"
ending = "culus"
'''
expect = "PROJECT Homunculus"
solution = '''label = "Homun"
ending = "culus"
print(f"PROJECT {label + ending}")
'''

[[tiers.pool]]
t = "THE PINNED STACK"
brief = "Count the pinned libraries in the list. Print EXACTLY: «PACKAGES 4»."
starter = '''packages = ["transformers", "trl", "peft", "bitsandbytes"]
'''
expect = "PACKAGES 4"
solution = '''packages = ["transformers", "trl", "peft", "bitsandbytes"]
print(f"PACKAGES {len(packages)}")
'''

[[tiers.pool]]
t = "THE FAILED DOCTOR"
brief = "Collect checks whose value is false. Print EXACTLY: «FAILED ollama»."
starter = '''checks = {"rocm": True, "torch": True, "ollama": False}
'''
expect = "FAILED ollama"
solution = '''checks = {"rocm": True, "torch": True, "ollama": False}
failed = [name for name, passed in checks.items() if not passed]
print(f"FAILED {', '.join(failed)}")
'''

