[[tiers.pool]]
t = "THE ADAPTER FOOTPRINT"
brief = "Compute the 43,646,976-parameter rank-16 all-linear adapter at 12 bytes each, rounded to decimal MB. Print EXACTLY: «ADAPTER 524 MB»."
starter = '''adapter_params = 43_646_976
bytes_per_param = 12
'''
expect = "ADAPTER 524 MB"
solution = '''adapter_params = 43_646_976
bytes_per_param = 12
mb = round(adapter_params * bytes_per_param / 1_000_000)
print(f"ADAPTER {mb} MB")
'''

[[tiers.pool]]
t = "THE HEADROOM WARD"
brief = "Decide whether 13.8 GB peak leaves at least 1 GB on a 16 GB card. Print EXACTLY: «HEADROOM PASS»."
starter = '''capacity_gb = 16.0
peak_gb = 13.8
required_gb = 1.0
'''
expect = "HEADROOM PASS"
solution = '''capacity_gb = 16.0
peak_gb = 13.8
required_gb = 1.0
status = "PASS" if capacity_gb - peak_gb >= required_gb else "FAIL"
print(f"HEADROOM {status}")
'''

