[[tiers.pool]]
t = "THE REGRESSION COUNT"
brief = "Count newly failed cases whose base result passed. Print EXACTLY: «REGRESSIONS 1»."
starter = '''cases = [(True, True), (True, False), (False, False)]
'''
expect = "REGRESSIONS 1"
solution = '''cases = [(True, True), (True, False), (False, False)]
regressions = sum(1 for base_pass, adapter_pass in cases if base_pass and not adapter_pass)
print(f"REGRESSIONS {regressions}")
'''

