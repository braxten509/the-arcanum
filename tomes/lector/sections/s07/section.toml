# Section s07 — INSCRIPTION VII // THE BINDING
id = "s07"
codename = "INSCRIPTION VII // THE BINDING"
short = "The Binding"
title = "The Binding"
build = "Lector parses templates into a polymorphic AST: TextNode, VarNode, ForNode, IfNode, IncludeNode, owned by std::unique_ptr<Node>. Teaches classes, inheritance, virtual functions, vtables, abstract base classes, override/final, slicing."
brief = "<p>A sigil has shape. Some sigils are plain text, some bind variables, some loop. Inheritance gives each its own form under one abstract contract. Virtual tables dispatch the right behaviour at runtime. You will build Lector's AST — a family of nodes that share a base and differ in kind.</p>"
