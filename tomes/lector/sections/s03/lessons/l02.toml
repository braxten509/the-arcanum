[[lessons]]
id = "s03-l02"
title = "Unique Grip"
body = '''
<p><code>std::unique_ptr</code> owns an object exclusively. No copy. One owner at all times. When the owner leaves scope, the object is destroyed. Automatically. No <code>delete</code> call needed.</p>
<p><code>std::unique_ptr&lt;int&gt; p = std::make_unique&lt;int&gt;(42);</code> — allocate an int on the heap. <code>make_unique</code> does two things: it calls <code>new</code> internally and it wraps the result in a unique_ptr. You never write <code>new</code> yourself when using smart pointers. This is the modern way.</p>
<p>When <code>p</code> goes out of scope, its destructor calls <code>delete</code> on the owned pointer. This is RAII — Resource Acquisition Is Initialisation. The resource is acquired in the constructor and released in the destructor. The C++ scope system becomes the memory management system.</p>
<p>You cannot copy a <code>unique_ptr</code>. Copying would mean two pointers managing the same object — both would try to delete it. That is undefined behavior. But you can <em>move</em> ownership. <code>std::unique_ptr&lt;int&gt; q = std::move(p);</code> — <code>q</code> now owns the int. <code>p</code> is now <code>nullptr</code>. The transfer is explicit and leaves the source empty.</p>
<p>Use <code>.get()</code> to retrieve the raw pointer without transferring ownership. Use <code>.reset()</code> to replace the managed object (the old one is deleted). Use <code>.release()</code> to give up ownership without deleting — you get the raw pointer and the unique_ptr becomes null. You are then responsible for <code>delete</code>.</p>
<p>Prefer <code>std::unique_ptr</code> as the default smart pointer. It has zero overhead over a raw pointer — the same size, the same speed. The safety comes from compile-time rules (no copy) and the destructor. This is what ownership looks like in C++. One owner. Explicit transfer. Automatic cleanup.</p>
<div class="field-notes"><div class="fn-head">FIELD NOTES // Custom Deleters</div>
<p><code>std::unique_ptr</code> accepts a custom deleter as a second template argument. Useful for resources that are not freed with <code>delete</code> — file handles closed with <code>fclose</code>, sockets closed with <code>close</code>. The deleter is part of the type, so two unique_ptrs with different deleters are different types. This is why <code>std::unique_ptr</code> has zero overhead — the deleter information is stored in the type, not in runtime data.</p></div>
'''

[[lessons.exercises]]
id = "s03-l02-e1"
type = "mc"
points = 22
prompt = "Why can a <code>std::unique_ptr</code> not be copied?"
choices = [
    "The compiler lacks a copy constructor for template types — <code>std::unique_ptr</code> predates C++11 copy semantics",
    "Copying would create two owners — both would call <code>delete</code> on the same object, causing undefined behavior",
    "The standard forbids all pointer-like types from being copied for memory safety",
    "Copying is allowed but deprecated — it still compiles with a compiler warning"
]
answer = 1
whyWrong = "<code>std::unique_ptr</code> has its copy constructor explicitly deleted in the standard library. This is by design — two owners means double-delete. Without the copy being deleted, the compiler would generate one that does a shallow pointer copy, which is exactly the bug unique_ptr exists to prevent."
hint = "What happens when two <code>unique_ptr</code> wrappers both try to free the same heap address when they go out of scope?"
explain = "<code>std::unique_ptr</code> enforces exclusive ownership by deleting its copy constructor and copy assignment. Only move operations are allowed. When you <code>std::move</code> a unique_ptr, the source becomes null and the destination becomes the sole owner."

[[lessons.exercises]]
id = "s03-l02-d1"
type = "type"
points = 12
reps = 2
prompt = "Retype this code showing a unique_ptr being created, moved, and going out of scope. Note that <code>p</code> becomes null after the move."
code = '''auto p = std::make_unique<int>(42);
auto q = std::move(p);
if (!p) std::cout << *q << std::endl;'''

[[lessons.exercises]]
id = "s03-l02-e3"
type = "mc"
points = 22
prompt = "How do you transfer ownership of a <code>std::unique_ptr</code> from one variable to another?"
choices = [
    "Assign it directly — <code>q = p;</code> — the compiler handles ownership transfer automatically",
    "Call <code>p.transfer_to(q)</code> — a member function designed for ownership handoff",
    "Use <code>std::move(p)</code> in the assignment — <code>q = std::move(p);</code> — which transfers the pointer and nulls <code>p</code>",
    "Call <code>p.release()</code> and store the result in <code>q</code> — the raw pointer can then be wrapped in a new unique_ptr"
]
answer = 2
whyWrong = "Direct assignment does not compile — the copy assignment is deleted. <code>release()</code> does give you the raw pointer, but <code>std::move</code> is the canonical way. <code>release()</code> is for interfacing with raw-pointer APIs, not for ownership transfer between smart pointers."
hint = "There is a standard library function that converts an lvalue into an rvalue reference, enabling the move constructor. The function's name describes relocation."
explain = "<code>std::move</code> casts <code>p</code> to an rvalue reference, which binds to the unique_ptr's move assignment operator. After the call, <code>p</code> is null and <code>q</code> owns the int. This is the only way to change owners — and it makes the transfer visible in the source."

[[lessons.exercises]]
id = "s03-l02-w1"
type = "write"
points = 32
prompt = "Write a program that creates a <code>std::unique_ptr&lt;std::string&gt;</code> using <code>std::make_unique</code>, initialised to <code>&quot;Lector tokenizing&quot;</code>. Transfer ownership via <code>std::move</code> to a second unique_ptr. Then print the string through the second pointer. Finally, create a third unique_ptr that takes ownership back from the second using <code>std::move</code> again, and print the length of the string (use <code>->length()</code>). The starter provides includes and the initial variable."
starter = '''#include <iostream>
#include <memory>
#include <string>

int main() {
    auto p = std::make_unique<std::string>("Lector tokenizing");
    // TODO: move p to q, print *q
    // then move q to r, print r->length()
    return 0;
}'''
expect = '''Lector tokenizing
18'''
hint = "Use <code>auto q = std::move(p);</code> and then <code>auto r = std::move(q);</code>. Print with <code>std::cout &lt;&lt; *r &lt;&lt; std::endl;</code> and <code>std::cout &lt;&lt; r-&gt;length() &lt;&lt; std::endl;</code>. After each move, the source becomes null — but you do not need to check it here."
