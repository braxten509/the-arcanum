[[lessons]]
id = "s03-l04"
title = "The Guard Inscription"
body = '''
<p>RAII stands for Resource Acquisition Is Initialisation. The name is unfortunate. The idea is simple: bind a resource's lifetime to a scope. Acquire in the constructor. Release in the destructor. The C++ scope system becomes your resource manager.</p>
<p><code>std::unique_ptr</code> and <code>std::shared_ptr</code> are RAII wrappers for heap memory. But the pattern applies to any resource: file handles, sockets, mutex locks, database connections.</p>
<p>Consider a file. <code>std::ifstream file("data.post");</code> — the constructor opens the file. When <code>file</code> goes out of scope, the destructor closes it. No <code>file.close()</code> call needed. No forgotten close in an error path. The destructor runs during stack unwinding even if an exception is thrown.</p>
<p>This is the key insight. In C, every <code>fopen</code> must be paired with <code>fclose</code> and every early return must remember to close. Miss one and the resource leaks. In C++, the destructor runs automatically. <code>new</code> without <code>delete</code> is a leak. <code>make_unique</code> without <code>delete</code> is correct — the destructor handles it.</p>
<p>Write RAII classes for your own resources. The pattern: a constructor that acquires the resource, a destructor that releases it, deleted copy operations (or implemented move operations). No raw new or delete in application code.</p>
<p>Lector's tokenizer will parse <code>{{ ... }}</code> blocks from post files. Each token is a heap-allocated string — exactly the kind of resource RAII manages best. The pointer in <code>this</code> from inscription II is a raw pointer to the current object; RAII wraps such raw pointers in scope-bound owners that cannot be forgotten.</p>
<p>The rule is simple: if you wrote <code>new</code>, you wrote a bug waiting to happen. If you wrote <code>make_unique</code> or <code>make_shared</code>, the compiler and the destructor handle the rest. RAII is not an optimisation. It is the mechanism by which C++ makes resource safety automatic.</p>
<div class="field-notes"><div class="fn-head">FIELD NOTES // The Rule of Five</div>
<p>A class that manages a resource typically needs a custom destructor, copy constructor, copy assignment, move constructor, and move assignment. This is the Rule of Five. If you define or =default any of them, consider all five. <code>std::unique_ptr</code> already implements the Rule of Five for heap memory — which is why you use it instead of writing your own. We return to this in inscription VIII.</p></div>
'''

[[lessons.exercises]]
id = "s03-l04-e1"
type = "mc"
points = 20
prompt = "What does RAII stand for?"
choices = [
    "Rapid Allocation Inline Integration — a compile-time optimisation for small objects",
    "Resource Acquisition Is Initialisation — binding resource lifetime to object lifetime",
    "Random Access Iterator Initialisation — a pattern for container traversal",
    "Runtime Allocation Integrity Inspection — a debug-mode heap checker"
]
answer = 1
whyWrong = "RAII is not about optimisation, iteration, or debugging. It is a design pattern where resource acquisition happens in the constructor and release happens in the destructor. The 'resource' can be memory, file handles, locks, or any scarce system resource."
hint = "Break the acronym down letter by letter. The first 'R' is not 'Rapid'. It is 'Resource'."
explain = "Resource Acquisition Is Initialisation: you acquire the resource (memory, file handle, lock) when the object is constructed, and you release it when the object is destroyed. The C++ destructor guarantees cleanup regardless of how the scope is exited."

[[lessons.exercises]]
id = "s03-l04-e2"
type = "text"
points = 20
prompt = "Why does RAII guarantee that a resource is freed even when a function exits early (for example, via an early <code>return</code> or an exception)?"
answer = "destructors run on scope exit"
accept = [
    "destructors run automatically",
    "destructors are called during stack unwinding",
    "the destructor runs when the object leaves scope",
    "destructors are called automatically",
    "stack unwinding calls destructors",
    "c++ destroys local objects when leaving scope regardless of how",
    "the destructor is called when the object goes out of scope"
]
hint = "Think about what happens when any scope ends in C++ — whether through normal flow, an early return, or an exception. What runs for every local object?"
explain = "C++ guarantees that destructors of local variables run when the scope exits, regardless of the exit path — normal flow, <code>return</code>, or exception (stack unwinding). This is the fundamental guarantee that makes RAII work for resource management."

[[lessons.exercises]]
id = "s03-l04-e3"
type = "fill"
points = 20
prompt = "Complete the RAII wrapper class for a hypothetical <code>TokenStream</code>. The constructor acquires the resource and the destructor releases it."
code = '''class TokenStream {
    int* buffer_;
public:
    TokenStream(int size) : buffer_(new int[size]) {}
    ____ ~TokenStream() { delete[] buffer_; }
};'''
answer = "~TokenStream"
accept = ["~TokenStream()"]
hint = "The special member function that runs when an object is destroyed. Its name starts with a tilde followed by the class name."
explain = "The destructor (<code>~TokenStream()</code>) is called automatically when a <code>TokenStream</code> object leaves scope. It releases the resource (<code>delete[] buffer_</code>). This is the RAII pattern: constructor acquires, destructor releases."

[[lessons.exercises]]
id = "s03-l04-d1"
type = "type"
points = 12
reps = 2
prompt = "Retype this RAII usage. The file opens in the constructor and closes in the destructor — no manual cleanup needed."
code = '''std::ifstream file("data.post");
std::string line;
while (std::getline(file, line)) {
    std::cout << line << std::endl;
}'''

[[lessons.exercises]]
id = "s03-l04-e5"
type = "mc"
points = 20
prompt = "What happens to the managed object when a <code>std::unique_ptr</code> goes out of scope?"
choices = [
    "The object is leaked — the programmer must call <code>.reset()</code> before scope exit to trigger cleanup",
    "The object is moved to a global pool — the program reuses it if another unique_ptr is created with the same type",
    "The destructor calls <code>delete</code> on the managed pointer — the object is freed automatically",
    "The compiler emits a warning — the programmer is expected to manually pair every unique_ptr with a <code>delete</code> call"
]
answer = 2
whyWrong = "The entire point of <code>unique_ptr</code> is that cleanup is automatic. Its destructor calls <code>delete</code> on the owned pointer. No manual step is needed — that is the RAII contract. A leak only happens if you use <code>.release()</code> and forget to store the result in another RAII wrapper."
hint = "Consider what the destructor of <code>std::unique_ptr</code> does. It has one job — what operation happens inside it?"
explain = "<code>std::unique_ptr</code>'s destructor calls <code>delete</code> on the owned pointer. This is RAII in action: the resource (heap memory) is acquired when the unique_ptr is constructed and released when it is destroyed. No explicit cleanup call needed."

[[lessons.exercises]]
id = "s03-l04-w1"
type = "write"
points = 32
prompt = "Write a function <code>make_token</code> that takes a <code>const std::string&amp;</code> parameter and returns a <code>std::unique_ptr&lt;std::string&gt;</code> containing the string wrapped in brackets like <code>&quot;{{ content }}&quot;</code>. In <code>main</code>, read a single line from <code>std::cin</code> into a string using <code>std::getline</code> (this uses RAII — <code>std::cin</code> is managed for you). Pass it to <code>make_token</code> and print the returned string through the unique_ptr. The starter includes the needed headers and <code>main</code> scaffold."
starter = '''#include <iostream>
#include <memory>
#include <string>

// TODO: write make_token(const std::string& raw)
// Returns unique_ptr<string> containing "{{ raw }}"

int main() {
    // TODO: read one line from std::cin into a string
    // TODO: pass it to make_token and print the result
    return 0;
}'''
expect = "{{ hello }}"
stdin = '''hello'''
hint = "Write <code>auto make_token(const std::string&amp; raw) -> std::unique_ptr&lt;std::string&gt; { return std::make_unique&lt;std::string&gt;(\"{{\" + raw + \" }}\"); }</code>. In main, <code>std::string line; std::getline(std::cin, line);</code> then <code>auto t = make_token(line); std::cout &lt;&lt; *t &lt;&lt; std::endl;</code>."
