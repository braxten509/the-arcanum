[[lessons]]
id = "s03-l01"
title = "The Heap"
body = '''
<p>Two memory regions matter. The stack and the heap.</p>
<p>The stack is a last-in-first-out ledger. Every function call pushes a frame. Local variables live in that frame. When the function returns, the frame pops. Clean. Automatic. Fast. The stack is the default — <code>int x = 42;</code> goes there. The stack cannot grow. Overflow it (deep recursion, a huge local array) and the program crashes.</p>
<p>The heap is a pool. The quill asks for a chunk at runtime. The heap finds space and returns an address. That address is a pointer — you already know those from inscription II. The heap does not clean itself. You asked for it. You return it.</p>
<p><code>new</code> allocates on the heap. <code>int* p = new int(42);</code> — allocates one int, initialised to 42, returns its address. <code>delete</code> frees it. <code>delete p;</code> — returns the memory to the pool. Every <code>new</code> must have a matching <code>delete</code>. Forget one and the memory leaks — the heap never gets it back for the rest of the program.</p>
<p><code>new[]</code> allocates an array. <code>int* arr = new int[10];</code> — ten ints in one heap block. Free with <code>delete[] arr;</code>. Mix <code>new</code> with <code>delete[]</code> and the behavior is undefined. The quill does not check. It just corrupts its own bookkeeping.</p>
<p>The problems with raw <code>new</code>/<code>delete</code> are three. First: leaks — a forgotten <code>delete</code> in an error path. Second: double-delete — two <code>delete</code> calls on the same pointer corrupts the heap. Third: dangling pointers — after <code>delete</code>, the pointer still holds the old address. Dereferencing it is undefined behavior. C++ has better tools. They are the subject of this inscription.</p>
<div class="field-notes"><div class="fn-head">FIELD NOTES // Placement New</div>
<p><code>new (ptr) T(args)</code> constructs an object at a pre-allocated address — no heap allocation happens. It is used in custom allocators and embedded systems. The matching call is not <code>delete</code> but an explicit destructor call (<code>ptr->~T()</code>). You will rarely write it. Know that it exists so a raw <code>new</code> in unfamiliar code does not surprise you.</p></div>
'''

[[lessons.exercises]]
id = "s03-l01-d1"
type = "type"
points = 12
reps = 2
prompt = "Retype this allocation and deallocation pair. Notice the symmetry: <code>new</code> asks, <code>delete</code> returns."
code = '''int* p = new int(42);
std::cout << *p << std::endl;
delete p;'''

[[lessons.exercises]]
id = "s03-l01-e2"
type = "fill"
points = 20
prompt = "Complete the code so the heap allocation is freed correctly."
code = '''int* p = new int(10);
std::cout << *p << std::endl;
____'''
answer = "delete p;"
hint = "Every <code>new</code> using the syntax <code>new int(10)</code> (single object, not array) must be paired with a single-object deallocation. What keyword releases heap memory?"
explain = "<code>delete p;</code> calls the destructor on the int (trivial here) and frees the heap memory. After this call, <code>p</code> is a dangling pointer — do not dereference it again without reassigning it."

[[lessons.exercises]]
id = "s03-l01-e3"
type = "mc"
points = 20
prompt = "What does <code>new int(42)</code> return?"
choices = [
    "The value 42 — <code>new</code> returns the value stored at the allocated address",
    "A reference to the allocated int — <code>new</code> returns an <code>int&amp;</code>",
    "A pointer to the allocated int — <code>new</code> returns the address where the heap memory was allocated",
    "A boolean indicating success — <code>new</code> returns <code>true</code> on allocation, <code>false</code> on failure"
]
answer = 2
whyWrong = "<code>new</code> always returns a pointer to the allocated type. The value 42 is stored at that address — you get it by dereferencing the pointer with <code>*p</code>. <code>new</code> never returns a reference; it returns an address."
hint = "What does the variable that receives the result of <code>new int(42)</code> need to be declared as? What type must it have to hold the result?"
explain = "<code>new int(42)</code> allocates heap memory and returns the address of that memory as a pointer. <code>int* p = new int(42);</code> — <code>p</code> holds the address, <code>*p</code> holds the value 42."

[[lessons.exercises]]
id = "s03-l01-e4"
type = "text"
points = 20
prompt = "Name one problem that can occur when using raw <code>new</code> and <code>delete</code> without a smart pointer wrapper."
answer = "memory leak"
accept = [
    "forgetting to delete",
    "leak",
    "memory leak if delete is forgotten",
    "double delete",
    "double-free",
    "dangling pointer",
    "use after free",
    "forgetting to free the memory",
    "resource leak"
]
hint = "Think about what happens when a function allocates with <code>new</code> but the function returns early before reaching <code>delete</code>."
explain = "Manual memory management has three failure modes: forgetting to <code>delete</code> (leak — the memory is never returned), deleting twice (heap corruption), and using the pointer after deletion (dangling pointer — undefined behavior). Smart pointers solve all three."

[[lessons.exercises]]
id = "s03-l01-w1"
type = "write"
points = 30
prompt = "The starter gives you two ints <code>a</code> and <code>b</code>. Allocate an int on the heap, store the sum of <code>a</code> and <code>b</code> in it (dereference the pointer to write), print the value, then delete the allocation. Print only the number."
starter = '''#include <iostream>

int main() {
    int a = 12;
    int b = 30;
    // TODO: allocate an int on the heap
    // Store a + b in it (via dereference)
    // Print the value
    // Free the memory
    return 0;
}'''
expect = "42"
hint = "Write <code>int* p = new int;</code> to allocate. Then <code>*p = a + b;</code> to store the sum. <code>std::cout &lt;&lt; *p &lt;&lt; std::endl;</code> prints it. <code>delete p;</code> frees it."
