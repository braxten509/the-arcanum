[[lessons]]
id = "s03-l05"
title = "The Relocation"
body = '''
<p>Moving transfers ownership without copying. A <code>std::unique_ptr</code> cannot be copied, but it can be moved. The move transfers the underlying pointer from source to destination. The source becomes null. No heap allocation. No reference count change. One pointer value moves from one variable to another.</p>
<p><code>std::move</code> does not move anything. It is a cast — it converts an lvalue to an rvalue reference. The actual move happens in the move constructor or move assignment of the type. <code>std::move</code> simply enables that path to be chosen.</p>
<p>After a move, the source is in a valid but unspecified state. For <code>std::unique_ptr</code>, it is null — you can check it, reassign it, or destroy it. For <code>std::string</code>, it is empty (in practice), but the standard only guarantees it is valid. For your own types, document the moved-from state.</p>
<p>Moving is faster than copying for types that manage heap resources. Copying a <code>std::vector&lt;std::string&gt;</code> duplicates every element — O(n) allocations and <code>memcpy</code>s. Moving it copies three pointers (begin, end, capacity) — O(1). The source vector is left empty.</p>
<p>This is the first lifetime bug you will meet: use-after-move. Dereferencing a moved-from unique_ptr is null-pointer dereference. Using a moved-from vector assumes it still holds data. The quill does not warn you. The debugger shows a crash. The fix is to reorganise the code so the moved-from variable is not used until it is reassigned.</p>
<p>In Lector, tokens flow through the parser pipeline. A tokeniser produces a <code>std::unique_ptr&lt;std::string&gt;</code>. The parser takes ownership via <code>std::move</code>. The renderer takes ownership from the parser. At each step, one owner holds the token. The pointer arithmetic you learned in inscription II is how the raw addresses inside these wrappers behave — but the wrappers themselves enforce ownership, so you never worry about a double-free.</p>
<p>Do not move what you still need. After the move, the source gives no value. Plan the ownership chain before writing the code.</p>
<div class="field-notes"><div class="fn-head">FIELD NOTES // noexcept Move</div>
<p>Move constructors and move assignment operators should be <code>noexcept</code>. Standard containers check this: <code>std::vector</code> uses move operations when reallocating only if they are <code>noexcept</code>. Otherwise it falls back to copying, which is slower. Mark your moves <code>noexcept</code> to keep containers fast when growing.</p></div>
'''

[[lessons.exercises]]
id = "s03-l05-e1"
type = "text"
points = 20
prompt = "What does <code>std::move</code> actually do at the language level?"
answer = "casts an lvalue to an rvalue reference"
accept = [
    "converts to rvalue reference",
    "it is a cast to an rvalue reference",
    "casts to an rvalue reference",
    "converts its argument to an rvalue reference type",
    "it casts its argument to an rvalue reference",
    "produces an rvalue reference to its argument"
]
hint = "It does not generate any machine code by itself. It is a compile-time transformation — what type does it produce?"
explain = "<code>std::move(x)</code> is equivalent to <code>static_cast&lt;std::remove_reference_t&lt;decltype(x)&gt;&amp;&amp;&gt;(x)</code>. It casts <code>x</code> to an rvalue reference, which makes the compiler prefer move constructors and move assignment operators over copy equivalents. No code runs at runtime — it is purely a type system change."

[[lessons.exercises]]
id = "s03-l05-e2"
type = "mc"
points = 22
prompt = "After moving a <code>std::unique_ptr&lt;int&gt;</code> via <code>auto q = std::move(p);</code>, what state is <code>p</code> in?"
choices = [
    "Unchanged — <code>p</code> still points to the original int; moving a unique_ptr is the same as copying",
    "Null — <code>p</code> is <code>nullptr</code> and cannot be dereferenced until reassigned",
    "Undefined — the operation leaves <code>p</code> with a dangling pointer that must not be used at all",
    "Moved-from but valid — <code>p</code> still owns the int, but <code>q</code> also owns it (double-ownership is valid for unique_ptr)"
]
answer = 1
whyWrong = "After a move, <code>p</code> is null (<code>nullptr</code>). It is not undefined — it is safe to check or reassign. But it is safe to use <em>for assignment or destruction</em>, not for dereferencing. Double-ownership is impossible — unique_ptr's entire purpose is to prevent that."
hint = "What does the move constructor of <code>unique_ptr</code> do to the source's internal pointer? Does it copy it or set it to null?"
explain = "After <code>std::move(p)</code>, <code>p</code> is <code>nullptr</code>. The move constructor transferred ownership by copying the raw pointer and setting the source's pointer to null. Dereferencing <code>p</code> now is a null-pointer dereference. Check with <code>if (p)</code> before using."

[[lessons.exercises]]
id = "s03-l05-e3"
type = "mc"
points = 22
prompt = "What is the performance advantage of moving a <code>std::vector&lt;std::string&gt;</code> over copying it?"
choices = [
    "Moving is O(1) — three pointer-sized values are copied instead of every element — because the source vector's internal pointers are transferred to the destination",
    "Moving is O(log n) — a binary search tree of allocations is rebalanced instead of each element being copied",
    "Moving is O(n) but with a smaller constant factor — each element is still individually cloned but without allocating new string memory",
    "Moving is identical to copying in performance — the compiler eliminates the distinction in optimised builds"
]
answer = 0
whyWrong = "Moving is O(1), not O(n) nor O(log n). A vector internally stores three pointers (begin, end, capacity). Moving copies these pointers and nulls the source's. No elements are copied. No allocations occur. The compiler cannot replace a copy with a move unless you use <code>std::move</code> — they are different operations."
hint = "Consider what a <code>std::vector</code> contains internally — not the elements themselves, but the data structure that manages them. How many words of data does that structure need to transfer?"
explain = "A vector is typically three pointers: begin, end, capacity. Moving copies these three values (O(1)) and sets the source's pointers to null. Copying duplicates every element (O(n)) with allocation and <code>memcpy</code> for each. The asymptotic difference is linear vs constant."

[[lessons.exercises]]
id = "s03-l05-w1"
type = "write"
points = 32
prompt = "The lector tokeniser has a bug. The starter defines <code>make_token</code> that returns a <code>unique_ptr&lt;string&gt;</code>. The main function calls it but then tries to use the moved-from pointer before printing. Fix the bug: reorganise the code so that <code>token</code> is printed before being moved into <code>parser</code>. The program must print the token content and the token length through <code>parser</code>. Do not change the function — only fix main."
starter = '''#include <iostream>
#include <memory>
#include <string>

auto make_token(const std::string& content) {
    return std::make_unique<std::string>("{{ " + content + " }}");
}

int main() {
    auto token = make_token("bug");
    auto parser = std::move(token);
    // BUG: token is null here — this crashes:
    std::cout << *token << std::endl;
    std::cout << parser->length() << std::endl;
    return 0;
}'''
expect = '''{{ bug }} 
11'''
hint = "Swap the two print lines. Print <code>*token</code> BEFORE moving it into <code>parser</code>. After the move, only <code>parser</code> holds the data. The <code>parser->length()</code> line is already correct."
