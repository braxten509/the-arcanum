# Section s04 — INSCRIPTION IV // THE LIBRARY
id = "s04"
codename = "INSCRIPTION IV // THE LIBRARY"
short = "The Library"
title = "The Library"
build = "Lector stores posts as std::vector<Post> and metadata in std::unordered_map. Teaches STL containers (vector, map, unordered_map, set), iterators, range-for, std::find_if, std::sort, std::transform, std::accumulate, complexity reasoning."
brief = "<p>The Standard Library is a scriptorium of ready-made bindings. Vectors, maps, sets — each container a different shelf for a different kind of truth. Iterators walk between them. Algorithms transform them. You will learn which shelf holds what, and why <code>O(1)</code> is faster than a scribe's guess.</p>"
