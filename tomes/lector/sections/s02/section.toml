# Section s02 — INSCRIPTION II // READING THE LEAVES
id = "s02"
codename = "INSCRIPTION II // READING THE LEAVES"
short = "Reading the Leaves"
title = "Reading the Leaves"
build = "Lector reads each post's content into a std::vector<std::string> and prints a one-line summary. Teaches pointers vs references, * and & semantics, pointer arithmetic, C-strings vs std::string, const on pointers, the this pointer."
brief = "<p>A name is not a thing; a name points to a thing — or binds to it. Pointer versus reference is the question C++ asks on every line. We read the post files, store them, and learn what the <code>&</code> and <code>*</code> sigils truly mean.</p>"
