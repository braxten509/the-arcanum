[[lessons]]
id = "s02-l04"
title = "Reading the Leaves"
body = '''
<p>Lector reads posts. Each post is a file on disk. We store them in a <code>std::vector&lt;std::string&gt;</code> — a container that grows as we add elements.</p>
<p><code>std::vector&lt;std::string&gt; posts;</code> — an empty list of strings. <code>posts.push_back(content);</code> — adds one string to the end. The vector manages the memory. You never worry about the buffer size.</p>
<p>Iterate with a reference to avoid copies. <code>for (const std::string&amp; post : posts) { ... }</code>. The <code>&amp;</code> is crucial — without it, every iteration copies the entire string. This is the same <code>const&amp;</code> pattern from the first inscription: no copy, no mutation.</p>
<p>When you pass a vector to a function, use <code>const std::vector&lt;std::string&gt;&amp;</code>. A vector of a thousand strings passed by value copies every single character. Passed by const reference, it passes one address.</p>
<p><code>posts[i]</code> returns a <code>const std::string&amp;</code> — the bracket operator on a const vector returns a const reference. No copy. Direct access.</p>
<p>Under the surface, the vector holds a pointer to its first element on the heap. <code>posts[0]</code> is <code>*(posts.data())</code>. <code>posts.size()</code> tells you the element count. The pointer arithmetic you learned in s02-l02 is exactly what the vector does internally — it just wraps it in a safe interface.</p>
<p>This is how Lector sees its data. A pointer to the first post. Pointer arithmetic to the rest. The vector hides the pointer math, but the same rules apply.</p>
<div class="field-notes"><div class="fn-head">FIELD NOTES // Iterator Invalidation</div>
<p>Adding elements to a vector may cause reallocation. When the vector grows past its current capacity, it allocates a new, larger buffer, moves every element over, and frees the old buffer. Any pointer or reference to an element becomes invalid — it points to freed memory. This is why you never store pointers into a vector across a push_back call.</p></div>
'''

[[lessons.exercises]]
id = "s02-l04-e1"
type = "mc"
points = 22
prompt = "When iterating over a <code>std::vector&lt;std::string&gt;</code> with a range-for loop, what does <code>const auto&amp;</code> in <code>for (const auto&amp; s : vec)</code> primarily protect against?"
choices = [
    "Protecting the vector from being resized while iterating — references prevent reallocation",
    "Copying each string on every iteration — the reference avoids duplicating the string data",
    "Preventing the loop variable from going out of scope between loop body executions",
    "Stopping iteration early if a string exceeds a maximum length"
]
answer = 1
whyWrong = "The <code>&amp;</code> (reference) is what avoids copying. Without it (<code>auto s</code>), every iteration constructs a new string copy: the allocation, the <code>memcpy</code>, the free. <code>const</code> prevents accidental modification. Together they give safe, zero-copy iteration."
hint = "What would happen differently with <code>for (auto s : vec)</code> instead of <code>for (const auto&amp; s : vec)</code>? How many times would each string be copied?"
explain = "<code>const auto&amp; s</code> binds <code>s</code> as a const reference to each element. No copy is made. Without the <code>&amp;</code>, each element is copied into <code>s</code> — expensive for large strings. Without <code>const</code>, the loop could accidentally mutate elements."

[[lessons.exercises]]
id = "s02-l04-e2"
type = "mc"
points = 22
prompt = "Inside a non-const member function of class <code>Archive</code>, what type does <code>this</code> have?"
choices = [
    "<code>Archive* const</code> — a const pointer to the calling object; you cannot reassign <code>this</code> but you can modify the object",
    "<code>Archive</code> — the object itself, passed by value as the first implicit argument",
    "<code>Archive&amp;</code> — a reference to the calling object, accessed with <code>.</code> not <code>-&gt;</code>",
    "<code>const Archive*</code> — a pointer to a const Archive; you cannot modify the object through <code>this</code>"
]
answer = 0
whyWrong = "<code>this</code> is a pointer (not a reference), and within a non-const member function it is <code>Archive* const</code>. The pointer itself is const — you cannot change where <code>this</code> points — but the object is mutable. If the member function were const, <code>this</code> would be <code>const Archive* const</code>."
hint = "Is <code>this</code> a pointer or a reference? Do you access members with <code>.</code> or <code>-&gt;</code>? Can you change where <code>this</code> points? Does <code>const</code> after the function parameter list change the answer?"
explain = "<code>this</code> is implicitly declared as <code>Classname* const</code> inside every non-const member function. It is a const pointer to the current object. You cannot reassign <code>this</code>, but you can modify the object's members through it."

[[lessons.exercises]]
id = "s02-l04-e3"
type = "fill"
points = 22
prompt = "Complete the function parameter so <code>posts</code> is a const reference to a vector of strings — no copy, no mutation."
code = '''void summarize(____& posts) {
    std::cout << posts.size() << " posts" << std::endl;
}'''
answer = "const std::vector<std::string>"
hint = "The full type includes <code>const</code>, the template type <code>std::vector&lt;std::string&gt;</code>, and the reference symbol <code>&amp;</code>. Everything before the <code>&amp;</code> is the type."
explain = "<code>const std::vector&lt;std::string&gt;&amp; posts</code> makes <code>posts</code> a const reference to a vector of strings. No copy is made when the argument is passed, and the function cannot modify the caller's data."

[[lessons.exercises]]
id = "s02-l04-d1"
type = "type"
points = 13
reps = 2
prompt = "Retype this range-for loop that iterates a vector of strings by const reference. The <code>&amp;</code> is the difference between a copy and an alias."
code = '''std::vector<std::string> posts = {"Leaf", "Stone"};
for (const std::string& p : posts) {
    std::cout << p << std::endl;
}'''

[[lessons.exercises]]
id = "s02-l04-e4"
type = "text"
points = 22
prompt = "Why should a function that only reads a <code>std::vector&lt;std::string&gt;</code> take it as <code>const std::vector&lt;std::string&gt;&amp;</code> instead of <code>std::vector&lt;std::string&gt;</code>?"
answer = "avoids copying the entire vector"
accept = [
    "avoids a copy",
    "avoids copying",
    "no copy is made",
    "avoids copying the vector",
    "prevents copying",
    "it doesn't copy the vector",
    "pass by reference avoids copying",
    "avoids duplicating the data"
]
hint = "What happens to the argument when it is passed by value? Every element — every string — gets duplicated. The more data, the more cost."
explain = "Passing by value copies the entire vector and every string it contains. Passing by const reference passes a pointer-sized alias — typically 8 bytes. The function can read the original data without duplicating a single character. For any container larger than a few elements, const ref is the default."

[[lessons.exercises]]
