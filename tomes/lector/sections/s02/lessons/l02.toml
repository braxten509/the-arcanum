[[lessons]]
id = "s02-l02"
title = "The Arrow's Path"
body = '''
<p>Const on pointers has two forms. They mean different things. Read from the name outward, clockwise — the Clockwise Rule from the first inscription decodes both.</p>
<p><code>const int* p;</code> — start at <code>p</code>. Clockwise: <code>*</code> (pointer to), then <code>const int</code>. The pointer moves. The int is const. You cannot change the int through this pointer. You can change where the pointer points.</p>
<p><code>int* const p;</code> — start at <code>p</code>. Clockwise: <code>const</code>, then <code>*</code>, then <code>int</code>. The pointer itself is const. The int is mutable. You cannot reassign the pointer. You can change the int through it.</p>
<p>Pointers walk. <code>int arr[4] = {1,2,3,4}; int* p = arr;</code> — the array name decays to a pointer to its first element. <code>arr</code> and <code>&arr[0]</code> are the same address.</p>
<p><code>p++</code> advances by <code>sizeof(int)</code> bytes — one element. <code>p += 2</code> advances two elements. <code>*(p + 1)</code> is <code>p[1]</code>. The bracket operator is syntactic sugar for pointer arithmetic. The compiler generates the same machine code either way.</p>
<p><code>ptrdiff_t</code> from <code>&lt;cstddef&gt;</code> stores the difference between two pointers. Two pointers to elements of the same array subtract to a signed integer. Pointers to different arrays cannot be subtracted or compared — the behavior is undefined.</p>
<p>This is how iteration works at the hardware level. A range-for loop, an index loop, a pointer loop — the compiler flattens them to pointer math.</p>
<div class="field-notes"><div class="fn-head">FIELD NOTES // One-Past-the-End</div>
<p>Pointer arithmetic past the end of an array is undefined behavior even without dereferencing. The one exception: you may always form a one-past-the-end pointer (<code>arr + 3</code> for an array of 3 elements) and compare against it. This is how every iterator loop works under the surface — <code>begin()</code> is the pointer to the first element, <code>end()</code> is the one-past-the-end pointer.</p></div>
'''

[[lessons.exercises]]
id = "s02-l02-e1"
type = "mc"
points = 22
prompt = "What does <code>const int* p;</code> mean under the Clockwise Rule?"
choices = [
    "A const pointer to a mutable int — the pointer cannot be reassigned but the int can change",
    "A mutable pointer to a const int — the pointer can move but the int cannot be changed through it",
    "Both the pointer and the int are const — neither can change",
    "Neither is const — the declaration is equivalent to <code>int* p</code>"
]
answer = 1
whyWrong = "The Clockwise Rule starts at the name <code>p</code> and reads outward: <code>*</code> first (pointer), then <code>const int</code> (the pointed-to type). The <code>const</code> binds to the <code>int</code>, not the pointer. The pointer itself is mutable — it can point elsewhere."
hint = "Start at <code>p</code> and read clockwise. What token does the <code>*</code> encounter first — the <code>const</code> to its left, or the <code>const int</code> to its right?"
explain = "<code>const int* p</code> reads: <code>p</code> is a pointer to <code>const int</code>. The pointer is mutable. The integer it points to cannot be changed through this pointer. Contrast: <code>int* const p</code> — <code>p</code> is a const pointer to <code>int</code>."

[[lessons.exercises]]
id = "s02-l02-e2"
type = "mc"
points = 22
prompt = "Given <code>int arr[3] = {10, 20, 30}; int* p = arr; p += 2;</code>, what does <code>*p</code> equal?"
choices = [
    "20 — <code>p</code> advanced by 2 bytes, landing on the second element",
    "Undefined behavior — pointer arithmetic beyond the first element is illegal",
    "30 — <code>p</code> advanced by 2 elements (<code>sizeof(int)</code> bytes each), landing on <code>arr[2]</code>",
    "12 — pointer arithmetic adds the offset to the stored value"
]
answer = 2
whyWrong = "Pointer arithmetic moves by elements, not bytes. <code>p + 2</code> advances by <code>2 * sizeof(int)</code> bytes, landing on <code>arr[2]</code> which is 30. That is well-defined within the array bounds."
hint = "Each increment of a pointer of type <code>int*</code> advances by <code>sizeof(int)</code> bytes, not 1 byte. <code>p += 2</code> advances by 2 elements. Where does that leave the pointer?"
explain = "<code>p += 2</code> advances the pointer by <code>2 * sizeof(int)</code> bytes. <code>p</code> started at <code>arr[0]</code>, so after the advance it points to <code>arr[2]</code>. <code>*p</code> dereferences to the value there, which is 30."

[[lessons.exercises]]
id = "s02-l02-d1"
type = "type"
points = 13
reps = 2
prompt = "Retype this loop that traverses an array using pointer arithmetic. Notice how <code>p != arr + 3</code> uses the one-past-the-end pattern."
code = '''int arr[3] = {10, 20, 30};
for (int* p = arr; p != arr + 3; ++p) {
    std::cout << *p << " ";
}'''

[[lessons.exercises]]
id = "s02-l02-w1"
type = "write"
points = 32
prompt = "Write a program that declares <code>int vals[5] = {5, 10, 15, 20, 25};</code> and prints each element using pointer arithmetic — do NOT use array indexing (<code>vals[i]</code>). Use a pointer that walks the array. Print each value followed by a space."
starter = '''#include <iostream>

int main() {
    int vals[5] = {5, 10, 15, 20, 25};
    // TODO: print each value using pointer arithmetic
    // Use a pointer loop, not array indexing.
    return 0;
}'''
expect = "5 10 15 20 25"
hint = "Declare <code>int* p = vals;</code> and write a loop. Inside, <code>*p</code> gives the current value. Advance with <code>++p</code>. Stop when <code>p</code> passes the last element (<code>p != vals + 5</code>)."
