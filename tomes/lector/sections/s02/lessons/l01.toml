[[lessons]]
id = "s02-l01"
title = "The Named and the Pointed"
body = '''
<p>A pointer holds an address. A reference is an alias. These are the two ways C++ lets one name speak for another. Know the difference. It is asked on every line.</p>
<p><code>int x = 42; int* p = &x;</code> — <code>p</code> stores where <code>x</code> sits in memory. The address. The location, not the value.</p>
<p><code>int& r = x;</code> — <code>r</code> is another name for <code>x</code>. No address stored. No indirection. Just another label on the same box.</p>
<p>The unary <code>&</code> takes the address. It produces a pointer. The unary <code>*</code> dereferences a pointer. It follows the address and yields the value. These are the two operators that bridge names and addresses.</p>
<p>A pointer can point to nothing. <code>int* p = nullptr;</code> compiles, runs, and is useful — it means "no object." A reference must always name something. <code>int& r;</code> does not compile. There is no null reference in well-defined C++.</p>
<p>A pointer can change what it points to. <code>int* p = &x; p = &y;</code> is valid — <code>p</code> now points at <code>y</code>. A reference binds once. <code>int& r = x; r = y;</code> does not rebind <code>r</code> to <code>y</code>. It assigns <code>y</code>'s value <em>into</em> <code>x</code>. The reference is still an alias for <code>x</code>.</p>
<p>Use references when the object always exists and the binding never changes. Use pointers when null is a valid state or when the target changes. This is the central C++ distinction. Every sigil in Lector uses one or the other.</p>
<div class="field-notes"><div class="fn-head">FIELD NOTES // Const Reference and Temporaries</div>
<p>A const reference can bind to a temporary and extend its lifetime. <code>const std::string& s = getString();</code> is valid — <code>s</code> lives as long as the reference. A non-const reference cannot. <code>std::string& s = getString();</code> is a compiler error. This is the one place where a reference acts like a value holder.</p></div>
'''

[[lessons.exercises]]
id = "s02-l01-e1"
type = "mc"
points = 22
prompt = "Which statement about C++ references is false?"
choices = [
    "A reference must be initialized when declared — you cannot declare a reference and bind it later",
    "A reference cannot be null — there is no null reference in well-defined C++",
    "A reference can be reassigned to refer to a different object using the assignment operator",
    "Modifying a reference modifies the original object — the reference is an alias"
]
answer = 2
whyWrong = "References cannot be rebound. When you write <code>r = y</code> on a reference, you assign <code>y</code>'s value to the object <code>r</code> already refers to — the reference keeps pointing at the same object."
hint = "Think about what <code>int& r = x; r = y;</code> actually does. Does <code>r</code> now refer to <code>y</code>, or did it copy <code>y</code>'s value into <code>x</code>?"
explain = "A reference cannot be reassigned. <code>r = y</code> performs assignment through the reference — it copies <code>y</code>'s value into the object <code>r</code> refers to. The reference itself still refers to the same object for its entire lifetime."

[[lessons.exercises]]
id = "s02-l01-e2"
type = "text"
points = 22
prompt = "What does the unary operator <code>*</code> do when applied to a pointer variable?"
answer = "dereferences the pointer"
accept = [
    "dereferences it",
    "follows the pointer",
    "accesses the pointed to value",
    "dereference",
    "gives the value at the address",
    "follows the address"
]
hint = "The operation follows the address stored in the pointer to reach the actual object stored there."
explain = "The unary <code>*</code> operator dereferences a pointer. It accesses the value stored at the address the pointer holds. Without it, the pointer variable itself stores only an address — not the value."

[[lessons.exercises]]
id = "s02-l01-d1"
type = "type"
points = 13
reps = 2
prompt = "Retype these pointer and reference declarations. Notice the syntax difference: <code>*</code> declares a pointer, <code>&amp;</code> declares a reference."
code = '''int x = 42;
int* p = &x;
int& r = x;'''

[[lessons.exercises]]
id = "s02-l01-e3"
type = "fill"
points = 22
prompt = "Complete the code so <code>p</code> points to the variable <code>count</code>."
code = '''int count = 0;
int* p = ____;'''
answer = "&count"
hint = "The address-of operator <code>&amp;</code> retrieves the memory address of a variable. It is the same symbol used to declare a reference, but used as an operator here."
explain = "<code>&amp;count</code> produces the address of <code>count</code> in memory. A pointer stores addresses, so <code>int* p = &amp;count;</code> makes <code>p</code> point to <code>count</code>. Dereference with <code>*p</code> to read or write the value."

[[lessons.exercises]]
id = "s02-l01-w1"
type = "write"
points = 32
prompt = "Write the body of <code>exchange</code> so it swaps the values its two pointer parameters point to. The starter compiles and prints the starting values. Fill the function body to complete the swap."
starter = '''#include <iostream>

void exchange(int* a, int* b) {
    // TODO: swap the values a and b point to
}

int main() {
    int x = 10, y = 20;
    exchange(&x, &y);
    std::cout << x << " " << y << std::endl;
    return 0;
}'''
expect = "20 10"
hint = "Declare a temporary <code>int temp = *a;</code> to hold the first value. Then <code>*a = *b;</code> overwrites it. Then <code>*b = temp;</code> restores the original into <code>b</code>. Each dereference with <code>*</code> accesses the pointed-to value."
