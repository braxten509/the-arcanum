# Section s06 — INSCRIPTION VI // THE CLOCKWISE RULE
id = "s06"
codename = "INSCRIPTION VI // THE CLOCKWISE RULE"
short = "The Clockwise Rule"
title = "The Clockwise Rule"
build = "Ship lector-decode: a utility that reads a C++ declaration from stdin and prints its Clockwise-Rule meaning. Teaches function pointers, pointer-to-arrays, array-of-pointers, references, cv-qualifiers in declarations, typedef/using aliases."
brief = "<p><code>int (*fp)(char const*, ...)</code> — what does it <em>mean</em>? The Clockwise Rule is the decoder: start at the name, spiral outward, read each sigil as you pass. Function pointers, pointer-to-arrays, cv-qualifiers — by the end, no declaration in the language can hide from you.</p>"
