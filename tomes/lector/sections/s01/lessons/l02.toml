[[lessons]]
id = "s01-l02"
title = "Declaring Intent"
body = '''
<p>Declarations announce. Definitions create. Every name in C++ must be declared before use and defined exactly once.</p>
<p>A declaration tells the compiler a name and its type: <code>int count_posts(const std::string&amp; dir);</code> — the function exists somewhere. A definition provides the body: the braces, the statements, the return value.</p>
<p>The One Definition Rule is strict. One definition per function or global variable across the entire program. You can declare it as many times as you want. Define it once.</p>
<p>The <code>#include</code> directive does textual inclusion. It is the preprocessor reading the header file and pasting its contents into your source file. This is why you put <strong>declarations</strong> in headers and <strong>definitions</strong> in source files. Including a header that contains definitions in two different <code>.cpp</code> files violates ODR.</p>
<p>What goes where:</p>
<ul>
<li>Function declarations, class definitions, inline functions, and template definitions belong in headers.</li>
<li>Function implementations (unless inline), global variable definitions, and non-trivial member function bodies belong in <code>.cpp</code> files.</li>
</ul>
<p>Guards prevent double inclusion. Two forms: <code>#pragma once</code> (shorter, not in the standard but every compiler supports it) and the <code>#ifndef</code> / <code>#define</code> / <code>#endif</code> pattern (standard compliant). Pick one and stay consistent.</p>
<p>Every source file that needs a declaration includes the header. The compiler sees the complete translation unit. The linker resolves what remains.</p>
<p>A practical rule: if something can appear in two different translation units without causing a linker error, it belongs in a header. If it must appear exactly once, it belongs in a source file. Class definitions, inline functions, templates, and <code>constexpr</code> objects pass this test. Variable definitions and non-inline function bodies do not.</p>
<div class="field-notes"><div class="fn-head">FIELD NOTES // The Pimpl Idiom</div>
<p>The Pimpl idiom hides implementation details behind a pointer-to-implementation. It removes compile-time dependencies on private headers. Change a private member without recompiling every file that includes your public header. Classic C++ encapsulation: the header barely changes, the source file carries the weight.</p></div>
'''

[[lessons.readings]]
label = "C++ header files (cppreference)"
url = "https://en.cppreference.com/w/cpp/header"

[[lessons.exercises]]
id = "s01-l02-e1"
type = "mc"
points = 20
prompt = "Which of these belongs in a header file?"
choices = [
    "A non-inline function definition with external linkage",
    "The <code>main()</code> function",
    "A non-inline global variable definition",
    "A class definition"
]
answer = 3
whyWrong = "Putting a function definition with external linkage in a header means every translation unit that includes it produces a copy, which violates the One Definition Rule. You meant a declaration."
hint = "One Definition Rule — what can appear in multiple translation unit without causing a linker error?"
explain = "Class definitions, inline functions, templates, and function declarations all survive multiple inclusions. Non-inline function and variable definitions do not — they would cause multiple-definition linker errors."

[[lessons.exercises]]
id = "s01-l02-e2"
type = "fill"
points = 20
prompt = "Complete the header guard."
code = '''#ifndef LECTOR_UTILS_H
#define LECTOR_UTILS_H
// declarations go here
____'''
answer = "#endif"
hint = "Every <code>#ifndef</code> must eventually be closed. The guard started with <code>#ifndef</code>."
explain = "The <code>#endif</code> closes the conditional. On the first inclusion, <code>LECTOR_UTILS_H</code> is undefined, so <code>#ifndef</code> is true and the content between <code>#define</code> and <code>#endif</code> is processed. On later inclusions, the macro is defined, so the content is skipped."

[[lessons.exercises]]
id = "s01-l02-d1"
type = "type"
points = 12
reps = 2
prompt = "Retype this header. Note the guard and the function declaration — this is the standard shape of a C++ header."
code = '''#pragma once
#include <string>

std::string greet(const std::string& name);'''

[[lessons.exercises]]
id = "s01-l02-w1"
type = "write"
points = 30
prompt = "Write a program where a function is <strong>declared</strong> before <code>main</code> and <strong>defined</strong> after <code>main</code>. The function <code>count_posts(int)</code> returns <code>&quot;Posts: N&quot;</code> as a <code>std::string</code>. Call it with argument <code>7</code> and print the result. The starter compiles and prints <code>Replace me</code> — replace that line."
starter = '''#include <iostream>
#include <string>

int main() {
    // TODO: declare count_posts(int) before main, define it after
    // main, and call it with 7 — then print the result
    std::cout << "Replace me" << std::endl;
    return 0;
}'''
expect = "Posts: 7"
hint = "Add <code>std::string count_posts(int n);</code> before <code>main</code>. Then write the definition after <code>main</code>. In <code>main</code>, call it and pass the result to <code>std::cout</code>."
