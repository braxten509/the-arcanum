[[lessons]]
id = "s01-l04"
title = "The Oath of Const"
body = '''
<p>A reference is an alias. It names the same object as the variable it binds to.</p>
<p><code>T&amp; ref = variable;</code> — <code>ref</code> and <code>variable</code> are the same object. Changes through <code>ref</code> affect <code>variable</code> directly. References cannot be null. References cannot be rebound. They are not pointers.</p>
<p>Pass by reference means the function sees the original object, not a copy. <code>void read(T&amp; val)</code> — any modification inside the function changes the argument. This matters for output parameters and mutation.</p>
<p>Pass by const reference means the function sees the original but promises not to change it. <code>void read(const T&amp; val)</code> — no copy, no modification. This is the default way to pass non-trivial types in modern C++.</p>
<p>Why const reference? Copying a <code>std::string</code> or a large struct costs time and memory. Passing by value copies. Passing by const reference passes a pointer-sized alias. The const guarantees the caller that the function is read-only.</p>
<p>Const correctness: any variable that never changes after initialization should be <code>const</code>. Any parameter that the function does not modify should be <code>const</code>. This is not pedantry — it prevents accidental mutation and tells the reader what changes and what stays fixed.</p>
<p>The Clockwise Rule starts here. <code>const int*</code> — pointer to const int (the int is const, the pointer moves). <code>int* const</code> — const pointer to int (the pointer is fixed, the int changes). <code>const int* const</code> — const pointer to const int (neither moves). Read from the name outward, rotating clockwise. We decode the full grammar in a later inscription.</p>
<p>Get the habit now: every variable that does not change is <code>const</code>. Every reference parameter that does not mutate is <code>const</code>. The compiler enforces it. Your future self will thank you when reading code six months from now and knowing instantly which names are fixed.</p>
<div class="field-notes"><div class="fn-head">FIELD NOTES // Rvalue References</div>
<p>Rvalue references (<code>T&amp;&amp;</code>) enable move semantics — an object's resources are pilfered instead of copied. They are the key to modern C++ performance. Covered fully in inscription VIII.</p></div>
'''

[[lessons.readings]]
label = "References (cppreference)"
url = "https://en.cppreference.com/w/cpp/language/reference"

[[lessons.exercises]]
id = "s01-l04-e1"
type = "mc"
points = 20
prompt = "What does passing a parameter as <code>const T&amp;</code> protect against?"
choices = [
    "The reference being reassigned to a different object inside the function",
    "The function throwing an exception",
    "The argument variable going out of scope before the function returns",
    "The referenced object being modified through that reference"
]
answer = 3
whyWrong = "References cannot be reassigned at all (neither <code>T&amp;</code> nor <code>const T&amp;</code>). The const here means something different — it applies to the <em>referenced object</em> through this access path."
hint = "What does the <code>const</code> qualifier apply to in <code>const T&amp;</code>? Read it from the name: <code>const T&amp;</code> means a reference to a const T."
explain = "<code>const T&amp;</code> is a reference to a <code>const T</code>. The reference itself cannot be reassigned (no reference can), and the object it refers to cannot be modified through that reference. The caller knows the object will not be touched."

[[lessons.exercises]]
id = "s01-l04-e2"
type = "mc"
points = 20
prompt = "Under the Clockwise Rule, what does <code>const char* const</code> mean?"
choices = [
    "A mutable pointer to mutable char — both pointer and data can change",
    "A const pointer to mutable char — the pointer is fixed but the char can change",
    "A const pointer to const char — neither the pointer nor the data can change",
    "A mutable pointer to const char — the char cannot change but the pointer can"
]
answer = 2
whyWrong = "The two <code>const</code> qualifiers apply to different things. Reading left to right misses this. The rule is: read from the name outward, rotating clockwise. <code>const char* const</code> has two <code>const</code>s — one for the char, one for the pointer."
hint = "Start at the name (notional here since this is a variable-less declaration). The <code>const</code> to its right binds to the pointer. The <code>const</code> to its left binds to what the pointer points to."
explain = "<code>const char* const</code> is read clockwise from the name: the first <code>const</code> (left of <code>*</code>) means 'const char' — the character is immutable. The <code>*</code> means pointer. The second <code>const</code> (right of <code>*</code>) means the pointer itself is immutable. Neither thing can change."

[[lessons.exercises]]
id = "s01-l04-e3"
type = "text"
points = 20
prompt = "What is the advantage of passing a <code>std::string</code> as <code>const std::string&amp;</code> instead of passing it by value?"
answer = "avoids copying the string"
accept = [
    "no copy is made",
    "avoids a copy",
    "avoids unnecessary copying",
    "it doesn't copy the string",
    "avoids copying",
    "it avoids copying the entire string"
]
hint = "What happens to the argument when it is passed by value? The function receives its own copy."
explain = "Passing by value <strong>copies</strong> the entire string — every character is duplicated on the stack or heap. Passing by <code>const&amp;</code> passes only the address (pointer-sized). No copy, no allocation, no free. For small types like <code>int</code>, value is fine; for types that manage dynamic memory, <code>const&amp;</code> is the default."

[[lessons.exercises]]
id = "s01-l04-e4"
type = "fill"
points = 20
prompt = "Complete the function definition. The parameter <code>msg</code> should accept a <code>std::string</code> without copying it and without allowing modification."
code = '''void log_message(____ msg) {
    std::cout << "[LOG] " << msg << std::endl;
}'''
answer = "const std::string&"
hint = "You need two things: the reference symbol (<code>&amp;</code>) to avoid copying, and <code>const</code> to prevent modification. The order matters for the Clockwise Rule."
explain = "<code>const std::string&amp; msg</code> is a reference to a const string. No copy is made, and <code>log_message</code> cannot modify the caller's string. This is the idiomatic C++ way to pass a read-only string."

[[lessons.exercises]]
id = "s01-l04-w1"
type = "write"
points = 30
prompt = "Write a function <code>count_posts</code> that takes a <code>const std::string&amp;</code> (the directory name) and returns its <code>length()</code> as an <code>int</code>. In <code>main</code>, call it with <code>&quot;posts&quot;</code> and print the result. The starter compiles and prints a placeholder."
starter = '''#include <iostream>
#include <string>

int main() {
    // TODO: call count_posts("posts") and print the result
    std::cout << "TODO" << std::endl;
    return 0;
}

