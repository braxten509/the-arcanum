[[lessons]]
id = "s01-l03"
title = "What Names Shield"
body = '''
<p>Names clutter. Namespaces clean them.</p>
<p>A namespace is a scope. Names inside it do not collide with names outside. <code>namespace lector { ... }</code> — everything between the braces lives under that namespace.</p>
<p>Access them with the scope operator: <code>lector::parse</code>. A using-declaration brings one name into the current scope: <code>using lector::parse</code>. A using-directive brings the entire namespace: <code>using namespace lector;</code> — use this sparingly. In source files it is acceptable. In headers it pollutes every file that includes them, making collisions likely.</p>
<p>C++ fundamentals: <code>char</code> (1 byte), <code>int</code> (at least 2, typically 4), <code>bool</code> (<code>true</code> / <code>false</code>), <code>double</code> (at least 8 bytes). Their exact sizes depend on the platform. Know them for yours.</p>
<p><code>auto</code> deduces a type from the initializer. <code>auto x = 42;</code> — <code>x</code> is <code>int</code>. Use <code>auto</code> when the type is obvious from the right-hand side. It reduces repetition without hiding what the code does.</p>
<p>But <code>auto</code> strips references and cv-qualifiers. <code>const int&amp; y = something; auto z = y;</code> — <code>z</code> is <code>int</code>, not <code>const int&amp;</code>. If you need reference semantics, write <code>auto&amp;</code>. If you need const, write <code>const auto&amp;</code>. The compiler silently discards them otherwise.</p>
<p>Know your fundamental type sizes because they affect memory layout and overflow behavior. <code>int</code> wraps after about 2 billion on a typical machine. <code>double</code> holds fractional values with about 15 decimal digits of precision. <code>bool</code> stores true or false — do not compare it to integer literals. The standard guarantees minimum ranges; your platform's actual ranges are found in <code>&lt;climits&gt;</code> and <code>&lt;cfloat&gt;</code>. Pick the type that fits the data, not the largest one available.</p>
<div class="field-notes"><div class="fn-head">FIELD NOTES // decltype</div>
<p><code>decltype</code> deduces the exact declared type including references and qualifiers — useful in templates. <code>decltype(auto)</code> (C++14) forwards the exact type, used primarily in return type deduction for forwarding functions. It deduces what the expression <em>is</em>, not what the initializer looks like.</p></div>
'''

[[lessons.readings]]
label = "auto specifier (cppreference)"
url = "https://en.cppreference.com/w/cpp/language/auto"

[[lessons.exercises]]
id = "s01-l03-e1"
type = "text"
points = 20
prompt = "You want to bring only <code>cout</code> from <code>std</code> into scope, not every name in the namespace. What single keyword starts that declaration?"
answer = "using"
accept = [
    "using declaration",
    "using-declaration"
]
hint = "It is the same keyword as <code>using namespace</code>, but without the <code>namespace</code> keyword following it."
explain = "A <code>using</code> declaration (e.g., <code>using std::cout;</code>) brings one specific name into scope. A <code>using</code> directive (<code>using namespace std;</code>) brings every name from the namespace. The former is safer."

[[lessons.exercises]]
id = "s01-l03-e2"
type = "mc"
points = 20
prompt = "What type does <code>auto</code> deduce for <code>z</code> in this code: <code>int y = 42; const int&amp; r = y; auto z = r;</code>?"
choices = [
    "<code>int</code> — auto strips reference and const-qualification",
    "<code>const int&amp;</code> — auto preserves the full type of the initializer",
    "<code>int&amp;</code> — auto deduces a reference when initialized from one",
    "<code>auto</code> — auto is itself a placeholder type that <code>z</code> keeps"
]
answer = 0
whyWrong = "<code>auto</code> always strips top-level cv-qualifiers and references. To preserve them you must write <code>const auto&amp;</code>. Without it, you get the value type."
hint = "Does <code>auto</code> preserve the reference and const from the initializer, or does it decay to the underlying value type?"
explain = "<code>auto</code> deduces the value type <strong>after</strong> stripping references and cv-qualifiers. <code>r</code> is <code>const int&amp;</code>, but <code>z</code> becomes plain <code>int</code>. If you wanted <code>const int&amp;</code>, you write <code>const auto&amp; z = r;</code>."

[[lessons.exercises]]
id = "s01-l03-e3"
type = "fill"
points = 20
prompt = "Complete the line so <code>r</code> is a reference to <code>val</code> and can modify it."
code = '''int val = 10;
____ r = val;   // r is a reference to val
r = 20;         // val is now 20'''
answer = "auto&"
hint = "How do you write a reference type using <code>auto</code>? What symbol follows <code>auto</code>?"
explain = "<code>auto&amp;</code> deduces a reference. Without the <code>&amp;</code>, <code>auto</code> gives you a value copy. <code>auto&amp; r = val</code> makes <code>r</code> an alias for <code>val</code>."

[[lessons.exercises]]
id = "s01-l03-e4"
type = "mc"
points = 20
prompt = "Which of C++'s fundamental types is guaranteed by the standard to be exactly 1 byte?"
choices = [
    "<code>int</code> — the default integer type, which is the smallest addressable unit",
    "<code>char</code> — <code>sizeof(char)</code> is always 1 by definition",
    "<code>bool</code> — a boolean is small enough to fit in one byte",
    "<code>byte</code> — introduced in C++17 as <code>std::byte</code>, exactly 1 byte"
]
answer = 1
whyWrong = "<code>std::byte</code> is indeed 1 byte, but it is not a <strong>fundamental type</strong> — it is a library type defined in <code>&lt;cstddef&gt;</code>. The question asks for fundamental types. <code>char</code> is the one the standard guarantees."
hint = "The C++ standard says <code>sizeof(T)</code> is 1 for exactly one fundamental type."
explain = "<code>sizeof(char)</code> is 1 by definition in the C++ standard. All other fundamental types are at least as large as <code>char</code> but their exact size depends on the platform."

[[lessons.exercises]]
id = "s01-l03-w1"
type = "write"
points = 30
prompt = "Use <code>auto</code> to declare a variable <code>summary</code> that stores the concatenation of <code>message</code> and <code>std::to_string(42)</code> (separated by <code>&quot; — &quot;</code>). Then print <code>summary</code>. Use <code>auto</code> for the declaration — do not write the type explicitly."
starter = '''#include <iostream>
#include <string>

int main() {
    std::string message = "Lector ready";
    // TODO: use auto to declare 'summary' as
    // message + " — " + std::to_string(42)
    // then print it
    return 0;
}'''
expect = "Lector ready — 42"
hint = "Use <code>auto summary = message + &quot; — &quot; + std::to_string(42);</code> then <code>std::cout &lt;&lt; summary &lt;&lt; std::endl;</code>"
