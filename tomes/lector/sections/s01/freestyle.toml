[freestyle]
title = "THE WORKING: THE SKELETON"
brief = '''<p>Your first commission, scribe. Lector needs a front door — a skeleton that wakes, reads its marching orders, and reports what it finds. The compiler is your quill. Make it speak.</p>
<ul>
  <li>Read the <code>--posts</code> argument from <code>argv</code>.</li>
  <li>If <code>--posts</code> is missing, print <code>Usage: lector --posts &lt;dir&gt;</code> and exit.</li>
  <li>Iterate the given directory with <code>std::filesystem::directory_iterator</code>.</li>
  <li>Count every file whose extension is <code>.post</code>.</li>
  <li>Print exactly: <code>Lector — N posts</code> where <code>N</code> is the count (computed, not hardcoded).</li>
</ul>'''
reward = 150
xray = "The grader docks points for: hardcoding N instead of counting the actual directory entries; not using <code>std::filesystem::directory_iterator</code>; missing or incorrect <code>--posts</code> parsing; printing the wrong format. It gives style credit for: <code>snake_case</code> variable naming, Allman brace style, <code>const</code>-correctness (variables that never change after init), and clean includes (no <code>#include &lt;bits/stdc++.h&gt;</code>)."

[freestyle.badge]
id = "badge-s01"
name = "FIRST INSCRIPTION"
desc = "Built the Lector CLI skeleton — the front door of the whole operation."

[[freestyle.rubric]]
criterion = "Compiles & runs"
weight = 30
desc = "Build succeeds; the program runs without crashing on valid input and handles missing --posts gracefully."

[[freestyle.rubric]]
criterion = "Parses --posts from argv"
weight = 25
desc = "Reads the directory path from <code>--posts &lt;dir&gt;</code>. If absent, prints usage and exits with a non-zero status."

[[freestyle.rubric]]
criterion = "Counts .post files and prints output"
weight = 30
desc = "Uses <code>std::filesystem::directory_iterator</code> to iterate the given directory. Counts files ending in <code>.post</code>. Prints <code>Lector — N posts</code> with the real count — no hardcoded number."

[[freestyle.rubric]]
criterion = "Clean style"
weight = 15
desc = "Follows C++ conventions: <code>snake_case</code> for functions and variables, PascalCase for custom types, Allman brace style (braces on their own line), <code>const</code>-correctness where values do not change. No <code>using namespace std;</code> in global scope of headers."
