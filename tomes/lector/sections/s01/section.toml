build = "Lector CLI skeleton — scans a --posts directory, counts .post files, prints Lector — N posts. C++ recap: compile model, header/source split, namespaces, auto, references-as-parameters, const correctness."
brief = "<p>The quill meets the vellum. Every sigil-press starts with a single command — a skeleton that reads its first file. We reforge the basics: how C++ compiles, how declarations bind names to types, the namespace scabbard, <code>auto</code> deduction, reference parameters, and how <code>const</code> keeps a promise you cannot break. An old quill resharpened cuts deeper than a new one.</p>"
