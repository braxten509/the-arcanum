id = "s03"
codename = "COIL III // THE ENDLESS COIL"
short = "The Endless Coil"
title = "Repetition & Memory — while, Lists & for"
build = "The Familiar entire — a listening loop with a hoard it remembers and recites"
brief = "A serpent is a loop with an appetite. This final coil teaches repetition — <code>while</code> holds the Familiar awake between commands, and <code>for</code> walks it along everything it has swallowed. Lists give it a <em>hoard</em>: things remembered, counted, recited. The last Great Working binds all three coils into the finished creature the Codex promised. VYSSA's margin note: \"anyone can make it speak once. RAISED means it keeps answering.\""
