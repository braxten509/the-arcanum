[freestyle]
title = "THE WORKING: The Familiar Entire"
brief = "Bind <code>main.py</code> into the finished Familiar — awake until dismissed, remembering what it is given.<ul><li>Wakes with its banner, then prompts <code>&gt; </code> in a loop</li><li><code>remember</code> — asks what to keep (a second <code>input()</code>) and adds it to the hoard list</li><li><code>recall</code> — recites every hoarded thing, one per line</li><li><code>count</code> — reports the hoard's size with <code>len()</code>, computed</li><li><code>farewell</code> — one parting line, then the loop ends</li><li>Unknown words get the puzzled reply; empty lines are ignored, not fatal</li><li>Prove it with the WHISPER box, e.g. <code>remember\\nmoss\\ncount\\nrecall\\nfarewell</code></li></ul>"
reward = 250
packages = []
xray = "VYSSA docks scales for: a counter variable maintained by hand where len() was owed, recall printing the raw list with brackets instead of one item per line, farewell that exits without a word, and a loop that dies on the first unknown command. She grants favor for numbering the recall lines, for a hoard that reports emptiness gracefully, and for surviving EOF on the whisper's last line."

[freestyle.badge]
id = "badge-s03"
name = "THE RAISING"
desc = "The Familiar entire: it wakes, listens, remembers, and only sleeps when told."

[[freestyle.rubric]]
criterion = "It runs clean"
weight = 25
desc = "The whole command script runs through the whisper box without a traceback."

[[freestyle.rubric]]
criterion = "The coil holds"
weight = 25
desc = "while loop with a working farewell exit; empty and unknown input survive."

[[freestyle.rubric]]
criterion = "The hoard is real"
weight = 30
desc = "A list appended by remember, walked by recall with for, measured by len() for count."

[[freestyle.rubric]]
criterion = "A clean hand"
weight = 20
desc = "strip/lower on commands, snake_case, the three coils' lessons visibly applied."
