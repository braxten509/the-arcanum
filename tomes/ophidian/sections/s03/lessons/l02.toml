[[lessons]]
id = "s03-l02"
title = "The hoard — lists, append and len"
body = '''

<p>A <strong>list</strong> is an ordered hoard, written in square brackets:</p>
<pre><code>hoard = [<span class="s">"mouse"</span>, <span class="s">"egg"</span>]
hoard.append(<span class="s">"beetle"</span>)      <span class="c"># the hoard grows at the tail</span>
<span class="k">print</span>(len(hoard))           <span class="c"># 3 — len counts any collection</span>
<span class="k">print</span>(hoard[0])             <span class="c"># mouse — positions start at 0</span></code></pre>
<p>Four moves cover most hoard-keeping:</p>
<ul>
<li><code>hoard.append(x)</code> — swallow x, keep it at the end.</li>
<li><code>len(hoard)</code> — how many things are kept. Never keep a separate tally by hand; <code>len</code> is always right and your tally eventually is not.</li>
<li><code>hoard[i]</code> — the item at position i, <strong>counting from 0</strong>. Reaching past the end raises <code>IndexError</code>.</li>
<li><code>x in hoard</code> — <code>True</code> if x is somewhere inside; the membership taste-test.</li>
</ul>
<p>An empty hoard is <code>[]</code> — every Familiar starts with one.</p>
<div class="callout">Printing the raw list — <code>print(hoard)</code> — shows brackets and quotes: <code>['mouse', 'egg']</code>. Fine for your own eyes while debugging; rude in the creature's voice. Recitation, one item per line, is the next lesson's walk.</div><div class="field-notes"><div class="fn-head">FIELD NOTES // IN VYSSA'S HAND</div>
<p><strong>The tail end:</strong> <code>hoard[-1]</code> is the last item, <code>[-2]</code> the one before — negative positions count from the tail. No arithmetic with len needed.</p>
<p><strong>Disgorging:</strong> <code>hoard.remove("egg")</code> drops the first matching item (ValueError if absent); <code>hoard.pop()</code> removes and returns the tail. </p>
<p><strong>Lists hold anything,</strong> numbers included — <code>weights = [12, 40, 7]</code> — and <code>sum(weights)</code>, <code>max(weights)</code>, <code>min(weights)</code> do the arithmetic of the whole hoard in one word each.</p></div>'''

[[lessons.readings]]
label = "Python docs — Lists (introduction)"
url = "https://docs.python.org/3/tutorial/introduction.html#lists"

[[lessons.exercises]]
id = "s03-l02-e1"
type = "mc"
points = 15
code = "hoard = [\"mouse\", \"egg\", \"beetle\"]\nprint(hoard[1])"
prompt = "What does this print?"
choices = ["mouse", "egg", "beetle", "an IndexError"]
answer = 1
hint = "Positions start at 0, so [1] is the second thing swallowed."
explain = "Index 0 is mouse, 1 is egg — zero-based counting, forever."

[[lessons.exercises]]
id = "s03-l02-e2"
type = "text"
points = 20
prompt = "Name the list method that adds one item to the end of the hoard."
answer = "append"
accept = ["append()", ".append", ".append()"]
hint = "The Familiar does it to every mouse: swallow, keep at the tail."

[[lessons.exercises]]
id = "s03-l02-d1"
type = "type"
points = 12
reps = 2
prompt = "Copy the swallowing motion, twice — dot, method, parentheses."
code = "hoard.append(offering)"

[[lessons.exercises]]
id = "s03-l02-w1"
type = "write"
points = 32
prompt = "Bookkeeping of the hoard. Starting from the list below, append <code>\"beetle\"</code>, then print exactly <code>HOARD 3</code> where 3 is <code>len()</code> of the grown hoard — measured, not typed."
starter = '''
hoard = ["mouse", "egg"]
# append "beetle", then print:  HOARD <len of the hoard>
'''
expect = "HOARD 3"
hint = "hoard.append(\"beetle\") then print(f\"HOARD {len(hoard)}\")."
