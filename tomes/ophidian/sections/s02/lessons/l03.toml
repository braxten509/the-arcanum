[[lessons]]
id = "s02-l03"
title = "The fork — if, elif, else"
body = '''

<p>Here is the serpent's whole philosophy in four lines:</p>
<pre><code><span class="k">if</span> mood == <span class="s">"hungry"</span>:
    <span class="k">print</span>(<span class="s">"It stalks the terrarium."</span>)
<span class="k">else</span>:
    <span class="k">print</span>(<span class="s">"It sleeps in the warm corner."</span>)</code></pre>
<p>Three rules carry everything:</p>
<ul>
<li><strong><code>==</code> asks, <code>=</code> binds.</strong> The double sign compares and yields <code>True</code> or <code>False</code>; the single sign is assignment and is a syntax error inside an <code>if</code>.</li>
<li><strong>The colon opens the branch; indentation is the branch.</strong> Everything indented (4 spaces, by iron convention) under the <code>if</code> belongs to it. Python has no braces — the whitespace <em>is</em> the structure.</li>
<li><strong><code>elif</code> chains forks; <code>else</code> catches the rest.</strong> The chain is checked top to bottom and the <em>first</em> true branch runs — the others are never tasted.</li>
</ul>
<pre><code><span class="k">if</span> command == <span class="s">"speak"</span>:
    <span class="k">print</span>(<span class="s">"Sssss."</span>)
<span class="k">elif</span> command == <span class="s">"sleep"</span>:
    <span class="k">print</span>(<span class="s">"It coils and stills."</span>)
<span class="k">else</span>:
    <span class="k">print</span>(<span class="s">f"It does not know '{command}'."</span>)</code></pre>
<p>Comparisons beyond equality: <code>!=</code>, <code>&lt;</code>, <code>&lt;=</code>, <code>&gt;</code>, <code>&gt;=</code> — they work on numbers and (alphabetically) on strings.</p>
<div class="callout">Mixed tabs and spaces are the adder in the woodpile: invisible, and Python dies of an <code>IndentationError</code>. Set your editor to spaces and never think of it again — the desk's editor already is.</div><div class="field-notes"><div class="fn-head">FIELD NOTES // IN VYSSA'S HAND</div>
<p><strong>Combining scents:</strong> <code>and</code>, <code>or</code>, <code>not</code> — <code>if weight &lt; 20 and warm:</code>. Each side must be a full comparison: <code>if x == 1 or x == 2</code>, never <code>if x == 1 or 2</code> (the 2 alone is always truthy — a classic mis-scent).</p>
<p><strong>Truthiness:</strong> empty string, <code>0</code>, and empty collections count as <code>False</code> in an <code>if</code>; everything else as <code>True</code>. <code>if command:</code> is the idiom for "did they type anything at all."</p></div>'''

[[lessons.readings]]
label = "Python docs — More Control Flow Tools (if)"
url = "https://docs.python.org/3/tutorial/controlflow.html"

[[lessons.exercises]]
id = "s02-l03-e1"
type = "mc"
points = 15
prompt = "Which operator asks \"are these equal?\" in a Python condition?"
choices = ["==", "=", "===", "eq"]
answer = 0
hint = "Twice the sign of assignment; Python has no triple."
explain = "= binds a name; == compares. (=== belongs to other tongues.)"

[[lessons.exercises]]
id = "s02-l03-e2"
type = "fill"
points = 20
prompt = "Fill the blank: the middle branch of a three-way fork, tested only when the <code>if</code> above it was false."
code = "if mood == \"hungry\":\n    print(\"hunt\")\n____ mood == \"sleepy\":\n    print(\"coil\")\nelse:\n    print(\"stare\")"
answer = "elif"
hint = "Not a second if — the chained word, five letters."

[[lessons.exercises]]
id = "s02-l03-d1"
type = "type"
points = 12
reps = 2
prompt = "Copy the smallest complete fork, twice — colons, four-space indents and all."
code = "if rings > 5:\n    print(\"an elder coil\")\nelse:\n    print(\"still growing\")"

[[lessons.exercises]]
id = "s02-l03-w1"
type = "write"
points = 32
prompt = "The recognition test. Read one word; if it is exactly <code>hiss</code> answer <code>The familiar hisses back.</code>, otherwise answer <code>The familiar stares.</code> The whisper says <code>hiss</code> — but both branches must exist."
stdin = "hiss"
expect = "The familiar hisses back."
hint = "word = input()  then an if word == \"hiss\": / else: pair — mind the final periods."
