[[lessons]]
id = "s02-l02"
title = "Numbers from words — int()"
body = '''

<p>The keeper says <code>"3"</code>; the Familiar must <em>count</em> 3. Between the two stands <code>int()</code> — the fang that turns a numeric string into a true integer:</p>
<pre><code>mice = <span class="k">int</span>(<span class="k">input</span>(<span class="s">"how many mice? "</span>))
<span class="k">print</span>(<span class="s">f"Twice that is {mice * 2}."</span>)</code></pre>
<p>Without the conversion, arithmetic betrays you in two distinct ways:</p>
<ul>
<li><code>"3" * 2</code> is <code>"33"</code> — string repetition, a perfectly legal wrong answer.</li>
<li><code>"3" + 2</code> is a <code>TypeError</code> — Python refuses to glue a string to an int.</li>
</ul>
<p>The reverse charm is <code>str()</code>, and <code>float()</code> reads decimal strings (<code>"2.5"</code>). All three are conversions, not mutations — <code>int(word)</code> returns a new value and leaves <code>word</code> as it was.</p>
<div class="callout">Feed <code>int()</code> something that is not a number — <code>int("moss")</code> — and it raises <code>ValueError</code>, killing the script mid-hiss. Convert only what should be numeric, at the moment you need the number.</div><div class="field-notes"><div class="fn-head">FIELD NOTES // IN VYSSA'S HAND</div>
<p><strong>int() is strict but tolerant of edges:</strong> it forgives surrounding spaces (<code>int(" 7 ")</code> works) and a sign (<code>int("-3")</code>), but not decimals — <code>int("3.5")</code> raises. Go through <code>float()</code> first if the keeper writes fractions.</p>
<p><strong>The guarded version</strong> you will earn later: <code>try: n = int(word)</code> / <code>except ValueError:</code> — the Familiar flinches instead of dying. Coil III's field notes return to this.</p></div>'''

[[lessons.exercises]]
id = "s02-l02-e1"
type = "text"
points = 20
prompt = "Name the built-in that converts the string <code>\"7\"</code> into the integer 7."
answer = "int"
accept = ["int()"]
hint = "Three letters, same as the type it produces."

[[lessons.exercises]]
id = "s02-l02-e2"
type = "mc"
points = 15
code = "word = \"3\"\nprint(word * 2)"
prompt = "What does this print?"
choices = ["6", "an error — strings don't multiply", "3 3", "33"]
answer = 3
hint = "Multiplying a string repeats it — no conversion happened."
explain = "\"3\" * 2 is string repetition: \"33\". Only int(word) * 2 counts mice."

[[lessons.exercises]]
id = "s02-l02-w1"
type = "write"
points = 32
prompt = "Supper arithmetic. Read the mouse-count from the keyboard (the whisper says <code>6</code>), double it for the growing season, and print exactly <code>SUPPER 12</code> — computed from the input."
stdin = "6"
expect = "SUPPER 12"
hint = "mice = int(input())  then  print(f\"SUPPER {mice * 2}\")."
