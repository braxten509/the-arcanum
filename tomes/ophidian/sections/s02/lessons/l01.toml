[[lessons]]
id = "s02-l01"
title = "Ears at last — input()"
body = '''

<p>Until now the Familiar only spoke. <code>input()</code> makes it listen: the script <strong>stops</strong>, waits for a line from the keyboard, and hands it back as a string when Enter falls.</p>
<pre><code>offering = <span class="k">input</span>(<span class="s">"What do you offer? "</span>)
<span class="k">print</span>(<span class="s">f"You offered {offering}."</span>)</code></pre>
<p>The text you pass to <code>input()</code> is the <strong>prompt</strong> — printed without a newline, so the cursor waits at its end like a tongue tasting the air. It is optional: <code>input()</code> alone listens silently.</p>
<p>Two truths to tattoo somewhere:</p>
<ul>
<li><code>input()</code> <strong>always returns a string</strong> — even if the human typed <code>7</code>, you hold <code>"7"</code>.</li>
<li>Humans are messy. They type <code>" moss "</code> with stray spaces. <code>.strip()</code> sheds the whitespace from both ends: <code>offering.strip()</code>.</li>
</ul>
<div class="callout">In this study's inscriptions, the WHISPER box plays the human: each line you put there is served to one <code>input()</code> call, in order. Two inputs, two lines.</div><div class="field-notes"><div class="fn-head">FIELD NOTES // IN VYSSA'S HAND</div>
<p><strong>Chaining the shed:</strong> <code>input("? ").strip().lower()</code> reads, sheds spaces, and flattens case in one motion — the standard opening move for command words, so <code>SPEAK</code> and <code>speak</code> taste the same.</p>
<p><strong>When the keyboard runs dry</strong> (end of piped input), <code>input()</code> raises <code>EOFError</code>. You will meet it the day you loop over input; note it now, fear it later.</p></div>'''

[[lessons.readings]]
label = "Python docs — input()"
url = "https://docs.python.org/3/library/functions.html#input"

[[lessons.exercises]]
id = "s02-l01-e1"
type = "mc"
points = 15
prompt = "The human types <code>7</code> at an <code>input()</code> prompt. What does your variable hold?"
choices = ["The integer 7", "The string \"7\"", "The float 7.0", "Whatever type fits best"]
answer = 1
hint = "input() has exactly one return type, always."
explain = "input() always returns str. Converting to a number is your job — next lesson's fang."

[[lessons.exercises]]
id = "s02-l01-e2"
type = "fill"
points = 20
prompt = "Fill the blank so the Familiar listens with the prompt <code>speak: </code>."
code = "word = ____(\"speak: \")"
answer = "input"
hint = "The one built-in that stops and waits for the keyboard."

[[lessons.exercises]]
id = "s02-l01-w1"
type = "write"
points = 30
prompt = "The Familiar tastes its first offering. Read one line from the keyboard and answer with exactly <code>You offered moss.</code> when the whisper is <code>moss</code> — via f-string, so any offering would work."
stdin = "moss"
expect = "You offered moss."
hint = "offering = input()  then  print(f\"You offered {offering}.\") — the WHISPER box supplies moss."
