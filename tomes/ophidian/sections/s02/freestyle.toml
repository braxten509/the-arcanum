[freestyle]
title = "THE WORKING: The First Command"
brief = "Teach <code>main.py</code> to take one order. After its waking banner, it listens once and acts.<ul><li>Still prints <code>FAMILIAR v0.1</code> first — the waking is not undone</li><li>Reads one command with <code>input()</code></li><li><code>speak</code> — it hisses a line of your choosing</li><li><code>supper</code> — it asks how many mice (a second <code>input()</code>), then reports the hunt with a computed total, e.g. 3 mice at 12 grams each</li><li>Anything else — a puzzled line naming the unknown command (f-string)</li><li>Prove it with the WHISPER box, e.g. <code>supper\\n3</code></li></ul>"
reward = 200
packages = []
xray = "VYSSA docks scales for: a supper total that ignores the typed count (hardcoded arithmetic), int() applied before checking the command word (crashing 'speak'), and an else branch that answers every unknown word with the same canned line that never names the offender. She grants favor for .strip() on the command, .lower() so SPEAK obeys too, and any second computed detail in the supper report."

[freestyle.badge]
id = "badge-s02"
name = "THE FORKED TONGUE"
desc = "The Familiar heard an order, tasted it, and chose."

[[freestyle.rubric]]
criterion = "It runs clean"
weight = 25
desc = "Runs without error for speak, supper with a number, and an unknown word."

[[freestyle.rubric]]
criterion = "The fork holds"
weight = 30
desc = "if/elif/else structure; each command lands in its own branch; unknown words fall to else."

[[freestyle.rubric]]
criterion = "It listens and computes"
weight = 30
desc = "input() drives the branch; supper's total is int(count) arithmetic, not a constant."

[[freestyle.rubric]]
criterion = "A clean hand"
weight = 15
desc = "strip/lower on the command, snake_case, no unreachable branches."
