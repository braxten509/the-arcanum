id = "s02"
codename = "COIL II // THE FORKED TONGUE"
short = "The Forked Tongue"
title = "Listening & Deciding — input, int() and the if-fork"
build = "The Familiar hears one command and answers it with a forked tongue"
brief = "A serpent's tongue is forked because every scent is a decision: <em>this way, or that</em>. This coil gives the Familiar ears — <code>input()</code> — and judgement — <code>if</code>, <code>elif</code>, <code>else</code>. You will convert words to numbers with <code>int()</code> and teach the creature its first commands. The Great Working: the Familiar hears ONE order and obeys it. VYSSA's margin note: \"a serpent that cannot choose starves between two mice.\""
