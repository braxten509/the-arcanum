brief = "Every serpent begins blind, tasting the air. This coil teaches your Familiar its first sense: <em>speech</em>. You will learn what a Python script is, how <code>print</code> pushes words through the speaking stone, how to keep values in named variables, and how f-strings braid the two together. At its end, the Great Working: the Familiar opens one green eye and introduces itself. VYSSA's margin note: \"a serpent that cannot hiss cannot hunt.\""
