[[lessons]]
id = "s01-l01"
title = "The first hiss — print and the speaking stone"
body = '''

<p>A Python script is a scroll read <strong>top to bottom</strong> — no ceremony, no boilerplate. The first line is the first thing that happens. Your entire first program can be one line:</p>
<pre><code><span class="k">print</span>(<span class="s">"The Familiar wakes."</span>)</code></pre>
<p><code>print</code> takes what you give it and pushes it through the speaking stone (your terminal), followed by a new line. The text between quotes is a <strong>string</strong> — Python accepts <code>"double"</code> or <code>'single'</code> quotes; pick one and be consistent.</p>
<p>Call <code>print</code> once per line of speech. Three calls, three lines:</p>
<pre><code><span class="k">print</span>(<span class="s">"FAMILIAR v0.1"</span>)
<span class="k">print</span>(<span class="s">"A green eye opens."</span>)
<span class="k">print</span>(<span class="s">"It tastes the air."</span>)</code></pre>
<div class="callout">The quotes are the handler's gloves — they mark where the string begins and ends. Forget the closing quote and Python refuses the whole scroll with a <code>SyntaxError</code>. Read the error's line number; the wound is usually there or the line above.</div><div class="field-notes"><div class="fn-head">FIELD NOTES // IN VYSSA'S HAND</div>
<p><strong>print with several gifts:</strong> <code>print("rings:", 7)</code> takes multiple arguments and joins them with single spaces — quick for inspection, crude for presentation. You will braid strings properly in the third lesson.</p>
<p><strong>The empty hiss:</strong> <code>print()</code> alone emits a blank line. Useful for spacing a report.</p>
<p><strong>Comments:</strong> anything after <code>#</code> on a line is ignored by Python — margin notes for the next reader, who is usually you, older and crosser.</p></div>'''

[[lessons.readings]]
label = "Python docs — An Informal Introduction"
url = "https://docs.python.org/3/tutorial/introduction.html"

[[lessons.exercises]]
id = "s01-l01-e1"
type = "mc"
points = 15
prompt = "A Python script runs in what order?"
choices = ["Top to bottom, first line first", "Alphabetically by variable name", "It starts at a required main() function", "The order is chosen by the interpreter"]
answer = 0
hint = "No ceremony, no boilerplate — the scroll is simply read."
explain = "Python executes a script line by line from the top. A main() guard exists as a convention, but nothing requires it."

[[lessons.exercises]]
id = "s01-l01-e2"
type = "text"
points = 20
prompt = "Name the built-in function that writes a line of text to the terminal."
answer = "print"
accept = ["print()"]
hint = "You have already called it three times this lesson."

[[lessons.exercises]]
id = "s01-l01-d1"
type = "type"
points = 12
reps = 2
prompt = "Copy the Familiar's first breath, twice, until your fingers know the shape of the quotes. (Ctrl+Enter submits.)"
code = "print(\"The Familiar wakes.\")"

[[lessons.exercises]]
id = "s01-l01-w1"
type = "write"
points = 30
prompt = "Your first INSCRIPTION — this truly runs through python3. Write a script whose output is exactly the two lines: <code>FAMILIAR v0.1</code> then <code>A green eye opens.</code>"
expect = '''
FAMILIAR v0.1
A green eye opens.'''
hint = "Two print calls, one per line, text matching exactly — capitals and the final period included."
