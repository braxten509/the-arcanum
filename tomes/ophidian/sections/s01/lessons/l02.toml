[[lessons]]
id = "s01-l02"
title = "Names for things — variables and numbers"
body = '''

<p>A serpent remembers where the warm rock is. Your script remembers with <strong>variables</strong> — a name bound to a value with a single <code>=</code>:</p>
<pre><code>name = <span class="s">"Ssevrin"</span>   <span class="c"># a string</span>
rings = 7            <span class="c"># an integer — no quotes, it's a number</span>
rings = rings + 1    <span class="c"># it shed and grew: rebind the name to a new value</span></code></pre>
<p>Numbers do arithmetic with the operators you expect: <code>+</code> <code>-</code> <code>*</code> <code>/</code>. Note that <code>/</code> always yields a decimal (<code>7 / 2</code> is <code>3.5</code>).</p>
<pre><code>clutch = 3
eggs_per = 7
total = clutch * eggs_per     <span class="c"># 21 — computed, not counted by hand</span>
<span class="k">print</span>(total)</code></pre>
<p>Variable names in Python are written <code>lowercase_snake_case</code> by convention: <code>eggs_per</code>, not <code>EggsPer</code>. A name must start with a letter or underscore and may not contain spaces.</p>
<div class="callout">One <code>=</code> means <em>bind</em>: take the right side's value, give it the left side's name. It is not an equation — <code>rings = rings + 1</code> is nonsense in algebra and everyday Python here.</div><div class="field-notes"><div class="fn-head">FIELD NOTES // IN VYSSA'S HAND</div>
<p><strong>Whole-number division:</strong> <code>//</code> divides and floors (<code>7 // 2</code> is <code>3</code>); <code>%</code> gives the remainder (<code>7 % 2</code> is <code>1</code>). The pair answers "how many whole mice, and what's left over."</p>
<p><strong>Rebinding changes type freely:</strong> <code>x = 3</code> then <code>x = "three"</code> is legal — the name just points elsewhere. Legal, and a fine way to confuse yourself; keep a name meaning one kind of thing.</p>
<p><strong>Seeing a type:</strong> <code>type(rings)</code> names a value's kind — <code>int</code>, <code>str</code>, <code>float</code>. Useful when a \"number\" refuses arithmetic because it is secretly a string.</p></div>'''

[[lessons.exercises]]
id = "s01-l02-e1"
type = "mc"
points = 15
prompt = "Which of these is a legal Python variable name?"
choices = ["2nd-skin", "shed count", "shed_count", "shed.count"]
answer = 2
hint = "No spaces, no dashes, no dots — one of these follows lowercase_snake_case."
explain = "Names use letters, digits and underscores, and cannot start with a digit. shed_count is the snake_case way."

[[lessons.exercises]]
id = "s01-l02-e2"
type = "fill"
points = 20
prompt = "The Familiar had 3 scales and grew. Fill the blank so <code>scales</code> ends holding <strong>5</strong>."
code = "scales = 3\nscales = scales + ____"
answer = "2"
hint = "It rebinds scales to its old value plus the blank."

[[lessons.exercises]]
id = "s01-l02-e3"
type = "mc"
points = 15
code = "eggs = 4\neggs = eggs * 2\nprint(eggs)"
prompt = "What does this script print?"
choices = ["4", "8", "eggs * 2", "an error — eggs is already bound"]
answer = 1
hint = "The second line rebinds the name to the doubled value before printing."

[[lessons.exercises]]
id = "s01-l02-w1"
type = "write"
points = 30
prompt = "The clutch is laid: 3 nests, 7 eggs in each. Starting from the variables below, compute the venom stockpile and print exactly <code>VENOM 21</code> — the 21 must come from arithmetic, not your keyboard."
starter = '''
clutch = 3
per_egg = 7
# print exactly:  VENOM 21   (computed from the two variables)
'''
expect = "VENOM 21"
hint = "print(\"VENOM\", clutch * per_egg) — print joins its arguments with a space."
