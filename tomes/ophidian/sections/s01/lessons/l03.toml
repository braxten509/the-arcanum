[[lessons]]
id = "s01-l03"
title = "The braided tongue — f-strings"
body = '''

<p>The Familiar must speak <em>about</em> what it knows — weave variables into sentences. The Python way is the <strong>f-string</strong>: put <code>f</code> before the opening quote, then drop expressions into <code>{braces}</code>:</p>
<pre><code>name = <span class="s">"Ssevrin"</span>
rings = 7
<span class="k">print</span>(<span class="s">f"I am {name}, of {rings} rings."</span>)
<span class="c"># I am Ssevrin, of 7 rings.</span></code></pre>
<p>The braces take any expression, not just a bare name — arithmetic happens right inside the sentence:</p>
<pre><code><span class="k">print</span>(<span class="s">f"Next shed I will have {rings + 1} rings."</span>)</code></pre>
<p>Before f-strings you will meet two older idioms in the wild: gluing with <code>+</code> (which demands everything already be a string — <code>"rings: " + str(rings)</code>) and <code>.format()</code>. Read them when found; write f-strings yourself.</p>
<div class="callout">Forget the <code>f</code> and Python prints your braces literally: <code>I am {name}</code>. No error, just a very stupid-sounding serpent. If braces appear in your output, look for the missing letter.</div><div class="field-notes"><div class="fn-head">FIELD NOTES // IN VYSSA'S HAND</div>
<p><strong>str() is the swallowing charm:</strong> <code>str(7)</code> turns a number into the string <code>"7"</code>. You need it for <code>+</code>-gluing; f-strings do the conversion for you inside the braces.</p>
<p><strong>Format spells inside the braces:</strong> <code>f"{length:.1f} cm"</code> rounds a decimal to one place; <code>f"{count:3}"</code> pads to width 3. A colon after the expression starts the format spec — worth a bookmark, not memorization, at this stage.</p>
<p><strong>Literal braces:</strong> to print an actual <code>{</code> inside an f-string, double it: <code>{{</code>.</p></div>'''

[[lessons.readings]]
label = "Python docs — Formatted String Literals"
url = "https://docs.python.org/3/tutorial/inputoutput.html#formatted-string-literals"

[[lessons.exercises]]
id = "s01-l03-e1"
type = "mc"
points = 15
code = "scales = 9"
prompt = "Which line prints <code>I have 9 scales</code>?"
choices = ["print(\"I have {scales} scales\")", "print(f\"I have scales scales\")", "print(\"I have\" + scales + \"scales\")", "print(f\"I have {scales} scales\")"]
answer = 3
hint = "It needs both the f and the braces; + with a bare int is a TypeError."
explain = "Without the f the braces print literally; + demands str(scales); option 4 braids it correctly."

[[lessons.exercises]]
id = "s01-l03-e2"
type = "text"
points = 20
prompt = "What single letter goes immediately before the opening quote to make a string interpolate its braces?"
answer = "f"
accept = ["the letter f", "f prefix"]
hint = "It's the string's given name — an ...-string."

[[lessons.exercises]]
id = "s01-l03-d1"
type = "type"
points = 12
reps = 2
prompt = "Copy the braided introduction, twice — mind the f, the braces, and the comma."
code = "print(f\"I am {name}, of {rings} rings.\")"

[[lessons.exercises]]
id = "s01-l03-w1"
type = "write"
points = 30
prompt = "The Familiar stirs and announces its coiling. From the starter variables, print exactly <code>Ssevrin coils 4 times.</code> using one f-string — both values must come from the variables."
starter = '''
name = "Ssevrin"
turns = 4
# print exactly:  Ssevrin coils 4 times.   (one f-string, both variables)
'''
expect = "Ssevrin coils 4 times."
hint = "print(f\"{name} coils {turns} times.\") — note the final period."
