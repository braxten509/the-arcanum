[freestyle]
title = "THE WORKING: The Waking"
brief = "Turn <code>main.py</code> into the Familiar's first breath.<ul><li>Prints <code>FAMILIAR v0.1</code> as its very first line</li><li>Keeps its name and its number of rings in <strong>variables</strong></li><li>Introduces itself with an f-string that uses both, e.g. <code>I am Ssevrin, of 7 rings.</code></li><li>Computes and prints its length as <code>rings * 10</code> centimetres, e.g. <code>My coils measure 70 cm.</code> — computed, never hardcoded</li><li>No <code>input()</code> yet — it wakes, it speaks, it is done</li></ul>"
reward = 150
packages = []
xray = "VYSSA docks scales for: the length hardcoded as a bare 70 instead of computed from the ring variable, the banner printed anywhere but first, and name repeated as a string literal where the variable should be. She grants favor for a second computed line she didn't ask for (age in sheds, weight in mice — anything arithmetic) and for tidy lowercase_snake variable names."

