[freestyle]
title = "THE WORKING: FIRST INK"
brief = "Wake the first page of Writforge and prove the script can speak.<ul><li>start the file with a Perl shebang and <code>use v5.36;</code></li><li>declare three scalars: one scribe name, one ink name, and one page count</li><li>use <code>$_</code> for the first output line and a named scalar for the second</li><li>print exactly two lines: <code>SCRIBE Mara</code> and <code>INK cinnabar ON 3 PAGES</code></li></ul>"
reward = 150
xray = "The grader will dock any banner that hides everything inside one hardcoded string, skips the modern Perl header, or ignores the difference between a named scalar and the default topic scalar. He rewards a clean, direct first script that uses line-based output the way this chapter taught it."

[freestyle.badge]
id = "badge-s01"
name = "FIRST INK"
desc = "Wrote the first usable page of Writforge."

[[freestyle.rubric]]
criterion = "Compiles & runs"
weight = 30
desc = "The script runs in Perl 5.36 without syntax errors or runtime crashes."

[[freestyle.rubric]]
criterion = "Meets the brief"
weight = 25
desc = "The required lines appear exactly, and the page uses both a named scalar and the default topic scalar."

[[freestyle.rubric]]
criterion = "Uses taught foundations"
weight = 30
desc = "The solution stays inside s01 material: shebang, use v5.36, my scalars, say, interpolation, and $_."

[[freestyle.rubric]]
criterion = "Perl style & layout"
weight = 15
desc = "Uses Perl's current house style here: `use v5.36;`, lexical `my` scalars, `say` for line output, one statement per line, and spaces around concatenation."
