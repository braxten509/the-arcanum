[[lessons]]
id = "s01-l03"
title = "The Hidden Topic"
body = '''
<p>Perl keeps a default workspace called <code>$_</code>. In a small script, that can be a useful convenience: set the scalar once, and a builtin can read it without repeating the name. The habit is not magic. It is a shorthand. The danger is also plain: if you forget what lives there, you will read the wrong thing and blame the language instead of the page.</p>
<p>This chapter keeps the example narrow. <code>say</code> with no arguments prints the current value of <code>$_</code>. A function such as <code>length</code> can also inspect that same topic value when you do not hand it a different scalar. That is enough to learn the pattern without dragging in loops or file input before their time. The lesson is not that Perl hides work. The lesson is that Perl lets you choose when to name the thing explicitly and when the current topic is already obvious.</p>
<p><code>print</code> belongs in the same family, but it is the sharper tool. It writes the text and leaves the newline decision to you. <code>say</code> wraps that decision in the builtin so the first scripts stay readable. The rule for this canto is simple: if the value is already parked in <code>$_</code>, use the default when it makes the line clearer; if the line needs a named scalar to stay honest, name it. Precision matters more than cleverness.</p>
<p>When you move through larger scripts, treat <code>$_</code> like a lamp on the desk. Use it while the topic is obvious; replace it with a named scalar when clarity starts to slip. The habit matters because many Perl builtins quietly respect that default value. If you know what sits there, the shorthand saves keystrokes. If you do not, it becomes a trap.</p>
<pre><code>$_ = "wax";
say;
say length $_;</code></pre>
<div class="field-notes"><div class="fn-head">FIELD NOTES // THE DEFAULT SLOT</div>
<p><strong>Default note.</strong> <code>$_</code> is the current topic, not a special kind of container. It is still just a scalar.</p>
<p><strong>Printer note.</strong> <code>print</code> is useful later when the chapter starts caring about exact byte-for-byte output. Right now, <code>say</code> keeps the line boundary visible.</p></div>
'''

[[lessons.readings]]
label = "Perl special variables"
url = "https://perldoc.perl.org/perlvar"

[[lessons.exercises]]
id = "s01-l03-d1"
type = "type"
points = 12
reps = 2
prompt = "<p>Retype the default-topic example exactly. Keep <code>$_</code> on its own line before the first <code>say</code>.</p>"
code = '''
$_ = "wax";
say;
say length $_;
'''

[[lessons.exercises]]
id = "s01-l03-e1"
type = "text"
points = 20
prompt = "<p>If <code>$_ = &quot;wax&quot;; say;</code>, what prints?</p>"
answer = "wax"
hint = "The builtin reads the value stored in the default topic slot."
whyWrong = "You are answering with the variable's name instead of its contents. `say` with no arguments prints the current value of `$_`."

[[lessons.exercises]]
id = "s01-l03-e2"
type = "fill"
points = 20
prompt = "<p>Put the default scalar back on the left side of the assignment.</p>"
code = '____ = "wax"; say;'
answer = "$_"
hint = "This is the same topic scalar the lesson just described."
whyWrong = "You are naming an ordinary scalar slot instead of the default topic scalar that `say` will use."

[[lessons.exercises]]
id = "s01-l03-e3"
type = "mc"
points = 15
prompt = "<p>What is the best description of <code>$_</code> in this lesson?</p>"
choices = ["An array that holds every line in the script.", "A special filehandle that only print can use.", "The default scalar many Perl builtins use when you omit an argument.", "A regex metacharacter that only works inside patterns."]
answer = 2
whyWrong = "You are turning a plain scalar into a collection, a filehandle, or a regex trick. In Perl, `$_` is just the current topic value."
hint = "Think about the scalar that `say;` reads when you do not pass a different one."
explain = "`$_` is the default scalar. It is a normal scalar value that many Perl builtins inspect when you leave out an explicit argument."

[[lessons.exercises]]
id = "s01-l03-w1"
type = "write"
points = 30
prompt = "<p>Use the starter values to print exactly two lines: the first must come from <code>$_</code>, and the second must read <code>label Writforge</code>.</p>"
starter = '''
#!/usr/bin/env perl
use v5.36;

$_ = "soft ash";
my $label = "Writforge";

# Print exactly:
# soft ash
# label Writforge
'''
expect = '''
soft ash
label Writforge'''
hint = "The first line can be `say;`; the second line should combine the literal word `label` with the named scalar."
