id = "s01"
codename = "CHAPTER I // THE FIRST FLAME"
short = "The First Flame"
title = "Foundations of a First Script"
build = "Bootstraps the first Perl script: scalars, printing, interpolation, and the default topic scalar."
brief = "<p>The first canto opens the lamp, not the vault. A scribe learns one file, one scalar, one line of output, and the habit of spelling the language the way the interpreter expects.</p><ul><li>declare scalars with <code>$</code></li><li>print with <code>say</code> under <code>use v5.36;</code></li><li>combine text cleanly, then lean on <code>$_</code> when the default value is the right one</li></ul>"
