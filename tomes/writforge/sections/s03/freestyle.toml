[freestyle]
title = "THE WORKING: THE LINE LEDGER"
brief = "Turn the first sort into a line ledger.<ul><li>keep the starter <code>classify_line</code> helper and <code>use v5.36;</code></li><li>store the sample manuscript lines in an array and print them in original order with 1-based numbers</li><li>print the summary line exactly <code>LEDGER 4</code></li><li>use an array operation from this chapter instead of hardcoding the transcript</li></ul>"
reward = 180
xray = "The grader docks scripts that flatten the ledger into one banner string, lose the original order, or fake the total with a literal. It rewards a clean array walk, a separate counter or scalar count, and the reuse of the earlier classifier instead of a copy-pasted label list."

[freestyle.badge]
id = "badge-s03"
name = "ORDERED SHELF"
desc = "Kept the manuscript lines in order and turned the stack into a ledger."

[[freestyle.rubric]]               # weights MUST sum to exactly 100
criterion = "Compiles & runs"
weight = 20
desc = "Perl 5.36 accepts the script and it runs without syntax errors or runtime crashes on the starter data."

[[freestyle.rubric]]
criterion = "Correct ledger output"
weight = 35
desc = "The script prints the four numbered labels in source order and ends with the exact summary line `LEDGER 4`."

[[freestyle.rubric]]
criterion = "Uses arrays and interleaves the earlier helper"
weight = 30
desc = "The solution keeps the manuscript lines in an array, walks them with a loop, and reuses `classify_line` from the previous chapter rather than hardcoding the labels."

[[freestyle.rubric]]
criterion = "Perl style & layout"
weight = 15
desc = "Uses Perl's current style here: `use v5.36;`, lexical `my` scratch variables, lowercase subroutine names, spaces around operators, same-line opening braces, and closing braces aligned with the keyword."
