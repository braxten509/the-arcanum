id = "s03"
codename = "CHAPTER III // THE ORDERED SHELF"
short = "The Ordered Shelf"
title = "Arrays & Ordered Collections"
build = "Adds arrays, list handling, and ordered iteration so the manuscript can keep its lines in sequence."
brief = "<p>The third canto teaches the scribe to keep more than one line at a time. The classifier from the last chapter still stands, but now the script can store a whole run of manuscript lines, move them at the ends, and walk them in order without losing the page's spine.</p><ul><li>keep lines in <code>@arrays</code> and reach them by index</li><li>add and remove drafts with <code>push</code>, <code>pop</code>, <code>shift</code>, and <code>unshift</code></li><li>filter, reshape, and order lists with <code>foreach</code>, <code>grep</code>, <code>map</code>, <code>sort</code>, and <code>qw()</code></li></ul>"
