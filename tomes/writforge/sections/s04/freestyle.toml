[freestyle]
title = "THE WORKING: THE INDEX LEDGER"
brief = "Turn the archive ledger into a clean index.<ul><li>keep the starter arrays and hashes in the script</li><li>count the manuscript labels, look up the page titles, and print the report in the order the starter names</li><li>finish with the exact summary line <code>INDEX 3</code></li></ul>"
reward = 180
xray = "The grader docks scripts that sort the wrong thing, skip the hash lookup, or flatten the report into one banner string. It rewards a real array walk, hash-based counting, ordered lookup output, and Perl that reads like a careful ledger."

[freestyle.badge]
id = "badge-s04"
name = "INDEX LEDGER"
desc = "Counted the labels and turned the archive into a proper lookup table."

[[freestyle.rubric]]
criterion = "Compiles & runs"
weight = 20
desc = "Perl 5.36 accepts the script and it runs cleanly on the provided starter data."

[[freestyle.rubric]]
criterion = "Correct index ledger"
weight = 35
desc = "The report prints the requested lookup rows in the starter order and ends with the exact summary line `INDEX 3`."

[[freestyle.rubric]]
criterion = "Counts and lookups"
weight = 30
desc = "The solution counts the manuscript labels with a hash, uses the title lookup table, and keeps the array order as the display order."

[[freestyle.rubric]]
criterion = "Perl style & layout"
weight = 15
desc = "Uses Perl's current style here: `use v5.36;`, lexical `my` variables, lowercase subs when needed, spaces around operators, and braces aligned to the keyword."
