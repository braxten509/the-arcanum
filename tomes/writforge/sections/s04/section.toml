id = "s04"
codename = "CHAPTER IV // THE INDEX LEDGER"
short = "The Index Ledger"
title = "Hashes & Lookup Tables"
build = "Adds hash tables, key lookups, and frequency counts so the manuscript can index its labels and metadata."
brief = "<p>The fourth canto teaches the scribe when to stop walking the shelf and start naming the drawers. Arrays keep the lines in order; hashes answer questions about those lines without making the reader hunt through the whole stack. That is how the manuscript tool begins to count, look up, and audit without losing its place.</p><ul><li>count repeated labels with <code>%hash</code> and <code>$hash{key}</code></li><li>check, list, and walk entries with <code>exists</code>, <code>keys</code>, <code>values</code>, and <code>each</code></li><li>mix the arrays from the last canto with hashes that summarize the manuscript for the index page</li></ul>"
