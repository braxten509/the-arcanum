codename = "CHAPTER II // THE FIRST CUT"
short = "The First Cut"
title = "Control Flow & Subroutines"
build = "Adds branching, loops, and subroutines so the manuscript can classify one line at a time."
brief = "<p>The second canto teaches the hand to choose. The script still works from in-memory sample lines, but now it can sort them into blank, header, and body before later sections teach it to gather many lines from files.</p><ul><li>branch with <code>if</code>, <code>elsif</code>, and <code>else</code></li><li>repeat a pass with <code>while</code>, <code>for</code>, and <code>foreach</code></li><li>package the judgment in a <code>sub</code> that returns a label</li></ul>"
