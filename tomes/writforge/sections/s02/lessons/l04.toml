[[lessons]]
id = "s02-l04"
title = "Keep the Scratch Local"
body = '''
<p>Scope is the fence around a working desk. A scratch mark declared with <code>my</code> inside a block belongs there and nowhere else. That matters in loops and helper subs because the temporary names should not leak into the rest of the script. The classifier may be small, but small scripts still benefit from tidy walls around their scratch work.</p>
<p>A <code>for</code> loop can own its sample variable, and a separate counter can survive long enough to summarize the pass afterward. That is the shape the freestyles will need later: print each line's label, then remember how many headers you saw. Keep the names narrow and the result variable wider. The loop body does the work, and the summary line explains what happened after the loop is finished.</p>
<p>The same discipline applies inside a block. A private <code>$scratch</code> value can help build a label or a note, but once the closing brace arrives, that name should stop mattering. Perl is permissive, but permissive does not mean careless. The clean page is the one that keeps scratch names local, returns labels from helpers, and leaves the caller to decide what to print next.</p>
<pre><code>{
    my $scratch = "bookmark";
    say $scratch;
}

my $headers = 0;
for my $sample ("", "# Preface", "A paragraph", "# Addendum") {
    my $kind = classify_line($sample);
    say $kind;
    if ($kind eq "HEAD") {
        $headers = $headers + 1;
    }
}</code></pre>
<div class="field-notes"><div class="fn-head">FIELD NOTES // THE PRIVATE DESK</div>
<p><strong>Fence note.</strong> <code>my</code> makes a lexical variable, which means the name is visible only in the block or subroutine that declares it. That is exactly what a scratch mark should do.</p>
<p><strong>Loop note.</strong> <code>for my $sample (...)</code> gives each pass its own sample name. The counter or summary can stay outside the loop when the whole routine needs to remember it later.</p>
<p><strong>Summary note.</strong> The header count is a separate scalar because it survives after the loop ends. Scratch and summary solve different problems and should not share a name.</p></div>
'''

[[lessons.readings]]
label = "perlstyle: readable blocks and variables"
url = "https://perldoc.perl.org/perlstyle"

[[lessons.exercises]]
id = "s02-l04-e1"
type = "text"
points = 20
prompt = "<p>What happens to <code>my $scratch</code> declared inside a block after the closing brace?</p>"
answer = "it is out of scope"
accept = ["out of scope", "it is not visible outside the block"]
hint = "The block owns the scratch mark; the rest of the script does not."
whyWrong = "You are treating a lexical variable like it lives forever. In Perl, <code>my</code> keeps it inside the block that declared it."

[[lessons.exercises]]
id = "s02-l04-e2"
type = "mc"
points = 15
prompt = "<p>What does <code>my</code> do for the scratch variable in this lesson?</p>"
choices = ["It keeps the scratch variable private to the block or loop.", "It turns the scratch variable into a global label.", "It changes the variable's text into uppercase.", "It makes the variable return from the subroutine automatically."]
answer = 0
whyWrong = "You are turning lexical scope into a global effect or a formatting trick, but <code>my</code> simply narrows the variable's reach."
hint = "Think about what should stay visible after the block ends."
explain = "<code>my</code> gives the variable lexical scope, which keeps the scratch work local to the block or loop that declared it."

[[lessons.exercises]]
id = "s02-l04-d1"
type = "type"
points = 12
reps = 2
prompt = "<p>Retype the private scratch block exactly, including the braces.</p>"
code = '''
{
    my $scratch = "bookmark";
    say $scratch;
}
'''

[[lessons.exercises]]
id = "s02-l04-e3"
type = "fill"
points = 20
prompt = "<p>Restore the keyword that gives the loop its named sample variable.</p>"
code = '____ my $sample ("", "# Preface", "A paragraph", "# Addendum") {'
answer = "for"
hint = "This is the count-and-sample loop form, not the branch keyword."
whyWrong = "You are trying to make the loop into a branch or a function, but this line needs the loop keyword that introduces each pass."

[[lessons.exercises]]
id = "s02-l04-e4"
type = "mc"
points = 15
prompt = "<p>Where should the header counter live?</p>"
choices = ["Inside the <code>say</code> call as a string literal.", "In <code>$_</code>, because the current topic remembers counts.", "In a <code>my $headers</code> lexical declared before the loop.", "Inside the <code>return</code> statement of <code>classify_line</code>."]
answer = 2
whyWrong = "You are putting the counter in a place that cannot survive the loop. The tally has to live outside the pass so the summary can use it later."
hint = "The count must survive after the loop finishes."
explain = "The header tally should live in a lexical declared before the loop, so the loop can update it and the summary line can read it afterward."

[[lessons.exercises]]
id = "s02-l04-w1"
type = "write"
points = 30
prompt = "<p>Use the helper and loop in the starter to print the four labels, then a final summary line: <code>HEADERS 2</code>.</p>"
starter = '''
#!/usr/bin/env perl
use v5.36;

sub classify_line {
    my $line = shift;

    if ($line eq "") {
        return "BLANK";
    }
    if (substr($line, 0, 1) eq "#") {
        return "HEAD";
    }
    return "TEXT";
}

my $headers = 0;

for my $sample ("", "# Preface", "A paragraph", "# Addendum") {
    my $kind = classify_line($sample);

    # Task: print $kind and count the header lines.
}

say "HEADERS $headers";
'''
expect = '''
BLANK
HEAD
TEXT
HEAD
HEADERS 2'''
hint = "Print the label for each sample and increment the counter only when the returned label is HEAD."
