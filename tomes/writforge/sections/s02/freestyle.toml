[freestyle]
title = "THE WORKING: FIRST SORT"
brief = "Wake the first line sorter and prove the page can judge sample manuscript lines.<ul><li>start from the provided Perl header and keep <code>use v5.36;</code></li><li>print the four sample labels in order for <code>&quot;&quot;</code>, <code># Preface</code>, <code>A paragraph</code>, and <code># Addendum</code></li><li>finish with the summary line <code>HEADERS 2</code></li><li>use a helper subroutine and a loop; do not hardcode the labels as a single banner</li></ul>"
reward = 170
xray = "The grader will dock any script that prints the labels from one hardcoded string, leaves the helper as a printer instead of a returner, or loses the header tally outside the loop. He rewards a clean helper, a visible loop, and a private counter that survives to the final summary."

[freestyle.badge]
id = "badge-s02"
name = "FIRST SORT"
desc = "Sorted the first manuscript lines and kept count of the headings."

[[freestyle.rubric]]               # weights MUST sum to exactly 100
criterion = "Compiles & runs"
weight = 25
desc = "The script runs in Perl 5.36 without syntax errors or runtime crashes."

[[freestyle.rubric]]
criterion = "Correct line classification"
weight = 35
desc = "The four sample lines print BLANK, HEAD, TEXT, HEAD in that order, and the summary line is exactly HEADERS 2."

[[freestyle.rubric]]
criterion = "Uses taught control flow"
weight = 25
desc = "The solution uses a helper subroutine, a loop, and conditional branches from this chapter; the helper returns a label instead of printing one."

[[freestyle.rubric]]
criterion = "Perl style & layout"
weight = 15
desc = "Uses Perl's current style here: `use v5.36;`, lexical `my` scratch variables, `for my $sample (...)`, `sub name {}` blocks, spaces around operators, one statement per line, and the opening brace on the same line as the keyword."
