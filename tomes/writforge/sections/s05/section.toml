id = "s05"
codename = "CHAPTER V // THE MATCHING LENS"
short = "The Matching Lens"
title = "Regex Matching"
build = "Adds regex matching so the manuscript can spot headings, blanks, and token shapes before conversion."
brief = "<p>The fifth canto teaches the scribe to stop guessing with exact names and start reading shapes. The ledger from the hash chapter already knows how to count named things. Now the manuscript needs a lens that can recognize the outline of a heading, the hush of a blank line, and the rough cut of a token before later chapters change any ink.</p><ul><li>match manuscript lines with <code>=~</code> and <code>/.../</code></li><li>recognize literal punctuation, digits, word characters, and whitespace with regex metacharacters</li><li>separate headings, blanks, and body lines with anchors, quantifiers, and alternation</li></ul>"
