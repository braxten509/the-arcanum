[freestyle]
title = "THE WORKING: THE REGISTRY LENS"
brief = "Sharpen the manuscript scanner.<ul><li>classify the starter lines with regex, not string equality</li><li>print the counts for <code>HEAD</code>, <code>BLANK</code>, and <code>TEXT</code> in that order</li><li>end with <code>SCANNED 6</code></li></ul>"
reward = 180
xray = "The grader docks scripts that hardcode the totals, miss the spaces-only blank line, or use exact-string checks where the chapter asked for pattern matching. It rewards regex tests that separate headings, blank lines, and text from the starter array while keeping the hash ledger and Perl layout clean."

[freestyle.badge]
id = "badge-s05"
name = "MATCH LENS"
desc = "Read the manuscript by shape instead of by lucky exact text."

[[freestyle.rubric]]
criterion = "Compiles & runs"
weight = 20
desc = "Perl 5.36 accepts the script and it runs cleanly on the provided starter data."

[[freestyle.rubric]]
criterion = "Correct pattern ledger"
weight = 35
desc = "The script prints the heading, blank, and text counts in the required order and ends with the exact summary line `SCANNED 6`."

[[freestyle.rubric]]
criterion = "Regex logic"
weight = 30
desc = "The solution uses real regex tests for headings, blanks, and text, and keeps the starter array and hash ledger as separate jobs."

[[freestyle.rubric]]
criterion = "Perl style & layout"
weight = 15
desc = "Uses Perl's current conventions here: `use v5.36;`, lexical `my` variables, lowercase builtins like `say`, and clear indentation with spaces around operators."
