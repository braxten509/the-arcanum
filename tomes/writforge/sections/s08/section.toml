id = "s08"
codename = "CHAPTER VIII // THE LAST SHEET"
short = "The Last Sheet"
title = "References & Modules"
build = "Splits Writforge into parser and renderer packages, adds Getopt::Std flags, and emits the navigation index so the whole shelf becomes a finished site."
brief = "<p>The final canto gives the script its hands and sleeves. Writforge stops being a single page-factory and becomes a small, tidier codebase with parser and renderer roles, command-line knobs, and a generated index page to tie the shelf together.</p><ul><li>store manuscript records in arrayrefs and hashrefs so each page keeps its ordered blocks and labels</li><li>organize the pipeline into packages and exported helpers that live under <code>lib/</code> and are found through <code>@INC</code></li><li>read flags with <code>Getopt::Std</code>, generate the navigation index, and ship the complete tool</li></ul>"
