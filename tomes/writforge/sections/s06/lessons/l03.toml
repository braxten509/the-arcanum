[[lessons]]
id = "s06-l03"
title = "The Global Pass"
body = '''
<p>A single substitution only clears the first matching token. That is fine when one heading or one link needs attention, but Writforge will often see a line with repeated inline markup. The <code>g</code> flag tells Perl to keep scanning the same string until every matching span has been rewritten. That is the difference between fixing one ember and raking the whole hearth.</p>
<p>This is also where the other flags belong in the apprentice's head, even if today they are only support characters. <code>i</code> makes the match case-insensitive, which is useful when a draft header arrives in mixed case. <code>m</code> lets <code>^</code> and <code>$</code> see line boundaries inside a joined manuscript buffer, which matters once later chapters stitch several lines into one scalar. None of those flags replace the old regex lessons; they refine when the same pattern is allowed to fire.</p>
<p>When the line carries two bold spans, the render pass should not stop after the first one. The replacement must loop across the line, and the capture group still does the same job it did before: preserve the inner words while the outer markers vanish. The old chapters taught the scribe how to read the shape. This chapter simply asks the same eyes to keep reading until the string has no more of that shape.</p>
<p>Keep the array and hash habits from the earlier cantos in play. Arrays still hold the manuscript in order, and hashes can still count how many rewrites happened. The flag does not turn a line into a page or a page into a folder. It only makes the rewrite exhaustive for the string currently in the scribe's hand.</p>
<pre><code><span class="k">my</span> <span class="s">$line</span> = <span class="s">"Ink **red** and **blue**"</span>;
<span class="s">$line</span> =~ s/\*\*([^*]+)\*\*/&lt;strong&gt;<span class="s">$1</span>&lt;/strong&gt;/g;
<span class="k">say</span> <span class="s">$line</span>;</code></pre>
<div class="field-notes"><div class="fn-head">FIELD NOTES // THE GLOBAL PASS</div>
<p><strong>Coverage note.</strong> <code>g</code> does not change the pattern; it changes how many times the pattern is allowed to fire on the same string.</p>
<p><strong>Buffer note.</strong> <code>m</code> matters only when the manuscript has been joined into one buffer with newline characters still inside it. It lets the old anchors keep working line by line.</p>
<p><strong>Draft note.</strong> <code>i</code> is for case-flexible text, not for markup punctuation. Use it when the manuscript grammar says the letters may vary, not when the symbols should.</p></div>
'''

[[lessons.readings]]
label = "perldoc: perlop"
url = "https://perldoc.perl.org/perlop"

[[lessons.exercises]]
id = "s06-l03-e1"
type = "text"
points = 16
prompt = "<p>What does the <code>g</code> flag change in the bold rewrite?</p>"
answer = "it rewrites every matching span in the line"
accept = ["rewrite every matching span", "replace every match in the string", "keep going until no matches remain"]
hint = "Think about a line with two bold fragments instead of one."
whyWrong = "You are describing the pattern itself or only the first match. The flag is what tells the substitution to keep scanning the same string."

[[lessons.exercises]]
id = "s06-l03-e2"
type = "mc"
points = 18
prompt = "<p>Which flag makes a substitution case-insensitive?</p>"
choices = ["<code>g</code>", "<code>m</code>", "<code>x</code>", "<code>i</code>"]
answer = 3
whyWrong = "You are confusing global matching, multiline anchors, and free-spacing mode with case folding. The case-insensitive flag is <code>i</code>."
hint = "It is the flag that ignores letter case, not the one that repeats the match."
explain = "<code>i</code> lets the same pattern match upper, lower, or mixed case text."

[[lessons.exercises]]
id = "s06-l03-e3"
type = "fill"
points = 22
prompt = "<p>Restore the flag that makes the bold rewrite hit both spans in one line.</p>"
code = 'my $line = "Ink **red** and **blue**"; $line =~ s/\*\*([^*]+)\*\*/<strong>$1</strong>/____;'
answer = "g"
hint = "The blank is the repeat-pass flag from the lesson, not a new pattern."
whyWrong = "You are leaving the rewrite to stop after the first bold span. The whole point of this pass is to keep scanning the same line."

[[lessons.exercises]]
id = "s06-l03-w1"
type = "write"
points = 30
prompt = "<p>Using the starter line, convert every <code>**bold**</code> span into <code>&lt;strong&gt;bold&lt;/strong&gt;</code>, print the fully rewritten line, and finish with <code>BOLD 2</code>. The line contains two bold spans, so the rewrite must visit both of them.</p>"
starter = '''
#!/usr/bin/env perl
use v5.36;

my $line = "Ink **red** and **blue**";
my $bolds = 0;

# Task: rewrite every bold span in the line and count the ones you changed.
'''
expect = '''
Ink <strong>red</strong> and <strong>blue</strong>
BOLD 2'''
hint = "Use the capture from the lesson and make the substitution global so the second span does not survive untouched."
