id = "s06"
codename = "CHAPTER VI // THE REWRITE CHISEL"
short = "The Rewrite Chisel"
title = "Substitution & Capture"
build = "Adds substitution, capture groups, and cleanup passes so scanned manuscript lines can become HTML fragments without losing their words."
brief = "<p>The sixth canto stops merely naming the marks and begins rewriting them. The scanner from the last chapter already knows how to spot headings, blanks, and inline tokens. Now the scribe gives those matches a new coat of ink: headings become tags, links keep both label and destination, and the leftover manuscript is still the same text underneath.</p><ul><li>rewrite matched markup with <code>s///</code> instead of string concatenation</li><li>use capture groups to preserve the heading text, link text, and destination while changing the wrapper around them</li><li>normalize titles and labels with <code>split</code>, <code>join</code>, <code>tr///</code>, <code>lc</code>, and <code>uc</code> before the final render pass</li></ul>"
