[freestyle]
title = "THE WORKING: THE FIRST RENDER PASS"
brief = "Shape the scanned manuscript into HTML fragments.<ul><li>convert the starter headings and inline markup into HTML tags without hardcoding the rendered lines</li><li>use at least one capture group and one global substitution in the renderer</li><li>finish with the exact summary line <code>RENDERED 5</code></li></ul>"
reward = 190
xray = "The grader docks scripts that hardcode the rendered page, drop the captured text while wrapping it, or forget that repeated inline spans need a global substitution. It rewards a real line walk, preserved captures, clean tag wrapping, and Perl that keeps the original manuscript words alive while changing their frame."

[freestyle.badge]
id = "badge-s06"
name = "REWRITE CHISEL"
desc = "Wrapped the manuscript in new tags without carving away the original words."

[[freestyle.rubric]]
criterion = "Compiles & runs"
weight = 20
desc = "Perl 5.36 accepts the script and it runs cleanly on the provided starter data."

[[freestyle.rubric]]
criterion = "Correct render pass"
weight = 35
desc = "The output prints the rendered headings, inline markup, and the exact summary line `RENDERED 5` in the required order."

[[freestyle.rubric]]
criterion = "Substitution and capture"
weight = 30
desc = "The solution uses real substitution expressions with capture groups, preserves the captured manuscript text, and applies a global pass where repeated inline tokens need one."

[[freestyle.rubric]]
criterion = "Perl style & layout"
weight = 15
desc = "Uses Perl's current style here: `use v5.36;`, lexical `my` variables, lowercase builtins, spaces around operators, and braces aligned with the opening keyword."
