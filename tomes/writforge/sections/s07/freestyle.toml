[freestyle]
title = "THE WORKING: THE SHELF OF PAGES"
brief = "Turn the manuscript shelf into saved pages.<ul><li>read every regular <code>.txt</code> manuscript from <code>manuscripts/</code> and ignore subdirectories</li><li>write one matching <code>.html</code> file into <code>build/</code> for each source file</li><li>apply the heading, bold, italic, and link rewrites from the previous cantos while streaming each file</li><li>finish with the exact summary line <code>WRITTEN 2</code></li></ul>"
reward = 200
xray = "The grader docks scripts that hardcode the saved pages, write back into the source manuscript files, skip the file tests and trust path strings alone, or forget that the renderer must keep the captured words while changing the wrapper. It rewards a real shelf walk, explicit open/close pairs, output filenames derived from the sources, and HTML that still carries the original manuscript text."

[freestyle.badge]
id = "badge-s07"
name = "SHELF DOOR"
desc = "Opened the manuscript shelf and returned the pages as saved HTML files."

[[freestyle.rubric]]
criterion = "Compiles & runs"
weight = 20
desc = "Perl accepts the script and it runs cleanly on the provided manuscript shelf without crashing."

[[freestyle.rubric]]
criterion = "Writes the pages"
weight = 30
desc = "The script creates the required HTML files in build/ from the starter manuscripts and prints the exact summary line `WRITTEN 2`."

[[freestyle.rubric]]
criterion = "Reads the shelf correctly"
weight = 20
desc = "The solution walks the manuscript directory, skips non-files and subdirectories, and does not hardcode the output list."

[[freestyle.rubric]]
criterion = "Preserves render logic"
weight = 15
desc = "The output HTML keeps the heading, bold, italic, and link text from the source files while changing only the wrapper around them."

[[freestyle.rubric]]
criterion = "Perl style & layout"
weight = 15
desc = "Uses Perl's current conventions here: `use v5.36;`, lexical `my` variables, lowercase builtins like `say` and `print`, spaces around operators, and braces aligned with the opening keyword."
