codename = "CHAPTER VII // THE IRON DOOR"
short = "The Iron Door"
title = "FILE I/O"
build = "Adds open, close, file tests, ARGV walking, and output files so the renderer can read manuscripts from disk and write HTML pages back."
brief = "<p>The seventh canto stops pretending the manuscript is only a string. It opens the shelf, walks real paths, and writes the rendered page back to disk so the work survives after the script ends.</p><ul><li>open manuscript files safely with lexical filehandles, <code>die</code>, and <code>$!</code></li><li>walk <code>@ARGV</code> with <code>&lt;&gt;</code>, then use <code>-e</code>, <code>-f</code>, and <code>-d</code> to sort the shelf from the noise</li><li>print transformed HTML to output handles and close them cleanly so the pages stay on disk</li></ul>"
