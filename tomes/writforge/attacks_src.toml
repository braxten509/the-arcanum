[[challenge]]
tier = 4
title = "THE INDEX LEDGER"
starter = '''
use v5.36;

my %counts = (
    glyph  => 23,
    ink    => 47,
    script => 8,
    scribe => 31,
    codex  => 15,
);
# THE FIRST BINDING is set. Further demands may arm as the glass runs.
'''
briefs = [
  "Walk the hash in sorted key order. Say «<key> <value>» on each line.",
  "Append «TOTAL <sum of values>» and «TOP <key with highest value>» — computed.",
  "Append the keys whose values are above 20, one per line in sorted order, then «INDEX SEALED».",
]
solution = '''
use v5.36;

my %counts = (
    glyph  => 23,
    ink    => 47,
    script => 8,
    scribe => 31,
    codex  => 15,
);
my $total = 0;
my $top = "";
my $top_val = 0;
for my $key (sort keys %counts) {
    say "$key $counts{$key}";
    $total += $counts{$key};
    if ($counts{$key} > $top_val) {
        $top_val = $counts{$key};
        $top = $key;
    }
}
say "TOTAL $total";
say "TOP $top";
for my $key (sort keys %counts) {
    if ($counts{$key} > 20) {
        say $key;
    }
}
say "INDEX SEALED";
'''
