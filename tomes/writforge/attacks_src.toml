[[challenge]]
tier = 2
title = "THE SCRIBE'S HELPER"
starter = '''
use v5.36;

sub ink_cost {
    my ($leaves, $rate) = @_;
    return $leaves * $rate;
}

my $leaves = 12;
my $rate   = 3;
# THE FIRST BINDING is set. Further demands may arm as the glass runs.
'''
briefs = [
  "Call the helper. Say «COST <ink_cost($leaves, $rate)>sp» and «RATE ${rate}sp/leaf» — computed.",
  "Append «DOUBLE <ink_cost($leaves * 2, $rate)>sp» (double the leaves, same rate, computed).",
  "Append «TRIPLE <ink_cost($leaves * 3, $rate)>sp» and «HELPER SEALED».",
]
solution = '''
use v5.36;

sub ink_cost {
    my ($leaves, $rate) = @_;
    return $leaves * $rate;
}

my $leaves = 12;
my $rate   = 3;
say "COST " . ink_cost($leaves, $rate) . "sp";
say "RATE ${rate}sp/leaf";
say "DOUBLE " . ink_cost($leaves * 2, $rate) . "sp";
say "TRIPLE " . ink_cost($leaves * 3, $rate) . "sp";
say "HELPER SEALED";
'''
cuts = [2, 3, 5]

# ---- Tier 3 — the shelf rows (arrays, ordered walking, scalar/list context)
[[challenge]]
tier = 3
title = "THE SHELF AUDIT"
starter = '''
use v5.36;

my @titles = qw(Prologue Chapter_I Epilogue);
my @counts = (240, 510, 130);
# THE FIRST BINDING is set. Further demands may arm as the glass runs.
'''
briefs = [
  "Walk the paired shelves. For each pair, say «PAGE <title> <count>w» on its own line.",
  "Append «TOTAL <sum of all counts>w» — computed from the array.",
  "Append «LONGEST <title of the page with the most words>» and «AUDIT COMPLETE».",
]
solution = '''
use v5.36;

my @titles = qw(Prologue Chapter_I Epilogue);
my @counts = (240, 510, 130);
my $total = 0;
my $max = 0;
my $longest = "";
for my $i (0 .. $#titles) {
    say "PAGE $titles[$i] $counts[$i]w";
    $total += $counts[$i];
    if ($counts[$i] > $max) {
        $max = $counts[$i];
        $longest = $titles[$i];
    }
}
say "TOTAL ${total}w";
say "LONGEST $longest";
say "AUDIT COMPLETE";
'''
cuts = [3, 4, 6]

