# ---- Tier 5 — the pattern-glyph (regex matching only; no substitution or references)
[[challenge]]
tier = 5
title = "THE PATTERN-GLYPH LENS"
starter = '''
use v5.36;

my @lines = ("# Writforge", "", "**bold**, *italic*, plain.", "## The Binding", "[home](index)");
# THE FIRST BINDING is set. Further demands may arm as the glass runs.
'''
briefs = [
  "Walk the lines and classify each by pattern: heading, blank, bold, link, or body. Say the classification and the line when present.",
  "Append «MATCHES <total classified lines>» — computed from the loop.",
  "Append «H <n> B <n> D <n> K <n> L <n>» for Heading, Blank, bolD, body Kind, and Link, then «PATTERN SEALED».",
]
solution = '''
use v5.36;

my @lines = ("# Writforge", "", "**bold**, *italic*, plain.", "## The Binding", "[home](index)");
my ($h, $b, $d, $k, $l) = (0, 0, 0, 0, 0);
for my $line (@lines) {
    if ($line =~ /^#/) {
        say "HEADING: $line";
        $h++;
    } elsif ($line =~ /^\s*$/) {
        say "BLANK";
        $b++;
    } elsif ($line =~ /\*\*/) {
        say "BOLD: $line";
        $d++;
    } elsif ($line =~ /\[/) {
        say "LINK: $line";
        $l++;
    } else {
        say "BODY: $line";
        $k++;
    }
}
my $total = $h + $b + $d + $k + $l;
say "MATCHES $total";
say "H $h B $b D $d K $k L $l";
say "PATTERN SEALED";
'''
cuts = [5, 6, 8]

[[challenge]]
tier = 5
title = "THE HEADING SCRY"
starter = '''
use v5.36;

my @lines = ("# Prologue", "Some body text.", "## Chapter I", "", "### Appendix", "More body.", "# Epilogue");
# THE FIRST BINDING is set. Further demands may arm as the glass runs.
'''
briefs = [
  "Walk the lines. Say «HEADING», «BLANK», or «BODY» for each line using regex matching.",
  "Append «HEADINGS <count>» — computed from the regex branches.",
  "Append «BLANKS <count>», «BODY <count>», and «SCRY SEALED».",
]
solution = '''
use v5.36;

my @lines = ("# Prologue", "Some body text.", "## Chapter I", "", "### Appendix", "More body.", "# Epilogue");
my ($headings, $blanks, $body) = (0, 0, 0);
for my $line (@lines) {
    if ($line =~ /^#/) {
        say "HEADING";
        $headings++;
    } elsif ($line =~ /^\s*$/) {
        say "BLANK";
        $blanks++;
    } else {
        say "BODY";
        $body++;
    }
}
say "HEADINGS $headings";
say "BLANKS $blanks";
say "BODY $body";
say "SCRY SEALED";
'''
cuts = [7, 8, 11]

[[challenge]]
tier = 5
title = "THE LINK SHAPE"
starter = '''
use v5.36;

my @lines = ("[home](index.html)", "plain text", "[codex](codex.html)", "# Heading", "");
# THE FIRST BINDING is set. Further demands may arm as the glass runs.
'''
briefs = [
  "Walk the lines. For each line, say «LINK <n>» if it has markdown link shape, otherwise «NO LINK <n>».",
  "Append «LINKS <count>» — computed from the regex matches.",
  "Append «NONLINKS <count>» and «LINK SCAN SEALED».",
]
solution = '''
use v5.36;

my @lines = ("[home](index.html)", "plain text", "[codex](codex.html)", "# Heading", "");
my ($links, $nonlinks) = (0, 0);
for my $i (0 .. $#lines) {
    my $n = $i + 1;
    if ($lines[$i] =~ /^\[[^\]]+\]\([^)]+\)$/) {
        say "LINK $n";
        $links++;
    } else {
        say "NO LINK $n";
        $nonlinks++;
    }
}
say "LINKS $links";
say "NONLINKS $nonlinks";
say "LINK SCAN SEALED";
'''
cuts = [5, 6, 8]
