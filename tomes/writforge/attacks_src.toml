# ---- Tier 2 — the branching quill (control flow, subroutines, arrays)
[[challenge]]
tier = 2
title = "THE CLASSIFYING LENS"
starter = '''
use v5.36;

my $first  = "# Prologue";
my $second = "";
my $third  = "The scribe set down his quill.";
# THE FIRST BINDING is set. Further demands may arm as the glass runs.
'''
briefs = [
  "Classify $first. Say «LINE 1 HEADING» or «LINE 1 BLANK» or «LINE 1 BODY» — if it starts with '#' it is a heading, if empty it is blank, else body.",
  "Append the classification for the second line: «LINE 2» and its kind.",
  "Append the classification for the third line: «LINE 3» and its kind, then «LENS COMPLETE».",
]
solution = '''
use v5.36;

my $first  = "# Prologue";
my $second = "";
my $third  = "The scribe set down his quill.";
if (substr($first, 0, 1) eq "#") {
    say "LINE 1 HEADING";
} elsif ($first eq "") {
    say "LINE 1 BLANK";
} else {
    say "LINE 1 BODY";
}
if (substr($second, 0, 1) eq "#") {
    say "LINE 2 HEADING";
} elsif ($second eq "") {
    say "LINE 2 BLANK";
} else {
    say "LINE 2 BODY";
}
if (substr($third, 0, 1) eq "#") {
    say "LINE 3 HEADING";
} elsif ($third eq "") {
    say "LINE 3 BLANK";
} else {
    say "LINE 3 BODY";
}
say "LENS COMPLETE";
'''
cuts = [1, 2, 4]

[[challenge]]
