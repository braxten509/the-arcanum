# Reference solutions for WRITFORGE's SPELL DUEL bank (Perl 5, this tome's language).
# tools/gen_attacks.py runs each `solution` through this tome's runtime via
# /api/runsnippet, slices the verified stdout into the cumulative per-stage `expect`
# blocks, and writes generated/attacks.toml. Regenerate:
#   python3 tools/gen_attacks.py writforge   (server running)
# Never hand-edit generated/attacks.toml.
#
# Every solution is a single-file Perl script (matching [runtime].entryFile =
# writforge.pl, so `perl writforge.pl` runs it). Minigames never enter the
# Writforge workspace — they run plain Perl in the engine's scratch dir.
#
# Tier N unlocks after N sections are passed, so a tier's demands stay within the
# concepts taught by that point in the syllabus. Each challenge has exactly 3 stages
# (matching [progression].attackStages = [0, 60, 120]); each stage strictly APPENDS
# lines — stages[n].expect == stages[n-1].expect + new lines, never edits.
#
# Voice: Master Scrivener's scriptorium — rivals come to the desk, not the wizard's
# tower. Titles, briefs, and every printed token carry the scribe's tongue (ink,
# glyph, parchment, sign-mark, pattern-glyph, re-ink, the shelf, the ledger, codex).
# No magic/mana cant, no borrowed wizard-arc titles.

# ---- Tier 1 — the first ink (scalars, interpolation, operators)
[[challenge]]
tier = 1
title = "THE COLD PARCHMENT"
starter = '''
use v5.36;

my $iron = 8;
my $copper = 6;
my $gold = 20;
# THE FIRST BINDING is set. Further demands may arm as the glass runs.
'''
briefs = [
  "Strike the first sign-mark. Say «INK iron @ 8», «INK copper @ 6», «INK gold @ 20» — woven from the variables, values not hardcoded.",
  "Append «TOTAL <iron+copper+gold>» and «SPREAD <gold-iron>» — both computed from the scalars.",
  "Append «LABEL gold» from the gold scalar's name in the prompt and «PARCHMENT SET».",
]
solution = '''
use v5.36;

my $iron = 8;
my $copper = 6;
my $gold = 20;
say "INK iron \@ $iron";
say "INK copper \@ $copper";
say "INK gold \@ $gold";
my $total = $iron + $copper + $gold;
say "TOTAL $total";
my $spread = $gold - $iron;
say "SPREAD $spread";
say "LABEL gold";
say "PARCHMENT SET";
'''
cuts = [3, 5, 7]

[[challenge]]
tier = 1
title = "THE INK FOUNTAIN"
starter = '''
use v5.36;

my $word = "scriptorium";
my $count = 7;
# THE FIRST BINDING is set. Further demands may arm as the glass runs.
'''
briefs = [
  "Measure the word. Say «WORD $word» and «LENGTH <length of $word>» — computed from the variable.",
  "Append «COPIES $count» and «SHELVES <length * count>» (letters across all copies, computed).",
  "Append «MARK <word>-<count>» using string joining, then «INK FOUNTAIN READY».",
]
solution = '''
use v5.36;

my $word = "scriptorium";
my $count = 7;
say "WORD $word";
my $len = length($word);
say "LENGTH $len";
say "COPIES $count";
my $shelves = $len * $count;
say "SHELVES $shelves";
my $mark = $word . "-" . $count;
say "MARK $mark";
say "INK FOUNTAIN READY";
'''
