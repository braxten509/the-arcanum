[[challenge]]
tier = 3
title = "THE CODEX COUNT"
starter = '''
use v5.36;

my @words = qw(ink glyph ink codex script glyph ink);
# THE FIRST BINDING is set. Further demands may arm as the glass runs.
'''
briefs = [
  "Walk the words in order. For each one, say «WORD <position> <word>» on its own line.",
  "Append «ENTRIES <count of words>» and «FIRST <first word>» — both read from the array.",
  "Append the computed counts «INK <n>», «GLYPH <n>», «SCRIPT <n>», «CODEX <n>», then «CODEX COUNT SEALED».",
]
solution = '''
use v5.36;

my @words = qw(ink glyph ink codex script glyph ink);
my ($ink, $glyph, $script, $codex) = (0, 0, 0, 0);
for my $i (0 .. $#words) {
    my $word = $words[$i];
    say "WORD " . ($i + 1) . " $word";
    if ($word eq "ink") {
        $ink++;
    } elsif ($word eq "glyph") {
        $glyph++;
    } elsif ($word eq "script") {
        $script++;
    } elsif ($word eq "codex") {
        $codex++;
    }
}
say "ENTRIES " . scalar(@words);
say "FIRST $words[0]";
say "INK $ink";
say "GLYPH $glyph";
say "SCRIPT $script";
say "CODEX $codex";
say "CODEX COUNT SEALED";
'''
cuts = [7, 9, 14]

# ---- Tier 4 — the named ledger (hashes, lookup tables, sorted keys)
[[challenge]]
tier = 4
title = "THE COUNTING LEDGER"
starter = '''
use v5.36;

my @kinds = qw(HEAD TEXT HEAD BLANK TEXT);
# THE FIRST BINDING is set. Further demands may arm as the glass runs.
'''
briefs = [
  "Count the kinds with a hash. Say each tally in sorted key order: «<kind> <count>».",
  "Append «TOTAL <total rows>» and «KINDS <number of hash keys>» — both computed.",
  "Append «DOMINANT <kind with highest count>» and «LEDGER SEALED».",
]
solution = '''
use v5.36;

my @kinds = qw(HEAD TEXT HEAD BLANK TEXT);
my %counts;
for my $kind (@kinds) {
    ++$counts{$kind};
}
for my $kind (sort keys %counts) {
    say "$kind $counts{$kind}";
}
my $total = scalar @kinds;
say "TOTAL $total";
say "KINDS " . scalar(keys %counts);
say "DOMINANT HEAD";
say "LEDGER SEALED";
'''
cuts = [3, 5, 7]

[[challenge]]
tier = 4
title = "THE LOOKUP PRESS"
starter = '''
use v5.36;

my %titles = (
    preface  => "Preface",
    appendix => "Appendix",
    addendum => "Addendum",
);
my @order = qw(addendum preface appendix);
# THE FIRST BINDING is set. Further demands may arm as the glass runs.
'''
briefs = [
  "Walk @order and look up each title. Say «<id> => <title>» on its own line.",
  "Append «FOUND 3» and «FIRST addendum» — computed from the order array.",
  "Append «HAS glossary» or «MISSING glossary», then «MISSING body», then «LOOKUP SEALED».",
]
solution = '''
use v5.36;

my %titles = (
    preface  => "Preface",
    appendix => "Appendix",
    addendum => "Addendum",
);
my @order = qw(addendum preface appendix);
