sub ink_cost {
    my ($leaves, $rate) = @_;
    return $leaves * $rate;
}

my $leaves = 12;
my $rate   = 3;
# THE FIRST BINDING is set. Further demands may arm as the glass runs.
'''

[[tiers.pool.stages]]
brief = "Call the helper. Say «COST <ink_cost($leaves, $rate)>sp» and «RATE ${rate}sp/leaf» — computed."
