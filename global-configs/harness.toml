# global-configs/harness.toml — config for the tome-build harness (tools/build_tome.py).
#
# Models/runners are chosen per-phase in the browser bindery at launch and passed straight
# to the harness, so this file carries no model defaults — it configures how the harness
# WATCHES a running build. (For a command-line build, pass the model per phase with
# --runner <phase>=<kind>:<model>.)

# --- worker liveness ---------------------------------------------------------------------
# Every phase runs a headless worker (an AI CLI). To catch a hung or quota-exhausted worker
# fast, the harness pings it: every `ping_interval` seconds it checks the worker's CPU and
# open network connections, and after `dead_pings` consecutive idle checks (no CPU AND no
# live connection) it kills the worker and asks you to pick a new runner. The --ping-interval
# and --dead-pings command-line flags override these.
[liveness]
ping_interval = 30   # seconds between checks
dead_pings = 2       # consecutive idle checks that confirm a dead worker

# --- bindery quality presets -------------------------------------------------------------
# The CHEAP <-> QUALITY slider in the forge modal (served via /api/models, applied in the
# browser). Five tiers, q1 (cheapest competent) to q5 (best mix, no wasted effort). Each is
# a per-phase runner map in the same shape the bindery posts: `default` drives the
# structural phases (0,2,5,6,7), "1"/"4" the arc & minigames (the writer knob — keep them
# equal, the UI has one knob for both), "3" the sections hand, "8" the reviewer.
# kind = bindery provider id; model = that provider's model id; effort only where the CLI
# takes one. q3+ lean on the login CLIs (claude/codex/antigravity, flat-cost) — if one
# isn't installed that hand is left unset and the [ ] Configure box lets you pick manually.
# FREE opencode models and local ollama are deliberately absent: free ids rotate and
# rate-limit (workers look dead to the liveness ping), local quality depends on the rig.

[quality.q1]  # ~cheapest that still follows the plan; whole tome for well under $1
label = "threadbare"
blurb = "DeepSeek Flash scaffold & sections, MiniMax M3 where it must think"
split = true
phases.default = { kind = "opencode-cli", model = "opencode-go/deepseek-v4-flash" }
phases."1" = { kind = "opencode-cli", model = "opencode-go/minimax-m3" }
phases."4" = { kind = "opencode-cli", model = "opencode-go/minimax-m3" }
phases."3" = { kind = "opencode-cli", model = "opencode-go/deepseek-v4-flash" }
phases."8" = { kind = "opencode-cli", model = "opencode-go/qwen3.7-plus" }

[quality.q2]  # spend where it teaches: sections get the value-king pro model (cache ~ free)
label = "frugal"
blurb = "flash scaffold, M3 arc, DeepSeek V4 Pro sections, Kimi eyes"
split = true
phases.default = { kind = "opencode-cli", model = "opencode-go/deepseek-v4-flash" }
phases."1" = { kind = "opencode-cli", model = "opencode-go/minimax-m3" }
phases."4" = { kind = "opencode-cli", model = "opencode-go/minimax-m3" }
phases."3" = { kind = "opencode-cli", model = "opencode-go/deepseek-v4-pro" }
phases."8" = { kind = "opencode-cli", model = "opencode-go/kimi-k2.5" }

[quality.q3]  # balanced: pro-tier authoring end to end, third-vendor reviewer on the agy login
label = "balanced"
blurb = "DeepSeek V4 Pro writes everything, Gemini reviews it"
split = true
phases.default = { kind = "opencode-cli", model = "opencode-go/minimax-m3" }
phases."1" = { kind = "opencode-cli", model = "opencode-go/deepseek-v4-pro" }
phases."4" = { kind = "opencode-cli", model = "opencode-go/deepseek-v4-pro" }
phases."3" = { kind = "opencode-cli", model = "opencode-go/deepseek-v4-pro" }
phases."8" = { kind = "antigravity-cli", model = "Gemini 3.5 Flash (High)" }

[quality.q4]  # fine: Sonnet 5 authors the arc, strong open coder on sections, frontier Gemini reviews
label = "fine"
blurb = "Sonnet 5 arc & minigames, Kimi K2.6 sections, Gemini 3.1 Pro eyes"
split = true
phases.default = { kind = "opencode-cli", model = "opencode-go/minimax-m3" }
phases."1" = { kind = "claude-cli", model = "claude-sonnet-5", effort = "medium" }
phases."4" = { kind = "claude-cli", model = "claude-sonnet-5", effort = "medium" }
phases."3" = { kind = "opencode-cli", model = "opencode-go/kimi-k2.6" }
phases."8" = { kind = "antigravity-cli", model = "Gemini 3.1 Pro (High)" }

[quality.q5]  # masterwork: best hands where they matter, none wasted on scaffold
label = "masterwork"
blurb = "Opus 4.8 arc, Sonnet 5 sections, GPT-5.5 reviews — mini scaffold"
split = true
phases.default = { kind = "codex-cli", model = "gpt-5.4-mini", effort = "low" }
phases."1" = { kind = "claude-cli", model = "claude-opus-4-8", effort = "medium" }
phases."4" = { kind = "claude-cli", model = "claude-opus-4-8", effort = "medium" }
phases."3" = { kind = "claude-cli", model = "claude-sonnet-5", effort = "medium" }
phases."8" = { kind = "codex-cli", model = "gpt-5.5", effort = "high" }
