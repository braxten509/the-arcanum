# global-configs/harness.toml — config for the tome-build harness (tools/build_tome.py).
#
# Primary models/runners are chosen per phase in the browser bindery and passed straight
# to the harness. This file also owns the automatic recovery chain used after a primary
# hand dies or exhausts its repair budget. A command-line build can still override a
# primary with --runner <phase>=<kind>:<model>.

# --- worker liveness ---------------------------------------------------------------------
# Every phase runs a headless worker (an AI CLI). To catch a hung or quota-exhausted worker
# fast, the harness pings it: every `ping_interval` seconds it checks the worker's CPU and
# open network connections, and after `dead_pings` consecutive idle checks (no CPU AND no
# live connection) it kills the worker and advances to the next autonomous hand. The
# --ping-interval and --dead-pings command-line flags override these.
[liveness]
ping_interval = 30   # seconds between checks
dead_pings = 2       # consecutive idle checks that confirm a dead worker

# Web builds never pause for a human after construction starts. If a selected hand dies
# or spends its repair budget, the harness escalates through the first installed choices
# for that role. Endpoint/login health is checked only when a recovery hand is needed.
[autonomy]
default = ["codex-cli:gpt-5.6-luna@medium", "codex-cli:gpt-5.6-terra@medium", "claude-cli:claude-sonnet-5@high"]
"1" = ["opencode-cli:opencode-go/minimax-m3", "codex-cli:gpt-5.6-terra@medium", "claude-cli:claude-sonnet-5@high"]
"3" = ["opencode-cli:opencode-go/minimax-m3", "codex-cli:gpt-5.6-terra@medium", "claude-cli:claude-sonnet-5@high"]
"4" = ["opencode-cli:opencode-go/minimax-m3", "codex-cli:gpt-5.6-terra@medium", "claude-cli:claude-sonnet-5@high"]
"8" = ["opencode-cli:opencode-go/qwen3.7-max", "antigravity-cli:Gemini 3.1 Pro (High)", "codex-cli:gpt-5.6-sol@high"]

# --- bindery quality presets -------------------------------------------------------------
# The CHEAP <-> QUALITY slider in the forge modal (served via /api/models, applied in the
# browser). Five tiers, q1 (cheapest competent) to q5 (best mix, no wasted effort). Each is
# a per-phase runner map in the same shape the bindery posts: `default` drives the
# structural phases (0,2,5,6,7), "1"/"4" the arc & minigames (the writer knob — keep them
# equal, the UI has one knob for both), "3" the sections hand, "8" the reviewer.
# kind = bindery provider id; model = that provider's model id; effort only where the CLI
# takes one. q3+ lean on the login CLIs (claude/codex/antigravity, flat-cost) — if one
# isn't installed that hand is left unset and the [ ] Configure box lets you pick manually.
# FREE OpenCode endpoints are limited-time/trial offerings, and local model quality depends
# on the exact rig/runtime; presets therefore use durable hosted or login-backed paths.

[quality.q1]  # cheapest complete mix: spend on the teaching + independent final eyes
label = "economy"
blurb = "Flash drafts, MiniMax plans and writes split sections, Qwen Max reviews"
split = true
phases.default = { kind = "opencode-cli", model = "opencode-go/deepseek-v4-flash", effort = "high" }
phases."1" = { kind = "opencode-cli", model = "opencode-go/minimax-m3" }
phases."4" = { kind = "opencode-cli", model = "opencode-go/minimax-m3" }
phases."3" = { kind = "opencode-cli", model = "opencode-go/minimax-m3" }
phases."8" = { kind = "opencode-cli", model = "opencode-go/qwen3.7-max" }

[quality.q2]  # value: stronger arc/sections, then independent subscription-backed eyes
label = "value"
blurb = "Qwen plans, DeepSeek Pro writes split sections, Gemini 3.5 Flash reviews"
split = true
phases.default = { kind = "opencode-cli", model = "opencode-go/deepseek-v4-flash", effort = "high" }
phases."1" = { kind = "opencode-cli", model = "opencode-go/qwen3.7-plus" }
phases."4" = { kind = "opencode-cli", model = "opencode-go/qwen3.7-plus" }
phases."3" = { kind = "opencode-cli", model = "opencode-go/deepseek-v4-pro", effort = "high" }
phases."8" = { kind = "antigravity-cli", model = "Gemini 3.5 Flash (High)" }

[quality.q3]  # balanced: current efficient frontier models, strongest hand on the bulk phase
label = "balanced"
blurb = "GPT-5.6 Luna plans, Terra writes split sections, Gemini 3.5 Flash reviews"
split = true
phases.default = { kind = "codex-cli", model = "gpt-5.6-luna", effort = "medium" }
phases."1" = { kind = "codex-cli", model = "gpt-5.6-luna", effort = "medium" }
phases."4" = { kind = "codex-cli", model = "gpt-5.6-luna", effort = "medium" }
phases."3" = { kind = "codex-cli", model = "gpt-5.6-terra", effort = "medium" }
phases."8" = { kind = "antigravity-cli", model = "Gemini 3.5 Flash (High)" }

[quality.q4]  # fine: strong frontier authoring and independent pro review
label = "fine"
blurb = "Sonnet 5 plans, GPT-5.6 Terra writes split sections, Gemini 3.1 Pro reviews"
split = true
phases.default = { kind = "codex-cli", model = "gpt-5.6-luna", effort = "medium" }
phases."1" = { kind = "claude-cli", model = "claude-sonnet-5", effort = "high" }
phases."4" = { kind = "claude-cli", model = "claude-sonnet-5", effort = "high" }
phases."3" = { kind = "codex-cli", model = "gpt-5.6-terra", effort = "medium" }
phases."8" = { kind = "antigravity-cli", model = "Gemini 3.1 Pro (High)" }

[quality.q5]  # masterwork: no Fable/max/ultra overspend; frontier hands only where useful
label = "masterwork"
blurb = "Opus 4.8 plans, Sonnet 5 writes split sections, GPT-5.6 Sol reviews"
split = true
phases.default = { kind = "codex-cli", model = "gpt-5.6-luna", effort = "medium" }
phases."1" = { kind = "claude-cli", model = "claude-opus-4-8", effort = "high" }
phases."4" = { kind = "claude-cli", model = "claude-opus-4-8", effort = "high" }
phases."3" = { kind = "claude-cli", model = "claude-sonnet-5", effort = "high" }
phases."8" = { kind = "codex-cli", model = "gpt-5.6-sol", effort = "high" }
