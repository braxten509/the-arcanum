# Read/write policy for the optional independent reviewer after Phase 8.
# Usable placeholders:
#   {build_id} — current build; available in this profile.
#   {tome_id} — current tome; available in this profile.
#   {phase} — always 8 for this profile.
#   {runtime_id} — selected runtime ID; available only when the tome declares one.

[system]
read = ["/usr", "/bin", "/lib", "/lib64", "/usr/local", "/etc", "/opt", "/proc"]
write = []
both = ["/tmp/arcanum/{build_id}", "/dev"]
execute = []

[permissions]
read = [
  "AGENTS.md",
  "tome-workflow/single-author.md",
  ".tome-build/{build_id}.plan.md",
  ".tome-build/{build_id}.course-map.json",
  "tomes/{tome_id}",
]
write = []
both = [
  "tomes/{tome_id}",
  # Must match full_review.evidence_path exactly. A path that does not resolve to a
  # real file is silently dropped rather than mounted, so a wrong name here reads as
  # the reviewer refusing to write its packet, and the harness retries it forever.
  ".tome-build/{build_id}.full-review.json",
  # Continuity handoffs are author-owned prose about how each section leaves the
  # project. The harness creates the files; only a reviewer can say what they mean.
  ".tome-build/{tome_id}.handoffs",
  "global-configs/runtimes/{runtime_id}",
]
execute = []
