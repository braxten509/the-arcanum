# ARCANUM — spell-sigil tuning
# Every knob the cast animation (castSigil in app.js) and its sound use.
# Edit and refresh the page; no rebuild. Any key you delete (or the whole
# file) falls back to the same defaults baked into app.js.
# Key names are spelled out in full — no abbreviations.
# Note: the cast obeys the study's particle preference — if particles are
# off in TRIM THE WICK, neither the sigil nor its sound plays.

[letters]
minimum = 3         # letters per successful cast
maximum = 6
scale = 28          # px per grid unit; letters stand ~6x this tall
spacing = 0.62      # grid units between elbows (larger = bolder, sharper lightning)

[palette]               # successful colors come from the active theme's sigil-1…sigil-4
saturation = 78         # reference saturation used for the miscast fade ratio
saturation_miscast = 30 # the four theme inks grey toward this saturation as they fall

[lightning]
width_minimum = 4.8       # px, saturated body around the white-hot core
width_maximum = 7.2
glow_width = 21           # px, cyan/magical bloom behind the bolt
jitter = 9.5              # px, unstable angular throw at full charge
cadence_milliseconds = 44 # faster, irregular re-binding of each elbow
success_cadence_start_milliseconds = 72 # successful casts begin with readable motion
success_cadence_peak_milliseconds = 24  # ...then snap rapidly near release
success_jitter_peak = 1.85              # x jitter at peak successful charge
forks_minimum = 0         # short secondary cracks per long glyph stroke
forks_maximum = 2
fork_length_minimum = 10  # px, compact branches keep the glyph readable
fork_length_maximum = 27
fork_energy = 1.35        # branches vibrate harder than the bound main stroke

[charge]
total_milliseconds = 4000  # whole life of the cast; release lands at total_milliseconds * release_fraction
release_fraction = 0.75    # 4000 x 0.75 = the 3-second mark
poses_minimum = 18         # breathing poses through the hold
poses_maximum = 22
shake = 7                  # px of extra throw at full charge (escalates from ~2)
grow = 0.25                # extra stroke scale at full charge

[burst]
distance_minimum = 160  # px released motes fly from their original stroke
distance_maximum = 400
particle_size = 1.7     # x the stroke width
shards = 2              # smaller fragments shed by every released mote
shard_size = 0.45       # x parent mote size

[sound]
enabled = true
volume = 100          # %
charge_hertz_from = 110  # the rising bind starts here...
charge_hertz_to = 440    # ...and climbs to here at release
shimmer = 0.5            # sparkle density through the charge, 0 to 1
burst_gain = 0.6        # the release whoomph
miscast = true          # play a sound on a failed cast at all

[fail]                # cast-fail.mp3, played on a MISCAST: the letter charges
charge_milliseconds = 1200 # a MISCAST holds visibly for this long, then crumbles into falling ash
start = 0             # skip this many seconds of the clip's silent attack so the fail is heard at once
tail = 1.1            # keep playing this many seconds past the break (total ≈ charge_milliseconds/1000 + this)
gain = 2.0            # loudness of the fail sound, x [sound] volume (the clip is a quiet recording)
fade = 0.3            # fade the tail out over the last this-many seconds, so it doesn't cut hard
fall_distance_minimum = 300 # px, miscast ash drops from each lightning stroke
fall_distance_maximum = 660
spread = 42               # px of sideways ash drift
particles_per_node = 8    # fine ash flecks emitted immediately from every bound point
particle_size = 0.42      # x the failed stroke width; no larger parent motes
