# The engine is language-neutral.  These versioned profiles make Language Mastery own
# both its generic capability-count floor and concrete idiomatic breadth.  Each level
# adds to the levels below it. tokenGroups are ANDed across the complete capability
# spine; tokens inside one group are ORed. Separate capability ids may satisfy separate
# groups, so independently teachable families should not be combined merely for matching.
version = 1

[defaults]
minimumCapabilities = [5, 7, 12, 15, 18]

[languages.python]
requiredAbstractionTokens = ["class"]

[languages.python.levels."1"]
minimumCapabilities = 5
areas = [
  { id = "values-and-expressions", description = "values, expressions, and basic data flow", tokenGroups = [["value", "expression", "data"]] },
  { id = "control-flow", description = "branching and repetition", tokenGroups = [["control", "branch", "loop"]] },
  { id = "functions", description = "defining and calling functions", tokenGroups = [["function"]] },
  { id = "errors", description = "recognizing and handling ordinary failures", tokenGroups = [["error", "exception", "failure"]] },
  { id = "verification", description = "observable checks and basic debugging", tokenGroups = [["test", "verification", "check", "debug", "diagnosis"]] },
]

[languages.python.levels."2"]
minimumCapabilities = 8
areas = [
  { id = "collections", description = "lists, dictionaries, sets, and tuples", tokenGroups = [["collection", "list", "dict", "set", "tuple"]] },
  { id = "modules-and-imports", description = "splitting familiar work across modules and imports", tokenGroups = [["module", "package", "import"]] },
  { id = "files-and-data", description = "reading, writing, and serializing data", distinctCapabilityGroups = true, tokenGroups = [["file", "path"], ["data", "json", "csv", "serial"]] },
]

[languages.python.levels."3"]
minimumCapabilities = 14
areas = [
  { id = "comprehensions", description = "idiomatic collection comprehensions", tokenGroups = [["comprehension"]] },
  { id = "functions-and-scope", description = "function boundaries, scope, and closures", distinctCapabilityGroups = true, tokenGroups = [["function"], ["scope", "closure", "namespace"]] },
  { id = "classes-and-composition", description = "classes, objects, and composition", distinctCapabilityGroups = true, tokenGroups = [["class", "object"], ["composition", "compose"]] },
  { id = "packages-and-import-boundaries", description = "modules, packages, imports, and public boundaries", distinctCapabilityGroups = true, tokenGroups = [["module", "package"], ["import", "boundary"]] },
  { id = "iteration", description = "iteration protocols, iterators, and generators", tokenGroups = [["iteration", "iterator", "iterable", "generator"]] },
  { id = "exceptions-and-context-managers", description = "exceptions and deterministic resource cleanup", distinctCapabilityGroups = true, tokenGroups = [["exception", "error"], ["context", "resource", "with"]] },
  { id = "testing-and-debugging", description = "tests plus tool-driven diagnosis and debugging", distinctCapabilityGroups = true, tokenGroups = [["test", "verification"], ["debug", "diagnosis"]] },
  { id = "typing-basics", description = "type hints and useful annotations", tokenGroups = [["typing", "type-hint", "annotation"]] },
  { id = "standard-library", description = "practical use of the Python standard library", tokenGroups = [["standard-library", "pathlib", "dataclass", "itertools"]] },
  { id = "environments-and-cli", description = "virtual environments and command-line interfaces", distinctCapabilityGroups = true, tokenGroups = [["environment", "venv"], ["cli", "argparse", "command-line"]] },
  { id = "packaging", description = "project metadata, packaging, and distributable delivery", tokenGroups = [["packaging", "distribution", "wheel", "pyproject"]] },
]

[languages.python.levels."4"]
minimumCapabilities = 18
areas = [
  { id = "advanced-functions", description = "decorators, higher-order functions, and call protocols", tokenGroups = [["decorator", "higher-order", "callable"]] },
  { id = "concurrency", description = "appropriate concurrency and asynchronous execution", tokenGroups = [["concurrency", "async", "thread", "process"]] },
  { id = "performance", description = "profiling, complexity, and performance tradeoffs", tokenGroups = [["profiling", "performance", "complexity"]] },
  { id = "advanced-testing", description = "fixtures, isolation, property checks, or test doubles", tokenGroups = [["fixture", "mock", "property-test", "test-double"]] },
]

[languages.python.levels."5"]
minimumCapabilities = 21
areas = [
  { id = "language-model", description = "Python's data model, protocols, and descriptors", tokenGroups = [["data-model", "protocol", "descriptor"]] },
  { id = "architecture", description = "architectural boundaries and consequential design tradeoffs", tokenGroups = [["architecture", "architectural"]] },
  { id = "distribution-operations", description = "reproducible distribution, compatibility, and operational diagnosis", distinctCapabilityGroups = true, tokenGroups = [["distribution", "release"], ["compatibility", "operations", "deployment"]] },
]

[languages.c]
requiredAbstractionTokens = ["interface"]

[languages.c.levels."1"]
minimumCapabilities = 5
areas = [
  { id = "project-toolchain", description = "creating, compiling, and diagnosing a real .NET project", tokenGroups = [["project", "toolchain"]] },
  { id = "types-and-nullability", description = "typed values and explicit missing-value contracts", tokenGroups = [["types", "nullability"]] },
  { id = "control-flow", description = "branching and repetition", tokenGroups = [["control", "flow"]] },
  { id = "methods-and-scope", description = "method boundaries and variable scope", tokenGroups = [["methods", "scope"]] },
  { id = "verification", description = "tests and tool-driven diagnosis introduced before late integration", tokenGroups = [["testing", "debugging", "verification"]] },
]

[languages.c.levels."2"]
minimumCapabilities = 10
areas = [
  { id = "collections-and-generics", description = "type-safe ordered and keyed collections", tokenGroups = [["collections", "generics"]] },
  { id = "classes-and-records", description = "behavioral objects and value-oriented data models", tokenGroups = [["classes", "records"]] },
  { id = "interfaces-and-polymorphism", description = "replaceable behavior behind explicit interfaces", tokenGroups = [["interfaces", "polymorphism"]] },
  { id = "exceptions-and-resources", description = "failure propagation and deterministic resource ownership", tokenGroups = [["exceptions", "resources"]] },
  { id = "serialization-and-io", description = "typed JSON, file, HTTP, process, and terminal boundaries", tokenGroups = [["serialization", "io"]] },
]

[languages.c.levels."3"]
minimumCapabilities = 14
areas = [
  { id = "namespaces-and-modularity", description = "multi-file namespace and dependency boundaries", tokenGroups = [["namespaces", "modularity"]] },
  { id = "linq-and-lambdas", description = "idiomatic collection transforms and execution timing", tokenGroups = [["linq", "lambdas"]] },
  { id = "async-and-cancellation", description = "asynchronous composition, concurrency, and cancellation", tokenGroups = [["async", "cancellation"]] },
  { id = "cli-and-packaging", description = "predictable command surfaces and runnable delivery artifacts", tokenGroups = [["cli", "packaging"]] },
]
