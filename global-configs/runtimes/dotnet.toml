# instance-receiver members that are really statics: accepting one rewrites
# `myVar.IsNull…` into `string.IsNullOrEmpty(myVar)` ({recv} = the receiver text)
[completions.staticRewrites]
str = [
  ["IsNullOrEmpty()", "bool — static: becomes string.IsNullOrEmpty(x)", "string.IsNullOrEmpty({recv})"],
  ["IsNullOrWhiteSpace()", "bool — static: becomes string.IsNullOrWhiteSpace(x)", "string.IsNullOrWhiteSpace({recv})"],
]
