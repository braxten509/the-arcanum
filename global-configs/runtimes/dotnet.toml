version = 1
capabilities = ["project", "build", "run", "assessment"]

# C# / .NET — complete engine config. The one generic runtime (runtimes/generic.py)
# executes these commands; nothing dotnet-specific exists in Python. A tome's
# [runtime] table overrides any key here.
language = "C#"
entryFile = "Program.cs"
newFileExt = ".cs"
editorLang = "csharp"
runLabel = "dotnet run"
packages = true

runCommand = ["dotnet", "run", "--project", "{dir}"]
snippetRunCommand = ["dotnet", "run", "--no-build", "--project", "{dir}"]
# Assessment runs with networking disabled. Ignore unavailable remote feeds and disable
# vulnerability-feed lookups while still restoring framework packs and cached packages.
buildCommand = ["dotnet", "build", "--nologo", "-v", "q", "--ignore-failed-sources", "-p:NuGetAudit=false"]
# Arch packages the ASP.NET reference pack separately from the SDK. This public targeting
# pack is an explicit read-only toolchain resource; the rest of the user's home stays hidden.
assessmentReadPaths = ["${HOME}/.nuget/packages/microsoft.aspnetcore.app.ref"]
assessmentEnvironment = { NUGET_PACKAGES = "${HOME}/.nuget/packages", DOTNET_NOLOGO = "1", DOTNET_SKIP_FIRST_TIME_EXPERIENCE = "1" }
scaffoldCommand = ["dotnet", "new", "console", "-n", "{project}", "-o", "{dir}", "--force"]
packageCommand = ["dotnet", "add", "{dir}", "package", "{package}"]
deliveryCreateCommand = ["dotnet", "new", "console", "--output", "{env}", "--force", "--no-restore"]
deliveryInstallCommand = ["dotnet", "restore", "{requirements}", "--force-evaluate", "--nologo"]
deliveryBuildCommand = ["dotnet", "publish", "{requirements}", "--configuration", "Release", "--output", "{dir}/dist", "--nologo"]
projectFile = "{project}.csproj"
codeExt = [".cs", ".csproj", ".yaml", ".yml", ".json", ".md"]
# MSBuild diagnostic lines: Program.cs(12,5): error CS1002: ; expected [proj.csproj]
diagRegex = '^(?P<file>.+?)\((?P<line>\d+),(?P<col>\d+)\): (?P<sev>error|warning) (?P<code>\w+): (?P<msg>.*?)(?: \[.+\])?$'

# Complete lesson programs carry this explicit marker. The validator builds them inside
# the runtime's disposable dotnet project; fragments remain owned by cumulative project proof.
snippetEntry = '^\s*//\s*Complete runnable example'

# Editor completions (keywords, snippets, dot-members) — served to the client via
# TOME.runtime and rendered by the generic provider in web/editor.js. Ported verbatim
# from the hand-written provider that used to live in editor.js; csharp is now just
# another TOML language.
[completions]
keywords = [
  "public", "private", "static", "void", "int", "string", "bool", "double", "var", "new",
  "return", "if", "else", "for", "foreach", "while", "do", "switch", "case", "break",
  "continue", "class", "record", "enum", "struct", "interface", "namespace", "using",
  "try", "catch", "finally", "throw", "async", "await", "null", "true", "false", "this",
  "readonly", "const", "out", "ref", "in", "is", "as", "get", "set", "init", "when",
  "where", "select", "from",
]
snippets = [
  ["cw", "Console.WriteLine — print a line", "Console.WriteLine($1);$0"],
  ["cr", "Console.ReadLine — read input", "Console.ReadLine()"],
  ["if", "if block", "if ($1)\n{\n\t$0\n}"],
  ["for", "for loop", "for (int ${1:i} = 0; $1 < ${2:count}; $1++)\n{\n\t$0\n}"],
  ["foreach", "foreach loop", "foreach (var ${1:item} in ${2:collection})\n{\n\t$0\n}"],
  ["while", "while loop", "while ($1)\n{\n\t$0\n}"],
  ["switche", "switch expression", "var ${1:result} = ${2:value} switch\n{\n\t${3:pattern} => $4,\n\t_ => $5\n};$0"],
  ["trycatch", "try/catch block", "try\n{\n\t$1\n}\ncatch (${2:Exception} ex)\n{\n\t${3:Console.WriteLine(ex.Message);}\n}$0"],
  ["class", "class declaration", "public class ${1:Name}\n{\n\t$0\n}"],
  ["record", "positional record", "public record ${1:Name}(${2:string Prop});$0"],
  ["enum", "enum declaration", "public enum ${1:Name}\n{\n\t$0\n}"],
  ["prop", "auto property", "public ${1:string} ${2:Name} { get; set; }$0"],
  ["method", "method", "public ${1:void} ${2:Name}($3)\n{\n\t$0\n}"],
  ["asyncm", "async method", "public async Task${1:<string>} ${2:Name}Async($3)\n{\n\t$0\n}"],
  ["list", "new List<T>", "List<${1:string}> ${2:items} = new();$0"],
  ["dict", "new Dictionary", "Dictionary<${1:string}, ${2:int}> ${3:map} = new();$0"],
  ["interp", "interpolated string", '\$"${1:text} {${2:value}}"$0'],
]
# ordered rhs-regex -> member key, for `variable.` completions (first match wins)
types = [
  ['^\$?"', "str"],
  ['ReadLine\(\)', "str"],
  ['^new\s+List', "list"],
  ['^new\s+Dictionary', "dict"],
  ['\.Split\(', "array"],
  ['\.ToArray\(\)', "array"],
  ['\.ToList\(\)', "list"],
]
# ordered declared-type-regex -> member key: `List<string> xs = …` types xs outright
declTypes = [
  ['\[\]$', "array"],
  ["^string$", "str"],
  ["^List<", "list"],
  ["^Dictionary<", "dict"],
  ["^HttpClient$", "HttpClient"],
  ["^StringBuilder$", "StringBuilder"],
  ["^Random$", "Random"],
  ["^CancellationTokenSource$", "CancellationTokenSource"],
  ["^IDocument$", "IDocument"],
  ["^IElement$", "IElement"],
  ["^OllamaApiClient$", "OllamaApiClient"],
]
# user-declared types: enums complete their values, positional records their params,
# classes their public methods/properties; ctorRegex maps `new Verse(` back to the type
enumRegex = '\benum\s+(\w+)\s*\{([^}]*)\}'
recordRegex = '\brecord\s+(\w+)\s*\(([^)]*)\)'
classRegex = '(?:class|record|struct)\s+(\w+)[^{]*\{([\s\S]*?)\n\}'
methodRegex = 'public\s+(?:static\s+)?(?:async\s+)?[\w<>\[\],?\s]+?\s(\w+)\s*\('
propRegex = 'public\s+(?:static\s+)?(?:readonly\s+)?[\w<>\[\],?]+\s+(\w+)\s*\{\s*get'
ctorRegex = 'new\s+(\w+)\s*\('
# instance keys share the LINQ surface; "linq" is also the guess for unknown receivers
memberExtends = { list = "linq", dict = "linq", array = "linq" }
fallback = "linq"
internalKeys = ["str", "list", "dict", "array", "linq"]

