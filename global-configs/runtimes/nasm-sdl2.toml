version = 1
capabilities = ["project", "build", "run", "assessment"]

language = "x86-64 Assembly (NASM syntax)"
entryFile = "src/main.asm"
projectFile = "Makefile"
newFileExt = ".asm"
editorLang = "nasm"
runLabel = "Assemble, link with SDL2, and run"
starterCode = ""
codeExt = [".asm"]

command = ["bash", "-c", 'src="$0"; obj="${src%.asm}.o"; bin="${src%.asm}.bin"; nasm -f elf64 "$src" -o "$obj" && gcc -no-pie "$obj" $(pkg-config --cflags --libs sdl2) -o "$bin" && "$bin"; status=$?; rm -f "$obj" "$bin"; exit $status']
checkCommand = ["nasm", "-f", "elf64", "{file}", "-o", "/dev/null"]
diagRegex = '^(?P<file>[^:]+):(?P<line>\d+): (?P<sev>error|warning): (?P<msg>.*)$'
snippetEntry = '^\s*global\s+main'
diagIgnore = ["not defined", "changed during code generation"]

deliveryCreateCommand = ["mkdir", "-p", "{env}"]
deliveryInstallCommand = ["bash", "-lc", 'test -s "$1" && cp "$1" "$2/REQUIREMENTS.md"', "_", "{requirements}", "{env}"]
deliveryBuildCommand = ["make"]
deliveryTimeout = 120

[completions]
keywords = [
  "section", "global", "extern", "db", "dw", "dd", "dq", "equ", "resb", "resd", "resq",
  "mov", "lea", "add", "sub", "xor", "cmp", "test", "jmp", "je", "jne", "jl", "jle", "jg", "jge", "call", "ret",
  "rax", "rbx", "rcx", "rdx", "rsi", "rdi", "rbp", "rsp", "r8", "r9", "r10", "r11", "r12", "r13", "r14", "r15"
]
snippets = []

[assessmentCommands]
build = ["make"]
test = ["make", "test"]
