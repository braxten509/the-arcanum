# Python — complete engine config. The one generic runtime (runtimes/generic.py)
# executes these commands; nothing python-specific exists in the engine. A tome's
# [runtime] table overrides any key here.
language = "Python"
entryFile = "main.py"
newFileExt = ".py"
editorLang = "python"
runLabel = "python3 main.py"
packages = false
starterCode = "# Your program. Run it to see the output.\nprint(\"hello\")\n"

command = ["python3"]
# syntax check: parse the file without running it; the traceback's last frame carries the error
checkCommand = ["python3", "-c", "import ast,sys; ast.parse(open(sys.argv[1],encoding='utf-8').read(), sys.argv[1])"]
diagRegex = '^  File "[^"]*", line (?P<line>\d+)\n(?:    [^\n]*\n)*?(?P<msg>\w*(?:Error|Warning)\b[^\n]*)$'

# --- lesson-snippet checking (tools/validatelib/depth.py check_snippets) ---
# checkCommand is ast.parse, so this catches syntax only — no undeclared-name noise to ignore.
# Deliberately conservative: lesson bodies also carry shell transcripts in <pre><code>, and a
# broader entry (any unindented first line) drags 24 of them in as SyntaxError false positives.
snippetEntry = '^\s*(?:import |from |def |class |print\()'
diagIgnore = []

# Editor completions (keywords, snippets, dot-members) — served to the client via
# TOME.runtime and rendered by the generic provider in web/editor.js.
[completions]
keywords = [
  "def", "return", "if", "elif", "else", "for", "while", "in", "not", "and", "or", "is",
  "None", "True", "False", "import", "from", "as", "class", "try", "except", "finally",
  "raise", "with", "pass", "break", "continue", "lambda", "global", "del",
  "print", "input", "len", "range", "int", "str", "float", "bool", "list", "dict", "set",
  "tuple", "sum", "min", "max", "abs", "round", "sorted", "reversed", "enumerate", "zip",
  "open", "type", "isinstance",
]
snippets = [
  ["def", "function definition", "def ${1:name}($2):\n\t$0"],
  ["if", "if block", "if $1:\n\t$0"],
  ["ifelse", "if / else", "if $1:\n\t$2\nelse:\n\t$0"],
  ["for", "for loop", "for ${1:item} in ${2:items}:\n\t$0"],
  ["forr", "for over range", "for ${1:i} in range(${2:count}):\n\t$0"],
  ["while", "while loop", "while $1:\n\t$0"],
  ["tryex", "try / except", "try:\n\t$1\nexcept ${2:Exception} as e:\n\t$0"],
  ["class", "class definition", "class ${1:Name}:\n\tdef __init__(self$2):\n\t\t$0"],
  ["ifmain", "entry-point guard", "if __name__ == \"__main__\":\n\t$0"],
  ["inpint", "read an int from input", "int(input($1))$0"],
  ["fstr", "f-string", "f\"${1:text} {${2:value}}\"$0"],
  ["listcomp", "list comprehension", "[${1:x} for $1 in ${2:items}]$0"],
]
# ordered rhs-regex -> member key, for `variable.` completions (first match wins)
types = [
  ["\\.split\\(", "list"],
  ["^(\\[|list\\(|sorted\\()", "list"],
  ["^set\\(", "set"],
  ["^(\\{|dict\\()", "dict"],
  ["^(f?[\"']|str\\(|input\\()", "str"],
]
# user-declared classes: classRegex groups = (name, body); methodRegex runs over the body;
# ctorRegex maps an assignment rhs like `Dog(` back to the class → `d = Dog()` completes d.
classRegex = '^class\s+(\w+)[^\n]*:\n((?:[ \t]+[^\n]*\n?|[ \t]*\n)*)'
methodRegex = 'def\s+(\w+)'
ctorRegex = '^(\w+)\s*\('

