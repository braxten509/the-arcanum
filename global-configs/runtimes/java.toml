# method/field name -> member key: resolves call chains (line.trim().toLowerCase().)
# and assignments whose rhs ends in a call (String[] parts = line.split(",") -> array)
[completions.returns]
out = "printstream"
err = "printstream"
nextLine = "str"
next = "str"
toLowerCase = "str"
toUpperCase = "str"
trim = "str"
substring = "str"
replace = "str"
