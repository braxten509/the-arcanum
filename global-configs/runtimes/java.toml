map = [
  ["put()", "m", "put(key, value)", "put($1, $2)$0"],
  ["get()", "m", "value get(key) — null if missing", "get($1)$0"],
  ["getOrDefault()", "m", "value getOrDefault(key, default)", "getOrDefault($1, $2)$0"],
  ["containsKey()", "m", "boolean containsKey(key)", "containsKey($1)$0"],
  ["remove()", "m", "remove(key)", "remove($1)$0"],
  ["size()", "m", "int — entry count", "size()"],
  ["keySet()", "m", "Set of keys", "keySet()"],
