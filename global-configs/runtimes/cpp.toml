language = "C++"
entryFile = "main.cpp"
newFileExt = ".cpp"
editorLang = "cpp"
command = ["bash", "-c", "g++ '{file}' -o /tmp/prog && /tmp/prog"]
checkCommand = ["g++", "-fsyntax-only", "{file}"]
diagRegex = '^(?P<file>[^:]+):(?P<line>\d+):(?P<col>\d+): (?P<sev>error|warning): (?P<msg>.*)$'

[syntax]
lineComment = "//"
blockComment = ["/*", "*/"]
keywords = ["int", "void", "char", "float", "double", "bool", "if", "else", "for", "while", "return", "class", "struct", "new", "delete", "namespace", "using", "std", "cout", "endl"]
