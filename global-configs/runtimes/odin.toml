# ODIN — engine config for the Odin programming language.
# The zero-code language example from §5 (see tome-authoring/5-runtimes.md).
# A tome's [runtime] table overrides any key here.
language = "Odin"
entryFile = "main.odin"
newFileExt = ".odin"
editorLang = "odin"
command = ["odin", "run", "{file}", "-file"]
checkCommand = ["odin", "check", "{file}", "-file"]
diagRegex = '^(?P<file>[^(\n]+)\((?P<line>\d+):(?P<col>\d+)\) (?:\w+ )?Error: (?P<msg>.*)$'

# --- lesson-snippet checking (tools/validatelib/execute.py check_snippets) ---
# A body code block matching snippetEntry claims to be a whole program and gets built.
# One matching snippetFragment instead is a partial sample: it is compiled inside the
# snippetWrap shell (imports/package lines hoisted above it), and failures are WARNs.
snippetEntry = '^\s*main\s*::\s*proc'
snippetPrelude = "package main\n"
snippetFragment = ':=|::|\bfmt\.'
snippetWrap = "main :: proc() {\n{code}\n}"
snippetHoist = '^\s*(import|package)\b'
snippetFragmentSkip = '\A\s*(?:(?://|/\*)[^\n]*\n\s*)*case\b'  # a case list without its switch
snippetFragmentIgnore = [
  'invalid type',                    # cascade from an undeclared name diagIgnore forgave
  'Ambiguous procedure group call',  # overload resolution on an unknown-typed argument
  'Assignment count mismatch',       # multi-return from a proc the fragment never declared
  "got 'case'",                      # a mid-switch excerpt; its switch header lives in prose
]
diagIgnore = [
  'undeclared name',        # an earlier block in the same lesson declared it
  'not used',               # an excerpt imports more than the excerpt uses
  '^Path does not exist:',  # a sibling package a single-file build cannot see
]
starterCode = '''
package main
import "core:fmt"
main :: proc() { fmt.println("hello") }
'''

[syntax]
lineComment = "//"
blockComment = ["/*", "*/"]
strings = ["\"", "'", "`"]
keywords = [
  "package", "import", "proc", "struct", "enum", "union", "bit_set", "bit_field",
  "if", "else", "for", "switch", "case", "return", "defer", "when", "where",
  "using", "cast", "transmute", "or_return", "or_else", "or_continue",
  "fallthrough", "break", "continue", "foreign", "inline", "no_inline",
  "partial", "distinct", "map", "dynamic", "context",
]
types = [
  "int", "i8", "i16", "i32", "i64", "uint", "u8", "u16", "u32", "u64",
  "f32", "f64", "string", "bool", "rune", "byte", "rawptr", "uintptr",
  "any", "typeid", "true", "false", "nil",
]

# Completions for Odin — IntelliSense for a beginner meeting core:fmt, os, strings, etc.
[completions]
keywords = [
  "package", "import", "proc", "struct", "enum", "union", "bit_set",
  "if", "else", "for", "switch", "case", "return", "defer", "when",
  "where", "using", "cast", "transmute", "or_return", "or_else", "or_continue",
  "fallthrough", "break", "continue", "foreign", "inline", "no_inline",
  "partial", "distinct", "map", "dynamic", "context",
  "main", "fmt", "os", "strings", "strconv", "mem", "sort", "math",
  "int", "i8", "i16", "i32", "i64", "uint", "u8", "u16", "u32", "u64",
  "f32", "f64", "string", "bool", "rune", "byte", "rawptr", "uintptr",
  "any", "typeid", "true", "false", "nil", "len", "cap", "append",
  "make", "new", "delete", "free",
]
snippets = [
  ["proc", "procedure definition", "${1:name} :: proc($2) -> $3 {\n\t$0\n}"],
  ["if", "if block", "if $1 {\n\t$0\n}"],
  ["ifelse", "if / else", "if $1 {\n\t$2\n} else {\n\t$0\n}"],
  ["for", "for loop", "for $1 {\n\t$0\n}"],
  ["fori", "for range", "for ${1:i} in ${2:0}..<${3:n} {\n\t$0\n}"],
  ["forin", "for over slice", "for ${1:item} in ${2:items} {\n\t$0\n}"],
  ["switch", "switch statement", "switch ${1:val} {\ncase ${2:}:\n\t$0\n}"],
  ["struct", "struct definition", "${1:Name} :: struct {\n\t$0\n}"],
  ["enum", "enum definition", "${1:Name} :: enum {\n\t$0\n}"],
  ["proc_type", "procedure type", "${1:Callback} :: proc(${2:}) -> ${3:void}"],
  ["defer", "defer statement", "defer $0"],
  ["main", "entry point", "main :: proc() {\n\t$0\n}"],
  ["import", "import package", "import \"core:${1:fmt}\""],
  ["or_return", "error union with or_return", "${1:result} := ${2:fallible}() or_return"],
]
types = [
  ["^os\\.", "os"],
  ["^strings\\.", "strings"],
  ["^strconv\\.", "strconv"],
  ["^(\\[\\]u?byte|\\[\\]string|?\\[\\])", "slice"],
  ["^\\[\\]", "slice"],
  ["^map\\[", "map"],
]
classRegex = '(\w+)\s*::\s*struct\s*\{((?:[^\}]|\n)*)\}'
methodRegex = '(\w+)\s*::\s*proc\s*\('
ctorRegex = '^(\w+)\s*\('
enumRegex = '(\w+)\s*::\s*enum\s*\{([^}]*)\}'

